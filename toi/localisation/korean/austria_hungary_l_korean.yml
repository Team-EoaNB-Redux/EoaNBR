 AUS_HUN_Galician_Sejm: "갈리치아 의회"
 AUS_HUN_Galician_Sejm_desc: "많은 이들이 이중 군주국 내 합스부르크 왕가의 권한 폐지를 원하지만, 여전히 우리에게 충성스러운 민족들이 남아있습니다. 갈리치아-로도메리아 총독령 내의 폴란드인들은 지금까지 충성을 입증했으며 왕당파의 거점으로 남아있습니다. 이러한 충성은 간과될 수 없으며, 자유주의자들이 그들만의 내각을 구성하고 있으니 우리는 신민들에게 보상하기 위한 조치를 취할 것입니다.\n\n폴란드인들에게는 헝가리인과 유사하게 운영되지만 오스트리아 제국 아래에 남는 갈리치아-로도메리아 왕국을 건설하기 위한 자치권이 부여될 것입니다. '세임(Sejm)'으로 알려진 지역 의회가 설립되어 폴란드 지역의 우려 사항을 접수하고 빈에 전달할 것입니다."
 AUS_HUN_Negotiate_Czech: "체코인들과 협상"
 AUS_HUN_Negotiate_Czech_desc: "체코인들은 요구가 많기로 유명합니다. 그들의 분리주의 집단과 협상을 시도하여 불안을 멈추게 할 수 있을지도 모릅니다."
