 AUS_HUN_December_Constitution: "12월 헌법"
 AUS_HUN_December_Constitution_desc: "제국이 불운한 상황에서 적응을 강요받았다는 것은 공공연한 사실입니다. 그러나 우리는 주어진 것을 가지고 나아가야 하며, 자유주의자들의 요구에 따라 새로운 헌법을 제정하기 시작했습니다. 일부는 이 결정에 반대할 수도 있지만, 프란츠 요제프는 자신의 권력을 제한하거나 급속히 부상하는 자유주의자들의 반발 위험을 감수해야만 합니다.\n\n우리가 어떻게 헌법을 제정하는지는 우리에게 달렸지만, 모든 소수 민족 간의 평등과 어느 정도의 자치 실체 형성을 허용해야 할 것입니다. 또한, 황제 평의회가 프란츠 요제프의 일부 임무를 맡게 되면서 우리 국가의 전제정치는 서서히 폐지될 것입니다."
 AUS_HUN_Bourgeois_Cabinet: "부르주아 내각"
 AUS_HUN_Bourgeois_Cabinet_desc: "많은 자유주의적 개혁이 시행된 12월 헌법의 제정으로, 제국 정부 내 자유주의자들의 인기는 급격히 상승했으며 귀족 내각의 시대는 끝난 듯합니다. 프란츠 요제프는 개혁가들을 지지하지 않지만, 진보를 촉진하고 우리 사회를 발전시키는 것이 최선일 것입니다.\n\n프리드리히 페르디난트 폰 보이스트 백작은 여러 다른 자유주의자, 개혁가, 진보주의자들과 함께 이중 군주국의 상황을 안정시키기 위한 새 내각을 구성할 것입니다."
 AUS_HUN_Abrogate_Concordat: "정교 조약 폐기"
 AUS_HUN_Abrogate_Concordat_desc: "1855년 정교 조약은 시행 당시 비교적 인기가 있었으며, 가톨릭 교회와의 화해를 표명하고 교회가 결혼, 검열, 교육에 대한 권한을 휘두르게 했습니다. 이는 성직자와 절대주의자들의 이익에는 부합했을지 모르나, 제국의 일반 시민들에게는 전혀 그렇지 않았습니다.\n\n이중 군주국이 서서히 개혁주의적으로 변함에 따라, 우리는 정교 조약 문제에 직면했습니다. 일부 법률은 12월 헌법에 통합될 수 있지만, 조약이라는 개념 자체는 폐지될 것입니다. 이는 또한 궁극적으로 세속적 교육의 도입과 시민 결혼의 복원을 의미합니다."
 AUS_HUN_Compulsary_Education: "치스라이타니아의 의무 교육"
 AUS_HUN_Compulsary_Education_desc: ""
 AUS_HUN_Electoral_Reform_1: "치스라이타니아의 선거 개혁"
 AUS_HUN_Electoral_Reform_1_desc: "12월 헌법이 비준되고 제국 내각의 권한이 강화되면서, 오랫동안 논의되어 온 주제인 선거가 우리 시야에 들어왔습니다. 우리는 선거가 낯설지는 않지만, 보통 귀족, 제국 의회, 황제 사이에서만 이루어졌습니다. 민주주의는 이중 군주국에게 낯선 개념이며, 아직 하층민에게 권한을 부여하지는 않겠지만, 우리는 오스트리아 왕령국인 치스라이타니아의 선거 제도를 개혁하기 시작할 것입니다.\n\n귀족원은 헝가리 군주국인 성 이슈트반 왕관의 땅까지 확장되었지만, 오스트리아의 높아지는 자유화는 더 공정한 선거 제도를 요구했습니다. 아우슬라이히 타협에서 약속된 대로 부르주아, 즉 중산층은 치스라이타니아에서 시행되는 선거에 참여할 수 있게 될 것입니다. 당분간 오스트리아 측은 제한적 민주주의라는 개념을 실험할 것입니다."
