 AUS_HUN_United_Economy: "오스트리아-헝가리 경제"
 AUS_HUN_United_Economy_desc: "약 100년 전 오스트리아 경제는 게르만 권역에서 가장 지배적이었습니다. 비록 오스트리아-사르데냐 전쟁과 제2차 슐레스비히 전쟁 사이에 잠시 경제가 성장했지만, 열등한 북독일인들에게 당한 우리의 처참한 패배는 군사뿐만 아니라 경제에도 끔찍한 상흔을 남겼습니다.\n\n독일 연방을 잃은 손실로부터 회복하기 위해 우리는 국가를 빠르게 현대화하고 산업화해야 할 것입니다. 오스트리아-헝가리 경제는 현재 분권화된 화약고와 같으며, 합스부르크 가문을 파멸시키고 싶지 않다면 가까운 미래에 시스템을 개혁해야 할 것입니다."
 AUS_HUN_Expand_Schooling_System: "학제 확장"
 AUS_HUN_Found_New_Universities: "새로운 대학 설립"
 AUS_HUN_New_School_Of_Economics: "새로운 경제학파"
 AUS_HUN_Found_AustroHungarian_Bank: "오스트리아-헝가리 은행 설립"
 AUS_HUN_Austrian_Capitalism: "오스트리아 자본주의"
 AUS_HUN_Rapid_Industrialisation: "급속한 산업화"
 AUS_HUN_Rapid_Industrialisation_desc: "오스트리아-헝가리는 현재 무역과 농업을 통해 안정적이지만 볼품없는 성장을 보이고 있지만, 이는 계속될 수 없습니다. 아메리카, 영국, 프랑스와 같은 거대 국가들은 모두 산업화를 통해 상당한 규모의 경제를 달성했습니다. 제국의 오스트리아 측 절반은 프라하와 빈에 일부 제조업체가 들어섰지만, 우리는 산업화 프로젝트를 갈리치아, 일리리아, 헝가리로 확장해야 할 것입니다. 인간의 몸처럼 모든 기관은 생존을 위해 조화롭게 움직여야 하므로, 우리 모두는 이 과정에서 서로를 도와야 합니다.\n\n우리는 막대한 국고를 사용하여 독일과 헝가리 기업들을 지원하고, 주요 도시 중심지에 국가 주도의 공장 건설을 시작하여 도시화를 촉진할 것입니다. 이는 결국 우리를 다른 산업 강국들과 겨루게 할 것입니다."
