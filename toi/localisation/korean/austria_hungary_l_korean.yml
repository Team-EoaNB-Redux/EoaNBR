 AUS_HUN_Albrecht_conservative_army: "알브레히트 대공의 보수적 군대"
 AUS_HUN_Albrecht_conservative_army_desc: "테셴 공작이자 황제의 사촌인 알브레히트 대공은 확고한 보수주의자로, 프로이센식 군대 개혁을 시행하려 합니다. 그는 훈련되고 상명하달식의 중앙집권적 위계질서의 열렬한 신봉자이지만, 기술과 혁신에 대해서는 매우 회의적입니다. 그의 다른 계획으로는 훈련 강화와 왕실 및 황제에 대한 충성심을 강화하는 것이 있습니다."
 AUS_HUN_Responsibility_in_war: "전쟁 책임에 대한 연구"
 AUS_HUN_Responsibility_in_war_desc: "알브레히트의 보수적 견해에 따라, 우리는 전쟁에서 장교와 병사들의 책임을 강화해야 합니다. 나폴레옹 전쟁의 참혹한 사건들이 다시는 일어나지 않도록 해야 합니다. 명확하게 정의된 위계질서와 합리적으로 할당된 임무는 우리 사단을 쓸데없는 사기나 조직력 손실 없이 적의 공격을 견딜 수 있는 결집력 있는 부대로 만들 것입니다."
 AUS_HUN_Functional_army: "기능적인 군대"
 AUS_HUN_Functional_army_desc: "관료주의도 중요하지만, 군대의 원활한 작전을 방해해서는 안 됩니다. 우리는 전장에서의 만약의 사태에 대비할 수 있을 만큼 유연성을 유지하면서 사단을 역동적으로 훈련, 조율, 조직할 수 있어야 합니다. 우리가 복잡한 문제에 얽매여 있을 때 적들은 기다려주지 않을 것이므로, 그러한 일이 발생하지 않도록 예방해야 합니다. 효율적인 군대가 곧 유능한 군대입니다."
 AUS_HUN_Napoleon_thoughts: "나폴레옹적 사상 채택"
 AUS_HUN_Napoleon_thoughts_desc: "나폴레옹 전쟁의 핵심은 군대의 통합, 전문화, 그리고 유연성이었습니다. 분산되고 무질서한 개인들의 집단 대신, 우리는 모든 요소를 단일하고 결속력 있는 전체로 결합해야 합니다. 우리 사단은 사기나 질서를 잃지 않고 빠르고 조직적으로 변화에 대응할 수 있어야 합니다. 새로운 전술 도입과 결합된 이 개혁은 잠들어 있던 군대를 일깨울 것입니다."
 AUS_HUN_Modern_Ancient_Uniforms: "군대를 위한 현대식 또는 고대식 군복"
 AUS_HUN_Modern_Ancient_Uniforms_desc: "새로운 군대 개혁의 상징으로서, 우리는 또한 새롭고 현대적인 군복을 도입해야 합니다. 재질, 편안함, 유연성 면에서 혁신적이면서도 디자인 자체는 전통에 충실하게 제국 상징주의가 남아 있어 군주제에 대한 우리의 헌신을 반영합니다. 이 통일된 외관으로 우리 사단은 더 높은 결속력과 조직력을 가지고 싸울 수 있을 것입니다."
 AUS_HUN_Uniforms_pride: "군복은 우리의 자부심"
 AUS_HUN_Uniforms_pride_desc: "새로운 군복의 예상치 못했지만 환영할 만한 부산물로서, 우리 병사들은 제국의 수호자로서의 역할에 대한 자부심이 커진 채로 싸웁니다. 우리 병사들 사이의 동지애 덕분에 사단의 결속력은 높습니다. 새로운 군복은 우리의 전통과 역사를 잇는 끈 역할을 할 뿐만 아니라 매우 인기가 많습니다."
 AUS_HUN_Artillery_status: "포병의 현황"
 AUS_HUN_Artillery_status_desc: "우리 포병은 다양한 문제에 시달리고 있습니다. 물류 문제와 기동성 부족부터 기술적 낙후와 미숙련된 포병들까지, 상황을 그저 형편없다고 묘사하는 것은 절제된 표현일 것입니다. 따라서 우리는 전장에서 우리의 힘을 회복하고 대륙의 다른 강대국들과 보조를 맞추기 위해 포괄적인 개혁을 도입해야 합니다."
 AUS_HUN_Haubitz_research: "곡사포 연구 자금 지원"
 AUS_HUN_Haubitz_research_desc: "우리는 곡사포 연구를 더욱 발전시킬 것입니다. 곡사포는 더 넓은 사거리와 뛰어난 다재다능함으로 엄호 사격을 제공할 수 있는 다용도 포병입니다. 이 새로운 부대는 새로운 장비를 운용하는 포병들의 전문적인 훈련과 함께 각 사단에 철저히 통합될 것입니다."
 AUS_HUN_Artillerie_Division: "기마포병사단 편성"
 AUS_HUN_Artillerie_Division_desc: "우리 제국의 군사 전문가들은 '기마포병사단'이라는 혁신적인 신규 사단을 고안했습니다. 포병과 기병의 조합인 이 부대는 강력한 화력과 높은 기동성을 동시에 추구합니다. 일반 기병 부대만큼 빠르며 말로 견인되는 포대는 여전히 결정적인 힘을 제공하면서 측면과 보조를 맞출 수 있습니다."
 AUS_HUN_Napoleonic_legacy: "나폴레옹의 유산"
 AUS_HUN_Napoleonic_legacy_desc: "비록 오스트리아가 나폴레옹의 손에 일련의 치명적인 패배를 겪었지만, 그렇다고 해서 우리가 그에게서 배울 수 없다는 뜻은 아닙니다. 특히 지원 역할만이 아닌 독립적인 군대의 일부로서의 포병 운용은 모방해야 할 부분입니다. 포병의 공격적인 사용은 우리 군대에게 상당한 돌파 능력을 제공하는 동시에 필수적인 엄호 사격을 제공할 것입니다. 미래로 나아가기 위해 과거로부터 배웁시다."
 AUS_HUN_mass_artillery: "대량 포병"
 AUS_HUN_mass_artillery_desc: "분산된 위치를 고수하기보다, 더 집중적이고 많은 포병의 사용을 도입합시다. 이렇게 모인 화력은 특정 적의 위치와 요새를 파괴하는 데 사용될 것이며, 통일된 방식으로 목표를 변경할 수도 있습니다. 대규모 전쟁에서 변화하는 흐름에 따라 포병도 적응해야 하며, 이 개혁은 그것을 목표로 합니다."
 AUS_HUN_Fieldcannon_Experts: "야포 전문가"
 AUS_HUN_Fieldcannon_Experts_desc: "포병 혁신에 대한 마지막 기여로서, 알브레히트는 야포 전문가의 중요성을 높이고자 합니다. 새로운 모델을 시험하고, 사단에 조언하며, 병사들을 교육하는 임무를 맡은 이들은 전장에서 우위를 점하게 해줄 전술 혁신에 기여할 것입니다. 이 전문가들은 알브레히트 자신에게 보고서와 제안을 가져와 군대 전반의 발전을 촉진할 것입니다."
 AUH_idea_Global_Trade_1873: "해외로부터의 저렴한 상품"
 AUH_idea_Trust_Markets_1873: "높은 사업 용이성"
 AUS_idea_Prince_Rudolf_reform: "루돌프 황태자의 개혁"
 AUS_idea_albrechts_conservative_army: "알브레히트의 보수적 군대"
