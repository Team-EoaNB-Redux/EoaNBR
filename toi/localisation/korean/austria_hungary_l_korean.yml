l_english:
 AUS_Compromise_Achieved: "타협 달성"
 AUS_Compromise_Achieved_desc: "상황을 원활히 처리한 덕분에 프란츠 요제프는 이미 지칠 대로 지친 제국에 더 이상의 불안이 만연하는 것을 막을 수 있었습니다. 그러나 이 어려운 시기에 타협이 이루어졌고, 좋든 나쁘든 헝가리는 오스트리아와 동등한 지위를 얻게 되었으며 프란츠 요제프는 이제 각각 오스트리아의 황제이자 헝가리의 국왕으로 군림합니다.\n\n이중 군주국 내의 반응은 엇갈리지만, 한 가지는 확실합니다: 오스트리아, 헝가리, 그리고 그들의 충성스러운 신민들은 이 어려운 시기에 함께 전진할 것입니다."
