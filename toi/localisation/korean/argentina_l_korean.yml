 ARG_government_federales: "연방파 정부"
 ARG_government_federales_desc: "정부는 세상의 모든 민족 국가의 핵심입니다. 우리 정부는 자치 주들로 구성된 연방입니다. 우리는 위대한 연방파의 이끌림 아래 주지사/대통령이 우리의 지도자입니다. 대부분의 의견에도 불구하고, 우리 정부는 강력하며 남아메리카에서 강력한 세력입니다! 아르헨티나 만세!"
 BUE_found_rail_project: "철도 프로젝트 착수"
 BUE_call_up_more_men: "더 많은 병력 소집"
 BUE_provinical_rail_lines: "지방 철도 노선"
 BUE_modern_tatics: "현대 전술"
 ARG_true_constitution: "진정한 헌법"
 ARG_the_rule_of_law: "법치주의"
 ARG_establishment_of_supreme_court: "대법원 설립"
 ARG_establishment_of_supreme_court_desc: "모든 현대 국가는 국가에 대한 가장 중요한 결정을 내리기 위해 자체 대법원을 가지고 있습니다. 하지만 우리는 없습니다! 다행히도, 우리는 미국 대법원으로부터 영감을 받아 우리 법원을 구성할 수 있습니다."
 ARG_decentralised_state: "분권화된 국가"
 ARG_decentralised_state_desc: "우리 헌법은 우리 국가를 국가 원수가 없는 연맹으로 정의하며, 각 주는 국가 전체의 큰 그림에서 자체적인 자치권과 역할을 가집니다. 우리는 국민을 달래기 위해 헌법을 따라야 합니다."
 ARG_develop_entre_ros: "엔트레리오스 개발"
 ARG_develop_entre_ros_desc: "엔트레리오스는 우리 수도가 위치한 지역입니다. 그럼에도 불구하고, 이곳은 대부분 미개발 상태이며, 상당한 규모의 산업 중심지도 없고, 원시적인 농업과 인프라도 없습니다. 우리는 이 중요한 지역의 높은 잠재력을 활용하고 개발해야 합니다!"
 ARG_promotion_of_education: "교육 장려"
 ARG_founding_new_schools: "신규 학교 설립"
 ARG_founding_new_schools_desc: "우리 인구의 대부분은 교육을 받지 못하고 글을 모릅니다. 이러한 인구는 대부분 시골 지역에 있지만, 주요 도시에도 같은 문제를 가진 사람들이 많습니다. 우리는 기초 및 고등 교육을 위한 학교를 짓는 데 자금을 투자하여 이 매우 문제적인 상황을 해결할 것입니다."
 ARG_university_of_cordoba: "코르도바 대학교"
 ARG_working_with_local_groups: "지역 단체와 협력"
 ARG_tie_military_together: "군대 통합"
 ARG_military_innovations: "군사 혁신"
 ARG_found_rail_project: "철도 프로젝트 착수"
 ARG_found_rail_project_desc: "우리 도시들은 현재 대부분 단절되어 있으며, 낡고 부서진 도로를 통해서만 미미하게 연결되어 있습니다. 유럽 국가들과 미국을 본받아, 우리는 국민들을 더 잘 연결하기 위한 효율적인 철도 시스템을 구축하는 데 시간, 인력, 자원을 투입할 것입니다."
 ARG_cordoba_section: "코르도바 구간"
 ARG_cordoba_section_desc: "철도 프로젝트의 일환으로, 우리는 코르도바 지역의 철도를 건설하고 확장할 것입니다. 코르도바는 다양한 농산물이 풍부하며, 더 중요한 것은 우리나라에서 가장 큰 교육 중심지인 국립 코르도바 대학교가 그곳에 위치해 있다는 것입니다. 이 모든 사실은 우리가 이 중요한 지역을 우리 연맹의 나머지 지역과 연결해야 함을 의미합니다."
 ARG_mendoza_section: "멘도사 구간"
 ARG_mendoza_section_desc: "철도 프로젝트의 일환으로, 우리는 멘도사 지역의 철도를 건설하고 확장할 것입니다. 멘도사는 남아메리카에서 가장 큰 와인 생산지이자 대규모 올리브 오일 생산지입니다. 따라서 수출품이 주 밖으로 더 효율적으로 운송될 수 있도록 철도와 역을 개발해야 합니다."
