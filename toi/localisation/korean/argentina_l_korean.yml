 ARG_vic_1866_constitutional_reforms_desc: "1853년 헌법은 좋지만 완벽해지기 위해 몇 가지 개정이 필요합니다. 특히, 이러한 개혁은 경제 및 국제 무역과 관련이 있습니다. 우리는 수출입 세금을 무기한으로 국고에 귀속시키는 작은 개혁을 단행할 것입니다."
