 afr_colonial_company_tooltip: "\n§gSignificant Contract Clauses:§!\n  §g1)§! 해당 회사의 §YHost Nation§!은(는) 회사의 모국에 연락하여 식민주의와 관련된 §YIndustrialization Decisions§!를 위한 §Grequest aid§!를 요청할 수 있습니다.\n  §g2)§! 이 계약은 §YColonial Nation§!에게 §YMilitary Access§!와 §YDocking Rights§!를 허용합니다. 이 접근 권한을 취소하면 모든 식민지 프로젝트가 §Rterminate§!됩니다.\n"
 afr_colonial_weapons_contract_tooltip: "우리 §gCompany Partner§!에게 §YFlintlock Rifles§! 생산을 위한 무료 라이센스를 요청하십시오. §YWeapons§!의 유통이 우리 지역을 §Rdestabilize§!할 수 있다는 것은 의심의 여지가 없습니다.\n"
 afr_colonial_weapons_contract_master_sends_weapons_tooltip: "그들에게 §Y5§!년짜리 §CWeapon Contract§!를 제공하여 §YFlintlock Rifles§!의 생산권을 부여하십시오. 추가적으로 그들을 생산할 외곽의 §YArms Factory§!도 제공합니다.\n\n §gIntroducing weapons should§! §RDestabilize§! §gthe region, causing wars and instability. Our company could step in during the chaos and§! §CCommence a Corporate Coup§! §gwith the people's support.\n§!"
 afr_colonial_weapons_contract_master_sends_weapons_tooltip: "그들에게 §Y5§!년짜리 §CWeapon Contract§!를 제공하여 §YFlintlock Rifles§!의 생산권을 부여하십시오. 추가적으로 그들을 생산할 외곽의 §YArms Factory§!도 제공합니다.\n\n §gIntroducing weapons should§! §RDestabilize§! §gthe region, causing wars and instability. Our company could step in during the chaos and§! §CCommence a Corporate Coup§! §gwith the people's support.\n§!"
