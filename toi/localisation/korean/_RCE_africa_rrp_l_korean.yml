 afr_rrp_an_african_inspired_industrialization_partner_decision: "[FROM.GetAdjective] 동반 관계 요청"
 afr_rrp_an_african_inspired_industrialization_partner_decision_desc: "[FROM.GetName]에게 우리의 산업화를 감독해 달라고 요청할 것입니다. 그들이 수락하면, 우리는 산업화를 시작할 것입니다."
 afr_inspired_industrialization_in_close_proximity: "§Y[ROOT.GetName]§!, §YSubject§!, 또는 §YFaction Member§!이(가) §Y[FROM.GetName]§!과(와) 가까이 있습니다!"
 afr_rrp_an_african_inspired_industrialization_partner_response_flag: "§YPartner Response§!을 기다리고 있지 않습니다!"

 afr_an_african_industrializing_effect_tooltip: "\n이제 §YAfrican Industrialization§!가 §G is now possible.§!"

 afr_rrp_an_african_inspired_industrialization_partner_event.1.t: "[FROM.GetName]이(가) 산업화 지원을 요청합니다"
 afr_rrp_an_african_inspired_industrialization_partner_event.1.d: "[FROM.GetName]은(는) 서구 열강과의 모든 관계를 끊기로 결정하여 기술적으로 쇠퇴했습니다. 그들은 우리의 산업화를 알아채고 관대한 선물을 가지고 우리에게 연락했습니다. 그들은 우리 나라가 [FROM.GetName]의 산업화를 감독해 달라고 요청하고 있습니다. 우리가 이 조건에 동의할까요?"
 afr_rrp_an_african_inspired_industrialization_partner_event.1.a: "우리는 [FROM.GetName]을(를) 절대 돕지 않을 것입니다!"
 afr_rrp_an_african_inspired_industrialization_partner_event.1.b: "[FROM.GetName]에게 우리의 산업화를 감독할 수 있다고 말하십시오."

 afr_rrp_an_african_inspired_industrialization_partner_event.2.t: "[FROM.GetName]이(가) 우리의 지원을 거부합니다"
 afr_rrp_an_african_inspired_industrialization_partner_event.2.d: "[FROM.GetName]은(는) 우리의 산업화를 돕기를 거부했으며, 우리는 다른 나라에 요청해야 할 것입니다."
 afr_rrp_an_african_inspired_industrialization_partner_event.2.a: "다른 사람에게 요청해야 할 것입니다."

 afr_rrp_an_african_inspired_industrialization_partner_event.3.t: "[FROM.GetName]이(가) 우리의 지원에 동의합니다"
 afr_rrp_an_african_inspired_industrialization_partner_event.3.d: "이제 우리 나라는 산업화에 필요한 숙련된 노동력을 갖추었지만, 한 가지 질문이 남아있습니다. 우리는 외부와의 최소한의 무역을 허용해야 할까요?"
 afr_rrp_an_african_inspired_industrialization_partner_event.3.a: "우리는 외부의 영향을 받지 않을 것입니다!"
 afr_rrp_an_african_inspired_industrialization_partner_event.3.b: "외부와 일부 무역을 개방하십시오."
 
 
