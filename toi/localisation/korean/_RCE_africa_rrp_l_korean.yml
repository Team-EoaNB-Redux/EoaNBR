 afr_rrp_foreign_diplomacy_desc: "§YDetrimental Impact:§!\n§WIf this gague increases it will lead to§! §RControversial Events§! §Wwith the§! §YNatives§!.\n\n§YColonial Company Partnership:§!\n§WWhile the Colonial Company does not have direct control over us, they exert influnce over our nation and contribute towards§! §RDetrimental Impact§!. \n\n§YImpact of Colonialism:§!\n§gIn a world often defined by strength and power, there are often cases where entire populations may be subject to marginalization, discrimination, or outright persecution. 'Racial Supremacy', 'Civilizing of Peoples,' and ostracization of disadvantaged groups will may often reap short-term gains that secure a region's stability and prosperity for those in charge. However, while actions last days, memories last generations. and §YDetrimental Impact§! may lead to future unrest and other unintended consequences for years to come.§!"
