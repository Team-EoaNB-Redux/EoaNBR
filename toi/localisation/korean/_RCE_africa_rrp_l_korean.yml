 afr_rrp_small_scale_railway_finished.1.t: "소규모 철도 건설 완료!"
 afr_rrp_small_scale_railway_finished.1.d: "우리 수도인 [Root.Capital.GetName]에서 마을 사람들은 새로 공개된 증기 기관차에 호기심을 보였습니다. 엔진에 불이 붙자 엄청난 증기가 뿜어져 나왔고, 기적 소리가 기차역에 울려 퍼졌습니다. 구경꾼들은 겁에 질렸지만, 증기 기관차가 움직이기 시작하자 군중은 환호하기 시작했습니다. [Root.GetLeader]은(는) 이것이 [ROOT.GetName]의 §YIndustrial Era§!에 새로운 시작의 끝을 알린다고 선포했습니다!"
 afr_rrp_small_scale_railway_finished.1.a: "우리의 미래는 밝아 보입니다!"

