l_english:
 ASA_house_mcclellan: "맥클렐런 가문"
 ASA_What_We_Have_Left: "남은 것"
 ASA_What_We_Have_Left_desc: "우리는 수적으로 열세이고, 무기가 부족하며, 인력이 모자라고, 포위되어 있습니다. 영토를 되찾으려는 어떤 시도도 끔찍한 패배로 이어질 뿐입니다. 우리가 겨우 지켜낸 것을 통합하는 것이 더 낫습니다."
 ASA_Find_Friends: "친구 찾기"
 ASA_Find_Friends_desc: "우리가 이웃 국가들에게 적대적으로 대하면 오래 살아남지 못할 것입니다. 우리의 주권을 유지하려면 화해하고 심지어 몇몇 국가들과 친구가 되어야 합니다."
 ASA_Our_Place_On_The_Continent: "대륙에서의 우리의 위치"
 ASA_Our_Place_On_The_Continent_desc: "한때 영광스러웠던 미국은 무너졌습니다. 우리는 남은 얼마 안 되는 것을 관리해야 합니다. 이제 남은 질문은...다음에 무엇을 할 것인가입니다."
 ASA_Focus_On_Our_Own_Matters: "우리의 문제에 집중"
 ASA_Focus_On_Our_Own_Matters_desc: "우리는 아직 어떤 야망을 가질 위치에 있지 않습니다. 우리는 고립하여 무언가를 시도하기 전에 스스로를 재건해야 합니다."
 ASA_Close_Our_Borders: "국경 폐쇄"
 ASA_Close_Our_Borders_desc: "우리는 현재 인구를 효과적으로 부양할 수 있을지도 불확실하며, 이민자들을 부양할 여력은 더욱 없습니다. 우리는 우리 국민의 무게에 짓눌려 무너지기 전에 국경을 폐쇄해야 합니다."
 ASA_National_Security_Act: "국가 안보법"
 ASA_National_Security_Act_desc: "우리는 대서양 산업을 구축하는 동안 우리 시민의 안전과 우리의 계획에 대한 기밀을 보장해야 합니다."
 ASA_Strict_Isolation: "엄격한 고립"
 ASA_Strict_Isolation_desc: "우리의 재건을 방해받지 않기 위해 세계에 대한 우리 경제를 폐쇄하는 것은 또 다른 필수적인 단계입니다."
 ASA_The_American_Stage: "미국의 무대"
 ASA_The_American_Stage_desc: "우리는 한때 위대한 대륙의 강국이었지만, 여전히 영향력을 행사할 수 있습니다. 외교를 통해, 우리는 아메리카 대서양 연합의 유산을 구축할 것입니다!"
 ASA_A_Nation_Of_Immigrants: "이민자의 나라"
 ASA_A_Nation_Of_Immigrants_desc: "우리는 이민자의 나라이며 그 지위를 유지해야 합니다. 국경을 폐쇄하는 것은 미래에 우리에게 해만 될 것입니다."
 ASA_Atlantic_States_Volunteer_Corps: "대서양 연합 자원 봉사단"
 ASA_Atlantic_States_Volunteer_Corps_desc: "대륙의 더 강력한 실체들과 좋은 관계를 유지하기 위해, 다른 아메리카 국가들의 노력에 도움을 주기 위해 자원 봉사 원정대를 보내 그들과 좋은 관계를 맺을 수 있습니다."
 ASA_Free_Trade_Agreements: "자유 무역 협정"
 ASA_Free_Trade_Agreements_desc: "대륙의 나머지 지역과 무역을 시작하지 않는 것은 어리석은 일입니다. 아메리카는 자원이 풍부하며, 우리가 그것을 얻으려 노력하지 않으면 뒤처질 것입니다."
 ASA_Bolster_DC_Defenses: "워싱턴 D.C. 방어력 강화"
 ASA_Bolster_DC_Defenses_desc: "사방에서 공격을 받는다면, 우리는 워싱턴 D.C.로 밀려날 가능성이 높습니다. 우리는 선제적으로 도시에 새로운 방어 시설을 건설하여 그러한 사건에 대비해야 합니다."
 ASA_Fortress_Atlantis: "요새 아틀란티스"
 ASA_Fortress_Atlantis_desc: "우리 최고 장군들은 D.C.를 둘러싼 자연 지형을 이용한 방어선을 식별했습니다. 우리는 가능한 침공에 대비하여 이 방어선을 준비해야 합니다."
 ASA_Seize_What_We_Can: "우리가 할 수 있는 것을 장악"
 ASA_Seize_What_We_Can_desc: "우리가 옛 영토를 모두 되찾을 수는 없겠지만, 이웃들이 준비되지 않은 동안 일부 국경 지역을 탈환할 수는 있습니다."
 ASA_Train_Reserves: "예비군 훈련"
 ASA_Train_Reserves_desc: "서둘러 예비군을 훈련합시다! 적들이 대응할 수 있기 전에 일부 국경 영토를 점령할 기회가 아직 남아 있습니다!"
 ASA_Reunite_With_West_Virginia: "찰스턴 공세"
 ASA_Reunite_With_West_Virginia_desc: "남서쪽의 [WVG.GetAdjective]들은 혼자이며 동맹이 없지만 그들이 가진 독립에 완강히 집착하고 있습니다. 우리는 이 기회를 이용하여 진격하고 그 주를 우리에게 합병해야 합니다."
 ASA_Ohio_Referendum: "오하이오 국민 투표"
 ASA_Ohio_Referendum_desc: "오하이오는 우리와 [GRL.GetNameDef] 사이에 논쟁이 있는 주입니다. 우리는 [GRL.GetAdjective] 정부에 오하이오가 그들을 떠나 우리와 합류할지 여부를 선택할 수 있도록 허락해달라고 요청해야 합니다. 그것이 유일한 민주적인 행동입니다."
 ASA_Connecticut_Referendum: "코네티컷 국민 투표"
 ASA_Connecticut_Referendum_desc: "코네티컷은 우리와 [NEG.GetNameDef] 사이에 논쟁이 있는 주입니다. 우리는 [NEG.GetAdjective] 정부에 코네티컷이 그들을 떠나 우리와 합류할지 여부를 선택할 수 있도록 허락해달라고 요청해야 합니다. 그것이 유일한 민주적인 행동입니다."
 ASA_Reunite_With_Kentucky: "켄터키와 재통일"
 ASA_Reunite_With_Kentucky_desc: "남서쪽의 켄터키인들은 혼자이며 동맹이 없습니다. 우리는 카나와 점령에서 교훈을 얻어 우리와 켄터키 주민 모두에게 이익이 될 평화로운 통일을 제안해야 합니다."
 ASA_Construct_Border_Defenses: "국경 방어 시설 건설"
 ASA_Construct_Border_Defenses_desc: "이제 옛 영토를 일부 차지했으니, 보복에 대비하여 신속하게 방어 시설을 구축해야 합니다."
 ASA_Regroup_And_Rearm: "재정비 및 재무장"
 ASA_Regroup_And_Rearm_desc: "우리는 꽤 많은 옛 영토를 성공적으로 차지했습니다. 그러나 우리는 힘이 부족해지고 있습니다. 속도를 늦추고 우리가 가진 것을 점검해야 합니다."
 ASA_Loot_Captured_Armories: "노획한 무기고 약탈"
 ASA_Loot_Captured_Armories_desc: "우리는 적들의 많은 요새와 무기고를 점령했습니다. 그러나 우리 군대가 속도에 집중했기 때문에 해당 무기고를 제대로 약탈할 수 없었습니다. 이제 속도를 늦추고 재편성하기로 결정했으니, 그들의 무기를 제대로 압수할 시간이 생겼습니다."
 ASA_New_Weapons: "새로운 무기"
 ASA_New_Weapons_desc: "우리가 압수한 무기 중 일부는 우리와 다른 종류입니다. 우리는 이 무기의 구조를 연구하여 새롭고 더 나은 장비를 만들어야 합니다."
 ASA_Prepare_To_Claim_The_Mantle_Of_States: "국가들의 왕관을 차지할 준비"
 ASA_Prepare_To_Claim_The_Mantle_Of_States_desc: "우리는 미국의 합법적인 통치자입니다. 이 모든 분리주의자들은 조심해야 할 것입니다. 우리가 그들을 찾아갈 것입니다."
 ASA_The_True_Successors: "진정한 후계자들"
 ASA_The_True_Successors_desc: "이제 우리는 대륙에서의 우리의 입장을 분명히 했습니다. 대중의 지지를 얻기 위해 국민 앞에서 연설을 해야 합니다."
 ASA_We_Didnt_Hear_No_Bell: "우리는 종소리를 듣지 못했다."
 ASA_We_Didnt_Hear_No_Bell_desc: "분리주의자들이 우리를 한 단계 끌어내렸을지 모르지만, 우리는 아직 쓰러지지 않았습니다. 국민적 지지를 결집합시다! 아직 되찾아야 할 땅이 남아 있습니다!"
 ASA_Solidify_Control_Over_New_Territories: "새 영토에 대한 통제 강화"
 ASA_Solidify_Control_Over_New_Territories_desc: "이제 옛 영토 중 일부에 대한 통제를 확고히 했으니, 그들을 연방에 완전히 통합하기 위해 노력해야 합니다."
 ASA_Foreign_Aid: "해외 원조"
 ASA_Foreign_Aid_desc: "우리는 많은 위신과 자원을 잃었고, 우리의 야망을 혼자서 달성할 위치에 있지 않습니다. 외부의 도움이 필요합니다."
 ASA_Atlantic_States_Diplomatic_Corps: "대서양 연합 외교단"
 ASA_Atlantic_States_Diplomatic_Corps_desc: "평판이 좋은 외교관들로 구성된 공식 외교단을 구성하면 외부 세력과 우호적인 관계를 수립하는 데 도움이 될 것입니다."
 ASA_Atlantic_States_Department_Of_State: "대서양 연합 국무부"
 ASA_Atlantic_States_Department_Of_State_desc: "외교단은 대서양 연합 국무부로 알려진 적절한 정부 기관으로 조직되어야 합니다."
 ASA_British_Preference: "영국 우대"
 ASA_British_Preference_desc: "영국 제국은 현재 지구상에서 가장 강력하고 영향력 있는 국가입니다. 그들의 왕립 해군은 끊임없이 바다를 지키고 있으며, 광대한 식민지 제국에 의해 그들의 세계적 지배력은 더욱 공고해졌습니다. 그들과 동맹을 맺는 것이 가장 현명한 행동입니다."
 ASA_Prussian_Preference: "프로이센 우대"
 ASA_Prussian_Preference_desc: "프로이센은 인상적인 군사력으로 여러 방면에서 공격을 방어할 수 있었습니다. 아마도 프로이센과 좋은 관계를 맺는 것에 집중하면 그들이 우리에게 그들의 방식을 가르쳐주도록 설득할 수 있을 것입니다."
 ASA_French_Preference: "프랑스 우대"
 ASA_French_Preference_desc: "나폴레옹 3세는 전반적으로 불리한 상황에서도 프랑스를 산업화할 수 있었습니다. 아마도 그들과 동맹을 맺으면 그들이 우리가 산업화하는 데도 도움을 주도록 설득할 수 있을 것입니다."
 ASA_Russian_Preference: "러시아 우대"
 ASA_Russian_Preference_desc: "러시아는 거대한 초국가적 제국입니다. 그들과 동맹을 맺는 것은 우리의 안전을 본질적으로 확보하는 것입니다. 결국, 러시아와 같은 거대한 제국이 어떻게 전쟁에서 고전할 수 있겠습니까?"
 ASA_Rebuild_The_Military: "군대 재건"
 ASA_Rebuild_The_Military_desc: "우리 군대는 이제 옛 모습의 그림자에 불과합니다. 우리가 군대를 재건하지 않으면, 우리는 앉아있는 오리가 될 것입니다."
 ASA_Rebuild_The_Army: "육군 재건"
 ASA_Rebuild_The_Army_desc: "육군은 우리의 지상군입니다. 그들은 우리 민간인을 보호하고 지상에서 적군을 공격합니다. 좋은 육군은 국가에 광범위한 이점을 제공하므로, 우리는 육군이 싸울 수 있도록 적합하게 만드는 것을 우선시해야 합니다."
 ASA_Professional_Army_Focus: "직업군인에 집중"
 ASA_Professional_Army_Focus_desc: "직업 상비군은 국가의 방어에 매우 중요합니다. 우리는 우리 병사 한 명이 적 병사 두 명의 가치를 갖도록 만드는 데 집중해야 합니다."
 ASA_Open_Federal_Training_Camps: "연방 훈련소 개방"
 ASA_Open_Federal_Training_Camps_desc: "우리는 병사들이 훈련할 수 있는 공식적인 훈련소를 설립해야 합니다. 이 과정을 간소화함으로써, 우리는 더 짧은 시간에 병사들을 훈련시킬 수 있습니다."
 ASA_Open_Army_Officer_Training_Camps: "육군 장교 훈련소 개방"
 ASA_Open_Army_Officer_Training_Camps_desc: "군대를 지휘하는 것은 단순히 카리스마 있는 것 이상입니다. 전술과 전략도 알아야 합니다. 새로운 육군 장교 훈련 학교를 개설하면 가장 유망한 시민들이 전문 장교가 될 수 있습니다."
 ASA_Army_Of_The_Atlantic_States: "대서양 연합 육군"
 ASA_Army_Of_The_Atlantic_States_desc: "이제 우리는 완전히 기능하는 전문 상비군을 갖게 되었습니다. 이것은 앞으로 아메리카 대서양 연합 육군으로 알려질 것입니다."
 ASA_Militia_Focus: "민병대에 집중"
 ASA_Militia_Focus_desc: "대규모 전문 군대를 유지하는 것은 실용적이지만, 이미 재정난을 겪고 있는 정부에 너무 많은 비용이 들 것입니다. 국가 방어의 의무를 땅을 잘 알고 스스로를 부양할 의지가 있는 지역 민병대에게 위임하는 것이 더 낫습니다."
 ASA_Fund_Civilian_Training_Camps: "민간인 훈련소 자금 지원"
 ASA_Fund_Civilian_Training_Camps_desc: "우리가 병사들에게 직접 자금을 지원하지는 않겠지만, 자원 민병대원들이 훈련할 수 있는 훈련소를 개방할 수는 있습니다."
 ASA_Distribute_Officer_Training_Books: "장교 훈련 서적 배포"
 ASA_Distribute_Officer_Training_Books_desc: "우리는 한때 사용했던 장교 훈련 과정과 책들이 있습니다. 우리는 그것들을 복사하여 지역 민병대 지도자들에게 배포해야 합니다."
 ASA_The_Minutemen_Act: "민병대법"
 ASA_The_Minutemen_Act_desc: "민병대법은 지역 민병대의 지원을 받는 게릴라전이라는 우리의 군사 교리를 공식화할 것입니다. 또한 민병대들이 성공을 달성하기 위해 서로 협력하도록 보장하는 최고 사령부를 만들 것입니다."
 ASA_The_Federal_Guard: "연방 방위군"
 ASA_The_Federal_Guard_desc: "대서양 연합, 특히 워싱턴 D.C.를 방어하기 위해, 우리는 연방 방위군으로 알려진 새로운 정예 연대를 구성하여 필요한 곳에 배치해야 합니다."
 ASA_Establish_The_Free_Corps: "자유 군단 설립"
 ASA_Establish_The_Free_Corps_desc: "우리는 '자유 군단'으로 알려진 거대한 연방 방위군 예비군을 설립하여 연방 방위군을 확장해야 합니다. 이렇게 하면, 우리는 정부에 충성하는 거대한 병사 집단을 항상 즉시 전투에 투입할 수 있을 것입니다."
 ASA_Zouave_Regiments: "주아브 연대"
 ASA_Zouave_Regiments_desc: "우리는 높은 기동성이 필요한 작전을 위해 광범위한 경보병 군단을 포함하도록 연방 방위군을 확장해야 합니다. 장교 엘머 E. 엘스워스는 북아프리카에서 외과 의사로 일했던 친구 찰스 드 빌레르에게 들은 이야기에서 영감을 받아 이 경보병 군단인 주아브를 만들었습니다."
 ASA_AS_Marine_Corps: "대서양 연합 해병대"
 ASA_AS_Marine_Corps_desc: "북아메리카의 지형은 강으로 가득하고 대륙 한가운데에 오대호가 있습니다. 이전의 미국은 이러한 장애물을 극복하기 위해 해병대를 가졌지만, 우리 자신의 수륙 양용 부대는 조직이 없거나 존재하지 않습니다. 따라서 우리 최고 장군들은 미래의 분쟁에 대비하여 해병대를 재편성할 것을 제안했습니다."
 ASA_Prioritize_Marine_Weapons: "해병대 무기 우선시"
 ASA_Prioritize_Marine_Weapons_desc: "우리가 해병대를 거친 강과 광활한 호수를 넘어 적의 심장부로 보내려면, 그들이 임무를 빠르고 효과적으로 수행할 수 있도록 사용 가능한 최고의 무기를 장착해야 합니다."
 ASA_Prioritize_Marine_Ships: "해병대 함선 우선시"
 ASA_Prioritize_Marine_Ships_desc: "우리가 해병대를 거친 강과 광활한 호수를 넘어 적의 심장부로 보내려면, 그들을 수송하는 함선이 우리가 제공할 수 있는 가장 내구성이 뛰어나고 빠른 함선이 되도록 하여 그들이 임무를 빠르고 효과적으로 수행할 수 있도록 해야 합니다."
 ASA_Rebuild_The_Navy: "해군 재건"
 ASA_Rebuild_The_Navy_desc: "우리나라는 대서양과 접해 있으며 넓은 해안선을 가지고 있습니다. 우리를 방어할 대규모 해군을 건설하는 것은 단순한 사치가 아니라 절대적인 필수품입니다."
 ASA_A_Federal_Navy: "연방 해군"
 ASA_A_Federal_Navy_desc: "우리는 우리가 동원할 수 있는 얼마 안 되는 함선의 능력을 최대한 활용할 수 있도록 전문 상비 해군이 필요합니다."
 ASA_Contract_Local_Shipbuilders: "지역 조선업자와 계약"
 ASA_Contract_Local_Shipbuilders_desc: "새로운 조선 시설을 건설하는 것은 너무 비용이 많이 들 것입니다. 대신, 이미 존재하는 조선소에 계약을 제안할 수 있습니다."
 ASA_Open_Naval_Officer_Training_Schools: "해군 장교 훈련 학교 개방"
 ASA_Open_Naval_Officer_Training_Schools_desc: "우리가 숙련되고 유능한 지휘관을 확보하기 위해 연방 자금으로 지원되는 해군 장교 훈련 학교를 설립해야 합니다."
 ASA_Navy_Of_The_Atlantic_States: "대서양 연합 해군"
 ASA_Navy_Of_The_Atlantic_States_desc: "이제 우리는 완전히 기능하는 전문 상비 해군을 갖게 되었습니다. 이것은 앞으로 아메리카 대서양 연합 해군으로 알려질 것입니다."
 ASA_Hire_Privateers: "사략선 고용"
 ASA_Hire_Privateers_desc: "상비 해군은 이미 재정난을 겪고 있는 우리 정부의 자금에 너무 많은 비용이 들 것입니다. 비상시에 사략선을 고용하는 것이 가장 좋습니다."
 ASA_Arm_Merchant_Vessels: "상선 무장"
 ASA_Arm_Merchant_Vessels_desc: "비상시에는 새로운 함선을 건조하는 대신 이미 건조된 민간 선박을 군용 무기로 개조할 수 있습니다."
 ASA_Decentralize_Naval_Command: "해군 지휘권 분산"
 ASA_Decentralize_Naval_Command_desc: "전시에는 우리 함선의 상당수가 민간 선박이 될 것이므로, 우리 함장들이 각 함선이 필요로 하는 것에 더 독립적으로, 더 구체적으로 작전할 수 있도록 하는 것이 최적입니다."
 ASA_Emergency_Naval_Requisitioning_Act: "해군 비상 징발법"
 ASA_Emergency_Naval_Requisitioning_Act_desc: "해군 비상 징발법에 서명하여 민간 함선에 의존하는 우리의 교리를 공고히 함으로써 미래에 우리 해역의 안전을 보장할 것입니다."
 ASA_Establish_The_Atlantic_States_Department_Of_Defense: "국방부 설립"
 ASA_Establish_The_Atlantic_States_Department_Of_Defense_desc: "군사 문제를 감독할 단일 부서는 우리의 국방을 간소화할 것입니다. 현재 우리가 가진 것이 거의 없으므로, 우리의 군대가 가능한 한 조직화되도록 효율적으로 감독하는 전담 부서를 만들어야 합니다."
 ASA_Council_Of_Studying_Army_History: "육군 역사 연구 위원회"
 ASA_Council_Of_Studying_Army_History_desc: "과거의 육군 지도자들을 연구하면 미래의 육상 분쟁에 대한 귀중한 기술과 전술을 배울 수 있습니다."
 ASA_Study_Old_Commanders: "옛 지휘관 연구"
 ASA_Study_Old_Commanders_desc: "과거에는 유명한 지휘관들이 많습니다. 그들은 우리와 다른 시대에 살았지만, 그럼에도 불구하고 엄청난 성공을 거두었습니다. 그들을 성공하게 만든 것을 연구하면 그들의 전술을 우리 시대에 적용할 수 있습니다."
 ASA_Infantry_Officers: "보병 장교"
 ASA_Infantry_Officers_desc: "보병은 모든 군대의 중추입니다. 그들은 일반적으로 방패막이로 사용되었지만, 수년간 보병을 두렵게 만든 많은 보병 장교들이 있습니다."
 ASA_Study_George_Washington: "조지 워싱턴 연구"
 ASA_Study_George_Washington_desc: "우리의 초대 대통령이자 건국의 아버지 중 한 명인 조지 워싱턴은 우리 혁명에서 그의 군대를 승리로 이끌었습니다. 그는 전술의 대가는 아니었지만, 가장 혹독한 조건과 가장 불리한 상황에서도 그의 군대의 사기를 유지할 수 있었습니다. 만약 우리가 워싱턴만큼 유능한 조직가이자 지도자가 되도록 장교들을 훈련시킬 수 있다면, 우리도 높은 사기를 가진 군대를 가질 수 있을 것입니다."
 ASA_Study_Frederick_The_Great: "프리드리히 대왕 연구"
 ASA_Study_Frederick_The_Great_desc: "프리드리히 2세는 프로이센의 왕이었습니다. 포위되고 4배나 많은 병력에 비해 열세였음에도 불구하고, 그는 그의 유명한 '사선 대형'을 사용하여 그의 병사들을 승리로 이끌 수 있었습니다. 아마도 이 '사선 대형'을 확장하면 우리 군대도 성공을 거둘 수 있을 것입니다."
 ASA_Artillerists: "포병"
 ASA_Artillerists_desc: "포병은 파괴적이며, 올바른 사람의 손에 있다면 전투의 흐름을 바꿀 수 있습니다. 유명한 외국 군사 지휘관들을 연구하면 우리 포병이 항상 올바른 사람의 손에 있도록 보장할 수 있습니다."
 ASA_Study_Gustavus_Adolphus: "구스타프 아돌프 연구"
 ASA_Study_Gustavus_Adolphus_desc: "구스타프 아돌프는 연합군 전에서 기동 포병의 사용을 개척했습니다. 그가 세 개의 동시 전쟁에서 승리했다는 사실로 미루어 볼 때, 그의 전술이 효과가 있을 수 있다는 것은 확실합니다."
 ASA_Study_Napoleon_Bonaparte: "나폴레옹 보나파르트 연구"
 ASA_Study_Napoleon_Bonaparte_desc: "나폴레옹 보나파르트는 19세기 초 가장 유명한 포병이었습니다. 그의 기동 포병과 포병 집중으로 그는 유럽의 주인이 되었습니다. 그의 전술을 배우면 우리가 아메리카의 주인이 되는 데 도움이 될 것입니다."
 ASA_Cavalrymen: "기병"
 ASA_Cavalrymen_desc: "기병은 유능한 지휘관이 이끌면 기동성이 뛰어나고 치명적입니다. 우리는 세계 최고의 기병 장군들을 연구해야 합니다."
 ASA_Study_Carolus_Rex: "칼 12세 연구"
 ASA_Study_Carolus_Rex_desc: "10대 시절의 칼 12세는 유럽의 가장 강력한 세 나라와 싸워 이길 수 있었습니다. 그의 전술과 기병 사용을 활용하면 우리도 그와 같은 성공을 찾을 수 있을 것입니다."
 ASA_Study_Jan_Sobieski_III: "얀 소비에스키 3세 연구"
 ASA_Study_Jan_Sobieski_III_desc: "얀 소비에스키 3세는 빈 전투에서 폴란드 날개 달린 후사르의 지도자였습니다. 그의 파괴적인 돌격은 오스만군을 격파했습니다. 비록 기술은 변했지만, 우리는 창을 새로운 것으로 대체하고 효율성을 유지할 수 있습니다."
 ASA_Create_A_New_Doctrine: "새로운 교리 창조"
 ASA_Create_A_New_Doctrine_desc: "이제 과거의 유명한 장군들의 전술을 연구했으니, 과거의 전술의 이점을 현대 시대로 가져오거나 심지어 결합할 새로운 교리를 개발할 때입니다."
 ASA_Utilize_An_Old_Doctrine: "옛 교리 활용"
 ASA_Utilize_An_Old_Doctrine_desc: "'고장나지 않았다면 고치지 마라'는 속담처럼, 과거의 장군들이 사용한 전략 중 일부는 매우 효과적이었으며 우리는 이미 효과가 있는 것을 건드려서 우리 군대를 망치는 위험을 감수하고 싶지 않습니다."
 ASA_Finish_Study: "연구 완료"
 ASA_Finish_Study_desc: "우리의 연구가 완료되었고 우리는 우리 군대에서 우선시할 교리를 결정했습니다. 이제 우리는 우리의 임무가 공식적으로 완료되었음을 선언할 수 있습니다."
 ASA_E_Pluribus_Unum: "다수에게서 하나로"
 ASA_E_Pluribus_Unum_desc: "\"E Pluribus Unum.\" 다수에게서 하나로. 미국은 무너졌지만, 우리가 번영을 원한다면 공화국의 잔해는 단결해야 합니다."
 ASA_Domestic_Issues: "국내 문제"
 ASA_Domestic_Issues_desc: "미국의 붕괴는 우리 나라에 많은 문제를 가져왔습니다. 즉, 우리 경제가 붕괴 직전에 있다는 사실입니다. 너무 늦기 전에 이러한 문제를 가능한 한 빨리 해결해야 합니다."
 ASA_Atlantic_States_Bill_Of_Rights: "대서양 연합 권리장전"
 ASA_Atlantic_States_Bill_Of_Rights_desc: "우리가 진정한 미국으로서의 정당성을 증명하기 위해, 우리는 이전 정부가 제정한 권리장전을 재확인해야 합니다."
 ASA_The_Way_Forward: "나아갈 길"
 ASA_The_Way_Forward_desc: "우리나라에는 우리 국가가 어떻게 나아가고 번영해야 하는지에 대해 다양한 견해를 가진 많은 정당들이 권력을 다투고 있습니다. 그들은 모두 방법에 대해서는 의견이 다르지만, 아메리카 대서양 연합을 더 강하고 번영하는 국가로 만들겠다는 목표에는 동의합니다."
 ASA_Stevens_Administration: "스티븐스 행정부"
 ASA_Stevens_Administration_desc: "태디어스 스티븐스는 주로 노예제 폐지와 아메리카 연합국에 대한 전면적인 거부를 기반으로 하는 정책으로 당선되었습니다. 그의 주요 목표 중 하나는 궁극적으로 대륙 전역에서 이 관행을 폐지하기 위해 반노예제 국가들의 강력한 동맹을 구축하는 것입니다."
 ASA_Establish_Freedmens_Bureau: "자유민 사무소 설립"
 ASA_Establish_Freedmens_Bureau_desc: "새롭게 해방된 노예들이 자유 사회로 전환할 수 있도록 하기 위해, 그들에게는 집과 일자리가 필요할 것입니다. 자유민 사무소는 자유민들이 새로운 미국 사회에 정착하는 데 필요한 만큼의 지원을 제공하는 데 전념할 것입니다."
 ASA_Death_To_Slavery: "노예제에 죽음을"
 ASA_Death_To_Slavery_desc: "노예제는 부도덕한 가증스러운 일입니다. 수세기 동안 세계를 더럽혀 온 오점입니다. 우리의 새로운 미국은 국내외에서 이 사악한 관행을 종식시키기 위해 모든 권한을 다할 것입니다."
 ASA_Haven_For_Freedmen: "자유민의 안식처"
 ASA_Haven_For_Freedmen_desc: "우리는 노예 공화국에서 박해를 피해 도망치는 모든 자유민들이 정착하고 이곳을 그들의 고향으로 만들 수 있는 안전한 안식처가 될 것입니다. 자유민 사무소의 도움으로, 우리는 이 사람들이 모든 자유민들이 마땅히 누려야 할 삶을 얻도록 할 것입니다."
 ASA_Reparations_And_Reconstruction: "배상과 재건"
 ASA_Reparations_And_Reconstruction_desc: "이전 정부에서 아프리카계 미국인들의 상황은 그들이 백인들과 같은 부와 성공을 이룰 수 없다는 것을 의미했습니다. 이를 바로잡기 위해, 우리는 그들이 삶을 시작하고 경제 활동을 활성화할 수 있도록 자유민들에게 일시불로 돈을 줄 것입니다."
 ASA_Seward_Administration: "시워드 행정부"
 ASA_Seward_Administration_desc: "윌리엄 H. 시워드는 가능한 한 많은 미국 영토를 신속하게 재통일하겠다는 공약으로 당선되었습니다. 그의 비전은 옛 미합중국 영토 전체를 되찾고, 이 캠페인을 통해 얻은 군사적 지식과 경험을 이용해 아메리카 대륙 전체를 장악하는 것입니다. 그의 목표가 너무 야심찬가요? 아마도 그럴 것입니다. 그러나 역사를 만드는 것은 크게 꿈꾸는 사람들입니다."
 ASA_Rewrite_Monroe_Doctrine: "먼로 독트린 재작성"
 ASA_Rewrite_Monroe_Doctrine_desc: "옛 먼로 독트린은 충분히 단호하지 않았습니다. 새로운 독트린은 미국의 진정한 운명, 즉 시워드 대통령과 국민의 꿈을 종이에 담아야 합니다. 서반구는 우리의 영향력 아래에 있는 것이 아니라, 우리의 국경의 일부로서 미국에 속합니다."
 ASA_Wage_Equity: "임금 평등 우선시"
 ASA_Wage_Equity_desc: "동일 노동에 대한 동일 임금은 같은 직장에 있는 개인들에게 동등한 임금을 지급해야 한다는 노동권 개념입니다."
 ASA_Legal_Equality: "법적 평등 우선시"
 ASA_Legal_Equality_desc: "법 앞의 평등은 법적 평등 또는 법적 평등주의라고도 알려져 있으며, 모든 독립된 존재가 법에 의해 평등하게 대우받아야 하고 모든 사람이 동일한 사법적용을 받는다는 원칙입니다."
 ASA_Merge_With_The_Half_Breeds: "하프브리드파와 통합"
 ASA_Merge_With_The_Half_Breeds_desc: "‘하프브리드파 공화당원’은 공무원 개혁과 능력 위주 제도를 선호하는 ‘스톨워트파 공화당원’의 주요 반대파로 여겨집니다. 그들은 주로 단일 문제 집단이지만, 그들과 동맹을 맺는 것은 큰 도움이 될 것입니다."
 ASA_New_Social_Issues: "새로운 사회 문제"
 ASA_New_Social_Issues_desc: "우리 행정부가 지금까지 [ASA.GetNameDef]가 직면한 많은 사회 문제를 해결해왔지만, 옛 문제가 뿌리 뽑힌 자리에 새로운 문제들이 생겨났습니다. 우리는 이러한 문제들을 신속하고 효과적으로 다루어야 합니다."
 ASA_Demand_Unconditional_Emancipation_Abroad: "해외 무조건적 해방 요구"
 ASA_Demand_Unconditional_Emancipation_Abroad_desc: "노예제는 너무 오랫동안 아메리카 대륙을 괴롭혀온 도덕적인 죄악입니다. 우리가 유럽이나 심지어 남아메리카 국가들에게 노예를 해방하라고 요구할 수는 없지만, 최소한 옛 미합중국에서 온 이웃들에게는 우리의 힘을 행사할 수 있습니다."
 ASA_Demands_Accepted: "요구 수용됨"
 ASA_Demands_Accepted_desc: "우리가 요구한 모든 나라들이 우리의 요구를 수용했습니다. 전 세계적인 해방의 길에 큰 진전입니다!"
 ASA_Demands_Rejected: "요구 거부됨"
 ASA_Demands_Rejected_desc: "우리가 요구한 모든 국가들이 우리의 요구를 거부했습니다. 분명히 그들은 다른 인간들을 노예 상태로 묶어두고 싶어 하며, 따라서 신속하게 처리해야 합니다."
 ASA_Ensure_Emancipation: "해방 보장"
 ASA_Ensure_Emancipation_desc: "다른 나라들이 노예제를 폐지했다고 말하지만, 그것은 단순한 말에 불과합니다. 우리는 모든 노예가 무조건적으로 해방되도록 사절단을 파견하여 확인해야 합니다."
 ASA_Abolitionist_Crusade: "노예제 폐지 운동"
 ASA_Abolitionist_Crusade_desc: "우리는 다가올 분쟁을 위해 군대를 조직할 것입니다. 만약 사람들이 다른 인간들을 노예와 사슬에 묶어두려 한다면, 우리는 이 세상의 모든 사람을 해방시키기 위해 군대를 보낼 것입니다."
 ASA_Alliance_With_New_England: "뉴 잉글랜드와 동맹"
 ASA_Alliance_With_New_England_desc: "[NEG.GetNameDef]는 우리처럼 모든 형태의 노예제에 대한 확고한 반대자입니다. 대륙에서 노예제라는 죄악을 없애는 데 도움을 주려면, 우리와 뜻을 같이하는 동맹국이 필요합니다."
 ASA_American_Dawn: "아메리카의 여명"
 ASA_American_Dawn_desc: "우리의 새로운 프로그램, 정책, 그리고 노예제에 대한 강력한 반대가 아메리카를 재편하는 데 도움이 되었습니다. 우리 눈앞에서 옛 죄악이 깨끗이 씻겨나간 새로운 아메리카의 여명을 보고 있습니다."
 ASA_The_Stevens_Seward_Act: "스티븐스-시워드 법안"
 ASA_The_Stevens_Seward_Act_desc: "공화당의 스톨워트파와 급진파 간의 협력을 통해 탄생한 스티븐스-시워드 법안은 군대의 커져가는 정치적 영향력을 억제하고, 이러한 영향력을 지지하는 정치인들에 대해 확고한 입장을 표명하도록 고안되었습니다. 주요 조항 중 하나는 군대 내의 비정치주의를 강제하는 것입니다."
 ASA_Stalwart_Republican_Administration: "스톨워트파 공화당 행정부"
 ASA_Stalwart_Republican_Administration_desc: "‘스톨워트파 공화당원’은 공화당 내에서 더 전통적인 파벌을 이룹니다. 그들은 인구 통계학적으로 민주당에 더 가까웠으며, 민주당과 같은 표를 놓고 경쟁하는 경향이 있었습니다."
 ASA_American_Austerity: "미국의 긴축"
 ASA_American_Austerity_desc: "현재 [ASA.GetNameDef]는 다소 어려운 시기를 겪고 있습니다. 그러나 우리가 폭풍을 이겨내고 모두가 각자의 의무를 다하며 아무것도 소홀히 하지 않는다면, 이 험난한 폭풍을 헤쳐나갈 것입니다. '침착하게, 계속 나아가라'고 말하는 것처럼 말입니다."
 ASA_Address_Issues_Of_Labor: "노동 문제 해결"
 ASA_Address_Issues_Of_Labor_desc: "우리나라가 현재 직면한 심각한 문제 중 하나는 노동 계급에 대한 보호와 지원이 미흡하다는 것입니다. 이는 우리 노동자들의 사기 저하와 더불어 경제에 치명적인 영향을 미쳤습니다. 경제를 다시 제자리로 돌리기 위해, 우리는 노동 계급을 강화하고 도미노 효과가 발생하도록 해야 합니다."
 ASA_Address_Issues_Of_Capital: "자본 문제 해결"
 ASA_Address_Issues_Of_Capital_desc: "우리나라가 현재 직면한 심각한 문제 중 하나는 비교적 취약한 경제입니다. 우리가 경제 강국으로 제대로 성장하려면, 기업들이 정부의 많은 개입 없이 자유롭게 운영될 수 있도록 해야 합니다."
 ASA_Regain_The_Peoples_Trust: "국민의 신뢰 회복"
 ASA_Regain_The_Peoples_Trust_desc: "현재 미합중국의 붕괴에 대한 기억은 국민의 마음에 생생합니다. 그들은 또한 당시 정권을 잡고 있던 정부를 기억합니다. 우리가 진정으로 민주주의를 원한다면 국민을 안심시키고 신뢰를 회복해야 합니다."
 ASA_Reconcile_With_One_Side: "한쪽과 화해"
 ASA_Reconcile_With_One_Side_desc: "현재 우리는 이 나라의 두 주요 파벌, 즉 급진파 공화당 형제들과 민주당 사촌들 사이에 갇혀 있습니다. 우리는 그들 중 적어도 한쪽과 우호적인 관계를 맺어야 합니다. 이 두 파벌의 본성상, 한쪽과 친해지면 다른 쪽의 마음을 얻는 것은 불가능할 것입니다. 그러므로 우리는 신중하게 선택해야 합니다."
 ASA_Reconcile_With_Radical_Republicans: "급진파 공화당원과 화해"
 ASA_Reconcile_With_Radical_Republicans_desc: "급진파 공화당 의원들은 우리처럼 공화당의 일부입니다. 현재 당이 심하게 분열되어 있지만, 급진파 공화당원들과의 화해와 양측의 양보가 당을 다시 안정시킬 수 있을 것입니다."
 ASA_Reconcile_With_Democrats: "민주당과 화해"
 ASA_Reconcile_With_Democrats_desc: "공화당은 곧 분열될 것입니다. 몇 발짝 앞서서 우리의 인구통계학적 사촌들과 협력하여 정치적 동맹을 확보하는 것이 최선입니다. 그러나 이러한 움직임은 급진파 공화당 동맹국들을 확실히 소외시키고 당을 분열시킬 수 있다는 점을 경고해야 합니다."
 ASA_Live_Up_To_Our_Creed: "우리의 신조에 따라 살자"
 ASA_Live_Up_To_Our_Creed_desc: "\"우리는 다음 진실을 자명한 것으로 여긴다. 모든 인간은 평등하게 창조되었고, 창조주로부터 양도할 수 없는 특정 권리, 즉 생명, 자유, 행복 추구의 권리를 부여받았다.\"\n \n- 미국 독립선언서"
 ASA_Reach_Out_To_The_Citizenry: "시민들에게 다가가기"
 ASA_Reach_Out_To_The_Citizenry_desc: "지금까지 우리는 워싱턴의 정치인들과만 화해하고 소통하려고 했습니다. 그 결과, 우리는 평범한 미국인들에게 다가가고 나라의 문제에 대해 이야기하는 것을 잊었습니다. 우리가 진정으로 국민을 위한 정부가 되려면, 일반 시민의 목소리를 들어야 합니다."
 ASA_Ring_The_Bell_Of_Liberty: "자유의 종을 울리자"
 ASA_Ring_The_Bell_Of_Liberty_desc: "미합중국은 이민자의 나라였습니다. 미합중국의 후계자로서, 우리는 '지치고, 가난하고, 웅크린' 세상의 대중들에게 우리가, 미합중국의 정당한 후계자들이 안전, 안보, 그리고 번영을 제공할 것이라는 것을 알림으로써 그 칭호를 계속 유지해야 합니다."
 ASA_A_New_Age: "새로운 시대"
 ASA_A_New_Age_desc: "붕괴는 옛 미합중국 국민에게 새로운 시대를 가져왔지만, 그것이 반드시 암울한 시대일 필요는 없습니다. 적어도 영원히는 아닙니다. 우리 대서양 연합의 국민은 모두가 미합중국의 번영과 약속을 누릴 수 있도록 보장할 것입니다."
 ASA_Democratic_Administration: "민주당 행정부"
 ASA_Democratic_Administration_desc: "민주당은 [ASA.GetNameDef]의 보수 정당입니다. 대부분의 정책은 공화당 의원들이 하려는 일에 반대하는 것입니다. 그러나 민주당 지도자들은 협력의 이점을 인식하고 있으며, 최근에는 급진파 공화당원들이 모르게 스톨워트파 공화당원들과 협력하고 있습니다."
 ASA_Direction_Of_The_Party: "당의 방향"
 ASA_Direction_Of_The_Party_desc: "민주당의 위신과 당원 수가 모두 줄어들면서, 우리는 당의 새로운 방향을 결정해야 합니다. 결국, 대통령 선거에서의 우리의 성공은 단순히 조지 맥클렐런의 인기와 자선 활동 덕분이었습니다. 그러나 우리가 어떤 길을 택하든, [ASA.GetNameDef] 시민들에게 어필하기 위해 우리의 이념을 바꿔야 할 것입니다. 따라서 당 지도부는 민주당의 핵심 측면 중 하나를 고수하고 다른 모든 신조를 공화당과 더 비슷하게 바꾸려는 계획을 세웠습니다."
 ASA_Prioritize_Social_Conservatism: "사회적 보수주의 우선시"
 ASA_Prioritize_Social_Conservatism_desc: "사회적 보수주의는 사회적 다원주의보다 전통적인 권력 구조를 강조하고, '변화의 방향을 되돌리거나 억제'하려고 하는 정치적 우파 이념입니다."
 ASA_Prioritize_Fiscal_Conservatism: "재정적 보수주의 우선시"
 ASA_Prioritize_Fiscal_Conservatism_desc: "재정적 보수주의는 정부 지출과 부채에 대한 신중함을 강조하는 경제 철학입니다. 재정적 보수주의자들은 적자 지출을 피하고, 전반적인 정부 지출과 국가 부채를 줄이면서 균형 잡힌 예산을 보장할 것을 주장합니다."
 ASA_Pacify_Pillagers: "약탈자 진압"
 ASA_Pacify_Pillagers_desc: "범죄자들이 옛 미합중국의 붕괴로 인한 불안정성을 틈타 시골 농장과 사업체를 약탈하고 있습니다. 우리는 이 쓰레기들을 가능한 한 빨리 처리해야 합니다."
 ASA_Boost_National_Defense: "국가 방위력 증강"
 ASA_Boost_National_Defense_desc: "우리나라는 현재 매우 취약합니다. 이웃 국가들이 아무 문제 없이 쉽게 우리를 침략하고 정복할 수 있습니다. 이러한 사태를 막기 위해, 우리는 신속하게 방어 시설을 구축하고 군인과 예비군을 보충해야 합니다."
 ASA_Domestic_Interstate_Railroad: "국내 주 간 철도"
 ASA_Domestic_Interstate_Railroad_desc: "국내 주 간 철도를 건설하는 것은 우리 경제에 막대한 이익을 가져올 것입니다. 건설 일자리를 창출할 뿐만 아니라, 주 간의 상업을 활성화할 것입니다. 대륙 횡단 철도만큼의 경제적 호황은 아니겠지만, 전쟁 시에는 최소한 안전할 것입니다."
 ASA_Trans_Continental_Railroad: "대륙 횡단 철도"
 ASA_Trans_Continental_Railroad_desc: "대륙 횡단 철도의 건설은 의심할 여지 없이 그것이 통과하는 모든 국가에 막대한 경제적 호황을 가져올 것입니다. 또한, 우리가 건설을 주도하면 다른 국가들과 좋은 관계를 맺게 될 것입니다. 그러나 전쟁 시에는 쉽게 파괴되고 손상될 수 있습니다."
 ASA_Protection_Of_All_Citizens: "모든 시민의 보호"
 ASA_Protection_Of_All_Citizens_desc: "우리가 미합중국의 진정한 후계자라는 주장을 뒷받침하려면, 개인의 자유와 권리를 면밀히 가치 있게 여기고 수용해야 합니다. 법률을 통해 이러한 자유를 보장함으로써, 우리는 대중으로부터 더 많은 지지를 얻을 것입니다."
 ASA_Defend_Railroads: "철도 방어"
 ASA_Defend_Railroads_desc: "약탈자든 습격자든, 노동자들과 철도 자체는 극도로 취약합니다. 따라서 우리는 철도를 방어하기 위해 군인을 배치해야 합니다."
 ASA_Enforce_Federal_Powers: "연방 권한 강화"
 ASA_Enforce_Federal_Powers_desc: "국가가 강하고 강력해지려면 중앙집권적인 정부가 필요합니다. 수정헌법 제10조가 연방 정부가 전권을 갖는 것을 막지만, 우리는 최소한 연방 정부가 통과시킨 법률을 더 강력하게 집행하고 일부 권한을 확장할 수 있습니다."
 ASA_Enforce_The_Second_Amendment_tt: "§GEvery citizen will be given a government-funded firearm§!"
 ASA_God_Bless_America: "신이여, 미국을 축복하소서"
 ASA_God_Bless_America_desc: "새로운 철도 프로젝트와 연방 확장으로, 국가는 다시 한번 힘을 키우고 미국을 재통일할 수 있는 시점에 이르렀습니다. 신이여, 대서양 연합을 축복하소서."
 ASA_McClellan_Third_Term: "맥클렐런의 세 번째 임기"
 ASA_McClellan_Third_Term_desc: "조지 B. 맥클렐런은 전례 없는 세 번째 임기에 출마했을 뿐만 아니라 당선되었습니다. 이제 국민들은 맥클렐런이 세 번째 임기를 남용할지, 아니면 다른 대통령들처럼 우리의 민주주의 시스템을 유지할지 확신하지 못하고 있습니다."
 ASA_Maintain_Democracy: "민주주의 유지"
 ASA_Maintain_Democracy_desc: "우리의 민주주의 시스템을 부정하려는 생각은 터무니없는 발상입니다. 맥클렐런이 전권을 잡을 것이라는 그런 말도 안 되는 소문을 퍼뜨리는 사람은 해고해야 합니다."
 ASA_The_New_America: "새로운 아메리카"
 ASA_The_New_America_desc: "국민은 맥클렐런이 권력을 잡기를 원할 뿐만 아니라 필요로 한다는 것을 증명했습니다. 이 나라가 강하고, 번영하며, 안전하도록 보장하려면, 장군이 자신의 비전으로 나라를 재편하도록 허용해야 합니다."
 ASA_Pan_Americanism: "범아메리카주의"
 ASA_Pan_Americanism_desc: "하나의 연합된 아메리카라는 생각은 대부분의 사람들의 마음에 여전히 생생합니다. 이러한 생생한 기억을 이용하여, 우리는 성조기 아래에서 미국을 재통일하려는 운동에 힘을 실어줄 수 있습니다."
 ASA_Reunionism: "재통일주의"
 ASA_Reunionism_desc: "재통일주의. 미합중국이 통일되었을 때 모두가 훨씬 더 행복하고 번영했다는 생각입니다. 생각이라기보다는 객관적인 사실에 가깝습니다. 우리는 국민의 삶을 더 좋게 만들겠다고 약속했고, 어떤 대가를 치르더라도 정확히 그렇게 할 것입니다."
 ASA_Faux_Republic: "가짜 공화국"
 ASA_Faux_Republic_desc: "현재 우리나라는 진정한 공화국이 아닙니다. 현재 맥클렐런 장군과 그의 동맹들은 너무 많은 권력, 영향력, 그리고 인기를 얻어서 그와 그의 당은 사실상 모든 선거에서 승리하고 있습니다. 만약 이 상태가 계속된다면, 그들은 그를 독재자로 만들 수도 있습니다..."
 ASA_Continue_The_Junta: "군부 통치 유지"
 ASA_Continue_The_Junta_desc: "우리는 공화국에 현재의 비상사태를 유지하고 지지해야 합니다. 만약 우리가 흔들리면, 적들이 우리의 약점을 이용하여 공격할 것입니다."
 ASA_Permanent_State_Of_Emergency: "영구 비상사태"
 ASA_Permanent_State_Of_Emergency_desc: "[ROOT.GetLeader]는 국내 반란의 위협을 다루기 위해 비상 권한을 부여받고 비상사태를 선포했습니다. 우리 지도자는 주변을 둘러보고 모든 옛 미국 땅이 되찾아질 때까지 이 나라가 비상사태를 유지해야 한다고 외쳤습니다."
 ASA_Amend_The_Constitution: "헌법 개정"
 ASA_Amend_The_Constitution_desc: "헌법은 위대함으로 가는 우리의 길에 너무 많은 장애물을 놓습니다. 우리가 국가를 다시 위대하게 만들고 싶다면, 이러한 '견제와 균형'을 없애야 합니다."
 ASA_A_Militaristic_Republic: "군사적 공화국"
 ASA_A_Militaristic_Republic_desc: "우리가 지도력을... 강제적인... 수단으로 바로잡았다고 해서 반드시 민주주의를 버려야 하는 것은 아닙니다. 아주 간단하게, 우리는 군대를 지지하는 교육과 선전을 통해 우리가 원하는 것을 달성할 수 있습니다."
 ASA_Streamline_Reserve_Deployment: "예비군 배치 간소화"
 ASA_Streamline_Reserve_Deployment_desc: "우리는 많은 상비군을 가지고 있지만, 예비군에는 훨씬 더 많은 병사들이 준비하고 있습니다. 그러나 미래의 전쟁에서 그들을 제대로 활용하려면, 최대의 효율성을 위해 그들을 동원하고 배치하는 시스템을 간소화해야 합니다."
 ASA_Encourage_Volunteership: "자원 입대 장려"
 ASA_Encourage_Volunteership_desc: "더 강력한 사회를 만드는 첫걸음 중 하나는 어릴 때부터 사람들에게 군대에 자원하는 것의 이점을 가르치는 것입니다. 이렇게 하면, 우리가 전투에 보내는 병사들의 사기가 더 좋아질 것입니다."
 ASA_Everyone_A_Rifleman_First: "모두가 우선 소총수"
 ASA_Everyone_A_Rifleman_First_desc: "우리 해병대원들이 가장 먼저 배우는 것 중 하나는 소총을 효과적으로 사용하는 것이며, 이는 모든 해병대원을 핵심적으로 소총수로 만듭니다. 우리는 이 정책을 모든 국민에게 확장할 수 있을 것입니다."
 ASA_Allotment_System: "할당 시스템"
 ASA_Allotment_System_desc: "할당 시스템은 스웨덴에서 항상 훈련된 군대를 유지하기 위해 사용되던 시스템입니다. 네 개의 농장에 한 명의 군인을 장비시킬 책임이 주어지며, 전쟁 시에는 신속하게 동원되고 조직될 수 있었습니다. 우리는 더 비옥한 농장을 고려하여 이 시스템의 다른 버전을 활용하여 더 큰 전쟁에 대비할 수 있습니다."
 ASA_A_Military_Republic: "시민 군사 정부"
 ASA_A_Military_Republic_desc: "이제 나라를 더 책임감 있는 손에 맡겼으니, 국가를 건설하는 데 집중할 수 있습니다. 분명히, [ASA.GetName]을 더 강력하고 안전한 국가로 만들고 싶다면, 군사 지도자들이 우리의 결정을 내리도록 해야 합니다."
 ASA_Appoint_Loyal_Governors: "총독 임명"
 ASA_Appoint_Loyal_Governors_desc: "미래에 있을지 모르는 반란을 막기 위해, 우리는 반란이 일어나기 전에 이를 진압할 충성스러운 총독을 우리가 통제하는 주에 임명해야 합니다."
 ASA_Congress_Of_Commanders: "지휘관 회의"
 ASA_Congress_Of_Commanders_desc: "이제 군사 지도자들이 의회에 선출되었으므로, 우리는 마침내 정부가 재개되었음을 선포하고 우리의 비전을 현실로 만들기 위해 일할 수 있습니다."
 ASA_Enforce_The_Second_Amendment: "수정헌법 제2조 강제"
 ASA_Enforce_The_Second_Amendment_desc: "\"자유로운 주(State)의 안보에 필요한, 잘 규율된 민병대가 존재하기 때문에, 국민이 무기를 소지하고 휴대할 권리는 침해될 수 없다.\" 헌법의 이 문구는 우리 국민에게 소중합니다. 왜 우리가 수정헌법 제2조를 한 단계 더 나아가 정부가 모든 미국인에게 무기를 제공하도록 해야 하지 않을까요?"
 ASA_President_For_Life: "종신 대통령"
 ASA_President_For_Life_desc: "[ROOT.GetLeader]는 국가를 위해 무엇이 최선인지 압니다. 그가 죽을 때까지 계속 봉사하도록 허용함으로써, 우리는 그가 이 국가를 최고로 만들 수 있도록 할 것입니다. 장군이 적합하다고 생각하는 대로 공화국을 운영하게 하십시오."
 ASA_The_Commander_In_Chief: "최고 사령관"
 ASA_The_Commander_In_Chief_desc: "최고 사령관은 군대나 군사 부문에 대한 최고의 지휘권과 통제권을 행사하는 사람입니다. 기술적인 용어로, 이는 국가의 행정부, 국가 원수 또는 정부 수반에게 있는 군사적 권한을 의미합니다. 우리의 새로운 국가는 그 지도자가 이 칭호를 갖도록 해야 합니다."
 ASA_Reunionist_Education: "재통일주의 교육"
 ASA_Reunionist_Education_desc: "우리 미래의 아이들이 통일된 미국을 위해 기꺼이 싸울 준비가 되도록 하기 위해, 우리는 재통일주의를 긍정적인 시각으로 가르치는 학교에만 정부 자금을 지원해야 합니다. 시간이 지나면 모든 학교가 굴복하게 될 것입니다."
 ASA_An_Iron_Fist: "철권"
 ASA_An_Iron_Fist_desc: "우리의 최고 사령관의 권위에 도전하려는 사람들이 있습니다. 이 사람들은 우리의 새로운 국가에 대한 반역자에 불과하며 그렇게 다루어져야 합니다."
 ASA_Heavy_Centralization: "강력한 중앙집권화"
 ASA_Heavy_Centralization_desc: "'지방 통치'라는 개념은 우스꽝스럽습니다. 이는 우리 국가가 진정으로 단결하는 것을 방해할 뿐입니다. 지난 10년은 지방 정부가 약점만을 만들고 미합중국의 붕괴를 초래했다는 것을 보여주었습니다. 우리 국가를 다시 위대하게 만들고 싶다면, 우리는 강력하게 중앙집권화하고 이러한 주 의회를 폐지해야 합니다."
 ASA_General_Council: "총사령부"
 ASA_General_Council_desc: "프로이센에는 본질적으로 국가의 군사 문제를 이끄는 참모 본부가 있습니다. 아마도 우리는 국가의 군대를 강화하기 위해 우리만의 참모 본부를 가질 수 있을 것입니다."
 ASA_March_Into_The_Future: "미래로 전진"
 ASA_March_Into_The_Future_desc: "국가는 재건되었고 다시 위대해졌습니다. 이제 우리는 단결된 국민과 단결된 국가로서 미래로 전진합니다. 영광이여, 알렐루야!"
 ASA_McClellan_Granted_Emergency_Powers: "맥클렐런에게 비상 권한 부여"
 ASA_McClellan_Granted_Emergency_Powers_desc: "맥클렐런 장군은 국가의 안정을 보장하기 위해 의회로부터 비상 권한을 부여받았습니다. 이제 우리는 그가 자신의 일을 제대로 수행할 수 있기를 바라야 합니다."
 ASA_Suspend_Habeus_Corpus: "인신보호 영장 정지"
 ASA_Suspend_Habeus_Corpus_desc: "지금은 거대한 내분 시기입니다. 대규모 사회 불안이 있는데 시민의 자유와 같은 어리석은 일에 신경 쓸 여유가 없습니다. 국민들은 우리를 믿어야 합니다. 이것은 그들 자신의 안전을 위한 것입니다."
 ASA_Mobilize_National_Guard_Reserves: "주 방위군 예비군 동원"
 ASA_Mobilize_National_Guard_Reserves_desc: "주 방위군은 지금 당장은 상황을 억제할 수 있을지 모르지만, 예비군을 동원하면 위협을 신속하게 제거할 수 있을 것입니다."
 ASA_Maintain_Order: "질서 유지"
 ASA_Maintain_Order_desc: "우리는 질서를 유지하기 위해 국민의 권리와 자유가 영구적으로 빼앗기지 않을 것이라고 안심시켜야 합니다. 그렇지 않으면, 이 상황은 통제하기 어려워질 수 있습니다."
 ASA_Implement_A_Curfew: "통행 금지령 시행"
 ASA_Implement_A_Curfew_desc: "우리는 국민 중에 누가 반란에 동조할 수 있는지 주시해야 합니다. 통행 금지령은 그들이 우리가 원할 때, 우리가 원하는 장소에 항상 있도록 보장할 것입니다."
 ASA_More_Executive_Orders: "더 많은 행정 명령"
 ASA_More_Executive_Orders_desc: "맥클렐런 장군은 반란을 끝내기 위해 더 많은 통제력을 행사해야 합니다. 더 많은 행정 명령은 확실히 유익한 결과만을 가져올 것입니다."
 ASA_The_McClellan_Cult: "맥클렐런 신격화"
 ASA_The_McClellan_Cult_desc: "조지 B. 맥클렐런은 자신을 중심으로 한 인격 숭배를 발전시켰습니다. 이는 주로 대규모 자선 활동과 포퓰리즘적 수사 덕분입니다. 이 인격 숭배로 인해 일부 사람들은 농담 삼아 그를 '아메리카의 황제'로 만들 것을 요구하기도 했습니다."
 ASA_The_American_Napoleon: "아메리카의 나폴레옹"
 ASA_The_American_Napoleon_desc: "조지 B. 맥클렐런은 원래 그의 병사들에게 '젊은 나폴레옹'이라는 별명을 얻었습니다. 그는 나폴레옹 보나파르트 1세와 비슷한 방식으로 권력을 장악했으며 프랑스 황제의 국내 정책과 유사한 변화를 제안하고 있습니다. 이러한 행동의 결과로, 많은 국민들이 그에게 '아메리카의 나폴레옹'이라는 칭호를 사랑스럽게 부여했습니다."
 ASA_March_Of_The_Eagles: "독수리의 진군"
 ASA_March_Of_The_Eagles_desc: "맥클렐런 황제는 그 자신만이 아니라 우리 모두를 영광으로 이끌 것입니다. 우리가 그를 왕좌에 올리는 것을 도왔으니, 우리의 새 황제는 분명히 공동의 이익을 위해 일하는 국민의 사람일 것입니다."
 ASA_Liberal_Empire: "자유주의 제국"
 ASA_Liberal_Empire_desc: "새로운 [ASA.GetName]은 국민을 위한, 국민에 의한 제국이 되어야 합니다. 국민의 권리가 제국주의적 명령에 의해 강제되는 '자유주의 제국' 말입니다."
 ASA_Adopt_A_New_Constitution: "새로운 헌법 채택"
 ASA_Adopt_A_New_Constitution_desc: "맥클렐런 황제가 평범한 사람들의 이익을 위해 일할 것이라는 데에는 의심의 여지가 없지만, 그의 후계자가 그의 발자취를 따를 것이라는 보장은 없습니다. 우리는 그의 후계자 중 누구도 국민의 권리를 침해하는 것을 막기 위해 헌법을 제정해야 합니다."
 ASA_An_American_Civil_Code: "아메리카 민법"
 ASA_An_American_Civil_Code_desc: "나폴레옹 보나파르트는 그의 국가 사회가 어떻게 운영될지를 개괄하는 프랑스 민법을 만들었습니다. [ASA.GetNameDef]에서도 이와 유사한 민법이 채택되어야 합니다."
 ASA_Civil_Procedure: "민사 절차"
 ASA_Civil_Procedure_desc: "민법의 민사 절차 부분은 사람들이 [ASA.GetNameDef]의 이익을 위해 일하는 좋은 시민이 되도록 일상적으로 어떻게 행동해야 하는지를 개괄할 것입니다."
 ASA_Criminal_Procedure: "형사 절차"
 ASA_Criminal_Procedure_desc: "민법의 형사 절차 부분은 정부가 우리의 법률을 위반하는 사람들을 어떻게 다루어야 하는지를 개괄할 것입니다. 이렇게 하면 범죄자들은 혹독하게 처벌받고 잠재적 범죄자들은 단념하게 될 것입니다."
 ASA_Military_Procedure: "군사 절차"
 ASA_Military_Procedure_desc: "민법의 군사 절차 부분은 평시와 전시 모두에 군대를 어떻게 조직하고 동원할지를 개괄할 것입니다. 이렇게 하면 우리 군대는 항상 나라를 방어할 준비가 되어 있을 것입니다."
 ASA_March_Of_The_Eagle: "독수리의 진군"
 ASA_March_Of_The_Eagle_desc: "조지 1세는 우리를 영광으로 이끌 것입니다. 그러나 그를 헌법과 같은 어리석은 것들로 제한하는 것은 위대함으로 향하는 우리의 진전을 방해할 뿐입니다. 황제가 적합하다고 생각하는 대로 [ASA.GetNameDef]을 이끌도록 해야 합니다."
 ASA_Authoritarian_Empire: "권위주의 제국"
 ASA_Authoritarian_Empire_desc: "황제가 자신의 뜻대로 국가를 이끌도록 허용하는 것이 가장 실용적인 일입니다. 이것은 '헌법'이라는 불필요한 방해 없이 그가 필요한 상황에 반응할 수 있도록 할 것입니다."
 ASA_Absolute_Power: "절대 권력"
 ASA_Absolute_Power_desc: "황제에게 절대 권력을 부여하면 [ASA.GetName]을 위협하는 상황에 신속하게 반응할 수 있을 것입니다. 이것은 분명히 국가의 안전과 안보만을 가져올 것이며 다른 어떤 것도 가져오지 않을 것입니다."
 ASA_New_Diktats: "새로운 링컨 독재"
 ASA_New_Diktats_desc: "옛 미합중국의 영광을 되찾기 위해, 맥클렐런 황제는 이를 달성하기 위한 새로운 칙령 목록을 개괄했습니다."
 ASA_An_Orderly_Society: "질서 있는 사회"
 ASA_An_Orderly_Society_desc: "맥클렐런은 [ASA.GetName]의 질서를 유지하기 위해 모든 시민이 그가 말하는 모든 것을 따르고 따라야 한다는 칙령을 제정했습니다."
 ASA_Department_Of_Public_Safety: "공공 안전부"
 ASA_Department_Of_Public_Safety_desc: "맥클렐런 황제는 일상적인 지역 치안을 담당하고 공공을 국가의 적으로부터 보호하기 위해 새로운 '공공 안전부'의 창설을 명했습니다."
 ASA_Force_Conscription: "강제 징집"
 ASA_Force_Conscription_desc: "모든 사람은 국가에 대한 의무를 다해야 합니다. 황제 자신은 이 의무를 증명하는 가장 좋은 방법은 군대에 입대하는 것이라고 선언했습니다. 이 계획을 실행하기 위해, 황제는 모든 건강한 남성은 18세가 되면 12개월 동안 군 복무를 해야 하며, 35세까지 자동으로 예비역으로 등록되는 국가 징병 정책을 명했습니다."
 ASA_Reform_The_National_Bank: "국립 은행 개혁"
 ASA_Reform_The_National_Bank_desc: "국립 은행은 1790년에 국가의 재정과 금융 기관을 규제하기 위해 설립된 기관이었습니다. 이 은행은 앤드류 잭슨 대통령 임기 하에 운영을 중단해야 했습니다. 이제 국가는 미합중국의 갑작스러운 붕괴로 인한 경제 문제로 여전히 고심하고 있습니다. 위기에서 회복하는 데 도움을 주기 위해, 자문가들은 국립 은행을 재건하고 원래의 목적으로 사용하도록 제안했습니다."
 ASA_Improve_Capital_Infrastructure: "수도 기반 시설 개선"
 ASA_Improve_Capital_Infrastructure_desc: "이러한 급격한 변화의 시기에 안정을 유지하기 위해, 수도의 경제 상황을 개선하여 새로운 황제에 대한 국민의 시각을 개선하는 것이 좋은 생각입니다. 결국, 어떤 훌륭한 황제가 그의 궁전에서 내려다볼 웅장한 수도를 갖지 않겠습니까?"
 ASA_Establish_The_Grand_Army_Of_The_Empire: "제국의 대군 건설"
 ASA_Establish_The_Grand_Army_Of_The_Empire_desc: "영광스러운 제국은 영광스러운 군대를 가질 자격이 있습니다. 이 새로운 '제국의 대군'은 나폴레옹의 대육군처럼 조직될 것이며, 성공적이지 않더라도 그만큼 성공적일 것입니다!"
 ASA_Guarantee_Pensions: "연금 보장"
 ASA_Guarantee_Pensions_desc: "강력한 군대는 강력한 혜택을 받을 자격이 있습니다. 우리가 대군이 미국 전역을 행진하기를 기대한다면, 황제의 이름으로 그들이 하는 희생에 대해 보상해야 합니다."
 ASA_American_Imperial_Guard: "아메리카 제국 근위대"
 ASA_American_Imperial_Guard_desc: "연방 방위군은 황제에게 완전히 그리고 절대적으로 충성하는 정예 전투 부대로 확장되고 개혁되어야 합니다. 이것은 제국 근위대로 알려질 것입니다."
 ASA_McClellan_Will_Lead_The_Way: "맥클렐런이 길을 이끌 것이다"
 ASA_McClellan_Will_Lead_The_Way_desc: "맥클렐런 황제는 국가를 안정시키고 개혁하는 데 성공했습니다. 진정으로, 그는 이 나라를 위대함으로 이끌고 그 위신을 회복할 수 있음을 증명했습니다."
 asa_referendum_in_Connecticut_1_a_tt: "코네티컷 시민들이 [ASA.GetNameDef]에 합류할지에 대한 국민 투표를 할 것입니다."
 asa_referendum_in_Connecticut_1_b_tt: "우리는 코네티컷 시민들이 국민 투표를 하는 것을 허용하지 않을 것입니다."
 asa_referendum_in_Connecticut_8_tt: "우리는 우리의 정당한 영토인 코네티컷을 차지할 것입니다."
