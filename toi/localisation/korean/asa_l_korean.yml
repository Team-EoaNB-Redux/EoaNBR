 asa_meeting_with_protestors.0.t: "회담 시작"
 asa_meeting_with_protestors.0.desc: "시위자들과의 회담이 시작되었습니다. 양측 대표들은 이번 회담이 잘 될 것이라고 크게 기대하지는 않지만, 충분한 타협이 있다면 합의에 도달할 가능성이 전혀 없지는 않습니다."
