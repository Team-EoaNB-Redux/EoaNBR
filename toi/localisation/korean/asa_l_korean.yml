 ASA_Loyalty_To_The_Flag_Idea: "깃발에 대한 충성심"
 ASA_Loyalty_To_The_Flag_Idea_desc: "워싱턴을 지지했던 진정으로 충성스러운 미국인들은 성조기와 임시 깃발에 충성을 맹세했습니다. 성조기는 우리의 혁명적 뿌리, 끝없는 인내를 상기시킵니다. 닻은 다가오는 폭풍 속에서도 국가가 흔들리지 않도록 상기시킵니다."
 ASA_McClellan_Popularity: "맥클렐런의 인기: [?asa_mcclellan_popularity]"
 ASA_McClellan_Popularity_desc: "조지 B. 맥클렐런 장군은 그의 병사들과 국민들 사이에서 매우 인기가 높습니다. 최근 미합중국 붕괴와 그로 인한 경제적 어려움으로 인해, 맥클렐런은 자신의 재산을 가장 고통받는 사람들을 먹여 살리고 재정적으로 지원하는 데 사용해왔습니다. 이러한 행동의 결과로, 장군을 중심으로 한 인격 숭배가 형성되었고 매일 점점 더 많은 구성원들을 얻고 있습니다."
