 asa_elections.22.t: "1872년 선거 시작!"
 asa_elections.22.desc: "오늘, 1872년 대통령 선거의 첫 번째 후보가 자신의 출마를 공식적으로 발표했습니다. 곧 여러 사람들이 역사에 이름을 남기기 위해 여러 번 출마를 발표할 것입니다. 해가 지남에 따라 후보자 수는 줄어들어 국민들이 투표할 최종 후보자가 남게 될 것입니다."
 asa_elections.22.a: "이제 선거 운동을 할 시간이다."
 asa_elections.23.t: "1872년 민주당 후보 지명!"
 asa_elections.23.desc: "오늘, 민주당 전국위원회(DNC)가 모여 대통령 후보를 공식적으로 지명했습니다. 조지 B. 맥클렐런은 여전히 많은 민주당원들의 지지를 받고 있지만, 호레이쇼 시모어라는 이름의 도전자가 당내에서 급부상했습니다. 모든 대의원 투표가 집계된 후, 민주당 후보는 공식적으로..."
 asa_elections.23.a: "가장 유력한 후보, 조지 B. 맥클렐런!"
 asa_elections.23.b: "현직 대통령, 조지 맥클렐런!"
 asa_elections.23.c: "새롭게 떠오른 후보, 호레이쇼 시모어!"
 asa_elections.23.d: "이건 무의미하다."
 asa_elections.24.t: "1872년 공화당 후보 지명!"
 asa_elections.24.desc: "오늘, 공화당 전국위원회(RNC)가 모여 대통령 후보를 공식적으로 지명했습니다. 지난번처럼, 급진파와 강경파 사이의 이념적 분열로 인해 양측이 코커스 라인을 따라 투표했습니다. 그러나 투표가 집계되자, 후보는 궁극적으로..."
 asa_elections.24.a: "급진파, 갈루샤 A. 그로우!"
 asa_elections.24.b: "현직 대통령, 갈루샤 A. 그로우!"
 asa_elections.24.c: "강경파, 조지 W. 캐스!"
 asa_elections.24.d: "그들은 소식을 듣지 못했나?"
