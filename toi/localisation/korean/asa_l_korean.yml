 ASA_GA_Department_Of_Reuinification_desc: "연방이 붕괴된 이래로 국가는 계속해서 재건되었습니다. 이제 우리는 미국을 되찾기 위해 나설 준비가 되었습니다. 이러한 노력을 조직하기 위해, 새로운 정부 부서인 재통일부가 설립되었습니다."
 ASA_GA_War_Plans_Committee: "전쟁 계획 위원회"
 ASA_GA_War_Plans_Committee_desc: "재통일부 내에 새로운 위원회인 전쟁 계획 위원회가 설립될 것입니다. 이 위원회는 우리의 최고의 참모 장교들로 구성될 것이며, 옛 미합중국을 되찾기 위해 필요한 군사 작전을 계획할 것입니다."
 asa_isolation.2: "[ASA.GetName]이 고립주의 정책을 발표하다"
 asa_isolation.2.t: "[ASA.GetName]이 고립주의 정책을 발표하다"
 asa_isolation.2.desc: "오늘, [ASA.GetName]은 고립주의 외교적 입장을 추구할 것이며, 따라서 어떠한 국제 관계, 전쟁 또는 협정에도 참여하지 않을 것이라고 발표했습니다."
 asa_isolation.2.a: "그들은 시간을 벌고 있는 것이 틀림없다."
 asa_cont_ambition.2: "[ASA.GetName]이 대륙적 야심을 발표하다"
 asa_cont_ambition.2.t: "[ASA.GetName]이 대륙적 야심을 발표하다"
 asa_cont_ambition.2.desc: "보다 수동적인 외교 정책 입장을 선택했음에도 불구하고, [ASA.GetName]은 여전히 아메리카 대륙의 주요 플레이어가 될 것이라고 발표했습니다. [ASA.GetAdjective] 정부는 경제 동맹, 무역 협정, 방어 조약 등을 통해 소프트 파워를 행사하는 데 관심이 있는 것으로 보입니다."
 asa_cont_ambition.2.a: "아마도 아메리카 대륙에 평화가 찾아올 것이다."
 asa_legitimacy_proclamation.1.t: "정당성 선언"
 asa_legitimacy_proclamation.1.desc: "오늘, 정부는 옛 미합중국의 모든 영토가 D.C. 정부에 정당하게 속한다고 공식 선언했습니다. 또한, 다른 모든 후계 국가들은 연방에 대한 반역자이며 그렇게 다루어질 것이라고 비난했습니다."
 asa_legitimacy_proclamation.1.a: "우리는 국가를 되찾을 것이다!"
 asa_legitimacy_proclamation.2: "정당성 선언"
 asa_legitimacy_proclamation.2.t: "정당성 선언"
 asa_legitimacy_proclamation.2.desc: "오늘, [ASA.GetName]은 그들이 미합중국의 유일한 진정한 후계자이며 '반역적인 분리주의자들'에게서 도난당한 영토를 계속해서 되찾을 것이라고 발표했습니다. 우려되는 점은 그들이 캐나다 국경을 포함하여 모든 국경에 군대를 동원하고 있다는 것입니다."
 asa_legitimacy_proclamation.2.a: "이것이 국제적인 사건을 일으키지 않기를 바란다."
 asa_flavor.1.t: "새디어스 스티븐스, 정부를 비판하다"
 asa_flavor.1.desc: "대중 논평에서, 새디어스 스티븐스는 [ASA.GetNameDef]의 군사 정부를 '미국 혁명의 연극적 역할을 현실에서 연기하는 무리'라고 비난하는 신랄한 글을 썼습니다. 우리는 이것에 어떻게 대응해야 합니까?"
 asa_flavor.1.a: "국가 안보에 위협이 되니 그를 투옥하라."
 asa_flavor.1.b: "그가 자신의 생각을 말하게 하라. 그것은 그의 권리이다."
 asa_flavor.1.c: "그를 처형하라. 그는 인민의 적이다."
 asa_flavor.2.t: "새디어스 스티븐스의 죽음"
 asa_flavor.2.desc: "거의 한 달 동안 고통스러운 위장병으로 병상에 누워 있던 유명한 펜실베이니아 하원의원 새디어스 스티븐스가 8월 11일 늦은 오후에 그의 침대에서 사망했습니다. 그는 그의 가정부이자 소문난 연인 리디아 해밀턴 스미스, 그의 조카 새디어스, 그리고 두 명의 아프리카계 미국인 목사에게 둘러싸여 있었습니다. 대화 중에 그는 아프리카계 미국인의 평등한 권리를 더 많이 진전시키지 못한 자신의 무능력에 대해 한탄했지만, 그는 의심할 여지 없이 인종 평등의 옹호자로서 역사에 남을 것입니다."
 asa_flavor.2.a: "벌써부터 그가 그립다."
 asa_flavor.3.t: "선거 중단"
 asa_flavor.3.desc: "오늘, [ASA.GetLeader]는 '적절한 질서가 회복될 때까지' 국가의 모든 선거를 무기한 중단하라는 명령을 발표했습니다. 많은 사람들과 선출직 공무원들은 이것이 노골적인 권위주의로 향하는 움직임이라고 비난하며 이 명령에 항의했습니다."
 asa_flavor.3.a: "그것은 공동의 이익을 위한 것이다."
 asa_flavor.4.t: "무정부주의자 준군사조직 확산"
 asa_flavor.4.desc: "[ASA.GetAdjective] 군대가 무정부주의자 반란군으로부터 필라델피아를 탈환한 후, 그들은 소수의 무장 반란군만을 체포할 수 있었습니다. 군사 고문들은 일부 무정부주의자 준군사조직이 [ASA.GetNameDef] 전역으로 흩어져 확산되었을 수 있다고 경고합니다."
 asa_flavor.4.a: "우리는 이것을 빠르게 해결해야 한다."
 asa_flavor.5.t: "민주당의 방향"
 asa_flavor.5.desc: "민주당을 재편하려는 우리의 계획의 일환으로, 우리는 공화당과 더 비슷하게 보이기 위해 이념을 바꾸면서 우리의 정체성을 잃지 않도록 핵심 신념 중 하나를 선택해야 합니다. 우리의 모든 신념 중에서, 우리는 유지할 두 가지로 좁혔습니다. 하나는 재정 보수주의 정책입니다: 낮은 세금, 낮은 정부 지출, 규제 완화 등. 다른 하나는 사회 보수주의입니다: 예를 들어 전통적 가치와 다원주의. 그래서, 당은 어떤 정책을 유지해야 합니까?"
 asa_flavor.5.a: "재정 보수주의"
 asa_flavor.5.b: "사회 보수주의"
 asa_flavor.6.t: "뉴저지 선거 조작 보고"
 asa_flavor.6.desc: "오늘 아침, 뉴저지에서 선거 조작에 대한 산발적인 보고가 대통령의 책상에 도착했습니다. 소문에 따르면, 외지에서 온 사복을 입은 수상한 사람들이 투표소 주변에서 서성이는 것이 목격되었습니다. 일부는 이것이 단순한 히스테리라고 말하지만, 다른 사람들은 정부가 개입하여 조사해달라고 요청하고 있습니다. 우리는 무엇을 해야 합니까?"
 asa_flavor.6.a: "조사하라!"
 asa_flavor.6.b: "아무것도 아닐 것이다."
 asa_flavor.7.t: "선거 조작 발견되지 않음"
 asa_flavor.7.desc: "뉴저지 보고서에 대한 조사 후, 선거 조작의 증거는 발견되지 않았습니다. 모든 것이 정상적으로 운영되고 있는 것 같습니다."
 asa_flavor.7.a: "다행이다."
 asa_flavor.8.t: "필라델피아 선거 조작!"
 asa_flavor.8.desc: "선거 조작 보고에 대한 조사 결과, [PHL.GetNameDef]가 이웃 뉴저지 주로 요원을 보내 그 주를 자신들의 편으로 바꾸려고 시도한 것이 발견되었습니다. 이 극악무도한 행동에 어떻게 대응해야 합니까?"
 asa_flavor.8.a: "공개적으로 비난하라."
 asa_flavor.8.b: "이것은 전쟁의 구실이다."
 asa_flavor.9.t: "[ASA.GetName]이 우리를 비난하다"
 asa_flavor.9.desc: "[ASA.GetNameDef] 정부는 뉴저지 주에서의 선거 조작에 대해 우리를 비난하는 공식 서한을 발표했습니다. 이 문서는 우리가 한 일을 증명하는 모든 증거를 강조하며, 우리 국가의 많은 국민들은 이것이 그들의 정부에 의한 침공을 야기할 것이라고 믿으며 우리의 행동에 분개하고 있습니다."
 asa_flavor.9.a: "이런..."
 asa_flavor.10.t: "[ASA.GetName]이 전쟁을 선포하다!"
 asa_flavor.10.desc: "뉴저지 주에서의 우리의 선거 조작이 폭로된 것을 이유로, [ASA.GetNameDef]이 우리에게 전쟁을 선포했습니다. 필라델피아 시에 민병대가 동원되었고 푸른 군복의 군인들이 우리 국경에 줄을 서고 있습니다. 우리는 살아남을 수 있을까요?"
 asa_flavor.10.a: "우리가 끔찍한 실수를 저지른 것 같군, 그렇지 않나?"
 asa_flavor.11.t: "수상한 의회 후보들"
 asa_flavor.11.desc: "뉴저지의 일부 새로운 의회 후보들이 필라델피아 코뮌에 대해 수상할 정도로 온건하다는 소문이 돌고 있습니다. 수도의 많은 고위 관리들은 우리에게 이러한 주장을 조사해달라고 요청했지만, 일부 가까운 고문들은 이 주장이 단순한 히스테리적인 편집증이라고 일축했습니다. 우리는 이러한 주장을 어떻게 다루어야 합니까?"
 asa_flavor.11.a: "한번 조사해 보자."
 asa_flavor.11.b: "아마도 특별한 것은 없을 것이다."
 asa_flavor.12.t: "여기서는 아무것도 수상하지 않다."
 asa_flavor.12.desc: "뉴저지의 조사관들은 고발된 후보들에 대해 아무것도 수상한 점을 발견하지 못했습니다. 어쩌면 그 고발이 잘못되었을 수도 있습니다."
 asa_flavor.12.a: "상황이 좋아 보이는군."
 asa_flavor.13.t: "필라델피아 후보 홍보 발견"
 asa_flavor.13.desc: "우리 요원들의 철저한 조사를 통해 후보 중 한 명으로부터 자백을 얻어냈습니다. 그들은 필라델피아 요원들로부터 우리 정치에 영향을 미치기 위해 그들에 대해 더 부드러운 태도를 취하도록 돈을 받은 것으로 드러났습니다. 이 정보를 가지고 우리는 어떻게 해야 합니까?"
 asa_flavor.13.a: "공개 비난"
 asa_flavor.13.b: "전쟁!"
 asa_flavor.14.t: "[ASA.GetName]이 우리를 비난하다!"
 asa_flavor.14.desc: "[ASA.GetNameDef] 정부는 우리 국가의 선거에 개입하려 했다는 주장을 담은 공식 성명을 발표했습니다. 우리는 그들의 주장을 필사적으로 불신하려고 노력하고 있지만, 그들이 제시한 증거는 우리 국민 중 일부가 우리가 우리의 이상에 완전히 부합하지 않는다고 의심하게 만들었습니다."
 asa_flavor.14.a: "이것은 좋지 않다."
 asa_flavor.15.t: "[ASA.GetAdjective]-[PHL.GetAdjective] 전쟁"
 asa_flavor.15.desc: "[ASA.GetNameDef]는 우리가 그들의 선거에 개입했다는 주장을 내세우며 우리에게 전쟁을 선포했습니다. 이것은 우리가 [ASA.GetAdjective]의 침략에 저항해야 하는 두 번째이며, 우리는 분명히 필라델피아 시에 큰 피해를 입힐 또 다른 잔혹한 전쟁을 준비해야 할 것입니다."
 asa_flavor.15.a: "누가 탄약을 좀 빨리 전해줘."
 asa_flavor.16.t: "뉴저지 화재"
 asa_flavor.16.desc: "지난밤, 뉴저지 수도인 트렌턴에서 화재가 발생했습니다! 다행히 소방서가 신속하게 출동하여 불은 빨리 진압되었습니다. 그럼에도 불구하고, 이것은 주 시민들에게는 큰 충격을 주었지만, 내각의 고문들에게는 더 큰 충격을 주었습니다. [PHL.GetAdjective]에 의해 도시에서 사보타주와 개입이 발생했다는 의심이 있었습니다. 그러나, 조사에 필요한 자원이 다른 프로젝트를 유지하는 데 더 잘 쓰일 것이라고 생각하는 사람들도 많습니다. 우리는 무엇을 해야 합니까?"
 asa_flavor.16.a: "화재를 조사하라."
 asa_flavor.16.b: "화재가 끝난 것에 감사하자."
 asa_flavor.17.t: "조사 결과"
 asa_flavor.17.desc: "트렌턴 화재에 대한 조사는 결정적이지 않은 결과로 끝났습니다. 화재의 정확한 원인은 불확실하지만, 인위적인 결정적인 증거는 찾지 못했습니다. 아마도 누군가 파이프의 재를 잘못 버리거나 다른 이유로 인해 발생했을 가능성이 높습니다."
 asa_flavor.17.a: "아, 그럼 오경보였군."
 asa_flavor.18.t: "조사 결과"
 asa_flavor.18.desc: "트렌턴 화재에 대한 조사는 필라델피아 정부가 그날 밤의 사건에 책임이 있다는 것을 밝혀냈습니다. 요원이 일주일 전에 국경을 넘어 잠입하여 지역에 혼란을 야기하기 위해 주 의사당 근처에서 불을 지른 것으로 보입니다. 이것은 신흥 '코뮌'에 의한 우리의 주권에 대한 노골적인 침해이며, 무력으로 반격해야 한다는 강력한 압력이 있습니다. 우리는 어떻게 대응해야 합니까?"
 asa_flavor.18.a: "우리는 아직 준비되지 않았다. 대신 공개 비난을 발표하라."
 asa_flavor.18.b: "이 사람들에 대한 나의 인내심은 바닥났다. 전쟁을 선포하라!"
 asa_flavor.19.t: "[ASA.GetName]이 우리를 비난하다"
 asa_flavor.19.desc: "[ASA.GetAdjective] 정부는 우리가 트렌턴 주 의사당 근처 화재에 책임이 있다는 증거를 가지고 있다고 주장하는 성명을 발표했습니다. 이러한 주장은 전적으로 정확하지만, 우리는 우리가 그런 비열한 방법을 사용하고 민간인들을 위험에 빠뜨렸다는 것을 우리 국민들에게 알릴 수 없습니다."
 asa_flavor.19.a: "그들이 알지 못했으면 좋았을 텐데."
 asa_flavor.51.t: "장교 반란!"
 asa_flavor.51.desc: "장교단, 병사, 그리고 일부 장군들이 뉴욕 북부에서 집결하여 '워싱턴의 독재'를 무너뜨리기 위한 새로운 정부 수립을 선언했습니다. 맥클렐런은 펜실베이니아 북부 국경에 병사들을 배치하고 예비군을 소집할 준비를 했습니다. 우리는 한동안 부대 내에 가능한 배신이 있을 것으로 의심했지만, 이 정도 규모, 정교함 또는 조직적인 것을 의심하지는 않았습니다."
 asa_flavor.51.a: "이런..."
 asa_flavor.53.t: "장교 반란의 종결"
 asa_flavor.53.desc: "반역적인 장군들이 지휘하는 반란군 병사들은 결정적으로 패배하고 전멸했습니다. 맥클렐런 대통령이 반란군의 최후의 저항으로 여전히 연기가 피어오르는 전장을 내려다보자, 한 보좌관이 그에게 모든 반대자들이 파괴되었으니 이제 무엇을 할 것인지 물었습니다. 잠시 생각한 후, 장군은 대답했습니다..."
 asa_flavor.53.a: "우리는 현재의 노선을 유지할 것이다. 나는 이 사건들로 인해 좌절하지 않는다."
 asa_flavor.53.b: "내가 내 유산을 확보해야 한다는 것이 아주 분명해졌다. 급진적인 해결책이 실행되어야 한다."
 asa_flavor.55.t: "반역적인 장교들에 대한 소문"
 asa_flavor.55.desc: "맥클렐런의 [ROOT.GetNameDef]에서의 급격한 총력 장악에 일부 육군 장교들이 만족하지 않는다는 소문이 돌고 있습니다. 일부는 그에 대한 반란, 심지어 쿠데타가 계획되고 있다고 믿습니다."
 asa_flavor.55.a: "그것이 소문으로만 남기를 바란다."
 asa_flavor.56.t: "뉴욕의 암흑"
 asa_flavor.56.desc: "중앙 정부와 뉴욕 간의 통신이 갑자기 끊겼습니다. 하원의원과 상원의원들은 의회 회의에 아무도 나타나지 않았고, 그 주로 보낸 전령들도 돌아오지 않았습니다."
 asa_flavor.56.a: "대체 무슨 일이 벌어지고 있는 거지?"
 asa_flavor.57.t: "시워드 선언"
 asa_flavor.57.desc: "오늘 아침, [FROM.GetNameDef]의 대통령 [FROM.GetLeader]는 [FROM.GetNameDef]가 옛 [USA.GetNameDef]의 모든 영토를 가로질러 확장하고 새로운 연방으로 재편성하려는 그들의 열망을 선언했습니다. 그 후, 그들은 아메리카 대륙 전체에 걸쳐 군사 작전을 시작하고 미네소타 주 세인트 폴에 수도를 둔 '대미 연합'을 창설할 계획을 발표했습니다.\n\n시워드의 불타는 수사는 [FROM.GetNameDef]가 얼마 전에 선포되었을 뿐이라서 아메리카 대륙의 사람들에게 놀라움을 주었고, 많은 사람들은 [ASA.GetNameDef]가 발표된 목표를 달성할 능력이 있는지 의문을 제기합니다."
 asa_flavor.57.a: "우려해야 할까?"
 asa_flavor.57.b: "그들에게 행운을 빈다. 그들은 그것이 필요할 것이다."
 asa_flavor.57.c: "우리의 운명을 개척할 것이다!"
 asa_elections.40: "[GetYear] 비상 선거"
 asa_elections.40.t: "[GetYear] 비상 선거"
 asa_elections.40.desc: "맥클렐런 대통령 [ASA.GetLeader]는 [ASA.GetName] 전역에서 비상 선거를 요구하는 초당적인 의회 법안을 통과시켰습니다. 투표는 다음 7일 동안 진행될 것입니다."
 asa_elections.40.a: "어떻게 될지 지켜보자."
 asa_emergency_election_1_tt: "선거 결과는 7일 후에 발표될 것입니다."
 asa_elections.41.t: "비상 선거 교착 상태"
 asa_elections.41.desc: "최종 집계 결과는 새디어스 스티븐스와 윌리엄 H. 시워드 사이의 승패를 가르기에는 너무 근소했습니다. 따라서 [ASA.GetNameDef]의 대통령 투표는 하원에서 결정하도록 보내졌습니다. 그곳에서도 상황은 그리 좋지 않았습니다. 하원 의원들은 나머지 국가들과 마찬가지로 교착 상태에 빠졌습니다. 갑작스럽게, 많은 격렬한 논쟁과 토론 끝에..."
 asa_elections.41.a: "새디어스 스티븐스가 대통령으로 선출되었다!"
 asa_elections.41.b: "윌리엄 H. 시워드가 대통령으로 선출되었다!"
 asa_elections.41.c: "조지 B. 맥클렐런이 직접 나섰다..."
 asa_elections.1.t: "1864년 선거 시작!"
 asa_elections.1.desc: "오늘, 1864년 대통령 선거의 첫 번째 후보가 자신의 출마를 공식적으로 발표했습니다. 곧 여러 사람들이 역사에 이름을 남기기 위해 여러 번 출마를 발표할 것입니다. 해가 지남에 따라 후보자 수는 줄어들어 국민들이 투표할 최종 후보자가 남게 될 것입니다."
 asa_elections.1.a: "우리가 이기길 바란다."
 asa_elections.2.t: "민주당 후보 지명"
 asa_elections.2.desc: "민주당이 대통령 후보를 공식적으로 지명했습니다. 많은 후보들이 출마하여 상당한 지지를 얻었지만, 지명이..."
 asa_elections.2.a: "조지 맥클렐런에게 돌아갔다는 사실은 아무도 놀라지 않았다."
 asa_elections.2.b: "현직 대통령, 조지 B. 맥클렐런에게 돌아갔다."
 asa_elections.2.c: "나에게 돌아갔다!"
 asa_elections.3.t: "공화당 후보 지명"
 asa_elections.3.desc: "공화당이 대통령 후보를 공식적으로 지명했습니다. 비록 당은 강경파와 급진파로 상당히 분열되어 있지만, 한 후보가 대다수의 대의원을 확보할 수 있었습니다:"
 asa_elections.3.a: "급진파, 새디어스 스티븐스"
 asa_elections.3.b: "현직 대통령, 새디어스 스티븐스"
 asa_elections.3.c: "강경파, 윌리엄 시워드"
 asa_elections.3.d: "현직, 윌리엄 H. 시워드"
 asa_elections.3.e: "그들은 소식을 듣지 못했나?"
 asa_elections.5.t: "민주당 캠페인"
 asa_elections.5.desc: "오늘, 조지 B. 맥클렐런과 그의 지지자들은 그들의 지명을 위한 지지를 얻기 위해 [ASA.GetNameDef]에서 캠페인을 벌였습니다."
 asa_elections.5.a: "잘 된 것 같다."
 asa_elections.5.b: "이제 와서 캠페인이 무슨 소용이지?"
 asa_elections.6.t: "공화당 캠페인"
 asa_elections.6.desc: "오늘, [asa_1864_republican_candidate]와 그의 지지자들은 그들의 지명을 위한 지지를 얻기 위해 [ASA.GetNameDef]에서 캠페인을 벌였습니다."
 asa_elections.6.a: "국민들이 과격한 정책을 받아들일까?"
 asa_elections.6.b: "좋은 온건한 목소리다."
 asa_elections.6.c: "그들은 소식을 듣지 못했나?"
 asa_elections.7.t: "1864년 대통령 선거"
 asa_elections.7.desc: "오늘이 몇 달 동안 준비된 날입니다. 전국 각지의 사람들이 대통령 선거에 투표했습니다. 후보자들은 바로 이 순간을 위해 거의 매주 캠페인을 벌였습니다. 궁극적으로, 승자는..."
 asa_elections.7.a: "조지 B. 맥클렐런!"
 asa_elections.7.b: "윌리엄 H. 시워드!"
 asa_elections.7.c: "새디어스 스티븐스!"
 asa_elections.7.d: "모두 중단하라."
 asa_elections.8.t: "1865년 취임식"
 asa_elections.8.desc: "오늘, [asa_1864_winner]가 대서양 연합의 대통령으로 취임했습니다. 그가 대서양 연합 국민들에게 취임 연설을 할 때 군중이 국회 의사당 건물 밖에 모였습니다. 그의 임기가 번창할지는 시간이 말해줄 것입니다."
 asa_elections.8.a: "축하합니다, 맥클렐런 대통령"
 asa_elections.8.b: "축하합니다, 시워드 대통령"
 asa_elections.8.d: "두 번째 임기를 위한 시간이다."
 asa_elections.8.c: "두 번째 임기를 위한 시간이다."
 asa_elections.8.e: "두 번째 임기를 위한 시간이다."
 asa_elections.8.f: "두 번째 임기를 위한 시간이다."
 asa_elections.8.g: "모두 중단하라."
 asa_1864_republican_candidate_stevens: "새디어스 스티븐스"
 asa_1864_republican_candidate_seward: "윌리엄 시워드"
 asa_1864_winner_stevens: "새디어스 스티븐스"
 asa_1864_winner_seward: "윌리엄 헨리 시워드"
 asa_1864_winner_mcclellan: "조지 브린턴 맥클렐런"
 asa_elections.13.t: "1868년 선거 시작!"
 asa_elections.13.desc: "오늘, 1868년 대통령 선거의 첫 번째 후보가 자신의 출마를 공식적으로 발표했습니다. 곧 여러 사람들이 역사에 이름을 남기기 위해 여러 번 출마를 발표할 것입니다. 해가 지남에 따라 후보자 수는 줄어들어 국민들이 투표할 최종 후보자가 남게 될 것입니다."
 asa_elections.13.a: "이제 선거 운동을 할 시간이다."
 asa_elections.14.t: "1868년 민주당 후보 지명!"
 asa_elections.14.desc: "오늘, 민주당 전국위원회(DNC)가 모여 대통령 후보를 공식적으로 지명했습니다. 모든 대의원 투표가 집계된 후, 민주당 후보는 놀랍지 않게도..."
 asa_elections.14.a: "가장 유력한 후보, 조지 B. 맥클렐런!"
 asa_elections.14.b: "현직 대통령, 조지 맥클렐런!"
 asa_elections.14.c: "도전자, 호레이쇼 시모어!"
 asa_elections.14.d: "이건 무의미하다."
 asa_elections.15.t: "1868년 공화당 후보 지명!"
 asa_elections.15.desc: "오늘, 공화당 전국위원회(RNC)가 모여 대통령 후보를 공식적으로 지명했습니다. 지난번처럼, 급진파와 강경파 사이의 이념적 분열로 인해 양측이 코커스 라인을 따라 투표했습니다. 그러나 투표가 집계되자, 후보는 궁극적으로..."
 asa_elections.15.a: "급진파, 갈루샤 A. 그로우!"
 asa_elections.15.b: "현직 대통령, 갈루샤 A. 그로우!"
 asa_elections.15.c: "강경파, 윌리엄 시워드!"
 asa_elections.15.d: "현직 대통령, 윌리엄 시워드!"
 asa_elections.15.e: "그들은 소식을 듣지 못했나?"
 asa_elections.17.t: "민주당 캠페인"
 asa_elections.17.desc: "오늘, 조지 B. 맥클렐런과 그의 지지자들은 그들의 지명을 위한 지지를 얻기 위해 [ASA.GetNameDef]에서 캠페인을 벌였습니다."
 asa_elections.17.a: "민주당 강령이 매력적인지 보자."
 asa_elections.17.b: "이제 선거 운동을 하는 것은 의미가 없다."
 asa_elections.18.t: "공화당 캠페인"
 asa_elections.18.desc: "오늘, [asa_1868_republican_candidate]와 그의 지지자들은 그들의 지명을 위한 지지를 얻기 위해 [ASA.GetNameDef]에서 캠페인을 벌였습니다."
 asa_elections.18.a: "온건파가 국민들에게 어필할 것이다."
 asa_elections.18.b: "급진적인 강령이 통하는지 보자."
 asa_elections.18.c: "그들은 소식을 듣지 못했나?"
 asa_elections.19.t: "1868년 대통령 선거"
 asa_elections.19.desc: "오늘, 전국 각지의 유권자들이 대서양 연합의 대통령을 위해 투표했습니다. 투표가 집계되자 승자는 분명해집니다:"
 asa_elections.19.a: "맥클렐런 승리!"
 asa_elections.19.b: "시워드 승리!"
 asa_elections.19.c: "그로우 승리!"
 asa_elections.19.d: "시모어 승리!"
 asa_elections.19.e: "모두 중단하라."
 asa_elections.20.t: "1869년 취임식"
 asa_elections.20.desc: "오늘, [asa_1868_winner]가 성공적인 대통령 출마 후 국회 의사당 언덕에서 취임했습니다. 지지자들의 군중이 모여 취임 연설을 들었고, 대통령에게 기립 박수를 보냈습니다. 다른 후보들과 전직 대통령들은 국가를 위해 대통령이 잘해주기를 바라며 단합의 표시로 참석했습니다."
 asa_elections.20.a: "축하합니다, 맥클렐런 대통령!"
 asa_elections.20.b: "축하합니다, 시워드 대통령!"
 asa_elections.20.c: "축하합니다, 그로우 대통령"
 asa_elections.20.d: "두 번째 임기를 축하합니다, 맥클렐런 대통령"
 asa_elections.20.e: "두 번째 임기를 축하합니다, 시워드 대통령"
 asa_elections.20.f: "선출을 축하합니다, 그로우 대통령"
 asa_elections.20.g: "축하합니다, 시모어 대통령"
 asa_elections.20.h: "군중을 해산하고 중단하라."
