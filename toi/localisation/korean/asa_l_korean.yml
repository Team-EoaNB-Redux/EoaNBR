 asa_isolation.1: "[ASA.GetLeader]가 고립주의 정책을 발표하다"
 asa_isolation.1.t: "[ASA.GetLeader]가 고립주의 정책을 발표하다"
 asa_isolation.1.desc: "오늘, [ASA.GetLeader]는 [ASA.GetName]이 당분간 세계에서 고립주의를 추구할 것이라고 발표했습니다. [ASA.GetLeader]는 [ASA.GetName]이 국내의 정치적, 경제적 문제를 해결할 때까지 이 정책을 유지할 것이라고 말했습니다."
 asa_isolation.1.a: "당분간은 안전하게 가는 것이 최선이다."
 asa_cont_ambition.1: "[ASA.GetLeader]가 대륙적 야심을 발표하다"
 asa_cont_ambition.1.t: "[ASA.GetLeader]가 대륙적 야심을 발표하다"
 asa_cont_ambition.1.desc: "오늘, [ASA.GetLeader]는 아메리카 대륙에서 '소프트 파워' 원칙을 활용할 계획이라고 발표했습니다. 그는 경제적 거래, 동맹 및 지원을 통해 미국 대서양 연합을 아메리카 무대의 주요 플레이어로 만들 계획입니다."
 asa_cont_ambition.a: "우리는 여전히 자유의 등불이다."
 asa_mcclellan.11.t: "[ASA.GetName]이 우리에게 합류할 것을 '요청'하다"
 asa_mcclellan.11.desc: "[ASA.GetNameDef]에서 온 사절이 우리 정부에 '우리에게 합류하거나, 우리가 당신을 합류하게 만들겠다'는 최후 통첩을 전달했습니다. 최고 고문들은 모두 그 제안의 직설적인 태도에 똑같이 충격을 받았지만, 곧 우리가 [ASA.GetNameDef]에 합류해야 하는지에 대해 논쟁이 벌어졌습니다. 절반은 시민들의 안전을 위해 합류해야 한다는 의견입니다. 나머지 절반은 외국 세력의 무자비한 공격에 맞서 우리의 독립을 유지해야 한다고 선언합니다."
 asa_mcclellan.11.a: "우리는 그들에게 합류할 것이다."
 asa_mcclellan.11.b: "우리는 우리의 주권을 포기하지 않을 것이다!"
 asa_mcclellan.12.t: "[WVG.GetName]이 재통일을 수락하다"
 asa_mcclellan.12.desc: "[WVG.GetAdjective]인들은 우리가 옛 미합중국 전역으로 확장하는 데 동참하겠다는 현명한 결정을 내렸습니다. 그들의 군대는 우리 군대에 통합되었으며, 그들의 시민들은 [ASA.GetNameDef] 내에서 완전한 시민권을 부여받았습니다. 이것은 미국 재통일로 향하는 길의 한 걸음에 불과하며, 많은 이들이 이것이 미래에도 계속되기를 희망합니다."
 asa_mcclellan.12.a: "돌아온 것을 환영한다!"
 asa_state_events.3.t: "[WVG.GetName]이 재통일을 거부하다"
 asa_state_events.3.desc: "[WVG.GetAdjective]인들은 우리의 평화로운 재통일 제안을 거부하는 현명하지 못한 결정을 내렸습니다. 그들의 군대는 현재 비상 경계 태세에 있으며, 그들의 영토로의 침입을 저지하기 위해 준비하고 있습니다. 이제, 각하, 당신과 저는 이런 반역자들이 어떻게 다루어져야 하는지 알고 있습니다."
 asa_state_events.3.a: "반역자들에게 죽음을, 성조기여 영원하라"
 asa_state_events.4: "[ASA.GetName]가 코네티컷의 운명을 결정하기 위한 국민 투표를 제안하다"
 asa_state_events.4.t: "[ASA.GetName]가 코네티컷의 운명을 결정하기 위한 국민 투표를 제안하다"
 asa_state_events.4.desc: "코네티컷은 우리와 [ASA.GetName] 사이의 분쟁 지역이었습니다. 그 결과, [ASA.GetName]는 코네티컷 주민들이 어느 나라의 일부가 될지 결정하도록 허용하자고 제안했습니다."
 asa_state_events.4.a: "국민 투표를 허용한다"
 asa_referendum_in_connecticut_1_a_tt: "§GA Referendum Will Be Held On The Fate Of Connecticut§!"
 asa_state_events.4.b: "국민 투표를 허용하지 않는다"
 asa_referendum_in_connecticut_1_b_tt: "§RA Referendum Will Not Be Held On The Fate Of Connecticut§!"
 asa_state_events.5.t: "코네티컷 국민 투표"
 asa_state_events.5.desc: "오늘, 코네티컷 주민들이 코네티컷 지위 국민 투표에 투표하기 위해 몰려들고 있습니다. 이것은 코네티컷 주가 [NEG.GetNameDef]와 함께 남을지, 아니면 [ASA.GetNameDef]에 합류할지 결정할 것입니다."
 asa_state_events.5.a: "어떻게 진행되는지 보자"
 asa_state_events.6: "[NEG.GetName]이 국민 투표를 허용하지 않는다"
 asa_state_events.6.t: "[NEG.GetName]이 국민 투표를 허용하지 않는다"
 asa_state_events.6.desc: "오늘 연설에서, [NEG.GetNameDef]의 대통령 [NEG.GetLeader]는 코네티컷 국민 투표가 열리지 않을 것이라고 발표했습니다."
 asa_state_events.6.a: "이것은 터무니없다! 우리는 코네티컷을 해방시켜야 한다!"
 asa_state_events.6.b: "결국 그들은 타협할 생각이 없는 것 같군..."
 asa_state_events.7: "코네티컷이 [ASA.GetName]에 합류하기로 투표하다"
 asa_state_events.7.t: "코네티컷이 [ASA.GetName]에 합류하기로 투표하다"
 asa_state_events.7.desc: "국민 투표 결과는 오늘 [CSA.GetName]의 제3자 사절에 의해 발표되었습니다. 코네티컷 주민들은 압도적으로 [ASA.GetName]에 합류하기로 투표했습니다!"
 asa_state_events.7.a: "훌륭한 소식이다!"
 asa_state_events.8: "코네티컷이 [NEG.GetName]와 함께 남기로 투표하다"
 asa_state_events.8.t: "코네티컷이 [NEG.GetName]와 함께 남기로 투표하다"
 asa_state_events.8.desc: "국민 투표 결과는 오늘 [CSA.GetName]의 제3자 사절에 의해 발표되었습니다. 불행히도, 코네티컷 주민들은 [NEG.GetName]와 함께 남기로 투표했습니다."
 asa_state_events.8.a: "보스턴이 투표를 조작했다!"
 asa_state_events.8.b: "시도할 만한 가치가 있었다..."
 asa_state_events.9: "코네티컷이 우리와 함께 남기로 투표하다"
 asa_state_events.9.t: "코네티컷이 우리와 함께 남기로 투표하다"
 asa_state_events.9.desc: "국민 투표 결과는 오늘 [CSA.GetName]의 제3자 사절에 의해 발표되었습니다. 다행히도, 코네티컷 주민들은 우리와 함께 남기로 투표했습니다."
 asa_state_events.9.a: "그들이 올바른 선택을 할 줄 알았어."
 asa_state_events.10: "코네티컷이 [ASA.GetName]에 합류하기로 투표하다"
 asa_state_events.10.t: "코네티컷이 [ASA.GetName]에 합류하기로 투표하다"
 asa_state_events.10.desc: "국민 투표 결과는 오늘 [CSA.GetName]의 제3자 사절에 의해 발표되었습니다. 불행히도, 코네티컷 주민들은 압도적으로 [ASA.GetName]에 합류하기로 투표했습니다."
 asa_state_events.10.a: "워싱턴이 투표를 조작했다!"
 asa_state_events.10.b: "만약 그것이 국민이 원하는 것이라면..."
 asa_state_events.11: "코네티컷 해방"
 asa_state_events.11.t: "코네티컷 해방"
 asa_state_events.11.desc: "[ASA.GetAdjective] 군대가 코네티컷 전역을 점령하고 확보했습니다. [NEG.GetName]는 우리에게 영토를 넘겨줄 수밖에 없습니다."
