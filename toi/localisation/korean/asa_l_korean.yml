 asa_counter_coup.1.t: "스티븐스의 쿠데타"
 asa_counter_coup.1.desc: "오늘 아침, 태디어스 스티븐스와 그의 지지자들이 워싱턴 D.C.로 행진했습니다. 그동안 최근 정부를 쿠데타로 장악한 군부 정권은 미래에 국가를 어떻게 통치할지 논쟁하고 있었습니다. 스티븐스의 지지자들은 국회의사당 밖의 경비병들을 제압하고 군부 정권이 회의 중인 의사당으로 난입했습니다. 그날 아침이 끝날 무렵, 태디어스 스티븐스는 공화국에 민주주의가 복원되었음을 선언하는 성명서를 발표했습니다."
 asa_counter_coup.1.a: "민주주의는 아직 죽지 않았다"
 asa_imperial_palace.1.t: "황궁 건설"
 asa_imperial_palace.1.desc: "오늘 필라델피아에 황궁이 완공되었습니다. 황제는 그의 영광을 기념하는 국경일로 제정할 만큼 중대한 행사입니다. 비록 황궁이 필라델피아 시를 빛내는 경이롭고 웅장한 광경이지만, 어떤 이들은 황제가 수도를 새로운 궁전으로 옮길지, 아니면 워싱턴 D.C.에 그대로 둘지 궁금해합니다."
 asa_imperial_palace.1.a: "수도를 내 이름을 딴 맥클렐런 시로 옮기겠다!"
 asa_imperial_palace.1.b: "수도를 원래 자리인 워싱턴 D.C.에 두겠다"
 asa_arrest_protest_leaders.2.t: "체포 성공!"
 asa_arrest_protest_leaders.desc: "우리 요원들은 시위 지도자 중 한 명을 아무도 모르게 순조롭고 성공적으로 체포했다고 보고했습니다."
 asa_arrest_protest_leaders.a: "이 사실을 비밀에 부치자"
 asa_arrest_protest_leaders.3.t: "체포가 거의 실패할 뻔했다"
 asa_arrest_protest_leaders.3.desc: "우리 요원들은 발각될 위험이 너무 커서 시위 지도자를 은밀하게 체포할 수 없었습니다. 다행히도 아무도 그들을 의심하지 않는 것 같습니다."
 asa_arrest_protest_leaders.3.a: "아무도 못 봤기를 바라자"
 asa_arrest_protest_leaders.4.t: "체포자가 잡혔다!"
 asa_arrest_protest_leaders.4.desc: "시위 지도자 중 한 명을 억류하려던 우리 요원이 붙잡혀 얼굴이 노출되는 것을 피하기 위해 급히 현장을 벗어나야 했습니다. 불행히도 뉴욕 타임즈는 '잠입한 연방 요원들이 붙잡히다'라는 다음 호의 헤드라인 초안을 우리에게 넘겼습니다."
 asa_arrest_protest_leaders.4.a: "다가올 폭풍우에 대비할 시간이다"
 asa_arrest_protest_leaders.5.t: "탄핵되다!"
 asa_arrest_protest_leaders.5.desc: "오늘, [ASA.GetLeader] 대통령이 헌법 제1조 수정안의 권리를 행사하는 시위자들을 체포하기 위해 연방 요원을 사용했다는 이유로 미국 의회에 의해 탄핵되는 역사적인 날이 되었습니다."
 asa_arrest_protest_leaders.5.a: "나라를 위해, 나는 물러나야 한다"
 asa_arrest_protest_leaders.5.b: "나는 잘못한 게 없다"
 asa_arrest_protest_leaders.6.t: "상원, 대통령 유죄 판결 및 축출에 투표하다"
 asa_arrest_protest_leaders.6.desc: "오늘 아침, 상원은 탄핵 재판을 마쳤고, 대통령에게 형사상 유죄 판결을 내리고 그를 직위에서 해임하는 데 투표했습니다. 참모총장을 포함한 일부 내각 구성원들은 이 모든 일이 있은 후 사임하는 것이 나라를 위해 건전할 것이라고 제안했습니다. 일부 백악관 변호사를 포함한 다른 내각 구성원들은 상원의 결정에 이의를 제기하기를 원합니다. 우리는 어떻게 해야 할까요?"
 asa_arrest_protest_leaders.6.a: "의회가 말했으니"
 asa_arrest_protest_leaders.6.b: "우리는 투표에 이의를 제기해야 한다"
 asa_arrest_protest_leaders.8.t: "대법원, 의회의 편에 서다"
 asa_arrest_protest_leaders.8.desc: "오늘 아침, 대법원은 미국 상원 대 [ASA.GetLeader]라는 획기적인 사건에 대해 판결을 내렸습니다. 각 측의 주장을 몇 시간 동안 들은 후, 대법원은 근소한 차이로 현직 대통령에게 유죄를 선고하고 직위에서 해임하는 상원의 결정에 결국 동의했습니다."
 asa_arrest_protest_leaders.8.a: "이제 할 수 있는 게 아무것도 없다..."
 asa_arrest_protest_leaders.8.b: "군대에 상황을... 바로잡으라고 명령한다"
 asa_arrest_protest_leaders.11.t: "군대가 통제권을 장악하다"
 asa_arrest_protest_leaders.11.desc: "오늘, 워싱턴 D.C.에 주둔한 육군 병력들이 의회와 대법원의 회의장에 진입했습니다. 한 시간 후, 대법원장과 상원 다수당 원내대표는 갑자기 대통령에 대한 모든 혐의를 취하하겠다고 발표했습니다. 이 갑작스러운 발표는 분명히 국민들에게 의심을 불러일으켰고, 오늘 의회 회의장에 없었던 일부 상원의원들은 갑자기 고향으로 떠났습니다."
 asa_arrest_protest_leaders.11.a: "이것으로 인해 분명히 후폭풍이 있을 것이다"
 asa_arrest_protest_leaders.12.t: "군대, 명령에 불복하다"
 asa_arrest_protest_leaders.12.desc: "놀랍게도 워싱턴 D.C.에 주둔한 장교들은 의회와 대법원을 장악하라는 대통령의 명령에 불복하고 대신 대통령의 명령을 언론에 공개하기로 결정했습니다."
 asa_arrest_protest_leaders.12.a: "이제 나에게 선택권은 없는 것 같군..."
 asa_arrest_protest_leaders.13.t: "입헌주의 반군이 들고 일어나다"
 asa_arrest_protest_leaders.13.desc: "북부의 반군들이 무장하고 워싱턴 D.C.의 대통령에게 공개적으로 반란을 선언했습니다. 이미 주 방위군은 동원되어 전선으로 행진했습니다. 이것은 최근 대통령의 행동에 대한 반발 때문에 놀라운 일이 아닙니다."
 asa_arrest_protest_leaders.13.a: "반역자들에게 죽음을!"
 asa_arrest_protest_leaders.13.b: "성조기여 영원하라!(반군으로 플레이)"
 generic_shipping_raids.1.t: "상선들이 습격당하고 있다!"
 generic_shipping_raids.1.desc: "대서양에서 선박들이 습격당하고 침몰하고 있다는 상인들의 불온한 보고가 들어오고 있습니다. 우리 고문들은 이 주장을 조사하기 위해 어떤 종류의 해군력을 조직할 것을 제안하고 있습니다."
 generic_shipping_raids.1.a: "조사를 위해 대규모 해군력을 조직한다"
 generic_shipping_raids.1.b: "조사를 위해 중간 규모의 해군력을 조직한다"
 generic_shipping_raids.1.c: "조사를 위해 소규모 순찰 부대를 조직한다"
 generic_shipping_raids.1.d: "불행히도 여분의 함선이 없다"
 generic_shipping_raids.2.t: "해군 부대는 아무것도 찾지 못했다"
 generic_shipping_raids.2.desc: "습격 보고를 조사하기 위해 보냈던 해군 부대는 불확실한 결과를 내놓았습니다. 따라서 그들은 항구로 돌아오라는 명령을 받았습니다."
 generic_shipping_raids.2.a: "어쩌면 처음부터 위협은 없었는지도 모른다"
 generic_shipping_raids.3.t: "해적 발견!"
 generic_shipping_raids.3.desc: "수평선 너머로, 불타는 상선의 선체에서 멀어지고 있는, 어떤 국적의 깃발이나 표식도 없는 배가 발견되었습니다. 이것은 우리의 무역로를 습격해 온 배일 가능성이 높습니다."
 generic_shipping_raids.3.a: "추격하라!"
 generic_shipping_raids.4.t: "그들을 놓쳤다"
 generic_shipping_raids.4.desc: "불행히도, 해적들은 우리 배들을 능가하고 앞질러서 다른 날에 다시 해적질할 수 있게 되었습니다."
 generic_shipping_raids.4.a: "다음번엔 잡을 수 있을 것이다"
 generic_shipping_raids.5.t: "해적선 침몰!"
 generic_shipping_raids.5.desc: "굉음과 함께 해적선 측면에 구멍이 뚫리면서 배가 전복되기 시작합니다. 불행히도, 그들을 고용한 사람이 누구인지 말해줄 선원은 아무도 살아남지 못했습니다."
 generic_shipping_raids.5.a: "더 빨리 탈출했어야 했는데"
 asa_ga_war_plans_committee.1.t: "뉴잉글랜드"
 asa_ga_war_plans_committee.1.desc: "뉴잉글랜드는 미국 혁명의 발상지이며 우리 바로 동쪽에 위치하고 있습니다. 그들의 주요 인구 밀집 지역 대부분은 해안에 있지만, 우리 계획자들은 뉴잉글랜드 사람들이 내부 숲에서 영국군의 지원을 받아 우리를 상대로 게릴라전을 쉽게 수행할 수 있을 것이라고 확신합니다. 총의는 해안 도시를 봉쇄하는 동시에 신속하게 숲을 점령하고 고립시키는 것입니다."
 asa_ga_war_plans_committee.1.a: "저 뱀들을 밟을 시간이다"
 asa_ga_war_plans_committee.2.t: "오대호"
 asa_ga_war_plans_committee.2.desc: "오대호는 북미 대륙의 절대적인 지리적 경이입니다. 불행히도, 그들은 분리주의 국가에 의해 통제되고 있습니다. 우리는 미국 국민들이 이 아름다운 수역을 다시 보기를 원하므로, [GRL.GetNameDef]를 제거하기 위한 전쟁 계획을 수립하는 과정에 있습니다."
 asa_ga_war_plans_committee.2.a: "바다에서 빛나는... 호수로?"
 asa_ga_war_plans_committee.3.t: "남부"
 asa_ga_war_plans_committee.3.desc: "우리 남쪽에는 햇살 가득한 남부의 땅이 있습니다. 일부 사람들은 흥미로운 억양과 과일로 이곳을 알지만, 이 지역은 옛 미합중국의 농장주 계층과 노예 제도의 역사로 가장 유명합니다. 이 모든 사실과는 상관없이, 의회의 정치인들이 원하는 주요 목표는 조지 워싱턴 장군의 고향인 남부를 되찾는 것입니다. 이 특별한 지역은 동부의 광범위한 강과 북부의 애팔래치아 산맥으로 인해 우리 군사 계획자들에게 많은 어려움을 가져왔습니다. 그러나 그들은 점령을 방해하지 않는 방식으로 위치한 미시시피강에서 기회를 보고 있습니다. 만약 우리가 그곳을 점령한다면, [CSA.GetNameDef]는 분열되어 쉽게 무너질 것입니다."
 asa_ga_war_plans_committee.3.a: "우리 모두 딕시로 가자"
 asa_ga_war_plans_committee.4.t: "사막에서 살아남기"
 asa_ga_war_plans_committee.4.desc: "남서부의 모하비는 우리에게 흥미로운 물류 문제를 제시합니다. 험난한 지형으로 덮여 있지는 않지만, 날씨 때문에 군대를 통과시켜 반대편에서 온전한 상태를 기대하기는 불가능합니다. 우리 계획자들은 이를 효과적으로 통과하기 위한 비전통적인 아이디어를 내놓아야만 합니다."
 asa_ga_war_plans_committee.4.a: "모하비를 순찰하는 것에 대해 그들이 뭐라고 하는지 알 겁니다"
 asa_ga_war_plans_committee.5.t: "로키 산맥을 통과하기"
 asa_ga_war_plans_committee.5.desc: "로키 산맥은 우리가 서쪽으로 태평양 연안까지 확장하는 것을 막는 자연적인 벽입니다. 우리는 군대를 그 우뚝 솟은 높이로 행군시키거나 북쪽의 숲을 통해 돌아가는 것을 시도할 수 있습니다."
 asa_ga_war_plans_committee.5.a: "통과하기 어려울 것이다"
 asa_ga_domestic_affairs_committee.1.t: "대기업 문제"
 asa_ga_domestic_affairs_committee.1.desc: "우리가 분리주의 국가로부터 토지를 점령하면서, 그곳에서 운영되는 대기업들의 재산과 소유물도 인수했습니다. 중요한 문제는 그들과 미래의 기업들을 어떻게 처리할 것인가입니다. 우리는 그들을 해체하거나 충성 서약을 통해 통합할 수 있습니다. 무엇을 해야 할까요?"
 asa_ga_domestic_affairs_committee.1.a: "해체한다"
 asa_ga_domestic_affairs_committee.1.b: "통합한다"
 asa_ga_domestic_affairs_committee.2.t: "주 재통합 문제"
 asa_ga_domestic_affairs_committee.2.desc: "분리주의 국가를 점령하는 것은 흥미로운 질문을 제기합니다. 이들은 분명히 정복된 국민이지만, 우리는 점령한 땅을 연방에 진정으로 통합하고 대표권을 부여한 역사를 가지고 있습니다. 문제는, 우리가 주를 그 땅 내에서 50%의 지지로 재통합하도록 허용해야 할까요, 아니면 10%의 지지로 허용해야 할까요?"
 asa_ga_domestic_affairs_committee.2.a: "50% 계획"
 asa_ga_domestic_affairs_committee.2.b: "10% 계획"
 asa_ga_extracontinental_affairs_committee.1.t: "[FROM.GetName]가 우리가 아메리카에서 빠져주기를 원합니다"
 asa_ga_extracontinental_affairs_committee.1.desc: "[FROM.GetNameDef]에서 파견된 전령이 우리에게 특별한 무역 혜택을 부여하고 우리 전쟁에 중립을 지키는 대가로 우리가 아메리카에 관여하지 않기로 동의할 것을 요청했습니다. 어떻게 응답해야 할까요?"
 asa_ga_extracontinental_affairs_committee.1.a: "동의할 수 있다"
 asa_ga_extracontinental_affairs_committee.1.b: "그것은 보장할 수 없을 것 같다"
 asa_ga_extracontinental_affairs_committee.2.t: "[FROM.GetName]가 중립에 동의하다"
 asa_ga_extracontinental_affairs_committee.2.desc: "[FROM.GetNameDef]가 아메리카 분쟁 불개입 제안에 동의했습니다. 이것은 우리에게 적은 비용으로 많은 것을 얻는 훌륭한 외교적 승리로 내각에서 간주됩니다. 이 평화가 오래 지속되기를 바랍니다."
 asa_ga_extracontinental_affairs_committee.2.a: "싸울 적이 하나 줄었다"
 asa_ga_extracontinental_affairs_committee.3.t: "[FROM.GetName]가 중립에 동의하지 않다"
 asa_ga_extracontinental_affairs_committee.3.desc: "[FROM.GetNameDef]가 현재로서는 비공격성 합의를 적절히 지킬 수 없다는 메시지를 보냈습니다. 아무도 그들이 단순히 공식화하기 귀찮아서 그런 것인지, 아니면 곧 우리를 공격할 계획인지 확신할 수 없기 때문에 나머지 내각 구성원들은 크게 걱정하고 있습니다."
 asa_ga_extracontinental_affairs_committee.3.a: "실망스럽다"
 asa_ga_extracontinental_affairs_committee.4.t: "[FROM.GetName]가 공식적인 중립 협정을 원합니다"
 asa_ga_extracontinental_affairs_committee.4.desc: "[FROM.GetNameDef]에서 온 사절이 아메리카 대륙의 공식적인 중립 선언에 서명할 서류를 가지고 도착했습니다. 어떻게 응답해야 할까요?"
 asa_ga_extracontinental_affairs_committee.4.a: "어쨌든 우리는 아메리카에 관심이 없었다"
 asa_ga_extracontinental_affairs_committee.4.b: "지금 당장은 그런 것에 서명할 수 없다"
 asa_ga_extracontinental_affairs_committee.5.t: "[FROM.GetName]가 공식적인 중립에 동의하다"
 asa_ga_extracontinental_affairs_committee.5.desc: "[From.GetNameDef]가 공식적인 중립 협정 요청에 대해 명확한 '예'로 답변했습니다. 공식적인 중립 합의는 심각한 결과 없이 어떤 국가도 단순히 무시할 수 없는 것이기 때문에 우리에게는 좋은 소식입니다!"
 asa_ga_extracontinental_affairs_committee.5.a: "만세!"
 asa_ga_extracontinental_affairs_committee.6.t: "[FROM.GetName]가 공식적인 중립에 동의하지 않다"
 asa_ga_extracontinental_affairs_committee.6.desc: "[FROM.GetNameDef]가 공식적인 중립 선언에 서명하기를 거부했습니다. 문제는 침략을 두려워해야 하는지, 아니면 그들이 단순히 대륙에서 일어나는 일에 관심이 없는지입니다."
 asa_ga_extracontinental_affairs_committee.6.a: "후자이기를 바라자"
 asa_ga_extracontinental_affairs_committee.7.t: "[FROM.GetName]가 자유 무역 협정을 제안합니다"
 asa_ga_extracontinental_affairs_committee.7.desc: "[FROM.GetNameDef]에서 온 대표단이 우리에게 자유 무역 제안을 해왔습니다. 그들은 이 거래를 통해 [FROM.GetAdjective]와 [ROOT.GetAdjective] 상인들이 양측이 부과하는 관세 없이 서로 무역할 수 있을 것이라고 약속합니다. 이것은 아메리카에 새로운 경제적 기회를 열어줄 수 있지만, 우리가 국내 산업 일부를 잃을 위험을 감수할 가치가 있을까요?"
 asa_ga_extracontinental_affairs_committee.7.a: "네, 가치가 있습니다!"
 asa_ga_extracontinental_affairs_committee.7.b: "아니요, 그렇지 않습니다"
 asa_ga_extracontinental_affairs_committee.8.t: "[FROM.GetName]가 우리와의 자유 무역에 동의하다"
 asa_ga_extracontinental_affairs_committee.8.desc: "[FROM.GetNameDef]에서 온 대표단이 그들의 정부가 우리와 자유 무역을 할 의향이 있음을 확인했습니다. 이것은 우리 두 나라의 경제에 큰 도움이 될 것입니다!"
 asa_ga_extracontinental_affairs_committee.8.a: "부(富)가 흐르게 하라!"
 asa_ga_extracontinental_affairs_committee.9.t: "[FROM.GetName]가 자유 무역을 거부하다"
 asa_ga_extracontinental_affairs_committee.9.desc: "[From.GetNameDef]에서 온 대표단이 그들의 정부가 우리와 자유 무역 협정에 서명할 의향이 없다고 알려왔습니다. 그들은 우리 대륙의 부를 누리고 싶어하지 않는 것 같습니다."
 asa_ga_extracontinental_affairs_committee.9.a: "그들의 손해다"
 asa_ga_extracontinental_affairs_committee.10.t: "유럽 외교 순방"
 asa_ga_extracontinental_affairs_committee.10.desc: "오늘 [ROOT.GetLeader]가 유럽 강대국들과의 국가적 위상을 높이기 위해 유럽 외교 순방을 시작합니다. 배는 오늘 아침 출발했으며 첫 기착지는 영국입니다."
 asa_ga_extracontinental_affairs_committee.10.a: "잘 되기를 바라자!"
 asa_ga_extracontinental_affairs_committee.11.t: "[FROM.GetName]가 우리 항구에 대한 자유로운 접근을 원합니다"
 asa_ga_extracontinental_affairs_committee.11.desc: "[ASA.GetNameDef]에서 온 배가 우리 주요 항구 중 한 곳에 도착하여 사절단을 통해 그들의 사업체가 도착함에 따라 새로운 일자리가 창출될 것을 기대하며, 우리 항구에서 그들의 상인들에게 자유로운 접근을 제공해 줄 것을 요청했습니다. 우리가 받아들여야 할까요?"
 asa_ga_extracontinental_affairs_committee.11.a: "돈은 돈일 뿐이다"
 asa_ga_extracontinental_affairs_committee.11.b: "이건 좀 수상하다"
 asa_ga_extracontinental_affairs_committee.12.t: "[FROM.GetName]과의 자유 무역!"
 asa_ga_extracontinental_affairs_committee.12.desc: "[From.GetNameDef]로 파견했던 우리 사절이 좋은 소식을 가지고 돌아왔습니다. [FROM.GetNameDef] 정부는 우리의 사업체들이 그들에게 경제적 번영을 가져다주는 한, 그들의 항구에서 우리 상인들에게 자유로운 접근을 제공할 의향이 있습니다."
 asa_ga_extracontinental_affairs_committee.12.a: "돈이 쏟아져 들어온다"
 asa_ga_extracontinental_affairs_committee.13.t: "[FROM.GetName]와의 자유 무역 불가"
 asa_ga_extracontinental_affairs_committee.13.desc: "[FROM.GetNameDef]로 파견했던 우리 사절이 실망스러운 소식을 가지고 돌아왔습니다. [FROM.GetNameDef] 정부는 떠오르는 세계 경제의 혜택을 누리고 싶어하지 않으며, 우리 상인들이 그들의 항구에 자유롭게 접근하는 것을 허용하지 않을 것입니다."
 asa_ga_extracontinental_affairs_committee.13.a: "젠장..."
 asa_ga_extracontinental_affairs_committee.14.t: "[FROM.GetName]가 무역 협정 재서명을 원합니다"
 asa_ga_extracontinental_affairs_committee.14.desc: "스스로를 미합중국의 정당한 후계자로 여기며, [FROM.GetNameDef]가 몇 년 전 미합중국과 서명했던 무역 협정을 재확인하기를 원하며 우리를 찾아왔습니다. 어떻게 응답해야 할까요?"
 asa_ga_extracontinental_affairs_committee.14.a: "우리는 약속을 지키는 사람들이다"
 asa_ga_extracontinental_affairs_committee.14.b: "그 협정들은 무효다"
 asa_ga_extracontinental_affairs_committee.15.t: "일본과의 자유 무역!"
 asa_ga_extracontinental_affairs_committee.15.desc: "일본은 과거 미 정부가 그들과 체결했던 자유 무역 협정을 재서명하는 현명한 결정을 내렸습니다. 이는 새로운 시장이 열리면서 우리에게 경제적 이익을 가져다줄 것임이 틀림없습니다."
 asa_ga_extracontinental_affairs_committee.15.a: "페리가 자랑스러워할 것이다"
 asa_ga_extracontinental_affairs_committee.16.t: "일본과의 자유 무역 불가"
 asa_ga_extracontinental_affairs_committee.16.desc: "일본은 옛 미 정부가 그들과 체결했던 자유 무역 협정 재서명을 거부했습니다. 이것은 실망스럽지만 우리에게 큰 손실은 아닙니다."
 asa_ga_extracontinental_affairs_committee.16.a: "그들은 나라를 계속 폐쇄해야 한다"
 asa_ga_extracontinental_affairs_committee.17.t: "[FROM.GetName]와의 자유 무역?"
 asa_ga_extracontinental_affairs_committee.17.desc: "[ASA.GetNameDef]에서 온 대표단이 오늘 도착하여 우리의 외무장관과 가능한 자유 무역 협정에 대해 논의하기를 원합니다. 몇 시간의 심의와 논의 끝에 우리 정부는 다음과 같은 결론에 도달했습니다..."
 asa_ga_extracontinental_affairs_committee.17.a: "자유 무역은 우리 모두에게 이득이 될 것이다"
 asa_ga_extracontinental_affairs_committee.17.b: "우리는 우리의 산업을 보호해야 한다"
 asa_ga_extracontinental_affairs_committee.18.t: "[FROM.GetName]가 자유 무역에 동의하다!"
 asa_ga_extracontinental_affairs_committee.18.desc: "우리 대표단이 아프리카에서 좋은 소식을 가지고 돌아왔습니다! [FROM.GetAdjective] 정부가 그들의 나라와 자유 무역을 하자는 우리의 요청에 동의했습니다. 이것은 우리의 상인들에게 그들의 정부를 중재자로 삼아 아프리카의 새로운 상품과 자원에 접근할 수 있게 해줄 것입니다."
 asa_ga_extracontinental_affairs_committee.18.a: "좋은 소식이다!"
 asa_ga_extracontinental_affairs_committee.19.t: "[FROM.GetName]가 자유 무역에 동의하지 않다"
 asa_ga_extracontinental_affairs_committee.19.desc: "우리 대표단이 아프리카에서 끔찍한 소식을 가지고 돌아왔습니다. [FROM.GetAdjective] 정부가 자유 무역 요청에 대해 단호한 거부로 답했습니다. 이것은 실망스럽지만 다행히 경제에 치명적이지는 않습니다."
 asa_ga_extracontinental_affairs_committee.19.a: "실망스럽군"
 asa_ga_extracontinental_affairs_committee.20.t: "[FROM.GetName]가 식민지 복종을 요구하다"
 asa_ga_extracontinental_affairs_committee.20.desc: "[FROM.GetAdjective] 군함 함대가 최신 무기로 무장하고 해병대와 훈련된 수병들이 배치된 채로 우리 해안에 도착했습니다. 그들은 간단한 최후통첩을 전달합니다. [FROM.GetAdjective] 당국에 항복하거나 멸망하라. 우리는 어떻게 응답해야 할까요?"
 asa_ga_extracontinental_affairs_committee.20.a: "선택의 여지가 없다..."
 asa_ga_extracontinental_affairs_committee.20.b: "우리는 절대 항복하지 않을 것이다!"
 asa_ga_extracontinental_affairs_committee.21.t: "[FROM.GetAdjective]-[ROOT.GetAdjective] 방위 협정 제안"
 asa_ga_extracontinental_affairs_committee.21.desc: "[ASA.GetAdjective] 대사들이 우리에게 흥미로운 제안을 해왔습니다. 우리와 [FROM.GetNameDef] 간의 방위 군사 협정으로, 우리와 그들이 서로의, 그러나 주로 우리의, 방위를 위해 함께 일하는 것입니다. 또한, 우리는 위기 시에 그들을 돕겠다고 서약하고 그들은 우리에게 똑같이 할 것입니다. 우리의 응답은 무엇이 될까요?"
 asa_ga_extracontinental_affairs_committee.21.a: "이것은 좋은 제안인 것 같다"
 asa_ga_extracontinental_affairs_committee.21.b: "이것은 불필요한 것 같다"
 asa_ga_extracontinental_affairs_committee.22.t: "[FROM.GetName]가 방위 협정에 동의하다"
 asa_ga_extracontinental_affairs_committee.22.desc: "[FROM.GetAdjective] 군대가 우리와 군사적으로 협력할 의향이 있다고 답했고, 그들의 정부는 상호 방위 조항을 준수하고 [ROOT.GetAdjective] 고문 및 건설 회사가 그들의 방위를 구축하는 것을 돕도록 허용하겠다고 서약했습니다."
 asa_ga_extracontinental_affairs_committee.22.a: "우리 두 나라는 더 가까워지고 있다"
 asa_ga_extracontinental_affairs_committee.23.t: "[FROM.GetName]가 방위 협정에 동의하지 않다"
 asa_ga_extracontinental_affairs_committee.23.desc: "[FROM.GetAdjective] 정부는 불필요할 때 그들 자신의 주권이 침식되고 위험한 외교 상황에 강제로 휘말릴 가능성에 대해 우려하고 있다고 우리의 제안에 답변했습니다."
 asa_ga_extracontinental_affairs_committee.23.a: "실망스럽지만 이해할 만하다"
 asa_ga_extracontinental_affairs_committee.24.t: "[FROM.GetName]가 우호 조약을 제안하다"
 asa_ga_extracontinental_affairs_committee.24.desc: "[ASA.GetNameDef] 국무부가 그들의 지도자의 명령에 따라 우리의 두 민족 간에 우호 조약을 공식적으로 체결하기를 원한다는 메시지를 우리에게 보냈습니다. 그들은 이 유대가 공통의 역사와 공유된 신념으로 맺어졌다고 말합니다. 이것은 분명히 상류층과 정치에 더 많이 관여하는 국민들 사이에서 인기를 얻을 것이지만, 이미 부족 국가들과의 긴장을 더욱 고조시킬 수 있습니다. 어떻게 응답해야 할까요?"
 asa_ga_extracontinental_affairs_committee.24.a: "영원한 베스트 프렌드!"
 asa_ga_extracontinental_affairs_committee.24.b: "이것은 너무 논쟁의 여지가 있을 것이다"
 asa_ga_extracontinental_affairs_committee.25.t: "[FROM.GetName]가 우호 조약을 수락하다"
 asa_ga_extracontinental_affairs_committee.25.desc: "[FROM.GetAdjective] 정부가 새로운 '우호 조약'에 공식적으로 서명하는 것에 동의했습니다. 이것은 우리 민족 역사상 역사적인 순간이며, 국제 평화와 연대를 조성한 위대한 문서로 역사에 기록될 것입니다."
 asa_ga_extracontinental_affairs_committee.25.a: "멋진 소식이다!"
 asa_ga_extracontinental_affairs_committee.26.t: "[FROM.GetName]가 우호 조약을 거부하다"
 asa_ga_extracontinental_affairs_committee.26.desc: "[FROM.GetAdjective] 정부가 새로운 '우호 조약'에 공식적으로 서명하기를 거부했습니다. 이것은 우리나라 지도자들에게 큰 실망이지만, 다행히 [LIB.GetNameDef] 정부는 그들의 문화와 너무 다른 나라와 우호 조약을 체결하는 것을 원하지 않는 것 같습니다."
 asa_ga_extracontinental_affairs_committee.26.a: "정말 부끄러운 일이다"
 asa_ga_extracontinental_affairs_committee.27.t: "[FROM.GetName]가 우리를 병합하다"
 asa_ga_extracontinental_affairs_committee.27.desc: "[OVERLORD.GetAdjective]의 정치 및 경제 시스템 지배를 받아들인 후, 그들은 우리를 병합함으로써 해당 시스템에 대한 완전하고 총체적인 통제권을 가질 수밖에 없다는 결론에 도달했습니다. 우리 정부는 대신 더 큰 정치적 통제를 받아들일 것을 간절히 요청했지만, [OVERLORD.GetNameDef]는 이 제안을 거부했습니다. 우리가 할 수 있는 것은 아무것도 남지 않았습니다."
 asa_ga_extracontinental_affairs_committee.27.a: "젠장."
 asa_ga_intracontinental_affairs_committee.1.t: "외교 문제"
 asa_ga_intracontinental_affairs_committee.1.desc: "우리가 나머지 옛 미합중국에 대해 외교적으로 더 개방적이 되려고 시도하면서, 우리 정부는 분리주의 공화국들과 어떻게 관계를 맺어야 할지에 대해 논의해 왔습니다."
 asa_ga_intracontinental_affairs_committee.1.a: "그들은 반역자이며 그렇게 간주되어야 한다"
 asa_ga_intracontinental_affairs_committee.1.b: "적대적인 말은 우리를 아무데도 데려다주지 않을 것이다"
 asa_ga_intracontinental_affairs_committee.2.t: "영향력 문제"
 asa_ga_intracontinental_affairs_committee.2.desc: "우리의 외교적 관계와 국경이 확장됨에 따라, 나머지 옛 미합중국에 어떻게 영향을 미쳐야 하는지에 대한 문제가 논의되고 있습니다. 일부는 우리가 나머지 대륙을 이끌어갈 자비로운 지도자로 행동하기를 원합니다. 다른 쪽은 나머지 분리주의 공화국들을 동등하게 대하고 그들과 협력하여 대붕괴로 인해 야기된 상처를 치유하기 위한 새로운 다자간 협정 및 조약을 만들기를 원합니다."
 asa_ga_intracontinental_affairs_committee.2.a: "우리가 길을 이끌 것이다"
 asa_ga_intracontinental_affairs_committee.2.b: "우리는 권력을 나눠 가져야 한다"
 asa_ga_intracontinental_affairs_committee.3.t: "연합규약"
 asa_ga_intracontinental_affairs_committee.3.desc: "'연합규약'은 미합중국의 원래 '헌법'이었습니다. 원래, 그 지지자들은 강력한 연방 정부가 개인의 자유를 위협하고 비효율적일 것이라고 주장했습니다. 현재, 우리와 분리주의 공화국들 간에 공식적인 군사적, 경제적, 정치적 동맹을 구축할 새로운 연합규약을 만들자는 이야기가 정부의 회의실에서 오가고 있습니다. 그러나 먼저, 우리는 이 동맹에 공화국들을 어떻게 참여시킬지 알아내야 합니다. 그들은 독립을 유지하기를 바라며, 그들을 이러한 동맹에 가입하도록 설득하는 것은 어려울 수 있습니다."
 asa_ga_intracontinental_affairs_committee.3.a: "그렇다면 그들을 설득해야 한다"
 asa_ga_intracontinental_affairs_committee.4.t: "어류 관세 논의"
 asa_ga_intracontinental_affairs_committee.4.desc: "대붕괴가 일어났을 때, 많은 분리주의 국가들은 국경을 확보하기 위해 다양한 관세와 제한을 부과했습니다. 우리가 부과한 관세 중 하나는 [GRL.GetNameDef]를 포함한 이웃 국가들의 어류에 대한 것이었습니다. 이 관세는 연합규약에 대한 그들의 가입을 위해 [GRL.GetAdjective] 외교관들과의 논의에서 제기되었습니다. 우리 경제학자들 중 일부조차 오대호 어류 관세 철폐를 제안했습니다. 우리는 어떻게 해야 할까요?"
 asa_ga_intracontinental_affairs_committee.4.a: "무조건적으로 관세를 철폐한다"
 asa_ga_intracontinental_affairs_committee.4.b: "먼저 더 많은 양보를 강제한다"
 asa_ga_intracontinental_affairs_committee.5.t: "[FROM.GetName]가 우리 어류에 대한 관세 철폐를 제안합니다"
 asa_ga_intracontinental_affairs_committee.5.desc: "[ASA.GetNameDef]에서 온 대표단이 우리에게 흥미로운 제안을 했습니다. 우리가 새로 계획된 대륙 동맹에 가입하는 대가로, 그들은 우리 주요 수출품, 즉 어류에 대한 관세를 철폐할 것입니다. 이것을 받아들이는 것은 수십만 명의 잠재적 소비자가 있는 새로운 시장으로 우리를 개방함으로써 경제를 엄청나게 향상시킬 수 있지만, 일부 내각 구성원들은 이 동맹에 가입하는 것이 우리 자신의 주권을 감소시킬 것이라고 우려합니다. [ASA.GetNameDef]에 어떻게 응답해야 할까요?"
 asa_ga_intracontinental_affairs_committee.5.a: "이것은 유익한 일이다"
 asa_ga_intracontinental_affairs_committee.5.b: "이건 좀 수상하다"
 asa_ga_intracontinental_affairs_committee.6.t: "[FROM.GetName]가 양보를 요구하다"
 asa_ga_intracontinental_affairs_committee.6.desc: "[ASA.GetNameDef]에서 온 대표단이 우리 수도에 도착하여 우리가 [ASA.GetNameDef]에 양보한다면 그들이 건설 중인 새로운 동맹에 우리의 가입을 승인하겠다는 내용의 편지를 전달했습니다. 이러한 양보는 굴욕적이고 해로울 것이지만, 일부는 이를 거부하는 것이 우리에게 더 나쁜 결과로 똑같은 침략을 초래할 뿐인지 궁금해합니다."
 asa_ga_intracontinental_affairs_committee.6.a: "우리는 선택의 여지가 없다"
 asa_ga_intracontinental_affairs_committee.6.b: "절대 안 돼!"
