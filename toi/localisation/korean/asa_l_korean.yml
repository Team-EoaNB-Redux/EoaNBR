 asa_state_events.34: "그랜트 장군과 셔먼 장군이 미합중국 군에 합류하다"
 asa_state_events.34.t: "그랜트 장군과 셔먼 장군이 미합중국 군에 합류하다"
 asa_state_events.34.desc: "그랜트 장군과 셔먼 장군이 오늘 백악관에 도착하여 미합중국 군에서의 직위를 공식적으로 수락했습니다. 방문하는 동안, 두 장군은 [ASA.GetLeader] 대통령에게 최근 국민 투표에서 대서양 연합에 합류하기로 투표했으며 당신과 함께 일하기를 열망한다고 고백했습니다."
 asa_state_events.34.a: "나는 당신을 당연하게 여기지 않을 것입니다(I'll make sure not to take you for Grant-ed)"
 asa_referendum_in_ohio_16_tt: "그랜트 장군은 한숨 쉬다\n 기본 안정도: §R-1.00%§! \n§WGeneral Sherman chuckles§! \n 기본 안정도: §G+1.00%§!"
 asa_address_issues_of_capital.1: "자본 문제를 해결할 시간"
 asa_address_issues_of_capital.1.t: "자본 문제를 해결할 시간"
 asa_address_issues_of_capital.1.desc: "우리 행정부는 [ASA.GetName]를 안정화시키겠다는 약속으로 선출되었습니다. 우리 고문들은 사회를 안정시키는 가장 좋은 방법은 경제를 안정시키는 것이라고 결정했습니다. 만약 우리가 [ASA.GetName]의 부를 둘러싼 문제들을 단호하게 해결할 수 있다면, 우리는 국가의 안전을 보장할 수 있을 것입니다."
 asa_address_issues_of_capital.1.a: "일하러 가자"
 ASA_Address_Issues_Of_Capital_tt: "안정을 보장하기 위해 국가의 재정 문제를 해결해야 할 것입니다"
 asa_mcclellan.1.t: "맥클렐런 장군, 정부의 무대책을 비판하다"
 asa_mcclellan.1.desc: "오늘 아침, 조지 B. 맥클렐런 장군은 신문에 실린 매서운 글에서 국가의 경제적 문제에 대한 정부의 무대책을 공개적으로 비판했습니다. 이것은 이미 연방 정부에 회의적인 많은 사람들이 장군을 지지하게 만들 것입니다."
 asa_mcclellan.1.a: "우리는 우리의 일을 하려고 노력하고 있습니다, 장군."
 asa_mcclellan.3.t: "맥클렐런 장군, 정부의 무대책을 비판하다"
 asa_mcclellan.3.desc: "오늘 아침, 조지 B. 맥클렐런 장군은 신문에 제출된 신랄한 보고서에서 국가를 휩쓸고 있는 노동 위기에 대한 정부의 무대책을 공개적으로 비판했습니다. 이것은 이미 연방 정부에 회의적인 많은 사람들이 장군을 지지하게 만들 것입니다."
 asa_mcclellan.3.a: "우리는 우리의 일을 하려고 노력하고 있습니다, 장군."
 asa_address_issues_of_labor.1: "노동 문제를 해결할 시간"
 asa_address_issues_of_labor.1.t: "노동 문제를 해결할 시간"
 asa_address_issues_of_labor.1.desc: "우리 행정부는 [ASA.GetName]를 안정화시키겠다는 약속으로 선출되었습니다. 우리 고문들은 사회를 안정시키는 가장 좋은 방법은 일반 노동자의 생계를 보장하는 것이라고 결정했습니다. 만약 우리가 [ASA.GetName]의 노동 계급이 직면한 문제들을 단호하게 해결할 수 있다면, 우리는 국가의 안전을 보장할 수 있을 것입니다."
 asa_address_issues_of_labor.1.a: "일하러 가자"
 asa_new_social_issues.1: "새로운 사회 문제"
 asa_new_social_issues.1.t: "새로운 사회 문제"
 asa_new_social_issues.1.desc: "[ASA.GetName]가 직면한 사회 문제를 해결하기 위한 우리의 최선의 노력에도 불구하고, 새로운 문제들이 옛 문제들을 대체하며 불거졌습니다. 그럼에도 불구하고, 우리 국민의 고통과 어려움을 덜어주기 위해 할 수 있는 모든 것을 하는 것이 [ASA.GetName] 정부로서 우리의 임무입니다."
 asa_new_social_issues.1.a: "단 한 명의 시민도 뒤처지지 않게!"
 asa_nap.1: "[ASA.GetName]이 불가침 조약을 제안하다"
 asa_nap.1.t: "[ASA.GetName]이 불가침 조약을 제안하다"
 asa_nap.1.desc: "[ASA.GetName]의 외교관이 우리 수도에 도착하여 양국 간의 불가침 조약을 요구하는 [ASA.GetAdjective] 정부의 제안을 가져왔습니다. 우리는 어떻게 해야 할까요?"
 asa_nap.1.a: "당연히, 우리는 받아들일 것이다"
 asa_nap.1.b: "이것은 그들이 시간을 벌기 위한 계략일 뿐이다"
 asa_nap.2: "[From.GetNameDef]가 불가침 조약을 거부하다!"
 asa_nap.2.t: "[From.GetNameDef]가 불가침 조약을 거부하다!"
 asa_nap.2.desc: "[From.GetNameDef]의 외교관이 우리 정부에 연락하여 [From.GetNameDef]가 그들과 [ASA.GetName] 사이의 불가침 조약에 동의할 의사가 없음을 알려왔습니다."
 asa_nap.2.a: "아쉽군..."
 asa_nap.3: "[From.GetNameDef]가 불가침 조약을 수락하다!"
 asa_nap.3.t: "[From.GetNameDef]가 불가침 조약을 수락하다!"
 asa_nap.3.desc: "[From.GetNameDef]의 외교관이 우리 정부에 연락하여 [From.GetNameDef]가 그들과 [ASA.GetName] 사이의 불가침 조약에 동의할 의사가 있음을 알려왔습니다."
 asa_nap.3.a: "훌륭한 소식이다!"
 asa_state_events.51: "[ASA.GetName]가 우리에게 평화로운 통일을 제안하다"
 asa_state_events.51.t: "[ASA.GetName]가 우리에게 평화로운 통일을 제안하다"
 asa_state_events.51.desc: "[ASA.GetName]에서 온 사절이 그들과 평화적으로 통일하자는 제안을 가지고 우리에게 접근했습니다. 사절은 또한 우리 두 군대의 규모를 비교하는 작은 스케치를 남겼습니다."
 asa_state_events.51.a: "기꺼이 동참하겠습니다!"
 asa_state_events.51.b: "그들은 위대한 켄터키 국가를 위협하지 않을 것이다!"
 asa_state_events.52: "[KTY.GetName]가 수락하다!"
 asa_state_events.52.t: "[KTY.GetName]가 수락하다!"
 asa_state_events.52.desc: "[KTY.GetAdjective] 사절이 진정한 미국 공화국과 재통일하려는 그들의 열망을 나타내는 쪽지를 가지고 우리에게 돌아왔습니다."
 asa_state_events.52.a: "연방에 돌아온 것을 환영한다!"
 asa_state_events.53: "[KTY.GetName]가 거부하다!"
 asa_state_events.53.t: "[KTY.GetName]가 거부하다!"
 asa_state_events.53.desc: "[KTY.GetAdjective] 사절이 진정한 미국 공화국과 재통일하는 데 관심이 없음을 명시한 쪽지를 가지고 우리에게 돌아왔습니다."
 asa_state_events.53.a: "이제 저 반역자들에게 대가를 치르게 할 시간이다"
 asa_state_events.53.b: "좋은 시도였다"
 asa_state_events.54: "켄터키를 돕기 위해 개입할 것인가?"
 asa_state_events.54.t: "켄터키를 돕기 위해 개입할 것인가?"
 asa_state_events.54.desc: "[KTY.GetAdjective] 사절이 [KTY.GetAdjective] 대사관에서 수도로 달려와 [ASA.GetAdjective] 침략 전쟁에 개입하고 그들의 주권을 유지해달라고 애원하는 문서를 들고 왔습니다."
 asa_state_events.54.a: "당연히, 우리는 그들을 방어할 것이다"
 asa_state_events.54.b: "왜 우리는 켄터키를 위해 젊은이들을 죽게 보내야 하는가?"
 asa_state_events.55: "켄터키 탈환"
 asa_state_events.55.t: "켄터키 탈환"
 asa_state_events.55.desc: "[ASA.GetName] 군대가 [KTY.GetAdjective] 군대를 패퇴시키고 프랭크포트를 점령했습니다. 우리는 켄터키에서 승리했습니다!"
 asa_state_events.55.a: "반역자들에게 죽음을! 성조기여 영원하라!"
 asa_state_events.56: "켄터키 탈환 실패"
 asa_state_events.56.t: "켄터키 탈환 실패"
 asa_state_events.56.desc: "[KTY.GetAdjective] 군대는 모든 어려움에도 불구하고 그들의 고향으로 향하는 [ASA.GetName]의 공격을 막아낼 수 있었습니다. 전쟁은 본국에서 큰 피해를 입히고 있으며, 우리가 국민들에게 약속했던 것처럼 빠른 전쟁이 아니었습니다. 이제 [KTY.GetName]와 평화 협정을 맺을 시간입니다."
 asa_state_events.56.a: "우리는 돌아올 것이다"
 asa_state_events.57: "개입 세력을 성공적으로 막아내다"
 asa_state_events.57.t: "개입 세력을 성공적으로 막아내다"
 asa_state_events.57.desc: "우리 군대는 놀랍지 않게도 켄터키와의 재통일 과정에 외부 개입자들이 가한 공격을 막아낼 수 있었습니다. [ASA.GetName]에게 영광스러운 날입니다!"
 asa_state_events.57.a: "아무도 우리를 막을 수 없다"
 asa_state_events.58: "켄터키 방어"
 asa_state_events.58.t: "켄터키 방어"
 asa_state_events.58.desc: "불행히도, 개입 군대가 우리의 [KTY.GetAdjective] 형제들과의 재통일을 막아냈습니다."
 asa_state_events.58.a: "어떻게 감히 우리의 운명을 막는가?!"
 asa_state_events.59: "켄터키 방어"
 asa_state_events.59.t: "켄터키 방어"
 asa_state_events.59.desc: "[Root.GetAdjective] 군대는 [KTY.GetAdjective] 영토로 더 이상 [ASA.GetAdjective]의 진격을 성공적으로 막아냈습니다. [KTY.GetName]는 주권을 유지할 것입니다!"
 asa_state_events.59.a: "그들에게 교훈을 줄 것이다"
 asa_create_a_new_doctrine_event.1: "새로운 군사 원칙"
 asa_create_a_new_doctrine_event.1.t: "새로운 군사 원칙"
 asa_create_a_new_doctrine_event.1.desc: "육군 역사 연구 위원회가 당신의 사무실에 보고서를 가져왔습니다. 그들은 마침내 연구를 마쳤고 군이 사용할 새로운 원칙을 갖게 되었다고 말했습니다. 이 새로운 원칙은..."
 asa_create_a_new_doctrine_event.1.a: "...워싱턴의 카리스마 넘치는 리더십!"
 asa_create_a_new_doctrine_event.1.b: "...구스타부스 아돌푸스의 혁명적인 전술!"
 asa_create_a_new_doctrine_event.1.c: "...나폴레옹의 포병 혁신!"
 asa_utilize_an_old_doctrine_event.1: "과거의 가르침"
 asa_utilize_an_old_doctrine_event.1.t: "과거의 가르침"
 asa_utilize_an_old_doctrine_event.1.desc: "육군 역사 연구 위원회가 당신의 사무실에 보고서를 가져왔습니다. 그들은 마침내 연구를 마쳤으며 군이 오늘날에도 여전히 사용할 수 있는 옛 원칙을 발견했다고 말했습니다. 위원회가 결정한 원칙은..."
 asa_utilize_an_old_doctrine_event.1.a: "...가-파!(Ga Pa!)"
 asa_utilize_an_old_doctrine_event.1.b: "...돌격!(Charge!)"
 asa_utilize_an_old_doctrine_event.1.c: "...사선 대형!(Oblique Attack!)"
 asa_congress_reaffirms_constitution.1: "의회, 헌법을 재확인하다"
 asa_congress_reaffirms_constitution.1.t: "의회, 헌법을 재확인하다"
 asa_congress_reaffirms_constitution.1.desc: "미국이 붕괴된 이래로, 많은 국민들은 자신의 삶과 자유가 개인적으로 변할지 궁금해했습니다. 오늘, 의회는 새로운 [ASA.GetName]가 미합중국 헌법을 계속해서 지지하고 보호하겠다는 결의안을 통과시켜 그들의 두려움을 진정시켰습니다."
 asa_congress_reaffirms_constitution.1.a: "'우리 국민은...'"
 asa_the_new_america.1: "새로운 미국"
 asa_the_new_america.1.t: "새로운 미국"
 asa_the_new_america.1.desc: "이제 변화가 필요할 때입니다. 과거의 정부는 나약하고 비효율적이어서, 한때 영광스러웠던 우리 연합의 붕괴를 초래했습니다. 만약 우리가 반역자와 도둑들의 점령으로부터 동포들을 해방시키고 싶다면, 다른 접근 방식을 활용해야 합니다."
 asa_the_new_america.1.a: "미국은 다시 일어설 것이다"
 asa_mcclellan.10: "맥클렐런 숭배의 부상"
 asa_mcclellan.10.t: "맥클렐런 숭배의 부상"
 asa_mcclellan.10.desc: "국민들이 우리의 위대한 지도자 맥클렐런 장군을 중심으로 결집하고 있습니다! 미국 재정복과 군대 강화를 주장하는 그의 연설은 국가와 삶의 방식 전체의 붕괴를 겪은 국민들의 공감을 샀습니다."
 asa_mcclellan.10.a: "국민들은 내 뒤에 서 있다!"
 asa_mcclellan.8: "맥클렐런, 모든 권력을 장악하다"
 asa_mcclellan.8.t: "맥클렐런, 모든 권력을 장악하다"
 asa_mcclellan.8.desc: "오늘 아침, 조지 B. 맥클렐런은 백악관에서 자신을 '미국의 황제'이자 '캐나다의 보호자'로 선포하는 연설을 했습니다. 얼마 후, 의회의 모든 의원들이 귀가하기 전에 맥클렐런에게 모든 입법 및 행정 권한을 부여하는 법안이 통과되었습니다. 한 시간 후, 미합중국 대법원은 모든 사법 권한을 장군에게 넘겨주었습니다. 그날이 끝날 무렵, 새로운 [ASA.GetName]는 황제 조지 1세를 지도자로 하여 확고히 자리 잡았습니다."
 asa_mcclellan.8.a: "황제 폐하 만세!"
 asa_mcclellan.9: "맥클렐런, 자신을 미국의 황제로 선포하다"
 asa_mcclellan.9.t: "맥클렐런, 자신을 미국의 황제로 선포하다"
 asa_mcclellan.9.desc: "며칠 전, 조지 B. 맥클렐런은 백악관에서 자신을 '미국의 황제'이자 '캐나다의 보호자'로 선포하는 연설을 했습니다. 얼마 후, 의회의 모든 의원들이 귀가하기 전에 맥클렐런에게 모든 입법 및 행정 권한을 부여하는 법안이 통과되었습니다. 한 시간 후, 미합중국 대법원은 모든 사법 권한을 장군에게 넘겨주었습니다. 그날이 끝날 무렵, 새로운 [ASA.GetName]는 황제 조지 1세를 지도자로 하여 확고히 자리 잡았습니다.\n \n미국은 항상 강력한 반군주제 입장을 견지해 왔기 때문에, 이 조치는 나머지 옛 미합중국과 세계에 충격을 주었습니다. [GRL.GetAdjective]와 [NEG.GetAdjective]의 정치인 및 군사 관리들이 새로운 사태에 대해 우려하고 있으며, 아마도 장군에 직접 개입하려 할 것입니다."
 asa_mcclellan.9.a: "정말 미쳤군"
 asa_mcclellan.9.b: "'캐나다의 보호자'는 개뿔"
 asa_mcclellan.9.c: "이거 어디서 본 적 있어! 고전 중의 고전이지!"
 asa_mcclellan.9.d: "누구의 보호자라고?"
 asa_mcclellan.4.t: "조지 B. 맥클렐런, 자선 단체를 설립하다"
 asa_mcclellan.4.desc: "[asa_mcclellan_founds_charity_desc]"
 asa_mcclellan_founds_charity_desc_mcclellan: "신문에 따르면 조지 브린턴 맥클렐런 장군이 [ASA.GetName]의 한 작은 마을에 공공사업 자금 지원을 돕기 위해 지역 자선 단체 개설에 자금을 지원했다고 합니다. 언론은 장군의 사심 없음을 칭찬하고 있으며 국민들은 사랑받는 장군을 칭송하고 있습니다."
 asa_mcclellan_founds_charity_desc_not_mcclellan: "신문에 따르면 조지 브린턴 맥클렐런 장군이 [ASA.GetName]의 한 작은 마을에 공공사업 자금 지원을 돕기 위해 지역 자선 단체 개설에 자금을 지원했다고 합니다. 언론은 장군의 사심 없음을 칭찬하고 있지만, 우리 고위 고문 중 다수는 이것이 우리의 정당성과 국민의 호의를 떨어뜨리려는 맥클렐런 장군의 정치적 스턴트의 일부일 수 있다고 경고합니다. 그들은 또한 총사령관으로서 당신이 그를 견책할 수 있지만, 그를 해고하는 것은 권장하지 않는다고 조언합니다."
 asa_mcclellan.4.a: "[asa_mcclellan_founds_charity_a]"
 asa_mcclellan_founds_charity_a_not_mcclellan: "국민이 행복하다면야 뭐..."
 asa_mcclellan_founds_charity_a_mcclellan: "난 그냥 최고인 것 같지 않나?"
 asa_mcclellan.4.b: "그를 견책한다"
 asa_mcclellan.5: "맥클렐런 장군, 푸드 뱅크를 열다"
 asa_mcclellan.5.t: "맥클렐런 장군, 푸드 뱅크를 열다"
 asa_mcclellan.5.desc: "[asa_mcclellan_founds_food_bank_desc]"
 asa_mcclellan_founds_food_bank_desc_not_mcclellan: "신문에 따르면 조지 브린턴 맥클렐런 장군이 [ASA.GetName]의 한 빈곤한 마을에 굶주린 가족들을 돕기 위해 새로운 푸드 뱅크 개설에 자금을 지원했다고 합니다. 언론은 장군의 사심 없는 행동을 칭찬하고 있지만, 우리 고위 고문 중 다수는 이것이 그가 다음 대통령이 되기 위한 더 큰 정치적 계획의 일부일 수 있다고 경고합니다. 그들은 또한 총사령관으로서 당신이 장군을 견책할 권한이 있지만, 그를 전면적으로 해고하는 것은 경고한다고 덧붙입니다."
 asa_mcclellan_founds_food_bank_desc_mcclellan: "신문에 따르면 조지 브린턴 맥클렐런 장군이 [ASA.GetName]의 한 빈곤한 마을에 굶주린 가족들을 돕기 위해 새로운 푸드 뱅크 개설에 자금을 지원했다고 합니다. 언론은 장군의 사심 없는 행동을 칭찬했으며, 국민들은 그들을 도운 사람에 대한 음식과 사랑으로 가득 차 있습니다."
 asa_mcclellan.5.a: "[asa_mcclellan_founds_food_bank_a]"
 asa_mcclellan_founds_food_bank_a_not_mcclellan: "왜? 그는 국민을 돕고 있잖아."
 asa_mcclellan_founds_food_bank_a_mcclellan: "난 진정한 국민의 사람이야"
 asa_mcclellan.5.b: "그를 견책한다"
 asa_mcclellan.7: "맥클렐런 장군, 직접 병사들을 모집하다"
 asa_mcclellan.7.t: "맥클렐런 장군, 직접 병사들을 모집하다"
 asa_mcclellan.7.desc: "[asa_mcclellan_personally_recruits_soldiers_desc]"
 asa_mcclellan_personally_recruits_soldiers_desc_not_mcclellan: "조지 브린턴 맥클렐런 장군이 병사들을 직접 모집하는 노력 덕분에 육군 신규 지원자가 급증했다는 보고가 들어오고 있습니다. 일부 군 관계자들은 이 소식에 기뻐하고 있지만, 당신의 참모총장은 당신의 허락 없이 장군이 병사들을 모집하는 것에 대한 위험을 경고하고 있습니다."
 asa_mcclellan_personally_recruits_soldiers_desc_mcclellan: "조지 브린턴 맥클렐런 장군이 병사들을 직접 모집하는 노력 덕분에 육군 신규 지원자가 급증했다는 보고가 들어오고 있습니다. 군 관계자들은 맥클렐런이 신병들을 데려온 것에 대해 감사했습니다."
 asa_mcclellan.7.a: "[asa_mcclellan_personally_recruits_soldiers_a]"
 asa_mcclellan_personally_recruits_soldiers_a_not_mcclellan: "병력이 많아지는 것에 누가 불평하겠어?"
 asa_mcclellan_personally_recruits_soldiers_a_mcclellan: "그냥 군대의 일을 하고 있을 뿐이야"
 asa_mcclellan.7.b: "그를 견책한다"
 asa_mcclellan.6: "맥클렐런 장군, 연설을 하다"
 asa_mcclellan.6.t: "맥클렐런 장군, 연설을 하다"
 asa_mcclellan.6.desc: "[asa_mcclellan_gives_speech_desc]"
 asa_mcclellan_gives_speech_desc_not_mcclellan: "조지 맥클렐런 장군이 오늘 아침 지지자들 앞에서 연설을 했습니다. 이 연설은 불확실한 시기에 통합을 촉구하는 내용으로 잘 받아들여졌습니다. 그러나 일부 고문들은 장군이 미래 선거에서 직접 권력을 잡을 계획이 있을 수 있다는 미묘한 기저가 있었음을 지적했습니다. 우리는 어떻게 해야 할까요?"
 asa_mcclellan_gives_speech_desc_mcclellan: "조지 맥클렐런 장군이 오늘 아침 지지자들 앞에서 연설을 했습니다. 이 연설은 불확실한 시기에 통합을 촉구하는 내용으로 잘 받아들여졌습니다. 끝날 무렵 박수가 터져 나왔고 맥클렐런은 군중과 만나 악수를 하고 직접 대화를 나누었습니다."
 asa_mcclellan.6.a: "[asa_mcclellan_gives_speech_a]"
 asa_mcclellan_gives_speech_a_not_mcclellan: "이 사람 마음에 드는데"
 asa_mcclellan_gives_speech_a_mcclellan: "그냥 내 타고난 카리스마를 보여줄 뿐이야"
 asa_mcclellan.6.b: "그를 견책한다"
 generic_asa_demands_emancipation.1: "[ASA.GetName]이 노예 해방을 요구하다"
 generic_asa_demands_emancipation.1.t: "[ASA.GetName]이 노예 해방을 요구하다"
 generic_asa_demands_emancipation.1.desc: "[ASA.GetName]에서 우리 대사관에 메시지가 도착하여 노예를 즉시 무조건적으로 해방하라고 요청했습니다."
 generic_asa_demands_emancipation.1.a: "진작에 했어야 했다"
 generic_asa_demands_emancipation.1.b: "그들이 우리에게 이래라저래라 할 수 없다"
 generic_asa_demands_emancipation.2: "[From.GetNameDef]가 노예를 해방하다"
 generic_asa_demands_emancipation.2.t: "[From.GetNameDef]가 노예를 해방하다"
 generic_asa_demands_emancipation.2.desc: "[From.NameDef]가 그들의 영토 내 노예 해방 요청에 응하여 이를 수락했습니다. 이것은 [From.GetNameDef]의 노예들에게는 위대한 날입니다!"
 generic_asa_demands_emancipation.2.a: "곧 모든 사슬이 끊어질 것이다"
 generic_asa_demands_emancipation.3: "[From.GetNameDef]가 해방을 거부하다"
 generic_asa_demands_emancipation.3.t: "[From.GetNameDef]가 해방을 거부하다"
 generic_asa_demands_emancipation.3.desc: "[From.GetNameDef]가 그들의 국경 내 해방 요청에 응하여 이를 거부했습니다. 분명히, 그들은 사람들의 삶에 거의 신경 쓰지 않습니다."
 generic_asa_demands_emancipation.3.a: "그들의 심판의 날은 결국 올 것이다"
 asa_alliance_with_new_england.1: "[ASA.GetNameDef]가 우리에게 동맹을 제안하다"
 asa_alliance_with_new_england.1.t: "[ASA.GetNameDef]가 우리에게 동맹을 제안하다"
 asa_alliance_with_new_england.1.desc: "[ASA.GetNameDef]에서 온 대표단이 우리 대사관에 도착하여 당신의 사무실로 전달된 편지를 건넸습니다. 편지에는 [ASA.GetNameDef]가 노예제에 맞서는 '노예제 폐지론자 전선'에서 우리와 동맹을 맺고 싶어 한다는 내용이 담겨 있습니다. 당신의 내각은 이 문제에 대해 의견이 갈리고 있습니다. 한쪽은 [ASA.GetNameDef]가 나중에 우리를 뒤통수칠 뿐이라고 믿는 반면, 다른 한쪽은 노예제의 재앙을 막기 위해 [ASA.GetName]와 협력하는 것이 훌륭한 아이디어이며 그렇게 하지 않는다면 우리가 위선자처럼 보일 것이라고 믿습니다."
 asa_alliance_with_new_england.1.a: "우리는 그 재앙에 함께 맞서 싸울 것이다!"
 asa_alliance_with_new_england.1.b: "이건 좀 수상한데..."
 asa_alliance_with_new_england.2: "[NEG.GetNameDef]가 동맹을 수락하다"
 asa_alliance_with_new_england.2.t: "[NEG.GetNameDef]가 동맹을 수락하다"
 asa_alliance_with_new_england.2.desc: "[NEG.GetNameDef]에서 온 사절이 노예제에 맞서는 우리의 동맹 제안을 수락하겠다는 [NEG.GetNameDef]의 회신을 우리에게 전달했습니다."
 asa_alliance_with_new_england.2.a: "노예 소유주들은 조심하는 게 좋을 거야"
 asa_alliance_with_new_england.3: "[NEG.GetNameDef]가 동맹을 거부하다"
 asa_alliance_with_new_england.3.t: "[NEG.GetNameDef]가 동맹을 거부하다"
 asa_alliance_with_new_england.3.desc: "[NEG.GetNameDef]에서 온 사절이 노예제라는 재앙에 맞서 우리와 동맹을 맺을 의사가 없다는 [NEG.GetNameDef]의 회신을 우리에게 전달했습니다. 우리 선동가들은 이미 이 사건 덕분에 [NEG.GetNameDef]를 부정적으로 묘사하는 만화를 만들기 위해 열심히 작업하고 있습니다."
 asa_alliance_with_new_england.3.a: "위선자들..."
 asa_meeting_with_protestors.1.t: "만남 시작"
 asa_meeting_with_protestors.1.desc: "시위 지도자들이 오늘 백악관에 도착하여 [ASA.GetLeader] 대통령 및 그의 참모들과 직접 만났습니다. 회담을 어떻게 진행해야 할까요?"
 asa_meeting_with_protestors.1.a: "정책에 대해 이야기하자"
 asa_meeting_with_protestors.1.b: "경제에 대해 이야기하자"
 asa_meeting_with_protestors.1.c: "국가 안보에 대해 이야기하자"
 asa_meeting_with_protestors.1.d: "더 이상의 타협은 없다"
 asa_meeting_with_protestors.2.t: "정책 문제"
 asa_meeting_with_protestors.2.desc: "시위대들이 현 정부에 가장 큰 불만을 품고 있는 것은 바로 정책 때문입니다. 그들은 수많은 문제를 가지고 있지만, 우리가 노동 시간, 참정권, 그리고 아동 노동 문제에 맞서는 한 당분간은 그럭저럭 지낼 의향이 있습니다."
 asa_meeting_with_protestors.2.a: "함께 계획을 세워봅시다"
 asa_meeting_with_protestors.3.t: "경제 침체 문제"
 asa_meeting_with_protestors.3.desc: "최근의 경제 침체 문제로 넘어가자, 몇몇 시위자들이 자본주의 전체에 대한 공격을 외쳤지만, 그들의 더 온건한 구성원들이 대화를 계속하기 위해 그들을 통제했습니다. 그들의 주요 불만은 높은 세율, 우리의 무역 정책, 그리고 빈약한 의료 지출에 관한 것입니다."
 asa_meeting_with_protestors.3.a: "함께 계획을 세워봅시다"
 asa_meeting_with_protestors.4.t: "국가 안보 문제"
 asa_meeting_with_protestors.4.desc: "국가 안보 문제에 대해, 많은 시위자들은 우리가 이민자들에게 너무 관대하고, 우리의 국방비 지출이 너무 높으며, 징집 제도 자체가 부도덕하다고 믿고 있습니다."
 asa_meeting_with_protestors.4.a: "함께 계획을 세워봅시다"
 asa_meeting_with_protestors.5.t: "회담 종료"
 asa_meeting_with_protestors.5.desc: "시위대와의 회담이 끝났습니다. 양측은 [ASA.GetName]의 미래에 대한 희망에 대해 공동 성명을 발표했으며, 시위 지도자들은 약속된 정책을 더 잘 입안하고 로비할 수 있도록 대통령에게 물러나고 심적 여유를 달라고 요청했습니다."
 asa_meeting_with_protestors.5.a: "낭비할 시간이 없다. 일하러 가자!"
 asa_anarchist_revolt.1.t: "반란 소문"
 asa_anarchist_revolt.1.desc: "일부 고문들이 필라델피아 시의 분리주의 단체들이 정부에 반란을 일으킬 가능성에 대해 경고했습니다. 대연합이 붕괴된 이래로, 우리는 정부에 대한 국내 반란을 다루어본 적이 없으며, 그러한 사태를 처리할 어떤 규약도 마련되어 있지 않습니다. 일부 내각 관료들은 고대 로마 공화국이 위협을 받았을 때 한 사람에게 비상 권한을 부여하고 위협이 해결된 후 자발적으로 상원에 권한을 포기했던 것처럼, 공화국에 대한 위협이 사라질 때까지 조지 B. 맥클렐런에게 일시적인 비상 권한을 부여할 것을 제안했습니다."
 asa_anarchist_revolt_1_a_no_mcclellan: "공화국을 지키기 위해 맥클렐런에게 비상 권한을 부여한다"
 asa_anarchist_revolt_1_a_mcclellan: "내가 직접 공화국을 구하겠다"
 asa_anarchist_revolt.1.a: "[asa_anarchist_revolt_1_a]"
 asa_anarchist_revolt.1.b: "이건 곧 가라앉을 거야. 과장할 필요 없어."
 asa_anarchist_revolt.2.t: "필라델피아의 파업"
 asa_anarchist_revolt.2.desc: "필라델피아의 상황이 격화되어 도시 전역에서 파업이 발생하고 있으며, 분노한 노동자들이 시위와 행진으로 가득 채우고 있습니다."
 asa_anarchist_revolt_2_a_mcclellan: "내가 나설 때다"
 asa_anarchist_revolt_2_a_no_mcclellan: "장군을 부르자"
 asa_anarchist_revolt.2.a: "[asa_anarchist_revolt_2_a]"
 asa_anarchist_revolt.2.b: "발포 명령을 내린다"
 asa_anarchist_revolt.2.c: "주 방위군을 투입하여 해산시킨다"
 asa_anarchist_revolt.2.d: "독재자를 임명하지 않을 것이다. 이건 곧 가라앉을 거야!"
 asa_anarchist_revolt.2.e: "내 고향 도시의 사람들과 이야기하게 해달라"
 asa_anarchist_revolt.3.t: "시위대, 워싱턴 D.C.로 행진하다"
 asa_anarchist_revolt.3.desc: "필라델피아의 시위가 도시 밖으로 퍼져 워싱턴에까지 도달했습니다. 시위대들은 소비자 및 노동자를 위한 더 나은 보호를 요구하며 떼를 지어 국회의사당으로 행진하고 있습니다."
 asa_anarchist_revolt_3_a_no_mcclellan: "이제 정말 맥클렐런이 필요해..."
 asa_anarchist_revolt_3_a_mcclellan: "감히 조지 브린턴 맥클렐런을 건드리다니, 내가 혼내주마"
 asa_anarchist_revolt.3.a: "[asa_anarchist_revolt_3_a]"
 asa_anarchist_revolt.3.b: "이건. 여기서. 끝이다."
 asa_anarchist_revolt.3.c: "평화롭게 그들과 이야기하자"
 asa_anarchist_revolt.3.d: "주 방위군을 투입하여 해산시킨다"
 asa_anarchist_revolt_3_tt: "D.C. 방위군이 시위대에 발포하게 한다"
 asa_anarchist_revolt.4.t: "행진대가 회담을 제안하다"
 asa_anarchist_revolt.4.desc: "행진 지도자들이 국가 지도자에게 직접 불만을 표출하기 위해 대통령과 직접 회담을 제안했습니다. 어떻게 응답해야 할까요?"
 asa_anarchist_revolt.4.a: "좋다, 만나자."
 asa_anarchist_revolt.4.b: "그들은 시간 낭비일 뿐이다. 돌려보내라."
 asa_anarchist_revolt.4.c: "체포하라. 그들은 범죄자다."
 asa_anarchist_revolt.5.t: "시위대 대우"
 asa_anarchist_revolt.5.desc: "시위대의 첫 번째 요구는 그들과 다른 시위자들이 사면과 존중을 받고, 이 행진으로 인해 체포되지 않는 것입니다."
 asa_anarchist_revolt.5.a: "시위대를 사면한다"
 asa_anarchist_revolt.5.b: "그들에게 가벼운 형을 내리겠다"
 asa_anarchist_revolt.5.c: "타협은 없다"
 asa_anarchist_revolt.6.t: "노동자 대우"
 asa_anarchist_revolt.6.desc: "시위대는 또한 정부가 일반 노동 계급 시민과 노동자에게 더 많은 보호를 제공할 것을 요구합니다. 그들은 이것이 가장 큰 우선순위 중 하나라고 말합니다."
 asa_anarchist_revolt.6.a: "노동자 협동조합을 위한 새로운 보호법을 제정하겠다"
 asa_anarchist_revolt.6.b: "노동조합과 협동조합에 눈감아 주겠다"
 asa_anarchist_revolt.6.c: "타협은 없다"
 asa_anarchist_revolt.7.t: "비상 정부를 끝내다"
 asa_anarchist_revolt.7.desc: "시위대는 또한 맥클렐런이 사실상의 독재자 권한을 부여받은 것에 대해 분노하고 있습니다. 그들은 그를 권력에서 완전하고 무조건적으로 제거하고 민주주의로 돌아갈 것을 요구합니다."
 asa_anarchist_revolt.7.a: "좋다. 나는 물러나겠다."
 asa_anarchist_revolt.7.b: "절대 안 돼. 끝까지 지켜보겠다."
 asa_anarchist_revolt.8.t: "노동 시간 단축"
 asa_anarchist_revolt.8.desc: "시위대는 연방 정부가 일요일 직전인 토요일을 직원들의 휴일로 삼도록 기업에 강제할 것을 요구하고 있습니다."
 asa_anarchist_revolt.8.a: "그들에게 토요일을 휴일로 주자"
 asa_anarchist_revolt.8.b: "대신 일일 노동 시간을 단축해 주자"
 asa_anarchist_revolt.8.c: "타협은 없다"
 asa_anarchist_revolt.10.t: "합의에 도달하다!"
 asa_anarchist_revolt.10.desc: "몇 시간의 논의 끝에, 미국 대통령은 자신과 시위 지도자들이 합의에 도달하여 어떠한 종류의 반란도 피할 수 있었다고 발표했습니다."
 asa_anarchist_revolt.10.a: "내가 이거 가라앉을 거라고 했잖아"
 asa_anarchist_revolt.11.t: "회담 결렬"
 asa_anarchist_revolt.11.desc: "안타깝게도 대통령과 혁명가들 간의 회담은 결렬되었습니다. 혁명가들의 지도자들은 필라델피아로 떠났습니다. 그러나 그는 어떻게든 연방 정부의 부패를 뿌리 뽑겠다고 선언하지 않고 떠나지 않았습니다."
 asa_anarchist_revolt.11.a: "정말 애들 같군"
 asa_anarchist_revolt.12.t: "필라델피아가 들고 일어나다"
 asa_anarchist_revolt.12.desc: "오늘 아침, 필라델피아 시 경찰은 시위하며 하루를 보낼 것으로 예상했던 사람들이 소총, 총검, 칼, 심지어 일부 대포까지 들고 정부 건물에 도착했을 때 경악했습니다. 시장과 연방 정부에 충성하는 모든 시민들은 시위자들이 분리주의자가 되어 필라델피아 시에 새로운 국가를 설립할 것을 선언하자 어쩔 수 없이 도망쳐야 했습니다."
 asa_anarchist_revolt.12.a: "반역자들에게 죽음을"
 asa_anarchist_revolt.12.b: "혁명이 시작되었다...(필라델피아로 플레이)"
 asa_new_country.1: "새로운 국가"
 asa_new_country.1.t: "새로운 국가"
