 AF_O_K_galvanize_country: "우리 국가를 활성화"
 AF_O_K_distribute_bibles_desc: "성경은 서구 사회의 근간입니다. 그들의 길을 따르려면 그들의 뿌리를 따라야 합니다."
 AF_O_K_trading_nation_desc: "무역은 미래이며, 부를 수입하고 우리의 인프라를 발전시킵니다."
 AF_O_K_open_trading_post_desc: "무역 거점을 건설하면 육로든 해상이든 무역이 더 쉬워질 것입니다."
 AF_O_K_open_international_relations_desc: "무역은 외교에서 시작되므로, 우리는 주변 세계에 개방해야 합니다."
 AF_O_K_portugal_merchants_desc: "해상 무역으로 유명한 포르투갈 상인들을 초대할 것입니다."
 AF_O_K_crude_ports_desc: "기술이 부족하더라도, 외국 상인들을 환영하기 위해 최소한 항구를 건설할 수 있습니다."
 AF_O_K_exploit_interior_desc: "우리 국가의 내륙은 자원으로 가득 차 있습니다. 이를 통해 이익을 얻읍시다."
 AF_O_K_french_merchants_desc: "국민과의 친밀함으로 유명한 프랑스 상인들을 초대할 것입니다."
 AF_O_K_french_administrators_desc: "프랑스 행정관들을 초대하여 토지를 더 효율적으로 개발하도록 돕게 합시다."
 AF_O_K_learn_language_desc: "외국 서구 언어를 배우면 그들과 우리 사이의 소통이 더 쉬워질 것입니다."
 AF_O_K_british_military_desc: "영국군은 위업으로 유명합니다. 우리 군대 개선을 위해 도움을 요청합시다."
 AF_O_K_british_merchants_desc: "군사력으로 유명한 영국 상인들을 초대할 것입니다."
 AF_O_K_early_infrastructure_desc: "약간의 인프라 개선은 우리에게 큰 도움이 될 수 있습니다."
 AF_O_K_resource_exploitation_desc: "이전에는 접근할 수 없었던 많은 자원들을 이제 개발할 수 있습니다. 우리도 그들을 개발해야 합니다."
 AF_O_K_the_french_sphere_desc: "프랑스와의 협력은 우리가 그들의 영역에 진입하도록 허용합니다. 우리나라는 이제 프랑스의 외교 및 행정력 아래 안전합니다."
 AF_O_K_british_companies_desc: "영국 회사들은 그들이 개발하는 땅을 개선하는 것으로 유명하며, 심지어 그들을 착취하더라도 말입니다."
 AF_O_K_portugese_trading_expertise_desc: "포르투갈과의 협력은 우리가 무역이 어떻게 작동하는지 배울 수 있도록 하며, 최고의 스승을 얻게 됩니다. 우리나라는 이제 무역 전문가입니다."
 AF_O_K_british_military_expertise_desc: "영국과의 협력은 우리가 군대를 완벽하게 만들도록 허용합니다. 우리나라는 이제 우리 지역에서 최고의 군대 중 하나를 갖게 됩니다."
 AF_O_K_invite_foreign_investors_desc: "외국인 투자자들은 수입의 일부를 대가로 우리 땅을 개발할 것입니다."
 AF_O_K_western_kingdom_desc: "우리는 서구 왕국이며, 식민주의자들을 두려워하지 않고 그들과 협력하는 법을 배웠습니다."
 AF_O_K_create_political_caste_desc: "정치 카스트를 창설하면 더 구조적인 행정 시스템을 만들 수 있습니다."
 AF_O_K_nascent_economy_desc: "우리 국가의 개선은 스스로를 지탱할 수 있는 경제를 갖게 해줍니다."
 AF_O_K_develop_slave_market_desc: "노예 시장은 이 대륙과의 무역을 통해 부를 창출할 것입니다."
 AF_O_K_organize_work_desc: "업무를 조직하면 건설 노력이 더 효율적으로 이루어질 것입니다."
 AF_O_K_small_farms_desc: "소규모 농장은 우리 국가에 식량을 제공할 것입니다."
 AF_O_K_noble_feodalism_desc: "봉건제를 기반으로 한 구조적 시스템을 만들면 왕이 중요한 문제를 통치할 수 있는 충분한 분권화를 제공하면서 모든 땅을 통제할 수 있습니다."
 AF_O_K_regional_influence_desc: "우리는 우리 주변의 누구와도 경쟁할 수 있는 힘을 가지고 있습니다. 이를 세상에 보여줍시다."
 AF_O_K_western_oriented_desc: "서구 세계는 제공할 것이 많습니다. 그들에게 개방합시다."
 AF_O_K_create_nobility_desc: "귀족 작위를 만들면 엘리트와 부유한 사람들에게 통제권을 가지고 있다는 느낌을 주면서, 우리 국민들 사이에서 충성심과 정당성을 높일 것입니다."
 AF_O_K_specialized_workforce_desc: "노동력을 전문화하면 더 효율적인 시스템을 만들고, 결국 더 많은 부를 더 빠르게 얻게 될 것입니다."
 AF_O_K_define_culture_desc: "우리가 무엇을 의미하고, 무엇을 믿는지, 우리의 문화가 무엇인지 파악해야 합니다."
 AF_O_K_our_capital_desc: "모든 국가에는 수도가 있습니다. 우리는 이미 도시를 수도로 사용하고 있지만, 공식화해야 합니다."
 AF_O_K_focus_our_culture_desc: "우리 국민의 문화는 서구의 지식보다 더 중요합니다."
 AF_O_K_sacred_text_language_desc: "우리 언어로 된 성스러운 경전을 배포하면 우리의 문화적 정체성을 공고히 할 것입니다."
 AF_O_K_grand_kingdom_desc: "우리는 대왕국이며, 식민주의자들이 필요 없고 스스로를 방어할 만큼 강력합니다."
 AF_O_K_isolated_nation_desc: "우리 국가, 홀로, 노력할 것입니다. 우리는 서구인들이 필요 없고, 앞으로도 결코 필요 없을 것입니다."
 AF_O_K_neighbor_diplomacy_desc: "우리는 물론 이웃이 있으며, 그들과 외교적으로 또는 검으로 교류해야 합니다."
 AF_O_K_menacing_presence_desc: "우리는 우리 주변에서 위협적인 존재이며, 두려움을 받는 국가이며, 영토 확장을 망설이지 않을 국가입니다."
 AF_O_K_protect_towns_desc: "우리의 가장 큰 마을들은 우리 주변의 적들로부터 보호가 필요합니다."
 AF_O_K_peaceful_development_desc: "우리는 평화롭게 발전하고, 이웃들과 거래하고 교역하는 방법을 찾을 수 있습니다."
 AF_O_K_high_grade_swords_desc: "우리는 최고의 검을 만들기 위해 우리의 야금술을 완벽하게 만들어야 합니다."
 AF_O_K_prospect_land_desc: "우리 영토 주변에는 자원이 있습니다. 그것들을 찾기 위해 필요한 자금을 투입해야 합니다."
 AF_O_K_develop_towns_desc: "우리 마을은 종종 작고 발전이 없습니다. 그들에게 더 투자해야 합니다."
 AF_O_K_limited_trade_desc: "서구 강대국들에게 우리의 무역을 개방하지 않더라도, 최소한 가장 가까운 이웃들과는 거래할 수 있습니다."
 AF_O_K_systematic_conscription_desc: "우리 국기 아래의 모든 사람들은 우리를 위해 싸울 수 있어야 합니다."
 AF_O_K_barracks_desc: "병영은 군사 교육의 시작입니다. 몇 개를 건설하면 우리 군대가 크게 개선될 것입니다."
 AF_O_K_peaceful_treaties_desc: "우리 이웃 중 한 곳과 보호 조약을 맺으면 그들을 보호한다는 구실로 그들의 땅을 차지할 수 있습니다."
 AF_O_K_search_precious_materials_desc: "우리 주변에는 귀중한 자재가 있습니다. 우리가 해야 할 일은 그것들을 찾는 것입니다."
 AF_O_K_divide_lands_between_nobles_desc: "토지를 효율적이고 현명하게 분배하면 땅에 대한 더 많은 권력을 얻을 수 있습니다."
 AF_O_K_early_tactics_desc: "우리 군대가 최고가 되기를 원한다면 전술은 중요합니다."
 AF_O_K_solidify_caste_system_desc: "카스트 제도는 우리 국가의 근간이며, 이를 공고히 하는 것은 우리를 더 강하게 만들 뿐입니다."
 AF_O_K_militia_training_desc: "소규모 민병대를 훈련시키면 우리 적들에 맞설 수 있을 것입니다."
 AF_O_K_help_outside_desc: "외부에 도움을 요청하여 훈련을 지도하고 외국 장비를 얻으십시오."
 AF_O_K_from_spears_rifles_desc: "검의 시대는 훨씬 지났고, 서구 세계는 이제 소총으로 싸웁니다. 모든 무역로가 우리를 통과하므로, 우리는 그들에게서 무기 한두 개를 얻을 수 있을 것입니다."
 AF_O_K_galvanize_country_desc: "우리 군대가 우리 문화와 전통에서 비롯된 방법으로 훈련된다면, 그들은 더 강해질 것입니다."
 AF_O_K_military_culture_desc: "우리 주변에 군국주의 문화를 만들고, 우리 국가와 문화를 보호해야 한다는 의무감을 조성해야 합니다."
 AF_O_K_expansion_territory_desc: "평화적이든 아니든, 우리가 작은 상태로는 멀리 갈 수 없습니다. 우리는 분명히 이웃 영토를 주장하고 국가를 확장해야 합니다."
 AF_O_K_careful_expansion_desc: "우리 국가를 확장하는 행위는 주변으로부터의 기습 공격 위험을 피하기 위해 체계적으로 이루어져야 합니다."
 AF_O_K_everywhere_sun_shines_desc: "우리는 이 지역에서 가장 강력한 국가이며, 이는 우리의 운명이므로 이 땅들을 정복할 것입니다."
 AF_T_idea_ancient_wisdom_4_desc: "이 국가는 고대의 전통과 지혜를 존중합니다."
 eoanb_af_t_tt_focus_influence_neighbors: "§YOne of our neighbours might submit or be thrown into chaos by our religious efforts, leading to them losing stability or political power.§!"
 africa.1.t: "이웃으로부터의 종교적 영향력"
 africa.1.d: "우리 이웃 국가가 우리 국가의 종교에 영향을 미치려는 노력을 시작한 것으로 보입니다. 우리는 어떻게 해야 할까요?"
 africa.1.a: "그냥 용인하면, 결국 사라질 것입니다."
 africa.1.b: "무슨 수를 써서라도 그들의 노력을 되돌려 놓으십시오!"
 AF_T_nomadic_tribal_nation: "유목 부족 국가"
 AF_T_unorganized_tribal_nation_2: "무질서한 부족 국가"
 AF_T_unorganized_tribal_nation_3: "무질서한 부족 국가"
 AF_T_unorganized_tribal_nation_4: "무질서한 부족 국가"
 AF_T_unorganized_tribal_nation_5: "무질서한 부족 국가"
 africa.2.t: "우리 종교의 미래"
 africa.2.d: "우리 국가의 종교가 최근 일부 변화를 겪고 있으며, 아브라함 계통의 종교들로부터 일부 영향이 스며들었습니다. 특정 종교로 나아가야 할까요, 아니면 정령 숭배 상태로 남아 있어야 할까요?"
 africa.2.a: "수니파의 가치로 나아가야 합니다."
 africa.2.b: "콥트파의 가치로 나아가야 합니다."
 africa.2.c: "정령 숭배 상태로 남아 있어야 합니다."
 eoanb_tt_event_africa_2_a: "§YOur religion will change to Sunni.§!"
 eoanb_tt_event_africa_2_b: "§YOur religion will change to Coptic.§!"
 eoanb_tt_event_africa_2_c: "§YOur religion will remain Animist.§!"
 eoanb_om_africa_meet_west: "외교적 접촉"
 eoanb_af_t_tt_focus_western_leaders: "§GOur relations with the colonial powers will improve.§!"
#autocracy:0 "§GWe will become an organized Tribal Nation!§!"
 eoanb_af_t_tt_focus_organize_theocracy: "§GWe will become an organized Tribal Nation!§!"
 eoanb_af_t_tt_focus_organize_chauvpop: "§GWe will become an organized Tribal Nation!§!"
 africa.3.t: "우리 국경 설정"
 africa.3.d: "우리는 이제 공식적으로 국경을 그어 확립했으며, 이제 누가 국경을 넘을 수 있는지에 대한 우리의 정책을 결정해야 합니다..."
 africa.3.a: "국경을 개방해 두십시오. 어쨌든 우리에게 이익이 될 것입니다."
 eoanb_af_t_tt_focus_claim_land: "§YMay unlock decisions to claim neighboring lands depending on current circumstances.§!"
 africa.3.b: "비용이 들더라도 국경을 폐쇄해야 합니다."
 africa.4.t: "[Root.GetAdjective] 부족 공동체가 무기를 생산합니다!"
 africa.4.d: "우리 국가의 작은 부족 공동체가 독립적으로 무기를 생산하여 우리 국가에 선물로 제공했습니다! 우리가 받아들여야 할까요?"
 africa.4.a: "네, 그들에게 감사하세요!"
 africa.4.b: "시간 낭비입니다! 그들은 대신 농사를 지어야 합니다."
 eoanb_flag_event_africa_4: "이 국가는 지역 공동체로부터 부족 무기를 받았습니다."
 eoanb_flag_event_africa_5: "이 국가는 최근 풍작을 거두었습니다."
 AF_T_great_harvest: "풍작"
 AF_T_great_harvest_desc: "§WEvery owned state will be temporarily §!§Gimmune to famines§!§W and undergo an economic §!§CBoom§! §Wcycle.§!\n\n이 부족은 최근에 풍년을 맞았습니다."
 africa.5.t: "풍작"
 africa.5.d: "유리한 날씨와 토양 조건 덕분에 우리는 최근 풍작을 거두었습니다. 이것은 우리 국가에 긍정적인 영향을 미칠 것입니다."
 africa.5.a: "훌륭합니다!"
 africa.6.t: "[DEBUG] 숨겨진 이벤트"
 africa.6.d: "이 이벤트는 국가 플래그를 지웁니다."
 africa.6.a: "알겠습니다."
 tribal_decisions_eoanb: "부족 결정"
 eoanb_decision_generic_recruit_tribal_warriors: "부족 전사 모집"
 eoanb_decision_generic_recruit_tribal_warriors_desc: "우리 국가에 전사들이 필요합니다. 우리는 지역 부족들로부터 일부 남성들을 모집해야 합니다."
 AF_T_idea_trading_nation: "무역에 집중"
 AF_T_idea_trading_nation_desc: "이 국가는 무역에 크게 집중합니다."
 AF_T_idea_trading_nation_2: "무역에 집중"
 AF_T_idea_trading_nation_2_desc: "이 국가는 무역에 크게 집중합니다."
 eoanb_om_africa_trade_focus: "무역 관계"
 AF_T_idea_resource_exploit: "자원 개발"
 AF_T_idea_resource_exploit_desc: "이 국가는 많은 천연 자원을 개발합니다."
 eoanb_om_africa_language_focus: "번역가"
 eoanb_af_t_tt_focus_british_companies: "§YMay unlock decisions or events relating to British investment in our country depending on current circumstances.§!\n"
 eoanb_af_t_tt_focus_french_companies: "§YMay unlock decisions or events relating to French investment in our country depending on current circumstances.§!\n"
 eoanb_af_t_tt_focus_portugese_companies: "§YMay unlock decisions or events relating to Portugese investment in our country depending on current circumstances.§!\n"
 eoanb_af_t_tt_focus_german_companies: "§YMay unlock decisions or events relating to German investment in our country depending on current circumstances.§!\n"
 eoanb_af_t_tt_focus_create_nobility: "§GAllows our nation to adjust the Tax rate.§!"
 africa.7.t: "우리만의 기독교"
 africa.7.d: "성경을 배포한 후, 우리는 기독교로 빠르게 변화할 것으로 예상합니다. 이 종교에는 가톨릭과 개신교라는 두 개의 주요 교파가 있습니다. 이제 어느 쪽을 선택할지 결정해야 합니다."
 africa.7.a: "가톨릭 편에 서야 합니다."
 africa.7.b: "개신교 편에 서야 합니다."
 jihadist_africa.1.t: "다와의 가르침"
 jihadist_africa.1.d: "코란을 배포한 후, 우리는 수니파 이슬람으로 빠르게 변화할 것으로 예상합니다."
 jihadist_africa.1.a: "마샬라!"
 coptic_africa.1.t: "우리만의 기독교"
 coptic_africa.1.d: "성경을 배포한 후, 우리는 콥트 기독교로 빠르게 변화할 것으로 예상합니다."
 coptic_africa.1.a: "하나님을 찬양하라!"
 AF_T_organized_tribal_nation_2: "조직된 부족 국가"
 AF_T_organized_tribal_nation_3: "조직된 부족 국가"
 AF_T_idea_slaves_developed: "발전된 노예 시장"
 AF_T_idea_slaves_developed_desc: "이 국가는 최근 노예 시장을 발전시켰습니다."
 AF_T_idea_sacred_texts: "성스러운 경전"
 AF_T_idea_sacred_texts_desc: "이 국가는 자체적으로 성스러운 경전을 발전시켰습니다."
 AF_T_idea_isolation_aggressive: "군사적 고립"
 AF_T_idea_isolation_aggressive_desc: "이 국가는 세계 무대에서 스스로를 고립시키며, 군사 문제에 대한 열렬한 집중으로 자신의 이익을 보호합니다."
 AF_T_idea_isolation_aggressive_2: "군사적 고립"
 AF_T_idea_isolation_aggressive_2_desc: "이 국가는 세계 무대에서 스스로를 고립시키며, 군사 문제에 대한 열렬한 집중으로 자신의 이익을 보호합니다."
 AF_T_idea_isolation_aggressive_3: "군사적 고립"
 AF_T_idea_isolation_aggressive_3_desc: "이 국가는 세계 무대에서 스스로를 고립시키며, 군사 문제에 대한 열렬한 집중으로 자신의 이익을 보호합니다."
 AF_T_idea_isolation_peaceful: "평화적 고립"
 AF_T_idea_isolation_peaceful_desc: "이 국가는 평화적인 내부 성장을 통해 위대함을 이루려 노력하며 세계 무대에서 스스로를 고립시킵니다."
 eoanb_om_africa_peace_focus: "평화 보장"
 eoanb_af_t_tt_focus_expand_territory: "§YEvents and Decisions on the matter of territorial expansion may be unlocked or happen depending on current circumstances.§!"
 eoanb_om_africa_expansion_mild_focus: "온건한 영토 야심"
 eoanb_om_africa_expansion_wild_focus: "광범위한 영토 야심"
 AF_T_idea_military_culture: "군국주의 문화"
 AF_T_idea_military_culture_desc: "이 국가는 군국주의 문화를 가지고 있습니다."
 eoanb_af_t_tt_focus_invite_investors: "§YColonial Powers may invest in us in the future.§!"
 eoanb_af_t_tt_small_kingdom_western: "§GWe will become a §!§YWestern-Oriented Small Kingdom§!§G and work towards industrializing to adapt to changing times!§!\n\n"
 eoanb_tt_event_africa_8_a: "§YWe will unlock the Organized Tribal Focus Tree.§!"
 eoanb_tt_event_africa_8_b: "§YWe will wait a bit longer before considering our future.§!"
 africa.8.t: "[Root.GetNameDef]의 미래"
 africa.8.d: "우리 국가는 방향을 정했으며, 이제 세계에서 우리 자신을 정렬하기 위해 미래에 어떤 단계를 밟을지 고려해야 할 때일 수 있습니다."
 africa.8.a: "우리의 운명을 개척할 것입니다!"
 africa.8.b: "고려할 시간이 더 필요합니다."
 eoanb_af_t_tt_jihadist_revolution: "§GWe will perform a §!§YJihadist Revolution§!§G that will bring stability, reforms, and protection through faith in Allah!§!\n\n"
 eoanb_af_t_tt_small_kingdom_grand: "§GWe will become an §!§YIndependent Small Kingdom§!§G that will bring defense and stability through isolationism!§!\n\n"
 eoanb_flag_focus_africa_unorg_people: "이 국가는 국민을 통합할 준비가 되었습니다."
 eoanb_flag_focus_africa_org_caste: "이 국가는 카스트 제도를 창설할 준비가 되었습니다."
 africa.9.t: "우리 국민은 단결했습니다"
 africa.9.d: "우리 국민은 우리의 국가적 이념 아래 단결했으며, 원한다면 더 체계적인 방식으로 그들을 통치할 준비가 되었습니다."
 africa.9.a: "그들을 더욱 단결시킬 때입니다!"
 africa.9.b: "상황이 안정될 때까지 기다려야 합니다."
 africa.10.t: "우리 국가를 위한 카스트 제도?"
 africa.10.d: "우리 국가는 최근 안정되고 현대화를 위한 몇 가지 단계를 밟았으며, 이제 카스트 제도를 창설할 준비가 되었을 수 있습니다."
 africa.10.a: "필요한 단계를 시작해야 합니다."
 africa.10.b: "우리는 아직 준비되지 않았습니다."
