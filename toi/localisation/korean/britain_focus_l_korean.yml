l_english:
 ENG_focus_1857_elections: "1857년 총선"
 ENG_focus_1857_elections_desc: "애로우호 사건과 아편 전쟁에서의 팔머스턴 경의 행동으로 인해 선거가 소집되었습니다. 보수당은 서민원에서 휘그당의 지배에 도전하고자 합니다."
 ENG_focus_Inclosure_act_1857: "1857년 인클로저 법안"
 ENG_focus_Inclosure_act_1857_desc: "1857년 인클로저 법안은 공유지를 인클로저하는 과정을 더욱 진행시킬 것입니다."
 ENG_focus_Obscene_publications_act: "외설 출판물 법안"
 ENG_focus_Obscene_publications_act_desc: "외설 출판물 법안은 영국을 괴롭히는 외설 문학 및 포르노의 악덕을 더욱 제한하고 외설적인 문학 자료에 대한 경찰 수색을 강화할 것입니다. 이것은 우리 국가가 저속하거나 현재의 과학적 서사에 반하는 정보를 포함하는 것으로 간주되는 문학을 은밀히 진압할 수 있도록 할 것입니다."
 ENG_focus_matrimonial_causes_act: "혼인 문제 법안"
 ENG_focus_matrimonial_causes_act_desc: "혼인 문제 법안은 이혼법을 개혁하고 이혼을 위한 새로운 법원을 만들 것입니다."
 ENG_focus_government_of_india_act: "인도 통치법"
 ENG_focus_government_of_india_act_desc: "인도 통치법은 이 지역을 왕실에 통합함으로써 인도 문제를 해결할 것입니다."
 ENG_focus_ignore_the_indian_issue: "인도 문제 무시"
 ENG_focus_ignore_the_indian_issue_desc: " "
 ENG_focus_conspiracy_to_murder_bill: "살인 모의 법안"
 ENG_focus_conspiracy_to_murder_bill_desc: "우리의 현재 법률은 살인 모의를 범죄인 인도 대상이 아닌 경범죄로 규정하고 있습니다. 최근 오르시니 사건에 비추어 볼 때, 이 새로운 법안이 얼마나 인기가 없더라도 이 정책은 반드시 바뀌어야 합니다. 이러한 행동을 억제하기 위해 처벌을 훨씬 더 엄격하게 만들어야 합니다."
 ENG_focus_1859_elections: "1859년 총선"
 ENG_focus_1859_elections_desc: "더비가 이끄는 소수 보수당 정부가 과반수 의석을 얻으려고 시도함에 따라 소집된 총선입니다. 이 선거는 보수당이 자유주의 휘그당에 대해 다시 우위를 점하려고 시도할 것입니다."
 ENG_focus_Palmerston_Wins: "팔머스턴 총선 승리"
 ENG_focus_Palmerston_Wins_desc: "예상대로, 팔머스턴은 더비를 물리치고 서민원에서 자유주의와 휘그당의 지배를 유지했습니다. 팔머스턴은 휘그당뿐만 아니라 필파, 급진파, 아일랜드 여단까지 소집하여 더비를 진압하고 불신임 투표에서 승리할 수 있었습니다."
 ENG_focus_Derby_Wins: "더비 총선 승리"
 ENG_focus_Derby_Wins_desc: "놀라운 사건의 전환으로, 더비와 보수당은 팔머스턴을 물리치고 과반수 의석을 얻었습니다. 팔머스턴의 법안에 대한 비인기성을 이용하여 더비는 서민원에서 우위를 확보했습니다."
 ENG_focus_companies_act: "회사법"
 ENG_focus_companies_act_desc: "너무 오랫동안 우리는 영국 회사에 대해 너무 관대했습니다. 우리는 사업이 공정하게 수행되고 법을 어기는 사람들이 책임을 지도록 적절한 규제를 마련해야 합니다."
 ENG_focus_molestation_workmen_act: "노동자 희롱 법안"
 ENG_focus_molestation_workmen_act_desc: "우리 노동자들을 달래는 것은 중요한 균형입니다. 우리는 노동자들이 피켓 시위를 할 권리를 보장해야 합니다. 그러나 이 노동자들이 피켓 시위를 하도록 강요당하는 것에 관해서는, 원하신다면 언제든지 평화적인 강제가 있을 수 있습니다."
 ENG_focus_offences_against_person_act: "대인 범죄 법안"
 ENG_focus_offences_against_person_act_desc: "우리의 형법은 절실히 명확하게 될 필요가 있습니다. 우리는 살인이나 과실치사와 같은 폭력 범죄에 대한 법을 시행하고 이러한 용어를 명확하게 정의해야 합니다. 영국의 국민에 대한 이러한 범죄에 대한 처벌에 관한 법률도 덜 모호하도록 재작성해야 합니다."
 ENG_focus_metro_fire_brigade_act: "메트로 소방대 법안"
 ENG_focus_metro_fire_brigade_act_desc: "런던에서는 화재가 만연하고 있으며 우리는 이 파괴적인 힘과 싸울 능력이 거의 없습니다. 우리는 그러한 재난의 경우에 시민들을 돕기 위해 도시에 소방대를 제공해야 합니다."
 ENG_focus_criminal_law_consolidation_acts: "형법 통합 법안"
 ENG_focus_criminal_law_consolidation_acts_desc: "영국 형법은 믿을 수 없을 정도로 복잡하여 합병증과 오해를 초래합니다. 우리의 법을 제대로 시행하기 위해서는 그러한 혼란을 줄이기 위해 철저하게 단순화해야 합니다."
 ENG_focus_coal_mines_consolidation_act_1860: "1860년 탄광 규제 법안"
 ENG_focus_coal_mines_consolidation_act_1860_desc: "10살짜리 어린이가 영국 탄광의 혹독한 환경에서 일하는 것은 끔찍한 일입니다. 우리는 최소 연령을 적어도 12세로 올리고 안전 규제를 더욱 개선해야 합니다."
 ENG_focus_land_registry_act: "토지 등기 법안"
 ENG_focus_land_registry_act_desc: "우리는 과거에 토지 등기 시스템을 구축하려고 시도했지만 비효율적이었습니다. 우리는 이 과정이 작동하도록 법률을 통과시켜야 합니다."
 ENG_focus_locomotives_highway_act: "고속도로 기관차 법안"
 ENG_focus_locomotives_highway_act_desc: "자동차는 위험하고 규제되지 않은 새로운 발명품입니다. 이 기계들의 속도를 제한해야 하며 우리는 소유자를 등록할 수 있어야 합니다. 우리의 고속도로는 모든 사람에게 안전한 장소가 되어야 합니다."
 ENG_focus_habeas_corpus_act: "인신보호 영장 법안"
 ENG_focus_habeas_corpus_act_desc: "우리는 다양한 영국 자치령과 식민지에 관심이 있지만, 그들의 법률 시스템은 우리에게 거의 관심이 없습니다. 우리는 우리 법원이 외국에 인신보호 영장을 발급하는 능력을 규제할 것입니다."
 ENG_focus_adulteration_food_drinks_act: "식음료 불순물 혼합 법안"
 ENG_focus_adulteration_food_drinks_act_desc: "판매자가 우리 식음료에 유해한 불순물을 남기고 아무런 증거 없이 다양한 건강상의 이점을 약속하는 제품을 판매하는 것은 우리 국가의 문제입니다. 우리는 우리 식음료의 안전을 위태롭게 하는 그러한 물질의 포함을 규제해야 합니다."
 ENG_focus_poaching_prevention_act: "밀렵 방지 법안"
 ENG_focus_poaching_prevention_act_desc: "사냥은 훌륭한 영국의 스포츠입니다. 그러나 우리는 그 합법성을 보장할 권한이 있어야 합니다. 우리는 순경들이 불법적으로 사냥감을 밀렵했다고 의심되는 사람들을 멈추고 수색할 수 있는 능력을 갖도록 제안할 것입니다."
 ENG_focus_medical_act: "의료 법안"
 ENG_focus_medical_act_desc: "영국 환자들은 합법적이고 자격을 갖춘 의료인과 경험이 거의 없는 의료인을 구별할 수 있어야 합니다. 이를 위해서는 의사를 규제하도록 설계된 시스템이 필요합니다."
 ENG_focus_1865_general_elections: "1865년 총선"
 ENG_focus_1865_general_elections_desc: "서민원에서 또 다른 총선이 열리고 있습니다. 더비는 보수당을 위해 더 많은 의석을 얻기를 희망하고, 팔머스턴의 자유당은 이전의 휘그당이었던 그들의 다수당 지위를 강화하기를 희망합니다."
 ENG_focus_Palmerston_wins2: "팔머스턴 총선 승리"
 ENG_focus_Palmerston_wins2_desc: "팔머스턴은 이전 선거에서 다수당에 타격을 입은 후 1865년 선거에서 승리했습니다. 이제 자유당은 보수당에 대해 80석 이상의 다수당을 얻었습니다."
 ENG_focus_Derby_wins2: "더비 총선 승리"
 ENG_focus_Derby_wins2_desc: "더비와 보수당은 이전 선거에서 서민원에 대한 그들의 장악력을 더욱 줄인 후 자유당을 물리쳤습니다."
 ENG_focus_ireland_crisis: "아일랜드 위기"
 ENG_focus_ireland_crisis_desc: "우리의 자비로운 통치에 반대하는 봉기가 아일랜드에서 일어났습니다. 우리는 이 반란을 신속하게 진압하고, 그들의 지도자들을 체포하고, 그에 따라 그들을 처벌해야 합니다. 이 반란이 성공할 가능성은 없지만, 우리 국민에 대한 끊임없는 테러 공격은 사기에 타격을 줍니다."
 ENG_focus_parliamentary_oaths_act_1866: "1866년 의회 선서 법안"
 ENG_focus_parliamentary_oaths_act_1866_desc: "서민원의 모든 구성원은 의석에 선출되면 영국 군주에 대한 충성을 맹세해야 합니다. 빅토리아 여왕 만세!"
 ENG_focus_national_debt_reduction_1866: "1866년 국가 부채 감소"
 ENG_focus_national_debt_reduction_1866_desc: "우리는 특정 자본 주식과 연금을 취소함으로써 국가 부채를 개혁할 것입니다."
 ENG_focus_reform_proposials: "새로운 개혁 제안"
 ENG_focus_reform_proposials_desc: "우리 국가에서 실제로 선거에서 투표할 권리를 가진 사람들은 거의 없습니다. 이러한 투표 제한은 솔직히 차별적이며, 우리는 모든 남성에게 투표권을 부여하기 위해 노력해야 합니다!"
 ENG_focus_1867_reform_act: "1867년 개혁 법안"
 ENG_focus_1867_reform_act_desc: "참정권은 우리 사회의 중요한 부분이지만, 우리 선거에서 투표할 수 있는 사람은 거의 없습니다. 특히 잉글랜드와 웨일즈의 남성 노동 계급에게 참정권을 부여할 때입니다. 이 개혁은 보수당에 긍정적으로 반영될 것입니다."
 ENG_focus_1868_general_elections: "1868년 총선"
 ENG_focus_1868_general_elections_desc: "1867년 개혁 법안으로 인해 우리 국가의 많은 사람들이 참정권을 얻었으므로, 이것은 우리 역사상 가장 많이 투표된 선거가 될 것입니다. 양당 모두 과반수 의석을 확보할 좋은 기회를 가지고 있습니다."
 ENG_focus_Gladstone_wins: "글래드스턴 총선 승리"
 ENG_focus_Gladstone_wins_desc: "글래드스턴과 자유당은 승리하여, 서민원에 대한 그들의 장악력을 또다시 유지했습니다."
 ENG_focus_Disraeli_wins: "디즈레일리 총선 승리"
 ENG_focus_Disraeli_wins_desc: "디즈레일리와 보수당은 승리하여, 보수당은 서민원에서 치열한 싸움 끝에 승리와 과반수 의석을 확보했습니다."
 ENG_focus_colonial_prisoners_removal_act: "식민지 죄수 이송 법안"
 ENG_focus_colonial_prisoners_removal_act_desc: "우리는 우리 식민지의 죄수들이 어떻게 대우받는지에 대해 발언권이 있어야 합니다. 우리는 식민지 죄수들이 형기를 복역하기 위해 영국으로 이송되는 것을 합법화하는 법률을 통과시킬 것입니다."
 ENG_focus_irish_church_act: "아일랜드 교회 법안"
 ENG_focus_irish_church_act_desc: "아일랜드 교회는 작은 종교적 소수자에 대해 너무 많은 권력을 가지고 있습니다. 우리는 이 아일랜드 교회를 해체하고, 단순히 영국 교회에 통합할 것입니다. 이제 아일랜드인은 우리의 자비로운 허락 없이 십일조를 징수할 수 없습니다."
 ENG_focus_metropolitan_public_carriage_act: "메트로폴리탄 공공 마차 법안"
 ENG_focus_metropolitan_public_carriage_act_desc: "우리는 메트로폴리탄 경찰 구역 내에서 해크니 마차와 역마차의 사용을 규제해야 합니다."
 ENG_focus_elementary_education_1870_act: "1870년 초등 교육 법안"
 ENG_focus_elementary_education_1870_act_desc: "우리 국가의 공교육은 형편없습니다. 우리는 5세에서 12세 사이의 모든 어린이가 초등 교육을 받도록 하고 기존 학교에 더 많은 자금을 지원해야 합니다. 의무는 아니지만, 대부분의 사람들은 이 변화로부터 혜택을 얻으려고 노력할 것입니다."
 ENG_focus_irish_land_act: "아일랜드 토지 법안"
 ENG_focus_irish_land_act_desc: "아일랜드의 토지 소유권 분배는 문제입니다. 아일랜드 농부의 3%가 토지를 소유하고 있고 나머지 97%는 소작인입니다. 우리는 이 패턴을 뒤집고 소작 계약 문제를 다루려고 노력할 것입니다."
 ENG_focus_go_with_coles: "콜스와 함께 가기"
 ENG_focus_go_with_coles_desc: "크림 전쟁의 참전 용사인 C.P. 콜스 대위는 최근 그가 '완전히 회전하는 함포탑'이라고 부르는 발명품의 특허를 발표했습니다. 그는 뗏목 위에 시제품 설계를 성공적으로 제작했으며, 이를 이용해 타간로크의 러시아 진지를 성공적으로 포격했습니다.\n\n모든 방향으로 발사할 수 있는 보호된 함포 포대의 아이디어는 혁명적일 것으로 보입니다. 이 아이디어를 위해 노련한 대위에게 접근해야 할까요?"
 ENG_focus_ericsson_is_right: "에릭슨이 옳다"
 ENG_focus_ericsson_is_right_desc: "미국 남북 전쟁에서 사용된 그의 설계를 본받아, 에릭슨은 모니터함이 미래의 함선이라고 제안합니다. 이 함선들은 작고 상대적으로 장갑이 약하지만, 파괴적인 함포를 가지고 있습니다. 그의 계획을 채택함으로써 우리의 해군 화력은 다른 국가의 그것을 능가할 가능성이 높습니다."
 ENG_focus_listen_to_watts: "와츠의 아이디어 선택"
 ENG_focus_listen_to_watts_desc: "와츠는 중장갑 철갑 프리깃함에 대한 설계를 만들었습니다. 이 설계는 상당한 장갑과 현측 함포를 가지고 있습니다. 그의 제안을 받아들임으로써 우리는 크게 장갑화된 선체를 가진 이 떠다니는 짐승들을 생산하는 데 집중할 것입니다."
 ENG_focus_listen_to_robinson: "로빈슨에게 귀 기울이기"
 ENG_focus_listen_to_robinson_desc: "우리 장교 중 한 명인 로버트 S. 로빈슨은 해군 함선에 장갑을 구현하거나 철제 선체로 건조해야 한다고 주장해 왔습니다. 그는 탄도학, 포술 및 포탄 유형에 대한 전 세계의 현재 개발 패턴이 함선이 효과적으로 싸우기 위해 철제 선체가 제공하는 장갑을 필요로 한다고 주장합니다. 나무 선체는 선박 자체의 여명기부터 함선의 주류였지만, 로빈슨의 주장이 맞을 수도 있습니다. 진보는 아무도 기다려주지 않습니다!"
 ENG_focus_player_choice_1: "새로운 모니터함"
 ENG_focus_player_choice_1_desc: "우리는 장갑을 희생하면서도 기동성이 뛰어나고 강력한 함대를 유지하기 위해 모니터함에 대한 우리의 개념을 개선해야 합니다."
 ENG_focus_player_choice_2: "에릭슨의 모니터함"
 ENG_focus_player_choice_2_desc: "에릭슨의 모니터함 설계는 미국 남북 전쟁과 우리의 시험에서 유능함을 입증했습니다. 우리는 그것의 잘 실행된 회전 포탑과 매끄러운 디자인을 위해 그것을 채택해야 합니다."
 ENG_focus_player_choice_3: "새로운 이상적인 전함"
 ENG_focus_player_choice_3_desc: "우리는 기동성을 희생하면서도 함대를 더 중장갑화하고 우월한 화력을 사용하도록 전함에 대한 우리의 개념을 개선해야 합니다."
 ENG_focus_player_choice_4: "로빈슨의 전함"
 ENG_focus_player_choice_4_desc: "로빈슨의 전함 설계는 집중된 함포와 함께 극단적인 양의 화력을 가지고 있습니다. 이 포탑은 움직이지 않아 약간의 기동성을 잃지만, 이 함선은 이 화력과 중장갑으로 이것을 만회합니다."
 ENG_focus_royal_commission_working_conditions: "노동 조건에 대한 왕립 위원회"
 ENG_focus_royal_commission_working_conditions_desc: "이것은 우리가 노동 조건에 대해 가지고 있는 많은 문제들을 강조하기 시작할 것이며, 우리는 그것들에 대해 무언가를 할 수 있기를 희망합니다."
 ENG_focus_mines_regulation_act: "광산 규제 법안"
 ENG_focus_mines_regulation_act_desc: "수십 건의 사고로 인해 많은 노동자들이 사망한 후. 특히 어린이들의 경우 우리는 이 법안을 통과시켜 광산에서 일하는 어린이들의 나이를 12세로 올려야 합니다. 소년들이 읽고 쓸 수 있거나 학교에 다녔다면 예외가 있습니다."
 ENG_focus_further_regulations: "추가 규제"
 ENG_focus_further_regulations_desc: "이것은 법안을 거의 모든 산업을 포함하도록 확장할 것입니다."
 ENG_focus_childrens_employment_commision: "아동 고용 위원회"
 ENG_focus_childrens_employment_commision_desc: "이것은 규제되지 않은 산업의 문제들을 강조할 것입니다. 이는 아동 노동의 전면적인 폐지로 이어질 것입니다."
 ENG_focus_establish_trade_union_congress: "노동조합 회의 설립"
 ENG_focus_establish_trade_union_congress_desc: "이것은 노동조합이 성장하도록 지원하고, '생계를 위해 일하는 모든 사람들을 위해 일어설' 권리를 부여할 것입니다."
 ENG_focus_trade_unions_act: "노동조합 법안"
 ENG_focus_trade_unions_act_desc: "이 법안은 영국에서 처음으로 노동조합을 합법화할 것입니다."
 ENG_focus_concessions_to_workers: "노동자들에게 양보"
 ENG_focus_concessions_to_workers_desc: "노동자들이 문제를 일으키지 않도록 하기 위해, 우리는 때때로 그들에게 약간의 양보를 해야 합니다."
 ENG_focus_sanitary_act: "위생 법안"
 ENG_focus_sanitary_act_desc: "이것은 모든 공장에서 일반적인 위생이 이제 요구되도록 법으로 만들 것입니다. 노동자 조건을 개선합니다."
 ENG_focus_reform_act: "개혁 법안"
 ENG_focus_reform_act_desc: "이것은 더 많은 성인 남성에게 투표권을 줄 것입니다. 그러나 이것은 의도하지 않은 영향을 미칠 것입니다 - 더 많은 유권자는 더 많은 정당 지출을 요구했으며, 이는 보수당만이 감당할 수 있었습니다..."
 ENG_focus_master_servant_act: "주인 및 하인 법안"
 ENG_focus_master_servant_act_desc: "이것은 노동자들이 그들의 계약을 위반하는 것을 범죄로 만들 것입니다."
 ENG_focus_factories_workshop_act: "공장 및 작업장 법안"
 ENG_focus_factories_workshop_act_desc: "이 법안은 특히 젊은 사람들과 여성들을 위해 더 좋고 안전한 작업 조건을 제공하기 위해 이전 법안들을 통합하고 수정합니다."
 ENG_focus_guarantee_fair_wages: "공정한 임금 보장"
 ENG_focus_guarantee_fair_wages_desc: "공정한 임금을 받는 노동자는 더 의욕적이며, 우리의 도시 계급을 강화하는 것은 또한 우리 경제에 이익을 제공할 것입니다. 우리는 법으로 공정한 임금을 입법해야 합니다."
 ENG_focus_assist_the_poor: "빈곤층 돕기"
 ENG_focus_assist_the_poor_desc: "우리 노동자들 중 많은 이들이 빈곤과 열악한 생활 환경에 갇혀 있습니다. 우리는 가장 어려운 사람들을 돕기 위해 일부 사회 프로그램을 제정해야 합니다."
 ENG_focus_persuade_the_royal_consort: "왕실 배우자 설득"
 ENG_focus_persuade_the_royal_consort_desc: "알버트 왕자 전하께서는 그의 새로운 아이디어로 영국을 더 좋게 만들고 싶어하십니다. 그러나 우리는 그에게 우리의 방식을 설득하고 그것이 효과가 있다는 것을 보여주어야 합니다. 비용에 관계없이..."
 ENG_focus_legislation_on_pensions: "연금에 관한 법률"
 ENG_focus_legislation_on_pensions_desc: "노동자들에게 동기를 부여하기 위해, 일부 국회의원들은 노동자들이 노년기에 은퇴한 후 보상으로 연금을 도입할 것을 제안했습니다. 우리는 이것에 대해 생각해야 합니다."
 ENG_focus_the_age_of_retirement: "은퇴 연령"
 ENG_focus_provide_false_promises: "거짓 약속 제공"
 ENG_focus_provide_false_promises_desc: "노동 계급은 변화를 원합니다. 우리는 그들을 조용히 시키기 위해 거짓 희망을 줄 것입니다. 하지만 이것은 그리 오래가지 못할 것입니다..."
 ENG_focus_justify_child_workers: "아동 노동자 정당화"
 ENG_focus_justify_child_workers_desc: "우리는 국내외에서 아동 노동의 사용을 정당화해야 합니다."
 ENG_focus_ignore_the_accidents: "사고 무시"
 ENG_focus_ignore_the_accidents_desc: "실제로 얼마나 많은 직장 사고가 발생하는지 대중에게 알려지면, 더 안전한(덜 효율적인) 작업장에 대한 요구가 있을 것입니다."
 ENG_focus_mines_regulation_act_1: "광산 규제 법안"
 ENG_focus_mines_regulation_act_1_desc: "우리는 더 이상 아동 노동에 관한 문제들을 숨길 수 없습니다. 여론이 너무 낮습니다. 우리는 아동 노동에 관한 법을 바꿔야 합니다."
 ENG_focus_weaken_trade_unions: "노동조합 약화"
 ENG_focus_weaken_trade_unions_desc: "노동조합은 경제에 대한 영향력을 전복시키고 고용주에 대항하여 노동자들을 선동하고 있습니다! 우리는 이것을 종식시키고 이 노동조합의 영향력을 약화시키려고 노력해야 합니다."
 ENG_focus_trade_unions_act_1: "노동조합 법안"
 ENG_focus_trade_unions_act_1_desc: "노동조합의 영향력을 줄이려다가 더 많은 파업을 유발했습니다. 불행히도 우리는 그들을 멈추기 위해 노동자들을 달래야 할 것입니다."
 ENG_focus_lower_taxes_on_buisnesses: "기업에 대한 세금 인하"
 ENG_focus_lower_taxes_on_buisnesses_desc: "노동자 권리에 대한 모든 변화로 인해, 우리 기업들의 이윤율이 너무 낮아졌습니다. 이것을 해결하기 위해 우리는 기업에 대한 세금을 낮춰야 합니다."
 ENG_focus_producivity_first: "생산성 우선"
 ENG_focus_crackdown_on_strikes: "파업 단속"
 ENG_focus_master_servant_act_1: "주인 및 하인 법안"
 ENG_focus_master_servant_act_1_desc: "이것은 노동자들이 그들의 계약을 위반하는 것을 범죄로 만들 것입니다."
 ENG_focus_pro_employer_legislation: "친고용주 법률"
 ENG_focus_end_worker_rights: "노동자 권리 종료"
 ENG_focus_end_worker_rights_desc: "이것은 노동자 권리를 끝내고, 생산 할당량이 충족되도록 보장할 것입니다. 하지만 노동 계급이 이것을 좋아할 가능성은 낮습니다..."
 ENG_focus_no_more_prudction_delays: "더 이상 생산 지연 없음"
 ENG_focus_no_more_prudction_delays_desc: "파업이 흔한 일이 되고 있습니다. 우리는 장기적으로 그들을 더 능숙하게 다루어야 합니다."
 ENG_focus_britannia_rules_the_waves: "브리타니아, 파도를 지배하다"
 ENG_focus_britannia_rules_the_waves_desc: "브리타니아는 진정으로 파도를 지배합니다! 우리의 해군 지배력은 다른 어떤 나라도 필적할 수 없습니다.... 적어도 지금은."
 ENG_focus_maintain_naval_race: "해군 우위 유지"
 ENG_focus_maintain_naval_race_desc: "이제 우리는 최신 함선 함대를 갖게 되었으므로, 우리의 선두가 유지되도록 해야 합니다. 어떻게? 물론 더 많은 함선을 건조하여."
 ENG_focus_begin_naval_drills: "해군 훈련 시작"
 ENG_focus_begin_naval_drills_desc: "우리는 선원들이 우리의 새로운 함선을 더 잘 이해하도록 훈련시키고 규율이 높게 유지되도록 해야 합니다."
 ENG_focus_naval_arms_race: "해군 군비 경쟁"
 ENG_focus_naval_arms_race_desc: "영국 해군 우위에 대한 어떤 위협도 국가 자체에 대한 위협입니다. 따라서 우리는 지구상에서 가장 큰 해군 강국으로 남도록 해야 합니다."
 ENG_focus_lesson_acw: "미국 남북 전쟁의 교훈"
 ENG_focus_lesson_acw_desc: "햄프턴 로즈 해전으로 인해 해전은 영원히 바뀌었습니다. 철갑함은 나무 전함을 상대적으로 쉽게 물리칠 수 있었고, 가장 무거운 포탄을 제외한 모든 것을 쓸어버렸습니다."
 ENG_focus_royal_navy: "왕립 해군"
 ENG_focus_royal_navy_desc: "왕립 해군은 수세기 동안 바다에서 지배적인 세력이었습니다. 그러나 산업 혁명과 기술의 발전으로. 우리는 우리의 해군력이 여전히 타의 추종을 불허하도록 해야 합니다."
 ENG_focus_tramways_act: "트램웨이 법안"
 ENG_focus_tramways_act_desc: "우리는 이 새로운 형태의 교통수단의 법적 지위를 명확히 하고 규제함으로써 그 사용을 장려하고 촉진해야 합니다."
 ENG_focus_1874_general_elections: "1874년 총선"
 ENG_focus_1874_general_elections_desc: "선거를 소집하기로 한 결정은 총리의 동료들을 놀라게 했습니다. 왜냐하면 그들은 그들의 연합에 불만의 큰 부문이 있다는 것을 알고 있었기 때문입니다. 보수당은 중산층에서 이득을 얻고 있었습니다. 이 선거는 접전이 될 것입니다."
 ENG_focus_Gladstone_wins2: "글래드스턴 총선 승리"
 ENG_focus_Gladstone_wins2_desc: "글래드스턴과 자유당은 승리하여, 서민원에 대한 그들의 장악력을 또다시 유지했습니다."
 ENG_focus_Disraeli_wins2: "디즈레일리 총선 승리"
 ENG_focus_Disraeli_wins2_desc: "디즈레일리와 보수당은 승리하여, 보수당은 서민원에서 치열한 싸움 끝에 승리와 과반수 의석을 확보했습니다."
 ENG_focus_regular_exercises: "식민지 훈련 연습"
 ENG_focus_regular_exercises_desc: "제국에서의 우리의 독특한 위치는 뉴펀들랜드의 추위에서 남아프리카의 건조한 평원에 이르기까지 군대와 함께 훈련할 기회를 제공합니다. 정기적인 훈련을 조직합시다!"
 ENG_focus_public_health_act: "공중 보건 법안"
 ENG_focus_public_health_act_desc: "잉글랜드의 공중 보건과 관련된 법안을 통합하고 수정하기 위한 법안입니다. 그 목적은 더러운 도시 생활 환경과 싸우기 위한 이전의 조치들을 성문화하여, 콜레라와 티푸스와 같은 많은 질병의 확산을 포함한 다양한 건강 위협을 야기하는 것이었습니다."
 ENG_focus_customs_consolidation_act: "세관 통합 법안"
 ENG_focus_customs_consolidation_act_desc: "어떤 상품도 특정 장소에서 직접 수입되지 않는 한, 그리고 그 장소에서 수입하는 선박에 최초의 선적으로 또는 그 상품들이 실제로 그 장소에 상륙된 후에 선적되지 않는 한, 특정 장소에서 수입된 것으로 간주되지 않습니다."
 ENG_focus_commons_act: "공유지 법안"
 ENG_focus_commons_act_desc: "이 조항에 따라, 도시나 마을 공지를 침범하거나 둘러싸는 행위, 또는 그 위에 어떤 구조물을 설치하는 행위는 공중 방해에 해당합니다. 도시나 마을 공지 또는 휴게 공간을 더 잘 이용하기 위한 목적으로 수행된 작업..."
 ENG_focus_cruelty_animals_act: "동물 학대 법안"
 ENG_focus_cruelty_animals_act_desc: "이것은 동물 실험의 관행에 한계를 정하고, 동물 학대 법안 1849년을 개정하여 동물 실험에 대한 허가 시스템을 제정할 것입니다."
 ENG_focus_chelsea_hospital_act: "첼시 병원 법안"
 ENG_focus_chelsea_hospital_act_desc: ""
 ENG_focus_1880_general_elections: "1880년 총선"
 ENG_focus_1880_general_elections_desc: "1874년 의회는 끝나가고 있으며 새로운 의회가 곧 선출되어야 합니다. 경제가 더 어려워지면서, 현재 집권당은 권력을 유지하기 위해 고군분투할 것입니다."
 ENG_focus_Cavendish_wins: "캐번디시 총선 승리"
 ENG_focus_Cavendish_wins_desc: "자유당은 승리하여, 영국에 큰 개혁을 가져온 그들의 유산을 정부에서 이어가고 있습니다."
 ENG_focus_Disraeli_wins3: "디즈레일리 총선 승리"
 ENG_focus_Disraeli_wins3_desc: "디즈레일리와 보수당은 승리하여, 보수당은 서민원에서 접전 끝에 승리와 과반수 의석을 확보했습니다."
 ENG_focus_Newspaper_Libel_Registration_Act: "신문 명예훼손 및 등록 법안"
 ENG_focus_Newspaper_Libel_Registration_Act_desc: ""
 ENG_focus_Married_Womens_Property_Act: "기혼 여성 재산 법안"
 ENG_focus_Married_Womens_Property_Act_desc: ""
 ENG_focus_Conveying_Law_Property_Act: "양도 및 재산 법률 법안"
 ENG_focus_Conveying_Law_Property_Act_desc: ""
 ENG_focus_ballot_act: "투표 법안"
 ENG_focus_ballot_act_desc: "영국 의회 및 지방 정부 선거를 비밀 투표로 실시하도록 하는 요건을 도입한 영국 의회의 법안입니다."
 ENG_focus_1885_transfer: "선거 운동 시작"
 ENG_focus_1885_transfer_desc: "1885년 총선은 계획대로 개최될 것이며, 모든 정당이 선거 운동을 시작했습니다. 이것은 성인 남성의 대다수가 투표할 수 있었던 첫 번째 시간이었으며, 대부분의 선거구는 법에 따라 단일 의원을 의회로 돌려보내어 직접적인 단일 의원, 단일 선거구 책임성을 제공하려는 차티즘의 이상 중 하나를 충족시켰습니다."
 ENG_focus_Electric_Lighting_Act: "전기 조명 법안"
 ENG_focus_Electric_Lighting_Act_desc: "런던 시와 다른 자치 단체 내의 전기의 확장은 가정의 전력화를 허용하고 잉글랜드의 더 넓은 도시 내에서 더 넓은 접근성과 전기의 가용성을 허용합니다."
 ENG_focus_Municipal_Corporations_Act: "자치 단체 법안"
 ENG_focus_Municipal_Corporations_Act_desc: "260개 부분으로 구성된 법안과 민영화되고 공공 소유인 자치 서비스에 관한 정보가 포함된 법안으로, 서비스 품질이 적시에 제공되도록 보장하고, 산업 혁명으로 인한 잉글랜드 전역의 인구 증가를 돕기 위해 필요한 용량 증가를 용이하게 하기 위해 주어진 정당한 기능을 넘어 해당 서비스를 확장할 수 있는 능력을 갖도록 합니다."
 ENG_focus_National_Debt_act: "국가 부채 법안"
 ENG_focus_National_Debt_act_desc: "국가 부채의 할당과 잉글랜드 은행이 국가 공공 부채로서 영국 정부에 필요한 자금을 사용할 수 있도록 채권을 발행할 수 있는 능력, 그리고 잉글랜드의 부채를 관리하는 더 원활한 능력을 허용하기 위해 영국 정부의 채권 방법으로 해당 부채의 재조직."