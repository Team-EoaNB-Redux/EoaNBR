 KOR_donghak_societies: "비밀 동학 사회"
 KOR_Catholic_Influence: "가톨릭 영향력"
 KOR_Catholic1_Influence: "가톨릭 영향력"
 KOR_Catholic1_Influence_Removed: "가톨릭 영향력 제거됨"
 KOR_Catholic2_Influence_Removed: "가톨릭 영향력 제거됨"
 KOR_joseon_dynasty.5.t: "최제우의 철학"
 KOR_joseon_dynasty.5.d: "최제우의 동학 철학은 매우 흥미롭습니다. 명상을 통한 신의 계시로 그에게 전해진 이 동학은 유교 사상을 수용하면서도 증가하는 서구 세력으로 인해 야기된 문제들을 해결하고자 사회 개혁을 추구합니다. 최제우 자신은 서양인들이 성공한 것을 보면 천명을 받은 것이 아닌지 의문을 제기합니다. 우리의 동맹국인 청나라가 그렇게 쉽게 무너질 수 있다면, 우리도 운명적으로 끝이 날까요? 동학 철학이 우리를 도울 수 있기를 바랍니다."
 KOR_joseon_dynasty.5.a: "매우 흥미롭습니다"
 KOR_joseon_dynasty.6.t: "조선"
 KOR_joseon_dynasty.6.d: "조선 왕국은 위험한 위치에 처해 있습니다. 서구는 우리의 이웃 나라 문을 우호적이지 않은 방식으로, 포함으로 두드리고 있습니다. 이러한 외부 문제만이 우리가 직면한 유일한 문제는 아닙니다. 안동 김씨는 한반도에 강력한 지배력을 유지하며 사실상 나라를 운영하고 있습니다. 종교 및 철학적 운동이 변화하고 있으며, 이러한 문제에 대한 우리의 대응은 안동 김씨와 갈등을 야기할 수 있습니다. 이는 갈등이 없을 수는 없겠지만 나라가 마땅히 운영되어야 할 시스템으로 나아가게 할 수 있습니다. 혹은 안동 김씨의 규칙을 따른다면 점진적으로 그들에게 권력이 넘어갈 것이며, 우리 나라의 정치적 긴장이 결국 완화될 수도 있습니다."
 KOR_joseon_dynasty.6.a: "조선은 일어날 것입니다"
 KOR_Tutorial_1: "조선 왕국은 성공적인 플레이를 위해 균형을 맞춰야 할 것들이 많습니다. 한국 사회의 모든 측면과 시스템에 존재하는 부정적인 상태를 나타내는 국가 정신은 이벤트와 중점 목표를 통해 점진적으로 해결될 것이지만, 이러한 이벤트와 중점 목표는 안동 김씨와 다른 상호작용을 하게 될 것입니다. 그들의 권력을 제한하면 국가 정신의 부정적인 면이 증가하겠지만, 결국 안동 김씨를 몰락시킬 수 있습니다. 반면, 안동 김씨에게 굴복하면 아이디어의 부정적인 면이 감소하겠지만, 다른 결과를 초래할 수 있습니다."
 KOR_thewayofheaven: "천도"
 KOR_joseon_dynasty.7.t: "일심"
 KOR_joseon_dynasty.7.d: "“너는 기독교로 백성을 가르치려 하는가?” 한울님이 대답했습니다: “아니다. 나는 신비로운 부적을 가지고 있다… 이 부적을 사용하여 질병으로부터 백성을 구하라…”"
 KOR_joseon_dynasty.7.a: "평등주의를 수용합니다"
 KOR_joseon_dynasty.8.t: "일체"
 KOR_joseon_dynasty.8.d: "한울님은 계속해서 말씀하셨습니다… “이 책을 사용하여 백성에게 나를 숭배하도록 가르쳐라!” 자기 수양과 본성을 향상시킴으로써 천도는 사람의 마음에 있습니다."
 KOR_joseon_dynasty.8.a: "마음의 잠재력을 해방합니다"
 KOR_onemind: "일심"
 KOR_industrialreforms: "산업 개혁"
 KOR_joseon_dynasty.9.t: "백성의 상태"
 KOR_joseon_dynasty.9.d: "조선 백성의 생활 수준은 세계, 심지어 동양에서도 가장 좋지 않습니다. 정부의 도움이 필요한 분야가 많습니다. 첫째는 서구의 산업 공장과 비교할 때 장인과 지역 장인에게 크게 의존하는 우리의 약한 산업입니다. 둘째는 백성을 빈곤에서 벗어나게 도울 수 있는 세금 개혁입니다. 셋째는 매우 부패하고 기본적인 업무를 수행할 수 없게 된 정부를 정화하는 것입니다."
 KOR_joseon_dynasty.9.a: "산업"
 KOR_joseon_dynasty.9.b: "세금 개혁"
 KOR_joseon_dynasty.9.c: "정부 정화"
 KOR_Queen_Sinjeong: "신정왕후"
 KOR_joseon_dynasty.10.t: "정약용의 가르침"
 KOR_joseon_dynasty.10.d: "정약용은 정조 임금 아래에서 중요한 학자이자 철학자였습니다. 많은 실학 학파가 그의 가르침을 그들이 얻고자 하는 개혁의 예로 사용하지만, 우리는 그의 많은 글을 신유교의 작은 개혁에 유리하도록 쉽게 조작할 수 있습니다. 정약용의 마지막 글들은 개혁 시기에도 왕과 같은 사회의 강력한 지도자가 필요하다고 주장하는 필수적인 절대주의에 관한 것이었습니다. 이러한 사상들을 사용하여 우리의 최소한의 개혁을 정약용이 가르친 것으로 묘사할 수 있습니다."
 KOR_joseon_dynasty.10.a: "이것은 많은 사람들을 진정시킬 것입니다"
 KOR_joseon_dynasty.11.t: "개혁의 결과"
 KOR_joseon_dynasty.11.d: "실학과 동학의 인기가 높아짐에 따라 유교 개혁에 대한 우리의 결정에 따른 결과가 명확해졌습니다. 안동 김씨 가문을 달래거나 그들의 지배력에서 벗어나는 줄타기는 위험한 결과를 초래할 수 있습니다. 동학에는 많은 혁명가들이 영향을 미치고 있으며, 안동 김씨는 군대에 많은 강력한 지지자들을 가지고 있습니다. 우리의 균형 잡기 노력이 한쪽으로 너무 치우쳤다면 우리는 그에 대한 책임을 져야 할 것입니다."
 KOR_joseon_dynasty.11.a: "안동 김씨의 반란"
 KOR_joseon_dynasty.11.b: "개혁파의 반란"
 KOR_joseon_dynasty.11.c: "갈등 회피"
 KOR_joseon_dynasty.12.t: "흉작"
 KOR_joseon_dynasty.12.d: "올해는 조선 농민들에게 힘든 한 해였습니다. 좋지 않은 농업 조건으로 인해 식량 부족이 발생했고, 이는 평균적인 조선인들이 느끼는 상대적인 불행을 가중시킬 뿐입니다. 불안은 커지고 있지만, 최악의 반란은 지나갔을 것입니다."
 KOR_joseon_dynasty.12.a: "조선에는 새로운 것이 아닙니다"
 KOR_joseon_dynasty.13.t: "러시아 군함 포착"
 KOR_joseon_dynasty.13.d: "러시아 군함이 우리 해안에서 포착되었습니다. 이것은 러시아가 우리 나라를 무역에 개방하려는 시도일 수 있습니다. 우리의 문을 강제로 열려는 이러한 시도는 아무런 효과가 없을 것입니다. 그러나 조정의 소수의 기독교인들은 프랑스와 동맹을 맺는 주제에 대해 베르뇌 주교와 만날 것을 제안했습니다. 이 동맹은 우리 나라를 프랑스에 개방하는 것을 의미하겠지만, 우리가 중국처럼 서구의 펀치백이 되지 않도록 보장해 줄 것입니다. 만남이 준비되었지만, 가톨릭의 영향력이 나라에 들어오는 것을 경계하는 것이 현명할 것입니다."
 KOR_joseon_dynasty.13.a: "시간이 말해줄 것입니다"
 KOR_joseon_dynasty.14.t: "주교의 도착"
 KOR_joseon_dynasty.14.d: "베르뇌 주교가 프랑스와의 동맹 가능성에 대해 논의하기 위해 도착했습니다. 조정의 많은 이들은 이것을 우리의 독립을 서구의 나머지로부터 보장하기보다는 한국 가톨릭 교회가 더 많은 권력을 얻기 위한 계략으로 간주하고 있습니다. 그가 선의로 왔을 수도 있지만 위험은 큽니다. 우리나라의 기독교인들은 서구에 훨씬 더 개방적인 것으로 입증되었기 때문에 우리의 쇄국 정책을 약화시킬 수 있습니다."
 KOR_joseon_dynasty.14.a: "그를 처형하라! 기독교인들을 모조리 잡아들여라!"
 KOR_joseon_dynasty.14.b: "프랑스와의 동맹은 필수적입니다"
 KOR_joseon_dynasty.15.t: "펠릭스 클레르 리델 신부 탈출!"
 KOR_joseon_dynasty.15.d: "펠릭스 클레르 리델 신부가 소수의 충성스러운 조선인 개종자들의 도움으로 우리 군인들과 마을 사람들에게서 탈출했습니다. 그는 중국의 프랑스 영사관으로 가서 우리 백성과 정부가 기독교인들에게 취한 조치들을 보고할 것입니다."
 KOR_joseon_dynasty.15.a: "이것이 무엇을 가져올지는 시간이 말해줄 것입니다"
 KOR_joseon_dynasty.16.t: "불행한 사고"
 KOR_joseon_dynasty.16.d: "베르뇌 주교가 조선 조정과의 만남을 떠날 때 흥미로운 조선 민족주의적 모습이 나타났습니다. 주교가 공개적으로 처형되기를 바랐던 군중들이 그가 자유롭게 나가는 것을 보고 직접 나섰습니다. 반기독교 정서는 사상 최고조에 달했으며, 우리는 이 관점을 받아들일 수밖에 없습니다."
 KOR_joseon_dynasty.16.a: "동맹은 물 건너갔군"
 KOR_joseon_dynasty.17.t: "기독교인이라는 적"
 KOR_joseon_dynasty.17.d: "조선 전역에서 반서구 정서와 반기독교 정서가 끓어올랐습니다. 조선 전역에서 기독교인들의 처형이 시작되면서 이 두 관점은 거의 분리할 수 없게 되었습니다. 이것은 서구에 대한 조선의 선전포고이며, 그에 대한 응답은 거의 확실합니다."
 KOR_joseon_dynasty.17.a: "이것이 우리에게… 평화를 가져다줄까요?"
 KOR_cultural_nationalism_idea: "문화적 민족주의"
 KOR_nowwewait: "§R이제 기다려야 합니다…§!"
 KOR_decisions_category_wars_and_conflicts: "전쟁과 갈등"
 KOR_Mission_FRA_Expedition_War_Decision: "프랑스 원정"
 KOR_Mission_FRA_Expedition_War_Decision_Peace_tt: "평화를 가져올 것입니다"
 KOR_KOR_Mission_FRA_Expedition_War_Decision_tt: "§R조선 조건 - 한반도 전체 수복§!"
 KOR_joseon_dynasty.18.t: "선교사 한 명이 탈출했습니다!"
 KOR_joseon_dynasty.18.d: "오늘 수도에 소식이 전해졌는데, 조선 내 최고 선교사 중 한 명이 조선인 개종자들의 도움으로 나라를 탈출하는 데 성공했습니다. 그는 청나라에 있는 프랑스 영사관으로 가서 국내 프랑스 가톨릭 신자들의 상황과 주교의 죽음을 보고할 가능성이 높습니다."
 KOR_joseon_dynasty.18.a: "이것이 무엇을 가져올까요?"
 KOR_joseon_dynasty.19.t: "프랑스 원정"
 KOR_joseon_dynasty.19.d: "프랑스는 마침내 우리 정부가 가톨릭 선교사들에게 취한 조치에 대해 응답했습니다. 인천을 점령한 프랑스는 우리가 받아들일 준비가 되지 않은 배상금을 요구하고 있습니다. 충돌이 언제 일어날지 두고 보겠지만, 우리 병사들은 준비하고 있습니다."
 KOR_joseon_dynasty.19.a: "전쟁이 임박했다"
 KOR_joseon_dynasty.20.t: "갈등의 시작"
 KOR_joseon_dynasty.20.d: "조선 해안에 프랑스 함대가 도착한 후, 마침내 무력 충돌이 시작되었습니다. 프랑스가 이로부터 무엇을 얻으려는지 불분명하지만, 우리는 서구의 침략으로부터 우리나라를 안전하게 지키기 위해 죽을 때까지 싸울 준비가 되어 있습니다."
 KOR_joseon_dynasty.20.a: "전쟁을 시작합시다"
 KOR_joseon_dynasty.21.t: "조선에서 온 소식?"
 KOR_joseon_dynasty.21.d: "프랑스 본토, 특히 프랑스 정부에서는 알 수 없지만, 청나라의 프랑스 영사는 선교사들과 가톨릭 신자들이 처형되고 체포되었다는 보고를 받은 후 조선으로 원정을 떠날 것을 허가했습니다. (실제 역사에서는 프랑스군이 철수한 후에야 프랑스 정부가 조선에서의 행동을 알게 되었지만, 이 이벤트는 플레이어에게 경고하는 역할을 합니다.)"
 KOR_joseon_dynasty.21.a: "조선에서 일어난 일은 조선에 남는다"
 KOR_joseon_dynasty.22.t: "조선에서의 승리"
 KOR_joseon_dynasty.22.d: "조선 반도의 대부분을 점령한 후, 우리의 요구 사항을 전달하는 임무가 태평양 함대 제독에게 할당되었습니다. 중국 영사관은 현재의 조선 왕조 대신 프랑스 정부를 수립하기를 원하지만, 제독은 조선인들이 결코 이것을 받아들이지 않을 것이며 프랑스 본토도 기뻐하지 않을 것이라는 것을 알고 있습니다. 선택지는 제독이 제안한 전쟁 배상금 또는 한반도의 인천에 프랑스 수비대를 남겨두는 것을 통한 영사관과의 타협으로 귀결됩니다."
 KOR_joseon_dynasty.22.a: "배상금은 우리에게 조선에 대한 접근권을 줄 것입니다"
 KOR_joseon_dynasty.22.b: "조선인들을 믿을 수 없어, 인천을 완전히 점령하자"
 KOR_joseon_dynasty.23.t: "프랑스가 인천을 점령하다"
 KOR_joseon_dynasty.23.d: "우리 군대가 패배하고 반도의 대부분을 잃은 후 프랑스가 그들의 요구를 전해왔습니다. 그들은 예상했던 대로 배상금을 요구했지만, 예상치 못했던 것은 서해안의 우리 섬들에 그들의 수비대를 주둔시키는 것입니다. 이미 이 요구에 대한 소식은 조선 백성들을 분노하게 했고, 저항이 예상됩니다."
 KOR_joseon_dynasty.23.a: "이것은 재앙입니다"
 KOR_joseon_dynasty.24.t: "프랑스에 대한 패배"
 KOR_joseon_dynasty.24.d: "한때 불가능하다고 생각했던 일이 현실이 되었습니다. 우리의 은둔의 왕국은 침략해 오는 프랑스에 무너졌고, 우리는 이제 그들의 요구를 언제든지 들을 수 있을 것입니다."
 KOR_joseon_dynasty.24.a: "어떻게 이런 일이 일어날 수 있었을까요?"
 KOR_joseon_dynasty.45.t: "조선의 프랑스 원정"
 KOR_joseon_dynasty.45.d: "조선 왕국 내 기독교인 박해에 따라 프랑스 태평양 함대가 한반도의 증가하는 쇄국 정책을 막기 위한 시도로 원정을 시작했습니다."
 KOR_joseon_dynasty.45.a: "동양이 전율합니다"
 KOR_joseon_dynasty.25.t: "조선에서의 패배"
 KOR_joseon_dynasty.25.d: "조선으로의 원정은 실패했습니다. 완전한 침략을 위한 최소한의 보급과 모든 협상을 거부하는 조선의 결합된 의지가 한반도에서 우리의 철수를 강요했습니다. 프랑스 본토는 이 소식을 듣고 매우 실망할 것입니다."
 KOR_joseon_dynasty.25.a: "이런 재앙이"
 KOR_FRA_reperations_idea: "조선 무역 독점"
 KOR_joseon_dynasty.26.t: "조정에서 가톨릭 영향력 제거"
 KOR_joseon_dynasty.26.d: "조선 반도에서 모든 기독교적 영향력을 점진적으로 제거하면서, 우리는 여전히 이러한 외국 사상을 지지하는 소수의 조정 구성원들을 찾아낼 수 있었습니다. 이들 구성원들에 대한 신속한 제거와 처형이 거의 즉시 이어졌습니다."
 KOR_joseon_dynasty.26.a: "쇄국이 우리를 안전하게 지켜줄 것입니다"
 KOR_joseon_dynasty.27.t: "제너럴 셔먼호 사건"
 KOR_joseon_dynasty.27.d: "미국 군함이 대동강에서 파괴되고 승무원이 처형되었다는 보고가 들어오고 있습니다. 어떻게 이런 일이 일어났는지는 논쟁의 원인이 되고 있습니다. 사건을 목격한 많은 조선인들은 그 배가 무역선치고는 이상하게 무장되어 있었으며, 우리 정부로부터의 메시지를 기다리는 동안 제자리에 머물기를 거부했다고 주장합니다. 사건을 목격한 일부 서양인들은 배가 정박해 있는 것을 본 현지인들이 배를 공격하여 승무원을 붙잡아 처형했다고 주장합니다. 이야기가 어떻든, 미국인들은 어떤 식으로든 대응할 가능성이 높습니다."
 KOR_joseon_dynasty.27.a: "이것은 흥미로운 발전입니다"
 KOR_joseon_dynasty.28.t: "USS 와추세트호, 조선에 도착 실패"
 KOR_joseon_dynasty.28.d: "제너럴 셔먼호가 조선 항해 후 보고를 하지 못하자, USS 와추세트호가 조사하기 위해 그곳으로 파견되었습니다. 악천후 및 기타 여러 사건들이 항해에 영향을 미쳐 배는 방향을 돌려 본국으로 돌아가야 했습니다. 또 다른 항해를 계획해야 할 것입니다."
 KOR_joseon_dynasty.28.a: "아쉽군"
 KOR_joseon_dynasty.29.t: "USS 셰넌도어호, 조선에 도착"
 KOR_joseon_dynasty.29.d: "과거 조선 반도에 도착하는 데 실패한 후, 마침내 우리 배가 반도 해안에 도착했습니다. USS 셰넌도어호는 조선 왕조와 접촉하기 위해 대동강을 항해하려던 제너럴 셔먼호가 파괴되었다고 보고했습니다. 우리는 이미 조선인들과의 추가적인 갈등에 대비하여 태평양 순찰대 일부에게 반도 해안을 순찰 구역에 추가하도록 지시했습니다."
 KOR_joseon_dynasty.29.d_2: "과거 조선 반도에 도착하는 데 실패한 후, 마침내 우리 배가 반도 해안에 도착했습니다. USS 셰넌도어호는 조선 왕조와 접촉하기 위해 대동강을 항해하려던 제너럴 셔먼호가 파괴되었다고 보고했습니다. 그러나 프랑스가 기독교인 박해와 프랑스 및 국제 기독교인들을 보호하기 위해 설치된 프랑스 수비대에 대한 반란 이후 이미 조선에 보호령을 설정했기 때문에 배상을 요구하기 어려울 것입니다. 프랑스는 조선 무역 독점을 방해하고 싶지 않을 수 있지만, 우리는 프랑스와 무언가를 협의하려고 시도할 수 있습니다."
 KOR_joseon_dynasty.29.a: "오늘도 또 다른 문제군"
 KOR_joseon_dynasty.29.b: "음, 적어도 무슨 일이 있었는지 알겠군"
 KOR_joseon_dynasty.29.c: "아마도 프랑스가 우리에게 조선에 대한 접근권을 줄지도 모릅니다"
 KOR_joseon_dynasty.30.t: "조선 해안 포대가 미국 함선에 발포"
 KOR_joseon_dynasty.30.d: "조선 해안 포대가 우리 함선들이 조선 해안에서 순찰 중일 때 발포했습니다. 이것은 쇄국 정책을 고수하는 조선 반도와의 문제와 갈등이 커지는 가운데 가장 최근에 일어난 일입니다. 이 공격은 조선 반도로 원정을 시작할 정당성을 제공할 것이며, 우리의 운이 프랑스보다 좋다면 우리는 반도의 문을 열 수 있을지도 모릅니다."
 KOR_joseon_dynasty.30.a: "전쟁이 오고 있습니다"
 KOR_joseon_dynasty.31.t: "우리 해안 포대가 미국 함선에 발포하다!"
 KOR_joseon_dynasty.31.d: "우리 해안 포대가 우리 해안에 가까이 다가온 미국 함선에 발포했습니다. 서구 국가들은 무역을 위해 우리나라를 개방하도록 영향을 미치려 하면서 항상 우리 해안에 함선들을 가까이 두었지만, 공개적인 충돌은 드뭅니다."
 KOR_joseon_dynasty.31.a: "전쟁이 오고 있습니다"
 KOR_joseon_dynasty.32.t: "조선인 반란"
 KOR_joseon_dynasty.32.d: "조선인 무장 농민들로 보이는 이들이 우리 조선 주둔지를 공격했습니다. 우리 주둔지 국경 내에 거주하는 조선인 농민들의 분노는 항상 우리 점령에 문제를 제기해 왔지만, 전면적인 반란은 예상치 못했습니다. 조선 정부는 이 기회를 이용하여 군대를 주둔지로 이동시켜 그들의 영토를 되찾으려 하고 있습니다."
 KOR_joseon_dynasty.32.a: "주둔지를 강화하라!"
 KOR_joseon_dynasty.33.t: "조선인들, 프랑스에 대항하여 반란을 일으키다"
 KOR_joseon_dynasty.33.d: "프랑스 주둔지 점령 지역에 거주하는 조선인 농민들이 프랑스가 점령한 요새 중 하나를 공격했습니다. 기습적인 공격과 사람들의 순전한 의지는 프랑스군을 후퇴시킬 만큼 충분한 기세를 얻었습니다. 프랑스가 어쨌든 우리 백성에게 보복할 가능성이 높기 때문에 이 기회를 이용하여 프랑스 주둔지를 점령하고 한반도에서 프랑스군을 몰아내지 않는 것은 실수가 될 것입니다."
 KOR_joseon_dynasty.33.a: "조선은 서구에 결코 굴복하지 않을 것입니다!"
 KOR_KOR_Mission_FRA_Korean_Revolt_Decision_tt: "§R조선 조건 - 한반도 수복"
 FRA_KOR_Mission_FRA_Expedition_War_Decision_tt: "§R프랑스 조건 - 승점 50% 이상 점령"
 KOR_Mission_FRA_Korean_Revolt_Decision: "프랑스 수비대에 대한 조선인 반란"
 KOR_Mission_FRA_Korean_Revolt_Decision_Peace_tt: "평화를 가져올 것입니다"
 KOR_joseon_dynasty.34.t: "미국에 대한 소식"
 KOR_joseon_dynasty.34.d: "원래 제너럴 셔먼호 사건 이후 우리가 곧 미국인들의 힘에 직면해야 할 것이라는 두려움이 퍼졌지만, 제너럴 셔먼호에서 회수된 일부 기록과 지도, 그리고 방문하는 소수의 외국인들과의 대화에 따르면, 미국은 완전히 해체되었다고 합니다. 한때 미합중국이었던 국가가 그 지역의 여러 집단으로 붕괴되었습니다."
 KOR_joseon_dynasty.34.a: "하나의 문제가 줄었군"
 KOR_joseon_dynasty.35.t: "조선에서의 패배"
 KOR_joseon_dynasty.35.d: "조선인들이 한반도에 있는 우리의 주둔지를 성공적으로 점령했고, 우리 함대는 남아 있는 소수의 해병대원들을 데리고 그 지역을 떠나야 했습니다. 조선에서 이미 인기가 없었던 전쟁이 마침내 끝났고, 우리가 그곳에 있었던 시간은 제한적이었지만, 우리는 조선 무역 독점으로 이익을 얻을 수 있었습니다. 아마도 조선은 계속 고립되어 있어야 할 운명인가 봅니다."
 KOR_joseon_dynasty.35.a: "은둔의 왕국은 다시 문을 닫았다"
 KOR_joseon_dynasty.36.t: "조선 전선에 증원군을 보낼까요?"
 KOR_joseon_dynasty.36.d: "조선에서의 전쟁이 악화되면서 일부 태평양 장관들과 제독들은 프랑스 해병대가 조선 반도 남부의 부산에 상륙할 것을 요청했습니다. 전략적으로 현명한 결정이지만, 새로운 해병대 병력을 보급하는 데 드는 비용은 높을 것입니다. 우리의 장비 대부분을 현장에서 구매해야 할 것이기 때문입니다. 조선군은 아직 많은 해안 포대를 사용할 수 없으므로, 우리가 이 길을 선택한다면 우리의 상륙이 눈에 띄지 않을 수도 있습니다."
 KOR_joseon_dynasty.36.a: "침략 자금 지원"
 KOR_joseon_dynasty.36.b: "비용을 감당할 수 없습니다"
 KOR_joseon_dynasty.37.t: "French land in Pusan!"
 KOR_joseon_dynasty.37.d: "While our armies head toward Incheon and the French Garrisons news comes from the South that French marines have landed in Pusan. This invasion was unexpected as the French have always seemed badly equipped being so far from Europe, but it seems they have devoted to crushing our nation once and for all."
 KOR_joseon_dynasty.37.a: "For Korea, For Joseon!"
 KOR_French_land_in_Pusan: "§R프랑스군이 부산에 상륙했습니다§!"
