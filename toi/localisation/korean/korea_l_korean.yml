l_english:
 KOR_sedoregime: "세도정치"
 KOR_sedoregime_desc: "세종, 태조와 같은 위대한 군주의 시대는 더 이상 없습니다. 우리나라의 정부 체제는 왕을 포함하여, 강력한 양반 가문들에게 이용당하고 있습니다. 지금은 조선 왕국의 암흑기입니다"
 KOR_sociocrisis: "사회 경제적 위기"
 KOR_sociocrisis_desc: "우리 왕국은 자연적, 체계적인 여러 연쇄적인 문제로 큰 타격을 입었으며, 이는 우리나라의 번영 능력을 거의 마비시켰습니다. 심각한 가뭄과 대규모 흉작, 그리고 양반에 의한 비효율적이고 학대적인 행정은 광범위한 기아와 지배층에 대한 높은 수준의 불만을 야기했습니다"
 KOR_distanceclans: "가문들과의 거리두기"
 KOR_distanceclans_desc: "이미 왕실에 영향력을 키우고 있는 안동 김씨에게 굴복하는 것은 어리석은 짓으로 판명되었고, 이는 최고 정부 기관 내에 엄청난 부패를 초래했습니다. 비록 그 길이 험난할지라도, 이제 이씨 왕실의 권력을 되찾기 위한 조치가 이루어져야 합니다"
 KOR_approachkim: "김씨 라이벌 가문에게 접근"
 KOR_approachkim_desc: "조선 행정의 가장 큰 문제는 왕족에 대한 가문의 권력에 있지만, 이씨 가문은 안동 김씨의 통치를 떨쳐낼 만큼 충분한 자체 영향력을 행사하지 못합니다. 풍양 조씨와 같은 김씨의 강력한 라이벌들에게 은밀히 접근하는 것이 철종의 유일한 선택일 수 있습니다"
 KOR_offerpositions: "관직 제안"
 KOR_offerpositions_desc: "조씨 가문과의 거래를 성사시키기 위해, 왕은 의정부와 삼정승 내의 다른 고위 권력직을 기꺼이 제공해야 합니다"
 KOR_courtclanleaders: "가문 지도자들을 조정에 끌어들이기"
 KOR_courtclanleaders_desc: "안동 김씨의 영향력을 깎아내기 시작하기 위해 다른 강력한 가문 지도자들에게 이씨 가문과 연합을 형성하자는 메시지를 전달해야 합니다. 이 메시지들이 설득력을 갖기 위해서는 특정 '선물'이 첨부되어야 할 수도 있습니다"
 KOR_supportrivalschools: "라이벌 학파 지원"
 KOR_supportrivalschools_desc: "김씨 라이벌들이 가진 가장 큰 무기 중 하나는 서원입니다. 서원은 학자 계급의 사고방식에 영향을 미치는 영향력 있는 유교 기관입니다. 왕이 이 기관들에 추가적인 재정적, 물질적 지원을 제공할 수 있다면, 동료들 사이에서 김씨의 인기를 크게 약화시킬 것입니다"
 KOR_formcoalition: "연합 결성"
 KOR_formcoalition_desc: "이제 철종이 상당수의 흩어져 있던 반 김씨 세력들을 설득할 수 있었으므로, 우리 정부를 김씨로부터 정화하기 위해 이 가문들을 왕실 연합 아래 하나로 통합하기 위한 노력이 이루어져야 합니다"
 KOR_encouragedisputes: "교리 논쟁 장려"
 KOR_encouragedisputes_desc: "주희의 저술에 대한 올바른 해석은 수십 년 동안 조선 가문 정치의 쟁점이었습니다. 왕이 이 불에 더 많은 연료를 추가할 수 있다면, 이는 안동 김씨 이전의 왕실 가문들이 연합하여 이씨 왕가를 위협하는 것을 막을 것입니다"
 KOR_ignitefaction: "파벌 정치 재점화"
 KOR_ignitefaction_desc: "이제 상당한 양의 김씨 영향력이 왕실 정부에서 제거되었으므로, 철종은 자신의 권력을 강화하기 위해 경쟁하는 왕실 가문들 간의 균형을 회복할 수 있는 독특한 기회를 얻었습니다. 이들 다른 가문들 사이의 내분을 장려하면 그들이 더 많은 왕실 직위를 차지하려는 것을 방해할 것입니다"
 KOR_supportrivals: "지역 김씨 라이벌 지원"
 KOR_supportrivals_desc: "안동 김씨 가문은 왕실 내에서 상당한 영향력을 잃었지만, 여전히 조선 왕국에서 가장 강력한 왕실 가문 중 하나입니다. 다른 가문의 양반 관리들을 지방 기관에서 지원함으로써 그들의 권력을 더욱 견제할 수 있습니다"
 KOR_restorecheckbalance: "견제와 균형 회복"
 KOR_restorecheckbalance_desc: "그 이전의 영조와 정조와 마찬가지로, 철종은 이제 조선 정부 체계 내에서 경쟁하는 왕실 가문들의 깨지기 쉬운 견제와 균형을 회복할 능력을 갖게 되었습니다. 이 '탕평책' 정책의 복원은 이씨 왕가의 권력을 크게 증가시킬 것입니다"
 KOR_submitclans: "가문에 굴복"
 KOR_submitclans_desc: "이러한 길을 택하면 안동 김씨와 같은 가문들의 권력이 이씨 왕가보다 우위에 놓이게 될 가능성이 높지만, 김씨를 지원하는 것은 우리의 혼란한 영토에 어느 정도의 안정성을 가져올 수 있을 것입니다"
 KOR_complykims: "안동 김씨 가문에 순응"
 KOR_complykims_desc: "하나의 왕실 가문 아래 우리 영토의 안정을 더욱 공고히 하기 위해, 안동 김씨는 우리의 철종에게 철인 왕후의 추천에 따라 김씨 가문의 구성원들을 의정부 및 다른 고위직에 받아들일 것을 요청했습니다"
 KOR_curbcho: "풍양 조씨 영향력 억제"
 KOR_curbcho_desc: "이제 김씨 가문이 왕실 정부의 광범위한 부분을 통제하게 되었으므로, 우리 영토의 안정을 위협하는 라이벌 가문들을 단속하기 위한 노력이 시작될 수 있습니다. 풍양 조씨 가문은 세기 초에 김씨로부터 일시적으로 권력을 빼앗을 수 있었기 때문에 가장 위험합니다"
 KOR_quellrivals: "라이벌 파벌 진압"
 KOR_quellrivals_desc: "풍양 조씨 일족을 고위직에서 억제하기 위한 노력이 이루어졌지만, 많은 소규모 라이벌 가문들은 여전히 우리 나라의 서원과 다른 기관들에서 영향력 있는 위치를 통제하며, 김씨의 부패에 대한 거짓말을 퍼뜨리고 있습니다. 이것은 중단되어야 합니다"
 KOR_onedoctrine: "하나의 유교 교리"
 KOR_onedoctrine_desc: "우리 영토 내 파벌 정치의 주요 선동자는 특정 신유교 교리를 어떻게 해석해야 하는지에 대한 사소한 논쟁입니다. 우리가 이전의 사림처럼 되지 않으려면, 김씨의 통치를 지지하는 방식으로 유교 교리를 해석하는 우리가 직접 선택한 학자들을 지원해야 합니다"
 KOR_oneclan: "일가 독점"
 KOR_oneclan_desc: "이제 대부분의 라이벌들이 한 수 접고 종교적 논쟁이 잠잠해졌으므로, 김씨 가문은 마침내 큰 반대 없이 왕실 및 지방 행정의 거의 모든 부문을 장악할 기회를 얻었습니다"
 KOR_debasecurrency: "화폐 가치 절하"
 KOR_debasecurrency_desc: "왕실 금고가 바닥나면서, 새로운 프로젝트에 자금을 조달하기 위해 유통되는 화폐의 양을 늘리기 위해 화폐 가치를 절하해야 합니다"
 KOR_foldtemples: "불교 사원 폐쇄"
 KOR_foldtemples_desc: "현재 우리의 많은 문제는 사원에 모여 우리 백성에게 높은 요금을 부과하는 욕심 많은 불교도들로부터 비롯됩니다. 이 기관들 중 일부를 폐쇄하고 자산을 청산하는 것은 확실히 왕실 금고를 확장하는 데 도움이 될 것입니다"
 KOR_sangmintax: "상민 세금 인상"
 KOR_sangmintax_desc: "조선의 더 큰 이익을 위해, 더 많은 세금을 상민 계급에 부과하여 추가적인 경제 프로젝트에 사용해야 합니다. 우리가 이렇게 한다면 그들이 좀 더 불평할 수 있겠지만, 시간과 수많은 봉기들은 가난한 사람들은 어차피 만족할 수 없다는 것을 증명했습니다"
 KOR_stabilizecrisis: "위기 안정화"
 KOR_stabilizecrisis_desc: "왕실 금고에 새로운 현금 흐름을 확보했으므로, 이제 우리 왕국을 강화하고 전국에 퍼져 있는 경제적 혼란 속에서 어느 정도의 질서를 확립하는 데 노력을 집중할 수 있습니다"
 KOR_teachingschoe: "최제우의 가르침"
 KOR_teachingschoe_desc: "'동학'이라는 새로운 운동이 창시되었습니다. 이 이념은 유교와 불교, 무속신앙, 심지어 천주교의 요소를 혼합한 것으로, 우리 왕국의 운명을 크게 형성할 것입니다"
 KOR_denouncedong: "동학 이단"
 KOR_denouncedong_desc: "최제우의 동학의 급진적인 견해는 이미 취약한 조선의 사회 질서에 명백하고 현존하는 위험을 제시합니다. 이러한 평등주의적 사회관이 분노하고 무지한 농민들의 마음에 퍼지도록 허용하는 것은 진정한 유교 교리에 대한 그들의 독설과 경멸을 증가시킬 뿐입니다"
 KOR_persecutedong: "동학 신도 박해"
 KOR_persecutedong_desc: "신유교 이념의 정통성을 보호하기 위해, 우리는 최제우의 모든 추종자들을 즉시 숙청해야 합니다"
 KOR_uniteconfucian: "유교 정통성 장려"
 KOR_uniteconfucian_desc: "동학과 같은 급진적인 종교적 견해의 확산은 다시는 일어나서는 안 됩니다. 모든 조선인들을 종교적 단결의 유대 아래 묶기 위해 우리의 기존 국교인 유교를 지원하기 위한 노력이 이루어져야 합니다"
 KOR_combatsocieties: "동학 단체와 전투"
 KOR_combatsocieties_desc: "억압된 동학 사상을 지지하는 많은 비밀 단체들이 전국적으로 생겨났습니다. 이 단체들은 동학 봉기를 선동하는 데 성공한다면 특히 위험합니다"
 KOR_recognizechoe: "최제우의 철학 인정"
 KOR_recognizechoe_desc: "그의 가르침은 특이하지만, 최제우의 철학과 사회 계층에 대한 급진적인 견해는 조선이 지속적인 개혁을 이루는 데 필요한 바로 그 것일 수 있습니다. 그러나 논란이 많은 인물을 인정하는 것은 대다수의 조선인들에게 좋지 않게 비칠 가능성이 높습니다"
 KOR_aidchoe: "서구의 압력에 대응"
 KOR_aidchoe_desc: "유교를 세계의 산업 및 정치 구조에 맞게 수정하라는 서구의 압력이 오랫동안 있었습니다. 이제 이러한 압력을 인정할 때가 왔습니다"
 KOR_religiousdong: "최소한의 사회 개혁"
 KOR_religiousdong_desc: "동학 신도들의 새로운 공동체들이 우리 왕국 곳곳에 서서히 생겨나기 시작했습니다. 주로 비참한 삶에서 벗어나고자 하는 불만을 품은 농민들로 구성된 이 공동체들을 지원하는 것은 대중들 사이에서 동학의 인기를 높일 뿐입니다"
 KOR_newfollowers: "반 종교적 성격"
 KOR_newfollowers_desc: "동학의 가르침은 소작농이라는 비참한 상태와 사실상 노예 상태에서 그들의 양반 지주들과 거의 동등한 수준으로 끌어올려 줄 것을 제안하면서 많은 상민 계층의 마음을 사로잡기 시작했습니다"
 KOR_spreaddong: "하나의 본성"
 KOR_spreaddong_desc: "최제우의 가르침이 농민 계층의 공감을 얻었다는 것은 부인할 수 없습니다. 이미 수천 명이 어떤 식으로든 그의 사상에 동조하고 있지만, 진정한 농민 방식으로, 지역 관리들이 제때 그들의 요구에 굴복하지 않으면 폭력과 무질서를 선동하려 할 수도 있습니다"
 KOR_pushreform: "하나의 마음"
 KOR_pushreform_desc: "동학의 사회 평등주의적 가르침에 고무된 수천 명의 분노한 농민들이 관리들에게 행진하여 토지 분배 및 소유권 시스템에 대한 대대적인 개혁을 요구했습니다. 그들의 요구를 고려할 시간이 필요합니다"
 KOR_landreform: "하늘의 길"
 KOR_landreform_desc: "오래된 토지 분배 시스템을 개혁함으로써, 양반 관리들이 저항이 거의 없는 가난한 농민들로부터 더 넓은 토지를 차지하는 추세를 뒤집을 수 있습니다. 이러한 변화는 불만을 품은 농민들로부터 발생하는 폭동의 양을 크게 줄일 것입니다"
 KOR_farmerrights: "소작농 권리"
 KOR_farmerrights_desc: "토지 개혁이 올바른 방향으로 나아가는 한 걸음이었지만, 이제 우리는 모든 지주들이 그들의 고용된 일꾼들을 공정하고 더 평등하게 대하도록 요구함으로써 최제우의 가르침을 조선에서 실제로 실천할 기회를 얻었습니다"
 KOR_traditionszhu: "주희의 전통"
 KOR_traditionszhu_desc: "현재 신유교로 알려진 학문의 창시자인 주희는 조선의 정치적, 종교적 질서를 형성하는 데 중추적인 역할을 해왔습니다. 우리 사회의 모든 구석에서 그의 가르침에 대한 지원을 더욱 늘리는 것은 왕실의 권위와 정당성에 확실히 도움이 될 것입니다"
 KOR_supportsilhak: "실학 지원"
 KOR_supportsilhak_desc: "실학은 서양 철학과 종교의 측면을 수용하고, 신유교 원리를 형이상학적이기보다는 좀 더 실용적인 관점에서 바라보는 운동으로 시작되었습니다. 17세기 후반까지 거슬러 올라가며, 다산과 이익과 같은 위대한 학자들을 배출했습니다. 이 위대한 철학자들의 뒤를 따르는 것은 조선에 큰 이익이 될 것이지만, 우리 정부의 더 보수적인 구성원들을 화나게 할 수도 있습니다"
 KOR_promotesilhak: "실학 학문 장려"
 KOR_promotesilhak_desc: "실학 사상을 주류 철학 담론에 편입시키기 위해서는 실학 학자들이 쓴 저술에 자금을 지원하고 지역 서원에서 그들의 가르침을 장려해야 할 것입니다. 이 학자들이 그들의 가르침으로 진전을 이루기 시작하기까지는 몇 년이 걸릴 수 있습니다"
 KOR_asianenlightenment: "아시아의 계몽"
 KOR_asianenlightenment_desc: "실학 철학의 새로운 시대가 열렸습니다. 이제 대부분의 주류 학자들이 유교 원리에 대한 실용적인 관점이 현재 약화된 상태의 우리 왕국에 도움이 될 것이라는 사실에 동의했으므로, 학자들은 이미 세계에 대한 우리의 이해를 향상시키기 위한 새로운 과학적 방법을 연구하기 시작했습니다"
 KOR_harmonizelearning: "동서양 학문 조화"
 KOR_harmonizelearning_desc: "우리의 고유한 전통이 우리 민족에게 가장 훌륭하고 적합하지만, 서양의 과학적 관행, 철학적 사상, 종교적 개념의 측면들을 통합하는 것은 우리의 위대한 한국 문화를 더욱 발전시킬 뿐이며, 보수적인 유교주의자들에게 더 받아들일 수 있는 거래를 만드는 부수적인 이점도 있습니다"
 KOR_practicallearning: "안동 김씨의 통제 약화"
 KOR_practicallearning_desc: "마테오 리치의 저작과 같은 중요한 서양 과학 서적에 대한 우리 학자들의 연구를 통해, 우리는 이제 과학 연구를 개선하고 전반적인 생산성과 효율성을 향상시키기 위한 새로운 방법과 디자인을 개발함으로써 이러한 가르침을 실천에 옮길 기회를 얻었습니다"
 KOR_pragmaticreforms: "실용적 개혁"
 KOR_pragmaticreforms_desc: "실학 운동의 근본 원칙 중 하나는 강력한 지식 기반을 사용하여 우리 사회에 가장 큰 실질적인 이익을 가져오는 것입니다. 이제 우리 학자들이 유능한 연구자이자 발명가임을 증명했으므로, 그들은 비효율적인 경제 시스템 관행을 개혁하고 그 자리에 새로운 방법을 도입해 달라는 그들의 요청을 왕실에 요구합니다"
 KOR_embracewest: "세계적 변화에 대응"
 KOR_embracewest_desc: "조선이 새로운 방향으로 급진적인 발걸음을 내디딜 때가 왔습니다. 서구 열강의 기술과 철학적 관행의 정교함은 전 세계가 부러워하는 것이며, 조선인들이 비슷한 길을 따르는 것이 현명할 것입니다. 서구적 사고방식을 채택하는 것은 보수적인 관리들을 분명히 화나게 할 것이지만, 그것은 조선이 필요로 하는 변화가 될 수 있습니다"
 KOR_invitejesuit: "백성의 상태"
 KOR_invitejesuit_desc: "우리 왕국에서 서구 사상에 대한 관용이 커짐에 따라, 우리 영토를 방문하고 있는 가톨릭 선교사들의 유용성을 인정하기 시작할 때가 왔습니다. 이러한 사람들은 우리 백성들 사이에 불안정성을 야기할 수 있지만, 분명히 위대한 지혜와 과학적 통찰력을 가진 사람들이며, 우리 조정에서 조언자로 활용될 가치가 있습니다"
 KOR_toleratecatholics: "정약용의 가르침"
 KOR_toleratecatholics_desc: "정약용은 실학 학파 출신이지만, 결국 왕과 절대주의가 통치하는 올바른 길이라는 글을 썼습니다"
 KOR_westerninnovation: "필요한 절대주의"
 KOR_westerninnovation_desc: "정약용의 가르침을 이용하여 우리는 백성의 삶을 향상시키는 데 필요하다는 명분으로 한국 사회에서 왕과 가문의 위치를 확고히 할 수 있습니다"
 KOR_koreanconfucianism: "한국적 유교"
 KOR_koreanconfucianism_desc: "주희의 원래 가르침은 중국에서 유래했지만, 우리 학자들은 그들의 위대한 독창성과 지혜를 통해 그 원래의 가르침을 우리만의 독특한 종교적, 문화적 관행으로 형성하기 시작했습니다. 이것을 장려하는 것은 하나의 근본적인 이상 아래 우리 민족의 단결을 증가시킬 뿐입니다"
 KOR_confucianseowon: "유교 서원"
 KOR_confucianseowon_desc: "서원은 유교 사원 역할도 겸하는 사립 교육 기관으로, 우리 한국 문화의 독특한 부분입니다. 서원을 통해 우리의 가장 위대한 학자-관리와 유명한 선비 철학자들이 배출됩니다. 이 기관들을 지원하는 것은 우리 학자들이 새로운 문화적, 심지어 과학적 발견을 개발하는 데 도움이 될 것입니다"
 KOR_metaphysicalstudies: "형이상학적 연구"
 KOR_metaphysicalstudies_desc: "신유교 철학과 교리는 우리 최고의 학자들이 그 가르침의 작은 부분이라도 이해하기 위해 수년간의 연구를 필요로 합니다. 유교 형이상학의 덜 이해된 부분을 연구하기 위해 더 많은 학자들을 후원하는 것은 더 통일된 교리를 성문화하고 더 유능한 철학자들을 배출하는 데 큰 도움이 될 것입니다"
 KOR_deforestation: "산림 벌채"
 KOR_deforestation_desc: "기근의 영향을 해결하기 위해, 더 많은 농장과 벌목 캠프를 위한 공간을 마련하기 위해 특정 산림 지역을 개간하기 시작하는 계획이 수립되어야 합니다. 이 조치는 분명히 우리 환경을 손상시키겠지만, 우리의 국가적 회복을 계속하려면 슬프게도 필요한 조치입니다"
 KOR_yangbanplant: "양반 농장"
 KOR_yangbanplant_desc: "이제 새로운 지역이 농업을 위해 새로 개간되었으므로, 우리의 고위 관리들은 상민을 희생시키면서 새로운 농장을 설립하는 이 기회를 이미 이용하기 시작했습니다"
 KOR_ricepattyfarm: "논농사"
 KOR_ricepattyfarm_desc: "대한민국의 논은 우리 국민을 위한 가장 큰 식량 생산지 중 하나입니다. 이 농장들을 확장하면 우리 국민의 굶주림을 끝내는 데 큰 도움이 될 것입니다"
 KOR_newriceseed: "새로운 벼 품종"
 KOR_newriceseed_desc: "우리 농부들은 더 건조한 계절에도 좋은 수확을 할 수 있는 새로운 벼 품종을 실험하기 시작했습니다. 이 새로운 씨앗 품종의 재배를 지원하는 것은 우리의 식량 생산을 확장하는 데 도움이 될 것입니다"
 KOR_morepaddy: "더 많은 논농사"
 KOR_morepaddy_desc: "더 나은 경작 관행이 확립됨에 따라, 이제 남부 한국에서 습지 농업을 더욱 확장할 수 있습니다"
 KOR_teaproduc: "차 생산"
 KOR_teaproduc_desc: "차는 한국에서 매우 인기 있는 음료이므로, 차 생산을 확장하는 것은 우리 도시에 새로운 찻집을 설립하고 경제 성장을 증가시키는 데 도움이 될 것입니다"
 KOR_ginsengcult: "인삼 재배"
 KOR_ginsengcult_desc: "인삼은 치유 효능으로 한국과 중국 모두에서 인기가 있습니다. 우리가 더 많은 양의 인삼을 생산한다면 중국 상인들은 분명히 더 많은 인삼을 기꺼이 구매할 것입니다"
 KOR_cottonfarm: "면화 농장"
 KOR_cottonfarm_desc: "새로운 면화 농장을 건설하면 더 많은 상품을 시장에 내놓을 수 있습니다"
 KOR_peasantirrigation: "농민 관개"
 KOR_peasantirrigation_desc: "우리 농업의 확장과 함께, 새로운 작물에 물을 공급하기 위한 실행 가능한 수로를 확장할 필요가 있습니다. 이러한 수로를 확장하면 미래에 더 많은 농장이 건설될 것이며, 새로운 관개 시설로 가장 혜택을 받을 지역을 두고 지역 지주들 간의 분쟁이 발생하는 단점이 있습니다"
 KOR_teaplantations: "더 많은 차 농장"
 KOR_teaplantations_desc: "더 많은 차 농장은 우리 국민을 위한 더 많은 소비재를 의미합니다"
 KOR_moreginseng: "더 많은 인삼 농장"
 KOR_moreginseng_desc: "현재의 인삼 비축량을 확장하면 이웃 중국과의 무역을 증가시킬 수 있을 것입니다"
 KOR_morecottonfarm: "더 많은 면화 농장"
 KOR_morecottonfarm_desc: "면화 생산을 확장하는 것은 우리의 경제 성장을 계속해서 촉진할 것입니다"
 KOR_extractresources: "천연 자원 추출"
 KOR_extractresources_desc: "수세기 동안 북한 산맥의 풍부한 광물은 우리가 그것들을 이용하기를 기다리고 있었습니다. 현재 우리에게 산업적 채굴 능력은 없지만, 상당한 양의 자원을 추출하기 위한 노력은 여전히 이루어질 수 있습니다"
 KOR_northenmining: "북부 광물 채굴"
 KOR_northenmining_desc: "북부에서의 우리의 노력 덕분에, 우리 광부들은 새로운 석탄 매장지 형태로 새로운 발견을 하기 시작했습니다. 이 운영에 더 많은 자금을 지원하면 우리가 사용할 수 있도록 그 자원들을 조금 추출할 수 있을 것입니다"
 KOR_seearmy: "군대 관리"
 KOR_seearmy_desc: "학자로서의 삶이 군인으로서의 삶보다 더 바람직하다는 믿음 때문에 군대 유지를 거의 방치하는 것이 조선의 오랜 정책이었습니다. 우리가 이 정책을 뒤집으려면, 군대에 더 많은 자금을 확보하고 그 수를 늘리기 위한 새로운 노력이 이루어져야 합니다"
 KOR_armyreform: "군대 개혁 시작"
 KOR_armyreform_desc: "너무 오랫동안 양반 귀족들의 부패가 우리 군대의 적절한 기능에 해를 끼쳤습니다. 이제 우리 정부가 제대로 된 권위를 되찾았으므로, 이 부패를 척결하고 조선 군대를 근본적으로 재건할 때가 왔습니다"
 KOR_yangbanstaff: "양반 참모진 숙청"
 KOR_yangbanstaff_desc: "We must purge our ranks of any Yangban refusing to cooperate with our army reforms. If they do not display any aptitude for soldering, then they will no longer be leading our armies into battle."
 KOR_recruitofficers: "새로운 장교 모집"
 KOR_recruitofficers_desc: "이제 부패한 귀족들이 우리 군대의 주요 지휘관 자리를 비웠으므로, 우리 왕의 군대를 전투로 이끌 만큼 충분히 가치 있는 유망한 지휘관들을 찾아 나설 때가 왔습니다."
 KOR_recruitment: "모병 노력"
 KOR_recruitment_desc: "군은 적절한 인력 지원 없이는 아무것도 아니며, 현재 우리는 그것이 부족합니다. 더 많은 병력을 위한 부름이 전파되어야 합니다."
 KOR_improvenavy: "조선 해군 개선"
 KOR_improvenavy_desc: "너무 오랫동안 우리 해군은 정부에 의해 거의 방치되었으며, 위대한 이순신 장군 시절의 강력한 해군과는 거리가 멉니다. 우리의 해군력을 한심한 해안 방어 부대 이상으로 끌어올리려면, 더 많은 조선소를 건설하고 더 많은 선원을 훈련시키기 위한 새로운 노력이 이루어져야 합니다."
 KOR_centralports: "중부 한국 항구"
 KOR_centralports_desc: "외국의 위협으로부터 수도를 보호하기 위해 서울 지역 내의 항구를 확장해야 합니다."
 KOR_southports: "남부 한국 항구"
 KOR_southports_desc: "부산항은 우리의 가장 큰 항구 중 하나이며 일본 영토와 가장 가깝습니다. 이것을 확장하는 것은 매우 중요할 것입니다."
 KOR_largevessel: "대형 함선 계획"
 KOR_largevessel_desc: "우리는 임진왜란 당시 그들이 우리를 두려워했던 것처럼 이웃 국가들이 두려워할 해군을 건설해야 합니다. 더 크고 강력한 함선을 건설하는 데는 더 많은 비용이 들겠지만, 이보다 더 위대한 조선 해군력의 시연은 없을 것입니다."
 KOR_newnavy: "새로운 해군 인력"
 KOR_newnavy_desc: "우리가 해군을 확장하고자 한다면 해군을 위한 선원 모집을 늘려야 합니다."
 KOR_navalinfrastructure: "해군 기반 시설"
 KOR_navalinfrastructure_desc: "최근 몇 년 동안 악화되기 시작한 우리의 주요 항구에 대한 조선소와 보급로의 품질을 업그레이드해야 합니다."
 KOR_smalldeadly: "소형 함선 계획"
 KOR_smalldeadly_desc: "우리 예산에 상당한 부담을 주지 않으면서도 적의 대포에 더 큰 표적이 되지 않을 새로운 함선을 개발하는 것이 가장 현명한 행동 방침입니다."
 KOR_antiwesternview: "반서구적 관점"
 KOR_antiwesternview_desc: "한국은 오랫동안 유교와 강하게 결부된 반서구적 관점을 유지해 왔습니다. 서양이 더욱 뻔뻔해짐에 따라 이 정책을 장려해야 합니다."
 KOR_hermitkingdom: "은둔의 왕국"
 KOR_hermitkingdom_desc: "수세기 동안 우리는 고립주의를 유지해 왔지만, 이제 외교 정책을 재평가해야 할 때가 왔습니다."
 KOR_oureasterndomain: "우리의 동쪽 영토"
 KOR_oureasterndomain_desc: "동쪽은 우리의 영역이며, 우리는 누가 우리의 친구이고 적인지 알 만큼 오랫동안 존재해 왔습니다. 청나라는 오랫동안 여러 면에서 우리를 지원해 왔지만, 서구에 대한 일본의 관계는 우리 나라를 위협합니다."
 KOR_japaneseletter: "일본의 서신"
 KOR_japaneseletter_desc: "일본 정부가 수립되고 서양에 개방된 후, 일본은 감히 황제의 한자가 담긴 서신을 보냈습니다. 이 한자는 오직 청나라 황제에게만 허용된 것이며, 일본은 우리 청나라 동맹국과 동등하게 여겨질 수 없습니다."
 KOR_gangwhaincident: "강화도 사건"
 KOR_gangwhaincident_desc: "일본 함선이 우리 해안에 접근한 후 우리 포대가 포격을 가하자 짧은 전투가 벌어졌습니다. 일본은 우리보다 훨씬 나은 군사력을 가지고 있기 때문에 이 전투는 우리의 고립 종식의 시작이 될 수 있습니다."
 KOR_hermitkingdomend: "은둔의 왕국 종식"
 KOR_hermitkingdomend_desc: "우리의 문호를 서양에 개방하라는 일본의 요구는 수용 외에는 답이 없습니다. 일본과의 전쟁은 재앙이 될 것이며, 정부가 최근에 찾은 안정을 고려할 때 감당할 수 없는 일입니다. 이제 한국이 세계 무대에 진출할 때가 왔습니다."
 KOR_remainiso: "고립주의 유지"
 KOR_remainiso_desc: "옛 방식이 최고입니다. 서양 야만인들이 우리를 ‘은둔의 왕국’이라 부르며 다툴지라도, 모든 비필수적 무역에 국경을 폐쇄하는 것은 우리가 식민 열강의 손에 고통받았던 중국의 끔찍한 운명에서 벗어나고 자유롭고 독립적인 한국을 위한 길을 열어줄 것입니다."
 KOR_opendoor: "한국의 문호 개방"
 KOR_opendoor_desc: "우리는 더 이상 외부 세계에 우리 나라를 폐쇄해서는 안 됩니다. 미지의 세계로 나아가는 것은 우리 국민들 사이에 많은 불안을 야기할 극적인 조치이지만, 한국은 아직 기회가 있을 때 자체적인 조건으로 무역을 개방해야 합니다."
 KOR_defendvalues: "서구의 위협"
 KOR_defendvalues_desc: "우리의 국가 통합을 침식하려는 외부 영향력에 맞서기 위해, 우리의 확립된 종교를 가능한 모든 방법으로 지원하려는 노력이 이루어져야 합니다."
 KOR_instillpride: "문화적 자부심 고취"
 KOR_instillpride_desc: "서구화와 식민화에 대한 우리의 방어를 더욱 강화하기 위해, 우리 국민에게 영광스러운 역사와 유산을 가르쳐 한국인으로서의 자부심을 심어주어야 합니다."
 KOR_frenchencroachment: "프랑스의 침략"
 KOR_frenchencroachment_desc: "프랑스는 신뢰할 수 없음이 분명합니다. 그들의 사제들은 평화로운 태도로 우리에게 와서 서구 악마들과 합류하도록 설득하려 하지만, 우리는 더 잘 알고 있습니다."
 KOR_byeongpersucution: "병인박해"
 KOR_byeongpersucution_desc: "천주교의 영향력은 우리 사회에서 제거되어야 합니다."
 KOR_expelparis: "파리 외방전교회 '추방'"
 KOR_expelparis_desc: "프랑스 사제들은 한국에서 추방되어야 합니다."
 KOR_rallydefenses: "방어력 결집"
 KOR_rallydefenses_desc: "프랑스는 우리 나라를 약탈하고 우리 국민을 살해하려 합니다. 그들이 심각한 피해를 입히기 전에 강화도에서 방어선을 지키기 위해 가능한 한 많은 건장한 남성들을 결집해야 합니다."
 KOR_fortifyganghwa: "한국 문화의 우월성 장려"
 KOR_fortifyganghwa_desc: "유교의 여러 학파들이 공유하는 한 가지는 한국 문화에 대한 자부심입니다. 이 사상을 장려함으로써 국민들은 자연스럽게 더 민족주의적이 되고 서양을 두려워하게 될 것입니다."
 KOR_producemyeonje: "기독교 파벌 약화"
 KOR_producemyeonje_desc: "우리 정부 내 특정 가문과 파벌들이 우리 나라의 기독교인들에게 이용되어 우리가 가진 토지에 대한 권력을 약화시키고 있습니다. 한국에서 기독교 사상을 숙청하면 이 집단들은 약화될 것입니다."
 KOR_lessonsfromqing: "청나라로부터의 교훈"
 KOR_lessonsfromqing_desc: "청나라는 오랫동안 외교의 관문 역할을 해왔으며, 우리 두 나라의 관계는 강력합니다. 서양과 전쟁에 대한 그들의 지식은 프랑스를 다룰 때 유용할 수 있습니다."
 KOR_koreadefiant: "조선의 저항"
 KOR_koreadefiant_desc: "모든 고난을 겪고도, 조선인들은 그들 고유의 가치를 지키기 위해 기꺼이 목숨을 걸고 버티고 있습니다. 서구화나 식민지 영향력으로부터 벗어난 한국은 이제 스스로의 길이라고 부를 수 있는 길을 굳건히 걷고 있습니다."
 KOR_unlikelyalliance: "미국의 침략자들"
 KOR_unlikelyalliance_desc: "미국인들은 항상 우리 나라를 무역을 위해 강제로 개방하려 했지만, 우리는 항상 저항할 것입니다. 하지만 일부 소식통은 해안에서 중무장한 무역선이 발견되었다고 주장합니다."
 KOR_portprotection: "제너럴 셔먼호 사건"
 KOR_portprotection_desc: "수상할 정도로 잘 무장한 미국 무역선이 수도의 정부와 접촉하려 했습니다. 이 배가 정박해 있으라는 우리의 요청에도 불구하고 그들은 우리의 명령을 어기고 한강을 거슬러 항해했습니다. 우리가 그들에게 환대와 음식을 제공했지만, 그들은 무역 협정의 부재를 받아들일 수 없었고, 모인 군중에게 발포하기 전에 한 장군을 납치했습니다. 우리 백성과 군인들은 한강에 좌초된 배를 재빨리 침몰시켰지만, 미국인들은 이 사건에 대해 우리를 비난하고 있습니다."
 KOR_navaltech: "프랑스 해군 기술"
 KOR_navaltech_desc: "프랑스와의 조심스러운 관계에서 좋은 결과가 있었습니다. 우리 항구가 프랑스 상선에 개방됨에 따라, 우리 관리들 중 일부는 그들의 우수한 해군 능력을 신중하게 연구할 수 있었습니다."
 KOR_armytech: "미국인을 악당으로 만들기"
 KOR_armytech_desc: "제너럴 셔먼호 사건은 한국 밖에서는 논쟁의 여지가 있을 수 있지만, 우리 나라 안에서는 누가 잘못했는지 국민들이 알고 있습니다. 미국과 서양은 한국에 발을 들이지 말아야 합니다!"
 KOR_readyshorebatteries: "해안 포대 준비"
 KOR_readyshorebatteries_desc: "과거 서구 원정대가 한강을 공격의 근원으로 삼았던 것은 이 강에 대한 의존도 때문입니다. 이 지식을 바탕으로 우리는 대비를 위해 해안 포대를 증설할 수 있습니다."
 KOR_hanriverpolicy: "한강 정책"
 KOR_hanriverpolicy_desc: "서구 원정대와 그들의 폭력적인 성향을 본 후, 이제 그들의 함선으로부터 한강을 봉쇄할 때가 왔습니다. 이제부터는 오직 조선의 배만 강을 항해할 것이며, 서구 함선은 우리 수도에 그렇게 가까이 오는 것을 환영받지 못할 것입니다."
 KOR_Han_River_Policy:0 "§Y우리는 한강 접근을 차단할 것입니다§!"
 KOR_nonegotiationpolicy: "협상 불가 정책"
 KOR_nonegotiationpolicy_desc: "서구 열강이 조선에서 전쟁을 벌일 능력이 없다는 점은 우리에게 이점을 줍니다. 그들이 아무리 많은 요새를 점령하더라도 우리 정부에 도달할 수는 없을 것입니다. 우리가 그들의 말을 듣지 않는다면 그들은 결국 떠날 수밖에 없을 것입니다."
 KOR_No_Negotiation_Policy:0 "§Y우리는 미국과 협상하기를 거부할 것입니다!§!"
 KOR_westerntrade: "서구 무역 환영"
 KOR_westerntrade_desc: "우리나라는 너무 오랫동안 서구 접촉의 긍정적인 면을 무시해왔습니다. 그들의 가치와 문화가 우리와 완전히 다르지만, 그것이 그들과의 무역을 통해 이익을 얻고 그들의 기술적 발견을 배우려는 우리의 노력을 막을 수는 없습니다."
 KOR_tsushimatrade: "쓰시마 무역 증대"
 KOR_tsushimatrade_desc: "수세기 동안 일본 이웃들과의 주요 접촉 형태는 작은 섬인 쓰시마를 통해서였습니다. 이 은둔의 섬나라와 관계를 더욱 발전시키려면, 그들과의 무역을 늘리기 위한 더 많은 노력을 기울여야 합니다. 아마 그들은 우리의 훌륭한 분청사기를 좋아할지도 모릅니다?"
 KOR_envoyjapan: "일본에 사절 파견"
 KOR_envoyjapan_desc: "옛날처럼 여러 외교관, 서기관, 화가들로 구성된 사절단을 꾸려 쓰시마로 보내 일본과의 접견을 요청해야 합니다."
 KOR_unequaltreaties: "그들의 불평등 조약 서명"
 KOR_unequaltreaties_desc: "서구 식민 열강을 다루는 데 가장 큰 장애물은 그들의 솔직히 모욕적인 요구에 순응하는 것입니다. 그러나 그러한 협정이 아무리 불공평하더라도, 서구와의 상호작용 증대로 인한 미래의 이익은 장기적으로 보상될 것입니다."
 KOR_frenchrelations: "프랑스 관계"
 KOR_frenchrelations_desc: "우리는 프랑스의 호의를 얻기 위해 외교적 노력을 투자해야 합니다. 그들은 동아시아에 강력한 영향력을 가지고 있으며 미래에 유익한 접촉이 될 수 있습니다."
 KOR_frenchinnovations: "프랑스 혁신"
 KOR_frenchinnovations_desc: "새로운 프랑스 상인들의 유입과 함께 새로운 프랑스 사상도 유입됩니다. 왕실 정부의 충분한 지원이 있다면, 우리 학자들이 해군 및 군사 기술의 놀라운 새로운 발전을 심층적으로 연구할 수 있습니다."
 KOR_catholicmissions: "가톨릭 선교사 수용"
 KOR_catholicmissions_desc: "우리 유교 인구의 분노를 살 수 있겠지만, 프랑스와의 외교 관계를 진전시키기 위한 유일한 방법은 그들의 가톨릭 선교사들의 활동에 간섭하지 않겠다고 약속하는 것입니다."
 KOR_frenchembassy: "프랑스 대사관"
 KOR_frenchembassy_desc: "프랑스와의 관계가 발전하여 이제 그들의 수도에 우리의 대사관 요청을 받아들이도록 청원할 수 있을 것입니다. 유럽의 프랑스와 직접 접촉하는 것은 싹트고 있는 한-프 관계를 더욱 발전시킬 뿐입니다."
 KOR_francokorean: "한-프 동맹"
 KOR_francokorean_desc: "이제 우리는 프랑스 정부에 우리와 임시 동맹을 맺도록 요청할 기회를 가질 수 있습니다. 그러한 동맹을 맺을 수 있다면, 이는 미래의 외세 침략을 막는 데 필요한 수단이 될 수 있습니다."
 KOR_franceadvisors: "프랑스 고문"
 KOR_franceadvisors_desc: "프랑스와 동맹을 맺으면 프랑스 고문의 도움이 따릅니다. 우리는 프랑스 정부에 산업 전문가를 파견하여 우리 경제를 활성화하고 산업화라는 궁극적인 목표를 위해 준비하도록 청원해야 합니다."
 KOR_russianrelations: "러시아 관계"
 KOR_russianrelations_desc: "우리는 러시아의 호의를 얻기 위해 외교적 노력을 투자해야 합니다. 그들은 동아시아에 강력한 영향력을 가지고 있으며 우리는 그들의 군사력으로부터 이익을 얻을 수 있습니다."
 KOR_russianaccess: "러시아의 군사 통행권 수용"
 KOR_russianaccess_desc: "러시아는 전략적으로 매우 중요한 지역으로서 우리 한반도에 큰 관심을 가지고 있으며, 따라서 큰 장애 없이 우리 국경을 통해 군대를 이동시킬 수 있는 가능성에 관심이 있습니다. 우리 왕국에 군사 통행권을 제공하는 것은 우리를 러시아에 더 가깝게 만들 것입니다."
 KOR_russokorean: "러시아-조선 동맹"
 KOR_russokorean_desc: "이제 우리는 러시아 정부에 우리와 임시 동맹을 맺도록 요청할 기회를 가질 수 있습니다. 그러한 동맹을 맺을 수 있다면, 이는 미래의 외세 침략을 막는 데 필요한 수단이 될 수 있습니다."
 KOR_russianadvisors: "러시아 고문"
 KOR_russianadvisors_desc: "러시아와 동맹을 맺으면 러시아 고문의 도움이 따릅니다. 우리는 러시아 정부에 군사 전문가를 파견하여 우리 군대를 더욱 개혁하고 새로운 전술과 기술을 도입하도록 청원해야 합니다."
 KOR_russianembassy: "러시아 대사관"
 KOR_russianembassy_desc: "러시아와의 관계가 발전하여 이제 그들의 수도에 우리의 대사관 요청을 받아들이도록 청원할 수 있을 것입니다. 유럽의 러시아와 직접 접촉하는 것은 싹트고 있는 한-러 관계를 더욱 발전시킬 뿐입니다."
 KOR_russianinnovations: "러시아 혁신"
 KOR_russianinnovations_desc: "새로운 러시아 상인들의 유입과 함께 새로운 러시아 사상도 유입됩니다. 왕실 정부의 충분한 지원이 있다면, 우리 학자들이 해군 및 군사 기술의 놀라운 새로운 발전을 심층적으로 연구할 수 있습니다."
 KOR_busanroute: "부산-후쿠오카 노선"
 KOR_busanroute_desc: "우리가 부산 항구를 개방하는 대가로 그들이 우리에게 후쿠오카 항구를 개방하는 상호 무역 협정에 일본과 서명하면 양국 국민 간의 무역과 외교적 접촉이 증가할 것입니다."
 KOR_japankorean: "일본-조선 동맹"
 KOR_japankorean_desc: "우리는 일본 이웃들과 충분한 호의를 얻어 그들에게 임시 동맹을 제안할 수 있게 되었습니다. 일본과 동맹을 확보하는 것은 결국 우리가 그들이 달성한 근대화 수준에 도달하는 데 도움이 될 수 있지만, 이 '악마와의 거래'는 또한 왕실 정부에 대한 우리 국민의 신뢰를 배신할 수도 있습니다."
 KOR_surveyjapan: "일본 기술 조사"
 KOR_surveyjapan_desc: "일본의 기술 발전을 모방할 수 있는 유일한 방법은 우리 스스로 그곳으로 가서 그들로부터 무엇을 배울 수 있는지 보는 것입니다."
 KOR_industrialjapan: "일본 산업 기술"
 KOR_industrialjapan_desc: "일본은 그들에게 주어진 짧은 시간 동안 놀라운 양의 근대화를 달성했습니다. 우리가 그들의 산업 기술을 복사할 수 있다면, 여기 조선에서도 그것들을 실천에 옮길 수 있을 것입니다."
 KOR_militaryjapan: "일본 군사 기술"
 KOR_militaryjapan_desc: "일본은 동아시아 전체에서 가장 훌륭한 군대 중 하나를 가지고 있으며, 심지어 중국과도 견줄 만할 것입니다. 우리 학자들이 그들의 무기를 손에 넣거나 그들의 전술에 대해 조금이라도 배울 수 있다면, 우리 군대를 재정비하는 데 큰 도움이 될 것입니다."
 KOR_japanadvisors: "일본 고문"
 KOR_japanadvisors_desc: "일본은 우리 한반도의 발전에 더 큰 관심을 가지기 시작한 것 같습니다. 그것이 좋은 방향일지 나쁜 방향일지는 알 수 없지만, 일본이 우리의 오합지졸 군대나 유아기 산업을 정비하는 데 제공할 수 있는 어떤 도움이라도 현재 우리에게는 매우 유익할 것임은 부인할 수 없습니다."
 KOR_koreanindustrial: "한국의 산업화"
 KOR_koreanindustrial_desc: "우리는 마침내 해냈습니다. 비록 우리의 국가적 자부심과 내부 안정에 수많은 희생을 치렀지만, 우리는 마침내 우리 사회를 산업 강국의 세계로 이끄는 목표를 달성했습니다. 완전한 산업화로 가는 우리의 길은 길고 험난할 수 있지만, 오랫동안 조선 왕국을 괴롭혔던 문제들에 대한 해결책이 될 것입니다."
 KOR_chineserelations: "중국 관계"
 KOR_chineserelations_desc: "중국은 항상 조선의 가장 중요한 이웃이었습니다. 중국에 대한 우리의 정책은 우리가 앞으로 나아가면서 우리 나라가 어떻게 발전할지 매우 잘 형성할 수 있습니다."
 KOR_closerqing: "청나라에 더 가까이 다가가기"
 KOR_closerqing_desc: "조선 왕조가 있었던 만큼, 그들은 중국 이웃과 강력한 관계를 가졌습니다. 우리도 다르지 않아야 합니다. 청나라와의 조공 관계는 우리에게 잘 봉사해 왔으며, 그 길을 계속하는 것이 현명할 것입니다."
 KOR_chineseideas: "중국 사상"
 KOR_chineseideas_desc: "우리의 많은 고대 전통이 중국 문화 유산의 수탁자이므로, 우리의 가장 뛰어난 유교 학자들을 그들의 중국 동료들과 만나게 하는 것은 새로운 사상의 확산을 촉진할 것입니다."
 KOR_chinesetextiles: "중국 직물 기술"
 KOR_chinesetextiles_desc: "중국에서 돌아온 우리 상인들은 그들이 채택하기 시작한 새로운 산업화된 방직 기술에 대해 이야기합니다. 그들로부터 배우고 여기에서 그러한 원리를 적용하면 우리 자신의 직물 산업에 호황을 가져올 것입니다."
 KOR_domestictextiles: "국내 직물 산업 확장"
 KOR_domestictextiles_desc: "새로운 중국식 관행으로 우리 방직 공장이 활력을 되찾았으므로, 우리 직물 산업은 우리 국민의 증가하는 요구를 충족시키기 위해 확장할 준비가 되었습니다."
 KOR_manchurianroutes: "만주 무역로"
 KOR_manchurianroutes_desc: "북한과 옛 여진족 영토를 연결하는 도로는 우리 나라와 청나라 사이의 주요 무역로 중 하나입니다. 이 도로를 통해 더 많은 무역을 장려함으로써 우리는 새로운 중국의 혁신을 배울 수 있을 것입니다."
 KOR_chinaweapons: "중국 무기 제작 사상"
 KOR_chinaweapons_desc: "청나라가 가장 첨단 무기를 가지고 있지는 않겠지만, 그들의 군사 생산 및 총기 기술은 이미 우리보다 수년, 수십 년 앞서 있습니다. 이제 우리 자신의 것을 위해 그들의 기술 중 일부를 사용할 때입니다."
 KOR_domesticweapons: "국내 무기 산업"
 KOR_domesticweapons_desc: "강화된 조선 군대를 지원할 수 있는 유일한 방법은 더 나은 무기 산업을 갖는 것입니다. 더 현대적인 무기를 생산하기 위해 새로운 창고와 작업장이 건설되어야 합니다."
 KOR_questionqing: "청나라의 정당성 의문"
 KOR_questionqing_desc: "우리는 너무 오랫동안 중국에서 만주족 찬탈자들의 통치를 용인해 왔습니다. 이제 그들의 야만적인 통치가 끝나고, 진정한 한족 황제를 왕좌에 복원할 때가 왔습니다."
 KOR_antiqing: "반청 감정 확산"
 KOR_antiqing_desc: "중국의 정권 교체가 우리에게 매력적으로 보일 수 있지만, 우리 국민의 대다수는 다른 나라의 문제에 간섭하거나 어떤 종류의 외교 분쟁에도 휘말리고 싶어 하지 않습니다. 이것은 바뀌어야 합니다."
 KOR_scholarsoldier: "학자에서 군인으로"
 KOR_scholarsoldier_desc: "너무 오랫동안 조선의 일반적인 인식은 더 천한 군인의 삶보다는 고등한 추구에 우리의 모든 초점을 두는 것이었고, 이는 우리 군대를 크게 방치하는 결과를 낳았습니다. 이 메시지를 뒤집고 우리 군대에 대한 더 큰 지지를 결집하는 것은 필수입니다."
 KOR_northfort: "북부 요새"
 KOR_northfort_desc: "옛날처럼, 우리 국민을 동원하여 청나라 만주와 접한 우리 국경을 따라 있는 오래된 요새들을 재정비해야 합니다. 우리 전투의 대부분은 그 지역의 험난한 산악 통로에서 벌어질 가능성이 높기 때문입니다."
 KOR_rallyhan: "한족 반체제 인사 결집"
 KOR_rallyhan_desc: "청나라 정치 구조 내에서 불만을 품은 한족 엘리트들과 접촉하기 위해 요원들을 파견함으로써, 우리는 만주족과의 전쟁에서 몇몇 동맹을 맺을 수 있을 것입니다."
 KOR_chunghwa: "중화 부흥 전쟁"
 KOR_chunghwa_desc: "만주족의 부패로부터 중화권(Sinitic Sphere)을 마침내 정화할 때가 왔습니다!"
 KOR_installdaewongun: "대원군 즉위"
 KOR_installdaewongun_desc: "철종의 죽음으로 우리의 새로운 군주인 고종이 12세의 나이로 왕위에 올랐고, 그를 대신할 섭정 체제 수립이 필요하게 되었습니다. 비록 고종의 공식적인 섭정은 신정왕후이지만, 신정왕후는 왕국의 적절한 통치를 위한 그녀의 모든 책임을 맡기기 위해 고종의 아버지인 흥선대원군을 사실상의 대원군으로 임명하도록 요청했습니다."
 KOR_disciplineclans: "왕실 가문 징계"
 KOR_disciplineclans_desc: "대원군의 첫 번째 우선순위 중 하나는 '세기 초에 왕들의 주권을 사실상 찬탈했던 낡은 지배 파벌을 분쇄하는 것'입니다. 이는 우리의 군주 권위를 강화하고 우리 정부 시스템에 어느 정도의 질서를 회복하는 데 도움이 될 것입니다."
 KOR_strengthenuijeongbu: "의정부 강화"
 KOR_strengthenuijeongbu_desc: "의정부는 왕에게 직접 보고하는 세 명의 고위 왕실 고문 그룹입니다. 최근 몇 년 동안 이 자문 위원회는 부패한 가문원들에게 이용되어 군주로부터 권력을 빼앗았습니다. 섭정에게 충성하는 새로운 고문들을 고용하는 것이 최우선 과제여야 합니다."
 KOR_removeclan: "가문 이권자 제거"
 KOR_removeclan_desc: "조선의 관료 체제를 거의 장악한 귀족 양반 계급과 함께, 많은 가문들은 자신들의 주머니를 채우고 자신들의 정치적 야심을 추진하기 위해 정부 시스템을 이용하기 시작했습니다. 이러한 개인들을 제거하고 더 자격 있는 인력으로 교체하는 것은 필수입니다."
 KOR_rootoutcorruption: "정부 부패 척결"
 KOR_rootoutcorruption_desc: "우리의 망가진 정부 시스템을 개혁하기 위한 실질적인 노력이 마침내 이루어질 수 있도록, 왕세자 섭정과 왕에 대한 불충실함으로 여겨지는 모든 것을 우리의 최고 정부 직위에서 숙청하기 위한 지속적인 노력이 이루어져야 합니다."
 KOR_civilservicereform: "관리 임용 개혁"
 KOR_civilservicereform_desc: "이제 우리의 최고 정부 직위가 왕실 가문의 간섭으로부터 깨끗해졌으므로, 한국 관리 임용의 관문인 과거 시험부터 시작하여 우리의 더 지방적인 행정 시스템을 개혁할 때가 왔습니다."
 KOR_removeseowontax: "서원 면세 혜택 철회"
 KOR_removeseowontax_desc: "반왕실 파벌의 지적 확성기인 서원은 그들의 소중한 면세 지위를 박탈함으로써 군주에 대한 그들의 선동적인 사상을 말하는 것을 막아야 합니다."
 KOR_taxesyangban: "양반에 대한 세금"
 KOR_taxesyangban_desc: "우리 관료 시스템에 존재하는 광범위한 부패를 다루기 위해, 부유한 양반 계급 구성원들에게 세금을 부과하여 가문들에 대한 압력을 높여야 합니다. 이러한 세금은 새로운 강력한 왕실 정부가 이제 제자리에 있다는 것을 그들에게 상기시키고, 가난에 시달리는 상민들에게 어느 정도의 안도감을 가져다줄 것입니다."
 KOR_shutdownseowon: "라이벌 서원 폐쇄"
 KOR_shutdownseowon_desc: "적대적인 학파에 세금이 부과되었음에도 불구하고, 어리석은 가문원들은 여전히 왕세자 섭정에 대한 비방적인 거짓말을 퍼뜨리고 있습니다. 그들에게 쉽게 잊지 못할 교훈을 가르치기 위해 이들 기관 중 일부를 강제로 폐쇄할 때가 왔습니다."
 KOR_securebloodline: "왕실 혈통 확보"
 KOR_securebloodline_desc: "이제 우리의 젊은 왕 고종을 위한 새로운 왕비를 찾을 때가 왔습니다. 너무 오랫동안 안동 김씨 가문은 철종과 철인 왕후의 경우처럼 조선의 왕들이 어떤 아내를 맞이할지 쉽게 선택하고 결정했습니다. 고종을 영향력이 덜한 여흥 민씨 가문의 민자영과 결혼시키는 것은 이씨 왕실의 혈통이 다음 세대에도 안전할 것을 보장할 것입니다."
 KOR_ensureroyal: "왕실 지배력 확보"
 KOR_ensureroyal_desc: "이제 가문 부패의 통제로부터 자유롭고 독립적인, 강력하고 중앙집권화된 왕실 정부의 존재를 다시 한번 선포할 때가 왔습니다. 모든 양반 가문은 이제 군주 정부에 충성을 바치거나 그 결과를 감수하는 법을 배워야 합니다."
 KOR_renovatehanseong: "한성 재건"
 KOR_renovatehanseong_desc: "우리 수도의 위신을 높이기 위해, 왕실의 명성을 높이기 위해 우리 수도의 주요 정부 건물과 기념물들을 재활성화하기 위한 계획을 수립해야 합니다. 여기에는 조선 왕들의 종묘와 종친부 정부 건물이 포함됩니다. 이는 왕실의 명성을 높일 뿐만 아니라, 거리에 있는 사람들이 다시 활발한 노동력의 일부가 될 수 있게 할 것입니다."
 KOR_floodcontrol: "홍수 통제"
 KOR_floodcontrol_desc: "수십 년 동안 우리 농민들은 우리의 열악한 관개 시스템 때문에 계절적으로 발생하는 대규모 홍수로 반복적으로 고통받아야 했습니다. 이 수로를 수리하고 개선하면 미래에 추가적인 흉작을 막을 수 있습니다."
 KOR_southrice: "남부 쌀 재배"
 KOR_southrice_desc: "비옥한 남부 한국 지역에서 우리의 쌀 농장을 확장하면 우리 국민의 텅 빈 배를 더 많은 음식으로 채우는 데 도움이 될 것입니다."
 KOR_grainrelief: "곡물 구호 시스템"
 KOR_grainrelief_desc: "기근으로 굶주린 우리 농민들을 위한 새로운 사회 복지 시스템을 만드는 것은 위기 시에 그들이 필요로 하는 안전망을 제공할 것이며, 심지어 왕실 정부에 대한 농민의 지지를 증가시킬 수도 있습니다."
 KOR_endstarvation: "대량 아사 종식"
 KOR_endstarvation_desc: "우리 국민을 먹여 살리고 이 끔찍한 기근으로부터 마침내 벗어나기 위한 추가적인 노력이 이루어져야 합니다."
 KOR_southcotton: "남부 현금 면화"
 KOR_southcotton_desc: "남부 한국의 토양은 면화 씨앗을 이용하기에 적합합니다. 더 많은 농장이 설립되어야 하고 더 많은 노동자들이 들판으로 나와야 합니다."
 KOR_expandcotton: "면화 농장 확장"
 KOR_expandcotton_desc: "우리 면화 농장을 더욱 확장하는 것은 우리 정부가 새로운 프로젝트에 지출해야 하는 수익을 증가시킬 뿐입니다."
 KOR_infantilecotton: "초보적인 면화 산업"
 KOR_infantilecotton_desc: "우리의 면화 생산이 성장함에 따라, 기업가적인 개인들은 면화를 의류 및 기타 유용한 제품으로 짜는 데 전념하는 새로운 협회를 설립하기 시작했습니다."
 KOR_hanriver: "한강 유역"
 KOR_hanriver_desc: "우리 수도의 행정 및 문화 건물을 세운 후, 이제 한성의 자연 북부 경계를 형성하는 북한산을 계약하여 더 많은 확장 공간을 마련함으로써 한강 유역의 기반 시설을 확장할 때입니다."
 KOR_reconstructpalace: "경복궁 재건"
 KOR_reconstructpalace_desc: "이제 우리 수도가 다시 존경할 만한 도시가 되기 시작했으므로, 우리의 새로운 왕의 위신을 극대화하기 위한 마지막 프로젝트가 시작되어야 합니다. 임진왜란 당시 심각한 피해를 입은 옛 경복궁은 폐허 상태에 놓여 있습니다. 이 조선 왕들의 상징을 재건할 수 있다면, 왕실은 라이벌 가문들에 대한 우월성을 명백히 입증할 수 있을 것입니다."
 KOR_shoreup: "경제를 강화하다"
 KOR_shoreup_desc: "경제를 강화하다"
 KOR_stablizecrisis: "위기 안정화"
 KOR_stablizecrisis_desc: "우리의 상당한 노력과 정책 변화는 국가를 위기 직전에서 구해냈습니다. 안동 김씨 가문의 권력은 우리 기관에 굳건히 자리 잡았고, 라이벌 가문들은 억제되었으며, 불교 자산은 우리의 개혁을 지원하기 위해 재배치되었고, 농민들은 전반적으로 세금을 냈습니다. 붕괴는 피했고, 이제 회복으로 가는 긴 여정이 시작될 수 있습니다."
 KOR_frenchresponse: "프랑스의 반응"
 KOR_frenchresponse_desc: "프랑스 사절단은 항의하며 철수했고, 그들의 기독교 선교사들의 참수는 가만두지 않겠다고 맹세했습니다. 그들은 어떤 수단을 동원할까요?"
 KOR_beginroundup: "대대적 검거 시작"
 KOR_beginroundup_desc: "반기독교 정서는 조선 조정에서 강력하며 군사 지도부는 기독교 지지자들에 대한 조직적인 행동을 실행할 준비가 되어 있습니다. 기독교 세력들을 검거하고 그들의 이른바 '선교사들'이 우리 백성들의 마음을 오염시킨 죄로 참수될 것이라는 일반적인 명령을 내리십시오. 방해하는 자는 누구든지 처단하십시오. 썩은 곳은 도려내야 하며, 이 외래 사상들은 퍼지기 전에 억제되어야 합니다."
 KOR_newriceseedidea: "새로운 벼 품종"
 KOR_Poor_Harvests_idea: "흉작"
 KOR_debasecurrencyidea: "가치 절하된 화폐"
 KOR_uniteconfucianidea: "통일된 유교 정통"
 KOR_landreformidea: "제도적으로 개혁된 토지"
 KOR_sociocrisisidea: "사회경제적 침체"
 KOR_stabilizecrisisidea: "정체된 경제"
 KOR_restorecheckbalanceidea: "견제된 붕당 정치"
 KOR_illegitimate_succesion_Likely_idea: "불법적인 왕위 계승 가능성"
 KOR_Hermit_Kingdom_idea: "은둔의 왕국"
 KOR_Sadeo_Politics_idea: "사대주의 정치"
 KOR_kim_clan_influence_0011_idea: "안동 김씨의 권력: §R[?Root.andong_kim_power]§!\n§W안동 김씨 권력의 총 월간 변화§!: §R[?modifier@KOR_Angdon_Kim_Modifier]§!"
 KOR_kim_clan_influence_0011_idea_desc: "안동 김씨는 조선 왕조 동안 매우 영향력 있는 가문이었으며, 그들의 권력은 그들이 꼭두각시 왕의 배후 조종자라는 것을 의미합니다. 변화하는 시대는 이 강력한 집단의 통제를 약화시키거나 강화할 수 있는 많은 선택지를 가져옵니다.\n\n§C안동 김씨의 권력을 증가시키는 것은 이 정신의 부정적인 면을 줄여주겠지만, 공짜로 오지는 않을 것입니다. 안동 김씨의 권력을 감소시키는 것은 부정적인 면을 악화시키겠지만, 정신을 제거하는 결과를 가져올 것이며 좋고 나쁜 다른 부수적인 효과를 가질 수 있습니다.§!"
