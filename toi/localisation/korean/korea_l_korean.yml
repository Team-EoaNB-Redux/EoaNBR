 KOR_joseon_dynasty.1.t: "세도 정치"
 KOR_joseon_dynasty.1.d: "1800년 순조 임금이 즉위한 이래, 영향력 있는 안동 김씨 가문은 조선의 정치와 사회 거의 모든 영역을 장악했습니다. 왕실과 양반 관료에 대한 그들의 무력화된 권력으로 인해, 현재 통치자인 철종 임금을 포함한 조선의 왕들은 이 세도 정권에 의해 거의 모든 군주적 권위를 박탈당했습니다. 이러한 모든 부패를 척결하기 위한 광범위한 개혁이 필요하지만, 정부에 대한 안동 김씨의 통제가 강해 신속한 변화는 일어나기 어려울 것입니다."
 KOR_joseon_dynasty.1.a: "참으로 암울한 시대입니다"
 KOR_joseon_dynasty.2.t: "철종 임금의 서거"
 KOR_joseon_dynasty.2.d: "선왕인 철종이 후계자 없이 서거함에 따라, 대비 신정왕후는 1864년 1월 21일 왕위에 오른 이명복을 고종 임금이라는 칭호로 새로운 군주로 선포했습니다. 고종 임금의 나이가 12세에 불과하기 때문에 신정왕후가 고종의 공식적인 섭정으로 임명되었지만, 신정왕후는 이미 고종의 아버지인 이하응을 새로운 대원군으로 지명하여 대리청정을 맡기려 하고 있습니다."
 KOR_joseon_dynasty.2.a: "고종 임금과 섭정 신정왕후 만세"
 KOR_joseon_dynasty.3.t: "반란!"
 KOR_joseon_dynasty.3.d: "최근의 동학 학파와 더 전통적이고 한국적인 유교를 원하는 이들 사이에서, 우리의 표준 유교 사상 처리 정책에 분노한 남부의 백성들이 자신들의 사상을 지지하며 봉기했습니다. 이 문제들에 대한 정부의 정책에 대한 분노 또한 원인이 되었습니다."
 KOR_joseon_dynasty.3.a: "동학 반란"
 KOR_joseon_dynasty.3.b: "안동 반란"
 KOR_joseon_dynasty.42.t: "은둔의 왕국에서 온 소식"
 KOR_joseon_dynasty.42.d: "은둔적인 조선 왕국에서 온 보고서에 따르면, 나라의 남부 지역에서 반란이 일어난 것으로 보입니다. 누가 반란을 일으키고 왜 그랬는지는 정확히 알 수 없지만, 많은 이들이 이 사건이 조선의 폐쇄 정책에 변화를 가져올 수 있을지 어떤 소식이라도 듣기 위해 귀를 기울이고 있습니다."
 KOR_joseon_dynasty.42.a: "동양이 변하고 있습니다..."
 KOR_joseon_dynasty.4.t: "최제우의 동학 사상"
 KOR_joseon_dynasty.4.d: "최제우는 최근 3년간의 종교적 수련을 마친 매우 저명한 종교 철학자입니다. 신적인 존재를 만났다고 주장한 이후 그는 전통적인 유교 가르침에 도전하고 더 많은 사회 개혁을 추진하는 동학 사상을 형성했습니다. 이 새로운 철학은 빠르게 퍼지고 있으며, 우리는 입장을 취해야 합니다. 안동 김씨는 이 새로운 종교에 대해 조치를 취하도록 우리를 독려하고 있습니다."
 KOR_joseon_dynasty.4.a: "동학을 비난합니다"
 KOR_joseon_dynasty.4.b: "동학 실천을 허가합니다"
 KOR_joseon_dynasty.43.t: "조선의 미국 원정"
 KOR_joseon_dynasty.43.d: "다시 한번 서구는 은둔의 왕국 껍질을 뚫으려 시도하고 있습니다. 한국인들이 의심스럽게 무장하고 마을에 발포했다고 주장하는 한 미국 무역선이 파괴된 후, 미국은 공식적인 사과를 받고 조선 정부와의 대화의 문을 열기 위해 조선으로 원정을 시작하기로 결정했습니다."
 KOR_joseon_dynasty.43.a: "동방은 결코 쉬지 않는다"
 KOR_Mission_USA_Expedition_War_Decision: "미국 원정"