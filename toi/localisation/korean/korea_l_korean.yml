 KOR_joseon_dynasty.38.t: "조선 원정 시작"
 KOR_joseon_dynasty.38.d: "조선 원정이 시작되었습니다. 조선 왕조와의 일련의 갈등 끝에 조선인들의 행동에 대한 정의를 구현할 때가 왔습니다. 저항이 예상되며, 조선인들이 이전에 프랑스군을 물리쳤다는 것을 알고 있으므로 우리는 싸울 준비를 해야 합니다."
 KOR_joseon_dynasty.38.a: "전쟁 시작"
 KOR_FRA_Supply_Costs: "보급 비용"
 KOR_joseon_dynasty.39.t: "프랑스 조선 보호령의 형성"
 KOR_joseon_dynasty.39.d: "우리 주둔지를 점령하려 했던 조선군이 최근 패배하면서 우리는 조선군을 완전히 짓밟을 수 있었습니다. 이 반란의 강도를 고려할 때, 무역과 관계를 관리하고 기독교인들에게 권리와 보호를 보장하기 위해 조선에 식민 정부를 구성하는 것이 이제 필수적입니다. 세계의 다른 나라들도 우리의 새로운 식민지에 영향력을 얻으려 할 가능성이 높습니다."
 KOR_joseon_dynasty.39.a: "조선아, 우리 편에 온 것을 환영한다"
 KOR_joseon_dynasty.40.t: "프랑스 조선의 형성"
 KOR_joseon_dynasty.40.d: "조선에 대한 식민 정부로 프랑스 조선 보호령이 형성되었습니다. 반란의 강도와 조선 백성의 의지가 프랑스에게 이 길을 결정하게 했습니다. 이제 조선은 프랑스의 영향권에 놓이게 되었고, 더 이상 은둔의 왕국은 그 껍질을 가지지 않게 되었습니다."
 KOR_joseon_dynasty.40.a: "한 시대가 막을 내립니다"
 KOR_joseon_dynasty.41.t: "조선에서의 실패"
 KOR_joseon_dynasty.41.d: "우리 원정에 대한 조선의 저항은 전례가 없었으며, 우리 군대는 수치스럽게 떠나고 있습니다. 은둔의 왕국은 정말 고립된 반도이며, 그 백성은 물러서려 하지 않습니다. 조선의 국경은 무역에 대해 닫혀 있을 것입니다... 당분간은요."
 KOR_joseon_dynasty.41.a: "젠장"
