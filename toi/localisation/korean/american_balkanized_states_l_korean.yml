 NA_B_successor_of_the_usa_highest: "주들의 계승"
 NA_B_successor_of_the_usa_highest_desc: "§WLegitimacy:§! §CLeading Successor§!\n§WScore:§! §Y[?ROOT.NA_B_mantle_of_the_states_score_var@ROOT]§!\n\n연합이 붕괴되자마자, 미국의 유산은 일부 주들에게 결집의 외침이 되었습니다. 무너진 연합의 계승자라고 주장하는 이 주들은 그 칭호에 대한 정통성을 얻기 위해 싸웁니다. 오직 한 명만이 '주들의 계승'을 휘두르고 자신을 미국의 합법적인 계승자로 재확립할 수 있기 때문입니다!"
 NA_B_successor_of_the_usa_high: "계승 주"
 NA_B_successor_of_the_usa_high_desc: "§WLegitimacy:§! §GContender§!\n§WScore:§! §Y[?ROOT.NA_B_mantle_of_the_states_score_var@ROOT]§!\n\n연합이 붕괴되자마자, 미국의 유산은 일부 주들에게 결집의 외침이 되었습니다. 무너진 연합의 계승자라고 주장하는 이 주들은 그 칭호에 대한 정통성을 얻기 위해 싸웁니다. 오직 한 명만이 '주들의 계승'을 휘두르고 자신을 미국의 합법적인 계승자로 재확립할 수 있기 때문입니다!"
 NA_B_successor_of_the_usa_medium: "계승 주"
 NA_B_successor_of_the_usa_medium_desc: "§WLegitimacy:§! §OMinor§!\n§WScore:§! §Y[?ROOT.NA_B_mantle_of_the_states_score_var@ROOT]§!\n\n연합이 붕괴되자마자, 미국의 유산은 일부 주들에게 결집의 외침이 되었습니다. 무너진 연합의 계승자라고 주장하는 이 주들은 그 칭호에 대한 정통성을 얻기 위해 싸웁니다. 오직 한 명만이 '주들의 계승'을 휘두르고 자신을 미국의 합법적인 계승자로 재확립할 수 있기 때문입니다!"
 NA_B_successor_of_the_usa_low: "계승 주"
 NA_B_successor_of_the_usa_low_desc: "§WLegitimacy:§! §RInsignificant§!\n§WScore:§! §Y[?ROOT.NA_B_mantle_of_the_states_score_var@ROOT]§!\n\n연합이 붕괴되자마자, 미국의 유산은 일부 주들에게 결집의 외침이 되었습니다. 무너진 연합의 계승자라고 주장하는 이 주들은 그 칭호에 대한 정통성을 얻기 위해 싸웁니다. 오직 한 명만이 '주들의 계승'을 휘두르고 자신을 미국의 합법적인 계승자로 재확립할 수 있기 때문입니다!"

