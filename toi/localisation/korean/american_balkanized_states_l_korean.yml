 USA_successor_state_decision.1.t: "주들의 계승"
 USA_successor_state_decision.1.d: "연합이 붕괴되자마자, 미국의 유산은 일부 독립 주들에게 결집의 외침이 되었습니다. 무너진 연합의 계승자라고 주장하는 이 주들은 그 칭호에 대한 정통성을 얻기 위해 싸웁니다. 오직 한 명만이 '주들의 계승'을 휘두르고 자신을 미국의 합법적인 계승자로 재확립할 수 있기 때문입니다!\n\n우리 도시에서 [ROOT.GetName]이(가) 자신을 계승 국가로 선언하라고 응원하는 집회가 일어났습니다. 그들은 이 나라가 주들의 계승을 휘두르고 무너진 연합을 재통일하기를 원합니다. 유일하게 남은 질문은, 우리도 공식적인 계승 국가임을 선언할 것인가입니다!"
 USA_successor_state_decision.1.a: "계승 국가임을 선언합니다! 주들의 계승은 당연히 우리의 것입니다!"
 USA_successor_state_decision.1.b: "우리는 미국을 재건할 야망이 없습니다."

 USA_successor_state_decision.2.t: "주들의 계승"
 USA_successor_state_decision.2.d: "연합이 붕괴되자마자, 미국의 유산은 일부 주들에게 결집의 외침이 되었습니다. 무너진 연합의 계승자라고 주장하는 이 주들은 그 칭호에 대한 정통성을 얻기 위해 싸웁니다. 오직 한 명만이 '주들의 계승'을 휘두르고 자신을 미국의 합법적인 계승자로 재확립할 수 있기 때문입니다!\n\n한때 미국이라고 불렸던 지역은 안정성이 거의 없는 전쟁 지역으로 퇴보했습니다. 권력 공백은 정치적 환경을 반역과 배신에 취약하게 만들었습니다. 불꽃은 필연적으로 가라앉겠지만, 모두가 궁금해하는 질문이 생깁니다. 불타는 미국에서 누가 재기할 것인가?"
 USA_successor_state_decision.2.a: "주들의 계승은 당연히 우리의 것입니다!"
 USA_successor_state_decision.2.b: "그들이 칭호를 놓고 다투게 놔두십시오."
 USA_successor_state_decision.2.c: "완전한 혼돈입니다!"

 balkanized_state_border_skirmish_neighbor_on_win_attacker.1.t: "소규모 전투 공격 성공!"
 balkanized_state_border_skirmish_neighbor_on_win_attacker.1.d: "우리 병력은 여느 때처럼 자랑스러운 자부심을 가지고 돌아왔습니다! 소규모 전투에서 승리하여 '주들의 계승'을 휘두를 우리의 정당성이 더욱 높아졌습니다!"
 balkanized_state_border_skirmish_neighbor_on_win_attacker.1.a: "훌륭합니다! 비축량으로 가져오십시오!"

 balkanized_state_border_skirmish_neighbor_on_lose_attacker.1.t: "소규모 전투 공격 실패!"
 balkanized_state_border_skirmish_neighbor_on_lose_attacker.1.d: "우리 병력은 실패한 국경 소규모 전투에서 집으로 돌아왔습니다. 소규모 전투에서 패했을 뿐만 아니라, 우리의 실패로 인해 '주들의 계승'을 휘두를 우리의 정당성이 감소했습니다!"
 balkanized_state_border_skirmish_neighbor_on_lose_attacker.1.a: "끔찍합니다!"

 balkanized_state_border_skirmish_neighbor_on_cancel_attacker.1.t: "국경 교착 상태!"
 balkanized_state_border_skirmish_neighbor_on_cancel_attacker.1.d: "소규모 전투로 시작된 것이 어떤 쪽도 유지할 수 없는 전면적인 국경 전쟁으로 변했습니다. 국경 전쟁을 계속하기에는 너무 많은 비용이 들기 때문에 양측은 휴전하기로 결정했습니다. 우리의 정당성은 변함이 없습니다."
 balkanized_state_border_skirmish_neighbor_on_cancel_attacker.1.a: "일시적인 차질일 뿐..."

 balkanized_state_border_skirmish_neighbor_on_win_defender.1.t: "소규모 전투 방어 성공!"
 balkanized_state_border_skirmish_neighbor_on_win_defender.1.d: "소규모 전투의 공격자들은 우리 국경 방어의 상대가 되지 않았습니다!"
 balkanized_state_border_skirmish_neighbor_on_win_defender.1.a: "그들이 그렇게 쉽게 우리의 비축량을 약탈하지 못할 것입니다!"

 balkanized_state_border_skirmish_neighbor_on_lose_defender.1.t: "소규모 전투 방어 실패!"
 balkanized_state_border_skirmish_neighbor_on_lose_defender.1.d: "국경 방어선은 적군으로부터 마을을 보호하기에는 장비가 부족했습니다!"
 balkanized_state_border_skirmish_neighbor_on_lose_defender.1.a: "다행히 그들이 많은 것을 가지고 도주하지 않기를 바랍니다!"

 balkanized_state_border_skirmish_neighbor_on_cancel_defender.1.t: "국경 교착 상태!"
 balkanized_state_border_skirmish_neighbor_on_cancel_defender.1.d: "소규모 전투로 시작된 것이 어떤 쪽도 유지할 수 없는 전면적인 국경 전쟁으로 변했습니다. 국경 전쟁을 계속하기에는 너무 많은 비용이 들기 때문에 양측은 휴전하기로 결정했습니다."
 balkanized_state_border_skirmish_neighbor_on_cancel_defender.1.a: "당분간은 쉴 수 있을 것 같습니다..."

 balkanized_state_border_skirmish_neighbor_detect_raid.1.t: "[FROM.GetAdjective] 병력 국경에서 탐지됨!"
 balkanized_state_border_skirmish_neighbor_detect_raid.1.d: "[FROM.GetName]과(와)의 국경에서 임박한 소규모 전투에 대비해야 합니다!"
 balkanized_state_border_skirmish_neighbor_detect_raid.1.a: "그 국경 전쟁에 대비해야 합니다."
 set_border_war_data_balkanized_state_border_skirmish_neighbor_combat_width_tooltip: "정보부는 이 §YBorder War§!의 §YCombat Width§!가 §R40§!이(가) 될 것이라고 예측했습니다."

 balkanized_state_border_skirmish_category: "미국 내전"
 balkanized_state_border_skirmish_category_desc: "§YAmerican Civil Wars:§!\n미합중국(United States of America)의 붕괴는 이전 주들이 영토 주장을 확립하기 위해 전투를 벌이는 결과를 낳았습니다. 일부는 심지어 현재 붕괴된 미국의 계승 국가임을 선언하기도 했습니다.\n\n§YMantle of the States:§!\n연합이 붕괴되자마자, 미국의 유산은 일부 독립 주들에게 결집의 외침이 되었습니다. 무너진 연합의 계승자라고 주장하는 이 주들은 그 칭호에 대한 정통성을 얻기 위해 싸웁니다. 오직 한 명만이 '주들의 계승'을 휘두르고 자신을 미국의 합법적인 계승자로 재확립할 수 있기 때문입니다!"
 balkanized_state_border_skirmish_neighbor: "정통성 소규모 전투: [FROM.GetAdjective] 국경"
 balkanized_state_border_skirmish_neighbor_desc: "우리는 §YMantle of the States§!를 휘두를 우리의 정통성을 성공적으로 높이기를 바라며 [FROM.GetName] 국경에서 소규모 전투를 시작할 것입니다."
 balkanized_state_border_skirmish_neighbor_at_peace_trigger: "아무와도 §YSkirmishing§! 중이 아니거나 §YWar§! 상태가 아님"
 balkanized_state_border_skirmish_neighbor_diplomacy_trigger: "§Y[FROM.GetName]§!과(와) §YDiplomatic Treaties§!를 맺고 있지 않음!"
