 NA_B_idea_working_class_exploitation_low: "노동 계급 착취: §R[?ROOT.NA_B_idea_working_class_exploitation_score_var@ROOT]§!"
 NA_B_idea_working_class_exploitation_low_desc: "§WWorking Class Organization:§! §Y[?ROOT.NA_B_idea_working_class_organization_score_var@ROOT]%§!\n\n노동자 조직은 노동 계급 착취 수준이 낮을 때 일반적으로 정체될 것입니다. [ROOT.GetNameDef]의 노동 계급은 최저 생계비를 받으며 열악한 환경에서 일하는 등 심하게 착취당하고 있습니다. 추가적인 착취는 노동자들이 착취에 맞서 스스로를 조직하게 만들 것입니다.\n\n[ROOT.GetName]의 노동자 착취 수준은 [?ROOT.NA_B_idea_working_class_exploitation_score_var@ROOT]입니다. 이 값은 열악한 근무 환경과 낮은 대표성으로 인해 증가하며, 좋은 근무 환경과 긍정적인 대표성으로 인해 감소합니다."
 NA_B_idea_working_class_exploitation_medium: "노동 계급 착취: §R[?ROOT.NA_B_idea_working_class_exploitation_score_var@ROOT]§!"
 NA_B_idea_working_class_exploitation_medium_desc: "§WWorking Class Organization:§! §Y[?ROOT.NA_B_idea_working_class_organization_score_var@ROOT]%§!\n\n노동자 조직은 노동자 착취 수준이 낮음 이상으로 유지될 때 계속 증가할 것입니다. [ROOT.GetNameDef]의 노동 계급은 최저 생계비를 받으며 열악한 환경에서 일하는 등 심하게 착취당하고 있습니다. 이러한 착취에 맞서 노동 조직들은 노동자들과 협력하여 더 나은 환경과 낮은 착취를 위해 노동 파업을 시작하고 있습니다.\n\n[ROOT.GetName]의 노동자 착취 수준은 [?ROOT.NA_B_idea_working_class_exploitation_score_var@ROOT]입니다. 이 값은 열악한 근무 환경과 낮은 대표성으로 인해 증가하며, 좋은 근무 환경과 긍정적인 대표성으로 인해 감소합니다."
 NA_B_idea_working_class_exploitation_high: "노동 계급 착취: §R[?ROOT.NA_B_idea_working_class_exploitation_score_var@ROOT]§!"
 NA_B_idea_working_class_exploitation_high_desc: "§WWorking Class Organization:§! §Y[?ROOT.NA_B_idea_working_class_organization_score_var@ROOT]%§!\n\n노동자 조직은 노동자 착취 수준이 낮음 이상으로 유지될 때 계속 증가할 것입니다. [ROOT.GetNameDef]의 노동 계급은 최저 생계비를 받으며 열악한 환경에서 일하는 등 심하게 착취당하고 있습니다. 이러한 착취로 인해 급진적인 공화주의자와 무정부주의자 파벌이 더욱 인기를 얻게 되었습니다. 지속적인 착취는 노동 조직을 급진화시켰고, 이제 그들은 즉각적인 착취 종식을 요구하기 위해 전체 기관을 마비시키는 총파업을 조직하고 있습니다.\n\n[ROOT.GetName]의 노동자 착취 수준은 [?ROOT.NA_B_idea_working_class_exploitation_score_var@ROOT]입니다. 이 값은 열악한 근무 환경과 낮은 대표성으로 인해 증가하며, 좋은 근무 환경과 긍정적인 대표성으로 인해 감소합니다."
 NA_B_reliance_on_water_transportation: "내륙 수송에 대한 의존도"
 NA_B_reliance_on_water_transportation_desc: "[ROOT.GetNameDef]은(는) 경제 무역, 운송 및 번영을 촉진하기 위해 내륙 수로에 의존합니다."
 # Congress Mechanic
 NA_B_set_up_senate.1.t: "의회 선거"
 NA_B_set_up_senate.1.desc: "오늘 [ROOT.GetName] 전역의 시민들은 상원 의원과 대표를 뽑기 위해 투표하여 국익을 대표하기 위해 국회에 파견되었습니다. 우리는 결과적으로 당 다수 의석을 확보하기를 바라지만, 우리가 통과시키려는 거의 모든 법안을 막을 의회에 직면할 수도 있습니다."
 NA_B_set_up_senate.1.a: "우리가 승리하기를 바랍니다"

