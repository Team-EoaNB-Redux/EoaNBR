l_english:
 BWR_the_revolution_begins:0 "혁명의 시작"
 BWR_the_revolution_begins_desc:0 "수년간 상류층의 불공정한 대우를 받은 노동자 계급은 이제 더 이상 참지 못합니다!"
 BWR_garther_support:0 "지원 규합"
 BWR_garther_support_desc:0 "전국의 노동자들로부터 지지를 모아야 합니다. 우리에게는 수적으로 우세하다는 이점이 있습니다. 이를 활용해야 합니다!"
 BWR_raid_police_stations:0 "경찰서 습격"
 BWR_raid_police_stations_desc:0 "많은 병력으로 지역 경찰서를 쉽게 장악할 수 있습니다. 안에서 그들이 소지한 소형 무기를 빼앗을 수 있을 것입니다."
 BWR_suade_hard_pressed_regiments:0 "궁지에 몰린 연대 설득"
 BWR_suade_hard_pressed_regiments_desc:0 "많은 육군 연대가 상류층 장교들에게 가혹한 대우를 받았습니다. 이를 이용해 그들을 설득하여 반란을 일으키고 우리 편에 합류하도록 해야 합니다!"
 BWR_begin_training_the_rabble:0 "오합지졸 훈련 시작"
 BWR_begin_training_the_rabble_desc:0 "우리 병력의 대다수는 노동자로 구성되어 있으며, 그들 중 많은 이들이 평생 무기를 잡아본 적이 없습니다. 육군에 맞서려면 이들을 훈련시켜야 합니다."
 BWR_raid_army_barracks:0 "육군 막사 습격"
 BWR_raid_army_barracks_desc:0 "이제 우리는 육군 막사를 습격하고 대량의 군사 장비를 빼앗을 수 있는 인력과 추진력을 갖추었습니다."
 BWR_rally_overseas_support:0 "해외 지원 결집"
 BWR_rally_overseas_support_desc:0 "생존하려면 해외 국가들의 지원을 얻어야 합니다. 영국의 경쟁국들은 영국이 약해진다면 분명 우리를 도울 것입니다. 일단 도움이 필요하니, 이 문제는 나중에 걱정해도 됩니다."
 BWR_mutnies_navy:0 "해군 내 반란"
 BWR_mutnies_navy_desc:0 "육군과 마찬가지로, 많은 왕립 해군 승무원들이 상류층 장교들에게 가혹한 대우를 받았습니다. 이를 이용해 그들을 설득하여 반란을 일으키고 우리 편에 합류하도록 해야 합니다!"
 BWR_offensive:0 "공격 개시"
 BWR_offensive_desc:0 "더 이상 방어만 하지 않습니다! 이제 반격을 개시할 힘이 생겼습니다."
 BWR_fighter_factories:0 "전투원을 공장으로 보내라"
 BWR_fighter_factories_desc:0 "일부 지역에서는 싸우려는 사람은 너무 많지만, 그들을 무장시킬 무기가 충분하지 않습니다. 이들을 다시 일터로 보내어 중요한 것... 우리의 자유를 위해 일하게 함으로써 이 문제를 해결할 수 있습니다!"
 BWR_promise_free_fair_britain:0 "자유롭고 공정한 영국을 약속"
 BWR_promise_free_fair_britain_desc:0 "많은 이들이 우리가 무엇을 위해 싸우는지 잊어가고 있습니다. 과거의 삶이 어땠는지, 그리고 지금 우리가 무엇을 위해 싸우고 있는지, 즉 자유롭고 공정한 영국을 위해 싸운다는 것을 그들에게 상기시켜야 합니다!"
 BWR_last_push:0 "마지막 총공세"
 BWR_last_push_desc:0 "우리는 승리에 매우 가까이 다가섰습니다. 지금 멈춰서는 안 됩니다. 마지막 총공세로 우리가 정상에 오를 것입니다."
 BWR_victory_workers:0 "노동자들에게 승리를!"
 BWR_victory_workers_desc:0 "해냈습니다! 우리는 억압적인 계층 구조를 무너뜨렸습니다. 이제 우리가 결정을 내리는 주체가 되었습니다."
 BWR_reubuilding_britain:0 "영국 재건"
 BWR_reubuilding_britain_desc:0 "우리는 전쟁에서 승리했습니다. 이제 우리 국가를 재건해야 합니다... 이전보다 더 나은 모습으로!"
 BWR_reubuilding_industry:0 "산업 재건"
 BWR_reubuilding_industry_desc:0 "혁명으로 인해 우리 산업은 큰 타격을 입었습니다. 잃어버린 것을 복구하기 위해 최선을 다해야 합니다."
 BWR_improving_infrastructure:0 "인프라 개선"
 BWR_improving_infrastructure_desc:0 "잉글랜드 북부 대부분은 여전히 매우 저개발 상태입니다. 재건에 도움이 되기를 바라며 이 문제를 해결하기 위해 이 기회를 잡아야 합니다."
 BWR_replacing_factories:0 "낡은 공장 교체"
 BWR_replacing_factories_desc:0 "국내의 많은 공장들은 여전히 작업하기에 위험하고 비효율적입니다. 안전하게 작업할 수 있도록 이 공장들을 교체해야 합니다."
 BWR_fix_docks:0 "부두 수리"
 BWR_fix_docks_desc:0 "리버풀은 혁명 기간 동안 주요 전장이었습니다. 그 중요성 때문에, 그곳의 부두를 수리하는 것이 매우 중요합니다."
 BWR_safe_fair_industry:0 "안전하고 공정한 산업"
 BWR_safe_fair_industry_desc:0 "모든 공장이 안전하고 공정하게 일할 수 있는 곳인지 확인해야 합니다."
 BWR_reubuilding_af:0 "군대 재건"
 BWR_reubuilding_af_desc:0 "영국군은 우리의 용감한 노동자들에게 패배했습니다. 그러나 이제 전쟁에서 승리했으므로, 우리의 승리에 대한 보복 가능성에 대비하기 위해 상비군을 두는 것이 중요합니다."
 BWR_reubuilding_army:0 "육군 재건"
 BWR_reubuilding_army_desc:0 "우리의 새로운 국가에 대한 잠재적인 위협에 대비하기 위해 새로운 상비군을 훈련시켜야 합니다."
 BWR_reubuilding_navy:0 "해군 재건"
 BWR_reubuilding_navy_desc:0 "왕립 해군은 바다를 지배했습니다. 하지만, 그들 대부분이 식민지로 도망쳤기 때문에 우리는 왕립 해군을 소유하고 있지 않습니다. 따라서 우리는 해군을 옛 영광으로 되돌려야 합니다."
 BWR_defensive_mil:0 "방어적 군대"
 BWR_defensive_mil_desc:0 "새롭게 개선된 우리 군대는 오직 우리 섬을 방어하는 데만 사용될 것입니다!"
 BWR_off_mil:0 "공세적 군대"
 BWR_off_mil_desc:0 "새롭게 개선된 우리 군대는 전 세계의 다른 제국주의 국가 노동자들을 해방시키는 데 사용될 것입니다!"
 BWR_new_model_army:0 "신형 군대"
 BWR_new_model_army_desc:0 "신형 군대는 제1차 영국 내전 중인 1645년에 의회파가 창설한 상비군입니다."
 BWR_legit_gov:0 "합법 정부"
 BWR_legit_gov_desc:0 "혁명 중 여왕과 그녀의 가족을 생포함으로써, 그녀의 '이름으로' 새로운 정부를 구성할 수 있게 되었습니다. 이는 우리의 새로운 정권이 세계로부터 합법적으로 인정받도록 해줍니다."
 BWR_loss_empire:0 "제국의 상실"
 BWR_loss_empire_desc:0 "왕실 가족이 캐나다로 도피하면서, 식민지와 세계는 우리의 새로운 정부를 불법적인 것으로 간주합니다."
 BWR_take_london: "런던 전투"
 BWR_take_london_desc:0 "런던은 영국의 수도입니다. 런던을 점령하는 것은 이 전쟁에서 승리하는 데 큰 도움이 될 것입니다."
 BWR_worker_revolution_not_controlled_trigger:0 "이 주(State)는 혁명군이 통제하고 있습니다."
 BWR_win_mission_london:0 "런던을 점령하면 전쟁에 필요한 추가 보급품을 얻을 수 있습니다."
 BWR_lost_mission_london:0 "런던을 점령할 기회를 잃었고, 이는 우리에게 막대한 불이익을 가져옵니다."
 eoanb_category_revolution: "노동자 혁명"
 eoanb_category_revolution_desc:0 "우리는 대영제국의 미래를 위한 혁명을 벌이고 있습니다. 우리가 승리할 수 있도록 최선을 다해야 합니다! 평화적인 해결책을 논할 시기는 지났습니다..."
 BWR_raise_welsh_workers:0 "웨일스 노동자 규합"
 BWR_draft_highlander_regiments:0 "고지대인 연대 징집"
 BWR_hire_proffesional_officers:0 "전문 장교 설득"
 BWR_fighters_to_factories:0 "전투원을 공장으로 보내라"
 BWR_workers_to_front:0 "노동자를 전선으로 보내라"
 BWR_fight_for_workers:0 "노동자들의 승리"
 BWR_disorganised_militas:0 "비조직적 민병대"
 BWR_no_more_work:0 "더 이상의 노동은 없다"
 BWR_victory:0 "노동자들의 승리"
 BWR_capture_monarch:0 "여왕 생포"
 BWR_offensive2:0 "공세적 군대"
 BWR_defensive:0 "방어적 군대"
 BWR_shattared_economy_1:0 "산산조각난 경제"
 BWR_shattared_economy_2:0 "산산조각난 경제"
 BWR_shattared_economy_3:0 "산산조각난 경제"
 BWR_shattared_economy_4:0 "산산조각난 경제"
 BWR_shattared_military_1:0 "존재하지 않는 군대"
 BWR_shattared_military_2:0 "존재하지 않는 군대"
 BWR_shattared_military_3:0 "존재하지 않는 군대"
 BWR_shattared_military_4:0 "존재하지 않는 군대"
 BWR_rebuild_army:0 "육군 재건"
 BWR_rebuild_navy:0 "해군 재건"
 idea_BWR_queen_vic:0 "빅토리아 여왕"
 bwr.1.t: "군대 문제"
 bwr.1.d:0 "군대는 우리의 혁명에 맞서 오랫동안 격렬히 싸웠습니다. 신생 영국 국가의 안보를 확보하기 위한 첫 번째 단계는 군대 문제를 다루는 것입니다. 강경파는 미래에 발생할 수 있는 쿠데타의 위험을 없애기 위해 군대를 완전히 숙청해야 한다고 믿습니다. 하지만 이렇게 하면 우리의 새로운 군대가 매우 허약하고 경험이 부족해질 것입니다. 온건파는 모든 왕당파 세력을 사면하여 우리 군대가 계속해서 강력한 힘을 유지하도록 해야 한다고 믿지만, 이는 쿠데타를 더 쉽게 만들 수 있습니다. 우리의 새로운 국가에 반대하는 영향력 있는 인물들을 체포해야 한다고 믿는 중도파도 있습니다. 이것은 타협안이 될 수 있겠지만, 과연 충분할까요?"
 bwr.1.a:0 "군대 숙청"
 bwr.1.b:0 "영향력 있는 반대파 체포"
 bwr.1.c:0 "모든 왕당파 사면"
 bwr.2.t:0 "지주 문제"
 bwr.2.d:0 "영국의 지주들은 노동자 계급을 불공정하게 대우했고, 그 결과 우리는 위대한 혁명을 시작했습니다! 우리는 성공했고 이제 지주들을 어떻게 할지 결정해야 합니다. 강경파는 국가가 모든 토지를 소유하고 영국 국민이 자유롭게 경작하도록 해야 한다고 믿습니다. 중도파는 토지를 균등하게 재분배해야 한다고 제안합니다. 마지막으로, 온건파는 현재의 지주들이 경험이 있으므로 그들이 일부 토지를 유지하게 하고 나머지는 재분배해야 한다고 믿습니다."
 bwr.2.a:0 "국가가 모든 토지를 소유해야 한다"
 bwr.2.b:0 "토지를 균등하게 재분배"
 bwr.2.c:0 "일부 토지를 유지하도록 허용"
 bwr.3.t:0 "경제 문제"
 bwr.3.d:0 "혁명 이후 영국 경제는 개혁되어야 합니다. 강경파는 모든 국민이 국가에 고용되어야 한다고 믿습니다. 한편, 농민이나 산업 노동자만 국가에 고용되어야 한다고 믿는 이들도 있습니다. 이들 모두 장단점이 있지만, 우리는 장기적으로 가장 이득이 되고 국가에 부담이 적은 방법을 고려해야 합니다."
 bwr.3.a:0 "모두 국가에 고용될 것이다"
 bwr.3.b:0 "농업만 국가가 운영할 것이다"
 bwr.3.c:0 "산업만 국가가 운영할 것이다"
 bwr.4.t:0 "무역 문제"
 bwr.4.d:0 "영국 제도는 다른 국가들이 필요로 하는 풍부한 자원을 가지고 있습니다. 우리는 이 자원들을 우리 스스로에게만 남겨둘지, 아니면 좀 더 자유주의적인 사고로 바다를 건너 무역할지 결정해야 합니다. 두 가지 모두 장단점이 있으며, 우리 재건에 다른 방식으로 이득이 될 것입니다."
 bwr.4.a:0 "자원을 우리 스스로에게 남겨둔다"
 bwr.4.b:0 "잉여 자원 수출"
 bwr.4.c:0 "자유 무역"
 bwr.5.t:0 "종교 문제"
 bwr.5.d:0 "우리 국가 내의 많은 사람들은 종교를 문제로 보고 상류층이 우리를 상대로 이용하는 도구로 간주합니다. 강경파는 종교를 금지하고 국민을 무신론자로 만들어야 한다고 믿습니다. 하지만 이는 대다수 국민들을 불행하게 만들 것입니다. 중도파는 종교를 단지 억제하기만 하자고 제안하는데, 이것이 종교를 서서히 사라지게 할 수 있지만 보장된 것은 아닙니다. 온건파는 더 자유주의적인 사고를 갖고 종교의 자유를 허용해야 하며, 이것이 영국의 이미지를 더 좋게 바꾸는 데 도움이 될 것이라고 제안합니다. 우리는 어떻게 진행해야 할까요?"
 bwr.5.a:0 "무신론"
 bwr.5.b:0 "종교 억제"
 bwr.5.c:0 "종교의 자유 허용"
 bwr.6.t:0 "군주제 문제"
 bwr.6.d:0 "혁명 중에 우리는 왕실 가족이 도망치려 할 때 그들을 생포했습니다. 이는 우리에게 몇 가지 기회를 제공합니다. 대다수가 군주제를 폐지해야 한다고 믿는 반면, 군주제를 유지해야 한다고 생각하는 이들도 있습니다. 이는 우리 정부에 합법성을 부여하고 영국의 식민지 소유를 유지하게 해줄 것입니다. 하지만 쿠데타를 막을 수 있다는 보장은 없습니다."
 bwr.6.a:0 "군주제 폐지"
 bwr.6.b:0 "군주제 유지"
 bwr.7.t:0 "군주제 폐지!"
 bwr.7.d:0 "이제 우리는 옛 왕실 가족을 어떻게 할지 결정해야 합니다. 강경파는 그들을 처형하고 국민을 위해 아무것도 하지 않는 자들에게 본보기를 보여야 한다고 믿습니다. 하지만 이는 특히 왕실과 가족 관계가 있는 국제 사회를 분명히 불쾌하게 만들 것입니다. 왕실 가족을 일반 시민으로 풀어주자는 제안도 있는데, 이는 그들을 감시할 수 있게 해주겠지만 나중에 문제를 일으킬 수 있습니다. 마지막으로, 왕실 가족을 캐나다로 망명시키자는 의견이 있습니다. 하지만 그들이 더 큰 군대를 이끌고 돌아오는 것을 막을 방법이 없으며, 우리는 전적으로 여왕의 선의에 의존하게 될 것입니다."
 bwr.7.a:0 "왕실 처형"
 bwr.7.b:0 "영국에 머물도록 강제"
 bwr.7.c:0 "캐나다로 가도록 허용"
 bwr.8.t:0 "군주제 유지!"
 bwr.8.d:0 "우리는 왕실 가족을 유지하기로 결정했습니다. 그 결과, 나머지 영국 제국은 우리의 새로운 정부를 합법적인 것으로 간주하기로 했습니다. 하지만 그렇다고 해서 모두가 이 상황에 만족하는 것은 아닙니다..."
 bwr.8.a:0 "자유롭고 공정한 영국을 보장"
 bwr.9.t:0 "영국의 미래?"
 bwr.9.d:0 "제국이 떠난 후, 영국은 미래를 바라봐야 합니다! 어떤 이들은 올리버 크롬웰이 영국 내전 후에 했던 것처럼 옛 연방을 되살려야 한다고 믿습니다. 하지만 어떤 이들은 이것이 현상 유지만 초래하고 진정한 변화는 없을까 걱정합니다. 또 다른 이들은 미국처럼 영국을 공화국으로 개혁해야 한다고 믿습니다. 우리는 어떻게 나아가야 할까요?"
 bwr.9.a:0 "영국 연방 선포"
 bwr.9.b:0 "영국 공화국"
 bwr.11.t:0 "아일랜드 문제"
 bwr.11.d:0 "혁명에서의 신속한 승리로 우리는 아일랜드에 빠르게 질서를 가져올 수 있었습니다. 하지만 아일랜드의 대다수 인구는 우리를 합법적인 정부로 보지 않습니다. 우리는 이 민감한 상황을 어떻게 처리할지 결정해야 합니다. 강경파는 혁명을 아일랜드로 확산시켜 그들이 이해하도록 만들어야 한다고 믿습니다. 중도파는 자치를 허용하자고 제안합니다. 한편, 우리가 아일랜드를 계속 붙잡으려는 것은 위선적이며, 그들이 스스로의 미래를 결정하도록 해방시켜야 한다고 말하는 이들도 있습니다."
 bwr.11.a:0 "아일랜드에 혁명 확산"
 bwr.11.b:0 "아일랜드에 우호적인 정부 수립"
 bwr.11.c:0 "아일랜드의 자치 허용"
 bwr.12.t:0 "지원 규합"
 bwr.12.d:0 "혁명이 본격적으로 진행됨에 따라, 우리는 상류층에 맞서 우리 편에 설 수 있는 최대한 많은 사람을 필요로 합니다. 전국의 모든 지역에서 지원을 모아야 합니다. 많은 노동자들이 아직 우리의 대의에 동참할지 망설이고 있습니다. 많은 이들이 우리의 대의가 시작되기도 전에 끝날 것을 두려워하는데, 우리는 그들이 틀렸다는 것을 증명해야 합니다! 우리가 더 오래 살아남을수록, 더 많은 노동자들이 우리의 대의에 동참할 것입니다."
 bwr.12.a:0 "전진!"
 bwr.13.t:0 "경찰서 습격"
 bwr.13.d:0 "이른 아침, 많은 혁명가들이 계획을 실행하여 여러 경찰서를 습격했습니다. 그곳에 배치된 몇 안 되는 순경들을 제압하고, 노동자들은 그들의 대의를 위해 많은 소형 무기를 확보할 수 있었습니다. 이 무기들은 영국군에 맞서 싸울 기회를 줄 수 있기를 바라며 혁명가들에게 분배될 것입니다."
 bwr.13.a:0 "전진!"
 bwr.14.t:0 "육군 부대가 우리에게 합류"
 bwr.14.d:0 "많은 연대, 특히 북부에서 소집된 연대들은 장교들에게 가혹한 대우를 받았습니다. 경미한 위반에도 가혹한 처벌을 받고, 가장 힘든 훈련을 통해 끊임없는 육체적 고문을 당했습니다. 인간 이하의 취급을 받았습니다. 이 부대들 중 많은 수가 더 이상 참지 못했고, 우리의 격려로 그들은 속물적인 장교들에 맞서 봉기하여 우리의 대의에 합류했습니다. 이 병사들은 그들의 장비와 전문성을 바탕으로 우리가 승리할 좋은 기회를 줄 것입니다."
 bwr.14.a:0 "전진!"
 bwr.15.t:0 "해외 지원 결집"
 bwr.15.d:0 "생존하려면 해외 국가들의 지원을 얻어야 합니다. 영국의 경쟁국들은 영국이 약해진다면 분명 우리를 도울 것입니다. 일단 도움이 필요하니, 이 문제는 나중에 걱정해도 됩니다. 그들의 도움이 그만한 가치가 있기를 바랍니다."
 bwr.15.a:0 "전진!"
 bwr.16.t:0 "해군 내 반란"
 bwr.16.d:0 "해군의 많은 함선들이 장교들에게 가혹한 대우를 받았습니다. 경미한 위반에도 가혹한 처벌을 받고, 가장 힘든 훈련을 통해 끊임없는 육체적 고문을 당했습니다. 인간 이하의 취급을 받았습니다. 이 선원들 중 많은 수가 더 이상 참지 못했고, 우리의 격려로 그들은 속물적인 장교들에 맞서 봉기하여 우리의 대의에 합류했습니다. 이제 이 함선들이 우리 지휘 아래에 있으므로, 더 이상 해변에서 오는 위협에 대해 걱정할 필요가 없습니다."
 bwr.16.a:0 "오크의 심장!"
 bwr.17.t:0 "여왕 런던을 탈출"
 bwr.17.d:0 "런던 지역의 우리 혁명가들은 여왕을 생포할 수 없었습니다. 우리가 버킹엄 궁전을 점령했을 때, 군주와 그녀의 가족은 이미 캐나다로 향하는 배에 타고 있었습니다. 당장은 문제가 되지 않을 수 있지만, 우리가 혁명에서 승리했을 때 합법성을 가질 수 없게 될 것입니다. 왕실 가족은 복수를 꾀할 가능성이 높습니다..."
 bwr.17.a:0 "너무 늦었어..."
 bwr.18.t:0 "여왕 생포"
 bwr.18.d:0 "우리 혁명가들이 버킹엄 궁전을 습격했을 때, 그들은 여왕과 대부분의 가족이 도망치려던 중인 것을 발견했습니다. 하지만 그들은 너무 늦었고 우리 혁명가들이 군주를 체포했습니다. 이는 우리 전사들의 사기를 크게 높이고 정부에게는 큰 타격이 될 것입니다. 우리는 '여왕 폐하'를 어떻게 할지 나중에 결정할 것입니다..."
 bwr.18.a:0 "전진!"