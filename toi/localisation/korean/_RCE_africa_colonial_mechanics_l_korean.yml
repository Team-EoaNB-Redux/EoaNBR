 #Colonial Stuff
 AF_T_idea_trading_nation_3: "식민지 회사 협력"
 AF_T_idea_trading_nation_3_desc: "이 나라는 산업화를 위한 지원을 대가로 외국과 식민지 회사 협력을 맺었습니다. 이 협력 관계의 배후에 있는 식민지 강국은 해당 아프리카 국가가 식민지가 아닐지라도 지역에 큰 영향력을 행사합니다."
 AF_T_idea_trading_nation_4: "식민지 회사"
 AF_T_idea_trading_nation_4_desc: "이 식민지 배후에 있는 식민지 강국은 이 나라에 대한 높은 기대를 가지고 있으며, 확장된 위임통치령을 대가로 할당량을 반드시 지키도록 하고 싶어 합니다."
 afr_rrp_colonial_project_active: "식민지 프로젝트 건설 중\n"
 AFR_history_of_colonial_resistance: "식민지 저항의 역사"
 AFR_history_of_colonial_resistance_desc: "이 나라는 유럽 또는 비유럽 세력의 식민지 점령에 저항한 오랜 역사를 가지고 있습니다."
 AFR_history_of_colonial_resistance_1: "식민지 저항의 역사"
 AFR_history_of_colonial_resistance_1_desc: "이 나라는 식민지 점령에 저항한 오랜 역사를 가지고 있습니다."

 AFR_french_protectorate: "[FRA.GetAdjective] 보호국"
 AFR_french_protectorate_desc: "이 나라는 [FRA.GetAdjective]의 식민 통치에 큰 영향을 받고 있으며, 그에 따른 특정 혜택을 받습니다. 단점은 보호국이 그들의 위임통치령을 유지하기 위해 특정 규칙을 준수해야 한다는 것입니다."
