#Colonial Mechanics
 afr_total_detrimental_colonial_impact_idea: "유해한 영향: [?total_detrimental_colonial_impact_value]"
 afr_total_detrimental_colonial_impact_idea_desc: "힘과 권력으로 정의되는 세상에서, 전체 인구가 소외, 차별, 또는 노골적인 박해의 대상이 되는 경우가 종종 있습니다. '인종 우월주의', '민족의 문명화', 그리고 소외된 집단에 대한 배척은 종종 단기적인 이득을 가져와 지배자들에게 지역의 안정과 번영을 보장할 수 있습니다. 그러나 행동은 잠시지만 기억은 여러 세대에 걸쳐 이어집니다. 그리고 §YDetrimental Impact§!은 앞으로 몇 년 동안 미래의 불안정과 의도하지 않은 결과를 초래할 수 있습니다."