 afr_colonial_malaria_scourge: "말라리아의 재앙"
 afr_colonial_malaria_scourge_desc: "말라리아는 식민지 내 사망의 가장 높은 원인 중 하나입니다. 말라리아가 어떻게 퍼지는지는 수십 년간 미스터리였지만, 과학은 그것이 모기에 의해 퍼진다는 것을 밝혀낼 것입니다. 말라리아의 재앙을 제거하기 위한 조치가 취해져야 합니다!"
