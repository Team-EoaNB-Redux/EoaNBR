 afr_tribal_raid_colonial_neighbor: "[afr_tribal_raid_colonial_neighbor_scripted]"
 afr_tribal_raid_colonial_neighbor_sanctioned: "식민 침략자 약탈: [FROM.GetAdjective] 국경"
 afr_tribal_raid_colonial_neighbor_unsanctioned: "승인되지 않은 약탈: [FROM.GetAdjective] 국경"
 afr_tribal_raid_colonial_neighbor_desc: "[afr_tribal_raid_colonial_neighbor_desc_scripted]"
 afr_tribal_raid_colonial_neighbor_desc_sanctioned: "§RUnsanctioned Raid§!이 없습니다.\n\n우리는 [FROM.GetName]의 국경에 약탈대를 보내어 그들의 비축물을 성공적으로 약탈하고 확장 노력을 방해하기를 바랍니다."
 afr_tribal_raid_colonial_neighbor_desc_unsanctioned: "§RUnsanctioned Raid§!이 없습니다.\n\n우리 국경 내의 한 부족이 [FROM.GetName]에 대한 승인되지 않은 약탈을 시도할 수 있습니다. 이는 우리 국경 내의 부족이 해당 지역 토지에 대한 자치권을 가지고 있기 때문에 반체제 인사가 우리의 외교 관계를 위반하지 않도록 보장하기 어렵기 때문입니다."
 afr_tribal_raid_colonial_neighbor_command_power_more_than_99: "£command_power §H100§!"
 afr_tribal_raid_colonial_neighbor_command_power_more_than_99_blocked: "£command_power §R100§!"
 afr_tribal_raid_colonial_neighbor_command_power_more_than_99_tooltip: "§Y[FROM.GetName]§!의 국경에 §YRaiding Party§!를 보내려면 100£command_power가 필요합니다."

 MOR_tribal_raid_colonial_neighbor_random_intertribe_raid_tooltip: "우리는 지역 부족이 §Y[FROM.GetName]§!에 대해 §RUnsanctioned Raid§!을 수행하는 것을 막았습니다!"
 afr_has_unsanctioned_raid_against_colonial_neighbor_effect_tooltip: "우리 국경 내의 한 부족이 §Y[THIS.GetName]§!에 대해 §OUnsanctioned Raid§!을 계획하고 수행할 것입니다.\n"
 afr_has_unsanctioned_raid_against_colonial_neighbor_timeout_tooltip: "§RIf unprevented, a diplomatic incident may occur.§!\n"

 afr_tribal_raid_colonial_neighbor_detect_raid.1.t: "[FROM.GetAdjective] 약탈대가 감지되었습니다!"
 afr_tribal_raid_colonial_neighbor_detect_raid.1.d: "우리는 그들과의 국경에서 임박한 약탈에 대비해야 합니다!"
 afr_tribal_raid_colonial_neighbor_detect_raid.1.a: "우리는 국경 전쟁에 대비해야 합니다."
 set_border_war_data_afr_tribal_raid_colonial_neighbor_combat_width_tooltip: "정보에 따르면 이번 §YBorder War§!의 §YCombat Width§!은 §R20§!이 될 것입니다!"

 afr_tribal_raid_colonial_neighbor_on_win_attacker.1.t: "국경 약탈 성공!"
 afr_tribal_raid_colonial_neighbor_on_win_attacker.1.d: "우리 전사들이 상대방의 비축물에서 약탈한 신선한 전리품을 가지고 돌아왔습니다!"
 afr_tribal_raid_colonial_neighbor_on_win_attacker.1.a: "훌륭합니다! 비축물로 가져오세요!"

 afr_tribal_raid_colonial_neighbor_on_lose_attacker.1.t: "국경 약탈 실패!"
 afr_tribal_raid_colonial_neighbor_on_lose_attacker.1.d: "우리 전사들은 성공하지 못한 약탈 후 빈손으로 집으로 돌아갑니다. 국경 전쟁은 패배했을 뿐만 아니라 사상자도 많았습니다."
 afr_tribal_raid_colonial_neighbor_on_lose_attacker.1.a: "끔찍하군요!"

 afr_tribal_raid_colonial_neighbor_on_cancel_attacker.1.t: "국경 교착 상태!"
 afr_tribal_raid_colonial_neighbor_on_cancel_attacker.1.d: "약탈대로 시작된 것이 어느 쪽도 감당할 수 없는 본격적인 국경 전쟁으로 바뀌었습니다. 분쟁의 공격자들은 국경 전쟁이 계속하기에는 너무 비용이 많이 들자 후퇴하기로 결정했습니다."
 afr_tribal_raid_colonial_neighbor_on_cancel_attacker.1.a: "일시적인 차질일 뿐..."

 afr_tribal_raid_colonial_neighbor_on_win_defender.1.t: "국경 방어 성공!"
 afr_tribal_raid_colonial_neighbor_on_win_defender.1.d: "약탈대가 성공적으로 격퇴되었습니다! 국경의 비축물은 당분간 안전합니다."
 afr_tribal_raid_colonial_neighbor_on_win_defender.1.a: "그들은 그렇게 쉽게 우리 비축물을 약탈하지 못할 것입니다!"

 afr_tribal_raid_colonial_neighbor_on_lose_defender.1.t: "국경에서 비축물 약탈!"
 afr_tribal_raid_colonial_neighbor_on_lose_defender.1.d: "국경 수비대가 습격으로부터 마을을 제대로 지켜내지 못했습니다! 그 결과, 마을의 비축 물자가 약탈당했고 침략자들은 우리 보급품을 가지고 달아났습니다."
 afr_tribal_raid_colonial_neighbor_on_lose_defender.1.a: "별로 많이 챙겨가지 않았기를 바라야겠군요!"

 afr_tribal_raid_colonial_neighbor_on_cancel_defender.1.t: "국경에서의 교착상태!"
 afr_tribal_raid_colonial_neighbor_on_cancel_defender.1.d: "약탈 부대로 시작된 것이 전면적인 국경 전쟁으로 변했지만, 어느 쪽도 감당할 수 없었습니다. 분쟁의 침략자들은 국경 전쟁이 계속하기에는 너무 많은 비용이 들어 후퇴하기로 결정했습니다."
 afr_tribal_raid_colonial_neighbor_on_cancel_defender.1.a: "당분간은 좀 쉴 수 있겠군요..."


