 AFR_transatlantic_consumer_desc: "[ENG.GetAdjective]의 대륙 간 노예 무역 봉쇄로 인해, 노예 노동으로부터의 우리의 생산이 감소했습니다."
 AFR_illegal_transatlantic: "불법 대륙 간 노예 밀수"
 AFR_illegal_transatlantic_desc: "[ENG.GetAdjective]의 대륙 간 노예 무역 봉쇄가 시행 중임에도 불구하고, 부패는 민간 단체가 소규모로 노예 무역을 계속하도록 허용했습니다."
