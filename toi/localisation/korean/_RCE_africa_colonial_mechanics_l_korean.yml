 afr_transatlantic_slave_ban_decisions: "대륙 간 노예 무역"
 afr_transatlantic_slave_ban_decisions_desc: "§YAddressing Slave Trade:§!\n§W노예 제도로부터의 우리의 수입이 끊겼습니다. 우리는 노예 제도에 대한 경제적 과도한 의존에서 회복할 새로운 방법을 모색하거나, 이 금지령을 우회할 방법을 찾아야 합니다.§!\n\n§YAct Against Slavery:§!\n§gIn 1793 the [ENG.GetName] the Act Against Slavery passed, which made slavery illegal. The Royal Navy now blockades of all slave trade with it's West Africa Squadron§!\n\n§YAct Prohibiting Importation of Slaves:§!\n§gIn 1807 the [USA.GetName] the Act Prohibiting Importation of Slaves passed, which abolished slave trade, but interstate trade was still legal.§!"
 AFR_accept_bribes_for_slave_smuggling: "노예 밀수를 위한 부패 허용"
 AFR_modernize_slavery: "우리의 노예 제도 현대화"
 AFR_interstate_slave_trade_consumer: "부족으로부터 주 간 노예 수입"
 AFR_interstate_slave_trade_consumer_tooltip: "다음 중 하나가 참이어야 합니다:\n     모든 이웃: §YInterstate Slave Trade§!이 있습니다\n     모든 해안 국가: §YIllicit Intercontinental Slave Smuggling§!가 있습니다\n"
 AFR_interstate_slave_trade_supplier: "각 주들 간의 노예 무역 확립"
