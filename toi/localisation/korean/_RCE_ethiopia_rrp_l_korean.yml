 ethiopia_egypt_relations.3.t: "[From.GetName]이(가) 거부합니다"
 ethiopia_egypt_relations.3.d: "[From.GetName]이(가) 에리트레아 매각을 거부했습니다"
 ethiopia_egypt_relations.3.a: "그들은 스스로 무덤을 파고 있습니다"
 ethiopia_egypt_relations.4.t: "[ETH.GetName]이(가) 우호 관계를 맺기를 원합니다"
 ethiopia_egypt_relations.4.d: "우리는 오랫동안 [ETH.GetName]과(와) 경쟁해 왔지만, 시대가 변하고 있습니다. [ETH.GetLeader]은(는) 이 현대 세계에서 살아남기 위해 옛 경쟁심을 버리고 친구가 되자고 제안했습니다."
 ethiopia_egypt_relations.4.a: "물론입니다. 새로운 상황에 적응해야 합니다."
 ethiopia_egypt_relations.4.b: "절대 안 됩니다. 그들은 우리의 적이었고, 우리의 적이며, 앞으로도 우리의 적일 것입니다."
 ethiopia_egypt_relations.5.t: "[EGY.GetName]이(가) 과거를 버리기로 동의합니다"
 ethiopia_egypt_relations.5.d: "[EGY.GetName]의 지도자 [EGY.GetLeader]이(가) 지난 불화를 묻고 우리와 친구가 되는 데 동의했습니다. 이제 미래를 내다볼 수 있습니다."
 ethiopia_egypt_relations.5.a: "훌륭합니다"
 ethiopia_egypt_relations.6.t: "[EGY.GetName]이(가) 과거를 버리기를 거부합니다"
 ethiopia_egypt_relations.6.d: "[EGY.GetLeader], [EGY.GetName]의 지도자는 지난 불화를 묻고 우리와 친구가 되는 것을 거부합니다. 부디 이것이 우리의 파멸이 아니기를 바랍니다."
 ethiopia_egypt_relations.6.a: "얼마나 근시안적인가"
 ethiopia_egypt_relations.7.t: "[ETH.GetName]이(가) 경쟁 관계를 끝내기를 원합니다"
 ethiopia_egypt_relations.7.d: "우리는 [ETH.GetName]과(와) 친구가 되지 못할 수도 있지만, 그들은 지난 불화를 묻고 미래 세대를 위해 노력하자고 제안했습니다."
 ethiopia_egypt_relations.7.a: "우리 관계의 새로운 장을 열 때입니다"
 ethiopia_egypt_relations.7.b: "[EGY.GetName]은(는) 그렇게 약한 적과 화해할 필요가 없습니다"
 ethiopia_egypt_relations.8.t: "[EGY.GetName]이(가) 경쟁 관계 종료에 동의합니다"
 ethiopia_egypt_relations.8.d: "[EGY.GetName]의 현명한 지도자 [EGY.GetLeader]이(가) 우리 국가의 경쟁 관계를 끝내는 데 동의했습니다."
 ethiopia_egypt_relations.8.a: "훌륭합니다"
 ethiopia_egypt_relations.9.t: "[EGY.GetName]이(가) 경쟁 관계 종료를 거부합니다"
 ethiopia_egypt_relations.9.d: "[EGY.GetName]의 주민들은 영광스러운 과거에 집착하며 새로운 세계에 적응하기를 거부합니다. 우리의 경쟁은 계속됩니다."
 ethiopia_egypt_relations.9.a: "눈에는 눈, 온 세상이 장님이 될 것입니다"
 ethiopia_egypt_relations.10.t: "[EGY.GetAdjective] 국경 요새화"
 ethiopia_egypt_relations.10.d: "[EGY.GetName]은(는) 한동안 강력한 경쟁자였습니다. 공격에 대비할 때입니다. 우리는 건설을 빠르게 진행하여 적의 공격을 위험에 빠뜨리거나, 비밀리에 국경을 요새화할 수 있습니다."
 ethiopia_egypt_relations.10.a: "건설을 서두르십시오! [EGY.GetName]이(가) 공격하기 전에 요새화해야 합니다!"
 ethiopia_egypt_relations.10.b: "비밀로 유지하십시오. 요새화가 준비되기 전에 그들이 공격하면 이기지 못할 것입니다."
 ethiopia_egypt_relations.11.t: "[ETH.GetName]이(가) 우리 국경을 요새화하기 시작했습니다"
 ethiopia_egypt_relations.11.d: "우리 경쟁자인 [ETH.GetName]이(가) 국경을 요새화하기 시작했습니다. 그들은 분명히 전쟁을 준비하고 있습니다!"
 ethiopia_egypt_relations.11.a: "그들이 이 요새 뒤로 물러나 우리 나라를 약탈하기 시작하기 전에 지금 공격해야 합니다!"
 ethiopia_egypt_relations.11.b: "그들의 성이 우리를 도울 수 있을 것 같습니까! 우리는 무슨 일이 있어도 그들을 격파할 것입니다."
 ethiopia_egypt_relations.12.t: "[EGY.GetName]이(가) 우리의 요새화 노력을 공격합니다!"
 ethiopia_egypt_relations.12.d: "우리의 서둘러 진행된 요새화 건설이 [EGY.GetName]에 의해 감지되었고, 이제 그들이 공격하고 있습니다!"
 ethiopia_egypt_relations.12.a: "건설 현장으로 달려가십시오! 저 방어 시설들이 파괴되면 우리는 무력해질 것입니다."
 ethiopia_egypt_relations.13.t: "에리트레아 정복"
 ethiopia_egypt_relations.13.d: "우리는 바다로 접근해야 합니다. 가장 빠른 경로는 [MED.GetName]을(를) 통하는 것이며, 특히 에리트레아입니다. 빠르게 움직이면 그들을 압도하고, 그들의 지배자인 [EGY.GetName]이(가) 그들을 돕기 위해 군대를 동원할 시간을 갖기 전에 전쟁을 끝낼 수 있습니다! 추가적으로 서부에서 수단인의 봉기를 장려할 것입니다."
 ethiopia_egypt_relations.13.a: "전진!"
 ethiopian_border_conflict.1.t: "[ETH.GetName]이(가) 우리 민족을 해방시키려는 우리의 노력을 지원하겠다고 제안합니다!"
 ethiopian_border_conflict.1.d: "우리는 [ETH.GetName]으로부터 제안을 받았습니다. 그들은 [EGY.GetName]의 압제받는 민족을 해방시키려는 우리의 시도를 지원할 것입니다. 그 대가로 그들은 [EGY.GetName]의 속국인 [MED.GetName]의 영토를 원합니다."
 ethiopian_border_conflict.1.a: "우리 민족을 해방시킬 때입니다"
 ethiopian_border_conflict.1.b: "[ETH.GetName]은(는) 그러한 대의를 지원할 만큼 강하지 않습니다"
 ethiopian_border_conflict.2.t: "승리!"
 ethiopian_border_conflict.2.d: "우리는 [EGY.GetName]과의 분쟁에서 승리하여 이 지방들에 대한 합법적인 주장을 얻었습니다."
 ethiopian_border_conflict.2.a: "드디어 우리 민족은 자유로워질 수 있습니다!"
 ethiopia_coalition_against_islam_chances.1.t: "[ETH.GetName]이(가) 이슬람에 대항하는 연합을 선포합니다"
 ethiopia_coalition_against_islam_chances.1.d: "[ETH.GetName]은(는) 이슬람 국가들에 둘러싸여 있으며, 그들은 종종 자신들의 종교를 이용하여 우리 나라를 약탈합니다. 이러한 공격을 막기 위해 그들은 강력한 우리 나라와 연합하여 억제력을 형성하기를 원합니다."
 ethiopia_coalition_against_islam_chances.1.a: "그들은 우리의 기독교 형제들입니다. 몇 마디 말로 그들을 이 이교도들로부터 보호하기에 충분하다면...:"
 ethiopia_coalition_against_islam_chances.1.b: "이 문제는 우리 나라에 아무런 관심사가 없습니다"
 ethiopia_coalition_against_islam_chances.2.t: "[ETH.GetName]이(가) 이슬람에 대항하는 연합을 선포합니다"
 ethiopia_coalition_against_islam_chances.2.d: "[ETH.GetName]은(는) 이슬람 국가들에 둘러싸여 있으며, 그들은 종종 자신들의 종교를 이용하여 우리 나라를 약탈합니다. 이러한 공격을 막기 위해 그들은 강력한 우리 나라와 연합하여 억제력을 형성하기를 원합니다."
 ethiopia_coalition_against_islam_chances.2.a: "그들은 우리의 기독교 형제들입니다. 몇 마디 말로 그들을 이 이교도들로부터 보호하기에 충분하다면...:"
 ethiopia_coalition_against_islam_chances.2.b: "이 문제는 우리 나라에 아무런 관심사가 없습니다"
