 ETH_crush_the_oromo: "오로모 민병대"
 ETH_crush_the_oromo_desc: "§YAbyssinian-Oromo Tensions:§!\n아비시니아의 통치자 §gTewodros II§!는 옛 §gEthiopian Empire§!를 통합하려는 야망을 가지고 있습니다. 이 야망은 아비시니아인과 오로모 민족 간의 긴장을 초래했습니다. 이제 아비시니아는 정복 또는 외교를 통해 이 야망을 어떻게 이룰지 결정해야 합니다.\n\n§YThe Oromo People:§!\n오로모 민족은 아비시니아의 남서쪽에 살고 있습니다. 오로모 민족과 아비시니아 간의 긴장이 고조되었으며, 더 이상의 §RDetrimental Impacts§!는 지속적인 영향을 미칠 수 있습니다. 오로모 민족은 아비시니아 통치자로부터 독립하기 위해 싸우고 있습니다."

 ETH_push_for_oromo_rights: "오로모 협력"
 ETH_push_for_oromo_rights_desc: "오로모 민족에게 제한적인 권리를 부여함으로써 충돌을 피할 수 있을지도 모릅니다. 에티오피아 제국은 더 평화롭게 통합될 수 있습니다."
 ETH_push_for_oromo_rights_tooltip: "이것은 §YEthiopian Empire§!를 재건하기 위한 §YDiplomatic Path§!를 잠금 해제할 것입니다."


 ETH_global_diplomacy_category: "식민 회사 외교"
 ETH_global_diplomacy_category_desc: "§YDetrimental Impact:§!\n§W이 수치가 증가하면 §YNatives§!와(과) §RControversial Events§!가 발생할 것입니다.\n\n§YColonial Company Partnership:§!\n§W식민 회사가 우리를 직접 통제하지는 않지만, 우리 나라에 영향력을 행사하며 §RDetrimental Impact§!에 기여합니다.\n\n§YImpact of Colonialism:§!\n§g힘과 권력으로 종종 정의되는 세상에서, 전체 인구가 소외, 차별 또는 노골적인 박해의 대상이 되는 경우가 있습니다. '인종 우월주의', '인민의 문명화', 그리고 소외된 집단의 배척은 종종 단기적인 이득을 가져와 담당자들을 위한 지역의 안정과 번영을 보장할 수 있습니다. 그러나 행동이 며칠간 지속되는 동안, 기억은 여러 세대에 걸쳐 지속되며, §YDetrimental Impact§!는 앞으로 수년간의 미래 불안과 다른 예상치 못한 결과를 초래할 수 있습니다.§!"
 ETH_open_trading_post_tooltip: "§G이것은 우리의 항구를 §YForeign Merchants§!에게 열 것입니다.§!\n\n"
