 ethiopia_company_coup.1.t: "[ETH.GetName]에서 회사 쿠데타를 형성하는 데 대한 우리의 지원을 요청받았습니다."
 ethiopia_company_coup.1.a: "그들은 우리의 지원을 받을 것입니다."
 ethiopia_company_coup.1.b: "우리에겐 중요하지 않습니다."
 ethiopia_company_coup.2.t: "지원 획득"
 ethiopia_company_coup.2.d: "[Root.GetName]이(가) 우리를 지원하기로 결정했습니다."
 ethiopia_company_coup.2.a: "좋습니다"
 ethiopia_company_coup.3.t: "지원 거부"
 ethiopia_company_coup.3.d: "[Root.GetName]이(가) 우리를 지원하지 않기로 결정했습니다."
 ethiopia_company_coup.3.a: "젠장"
 ethiopia_company_coup.4.t: "쿠데타 발표"
 ethiopia_company_coup.4.d: "우리 회사가 주도하는 쿠데타의 시작을 발표할까요?"
 ethiopia_company_coup.4.a: "예"
 ethiopia_company_coup.4.b: "아니요"
 ethiopia_company_coup.5.t: "[FROM.GetName]이(가) 쿠데타를 발표합니다"
 ethiopia_company_coup.5.d: "[FROM.GetName]이(가) 우리 나라에 있는 자사 회사의 큰 영향력을 이용하여 쿠데타를 일으키기로 결정했습니다."
 ethiopia_company_coup.5.a: "그들은 지옥에서 썩어야 합니다."
 ethiopia_company_coup.6.t: "[FROm.GetName]이(가) 쿠데타를 지지하지 않기로 결정했습니다"
 ethiopia_company_coup.6.d: "자사 회사가 주도했음에도 불구하고, [FROM.GetName]이(가) 우리 나라에서 시작된 쿠데타를 지지하지 않기로 결정했습니다."
 ethiopia_company_coup.6.a: "좋습니다만, 그렇다면 누가 책임이 있습니까?"
 ethiopia_company_coup.11.t: "식민 장군이 원조하러 옵니다"
 ethiopia_company_coup.11.d: "[FROM.GetName]이(가) 우리를 지원하기 위해 식민 장군을 보내기로 결정했습니다."
 ethiopia_company_coup.11.a: "좋은 소식입니다"
 ethiopian_slave_king_raid.1: "노예 왕의 습격"
 ethiopian_slave_king_raid.1.t: "노예 왕의 습격"
 ethiopian_slave_king_raid.1.d: "§Y[ALZ.GetName]§!이(가) §Y[EGY.GetName]§!을(를) 공격하는 상황에서, 아마도 우리는 친구에게 §YNon-Aggresion Pact§!를 요청하거나 나중에 더 많은 것을 요청할 수 있을 것입니다..."
 ethiopian_slave_king_raid.1.a: "§Y[ALZ.GetName]§!와 동맹을 맺고 §Y[EGY.GetName]§!을(를) 불안정하게 만드십시오!"
 ethiopian_slave_king_raid.1.b: "그들은 충분히 방해를 제공했습니다. 그들과의 동맹은 필요하지 않습니다."

 afr_raid_christian_neighbor_detect_raid.1.t: "이슬람 약탈대 탐지됨!"
 afr_raid_christian_neighbor_detect_raid.1.d: "정찰병이 국경 근처에서 [FROM.GetAdjective] 병력을 탐지했습니다. 우리는 그들이 국경에서 약탈을 감행하려 한다고 생각합니다!"
 afr_raid_christian_neighbor_detect_raid.1.a: "주님께서 이 전투에서 이길 힘을 주시기를!"
 set_border_war_data_afr_raid_christian_neighbor_detect_raid_combat_width_tooltip: "정보부는 이 §YBorder War§!의 §YCombat Width§!가 §R20§!이 될 것이라고 예측했습니다!"

 ethiopia_islamic_raid.1.t: "[FROM.GetName]에 대한 이슬람 습격 시작!"
 ethiopia_islamic_raid.1.a: "우리는 기독교 제국들의 확장을 저지할 것입니다! 마샬라!"
 ethiopia_islamic_raid.2.t: "기독교 습격 성공!"
 ethiopia_islamic_raid.2.a: "알라후 아크바르! 전리품을 우리의 비축량으로 보내십시오!"
 ethiopia_islamic_raid.3.t: "기독교 습격 실패!"
 ethiopia_islamic_raid.3.a: "이교도들 젠장!"
 ethiopia_islamic_raid.4.t: "기독교 습격 교착 상태"
 ethiopia_islamic_raid.4.a: "더 잘 준비해야 합니다!"
 ethiopia_islamic_raid_defender.1.t: "[FROM.GetName]이(가) 약탈자들을 보냅니다!"
 ethiopia_islamic_raid_defender.1.a: "비축량 방어를 준비하십시오!"
 ethiopia_islamic_raid_defender.2.t: "이슬람 약탈자들 패배!"
 ethiopia_islamic_raid_defender.2.a: "하느님을 찬양하라! 그분께서 우리에게 힘을 빌려주셨습니다!"
 ethiopia_islamic_raid_defender.3.t: "이슬람 약탈자들 승리!"
 ethiopia_islamic_raid_defender.3.a: "주님께서 그들을 지옥에 보내시기를!"
 ethiopia_islamic_raid_defender.4.t: "이슬람 습격 교착 상태!"
