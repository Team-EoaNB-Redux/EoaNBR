 ETH_unite_ethiopia_category: "에티오피아 제국 수복"
 ETH_unite_ethiopia_category_desc: "§YEthiopian Imperial Ambitions:§!\n이것은 제후들의 시대이며 많은 군주들이 옛 §gEthiopian Empire§!를 재건하려는 야망을 가지고 있습니다. 이 목표를 달성하려면 한때 에티오피아 제국에 속했던 영토를 외교적으로 획득하거나 [ROOT.GetName]이(가) 합병해야 합니다.\n\n§YThe Old Ethiopian Empire:§!\n황제 이야수 2세와 이요아스 1세의 죽음으로 제국은 결국 "제후의 시대"로 알려진 분권화 시대로 접어들었습니다. 이후 제국의 지역 영주들은 쇠퇴하는 에티오피아 제국 내에서 권력을 놓고 다투기 시작했습니다. 이 "제후" 중 한 명은 하라르 지역에 위치했으며, 그는 사실상 탈퇴하여 자체 왕국을 구성했습니다. 이러한 불안정의 결과로 황제는 겨우 꼭두각시에 불과했습니다."

