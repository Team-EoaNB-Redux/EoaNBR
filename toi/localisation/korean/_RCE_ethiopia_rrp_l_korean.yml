 ETH_proclaim_coalition_against_islam_category: "이슬람-기독교 분쟁"
 ETH_proclaim_coalition_against_islam_category_desc: "§YIslamo-Christian Conflict:§!\n[Root.GetName]은(는) 콥트 기독교 국가이며, 종종 주변 제국들에게 경쟁자나 심지어 침략의 대상이 되기도 합니다. 이슬람 부족들은 때때로 우리의 국경에서 §RCaliphate Raid§!를 시작할 수 있으며, 교전에서 패배하면 번영을 잃을 것입니다.\n\n§YAbsolving the Conflict:§!\n§g이러한 갈등은 [ROOT.GetName]에게 오랫동안 지속된 문제였으며, Tewodros 2세는 이 갈등을 끝낼 방법을 찾아야 합니다. [EGY.GetName]은(는) 이 땅에 대한 우리의 주권에 오랫동안 위협이 되어왔습니다. 그들이 더 이상 위협이 되지 않도록 하는 것은 [ROOT.GetName]의 장수를 위해 매우 중요합니다.§!"
 ETH_islamic_christian_conflict: "이슬람-기독교 분쟁"
 ETH_islamic_christian_conflict_desc: "§YIslamo-Christian Conflict:§!\n§W[ETH.GetName]과 다른 콥트 기독교 국가들은 종종 이슬람 제국들에게 경쟁자로 여겨집니다. 가끔 이 경쟁자들은 기독교 제국들의 힘을 약화시키기 위해 국경 전쟁을 벌일 것입니다.§!"
