 ETH_END_OF_NEW_BEG_DESC: "Tewodros II는 아비시니아를 세상에 알리고자 하는 야망이 있는 왕입니다. 야심 찬 군사 및 사회 개혁을 통해 그는 에티오피아의 국경을 확장하고 유럽 열강과의 외교에 참여할 계획입니다. 내부 및 외부 위협이 아비시니아를 괴롭힙니다. 우리의 외교적 노력에 따라 이집트는 경쟁자가 될 수도, 잠재적인 친구가 될 수도 있습니다. 오로모 부족의 독립 투쟁, 이슬람-기독교 분쟁, 국경 침략자들, 그리고 농민과 성직자들 사이의 커져가는 불안은 내전을 초래할 수 있습니다. Tewodros II는 아비시니아가 생존하기 위해 신중하게 아비시니아를 통치해야 합니다."
 
