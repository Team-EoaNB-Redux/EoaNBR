 ETH_tewodros_reforms: "[Root.GetLeader] 개혁"
 ETH_tewodros_reforms_desc: "국가를 산업화하기 위한 [Root.GetLeader] 개혁을 시작합니다."
 ETH_begin_tewodros_industrial_reforms: "[Root.GetLeader] 산업 개혁 시작"
 ETH_begin_tewodros_industrial_reforms_desc: "산업화를 위해 필요한 큰 변화는 매우 비쌀 것입니다. [Root.GetLeader]은(는) 이를 위한 자금 마련을 위해 농민에 대한 세금을 인상하기로 결정했습니다."
 ETH_connect_the_cities: "마을 현대화"
 ETH_connect_the_cities_desc: "우리 도시는 멀리 떨어져 있고 접근하기 쉽지 않습니다. 이것은 바뀌어야 합니다."
 ETH_connect_the_cities_tooltips: "새로운 §YInfrastructure Decisions§!를 잠금 해제합니다.\n"
 ETH_connected_infrastructure: "현대 도시"
 ETH_connected_infrastructure_desc: "도시와 마을이 연결되었으니, 이제 인프라 개혁을 완료할 때입니다."
 ETH_finish_resource_exploration: "자원 추출"
 ETH_finish_resource_exploration_desc: "[Root.GetName]에는 알려지지 않은 많은 자원 매장지가 존재합니다. 우리는 이를 찾기 위한 탐사대를 보내야 합니다."
 ETH_finish_resource_exploration_decision: "자원 탐사"
 ETH_finish_resource_exploration_tooltip: "새로운 §YResource Extraction Decisions§!를 잠금 해제합니다.\n"
 ETH_finish_resource_exploration_decision_desc: "[Root.GetName]에는 알려지지 않은 많은 자원 매장지가 존재합니다. 우리는 이를 찾기 위한 탐사대를 보내야 합니다."
 ETH_finish_resource_exploration_decision_flag: "§YResource Exploration§!을 마쳤습니다!"
 ETH_fabric_industry: "현대 자원 처리"
 ETH_fabric_industry_desc: "드디어 첫 공장을 건설할 수 있게 되었습니다. 면화의 풍부함 덕분에 첫 [Root.GetAdjective] 방직 공장을 유지할 수 있습니다."
 ETH_study_western_factories: "현대 공장 연구"
 ETH_study_western_factories_desc: "다른 나라의 공장들은 우리보다 훨씬 발전했습니다. 그들의 설계를 모방하여 많은 것을 배울 수 있을 것입니다."
 ETH_study_western_factories_tooltip: "새로운 §YModern Research Decisions§!를 잠금 해제합니다."
 ETH_study_western_factories_flag: "§YModern Factory§! 설계를 연구했습니다."
 ETH_study_western_refining: "현대화된 공장"
 ETH_study_western_refining_desc: "현대적인 생산 라인에는 더 순수한 자원이 필요합니다. 이를 확보하기 위해 정제 과정을 다른 많은 국가들의 표준에 맞춰 개선해야 합니다."
 ETH_clear_space_for_industry: "산업을 위한 공간 확보"
 ETH_clear_space_for_industry_tooltip: "§GThis will increase our maximum factory capacity.§!\n\n"
 ETH_clear_space_for_industry_desc: "교구 성직자들이 [Root.GetName]에 많은 토지를 소유하고 있습니다. 그중 일부를 몰수하면 공장을 위한 추가 공간을 확보할 수 있을 것입니다."
 ETH_study_electricity: "전기 연구"
 ETH_study_electricity_desc: "전기는 비효율적인 호기심에서 유용한 기술로 진화하고 있습니다. 우리는 이 새로운 기술을 이해하여 직접 사용하려고 노력해야 합니다."
 ETH_construct_civ_factory: "민간 공장 건설"
 ETH_construct_civ_factory_desc: "많은 고난 끝에, 우리의 사랑스러운 [Root.GetName]은(는) 드디어 이전에는 상상할 수 없었던 양의 민간 물품을 생산하는 첫 공장을 열 수 있게 되었습니다."
 ETH_construct_another_civ_factory: "다른 민간 공장 건설"
 ETH_construct_another_civ_factory_desc: "다른 공장이 문을 열 준비가 되었습니다."
 ETH_construct_mil_factory: "군사 공장 건설"
 ETH_construct_mil_factory_desc: "[Root.GetName] 주변에는 적대적인 국가들이 많습니다. 군대는 우리 국가를 방어하기 위해 엄청난 양의 군수품이 필요합니다. 이것은 현대적인 군사 공장에서만 생산될 수 있습니다."
 ETH_an_industrializing_nation: "산업화 국가"
 ETH_an_industrializing_nation_desc: "첫 공장이 문을 열고 도시와 마을이 연결되면서 [Root.GetName]은(는) 산업화 국가가 되는 길을 순조롭게 걷고 있습니다."
 ETH_victorian_inspiration: "빅토리아 시대의 영감"
 ETH_victorian_inspiration_desc: "아프리카의 새로운 시대가 시작되었습니다! 이것은 다른 이들에게 아프리카의 비식민지 산업화에 대한 영감을 불어넣을 것입니다."
#ETH_factory_expansion:0 "공장 확장"
 ETH_factory_expansion: "이제 우리는 공장을 더욱 확장할 수 있습니다."
 ETH_military_production: "군사 생산"
 ETH_military_production_desc: "군대는 더 많은 보급품이 필요합니다. 또 다른 무기 공장을 건설해야 합니다."
 ETH_begin_tewodros_military_reforms: "군사 개혁 시작"
 ETH_begin_tewodros_military_reforms.desc: "현대 국가에는 현대적인 군대가 필요합니다. [Root.GetLeader]은(는) 우리의 오래된 시스템을 개혁하기 시작했습니다."
 ETH_reform_the_military_staff: "군사 참모진 개혁"
 ETH_reform_the_military_staff_desc: "명확한 계급 체계는 우리 신군대에 필수적입니다."
 ETH_construct_military_academy_description: "선택된 §YTactics§!에 따라 완료 시 상응하는 §GNational Spirit§!가 제공됩니다.\n\n"
 ETH_construct_military_academy: "사관학교 건설"
 ETH_construct_military_academy_desc: "장교들을 훈련시킬 학교를 건설할 때입니다."
 ETH_tradition_doctrine_description: "\n§RThis will lock us to§! §YTraditional Doctrine§!§R.§!\n"
 ETH_tradition_doctrine: "대규모 군대 교리"
 ETH_tradition_doctrine_desc: "현대 교리는 매우 큰 군대를 요구합니다."
 ETH_improve_our_weapons: "대량 무기 분배"
 ETH_improve_our_weapons_desc: "현재 무기는 구식이지만 우리는 많은 양을 생산할 수 있습니다!"
 ETH_innovation_doctrine_description: "\n§RThis will lock us to§! §YInnovative Doctrine§!§R.§!\n"
 ETH_innovation_doctrine: "정예 훈련 교리"
 ETH_innovation_doctrine_desc: "우리는 대규모 군대를 운용할 인력이 없습니다. 대신 우리는 병사들을 더 잘 훈련시키고 최신 무기를 제공하는 데 집중할 것입니다."
 ETH_distribute_hand_revolvers_description: "기술 추가 - §YVictorian Support Equipment§!.\n§Y50§!개의 §YVictorian Support Equipment§!가 국가 비축량에 추가됩니다."
 ETH_distribute_hand_revolvers: "전문화된 지원 훈련"
 ETH_distribute_hand_revolvers_desc: "대형 소총은 근접 전투나 밀폐된 공간에서 효율적으로 사용될 수 없습니다. 병사들에게 리볼버를 지급하면 이러한 약점을 보완할 수 있을 것입니다."
 ETH_train_offensive_tactics_description: "\n우리의 §YMilitary Academy§!는 §GOffensive Assaults§!와 §GMobilization§!의 중요성을 강조할 것입니다.\n"
 ETH_train_offensive_tactics: "공격 전술 훈련"
 ETH_train_offensive_tactics_trigger: "다음 중 하나가 참이어야 합니다:\n  §Y1 Jan, 1870§! 이후\n  §Y1 Jan, 1865§! 이후이며 §YOffensive Tactics§!를 가지고 있습니다!"
 ETH_train_tactics_trigger: "§YOffensive Tactics§! 또는 §YDefensive Tactics§!를 수행했습니다!"
 ETH_foreign_artillery_instructors_description: "§YForeign Artillery Division§! 템플릿을 생성합니다.\n"
 ETH_foreign_artillery_instructors: "외국인 교관 요청"
 ETH_foreign_artillery_instructors_desc: "외국인 교관들에게 우리 군대를 직접 훈련시켜 달라고 요청할 수도 있습니다..."
 ETH_artillery_doctrine: "포병 교리"
 ETH_artillery_doctrine_desc: "병사들은 새로운 포병을 올바르게 사용하는 법을 배워야 합니다."
 ETH_study_artillery: "새로운 포병 연구"
 ETH_study_artillery_desc: "우리의 포병을 위한 새롭고 유용한 발전이 많이 있습니다."
 ETH_train_defensive_tactics_description: "\n우리의 §YMilitary Academy§!는 §GDefensive Holds§!와 §GEntrenchment§!의 중요성을 강조할 것입니다.\n"
 ETH_train_defensive_tactics: "방어 전술 훈련"
 ETH_train_defensive_tactics_desc: "무적은 방어에 달려 있습니다."
 ETH_plan_military_infrastructure: "군사 인프라 계획"
 ETH_plan_military_infrastructure_desc: "벙커와 보급고를 건설하는 것은 병사들이 국경을 방어할 때 큰 도움이 될 것입니다."
 ETH_industry_doctrine: "산업 교리"
 ETH_industry_doctrine_desc: "대규모 군대는 막대한 양의 무기가 필요합니다."
 ETH_provide_better_uniforms: "더 나은 군복 지급"
 ETH_provide_better_uniforms_desc: "다른 사람들은 우리 병사들이 군복이라고 부르는 누더기를 비웃습니다. 이제 그들에게 새로운 군복을 지급할 때입니다."
 ETH_military_reform_complete: "군사 개혁 완료"
 ETH_military_reform_complete_desc: "오랜 투쟁 끝에 우리 군대는 마침내 다른 현대 국가들의 표준에 도달했습니다."
 ETH_purchase_old_portugese_guns: "낡은 포르투갈 총기 구매"
 ETH_purchase_old_portugese_guns_desc: "[POR.GetName]은(는) 우리에게 낡은 총기를 판매하겠다고 제안했습니다."
 ETH_our_neighbors: "우리 이웃"
 ETH_our_neighbors_desc: "이웃과의 관계에 대해 생각해봐야 합니다."
 ETH_diplomatic_expansion: "외교적 확장"
 ETH_diplomatic_expansion_desc: "군사적 충돌 없이 확장할 방법을 찾을 수도 있습니다."
 ETH_offer_integration_to_sidama: "[SID.GetName]에 통합 제안"
 ETH_offer_integration_to_sidama_desc: "[SID.GetName]의 [SID.GetLeader]을(를) 설득하여 외교적으로 우리 나라에 합류하도록 할 수 있을지도 모릅니다."
 ETH_offer_integration_to_oromo: "[ORO.GetName]에 통합 제안"
 ETH_offer_integration_to_oromo_desc: "이전 통합의 성공 이후 [ORO.GetName]의 [ORO.GetLeader]에게도 같은 제안을 고려해야 합니다."
 ETH_agressive_expansion: "유다의 사자"
 ETH_agressive_expansion_desc: "우리 이웃 중 일부는 약하고 후진적입니다. 우리는 그들의 땅을 더 잘 활용할 수 있습니다."
 ETH_expand_south: "남쪽으로 확장"
 ETH_expand_south_desc: "[SID.GetName]이(가) 좋은 첫 번째 목표가 될 것입니다."
 ETH_expand_east: "동쪽으로 확장"
 ETH_expand_east_desc: "우리는 [ORO.GetName]의 약점을 통해 확장할 또 다른 가능성을 가지고 있습니다."
 ETH_consolidate_power: "새로운 지방에서 권력 공고화"
 ETH_consolidate_power_desc: "새로운 지방에서 권력 공고화가 필요합니다."
 ETH_complete_integration: "통합 완료"
 ETH_complete_integration_desc: "최근 통합된 국가들을 우리의 핵심 영토에 포함시켜야 합니다."
 ETH_prepare_to_annex_somalia: "소말리아 합병 준비"
 ETH_prepare_to_annex_somalia_desc: "해상 연결은 [Root.GetName]에 매우 유익할 것입니다."
 ETH_end_the_era_of_princes: "제후 시대를 끝내십시오"
 ETH_form_ethiopia: "에티오피아 제국의 야망"
 ETH_form_ethiopia_desc: "[ETH.GetName]의 통치자 [ETH.GetLeader]은(는) 옛 에티오피아 제국을 재건하려는 야망을 가지고 있습니다. 이 목표를 달성하려면 한때 에티오피아 제국에 속했던 영토를 외교적으로 획득하거나 합병해야 합니다."
 ETH_form_ethiopia_tooltip: "§G이것은 §Y[ROOT.GetName]§!를 다음 §YFocus Tree§!로 이끌 것입니다.§!\n\n§R다음 §YFocus Tree§!는 아직 완료되지 않았습니다!§!"
 ETH_embargo_egypt: "[EGY.GetName] 제재"
 ETH_embargo_egypt_desc: "사악한 [EGY.GetAdjective] 국가가 우리 나라에 영향력을 확대하고 있습니다. 그들의 영향력이 더 커지지 않도록 제재해야 합니다."
 ETH_fortify_the_egyption_boarder_description: "§Y[EGY.GetName]§! 국경을 따라 §YLand Fortifactions§!을 건설하는 §YMission§!을 활성화합니다."
 ETH_fortify_the_egyption_boarder: "[EGY.GetAdjective] 국경 요새화"
 ETH_fortify_the_egyption_boarder_desc: "몇 차례 심각한 군사적 사건 이후 군대는 [EGY.GetName]과의 국경을 요새화할 것을 요구합니다."
 ETH_attack_eritrea: "달려드는 사자"
 ETH_attack_eritrea_desc: "[MED.GetName]은(는) 약하고, 우리의 경쟁자인 [EGY.GetName]의 지배자인 [MED.GetName]은(는) 분산되어 있습니다. 지금 공격하면 경쟁자가 속국을 방어하기 위해 군대를 동원할 시간을 갖기 전에 그들을 정복할 수 있습니다."
 ETH_neutral_with_egypt: "[EGY.GetName]에 대한 중립"
 ETH_neutral_with_egypt_desc: "우리는 더 큰 이웃인 [EGY.GetName]과 얽히는 것을 피해야 합니다."
 ETH_mend_relations_with_egypt: "[EGY.GetName]과의 관계 개선"
 ETH_mend_relations_with_egypt_desc: "과거는 과거일 뿐입니다. 이제 미래를 내다보고 [ROOT.GetName]과 이웃 [EGY.GetName] 사이의 갈등을 해소할 때입니다."
 ETH_friends_with_egypt: "[EGY.GetName]과 친구가 되십시오"
 ETH_friends_with_egypt_desc: "[EGY.GetName]에 대한 우리의 정책 변경 후, 우리는 그들과 친구가 될 수 있을지도 모릅니다."
 ETH_trade_with_egypt: "[EGY.GetName]과 무역"
 ETH_trade_with_egypt_desc: "상인들은 이 큰 이웃과 그들의 민간 인구의 요구를 이용하기 위해 [EGY.GetName]에게 우리의 시장을 개방할 것을 요구합니다."
 ETH_trade_with_egypt_tooltip: "§G우리는 §Y[EGY.GetName]§!와 함께 §YCamel Trade Industry§!를 전파할 것입니다.§!"
 ETH_trade_with_egypt_relations_tooltip: "§Y[ROOT.GetName]§!과(와) §Y[EGY.GetName]§!은(는) §YTrade Relations§!를 얻어 양국 간의 호감도를 §G+25§! 증가시킵니다.\n"
 ETH_friends_with_al_zubayr: "[ALZ.GetName]과 친구가 되십시오"
 ETH_friends_with_al_zubayr_desc: "[ALZ.GetName]은(는) 우리와 가까운 또 다른 지역 강국입니다. 친구가 되는 것은 장기적으로 우리에게 이익이 될 수 있습니다."
 ETH_enemy_of_my_enemy: "노예 왕의 습격"
 ETH_enemy_of_my_enemy_description: "§Y[ALZ.GetName]§!이(가) §Y[EGY.GetName]§!을(를) 공격하고 있으니, 나중에 우리의 친구에게 §YNon-Aggresion Pact§!를 체결해 달라고, 또는 그 이상의 것을 요청할 수 있을지도 모릅니다..."
 ETH_enemy_of_my_enemy_desc: "내 적의 적은 내 친구입니다. 혹은 그와 비슷한 말입니다. 우리는 [ALZ.GetName]이(가) 적의 편에서 우리 전쟁에 개입하지 않을 것이라는 확약을 받아야 합니다."
 ETH_sudanese_independance_movment: "수단 독립 운동"
 ETH_sudanese_independance_movment_desc: "수단인들의 최근 독립 운동을 지원함으로써 [EGY.GetName] 내의 경쟁자를 약화시킬 수 있을 것입니다."
 ETH_sudanese_independance_movment_description: "§Y[ALZ.GetName]§!은(는) 우리의 공동 지원으로 §GCivil War§!를 §Y[EGY.GetName]§!에서 촉발할 수 있습니다. 비록 새 정권은 우리의 종교적 입장에 §RHostile§!할 수 있습니다."
 ETH_trade_with_al_zubayr: "[ALZ.GetName]과(와) 무역"
 ETH_trade_with_al_zubayr_desc: "[ALZ.GetName]과(와) 친구가 된 후 그들과 무역하는 것이 현명해 보입니다."
 ETH_trade_with_al_zubayr_relations_tooltip: "§Y[ROOT.GetName]§!과(와) §Y[ALZ.GetName]§!은(는) §YTrade Relations§!를 얻어 양국 간의 호감도를 §G+25§! 증가시킵니다.\n"
 ETH_trade_with_al_zubayr_tooltip: "\n§GWe will propagate a §!§YCamel Trade Industry§!§G with the §!§Y[ALZ.GetName]§!§G.§!"
 ETH_warm_up_to_egypt: "[EGY.GetName]에 대한 호의 표시"
 ETH_warm_up_to_egypt_desc: "이제 [EGY.GetName]과(와) 접촉할 때가 되었을지도 모릅니다."
 ETH_exploit_egyption_economic_crises: "[EGY.GetAdjective] 경제 위기 이용"
 ETH_exploit_egyption_economic_crises_desc: "우리는 [EGY.GetAdjective]의 현재 경제 위기를 이용하여 그들의 속국인 [MED.GetName]을(를) 매입하겠다고 제안함으로써 이점을 얻을 수 있을 것입니다."
 ETH_exploit_egyption_economic_crises_trigger: "§Y[EGY.GetName]§!은(는) §Y[550.GetName]§!에 대한 위임 통치권을 가지고 있습니다!"
 ETH_exploit_egyption_economic_crises_tooltip: "\nIf the deal is §Gaccepted§!, a payment plan will be conducted to pay our §ODebt§! of §R200§! §YProsperity§! for purchasing §Y[550.GetName]§!."
 ETH_exploit_egyption_economic_crises_debt_tooltip: "\n§R-200§! §YProsperity§!\n"
 ETH_offer_alliance_to_EGY: "[EGY.GetName]에 동맹 제안"
 ETH_offer_alliance_to_EGY_desc: "[EGY.GetName]과 [ETH.GetName] 사이의 동맹은 이 지역 전체에 대한 우리의 공동 지배를 보장할 것입니다."
 ETH_invite_sudan: "사자, 파라오, 노예 왕의 협정"
 ETH_invite_sudan_desc: "우리 동맹에 기여할 만한 지역 강국이 하나 더 있습니다. [ALZ.GetName]을(를) 초대할 때입니다."
 ETH_invite_sudan_description: "Offer to negotiate an §GAlliance§! between §Y[ETH.GetName]§!, §Y[EGY.GetName]§! and §Y[ALZ.GetName]§!."
 ETH_offer_joint_war_to_EGY: "[EGY.GetName]에 공동 전쟁 제안"
 ETH_offer_joint_war_to_EGY_desc: "[EGY.GetName]과의 동맹을 공동 전쟁으로 시험해 볼 때입니다."
 ETH_sudan_truce_description: "Offer to negotiate a §G10 Year Truce§! between §Y[ETH.GetName]§!, §Y[EGY.GetName]§! and §Y[ALZ.GetName]§!."
 ETH_sudan_truce: "사자, 파라오, 노예 왕의 휴전"
 ETH_sudan_truce_desc: "우리 친구 중 두 나라인 [ALZ.GetName]과 [EGY.GetName]은(는) 서로 적대적입니다. 그들 사이에 휴전을 협상할 수 있을지도 모릅니다."
 ETH_begin_tewodros_social_reforms: "[ETH.GetLeader] 사회 개혁 시작"
 ETH_begin_tewodros_social_reforms_desc: "[Root.GetLeader]은(는) 현대적인 사회 시스템을 만들기로 결정했습니다."
 ETH_adress_religion: "종교 문제 해결"
 ETH_adress_religion_desc: "영향력 있는 성직자들 사이의 최근 불안은 종교 문제를 해결할 필요가 있음을 보여줍니다."
 ETH_supress_the_missionaries: "선교사 활동 억제"
 ETH_supress_the_missionaries_desc: "우리 백성을 개종시키려는 외국인 선교사들에 대해 조치를 취할 때입니다."
 ETH_keep_the_missionaries: "선교사 활동 장려"
 ETH_keep_the_missionaries_desc: "외국인 선교사들이 전파하는 보다 현대적인 기독교 분파 중 하나를 따르는 것을 고려해야 할 수도 있습니다."
 ETH_convert_to_protestant: "개신교로 개종"
 ETH_convert_to_protestant_desc: "우리 나라는 개신교로 개종해야 합니다."
 ETH_embrace_islamic_surge: "이슬람 급증"
 ETH_embrace_islamic_surge_desc: "우리 인구 내에서 이슬람교가 급증했습니다."
 ETH_start_the_revolution: "혁명 시작"
 ETH_start_the_revolution_desc: "옛 기독교 신앙을 버릴 때입니다."
 ETH_adress_islamic_influence: "이슬람 영향 해결"
 ETH_adress_islamic_influence_desc: "우리 나라에 대한 최근 이슬람 영향력을 다룰 때입니다."
 ETH_keep_coptic: "콥트교 유지"
 ETH_keep_coptic_desc: "콥트교는 우리 조상들의 신앙이었고 앞으로도 우리의 신앙일 것입니다."
 ETH_return_land_to_clergy: "성직자에게 토지 반환"
 ETH_return_land_to_clergy_tooltip: "§RThis will delete some factories in §!§YGondar§!§R if no empty slots are available.§!\n\nThis will also reduce our maximum factory capacity for §YGondar§!.\n\n"
 ETH_return_land_to_clergy_desc: "성직자들이 우리 개혁을 위해 몰수한 토지를 돌려줄 것을 요구합니다."
 ETH_a_united_church_and_state: "통합된 교회와 국가"
 ETH_a_united_church_and_state_desc: "성직자들에게 토지를 반환한 후, [Root.GetName]의 번영을 위해 다시 함께 나아갈 때입니다."
 ETH_a_united_church_and_state_tooltip: "\n교회와 국가가 통합되면, 선교사들을 조직하여 §Gspread our faith§!."
 ETH_a_united_church_and_state_flag: "중점 완료: §YUnited Church and State§!!"
 ETH_convert_to_catholic: "가톨릭으로 개종"
 ETH_convert_to_catholic_desc: "우리 나라는 가톨릭으로 개종해야 합니다."
 ETH_adress_education: "교육 문제 해결"
 ETH_adress_education_desc: "현대적인 교육 시스템을 갖출 때입니다."
 ETH_open_schools_education: "학교 개방"
 ETH_open_schools_education_desc: "재능 있는 인재를 놓치지 않도록 모든 사람에게 학교를 개방해야 합니다."
 ETH_keep_privileged_education: "특권 교육 유지"
 ETH_keep_privileged_education_desc: "다른 교육 시스템에 자금을 지원할 방법이 없습니다."
 ETH_western_inspired_university: "서구식 대학 지원"
