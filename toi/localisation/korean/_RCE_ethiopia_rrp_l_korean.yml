 ethiopia_coalition_against_islam_chances.5.d: "[ETH.GetName]은(는) 이슬람 국가들에 둘러싸여 있으며, 그들은 종종 자신들의 종교를 이용하여 우리 나라를 약탈합니다. 이러한 공격을 막기 위해 그들은 강력한 우리 나라와 연합하여 억제력을 형성하기를 원합니다."
