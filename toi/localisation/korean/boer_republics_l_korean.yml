 EDC_zulu.1.t: "줄루족 문제"
 EDC_zulu.1.d: "우리의 고등 판무관인 헨리 바틀 프레어 경은 줄루 왕국에 대한 사소한 불만과 소소한 사건들을 모아 이제 [NAT.GetName]를 방어하기 위해 줄루랜드 침공을 추진하고 있습니다. 하지만 런던의 전보는 우리가 줄루족을 공격하는 것을 금지했습니다. 그럼에도 불구하고 평화롭게 끝내기 위한 최후통첩이 준비되었습니다."
 EDC_zulu.1.a: "최후통첩을 보내자"
 EDC_zulu.2.t: "헨리 바틀 프레어로부터 최후통첩이 도착했다. 그는 [SAF.GetNameDef]의 판무관이며, 영국 통치에 완전히 복종할 것을 요구한다. 우리는 어떻게 응답해야 할까?"
 EDC_zulu.2.a: "무시한다"
 EDC_zulu.2.b: "수락한다"
 EDC_zulu.3.t: "줄루족, 우리의 요구를 무시하다"
 EDC_zulu.3.d: "우리의 요구에 대한 시한이 지났고 줄루족은 우리의 요구에 굴복하기를 거부했습니다. 줄루족 침공이 시작되었습니다."
 EDC_zulu.3.a: "전쟁이다"
 EDC_zulu.4.t: "[SAF.GetName]이(가) [ZUL.GetNameDef]에 전쟁을 선포했다"
 EDC_zulu.4.d: "판무관이 포착한 줄루족과의 일련의 사건들이 전면전으로 확대되었고, 이제 [SAF.GetName] 군대가 우리 국경을 통과하고 있으며 참전 요청을 받았습니다."
 EDC_zulu.4.a: "전쟁이다"
 EDC_zulu.5.t: "영국-줄루 전쟁의 끝"
 EDC_zulu.5.d: "우리 군대는 후퇴 중이고 우리 국가의 대부분이 영국군에 함락되었습니다. 우리에게 남은 선택지는 없습니다. 항복해야 합니다."
 EDC_zulu.5.a: "항복한다"
 EDC_zulu.5.b: "우리는 계속 싸울 것이다"
 EDC_zulu.6.t: "영국-줄루 전쟁의 끝"
