 boer_states.99.t: "[ENG.GetNameDef]이(가) 우리를 붙잡을 수 없다"
 boer_states.99.d: "영국인들은 우리가 그들의 족쇄를 전복시키는 것에 대해 반응을 모을 수 없습니다. 축하합시다."
 boer_states.99.a: "우리가 이겼다"
 boer_states.100.t: "남아프리카 연방의 꿈"
 boer_states.100.d: "대영 제국은 이제 남아프리카 전체를 지배하고 있지만, 수많은 식민지로 나뉘어 있습니다. 우리는 다른 식민지들이 그랬듯이 통일의 불씨를 지펴야 합니다."
 boer_states.100.a: "통일된 남아프리카를 향해 전진."
 boer_states.101.t: "줄루랜드 자치령이 우리 주지사 관할로 이전되다"
 boer_states.101.d: "식민지 행정부가 줄루랜드 영토를 우리에게 관리하도록 주었습니다."
 boer_states.101.a: "그들을 합병하라."
 boer_states.102.t: "[From.GetName]이(가) 연합법을 요청하다"
 boer_states.102.d: "남아프리카에 있는 우리 식민지에서 온 사절단이 영국인, 아프리카인, 원주민의 다투는 식민지들을 통일된 국가로 변모시키기 위한 연합법을 요청하며 도착했습니다."
 boer_states.102.a: "발행하라"
 boer_states.103.t: "[SOT.GetName]이(가) 우리를 약탈하다"
 boer_states.103.d: "[SOT.GetName]에서 온 약탈단이 멈출 것이라는 그들의 보장에도 불구하고 [779.GetName]에서 우리 농부들을 계속 방해하고 있습니다. 이제 그들을 강제로 멈추게 할 때입니다."
 boer_states.103.a: "우리가 필요했던 정당화다"
