l_english:
 afr_ofs_invest_in_resource_discovery: "자원 발견 기금 지원"
 afr_ofs_gold_mines_1: "금광"
 afr_ofs_gold_mines_2: "금광"
 boer_standing_army: "상비군"
 boer_large_standing_army: "대규모 상비군"
 ofs_basutoland_raids: "소토족 약탈"
 ofs_basutoland_raids_desc: "우리 국경은 [SOT.GetNameDef]의 소 도둑들에게 계속해서 약탈당하고 있으며, 우리 경제에 피해를 입히고 있습니다."
 ofs_SAR_partisans: "남아프리카 공화국 빨치산"
 ofs_SAR_partisans_desc: "소수의 우리 정부 구성원들이 [TRV.GetNameDef]와 합병하기 위해 선동하고 있습니다."
 boer_states.15.t: "보어인들이 그들의 대가를 요구하며 도착하다"
 boer_states.15.d: "많은 용병들이 당신의 궁전에 도착하여 지난 내전 동안 제공한 봉사에 대한 대가로 그들에게 빚진 땅을 요구하고 있습니다. 그들에게 땅을 주어야 할까요?"
 boer_states.15.a: "약속은 약속이다"
 boer_states.15.b: "안 돼"
 boer_states.16.t: "[TRV.GetName]에 합병을 요청하다"
 boer_states.16.d: "[ENG.GetNameDef]이(가) 방금 우리의 국경 동맹국인 [ZUL.GetNameDef]을(를) 합병했습니다. 우리 국민의 많은 이들이 [ENG.GetNameDef]에 의한 합병 위험을 감수하기보다는 [TRV.GetName]에 통합할 것을 요구하고 있습니다. \n그래야 할까요?"
 boer_states.16.a: "[TRV.GetNameDef]에 합병을 요청하자"
 boer_states.16.b: "아니, 우리는 독립을 유지해야 한다"
 boer_states.17.t: "[NIR.GetName]이(가) 합병을 요청하다"
 boer_states.17.d: "더 [NIR.GetName]의 대표들이 우리에게 합병을 요청하러 왔습니다. 수락해야 할까요?"
 boer_states.17.a: "물론 수락해야지"
 boer_states.17.b: "영국을 화나게 할 여유는 없다"
 boer_states.18.t: "[NIR.GetName]을(를) 합병할까?"
 boer_states.18.d: "[NIR.GetName]의 대표들이 [TRV.GetName]에 가서 합병을 요청했지만 거절당했습니다. 우리가 나서서 직접 합병해야 할까요?"
 boer_states.18.a: "그래, 우리의 영향력을 확장해야 한다"
 boer_states.18.b: "그들은 소중한 완충 국가이니 내버려 둬라"
 boer_states.19.t: "[NAT.GetName]이(가) 합병을 요구하다"
 boer_states.19.d: "더 [NAT.GetName]의 외교관들이 우리에게 복종을 요구하며 도착했습니다. 우리는 어떻게 해야 할까요?"
 boer_states.19.a: "우리는 받아들여야 한다"
 boer_states.19.b: "아니, 우리는 독립을 유지해야 한다"
 boer_states.20.t: "[NIR.GetName]이(가) 합병을 거부하다"
 boer_states.20.d: "[NIR.GetNameDef]가 우리의 제안을 거부했습니다. 그들이 복종하도록 강제해야 할까요?"
 boer_states.20.a: "그래, 불과 칼로"
 boer_states.20.b: "아니, 전쟁으로 지역 균형을 깨뜨리지 않을 것이다"
 boer_states.21.t: "[STL.GetName]이(가) 독립 국가임을 선언하다"
 boer_states.21.d: "[1146.GetName] 내의 보어 용병들이 용병으로 싸워 넓은 땅을 얻었고, 스스로를 [STL.GetNameDef]이라고 선언했습니다."
 boer_states.21.a: "또 다른 보어 국가라고?"
 boer_states.21.b: "스텔라랜드 만세!"
 boer_states.22.t: "[GOS.GetName]이(가) 독립 국가임을 선언하다"
 boer_states.22.d: "[1146.GetName] 내의 더 많은 보어 광부들이 용병으로 싸워 [1067.GetName] 주를 얻었고, 스스로를 더 [GOS.GetNameDef]이라고 선언했습니다."
 boer_states.22.a: "또 또 다른 보어 국가라고?"
 gos_vic_ask_integration: "[STL.GetName]에 통합을 요청하다"
 gos_vic_ask_integration_desc: "우리는 혼자서 살아남기에는 너무 작다. [STL.GetName]에 합병을 요청해야 한다."
 boer_states.24.t: "[GOS.GetName]이(가) 통합을 요청하다"
 boer_states.24.d: "작은 [GOS.GetName]에서 우리 공화국에 합류를 요청하는 사절단이 왔습니다. 그들을 받아들여야 할까요?"
 boer_states.24.a: "그래, 우리는 이제 스텔라랜드 연합으로 알려질 것이다"
 boer_states.24.b: "대신 연방을 결성하자"
 boer_states.24.c: "절대 안 돼"
 boer_states.25.t: "[STL.GetName]은(는) 전략적으로 유리한 위치에 있다. 합병해야 할까?"
 boer_states.25.d: "우리 남아프리카 자문가에 따르면, [STL.GetName]이라는 '국가'는 주요 무역로에 위치하고 있으며, 무역로에 세금을 부과할 것이라고 발표했습니다. 이 때문에 우리는 이 영토를 합병해 달라는 청원을 받았습니다. 그래야 할까요?"
 boer_states.25.a: "그래, 그들을 보호국으로 선포하자"
 boer_states.25.b: "절대 안 돼, 보어인들은 골칫거리일 뿐이다"
 boer_states.26.t: "[ENG.GetName]이(가) 우리를 보호국으로 선포하다"
 boer_states.26.d: "[ENG.GetNameDef]가 우리를 그들의 영토 일부로 선포했습니다. 대신 [TRV.GetNameDef]에 합류를 요청해야 할까요?"
 boer_states.26.a: "그래, [OFS.GetNameDef]로 가자"
 boer_states.26.b: "지금 복종해야 한다"
 boer_states.27.t: "[ENG.GetName]이(가) 우리를 점령하기 위해 군대를 이동시키다"
 boer_states.27.d: "[ENG.GetNameDef]가 우리를 점령하기 위해 군대를 이동시켰습니다. 어떻게 해야 할까요?"
 boer_states.27.a: "우리는 그들과 싸울 것이다"
 boer_states.27.b: "지금 복종해야 한다"
 boer_states.28.t: "[STL.GetNameDef]이(가) 우리에게 그들을 통합해 달라고 요청했다"
 boer_states.28.d: "최근 [ENG.GetNameDef]가 [STL.GetName]을(를) 보호국으로 선포했지만, [STL.GetNameDef]의 시민들은 우리에게 대신 우리 국가에 통합해 달라고 요청하러 왔습니다."
 boer_states.28.a: "우리가 받아들이겠다"
 boer_states.28.b: "그들을 괴뢰국으로 만들 것이다"
 boer_states.28.c: "[ENG.GetNameDef]와 갈등을 시작할 여유가 없다"
 boer_states.29.t: "[STL.GetNameDef]이(가) [TRV.GetNameDef]와 합류했다"
 boer_states.29.d: "우리의 보호국인 [STL.GetName]이(가) 우리의 의지에 반하여 [TRV.GetNameDef]에 복종했습니다. 개입해야 할까요?"
 boer_states.29.a: "그들이 복종하도록 만들겠다"
 boer_states.29.b: "물러서라"
 boer_states.30.t: "[ENG.GetNameDef]이(가) [1148.GetName]로 군대를 이동시키다"
 boer_states.30.d: "오늘 일찍이 [ENG.GetNameDef]가 우리의 주권 영토인 [1148.GetName]로 군대를 이동시켰습니다."
 boer_states.30.a: "우리는 물러서야 한다"
 boer_states.30.b: "우리는 그들과 싸워 물리칠 것이다"
 boer_states.31.t: "[ENG.GetNameDef]이(가) [1148.GetName]을(를) 완전히 통제하다"
 boer_states.31.d: "우리는 [ENG.GetNameDef]와의 전쟁에서 패배했고, 그들의 대표들은 평화를 추진하고 있습니다. 우리는 수락해야 할까요?"
 boer_states.31.a: "우리가 수락하겠다"
 boer_states.31.b: "우리는 항복하지 않을 것이다"
 boer_states.32.t: "[TRV.GetNameDef]이(가) [1148.GetName]을(를) 완전히 통제하다"
 boer_states.32.d: "우리는 [TRV.GetNameDef]와의 전쟁에서 패배했고, 그들의 대표들은 평화를 추진하고 있습니다. 우리는 수락해야 할까요?"
 boer_states.32.a: "우리가 수락하겠다"
 boer_states.32.b: "우리는 계속 싸울 것이다"
 boer_states.33.t: "소 약탈이 심화되다"
 boer_states.33.d: "[SOT.GetNameDef]의 원주민 세력이 수년간 우리의 소를 약탈해 왔으며, 올해는 약탈이 가장 심한 해였습니다. 우리 국민의 많은 이들은 이제 무력으로 대응해야 할 때라고 믿습니다."
 boer_states.33.a: "우리가 이와 싸울 것이다"
 boer_states.33.b: "케이프 식민지에 중재를 요청하자"
 boer_states.33.c: "우리는 과거에 그랬듯이 이를 견뎌낼 것이다."
 boer_states.34.t: "[OFS.GetNameDef]이(가) 우리에게 중재를 요청하다"
 boer_states.34.d: "[SOT.GetNameDef]의 원주민 세력이 수년간 [OFS.GetName]을(를) 계속해서 약탈해 왔고, 이제 갈등이 우리의 전쟁에 매우 가까워졌습니다. 그러나 [OFS.GetName]이(가) 우리에게 와서 이 문제를 중재할 것인지 묻고 있습니다."
 boer_states.34.a: "좋아, [OFS.GetName] 편에 서겠다"
 boer_states.34.b: "좋아, [SOT.GetName] 편에 서겠다"
 boer_states.35.t: "조약에 서명할까?"
 boer_states.35.d.sot: "[ENG.GetName]이(가) 이 분쟁을 중재하기로 동의했고, [SOT.GetNameDef]에게 유리한 조약을 우리에게 보냈습니다. 우리가 이에 동의하면 [OFS.GetName]은(는) [779.GetName]에 대한 권리를 포기해야 합니다."
 boer_states.35.d.ofs: "[ENG.GetName]이(가) 이 분쟁을 중재하기로 동의했고, [OFS.GetNameDef]에게 유리한 조약을 우리에게 보냈습니다. 우리가 이에 동의하면 [OFS.GetName]은(는) [779.GetName]을(를) 얻게 됩니다."
 boer_states.35.a: "우리가 동의한다"
 boer_states.35.b: "우리는 거부한다"
 boer_states.36.t: "조약에 합의하다"
 boer_states.36.d: "양측이 [779.GetName]의 운명에 대한 조약에 동의했으며, 이제 조약 조건이 실행되고 있습니다."
 boer_states.36.a: "마침내, 오렌지 강 이쪽의 모든 것이 우리의 것이 되었다"
 boer_states.36.b: "평화를 위해 치러야 할 대가"
 boer_states.37.t: "현상 유지"
 boer_states.37.d: "국경 분쟁에 대해 아무도 합의에 이르지 못했고, 현상 유지가 계속되고 있습니다."
 boer_states.37.a: "안타깝군"
 boer_states.38.t: "터닝 포인트"
 boer_states.38.d: "[SOT.GetNameDef] 내의 야만인들이 우리 백성에 대한 끝없는 약탈을 계속하여 우리의 소를 훔치고 수백 파운드의 경제적 피해를 입혔습니다."
 boer_states.38.a: "우리는 그들을 한 번에 처리해야 한다"
 boer_states.38.b: "우리는 계속해서 이것을 견뎌내야 할 것이다"
 boer_states.40.t: "[SOT.GetName]-[OFS.GetName] 전쟁"
 boer_states.40.d: "[SOT.GetNameDef]의 약탈자들에 의한 [OFS.GetNameDef]에 대한 약탈로 인해 전쟁 상태가 발발했습니다."
 boer_states.40.a: "확인"
 boer_states.39.t: "약탈이 끝나다"
 boer_states.39.d: "이제 [SOT.GetName] 약탈자들이 다른 국가 아래에 들어가면서, 약탈은 마침내 끝났습니다."
 boer_states.39.a: "좋아"
 boer_states.41.t: "[SOT.GetNameDef]이(가) [OFS.GetNameDef]에 우세하다"
 boer_states.41.d: "[SOT.GetNameDef]이(가) 현재 [OFS.GetNameDef]에 우세하며, 만약 그들이 이긴다면 지역 내 균형을 방해할 수 있습니다. 조약을 중재하겠다고 제안해야 할까요?"
 boer_states.41.a: "전쟁을 무시한다"
 boer_states.41.b: "조약 중재를 제안한다"
 boer_states.42.t: "[OFS.GetNameDef]이(가) [SOT.GetNameDef]에 우세하다"
 boer_states.42.d: "[OFS.GetNameDef]이(가) 현재 [SOT.GetNameDef]에 우세하며, 만약 그들이 이긴다면 지역 내 균형을 방해할 수 있습니다. 조약을 중재하겠다고 제안해야 할까요?"
 boer_states.42.a: "전쟁을 무시한다"
 boer_states.42.b: "조약 중재를 제안한다"
 ofs_campbell_diamonds: "캠벨 다이아몬드 광산"
 ofs_national_campbell_diamonds: "국립 캠벨 다이아몬드 광산"
 boer_states.51.t: "[1149.GetName]에서 다이아몬드 발견"
 boer_states.51.d: "[1149.GetName] 주(州)의 발 강(Vaal River) 강둑에서 넓은 다이아몬드 광산 지역이 발견되었으며, 우리 행정부는 스스로(그리고 우리를) 부유하게 만들 준비가 된 광부들이 대량으로 유입되고 있다고 보고합니다."
 boer_states.51.a: "좋은 소식이군"
 boer_states.52.t: "[1149.GetName]에서 다이아몬드 발견"
 boer_states.52.d: "분쟁 지역인 [1149.GetName] 주(州)의 발 강 강둑에서 넓은 다이아몬드 광산 지역이 발견되었습니다. [OFS.GetNameDef]가 이 지역에 공무원들을 이동시켜 이 지역을 관리하려 하고 있지만, 우리도 이 지역에 대한 권리를 주장했습니다."
 boer_states.52.a: "우리의 주장을 내세우자"
 boer_states.52.b: "그 땅은 정당하게 [OFS.GetName]의 땅이다"
 boer_states.53.t: "영국이 [1149.GetName] 다이아몬드 광산에 관심을 갖다"
 boer_states.53.d: "영국 케이프 식민지 영토가 다이아몬드 광산에 관심을 갖는 것으로 보입니다. 우리 요원은 우리가 그들에게 가서 보호국으로 복종하고 그들이 우리를 위해 다이아몬드 광산을 획득하도록 추천했습니다."
 boer_states.53.a: "그래, [ENG.GetNameDef]에 이 주(州)의 통제권을 제안하는 사절을 보내자"
 boer_states.53.b: "우리는 우리의 주권을 좋아한다, 권리를 포기하자"
 boer_states.54.t: "[GQW.GetName]이(가) 우리에게 [1149.GetName] 다이아몬드 광산을 제안하다"
 boer_states.54.d: "[GQW.GetName]의 요원이 [1149.GetName] 다이아몬드 광산을 관리한다면 통합을 요청하는 제안을 가지고 도착했습니다."
 boer_states.54.a: "물론이지"
 boer_states.54.b: "그들의 주장은 매우 불안정하다. 거절한다"
 boer_states.55.t: "[ENG.GetNameDef]이(가) [1149.GetName]의 다이아몬드 광산뿐만 아니라 [GQW.GetName]도 합병하다"
 boer_states.55.d: "오늘 [ENG.GetName]이(가) [GQW.GetName]을(를) 공식적으로 합병하고, 우리의 깃발이 광산 위에 게양되어 있음에도 불구하고 [1149.GetName] 영토도 합병했습니다. 이는 우리 주권에 대한 비열한 침해입니다."
 boer_states.55.a: "[ENG.GetNameDef]의 힘에 맞설 수 없다"
 boer_states.55.b: "우리의 정당한 권리를 주장하자"
 boer_states.55.c: "이것은 전쟁 행위다!"
 boer_states.56.t: "[OFS.GetName]이(가) [1149.GetName]의 반환을 계속 요구하다"
 boer_states.56.d: "우리는 [1149.GetName] 주 내의 킴벌리 다이아몬드 광산을 통제해 왔습니다. 하지만 [OFS.GetNameDef]는 여전히 그 땅에 대한 주권을 주장하고 있으며, [OFS.GetName]와 우호적인 국가들과의 외교 관계가 급락하고 있습니다."
 boer_states.56.a: "약간의 금전적 보상을 보내자"
 boer_states.56.b: "땅을 돌려주자"
 Britain_accepts_re_annexation: "영국이 재합병을 수락할까?"
 ofs_germany_exists: "독일이 형성되었다"
 afr_encoraged_immirgration: "정부가 이민을 장려하다"
 ofs_bluebacks: "블루백"
 ofs_bluebacks_devalued: "블루백 가치 하락"
 ofs_bluebacks_heavly_devalued: "블루백 가치 대폭 하락"
 ofs_bluebacks_valued: "블루백 가치 상승"
 ofs_bluebacks_heavly_valued: "블루백 가치 대폭 상승"
 ofs_blueback_warning: "블루백 지폐를 우리의 국가 통화로 지정\n§RThis currency's effects may fluctuate§!"
 ofs_vic_complete_legal_reforms: "법률 개혁 완료"
 ofs_vic_complete_legal_reforms_desc: "우리나라는 법률 제도를 개혁해 왔습니다. 정부의 다른 일에 집중하기 전에 이를 완료해야 합니다."
 ofs_vic_attempt_to_levy_taxes: "세금 부과 시도"
 ofs_vic_attempt_to_levy_taxes_desc: "우리 국가가 설립된 이래로 시민들은 세금 납부를 꺼려했습니다. 좀 더 설득력을 가져야 할 것 같습니다."
 ofs_vic_economic_focus: "경제 중심"
 ofs_vic_economic_focus_desc: "우리 경제는 관심이 필요합니다. 행정력을 이 과제에 집중합시다."
 ofs_vic_external_focus: "대외 관계 중심"
 ofs_vic_external_focus_desc: "우리나라는 불안정한 위치에 있습니다. 세계에서 우리 국가의 위치를 확보하는 데 노력을 집중해야 합니다."
 ofs_vic_establish_laws_on_tariffs: "관세에 관한 법률 제정"
 ofs_vic_establish_laws_on_tariffs_desc: "관세법과 관세를 부과할 수 있는 대상에 대한 개혁을 완료합니다."
 ofs_vic_gunpowder_regulations: "화약 규제"
 ofs_vic_gunpowder_regulations_desc: "[OFS.GetName] 내의 화약 생산 및 유통에 대한 규제를 제정합니다."
 ofs_vic_encorage_the_founding_of_a_research_foundation: "연구 재단 설립 장려"
 ofs_vic_encorage_the_founding_of_a_research_foundation_desc: "현대 국가가 되기 위해서는 연구 그룹이나 재단이 필요합니다. 하나를 설립합시다."
 has_more_than_150k_pop: "인구가 §Y150K§! 명을 초과"
 has_more_than_200k_pop: "인구가 §Y200K§! 명을 초과"
 has_more_than_250k_pop: "인구가 §Y250K§! 명을 초과"
 boer_states.72.t: "탄광 발견"
 boer_states.72.d: "우리 탐사원들이 [778.GetName] 내에서 큰 석탄맥을 발견했습니다."
 boer_states.72.a: "좋아"
 boer_states.73.t: "금 발견"
 boer_states.73.d: "우리나라에서 큰 금광이 발견되었습니다. 비록 대부분이 우리의 손이 닿지 않는 곳에 있지만, 우리가 접근할 수 있는 금은 앞으로 수년간 우리 나라를 풍요롭게 할 것입니다."
 boer_states.73.a: "좋아"
 ofs_vic_attempt_diplomatic_ties_with_SAR: "[TRV.GetName]와 외교 관계 시도"
 ofs_vic_attempt_diplomatic_ties_with_SAR_desc: "[TRV.GetNameDef]는 주변에 있는 유일한 보어 국가입니다. 과거에 적대 관계가 있었지만, 그렇다고 해서 우리의 상호 생존을 위해 함께 협력하지 않아야 한다는 의미는 아닙니다. 그들에게 사절을 보내 지속적인 관계를 구축합시다."
 ofs_vic_consoladate_internal_governence: "내부 통치 공고화"
 ofs_vic_consoladate_internal_governence_desc: "내부 개혁을 완료한 후 우리 정부를 공고히 합시다. 이것은 우리 국가를 안정시키는 데 도움이 될 것입니다."
 ofs_vic_the_fuctions_of_a_state: "국가의 기능"
 ofs_vic_the_fuctions_of_a_state_desc: "우리 정부의 다양한 부서가 가져야 할 책임과 권한을 정의해야 합니다. 이를 통해 우리는 국가를 내외부적으로 어떻게 관리할지 정할 수 있을 것입니다."
 boer_states.74.t: "[OFS.GetName]이(가) 사절을 보내다"
 boer_states.74.d: "우리 이웃인 [OFS.GetNameDef]가 우리와 외교 관계를 재수립하기 위해 사절을 보냈습니다. 그들을 받아들여야 할까요?"
 boer_states.74.a: "그래, 우리의 관계를 회복하자"
 boer_states.74.b: "아니, 그들을 돌려보내라"
 boer_states.75.t: "[TRV.GetNameDef]이(가) 우리의 사절을 받아들이다"
 boer_states.75.d: "[TRV.GetNameDef]가 우리의 외교 관계를 회복하는 데 동의했습니다. 이 관계가 지속되기를 바랄 뿐입니다."
 boer_states.75.a: "좋아"
 boer_states.76.t: "[TRV.GetNameDef]이(가) 우리의 사절을 거절하다"
 boer_states.76.d: "[TRV.GetNameDef]가 우리의 사절을 거절했습니다. 그들이 시간이 지나서 이 의견을 철회하기를 바랄 뿐입니다."
 boer_states.76.a: "시간이 지나면 후회하게 될 것이다"
 boer_states.77.t: "[OFS.GetNameDef]이(가) 통합을 요청하다"
 boer_states.77.d: "우리 동맹국인 [OFS.GetNameDef]가 흥미로운 제안을 가지고 우리에게 왔습니다. 그들은 우리 국가에 통합하여 보어 국가들을 통일하기를 요청하고 있습니다. 동의해야 할까요?"
 boer_states.77.a: "물론이지"
 boer_states.77.b: "우리는 그들이 독립적으로 남아 있기를 바란다"
 boer_states.78.t: "[TRV.GetNameDef]이(가) 우리의 합병을 거부하다"
 boer_states.78.d: "우리는 [TRV.GetNameDef]로부터 답변을 받았습니다. 그들은 우리의 제안을 거절했습니다."
 boer_states.78.a: "독립이다"
 TRV_accepts_envoys: "§YSouth African Republic§!: 우리의 사절을 수락함"
 OFS_accepts_envoys: "§YOrange Free State§!: 우리의 사절을 수락함"
 ofs_vic_offer_joint_guarentees: "공동 보증 제안"
 ofs_vic_offer_joint_guarentees_desc: "우리의 독립을 유지하기 위해 [TRV.GetNameDef]와 공동 보증을 선언해야 합니다."
 ofs_vic_offer_to_join_with_the_SAR: "[TRV.GetNameDef]와 합류 제안"
 ofs_vic_offer_to_join_with_the_SAR_desc: "우리 두 국가는 통치 방식과 국민 면에서 매우 유사하며, 심지어 같은 대통령을 가진 적도 있습니다. [TRV.GetNameDef]에 통합하자는 아이디어는 우리 정부의 고위층에서 떠돌고 있습니다. 우리가 그렇게 제안해야 할까요?"
 long_term_alliance: "장기 동맹"
 ofs_vic_our_british_policy: "우리의 영국 정책"
 ofs_vic_our_british_policy_desc: "우리 국가가 형성된 이래로 우리의 운명은 [ENG.GetNameDef]의 행동에 달려 있었습니다. 그러나 이에 대해 무엇을 할지는 우리에게 달려 있습니다. [ENG.GetNameDef]와 함께 갈까요, 아니면 우리만의 길을 갈까요?"
 boer_states.79.t: "[From.GetName]이(가) 승인을 요청하다"
 boer_states.79.d: "우리는 고군분투하는 '[From.GetNameDef]' 국가로부터 그들의 주권 승인을 요청하는 외교관을 받았습니다."
 boer_states.79.a: "물론 우리가 그들을 승인하겠다"
 boer_states.79.b: "누구?"
 boer_states.79.c: "우리가 그들을 승인할 뿐만 아니라, 보증도 해 주겠다"
 boer_states.80.t: "[From.GetName]이(가) 우리를 승인하다"
 boer_states.80.d: "[From.GetNameDef]에서 온 외교관이 오늘 아침 [Root.Capital.GetName]에 도착하여 우리 정부의 주권 승인을 전달했습니다."
 boer_states.80.a: "좋아"
 boer_states.81.t: "[From.GetName]이(가) 우리를 무시하다"
 boer_states.81.d: "우리의 외교관이 [From.GetNameDef]로부터 패배하여 돌아왔습니다. 그들은 어떤 식으로든 우리를 승인하기를 거부했습니다."
 boer_states.81.a: "젠장"
 boer_states.82.t: "[From.GetName]이(가) 우리의 독립을 승인하다"
 boer_states.82.d: "[From.GetNameDef]에서 온 외교관이 오늘 아침 [Root.Capital.GetName]에 도착하여 우리 정부의 주권 승인과 우리 독립에 대한 그들의 보증을 전달했습니다. 외교관은 또한 그곳에 대사관을 설립하기 위해 건물을 요청했습니다."
 boer_states.82.a: "좋아"
 afr_supply_methods: "보급 방법"
 afr_updated_supply_methods: "업데이트된 보급 방법"
 ofs_vic_focus_on_exsternal_problems: "대외 문제에 집중"
 ofs_vic_focus_on_exsternal_problems_desc: "우리는 현재 전쟁 중이므로 이 기간 동안 대외 문제에 집중해야 합니다."
 ofs_vic_liquor_reulations: "주류 규제"
 ofs_vic_liquor_reulations_desc: "술은 사회의 골칫거리이므로 이를 통제하기 위해 음료에 대한 규제를 제정해야 합니다."
 ofs_vic_continue_constitutional_reforms: "헌법 개혁 계속"
 ofs_vic_continue_constitutional_reforms_desc: "우리 헌법은 여전히 매우 취약합니다. 우리 정부와 헌법을 계속 개혁해야 합니다."
 ofs_vic_reform_the_voting_system: "투표 시스템 개혁"
 ofs_vic_reform_the_voting_system_desc: "우리 국민의 견해를 더 잘 대변하기 위해 투표 및 투표 지역을 정의하는 방식을 변경합니다."
 ofs_vic_remove_single_citizenship_requirement: "단일 시민권 요건 제거"
 ofs_vic_remove_single_citizenship_requirement_desc: "우리 투표 시스템은 토지 요건 때문에 많은 시민들을 배제합니다. 이를 개혁하여 소유 여부에 관계없이 모든 시민에게 개방합시다."
 ofs_vic_start_to_connect_our_economy: "우리 경제 연결 시작"
 ofs_vic_start_to_connect_our_economy_desc: "우리 경제의 대부분은 넓은 지역에 흩어져 있습니다. 이를 연결하기 위한 도로망을 개발하기 시작해야 합니다."
 ofs_vic_exspand_our_road_network: "도로망 확장"
 ofs_vic_exspand_our_road_network_desc: "우리 도로망을 우리 주의 먼 곳까지 확장합니다."
 ofs_vic_invest_in_resource_discovery: "자원 발견에 투자"
 ofs_vic_invest_in_resource_discovery_desc: "우리 국가의 숨겨진 자원을 찾는 데 도움이 될 탐사원과 측량사에게 투자를 시작합니다."
 ofs_vic_industrialising_our_nation: "우리 국가 산업화"
 ofs_vic_industrialising_our_nation_desc: "우리 경제를 발전시키기 위해 새로운 공장 설립을 장려하기 시작합니다."
 ofs_vic_begin_military_production: "군사 생산 시작"
 ofs_vic_begin_military_production_desc: "이제 산업화를 준비하기 시작했으니, 군사적 필요를 충족시켜야 합니다."
 ofs_vic_encorage_manufactory_develpoment: "제조업 발전 장려"
 ofs_vic_encorage_manufactory_develpoment_desc: "산업화된 국가에 필요한 기계를 생산하기 위해 제조업 설립을 장려해야 합니다."
 ofs_vic_deal_with_SAR_partisans: "[TRV.GetNameDef] 빨치산 처리"
 ofs_vic_deal_with_SAR_partisans_desc: "우리 정부는 우리를 [TRV.GetNameDef]에 강제로 가입시키려는 [TRV.GetNameDef] 빨치산들로 들끓고 있습니다. 그들 중 다수가 전쟁 중에 반역 행위를 저질렀으므로, 강경파를 투옥하거나 추방합시다."
 ofs_vic_encorage_immirgration: "이민 장려"
 ofs_vic_encorage_immirgration_desc: "인구를 늘리기 위해 우리 자문가들은 우리 국가로의 이민을 장려하는 정책을 시행할 것을 제안했습니다."
 ofs_vic_create_a_national_tax_code: "국가 세법 제정"
 ofs_vic_create_a_national_tax_code_desc: "우리 경제는 완전히 불균형하고 규제되지 않았습니다. 우리 국가와 경제를 안정시키기 위해 적절한 세법을 제정해야 합니다."
 afr_become_industrialised_tooltip: "§Y[545.Owner.GetName]§!은(는) §Gwill become an industrializing nation!§!"
 boer_states_company.83.t: "[From.GetNameDef]이(가) 회사 파트너십을 제안하다"
 boer_states_company.83.d: "우리 보어 이웃이 [ROOT.GetName]와(과) [From.GetNameDef] 사이에 회사 파트너십을 결성하는 아이디어를 제안했습니다. 이 파트너십은 새로운 산업화 시대를 열 것이지만, 식민지 영향력을 대가로 합니다. 유일한 질문은 우리가 어떻게 대응해야 하는가입니다."
 boer_states_company.83.a: "동의한다, 이 파트너십은 산업적 경이로움을 가져올 것이다."
 boer_states_company.83.b: "절대 안 돼! [ROOT.GetAdjective]은(는) 식민지 영향력으로부터 독립적으로 남아있을 것이다!"
 boer_states_company.84.t: "[From.GetNameDef]이(가) 거절했다!"
 boer_states_company.84.d: "우리 보어 이웃이 우리의 파트너십을 거절했습니다!"
 boer_states_company.84.a: "그들이 나중에 받아들일지 지켜봐야겠다."
 boer_states.83.t: "[From.GetNameDef]이(가) 우리에게 복종을 요청하다"
 boer_states.83.d: "우리 보어 이웃이 우리에게 최후통첩을 보냈습니다. 그들의 통치에 복종하거나 합병당하라는 것입니다. 어떻게 대응해야 할까요?"
 boer_states.83.a: "동의한다, 이것은 우리 민족으로서 진보하는 데 도움이 될 것이다"
 boer_states.83.b: "절대 안 돼, 우리의 자유가 가장 중요하다"
 boer_states.84.t: "[From.GetNameDef]이(가) 거절했다!"
 boer_states.84.d: "우리 보어 이웃이 우리의 최후통첩을 거절했습니다. 어떻게 대응해야 할까요?"
 boer_states.84.a: "전쟁이다! 지역을 합병하라!"
 boer_states.84.b: "그 때문에 전쟁을 할 가치는 없을 것이다."
 boer_states.85.t: "[OFS.GetNameDef]이(가) 재합병을 요청하다"
 boer_states.85.d: "우리가 [OFS.GetNameDef]에 대한 주권을 포기한 이래로, 그들의 정부 내에서 대규모 재통합 운동이 있었습니다. 이것은 케이프 식민지에 있는 우리 총독으로부터 [OFS.GetNameDef]을(를) 합병할 허가를 요청하는 대표단이 도착하는 것으로 절정에 달했습니다. 그들을 허락해야 할까요?"
 boer_states.85.a: "동의한다, 새로운 땅은 항상 좋다"
 boer_states.85.b: "아니, 그 지역은 골칫거리일 뿐이다"
 boer_states.87.t: "[ENG.GetNameDef]에 보호를 요청하다"
 boer_states.87.d: "우리 이웃들이 우리의 국경을 탐욕스럽게 바라보고 있습니다. [ENG.GetNameDef]에 그들의 보호를 요청해야 할지도 모릅니다."
 boer_states.87.a: "영국의 보호를 요청한다"
 boer_states.87.b: "안 돼"
 boer_states.88.t: "[From.GetNameDef]이(가) 보호를 요청하다"
 boer_states.88.d: "우리는 [From.GetNameDef]로부터 '보호'를 요청하는 대표들을 받았습니다. 그들의 복종을 받아들여야 할까요?"
 boer_states.88.a: "그들의 복종에 동의한다"
 boer_states.88.b: "아니, 그들의 땅은 노력할 가치가 없다"
 boer_states.88.c: "그냥 그들을 보증만 하자"
 boer_states.89.t: "[ENG.GetNameDef]에 보호를 요청하다"
 boer_states.89.d: "우리 이웃들이 우리의 국경을 탐욕스럽게 바라보고 있습니다. [ENG.GetNameDef]에 그들의 보호를 요청해야 할지도 모릅니다."
 boer_states.89.a: "영국의 보호를 요청한다"
 boer_states.89.b: "안 돼"
 ofs_vic_roads_in_the_west: "서부의 도로"
 ofs_vic_roads_in_the_west_desc: "서부의 우리 도로는 우리와 같은 국가에 충분하지 않습니다. 국가 인프라를 개선하기 위해 이 도로를 확장해야 합니다."
 ofs_vic_roads_in_the_east: "동부의 도로"
 ofs_vic_roads_in_the_east_desc: "우리 동부 도로는 최상의 상태가 아닙니다. 이제 이 도로를 확장할 때입니다."
 ofs_vic_cement_constatution: "우리 헌법을 공고히 하다"
 ofs_vic_cement_constatution_desc: "우리 헌법에는 해석의 여지가 있는 일부 정의되지 않은 용어가 있습니다. 우리 정권을 합법화하기 위해 이 용어들을 더 명확하게 만들 것입니다."
 has_more_than_1M_pop: "인구가 1백만 명 이상"
 OFS_has_dominion_over_rhodesia: "[545.GetName]을(를) 지배함"
 boer_states.90.t: "국가 교회 문제"
 boer_states.90.a: "우리 국민과 정부는 한 신앙을 가진다"
 boer_states.90.b: "교회와 국가는 분리되어야 한다"
 trv_idea_annoyed_church: "화가 난 교회 당국"
 trv_settled_church_question: "교회 문제 해결?"
 trv_idea_god_fairing_people: "경건한 사람들"
 trv_idea_disjointed_government: "분열된 정부"
 boer_states.91.t: "[TRV.GetNameDef]이(가) 휴전을 제안하다"
 boer_states.91.d: "남아프리카 공화국과의 전쟁이 충분히 길어졌다. 양측에게 전쟁의 공포를 면해주기 위해 이제 휴전할 때다."
 boer_states.91.a: "이 피비린내 나고 불필요한 갈등을 끝내자."
 boer_states.91.b: "너무 많은 사람이 죽었으니, 아무런 이득 없이 이 갈등을 끝낼 수 없다. 전진하라, 승리를 향해!"
 boer_states.1.t: "[OFS.GetName]와 휴전"
 boer_states.1.d: "우리는 [OFS.GetNameDef]와 격렬하게 싸웠습니다. 그러나 그들이 우리를 패배시켰고, 우리 국가가 파괴되지 않으려면 평화를 간청하는 것이 현명할 것입니다."
 boer_states.1.a: "우리는 항복한다."
 boer_states.1.b: "절대 안 돼! 우리는 끝까지 싸울 것이다!"
 boer_states.2.t: "오렌지 자유국, 통합 거부"
 boer_states.2.d: "우리가 [OFS.GetNameDef]에 통합을 여러 번 제안했지만 매번 거절당했습니다. 최근에는 [OFS.GetNameDef]가 그곳에 있는 우리 지지자들을 반역죄로 투옥했다는 소식이 들어왔습니다."
 boer_states.2.a: "이대로 둘 수 없다! 전쟁이다!"
 boer_states.2.b: "그곳에서는 우리의 통치를 원하지 않는 것이 분명하다."
 boer_states.3.t: "보스호프 사임!"
 boer_states.3.d: ""
 boer_states.3.a: "일단 의회 의장 에사이아스 레이니어 스니이만(Esaias Reynier Snijman)이 대통령 대행을 맡게 됩니다."
 boer_states.4.t: "프리토리우스의 대통령직"
 boer_states.4.d: ""
 boer_states.4.d2: ""
 boer_states.4.a: "그는 이미 남아프리카 공화국의 대통령이 아닌가?"
 boer_states.4.b: "그의 경험이 우리에게 큰 도움이 될 것이다"
 boer_states.5.t: "프리토리우스, 오렌지 자유국을 떠나다!"
 boer_states.5.d: ""
 boer_states.5.a: "일단 의회 정부 비서인 조셉 앨리슨(Joseph Allison)이 대통령 대행을 맡게 됩니다."
 boer_states.6.t: "의회, 프리토리우스의 사임 수락"
 boer_states.6.d: ""
 boer_states.6.a: "새로운 대통령 대행이 선출될 때까지 의회가 국정을 이끌 것이다."
 boer_states.7.t: "의회, 야코부스 요하네스 펜터에게 의석을 주기로 결정"
 boer_states.7.d: ""
 boer_states.7.a: "그가 대통령 대행이 된다"
 boer_states.8.t: "요하네스 헨리쿠스 브란트, 대통령으로 선출되다"
 boer_states.8.d: ""
 boer_states.8.a: "알겠습니다"
 boer_states.9.t: "프리토리우스의 사임"
 boer_states.9.d: ""
 boer_states.9.a: "요하네스 헤르마누스 그로블러가 대통령 대행이 된다"
 boer_states.10.t: "스테파누스 스후만, 정권을 잡다!"
 boer_states.10.d: ""
 boer_states.10.a: "이런 반전이?"
 boer_states.11.t: "의회, 스후만 축출"
 boer_states.11.d: ""
 boer_states.11.a: "스후만은 독재자가 되었다. 우린 그 없이 더 나을 것이다."
 boer_states.12.t: "트란스발 내전"
 boer_states.12.d: ""
 boer_states.12.a: "스후만은 지는 것을 싫어한다"
 boer_states.13.t: "프리토리우스의 귀환"
 boer_states.13.d: ""
 boer_states.13.a: "프리토리우스는 모든 보어 국가에서 동시에 중요한 인물이 되는구나."
 boer_states.14.t: "국가 대통령직 신설"
 boer_states.14.d: ""
 boer_states.14.a: "더 강한 국가를 위한 더 강한 지도자"
 boer_states.92.t: "우리의 영국 정책은?"
 boer_states.92.d: "영국은 항상 우리를 억압해왔습니다. 그러나 그들의 영향권 안에 머무는 것은 외교 정책에 큰 도움이 될 것이며, 영국의 세계적 지배력과 거대한 해군 덕분에 우리를 안전하게 지켜줄 것입니다. 우리의 다음 행동 방침은 무엇일까요?"
 boer_states.92.a: "영국인들이 우리를 보호하게 하자."
 boer_states.92.b: "아니! 우리는 독립을 위해 열심히 싸웠고, 그것을 지킬 것이다!"
 SWZ_idea_bigger_than_it_looks: "보이는 것보다 더 크다"
 SWZ_idea_bigger_than_it_looks_desc: "우리나라의 많은 부분이 [TRV.GetNameDef]에 팔렸지만, 아직 교환이 완료되지 않아 우리는 그 땅과 사람들에게 접근할 수 있습니다."
 trv_idea_occupied_swazi_territory: "점령된 스와지 영토"
 trv_idea_occupied_swazi_territory_desc: "우리는 [SWZ.GetNameDef]로부터 넓은 땅을 구매할 준비를 했지만, 아직 교환이 이루어지지 않아 이 지역에서의 노력이 제한됩니다."
 trv_ignore_british: "§YHas Policy§!: 영국 무시"
 trv_british_loyalty: "§YHas Policy§!: 영국에 대한 충성"
 OFS_western_diplomacy.desc: "§YUnlocks Diplomacy with the West§!"
 eoanb_decision_OFS_western_diplo: "우리의 외교관들을 [From.GetNameDef]에 보내자"
 eoanb_decision_OFS_western_diplo_desc: "오랫동안 우리는 서방으로부터 고립되어 있었습니다. 이제 열강들에게 외교관을 보낼 때입니다. [From.GetNameDef]는 우리를 인정할 가능성이 높습니다."
 ofs_vic_establish_diplomacy_with_the_west_no_Britain: "영국이 우리의 통합을 수락하지 않았다"
 ofs_funding_rhodesian_industrialisation: "[545.GetName]의 산업화 자금 지원"
 ofs_vic_exspand_influence_north: "북쪽으로 우리의 영향력 확장"
 ofs_vic_exspand_into_bamangwato: "[841.GetName]로 확장"
 ofs_vic_influence_rhodesia: "[545.GetName]에서 파트너십 협상"
 ofs_vic_begin_to_industrialise_rhodesia: "[545.GetName]의 산업화 시작"
 ofs_vic_civilian_industrialistion_rhodesia: "[545.GetName]의 민간 경제 구축"
 ofs_vic_military_industrialistion_rhodesia: "[545.GetName]의 군사 경제 구축"
 ofs_vic_finish_the_industrialisation_in_rhodesia: "[545.GetName]의 산업화 완료"
 ofs_recovering_economy: "회복 중인 경제"
 ofs_recovering_economy_desc: "우리는 최근 국가 산업화 프로젝트를 완료했으며, 이제 우리 국가 경제는 확장으로부터 회복해야 합니다."
 ofs_vic_encorage_factory_jobs: "국영 공장 일자리 장려"
 ofs_vic_establish_national_banknotes: "국가 지폐 발행"
 ofs_vic_establish_national_banknotes_desc: "주권 국가는 자체 통화를 통제해야 합니다. 우리만의 블루백 지폐를 발행하고 우리 경제를 영국으로부터 분리해야 합니다."
 ofs_vic_increase_research_funding: "연구 자금 증액"
 ofs_vic_army_focus: "군대 집중"
 ofs_vic_army_focus_desc: "주권 국가가 되려면, 국경을 강화할 훈련된 군대를 창설해야 합니다."
 ofs_vic_suppling_our_forces: "우리 군대 보급"
 ofs_vic_suppling_our_forces_desc: "우리 군대에 보급하기 위해, 발 강과 오렌지 강 사이에 있는 우리의 위치 때문에 우리 군대에 특화된 보급 방법을 개발해야 합니다."
 ofs_vic_bring_setsoto_into_our_road_network: "[779.GetName]을(를) 우리 도로망에 편입"
 ofs_vic_bring_setsoto_into_our_road_network_desc: "수년간 [SOT.GetNameDef] 국민들의 소 약탈과 약탈 이후, 마침내 [779.GetName]의 국경을 강화했습니다. 이제 마침내 우리의 정부적 의무를 다하고 이 땅을 우리의 인프라 네트워크에 편입시킬 수 있습니다."
 ofs_vic_consolidate_power: "권력 공고화 (작업 중)"
 ofs_vic_consolidate_power_desc: "작업 중"
 ofs_vic_attempt_to_submit_to_ENG: "[ENG.GetName]에 복종 시도"
 ofs_vic_attempt_to_submit_to_ENG_desc: "영국으로부터의 독립은 실수였습니다. 우리는 다시 한번 영국에 영국 왕관에 재합류할 것을 요청해야 합니다."
 ofs_vic_steadfast_independace: "확고한 독립"
 ofs_vic_steadfast_independace_desc: "우리는 진정한 주권 국가가 되어 공정하고 정의롭게 스스로를 통치해야 합니다."
 ofs_vic_develop_independant_indentity: "Develop Independent Identity"
 ofs_vic_develop_independant_indentity_desc: "Britains Policy towards us is clear, it is time to form our own national identity and strive to prosperity"
 ofs_vic_prepare_for_re-annexation: "재합병 준비"
 ofs_vic_prepare_for_re-annexation_desc: "영국이 마침내 우리를 재합병하기로 동의했습니다. 영국 요원들이 우리 정부를 인수할 준비를 해야 할 때입니다."
 ofs_vic_native_deals: "원주민 거래"
 ofs_vic_native_deals_desc: "우리는 최근 [GQE.GetNameDef]으로부터 [776.GetName]을(를) 구입했습니다. 이제 이 영토를 우리 행정부에 편입시킬 때입니다."
 ofs_vic_begin_land_deals: "더 많은 토지 거래 시작"
 ofs_vic_begin_land_deals_desc: "성장하기 위해 우리는 원주민 부족들과 거래를 해왔습니다. 이 관행을 계속합시다."
 ofs_vic_encorage_more_deals: "더 많은 거래 장려"
 ofs_vic_encorage_more_deals_desc: "우리가 했던 원주민 거래는 매우 유익했습니다. 더 나은 거래로 더 많은 거래를 장려합시다."
 ofs_vic_remain_isolated: "고립 유지"
 ofs_vic_remain_isolated_desc: "우리를 보호하기 위해 우리는 이웃 국가들과만 거래를 하며 고립을 유지해야 합니다."
 ofs_vic_establish_diplomacy_with_the_west: "서방과 외교 관계 수립"
 ofs_vic_establish_diplomacy_with_the_west_desc: "우리를 보호하기 위해 유럽 열강들로부터 보호를 모색해야 합니다."
 TRV_boer_milita: "보어 민병대"
 TRV_boer_milita_desc: "일반 대중에서 소집된 보어 민병대는 이미 잘 훈련된 명사수, 사냥꾼, 숙련된 척후병입니다. 이는 우리 군대를 영국 전술에 대한 직접적인 대응책으로 만듭니다."
 boer_states.93.t: "트란스발 합병?"
 boer_states.93.d: "트란스발은 내부 위기 한가운데에 있습니다. 우리는 이것과 줄루족의 증가하는 위협을 이용하여 군대 배치 없이 트란스발을 합병할 수 있습니다."
 boer_states.93.a: "명령을 내리자"
 boer_states.93.b: "아니, 우리는 [ZUL.GetNameDef] 위협에 우리의 주의를 집중해야 한다"
 boer_states.94.t: "영국이 우리를 영국 통치 하에 있다고 선언했다"
 boer_states.94.d: "우리는 방금 영국 남아프리카 위원으로부터 우리가 대영 제국의 일부라고 선언하는 공문을 받았습니다. 줄루족의 위협과 우리의 내부 문제로 인해 우리가 이에 항의하면 더 많은 것을 잃을 수 있습니다."
 boer_states.94.a: "지금은 동의해야 한다"
 boer_states.94.b: "즉시 거부한다"
 boer_states.95.t: "토마스 버거스, 대통령으로 선출"
 boer_states.95.d: "토마스 버거스가 우리의 제4대 대통령으로 선출되었습니다."
 boer_states.95.a: "알겠습니다"
 boer_states.96.t: "줄루족이 패배하다"
 boer_states.96.d: "우리 남부 국경의 줄루족 위협이 영국에 의해 패배하여, 우리의 독립 시도를 위협할 수 있는 유일한 세력이 제거되었습니다. 이 영국 속박을 전복시키자."
 boer_states.96.a: "독립"
 boer_states.97.t: "트란스발, 독립 선언"
 boer_states.97.d: "트란스발이 우리를 상대로 무기를 들었습니다. 우리가 이 반란을 진압하지 않으면 통일된 남아프리카에 대한 우리의 꿈은 물거품이 될 것입니다."
 boer_states.97.a: "그들을 되찾아오자"
 boer_states.97.b: "그들을 보내주자"
 ZUL_military_traditions: "샤카의 전술"
 ofs_vic_inovate_our_guns: "우리 총기 혁신"
 ofs_vic_adopt_new_doctrines: "새로운 교리 채택"
 ofs_vic_create_a_standing_force: "상비군 창설"
 ofs_vic_continue_innovation: "혁신 계속"
 ofs_vic_update_supply_methods: "보급 방법 업데이트"
 ofs_vic_new_arms_new_tactics: "새로운 무기, 새로운 전술"
 ofs_vic_establish_military_command: "군사 지휘부 수립"
 ofs_vic_build_a_larger_force: "더 큰 군대 건설"
 ofs_vic_mantain_frendly_independant_relations: "우호적 독립 관계 유지"
 dreams_of_SAF: "남아프리카 연합의 꿈"
 TRV_OFS_BOER_ALLIANCE: "보어 동맹"
 boer_states.98.t: "[ENG.GetNameDef]이(가) 싸우기로 결정했다"
 boer_states.98.d: "보어 민병대를 소집하라"
