 Oceania_Prosperity_Mechanic: "번영: [?ryu_prosperity_mechanic]"
 Oceania_Prosperity_Mechanic_desc: "§gThe [ROOT.GetName] has entered the Oceania Prosperity League, founded by the [RYU.GetName].§! 이로 인해 우리 나라는 지역 경제를 강화하는 유익한 무역 협정으로부터 헤아릴 수 없는 번영을 모았습니다. 이는 또한 상호 의존적인 경제를 통해 지역 평화를 창조했습니다."
 JOH_Prosperity_Mechanic: "번영: [?ryu_prosperity_mechanic]"
 JOH_Prosperity_Mechanic_desc: "§gThe [ROOT.GetName] has been a wealthy trading nation for decades prior.§! 이로 인해 우리 나라는 산업에 투자할 수 있는 헤아릴 수 없는 번영을 얻었습니다."
 ACE_Prosperity_Mechanic: "번영: [?ryu_prosperity_mechanic]"
 ACE_Prosperity_Mechanic_desc: "§gThe [ROOT.GetName] supplies half the world's pepper demands.§! 이로 인해 우리 나라는 헤아릴 수 없는 번영과 전 세계적으로 수요가 높은 수입품을 얻었습니다."
 Oceania_prosperity_mechanic_construction: "진행 중인 §YRegional Development Project§!가 없습니다"
 Oceania_build_cotton_farm: "지역 개발 프로젝트: 면화 농장"
 Oceania_build_cotton_farm_desc: "일부 재산을 지역 면화 농장에 투자함으로써, 성장하는 세계 시장을 위한 면화 자원 생산량을 §Gincrease our cotton resource production§! 수 있습니다."
 Oceania_build_farm: "지역 개발 프로젝트: 농장"
 Oceania_build_farm_desc: "일부 재산을 지역 농장에 투자함으로써, 식량 생산을 확대하여 인구를 §Gincrease population§! 수 있습니다."
 Oceania_build_dockyard: "협력 사업 프로젝트: 조선소"
 Oceania_build_dockyard_desc: "현대적인 조선소를 건설하는 과정은 우리의 건설 방법으로는 너무 기술적입니다. 우리는 건설 노력을 지원하기 위해 §Y[INS.GetName]§! 외의 §YForeign Power§!에 의존해야 합니다."
 Oceania_dockyard_forign_help_tooltip: "§YForeign Power§!가 프로젝트에 투자했습니다."
