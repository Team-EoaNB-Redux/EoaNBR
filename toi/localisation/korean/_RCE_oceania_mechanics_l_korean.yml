 Oceania_western_oriented_regional_power: "서방 지향 지역 강국"
 Oceania_western_oriented_regional_power_desc: "이 국가는 스스로를 서방 지향 지역 강국으로 개혁했습니다. 유럽인들이 모범을 보인 법률과 국내 정책에 기반을 두고 있습니다."
