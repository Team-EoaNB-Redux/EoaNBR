 SAM_dutch_east_indies_tribute_1: "[INS.GetName] 협력"
 SAM_dutch_east_indies_tribute_1_desc: "[SAM.GetName]은(는) [INS.GetName]과(와) 협력 중입니다. [SAM.GetName]이(가) 여전히 일정 수준의 자율성을 가지고 있지만, 큰 영향을 받으며, [INS.GetName]에 의해 합병될 가능성도 있습니다.\n\n1824년 영란 조약에서 인도네시아와 말레이시아 간의 국경이 설정되었습니다. 말레이시아의 [SRW.Getname], [BRU.Getname], [ACE.Getname]은(는) [ENG.GetAdjective] 영토로 주장되었습니다. 나머지 인도네시아는 [HOL.GetAdjective] 영토가 되었습니다."
 BUN_dutch_east_indies_tribute_1: "[INS.GetName] 협력"
 BUN_dutch_east_indies_tribute_1_desc: "[BUN.GetName]은(는) [INS.GetName]과(와) 협력 중입니다. [BUN.GetName]이(가) 여전히 일정 수준의 자율성을 가지고 있지만, 큰 영향을 받으며, [INS.GetName]에 의해 합병될 가능성도 있습니다.\n\n1824년 영란 조약에서 인도네시아와 말레이시아 간의 국경이 설정되었습니다. 말레이시아의 [SRW.Getname], [BRU.Getname], [ACE.Getname]은(는) [ENG.GetAdjective] 영토로 주장되었습니다. 나머지 인도네시아는 [HOL.GetAdjective] 영토가 되었습니다."
 
 LAN_Kongsi_federation: "콩시 연맹"
 LAN_Kongsi_federation_desc: "콩시 연맹은 [LAN.GetName]의 정부 형태입니다. 이것은 중국 기원을 가지고 서양과 완전히 분리되어 만들어진 집산주의 민주주의입니다. 콩시 공화국은 생산 수단을 집산화했지만, 이것은 노동자를 위한 것이 아니었습니다. 집산주의 콩시 아래의 노동자들은 열악한 근무 환경을 가졌고 빚을 갚을 때까지 노예처럼 일했습니다. 빚을 갚고 자유로워진 후에야 콩시에 지분을 소유할 수 있었습니다. 콩시 공화국의 주 기관은 종정(Zongting)으로, 구성 콩시 광산 공동체를 대표하는 대의원들의 회의였습니다. 4개월마다 대의원이 선출되는 종정은 행정 및 입법 기능을 모두 행사했습니다."

 ACE_possesion_only_in_name: "1824년 영란 조약"
 ACE_possesion_only_in_name_desc: "1824년 영란 조약에서 영국은 술탄국에 대한 실제적인 통제권이 없었음에도 불구하고 아체와 말레이를 자국의 소유 중 하나로 묘사했습니다. 이 합의에 따라 네덜란드는 아체의 독립을 존중하기로 동의했습니다."
 INS_anglo_dutch_treaty: "1824년 영란 조약"
 INS_anglo_dutch_treaty_desc: "1824년 영란 조약에서 인도네시아와 말레이시아 간의 국경이 설정되었습니다. 말레이시아의 [SRW.Getname], [BRU.Getname], [ACE.Getname]은(는) [ENG.GetAdjective] 영토로 주장되었습니다. 나머지 인도네시아는 [HOL.GetAdjective] 영토가 되었습니다."

