 AFR_disjointed_tribes_desc: "땅에 많은 부족들이 있지만, 공통의 대의나 정부 아래 통합되어 있지 않습니다."
 SAM_dutch_east_indies_tribute: "[INS.GetName] 조공국"
 SAM_dutch_east_indies_tribute_desc: "[SAM.GetName]은(는) 조공국입니다. 일정 수준의 자율성을 가지고 있지만, [INS.GetName]의 큰 영향을 받습니다.\n\n1824년 영란 조약에서 인도네시아와 말레이시아 간의 국경이 설정되었습니다. 말레이시아의 [SRW.Getname], [BRU.Getname], [ACE.Getname]은(는) [ENG.GetAdjective] 영토로 주장되었습니다. 나머지 인도네시아는 [HOL.GetAdjective] 영토가 되었습니다."
 BUN_dutch_east_indies_tribute: "[INS.GetName] 조공국"
