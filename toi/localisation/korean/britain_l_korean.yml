 british_votes.25.d: "우리는 이 새로운 형태의 교통수단의 법적 위치를 명확히 하고 규제함으로써 그 사용을 촉진하고 장려해야 합니다. 이 법안을 통과시키지 않으면, 지방 정부들은 이 새로운 형태의 교통수단에 투자하는 것을 망설일 것입니다."
