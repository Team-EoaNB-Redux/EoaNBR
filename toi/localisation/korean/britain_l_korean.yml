 british_votes.26.t: "영국-프로이센 해군 조약에 대한 의회 승인"
 british_votes.26.a: "한 달 뒤에 투표합시다."
 british_votes.26.b: "아이디어를 포기한다."
 british_votes.26.d: "프로이센 정부와 의회 모두 제안된 영국-프로이센 해군 조약에 청신호를 보냈습니다. 이제 웨스트민스터가 조약을 승인하고 비준할 때입니다. 많은 양대 정당 대표들이 여전히 중립적인 입장이기 때문에 전문가들은 근소한 차이로 결론이 날 것으로 예상하고 있습니다. 비록 [PRS.GetName]이 당분간 진지한 해군 경쟁자가 될 것 같지는 않지만, 프로이센인들은 그들의 함대에 투자를 시작했으며 계속 그렇게 한다면 미래에 우리의 평화와 번영에 상당한 위협이 될 수 있습니다."
 british_votes_results.26.t: "영국-프로이센 해군 조약 승인 투표 결과"
 british_votes_results.26.d: "The results of the parliamentary vote on the approval for the Anglo-Prussian Naval Treaty are in... All members from the different parties represented voted on what they believed to be the right path forward for our nation. Whether we like the result or not, this vote is the representation of the will of our constituents.\n\nAfter a careful counting of all the votes, the final results are:\n Yay: [?yay_votes] \n Nay : [?nay_votes]"
 british_votes_results.26.a: "의회, 조약을 승인한다."
 british_votes_results.26.b: "의회, 조약을 거부한다."
 british_votes_results.26.c: "의회가 동점, 즉 조약은 거부된다."
