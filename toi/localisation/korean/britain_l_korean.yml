 ENG_idea_britannia_rules_the_waves_desc: "19세기 남은 기간 동안, 왕립 해군은 '팍스 브리타니카(Pax Britannica)'로 알려진 것을 시행하는 데 도움을 주었습니다. 이는 궁극적으로 영국의 해상 패권 사용에 의존하는 주요 유럽 국가들 간의 힘의 균형에서 비롯된 오랜 상대적 평화 기간이었습니다."
