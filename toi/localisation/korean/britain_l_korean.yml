 british_votes.6.t: "형법 통합법"
 british_votes.6.a: "즉시 통과시켜야 합니다."
 british_votes.6.b: "우리 시간 낭비다."
 british_votes.6.d: "만약 이 법안이 제정된다면, 잉글랜드와 웨일스 전역에서 살인 미수의 상해 사건에 대한 기소를 고려하고 개혁하게 될 것입니다. 또한, 이 법의 여러 다른 부분들은 낙태를 금지하고, 살인 미수가 무엇을 의미하며 어떻게 보이는지, 그리고 일반적인 형량을 명시합니다. 이것이 올바른 방향으로 나아가는 단계일까요, 아니면 런던이 더욱더 관료적인 넌센스를 행사하는 것을 막아야 할까요?"
