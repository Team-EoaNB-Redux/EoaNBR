 ENG_desc_queen_vic: "빅토리아는 켄트와 스트래선 공작 에드워드 왕자(조지 3세의 넷째 아들)와 작센코부르크잘펠트의 빅토리아 공주 사이에서 태어났습니다. 1820년 아버지와 할아버지가 사망한 후, 그녀는 어머니와 관리인 존 콘로이의 엄격한 감독 아래에서 자랐습니다. 그녀는 아버지의 세 형이 합법적인 후손 없이 사망하면서 18세에 왕위를 물려받았습니다. 입헌군주였지만, 빅토리아는 개인적으로 정부 정책과 장관 임명에 영향을 미치려 했으며, 대외적으로는 엄격한 개인 도덕성의 상징으로서 국가적 아이콘이 되었습니다."
 ENG_desc_palmerston: "헨리 템플은 1802년 제3대 팔머스턴 자작으로서 아버지의 아일랜드 귀족 작위를 물려받았습니다(이 작위로는 상원 의석을 가질 수 없어 하원 의원으로 활동할 수 있었습니다). 그는 1807년 토리당 의원이 되었습니다. 1809년부터 1828년까지 육군 장관으로 복무하며 군대의 재정을 조직했습니다. 그는 1827년 조지 캐닝이 총리가 되면서 처음으로 내각에 입성했지만, 다른 캐닝파와 마찬가지로 1년 후 사임했습니다. 1830-1834년, 1835-1841년, 그리고 1846-1851년 외무장관을 역임했습니다. 이 직책에서 팔머스턴은 유럽에서 벌어진 일련의 분쟁에 효과적으로 대응했습니다."
 ENG_desc_edward_smithstanley: "스탠리 가문은 랭커셔의 노즐리 홀에 주 거주지를 둔, 오랫동안 확고하게 부유했던 지주 가문이었습니다. 그는 아마도 역대 총리 중 가장 부유한 인물일 것입니다."
 ENG_desc_william_lovett: "정치적 권리가 정치적 압력과 비폭력적인 선동을 통해 얻어질 수 있다는 사상을 지지했던 로벳은, 1839-1840년 선동적 명예훼손이라는 정치적 혐의로 1년간 투옥된 후 더 노골적인 형태의 정치 활동에서 은퇴했습니다. 이후 그는 차티스트 교육 프로그램을 통해 가난한 노동자와 그들의 자녀의 삶을 개선하고자 '인민의 정치적 사회적 개선을 위한 국민 연합'에 헌신했습니다."
 ENG_desc_disraeli: "디즈레일리는 당시 미들섹스의 일부였던 블룸즈버리에서 태어났습니다. 그의 아버지는 유대교 회당에서 분쟁을 겪은 후 유대교를 떠났고, 벤저민은 12세에 성공회 신자가 되었습니다. 몇 번의 실패 끝에, 디즈레일리는 1837년 하원에 입성했습니다. 1846년 당시 총리였던 로버트 필 경은 수입 곡물에 대한 관세를 철폐하는 내용의 곡물법 폐지 제안으로 당을 분열시켰습니다. 디즈레일리는 하원에서 필과 충돌하며 당의 주요 인물이 되었습니다. 당의 지도자였던 더비 경이 1850년대와 1860년대에 세 차례 정부를 구성했을 때, 디즈레일리는 재무부 장관과 하원 원내대표를 역임했습니다."
 ENG_desc_salisbury: "로버트 세실 경은 1854년 처음으로 하원에 당선되었고, 1866-1867년 더비 경의 보수당 정부에서 인도 국무장관을 역임했습니다. 1874년, 디즈레일리 정부 하에서 살즈베리는 다시 인도 국무장관으로 돌아왔으며, 1878년 외무장관으로 임명되어 베를린 회의에서 주도적인 역할을 수행했습니다. 1881년 디즈레일리 사망 후, 살즈베리는 보수당의 하원 대표인 스태퍼드 노스코트 경과 함께 상원 내 보수당 지도자로 부상했습니다."
 ENG_desc_john_russel: "베드퍼드 제6대 공작의 셋째 아들인 러셀은 웨스트민스터 스쿨과 에든버러 대학에서 교육을 받은 후 1813년 의회에 입성했습니다. 1828년 그는 가톨릭 신자와 개신교 반대파를 차별했던 '심사율'의 폐지에서 주도적인 역할을 맡았습니다. 그는 왕정복고 이래 첫 주요 의회 개혁이자, 귀족과 지주 계급의 통치에서 민주주의로 나아가는 중요한 초기 단계였던 1832년 개혁법의 주요 입안자 중 한 명이었습니다. 그는 중산층으로 투표권을 확대하고 성장하는 영국의 공업 도시와 시에 선거권을 부여하는 것을 선호했지만, 보편적 참정권을 옹호하지는 않았으며 비밀 투표에 반대했습니다. 러셀은 그의 경력 내내 많은 쟁점에 대해 거침없이 의견을 표명했으며, 1820년대에는 가톨릭 해방을 옹호하고, 1845년에는 곡물법 폐지를 촉구했으며, 1850년에는 교황 비오 9세의 가톨릭 주교구 부활을 비난했고, 1860년대에는 이탈리아 통일을 지지했습니다."
 ENG_desc_gladstone: "글래드스턴은 스코틀랜드계 부모 밑에서 리버풀에서 태어났습니다. 그는 1832년 처음으로 하원에 입성하여 1834년 로버트 필 하에서 보수당이 된 '하이 토리' 당원으로서 정치 경력을 시작했습니다. 글래드스턴은 필의 두 정부에서 모두 장관을 역임했으며, 1846년에는 분파인 필파에 합류했고, 이 분파는 결국 1859년 신생 자유당에 흡수되었습니다. 그는 애버딘 경(1852-1855), 팔머스턴 경(1859-1865), 러셀 경(1865-1866) 밑에서 재무부 장관을 지냈습니다. 기회 균등과 무역 보호주의 반대를 강조한 글래드스턴의 정치적 원리는 '글래드스턴 자유주의'로 알려지게 되었습니다. 노동자 계급 사이에서 그의 인기는 그에게 '인민의 윌리엄'이라는 별명을 안겨주었습니다."
 ENG_desc_cavendish: "알렉산드르 2세 즉위를 위한 러시아 특사 임무에 합류한 후, (당시 '키슬리의 캐번디시 경'으로 불렸던) 로드 캐번디시는 1857년 총선에서 자유당 소속으로 노스 랭커셔에서 당선되며 의회에 입성했습니다(1858년부터 '하팅턴 경'으로 알려진 그의 칭호는 예우 칭호였으며, 그 자신이 귀족이 아니었기 때문에 1891년 아버지의 뒤를 이어 데번셔 공작이 될 때까지 하원 의원으로 활동할 자격이 있었습니다). 1863년에서 1874년 사이에 하팅턴 경은 팔머스턴과 러셀 백작 하에서 해군차관과 전쟁부 부차관을 포함한 다양한 정부 요직을 역임했습니다. 1868년 총선에서 그는 의석을 잃었지만, 아일랜드 총독직을 거절하고 내각에 참여하지 않은 채 우정국장이 되었습니다. 그 다음 해에는 래드너에서 당선되어 하원에 재입성했습니다. 1870년, 하팅턴은 글래드스턴의 첫 정부에서 아일랜드 수석비서관직을 마지못해 수락했습니다."