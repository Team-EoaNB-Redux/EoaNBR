 british_votes.20.t: "식민지 수감자 이송법"
 british_votes.20.a: "이는 우리 식민지, 자치령 및 영토와의 관계에 큰 도움이 될 것이다."
 british_votes.20.b: "그것은 기본적으로 유급 휴가와 같아… 하지만 강간범과 살인범을 위한 것이지. 안 돼."
 british_votes.20.d: "최근 의회에 흥미로운 제안이 제출되었습니다. 이 법안이 통과되면, 수감자들을 징벌의 형태로 식민지에서 식민지로 옮기는 것이 허용됩니다. 예를 들어, 오스트레일리아 사람들이 내륙의 정신병자를 북미의 툰드라로 보내야 한다고 판단한다면, 그러한 일이 허용될 것입니다."
