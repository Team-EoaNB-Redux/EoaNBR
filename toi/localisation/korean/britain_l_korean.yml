l_english:
 britain.1.t: "대악취"
 britain.1.d: "지난 몇 년간 템스강은 하수관과 산업 폐수로 인해 점점 더 오염되었고, 이제 그 상황은 말 그대로 폭발했습니다. 이달의 뜨거운 기온은 강물의 물을 증발시켜 강둑에 엄청난 양의 산업 및 인간 폐기물을 남겼고, 뜨거운 공기와 결합하여 참을 수 없을 정도로 지독한 악취를 풍겼습니다. 이로 인해 강에서의 보트 운행이 거의 완전히 중단되었고, 아무도 자신의 안녕을 위해 더 이상 강 근처에 감히 발을 들여놓지 못하고 있습니다. 우리는 이 문제에 대해 무언가를 해야 합니다!"
 britain.1.a: "역겨워!"
 britain.2.t: "미국 해저 케이블"
 britain.2.d: "지난밤 영국과 미국 외교관들은 지난 몇 달 동안 깔아온 카디프에서 보스턴까지의 해저 케이블이 마침내 완성되자 축하했습니다. 이러한 해저 케이블 중 처음은 아니지만, 아직 완전히 작동하지는 않지만, 우리와 미국인들 사이의 신속한 통신을 가능하게 하는 데 있어 여전히 혁명적이며, 우리는 미래에 이 네트워크의 확장을 기대할 수밖에 없습니다."
 britain.2.a: "기술의 발전은 경이로운 일이다."
 britain.3.t: "아일랜드 공화주의 형제단"
 britain.3.d: "성 패트릭의 날에 가끔 술에 취한 아일랜드인이 독립에 대해 외치면서 영국 경찰을 공격하는 것은 흔한 일이 아닙니다. 그러나 새로운 것은 아일랜드 분리주의자들이 이제 더블린에 '아일랜드 공화주의 형제단'이라고 불리는 조직을 설립했다는 것입니다. 그들의 목표는 아일랜드에 대한 영국의 통치를 끝내는 것입니다. 이에 대해 무엇을 해야 할까요?"
 britain.3.a: "우리는 그들의 모든 움직임을 지켜볼 것이다."
 britain.3.b: "군사 경찰을 보내 조직을 해체하라!"
 britain.4.t: "정치경제학 비판"
 britain.4.d: "런던에 거주하는 유명한 정치 작가 카를 마르크스가 또 다른 책을 출판했는데, 그는 그 책에서 우리 나라의 현재 경제와 자본주의의 일반적인 개념을 공격하고, 동시에 시스템의 정치적 함의에 대해 논하고 있습니다. 현재로서는 판매가 잘 되지 않는 것처럼 보이지만, 여전히 원치 않는 소동을 일으킬 수 있습니다. 이제 질문은: 우리가 개입하기 위해 무엇이든 해야 할까요?"
 britain.4.a: "이것이 아무런 문제도 일으키지 않았으면 좋겠다."
 britain.4.b: "이 책을 즉시 금지하라!"
 britain.4.c: "실제로, 그는 몇 가지 좋은 점을 지적한다..."
 britain.5.t: "그리스가 도움을 요청하다"
 britain.5.d: "오늘, 그리스로부터 우리 궁정으로 메시지가 도착했습니다. 그들은 오스만 제국과의 전쟁에 개입해달라고 요청하고 있습니다."
 britain.5.a: "그들을 돕기"
 britain.5.b: "오스만 제국이 더 중요하다!"
 britain.6.t: "외설 출판물 법안"
 britain.6.d: "두 번째 의회 투표 안건은 외설 출판물 법안입니다. 만약 이 법안이 통과되면, 나체, 성, 과도한 음주 또는 욕설, 그리고 기타 공격적인 내용을 포함하되 이에 국한되지 않는, 일반 대중에게 외설적으로 간주될 수 있는 자료의 출판을 금지할 것입니다. 많은 자유주의자들은 이 법안에 대해 분노하고 있는 반면, 많은 보수주의자들은 이를 지지합니다. 투표 후, 의회는 결정했습니다..."
 britain.6.a: "...우리 사회는 이러한 외설물 없이 더 나을 것이라고."
 britain.6.b: "...우리가 예술과 자유로운 발언에 대한 이러한 억압을 허용할 수 없다고."
 britain.7.t: "울위치에서 감옥선에 불이 붙다!"
 britain.7.d: "오늘 일찍 런던 울위치 해역에서 최근 배에 실린 상당량의 석탄이 자연 발화하면서 대형 목조 감옥선에 불이 붙어 거의 침몰할 뻔했습니다. 죄수들과 승무원들은 가능한 한 빨리 배에서 탈출하려고 노력했지만, 불행히도 모두 탈출하지는 못했습니다. 배의 남은 부분은 이미 조선소에서 해체되고 있으며, 의회는 이제 자국 해역에서 목조 감옥선 사용을 중단하는 제안에 대해 투표하고 있습니다."
 britain.7.a: "끔찍하다!"
 britain.8.t: "세계 최초의 축구팀"
 britain.8.d: "축구는 지난 몇십 년 동안 우리 국민의 마음을 사로잡아 온 비교적 새로운 스포츠이며, 이제 이 스포츠는 프로로 나아가고 있습니다. 최초의 공식 축구팀인 셰필드 FC가 어제 셰필드에 설립되었습니다. 축구의 인기가 이런 식으로 계속 상승한다면, 언젠가 인기 있는 국제적인 스포츠가 될 수도 있습니다!"
 britain.8.a: "그들에게 좋은 일이다!"
 britain.8.b: "무슨 말도 안 되는 소리! 그들은 대신 신사의 스포츠를 해야 한다..."
 britain.9.t: "화이트채플 종 주조소에서 '빅벤' 재주조"
 britain.9.d: "필요에 따라 런던 웨스트민스터 궁전의 시계탑에 있는 '빅벤'이라고 불리는 대종이 화이트채플 종 주조소에서 재주조되었습니다. 새로운 종은 이미 설치되고 있으며, 내일 완전히 작동하기를 바랍니다."
 britain.9.a: "영원히 울리기를!"
 britain.10.t: "찰스 디킨스 순회공연"
 britain.10.d: "유명한 소설가이자 저명한 작가인 찰스 디킨스가 현재 [ENG.GetNameDef]를 순회하며 자신의 책을 전문적으로 낭독하고 있습니다. 그는 자신의 작품을 선보이기 위해 잉글랜드, 아일랜드, 스코틀랜드를 여행할 것이며, 아마도 그 과정에서 문해력에 대한 관심을 불러일으킬 수도 있을 것입니다."
 britain.10.a: "그에게 좋은 일이다."
 britain.11.t: "하이드 파크 시상식"
 britain.11.d: "크림 전쟁에서의 행동에 대한 첫 번째 메달이 오늘 일찍 하이드 파크에서 열린 큰 시상식에서 수여되었습니다. 수상자들은 '빅토리아 십자훈장'이라고 불리는 메달을 빅토리아 여왕으로부터 직접 받았습니다. 총 66개의 메달이 수여되었으며, 첫 번째 메달은 헨리 제임스 래비 사령관이 받았습니다."
 britain.11.a: "얼마나 영광스러운 일인가."
 britain.12.t: "라이오넬 드 로스차일드 의회 입성"
 britain.12.d: "[ENG.GetAdjective] 의회는 오늘 라이오넬 드 로스차일드가 의원으로서 외교 업무에 입문하면서 첫 번째 유대인 대표를 얻었습니다. 자유주의자들과 평등주의자들은 우리가 [ENG.GetNameDef]에서 사회적 차별을 폐지하기 위해 최선을 다하고 있음을 보게 되어 기뻐합니다. 비록 이 모든 소동이 반유대주의자들과 더 급진적인 종교 단체들로부터 비판을 받았지만..."
 britain.12.a: "그에게 행운을 빌어라."
 britain.12.b: "유대인이 의회에?! 그를 쫓아내라!"
 britain.12.c: "비기독교인이 의회에?! 그를 쫓아내라!"
 britain.13.t: "스페인이 적도 기니를 판매하다"
 britain.13.d: "스페인이 우리에게 아프리카 식민지인 적도 기니를 대가로 지불을 제안했습니다. 문제없이 감당할 수 있지만 해당 토지는 거의 가치가 없습니다."
 britain.13.a: "좋아, 사자"
 britain.13.b: "우리는 스페인 식민지에 관심이 없다."
 britain.14.t: "브래드포드 중독 참사"
 britain.14.d: "어제 리즈 근처의 작은 마을인 브래드포드에서 끔찍한 사고가 발생했습니다. 과자 판매 행사에서 생산 과정 중에 실수로 비소가 사용되어 21명이 사망하고 최소 200명이 중독된 사실이 발견되었습니다. 지역 의사들은 피해자들을 돕기 위해 밤낮으로 일하고 있으며, 도시 전체가 충격에 빠졌습니다."
 britain.14.a: "끔찍하다."
 britain.15.t: "런던에 국립 초상화 미술관 개관"
 britain.15.d: "수년간의 건설과 준비 끝에, 국립 초상화 미술관이 마침내 런던에 문을 열었습니다! 이 이미 문화적으로 중요한 기관은 [ENG.GetNameDef]의 모든 예술가들의 초상화를 전시하며, 미술 평론가들은 깊은 인상을 받은 듯합니다."
 britain.15.a: "명망 있는 기관이다!"
 britain.16.t: "사계절 내내"
 britain.16.d: "[ENG.GetNameDef]의 가장 유명한 작가인 찰스 디킨스가 그의 새로운 잡지 \"사계절 내내\"를 막 출판하기 시작했습니다. 이를 위해, 그는 이미 그의 \"두 도시 이야기\"와 같은 책들을 잡지에 연재하기 시작했습니다. 우리 나라의 문학의 황금기인 것처럼 보입니다."
 britain.16.a: "이 디킨스 씨는 바쁜 사람이다."
 britain.17.t: "천문학자, '태양 플레어' 관측"
 britain.17.d: "웨스트 런던의 저명한 천문학자인 리처드 크리스토퍼 캐링턴은 지난밤에 '태양 플레어'라고 불리는 완전히 새로운 것을 관측했다고 주장합니다. 그가 설명하는 것처럼, 태양 표면의 이러한 갑작스러운 밝은 섬광은 이전에 관측된 적이 없었으며, 물리학자들은 이것이 지구에 미치는 영향에 대해 흥분하고 있습니다. 캐링턴 자신은 이미 우리 행성의 자기장이 이것에 영향을 받을 수 있다고 제안하기도 했습니다. 우리 우주는 정말 놀랍습니다..."
 britain.17.a: "흥미로운 현상이다!"
 britain.18.t: "영국 제도에 거대한 폭풍이 닥치다!"
 britain.18.d: "이번 세기 들어 영국을 강타한 가장 큰 폭풍이 지난밤 해안 지역을 황폐화시켰습니다. 거대한 파도와 파괴적인 바람이 저녁 내내 몇 시간 동안 불었습니다. 대부분 상선인 130척의 해군 선박이 침몰하거나 해안에 좌초된 것으로 보고되었으며, 최대 800명이 실종되거나 사망한 것으로 보고되었습니다. 우리 중 일부 더 급진적인 사제들은 이미 이것을 우리의 죄에 대한 신의 벌이라고 부르고 있습니다. 사실이든 아니든, 이 재앙은 나라를 뒤흔들었습니다. 이제 재건을 시작할 시간입니다."
 britain.18.a: "얼마나 비극적인가!"
 britain.19.t: "온두라스에서 워커 발견!"
 britain.19.d: "니카라과의 전 대통령이자 우리의 중앙아메리카 동맹국과 미스키토에 있는 우리 군대에 많은 문제를 일으켰던 유명한 필리버스터이자 미국 용병인 윌리엄 워커가 온두라스에서 발견되었습니다. 워커와 그의 남은 군대는 일부 동조자들에 의해 미스키토 해안에서 재편성하는 것이 허용되었습니다. 필리버스터는 그 후 91명의 병력으로 온두라스를 침공하고 니카라과로 진격하기 시작했지만, 온두라스 군대에 의해 저지되었습니다. 그는 증원군을 데려오고 있는데, 우리는 무엇을 해야 할까요?"
 britain.19.a: "해안을 봉쇄하고 그를 법의 심판대에 세워라. 윌리엄 워커를 제거하라!"
 britain.19.b: "그냥 내버려 둬. 어차피 아무 일도 일어나지 않을 것이다."
 britain.20.t: "워커의 귀환"
 britain.20.d: "바하 칼리포르니아, 소노라, 그리고 대부분의 중앙아메리카를 정복하려 했던 미국인 필리버스터 윌리엄 워커가 돌아와 며칠 만에 테구시갈파를 장악한 민병대를 재결성하고 스스로 온두라스의 새로운 대통령으로 등극했습니다. 이는 니카라과와 엘살바도르 양측으로부터 엄청난 반발을 샀고, 이들은 그에게 사임하거나 전쟁이 일어날 것이라고 요청했습니다. 워커는 사임을 거부했고 워커의 불운한 모험이 또 다른 전쟁으로 이어지는 것 같습니다."
 britain.20.a: "워커가 아직 살아있다고? 뭐?!"
 britain.20.b: "이번에는 그가 죽었는지 확실히 할 것이다!"
 britain.20.c: "또 다시는 안 된다!"
 britain.21.t: "스위스에 있는 영국 관광객"
 britain.21.d: "1863년에 한 영국 여행사가 스위스로의 첫 번째 조직적인 여행을 수행했습니다. 이는 스위스 관광의 길을 열었고 동시에 스위스의 철도망 건설에 대한 인센티브를 제공했습니다. 오늘날에도 영국 관광객은 스위스 외국인 방문객 중 세 번째로 큰 그룹을 차지합니다."
 britain.21.a: "어쩌면, 우리도 그들을 식민지화할 것이다..."
 britain.22.t: "알피니즘의 황금기 (1854-1865)"
 britain.22.d: "알피니즘의 황금기는 1854년 알프레드 윌(1828-1912)의 베터호른 등반과 1865년 에드워드 윔퍼(1840-1911)의 마터호른 등반 사이의 기간입니다. 두 등반가 모두 영국인이었습니다. 많은 주요 알프스 봉우리들이 이 기간 동안 첫 등정을 맞았습니다. 비록 알프레드 윌의 등반이 첫 등정은 아니었지만, 사람들은 알피니즘의 황금기의 시작을 알린 후자의 등반을 기념합니다. 알피니즘의 황금기는 스위스 및 프랑스 가이드와 동행한 영국 알프스 등반가들이 지배했습니다. 이 시대는 윔퍼의 마터호른 등정으로 끝났는데, 이는 3명의 유명한 영국 알피니스트와 1명의 프랑스 알프스 가이드를 포함하여 4명의 죽음을 초래했습니다. 1852년부터 1857년까지 몽블랑에 대한 64번의 성공적인 공격이 있었고, 그 중 단 4번만이 영국인이 아니었습니다."
 britain.22.a: "산들조차 대영 제국에 고개를 숙인다!"
 britain.23.t: "알피니즘의 은기 (1865-1882)"
 britain.23.d: "알피니즘의 은기는 1865년 에드워드 윔퍼의 마터호른 등정 이후 시작되어 1882년 윌리엄 우드맨 그레이엄(1859-1932)의 덴 뒤 제앙 등정으로 끝났습니다. 알피니즘의 황금기(1854-1865)는 알프스의 가장 지배적인 산들 중 많은 것들의 첫 등정으로 특징지어졌지만, 그 이후의 은기는 남겨진 몇 안 되는 가치 있는 봉우리들의 첫 등정으로 구성된 것으로 볼 수 있으며, 이 봉우리들은 더 넓은 대중에게는 대체로 알려지지 않았고, 그렇게 남아 있었습니다. 다른 나라의 많은 등반가들이 알프스 주요 등정가 그룹에 합류했습니다. 영국 등반가들이 이 시대를 지배하지는 않았지만, 여전히 알피니즘의 은기에는 클린턴 토마스 덴트(1850-1912)와 같은 많은 유명한 영국 등반가들이 있었습니다. 그의 알프스 첫 등정에는 페니 알프스의 렌츠슈피체(1870)가 포함됩니다. 대영 제국의 빅토리아 여왕이 1868년에 스위스 루체른에서 휴가를 보냈다는 기록이 있습니다. 이는 나중에 스위스에 대한 더 많은 영국의 관심을 이끌어냈습니다."
 britain.23.a: "흥미롭다"
 britain.24.t: "존 스튜어트 밀 - 자유론, 1858"
 britain.24.d: "『자유론』은 원래 짧은 에세이로 의도되었던 영국 철학자 존 스튜어트 밀의 철학적 작품입니다. 1859년에 출판된 이 작품은 밀의 공리주의 윤리 체계를 사회와 국가에 적용합니다. 밀은 권위와 자유 사이의 관계에 대한 기준을 수립하려고 시도합니다. 그는 공리주의의 최고선(summum bonum)인 더 높은 쾌락의 전제 조건으로 그가 생각한 개인성의 중요성을 강조합니다. 또한, 밀은 민주주의 이상이 \"다수의 횡포\"를 초래한 과거의 개인성을 옹호하려는 시도의 오류를 비판합니다. 이 작품에 수립된 기준 중에는 밀의 세 가지 기본 개인의 자유, 정부 개입에 대한 그의 세 가지 정당한 반대, 그리고 개인과 사회의 관계에 관한 그의 두 가지 격언이 있습니다."
 britain.24.a: "흥미로운 책이다..."
 britain.24.b: "쓰레기 같은 소리!"
 britain.25.t: "1862년의 공포"
 britain.25.d: "런던에서는 몇 건의 강도와 살인 사건, 그리고 물론 뉴스 매체 덕분에 범죄에 대한 두려움이 지속적으로 재발하는 문제였습니다. 특히, 팔이나 철사, 끈 또는 천 조각을 사용하여 다른 사람의 목을 조르는 소위 \"가로팅\" 사건은 런던 시민들의 가장 날카로운 신경을 건드리는 것처럼 보였으며, 가로팅에 대한 두려움은 1860년대에 최고조에 달했습니다. 가로팅과 그것이 당시 얼마나 널리 보도되었는지에 대한 이상한 점은, \"1862년 가로팅 공포\"의 절정기에도 실제로 그렇게 흔하지 않았다는 것입니다. 그렇다면 왜 공포였을까요? 밝혀진 바에 따르면, 가로팅 자체는 런던에서 결코 큰 문제가 아니었지만, 그 시대의 신문들은 그것을 보도하는 것을 정말 좋아했습니다. 이로 인해 실제로 발생한 몇몇 고립된 사건들이 지나치게 과장되어 보도되었고, 런던 시민들은 거리가 철사 조각으로 무장한 떠돌이 폭도들로 가득 차 있다고 믿게 되었습니다."
 britain.25.a: "흥미롭다"
 britain.26.t: "우주 여행"
 britain.26.d: "스코틀랜드의 매우 저명한 과학자 윌리엄 라이치가 최근 \"우주 여행\"이라는 제목의 에세이를 출판했습니다. 그는 이 에세이에서 완전히 새로운 개념을 소개합니다. 즉, 포병에 사용될 로켓을 사용하여 \"지구의 경계를 넘어 우주를 여행하는\" 것입니다! 몽상가와 기술 애호가들은 이것의 실현 가능성에 대해 논쟁하며 들끓고 있지만, 지난 몇 세기 동안 로켓 기술이 실행되고 변하지 않은 것을 고려할 때, 전문가들은 이런 일이 결코 가능할 가능성이 없다고 추정합니다."
 britain.26.a: "정말 터무니없는 제안이다!"
 britain.26.b: "아무것도 아니라면, 로켓 포병 기술에 자금을 투자해야 한다는 좋은 알림이 될 것이다."
 britain.27.t: "앨버트 왕자"
 britain.27.d: "오늘 이사회에서 그의 왕실 전하 앨버트 왕자에게 왕자 배우자의 칭호와 존엄을 부여하는 특허장 초안이 낭독되었습니다. 여왕 폐하는 이를 고려하고, 그의 개인 위원회의 조언을 받아 이를 승인하고, 이에 따라 명령합니다. 즉, 여왕 폐하의 수석 비서 중 한 명인 조지 그레이 경 준남작은 대영 제국의 대법인 하에서 해당 초안에 부합하는 특허장이 통과되도록 여왕 폐하의 서명을 위한 영장을 준비해야 합니다."
 britain.27.a: "런던 가제트가 이 소식을 보도한다"
 britain.28.t: "앨버트 왕자 병"
 britain.28.d: "앨버트 왕자 배우자는 심한 복통으로 심각하게 아팠습니다. 이는 고립된 사건이 아니며, 왕자는 만성적인 위장병을 앓고 있습니다. 그는 빅토리아 여왕의 의무를 계속 도울 것입니다."
 britain.28.a: "신이 왕자를 구하시기를"
 britain.32.t: "존경받는 참전용사 수상"
 britain.32.d: "오늘 여왕 폐하께서 하이드 파크에서 자비롭게도 최초의 빅토리아 십자훈장 66개를 소개하고 수여했습니다. 지난 해 1월에 제정된 이 군사 훈장은 오직 영국의 가장 용감하고 신사적인 전사들에게만 수여됩니다. 그들은 어려운 시기에 절대적인 전쟁에 직면하여 절대적인 용기를 가지고 맞섰습니다. 이 나라의 사자로 열정적으로 장식된, 그 아래에 단순하지만 인상적인 선언이 적혀 있는 소박한 청동 십자가보다 더 이 영광을 잘 나타낼 수 있는 방법이 있을까요?"
 britain.32.a: "용기를 위하여."
 britain.33.t: "아일랜드 종교 폭동"
 britain.33.d: "아일랜드 가톨릭 신자, 아일랜드 개신교 신자, 그리고 지역 경찰이 충돌하면서 벨파스트의 거리와 벽은 피로 물들었습니다. 우리 보고서에 따르면 경찰은 실제로 아일랜드 개신교 신자들의 편을 들었으며, 이는 의심할 여지 없이 우리의 푸른 섬 이웃들과의 빛나는 연합에 대한 지지를 보여주기 위한 것입니다. 사랑받는 [그리고 진정시키는] '으르렁대는' 휴 해나가 충돌 현장에 있었고, 많은 사람들은 그가 폭력과 반가톨릭 편협함을 촉구함으로써 상황을 악화시켰다고 인용했습니다. 우리 대영 제국의 객관적인 언론인으로서 이 비난에 대한 전문적인 의견을 제시하자면, 저는 그러한 일은 끔찍한 일이라고 결론내려야 할 것입니다. 저는 우리의 안정시키는 손길로 축복받은 사람들이 로마에 충성을 맹세할 것이라고는 기대하지 않았을 것입니다. 다른 곳, 데리, 포타운, 그리고 러건에서도 피가 흐르고 있습니다."
 britain.33.a: "이것이 그들이 우리에게 감사하는 방식인가?"
 britain.34.t: "멘델스존의 결혼 행진곡"
 britain.34.d: "엄숙한 성 제임스 궁전에서 열린 빅토리아 공주와 프리드리히 왕자의 결혼식에 참석한 존경받는 손님들을 위해, 그들 모르게 지구상의 거의 모든 결혼식에서 연주될 만큼 문화적 힘을 얻게 될 새로운 멜로디가 그들의 귀를 즐겁게 했습니다. 이는 오늘날까지 영국 문화가 얼마나 광범위한지를 보여주는 많은 예 중 하나에 불과합니다. 비록 그들의 제국에 이미 해가 졌을지라도, 영국은 여전히 그들이 퍼뜨리는 데 기여한 음악, 언어, 의복, 그리고 철학에 대해 많은 존경을 받아야 합니다."
 britain.34.a: "나는 그들의 결혼식 노래와 으깬 완두콩에 대해 전혀 신경 쓰지 않는다."
 britain.35.t: "클레이턴-불워 조약"
 britain.35.d: "우리와 미국인들은 오랫동안 중앙아메리카의 모스키토 해안의 지위에 대해 논쟁해 왔습니다. 우리는 이 중앙아메리카의 일부가 우리 식민지 벨리즈의 일부이며, 미국인들이 과거에 우리의 정착을 용인했으므로, 이것 또한 용인해야 한다고 오랫동안 주장해 왔습니다. 그들은 이것이 완전히 별개의 문제이며, 이 땅을 '정당한 소유자'인 온두라스와 니카라과에 반환하기를 원한다는 의견입니다. 우리는 이 요구에 동의해야 할까요?"
 britain.35.a: "Why keep such a disease-ridden place?"
 britain.35.b: "우리는 우리의 역사적 주장을 포기하지 않을 것이다!"
 britain.36.t: "이상한 나라의 앨리스"
 britain.36.d: "『이상한 나라의 앨리스』는 영국 작가 찰스 루트위지 도지슨이 루이스 캐럴이라는 가명으로 쓴 소설입니다. 이 소설은 앨리스라는 어린 소녀가 토끼 굴에 빠져 이상하고 의인화된 생물들이 사는 판타지 세계로 들어가는 이야기를 다룹니다. 『이상한 나라의 앨리스』는 1865년에 출판되었는데, 찰스 루트위지 도지슨과 로빈슨 더크워스 신부가 1862년 7월 4일에 헨리 리델의 세 어린 딸(로리나 샬럿 리델(13세, 1849년생, 책의 서문 시에서 '프리마'); 앨리스 플레장스 리델(10세, 1852년생, 서문 시에서 '세쿤다'); 에디스 메리 리델(8세, 1853년생, 서문 시에서 '테르티아'))과 함께 아이시스 강에서 보트를 타고 노를 저은 지 3년 후입니다. (이 '황금빛 오후'의 인기 있는 날짜는 착각이거나 또 다른 앨리스 이야기일 수 있는데, 그날은 시원하고 흐리고 비가 왔기 때문입니다.)"
 britain.36.a: "훌륭한 읽을거리"
 britain.37.t: "여성 참정권 국민협회"
 britain.37.d: "여성 참정권 국민협회는 여성의 투표권을 위해 캠페인을 벌인 영국 최초의 전국 단체였습니다. 1867년 11월 6일 리디아 베커에 의해 결성된 이 조직은 여성 참정권 운동의 토대를 마련하는 데 도움이 되었습니다. 엘리자 위엄, 제인 위엄, 그리고 그들의 친구들 중 일부는 이 국민협회의 에든버러 지부를 설립했습니다. 엘리자와 그녀의 친구 아그네스 맥클라렌은 비서가 되었습니다. 이 국민협회는 나중에 여성 참정권 협회 국민연합과 여성 사회정치 연합에 의해 더욱 발전했습니다."
 britain.37.a: "폐쇄하라!"
 britain.37.b: "지지하라!"
 britain.38.t: "네이처 최초의 과학 저널"
 britain.38.d: "19세기 동안 과학과 수학의 엄청난 발전은 대부분 독일어나 프랑스어뿐만 아니라 영어로도 작성된 저널에 기록되었습니다. 영국은 특히 19세기 후반에 엄청난 기술적, 산업적 변화와 발전을 겪었습니다. 이 시기에 가장 존경받는 과학 저널은 아이작 뉴턴, 마이클 패러데이부터 찰스 다윈의 초기 작품에 이르기까지 많은 위대한 작품을 출판한 왕립 학회의 심사 저널이었습니다. 게다가 이 기간 동안, 대중 과학 정기 간행물의 수는 1850년대부터 1860년대까지 두 배로 늘어났습니다. 이 출판물들은 '과학의 장기' 역할을 하도록 설계되었으며, 본질적으로 대중을 과학계에 연결하는 수단이었습니다."
 britain.38.a: "알게 되어 기쁘다."
 britain.39.t: "잉글랜드 대 스코틀랜드 축구 경기"
 britain.39.d: "축구에 대한 첫 번째 상세한 설명은 1174년에서 1183년경 윌리엄 피츠스티븐에 의해 주어졌습니다. 그는 성탄절 전야 축제 기간 동안 런던 청소년들의 활동을 묘사했습니다. 1863년 10월 26일 런던 그레이트 퀸 스트리트에 있는 프리메이슨 주점에서 열린 축구 협회 첫 회의 이전에는 축구 경기를 위한 보편적으로 받아들여지는 규칙이 없었습니다. 런던 코번트 가든 근처, 81-82 롱 에이커에서 열린 여섯 번의 회의는 축구 협회와 10년 후 미래의 럭비가 될 것 사이의 분열로 끝났습니다. 그들 모두는 그들만의 유니폼, 의식, 몸짓, 그리고 고도로 형식화된 규칙을 가지고 있었습니다. 1870년에서 1872년 사이에, 축구 협회(FA)는 잉글랜드와 스코틀랜드를 대표하는 팀들 사이에 5번의 대표 축구 경기를 조직했고, 모두 런던에서 열렸습니다. 이 경기들 중 첫 번째는 1870년 3월 5일 디 오벌에서 열렸습니다."
 britain.39.a: "스코틀랜드가 이겼다!"
 britain.39.b: "무승부."
 britain.39.c: "잉글랜드가 이겼다!"
 britain.40.t: "영국 적십자사 창립"
 britain.40.d: "1870년 8월 4일, 공개 회의 후, '전쟁에서 병자와 부상자를 돕기 위한 영국 국립 사회'가 결성되었습니다. 이 단체는 적십자 엠블럼의 보호 아래 프랑스-프로이센 전쟁과 이후 19세기 분쟁에서 양측 교전군에 대한 원조를 제공하는 것을 도왔습니다. 이 단체는 전쟁에 참전한 여러 영국 자원 의료 단체 중 하나였습니다."
 britain.40.a: "우리 군인들의 안전이 중요하다!"
 britain.41.t: "크림 전쟁 승전 기념비?"
 britain.41.d: "런던에 크림 전쟁을 기념하는 웅장한 승전 기념비를 건설하자는 제안이 있었지만, 지금 당장 우리가 그것을 감당할 수 있을지는 아무도 확신하지 못하고 있습니다. 우리는 결정을 내려야 합니다."
 britain.41.a: "건설하게 하라!"
 britain.41.b: "지금 당장 이것에 돈을 쓸 여유가 없다."
 britain.42.t: "하틀리 탄광 재앙"
 britain.42.d: "하틀리 탄광의 터널 붕괴로 많은 노동자와 소년들이 붕괴하는 터널 안에서 목숨을 잃는 거대한 재앙이 발생했습니다. 이 재앙으로 인해 탄광은 더 이상 운영될 수 없게 되었으며, 다시 사용하기 위해서는 손상을 수리해야 합니다. 무엇을 해야 할까요?"
 britain.42.a: "그들에게 원조를 보내라."
 britain.42.b: "우리가 할 수 있는 일은 아무것도 없다."
 britain.44.t: "셰필드 대홍수"
 britain.44.d: "오늘 밤, 브래드필드 데일의 데일 다이크 댐이 처음으로 물을 채우는 동안 붕괴되어 록슬리 계곡을 거대한 물줄기가 덮쳤습니다. 이 지역은 황폐화되었고, 많은 기반 시설이 파괴되었습니다."
 britain.44.a: "피해자들에게 도움을 보내라."
 britain.44.b: "그 지역은 결국 회복될 것이다."
 britain.45.t: "'구세군'"
 britain.45.d: "런던의 이스트 엔드에서 지난 며칠 동안 새로운 운동인 '구세군'이 형성되었습니다. 가난한 사람들을 매춘과 같은 직업에서 벗어나게 하고 그들에게 원조를 제공함으로써 기독교를 소개하는 데 전념하는 이 기관은 군대를 모델로 하고 있으며, 심지어 자체 깃발과 노래도 가지고 있습니다."
 britain.45.a: "좋은 시도다!"
 britain.46.t: "마터호른 등정!"
 britain.46.d: "8번의 실패 끝에, 마터호른이 마침내 영국인에 의해 처음으로 등정되었습니다! 에드워드 윔퍼와 그의 일행은 위험한 절벽을 오르는 데 성공했고, 그렇게 하면서 [ENG.GetNameDef]에 명성을 얻었습니다."
 britain.46.a: "만세!"
 britain.47.t: "[ENG.GetNameDef] 최초의 여성 의사"
 britain.47.d: "우리나라 최초의 여성 의사가 며칠 전 대학을 졸업했습니다. 엘리자베스 개릿 앤더슨은 많은 사람들에게 논쟁적인 인물로, 일부에게는 역할 모델로, 일부에게는 웃음거리로 여겨집니다. 어쨌든, 의사가 한 명 더 늘어나는 것이 우리 나라에 해가 될 수는 없을 것입니다."
 britain.47.a: "대단하다."
 britain.48.t: "오크스 탄광 폭발 참사!"
 britain.48.d: "[ENG.GetNameDef]에서 오늘까지 기록된 최악의 탄광 재앙이 발생했습니다. 많은 사람들이 지하 갱도에서 일하고 있는 동안 거대한 폭발이 일어났기 때문입니다. 보고서에 따르면 오크스 주변의 이웃들은 그 이후로 3분 더 흔들림을 느꼈다고 합니다. 요크셔에 끔찍한 재앙입니다."
 britain.48.a: "생존자들을 돕기 위해 우리가 할 수 있는 일을 하라."
 britain.48.b: "음, 그곳은 당분간 다시 운영되지 않을 것이다."
 britain.49.t: "알프레드 노벨, 다이너마이트 발명!"
 britain.49.d: "우리 나라의 저명한 공학자 알프레드 노벨이 '다이너마이트'라는 혁신적인 새로운 발명품을 내놓았습니다. 이 장치는 도화선에 불을 붙이면 몇 초 후에 전례 없는 폭발력을 발휘할 수 있습니다. 이것은 분명 전쟁과 광업 모두에서 유용하게 사용될 것입니다..."
 britain.49.a: "이것은 잠재력이 있다..."
 britain.50.t: "피니언 폭탄범 공개 교수형"
 britain.50.d: "오늘 아일랜드의 문제아 마이클 배럿이 아일랜드 분리주의를 위해 싸우는 반란군 조직인 피니언 형제단에서의 활동의 일부로 그가 퍼뜨린 테러에 대한 대가로 교수형에 처해질 것입니다."
 britain.50.a: "이것이 아일랜드인들에게 경고가 되게 하라."
 britain.50.b: "그를 아일랜드에 대한 억압을 정당화하는 데 사용하라."
 britain.51.t: "새로운 원소 발견: '헬륨'"
 britain.51.d: "영국 천문학자 노먼 로키어는 방금 그리스어 '헬리오스'('태양'을 의미)의 이름을 따 '헬륨'이라는 새로운 원소를 발견했습니다. 이것은 태양 스펙트럼에서 노란색 선으로 관측되었습니다. 비슷한 관측은 올해 초 프랑스 천문학자에 의해 이루어졌지만, 지금껏 구체적인 것으로 이어지지 않았습니다."
 britain.51.a: "우리는 우리 세계의 과학적 현실을 이제 막 밝혀내기 시작했다."
 britain.52.t: "대영 제국 — 1857"
 britain.52.d: "대영 제국은 대영 왕국의 주권과 영국 정부의 통치 아래 들어온 복잡한 종속국, 식민지, 보호령 및 기타 영토로 이루어진 전 세계적인 시스템이었습니다.\n\n비록 제국이 권력의 절정에 있지만, 많은 문제들이 여전히 우리를 위협하고 있습니다. 가장 중요한 것은, 현재 세포이 반란이 1856년 5월 10일, 델리 바로 북동쪽에 있는 동인도 회사의 주둔 도시 미루트에서 시작된 반란이라는 점입니다. 미루트에서의 반란에 이어, 주로 갠지스강 상류와 인도 중부 지역에서 더 많은 민간인 및 군대 반란이 발발했습니다. 반란의 사건들은 인도 중부에만 국한되지 않았으며, 다른 것들은 더 북쪽과 동쪽에서 발생했습니다.\n\n인도 반란은 침략적인 영국식 사회 개혁, 가혹한 토지세, 일부 부유한 지주와 왕자들에 대한 즉결 처분, 그리고 영국 통치에 의해 가져온 개선에 대한 회의론을 포함한 다양한 인식에서 비롯된 분노에 의해 촉발되었습니다. 대중의 반란과 불안은 그 지역에서 영국 세력에 상당한 위협을 가합니다. 만약 우리 군대가 이 위협을 처리할 수 없다면, 세계 최강대국으로서의 우리의 입지는 국내외적으로 의심스러워질 것입니다...\n\n산업 혁명의 시작과 함께, 앞서 나가기 위해 기술과 사회의 많은 발전이 이루어져야 하며, 이로 인해 발생한 문제는 주요 사회주의 연합 봉기와 낮은 임금 및 안전하지 않은 작업 조건에 대한 그들의 문제입니다. 또 다른 문제가 더해졌습니다. 비슷하게, 최근 몇 년 동안 아일랜드의 지위가 문제시되어 왔습니다. 이 지역의 불안이 증가함에 따라, 시간이 지나면서 우리는 아일랜드의 분노에 대한 깨끗하고 피 없는 결과를 보장하기 위해 이 상황을 어떻게 다룰지에 대한 문제에 직면할 것입니다.\n\n앞으로 몇 년 동안은 신중함이 표준이 될 것입니다. 많은 결정들이 20세기의 톱니바퀴를 돌릴 것이며, 중요하게는 그 안에 있는 영국의 위치를 결정할 것입니다. 아주 작은 실수조차도 도미노 효과를 일으켜 우리의 위대한 제국이 함께 무너질 수 있습니다."
 britain.52.a: "하느님, 여왕 폐하를 구하소서!"
 britain.53.t: "큐피트 경"
 britain.53.d: "일부 사람들은 팔머스턴을 여색가라고 불렀습니다. 타임스는 그를 큐피트 경(그의 젊은 외모 때문에)이라고 불렀고, 그는 79세의 나이에 1863년 이혼 소송에서 공동 피고로 언급되었습니다. 이 스캔들은 우리의 정치적 상황에 해를 끼칠 수 있습니다."
 britain.53.a: "두고 보겠다"
 britain.54.t: "큐피트 경 - 스캔들 만연"
 britain.54.d: "스캔들은 우리 총리에 대한 신뢰를 흔들었습니다."
 britain.54.a: "이것은 용납할 수 없다"
 britain.55.t: "큐피트 경 - 스캔들 폭로"
 britain.55.d: "스캔들은 협박 시도에 불과한 것으로 드러났습니다. 우리는 우리 당에 대한 신뢰를 강화했습니다."
 britain.55.a: "아주 잘했어"
 britain.56.t: "부패한 선거"
 britain.56.d: "1865년 총선은 동시대인들에게 전국적으로 일반적으로 지루한 경쟁으로 간주되었으며, 이는 개별 선거구 내의 부패 정도를 과장했습니다. 그의 박사 학위 논문에서 코르넬리우스 오리어리는 타임스가 \"1865년 총선에서 이전에는 알려지지 않았던 것보다 더 풍부하고 부패한 지출이 있었다는 증언은 만장일치이다\"라고 보도했다고 설명했습니다."
 britain.56.a: "우리는 행동해야 한다"
 britain.57.t: "앨리스 공주의 결혼"
 britain.57.d: "빅토리아 여왕은 자녀들이 사랑으로 결혼하기를 바란다고 표현했지만, 이것이 반드시 유럽의 왕가 밖의 사람에게 구혼자를 확대하는 것을 의미하지는 않았습니다. 여왕은 그녀의 딸 빅토리아에게 유럽의 적격한 왕자들의 명단을 작성하도록 지시했습니다. 그녀의 탐색은 오렌지 공자, 그리고 프로이센의 앨버트 왕자라는 세 명의 적합한 후보만을 찾아냈습니다. 오렌지 공자는 최근 빅토리아 여왕이 직접 그를 살펴볼 수 있도록 윈저 성으로 여행했지만, 그는 앨리스에게 불쾌감을 주었습니다. 공자 역시 친영국적인 그의 어머니의 강한 압력에도 불구하고 앨리스에게 거의 관심을 보이지 않았습니다. 프로이센의 프레데릭 왕자가 그의 사촌이 \"최고를 받을 자격이 있는 사람\"에게는 적합하지 않을 것이라고 말하면서 앨버트 왕자 역시 거절당했습니다. 사소한 독일 왕족인 헤세의 루이도 제안되었습니다. 루이는 윈저를 방문했고, 왕자와 앨리스는 서로 잘 지냈습니다. 그러나 다른 두 왕자는 사소한 독일 국가에 비해 훨씬 더 강력한 동맹을 가져올 것입니다. 앨리스 공주는 누구와 결혼해야 할까요? 강력한 동맹을 위한 오렌지 공자나 프로이센의 앨버트 왕자, 아니면 사랑을 위한 헤세의 루이 왕자?"
 britain.57.a: "오렌지 공자"
 britain.57.b: "프로이센의 앨버트 왕자"
 britain.57.c: "헤세의 루이 왕자"
 britain.58.t: "웨일스 공의 결혼"
 britain.58.d: "그의 난봉꾼 같은 행동을 바꾸기 위해, 여왕 폐하는 웨일스 공을 위해 결혼을 주선하고 싶어 합니다. 여왕은 빅토리아 공주의 도움을 받아 두 가지 적합한 선택지를 찾았습니다. 덴마크의 알렉산드리아 공주는 빅토리아가 그에게 완벽한 짝이라고 생각했습니다. 그러나 이는 슐레스비히-홀슈타인을 둘러싼 긴장 고조로 인해 프로이센과 문제를 일으킬 수 있습니다. 하지만 강력한 동맹을 가져올 수도 있습니다. 두 번째 가능한 선택지는 비드의 엘리자베스이며, 여왕은 엘리자베스를 매우 선호하지만 그녀는 왕자의 '취향'에 맞지 않습니다. 웨일스 공은 누구와 결혼해야 할까요? 행복한 결혼으로 끝날 가능성이 높지만 프로이센과 문제를 일으킬 수 있는 덴마크 공주? 아니면 영국과 프로이센 사이에 적대적인 긴장을 유발하지 않도록 비드의 엘리자베스?"
 britain.58.a: "덴마크의 알렉산드리아 공주"
 britain.58.b: "비드의 엘리자베스"
 britain.59.t: "헬레나 공주의 결혼"
 britain.59.d: "빅토리아는 헬레나의 미래 남편이 여왕 근처에 살 준비가 되어 있어야 한다고 주장하여 그녀의 딸을 가까이에 두려 했습니다. 그녀의 선택은 결국 슐레스비히-홀슈타인의 크리스티안 왕자에게 돌아갔습니다. 그러나 이 결합은 정치적으로 어색했고, 왕실 가족 내에 심각한 균열을 일으켰습니다. 웨일스 공주는 '공국들은 아빠의 것이다'라고 외치며 이 결혼에 경악했습니다. 크리스티안의 가족과 수년간 개인적인 친구였던 프로이센의 황태자비는 제안된 동맹을 열렬히 지지했습니다. 헬레나는 크리스티안과 함께 행복했고 그와 결혼하기로 결심했습니다."
 britain.59.a: "축하합니다"
 britain.60.t: "루이스 공주의 결혼"
 britain.60.d: "유럽의 주요 왕가들이 다양한 구혼자들을 제안했습니다. 알렉산드라 공주는 그녀의 오빠인 덴마크의 황태자를 제안했지만, 이것은 영국에서 인기가 없을 것입니다. 오렌지 공자 윌리엄도 구혼자로 고려되었지만, 그는 파리에서 공공연하게 연인과 함께 사치스러운 생활을 했습니다. 루이스는 어떤 왕자와의 결혼도 바람직하지 않다고 생각했으며, 아가일 공작의 상속자인 존 캠벨, 로르네 후작과 결혼하기를 원했습니다. 군주의 딸과 영국 신민 사이의 결혼은 1515년 이후 공식적인 인정을 받지 못했습니다. 공주는 누구와 결혼해야 할까요? 어딘가에 큰 혼란을 일으킬 공주 중 한 명, 아니면 300년 이상 만에 처음으로 영국 신민과?"
 britain.60.a: "덴마크의 황태자"
 britain.60.b: "프로이센의 앨버트 왕자"
 britain.60.c: "오렌지 공자"
 britain.60.e: "존 캠벨"
 britain.61.t: "아서 왕자의 결혼"
 britain.61.d: "아서는 프레데릭 찰스 왕자의 딸이자 독일 황제인 아서의 대부인 빌헬름 1세의 외조카인 프로이센의 루이스 마거릿 공주와 결혼했습니다."
 britain.61.a: "축하합니다"
 britain.62.t: "레오폴드 왕자의 결혼"
 britain.62.d: "영국 군주는 다른 통치하는 개신교 가문과 결혼해야 한다고 빅토리아는 발데크-피르몬트의 통치 왕자인 조지 빅터의 딸 헬렌 프레데리카 공주와의 만남을 제안했습니다. 그러나 레오폴드는 애쉬버튼 경의 딸 메리 배링을 매우 좋아했지만, 그녀도 그를 똑같이 좋아했습니다. 왕자는 누구와 결혼해야 할까요? 독일 공주 아니면 귀족의 어린 딸?"
 britain.62.a: "발데크와 피르몬트의 헬렌 공주"
 britain.62.b: "애쉬버튼 경의 딸 메리 배링"
 britain.63.t: "베아트리스 공주의 결혼"
 britain.63.d: "베아트리스가 다름슈타트에서 돌아온 후 어머니에게 결혼할 계획이라고 말했을 때, 여왕은 무서운 침묵으로 반응했습니다. 그들은 나란히 있었지만, 여왕은 7개월 동안 그녀에게 말을 하지 않고 쪽지로 소통했습니다. 여왕의 행동은 가족조차 예상하지 못했던 것으로, 딸을 잃을 것이라는 위협으로 인해 촉발된 것처럼 보였습니다. 여왕은 베아트리스를 그녀의 '아기'로 여겼습니다. 웨일스 공주와 프로이센의 황태자비가 베아트리스가 왕자 배우자에게 가져다준 행복을 그녀의 어머니에게 상기시키면서 미묘한 설득을 하자, 여왕은 베아트리스에게 다시 말을 하기 시작했습니다. 빅토리아 여왕은 헨리가 독일에서의 약속을 포기하고 베아트리스와 여왕과 함께 영구히 살아야 한다는 조건으로 결혼에 동의했습니다."
 britain.63.a: "축하합니다"
 britain.64.t: "[ENG.GetNameDef]가 노동조합을 금지하다!"
 britain.64.d: "[ENG.GetAdjective] 정부의 짧은 논쟁 끝에, 오늘 날짜로 [ENG.GetNameDef]에서 노동조합이 금지될 것이라고 결정되었습니다. 이 결정은 이미 많은 사람들의 칭찬과 비판을 받았지만, 확실히 노동자들을 희생시키면서 [ENG.GetAdjective] 공장 생산량을 향상시키는 데 도움이 되었습니다. 상황이 앞으로 어떻게 더 발전할지는 지켜봐야 합니다."
 britain.64.a: "마침내, 우리는 그들로부터 벗어났다."
 britain.64.b: "그들의 국회의원들은 계급 반역자들이다!"
 britain.64.c: "현명한 움직임일 수도 있다."
 britain.65.t: "앨버트 왕자 배우자의 죽음"
 britain.65.d: "42세의 앨버트 왕자 배우자가 사망했습니다.\n이는 영국 왕실과 영국 전체에게 비극입니다. 빅토리아 여왕과 9명의 자녀를 둔 것 외에도, 앨버트 왕자 배우자는 그녀의 임무를 도왔습니다.\n앨버트 왕자 배우자는 그의 진보적이고 자유주의적인 생각으로 알려져 있었습니다. 그는 대학 교육, 복지, 왕실 재정 및 노예 제도에 대한 개혁을 이끌었습니다.\n그는 또한 과학, 예술 및 산업에 대한 그의 관심으로 알려져 있습니다. 모두가 그가 1851년 전시회를 위한 왕립 위원회의 회장이었으며 하이드 파크에 크리스탈 궁전을 건설한 것을 기억합니다.\n앨버트 왕자 배우자의 마지막 매장지가 될 왕실 영묘가 프로그모어에 건설 중입니다.\n빅토리아 여왕은 깊은 애도의 상태에 빠져들고 있습니다."
 britain.65.a: "하느님, 여왕 폐하를 구하소서"
 britain.65.b: "황태자는 그의 장인의 장례식에 참석할 것이다"
 britain.65.c: "하느님, 여왕 폐하를 구하소서"
 britain.66.t: "셰필드 F.C.의 설립"
 britain.66.d: "지역 셰필드 크리켓 클럽의 회원인 나다니엘 크레스윅과 윌리엄 프레스트는 어젯밤 셰필드 하이필드 교외에 있는 '파크필드 하우스'에 모여 셰필드 축구 클럽(셰필드 F.C.)을 창설했습니다. 크레스윅과 프레스트는 새로 개발된 '축구' 경기를 위한 몇 가지 규칙을 초안하는 임무를 맡기로 합의했습니다. 이 새로운 경기가 무엇을 의미하고 일반 대중에게 얼마나 인기가 있을지 지켜봅시다."
 britain.66.a: "크리켓에 비하면 가망이 없다, 내가 장담한다!"
 britain.67.t: "빅토리아 호"
 britain.67.d: "현재 아프리카에서 나일강의 근원을 찾고 있는 야심찬 영국인 존 해닝 스피크가 우리에게 돌아와 케냐와 우간다 지역 근처의 중앙 아프리카에 위치한 거대한 호수에 대해 말해주었습니다. 우리 폐하를 기리기 위해 그는 그 호수를 '빅토리아 호'라고 명명했습니다. 비록 나일강의 근원은 아니지만, 그것은 아프리카에서 지금까지 발견된 가장 큰 호수이며, 그 발견은 스피크와 우리 나라 모두에게 명성과 영광을 가져다줄 것입니다."
 britain.67.a: "얼마나 대단한가!"
 britain.68.t: "1859년 총선"
 britain.68.d: "올해로 예정된 선거가 오늘 일찍 치러졌고, 결과가 나왔습니다:"
 britain.68.a: "자유당이 승리했다."
 britain.68.b: "보수당이 승리했다."
 britain.69.t: "살인 공모 법안"
 britain.69.d: "영국 의회는 최근 프랑스에서 일어난 오르시니 사건에 따라 살인 공모 법안에 대해 논쟁을 벌여왔습니다. 양측의 심한 당파성으로 인해 논쟁은 상당히 격화되었습니다. 자유당은 팔머스턴 경이 법안이 거부될 경우 사임하겠다고 위협할 정도로 제안된 법안을 강력히 지지하는 반면, 보수당은 그 법안이 불필요하다고 주장합니다. 의회에서 몇 시간 동안의 논쟁 끝에 결정되었습니다..."
 britain.69.a: "...우리는 이런 법안이 필요 없다고."
 britain.69.b: "...법안이 매우 필요하다고."
 britain.70.t: "팔머스턴 경 사임!"
 britain.70.d: "의회에서 위협했던 대로, 팔머스턴 경은 불과 몇 시간 전에 내려진 결정인 반테러법 거부에 대해 실제로 사임했습니다. 선거는 아직 약 1년 남았으므로, 의회가 다른 결정을 내리기 위해 투표하지 않는 한, 보수당의 에드워드 스미스-스탠리가 그를 대신할 것으로 예상됩니다."
 britain.70.a: "그렇다면 우리는 아마도 조기 선거를 치러야 할 것이다."
 britain.71.t: "일본과의 조약?"
 britain.71.d: "우리가 [JAP.GetNameDef]와 우정과 상호 상업 활동에 참여할 의도를 선언하는 조약에 서명해야 한다는 제안이 있었습니다. 우리는 아직 [JAP.GetName]에 대한 우리의 외교 정책을 명확하게 결정하지 않았으므로, 이 문제는 작은 투표에 부쳐졌습니다. 우리는 무엇을 해야 할까요?"
 britain.71.a: "조약이 유효하다고 선언하라!"
 britain.71.b: "일본인들과 조약을 맺는다고? 안 돼."
 britain.72.t: "군사 예산 조정"
 britain.72.d: "영국은 새로운 시대에 접어들고 있으며 우리는 군사 예산을 재평가해야 할 것입니다. 보수당은 증액을 요구하고 있는 반면, 자유당은 그 반대를 원합니다. 중도파는 그냥 그대로 두자고 제안합니다."
 britain.72.a: "이 힘든 시기에 우리는 예산 증액이 필요하다."
 britain.72.b: "예산은 지금 그대로 괜찮다."
 britain.72.c: "우리는 군대에 돈을 덜 써야 한다."
 britain.73.t: "칼레의 역사적인 중심 항구"
 britain.73.d: "오래전, 영국은 프랑스의 칼레 시를 소유했으며, 그것은 해협의 모든 무역이 통하는 중심 항구였습니다. 그 영광스러운 시절에 우리는 많은 돈을 벌었고, 우리는 최근 우리가 여전히 그 도시에 대한 권리가 있다고 주장하기 위해 조작할 수 있는 몇 가지 문서를 발견했습니다. 우리는 그것을 해야 할까요?"
 britain.73.a: "이제 과거를 잊고 앞으로 나아가야 할 때이다."
 britain.73.b: "우리는 여전히 칼레에 대한 권리를 가지고 있다."
 britain.73.c: "칼레는 대영 제국에 필수적이다!"
 britain.74.t: "아동 노동에 대한 의회 논쟁"
 britain.74.d: "영국 의회는 오늘 아동 노동 문제에 대해 논쟁하고 있습니다. 자유주의자들과 노동자들은 그것을 금지할 것을 요구하고 있지만, 보수주의자들은 그것이 우리 경제에 필수적이라고 주장합니다. 최종 결정은 무엇입니까?"
 britain.74.a: "아동 노동 관행은 금지되어야 한다!"
 britain.74.b: "현재 상황은 괜찮다."
 britain.74.c: "우리는 아동 노동을 최대한 법적으로 이용해야 한다!"
 britain.75.t: "연금에 대한 의회 논쟁"
 britain.75.d: "영국 의회는 오늘 노동자들을 위한 연금에 대해 논쟁하고 있습니다. 연금은 노인들과 허약한 사람들의 생활 조건을 견딜 수 있게 하는 좋은 방법이 될 것이지만, 많은 사람들은 우리가 그것을 감당할 수 없다고 말했습니다. 치열한 논쟁 끝에, 의회는 결정했습니다..."
 britain.75.a: "...우리는 우리 노동자들을 위해 관대한 연금을 제정해야 한다고!"
 britain.75.b: "...우리가 우리 노동자들에게 소액의 연금을 제공해야 한다고."
 britain.75.c: "...연금은 돈 낭비라고."
 britain.76.t: "왕자 배우자의 노동자 권리에 대한 입장"
 britain.76.d: "앨버트 왕자 전하는 그의 새로운 아이디어로 영국을 더 일하기 좋은 곳으로 만들고 싶어 합니다. 그러나 우리는 우리의 방식을 그에게 설득하고 그것이 효과가 있다는 것을 보여주어야 합니다. 비용에 관계없이. 우리가 그의 지지를 얻는다면, 많은 국민들이 우리의 개혁 뒤에 모일 것입니다."
 britain.76.a: "그가 동의한다."
 britain.76.b: "그가 동의하지 않는다."
 britain.77.t: "은퇴 연령에 대한 의회 논쟁"
 britain.77.d: "영국 의회는 오늘 은퇴 연령에 대해 논쟁하고 있습니다. 우리는 모두 어떤 시점에서 노동자들이 더 이상 이익을 제공하기에는 너무 늙었다는 것을 알고 있지만, 우리는 그들을 보호하기 위해 그들이 은퇴해야 하는 나이를 의무화해야 할까요?"
 britain.77.a: "노동자 연령에 대한 법적 제한이 의무화되어야 한다."
 britain.77.b: "노동자들을 일찍 은퇴시키라고? 당신은 경제를 망치고 싶나?!"
 britain.78.t: "직장 안전 법률에 대한 의회 논쟁"
 britain.78.d: "영국 의회는 오늘 직장 안전 법률에 대해 논쟁하고 있습니다. 일부는 그것이 기업에 맡겨져야 한다고 말하는 반면, 다른 사람들은 우리 노동자들을 해로부터 보호하기 위해 입법 규제가 필요하다고 주장합니다."
 britain.78.a: "네, 직장 안전 법률이 필요합니다."
 britain.78.b: "그냥 기업에 맡겨라."
 britain.79.t: "대규모 총파업!"
 britain.79.d: "최근 노동자 권리에 대한 개정 이후, 상황은 놀라울 정도로 평온했던 것 같았습니다. 그러나 오늘 영국은 모든 억눌린 좌절이 폭발하는 것을 목격했습니다. 전국적으로 많은 수의 노동자들이 총파업에 돌입했으며, 가장 큰 것은 수도에서 일어났고, 상당한 규모의 폭도들을 모았습니다. 우리는 무엇을 해야 할까요?"
 britain.79.a: "무력으로 파업을 분쇄하라!"
 britain.79.b: "아무래도 노동자들에게 몇 가지 양보를 해야 할 것 같다."
 britain.80.t: "1859년 정부"
 britain.80.d: "하원의 대부분의 의석은 공식적으로 휘그당인 자유당에 의해 유지되었습니다."
 britain.80.a: "1859년은 자유당 정부의 지속을 축하한다."
 britain.81.t: "자유당의 창당"
 britain.81.d: "휘그당과 자유 무역을 지지하는 필라이트 및 급진파 사이의 동맹을 통해 새로운 정당이 형성되었습니다. 이 정당은 이전의 휘그당이었으며, 의회를 위해 왕권의 힘을 줄이는 것에 중점을 두었습니다. 개혁법은 아마도 휘그당의 최고의 업적이었을 것이지만, 더 많은 중산층 유권자를 허용함으로써 자유주의가 부상하게 되었습니다. 우리는 이제 이 새로운 세력에 적응해야 합니다."
 britain.81.a: "우리 나라와 경제의 발전을 위해!"
 britain.82.t: "팔머스턴과 글래드스턴"
 britain.82.d: "우리 자유당에는 분열이 있습니다. 그것은 두 명의 끔찍한 노인, 팔머스턴과 러셀, 그리고 필라이트인 윌리엄 유어트 글래드스턴 사이입니다. 급진파와 휘그당 사이의 이 동맹은 귀족들이 지배할 때 진정한 자유당을 형성할 수 없습니다. 글래드스턴은 가능성을 보여주지만, 현재로서는 팔머스턴이 여전히 확고한 통제권을 가지고 있습니다."
 britain.82.a: "걱정스럽다"
 britain.83.t: "노동조합의 로비 활동"
 britain.83.d: "최근 들어, 노동조합과 노동자들의 정치적 로비 활동이 증가하고 있습니다. 모든 사람들의 마음속에 있는 질문은 정부가 노동조합의 요구를 달래고 로비 활동을 계속할 것인지 아니면 그러한 요청을 차단할 것인지에 대한 것입니다."
 britain.83.a: "절대 안 돼, 이것은 자유방임주의에 대한 모독이다!"
 britain.83.b: "허용하라! 우리는 더 많은 노동 개혁이 필요하다!"
 britain.84.t: "팔머스턴 경의 사망"
 britain.84.d: "오늘 아침 팔머스턴 경이 세상을 떠나면서 나라가 애도하고 있습니다. 의사들은 그가 외교 조약에 대해 이야기하다 사망했다고 말하며, 우리 나라의 법에 대한 그의 헌신을 보여주었습니다. 그는 위대한 총리였으며, 그리울 것입니다. 비록 빅토리아 여왕은 그 남자를 항상 싫어했지만, 그녀조차도 이 위대한 정치인의 죽음을 애도했습니다."
 britain.84.a: "부디 편히 잠드소서, 팔머스턴 경"
 britain.85.t: "러셀 경이 새로운 총리가 되다"
 britain.85.d: "자유당의 러셀 경이 우리의 새로운 총리로 선출되었습니다."
 britain.85.a: "이것은 자유주의 개혁의 미래를 위한 위대한 날이다!"
 britain.86.t: "더비 경의 건강"
 britain.86.d: "더비 경의 건강이 급격히 악화되었습니다. 보수당의 지도자로서 그가 죽으면 그들의 당은 또 다른 타격을 입을 것입니다."
 britain.86.a: "이것은 우려스러운 발전이다."
 britain.87.t: "디즈레일리가 총리가 되다"
 britain.87.d: "의회가 개회되고 더비가 부재 중일 때, 그는 디즈레일리에게 '추가적인 막중한 책임을 회피하지 않을 것'이라는 확인을 요청하는 편지를 썼습니다. 안심한 그는 여왕에게 사임하고 '오직 그만이 현재 동료들의 진심 어린 지지를 일괄적으로 얻을 수 있다'고 디즈레일리를 추천하는 편지를 썼습니다. 디즈레일리는 와이트 섬의 오스본 하우스로 갔고, 그곳에서 여왕은 그에게 정부를 구성하도록 요청했습니다. 군주는 그녀의 딸인 프로이센 황태자비 빅토리아에게 '디즈레일리 씨가 총리입니다! '국민 중에서 일어난' 사람이 얻은 자랑스러운 일이다!'라고 편지를 썼습니다. 새로운 총리는 그를 축하하기 위해 온 사람들에게 '나는 미끄러운 기둥의 꼭대기에 올랐다'고 말했습니다."
 britain.87.a: "토리당의 미래가 밝아 보인다!"
 britain.88.t: "1866년 불신임 투표"
 britain.88.d: "총리는 의회 개혁에 대한 이 불신임 투표에서 패배했습니다. 결과적으로, 새로운 정부가 구성되어야 합니다..."
 britain.88.a: "야당이 정부를 구성할 것이다!"
 britain.88.b: "그는 사임할 수도 있지만, 우리는 야당이 권력을 장악하는 것을 막아야 한다."
 britain.89.t: "두 개의 선도적인 정당이 있는 마지막 선거"
 britain.89.d: "거의 모든 소수 정당들이 보수당이나 자유당과 동맹을 맺어 하원에서 정치적 거인이 되었습니다."
 britain.89.a: "어떻게 될지 흥미롭겠군."
 britain.90.t: "비스마르크 수상에게 보내는 편지"
 britain.90.d: "우리 정부는 독일 통일 사상을 지지합니다. 하지만 주권 영토의 합병과 독일의 전쟁은 인정하지 않습니다. 우리는 비스마르크의 방식, 특히 알자스-로렌 합병을 비난하는 내용의 편지를 작성했습니다. 문제는, 이걸 어떻게 할 것인가입니다."
 britain.90.a: "보내!"
 britain.90.b: "프로이센과의 관계를 위험에 빠뜨리지 마십시오."
 britain.91.t: "메리 앤 디즈레일리 별세"
 britain.91.d: "1872년 봄, 메리가 심각하게 병들었고 5월에는 그녀가 위암으로 죽어가고 있다는 것이 분명해졌습니다. 그녀는 남편과 함께 남부 지방을 여름 여행할 만큼 기력을 회복했습니다. 11월에는 가까운 친구들을 위해 작은 만찬회를 열 만큼 몸이 괜찮아졌지만, 상태는 다시 악화되어 12월 15일에 80세의 나이로 사망했습니다. 남편은 그녀가 죽은 후 '그녀가 완화하지 못할 걱정은 없었고, 그녀가 맞서지 못할 어려움은 없었다. 그녀는 내가 아는 가장 쾌활하고 용감한 여성이었다'고 썼습니다. 메리를 좋아했던 그의 위대한 적수 윌리엄 이워트 글래드스턴은 그에게 조의를 표하는 편지를 썼습니다. 그를 싫어했던 사람의 이런 동정에 감동한 디즈레일리는 '결혼은 상호 간의 공감에 기반을 둘 때 가장 큰 지상의 행복'이라고 답했습니다."
 britain.91.a: "편히 잠드소서"
 britain.92.t: "앨라배마 클레임"
 britain.93.t: "영국에 대한 미국의 청구(1869)"
 britain.94.t: "배상금의 개념"
 britain.95.t: "첫 번째 회담"
 britain.96.t: "조약 개념 포기"
 britain.97.t: "워싱턴 조약"
 britain.98.t: "합의를 찾으려고 노력"
 britain.99.t: "성공"
 britain.100.t: "실패, 하지만 국제 재판소에서 계속"
 britain.101.t: "제네바 국제 중재 재판소"
 britain.102.t: "앤더슨 사건"
 britain.102.d: "존 앤더슨 송환 사건은 캐나다 역사상 가장 긴장감 넘치는 사건 중 하나이며, 앞으로 몇 년 동안 캐나다-영국 관계를 규정하게 될 것입니다. 노스캐롤라이나 출신의 전직 노예였던 존 앤더슨은 노예 생활을 탈출하기 위해 북쪽 캐나다로 향하던 중 자신을 거의 붙잡을 뻔한 남자를 죽였습니다. 앤더슨은 결국 캐나다에 도착했지만, 6년 동안 캐나다 법 집행 기관에 의해 발견되거나 체포되지 않았습니다. 그가 우리 자치령에 구금되어 있으므로, 우리는 그가 영국으로 송환되어야 하는지 아니면 캐나다인에게 맡겨져야 하는지 결정해야 합니다."
 britain.102.a: "개입을 시도한다."
 britain.102.b: "캐나다 법원에 맡기십시오."
 britain.103.t: "1859년 정부"
 britain.103.d: "보수당이 모든 역경을 딛고 이번 총선에서 승리하며 다수당이 되었습니다."
 britain.103.a: "1859년은 보수당 정부의 수립을 축하하는 해입니다."
 britain.104.t: "1865년 정부"
 britain.104.d: "자유당은 이번 총선에서 또다시 승리하며 하원의 지배적인 정당임을 다시 한번 보여주었습니다."
 britain.104.a: "1865년은 자유당 정부의 지속을 축하하는 해입니다."
 britain.105.t: "1865년 정부"
 britain.105.d: "보수당이 모든 역경을 딛고 이번 총선에서 승리하며 다수당이 되었습니다."
 britain.105.a: "1865년은 보수당 정부의 수립을 축하하는 해입니다."
 britain.106.t: "1868년 정부"
 britain.106.d: "자유당은 이번 총선에서 또다시 승리하며 하원의 지배적인 정당임을 다시 한번 보여주었습니다."
 britain.106.a: "1868년은 자유당 정부의 지속을 축하하는 해입니다."
 britain.107.t: "1868년 정부"
 britain.107.d: "보수당이 모든 역경을 딛고 이번 총선에서 승리하며 다수당이 되었습니다."
 britain.107.a: "1865년은 보수당 정부의 수립을 축하하는 해입니다."
 britain.108.t: "디버그: 영국 노동자 불안정성 제한"
 britain.108.d: "이 이벤트는 숨겨진 이벤트이며 불만 노동자 비율이 0% 아래로 내려가거나 100% 위로 올라가는 것을 방지합니다."
 britain.108.a: "이벤트 종료"
 britain.109.t: "런던 노동조합 협의회"
 britain.109.d: "최근 우리 나라 노동자 계급의 문제와 차티즘 운동은 런던에서 '런던 노동 조합 협의회'라는 최초의 노동 조합이 결성되도록 했습니다. 이 조합의 목표는 런던의 여러 노동 조합들을 통합하고 파업을 통해 노동자 권리를 조직하고 신장시키는 것입니다."
 britain.109.a: "겨우 작은 조직일 뿐인데, 최악의 경우에 무슨 일이 일어나겠어?"
 britain.109.b: "이것을 용납할 수 없다 - 즉시 조직을 금지하라!"
 britain.109.c: "우리는 노동자들을 돕기 위해 그것을 지원해야 합니다!"
 britain.110.t: "주요 도시에서 노동자 파업이 발생했습니다!"
 britain.110.d: "오늘, 주요 도시에서 대규모 노동자 파업이 시작되었습니다. 노동자들은 열악한 임금과 노동 조건에 불만을 품고 변화를 요구합니다. 파업이 계속되는 한 산업 생산량이 감소할 것으로 예상됩니다."
 britain.110.a: "결국 먹고 살려면 일하러 돌아오겠지."
 britain.110.b: "무력으로 파업을 진압하라!"
 britain.110.c: "노동자들과 협상하고 양보를 하십시오."
 britain.110.e: "무력으로 파업을 진압하라!"
 britain.111.t: "디버그: ENG - 노동자 불안정성 - 긍정적 변동"
 britain.111.d: "이 숨겨진 이벤트는 노동자 불안정성을 조금 무작위로 증가시킵니다."
 britain.111.a: "확인."
 britain.112.t: "디버그: ENG - 노동자 불안정성 - 부정적 변동"
 britain.112.d: "이 숨겨진 이벤트는 노동자 불안정성을 조금 무작위로 감소시킵니다."
 britain.112.a: "확인."
 britain.113.t: "정부에 반대하는 노동자 시위"
 britain.113.d: "[ENG.GetNameDef]의 많은 노동자들이 현재 상황에 대한 불만을 드러내고 있는 듯하며, 수만 명이 정부의 부당함에 항의하기 위해 거리로 나섰습니다."
 britain.113.a: "시위하게 내버려 둬라."
 britain.113.b: "우리가 그들과 협상할 수 있습니다."
 britain.113.c: "우리는 그들의 요구 중 일부를 들어줄 것입니다."
 britain.114.t: "[ENG.GetNameDef]의 노동자 반란!"
 britain.114.d: "[ENG.GetNameDef]의 긴장이 마침내 폭발하여 수십만 명의 분노한 노동자들이 무장한 채 거리로 나섰습니다. 이제 혁명이 시작된 것 같습니다."
 britain.114.a: "내전을 원한다면, 보여주지!"
 britain.114.b: "모든 권력을 노동자들에게! 우리는 잃을 것이 사슬밖에 없다!"
 britain.115.t: "폭동을 일으킨 노동자들이 공장을 파손합니다!"
 britain.115.d: "계속되는 노동자들의 노동 시간과 환경에 대한 불만으로 인해 우리 주요 공장 중 한 곳에서 폭동이 발생했습니다. 수백 명의 사람들이 공장 부지를 점거하고 기계와 설비를 파괴하고 있습니다. 우리는 이 문제를 어떻게 다룰지 전략을 신속하게 결정해야 합니다."
 britain.115.a: "그들에게 약간의 양보를 고려해야 할지도 모릅니다."
 britain.115.b: "경찰이 모든 소란꾼들이 감옥에서 썩도록 조치할 것입니다."
 britain.115.c: "이건 너무 심하다. 당국에 발포 허가를 내리십시오."
 britain.116.t: "영국 정부가 캐나다로 도피!"
 britain.116.d: "잉글랜드와 웨일스의 주요 도시가 함락되고 스코틀랜드로 가는 길이 열리자 왕당파가 혁명에 패했다는 것이 분명해졌습니다. 남은 정부는 이미 캐나다로 대피하기 시작했으며, 그곳에서 영국을 되찾기 위한 침공이 시작될 수 있습니다. 혼란스러운 대피 속에서 국고와 많은 정부 문서(기밀 문서 및 공개 문서)는 반군을 위해 남겨졌습니다. 남은 군대는 명령이 끊긴 채 빨간 깃발이 거리에서 휘날리는 가운데 필사적인 시가전을 벌였습니다. 런던으로 가는 길이 열렸고 반군이 도착하여 남아있는 저항 세력을 소탕하여 수많은 부유하고 귀족적인 시민들을 영국에 가두었습니다. 총리는 진격하는 '반역자들'에 대한 무장 저항을 일단 중단하지만, 적절한 시기에 폐하의 정부가 돌아와 영국에 질서를 회복할 것이라고 발표했습니다."
 britain.116.a: "..."
 britain.117.t: "1874년 정부"
 britain.117.d: "자유당은 이번 총선에서 또다시 승리하며 하원의 지배적인 정당임을 다시 한번 보여주었습니다."
 britain.117.a: "1874년은 자유당 정부의 지속을 축하하는 해입니다."
 britain.118.t: "1874년 정부"
 britain.118.d: "보수당이 모든 역경을 딛고 이번 총선에서 승리하며 다수당이 되었습니다."
 britain.118.a: "1874년은 보수당 정부의 수립을 축하하는 해입니다."
 britain.119.t: "1865년 총선"
 britain.120.t: "1868년 총선"
 britain.121.t: "1874년 총선"
 britain.122.t: "1880년 총선"
 britain.123.t: "1880년 정부"
 britain.123.d: "자유당은 이번 총선에서 또다시 승리하며 하원의 지배적인 정당이 되었습니다."
 britain.123.a: "1880년은 자유당 정부의 복귀를 축하하는 해입니다."
 britain.124.t: "1880년 정부"
 britain.124.d: "보수당이 모든 역경을 딛고 이번 총선에서 승리하며 다수당이 되었습니다."
 britain.124.a: "1880년은 보수당 정부의 지속을 축하하는 해입니다."
 britain.125.t: "디즈레일리 총리 별세"
 britain.125.d: "오늘 아침, 디즈레일리 총리가 서거하면서 전국이 애도하고 있습니다. 그의 마지막 말은 '살고 싶지만 죽는 것이 두렵지 않다'였습니다. 디즈레일리는 여왕의 방문을 거절하며 '여왕 폐하는 알버트에게 전할 메시지가 있는지 물을 뿐'이라고 말했습니다. 그는 4월 5일 빅토리아 여왕에게서 마지막 편지를 받았을 때, 잠시 편지를 들고 있다가 다른 사람에게 읽어달라고 했습니다. 이것이 유일하게 보내진 편지가 아니었습니다. '한 노동자'가 서명한 한 장의 카드는 받는 사람을 기쁘게 했습니다. '아직 죽지 마세요, 우리는 당신 없이는 살 수 없습니다'라고 적혀 있었습니다."
 britain.125.a: "디즈레일리여, 편히 잠드소서"
 britain.126.t: "새로운 총리로서 솔즈베리 후작"
 britain.126.d: "보수당 소속인 솔즈베리 후작이 우리의 새 총리로 선출되었습니다."
 britain.126.a: "오늘은 보수당 정부와 영국의 미래를 위한 위대한 날입니다!"
 britain.127.t: "아편 전쟁이 차 부족을 야기하다!"
 britain.127.d: "현재 중국에서 벌어지고 있는 전쟁으로 인해 차 선박이 우리 항구에 도착하지 못하고 있습니다. 차가 항구에 도착하면 미리 계약을 맺는 대신 항구에서 차를 경매합니다. 영국 국민은 차를 좋아하며 차 없이 살 수 없습니다. 차 부족이 계속된다면 국민들은 불안해질 것입니다. 우리는 중국과의 전쟁을 신속하게 끝내거나 대체 차 수출국을 찾아야 합니다."
 britain.127.a: "내 차!!!"
 britain.128.t: "차 부족 해결!"
 britain.128.d: "중국과의 전쟁 때문에 우리는 다른 곳에서 차를 찾아야 했습니다. 곧 우리의 인도 영토가 차를 재배하고 수확하기에 훌륭한 장소라는 것을 알게 되었습니다. 그래서 우리는 차 수입이 문제없이 계속될 수 있도록 그 지역에 충분한 투자를 했습니다. 하지만 이제 인도에 계속 투자할지 아니면 중국과 다시 무역할지 결정해야 합니다."
 britain.128.a: "지금은 충분해"
 britain.128.b: "차는 아무리 많아도 부족하지 않다!"
 britain.129.t: "글래드스턴 은퇴"
 britain.129.d: "글래드스턴이 총리직에서 은퇴합니다. 이는 주로 아일랜드 및 자치 문제에 대한 그의 입장을 두고 그를 불신하게 된 당원들 때문입니다. 글래드스턴은 총리직에 관심이 없다고 밝힌 다른 유력 경쟁자 W. E. 포스터를 대신하여 스펜서 캐번디시, 하팅턴 후작이 총리직을 이어받았습니다. 하지만, 글래드스턴은 하원 의원직은 유지할 것입니다."
 britain.129.a: "자유당의 미래는 어떻게 될까?"
 britain.130.t: "자유당 정부는 누가 이끌어야 하는가?"
 britain.130.d: "글래드스톤이 정치에서 은퇴한 후, 하팅턴 후작 스펜서 캐번디시가 그의 뒤를 이었습니다. 하지만 글래드스톤은 오래 은퇴해 있지 않았고, 의원직을 유지했습니다. 글래드스톤은 여러 주제에 걸쳐 많은 책을 썼으며, 사회주의에 대한 자신의 반대 입장을 분명히 했습니다. 그는 선거 운동 기간 동안 디즈레일리의 외교 정책을 강력히 비난했습니다. 글래드스톤은 미들로디언 선거구와 또한 후보로 채택되었던 리즈에서도 당선되었습니다. 그가 합법적으로 한 선거구의 의원만 맡을 수 있었으므로, 리즈는 그의 아들 허버트에게 양도되었습니다. 그의 다른 아들 중 한 명인 헨리 또한 의원으로 선출되었습니다.\n\n캐번디시는 한동안 자유당 당수를 역임하며 뛰어난 역량을 보여주었습니다. 그러나 그가 자유당 당수로서 글래드스톤의 유산을 이어받기는 어려울 것이 분명합니다. 글래드스톤은 또한 자유당의 가장 중요한 대중 운동가였으며, 아마도 그들의 선거 승리 원인이었을 것입니다.\n\n글래드스톤이 참여하기를 거부하자 캐번디시는 정부 구성에 주저하고 있습니다... 캐번디시가 자신만의 정부를 구성해야 할까요, 아니면 글래드스톤이 다시 한번 주도권을 잡도록 해야 할까요?"
 britain.130.a: "글래드스턴"
 britain.130.b: "캐번디시"
 britain.131.t: "북아일랜드는 영국에 남습니다."
 britain.131.d: "북아일랜드 인구의 대다수는 연합주의자들이었으며, 그들은 영국 내에 남기를 원했습니다. 아일랜드의 자치 정부는 대부분 개신교 신자였던 아일랜드 연합주의자들의 격렬한 반대에 부딪혔고, 그들은 아일랜드 민족주의자와 가톨릭교도들이 지배하는 아일랜드 자치 정부를 두려워했습니다. 연합주의자들은 자치가 막을 수 없다면, 얼스터 전체 또는 일부가 그에서 제외되어야 한다고 주장했습니다. 영국 정부는 '얼스터'가 자치에서 제외될 수 있도록 수정 법안을 도입했습니다."
 britain.131.a: "훌륭해!"
 britain.132.t: "프로보 월리스의 은퇴"
 britain.132.a: "그는 은퇴할 자격이 있습니다."
 britain.132.b: "우리는 그가 좀 더 필요합니다."
 britain.133.t: "프로보 월리스 별세"
 britain.133.d: "프로보 월리스는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.133.a: "그가 그리울 것입니다."
 britain.133.b: "국장을 치르자"
 britain.134.t: "제임스 브루드넬의 은퇴"
 britain.134.d: "제7대 카디건 백작 제임스 브루든웰은 크림 전쟁 중 경기병대 돌격을 이끌었습니다. 이 돌격은 실패했지만, 영웅적인 사건으로 남았습니다.\n그는 한동안 군대에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.134.a: "그는 은퇴할 자격이 있습니다."
 britain.134.b: "우리는 그가 좀 더 필요합니다."
 britain.135.t: "제임스 브루드넬 별세"
 britain.135.d: "제임스 브루드넬은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.135.a: "그가 그리울 것입니다."
 britain.135.b: "국장을 치르자"
 britain.136.t: "헨리 하블록 별세"
 britain.136.d: "헨리 하블록은 병든 몸에도 불구하고 사망할 때까지 인도에서 국가에 봉사했습니다."
 britain.136.a: "그가 그리울 것입니다."
 britain.136.b: "국장을 치르자"
 britain.137.t: "해리 스미스 경의 은퇴"
 britain.137.d: "해리 스미스 경은 1805년부터 종사해 왔습니다. 그는 라플라타 강 영국 침공과 이후 나폴레옹 전쟁(반도 전쟁 및 워털루)에 참전했습니다.\n이후 그는 식민지에서 복무했으며, 사람들은 인도 알리왈에서의 그의 승리를 기억합니다.\n그는 아직 한동안 군대에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.137.a: "그는 은퇴할 자격이 있습니다."
 britain.137.b: "우리는 그가 좀 더 필요합니다."
 britain.138.t: "해리 스미스 경 별세"
 britain.138.d: "해리 스미스 경은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.138.a: "그가 그리울 것입니다."
 britain.138.b: "국장을 치르자"
 britain.139.t: "콜린 캠벨의 은퇴"
 britain.139.d: "콜린 캠벨은 1808년부터 복무했습니다! 나폴레옹 전쟁 이후, 그는 급여 삭감을 피하기 위해 식민지 전쟁에 참여했습니다.\n그는 발라클라바 전투(크림 전쟁 중 경기병대 돌격이 있었던 전투)에서 "하이랜더의 얇은 붉은 선"으로 유명해졌습니다. 나중에 그는 크림의 두 영국군 중 하나를 지휘했습니다. 마침내 그는 인도 반란을 진압하기 위해 인도 총사령관으로 임명되었습니다.\n그는 아직 한동안 군대에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.139.a: "그는 은퇴할 자격이 있습니다."
 britain.139.b: "우리는 그가 좀 더 필요합니다."
 britain.140.t: "콜린 캠벨 별세"
 britain.140.d: "콜린 캠벨은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.140.a: "그가 그리울 것입니다."
 britain.140.b: "국장을 치르자"
 britain.141.t: "프랜시스 오스틴의 은퇴"
 britain.141.d: "프랜시스 오스틴은 14세이던 1786년에 왕립 해군에 입대했습니다. 그는 1799년에 프랑스 선박 40척을 나포하며 위업을 달성했습니다! 그는 나폴레옹 전쟁 후 바스 훈장 동료급으로 임명되었고, 1837년에는 기사 사령관급이 되었으며, 마침내 1860년에는 기사 대십자급이 되었습니다. 그는 최근 89세의 나이로 최고 계급인 해군 원수로 임명되었으며, 이제 더 이상 얻을 것이 없습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.141.a: "그는 은퇴할 자격이 있습니다."
 britain.141.b: "우리는 그가 좀 더 필요합니다."
 britain.142.t: "프랜시스 오스틴 별세"
 britain.142.d: "프랜시스 오스틴은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.142.a: "그가 그리울 것입니다."
 britain.142.b: "국장을 치르자"
 britain.143.t: "윌리엄 파커의 은퇴"
 britain.143.d: "셰인스톤의 제1대 준남작 윌리엄 파커 경은 1793년 12세의 나이로 왕립 해군에 입대했습니다. 그는 프랑스 혁명 전쟁, 나폴레옹 전쟁, 포르투갈 내전, 그리고 동인도 및 중국 함대 총사령관으로서 제1차 아편 전쟁에 참전했습니다. 최근 81세의 나이로 최고 계급인 해군 원수로 임명되었으며, 이제 더 이상 얻을 것이 없습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.143.a: "그는 은퇴할 자격이 있습니다."
 britain.143.b: "우리는 그가 좀 더 필요합니다."
 britain.144.t: "윌리엄 파커 별세"
 britain.144.d: "윌리엄 파커는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.144.a: "그가 그리울 것입니다."
 britain.144.b: "국장을 치르자"
 britain.145.t: "토머스 코크런의 은퇴"
 britain.145.d: "토머스 코크런은 17세이던 1793년에 왕립 해군에 입대했습니다. 그의 기습 공격은 매우 효율적이어서 나폴레옹은 그에게 '바다의 늑대'라는 별명을 붙였습니다.\n토머스 코크런은 정치 경력을 쌓았지만, 1814년 대규모 증권 거래 사기 사건으로 불명예를 안았고, 이로 인해 웨스트민스터 사원에서의 강등 의식에서 바스 훈장 기사직을 박탈당했습니다. 그는 왕립 해군으로 돌아오기 전, 칠레, 브라질, 그리스 해군에서 각국의 독립을 위해 복무했습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.145.a: "그는 은퇴할 자격이 있습니다."
 britain.145.b: "우리는 그가 좀 더 필요합니다."
 britain.146.t: "토머스 코크런 별세"
 britain.146.d: "토머스 코크런은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.146.a: "그가 그리울 것입니다."
 britain.146.b: "국장을 치르자"
 britain.147.t: "조지 시모어의 은퇴"
 britain.147.d: "조지 시모어는 10세이던 1797년에 왕립 해군에 입대했습니다. 그는 프랑스 혁명 전쟁과 나폴레옹 전쟁에 참전했으며, 1841년에 태평양 함대 총사령관이 되어서야 고위 지휘관이 되었습니다. 그는 타히티를 둘러싼 프랑스와의 전쟁과 오리건을 둘러싼 미국과의 전쟁을 피했습니다. 최근 78세의 나이로 최고 계급인 해군 원수로 임명되었으며, 이제 더 이상 얻을 것이 없습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.147.a: "그는 은퇴할 자격이 있습니다."
 britain.147.b: "우리는 그가 좀 더 필요합니다."
 britain.148.t: "조지 시모어 별세"
 britain.148.d: "조지 시모어는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.148.a: "그가 그리울 것입니다."
 britain.148.b: "국장을 치르자"
 britain.149.t: "제임스 고든의 은퇴"
 britain.149.d: "제임스 알렉산더 고든 경은 11세이던 1793년에 왕립 해군에 입대했습니다. 혁명 전쟁과 나폴레옹 전쟁이 끝난 후인 1815년에 그는 바스 훈장 기사 사령관급으로 임명되었습니다. 1837년에는 그리니치 병원의 부총독이 되었고, 1848년에는 총독이 되었습니다. 최근 87세의 나이로 최고 계급인 해군 원수로 임명되었으며, 이제 더 이상 얻을 것이 없습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.149.a: "그는 은퇴할 자격이 있습니다."
 britain.149.b: "우리는 그가 좀 더 필요합니다."
 britain.150.t: "제임스 고든 별세"
 britain.150.d: "제임스 고든은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.150.a: "그가 그리울 것입니다."
 britain.150.b: "국장을 치르자"
 britain.151.t: "찰스 프레맨틀의 은퇴"
 britain.151.d: "찰스 하우 프리맨틀 경은 12세이던 1812년에 왕립 해군에 입대했습니다. 그는 주로 호주에서 복무했습니다. 최근에는 크림 전쟁 중 크림반도에서 해군 수송 서비스를 지휘했습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.151.a: "그는 은퇴할 자격이 있습니다."
 britain.151.b: "우리는 그가 좀 더 필요합니다."
 britain.152.t: "찰스 프레맨틀 별세"
 britain.152.d: "찰스 프레맨틀은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.152.a: "그가 그리울 것입니다."
 britain.152.b: "국장을 치르자"
 britain.153.t: "프레더릭 그레이의 은퇴"
 britain.153.d: "프레더릭 윌리엄 그레이 경은 14세이던 1819년에 왕립 해군에 입대했습니다. 그는 제1차 아편 전쟁과 크림 전쟁 중 프랑스 군인 10,000명을 호송하는 역할을 수행했습니다. 마침내 그는 해군참모총장이 되어 정치 영역에서 해군 진급을 분리하는 개혁을 추진했습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.153.a: "그는 은퇴할 자격이 있습니다."
 britain.153.b: "우리는 그가 좀 더 필요합니다."
 britain.154.t: "프레더릭 그레이 별세"
 britain.154.d: "프레더릭 그레이는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.154.a: "그가 그리울 것입니다."
 britain.154.b: "국장을 치르자"
 britain.155.t: "로버트 램버트 베인스의 은퇴"
 britain.155.d: "로버트 램버트 베인스 경은 14세이던 1810년에 왕립 해군에 입대했습니다. 나폴레옹 전쟁 후, 그는 그리스 독립 전쟁 중 나바리노 해전에서 싸웠습니다. 잠시 감봉 후, 그는 함선에 임명되었고, 1855년 크림 전쟁의 마지막 해 동안 발트해에서 세 번째 지휘관이 되었습니다. 그는 현재 영국 태평양 북서부에서 근무하고 있습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.155.a: "그는 은퇴할 자격이 있습니다."
 britain.155.b: "우리는 그가 좀 더 필요합니다."
 britain.156.t: "로버트 램버트 베인스 별세"
 britain.156.d: "로버트 램버트 베인스는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.156.a: "그가 그리울 것입니다."
 britain.156.b: "국장을 치르자"
 britain.157.t: "루시우스 커티스의 은퇴"
 britain.157.d: "루시우스 커티스는 9세이던 1795년에 왕립 해군에 입대했습니다. 그는 1810년 모리셔스 작전에 참여했지만, 프랑스 해군 준장 하멜린에게 포로로 잡혔습니다. 4개월 후 풀려난 뒤, 그는 군법회의에서 무죄를 선고받았습니다. 나폴레옹 전쟁 후 그는 해군 경력을 계속 이어갔고, 1862년에는 바스 훈장 기사 사령관급이 되었으며, 1864년에는 해군 원수가 되었습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.157.a: "그는 은퇴할 자격이 있습니다."
 britain.157.b: "우리는 그가 좀 더 필요합니다."
 britain.158.t: "루시우스 커티스 별세"
 britain.158.d: "루시우스 커티스는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.158.a: "그가 그리울 것입니다."
 britain.158.b: "국장을 치르자"
 britain.159.t: "리처드 잉글랜드의 은퇴"
 britain.159.d: "1854-55년의 혹독한 겨울 동안, 그는 특히 두각을 나타냈습니다. 그는 그의 병사들과 함께 극심한 고난을 겪었지만, 귀국을 신청하지 않았으며 크림으로 군대와 동행했던 원래의 장성들 중 가장 마지막으로 그곳을 떠났습니다. 그가 돌아오기 전, 1855년 6월 18일 레단 공격을 지휘했으며, 그날의 치열한 전투 결과가 큰 성공을 거두지 못한 것은 그의 잘못이 아니었습니다. 그러나 1855년 8월, 그는 의사의 명령에 따라 영국으로 돌아와야 했습니다.\n그는 아직 한동안 해군에서 복무할 수 있겠지만, 아마도 여생을 즐기기 위해 은퇴해야 할 것입니다."
 britain.159.a: "그는 은퇴할 자격이 있습니다."
 britain.159.b: "우리는 그가 좀 더 필요합니다."
 britain.160.t: "리처드 잉글랜드 별세"
 britain.160.d: "리처드 잉글랜드는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.160.a: "그가 그리울 것입니다."
 britain.160.b: "국장을 치르자"
 britain.161.t: "조지 빙엄의 은퇴"
 britain.161.d: "앵글로-아일랜드 귀족이자 1816년에 군 경력을 시작한 영국 육군 장교입니다. 그는 1854년 10월 발라클라바 전투 중 경기병대 지휘관인 카디건 백작이 경기병대 돌격을 이끌도록 한 운명적인 명령에 대해 놀란 대위와 래글런 경과 함께 책임이 있는 세 사람 중 한 명이었습니다."
 britain.161.a: "그는 은퇴할 자격이 있습니다."
 britain.161.b: "우리는 그가 좀 더 필요합니다."
 britain.162.t: "조지 빙엄 별세"
 britain.162.d: "조지 빙엄은 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.162.a: "그가 그리울 것입니다."
 britain.162.b: "국장을 치르자"
 britain.163.d: "나폴레옹 전쟁 중 하급 장교로 복무한 후, 그는 록포트에서 HMS 벨레로폰의 프레더릭 메이틀랜드 함장에게 나폴레옹 보나파르트가 항복할 때 중령으로 참석했습니다. 그는 나중에 포르투갈 내전에서 돔 페드로의 해군을 지휘했습니다. 돔 페드로는 포르투갈 왕위를 찬탈한 그의 형제 돔 미겔을 물리치고 자신의 딸인 마리아 2세 공주를 정당한 여왕으로 즉위시키려고 했습니다. 사르토리우스는 계속해서 지중해 함대에서 HMS 말라바르를 지휘했으며, 쿠데타로 쫓겨난 스페인 섭정 발도메로 에스파르테로를 함정에 태웠습니다. 사르토리우스는 나중에 퀸스타운에서 총사령관으로 복무했습니다."
 britain.163.a: "그는 은퇴할 자격이 있습니다."
 britain.163.b: "우리는 그가 좀 더 필요합니다."
 britain.164.t: "조지 사르토리우스 별세"
 britain.164.d: "조지 사르토리우스는 병든 몸에도 불구하고 사망할 때까지 국가에 봉사했습니다."
 britain.164.a: "그가 그리울 것입니다."
 britain.164.b: "국장을 치르자"
 britain.165.t: "찰스 조지 고든, 장군이 되나?"
 britain.165.d: "찰스 조지 고든은 중국에서 "항승군"을 지휘했습니다.\n이전에는 그는 크림 전쟁에서 세바스토폴 요새를 연구했습니다.\n그는 좋은 장군이 될 수 있을 것입니다."
 britain.165.a: "그를 장군으로 임명한다!"
 britain.165.b: "우리는 장군이 충분합니다."
 britain.166.t: "리처드 에어리, 장군이 되나?"
 britain.166.d: "리차드 에어리는 크림 전쟁 중 경기병대 돌격의 책임으로부터 자유롭게 되었습니다.\n이 기병 장교는 훌륭한 장군이 될 수 있을 것입니다."
 britain.166.a: "그를 장군으로 임명한다!"
 britain.166.b: "우리는 장군이 충분합니다."
 britain.167.t: "제임스 브루드넬, 장군이 되나?"
 britain.167.d: "제7대 카디건 백작 제임스 브루든웰은 크림 전쟁 중 경기병대 돌격을 이끌었습니다. 이 돌격은 실패했지만, 영웅적인 사건으로 남았습니다.\n제임스 브루든웰은 좋은 장군이 될 수 있을 것입니다."
 britain.167.a: "그를 장군으로 임명한다!"
 britain.167.b: "우리는 장군이 충분합니다."
 britain.168.t: "가넷 울슬리, 장군이 되나?"
 britain.168.d: "가넷 울즐리는 제2차 버마 전쟁 중에 부상을 입었습니다.\n크림 전쟁 중 그는 왕립 공병대에 입대하여 프랑스 및 튀르키예 훈장을 모두 받았습니다.\n가넷 울즐리는 인도 세포이 항쟁 중에도 언급되었습니다.\n캐나다에서 특수 임무 장교로서 그는 미국 남북 전쟁을 참관하고 반란을 진압했습니다.\n그는 식민지 원정을 위한 좋은 장군이 될 수 있을 것입니다."
 britain.168.a: "그를 장군으로 임명한다!"
 britain.168.b: "우리는 장군이 충분합니다."
 britain.169.t: "조지 빙엄, 장군이 되나?"
 britain.169.d: "제3대 루칸 백작 조지 빙엄은 1825년부터 기병 장교로 복무했습니다.\n크림 전쟁 중 그는 래글런 경의 명령에 따라 그가 혐오하는 처남인 카디건에게 경기병대 돌격을 지휘하라고 명령했습니다.\n잉글랜드로 소환된 그는 래글런에게 성공적으로 책임을 전가하고 경비병 직책을 얻었습니다.\n그는 좋은 장군이 될 수 있을 것입니다."
 britain.169.a: "그를 장군으로 임명한다!"
 britain.169.b: "우리는 장군이 충분합니다"
 britain.170.t: "제임스 홉 그랜트, 장군이 되나?"
 britain.170.d: "제임스 홉 그랜트는 18세에 제9 창기병대에 입대했습니다. 1842년, 그는 제1차 아편 전쟁에서 뛰어난 활약을 보였습니다. 이후 인도에서 벌어진 모든 전쟁에 참전했습니다. 제2차 아편 전쟁에서 좋은 지휘관이 될 수 있을 것입니다."
 britain.170.a: "그를 장군으로 임명한다!"
 britain.170.b: "우리는 장군이 충분합니다"
 britain.171.t: "에드워드 시모어, 제독이 되나?"
 britain.171.d: "에드워드 시모어는 크림 전쟁과 제2차 아편 전쟁에서 복무했습니다.\n그는 중국 함대 총사령관으로 적합할 것입니다."
 britain.171.a: "그를 제독으로 임명한다!"
 britain.171.b: "우리는 제독이 충분합니다."
 britain.172.t: "해리 로슨, 제독이 되나?"
 britain.172.d: "해리 로슨은 제2차 아편 전쟁과 영국-이집트 전쟁에서 복무했습니다.\n그는 희망봉과 서아프리카 연안 함대 총사령관으로 적합할 것입니다."
 britain.172.a: "그를 제독으로 임명한다!"
 britain.172.b: "우리는 제독이 충분합니다."
 britain.173.t: "조지 사르토리우스, 제독이 되나?"
 britain.173.d: "조지 사르토리우스는 트라팔가르 해전과 지중해에서의 다른 작전에 참가했습니다. 1831년부터 1832년까지 포르투갈을 위해 복무했는데, 이는 1819년 외국인 징집법에 위반되는 행위였습니다. 그는 1836년이 되어서야 왕립 해군으로 돌아올 수 있었습니다. 1843년, 그는 지브롤터 근처에서 USS 미주리호 화재로 200명의 미국인을 구했습니다. 그 다음 해에 그의 배는 해군에서 제외되었고 그는 더 이상 바다에서 복무하지 않았습니다.\n그는 좋은 제독이 될 수 있을 것입니다."
 britain.173.a: "그를 제독으로 임명한다!"
 britain.173.b: "우리는 제독이 충분합니다."
 britain.174.t: "프레더릭 슬라이 로버츠, 장군이 되나?"
 britain.174.d: "로버츠는 동인도 회사군에 입대하여 인도 반란에서 젊은 장교로 복무했으며, 그 용맹으로 빅토리아 십자훈장을 받았습니다. 이후 그는 영국군으로 전속되어 아비시니아 원정과 제2차 영국-아프가니스탄 전쟁에 참전하여 큰 명성을 얻었습니다."
 britain.174.a: "그를 장군으로 임명한다!"
 britain.174.b: "우리는 장군이 충분합니다."
 britain.175.t: "프레더릭 테시거, 장군이 되나?"
 britain.175.d: "1857년 그는 대위와 중령으로 진급하여 제95 (더비셔) 보병연대로 전속되어 인도 반란 말기에 복무했으며, 이 공로로 표창을 받았습니다. 그는 부관참모로 복무하며 1868년 아비시니아 원정에 참가했으며, 이 공로로 바스 훈장 기사단원이 되었고 1868년 빅토리아 여왕의 부관으로 임명되었습니다."
 britain.175.a: "그를 장군으로 임명한다!"
 britain.175.b: "우리는 장군이 충분합니다."
 britain.176.t: "허버트 키치너, 장군이 되나?"
 britain.176.d: "키치너는 1883년 2월 이집트 기병대 부사령관이 되었고, 이후 1884년 말 수단에서 찰스 조지 고든을 구출하려다 실패한 원정에 참가했습니다. 그는 1888년 1월 핸덥에서 마흐디 추종자들과의 전투에서 병력을 이끌다 턱 부상을 입었습니다. 1889년 8월 토스키 전투에서 키치너는 이집트 기병대를 지휘했습니다."
 britain.176.a: "그를 장군으로 임명한다!"
 britain.176.b: "우리는 장군이 충분합니다."
 britain.177.t: "찰스 윌리엄 윌슨, 장군이 되나?"
 britain.177.d: "그는 1836년 3월 14일 리버풀에서 태어났습니다. 리버풀 칼리지 스쿨과 첼트넘 칼리지에서 교육을 받았습니다. 울리치의 왕립 군사 학교에 입학하여 1855년 왕립 공병대 장교로 임관했습니다. 1882년 여름, 그는 울슬리 원수의 원정에 참가하여 '우라비' 대령의 반란을 진압했습니다."
 britain.177.a: "그를 장군으로 임명한다!"
 britain.177.b: "우리는 장군이 충분합니다."
 britain.178.t: "마크 워커, 장군이 되나?"
 britain.178.d: "크림 전쟁 당시, 워커는 26세의 제30 보병연대 중위였으며, 그 공로로 빅토리아 십자훈장을 받았습니다. 크림반도 복무 중 유탄에 맞아 오른팔을 절단해야 했습니다. 그는 1860년 제2차 영국-중국 전쟁에 여단 참모장으로 복무했으며, 1861년에 중령으로 진급했습니다. 1869년에는 대령으로 진급했으며, 1875년부터 1879년까지 마드라스에서 여단을 지휘했습니다."
 britain.178.a: "그를 장군으로 임명한다!"
 britain.178.b: "우리는 장군이 충분합니다."
 britain.179.t: "레드버스 불, 장군이 되나?"
 britain.179.d: "그는 1878년 제9차 케이프 국경 전쟁과 1879년 영국-줄루 전쟁에 남아프리카에서 복무했습니다. 줄루 전쟁에서 그는 이블린 우드 경 휘하의 북부 영국군 기마 보병을 지휘했습니다. 그는 훌로바네 전투의 영국군 패배에 참전했으며, 이 전투에서 포화 속 용맹함으로 빅토리아 십자훈장을 받았습니다. 다음 날 그는 영국군이 승리한 캄불라 전투에 참전했습니다. 영국군 진지에 대한 줄루족의 공격이 격퇴된 후, 그는 도망치는 줄루족을 기마병으로 무자비하게 추격했습니다. 1879년 6월, 그는 전쟁을 사실상 종결시킨 결정적인 영국군 승리인 울룬디 전투에서 다시 기마병을 지휘했습니다."
 britain.179.a: "그를 장군으로 임명한다!"
 britain.179.b: "우리는 장군이 충분합니다."
 britain.180.t: "이블린 우드, 장군이 되나?"
 britain.180.d: "우드는 왕립 해군에서 HMS 퀸호에 복무하며 경력을 시작했지만, 현기증으로 인해 돛대에 오를 수 없게 되었습니다. 인도에서 우드는 인도 반란 중 라즈구르, 신드와호, 카리, 바로데에서 전투에 참여했으며 빅토리아 십자훈장을 받았습니다. 1858년 5월부터 1859년 10월까지 그는 중앙 인도의 유격대 부대 참모장을 역임했습니다. 1858년 10월 19일 신드와호에서의 전투 중 기마병 부대를 지휘하던 스무 살의 중위 우드는 반군 부대를 공격하여 거의 혼자 힘으로 패주시켰습니다. 1873년 9월 12일 그는 울슬리 원수의 참모진에 임명되었으며, 아모아풀 전투에서 측면을 지휘했습니다. 1879년 1월, 우드는 영국-줄루 전쟁에 참가하여 3,000명 규모의 제4부대 지휘를 맡았습니다."
 britain.180.a: "그를 장군으로 임명한다!"
 britain.180.b: "우리는 장군이 충분합니다."
 britain.181.t: "리처드 켈리, 장군이 되나?"
 britain.181.d: "크림 전쟁 중 세바스토폴 공성전에서 부상을 입고 포로로 잡혔습니다. 또한 1857년 6월 칸푸르 공성전, 1857년 가을 러크나우 공성전, 1858년 4월 아짐가르 구출전 등 인도 반란에 참전했습니다."
 britain.181.a: "그를 장군으로 임명한다!"
 britain.181.b: "우리는 장군이 충분합니다."
 britain.182.t: "해리 리스터, 장군이 되나?"
 britain.182.d: "1847-48년 그는 차티스트 폭동 중 런던에서 특별 경찰로 복무했습니다. 1848년 9월 20일 영국 동인도 회사군에 임관하여 1864년 1월 19일 소령으로 진급했습니다. 그는 27세의 벵골 육군 제72 벵골 토착 보병대 중위였으며, 인도 반란 중 다음과 같은 공로를 세워 빅토리아 십자훈장을 받았습니다. 제2차 영국-아프가니스탄 전쟁 중 아흐마드 켈 전투에서 제3 구르카 연대를 지휘하며 표창을 받았습니다."
 britain.182.a: "그를 장군으로 임명한다!"
 britain.182.b: "우리는 장군이 충분합니다."
 britain.183.t: "영국의 확장"
 britain.183.d: "두 강연은 영국 역사가 존 로버트 실리가 대영 제국의 성장에 대해 쓴 책입니다. 실리는 영국의 확장이 18세기 루이 14세의 프랑스에 대한 패배에 기반을 두고 있으며, 자치령이 영국 권력에 결정적이라고 주장했습니다. 그는 또한 인도를 계속 유지하는 것이 장기적으로 영국에 이익이 되지 않을 수도 있다고 말했습니다. 이 책은 대중적으로 성공했으며 영국 정치인과 귀족들로부터 강력한 긍정적인 반응을 얻었고, 여러 역사가들은 이 책이 영국 사상에 큰 영향을 미쳤다고 평가했습니다.\n\n실리는 유명하게도 '우리는 마치 멍하니 있다가 세계의 절반을 정복하고 인구를 채운 것 같다'고 말했습니다. 실리는 자치령이 영국으로부터 독립할 가능성이 있다고 언급하며, '그러한 분리는 영국을 대륙에서 우리와 가장 가까운 국가들과 같은 수준에 놓게 될 것입니다. 인구는 많지만 독일보다 적고 프랑스와 거의 비슷할 것입니다. 그러나 러시아와 미국이라는 두 국가는 인구와 면적 면에서 완전히 더 높은 규모를 차지할 것이며, 러시아는 즉시, 미국은 그리 오래지 않아 우리보다 두 배의 인구를 갖게 될 것입니다'라고 말했습니다. 그러나 그는 또한 '다른 대안은 영국이 미국이 아주 쉽게 하는 것처럼 서로 매우 멀리 떨어진 국가들을 연방으로 묶을 수 있음을 증명하는 것입니다. 그럴 경우 영국은 인구와 면적 면에서 러시아와 미국과 함께 1위를 차지하게 될 것이며, 대륙의 국가들보다 더 높은 순위를 차지하게 될 것입니다'라고 말했습니다."
 britain.183.a: "흥미로운 생각..."
 britain.184.t: "국기 게양식"
 britain.184.d: "영국 육군의 연대기는 역사적으로 '컬러즈(Colours)'라고 불렸는데, 이는 각 부대 군인들이 착용하는 유니폼의 색상과 휘장을 보여주기 때문이었습니다. '컬러'라는 이름은 오늘날까지 계속 사용됩니다. 연대기의 주요 역할은 전장에서 집결지를 제공하는 것이었습니다.\n\n군인들이 자신의 연대기가 어떻게 생겼는지 알기 위해서는 정기적으로 연대기를 보여줄 필요가 있었습니다. 이 방식은 젊은 장교들이 연대기를 높이 들고 줄지어 선 병사들의 행렬 사이로 행진하는 것이었습니다. 이것이 '트로핑(trooping)'이라는 단어의 기원입니다. 따라서 오늘날의 위대한 전통은 전투가 시작되기 전에 부대 인식을 돕기 위해 고안된 중요하고 실용적인 퍼레이드로서 시작되었습니다.\n\n근위대는 영국 육군에서 가장 오래된 연대 중 하나이며, 1660년 영국 내전 이후 왕정 복고부터 군주의 개인 경호원으로 복무했습니다. 국기 게양식은 찰스 2세의 통치 기간에 처음 거행된 것으로 믿어집니다. 1748년에는 이 퍼레이드를 군주의 공식 생일을 기념하는 데 사용하기로 결정했으며, 조지 3세가 1760년에 왕이 된 후 연례 행사가 되었습니다.\n\n오늘날 이 다채로운 행사는 군주의 공식 생일 축하 행사로 남아 있습니다. 여왕 폐하의 실제 생일은 5월 24일이지만, 그녀의 '공식 생일'은 국기 게양식으로 기념됩니다."
 britain.184.a: "여왕 폐하 만세!"
 britain.185.t: "아일랜드 연합주의자들이 싸움에 합류합니다!"
 britain.185.d: "아일랜드의 많은 사람들은 여전히 공화주의자보다 영국 통치를 선호하며, 아일랜드, 특히 북아일랜드가 영국의 일부라고 생각합니다. 따라서 아일랜드의 많은 연합주의자들은 자신들의 연합 왕국을 지키기 위해 우리 편에서 싸우겠다고 자원했습니다!"
 britain.185.a: "여왕 폐하 만세!"
 britain.186.t: "미국과의 관계가 냉각됩니다"
 britain.186.d: "중앙아메리카의 베이 제도와 모스키토 해안에 있는 우리 식민지에 대해 최근 미국과 의견 불일치가 있은 후, 우리는 관계가 눈에 띄게 냉각되었음을 확인했습니다. 미국 국무장관은 우리 나라에 적대적인 것으로 알려져 있으므로 이는 놀랄 일이 아닙니다. 모스키토 보호령, 베이 제도, 벨리즈에 대한 협상을 재개하려는 우리의 시도는 모두 중단되었습니다. 진전을 재개할 수 있도록 관계를 개선하는 데 노력을 기울여야 합니다."
 britain.186.a: "아, 외교의 즐거움"
 britain.187.t: ""
 britain.187.d: ""
 britain.187.a: ""
 britain.188.t: "프랑스의 경고"
 britain.188.d: "§O[AUS.GetNameWithFlag]§!와의 전쟁과 관련하여, §3[FRA.GetNameWithFlag]§!는 §G[RUS.GetNameWithFlag]§!에 대한 전쟁 선포가 심각한 보복으로 이어질 것이라고 우리에게 경고했습니다."
 britain.188.a: "명심하겠습니다."
 british_votes.1.t: "1857년 인클로저법"
 british_votes.1.a: "오늘도, 또 다른 법이 통과되는군"
 british_votes.1.b: "아이디어를 포기한다"
 british_votes.1.d: "감히 묻건대, 영국 시골에 허리 높이의 사랑스러운 산울타리가 충분한가? 1857년에 가장 믿을 수 없고 나태한 의회는 또 다른 법안으로 아니라고 답한다. 18세기 후반과 19세기 초반으로 거슬러 올라가는 영국의 농업 혁명 이래로, 공용지는 혼란스러운 부처들 덕분에 단계별로 질서를 위해 재분류되고, 재울타리 쳐지고, 다양한 사적 및 공적 기관에 재할당되었다. 제국의 무게로 발뒤꿈치가 퉁퉁 부은 강력한 경제 덕분에 영국의 인구는 엄청나게 증가했다. 이는 런던이 은행가와 기계 시대에 우리와 함께 훌륭하게 버텨준 고통받는 농촌 주민들을 구제하기 위한 새로운 법을 제정하도록 만들었다."
 british_votes_results.1.t: "인클로저법 투표 결과"
 british_votes_results.1.d: "토지에 대한 법적 통제권을 갖게 되면서, 지주들은 작물 생산 방식에 혁신을 도입하고, 이익을 늘리며, 농업 혁명을 지지할 수 있습니다."
 british_votes_results.1.a: "찬성!"
 british_votes_results.1.b: "반대!"
 british_votes_results.1.c: "젠장!"
 british_votes.2.t: "혼인관계법"
 british_votes.2.a: "교회가 좀 더 자유로운 입장을 취할 때다."
 british_votes.2.b: "이것은 서약과 신에 대한 모욕이다!"
 british_votes.2.d: "오늘 우리 의회는 혼인관계법이라는 한 가지 문제에 대해 투표하고 있습니다. 이 법안은 기혼 부부가 의회 승인을 먼저 구하지 않고도 이혼할 수 있도록 허용합니다. 이 제안은 특히 보수 및 종교계로부터 비판을 받았지만, 자유주의자들로부터는 칭찬을 받았습니다. 이제 의회가 결정할 차례입니다.\n\n의회는 이어서 음란물 간행물법에 대해 투표할 것입니다."
 british_votes_results.2.t: "혼인관계법 투표 결과"
 british_votes_results.2.d: "이 법안은 성사(sacrament)가 아닌 계약에 기반한 결혼 모델을 확립하고, 무효 소송을 제기하거나 사적 법안을 추진할 여유가 있는 사람들 외에도 이혼의 범위를 넓힐 것입니다."
 british_votes_results.2.a: "찬성!"
 british_votes_results.2.b: "반대!"
 british_votes_results.2.c: "젠장!"
 british_votes.3.t: "음란물 간행물법"
 british_votes.3.a: "악덕에 대한 공격이다."
 british_votes.3.b: "아이디어를 포기한다."
 british_votes.3.d: "두 번째 의회 투표 안건은 음란물 간행물법입니다. 이 법이 통과되면, 대중에게 음란하다고 여겨질 수 있는 자료의 출판을 금지하게 될 것입니다. 여기에는 노출, 성관계, 과도한 음주나 욕설 등을 묘사하는 이미지를 포함하지만 이에 국한되지 않는 기타 불쾌한 자료도 포함됩니다. 자유주의자들은 이 법안에 대해 크게 반발하고 있지만, 많은 보수주의자들은 이를 지지하고 있습니다. 투표 후, 의회는..."
 british_votes_results.3.t: "음란물 간행물법 투표 결과"
 british_votes_results.3.d: "이 법안으로 음란물 및 인쇄물 판매가 불법화되었으며, 음란물 출판은 법적 경범죄가 될 것입니다."
 british_votes_results.3.a: "찬성!"
 british_votes_results.3.b: "반대!"
 british_votes_results.3.c: "젠장!"
 british_votes.4.t: "인도 통치법"
 british_votes.4.a: "대영 제국은 성장한다!"
 british_votes.4.b: "아이디어를 포기한다."
 british_votes.4.d: "아마도 우리 세계 제국에게 이보다 더 역사적인 가을은 없었을 것입니다. 오늘, 현 내각과 여왕 폐하의 뜻에 따라 동인도 회사는 인도 아대륙 전체에 대한 통제권을 얻는 동시에, 즉시 재편된 라지(Raj)에게 통제권을 넘겨주었습니다. 소위 인도 제국은 인도 국민들이 문명화된 상태와 세계 무대로 더 현재적으로 나아갈 수 있도록 했습니다. 가장 명망 높은 우리를 통해 인도 국민은 위대함에 도달할 것입니다."
 british_votes_results.4.t: "인도 통치법 투표 결과"
 british_votes_results.4.d: "이제 인도 통치권은 동인도 회사에서 왕실로 이관되며, 여왕의 수석 국무장관이 회사의 이사회의 권한과 의무를 받게 될 것입니다. 우리는 이것이 기존 인도 통치 시스템의 심각한 결함을 수정하기를 바랍니다. 이제 우리는 왕실이 인도 아대륙을 어떻게 통치할지 결정해야 합니다."
 british_votes_results.4.a: "찬성!"
 british_votes_results.4.b: "반대!"
 british_votes_results.4.c: "젠장!"
