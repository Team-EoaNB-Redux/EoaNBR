 eoanb_category_irish_unrest_ENG: "아일랜드의 불안정"
 eoanb_category_irish_unrest_ENG_desc: "아일랜드는 대영제국과 오랜 격동의 역사를 가지고 있으며, 이는 불만의 잠재적 흐름과 명백한 분노의 조짐으로 특징지어집니다.\n\n아일랜드는 1603년 튜더 왕가 시대부터 지배를 받아왔지만, 우리 국가로 편입되는 과정은 가톨릭 아일랜드인들과 잉글랜드, 웨일스, 스코틀랜드 출신의 프로테스탄트 정착민들 사이의 갈등과 투쟁으로 점철되어 왔습니다. 오늘날까지 수많은 반란이 진압되어야 했으며, 토착 아일랜드인들 사이에서 고조되는 공화주의 정서는 최근 '페니안'이라고 자칭하는 주요 독립 운동에 의해 부추겨지고 있습니다. 대영제국으로부터 자유로운 아일랜드 국가를 요구하는 그들의 메시지는 우리의 아일랜드 신민들에게 매우 매력적인 것으로 판명되었습니다.\n\n그러나 폭력을 통해 이를 달성하려는 그들의 메시지는 우리 총독에게 큰 골칫거리로 판명되었습니다. 페니안 형제단의 산발적이고 폭력적인 공격은 이 지역의 안정에 큰 타격을 주었습니다. 이 끊임없이 증가하는 요구들을 진압하기 위해 무엇을 해야 할지는 우리 스스로 결정해야 할 것입니다...\n\n 현재 불안: §R[?Root.ENG_irish_unrest]§!\n 현재 페니안 정보원: [?ENG_IRE_fenian_informants]"
 ENG_decision_ulster_revival: "얼스터 부흥"
 ENG_irish_unrest: "아일랜드 분리주의"
 britainirishunrest.1.t: "디버그: 아일랜드 분리주의 고정"
 britainirishunrest.1.d: "이 이벤트는 숨겨져 있으며 아일랜드 분리주의가 0 미만이거나 100을 초과하는 것을 방지합니다."
 britainirishunrest.1.a: "이벤트 닫기"
 britainirishunrest.2.d: "아름다운 아침이었습니다. 아마도 아침 해의 눈부신 광채 때문이거나, 산에서 불어오는 부드러운 바람 때문이었을 것입니다. 어떤 이유에서든, 최근 사건들은 얼스터 주민들에게 하나님께 더욱 감사할 이유를 주었습니다. 북아일랜드에서 기독교의 가르침과 도덕 철학에 대한 관심이 다시 불붙으며 얼스터 주민들 일부를 사로잡았습니다.\n\n이 부흥 운동은 여전히 상당히 작으며, 인근 작은 마을의 지역 평신도들만을 끌어들이고 있습니다. 코너 장로교회의 지역 목사 존 해밀턴 무어는 하나님에 대한 이 새로이 발견된 관심을 북아일랜드 전체로, 그리고 어쩌면 불씨가 거대한 불꽃을 지피듯이, 그 너머로 확산시키기 위한 작업을 시작했습니다..."
 britainirishunrest.2.t: "얼스터 부흥"
 britainirishunrest.2.a: "지지합니다!"
 britainirishunrest.2.b: "내버려 둡니다."
 britainirishunrest.3.t: "지주와 소작인 법 개정안 (아일랜드) 1860년"
 britainirishunrest.3.a: "지지합니다!"
 britainirishunrest.3.b: "내버려 둡니다."
 britainirishunrest.3.d: "데이지법으로 더 잘 알려진 지주와 소작인 법 개정안 (아일랜드) 1860년은 아일랜드의 농업 불안정보다 앞선 의회 법안이었습니다. 이 법안은 파머스턴 경의 자유당 정부에서 아일랜드 법무장관이었던 리카드 데이지의 이름을 따서 명명되었습니다. 데이지법은 지주와 소작인 (아일랜드) 법 1826년을 개정했습니다. 1860년 법 자체는 아일랜드 토지법에 의해 개정되었습니다."
 britainirishunrest.4.t: "아일랜드 왕실 순회"
 britainirishunrest.4.d: "여왕 폐하의 왕실 고문들에 따르면, 여왕과 그녀의 부군인 작센코부르크고타 공작 앨버트가 아일랜드 방문을 계획하고 있다고 합니다. 왕실 가족의 최상급 보호를 보장하기 위해 모든 마을에 경비대가 배치될 예정입니다. 왕실 금고에서 여행 비용을 충당할 것이며, 전용 페리가 그들을 아일랜드로 오가게 할 것입니다.\n \n여정은 더블린에서 시작될 것이며, 엄선된 아일랜드 본토의 여러 중요한 장소들을 방문할 예정입니다. 그들은 더블린 시에서 벨파스트 근처의 마을인 던독으로 이동하여 로슈 성을 방문할 예정입니다. 벨파스트로 가는 길에는 마을에 들어가기 전에 장엄한 자이언츠 코즈웨이의 절경을 방문할 것으로 예상됩니다. 그 후, 그들은 런던데리로 이동하여 마침내 마차를 타고 골웨이로 향할 것이며, 거기서 모허 절벽을 관광할 것으로 예상됩니다. 그들은 소박한 코크 마을에서 여정을 마치고 더블린으로 돌아온 다음, 배를 타고 리버풀로 돌아갈 것입니다.\n남은 것은 이번 방문에 대한 승인 또는 불승인뿐입니다..."
 britainirishunrest.4.a: "더블린으로 출발합니다!"
 britainirishunrest.4.b: "아마 그들이 가지 않는 것이 더 나을 것입니다..."
 ENG_decision_deasy_act: "데이지법"
 ENG_decision_deasy_act_desc: "'아일랜드 토지 소유주 및 소작인 법 개정안', 또는 점차 '데이시 법'으로 불리는 이 법안은 1826년에 통과된 이전 법률안에 대한 개정안입니다.\n\n이 제안은 토지 소유권의 상태를 이전의 봉건적 공물 및 서비스 지불 방식이 아닌 계약상 의무를 기반으로 한 시스템으로 변경할 것을 제안합니다. 이 개정안은 봉건적 소작 방식을 중단하고, 제4조에 따라 12개월 이후의 모든 임대 계약이 집행력을 가지려면 서면으로 증명되어야 하는 법적 구속력이 있는 계약으로 대체하도록 할 것입니다.\n\n이 제안은 토지 거래에 유연성을 부여하고, 또한 법에 따라 적절하게 증명되지 않은 토지를 압류할 수 있는 능력을 우리에게 제공할 것입니다."
 britainirishunrest.5.t: "코크에서의 폭동"
 britainirishunrest.5.d: "코크에서 격렬한 폭동이 발생했습니다! 코크 시민들의 자발적인 소요로 수백, 아니 수천 개의 창문, 가스등, 상점 진열대가 강제로 파괴되었습니다. 이 사건 자체는 갑작스러워 보였지만, 아일랜드 공화주의 형제단의 대의와 관련된 여러 포스터와 팸플릿이 이러한 행동을 조장한 것으로 밝혀졌습니다.\n\n이번 폭동은 웨일스 공과 덴마크 공주의 최근 결혼에 대한 충성스러운 신민들의 광범위한 기쁨 때문이었는데, 이 행사는 아일랜드 민족주의에 대한 모욕으로 받아들여졌습니다. 이러한 폭동은 지역 안정에 큰 문제가 되고 있습니다..."
 britainirishunrest.5.a: "그들을 막으세요!"
 britainirishunrest.6.t: "폭동에 대한 영국 대응"
 britainirishunrest.6.d: "섬 주민들은 이 아일랜드 폭동이 시작된 이래로 아무런 관심도 보이지 않았지만, 이 갈등의 고조는 확실히 대부분의 사람들의 관심을 사로잡았습니다. 이 상황에 개입해야 할지 말아야 할지에 대한 질문은 거리를 혼란스럽게 만들었습니다. 쇠주먹으로 폭동에 맞서 불을 불로 싸울 것인가, 아니면 다른 불처럼 스스로 타버리도록 내버려둘 것인가?"
 britainirishunrest.6.a: "불을 불로 맞선다."
 britainirishunrest.6.b: "그들이 싸우게 내버려 둔다."
 britainirishunrest.7.t: "체스터 성을 점령하려는 피니언의 시도"
 britainirishunrest.7.d: "마이클 데이빗이 지휘하는 아일랜드 공화국 형제단의 한 단체가 무기를 탈취하기 위해 체스터 성을 급습하려 하고 있습니다. 우리는 그들을 막아야 합니다!"
 britainirishunrest.7.a: "도대체 아일랜드에서 무슨 일이 벌어지고 있는 겁니까?"
 britainirishunrest.8.t: "급습 성공!"
 britainirishunrest.8.d: "대영제국 군인들과 아일랜드의 임시 폭도들 사이의 계속되는 급습과 소규모 전투는 병사들의 피가 들판과 거리에 흩뿌려지면서 마을들을 계속해서 파괴하고 있습니다. 특히 한 급습은 모두의 눈에 띄었습니다. 왕실 군인들이 아일랜드 폭동 단체를 포위하면서 언급된 급습은 성공적으로 끝났습니다. 왕가를 위한 영광스러운 승리입니다."
 britainirishunrest.8.a: "왕가를 위한 승리"
 britainirishunrest.9.t: "급습 실패!"
 britainirishunrest.9.d: "대영제국 군인들과 아일랜드의 임시 폭도들 사이의 계속되는 급습과 소규모 전투는 병사들의 피가 들판과 거리에 흩뿌려지면서 마을들을 계속해서 파괴하고 있습니다. 특히 한 급습은 모두의 눈에 띄었습니다. 왕실 군인들이 자신들의 위치를 포위하고 있는 더 많은 아일랜드 폭도들에게 수적으로 열세에 놓이면서 언급된 급습은 실패로 끝났습니다. 왕가를 위한 굴욕적인 패배입니다."
 britainirishunrest.9.a: "왕가를 위한 끔찍한 패배"
 britainirishunrest.10.t: "아일랜드 사람들"
 britainirishunrest.10.d: "더블린의 G 사단 경찰관들이 도시에서 새로운 신문이 유포되고 있음을 주목했습니다. '아이리시 피플'이라는 이 신문은 영국 지배 하의 아일랜드 기존 질서에 대해 비판적으로 서술하고, 아일랜드 민족주의적 글이 담긴 옛 신문들을 대영제국 전역의 주소로 배송하겠다고 제안합니다. 이 신문들 중 다수는 우리가 이전에 탄압했던 오래된 출판물입니다. '아이리시 피플'은 아일랜드 문제에 대해 그들이 어느 편에 서 있는지 명확히 보여주었으며, 그 편은 우리의 편이 아닙니다. 아마도 이 출판물을 폐간할 때가 된 것 같습니다?"
 britainirishunrest.11.t: "피니언 지도자들을 체포하십시오."
 britainirishunrest.11.d: "'피니언'이라는 단어는 아일랜드 공화국 수립에 전념하는 비밀 정치 단체인 아일랜드 공화국 형제단(Irish Republican Brotherhood)과 피니언 형제단을 통칭하는 용어입니다. 최근 더블린의 한 창고에 왕립 경찰이 침입하여 이 단체 소속 12명의 구성원을 체포하고 투옥했습니다. 이 시설은 버려지기 직전에 수색되었습니다. 이 야만인들에 맞서 왕가가 승리합니다."
 britainirishunrest.11.a: "빨리 하세요!"
 britainirishunrest.12.t: "아일랜드의 피니언 봉기"
 britainirishunrest.12.d: "아일랜드의 불만은 수년 동안 증가해 왔습니다. 이제 정점에 달했으며, 이 문제를 어떻게 다룰지에 대한 몇 가지 선택지가 있습니다.\n첫째, 아일랜드에 대한 우리의 통치에 저항하는 어떤 움직임이든 진압할 수 있습니다. 하지만 이는 장기적인 해결책이 아니며, 미래에 더 많은 문제에 직면할 가능성이 높습니다.\n둘째, 아일랜드 자치권을 허용할 수 있습니다. 이는 아일랜드 의회가 국내 문제에 책임을 지되, 영국은 전반적인 입법 주권을 유지한다는 것을 의미합니다. 비슷하게, 이중 군주제를 확립할 수도 있습니다. 아일랜드는 공통된 왕실 충성으로 통합되지만, 국내외 문제에 대한 자유를 가지며 동등한 지위를 갖게 될 것입니다.\n마지막 선택지는 아일랜드에 완전한 독립을 부여하여, 더 이상의 유혈 사태 위험을 제거하는 것입니다. 하지만 물론, 우리가 영국 연합왕국의 주요 부분을 해방시킨다면 우리의 위신을 잃을 것입니다.\n어떻게 진행해야 할까요?"
 britainirishunrest.12.a: "그들을 진압하십시오!"
 britainirishunrest.12.b: "자치 통치!"
 britainirishunrest.12.c: "아일랜드에 자유를!"
 britainirishunrest.12.e: "이중주의!"
 britainirishunrest.13.t: "아일랜드 독립 회복"
 britainirishunrest.13.d: "켈트족이자 로마 가톨릭 신자인 아일랜드 사람들은 겉보기에는 영국 내 다른 사람들과 다릅니다. 그러나 그것은 12세기부터 잉글랜드인들이 아일랜드를 침략하는 것을 막지 못했습니다. 잉글랜드에서 온 노르만 정착민들과 함께 잉글랜드와 개신교 문화가 아일랜드로 들어왔고, 옛 게일 아일랜드는 노르만 아일랜드로 대체되었으며, 이는 결국 합쳐져 통일된 아일랜드 문화를 형성했습니다. 16세기까지 아일랜드는 큰 자치권을 가졌지만, 잉글랜드의 섬 (재)정복 이후 폐지되었습니다. 영국 정부에 의해 억압된 아일랜드인들은 1782년에 입법 독립이 회복되었을 때처럼 성공적으로 반란을 일으켜 그들의 권리를 되찾았습니다. 비록 대영제국과 아일랜드가 하나의 왕국으로 통합되고 19세기에 여러 법률에 의해 아일랜드 가톨릭 신자들이 해방되었지만, 아일랜드 분리주의자들은 막을 수 없었습니다. 1803년 아일랜드 의회 폐지나 1840년대 후반의 대기근과 같은 결정들도 도움이 되지 않았습니다. 결국 영국은 지난 몇 달, 몇 년 동안 폭력과 불안이 급증한 후 아일랜드가 스스로 통치하도록 허용해야 했습니다. 영국인들은 그러한 결정이 아일랜드가 현재 겪고 있는 어려운 상황을 진정시키는 데 도움이 될 수 있다고 생각합니다. 이것이 사실일 수 있지만, 영국에 의해 독립이 승인된 지금 아일랜드가 어떻게 될지, 또한 영국이 어떤 결과를 초래할지, 다른 사람들이 아일랜드 독립에 어떻게 반응할지에 대한 의문을 제기합니다."
 britainirishunrest.13.a: "하느님, 아일랜드를 구하소서..."
 britainirishunrest.14.t: "피니언 반란이 영국 통치를 위협합니다."
 britainirishunrest.14.d: "누구도 생각했던 것보다 더 강력한 반란 속에서 피니언이라고도 알려진 아일랜드 형제단이 봉기했습니다. 그들은 이미 아일랜드 남부의 대부분을 장악했으며 더블린에 새로운 아일랜드 공화국을 선포했습니다. [ENG.GetNameDef] 당국은 아일랜드가 제국에서 완전히 벗어나기 전에 반격하기 위해 몸부림치고 있습니다."
 britainirishunrest.14.a: "되찾아라!"
 britainirishunrest.14.b: "에이레를 위해!"
 britainirishunrest.14.c: "영국의 약점인가?"
 britainirishunrest.15.t: "아일랜드 원조 요청"
 britainirishunrest.15.d: "아일랜드의 모든 부문에서 거친 전환이 있었습니다. 그들은 앞으로 몇 년 동안 생존하는 데 도움이 될 약간의 지원을 우리에게 요청했습니다."
 britainirishunrest.15.a: "원조 거부"
 britainirishunrest.15.b: "약간의 원조를 보냅니다."
 britainirishunrest.15.c: "충분한 원조를 보냅니다."
 britainirishunrest.16.t: "아일랜드로 플레이하시겠습니까?"
 britainirishunrest.16.d: "아일랜드로 게임을 계속하시겠습니까? 이것은 국가를 전환할 수 있는 유일한 기회입니다."
 britainirishunrest.16.a: "아일랜드로 플레이"
 britainirishunrest.16.b: "영국으로 계속"
 britainirishunrest.17.t: "아일랜드 연합주의 정부가 지원을 요청합니다!"
 britainirishunrest.17.d: "아일랜드의 연합주의 정부는 최근 많은 잘못된 결정을 내렸습니다. 그 결과, 아일랜드 사람들은 공화주의 대의로 몰려들었습니다. 연합주의 정부는 확실히 권력을 잃을 것입니다. 그들은 권력을 유지하고 아일랜드의 질서를 회복하는 데 도움을 요청했습니다. 비록 비용이 많이 드는 작전일 수 있지만, 아일랜드가 대영제국의 일부로 남을 것임을 보장할 것입니다."
 britainirishunrest.17.a: "지원을 거부합니다."
 britainirishunrest.17.b: "지원을 보냅니다."
 britainirishunrest.18.t: "왕실 순회 — 더블린"
 britainirishunrest.18.d: "불과 몇 시간 전에 여왕은 페리를 타고 더블린으로 향했고, 그곳에서 지역 주민들의 꽤 좋은 환영을 받았습니다. 불행하게도 그녀의 도착은 머리 위로 형성되는 천둥치는 구름과 함께 맞이했으며, 더블린 거리를 칙칙하고 진흙투성이로 만들었습니다. 다음 날 구름이 걷히고 하늘에서 태양이 비치자 많은 사람들이 그들의 군주를 보기 위해 모였습니다. 여왕과 그녀의 배우자는 마차를 타고 성 스티븐스 그린으로 갔고, 그곳에서 그들은 머리 위로 솟아난 놀랍도록 푸른 나무들과 햇빛에 반짝이는 에메랄드빛 바다와 같은 앞의 호수 아래에 앉아 오후의 차와 크럼펫을 즐겼습니다. 던독으로 가는 그들의 여정은 며칠 안에 도착할 것으로 예상되므로, 그들은 트리니티 칼리지와 GPO 증언 역사 박물관과 같은 곳을 둘러보며 남은 시간을 보낼 계획입니다."
 britainirishunrest.18.a: "던독으로 안전한 여행이 되십시오!"
 britainirishunrest.19.t: "왕실 순회 — 던독"
 britainirishunrest.19.d: "로슈 성의 오래된 돌은 한때 깊은 해자와 튼튼한 성벽으로 둘러싸인 난공불락의 요새로 서 있었습니다. 그것은 큰 암석 노두 위에 세워졌으며 주변 시골 지역의 넓은 경치를 볼 수 있습니다. 이제 그것은 예전의 모습에 대한 그림자에 불과하며, 그 벽은 세월의 고통을 겪고 무너진 기초는 폐허로 변하고 있습니다. 한때 성을 둥근 탑 전초기지와 연결했던 비밀 통로는 수세기 동안의 격렬한 폭풍으로 무너진 잔해와 흙에 의해 막혔습니다. 여왕은 남편과 함께 오후에 그것을 보기 위해 마차를 타고 간 후 오래된 성을 특히 좋아했습니다. 현지인들은 그들이 구조물의 아름다움을 감상하며 몇 시간 동안 그곳에 있었다고 말했습니다. 며칠 후, 그들은 벨파스트로 기차를 타고 떠나기 전에 성 패트릭 교회에서 교회를 관람하는 모습이 보였습니다."
 britainirishunrest.19.a: "역사에 대한 놀라운 상기"
 britainirishunrest.20.t: "왕실 순회 — 벨파스트"
 britainirishunrest.20.d: "여왕과 그녀의 가족이 벨파스트에 도착하자 현지인들은 큰 흥분을 느꼈습니다. 진정으로 소중히 여길 순간이었습니다. 많은 충성파들은 그녀가 방문 기간 동안 머물 집으로 도착할 때까지 거리에서 그녀의 이름을 환호했습니다. 그곳으로의 여행은 유쾌한 여행 중 하나였으며, 많은 상점에 들러 대장장이와 가게 주인들로부터 현지 토큰과 장신구를 구입했습니다. 많은 저체중 및 영양실조에 걸린 나이든 아일랜드인들은 그녀의 마차에 불만을 품은 눈초리를 던지고 침을 뱉었지만, 여왕은 알아차리지 못한 것 같았습니다. 하이라이트는 고대 화산 균열 분출의 결과인 약 4만 개의 맞물린 현무암 기둥 지역인 자이언츠 코즈웨이에 도착하는 것이었습니다. 전설에 따르면 두 거인이 결투 전에 그곳을 만들었고, 한 거인이 패배하자 아일랜드해를 건너 도망쳐 그곳에 동일한 현무암 기둥을 남겼다고 합니다. 그녀의 배우자는 이야기에 즐겁게 흥미를 느꼈고, 싸움이 일어났던 곳으로 내려갔습니다. 이후 런던데리로 가는 여정은 폭풍과 천둥이었습니다."
 britainirishunrest.20.a: "볼만한 광경"
 britainirishunrest.21.t: "왕실 순회 — 런던데리"
 britainirishunrest.21.d: "런던데리에 도착은 빠르고 간결했습니다. 쏟아지는 비 때문에 그들의 휴가 별장으로 가는 길에 예정에 없던 정차를 할 수 없었기 때문입니다. 여왕은 다음 날 아침 그들의 첫 번째 방문지였던 런던데리 성벽의 역사에 대해 밤새도록 읽었다고 합니다. 런던데리는 아일랜드에서 유일하게 완전히 온전한 성벽 도시이자 유럽에서 가장 훌륭한 성벽 도시 중 하나입니다. 이 성벽은 북아일랜드에서 국가가 관리하는 가장 큰 기념물이며, 유럽에서 가장 마지막으로 건설된 성벽 도시의 일부로서 가장 완전하고 장관을 이룹니다. 이곳은 105일 동안 지속된 1689년 더리 공성전을 포함하여 여러 공성전을 견뎌내고 요새가 함락되지 않은 유럽의 몇 안 되는 도시 중 하나이며, 따라서 이 도시의 별명은 '처녀 도시(The Maiden City)'입니다. 이전에 들렀던 로슈 성에서처럼, 그들은 도시를 둘러싼 성벽에 감탄하며 몇 시간을 보냈습니다. 지역 상점에 들르고 훌륭한 식당에서 점심을 먹은 후, 그들은 골웨이로 여행을 계속했습니다."
 britainirishunrest.21.a: "골웨이로 안전한 여행이 되십시오!"
 britainirishunrest.22.t: "왕실 순회 — 골웨이"
 britainirishunrest.22.d: "런던데리에서 골웨이로 가는 마차 여행은 벤불벤의 매혹적인 숲과 같은 곳을 지나면서 가족에게 훌륭한 모험으로 여겨졌습니다. 골웨이는 비를 제외하고는 런던데리와 다르지 않았습니다. 그들의 도착은 큰 흥분 없이 맞이되었지만, 이는 왕실 가족에게는 괜찮았습니다. 그들은 모허 절벽에 있는 다소 한적한 집에 머물 계획이었기 때문입니다. 절벽 위와 탑 위에서 방문객들은 골웨이 만의 아란 제도, 북쪽의 골웨이 주에 있는 마움터크스 산맥과 트웰브 핀스 산맥, 그리고 남쪽의 루프 헤드를 볼 수 있습니다. 아이들 중 아무도 멀리서 보는 것을 제외하고는 절벽의 끊임없이 확장되는 돌출부를 위에서 볼 수 없었기 때문에, 그들은 아래에서 다양한 동물들, 즉 회색 물범, 돌고래, 밍크고래, 돌묵상어, 그리고 가끔 개복치를 보며 즐거운 시간을 보냈습니다. 여왕과 그녀의 배우자는 대부분의 시간을 나무 그늘 아래에서 현지 소와 아일랜드 토끼와 같은 현지 요리를 즐기며 보냈습니다. 코크로 가는 기차 여행은 아일랜드 시골의 평평한 평야를 보면서 가족에게 즐거운 시간이었습니다."
 britainirishunrest.22.a: "평생 한 번 볼 만한 경치"
 britainirishunrest.23.t: "왕실 순회 — 코크"
 britainirishunrest.23.d: "소박한 마을인 코크는 가족들이 일찍 도착하고 원래 제안했던 집이 제공할 수 없었기 때문에 그들의 가장 좋은 집을 가족들에게 제공했습니다. 가족은 먼저 코크 시 중심에 있는 시립 식품 시장인 잉글리시 마켓에서 식료품을 구입했습니다. 이 시장은 프린스 스트리트에서 그랜드 퍼레이드까지 이어지며 프린스 스트리트 마켓과 그랜드 퍼레이드 마켓을 결합합니다. 적절한 영국 음식과 물건의 편안함을 느끼며 그들은 글렌뷰 가든으로 향했습니다. 앞 정원에는 가라앉은 하얀 정원, 이탈리아식 운하, 일본식 정원이 있습니다. 경계 등나무 산책로는 습지 정원과 숲 지역으로 이어지며, 그곳의 찻집에서는 지중해와 열대 정원을 조망할 수 있습니다. 야생화 초원으로 둘러싸인 자작나무 언덕으로 산책하고, 담으로 둘러싸인 주방 정원으로 들어가서 제철 채소를 구경했습니다. 수많은 다른 문화의 화려한 모습은 가족들을 겸허하게 만들었고, 그들은 마차를 타고 페리를 타기 위해 더블린으로 돌아갔습니다."
 britainirishunrest.23.a: "더블린으로 안전한 여행이 되십시오!"
 britainirishunrest.24.t: "왕실 순회 — 더블린으로 귀환"
 britainirishunrest.24.d: "여왕이 더블린으로 돌아왔을 때, 많은 사람들이 그녀의 도시 도착에 등을 돌리거나 혐오감을 나타내면서 그녀의 귀환에 대한 환영은 그렇게 좋지 않았습니다. 왕실 가족은 뜻밖의 방문객들을 만났는데, 그들은 연합주의자들에게 좋은 빛을 비추고 그들이 지나친 많은 사람들의 사기를 높였으므로 곧 돌아와 달라고 요청하며 선물과 작별 인사를 했습니다. 리버풀로 돌아가는 페리는 짧았고 악천후로 인해 중단되지 않았으며, 왕실 가족은 런던에 있는 집으로 돌아갔습니다."
 britainirishunrest.24.a: "곧 돌아오십시오, 폐하!"
