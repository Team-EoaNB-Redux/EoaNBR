 british_votes.22.t: "아일랜드 교회의 폐지 및 교구 재산 몰수"
 british_votes.22.a: "아일랜드 교회는 더 이상 존재하지 않으며, 영국 국교회는 더 이상의 힘을 가질 자격이 없다."
 british_votes.22.b: "지금 우리에게 필요한 것은 통합이다, 아일랜드 교회는 남아 있어야 한다!"
 british_votes.22.d: "오늘 이 고요한 여름날 런던에서는 보수주의자들과 자유주의자들이 아일랜드 교회가 계속 존재해야 하는지 여부를 놓고 치열한 논쟁을 벌였습니다. 논쟁이 너무 격렬해져서 여왕 폐하가 직접 중재해야 했습니다. 한편, 글래드스턴의 현 내각은 종교적, 세속적 아일랜드 조직 모두에 더 큰 자율성이 허용되어야 한다고 믿으며 이 법안을 지지합니다. 나아가, 이는 영국 국교회가 더 이상 잉글랜드, 웨일스, 아일랜드의 공식 교회가 되어서는 안 된다는 자유당의 탈국교주의와 일치합니다. 이 법안에 반대하는 것은 엘리자베스 타워 아래에서 반탈국교주의가 전설적인 보수주의자들입니다. 우리는 영국 국교회의 힘을 약화시켜야 할까요, 아니면 그대로 두되 활력을 불어넣어야 할까요?"
