 british_votes.21.t: "1870년 초등 교육법"
 british_votes.21.a: "법안 통과"
 british_votes.21.b: "법안 실패"
 british_votes.21.d: "일반적으로 포스터 교육법으로 알려진 1870년 초등 교육법은 잉글랜드와 웨일스의 5세에서 12세 사이의 모든 아동을 위한 교육의 틀을 마련했습니다. 이 법은 정의된 권한을 가진 지역 교육 당국을 설립하고, 기존 학교를 개선하기 위한 공적 자금을 승인하며, 보조금에 대한 조건을 마련하여 관리자들의 호감을 얻으려 했습니다. 이 법은 오랫동안 교육 발전의 이정표로 여겨져 왔지만, 최근 평론가들은 이것이 무상 또는 의무 교육을 가져오지 않았으며, 따라서 그 중요성이 커지기보다는 오히려 감소하는 경향이 있다고 강조했습니다.[이 법은 자유당 의원인 윌리엄 포스터가 초안을 작성했으며, 비록 그들의 요구 사항을 완전히 충족하지는 않았지만, 전국 교육 연맹의 운동 이후 1870년 2월 17일에 도입되었습니다. 버밍엄에서는 아직 의회 의원이 아니었던 조셉 체임벌린이 이 문제에 대한 저명한 운동가였습니다. 그러나 많은 풀뿌리 자유주의자들과 마찬가지로 그는 영국 국교회 학교에 지역 납세자들의 돈으로 보조금을 지급할 가능성이 있다는 이유로 이 법안에 반대했습니다."
