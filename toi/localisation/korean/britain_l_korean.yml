 british_votes.16.d: "의회를 통해 영국의 의사들을 규제하고 감독하기 위해 만들어진 복합체인 영국 의학 협회가 오늘 엘리자베스 타워 아래에서 설립되었습니다. 또한, 이 법안은 누가 의료 행위를 할 수 있는지에 대한 이 협회의 자체 문서를 공개했습니다. 투명성과 정당성을 위해 이것이 만들어졌으며, 비슷한 영국의 원칙에 따라 이 법안은 계속될 것입니다."
