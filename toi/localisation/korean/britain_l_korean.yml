 british_votes.27.d: "잉글랜드의 공중 보건과 관련된 법률을 통합하고 개정하기 위한 법안입니다. 그 목적은 콜레라와 티푸스 같은 많은 질병의 확산을 포함하여 다양한 건강 위협을 야기하는 더러운 도시 생활 환경에 대처하기 위한 이전의 조치들을 성문화하는 것이었습니다."
