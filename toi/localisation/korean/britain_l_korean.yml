 british_votes.10.t: "음식 및 음료 혼합법"
 british_votes.10.a: "우리는 이 문제를 해결하기 위해 스스로를 동원해야 한다"
 british_votes.10.b: "그 강연은 시간 낭비였어, 교수를 침묵시켜!"
 british_votes.10.d: "오늘 왕립 예술 협회에서 충격적인 강연이 열렸습니다. 에드워드 랭케스터 박사가 교수들과 일반 대중 앞에서 런던에서 판매되는 빵의 87%와 우유의 74%가 혼합되었다는 통계를 발표했습니다. 현 내각은 이제 행동에 나서서, 영국의 이익을 위해 이 사람의 발언을 억압하거나 의회에서 공유해야 합니다."
