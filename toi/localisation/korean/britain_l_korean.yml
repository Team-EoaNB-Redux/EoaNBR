 ENG_riots_corck: "폭동에 대한 대응"
 ENG_riots_corck_desc: "코크 시는 이전에 우리가 다루었던 관련 운동과 연계된 아일랜드 민족주의자들의 온상(핫베드)이었습니다. 한동안 그들의 움직임이 상당히 미미했지만, 영국 관리와 충성파 아일랜드인을 모두 공격한 갑작스럽고 폭력적인 폭동은 용납할 수 없습니다.\n\n그들의 흉악한 행위는 즉각적인 대응을 요구합니다! 하지만 문제는, 우리가 온건하게 대응해야 할까요, 아니면 코크에서 보인 야만성과 똑같이 대응해야 할까요?"
