 eng_fenian_leader_arrest: "피니언 조직가 체포"
 eng_fenian_leader_arrest_desc: "IRB와 피니언 형제단은 아일랜드 전역에서 다양한 급습과 반란을 공동으로 조직하려 했습니다! 아일랜드 전역에서 다양한 폭동, 반란 및 공격이 발생했습니다. 심지어 캐나다에서도 일어났습니다! 폭동 한두 건은 이것에 비하면 아무것도 아닙니다... 우리는 이것으로 충분합니다. 우리는 이 반란의 지도자들을 체포하고 그들의 범죄에 대해 심판받게 할 것입니다!"
