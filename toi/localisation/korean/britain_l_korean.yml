 ENG_mission_britain_rules_the_waves: "영국 해군 패권"
 ENG_mission_britain_rules_the_waves_desc: "왕립 해군은 세계 함대 중 단연코 가장 강력했습니다. 영국 제도를 침략으로부터 보호했으며, 전쟁 시에는 적의 항구를 봉쇄할 준비가 되어 있었습니다. 그러나 근본적으로 그 목적은 무역을 보호하는 것이었습니다. 영국은 수입품에 의존했으며, 경제적 번영은 해상 무역에 달려 있었습니다. 영국의 해군 패권에 대한 어떠한 위협도 국가 자체에 대한 위협이었습니다."
