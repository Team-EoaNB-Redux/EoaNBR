 british_votes.24.t: "수도 대중 마차법"
 british_votes.24.a: "인가된 마차 소유주와 운영자는 좋은 것이다."
 british_votes.24.b: "런던은 거리를 사람들에게 맡기고, 정부가 어디에 간섭하는지 신경 써야 한다."
 british_votes.24.d: "우리의 가장 분주한 도시들(예: 런던, 버밍엄, 리즈)의 거리가 점점 더 혼란스러워지고 있다는 것은 분명합니다. 구체적으로, 이 법안은 끊임없이 붐비는 영국의 거리에서 마차를 소유하고 운영하기 위해 면허를 요구합니다. 우리는 공공 사회를 더 규제하거나, 정부 개입을 늦춰야 합니다."
