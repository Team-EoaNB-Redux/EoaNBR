 british_votes.37.d: "제안된 법안에 260개 부분이 포함된 법으로, 시의 적절하게 제공되는 서비스의 품질을 보장하고 산업 혁명으로 인한 잉글랜드 전역의 인구 증가를 돕기 위해 필요한 수용 능력 증가를 촉진하기 위해 사유화 및 공공 소유가 된 시 서비스와 관련된 정보를 포함합니다."
