 belgium_event.11.t: "\"튀긴 감자 막대기\"의 확산"
 belgium_event.11.d: "남아메리카에서 유럽으로 감자가 전래된 이후, 그 용도는 항상 제한적으로 여겨졌습니다. 감자 샐러드, 으깬 감자, 삶은 감자가 주요 섭취 방식이었는데, 그 자체로는 맛있는 식사가 되지 못했습니다. 18세기에 벨기에 요리사들은 감자를 깍둑썰기하여 기름에 튀기는 새로운 섭취 방식을 발명했습니다. 이 조리법은 이미 오래된 소식일 수 있지만, 이제 새로운 요리사들이 이를 튀기는 새로운 방법을 발견했습니다. 막대기 모양으로 잘라 봉지에 담아 먹을 수 있게 되면서, 거리에서도 판매할 수 있게 되었습니다. 이것은 최근 가장 큰 도시들을 중심으로 인기를 얻고 있으며, 많은 노점상들이 그 잠재력을 보기 시작했습니다."
 belgium_event.11.a: "'프리츠'가 더 잘 맞는 이름일 것이다."
 belgium_event.15.t: "대륙 선언"
 belgium_event.15.d: "지난 몇 년 동안 유럽의 외교 상황이 악화되었습니다. 오스트리아와 덴마크와의 전쟁은 프로이센의 전쟁광적인 면모를 보여주었고, 이에 대응하여 프랑스는 거리를 두기 시작하며 잠재적인 공격을 준비하고 있습니다. 그리고 독일 땅의 재통일과 함께, 이 모든 것의 한가운데에 있는 우리는 이 체제에서 우리의 위치를 주장해야 합니다. 오늘 우리의 국왕 레오폴드 2세는 그의 통치를 강화하면서 새로운 벨기에 외교의 길을 선언했습니다. \"우리는 새로운 유럽 질서의 가장자리에 있으며, 이를 인지하거나 결과를 치러야 합니다.\"라고 그는 선언 중에 말했지만, 우리는 이 인지가 영국이 지지하는 런던 조약이 요구하는 외교적 독립으로 이어질지, 아니면 반대로 잠재적인 프랑스-프로이센 전쟁에 대한 우리의 개입으로 이어질지 결정해야 합니다."
 belgium_event.15.a: "정의로운 편의 동맹국"
 belgium_event.15.b: "이 체제에서 우리의 위치를 방어하자"