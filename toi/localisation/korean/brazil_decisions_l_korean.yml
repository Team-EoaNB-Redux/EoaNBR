 BRA_decision_mortgage_land_act_1857_desc: "토지 담보 개혁법을 제안합니다."
 BRA_decision_army_discipline_1857: "육군과 해군의 규율 개선"
 BRA_decision_army_discipline_1857_desc: "육군과 해군의 규율 개선을 제안합니다."
 BRA_decision_improve_criminal_law_1857: "형사 및 절차법 개선"
 BRA_decision_improve_criminal_law_1857_desc: "형사 및 절차법 개선을 제안합니다."
 BRA_decision_rethink_taxes_1857: "관세법 개정"
 BRA_decision_rethink_taxes_1857_desc: "관세 검토를 제안합니다."
 BRA_decision_navy_leader_promotion_act_1857: "해군 장교 진급법"
 BRA_decision_navy_leader_promotion_act_1857_desc: "해군 장교 진급을 위한 법률 제정을 제안합니다."
 BRA_decision_the_ponta_da_areia_factories: "폰타 다 아레아 시설의 포병 공장 재건"
 BRA_decision_the_ponta_da_areia_factories_desc: "1857년 같은 해에 대의원으로 선출된 것에 대한 보복으로 이리네우 이방젤리스타 지 소자(마우아 남작)가 소유한 리우데자네이루 주의 '폰타 다 아레아 공장(Fábricas Ponta da Areia)' 시설이 방화로 파괴되었습니다. 공장 재건은 국가 경제 개선에 도움이 될 수 있습니다."
 BRA_decision_the_ponta_da_areia_machinary: "기계 부품에 투자"
 BRA_decision_gold_mines_1857: "금광 투자법"
 BRA_decision_acquire_gold_from_mines: "미나스제라이스의 금에 투자"
 BRA_decision_acquire_gold_from_mines_desc: "미나스제라이스 주의 금광에 투자하는 것은 브라질 은행을 안정시키는 데 도움이 될 수 있습니다."
 BRA_decision_national_bank_monopoly_1857: "지폐 발행 독점"
 BRA_decision_ban_slave_trade_1857: "노예 무역 금지법 강화"
 BRA_decision_ban_slave_trade_1857_desc: "브라질의 국제 노예 무역을 금지한 이우제비우 지 케이로스 법을 강화해야 합니다. 특정 조항을 개정하면 그 효과가 증가하고 국제 노예 무역과의 싸움에 도움이 될 것입니다."
 BRA_decision_commerce_regulation_1857: "상법 규제법"
 BRA_decision_commerce_regulation_1857_desc: "상법의 일부 조항을 변경하면 브라질 제국 경제에 상당한 개선을 가져올 수 있습니다."
 BRA_decision_protectionist_fees_1857: "무역 및 산업 보호 수수료법"
 BRA_decision_protectionist_fees_1857_desc: "산업 생산을 늘리기 위해, 알베스 브랑쿠 법은 브라질 제국의 현지 생산에 이미 존재하는 특정 제품의 수입에 세금을 부과합니다. 이 법은 브라질 제국 산업화의 시작을 담당하고 있으며, 수입 제품으로부터 국가 생산을 더욱 보호하기 위해 개정되어야 합니다."
 BRA_decision_land_law_1857: "토지법 강화"
 BRA_decision_land_law_1857_desc: "토지법은 브라질 제국에서 사유 재산에 대해 처음으로 조직하려는 시도였습니다. 이 법을 개정하면 서부의 토지 식민지화와 노동력 증가에 도움이 될 수 있습니다."
 BRA_decision_navy_officer_promotion_1857: "해군 장교 진급법"
 BRA_decision_navy_officer_promotion_1857_desc: "해군 장교의 진급을 위한 공정한 법률을 제안합니다."
 BRA_decision_military_reform_1857: "육군 개혁을 제안합니다."