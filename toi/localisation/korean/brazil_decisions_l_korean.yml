 BRA_decision_expand_ipanema_foundry: "이파네마 주조소 확장"
 BRA_decision_expand_ipanema_foundry_desc: "철 생산을 지원하고 헤알 파브리카 지 페후 상 주앙 두 이파네마를 확장하는 것은 브라질 국영 철강 산업의 탄생이 될 수 있습니다."
 BRA_decision_olinda_1857_ministers: "올린다 내각 구성 고문 임명"
 BRA_decision_olinda_1857_ministers_desc: "국무총리인 루이스 지 아라우주 리마(올린다 후작)는 그의 내각을 구성할 고문들을 임명하기를 원합니다."
 BRA_mission_olinda_1857_replace_advisor: "전쟁부 장관 교체"
 BRA_mission_olinda_1857_replace_advisor_desc: "국무총리 루이스 지 아라우주 리마와 현 전쟁부 장관 제로니무 코엘류 간의 의견 차이로 인해 전쟁부 장관의 사임이 임박했습니다."
 BRA_decision_medical_school_reform_1857: "의과대학 규정"
 BRA_decision_medical_school_reform_1857_desc: "자선 병원(Holy House of Mercy Hospitals)에서 일하는 의료 전문가 수를 늘리기 위해, 의과대학 및 학부 규정의 280조 및 292조를 개정하여 4학년, 5학년, 6학년 학생들이 인턴 공석 경쟁에 합격한 후 제국의 모든 자선 병원에서 인턴으로서의 모든 기능을 수행할 수 있도록 하는 법안이 제안되었습니다."
 BRA_decision_english_money_in_public_station_1857: "브라질 공공 역에서 영국 화폐 사용"
 BRA_decision_english_money_in_public_station_1857_desc: "공공 역에서 영국 화폐 사용을 허용합니다."
 BRA_decision_livestock_regulation_1857: "가축 규제법"
 BRA_decision_livestock_regulation_1857_desc: "법원 도축장에서 소고기용 소에 대한 규정을 제안합니다."
 BRA_decision_court_police_corps_1857: "법원 경찰대"
 BRA_decision_court_police_corps_1857_desc: "법원 경찰의 규율과 조직에 대한 규정을 제안합니다."
 BRA_decision_friendship_treaty_Brazil_Ottoman_1857: "브라질-오스만 제국 우호 조약"
 BRA_decision_friendship_treaty_Brazil_Ottoman_1857_desc: "브라질 제국과 오스만 제국 간의 우호 조약을 제안합니다."
 BRA_decision_trade_treaty_Brazil_Uruguay_1857: "브라질-우루과이 무역 조약"
 BRA_decision_trade_treaty_Brazil_Uruguay_1857_desc: "브라질 제국과 우루과이 공화국 간의 무역 조약을 제안합니다."
 BRA_decision_disputes_with_UK_1857: "브라질-영국 분쟁"
 BRA_decision_disputes_with_UK_1857_desc: "브라질 제국과 영국 간의 분쟁 해결을 제안합니다."
 BRA_mission_abaete_1858_appoint_army_chief: "새로운 전쟁부 장관 임명"
 BRA_mission_abaete_1858_appoint_army_chief_desc: "국무총리와의 의견 불일치로 인해 새로운 전쟁부 장관이 임명되어야 합니다."
 BRA_decision_reformed_conscription_act_1857: "징병 규제법"
 BRA_decision_reformed_conscription_act_1857_desc: "징병 규제법을 제안합니다."
 BRA_decision_immigration_act_1857: "이민법"
 BRA_decision_immigration_act_1857_desc: "이민법을 제안합니다."
