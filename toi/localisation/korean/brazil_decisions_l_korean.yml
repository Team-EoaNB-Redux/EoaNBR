l_english:
 BRA_decision_weaken_the_elites: "엘리트 약화"
 BRA_decision_weaken_the_elites_desc: "우리나라의 엘리트들이 정치와 경제를 지배하고 있습니다, 우리는 그들을 물리쳐야 합니다!"
 BRA_decision_promote_shipbuilding_and_foundry: "폰타 다 아레아 주조소 및 조선소 재건에 투자"
 BRA_decision_promote_shipbuilding_and_foundry_desc: "1857년 같은 해에 대의원으로 선출된 것에 대한 보복으로 이리네우 이방젤리스타 지 소자(마우아 남작)가 소유한 리우데자네이루 주의 '폰타 다 아레아 주조소 및 조선소 시설이 방화로 파괴되었습니다. 조선소 재건은 제국이 훨씬 더 큰 함대를 건설하는 데 엄청난 도움이 될 수 있으며, 주조소 투자는 국가의 천연자원 개선에 도움이 될 수 있습니다."
 BRA_decision_invest_caixa: "국립 은행 코르치 경제 금고에 투자"
 BRA_decision_invest_caixa_desc: "1861년 1월 12일 페드루 2세 황제에 의해 설립된 '코르치 경제 금고'는 예금자에게 보안을 제공하지 않고 채무자에게 과도한 이자를 부과하는 다른 기관들과 달리 저축을 장려하고 제국 정부가 보증하는 담보 대출을 제공하는 것을 목적으로 하는 국립 은행입니다. 가장 가난한 사람들과 자유를 위한 증서를 모을 수 있는 노예들에게도 봉사합니다."
 BRA_decision_amazon_development: "아마존 분지 지역 개발"
 BRA_decision_amazon_development_desc: "아마존 분지 시골 식민지화 및 탐험 회사의 설립은 이 지역의 발전을 제공하며, 회사에 투자하면 큰 이점을 가져올 수 있습니다."
 BRA_decision_category_coffee_economy: "커피 경제"
 BRA_decision_category_coffee_economy_desc: "커피 생산은 브라질의 중요한 수입원이 되고 있습니다. \n커피 생산 주에 투자하면 얻어지는 이익을 상당히 늘릴 수 있습니다. \n새로운 도로, 철도 및 항구를 건설하면 커피뿐만 아니라 다른 소비재 운송 효율성을 크게 높일 수 있습니다. 커피 생산에 성공적으로 투자하면 새로운 경제 번영의 순환을 시작할 수 있습니다." BRA_decision_category_modernize_the_empire: "브라질 제국 현대화"
 BRA_decision_category_modernize_the_empire_desc: "브라질 제국은 주로 농촌 국가이지만, 변화에 반대하지 않습니다. 현대화는 제국 전역에서 장려되어야 합니다."
 BRA_decision_coffee_economy_capital: "리우데자네이루 시에 인프라 구축"
 BRA_decision_coffee_economy_capital_desc: "리우데자네이루 시의 커피 생산 운송을 위한 새로운 도로 또는 철도를 건설하는 것은 보장된 투자입니다."
 BRA_mission_coffee_economy_capital: "리우데자네이루 시에 인프라 구축"
 BRA_decision_coffee_economy_capital_free_workers: "건설에 유급 노동 사용"
 BRA_decision_coffee_economy_capital_free_workers_desc: "유급 노동을 사용하면 리우데자네이루 시의 인프라 건설 속도가 상당히 증가할 것입니다."
 BRA_decision_coffee_economy_capital_slave_workers: "건설에 노예 노동 사용"
 BRA_decision_coffee_economy_capital_slave_workers_desc: "노예 노동을 사용하면 리우데자네이루 시의 인프라 건설 속도가 합리적으로 증가할 것입니다."
 BRA_decision_coffee_economy_capital_maua_company_workers: "건설에 숙련 노동 사용"
 BRA_decision_coffee_economy_capital_maua_company_workers_desc: "마우아 남작 소유의 플루미넨시 운송 회사의 숙련 노동을 사용하면 리우데자네이루 시의 인프라 건설 속도가 크게 증가할 것입니다."
 BRA_mission_coffee_economy_capital_farm: "리우데자네이루 시에 농장 건설"
 BRA_mission_coffee_economy_capital_farm_desc: "리우데자네이루 시의 커피 경제에서 얻은 이익은 농장에 대한 투자 기회를 창출했습니다."
 BRA_mission_coffee_economy_capital_cotton_farm: "리우데자네이루 시에 목화 농장 건설"
