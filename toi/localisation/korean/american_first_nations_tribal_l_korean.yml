 acw_first_nations.1.t: "중립의 시대는 끝났습니다."
 acw_first_nations.1.d: "미국 남북 전쟁이 발발하여 중립이라는 선택지는 불가능해졌습니다. 퍼스트 네이션 부족들은 갈등의 승리자 편에 서기를 바라며 남북 전쟁의 어느 편에 설지 결정하고 있습니다. 이러한 혼란스러운 시기 동안, 미국 내에 권력 공백이 존재하는 동안 대규모 영토 확장이 가능합니다. 많은 부족들은 미국 남북 전쟁이 끝난 후 승자와 함께 독립을 확보하기 위한 정치적 영향력으로 자신들의 지원을 사용하기를 희망하고 있습니다.\n\n모든 선택지를 고려할 때, 우리는 지금 편을 선택하고 최대의 외교적 영향력을 얻거나 나중에 더 정보에 입각한 선택을 하는 것 중 하나를 선택해야 합니다. 이 갈등에서 [ROOT.GetName]의 입장은 무엇이 될까요?"
 acw_first_nations.1.a: "빨리 우리 편을 선택해야 합니다."
 acw_first_nations.1.b: "누가 이기는지 한 달 더 기다려 봅시다."
 acw_first_nations.1.c: "누가 이기는지 두 달 더 기다려 봅시다."

 acw_first_nations.2.t: "남북 전쟁의 어느 편에 설까요?"
 acw_first_nations.2.d: "우리는 편을 선택함으로써 얻는 외교적 영향력이 무효화되기까지 두 달의 시간이 있습니다. 지금 편을 선택하여 최대한의 외교적 영향력을 얻을 수 있습니다. 우리의 입장은 무엇이 될까요?"
 acw_first_nations.2.a: "[USA.GetName]이(가) 이길 것입니다!"
 acw_first_nations.2.b: "[CSA.GetName]이(가) 이길 것입니다!"
 acw_first_nations.2.c: "사실, 결정하기 전에 한 달 더 기다려야 합니다."

 acw_first_nations.3.t: "남북 전쟁의 어느 편에 설까요?"
 acw_first_nations.3.d: "우리 국가가 편을 선택하기 위해 한 달을 기다리면서, 편을 선택함으로써 얻는 외교적 영향력이 상당히 줄어들었습니다. 지금 결정을 내린다면 우리가 선택한 편은 그들을 지원하려는 우리의 결정으로 인해 여전히 영향을 받을 것입니다. 지금 선택할까요, 아니면 한 달 더 기다릴까요?"
 acw_first_nations.3.a: "[USA.GetName]이(가) 이길 것입니다!"
 acw_first_nations.3.b: "[CSA.GetName]이(가) 이길 것입니다!"
 acw_first_nations.3.c: "사실, 결정하기 전에 한 달 더 기다려야 합니다."

 acw_first_nations.4.t: "남북 전쟁의 어느 편에 설까요?"
 acw_first_nations.4.d: "중립의 시대는 끝났습니다. 지금 선택하지 않으면, 전쟁이 끝났을 때 승리자에게 반역자로 간주될 것입니다. 승리할 것 같은 편을 선택하는 것이 최선의 희망입니다."
 acw_first_nations.4.a: "[USA.GetName]이(가) 이길 것입니다!"
 acw_first_nations.4.b: "[CSA.GetName]이(가) 이길 것입니다!"

 acw_first_nations.5.t: "[FROM.GetName]이(가) 연방을 지지합니다!"
 acw_first_nations.5.d: "[FROM.GetName]은(는) 미국 남북 전쟁에서 [ROOT.GetName]과(와) 운명을 함께하기로 했습니다! 그들이 일으키는 교란은 주 전투에서 적군을 분산시켜 우리에게 더 나은 승산(勝算)을 줄 것입니다. 공식 조약의 일환으로 불가침 조약이 체결되었고 우리는 군사적 접근 권한을 얻었습니다."
 acw_first_nations.5.a: "대의에 충실!"
 acw_first_nations.5.b: "그들의 지원은 환영받을 일입니다."
 acw_first_nations.5.c: "알겠습니다."

 acw_first_nations.6.t: "[FROM.GetName]이(가) 남부연합을 지지합니다!"
 acw_first_nations.6.d: "[FROM.GetName]은(는) 미국 남북 전쟁에서 [ROOT.GetName]과(와) 운명을 함께하기로 했습니다! 그들이 일으키는 교란은 주 전투에서 적군을 분산시켜 우리에게 더 나은 승산(勝算)을 줄 것입니다. 공식 조약의 일환으로 불가침 조약이 체결되었고 우리는 군사적 접근 권한을 얻었습니다."
 acw_first_nations.6.a: "대의에 충실!"
 acw_first_nations.6.b: "그들의 지원은 환영받을 일입니다."
 acw_first_nations.6.c: "알겠습니다."
 
 NA_N_event.1.t: "[FROM.GetName]이(가) 평화로운 협력을 추구합니다!"
 NA_N_event.1.d: "[FROM.GetName]은(는) 습격을 중단하고 우리 조약을 준수하기로 결정했습니다. 우리는 이것을 긍정적인 협력의 기회로 봅니다. 이제 우리는 그들에게 배급품과 식량을 보낼 가능성이 더 높아질 것입니다. 하지만 버팔로가 더 많이 죽을수록 부족들은 우리에게 더 의존하게 될 것입니다."
 NA_N_event.1.a: "적어도 성가신 이웃이 줄어들 것입니다."
 
 NA_N_event.2.t: "[FROM.GetAdjective] 국경을 존중할까요?"
 NA_N_event.2.d: "존중에 대한 요청은 소위 '충격적인 편지'라고 할 수 있었습니다. 가장 용감한 외교관이 직접 전달한 이 편지는 미국 정부에 이곳 정부가 국가를 공식화하고, 특히 확고한 국경에 대한 권리와 자원에 대한 권리를 존중해 달라고 요청하는 통지였습니다.\n\n권력층에 있는 늘 문제가 되는 자들은 즉시 모습을 드러냈고, 낙천주의자들은 순진하게 최선을 바랐으며, 냉소주의자들은 미국 상원이 기절할 때까지 웃어댈 것이라고 예상했습니다. 마치 쥐가 사자에게 자신의 영역을 존중해 달라고 요청하는데, 사자는 그저 자신의 점심이 왜 자신에게 말을 걸고 있는지 의아해하는 것과 같았습니다."
 NA_N_event.2.a: "의회를 설득하면 이 조약들을 통과시킬 수 있습니다."
 NA_N_event.2.b: "의회가 결정하게 하십시오."
 
 NA_N_event.3.d: "미국 정신의 암흑 같은 심연에서 선함의 불꽃이 솟아올랐습니다. 다행히도 미국 상원은 수어드 상원의원의 손을 통해 동의를 보냈고, 공식적으로 우리 국가의 경계를 존중하기로 합의했습니다.\n\n이는 상원의원이 우리 땅에 발을 디딘 첫 번째 역사적인 사건이었습니다. 뉴욕 상원의원이 도착했을 때, 많은 이들이 미국인들이 심지어 이곳에 와보지도 않고 우리에 대해 입법을 하는 것이 옳다고 생각했지만, 이들은 미묘한 상황을 망치기 전에 빨리 입을 다물라는 말을 들었습니다."

 NA_N_event.4.d: "미국으로부터의 반응은 명확했습니다: 키득거리는 경멸. 매우 합리적인 요청에 대한 완전한 환희에 찬 조롱. 우리는 몇 주 동안 심사숙고했지만, 낙천주의자들의 목소리는 침묵하고 냉소주의자들이 발언권을 얻은 듯합니다.\n\n하지만 우리의 대응은 준비되었고, 우리의 입장은 확고합니다. 만약 정착민들이 스스로 떠나지 않는다면, 군대는 총검 끝으로 그들을 떠나게 할 의지가 있습니다. 심지어 지금도 모병이 시작되었고, 새로운 병력들이 이 필연적인 미국의 분노에 대비하여 훈련하고 있습니다."
 
 NA_N_event.5.t: "정착민들이 축출되었습니다!"
 NA_N_event.5.d: "정착민들이 왔을 때, 그들은 여기서도 사냥했습니다. 장로들은 그들이 심지어 부적절한 계절에도 과도하게 사냥했으며, 땅이 이런 식으로 다루어져서는 안 된다고 말했습니다. 아니는 그가 이 정착민들이 하는 것을 보았던 일들에 대해 이야기해 주었습니다. 그는 버려진 죽은 버팔로의 산들과 조상들의 유적지를 가로지르는 강철 흔적들을 발견한 것에 대해 오랫동안 이야기했습니다. 어제. 뭔가 나쁜 일이 일어났습니다. 소년 중 한 명이 마을 바깥에서 멀지 않은 곳에서 죽은 채 발견되었습니다. 그의 어머니는 울음을 멈추지 않았습니다. 그것은 부러워할 수 없는 생명의 낭비였고, 우리는 그것이 스러지는 것을 지켜봤습니다. 그리고 지평선 위로, 우리는 흰 모자를 쓴 백인들이 말을 타고 멀리 사라지는 것을 보았습니다. 오늘 정오, 우리가 보냈던 전령은 우리가 요청한 민병대 증원군과 함께 돌아왔습니다. 그들은 고등 평의회가 이 땅에서 백인을 추방하라는 명령을 내렸다고 말했습니다. 우리 마을의 장로들은 그들에게 일어난 일을 말해주었고, 정착민들이 어디에 사는지 알려주었습니다. 민병대는 해질녘에 행진했습니다."
 NA_N_event.5.a: "땅 반환."
 
 NA_N_event.7.t: "[FROM.GetAdjective] 영토에서 정착민 축출!"
 NA_N_event.7.d: "[FROM.FROM.GetName]이(가) [FROM.FROM.FROM.GetName]에서 정착민들을 축출한 후, [FROM.GetName]의 한 마을로 정착민들이 쏟아져 들어왔습니다. 한 정착민은 그의 어머니에게 보낸 편지에서 이 사건을 이렇게 묘사했습니다:\n\n이 땅으로 가는 길은 길고 험난했습니다. 우리는 낮에는 영토를 가로질러 오랜 시간 걷고 말을 탔으며 밤에는 추운 마차에서 잠들었습니다. 힘든 삶의 방식이었지만, 돌아서서 돌아가는 것만큼 힘들지는 않았습니다.\n\n우리가 땅을 팔아준 남자는 원주민들은 걱정할 필요가 없고, 후진적인 야만인 무리라고 말했습니다. 알고 보니 그들은 무기력한 알코올 중독자가 아니었습니다. 날카로운 총검을 든 제복을 입은 냉정한 남자들이었고, 정말로 우리가 거기 있는 것을 원하지 않았습니다. 해질녘에 지역 캠프에서 온 사람들이 우리의 작은 붐 타운으로 왔습니다. 그들은 총과 권총을 들고 많이 왔고, 다음 날 해 뜰 때까지 짐을 싸서 동쪽으로 떠나라고 말했습니다. 늙은 폴리는 싸우려고 했고, 그들은 그 자리에서 그를 쏘았습니다. 그날 밤, 마을 남자들은 자경단을 조직하고 그들이 살았던 곳으로 원주민들과 맞서러 갔습니다. 그들은 원주민들이 티피로 돌아갔다고 생각했습니다. 그들은 원주민들이 결코 떠나지 않았다는 것을 몰랐습니다. 그들은 포위될 것을 예상하지 못했습니다. 먼지가 걷히고 마지막 총성이 평야에 울려 퍼졌을 때, 우리는 그들이 말한 대로 했습니다. 우리는 가진 것 몇 안 되는 짐을 싸서 떠났습니다. 그날 밤 우리 아버지가 자경단에 함께 가지 않은 것을 신께 감사드립니다."
 NA_N_event.7.a: "정말 야만적입니다!"
 
 NA_N_event.8.t: "[FROM.GetName]에서 온 군수품!"
 
 NA_N_event.9.t: "노예제 논쟁"
 NA_N_event.9.d: "노예 문제는 이곳에서도 논쟁의 여지가 있는 문제이지만, 미국 주에서만큼은 아닙니다. 노예 제도에 대한 우리의 태도와 사회에서 노예의 위치는 미국인들의 그것과 매우 다르며, 많은 평론가들이 현재 우리의 방식을 기록하고 있습니다. 우리가 다른 방식 중 하나는 노예 제도를 정당화하는 데 사용되는 원칙이 그만큼 존재하지 않아, 사회적으로 덜 뿌리내리고 있다는 것입니다. 이것은 우리가 몇 가지 신중한 입법을 통해 이 관행의 부정적인 사회적 영향을 쉽게 되돌릴 수 있음을 의미합니다. 그러나 서구화와 노예 계층에 대한 통제를 추진하며 이를 유지하기를 원하는 일부 사람들도 있습니다."
 NA_N_event.9.a: "그 누구도 노예가 아닙니다."
 NA_N_event.9.a: "현 상태를 유지합니다."
 
 NA_N_event.10.t: "변화하는 시대"
 NA_N_event.10.d: "우리 민족에게 전통보다 신성한 것은 없습니다. 우리는 전통을 살고 숨 쉽니다. 이를 유지하는 것은 우리 자신의 정체성을 확고히 지키는 것이며, 정치에서도 마찬가지입니다. 자기 정체성과 민족 정신은 민족에게 중요하고 가치 있는 것입니다. 영혼과 인간의 이러한 오랜 전통이 없다면 우리는 아무것도 아닐 것이기 때문입니다. 이 땅의 원주민인 우리는 식민지 침략자가 파괴하려고 했던 이러한 것들을 소중히 여깁니다. 이것이 우리의 영원한 신조입니다."
 NA_N_event.10.a: ""
 
 NA_N_event.11.t: "변화하는 시대"
 NA_N_event.11.d: "모카신 신발은 부츠처럼 더 길어졌습니다. 전사들은 여전히 매우 명백하게 원주민 복장이지만, 제복을 갖추게 되었습니다. 계급. 대형. 날카로운 총검이 달린 광택 나는 소총. 발전하는 수도는 새롭고 혁명적인 개념에 소개되고 있습니다: 군사 퍼레이드와 집회. 병사들의 줄이 군중 앞에서 행진하고, 최고 추장은 위에서 지켜봅니다. 국가는 타고난 침착하고 냉정한 성격이 차갑고 계산적인 무자비함으로 변한 자기 이미지를 갖게 되었습니다."
 NA_N_event.11.a: ""
 
 NA_N_event.12.t: "변화하는 시대"
 NA_N_event.12.d: "그래서 우리는 모든 것을 태웠습니다. 나는 지켜봤습니다. 우리는 마을 중앙에 큰 모닥불을 피우고 옛 의회와 그 방식을 나타내는 모든 것을 그 위에 올렸습니다. 우리는 그들의 옷과 장신구, 그리고 다른 소유물들을 태웠습니다. 내 친구는 그의 어머니에게 상담역들에게 무슨 일이 일어났는지 물었습니다. 그녀는 그가 모르는 것이 최선이라고 말했습니다. 가끔씩, 나는 아직도 불을 봅니다. 우리가 옛 방식을 완전히 태워버린 그 밤을. 나는 그 밤에 우리가 그 안에서 무언가를 잃었다고 생각합니다. 우리는 살아남을 권리를 위해 우리 자신 중 일부를 불길에 희생했습니다."
 NA_N_event.12.a: ""
 
 NA_N_event.13.t: "변화하는 시대"
 NA_N_event.13.d: "우리가 이를 법으로 제정했을 때, 우리는 즉시 미합중국 의회로부터 분노에 찬 편지를 받았습니다. 그것을 읽는 것은 매우 재미있었고, 사무실 여기저기서 많은 웃음이 터져 나왔습니다. 분명히 '입헌군주제'의 형성은 자유에 대한 전반적인 거부이며, 영국 시스템과의 유사성(실제로 크게 중요하지 않으며, 우리는 볼 수 없고 우리가 그것을 작성했음)에 대한 더 많은 허풍과 '부정적인 외교 관계'라는 불길한 위협이었습니다. 그 마지막 부분은 몇몇 사람들에게 진지한 웃음을 주었습니다."
 NA_N_event.13.a: ""
 
 NA_N_event.14.t: "르제 나티바"
 NA_N_event.14.d: "어제 옆집 남자가 이상한 행동을 했습니다. 그는 집 짓기를 마쳤습니다. 그것은 정착민들이 남기고 간 키트로 만든 단순한 것이었지만, 견고한 집이었습니다. 요즘에는 그런 집들이 더 많아져 비포장도로를 따라 여기저기 생겨났습니다. 일부 번화한 도로는 이제 포장되었습니다. 다음 날, 해가 다르게 떠올랐습니다. 그것은 많은 사람들에게 수천 번 보았던 일출이었지만, 변화된 땅 위로 빛났습니다. 몇몇 마을을 건너, 수도로 향하는 철도가 건설되고 있었습니다. 마치 갑자기 땅이 영혼의 일부를 포기한 것 같았습니다. 공장들은 이제 더 흔해졌습니다. 가게와 전신국과 마찬가지로 사방에 우후죽순 생겨났습니다. 새로운 '마을'을 걷는 동안, 담배 연기처럼 땅에서 영혼이 떨어져 내리는 것을 느낄 수 있었습니다. 그러나 이러한 변화는 어떤 추진력을 주었고, 그것은 미국 정착민들의 마음에 두려움을 안겨주었습니다. 이는 문명이 백인의 전유물이 아니며, 충분한 시간이 주어진다면 원주민들도 자신들만의 위협을 가할 수 있다는 충격적인 깨달음으로 미국 정신의 가장 어두운 부분을 밝혔습니다."
 NA_N_event.14.a: ""
 
 NA_N_event.15.t: "우리 경제의 모델"
 NA_N_event.15.d: ""
 NA_N_event.15.a: "토지는 족장의 땅이다."
 NA_N_event.15.b: "토지는 공동체의 땅이다."
 NA_N_event.15.c: "토지는 소유주의 땅이다."
 
