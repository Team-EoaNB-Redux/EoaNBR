 sem_on_puppet.1.t: "제3차 세미놀 전쟁의 종결"
 sem_on_puppet.1.d: "이 전쟁은 1855년 세미놀족이 정착민들과 미 육군 정찰대가 자신들의 땅을 침범하는 것에 대응하면서 시작되었습니다. 세미놀족은 미국이 양국 간 조약을 위반할 폭력적인 반응을 유발하기 위해 의도적으로 정착민들을 보냈다고 주장합니다. 실제로 무슨 일이 일어났든 상관없이, 세미놀 땅은 이제 [USA.GetName]에 의해 점령되었고 다음 무엇을 할지 결정해야 합니다.\n\n제안된 아이디어는 세미놀족을 [374.GetName]으로 재정착시키고 세미놀족을 위한 공식 아메리카 원주민 보호 구역을 설립하는 것입니다. 그러나 세미놀족이 무장 해제되었으므로, 현재 폐기된 조약을 수정하고 플로리다에 반자치 보호 구역을 설립할 수도 있습니다."
 sem_on_puppet.1.a: "그들은 조약을 깨고 우리를 공격했습니다! 그들은 [374.GetName]에서 살 수 있습니다."
 sem_on_puppet.1.b: "일부 정치적 영향력을 통해, 아마도 우리는 오래된 조약을 수정할 수 있을 것입니다..."

 sem_on_annex.1.t: "제3차 세미놀 전쟁의 종결"
 sem_on_annex.1.d: "이 전쟁은 1855년 세미놀족이 정착민들과 미 육군 정찰대가 자신들의 땅을 침범하는 것에 대응하면서 시작되었습니다. 세미놀족은 미국이 양국 간 조약을 위반할 폭력적인 반응을 유발하기 위해 의도적으로 정착민들을 보냈다고 주장합니다. 실제로 무슨 일이 일어났든 상관없이, 세미놀 땅은 이제 [USA.GetName]에 의해 점령되었고 다음 무엇을 할지 결정해야 합니다.\n\n제안된 아이디어는 세미놀족을 [374.GetName]으로 재정착시키고 세미놀족을 위한 공식 아메리카 원주민 보호 구역을 설립하는 것입니다. 그러나 세미놀족이 무장 해제되었으므로, 현재 폐기된 조약을 수정하고 플로리다에 반자치 보호 구역을 설립할 수도 있습니다."
 sem_on_annex.1.a: "그들은 조약을 깨고 우리를 공격했습니다! 그들은 [374.GetName]에서 살 수 있습니다."
 sem_on_annex.1.b: "일부 정치적 영향력을 통해, 아마도 우리는 조약을 수정하고 지지할 수 있을 것입니다..."

 sem.4.t: "제3차 세미놀 전쟁의 종결"
 sem.4.d: "이 전쟁은 1855년 세미놀족이 정착민들과 미 육군 정찰대가 자신들의 땅을 침범하는 것에 대응하면서 시작되었습니다. 세미놀족은 미국이 양국 간 조약을 위반할 폭력적인 반응을 유발하기 위해 의도적으로 정착민들을 보냈다고 주장합니다. 실제로 무슨 일이 일어났든 상관없이, 세미놀 땅은 이제 [USA.GetName]에 의해 점령되었고 다음 무엇을 할지 결정해야 합니다.\n\n놀랍게도 [USA.GetName]은(는) 조약을 약간 수정하면서도 지지하기로 결정했습니다. 그들은 세미놀족이 현재의 땅을 유지하고 반자치 아메리카 원주민 보호 구역으로 관리하도록 허용했습니다.\n\n이제 우리는 보호 구역에서 유목 생활 방식을 계속할 것인지, 아니면 정착 사회로 개혁할 것인지 결정할 때입니다."
 sem.4.a: "그들은 조약을 깨고 우리를 공격했습니다! 그들은 [374.GetName]에서 살 수 있습니다."
 sem.4.b: "일부 정치적 영향력을 통해, 아마도 우리는 오래된 조약을 수정할 수 있을 것입니다..."

 sem_on_puppet.2.t: "제3차 세미놀 전쟁의 종결"
 sem_on_puppet.2.d: "이 전쟁은 1855년 세미놀족이 정착민들과 미 육군 정찰대가 자신들의 땅을 침범하는 것에 대응하면서 시작되었습니다. 세미놀족은 미국이 양국 간 조약을 위반할 폭력적인 반응을 유발하기 위해 의도적으로 정착민들을 보냈다고 주장합니다. 실제로 무슨 일이 일어났든 상관없이, 세미놀 땅은 이제 [USA.GetName]에 의해 점령되었습니다.\n\n[USA.GetName]은(는) 이 땅을 합병한 다음 세미놀족을 [374.GetName]으로 추방하여 아메리카 원주민 보호 구역에 정착시키기로 결정했습니다. 소수의 세미놀족 가구만이 미군에게 발각되지 않고 플로리다 원주민 땅에 남아있을 수 있었습니다."
 sem_on_puppet.2.a: "이것은 끔찍합니다! 우리 원주민 땅이 사라졌습니다!"

 sem_on_puppet.3.t: "세미놀족 추방"
 sem_on_puppet.3.d: "대부분의 세미놀족은 이미 [374.GetName]으로 이주하여, [USA.GetName]에 의해 설치된 원주민 보호 구역에서 살게 되었습니다. 소수의 세미놀족 가구만이 미군에게 발각되는 것을 피하고 그들의 플로리다 원주민 땅에 남아있을 수 있었습니다."
 sem_on_puppet.3.a: "완료되었습니다."

 # Navajo Events
 navajo.1.t: "디파이언스 요새의 그림자"
 navajo.1.d: "미군이 윈도우 록에 디파이언스 요새를 건설한 지 몇 년이 지났습니다. 요새가 우리 땅과 너무 가까워서 걱정스럽고 장로들은 편집증에 시달리고 있습니다. 우리는 미국에 현금 지급 대가로 요새 통제권을 우리에게 넘겨달라고 요청할 수도 있고, 아니면 단순히 무력으로 요새를 점령할 수도 있습니다."
 navajo.1.a: "요새 협상을 위해 대표단을 보내십시오."
 navajo.1.b: "우리 집을 지키고 요새를 습격하십시오!"
 navajo.1.b_tt: "우리는 병력과 무기를 준비할 것입니다."
 navajo.2.t: "나바호족, 디파이언스 요새 통제권 요청"
 navajo.2.d: "디파이언스 요새가 건설된 지 10년도 채 되지 않았는데 이미 문제를 일으키고 있습니다. 우리는 나바호 부족으로부터 수많은 불만을 접수했으며, 요새를 함락시키기 위한 여러 번의 습격까지 이르는 지경에 이르렀습니다. 타협책으로 추장들은 나바호족이 요새의 통제권을 얻고 그 대가로 금전적 보상을 지급하겠다는 제안을 내놓았습니다. 우리가 이를 거부하면 이 작은 원주민들과 전면전으로 이어질 수 있습니다. 그들을 파괴하는 것은 사소한 문제겠지만, 과연 우리가 그렇게 하찮은 적에게 군대를 낭비하고 싶을까요?"
 navajo.2.a: "그들이 원하는 만큼 불평하게 내버려 두십시오. 요새는 우리에게 남아 있을 것입니다."
 navajo.2.b: "그들에게 그 망할 요새를 주십시오."
 navajo.4.t: "미국인들이 거래에 동의했습니다!"
 navajo.4.d: ""
 navajo.4.a: "경이롭습니다!"