 first_nations_tribal_conflict_category: "퍼스트 네이션 분쟁"
 first_nations_tribal_conflict_category_desc: "[NA_N_conflict_escalation_scripted]\n\n§YThe Western Territories:§!\n§gThe First Nations people typically have a nomadic lifestyle, this leaves them without a physical border that would be guarded. Colonists regularly settle and exploit the resources and land, but this is not without resistance from the nomadic tribes. Colonial military, like the United States army, has military access to these uncontrolled borders.§!\n\n§YFirst Nations Wars:§!\n §gThe westward expansion of the [USA.GetName], dubbed as Manifest Destiny, resulted in conflict between them and various First Nations people. While tribes typically resist the [USA.GetName] and other colonial forces, conflict can erupt between the various tribes too.§!"
