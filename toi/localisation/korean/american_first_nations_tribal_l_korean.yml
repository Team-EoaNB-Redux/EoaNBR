 first_nations_tribal_american_civil_war_category_desc: "§YAmerican Civil War:§!\n §gThe American Civil War has erupted, leaving the option of neutrality impossible. First Nations tribes are deciding which side of the civil war to be on, hoping to be on the winning side of the conflict. During these chaotic times, mass expansion of land can be achieved while a power vacuum exists within America. Many tribes are hoping to use their assistance as political weight to secure their independence with the winner once the American Civil War is over.§!"
