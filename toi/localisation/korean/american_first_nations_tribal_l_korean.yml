 first_nations_tribal_raid_colonial_neighbor_on_lose_defender.1.t: "국경에서 비축품 약탈!"
 first_nations_tribal_raid_colonial_neighbor_on_lose_defender.1.d: "국경 방어대는 적의 습격으로부터 마을을 보호하기에는 장비가 부족했습니다! 결과적으로 우리 마을의 비축품은 약탈당했고 공격자들은 우리의 보급품을 가지고 달아났습니다."
