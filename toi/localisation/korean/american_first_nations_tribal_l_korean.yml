 NA_N_event.17.d: ""
 NA_N_event.17.a: "모두가 기여해야 합니다."
 NA_N_event.17.b: "우리는 작업 종류를 제한할 수 있습니다."
 NA_N_event.17.c: "우리는 산업 분야의 아동 노동을 종식시킬 것입니다."
 
