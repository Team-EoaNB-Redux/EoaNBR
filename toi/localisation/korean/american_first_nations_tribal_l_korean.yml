 NA_N_event.24.t: "미국이 부족 연금 지급을 바로잡습니다"
 NA_N_event.24.d: "1851년 포트 라라미 조약은 50년간 연간 5만 달러의 연금을 지급하겠다는 약속의 대가로 아메리카 원주민 영토에 도로와 요새를 건설하는 것을 허용했습니다. 조약 서명 후, 단 한 번의 연금 지급만이 이루어져 조약의 약속은 즉시 깨졌습니다. 미국은 이 위반 사항을 바로잡고 우리에게 다시 연금을 매년 지급하기로 결정했습니다."
 NA_N_event.24.a: "이것이 우리의 신뢰를 다시 불붙이는 계기가 되기를 바랍니다."

 escalationconflict.1.t: "공연 티켓"
 escalationconflict.1.d: "마을의 교차로에 어떤 부지런한 사람이 극장을 지었습니다. 놀라운 업적이었지만, 작았습니다. 하지만 마을도 작았죠. 우리 인구는 날마다 줄어들었습니다. 장로들은 동쪽에서 온 정착민들이 악령과 질병을 가져왔다고 말했습니다. 매주마다 우리는 철도를 위해 도살되어 썩어가는 더 많은 죽은 버팔로 소식을 들었습니다. 나와 여동생은 오늘 밤 공연 티켓을 각자 한 장씩 샀습니다. 형편없었지만, 그저 보는 것이 재미있을 정도의 형편없음이었습니다. 우리는 앞에서 두 번째 줄에 앉아 값싼 의상을 입은 배우들이 어색하고 부자연스러운 대사를 시작하는 것을 지켜봤습니다. 그들이 실수할 때마다 항상 재미있었고, 몇 번 크게 웃었습니다. 우리가 2막의 절반쯤 지났을 때, 마을 종이 비상벨처럼 울렸습니다. 멀리서 큰 굉음이 들렸고, 곧이어 일이 벌어졌습니다. 미국 대포알이 극장 지붕을 뚫고 들어와 나무 조각과 파편을 날리고 공기를 연기와 먼지로 가득 채웠습니다. 종소리가 더 크게 울리고 공격을 알리는 외침이 공기를 가득 채우자 미친 듯이 사람들이 출구로 달려갔습니다. 혼란 속에서 여동생이 나를 부르는 소리를 들을 수 있었습니다. 그것이 내가 그녀를 살아있는 채 들은 마지막이었습니다. 먼지가 가라앉았을 때 잔해 밑에서 그녀의 시신을 발견했습니다. 침략과 습격의 순환은 마침내 전쟁으로 이어졌고, 나는 그 전쟁에 소집될 것입니다."
 escalationconflict.1.a: "이제 막 시작된 지옥"

 escalationconflict.2.t: "피의 대가"
 escalationconflict.2.d: "그들은 무엇을 위해 죽었을까요? 땅? 금? 무기? 자루 안에 무엇이 있었든, 그것은 한 국가 전체를 잔혹한 유혈 사태로 몰아넣었습니다. 습격과 침략, 이곳으로 이르는 길은 길고 험난하며 위험했습니다. 토끼는 전사 무리에서 떨어져 나온 후 우연히 모든 것이 시작된 오두막을 발견했습니다. 오두막은 어둡고 희미하게 빛났지만, 등불에는 아직 기름이 남아 있었습니다. 누군가 최근에 이곳에 있었던 것입니다. 탁자 주위에는 세 구의 시신이 있었습니다. 두 명의 남부연합 장교와 코만치 한 명. 무슨 일이 일어났는지 분명했습니다. 그들은 탁자 위의 자루 때문에 서로를 쏘았습니다. 토끼가 탁자에 다가갔을 때, 총성이 오두막을 찢고 지나갔습니다. 싸구려 낡은 나무가 바닥에 부딪히면서 이쑤시개처럼 산산조각났습니다. 그는 밖에서 텍사스인의 강한 억양을 들을 수 있었습니다. 남부연합군은 후퇴했고, 가는 길에 모든 것을 불태우고 있었습니다. 빗나간 총알이 등불을 옆으로 떨어뜨렸고, 심지에 닿자마자 뜨거운 기름이 불꽃을 일으켰습니다. 곧 오두막 전체가 불길에 휩싸였고 연기가 공기를 가득 채웠습니다. 지붕이 삐걱거리기 시작하고 탈출구가 없다는 것이 명백해지면서 숨쉬기가 점점 더 어려워졌습니다. 토끼는 천천히 기침을 하며 탁자 위의 자루를 열었습니다. 이 모든 것을 일으킨 것은 무엇일까요? 무엇이 그토록 중요해서 화약고에 불을 지피는 마지막 불꽃이 되었을까요? 돈이었습니다. 남부연합이 발행한 달러. 이것은... 이것은 가치 없는 것이었습니다. 가치 없는 사람들이 가치 없는 목화를 거래하기 위해 발행한 가치 없는 종이. 이 전쟁은 비록 긴 여정의 결과였지만, 확실히 실망스러운 종착지였습니다. 토끼는 한숨을 쉬었습니다. 그리고 지붕이 그 위로 무너져 내렸습니다."
 escalationconflict.2.a: "몇몇 사람들은 몇 달러 더 벌기 위해 무슨 짓이든 할 것입니다..."

 escalationconflict.3.t: "하느님의 금"
 escalationconflict.3.d: "몰몬교도들은 우리의 땅을 원합니다. 그들은 그들의 신이 자신들에게 땅을 주셨다고 말하지만, 우리는 우리 스스로 축복받았기에 그들의 눈, 즉 영혼의 창을 통해 인간의 욕망을 볼 수 있습니다. 보십시오, 그들의 마음속에는 금에 대한 탐욕이 있었습니다. 귀금속에 대한 욕구는 인간으로 하여금 폭력적인 행동을 하게 만듭니다. 귀금속에 대한 욕구는 인간의 마음을 타락시킵니다. 그들이 십자가를 들고 왔을 때, 우리는 예언과 설교의 거짓을 꿰뚫어 보았습니다. 그들은 우리를, 즉 신을 모르는 이교도들을 개종하러 왔다고 주장했습니다. 그들은 개종하러 온 것이 맞습니다. 우리의 금을 돈으로 개종시키러 왔습니다. 그들의 신에 관해서는, 다른 백인들조차도 그들이 미친 광신도라고 생각합니다. 그러나 이 순환은 수년간 계속되었습니다. 습격과 선교의 순환. 글쎄요, 항상 이런 식으로 끝날 예정이었습니다."
 escalationconflict.3.a: "너희의 신을 만날 시간이다"

 escalationconflict.4.t: "조기 입학"
 escalationconflict.4.d: "학교는 일반적인 통념에서 무서운 것이 아닙니다. 하지만 그 학교가 캐나다인에 의해 운영된다면 무서울 수 있습니다. 이야기를 들어보면, 많은 이들이 자녀들을 식민지 침략자들에게 넘겨주기를 꺼려합니다. 많은 이들이 그 학교에서 돌아오지 않고, 돌아온 이들은 어떨까요? 그들은 그러지 않았기를 바랍니다. 어떤 이들은 악몽을 유발하는 그림을 가져옵니다. 흉터 또한 우려를 낳으니, 많은 이들이 저항할 것이 분명했고, 그들은 저항했습니다. 곧, 식민지 개척자들은 군인들과 함께 그들을 강제로 데려갔습니다. 현지인들은 그것을 좋아하지 않았습니다. 그들은 맞섰습니다. 이제 우리는 캐나다와의 전쟁이라는 흔히 '성가신 일'이라고 불리는 상황에 처했습니다."
 escalationconflict.4.a: "*진주 목걸이를 움켜쥔다*"

