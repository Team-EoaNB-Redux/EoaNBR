 first_nations_tribal_raid_neighbor_desc: "[FROM.GetName] 국경으로 습격대를 보내 그들의 비축품을 성공적으로 습격하기를 희망합니다."
 first_nations_tribal_raid_neighbor_at_peace_trigger: "어떤 상대와도 §YRaid§! 중이거나 §YWar§! 중이 아닙니다."
