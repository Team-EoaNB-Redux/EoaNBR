 first_nations_tribal_raid_neighbor_on_win_attacker.1.t: "국경 습격 성공!"
 first_nations_tribal_raid_neighbor_on_win_attacker.1.d: "우리 전사들이 적의 비축품에서 약탈한 전리품을 가지고 돌아왔습니다!"
 first_nations_tribal_raid_neighbor_on_win_attacker.1.a: "훌륭합니다! 비축품으로 가져오십시오!"

 first_nations_tribal_raid_neighbor_on_lose_attacker.1.t: "국경 습격 실패!"
 first_nations_tribal_raid_neighbor_on_lose_attacker.1.d: "우리 전사들이 비어 있는 손으로 집으로 돌아왔습니다. 습격은 실패했을 뿐만 아니라 사상자도 많았습니다."
 first_nations_tribal_raid_neighbor_on_lose_attacker.1.a: "이것은 끔찍합니다!"

 first_nations_tribal_raid_neighbor_on_cancel_attacker.1.t: "국경에서 교착 상태!"
 first_nations_tribal_raid_neighbor_on_cancel_attacker.1.d: "습격대로 시작된 것이 어느 쪽도 유지할 수 없는 전면적인 국경 전쟁으로 변했습니다. 분쟁의 공격자들은 국경 전쟁이 계속하기에는 너무 많은 비용이 들게 되자 후퇴하기로 결정했습니다."
 first_nations_tribal_raid_neighbor_on_cancel_attacker.1.a: "일시적인 차질일 뿐입니다..."

 first_nations_tribal_raid_neighbor_on_win_defender.1.t: "국경 방어 성공!"
 first_nations_tribal_raid_neighbor_on_win_defender.1.d: "습격대는 성공적으로 격퇴되었습니다! 국경의 비축품은 현재 안전합니다."
 first_nations_tribal_raid_neighbor_on_win_defender.1.a: "그들이 그렇게 쉽게 우리의 비축품을 약탈하지 못할 것입니다!"

 first_nations_tribal_raid_neighbor_on_lose_defender.1.t: "국경에서 비축품 약탈!"
 first_nations_tribal_raid_neighbor_on_lose_defender.1.d: "국경 방어대가 적의 습격으로부터 진지를 보호하기에는 장비가 부족했습니다! 결과적으로 우리 진지의 비축품은 약탈당했고 공격자들은 우리의 보급품을 가지고 달아났습니다."
 first_nations_tribal_raid_neighbor_on_lose_defender.1.a: "다행히 많이 챙겨가지 않았기를 바랍니다!"

 first_nations_tribal_raid_neighbor_on_cancel_defender.1.t: "국경에서 교착 상태!"
 first_nations_tribal_raid_neighbor_on_cancel_defender.1.d: "습격대로 시작된 것이 어느 쪽도 유지할 수 없는 전면적인 국경 전쟁으로 변했습니다. 분쟁의 공격자들은 국경 전쟁이 계속하기에는 너무 많은 비용이 들게 되자 후퇴하기로 결정했습니다."
 first_nations_tribal_raid_neighbor_on_cancel_defender.1.a: "당분간은 긴장을 풀어도 될 것 같습니다..."



