 first_nations_tribal_raid_colonial_neighbor_on_cancel_attacker.1.d: "습격대로 시작된 것이 어느 쪽도 유지할 수 없는 전면적인 국경 전쟁으로 변했습니다. 분쟁의 공격자들은 국경 전쟁이 계속하기에는 너무 많은 비용이 들게 되자 후퇴하기로 결정했습니다."
 first_nations_tribal_raid_colonial_neighbor_on_cancel_attacker.1.a: "일시적인 차질일 뿐입니다..."

