 NA_N_conflict_escalation_declare_war: "갈등 고조: 선전포고"
 NA_N_conflict_escalation_value_trigger_tooltip: "§YEscalation Level§!은(는) 최소 §Y10§!이어야 합니다!"
 
 NA_N_conflict_escalation_native_loc: "§YAntagonization & Escalation:§!\n원주민과 식민지 정착민 간의 긴장은 적대감을 통해 증가할 수 있습니다. 적대감이 증가하면 식민지 정착민과의 전쟁이 정당화될 지점까지 갈등 고조가 증가할 것입니다. 전쟁을 피하려면 이러한 집단 간의 적대감을 줄이는 조치를 취하십시오. 경고하건대, 그 숫자가 10에 도달하면 엄청난 고난을 겪게 될 것입니다.[FROM_conflict_escalation_scripted]"
 NA_N_conflict_escalation_loc: "§YAntagonization & Escalation:§!\n원주민과 식민지 정착민 간의 긴장은 적대감을 통해 증가할 수 있습니다. 적대감이 증가하면 식민지 정착민과의 전쟁이 정당화될 지점까지 갈등 고조가 증가할 것입니다. 전쟁을 피하려면 이러한 집단 간의 적대감을 줄이는 조치를 취하십시오. 경고하건대, 그 숫자가 10에 도달하면 엄청난 고난을 겪게 될 것입니다.\n\n§YConflict Escalation Level§![SEM_conflict_escalation_scripted][APA_conflict_escalation_scripted][NAV_conflict_escalation_scripted][COM_conflict_escalation_scripted][CHY_conflict_escalation_scripted][SIX_conflict_escalation_scripted][CRW_conflict_escalation_scripted][SHO_conflict_escalation_scripted][BFT_conflict_escalation_scripted][NEZ_conflict_escalation_scripted]"
 
