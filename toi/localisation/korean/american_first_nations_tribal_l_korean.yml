 NA_N_buffalo_population_0_desc: "§WThere is a§! §RInsuffiecent§! §YAvailability of Buffalo§! §Wwithin [ROOT.GetName]'s borders. A sufficient Buffalo population is required to meet the nomadic need's of the people.§!\n\n대평원 원주민 부족은 모든 필수적인 필요를 위해 버팔로에 크게 의존합니다. 이 동물은 신성하며 버팔로의 각 부분은 [ROOT.GetAdjective] 문화에서 필수적인 용도로 사용됩니다."
