l_korean:

 AFR_darfur_waddai_conflicts: "다르푸르-와다이 경쟁"

 afr_inward_integration_tribe.1.t: "[FROM.GetName]이(가) 복속을 압박합니다!"
 afr_inward_integration_tribe.1.d: "[FROM.GetName]은 강력한 지역 강국이며, 현지 영토를 통합하려 합니다. 유혈 사태를 피하기 위해, [FROM.GetName]은 [ROOT.GetName]에 제국 가입을 공식적으로 요청했습니다. 우리가 그들의 속국이 되면 생존이 보장될 것입니다. 남은 질문은 단 하나, 우리의 독립을 잃을 가치가 있을까요?"
 afr_inward_integration_tribe.1.a: "협상을 잘했군, 우리가 그들의 속국이 되겠다고 전하시오."
 afr_inward_integration_tribe.1.b: "우리는 독립을 위해 싸울 것이다, 우리는 누구의 속국도 아니다!"

 afr_inward_integration_tribe.2.t: "[FROM.GetName]이(가) 우리의 요구를 거부합니다!"
 afr_inward_integration_tribe.2.d: "[FROM.GetName]은 복속을 거부하여 평화적 통합을 거절했습니다. 우리는 그들과 전쟁을 벌여 우리의 요구에 굴복시키거나, 전쟁을 피하기 위해 우리의 요구를 철회할 수 있습니다."
 afr_inward_integration_tribe.2.a: "그들은 우리의 요구에 굴복할 것이다! 전쟁을 준비하라!"
 afr_inward_integration_tribe.2.b: "우리는 전쟁을 추구할 수 없다. 우리의 요구를 철회하라."

 afr_inward_integration_tribe.3.t: "[FROM.GetName]이(가) 복속 요구를 철회했습니다!"
 afr_inward_integration_tribe.3.d: "[FROM.GetName]은 우리를 복속시키려던 초기 요구에서 물러났습니다."
 afr_inward_integration_tribe.3.a: "훌륭하다!"

 afr_inward_integration_tribe.5.t: "[FROM.GetName] 침공 준비 완료!"
 afr_inward_integration_tribe.5.d: "[ROOT.GetAdjective] 제국의 군대가 준비되었습니다. 이제 그들은 [ROOT.GetLeader]의 침공 명령을 기다리고 있습니다."
 afr_inward_integration_tribe.5.a: "침공을 개시하라!"

