 britishoceania.4.t: "피지 섬의 분노!"
 britishoceania.4.d: "피지 와야 섬에서 미국 시민 두 명이 현지 주민들에게 살해당하고 식인당했습니다. 우리는 이 분노에 즉시 답해야 합니다. 다른 것은 몰라도 희생자를 위한 정의는 반드시 필요합니다!"
 britishoceania.4.a: "즉시 원정대를 파견하라, 정의를 실현할 것이다!"
 britishoceania.4.b: "단지 선원 두 명일 뿐인데, 그들이 정말 그렇게 중요한가?"
 britishoceania.5.t: "원정대가 피지에 도착했습니다!"
 britishoceania.5.d: "우리 함선들이 긴 항해 끝에 피지 와야 섬 근처에 도착하여 상륙을 시작하려 합니다. 우리 시민들을 살해한 부족장의 메시지가 우리를 기다리고 있었는데, 아무래도 원주민들이 우리의 도착을 미리 알았거나 우리가 올 것을 예상한 모양입니다. 메시지에는 '우리가 백인 두 명을 아무 이유 없이 죽였다고 생각하느냐? 아니다. 우리는 그들을 죽이고 먹었다. 우리는 위대한 전사들이며, 전쟁을 즐긴다.' [sic]라고 쓰여 있었습니다. 이 위대한 전사들이 실제로 얼마나 강한지 보게 될 것입니다."
 britishoceania.5.a: "함장, 상륙을 개시하라."
 britishoceania.6.t: "공격 시작!"
 britishoceania.6.d: "섬을 가로지르는 힘든 여정 끝에 우리 선원들이 시민들이 살해당한 마을에 도착했습니다. 안타깝게도 유일한 야포가 절벽 아래로 떨어졌지만, 우리의 총기류는 그들의 원시적인 무기보다 훨씬 우수할 것입니다. 좌측으로 측면 공격 부대를 보내라, 왜 우리가 그들에게 쉽게 해줘야 하는가?"
 britishoceania.6.a: "이것은 금방 끝날 것이다."
 britishoceania.7.t: "승리!"
 britishoceania.7.d: "우리 선원들이 승리했습니다. 교전은 한 시간도 채 걸리지 않았습니다. 원주민들은 우리의 신형 소총에 상대가 되지 못했습니다. 안타깝게도 절벽에서 존재 이유를 잃은 우리 포병들은 살해당한 우리 시민들에 대한 보복으로 마을의 오두막 몇 채를 불태우고 있습니다. 우리에게 조롱의 메시지를 보냈던 부족장은 전사자 명단에서 확인되었습니다. 이 모든 것 중 가장 좋은 점은 우리가 가벼운 부상만 입었다는 것입니다. 다리에 살짝 부상을 입은 선원 한 명이 가장 심하게 다쳤지만, 며칠 내로 복무에 복귀할 것입니다. 부디 이것이 우리 시민들을 해치려는 다른 사람들에게 교훈이 되기를 바랍니다!"
 britishoceania.7.a: "그리고 안전한 귀환을"