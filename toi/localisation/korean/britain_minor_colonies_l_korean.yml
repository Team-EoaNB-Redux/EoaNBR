 trucial.1.t: "트루셜 주가 원조를 요청합니다!"
 trucial.1.d: "작은 영국의 보호령이 영국으로부터 독립을 추구하는 것으로 보입니다. 이 길은 무장 봉기로 이어질 가능성이 높으며 그들에게는 가능한 모든 작은 도움이 필요할 것입니다. 따라서 그들은 우리에게 지원을 요청하기 위해 연락했습니다. 만약 그들이 성공한다면, 이 지역에서 영국의 영향력이 크게 줄어들 것입니다. 필요한 것을 보내줘야 할까요?"
 trucial.1.a: "예"
 trucial.1.b: "아니오"
