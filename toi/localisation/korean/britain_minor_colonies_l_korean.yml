 britishafrica.8.d: "분쟁 지역인 [1149.GetName] 내 발 강 유역에서 넓은 다이아몬드 광산이 발견되었습니다. [OFS.GetNameDef]은 해당 지역에 관리를 파견하고 행정 관할을 시도하고 있으며, 우리 역시 해당 지역에 대한 영유권을 주장했습니다."
