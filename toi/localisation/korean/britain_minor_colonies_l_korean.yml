 SAF_Modernizing_Infrastructure: "산업화된 기반 시설"
 SAF_Modernizing_Infrastructure_desc: "기반 시설에 대한 지식 향상과 기존 기반 시설 확장 노력은 식민지 산업화를 지원하기에 충분합니다."
 SAF_Industrialising_Industry: "산업화된 산업"
 SAF_Industrialising_Industry_desc: "새로운 산업과 기반 시설을 통해 우리는 우리 산업의 산업화에 집중할 수 있습니다."
 SAF_Urbanisation: "도시화"
 SAF_Urbanisation_desc: "광고를 통해 이민자와 사람들이 우리의 산업화 도시로 몰려들 것입니다."
 SAF_Growing_Manufactaring: "성장하는 제조업"
 SAF_Growing_Manufactaring_desc: "성장하는 제조업은 지금 우리가 분명히 장려해야 할 대상입니다."
 SAF_Industrial_Textile_Industry: "산업화된 섬유 산업"
 SAF_Industrial_Textile_Industry_desc: "양모를 사용하는 산업화된 섬유 산업은 장려할 가치가 있을 수 있습니다."
 SAF_Industrialising_Farms: "산업화된 농장"
 SAF_Industrialising_Farms_desc: "현대적인 도구와 기술을 사용하면 농장은 일반 농장보다 생산성이 높아집니다."
 SAF_Industrialising_Society: "산업화된 사회"
 SAF_Industrialising_Society_desc: "산업화는 새로운 문제를 야기하며, 특히 일반 노동자와 가족들이 대부분의 문제에 직면합니다. 우리는 미리 이러한 문제들을 해결하려고 노력해야 합니다."
 SAF_Productivity_First: "생산성 우선"
 SAF_Productivity_First_desc: "일반 노동자에게 몇 가지 문제가 있지만, 노동 시간 제한은 그중 하나가 아닙니다."
 SAF_Workers_Right: "노동자 권리"
 SAF_Workers_Right_desc: "노동 시간을 제한함으로써 일반 노동자와 가족들은 더 건강하고 행복한 삶을 누릴 수 있을 것입니다."
 SAF_Trade_Union_Act: "노동조합법"
 SAF_Trade_Union_Act_desc: "반노동조합법을 폐지함으로써 일반인들은 더 많은 정치적 자유를 누리고, 더 많은 권리를 얻기에 더 적합해질 것입니다."
 SAF_Industrialising_Nation: "산업화"
 SAF_Industrialising_Nation_desc: "우리는 문제들을 우리만의 방식으로 해결했습니다. 이를 통해 우리는 산업화되고 있다고 간주할 수 있습니다!"
