 afr_empire_politics_independence_struggle: "독립을 위한 반란!"
 afr_empire_politics_independence_struggle_desc: "우리는 군주에 대한 충성심이 없으며, 이제 그들의 속박에서 벗어날 때입니다! 반란을 일으키고 우리의 주권을 위해 전쟁을 선포해야 합니다!"
