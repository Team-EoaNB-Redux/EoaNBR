 UCT_territory_management_establish_first_claim.4.a: "식민지 개척자들이 무사히 여행하기를!"
 UCT_territory_management_establish_first_claim.4.b: "이제 [FROM.GetName]에 항구가 생겼으니 식민지화를 시작할 수 있습니다!"
 UCT_territory_management_establish_first_claim.4.c: "우리는 수송품을 보낼 호위대가 없습니다!"
 UCT_territory_management_establish_first_claim.4.e: "우리는 [FROM.GetName]에 대한 우리의 주장을 포기할 것입니다."

 UCT_territory_management_establish_first_claim_4_desc_convoy_loc: "우리는 [FROM.GetName]에 보급할 충분한 호위대가 없습니다!"
 UCT_territory_management_establish_first_claim_4_desc_loc: "우리의 항구는 [FROM.GetName]에 보급품과 새로운 식민지 개척자 호위대를 보낼 준비가 되어 있습니다. 전통에 따라, 배들이 [FROM.afr_empire_politics_state_category_scripted]로 출발할 때 선체에 샴페인 병이 깨졌습니다."
 UCT_territory_management_establish_first_claim_4_desc_done_loc: "우리는 [FROM.GetName]에 대한 주장을 확립했으며, 초기 인프라가 구축되었으므로 식민지화를 시작할 수 있습니다!"
