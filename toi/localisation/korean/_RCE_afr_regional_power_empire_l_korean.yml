 afr_empire_politics_local_rumor_priest_title_1: "떠돌이 사제가 병자들을 치유한다는 소문!"
 afr_empire_politics_local_rumor_priest_desc_1: "일주일 전쯤 [FROM.GetName]의 [FROM.afr_empire_politics_state_category_scripted] 내에서 떠돌이 사제가 병자들을 치유하는 것이 발견되었습니다! 현지 관리들은 사제의 현재 행방에 대해 엇갈린 설명을 하지만, 이 소문의 사제를 추적하는 것이 가능할 수도 있습니다. 소문이 사실로 밝혀진다면, 이 사제는 훌륭한 고문이 될 것입니다!"
 afr_empire_politics_local_rumor_priest_search_1: "소문을 조사하고 이 사제를 찾으십시오!"
 afr_empire_politics_local_rumor_priest_leave_1: "우리는 이 소문의 사제를 추적할 필요가 없습니다."

 afr_empire_politics_local_rumor_shaman_title_1: "떠돌이 샤먼이 병자들을 치유한다는 소문!"
 afr_empire_politics_local_rumor_shaman_desc_1: "일주일 전쯤 [FROM.GetName]의 [FROM.afr_empire_politics_state_category_scripted] 내에서 떠돌이 샤먼이 병자들을 치유하는 것이 발견되었습니다! 현지 관리들은 샤먼의 현재 행방에 대해 엇갈린 설명을 하지만, 이 소문의 샤먼을 추적하는 것이 가능할 수도 있습니다. 소문이 사실로 밝혀진다면, 이 샤먼은 훌륭한 고문이 될 것입니다!"
 afr_empire_politics_local_rumor_shaman_search_1: "소문을 조사하고 이 샤먼을 찾으십시오!"
 afr_empire_politics_local_rumor_shaman_leave_1: "우리는 이 소문의 샤먼을 추적할 필요가 없습니다."

 afr_empire_politics_local_rumor_warlord_title_1: "지역 군벌이 도적을 물리쳤다는 소문!"
 afr_empire_politics_local_rumor_warlord_desc_1: "소문에 따르면 몇 주 전 [FROM.GetName]의 [FROM.afr_empire_politics_state_category_scripted]에서 약탈자들에 대한 방어를 이끈 훌륭한 리더십을 가진 지역 군벌이 있다고 합니다. 현지인들이 군벌의 현재 행방에 대해 엇갈린 설명을 하지만, 그들을 추적하는 것이 가능할 수도 있습니다. 소문이 사실로 밝혀진다면, 이 군벌은 우리 제국에서 훌륭한 고문이 될 것입니다!"
 afr_empire_politics_local_rumor_warlord_search_1: "소문을 조사하고 이 군벌을 찾으십시오!"
 afr_empire_politics_local_rumor_warlord_leave_1: "우리는 이 소문의 군벌을 추적할 필요가 없습니다."

 afr_empire_politics_local_rumor_noble_title_1: "귀족이 지역 부족 간의 긴장을 완화한다는 소문!"
 afr_empire_politics_local_rumor_noble_desc_1: "소문에 따르면 몇 주 전 [FROM.GetName]에서 지역 부족 간의 국경 분쟁을 해결한 카리스마 넘치는 귀족이 있다고 합니다. 소문이 사실로 판명된다면, 이 귀족을 우리 제국의 고문으로 영입할 수 있을 것입니다."
 afr_empire_politics_local_rumor_noble_search_1: "소문을 조사하고 이 귀족을 찾으십시오!"
 afr_empire_politics_local_rumor_noble_leave_1: "우리는 이 소문의 귀족을 추적할 필요가 없습니다."

깨끗한붕어빵5801님, 요청하신 내용을 모든 규칙에 따라 정확하게 번역했습니다. 이전의 모든 지적들을 바탕으로, §부터 !까지의 코드 블록과 [변수]는 내용까지 통째로 원문 그대로 유지하고, 그 외의 일반적인 영어 텍스트만 자연스러운 한국어로 번역하는 원칙을 철저히 준수했습니다.


 afr_empire_politics_local_rumor_merchant_title_1: "떠돌이 상인의 발명품에 대한 소문!"
 afr_empire_politics_local_rumor_merchant_desc_1: "몇 주 전 [FROM.GetName]에서 이상한 구조물을 선보인 떠돌이 상인에 대한 소문이 있습니다. 어떤 이들은 손잡이를 돌리는 것만으로도 보이는 불꽃 없이 빛나는 물건이 있다고 말합니다! 이 소문들 중 일부는 다소 기이하지만, 소문이 사실로 밝혀진다면 이 소문의 상인은 훌륭한 고문이 될 수 있을 것입니다!"
 afr_empire_politics_local_rumor_merchant_search_1: "소문을 조사하고 이 상인을 찾으십시오!"
 afr_empire_politics_local_rumor_merchant_leave_1: "우리는 이 소문의 상인을 추적할 필요가 없습니다."

 afr_empire_politics_local_rumor_jihadist_title_1: "떠돌이 다와가 부패를 폭로한다는 소문!"
 afr_empire_politics_local_rumor_jihadist_desc_1: "현지 관리들은 [FROM.GetName]의 [FROM.afr_empire_politics_state_category_scripted] 중 한 곳에서 관리들의 부패를 폭로한 떠돌이 다와에 대한 소문을 걱정스러운 태도로 논의했습니다. 현지인들은 이 소문의 다와의 행방을 돕기 위해 노력했지만, 지금까지 모든 묘사는 일관성이 없었습니다. 하지만 소문이 사실이라면 이 다와는 우리 제국 내에서 인상적인 고문이 될 것입니다!"
 afr_empire_politics_local_rumor_jihadist_search_1: "소문을 조사하고 이 다와를 찾으십시오!"
 afr_empire_politics_local_rumor_jihadist_leave_1: "이 소문의 다와는 너무 많은 소란을 일으킬 수 있습니다."

 afr_empire_politics_local_rumor_dawah_title_1: "떠돌이 다와가 병자들을 치유한다는 소문!"
 afr_empire_politics_local_rumor_dawah_desc_1: "일주일 전쯤 [FROM.GetName]의 [FROM.afr_empire_politics_state_category_scripted] 내에서 떠돌이 다와가 병자들을 치유하는 것이 발견되었습니다! 현지 관리들이 다와의 현재 행방에 대해 엇갈린 설명을 하지만, 이 소문의 다와를 추적하는 것이 가능할 수도 있습니다. 소문이 사실로 밝혀진다면, 이 다와는 훌륭한 고문이 될 것입니다!"
 afr_empire_politics_local_rumor_dawah_search_1: "소문을 조사하고 이 다와를 찾으십시오!"
 afr_empire_politics_local_rumor_dawah_leave_1: "우리는 이 소문의 다와를 추적할 필요가 없습니다."


 afr_empire_politics_local_rumor_priest_title_1_true: "떠돌이 사제에 대한 소문이 사실입니다!"
 afr_empire_politics_local_rumor_priest_desc_1_true: "몇 달간의 수색 끝에 소문에 맞는 사제를 찾았습니다!"
 afr_empire_politics_local_rumor_priest_accept_1_true: "이 사제를 제국의 고문으로 영입하십시오!"
 afr_empire_politics_local_rumor_priest_decline_1_true: "다시 생각해보니, 그들을 고문으로 만들지 않는 것이 좋겠습니다."
 afr_empire_politics_local_rumor_priest_title_1_false: "떠돌이 사제에 대한 소문은 거짓입니다!"
 afr_empire_politics_local_rumor_priest_desc_1_false: "몇 달간의 수색 끝에도 이 소문의 사제에 대한 흔적은 없습니다."
 afr_empire_politics_local_rumor_priest_leave_1_false: "시간 낭비였군!"
 afr_empire_politics_local_rumor_priest_true_loc_1: "사제는 현지인들이 제공한 모든 묘사와 일치하며 소문을 뛰어넘는 치유 능력을 보여주었습니다! 이 수색은 대성공이었고, 이 사제는 우리 제국 내에서 훌륭한 고문이 될 것입니다!"
 afr_empire_politics_local_rumor_priest_true_loc_2: "사제는 현지인들이 제공한 대부분의 묘사와 일치하지만, 다행히도 사제의 치유술은 소문대로 좋습니다."
 afr_empire_politics_local_rumor_priest_true_loc_3: "사제는 현지인들이 제공한 일부 묘사와 일치하지만, 불행히도 사제의 치유술은 소문만큼 좋지 않습니다."

