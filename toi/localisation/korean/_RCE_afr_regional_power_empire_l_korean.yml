 afr_empire_politics_autonomy_revolt_subject_lvl_2_timeout_effect: "§LOur insurgents will not have enough supplies to fight any longer, resulting in our capitulation to the [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] Empire. This will result in [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetName] lowering our status to Integrated Vassal and much of our autonomy being stripped in the process.\n§!"
 afr_empire_politics_autonomy_revolt_subject_lvl_3_timeout_effect: "§LOur insurgents will not have enough supplies to fight any longer, resulting in our capitulation to the [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] Empire. This will result in [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetName] lowering our status to Integrated Vassal and much of our autonomy being stripped in the process.\n§!"
 afr_empire_politics_autonomy_revolt_subject_lvl_4_timeout_effect: "§LOur insurgents will not have enough supplies to fight any longer, resulting in our capitulation to the [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] Empire. This will result in [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetName] lowering our status to Integrated Vassal and much of our autonomy being stripped in the process.\n§!"


 afr_empire_politics_autonomy_revolt_subject_complete_effect_tooltip: "\n§YUpon Revolt Success:§!\n[afr_empire_politics_autonomy_revolt_subject_complete_effect_scripted]"

 afr_empire_politics_autonomy_revolt_subject_lvl_1_complete_effect: "§L[?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetName] will be forced to recognize us with the elevated status of Autonomous Vassal. Additionally our military victory will provide us a large amount of autonomy within the [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] Empire.\n§!"
 afr_empire_politics_autonomy_revolt_subject_lvl_2_complete_effect: "§L[?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetName] will be forced to recognize us with the elevated status of Regional Authority. Additionally our military victory will provide us a large amount of autonomy within the [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] Empire.\n§!"
 afr_empire_politics_autonomy_revolt_subject_lvl_3_complete_effect: "§L[?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetName] will be forced to recognize us with the elevated status of Tributary. Additionally our military victory will provide us a large amount of autonomy within the [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] Empire.\n§!"
 afr_empire_politics_autonomy_revolt_subject_lvl_4_complete_effect: "§L[?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetName] will be forced to recognize our sovereignty and independence from the [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] Empire.\n§!"

 afr_empire_politics_subject_demotion_demand_3_tooltip: "§RThis will increase our subject's autonomy.§!"


 afr_empire_politics_subject_levy_mission: "제국 군주 징수"
 afr_empire_politics_subject_levy_mission_desc: "제국은 번영세 또는 현지 부족 전사 징집 형태로 신하들에게 부과할 것입니다. 제국의 징수를 지불하지 않으면 우리의 자율성이 감소하지만, 요청된 것보다 더 많은 징수를 제공하면 더 많은 자율성을 얻을 것입니다."

 afr_empire_politics_subject_levy_mission_event.2.t: "[FROM.GetAdjective] 제국 징수"
 afr_empire_politics_subject_levy_mission_event.2.d: "[FROM.GetAdjective] 제국 내에서 [afr_empire_politics_subject_autonomy_level_scripted] 지위를 유지하기 위해, 우리는 [FROM.GetLeader]에게 징수를 지불해야 합니다."
 afr_empire_politics_subject_levy_mission_event.2.a: "기마병 부대를 보내 징수를 지불하겠습니다."
 afr_empire_politics_subject_levy_mission_event.2.b: "전사 부대를 보내 징수를 지불하겠습니다."
 afr_empire_politics_subject_levy_mission_event.2.c: "번영 비축금을 사용하여 징수를 지불하겠습니다."

 afr_empire_politics_subject_levy_mission_event.3.t: "[FROM.GetName]이(가) 우리의 징수를 지불했습니다."
 afr_empire_politics_subject_levy_mission_event.3.d: "[afr_empire_politics_subject_levy_mission_event_scripted] 그들은 우리 제국 내에서 [FROM.afr_empire_politics_subject_autonomy_level_scripted]으로서 유용함을 입증했습니다. 적어도 당분간은..."
 afr_empire_politics_subject_levy_mission_event.3.a: "좋은 소식입니다."
 afr_empire_politics_subject_levy_mission_event.3.b: "좋은 소식입니다."
 afr_empire_politics_subject_levy_mission_event.3.c: "좋은 소식입니다."

 afr_empire_politics_subject_levy_mission_event_loc_horse_high: "우리는 이번에 [FROM.GetName]에게 대규모 징수를 부과했으며, 그들은 친절하게도 3000명의 기마병들을 제공하여 이행했습니다. 이들은 우리 제국의 깃발 아래 전투에 참전할 것입니다."
 afr_empire_politics_subject_levy_mission_event_loc_horse_med: "우리는 [FROM.GetName]에게 표준 징수를 부과했으며, 그들은 성공적으로 지불했습니다. 그들은 우리에게 2000명의 기마병들을 제공했습니다. 이들은 우리 제국의 깃발 아래 전투에 참전할 것입니다."
 afr_empire_politics_subject_levy_mission_event_loc_horse_low: "우리는 [FROM.GetName]에게 소규모 징수를 부과했으며, 그들은 성공적으로 지불했습니다. 그들의 공물 중 일부로, 그들은 우리 제국의 깃발 아래 전투에 참전할 1000명의 기마병들을 보냈습니다."
 afr_empire_politics_subject_levy_mission_event_loc_warrior_high: "우리는 이번에 [FROM.GetName]에게 대규모 징수를 부과했으며, 그들은 6000명의 뛰어난 전사들로 우리 제국의 군대를 증강하여 이행했습니다."
 afr_empire_politics_subject_levy_mission_event_loc_warrior_med: "우리는 [FROM.GetName]에게 표준 징수를 부과했으며, 그들은 성공적으로 지불했습니다. 그들은 우리에게 우리 제국의 군대에서 복무할 4000명의 전사들을 제공했습니다."
 afr_empire_politics_subject_levy_mission_event_loc_warrior_low: "우리는 [FROM.GetName]에게 소규모 징수를 부과했으며, 그들은 성공적으로 지불했습니다. 그들의 공물 중 일부로, 그들은 우리 제국의 군대에서 복무할 2000명의 전사들을 보냈습니다."
 afr_empire_politics_subject_levy_mission_event_loc_prosperity_high: "우리는 [FROM.GetName]에게 대규모 징수를 부과했으며, [FROM.GetLeader]은(는) 이를 관대하게 호화로운 선물로 이행했습니다."
 afr_empire_politics_subject_levy_mission_event_loc_prosperity_med: "우리는 [FROM.GetName]에게 표준 징수를 부과했으며, [FROM.GetLeader]은(는) 이를 성공적으로 귀중한 선물로 이행했습니다."
 afr_empire_politics_subject_levy_mission_event_loc_prosperity_low: "우리는 [FROM.GetName]에게 소규모 징수를 부과했으며, [FROM.GetLeader]은(는) 이를 가치가 거의 없는 평범한 선물로 이행했습니다."

 afr_empire_politics_subject_levy_mission_event.4.t: "[FROM.GetName]이(가) 우리의 징수를 지불하지 못했습니다."
 afr_empire_politics_subject_levy_mission_event.4.d: "[FROM.GetName]이(가) 우리의 의무적인 징수를 지불하지 못했다는 점은 매우 불쾌합니다! 이러한 무능함은 그들이 우리 제국 내에서 [FROM.afr_empire_politics_subject_autonomy_level_scripted]으로서 존재할 가치가 없음을 보여줍니다."
 afr_empire_politics_subject_levy_mission_event.4.a: "그들이 지불할 수 없다면, 우리가 통제권을 가져야 할까요?"

 afr_empire_politics_subject_levy_mission_event.5.t: "[FROM.GetAdjective] 제국 징수 실패"
 afr_empire_politics_subject_levy_mission_event.5.d: "[FROM.GetLeader]은(는) 우리가 제국의 징수를 제공하는 능력이 부족한 것에 크게 불쾌해합니다. 우리가 [afr_empire_politics_subject_autonomy_level_scripted]으로서의 가치를 유지할 수 있다는 증거가 부족하여 우리의 자율성이 감소했습니다."
 afr_empire_politics_subject_levy_mission_event.5.a: "우리는 이 자율성 상실에서 회복해야 할 것입니다..."

