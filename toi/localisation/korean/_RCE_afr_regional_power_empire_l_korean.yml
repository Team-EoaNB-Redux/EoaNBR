 afr_empire_politics_annex_subject_decision_loyalty_0_2_level_2_desc: "[FROM.GetName]의 우리에 대한 충성도는 위험할 정도로 낮습니다. 그들의 충성도를 높이기 위해 아무것도 하지 않는다면, 그들은 독립을 위한 §Rstart a revolt for independence§!를 시작할 수 있습니다.\n\n[FROM.GetName]의 자율성이 감소하면 우리는 그들을 §GIntegrated Vassal§!로 만드는 과정을 시작할 수 있습니다. 이는 우리에 대한 그들의 §CLoyalty§!를 §Rheavily reduce§!할 것이지만, 그 대가로 우리는 그들의 산업, 자원, 인력 대부분을 통제할 것입니다."
