 afr_empire_politics_annex_subject_decision_raise_autonomy_to_2: "자율 속국 지위 요구"
 afr_empire_politics_annex_subject_decision_raise_autonomy_to_2_desc: "외교적 행동을 통해, 우리는 상당한 자율성을 확보하여 자율 속국의 지위를 요구할 수 있습니다.\n\n[FROM.GetName]의 자율 속국이 되면 우리 국가의 자원과 업무에 대한 더 큰 통제권을 가질 수 있습니다. 이러한 새로운 특권에는 무역 특권, 산업에 대한 완전한 통제권, 그리고 내정에 대한 완전한 자율성이 포함됩니다."
 afr_empire_politics_annex_subject_decision_raise_autonomy_to_3: "지역 권한 지위 요구"
 afr_empire_politics_annex_subject_decision_raise_autonomy_to_3_desc: "외교적 행동을 통해, 우리는 상당한 자율성을 확보하여 지역 권한의 지위를 요구할 수 있습니다.\n\n[FROM.GetName]의 지역 권한이 되면 [FROM.GetAdjective] 제국 내에서 지역 업무를 수행할 수 있게 됩니다. 이러한 새로운 특권은 [FROM.GetName]의 우리 전사 징집을 제한하고, 독립적으로 전쟁을 선포할 수 있게 하며, 제국의 연구자 네트워크에 접근할 수 있게 합니다."
 afr_empire_politics_annex_subject_decision_raise_autonomy_to_4: "공물국 지위 요구"
 afr_empire_politics_annex_subject_decision_raise_autonomy_to_4_desc: "외교적 행동을 통해, 우리는 상당한 자율성을 확보하여 공물국의 지위를 요구할 수 있습니다.\n\n[FROM.GetName]의 공물국이 되면 [FROM.GetAdjective] 제국 내에서 독립적인 행위자가 될 수 있습니다. 이러한 새로운 특권에는 제국 연구자들과의 협력 증대, 독립적으로 전쟁을 선포할 수 있는 능력, 그리고 [FROM.GetName]이(가) 우리에게 참가를 요청하는 모든 전쟁을 거부할 수 있는 권한이 포함됩니다."
 afr_empire_politics_annex_subject_decision_raise_autonomy_to_free: "독립 요구"
 afr_empire_politics_annex_subject_decision_raise_autonomy_to_free_desc: "외교적 행동을 통해, 우리는 상당한 자율성을 확보하여 독립을 요구할 수 있습니다.\n\n만약 [FROM.GetName]의 눈에 우리가 충성스러운 것으로 여겨진다면, 그들은 우리에게 공물국으로 남아있는 대가로 더 이상 그들에게 공물을 바치지 않아도 된다고 요청할 수 있습니다."

