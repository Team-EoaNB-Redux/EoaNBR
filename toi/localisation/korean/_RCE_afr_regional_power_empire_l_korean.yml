 afr_empire_politics_state_manager_event.2.t: "[FROM.GetName] 방문"
 afr_empire_politics_state_manager_event.2.d: "당신은 [ROOT.GetName] 내의 [FROM.afr_empire_politics_state_category_scripted] 마을[FROM.afr_state_manager_localization_town_type_capital_scripted]에 들어섭니다. 걸어 다니면서, 당신은 현지인들이 [FROM.afr_state_manager_localization_activity_type_scripted]하는 것을 봅니다."
 afr_empire_politics_state_manager_event.2.a: "[FROM.GetName]에서 최신 소문을 문의하십시오."
 afr_empire_politics_state_manager_event.2.e: "[FROM.afr_empire_politics_state_category_scripted] 마을을 떠나십시오."
 afr_empire_politics_state_manager_event_1_a_tooltip: "때때로 재능 있는 개인에 대한 소문은 사실로 판명됩니다. 이들을 찾아 나서는 것은 우리 제국을 위한 재능 있는 고문들을 얻을 수 있습니다."

 afr_empire_politics_state_manager_garrison_event.2.t: "[FROM.GetName] 현지 주둔군"
 afr_empire_politics_state_manager_garrison_event.2.d: "[ROOT.anti_scope_leak_scripted][FROM.afr_empire_politics_state_manager_levy_loyalty_scripted]"
 afr_empire_politics_state_manager_garrison_event.2.e: "현지 주둔군을 떠나십시오."

 afr_empire_politics_state_manager_levy_loyalty_strong: "\n\n[ROOT.anti_scope_leak_scripted][PREV.GetName]'s [?OWNER.GetAdjective] Empire에 대한 충성도는 강하며, 우리는 일반적인 징집 병력의 예상치를 기대할 수 있습니다."
 afr_empire_politics_state_manager_levy_loyalty_decent: "\n\n[ROOT.anti_scope_leak_scripted][PREV.GetName]의 [?OWNER.GetAdjective] Empire에 대한 강력한 충성도가 부족하여 일반적인 징집량을 제공할 수 없습니다."
 afr_empire_politics_state_manager_levy_loyalty_bad: "\n\n[ROOT.anti_scope_leak_scripted][PREV.GetName]의 충성도가 너무 낮아 징집 병력을 제공할 인력을 찾을 수 없습니다."

 afr_empire_politics_state_manager_officials_event.2.t: "[FROM.GetName] 현지 관리들"
 afr_empire_politics_state_manager_officials_event.2.d: "당신이 [FROM.GetName]의 수도로 걸어 들어가자, 관리들이 당신과 만나기 위해 열렬히 줄을 섭니다."
 afr_empire_politics_state_manager_officials_event.2.b: "현지 정치에 대해 논의하십시오."
 afr_empire_politics_state_manager_officials_event.2.e: "현지 관리들을 떠나십시오."
 afr_empire_politics_state_manager_officials_event_2_b_tooltip: "조건이 충족되면 충성도를 높이거나 계엄령을 시행할 수 있는 옵션을 제공할 수 있습니다."

 afr_empire_politics_state_manager_workshop_event.2.t: "[FROM.GetName] 작업장"
 afr_empire_politics_state_manager_workshop_event.2.d: "당신이 [FROM.GetName]의 작업장으로 걸어 들어가자, 노동자들은 당신과의 만남을 열렬히 기다리며 줄을 섭니다."
 afr_empire_politics_state_manager_workshop_event.2.e: "현지 작업장을 떠나십시오."

 afr_empire_politics_state_manager_local_politics_event.2.t: "[FROM.GetName]의 정치"
 afr_empire_politics_state_manager_local_politics_event.2.d: "당신은 많은 관리들이 있는 웅장한 방으로 들어갑니다. 몇 시간 후 당신은 [FROM.GetName]의 현재 정치 상황을 이해합니다. [ROOT.anti_scope_leak_scripted][FROM.afr_empire_politics_state_manager_local_politics_loyalty_scripted]"
 afr_empire_politics_state_manager_local_politics_event.2.aa: "선물을 보내십시오. 이것이 [FROM.GetName]의 여론을 높여줄 것입니다."
 afr_empire_politics_state_manager_local_politics_event.2.ab: "[FROM.afr_empire_politics_state_category_scripted]이(가) 선물을 즐기는 것을 보니 기쁩니다."
 afr_empire_politics_state_manager_local_politics_event.2.ac: "현재는 선물을 보낼 여유가 없습니다."
 afr_empire_politics_state_manager_local_politics_event.2.ba: "자율성을 낮추고 계엄령을 시행하십시오!"
 afr_empire_politics_state_manager_local_politics_event.2.bb: "계엄령 해제를 논의하십시오."
 afr_empire_politics_state_manager_local_politics_event.2.c: "[FROM.GetName]을(를) 제국 핵심으로 확립하는 것을 논의하십시오."
 afr_empire_politics_state_manager_local_politics_event.2.e: "오늘은 현지 정치를 논의할 필요가 없습니다."

 afr_empire_politics_state_manager_local_politics_loyalty_strong: "\n\n[THIS.GetName]의 [?OWNER.GetAdjective] 제국에 대한 충성도는 강하며 분리 위협은 불가능합니다."
 afr_empire_politics_state_manager_local_politics_loyalty_decent: "\n\n[?OWNER.GetAdjective] 제국에 대한 강력한 충성심 부족으로 인해 [THIS.GetName] 주민들은 분리 음모를 속삭이고 있습니다. 지역의 행복을 높이기 위해 화해 선물을 권장합니다."
 afr_empire_politics_state_manager_local_politics_loyalty_bad: "\n\n[THIS.GetName]은(는) 불충하며, 아무 조치도 취하지 않으면 분리 위협이 임박합니다. 화해 선물은 지역 주민의 행복을 높이는 데 도움이 될 수 있지만, 그것만으로는 분리 운동을 막을 수 없습니다."

 afr_empire_politics_state_manager_martial_law.3.t: "[FROM.GetName]의 계엄령"
 afr_empire_politics_state_manager_martial_law.3.d: "[FROM.GetName]의 주민들은 현재 [FROM.afr_empire_state_public_opinion_var_loc_scripted] 상태입니다. [ROOT.GetAdjective] 제국이 군사 통치를 시행함에 따라 [FROM.GetName]의 자율성이 낮아졌고, 이는 주민들의 분노를 계속해서 키우고 있습니다."
 afr_empire_politics_state_manager_martial_law.3.a: "[FROM.GetName]에서 계엄령을 유지하십시오!"
 afr_empire_politics_state_manager_martial_law.3.b: "[FROM.GetName]에서 계엄령을 해제하십시오."

 afr_empire_politics_state_send_loyalty_gift_decision: "거시 관리: 선물 보내기"
 afr_empire_politics_state_send_loyalty_gift_decision_desc: "제국으로부터 웅장한 선물을 통해 우리 주 중 하나의 여론을 일시적으로 높일 수 있습니다! 좋은 여론은 해당 주의 제국에 대한 충성도를 높일 것입니다."
