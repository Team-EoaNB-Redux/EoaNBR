 afr_empire_politics_subject_promotion_demand.1.t: "[FROM.GetName]은(는) [FROM.afr_empire_politics_subject_autonomy_promote_level_scripted] 지위를 요구합니다!"
 afr_empire_politics_subject_promotion_demand.1.d: "[FROM.GetName]은(는) [ROOT.GetAdjective] 제국 내에서 많은 자율성을 얻었으며, [FROM.afr_empire_politics_subject_autonomy_promote_level_scripted]로 정당하게 승격되기를 요구합니다. 이 자격을 박탈하는 것은 우리 제국에 대한 그들의 충성도를 크게 낮출 것입니다.[afr_empire_politics_subject_promotion_demand_1_desc_army_size_scripted]"
 afr_empire_politics_subject_promotion_demand.1.a: "그들은 충분히 자율적인 것을 증명했습니다. 승격을 받아들입니다."
 afr_empire_politics_subject_promotion_demand.1.b: "그들은 새로운 지위를 받을 자격이 없습니다!"

 afr_empire_politics_subject_promotion_demand_1_desc_army_size_localization: "\n\n[ROOT.GetAdjective] 제국의 군사력은 [FROM.GetName]의 군대 덕분에 크게 성장했습니다. 그들의 [afr_empire_politics_army_size_scripted]으로 그들은 현재의 자율성을 확실히 얻었습니다."

 afr_empire_politics_Tribal_army_num_localization: "[?Tribal_army_num] 전사"
 afr_empire_politics_Tribal_horse_army_num_localization: "[?Tribal_horse_army_num] 기마병"
 afr_empire_politics_Tribal_camel_army_num_localization: "[?Tribal_camel_army_num] 낙타병"

 afr_empire_politics_subject_promotion_demand.2.t: "[FROM.GetName]은(는) 우리의 승격을 허용합니다!"
 afr_empire_politics_subject_promotion_demand.2.d: "[FROM.GetName]은(는) [FROM.GetAdjective] 제국 내에서 우리의 정당한 지위를 받아들였습니다."
 afr_empire_politics_subject_promotion_demand.2.a: "훌륭합니다!"

 afr_empire_politics_subject_promotion_demand.3.t: "[FROM.GetName]은(는) 우리의 승격을 거부합니다!"
 afr_empire_politics_subject_promotion_demand.3.d: "[FROM.GetName]은(는) [FROM.GetAdjective] 제국 내에서 우리의 정당한 지위를 거부했습니다. 그 결과, 우리의 자율성이 감소했습니다!"
 afr_empire_politics_subject_promotion_demand.3.a: "우리는 그들이 틀렸음을 증명할 것입니다!"

 afr_empire_politics_subject_demotion_demand.1.t: "[FROM.GetName]은(는) [ROOT.afr_empire_politics_subject_autonomy_demote_level_scripted] 지위를 요구합니다!"
 afr_empire_politics_subject_demotion_demand.1.d: "우리의 자율성은 최근 상당히 낮아졌으며, 우리의 군주는 [ROOT.afr_empire_politics_subject_autonomy_level_scripted]로서의 지위가 부당하다고 여깁니다. 우리가 강등에 이의를 제기할 수도 있지만, 우리의 주장이 약하다면 군주를 화나게 할 수 있습니다.[afr_empire_politics_subject_demotion_demand_1_desc_army_size_scripted]"
 afr_empire_politics_subject_demotion_demand.1.a: "우리는 우리의 새로운 지위를 받아들일 것입니다."
 afr_empire_politics_subject_demotion_demand.1.b: "[ROOT.afr_empire_politics_subject_autonomy_level_scripted]로서 [FROM.GetAdjective] 제국에 우리가 제공하는 이점을 주장하십시오!"

 afr_empire_politics_subject_demotion_demand_1_desc_army_size_localization: "\n\n[FROM.GetAdjective] 제국의 군사력은 [ROOT.GetName]의 군대 덕분에 크게 성장했습니다. 이것은 우리의 지위를 유지하기 위한 주장의 힘을 증가시킬 뿐입니다!"

 afr_empire_politics_subject_demotion_demand.2.t: "[FROM.GetName]은(는) [FROM.afr_empire_politics_subject_autonomy_level_scripted] 지위를 받아들입니다!"
 afr_empire_politics_subject_demotion_demand.2.d: "[FROM.GetName]은(는) [ROOT.GetName] 제국 내에서 새로운 지위를 받아들였습니다."
 afr_empire_politics_subject_demotion_demand.2.a: "훌륭합니다!"

 afr_empire_politics_subject_demotion_demand.3.t: "[FROM.GetName]이(가) 강등에 이의를 제기합니다!"
 afr_empire_politics_subject_demotion_demand.3.d: "[afr_empire_politics_subject_demotion_demand_3_desc_army_size_scripted]"
 afr_empire_politics_subject_demotion_demand.3.a: "그들의 주장은 타당합니다. 그들은 [FROM.afr_empire_politics_subject_autonomy_level_scripted]로 남을 수 있습니다."
 afr_empire_politics_subject_demotion_demand.3.b: "강등을 강제하십시오!"

 afr_empire_politics_subject_demotion_demand_3_desc_army_size_big_localization: "\n\n[ROOT.GetAdjective] 제국의 군사력은 [FROM.GetName]의 군대 덕분에 크게 성장했습니다. 그들의 [FROM.afr_empire_politics_army_size_scripted]으로 그들은 [FROM.afr_empire_politics_subject_autonomy_level_scripted]로서 잠재적으로 유용하게 남을 수 있습니다."
 afr_empire_politics_subject_demotion_demand_3_desc_army_size_small_localization: "\n\n[ROOT.GetAdjective] 제국의 군사력은 [FROM.GetName]의 보잘것없는 [FROM.afr_empire_politics_army_size_scripted] 덕분에 거의 이득을 보지 못했습니다."

 afr_empire_politics_subject_demotion_demand.4.t: "[FROM.GetName]이(가) 강등을 허용합니다!"
 afr_empire_politics_subject_demotion_demand.4.d: "[FROM.GetName]은(는) 우리를 강등하려는 요구를 철회했으며, 우리의 [ROOT.afr_empire_politics_subject_autonomy_level_scripted] 지위에 동의했습니다. 그 결과, 우리는 [FROM.GetAdjective] 제국 내에서 약간의 자율성을 얻었습니다."
 afr_empire_politics_subject_demotion_demand.4.a: "우리는 [ROOT.afr_empire_politics_subject_autonomy_level_scripted] 지위를 유지하기 위해 더 열심히 노력해야 합니다."

 afr_empire_politics_subject_demotion_demand.5.t: "[FROM.GetName]이(가) 강등을 강제합니다!"
 afr_empire_politics_subject_demotion_demand.5.d: "[FROM.GetName]은(는) 우리의 지위를 [afr_empire_politics_subject_autonomy_demote_level_scripted]로 강등하라는 요구를 강제했습니다! 우리가 그들의 요구를 받아들이면, 그들의 권위에 의문을 제기한 대가로 우리의 자율성은 더 큰 타격을 입을 것입니다."
 afr_empire_politics_subject_demotion_demand.5.a: "우리는 더 이상 강등에 이의를 제기할 수 없습니다..."
 afr_empire_politics_subject_demotion_demand.5.b: "우리는 우리의 자율성을 증명하기 위해 반란을 일으킬 것입니다!"

 afr_empire_politics_subject_demotion_demand_5_revolt_tooltip: "§RThis will require us to take a core of§! §Y[FROM.GetName]§!§R to win!§!"
 afr_empire_politics_independence_struggle_revolt_tooltip: "\n§RThis will require us to take a core of§! §Y[THIS.GetName]§!§R to win!§!\n"

 afr_empire_politics_subject_demotion_demand.6.t: "[FROM.GetAdjective] 봉기!"
 afr_empire_politics_subject_demotion_demand.6.d: "[FROM.GetName]은(는) [FROM.afr_empire_politics_subject_autonomy_level_scripted] 지위를 유지하고 자율성을 증명하기 위해 우리에게 반란을 일으켰습니다!\n\n그들이 우리 영토의 핵심을 점령하면 우리는 그들의 요구에 굴복해야 할 것입니다. 우리는 모든 비용을 들여 그들을 보호해야 합니다!\n\n우리는 [FROM.GetAdjective] 반란군이 우리의 요구에 굴복하기 전에 1년치 보급품만 가질 것이라고 믿습니다. 반란군이 추가 보급품을 확보하더라도, 최대 1년 더 전쟁을 연장할 수 있을 뿐입니다."
 afr_empire_politics_subject_demotion_demand.6.a: "우리는 이 반란을 진압해야 합니다!"
 afr_empire_politics_subject_demotion_demand.6.b: "우리 제국에 내전을 감수할 수 없습니다! 요구에 굴복하십시오!"

 afr_empire_politics_subject_demotion_demand_6_revolt_tooltip: "§Y[FROM.GetName]§!이(가) [ROOT.GetAdjective] 제국에 대항하여 봉기를 일으킬 것입니다!§!"

 afr_empire_politics_subject_demotion_demand.7.t: "[FROM.GetName]이(가) 요구에 굴복합니다!"
 afr_empire_politics_subject_demotion_demand.7.d: "[FROM.GetName]은(는) 내전에 휩쓸리기를 원치 않으므로 더 이상 문제를 제기하지 않을 것입니다."
 afr_empire_politics_subject_demotion_demand.7.a: "[ROOT.GetAdjective] 국민들은 자율성을 유지합니다!"

 afr_empire_politics_subject_demotion_demand.9.t: "[FROM.GetName] 반란 지속"
 afr_empire_politics_subject_demotion_demand.9.d: "[FROM.GetAdjective] 반란군은 아직 보급품이 바닥나지 않았고 우리의 전쟁 피로도는 점점 더 높아지고 있습니다. 전쟁을 끝내기 위해 그들의 요구에 굴복해야 할까요?"
 afr_empire_politics_subject_demotion_demand.9.a: "이 반란은 우리에게 너무 많은 비용을 치르게 합니다! 그들의 요구에 굴복하십시오!"
 afr_empire_politics_subject_demotion_demand.9.b: "우리는 이 반란을 진압하기 위해 싸움을 계속할 것입니다!"

 afr_empire_politics_subject_demotion_demand.10.t: "[FROM.GetName]이(가) 그들의 요구에 굴복합니다!"
 afr_empire_politics_subject_demotion_demand.10.d: "[FROM.GetName]은(는) 더 이상의 전쟁 피로도로 스스로를 짐 지우기를 원치 않으므로 더 이상 전쟁을 추구하지 않을 것입니다."
 afr_empire_politics_subject_demotion_demand.10.a: "[ROOT.GetAdjective] 국민들은 자율성을 유지합니다!"

 afr_empire_politics_subject_demotion_demand.11.t: "[FROM.GetName]이(가) 우리 영토를 통제합니다!"
 afr_empire_politics_subject_demotion_demand.11.d: "[FROM.GetName]은(는) 우리 국가의 핵심 지역에서 영토를 점령했습니다! 더 이상의 침략을 막기 위해, 우리는 그들의 요구에 굴복했습니다."
 afr_empire_politics_subject_demotion_demand.11.a: "이 얼마나 수치스러운 광경인가!"

 afr_empire_politics_subject_demotion_demand.12.t: "[FROM.GetName]이(가) 그들의 요구에 굴복합니다!"
 afr_empire_politics_subject_demotion_demand.12.d: "[FROM.GetName]은(는) 더 이상 전쟁을 추구하지 않을 것입니다! 우리가 그들의 영토 핵심을 점령한 후, 그들은 우리의 요구에 굴복했습니다."
 afr_empire_politics_subject_demotion_demand.12.a: "[ROOT.GetAdjective] 국민들은 자율성을 유지합니다!"

 afr_empire_politics_subject_demotion_demand.13.t: "[FROM.GetName] 반란 진압!"
 afr_empire_politics_subject_demotion_demand.13.d: "[ROOT.GetAdjective] 반란군은 더 이상 싸울 의지가 없습니다! 우리는 [FROM.GetName] 반란을 성공적으로 진압했습니다! 반란에 대한 처벌로, 우리는 그들의 자율성을 극적으로 감소시키고 이전 지위를 박탈했습니다."
 afr_empire_politics_subject_demotion_demand.13.a: "[FROM.GetName]은(는) 다시 반란을 일으키기 전에 두 번 생각할 것입니다."

 afr_empire_politics_subject_demotion_demand.14.t: "[FROM.GetName]이(가) [ROOT.GetAdjective] 반란군을 진압합니다!"
 afr_empire_politics_subject_demotion_demand.14.d: "우리 반란군은 더 이상 자율성을 위해 싸움을 계속할 수 없습니다! 우리는 [FROM.GetName]의 요구에 굴복해야 하며, 반란에 대한 처벌로 우리의 자율성 대부분이 박탈당했습니다!"
 afr_empire_politics_subject_demotion_demand.14.a: "우리는 오래도록 억압받지 않을 것입니다!"

 afr_empire_politics_subject_demotion_demand.15.t: "[FROM.GetName] 반란 진압!"
 afr_empire_politics_subject_demotion_demand.15.d: "[ROOT.GetAdjective] 제국이 [FROM.GetName]의 마을로 군대를 진군하자, 반란군은 즉시 패배했습니다! 반란에 대한 처벌로, 우리는 그들의 자율성을 극적으로 감소시키고 이전 지위를 박탈했습니다. 그러나 필요하다고 판단되면 추가 처벌로 그들의 마을을 약탈할 것입니다."
 afr_empire_politics_subject_demotion_demand.15.a: "그들의 자율성을 박탈하십시오!"
 afr_empire_politics_subject_demotion_demand.15.b: "그들의 자율성을 박탈하고 처벌로 마을을 약탈하십시오!"

 afr_empire_politics_subject_demotion_demand.16.t: "[FROM.GetName]이(가) [ROOT.GetAdjective] 반란군을 진압합니다!"
 afr_empire_politics_subject_demotion_demand.16.d: "우리 반란군은 진압되었으며, 우리는 [FROM.GetAdjective] 제국에 굴복해야 합니다. 그들은 우리의 자율성만을 박탈하고 마을은 거의 건드리지 않음으로써 자비를 베풀었습니다."
 afr_empire_politics_subject_demotion_demand.16.a: "그들은 자비를 베풀었지만, 우리는 굴복하지 않을 것입니다!"

 afr_empire_politics_subject_demotion_demand.17.t: "[FROM.GetName]이(가) 처벌로 [ROOT.GetName]을(를) 약탈합니다!"
 afr_empire_politics_subject_demotion_demand.17.d: "우리의 반란에 대한 처벌로 [FROM.GetName]은(는) 모든 [ROOT.GetAdjective] 마을을 약탈했습니다! 그들은 우리가 다시는 반란을 일으키지 않기를 바라지만, 우리는 이 날을 결코 잊지 않을 것입니다!"
 afr_empire_politics_subject_demotion_demand.17.a: "우리는 독립을 위해 투쟁할 것입니다!"

 afr_idea_independence_struggle: "[ROOT.GetAdjective] 독립을 위한 반란"
 afr_idea_independence_struggle_desc: "[ROOT.GetAdjective] 반란 이후, [?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] 제국의 신하들은 제국의 혼란을 이용하기 시작하고 있습니다."
 afr_idea_independence_struggle_overlord: "[ROOT.GetAdjective] 제국 반란"
 afr_idea_independence_struggle_overlord_desc: "[ROOT.GetAdjective] 제국 내의 반란이 [ROOT.GetName]의 신하들에 대한 권위를 흔들었습니다."

 afr_empire_politics_autonomy_revolt_subject_perspective: "[?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] 영토 통제"
 afr_empire_politics_autonomy_revolt_subject_perspective_desc: "[?afr_empire_politics_autonomy_revolt_subject_temp_overlord_id.GetAdjective] 제국 내에서 우리의 자율성을 증명하기 위해 반란이 발생했습니다."

 afr_empire_politics_autonomy_revolt_subject_timeout_effect_tooltip: "[afr_empire_politics_autonomy_revolt_subject_timeout_effect_scripted]"
