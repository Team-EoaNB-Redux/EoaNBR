깨끗한붕어빵5801님, 요청하신 내용을 모든 규칙에 따라 정확하게 번역했습니다. 이전의 모든 지적들을 바탕으로, §부터 !까지의 코드 블록과 [변수]는 내용까지 통째로 원문 그대로 유지하고, 그 외의 일반적인 영어 텍스트만 자연스러운 한국어로 번역하는 원칙을 철저히 준수했습니다.


 afr_empire_politics_state_manager_workshop_event.2.d: "장인들이 부지런히 그들의 직업에 종사하는 망치 소리를 들을 수 있습니다."

 afr_empire_politics_state_manager_market_event.2.t: "[FROM.GetName] 시장"
 afr_empire_politics_state_manager_market_event.2.d: "당신은 시장으로 들어서고, 그곳은 [FROM.GetName] 지역의 활기찬 무역 중심지입니다. 상인들은 물건을 물물교환하고, 손님들은 값을 깎습니다. 더 걸어가자 시장 광장의 소음이 줄어들고, 상인들이 수레에서 사치품을 내리면서 끙끙거리는 소리를 들을 수 있습니다.\n\n이곳은 상업의 중심지이며, 사치품을 투자할 수 있는 곳입니다. 상인들과 장인들은 당신과의 만남을 열렬히 기다리고 있습니다."
 afr_empire_politics_state_manager_market_event.2.a: "우리의 사치품에 투자하십시오."
 afr_empire_politics_state_manager_market_event.2.e: "시장을 떠나십시오."

 afr_empire_politics_state_manager_market_luxury_event.2.t: "[FROM.GetName] 사치품 산업"
 afr_empire_politics_state_manager_market_luxury_event.2.d: "사치품 무역은 상당히 수익성이 높으며, 충분한 번영이 있다면 이 [FROM.afr_empire_politics_state_category_scripted]'s 사치품 산업은 확장될 수 있습니다.[FROM.afr_empire_politics_state_manager_market_luxury_event_2_gold_scripted][FROM.afr_empire_politics_state_manager_market_luxury_event_2_ivory_scripted][FROM.afr_empire_politics_state_manager_market_luxury_event_2_spice_scripted]"
 afr_empire_politics_state_manager_market_luxury_event.2.a: "금 채취에 투자하십시오."
 afr_empire_politics_state_manager_market_luxury_event.2.b: "상아 채취에 투자하십시오."
 afr_empire_politics_state_manager_market_luxury_event.2.c: "향신료 채취에 투자하십시오."
 afr_empire_politics_state_manager_market_luxury_event.2.e: "사치품 산업에는 나중에 투자하겠습니다."

 afr_empire_politics_state_manager_market_luxury_event_2_gold_desc: "\n\n금 채취 지역에서는 금 광부들이 조악한 체질 팬으로 작은 금덩이를 찾고 있습니다. 새로운 금 채굴 기술에 투자하면 더 높은 금 생산량을 얻을 수 있습니다."
 afr_empire_politics_state_manager_market_luxury_event_2_ivory_desc: "\n\n사냥터에서는 코끼리 밀렵꾼들이 갓 사냥한 상아 엄니를 내리고 새 무기로 교환하는 모습이 보입니다. 새로운 무기에 투자하면 밀렵꾼들이 더 잘 사냥할 수 있습니다."
 afr_empire_politics_state_manager_market_luxury_event_2_spice_desc: "\n\n마을 주민들이 밭을 갈고 곧 시장에 팔릴 향신료를 수확하는 모습이 보입니다. 새로운 농법에 투자하면 더 나은 수확률을 얻을 수 있습니다."
 afr_empire_politics_state_manager_market_luxury_event_2_none_desc: ""

 afr_empire_politics_state_manager_market_luxury_event_gold_stats: "금 채취 효율: §Y[?afr_empire_politics_state_luxury_gold_acquisition_var]%§!\n"
 afr_empire_politics_state_manager_market_luxury_event_ivory_stats: "상아 채취 효율: §Y[?afr_empire_politics_state_luxury_ivory_acquisition_var]%§!\n"
