 afr_regional_power_empire_politics_tax_law: "세법 검토"
 afr_regional_power_empire_politics_tax_law_desc: "국민들은 우리가 세금을 얼마나 부과하는지에 민감합니다. 세금을 너무 적게 부과하면 제국의 금고가 바닥나겠지만, 너무 많이 부과하면 시민들이 반란을 일으킬 것입니다."
 afr_regional_power_empire_politics_tax_law_tooltip: "§YTax Laws§!는 §Oonce every year§!만 변경할 수 있습니다.\n"
