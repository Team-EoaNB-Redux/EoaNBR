 afr_empire_politics_resign_advisor_priest: "음모: 사제 고문 제거"
 afr_empire_politics_resign_advisor_priest_desc: "황실 법정은 부족 정치의 격전장입니다. 종종 [ROOT.GetName] 제국 내의 저명한 구성원을 제거하기 위해 막후 거래나 호의를 베풀어야 합니다. 그러나 누구를 적으로 만들지는 조심해야 합니다. 그들은 복수할 수도 있습니다."
