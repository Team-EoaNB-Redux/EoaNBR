 afr_empire_politics_annex_subject_decision_loyalty_0_2_level_1: "합병 [FROM.GetName] §Y(§!§WLoyalty:§! §R[?FROM.afr_empire_subject_loyalty_var@ROOT]§!§Y)§!"
 afr_empire_politics_annex_subject_decision_loyalty_0_2_level_1_desc: "[FROM.GetName]의 우리에 대한 충성도는 위험할 정도로 낮습니다. 그들의 충성도를 높이기 위해 아무것도 하지 않는다면, 그들은 독립을 위한 §Rstart a revolt§!를 시작할 수 있습니다.\n\n[FROM.GetName]의 자율성이 충분히 감소하면, 우리는 §Gannexation§! 과정을 시작할 수 있습니다. 만약 [FROM.GetName]의 충성도가 높지 않은 상태에서 합병 과정을 시작한다면, 반란군들이 §Rmight rally for [FROM.GetAdjective] independence§!."
