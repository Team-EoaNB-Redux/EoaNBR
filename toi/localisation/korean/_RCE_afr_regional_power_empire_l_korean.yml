 UCT_territory_management_establish_first_claim.2.t: "[FROM.GetName] 영토 관리"
 UCT_territory_management_establish_first_claim.2.d: "[ROOT.GetName]은(는) [FROM.GetName]에 대한 첫 번째 식민지 주장권을 가질 수 있습니다. 다른 어떤 나라도 [FROM.GetName]에 대해 자체 주장을 하지 않는 한, 우리의 주장 진행은 이의 없이 진행될 것입니다.\n\n[FROM.GetName]에 대한 주장 진행이 완료될 때까지 주기적으로 지휘력이 필요하며, 이는 4년이 걸릴 수 있습니다. 주장 과정 중에 파산하면 주에 대한 우리의 주장은 상실되고 진행도는 0으로 재설정됩니다."
 UCT_territory_management_establish_first_claim.2.a: "우리는 [ROOT.GetName]을(를) 위해 [FROM.GetName]을(를) 주장할 것입니다!"
 UCT_territory_management_establish_first_claim.2.b: "나중에 결정하겠습니다."
 UCT_territory_management_establish_first_claim.2.c: "우리는 [ROOT.GetName]을(를) 위해 [FROM.GetName]을(를) 절대 주장하지 않을 것입니다."

 UCT_territory_management_establish_first_claim_cost_tooltip: "[FROM.GetName]을(를) 주장하는 데 £command_power 100이 소모됩니다."

