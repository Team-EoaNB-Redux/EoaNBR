 afr_empire_state_modifier_tooltip: "§YState Loyalty:§!\n§LThis measures how loyal a state is to our empire. If a state's loyalty drops below zero, they will revolt against us. States will provide our empire with better recruitment for non-core and cored states if their loyalty is high. Additionally compliance and resistance modifiers will be positive if loyalty is high and negative if loyalty is low.§!\n\n§YState Autonomy:§!\n§LThis measures how autonomous a state is within our empire, at 100% autonomy the state will ask to be a subject. Having an autonomy of under 50% will remove any negative resource or recruitment modifiers.§!\n\n§YState Autonomy & Loyalty Level:§!"


