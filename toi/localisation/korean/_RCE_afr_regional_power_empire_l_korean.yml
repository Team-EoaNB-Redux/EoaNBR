 afr_empire_politics_independence_struggle_command_power_cost_tooltip: "독립을 위해 반란을 일으키는 데 100£command_power가 소모됩니다."

 afr_empire_politics_is_a_vassal_trigger_tooltip: "§YVassal Autonomy§!를 가지고 있습니다!"
 afr_empire_politics_atleast_org_tribe_trigger_tooltip: "§YUnorganized Tribal State§!가 아닙니다!"

 afr_empire_politics_increase_own_autonomy: "지역 자율성 추진"
 afr_empire_politics_increase_own_autonomy_desc: "[ROOT.GetAdjective]은(는) 이 땅에 대한 자치를 누릴 자격이 있습니다. 가능하다면 비밀리에 군주의 [ROOT.GetAdjective] 문제에 대한 영향력을 줄이고 지역 자율성을 확보하기 위한 준비를 해야 합니다."
 afr_empire_politics_increase_own_autonomy_trigger_tooltip: "§YLoyalty§!가 §Y5§!보다 큽니다!"
 afr_tt_decision_increase_autonomy: "우리가 너무 자주 자율성을 추진하면 §YOverlord§!가 §Rnegatively§! 반응할 수 있습니다.\n"

 afr_empire_politics_subject_send_tribute_to_overlord_decision: "조공 준비"
 afr_empire_politics_subject_send_tribute_to_overlord_decision_desc: "우리는 신하로서의 가치를 보여주고 우리의 자율성을 입증하기 위해 군주에게 조공을 바칠 것입니다."
 afr_empire_politics_subject_send_tribute_to_overlord_event.1.t: "[FROM.GetName]이(가) 조공을 보냈습니다."
 afr_empire_politics_subject_send_tribute_to_overlord_event.1.d: "[FROM.GetName]은(는) 경제적 번영을 누리고 있으며, 신하로서의 가치를 입증하기 위해 조공을 보냈습니다. 이는 분명 [FROM.GetAdjective]의 자율성을 보여주는 주목할 만한 사례입니다."
 afr_empire_politics_subject_send_tribute_to_overlord_event.1.a: "환영할 만한 조공입니다."
 afr_empire_politics_subject_send_tribute_to_overlord_event.2.t: "[FROM.GetName]이(가) 조공을 환영합니다."
 afr_empire_politics_subject_send_tribute_to_overlord_event.2.d: "[FROM.GetName]은(는) 우리가 그러한 번영을 이룰 수 있는 능력을 인정하고, 위대한 [FROM.GetAdjective] 제국 내에서 신하로서의 우리의 자율성을 인지했습니다."
 afr_empire_politics_subject_send_tribute_to_overlord_event.2.a: "훌륭합니다!"
 afr_empire_politics_subject_send_tribute_to_overlord_event.2.b: "인샤알라!"
 afr_empire_politics_subject_send_tribute_to_overlord_tooltip: "군주에게 조공을 보냄"

 afr_empire_politics_annex_subject_decision: "[afr_empire_politics_annex_subject_decision_scripted]"
 afr_empire_politics_annex_subject_decision_desc: "§YMechanic Effect:§!\n§W[afr_empire_politics_annex_subject_decision_desc_scripted]§!"

 afr_empire_politics_annex_subject_decision_loyalty_0_2_level_4: "[FROM.GetName] 진압 §Y(§!§WLoyalty:§! §R[?THIS.afr_empire_subject_loyalty_var@ROOT]§!§Y)§!"
 afr_empire_politics_annex_subject_decision_loyalty_0_2_level_4_desc: "[FROM.GetName]의 우리에 대한 충성도는 위험할 정도로 낮습니다. 그들의 충성도를 높이기 위해 아무것도 하지 않는다면, 그들은 독립을 위한 §Rrevolt for independence§!를 시작할 수 있습니다.\n\n[FROM.GetName]의 자율성이 낮아지면, 우리는 그들에게 제재를 가하여 §GRegional Authority§!로 만들 수 있습니다. 이는 그들의 §CLoyalty§!를 상당히 §Olikely reduce§!할 것이지만, 그 대가로 그들은 더 이상 우리의 전쟁 참전 요청을 거부할 수 없으며 우리는 그들의 영토 내에 건물을 지을 수 있습니다."
 afr_empire_politics_annex_subject_decision_loyalty_3_5_level_4: "[FROM.GetName] 진압 §Y(§!§WLoyalty:§! §O[?THIS.afr_empire_subject_loyalty_var@ROOT]§!§Y)§!"
 afr_empire_politics_annex_subject_decision_loyalty_3_5_level_4_desc: "[FROM.GetName]의 충성도가 낮지만, 더 감소하면 §Rrisk a revolt§!가 발생할 위험이 있습니다. 그들의 충성도가 증가하면 제국에 더욱 통합할 더 나은 기회를 얻을 수 있습니다!\n\n[FROM.GetName]의 자율성이 낮아지면, 우리는 그들에게 제재를 가하여 §GRegional Authority§!로 만들 수 있습니다. 이는 그들의 §CLoyalty§!를 상당히 §Olikely reduce§!할 것이지만, 그 대가로 그들은 더 이상 우리의 전쟁 참전 요청을 거부할 수 없으며 우리는 그들의 영토 내에 건물을 지을 수 있습니다."
 afr_empire_politics_annex_subject_decision_loyalty_6_8_level_4: "[FROM.GetName] 진압 §Y(§!§WLoyalty:§! §G[?THIS.afr_empire_subject_loyalty_var@ROOT]§!§Y)§!"
 afr_empire_politics_annex_subject_decision_loyalty_6_8_level_4_desc: "[FROM.GetName]의 충성도가 높게 유지되는 동안, 당분간 §Gno risk of a revolt§!가 발생할 위험은 없습니다.\n\n[FROM.GetName]의 자율성이 낮아지면, 우리는 그들에게 제재를 가하여 §GRegional Authority§!로 만들 수 있습니다. 이는 그들의 §CLoyalty§!를 상당히 §Olikely reduce§!할 것이지만, 그 대가로 그들은 더 이상 우리의 전쟁 참전 요청을 거부할 수 없으며 우리는 그들의 영토 내에 건물을 지을 수 있습니다."
 afr_empire_politics_annex_subject_decision_loyalty_9_10_level_4: "[FROM.GetName] 진압 §Y(§!§WLoyalty:§! §C[?THIS.afr_empire_subject_loyalty_var@ROOT]§!§Y)§!"
 afr_empire_politics_annex_subject_decision_loyalty_9_10_level_4_desc: "[FROM.GetName]의 충성도가 높게 유지되는 동안, 당분간 §Gno risk of a revolt§!가 발생할 위험은 없습니다.\n\n[FROM.GetName]의 §Gautonomy가 낮아지면§!, 우리는 그들에게 제재를 가하여 §GRegional Authority§!로 만들 수 있습니다. 이는 그들의 §CLoyalty§!를 상당히 §Olikely reduce§!할 것이지만, 그 대가로 그들은 더 이상 우리의 전쟁 참전 요청을 거부할 수 없으며 우리는 그들의 영토 내에 건물을 지을 수 있습니다."

 afr_empire_politics_annex_subject_decision_loyalty_0_2_level_3: "[FROM.GetName] 신하화 §Y(§!§WLoyalty:§! §R[?FROM.afr_empire_subject_loyalty_var@ROOT]§!§Y)§!"
 afr_empire_politics_annex_subject_decision_loyalty_0_2_level_3_desc: "[FROM.GetName]의 우리에 대한 충성도는 위험할 정도로 낮습니다. 그들의 충성도를 높이기 위해 아무것도 하지 않는다면, 그들은 독립을 위한 §Rstart a revolt§!를 시작할 수 있습니다.\n\n우리는 [FROM.GetName]의 지역 권한을 제한하여 그들을 §GAutonomous Vassal§!로 만들 것입니다. 이는 그들의 우리에 대한 §CLoyalty§!를 §Rreduce§!할 것이지만, 그 대가로 우리는 그들의 마을에서 전사를 징집할 수 있고, 무역 가격을 인하하며, 전쟁 선포 능력을 제거할 수 있습니다."
 afr_empire_politics_annex_subject_decision_loyalty_3_5_level_3: "[FROM.GetName] 신하화 §Y(§!§WLoyalty:§! §O[?FROM.afr_empire_subject_loyalty_var@ROOT]§!§Y)§!"
