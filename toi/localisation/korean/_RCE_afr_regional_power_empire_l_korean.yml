 afr_regional_power_empire_politics_wiki_desc: "[ROOT.GetLeader]은(는) 자신의 제국을 어떻게 관리해야 하는지 이해해야 합니다!\n\n§YHelpful Information:§!\n§WThis decision will bring up a wiki that will explain how the Empire Politics will mechanics work.§!"

 afr_empire_politics_wiki_return_to_main_menu.1.c: "제국 정치 위키 (1페이지)"
 afr_empire_politics_wiki_menu_closed.1.d: "위키 메뉴 닫기"

 afr_empire_politics_wiki_main_menu.1.t: "제국 정치 위키 (1페이지)"
 afr_empire_politics_wiki_main_menu.1.desc: "§B(§!§bWhat is Empire Politics?§!§B)§!\n제국 정치는 플레이어가 모든 수준에서 정치에 완전히 참여할 수 있도록 하는 메커니즘입니다.\n\n§B(§!§bDo I have to engage with the Text RPG elements?§!§B)§!\n간단히 말해, 아닙니다. 플레이어는 'Macro Management' 결정을 활용하여 주 관리 메뉴를 사용할 필요성을 우회할 수 있습니다. 그러나 사치품, 주 핵심화, 계엄령은 현재 'Macro Management' 결정을 가지고 있지 않으므로 이러한 메뉴를 탐색하는 것이 가장 좋습니다.""
 afr_empire_politics_wiki_main_menu.1.a: "위키 페이지: §YState Autonomy§!"
 afr_empire_politics_wiki_main_menu.1.b: "위키 페이지: §YState Loyalty§!"
 afr_empire_politics_wiki_main_menu.1.c: "제국 정치 위키 (2페이지)"

 afr_empire_politics_wiki_main_menu.2.t: "제국 정치 위키 (2페이지)"
 afr_empire_politics_wiki_main_menu.2.desc: "§B(§!§bWhat is Empire Politics?§!§B)§!\n제국 정치는 플레이어가 모든 수준에서 정치에 완전히 참여할 수 있도록 하는 메커니즘입니다.\n\n§B(§!§bDo I have to engage with the Text RPG elements?§!§B)§!\n간단히 말해, 아닙니다. 플레이어는 '거시 관리' 결정을 활용하여 주 관리 메뉴를 사용할 필요성을 우회할 수 있습니다. 그러나 사치품, 주 핵심화, 계엄령은 현재 '거시 관리' 결정을 가지고 있지 않으므로 이러한 메뉴를 탐색하는 것이 가장 좋습니다."
 afr_empire_politics_wiki_main_menu.2.a: "위키 페이지: §YPublic Opinion§!"
 afr_empire_politics_wiki_main_menu.2.b: "위키 페이지: §YState Economy§!"
 afr_empire_politics_wiki_main_menu.2.c: "제국 정치 위키 (1페이지)"

 afr_empire_politics_wiki_menu_autonomy.1.t: "주 자율성 위키"
 afr_empire_politics_wiki_menu_autonomy.1.desc: "§B(§!§bState Autonomy§!§B)§!\n이는 주가 우리 제국 내에서 얼마나 자율적인지를 측정하며, 자율성이 100%가 되면 주는 신하국이 되기를 요청할 것입니다. 자율성이 50% 미만이면 모든 부정적인 자원 또는 징집 수정자가 제거됩니다.\n\n§B(§!§bEmpire Rule: Decentralized§!§B)§!\n분권화된 제국 통치는 해당 국가가 특정 주에 대한 통치권이 제한적임을 의미합니다. 분권화된 제국 통치를 받는 주는 최소 자율성 상한이 75%입니다. 따라서 해당 주에서 분권화된 제국 통치가 제거될 때까지 분권화된 주의 자율성을 75% 미만으로 줄이려는 모든 노력은 불가능합니다.\n\n§B(§!§bMartial Law§!§B)§!\n주의 자율성이 치명적으로 높아지면 해당 주에 '계엄령'을 활성화할 수 있습니다. 계엄령을 활성화하면 해당 주의 여론이 감소하지만, 절대적으로 필요할 때 사용하십시오."

 afr_empire_politics_wiki_menu_loyalty.1.t: "주 충성도 위키"
 afr_empire_politics_wiki_menu_loyalty.1.desc: "§B(§!§bState Loyalty§!§B)§!\n이는 주가 우리 제국에 얼마나 충성하는지를 측정합니다. 주의 충성도가 0 미만으로 떨어지면 우리에게 반란을 일으킬 것입니다. 주의 충성도가 높으면 비핵심 주 및 핵심 주에 더 나은 징집률을 제공합니다. 또한 충성도가 높으면 순응도 및 저항 수정자가 긍정적이고, 충성도가 낮으면 부정적입니다.\n\n§B(§!§bState Coring§!§B)§!\n비핵심 주의 충성도가 10에 도달하면, 360일 동안 최소 9단계 충성도를 유지함으로써 핵심 주가 될 수 있는 옵션을 가집니다."

 afr_empire_politics_wiki_menu_public_opinion.1.t: "여론 위키"
 afr_empire_politics_wiki_menu_public_opinion.1.desc: "§B(§!§bPublic Opinion§!§B)§!\n여론은 무엇이냐에 따라 각 주의 충성도를 월별로 변경합니다. 여론은 세법, 이벤트, 경제 상태, 주 관리 선택 등에 의해 수정될 수 있습니다. 여론에 대한 모든 수정자는 표시됩니다.\n\n고조된 여론은 충성도를 1만큼 §!§Gincrease§!시킵니다.\n행복한 여론은 충성도를 0.5만큼 §Gincrease§!시킵니다.\n만족스러운 여론은 충성도를 변경하지 않습니다.\n불만스러운 여론은 충성도를 0.5만큼 §Rdecrease§!시킵니다.\n불행한 여론은 충성도를 1만큼 §Rdecrease§!시킵니다."

 afr_empire_politics_wiki_menu_economy.1.t: "주 경제 위키"
 afr_empire_politics_wiki_menu_economy.1.desc: "§B(§!§bEconomic Status§!§B)§!\n다양한 경제 효과는 주의 자원, 인구, 충성도 및 번영에 영향을 미칠 것입니다. 이것들은 일시적이며 시간이 지나면 사라집니다.\n\n§B(§!§bLuxary Goods§!§B)§!\n사치품은 업그레이드될 때 번영을 생산할 수 있는 특별한 예금입니다. 모든 주에 사치품 예금이 있는 것은 아닙니다."
 state_levy_cavalry: "징집 기병"
 afr_call_all_warrior_types_tooltip: "[ROOT.GetAdjective] 제국의 §YPre-Industrial Army§!가 전투에 §Gcalled§!됩니다!"

 afr_empire_state_loyalty_full_core_idea: "제국의 핵심 설립"
afr_empire_state_loyalty_full_core_idea_tooltip: "§LWhen a state's loyalty is maxed it gains the possibility to become a core of an empire. Though during the establishment process, loyalty must be kept high and be fully controlled for an entire year.§!\n\n§YCoring Will Fail Upon:§!\n§W Loses full control of state\n  -Loses ownership of state\n  -State Loyalty drops below 9§!\n\n§YEffects Upon Success:§!\nEmpire gains a core on state."

