 afr_empire_politics_local_rumor_noble_true_loc_1: "귀족은 현지인들이 제공한 모든 묘사와 일치하며 소문이 전한 것보다 훨씬 뛰어난 카리스마를 보여주었습니다! 부족 간의 분쟁을 해결한다는 소문은 사실로 판명되었습니다! 이 귀족은 틀림없이 우리 제국의 많은 부족 간의 단합을 유지하는 외교적 전문성을 가지고 있습니다."
 afr_empire_politics_local_rumor_noble_true_loc_2: "귀족은 현지인들이 제공한 대부분의 묘사와 일치하지만, 다행히도 귀족의 카리스마는 소문이 전한 것과 거의 비슷합니다."
 afr_empire_politics_local_rumor_noble_true_loc_3: "귀족은 현지인들이 제공한 일부 묘사와 일치하지만, 불행히도 귀족의 카리스마는 소문이 말한 것만큼 좋지 않습니다."

 afr_empire_politics_local_rumor_merchant_title_1_true: "떠돌이 상인에 대한 소문이 사실입니다!"
 afr_empire_politics_local_rumor_merchant_desc_1_true: "몇 달간의 수색 끝에 소문에 맞는 상인을 찾았습니다!"
 afr_empire_politics_local_rumor_merchant_accept_1_true: "이 상인을 제국의 고문으로 영입하십시오!"
 afr_empire_politics_local_rumor_merchant_decline_1_true: "다시 생각해보니, 그들을 고문으로 만들지 않는 것이 좋겠습니다."
 afr_empire_politics_local_rumor_merchant_title_1_false: "떠돌이 상인에 대한 소문은 거짓입니다!"
 afr_empire_politics_local_rumor_merchant_desc_1_false: "몇 달간의 수색 끝에도 이 소문의 상인에 대한 흔적은 없습니다."
 afr_empire_politics_local_rumor_merchant_leave_1_false: "시간 낭비였군!"
 afr_empire_politics_local_rumor_merchant_true_loc_1: "상인은 현지인들이 제공한 모든 묘사와 일치하며 소문을 훨씬 뛰어넘는 발명품을 보여주었습니다! 이 상인의 전문 지식은 현지 관리들이 도시의 산업화에 도움이 될 외국 발명품을 발견하는 데 도움이 될 것입니다!"
 afr_empire_politics_local_rumor_merchant_true_loc_2: "상인은 현지인들이 제공한 대부분의 묘사와 일치하지만, 다행히도 상인의 발명품은 소문만큼 좋습니다."
 afr_empire_politics_local_rumor_merchant_true_loc_3: "상인은 현지인들이 제공한 일부 묘사와 일치하지만, 불행히도 상인의 발명품은 소문만큼 좋지 않습니다."

