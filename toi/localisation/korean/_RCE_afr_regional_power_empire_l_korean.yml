 afr_empire_politics_successful_raid_event.2.t: "[FROM.FROM.GetName]에게 마을 약탈!"
 afr_empire_politics_successful_raid_event.2.d: "[ROOT.anti_scope_leak_scripted][FROM.afr_empire_politics_state_category_scripted]이(가) [ROOT.anti_scope_leak_scripted][FROM.GetName]에서 약탈당했습니다! 지원 없이는 경제를 회복하는 데 시간이 걸릴 것입니다. 이 특정 약탈 결과는 [ROOT.anti_scope_leak_scripted][FROM.afr_empire_politics_state_category_scripted] 내에서 생산되는 [ROOT.anti_scope_leak_scripted][FROM.afr_empire_politics_state_export_scripted]과 해당 지역 내 자원에서 수집되는 [ROOT.anti_scope_leak_scripted][FROM.afr_empire_politics_state_resource_scripted]에 영향을 미쳤습니다."
 afr_empire_politics_successful_raid_event.2.a: "우리는 그들의 회복을 도울 번영이 없습니다."
 afr_empire_politics_successful_raid_event.2.b: "약탈로부터 그들이 회복하도록 도우십시오!"
 afr_empire_politics_successful_raid_event.2.c: "그들이 회복하도록 돕고 투자를 계속하십시오!"

