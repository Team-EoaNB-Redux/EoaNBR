 ARMY_EXPERIENCE_DESC: "장비가 전투에서 사용될수록 육군 경험치를 얻습니다. 즉, §H사단§!이 전투에 참여하거나 아군에게 장비를 §HLend-Leased§!하여 전쟁에 참여할 때 육군 경험치를 얻을 수 있습니다.\n또한 최소 $UNIT_TRAINING_LEVEL|Y$ 레벨의 병력으로 훈련을 수행하거나 특정 §H국가 중점§!을 통해서도 경험치를 얻습니다. 일부 §H장관§!은 획득 경험치를 늘릴 수 있습니다.\n\n육군 경험치는 §H사단 템플릿§!을 생성하고 수정하는 데 필요합니다."
