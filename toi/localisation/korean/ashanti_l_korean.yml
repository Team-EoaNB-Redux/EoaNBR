l_english:
 ASH_the_golden_stool: "황금 의자"
 ASH_the_golden_stool_desc: "아샨티 제국은 황금, 코코아 콩, 상아, 귀중한 보석과 같은 사치품으로 넘쳐나며, 그 무역은 황금 의자에 앉은 왕, 아산테헤네가 통제합니다."
 ASH_imperial_economy: "제국 경제"
 ASH_imperial_economy_desc: "이 변화하는 시대에 우리의 통치를 확고히 하려면 경제를 확장해야 합니다."
 ASH_ashanti_gold: "아샨티 금"
 ASH_ashanti_gold_desc: "금은 항상 우리에게 중요했습니다. 그것은 물질적 가치뿐만 아니라 우리에게 영적인 의미도 지니고 있습니다."
 ASH_chirano_gold_deposit: "치라노 금광"
 ASH_chirano_gold_deposit_desc: "우리는 우리의 신성한 땅에 있는 가장 큰 금광에서 금을 발굴하기 시작할 것입니다. 그러나 그렇게 하려면 가장 강한 남자들이 필요할 것입니다."
 ASH_mines_in_bono: "보노의 광산"
 ASH_mines_in_bono_desc: "우리는 보노 지역에 더 많은 금광을 건설할 것입니다."
 ASH_mines_in_ahafo: "아하포의 광산"
 ASH_mines_in_ahafo_desc: "우리는 아하포 지역에 더 많은 금광을 건설할 것입니다."
 ASH_adress_the_slavery: "노예제의 전통"
 ASH_adress_the_slavery_desc: "영국이 우리에게 노예 노동 사용을 중단하도록 요구하지만, 우리는 우리의 전통을 거부해서는 안 됩니다."
