l_english:
 ZAN_regined_in: "§Y[ZAN.GetNameDef]§!은(는) 더 이상 §Y[Root.GetName]§!으로부터 독립할 수 없습니다!"
 ZAN_regined_in_tfv: "§Y[ZAN.GetNameDef]§!은(는) §Y[Root.GetNameDef]§!의 식민지가 됩니다!\n§Y[ZAN.GetNameDef]§!은(는) 더 이상 §Y[Root.GetName]§!으로부터 독립할 수 없습니다!"
 OMA_abanoned_colonial_empire: "§YOman§!은(는) §YColonial Empire§!을 포기하지 않았습니다!"
 accepted_OMA_lordship: "오만 지배권 수락"
 arab_events.1.t: "[ZAN.GetNameDef] 문제"
 arab_events.1.d: "1856년 우리 아버지의 죽음 이래로, 1857년 초 영국 지배 이후 우리나라는 [OMA.GetNameDef]의 중심지와 [ZAN.GetNameDef] 사이로 분할되었습니다. 그러나 [ZAN.GetLeader.GetName]은(는) 이미 계약을 어기기 시작했습니다. 우리의 대응은 무엇입니까?"
 arab_events.1.a: "자율성 축소 요구"
 arab_events.1.b: "종속 대신 동맹 제안"
 arab_events.1.c: "아무것도 하지 않을 여유가 있습니다"
 arab_events.2.t: "[From.GetName]이(가) 우리에게 복종을 요구합니다"
 arab_events.2.d: "[From.GetName]에 있는 우리 형제로부터 전령이 도착하여 우리의 완전한 복종을 요구하고 있습니다. 어떻게 대응해야 합니까?"
 arab_events.2.a: "복종"
 arab_events.2.b: "독립 선언"
 arab_events.4.t: "§YSayyid Majid bin Sa'id§!의 복종"
 arab_events.4.d: "§Y[From.GetName]§!로부터 우리 형제를 태운 거대한 행렬이 도착했습니다. 그는 공개적으로 우리와 우리 후손 모두에게 충성을 맹세했습니다. 이것은 우리의 아프리카 영토에 대한 통제권을 되찾게 했습니다."
 arab_events.4.a: "그는 이치를 깨달았습니다"
 arab_events.5.t: "[From.GetNameDef]이(가) 독립을 선언합니다"
 arab_events.5.d: "우리의 오랜 자율적인 속국 [From.GetNameDef]이(가) 우리에게 조공을 바치는 것을 중단했습니다. 이에 대한 우리의 반응은 무엇입니까?"
 arab_events.5.a: "우리의 의지를 관철하라, 전쟁이다!"
 arab_events.5.b: "그들을 가게 해야 합니다"
 arab_events.7.t: "[OMA.GetName]이(가) 식민지 영토 재탈환 의사를 선언합니다"
 arab_events.7.d: "수년 동안 [OMA.GetName]은(는) 쇠퇴하여 우리의 식민지인 [TCS.GetNameDef]를 포함한 많은 식민지를 잃었고, [ZAN.GetNameDef]에 대한 통제력도 서서히 약화되었습니다. 그러나 놀라운 반전으로 [OMA.GetNameDef] 정부는 [ZAN.GetNameDef]에 대한 통제력을 되찾았고, 잃어버린 땅을 재탈환할 의사를 선언했습니다."
 arab_events.7.a: "[TCS.GetNameDef]에 접근하지 말라는 경고를 보내십시오"
 arab_events.7.b: "지금은 인도가 우리의 관심을 요구합니다"
 arab_events.8.t: "[ENG.GetName]이(가) 경고를 발합니다"
 arab_events.8.d: "[ENG.GetName]의 외교관이 우리에게 [TCS.GetName]에서 떨어져 있으라고 경고합니다"
 arab_events.8.a: "알겠습니다"
 arab_events.9.t: "옛 아라비아 영토에 대한 식민 정책"
 arab_events.9.d: "아라비아에 있는 우리 영토 대부분은 [ENG.GetNameDef]의 통제하에 있습니다. 그곳에 대한 우리의 주장을 어떻게 접근하시겠습니까?"
 arab_events.9.a: "우리의 주장 유지"
 arab_events.9.b: "[TCS.GetNameDef] 영토 반환 요구"
 arab_events.9.c: "[TCS.GetNameDef]은(는) 우리에게 잃었습니다"
 arab_events.10.t: "[OMA.GetName]이(가) [TCS.GetName]을(를) 요구합니다"
 arab_events.10.d: "부흥하는 [OMA.GetNameDef]에서 외교관이 도착하여 트루셜 주(Trucial States)의 반환을 요구했습니다. [OMA.GetName]은(는) 작을 수 있지만, 그들의 해군이 인도에서 평화를 유지하는 우리 군대에 보급품이 도착하는 것을 막을 수 있습니다."
 arab_events.10.b: "그 땅을 돌려주십시오. 어차피 쓸모없습니다."
 arab_events.10.a: "거부"
 arab_events.11.t: "옛 페르시아 영토에 대한 식민 정책"
 arab_events.11.d: "페르시아에 있는 우리 영토 대부분은 [PER.GetNameDef]의 점령하에 있습니다. 그 지역에 대한 우리의 주장에 어떻게 접근하시겠습니까?"
 arab_events.11.a: "우리의 주장 유지"
 arab_events.11.b: "라리스탄 반환 요구"
 arab_events.11.c: "우리 페르시아 영토는 우리에게 잃었습니다"
 arab_events.12.t: "오만이 라리스탄을 요구합니다"
 arab_events.12.d: "오만은 오랫동안 라리스탄 해안선을 통제해 왔습니다. 이제 대사를 보내 라리스탄을 그들의 세력권에 넘기는 대가로 지불을 요구하고 있습니다."
 arab_events.12.a: "거부"
 arab_events.12.b: "넘겨주십시오"
 arab_events.18.t: "[559.GetName]에 우리의 의지를 관철할 것입니까?"
 arab_events.18.a: "위험을 감수하지 말고, 병력을 투입하십시오"
 arab_events.18.b: "주의 반환 요구"
 arab_events.18.c: "속국화 요구"
 arab_events.18.d: "[559.GetName] 내 통치자들은 오랫동안 우리에게 조공을 바쳐왔지만, 이제는 그 지역에 대한 우리의 지배력을 강화할 때입니다. 어떻게 진행해야 할까요?"
 arab_events.19.t: "오만이 복종을 요구합니다"
 arab_events.19.d: "[OMA.GetName] 술탄으로부터 전령이 도착하여 우리가 그들의 보호국으로 돌아오라고 요구하고 있습니다. 우리의 응답은 무엇이 되어야 할까요?"
 arab_events.19.a: "동의"
 arab_events.19.b: "거절"
 arab_events.21.t: "[821.GetName]에 우리의 의지를 관철할 것입니까?"
 arab_events.21.a: "위험을 감수하지 말고, 병력을 투입하십시오"
 arab_events.21.b: "주의 반환 요구"
 arab_events.21.c: "속국화 요구"
 arab_events.21.d: "[821.GetName] 내 통치자들은 오랫동안 우리에게 조공을 바쳐왔지만, 이제는 그 지역에 대한 우리의 지배력을 강화할 때입니다. 어떻게 진행해야 할까요?"
 arab_events.23.t: "[ENG.GetName]에 대한 우리의 입장?"
 arab_events.23.a: "우호적인 관계 유지"
 arab_events.23.b: "중립이 되기"
 arab_events.23.c: "우리의 관계 단절"
 arab_events.24.t: "우리 국가의 길"
 arab_events.24.a: "완전한 현대화 목표"
 arab_events.24.b: "최고의 아이디어만 채택"
 arab_events.24.c: "우리의 방식이 최고입니다"
 arab_events.25.t: "소말리아 건국"
 arab_events.25.desc: "이제 소말리아를 어떻게 통치할지 결정할 때가 왔습니다"
 arab_events.25.a: "우리 형제가 잘 해낼 것입니다"
 arab_events.25.b: "[MAJ.GetName]의 통치자가 그 일에 적합합니다"
 arab_events.25.c: "[GLD.GetName]의 통치자가 그 일에 적합합니다"
 arab_events.25.d: "분할된 상태로 남을 것입니다"
 arab_events.26.t: "[OMA.GetNameDef]이(가) 우리의 복종을 요구합니다"
 arab_events.27.t: "인도의 선택"
 arab_events.27.a: "[SRS.GetName]을(를) 선택"
 arab_events.27.b: "[RAJ.GetName]을(를) 선택"
 arab_events.27.d: "세포이 반란군이 독립 전쟁에서 승리했으므로 이제 어느 인도와 거래할지 선택해야 합니다. 우리가 선택하는 인도는 다른 인도와의 적대감을 증가시킬 것입니다."
 arab_events.28.t: "[OMA.GetNameDef]이(가) 더 저렴한 무역을 제안합니다"
 arab_events.28.d: "오만 정부는 유럽과의 무역을 위한 더 저렴한 무역과 발전된 중간 기착지를 제안하는 무역 사절단을 보냈습니다."
 arab_events.28.a: "동의함"
 arab_events.28.b: "거부"
 arab_events.29.t: "우리의 외교 정책 확정"
 arab_events.29.d: "이제 우리 국가가 세계와 어떻게 상호 작용할지 확정할 때입니다."
 arab_events.29.a: "우리 지역에 대한 영향력 추구"
 arab_events.29.b: "수출에 집중"
 arab_events.29.c: "현재 상태 유지"
 arab_events.29.e: "단절"
 arab_events.31.t: "[OMA.GetName]이(가) 우리의 합병을 요구합니다"
 arab_events.31.d: "[OMA.GetName]은(는) 부상하는 지역 강대국이 되어 많은 식민지 영토를 되찾았습니다. 이제 [OMA.GetNameDef] 외교관들은 우리를 주시하며 우리를 [OMA.GetNameDef] 행정부에 통합할 것을 요구하고 있습니다."
 arab_events.31.a: "수락"
 arab_events.31.b: "거부"
 arab_events.32.t: "[OMA.GetName]의 [MAH.GetName] 개입"
 arab_events.32.d: "[MAH.GetName]은(는) 한때 우리의 영향력 아래 있었지만, 이제 우리는 활력을 되찾아 우리 지역의 위대한 식민 국가가 되었습니다. [MAH.GetName]의 하찮은 술탄들에게 우리의 의지를 관철할 때입니다."
 arab_events.32.a: "외교적 수단 사용"
 arab_events.32.b: "군사적 수단 사용"
 arab_events.33.t: "[MAH.GetName]에 대한 [OMA.GetName]의 승리"
 arab_events.33.d: "우리는 전쟁에서 승리했으며, 우리 군대는 사이드 가문을 위해 [1196.GetName]을(를) 완전히 확보했습니다."
 arab_events.33.a: "훌륭함"
 arab_events.34.t: "[OMA.GetName]에 대한 [MAH.GetName]의 승리"
 arab_events.34.d: "우리는 패배했습니다. [MAH.GetName] 술탄은 스스로 능력을 증명했으며 영국인들에게 의존할 가능성이 높습니다. 우리는 §YHadhramaut§!를 장악할 기회를 잃었으며, 우리의 속국들 사이에서 우리의 입지는 더욱 불안정해졌습니다."
 arab_events.34.da: "우리는 [OMA.GetName] 군대를 물리치고 우리의 가치를 증명했습니다. 그러나 그들의 군대가 더 많은 수로 돌아올 수 있으니, 영국인들에게 도움을 청해야 합니다."
 arab_events.34.a: "굴욕을 받아들여야 합니다"
 arab_events.34.b: "영국인들에게 의존합시다"
 arab_events.34.c: "우리는 독립해야 더 강해집니다"
 arab_events.41.t: "아덴, 통합 제안"
 arab_events.41.d: "영국인들이 다른 세력으로부터의 보호를 제안하며 우리에게 사절을 보냈습니다. 동의해야 할까요?"
 arab_events.41.a: "수락"
 arab_events.41.b: "거부"
 arab_events.44.t: "투와이니의 죽음"
 arab_events.44.d: "투와이니 빈 사이드는 3일간의 투병 끝에 오늘 아침 사망했습니다. 그의 아들이 무스카트의 새로운 술탄이자 오만의 이맘으로 즉위했습니다."
 arab_events.44.a: "살림 폐하 만수무강하시옵소서"
 arab_events.45.t: "오만 이맘국 분쟁"
 arab_events.45.d: "우리 처남인 아잔 빈 카이스가 불만을 품은 오만 부족민들에 의해 오만의 이맘으로 선포되었으며, 수도를 향해 진군할 준비를 하고 있습니다."
 arab_events.45.a: "아잔을 우리 휘하의 오만 이맘으로 인정"
 arab_events.45.b: "이를 저지하십시오"
 arab_events.46.t: "아잔의 답변"
 arab_events.46.d: "아잔은 제안을 거부했습니다"
 arab_events.46.da: "아잔은 우리의 제안에 동의했습니다"
 arab_events.46.db: "버그입니다. 신고하십시오."
 arab_events.47.t: "오만-무스카트 전쟁"
 arab_events.47.d: "아잔은 무스카트 수도를 향해 동진하며, 이 공격적인 행동의 결과는 우리의 과거 행동에 의해 결정될 것입니다."
 arab_events.47.a: "알겠습니다"
 arab_events.48.t: "강대국의 선택"
 arab_events.48.d: ""
 arab_events.48.a: "영국을 지지"
 arab_events.48.b: "프랑스를 지지"
 arab_events.48.c: "우리는 홀로 설 것입니다"
 arab_events.49.t: "오만이 원조를 요청합니다"
 arab_events.49.d: "현재 무스카트와 오만의 술탄인 살림 빈 투와이니의 사절들이 도착하여 오만 계승권 주장자에 맞서 원조를 요청하며, 우리를 위한 특혜 무역을 포함한 거래를 제안했습니다."
 arab_events.49.da: "현재 무스카트와 오만의 술탄인 살림 빈 투와이니의 사절들이 도착하여 오만 계승권 주장자에 맞서 원조를 요청하며, 우리를 위한 특혜 무역을 포함한 거래를 제안했습니다. 이것은 그들을 [ENG.GetName]의 세력권에서 빼앗을 기회입니다."
 arab_events.49.a: "거래에 동의"
 arab_events.49.b: "더 많은 것을 요구"
 arab_events.49.c: "그들을 무시"
 arab_events.50.t: "무스카트 수비대의 확장"
 arab_events.50.d: ""
 arab_events.50.a: "방어 시설을 대폭 확장"
 arab_events.50.b: "병력을 더 배치"
 arab_events.50.c: "구멍만 메우십시오"
 arab_events.51.t: "물라이다 전투"
 arab_events.51.d: "오랜 라이벌인 네지드의 사우디 가문이 마침내 우리가 그들을 분쇄할 수 있을 만큼 약해졌습니다. 남쪽으로 진군하여 그들이 수도라고 부르는 메마른 평원을 점령합시다."
 arab_events.51.a: "공격"
 arab_events.51.b: "우리는 충분한 지원이 없습니다"
 arab_events.52.t: "라시드의 승리"
 arab_events.52.d: "물라이다 전투는 며칠 동안 맹렬하게 진행되었지만, 오늘 사우디 수비대들이 마침내 무너졌고 많은 사우디인들이 [KUW.GetName]으로 도주하거나 룹알할리 사막으로 녹아들었으며, 라시드군이 리야드 수도를 점령할 수 있었습니다."
 arab_events.52.a: "알겠습니다"
 arab_events.53.t: "사우드의 승리"
 arab_events.53.d: "물라이다 전투는 며칠 동안 맹렬하게 진행되었지만, 오늘 사우디 수비대들이 공격하는 라시드군을 마침내 격퇴했습니다. 많은 라시드인들이 [KUW.GetName]으로 도주하거나 알자우프로 녹아들었습니다."
 arab_events.53.a: "알겠습니다"
 arab_events.55.t: "파이살 빈 투르키 빈 압둘라 알 사우드가 사망했습니다"
 arab_events.55.a: "압둘라 이븐 파이살 이븐 투르키 알 사우드 폐하 만수무강하시옵소서"
