 OMA_mothballed_shipyards_desc: "오만 해군 포기 이후 무스카트의 조선소들은 수십 년 동안 잠들어 유휴 상태가 되었습니다."
 oma_vic_western_inspirations: "서구의 영감"
 oma_vic_western_inspirations_desc: "이제 서구의 관행을 통합하고 영감을 받을 때입니다. 통합을 시작합시다."
 oma_vic_western_question: "서구 문제"
 oma_vic_western_question_desc: "오랫동안 우리의 나라는 부유하고 번성했습니다. 그러나 무역 감소와 주요 무역 파트너인 인도의 영국 점령으로 인해 우리의 생활 방식이 하락했고, 이제 우리는 침범해오는 서구에 어떻게 대응할지 결정해야 합니다."
