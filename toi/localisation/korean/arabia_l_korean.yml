 OMA_steamships_for_personal_fleet: "개인 함대를 위해 §YMuscat§! 항구에 §G3§!척의 §YGunships§!를 창설하십시오!\n"
 ZAN_OMAtribute: "[OMA.GetNameDef] 조공 지급"
 oma_vic_reign_ZAN_in: "[ZAN.GetNameDef]을(를) 통치권 안에 두기"
 oma_vic_reign_ZAN_in_desc: "오랫동안 [ZAN.GetNameDef]은(는) 우리의 옆구리에 박힌 자율적인 가시였습니다. 이제 그들을 통치권 안으로 다시 데려와 우리의 의지를 그들에게 강요할 때입니다!"
 oma_vic_western_practises: "서구 관행"
 oma_vic_western_practises_desc: "서구 관행을 채택할 준비를 우리 나라에 시키십시오."
 OMA_indian_oman_trade: "인도-오만 무역"
 OMA_oman_indian_trade: "인도-오만 무역"
 oma_vic_begin_to_enforce_old_colonial_borders: "옛 식민지 국경 강제 시작"
 oma_vic_begin_to_enforce_old_colonial_borders_desc: "불과 몇십 년 전만 해도 우리의 깃발은 동아프리카 해안과 페르시아만 전역에 휘날렸습니다. 이제 [ZAN.GetName]에 대한 통제력을 강화했으니, 우리의 소유물을 다시 되찾을 안정성과 힘을 갖추었습니다."
 oma_vic_ZAN_expansion: "[ZAN.GetNameDef] 확장"
 oma_vic_ZAN_expansion_desc: "오랫동안 [ZAN.GetNameDef]은(는) 탄자니아의 해안 지역만을 통제해 왔습니다. 이제 내륙으로의 확장을 최우선 과제로 삼을 때입니다."
 oma_vic_KEN_expeditions: "케냐 원정대"
 oma_vic_KEN_expeditions_desc: "오랫동안 몸바사는 [ZAN.GetNameDef]의 일부였습니다. 이제 우리의 성장하는 제국의 일부가 되었으니, 케냐의 심장부로 원정대를 보내 이 지역에 대한 우리의 통제권을 확립할 때입니다."
 oma_vic_remind_SOM_of_place: "소말리아에게 그들의 위치를 상기시키십시오"
 oma_vic_remind_SOM_of_place_desc: "우리 할아버지 때부터 소말리아 부족들은 우리의 속국이었습니다. 이제 그들이 다시 그렇게 될 때이며, 어쩌면 이번에는 더 많은 것을 기대할 수도 있습니다."
 oma_vic_ZAN_industrialisation_desc: "이제 우리의 식민지 [ZAN.GetNameDef]이(가) 완전히 설립되었으니, 그들의 국가를 우리의 발전 수준으로 끌어올릴 때입니다."
 oma_vic_ZAN_industrialisation: "잔지바르의 산업화"
 oma_vic_ZAN_industrialisation_tooltip: "§Y[ZAN.GetName]§!은(는) §GLoans§!를 활용하여 그들의 §GIndustrialization§!에 자금을 조달할 수 있습니다."
 oma_vic_MOM_industrialisation_desc: "이제 우리의 식민지 [MOM.GetNameDef]이(가) 완전히 설립되었으니, 그들의 국가를 우리의 발전 수준으로 끌어올릴 때입니다."
 oma_vic_MOM_industrialisation: "[MOM.GetNameDef]의 산업화"
