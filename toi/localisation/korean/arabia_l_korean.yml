 arab_events.74.t: "영국-잔지바르 전쟁"
 arab_events.74.d: "8월 27일 9시 2분(현지 시간), 잔지바르의 새로 즉위한 술탄 할리드 빈 바르가시에게 [ENG.GetName]이(가) 선전포고를 했습니다.\n할리드는 영국이 제시한 잔지바르 승계 조건을 거부하고, 영국 최후통첩을 무시한 채 자신의 친위대를 소집하고 궁전을 바리케이드로 막았습니다.\n 이로 인해 잔지바르 측에서 세 척의 배가 침몰하고 약 500명의 사상자가 발생했습니다. 불운한 영국 수병 한 명은 부상을 입었지만 완전히 회복될 것으로 예상됩니다. 할리드가 항복하기까지 38분 동안 영국 함선들은 500발 이상의 포탄을 발사했습니다.\n영국 해군 관계자들은 이 모든 사건에 대해 매우 우쭐해하는 것처럼 보이며, 발사된 포탄에 대해 새 식민지에 벌금을 부과하는 데 바쁜 듯합니다."
 arab_events.74.a: "제국에 또 하나의 영광스러운 추가"
 arab_events.74.b: "설마 38분이 아니라 38시간을 말씀하신 것은 아니겠지요?"
