 arab_events.68.t: "히나위족의 지지 획득"
 arab_events.68.d: "오만의 남동부 부족인 히나위족은 큰 세력 기반을 가지고 있습니다. 우리는 그들이 아잔보다 우리를 지지하도록 설득해야 합니다."
 arab_events.68.a: "정부 내 자리를 제안"
 arab_events.68.b: "그들에게 부를 선물하십시오"
 arab_events.68.c: "그들에게 권력을 선물하십시오"
 arab_events.68.e: "그들을 위협하십시오"
 arab_events.69.t: "가피리족의 지지 획득"
 arab_events.69.d: "오만의 북서부 부족인 가피리족은 큰 세력 기반을 가지고 있습니다. 우리는 그들이 아잔보다 우리를 지지하도록 설득해야 합니다."
 arab_events.70.t: "전투 시작"
 arab_events.70.d: "아잔의 군대가 무스카트에 도착했습니다. 이제 이 지역의 운명을 건 전투가 시작되었습니다."
 arab_events.70.a: "드디어 시작되는군요"
 arab_events.71.t: "무스카트 전투의 결과"
 arab_events.71.d: "§RERROR§!. 이것은 버그입니다, 신고해주십시오"
 arab_events.71.da: "살림의 군대는 전투에서 패했고, 살림은 페르시아의 반다르-압바스 항구로 나라를 떠났습니다. 이제 아잔의 통치가 시작될 것입니다"
 arab_events.71.da2: "살림의 군대는 전투에서 패했고, 살림은 프랑스로 망명했습니다. 이제 아잔의 통치가 시작될 것입니다"
 arab_events.71.da1: "살림의 군대는 전투에서 패했고, 살림은 영국령 신드로 망명했습니다. 이제 아잔의 통치가 시작될 것입니다"
 arab_events.71.a: "아잔 폐하 만수무강하시옵소서"
 arab_events.71.b: "살림 폐하 만수무강하시옵소서"
 arab_events.71.c: "§RERROR§!"
 arab_events.72.t: "전장에서의 죽음"
 arab_events.72.ta: "폭탄이 궁전을 흔들다"
 arab_events.72.tb: "전염병이 무스카트를 덮치다"
 arab_events.72.da1: "아잔이 반란 부족민들을 상대로 벌인 작전 중, 그의 군대는 계승권 주장자인 투르키 빈 사이드가 이끄는 적대적인 집단과 조우했습니다. 전투 중 아잔은 쓰러졌고, 이제 투르키는 승리하여 수도로 진군하고 있습니다."
 arab_events.72.da2: "이맘과 술탄이 공동으로 주최한 국빈 만찬 중, 폭발물이 식당을 강타했습니다. 이후 살림과 아잔의 시신이 발견되었고, 살림의 숙부이자 상속인인 투르키 빈 사이드는 국가를 안정시키기 위해 두 직함을 모두 취했습니다. 누가 폭탄을 설치했는지에 대한 의혹이 난무합니다."
 arab_events.72.ds: "영국 외교관들의 국빈 방문 중, 수행원 중 한 명에 의해 무스카트로 유입된 단명하는 전염병이 도시에 퍼졌습니다. 살림은 불행히도 감염되었고, 오늘 새벽에 병세가 악화되어 사망했습니다. 그의 숙부 투르키 빈 사이드가 왕위를 계승했습니다."
 arab_events.72.a: "투르키 빈 사이드 폐하 만수무강하시옵소서"
 arab_events.73.t: "오만이 하드라마우트를 위협합니다"
 arab_events.73.d: "[OMA.GetNameDef]이(가) [MAH.GetName]을(를) 합병한 후, 하드라마우트의 다른 국가들은 우리의 보호를 열망하고 있습니다. 합병을 제안하는 사절을 보내야 할까요?"
 arab_events.73.a: "사절 파견"
 arab_events.73.b: "그럴 필요 없습니다"
 arab_events.76.t: "소코트라 문제"
 arab_events.76.d: "소코트라 섬은 우리의 본토와 동아프리카 식민지 사이의 완벽한 해군 기지입니다. 현재 어떤 강대국의 공식적인 주둔도 없으며, 이는 우리의 목적에 부합합니다."
 arab_events.76.a: "포함(砲艦)을 파견하십시오"
