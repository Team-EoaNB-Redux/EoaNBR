 oma_vic_our_colonial_strength: "우리의 식민지 강점"
 oma_vic_our_colonial_strength_desc: "우리의 식민지 강점"
 oma_vic_continue_isolation: "고립 유지"
 oma_vic_continue_isolation_desc: "우리의 식민지 시대는 끝났습니다. 고립 정책을 시작합시다."
 oma_vic_enforce_will_on_mahra: "마흐라에 의지 관철"
 oma_vic_enforce_will_on_mahra_desc: "우리는 역사적으로 마흐라 지역에 많은 영향력을 행사해 왔습니다. 이제 그들을 우리의 성장하는 제국에 통합합시다."
 oma_vic_demand_TCS: "[TCS.GetName] 요구"
