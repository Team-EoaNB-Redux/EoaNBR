 BRA_medical_school_reform_desc: "성모 자비 병원에서 일하는 의료 전문가 수를 늘리기 위한 목적으로, 이 법안은 의과대학 및 학부 법규의 보충 규정 제280조와 제292조를 수정하여 4학년, 5학년, 6학년 학생들이 인턴 공석 경쟁에서 승인된 후 의학을 실습할 수 있도록 합니다. 그리고 제국의 모든 성모 자비 병원에서 인턴으로 지정된 모든 기능을 수행할 수 있도록 합니다."
