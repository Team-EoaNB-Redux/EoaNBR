 coffee_economy_coal_mine: "커피 경제 자금 지원 탄광"
 BRA_trait_baron_of_maua: "마우아 남작"
 BRA_the_rise_of_the_empire: "제국의 부흥"
 BRA_the_rise_of_the_empire_desc: "섭정기의 여러 반란, 정치적 불안정, 그리고 부패가 우리 국가를 해쳤습니다. 우리 황제의 통치는 브라질을 다시 통일하고 안정시켜 번영을 이끌었습니다. 이 번영을 통해 우리는 세계 무대에서 강대국으로 부상할 것입니다!"
 BRA_deal_with_internal_matters: "내부 문제 처리"
 BRA_deal_with_internal_matters_desc: "우리의 외교 정책과 지정학적 입장이 중요할 수 있지만, 경제와 기반 시설의 국내 문제를 해결하는 것이 미래의 안정되고 번영하는 국가를 만드는 길일 수 있습니다."
 BRA_the_slave_trade_issue: "노예 무역 문제"
 BRA_the_slave_trade_issue_desc: "1850년부터 아프리카와 브라질 간의 대서양 횡단 노예 무역이 금지되었습니다. 이는 우리 경제의 일부에 심각한 해를 끼쳤으므로, 가능한 한 빨리 해결해야 합니다."
 BRA_start_interprovincial_slave_trade: "주 간 노예 무역 시작"
 BRA_start_interprovincial_slave_trade_desc: "일부 주에서는 농장과 공장에서 일할 자유 노동력이 부족하고, 미개발 자원은 내륙에서 매우 수익성이 높고 쉽게 찾을 수 있기 때문에, 우리는 그 지역으로 노동력을 보내고 자원을 추출하며 인구를 늘리기 시작해야 합니다."
 BRA_send_slaves_to_the_amazon: "아마존으로 노예를 보내기"
 BRA_send_slaves_to_the_amazon_desc: "아마존 숲은 추출할 자원이 많고 제국 경제에 큰 도움이 될 수 있는 미지의 경이로운 숲입니다. 그곳으로 노동력을 보냅시다."
 BRA_wood_extraction: "목재 추출"
 BRA_wood_extraction_desc: "이미 그 지역에서 많은 목재가 들어오고 있지만, 조금 더 들어와도 손해 볼 것은 없습니다."
 BRA_settle_the_amazon: "아마존에 정착하기"
 BRA_settle_the_amazon_desc: "아마존 열대우림과 그 안에 있는 작은 마을들을 개선해야 합니다. 낙후되고 무질서한 마을들의 기반 시설을 개선하고, 작은 비포장 도로를 연결하여 광산 작업과 자원 추출을 개선할 수 있습니다."
 BRA_send_slaves_to_the_west: "서부로 노예를 보내기"
 BRA_send_slaves_to_the_west_desc: "브라질 내륙은 자원을 착취하고 미래에 건설할 공장에서 일할 자유 노동력이 필요합니다."
 BRA_coal_and_steel_mining_in_the_west: "서부의 석탄 및 철강 채굴"
 BRA_coal_and_steel_mining_in_the_west_desc: "브라질 내륙에는 무역과 산업화에 도움이 될 다양한 종류의 귀금속, 유용한 광물, 그리고 석탄이 있습니다. 고이아스와 마투그로수는 탐험을 기다리는 귀중한 자원 지역입니다."
 BRA_develop_minas_gerais: "미나스 제라이스 개발"
 BRA_develop_minas_gerais_desc: "미나스 제라이스 주는 경제에 가장 중요한 광산의 이름을 따서 명명되었습니다. 그곳의 광물 탐사로 얻은 이익과 자원을 활용하여, 우리는 국고의 일부를 사용하여 지역 기반 시설과 도시를 개선할 수 있습니다."
 BRA_farms_in_goias: "고이아스의 농장"
 BRA_farms_in_goias_desc: "고이아스의 지형은 면화 농장 및 기타 농업 활동에 유용할 수 있습니다."
 BRA_restore_the_slavery_economy: "노예 경제 복원"
 BRA_restore_the_slavery_economy_desc: "우리의 경제가 새로운 제한으로 인해 타격을 입었지만, 이 새로운 개혁들을 통해 우리는 번영하는 국가를 위해 자유 노동 관행을 계속 유지할 수 있습니다."
 BRA_support_european_immigration: "유럽 이민 지원"
 BRA_support_european_immigration_desc: "대서양 횡단 노예 무역이 종료되면서, 남동부의 커피 농장들은 새로운 노동력을 절실히 필요로 합니다. 노예 노동력 공급이 고갈되기 시작하면서, 우리는 성장하는 경제를 강화하기 위해 국경 밖으로 눈을 돌려야 합니다. 다행히도, 우리나라는 유럽에서 온 많은 이민자들을 끌어들이기 시작했으며, 이들은 비교적 저렴한 임금 노동자로서 커피 농장에서 일자리를 찾을 수 있을 것입니다. 더 많은 이민자를 받기 위해 항구를 개방하는 것이 노동력 부족에 대한 해결책이 될 수 있습니다."
 BRA_portuguese_immigration: "포르투갈 이민"
 BRA_portuguese_immigration_desc: "1822년 포르투갈로부터 독립한 이후, 우리나라는 국경 내에 포르투갈 이민자들이 끊이지 않았으며, 이들은 브라질에서 가장 큰 비(非)브라질 민족 집단을 구성합니다. 더 많은 포르투갈인들을 환영하기 위해 새로운 숙소를 마련하는 것은 앞으로도 더 많은 이민자들이 오도록 보장할 것입니다."
 BRA_portuguese_communities: "포르투갈인 공동체"
 BRA_portuguese_communities_desc: "상파울루와 같은 남부 인구 중심지에 포르투갈인들이 유입되면서, 새로운 이민자들은 도시 내에 '카사스 데 포르투갈(Casas de Portugal)'이라는 상호 원조 단체를 만들기 시작했습니다. 이 단체는 배에서 내린 동료 이민자들이 집, 일, 그리고 사회적 관계를 찾도록 돕습니다. 이 새로운 공동체를 돕는 것은 더 많은 포르투갈 노동자들을 데려오려는 우리의 노력에 확실히 도움이 될 것입니다."
 BRA_land_for_immigrants: "이민자들을 위한 토지"
 BRA_land_for_immigrants_desc: "이제 상당수의 포르투갈인들이 우리 도시 상파울루에 거주하기 시작했으니, 포르투갈인들에게 커피 농장과 상점에서 봉사하는 대가로 더 넓은 토지를 제공하기 시작할 수 있습니다."
 BRA_german_immigration: "독일 이민"
 BRA_german_immigration_desc: "독일인들은 포르투갈인 외에 브라질로 오는 가장 큰 이민자 집단 중 하나입니다. 1824년부터 상당수의 독일인들이 리우그란데두술(Rio Grande do Sul)의 상레오폴두(São Leopoldo) 지역에 정착하기 시작했지만, 현재 그들의 수는 우리의 노동력 부족을 충족시키기에 충분하지 않습니다. 우리는 더 많은 독일인들이 우리나라로 오도록 장려해야 합니다."
 BRA_southern_german_communities: "남부 독일인 공동체"
 BRA_southern_german_communities_desc: "우리나라 남부 지역에서 독일 이민이 활발해지면서, 독일인들은 막 배에서 내린 동포들을 돕기 위해 작은 이민자 공동체를 형성하기 시작했습니다. 우리는 이러한 공동체 설립을 더 장려해야 합니다."
 BRA_develop_the_south: "남부 개발"
 BRA_develop_the_south_desc: "우리나라 남동부 지역은 독일 이민자들의 근면함으로 큰 혜택을 보고 있습니다. 그들의 도움으로 우리는 이 확장되는 지역을 더욱 발전시키기 위한 새로운 공공 사업 프로젝트를 시작할 수 있을 것입니다."
 BRA_southern_economic_innovation: "남부 경제 혁신"
 BRA_southern_economic_innovation_desc: "커피 붐과 새로운 노동력의 유입은 남부의 성장 잠재력을 크게 확장시켰습니다. 이 지역에 대한 추가 보조금은 그 수익성을 계속해서 확장시킬 것입니다."
 BRA_support_paid_labor: "유급 노동 지원"
 BRA_support_paid_labor_desc: "유럽 이민을 장려하는 우리의 프로그램은 엄청난 성공을 거두었으며, 우리 커피 농장들은 밭에서 일할 새로운 임금 노동자들의 존재로 다시 활기를 되찾고 있습니다. 우리나라로 쏟아져 들어오는 이민자들의 수가 계속 증가함에 따라, 우리는 노예에 대한 노동력 의존도를 점차 임금 노동자로 전환하는 것을 고려해야 할 때입니다."
 BRA_modernize_the_empire: "제국 현대화"
 BRA_modernize_the_empire_desc: "브라질 제국은 대부분 농촌 국가이지만, 변화에 반대하지 않습니다. 현대화는 제국 전역에서 장려되어야 합니다."
 BRA_the_coffee_boom: "커피 붐"
 BRA_the_coffee_boom_desc: "우리의 커피 생산이 시작되었고 현재 성공적입니다. 우리는 이를 활용하여 커피로 얻은 이익을 사용하여 새로운 도로와 훨씬 더 큰 도시로 우리 국가들을 도시화하고 연결해야 합니다."
 BRA_maua_bank_in_rio: "리우데자네이루 시의 마우아 은행"
 BRA_maua_bank_in_rio_desc: "이리네우 에반젤리스타 지 소우사가 설립한 마우아, 맥그리거 & 시아 은행은 브라질 제국이 인수했지만 이리네우가 설립한 주요 경쟁사인 방쿠 두 브라질을 상대로 성장했습니다. 마우아, 맥그리거 & 시아 은행의 성장은 브라질 경제를 강화합니다."
 BRA_maua_bank_in_montevideo: "몬테비데오의 마우아 은행"
 BRA_maua_bank_in_montevideo_desc: "브라질 수도에서 마우아, 맥그리거 & 시아 은행의 성공과 이익은 몬테비데오에 지점을 개설하게 했습니다."
 BRA_maua_bank_in_buenos_aires: "부에노스아이레스의 마우아 은행"
 BRA_maua_bank_in_buenos_aires_desc: "브라질 수도에서 마우아, 맥그리거 & 시아 은행의 성공과 이익은 부에노스아이레스에 지점을 개설하게 했습니다."
 BRA_urbanization_of_north_and_northeast: "북부 주 도시화"
 BRA_urbanization_of_north_and_northeast_desc: "북부 및 북동부 주의 도시화는 이 지역의 경제 발전을 위한 기회를 창출할 것입니다."
 BRA_urbanization_of_capital: "리우데자네이루 시 도시화"
 BRA_urbanization_of_capital_desc: "브라질 제국의 수도인 리우데자네이루 시의 도시화는 경제 발전을 위한 기회를 창출할 것입니다."
 BRA_urbanization_of_sao_paulo: "상파울루 도시화"
 BRA_urbanization_of_sao_paulo_desc: "상파울루는 현재의 커피 붐에서 나오는 우리 이익의 주요 원천입니다. 이 이익은 인프라를 개선하고 새로운 도로로 도시를 연결하는 데 재투자될 수 있습니다. 또한 남작들을 위한 은행도 건설해야 합니다."
 BRA_urbanization_of_rio_de_janeiro: "리우데자네이루 도시화"
 BRA_urbanization_of_rio_de_janeiro_desc: "리우데자네이루가 주요 커피 생산지는 아닐지라도, 우리 경제를 개선한 많은 남작들이 있습니다. 수도는 정부 투자를 통해 재건되고 새로운 기반 시설을 건설하여 도시화될 수 있습니다."
 BRA_urbanization_of_south_and_southeast: "남부 주 도시화"
 BRA_urbanization_of_south_and_southeast_desc: "남부 및 남동부 주의 도시화는 이 지역의 경제 발전을 위한 기회를 창출할 것입니다.."
 BRA_improve_our_economy: "우리 경제 개선"
 BRA_improve_our_economy_desc: "우리 경제 개선"
 BRA_improve_our_railway_system: "우리 철도 시스템 개선"
 BRA_improve_our_railway_system_desc: "철도와 그들의 빠르고 효율적인 운송은 우리에게 매우 유용할 것입니다. 정부와 민간 투자를 위한 새로운 회사를 설립하면 새로운 철도 건설 과정이 가속화될 것입니다."
 BRA_explore_gold_mines_in_maranhao: "마라냥의 금광 탐사"
 BRA_explore_gold_mines_in_maranhao_desc: "마라냥 주 광산의 개발은 금광석 발견으로 이어져 우리 경제를 굳건히 할 수 있습니다."
 BRA_canalization_of_maracana_river: "마라카낭 강 수로 공사"
 BRA_canalization_of_maracana_river_desc: "마라카낭 강 수로 공사는 제국의 수도에 물을 공급할 인프라 공사가 될 것입니다. 인구의 식수 접근성을 높이면 질병 위험을 줄이고 제국 국민의 수명을 늘릴 수 있습니다."
 BRA_dockyard_and_foundry_ponta_da_areia: "폰타 다 아헤이아의 조선소 투자"
 BRA_dockyard_and_foundry_ponta_da_areia_desc: "1857년, 이리네우 에반젤리스타 지 소우자가 소유한 폰타 다 아헤이아의 '주조 및 조선소 시설'이 그 해 국회의원 당선에 대한 보복으로 방화로 파괴되었습니다. 조선소의 재건은 제국이 훨씬 더 큰 함대를 건설하는 데 막대한 도움이 될 것이며, 주조에 대한 투자는 국가의 천연자원 개선에 도움이 될 수 있습니다."
 BRA_factories_ponta_da_areia: "폰타 다 아헤이아 산업 재건"
 BRA_factories_ponta_da_areia_desc: "1857년 방화로 파괴된 이리네우 에반젤리스타 지 소우자, 일명 마우아 남작 소유의 산업 단지와 포병 공장의 재건을 촉진하면 국가 경제 개선에 도움이 될 수 있습니다."
 BRA_expand_ipanema_foundry: "이파네마 주조소 확장"
 BRA_expand_ipanema_foundry_desc: "철 생산을 지원하고 헤알 파브리카 지 페후 상 주앙 두 이파네마를 확장하는 것은 브라질 국영 철강 산업의 탄생이 될 수 있습니다."
 BRA_steam_navegation_company_on_the_amazon_river: "아마존 강 증기 항해 회사"
 BRA_steam_navegation_company_on_the_amazon_river_desc: "아마존 강 증기 항해 회사"
 BRA_illuminate_rio: "리우데자네이루 시 조명"
 BRA_illuminate_rio_desc: "리우데자네이루 시의 가스 조명은 브라질 제국의 수도를 밝히기 위한 이리네우 에반젤리스타 지 소우자의 프로젝트입니다."
 BRA_focus_the_telegraph: "전신"
 BRA_focus_the_telegraph_desc: "전신은 장거리 통신을 거의 즉각적으로 가능하게 하는 혁신적인 새로운 발명품입니다. 우리는 이 발명품에 투자하는 것이 현명할 것입니다."
 BRA_cattle_trade_in_uruguay: "우루과이와의 가축 무역"
 BRA_cattle_trade_in_uruguay_desc: "동부 지역에서의 브라질 가축 투자는 우루과이가 국가로 탄생하기 전부터 존재했습니다. 가축 사육에 투자하는 것은 이 지역에서 우리의 영향력을 증가시키고 우루과이와의 상업 관계를 개선합니다."
 BRA_the_rio_grande_tugbot_company: "바하 두 리우 그란데 예인선 회사"
 BRA_the_rio_grande_tugbot_company_desc: "바하 두 리우 그란데 예인선 회사는 제국 남부 지역의 자원을 국제 시장과 거래하는 상선대입니다."
 BRA_the_recife_and_sao_francisco_road: "헤시피와 상프란시스쿠 도로"
 BRA_the_recife_and_sao_francisco_road_desc: "헤시피와 상프란시스쿠 철도 회사는 시험적으로 시작될 것입니다. 이 회사는 페르남부쿠 주 전체를 수도 헤시피에서 그 주의 남부까지 연결하고 그곳의 운송을 개선할 것입니다."
 BRA_the_dom_pedro_ii_railway: "돔 페드루 2세 철도"
 BRA_the_dom_pedro_ii_railway_desc: "돔 페드루 2세 철도는 수도의 법원과 제국의 주요 주들을 철도로 연결하기 시작할 철도입니다. 이 건설의 성공으로 다른 확장 프로젝트가 수행될 수 있습니다."
 BRA_the_petropolis_road: "페트로폴리스 도로"
 BRA_the_petropolis_road_desc: "페트로폴리스 증기선 및 철도 제국 회사는 리우데자네이루에 건설되어 마우아 항구와 프라고수를 연결할 것입니다. 이는 마우아 남작이 제안했으며, 우리 남동부의 첫 번째 철도가 되어 해당 항구들의 자원 이동성을 개선할 것입니다."
 BRA_southern_railway: "남부 철도"
 BRA_southern_railway_desc: "포르투알레그레 & 뉴 함부르크 브라질 철도 회사 리미티드는 수도 주변 지역과 뉴 함부르크를 연결하는, 나라 남부의 첫 번째 도로를 건설하는 책임을 맡을 것입니다. 우리는 이것이 리우그란데 인구와 그곳의 우리 회사들에게 도움이 되기를 바랍니다."
 BRA_northeastern_railways: "북동부 철도"
 BRA_northeastern_railways_desc: "세아라의 소브랄 철도는 수도를 해안의 작은 도시들과 지역 물류에 연결하는 데 도움이 될 것입니다. 또한 바이아 내륙의 작은 철도들도 우리 국가 북동부의 일부 인프라에 유용할 것입니다."
 BRA_the_central_southeast_railway: "중부 남동부 철도"
 BRA_the_central_southeast_railway_desc: "많은 회사들이 남동부 전역에 철도를 건설하고 있으므로, 우리는 이 지역의 3개 주요 주를 가로지르는 중앙 집중식 철도 건설을 요청하고 다른 철도들을 조직하기 시작해야 합니다. 이는 커피 시장에 수익성이 높고 운송에 유용할 것입니다."
 BRA_the_sao_paulo_main_railway: "상파울루 주요 철도"
 BRA_the_sao_paulo_main_railway_desc: "상파울루 철도 주식회사는 그 주의 주요 철도이며, 산투스 항구와 주의 나머지 지역을 연결하는 데 유용할 것입니다. 이 철도는 해안의 상업 지역을 내륙의 생산성과 연결하여, 농장주들이 커피를 수출하는 데 더 효율적으로 만들 것입니다."
 BRA_the_tijuca_railway: "치주카 철도"
 BRA_the_tijuca_railway_desc: "치주카 철도"
 BRA_the_trams_in_niteroi: "니테로이의 전차"
 BRA_the_trams_in_niteroi_desc: "니테로이의 전차"
 BRA_the_paulista_railway: "파울리스타 철도"
 BRA_the_paulista_railway_desc: "파울리스타 철도"
 BRA_a_country_connected: "절반이 연결된 국가"
 BRA_a_country_connected_desc: "번영의 세월이 우리에게 다가오면서, 우리는 위대한 제국의 남동부 전역에 새로운 철도를 건설하는 데 많은 진전을 이루었다는 것은 간단합니다.\"  
 BRA_expand_coffee_plantations_in_rio: "리우데자네이루의 커피 확장"
 BRA_expand_coffee_plantations_in_rio: "리우데자네이루에서 커피 재배지 확장"
 BRA_expand_coffee_plantations_in_rio_desc: "리우데자네이루의 커피 확장"
 BRA_expand_coffee_plantations_in_sao_paulo: "상파울루의 커피 확장"
 BRA_expand_coffee_plantations_in_sao_paulo_desc: "상파울루의 커피 확장"
 BRA_expand_coffee_plantations_in_espirito_santo: "에스피리투산투의 커피 확장"
 BRA_expand_coffee_plantations_in_espirito_santo_desc: "에스피리투산투의 커피 확장"
 BRA_expand_coffee_plantations_in_minas_gerais: "미나스 제라이스의 커피 확장"
 BRA_expand_coffee_plantations_in_minas_gerais_desc: "미나스 제라이스의 커피 확장"
 BRA_expand_coffee_plantations_in_bahia: "바이아의 커피 확장"
 BRA_expand_coffee_plantations_in_bahia_desc: "바이아의 커피 확장"
 BRA_expand_coffee_plantations_in_parana: "파라나의 커피 확장"
 BRA_expand_coffee_plantations_in_parana_desc: "파라나의 커피 확장"
 BRA_prevent_massive_loans: "대규모 대출 방지"
 BRA_prevent_massive_loans_desc: "대규모 대출은 우리의 산업 발전에 직면한 문제 중 하나입니다. 산업계의 남작들과 회사들은 우리 은행에서 막대한 대출을 받고 산업화를 통해 얻는 이익으로 이를 상환할 수 없으므로, 우리는 이러한 막대한 대출을 방지해야 합니다."
 BRA_convince_elitists_to_support_industry: "과두 정치가들을 설득하여 산업 지원"
 BRA_convince_elitists_to_support_industry_desc: "산업 침체를 막기 위해 일부 과두 정치가들이 지역 산업을 지원하도록 설득하는 것이 우리의 목표가 되어야 합니다. 우리는 그들 중 일부에게 보상을 주거나 더 많은 대출을 받도록 허용해야 합니다."
 BRA_befriend_the_coffee_burgeoise: "커피 부르주아지와 친분 쌓기"
 BRA_befriend_the_coffee_burgeoise_desc: "커피가 우리나라의 주요 수출품 중 하나로 자리 잡기 시작하면서, 그들의 이익을 활용하고 정치적으로 우리 편으로 만들기 위해 남부의 영향력 있는 커피 남작들과 관계를 구축하는 것이 현명할 수 있습니다."
 BRA_improve_santos_trade_port: "산투스 무역항 개선"
 BRA_improve_santos_trade_port_desc: "상파울루의 산투스 항구는 여전히 작고 개발이 덜 되었지만, 커피 붐이 시작된 이후 남부에서 가장 중요한 무역항 중 하나가 되었습니다. 우리는 추가 자금을 보내 시설을 확장해야 합니다."
 BRA_rio_de_janeiro_coffee_elites: "리우데자네이루의 커피 엘리트"
 BRA_rio_de_janeiro_coffee_elites_desc: "산투스 항구 개선이 상파울루의 농장주들에 대한 우리의 영향력을 증가시켰지만, 우리는 리우데자네이루의 농장주들과 만나 지역 커피 엘리트들과의 관계를 더욱 확장할 수 있습니다."
 BRA_the_transatlantic_coffee_trade: "대서양 횡단 커피 무역"
 BRA_the_transatlantic_coffee_trade_desc: "이제 커피 농장주들과 확고한 관계를 맺었으니, 커피를 통해 활력을 얻고자 하는 유럽과 미국의 고객들에게 우리의 커피 수출을 판매하기 위한 새로운 노력을 추구할 수 있습니다."
 BRA_trading_with_the_european_powers: "유럽 강대국과의 무역"
 BRA_trading_with_the_european_powers_desc: "유럽은 브라질 커피에 중독되었으며, 그들의 국민들은 매일 우리의 농장에서 생산된 과일을 더 많이 원하는 것처럼 보입니다. 우리는 우리의 무역선이 유럽 항구에 하역하는 것을 우선시하도록 장려함으로써 그들의 요구에 응해야 합니다."
 BRA_trading_with_the_united_kingdom: "영국과의 무역"
 BRA_trading_with_the_united_kingdom_desc: "영국 국민들은 우리 나라의 훌륭한 커피 제품의 유입을 진정으로 감사하기 시작했으며, 우리 자문가들은 그들과 수익성 있는 새로운 무역 거래를 성사시키면 양국 모두에게 이익이 되고 그들과의 외교 관계를 개선할 수 있다는 점에 주목했습니다."
 BRA_propose_a_research_treaty: "연구 조약 제안"
 BRA_propose_a_research_treaty_desc: "대영 제국은 세계에서 가장 강력한 제국이며, 그들의 기술력은 타의 추종을 불허합니다. 이제 영국이 우리에게 우호적이 되었으므로, 우리는 국가의 현대화를 더욱 발전시키기 위해 그들과 연구 조약을 체결하려고 노력할 수 있습니다."
 BRA_improve_our_universities: "우리 대학 개선"
 BRA_improve_our_universities_desc: "우리나라를 유럽 강대국들과 동등하게 발전시키기 위해, 영국 학계가 우리 학교에서 가르치도록 장려하여 교육 개선에 투자해야 합니다."
 BRA_trading_with_the_french_empire: "프랑스 제국과의 무역"
 BRA_trading_with_the_french_empire_desc: "프랑스 국민들은 우리 나라의 훌륭한 커피 제품의 유입을 진정으로 감사하기 시작했으며, 우리 자문가들은 그들과 수익성 있는 새로운 무역 거래를 성사시키면 양국 모두에게 이익이 되고 그들과의 외교 관계를 개선할 수 있다는 점에 주목했습니다."
 BRA_propose_an_economic_treaty: "경제 조약 제안"
 BRA_propose_an_economic_treaty_desc: "프랑스는 세계적인 경제 강국이며, 그들과 새로운 경제 조약을 제안하면 우리가 잠재적으로 접근할 수 있는 막대한 자원을 보유하고 있습니다."
 BRA_stabilize_the_banks: "은행 안정화"
 BRA_stabilize_the_banks_desc: "이제 프랑스가 우리에게 우호적이 되었으므로, 우리는 그들의 일부 은행가들과 협력하여 우리 경제의 은행 부문을 마비시킨 해로운 부패를 억제하고 성장하는 도시에 새로운 은행을 개설할 기회를 가졌습니다."
 BRA_construct_industrial_centers_in_sao_paulo: "상파울루에 산업 중심지 건설"
 BRA_construct_industrial_centers_in_sao_paulo_desc: "번화한 남동부 도시 상파울루는 지역 경제에 극적인 영향을 미친 사업의 급증을 목격했습니다. 특히 섬유 산업에 대한 투자를 조금 더 한다면, 이러한 성장이 앞으로 몇 년 동안 계속 증가하는 것을 볼 수 있을 것입니다."
 BRA_construct_industrial_centers_in_rio_de_janeiro: "리우데자네이루에 산업 중심지 건설"
 BRA_construct_industrial_centers_in_rio_de_janeiro_desc: "제조업은 우리 산업에서 여전히 부족한 분야이며, 우리가 진정으로 산업화를 수용하고자 한다면, 수도에 새로운 시설을 만드는 데 투자하는 것이 중요한 첫 번째 단계입니다."
 BRA_into_the_industrial_age: "산업 시대로"
 BRA_into_the_industrial_age_desc: "우리 항구의 무역 소란과 도시의 기계 소리와 함께, 산업 시대를 느껴봅시다!"
 BRA_discuss_our_politics: "우리 정치 논의"
 BRA_discuss_our_politics_desc: "브라질은 정치적, 경제적으로 부상하고 있습니다. 우리는 우리의 정치가 어떻게 기능할지 결정하기 시작해야 하며, 의회에서 충돌하는 보수주의자, 자유주의자, 그리고 진보주의자 사이의 균형을 찾아야 합니다."
 BRA_prepare_the_cabinet: "내각 준비"
 BRA_prepare_the_cabinet_desc: "대부분의 내각이 무질서하고 형편없이 구성되어 있어 어떤 종류의 회의를 개최할 준비가 되어 있지 않습니다. 우리는 이 거대하고 위대한 제국의 문제를 해결하고 새로운 회의를 개최하기 위해 새로운 내각을 만들어야 합니다."
 BRA_reorganize_the_parliament: "의회 재구성"
 BRA_reorganize_the_parliament_desc: "의회는 투자, 재건, 그리고 재구성될 수 있습니다. 우리는 하위 및 상위 계급에 대한 투표 시스템의 제한을 결정할 것입니다. 우리는 보수적인 현상 유지에 대한 약속을 했지만, 우리가 현대화되고 자유화되고 있다는 사실도 고려해야 한다는 것을 기억해야 합니다."
 BRA_hold_the_elections: "선거 실시"
 BRA_hold_the_elections_desc: "토론이 개최되고 모든 것이 준비된 후, 우리 국가가 어떤 길을 갈지 결정할 때입니다. 우리는 개혁, 전통, 또는 중도파를 따를 것인가? 지금 결정되는 것이 이 위대한 19세기 중반에 우리 제국을 정치적으로 이끌 것입니다."
 BRA_elect_a_liberal_minister: "개혁주의 의제를 가진 정부"
 BRA_elect_a_liberal_minister_desc: "자유주의자, 진보주의자, 보수주의자 사이에 항상 합의가 있는 것은 아니지만, 브라질 제국이 영국에서 사용된 모델과 유사한 시장 자유화, 심지어 온건한 사회적 자유화와 같은 여러 개혁을 통해 현대 국가가 될 필요가 있다는 것은 분명합니다. 임명된 관료들은 가능한 한 빨리 이 개혁주의 의제를 가지고 일해야 합니다."
 BRA_change_and_reformation: "변화와 개혁"
 BRA_change_and_reformation_desc: "이제 개혁주의자들이 집권했으므로, 그들은 우리 국가가 새로운 경제적 자유화와 정부 분권화의 길을 추구할 것을 제안합니다. 이는 전통주의자들을 자극하겠지만, 우리나라의 혁신과 기업가 정신을 증가시킬 것입니다."
 BRA_popularize_democracy: "민주주의 대중화"
 BRA_popularize_democracy_desc: "개혁가들이 권력을 잡았지만, 국민들은 여전히 개혁이 일으키는 급격한 변화를 경계합니다. 우리는 민주주의가 불화를 일으키지 않고 자유와 진보를 증가시킬 것이라고 정치인과 시민들을 설득하기 위한 새로운 노력을 해야 합니다."
 BRA_question_our_parliamentary_system: "우리의 의회 시스템에 의문을 제기"
 BRA_question_our_parliamentary_system_desc: "우리의 의회 시스템을 재평가하고, 입법부, 즉 국민에게 국가 문제에 대한 더 큰 발언권을 주기 위해 의회의 권한과 대표성을 확대해야 할 때가 왔습니다."
 BRA_question_the_emperors_power: "황제의 권력에 의문을 제기"
 BRA_question_the_emperors_power_desc: "우리는 선출된 의회의 권력을 증가시키기 위해 아무리 노력하더라도, 황제가 중재 권한을 가지고 있으면 의회가 취할 수 있는 모든 행동은 그의 감시 아래에 있을 것입니다. 우리가 진정으로 국가를 개혁하는 데 전념하고 있다면, 황제에게 무엇을 해야 할지 결정해야 합니다."
 BRA_power_to_the_commons: "국민에게 권력을"
 BRA_power_to_the_commons_desc: "의회와 국민은 중재 권한을 종식시키기로 결정했습니다. 이제 개혁의 길은 우리 손안에 있습니다. 이 운동의 추진력을 계속하기 위해, 우리는 군주를 왕국의 상징적인 존재로 유지하면서 의회가 정부를 이끌고 재편하는 새로운 의회 군주제를 수립해야 합니다."
 BRA_fight_the_elites: "엘리트들과 싸우기"
 BRA_fight_the_elites_desc: "우리 개혁의 주요 장애물은 우리나라의 초보수적이고 제국주의를 지지하는 엘리트들입니다. 그들은 정부 재구조화를 계속하려는 우리의 모든 움직임을 차단하려고 합니다. 자유화를 달성하려면 그들을 다루어야 합니다."
 BRA_road_to_reforms: "개혁의 길"
 BRA_road_to_reforms_desc: "이제 의회의 권한이 확대되었으므로, 우리는 광범위한 개혁을 계속하는 데 필요한 자금을 받기 위해 저명한 국회의원들의 지지를 모아야 할 때입니다."
 BRA_liberalize_the_market: "시장 자유화"
 BRA_liberalize_the_market_desc: "많은 저명한 정치인들은 영국이 세계 강국이 된 요인 중 하나로 자유 시장 경제를 채택한 것을 지적합니다. 그들은 우리가 위대한 강국이 되려면 그들의 발자취를 따라야 한다고 제안합니다."
 BRA_liberalize_the_suffrage: "참정권 개혁"
 BRA_liberalize_the_suffrage_desc: "현재 브라질의 참정권은 25세 이상의 남성이 투표하기 위해 부유해야 합니다. 이것은 노동자와 아주 작은 사업주들이 투표하는 것을 막고, 미래 선거에서 우리의 지지도를 낮춥니다."
 BRA_education_reforms: "교육 개혁"
 BRA_education_reforms_desc: "현재 브라질의 교육 시스템은 부유한 사람들에게만 유리합니다. 왜냐하면 시골의 학교는 수업에 참석하기 위해 엄청난 비용을 요구하기 때문입니다. 우리는 시스템을 개혁하고 우리 사회가 적절한 교육을 받고 모든 종류의 교육을 개선할 수 있도록 새로운 공립학교 의무 교육을 도입할 수 있습니다."
 BRA_a_new_constitution: "새로운 헌법"
 BRA_a_new_constitution_desc: "이제 마침내 낡은 1824년 헌법을 재검토할 때가 왔습니다. 비록 의회와 독립된 사법부의 설립을 보장했지만, 황제는 시스템에 대해 너무 많은 권위적 통제권을 부여받았습니다. 우리는 우리가 수립한 새로운 질서를 반영하기 위해 이 헌법을 다시 작성해야 합니다."
 BRA_inspiration_from_the_british_model: "영국 모델에서 영감 얻기"
 BRA_inspiration_from_the_british_model_desc: "우리 정부 개혁의 대부분이 영국이 그들의 국가에서 수립한 구조를 따랐기 때문에, 더 큰 개혁을 달성하기 위해 영국 자문가들을 우리나라로 초청하는 것은 논리적입니다."
 BRA_rethink_the_economy: "경제를 다시 생각"
 BRA_rethink_the_economy_desc: "우리가 자유 시장 접근을 추구하는 데 큰 진전을 이루었지만, 경제에 대한 정부 개입을 줄이기 위해 아직 더 많은 노력을 해야 합니다."
 BRA_strenghten_the_parliament: "의회 강화"
 BRA_strenghten_the_parliament_desc: "영국 특사들로부터 받은 조언으로, 우리는 이제 국가를 재건하고 통합하는 데 의회의 역할을 증가시키기 위한 새로운 조치를 취할 수 있습니다."
 BRA_a_deal_with_the_emperor: "황제와의 거래"
 BRA_propose_the_slavery_act: "노예법 제안"
 BRA_propose_the_slavery_act_desc: "황제는 일부 법률을 변경하고 노예 제도를 완화하는 제안을 했습니다. 완전히 폐지하는 것은 아니지만, 일부 제한을 두는 것입니다. 노예법은 황제가 적절하다고 판단하는 대로 노예 행위를 제한할 수 있도록 허용하겠지만, 노예 판매자와 농장주들의 동의 없이는 폐지되지 않도록 할 것입니다."
 BRA_educate_the_masses: "대중 교육"
 BRA_educate_the_masses_desc: "부자와 빈자 모두를 만족시키기 위해, 우리는 교육 시스템을 완전히 개혁하지 않고 우리 사회의 하층 계급을 위한 일부 학교를 개방할 것입니다. 우리 국가가 더 번영하기 위해서는 대중이 교육받아야 합니다. 리우데자네이루와 사우바도르와 같은 주요 도시에 일부 공립학교 프로젝트가 자금을 지원받고 건설될 것입니다."
 BRA_advancements_on_science: "과학 발전"
 BRA_advancements_on_science_desc: "브라질의 황제는 과학을 매우 높이 평가하며, 우리 과학 시스템에 대한 일부 개혁이 이루어져야 합니다. 우리는 연구 프로그램을 현대화하고 유럽 친구들의 연구 능력으로 나아가야 합니다."
 BRA_invite_french_intellectuals: "프랑스 지식인 초청"
 BRA_invite_french_intellectuals_desc: "프랑스에서 일부 지식인들을 데려오는 것은 전자공학과 공학 분야의 연구를 발전시키는 데 도움이 될 것입니다. 그들은 큰 발전을 이루었고, 그들의 최고의 과학자들과 연구자들 중 일부가 브라질을 방문하여 그들의 연구를 공유하는 것은 우리 국가의 방대한 과학적 잠재력에 유익할 것입니다."
 BRA_invite_prussian_intellectuals: "프로이센 지식인 초청"
 BRA_invite_prussian_intellectuals_desc: "강력한 프로이센 국가는 유익할 수 있는 일부 과학자들과 연구원들을 보유하고 있습니다. 그들 중 일부를 데려오는 것은 전자공학과 공학 분야의 연구를 발전시키는 데 도움이 될 것입니다. 우리는 심지어 남부에 있는 우리 독일인 인구를 이용하여 그들이 우리와 더 많은 연구를 공유하도록 설득할 수도 있습니다."
 BRA_research_on_electrical_engineering: "전기 공학 연구"
 BRA_research_on_electrical_engineering_desc: "우리의 우호적인 프로이센과 프랑스 지식인들의 도움으로, 우리는 공학 분야에서 큰 발전을 이루고 심지어 일부 새로운 혁신을 만들 수 있습니다."
 BRA_elect_a_progressive_minister: "온건주의 의제를 가진 정부"
 BRA_elect_a_progressive_minister_desc: "보수적인 반체제 인사들과 자유주의자들이 중도적인 방식으로 결성한 진보주의자 연맹이 온건한 정부를 구성했습니다. 이 정부는 논란이 많은 자유주의자들과 그들의 인기 없는 이상들, 그리고 권위주의적인 보수주의자들과 그들의 퇴보적인 이상들을 통제할 것입니다."
 BRA_progress_and_prosperity: "진보와 번영"
 BRA_progress_and_prosperity_desc: "우리 국가는 진보를 향해 나아가며, 중립적이고 번영하며 균형 잡힌 국가를 유지하는 데 집중해야 합니다. 우리 국가는 양측의 균형을 유지하고 세계의 다른 강대국들과 좋은 외교 관계를 맺는 데 집중해야 합니다. 새로운 집권당은 우리 제국을 안정시킬 것입니다."
 BRA_centrist_ideas_towards_issues: "문제에 대한 중도주의적 생각"
 BRA_centrist_ideas_towards_issues_desc: "자유주의자와 보수주의자 이상 사이의 균형을 유지하고 중립적인 사회적, 경제적 기반을 유지하는 것이 우리 국가의 현재 그리고 아마도 미래 정치의 주요 아이디어가 되어야 합니다."
 BRA_support_our_parliamentary_system: "우리 의회 시스템 지원"
 BRA_support_our_parliamentary_system_desc: "브라질의 의회 시스템은 매우 권위주의적으로 여겨지는 중재 권한을 가지고 있습니다. 우리는 우리의 안정적인 정치와 우리의 황제 페드루 2세의 좋은 이미지를 홍보하여 그 시스템이 좋다는 것을 대중화하고 보여주어야 합니다."
 BRA_declare_south_american_status_quo: "남아메리카 현상 유지 선언"
 BRA_declare_south_american_status_quo_desc: "우리의 외교 정책은 플라티나 지역에 대한 우리의 영향력을 유지하고, 남아메리카에서 전쟁을 피하고, 국가를 정복하고 확장하려는 사람들을 막아 안정적인 상황을 유지하는 것이어야 합니다. 우리는 한때 포르투갈인들처럼 전쟁을 좋아하는 제국이 아니라, 동맹을 맺고 세계와 외교 관계를 확장하는 국가가 되어야 합니다."
 BRA_dom_pedro_diplomatic_travels: "돔 페드루의 외교 여행"
 BRA_dom_pedro_diplomatic_travels_desc: "우리의 황제, 돔 페드루 2세는 전 세계를 여행하며 다른 나라의 지도자, 과학자, 그리고 다른 인물들을 만나는 것을 좋아합니다. 우리가 더 많은 외교 관계를 수립할 수 있도록 이를 지원해야 합니다."
 BRA_trade_relations_with_our_neighbors: "이웃 국가들과의 무역 관계"
 BRA_trade_relations_with_our_neighbors_desc: "우리의 남아메리카 이웃 국가들은 우리에게 유익할 수 있는 풍부한 자원에 접근할 수 있습니다. 우리는 그들 국가의 대표자들을 만나고 그들과 일부 무역 거래를 주선할 수 있는지 알아보도록 외교관들을 보내야 합니다."
 BRA_trade_relations_with_north_america: "북아메리카와의 무역 관계"
 BRA_trade_relations_with_north_america_desc: "우리는 무역에 관해서 남아메리카 대륙에만 관심을 제한해서는 안 됩니다. 우리는 북아메리카 국가들과 접촉하여 우리와 무역할 의향이 있는지 알아보아야 합니다."
 BRA_visit_the_united_states: "미국 방문"
 BRA_visit_the_united_states_desc: "미국은 아메리카 대륙에서 가장 크고 영향력 있는 강대국 중 하나입니다. 돔 페드루 2세가 그들의 나라를 공식적으로 국빈 방문하는 것이 우리의 최선일 것입니다."
 BRA_careful_cooperation: "신중한 협력"
 BRA_careful_cooperation_desc: "우리는 많은 국가들과 좋은 경제적 관계를 수립하는 데 성공했지만, 어떤 종류의 동맹에도 얽히지 않고 외교 관계만을 유지하는 것이 우리의 최선입니다."
 BRA_a_new_foreign_policy: "새로운 외교 정책"
 BRA_a_new_foreign_policy_desc: "우리는 남아메리카 대륙의 주요 영향력 있는 국가가 되는 길을 가고 있으며, 우리 주변의 다른 국가들도 이를 인정하기 시작했습니다. 우리는 같은 생각을 가진 이웃 국가들과 외교적 영향력을 확장하려는 노력을 계속해야 합니다."
 BRA_mend_relations_with_argentina: "아르헨티나와의 관계 회복"
 BRA_mend_relations_with_argentina_desc: "아르헨티나인들은 스페인으로부터 독립한 이래로 오랫동안 우리와 경쟁 관계에 있었습니다. 그들의 정치적 입장이 더 자유주의적이고 덜 전쟁을 좋아하는 성향이 되었다는 점에 주목하고, 그들과 화해하려고 노력하는 것이 우리에게 이익이 될 수 있습니다."
 BRA_propose_the_monroe_alliance: "먼로 동맹 제안"
 BRA_propose_the_monroe_alliance_desc: "미국은 그들의 먼로 독트린 아래에서 잠재적인 유럽 식민지 개척자들로부터 우리를 보호하겠다고 아낌없이 제안했습니다. 우리는 미국과 동맹을 제안함으로써 이에 보답해야 합니다."
 BRA_expand_the_alliance_on_the_platine: "플라티나로 동맹 확장"
 BRA_expand_the_alliance_on_the_platine_desc: "플라티나 지역은 수년간 수많은 분쟁의 현장이었습니다. 이 지역에서 우리의 안보를 강화하기 위해, 우리는 우루과이인들을 먼로 동맹에 초대해야 합니다."
 BRA_start_a_research_project: "연구 프로젝트 시작"
 BRA_start_a_research_project_desc: "우리는 먼로 동맹을 상호 방어뿐만 아니라 기술 혁신을 촉진하기 위해서도 사용할 수 있습니다. 우리는 먼로 동맹 서명국들과 새로운 연구 조약을 체결해야 합니다."
 BRA_diplomatic_visit_to_britain: "영국 외교 방문"
 BRA_diplomatic_visit_to_britain_desc: "영국은 우리의 가장 충실한 동맹국 중 하나이며, 그들과의 외교 관계를 개선하는 것은 양측 모두에게 이익이 될 것입니다. 우리 황제의 런던 방문은 양측 모두에게 크게 감사하게 될 것이며, 우리는 그들의 현재 산업화된 사회의 일부 기반 시설에 대해서도 배울 수 있을 것입니다."
 BRA_learn_from_european_infrastructure: "유럽 기반 시설에서 배우기"
 BRA_learn_from_european_infrastructure_desc: "우리의 영국 방문은 페드루 2세에게 우리 제국의 현재 기반 시설 구축에 대한 몇 가지 새로운 변화를 제안하도록 영감을 주었습니다. 우리는 새로운 건물, 도로를 건설하고 우리 나라에서 가장 크고 아름다운 도시들을 크게 개선하는 영국 방식을 본받기 시작해야 합니다."
 BRA_mend_relations_with_uruguay: "우루과이와의 관계 회복"
 BRA_mend_relations_with_uruguay_desc: "우루과이는 우리와 시스플라티나 전쟁에서 독립 운동을 한 이래로 우리의 라이벌 중 하나였습니다. 그 전쟁은 교착 상태로 끝났고 동방 공화국은 독립을 얻었습니다. 우루과이가 아르헨티나의 손아귀에서 벗어나 더 자유주의적으로 나아가면서, 우리는 그들을 외교적으로 접근하고 지지하고 지원해야 합니다."
 BRA_mend_relations_with_peru: "페루와의 관계 회복"
 BRA_mend_relations_with_peru_desc: "아마존 강 무역로에 대한 1855년 그들의 시위와 그 지역의 무역 과정에 대한 규제에 대한 우리의 충돌하는 아이디어 때문에 페루와의 우리의 관계는 악화되었습니다. 페루는 이제 남아메리카 문제의 주요 행위자이며, 우리는 그들과의 관계를 재고하고 개선하려고 노력해야 합니다."
 BRA_elect_a_conservative_minister: "전통주의 의제를 가진 정부"
 BRA_elect_a_conservative_minister_desc: "보수주의자들은 우리의 진보적이고 부상하는 제국에서 가장 인기가 있는 것은 아니지만, 그들은 우리를 위대함, 중앙집권화, 그리고 안정으로 이끌 수 있는 사람들입니다. 그들은 황제의 권력과 라틴 아메리카 대륙 전역에 대한 우리의 영향력을 확보할 것입니다. 그들은 브라질인들이 그들의 제국이 훨씬 더 위대하고 강한 국가가 되는 것을 볼 수 있도록 보장할 것입니다."
 BRA_ambition_and_tradition: "야망과 전통"
 BRA_ambition_and_tradition_desc: "전통주의자들의 통치 아래 제국은 훨씬 더 높은 곳으로 올라갈 것입니다. 브라질인들이 정당한 땅에 대한 통제를 확립할 때 재규어의 포효는 대륙 전역에서 느껴질 것입니다. 우리는 자랑스러운 브라질 국민의 제국적이고 천년 된 전통을 독립적이고 하나의 노란색과 녹색 깃발 아래 통합하여 지킬 것입니다."
 BRA_preserve_royal_power: "왕실 권력 보존"
 BRA_preserve_royal_power_desc: "황제는 우리 국가의 상징이며, 그는 우리의 성장과 승리뿐만 아니라 브라질 국민을 상징합니다. 우리는 그를 더 나쁘게 바꾸는 사람이 없도록 보장하고, 그의 이미지를 개선하고 공화주의자들을 약화시켜야 합니다."
 BRA_declare_south_american_ambition: "우리의 남아메리카 야망 선언"
 BRA_declare_south_american_ambition_desc: "브라질 국가는 남부의 논란이 많은 플라티나 지역부터 빽빽하고 신비로운 아마존까지 대륙 전체를 통치할 것입니다! 제국군은 그들이 마땅히 받을 자격이 있는 모든 것을 통치할 것입니다. 브라질에 영광을!"
 BRA_tame_the_progressives: "진보주의자 길들이기"
 BRA_tame_the_progressives_desc: "우리의 팽창주의적 이상을 선언한 후, 우리는 인기 있는 진보주의자들에 의해 전쟁을 좋아하는 위험한 사람으로 판단받았습니다. 우리는 정부와 군대가 거의 반대 없이 행동을 진행할 수 있도록 그들의 영향력을 통제하고 그들을 진정시키려고 노력해야 합니다."
 BRA_appease_liberal_entrepreneurs: "자유주의 기업가들 달래기"
 BRA_appease_liberal_entrepreneurs_desc: "회사들과 그들의 자유주의 지지자들을 확보하기 위해, 우리는 그들에게 약간의 자금과 정치적 혜택으로 그들을 달래야 합니다. 산업 및 철도 회사를 우리 편으로 만들면 자유주의자들을 약화시킬 수 있으며, 우리는 그들을 쉽게 조종할 수 있을 것입니다."
 BRA_centralize_government_power: "정부 권력 중앙집권화"
 BRA_centralize_government_power_desc: "황제가 신민들과 정당들에 대한 힘을 보장하기 위해 권력의 중앙집권화가 필요합니다. 우리는 그들의 안보와 번영을 보장하기 위해 군대의 통제를 강화하여 의회, 그리고 주(州)들의 권력을 줄여야 합니다. 우리가 진정으로 제국을 통합한다면 브라질은 영광스러운 국가적 연합 감각에 의해 움직이는 통합된 국가가 될 것입니다."
 BRA_ally_the_church: "교회와 동맹"
 BRA_ally_the_church_desc: "가톨릭교는 우리의 국교이며, 따라서 우리 국가 정부, 특히 황제와 밀접하게 관련된 기관입니다. 우리가 교회와의 관계를 강화한다면, 더 많은 독실한 가톨릭 신자들이 우리의 대의에 동조하게 될 수 있습니다."
 BRA_pro_war_propaganda: "전쟁 지지 선전"
 BRA_pro_war_propaganda_desc: "우리가 야망을 실현하려면, 국민들이 우리 편에 서야 합니다. 인쇄물과 입소문을 통해 애국적인 선전을 널리 배포하는 것이 브라질 국민에게 행동을 고취시키는 가장 효과적인 수단이 될 것입니다."
 BRA_restore_our_imperial_might: "우리의 제국적 위엄 복원"
 BRA_restore_our_imperial_might_desc: "이제 브라질 제국이 라틴 아메리카의 지배적인 강국으로 부상할 때가 왔습니다. 우리는 정당하게 우리의 것을 되찾고, 브라질이 진정으로 존경받고 경외받을 만한 국가임을 세계에 증명할 것입니다!"
 BRA_reclaim_the_cisplatine_province: "시스플라티나 주 탈환"
 BRA_reclaim_the_cisplatine_province_desc: "1828년, 브라질은 아르헨티나인들과 우루과이인들과의 격렬한 전쟁 후 엄청난 약화기에 직면하여 남부 시스플라티나 주에 대한 통제권을 포기해야 했습니다. 우리의 약함의 결과는 이제 독립국 우루과이입니다. 우리는 우리나라에 닥친 이 수치를 지우고 잃어버린 시스플라티나를 되찾아야 합니다!"
 BRA_artigas_border_crisis: "아르티가스 국경 위기"
 BRA_artigas_border_crisis_desc: "단지 우루과이에 대한 영유권을 주장하는 것만으로는 우루과이인들과의 분쟁을 정당화하기에 충분하지 않습니다. 우리는 우리 군대가 그들의 국경에 집결할 수 있도록 우루과이의 아르티가스 주 근처에서 정치적 사건을 일으키고, 폭력이 불가피하게 시작되면 그들의 방어를 공격하기 위해 카라이 근처의 사람들을 동원해야 합니다."
 BRA_the_second_cisplatine_war: "제2차 시스플라티나 전쟁"
 BRA_the_second_cisplatine_war_desc: "마침내 잃어버린 시스플라티나 주를 되찾을 때가 왔습니다. 브라질과 우루과이의 전투선이 형성되었고, 공식적인 외교 관계가 단절되었습니다. 제1차 시스플라티나 전쟁에서 용감하게 목숨을 바친 사람들의 복수를 제2차 전쟁에서의 압도적인 승리로 합시다! 만세 제국!"
 BRA_reclaim_the_caiena_colony: "카이에나 식민지 탈환"
 BRA_reclaim_the_caiena_colony_desc: "나폴레옹 전쟁 중, 연합된 영국-포르투갈군이 1809년 프랑스령 기아나를 침공하고 점령했습니다. 이 식민지는 브라질 왕국에 편입되었지만, 나폴레옹 보나파르트가 축출된 후 곧 프랑스에 반환되었습니다. 프랑스령 기아나는 브라질의 이전 영토였으므로, 우리는 그것을 정당한 소유자에게 돌려주는 것이 정당합니다."
 BRA_discredit_the_paris_treaty: "파리 조약 신뢰 실추"
 BRA_discredit_the_paris_treaty_desc: "파리 조약은 나폴레옹 전쟁이 끝난 후 포르투갈이 기아나를 프랑스에 반환하기 위해 프랑스와 체결한 협정입니다. 프랑스는 현재 오직 죄수 식민지로만 사용되는 그 식민지 영토를 받을 자격이 전혀 없습니다. 우리는 우리가 합법적으로 프랑스로부터 점령했던 영토를 브라질이 되찾도록 선동해야 합니다."
 BRA_demand_french_guyana: "프랑스령 기아나 요구"
 BRA_demand_french_guyana_desc: "포르투갈이 부끄럽게도 포기했던 것을 마침내 되찾을 때입니다. 우리는 우리의 오랜 적에게 우리가 남아메리카의 진정한 주인임을 보여줄 것입니다!"
 BRA_ave_imperio: "만세 제국!"
 BRA_ave_imperio_desc: "승리! 우리 국민들은 나라 전체에서 '만세 제국!'을 자랑스럽게 외칩니다. 우리는 잃어버린 시스플라티나 주를 되찾고 프랑스로부터 기아나를 다시 빼앗았습니다. 이제 세계는 우리를 진정으로 존경받을 만한 강국으로 알게 될 것입니다."
 BRA_american_civil_war: "미국 남북 전쟁"
 BRA_american_civil_war_desc: "미국에서 두 개의 싸우는 파벌, 즉 노예 제도 반대 연방 정부 충성파 양키와 분리주의, 노예 제도 지지 남부 연합군 사이에 전쟁이 발발했습니다. 이 전쟁의 결과는 앞으로 몇 년 동안 아메리카 대륙의 운명을 결정할 수 있습니다."
 BRA_honor_our_alliance: "우리 동맹 존중"
 BRA_honor_our_alliance_desc: "미국 남북 전쟁은 북아메리카뿐만 아니라 남부 대륙에도 영향을 미칠 수 있는 분쟁이므로, 우리는 어느 편에 동정심을 가져야 할지 결정해야 합니다. 미국 연방 정부의 입장을 재확인하는 것이 우리의 최선입니다. 왜냐하면 그들은 유럽의 침범으로부터 우리를 보호하는 데 전념했기 때문입니다."
 BRA_ensure_our_neutrality: "우리의 중립 보장"
 BRA_ensure_our_neutrality_desc: "우리는 노예를 보유한 국가이므로, 우리 나라 내에서 대중적 불안을 유발하지 않고 노예 제도에 대해 단호히 반대하는 대의에 합류하는 것은 현명하지 않을 것입니다. 중립을 유지하고 우리 국민들로부터 남부 연합군에게 어떤 지원도 주어지지 않도록 보장하는 것이 우리의 최선입니다."
 BRA_take_in_refugees: "난민 수용"
 BRA_take_in_refugees_desc: "미국 남북 전쟁은 격렬한 분쟁으로 인해 집과 생계를 잃은 많은 미국인들을 이주하게 했습니다. 이 난민들 중 다수가 우리나라에 피난처를 찾아 도착하기 시작했습니다. 우리는 그들을 두 팔 벌려 환영해야 합니다."
 BRA_recognize_csa: "남부 연합국 인정"
 BRA_recognize_csa_desc: "미국 남북 전쟁은 북아메리카뿐만 아니라 남부 대륙에도 영향을 미칠 수 있는 분쟁이므로, 우리는 어느 편에 동정심을 가져야 할지 결정해야 합니다. 남부 연합군은 동료 노예 보유 국가이므로, 그들에게 지원을 제공하는 것이 우리의 최선일 것입니다. 그들의 독립을 공식적으로 인정하는 것이 그들의 대의를 지지하기 위한 중요한 첫 단계입니다."
 BRA_support_the_south: "남부 지원"
 BRA_support_the_south_desc: "남부 주들은 북부 적들에게 수적으로나 무기적으로나 크게 열세입니다. 그들이 생존하려면 외부의 도움이 필요할 것입니다. 우리는 즉시 우리의 일부 병력을 남부로 보내 그들을 대신하여 싸우도록 해야 합니다."
 BRA_covert_slave_trade: "비밀 노예 무역"
 BRA_covert_slave_trade_desc: "남부의 대의를 지지하는 추가적인 이점 중 하나는 우리 농장을 위한 새로운 노예 시장이 열린다는 것입니다. 비록 노예 무역은 국제 해사법에 의해 거의 금지되었지만, 남부와의 긴밀한 협력은 우리가 이를 우회할 수 있도록 할 것입니다."
 BRA_uruguayan_intervention: "우루과이 개입"
 BRA_uruguayan_intervention_desc: "1852년부터, 우리는 우루과이인들과 그들의 정치에 대한 우리의 영향력을 유지했습니다. 그러나 최근, 파라과이와의 동맹과 블랑코(Blanco) 보수주의의 지배로 인해, 동방 공화국은 더 이상 우리의 이익에 동의하지 않습니다."
 BRA_support_brazilian_lords_in_uruguay: "우루과이의 브라질 남작 지원"
 BRA_support_brazilian_lords_in_uruguay_desc: "브라질 은행가들과 농장주들은 수십 년 동안 우루과이에 살았습니다. 그들은 국경 지역의 지역 경제를 안정시켰고 상업 관계가 더 좋아졌지만, 최근 블랑코 정부는 우루과이 남작들과 스페인어를 사용하는 지주들을 지원하여 브라질 남작들의 영향력을 약화시키고 우루과이 북부에서 그들을 내쫓으려 합니다. 우리는 이것을 허용해서는 안 됩니다."
 BRA_support_brazilians_living_in_uruguay: "우루과이에 사는 브라질인 지원"
 BRA_support_brazilians_living_in_uruguay_desc: "우루과이 인구의 18%가 포르투갈어를 사용하고 자신을 브라질인으로 여깁니다. 우루과이 정부가 그들을 고국에서 단절시키거나 리우그란데로 추방하려고 하는 것은 진정한 불의입니다."
 BRA_condemn_the_uruguayan_paraguayan_alliance: "우루과이-파라과이 동맹 규탄"
 BRA_condemn_the_uruguayan_paraguayan_alliance_desc: "1862년부터 블랑코스는 카를로스 안토니오 로페스 휘하의 파라과이인들과 동맹을 맺으려고 시도해왔습니다. 그는 브라질과 아르헨티나가 자신들을 공격할 것이라고 믿고 방어 조약을 맺었지만, 파라과이의 야망이 우리 국가를 위협하면서 공세적인 성격을 띠게 되었습니다. 우리는 우루과이가 우리가 그 방어 동맹에 반대하며 그 위험성을 인지하고 있음을 확실히 알아야 합니다."
 BRA_challenge_the_blanco_government: "블랑코 정부에 이의 제기"
 BRA_challenge_the_blanco_government_desc: "우리가 블랑코 정부를 합법적이라고 인정하지 않으면 국내외에서 지지를 얻을 수 있습니다. 이것은 우리의 경쟁자들로부터 우루과이를 해방시키기 위한 통합된 시도를 정당화하는 이유 중 하나가 될 수 있습니다."
 BRA_support_the_colorado_party: "콜로라도 당과 동맹"
 BRA_support_the_colorado_party_desc: "우루과이의 붉은 자유주의자들인 콜로라도 당은 현 정부의 주요 야당이며, 우리가 그들과 좋은 관계를 유지하는 것은 오직 우리에게 도움이 될 것입니다."
 BRA_justify_our_interests_in_the_platine_region: "라플라타 지역에서의 우리의 개입 정당화"
 BRA_justify_our_interests_in_the_platine_region_desc: "브라질 국민들이 우리 제국이 우리의 이익을 확보하기 위해 라플라타 강과 주변 국가들에 대한 권력을 보장해야 한다는 것을 인정하도록 하는 것이 중요합니다."
 BRA_direct_intervention: "직접 개입"
 BRA_direct_intervention_desc: "우루과이인들에게 최후통첩을 보내고 국경의 콜로라도 반군을 지원합시다. 우리는 그 지역에서 우리의 이익을 확보하고 우루과이에서 새로운 동맹국을 만들어야 합니다."
 BRA_instigate_uruguayan_political_division: "우루과이 정치 분열 조장"
 BRA_instigate_uruguayan_political_division_desc: "우루과이는 혼란에 빠져 있으며, 야당인 콜로라도 당과 집권당인 블랑코스 당은 격렬한 정치적 분쟁을 벌이고 있습니다. 이것은 우리 국가가 놓쳐서는 안 될 기회입니다."
 BRA_denounce_the_uruguayan_government: "우루과이 정부 규탄"
 BRA_denounce_the_uruguayan_government_desc: "우루과이 정부는 우리 시민들을 부당하게 고립시키고 추방하고 있습니다. 이러한 불의는 바로잡혀야 합니다. 우루과이 내 브라질 시민들에 대한 대우를 규탄하는 것은 필수적입니다. 블랑코 정부를 합법적이라고 인정하지 않으면 외부 지원을 받을 수 있습니다. 이것은 우리 시민들의 자유를 보장하기 위한 통합된 시도를 정당화하는 이유 중 하나가 될 수 있습니다."
 BRA_declare_an_embargo_on_uruguay: "우루과이에 금수 조치 선언"
 BRA_declare_an_embargo_on_uruguay_desc: "수십 년 동안 브라질 은행가와 농장주들이 우루과이에 거주해 왔기 때문에, 우루과이 경제의 상당 부분이 그들과 연결되어 있습니다. 우루과이 경제를 안정시키고 브라질과의 관계를 개선하는 데 책임이 있었던 브라질인들은 우루과이 남작들로 자신들을 대체하려는 우루과이 정부의 적대감에 직면해 있습니다. 우루과이에 금수 조치를 적용하면 국가의 경제 안정이 급락하고 우루과이 정부는 브라질의 이익에 간섭하지 않는 법을 배울 것입니다."
 BRA_recruit_veterans_of_the_platinum_wars: "라플라타 전쟁 참전 용사 모집"
 BRA_recruit_veterans_of_the_platinum_wars_desc: "우루과이 인구의 18%는 포르투갈어를 사용하며 자신들을 브라질인으로 여깁니다. 그들 중 다수는 라플라타 전쟁의 참전 용사이며 해당 지역에 대한 전략적 지식을 가지고 있습니다. 그들을 군인으로 삼는 것은 어떤 전투에서도 필수적일 것입니다. 총포는 우리의 최우선 과제여야 합니다."
 BRA_reorganize_the_armed_forces: "군대 재편성"
 BRA_reorganize_the_armed_forces_desc: "라플라타 전쟁 이후, 우리의 평화와 번영의 시기 때문에 브라질의 군대는 개선되지 않았습니다. 우리는 현재 제국군의 상태를 고치기 위해 자원의 상당 부분을 집중해야 합니다."
 BRA_expand_the_imperial_navy: "제국 해군 확장"
 BRA_expand_the_imperial_navy_desc: "브라질 제국 해군은 전 세계에서 가장 강력한 해군 중 하나이며, 무시할 수 없는 세력으로 우리의 진정한 힘을 보여줍니다. 우리의 제독과 엔지니어들이 생산, 해군 기술 및 해군 훈련을 개선하기 위한 일부 과정을 완료한다면, 우리는 훨씬 더 높은 수준에 도달하고 가장 강력한 해군이 될 수 있습니다. 우리는 우리의 해안을 보호하고 세상에 우리의 진정한 힘을 보여줄 것입니다."
 BRA_improve_our_ports: "항구 개선"
 BRA_improve_our_ports_desc: "해안 함대는 더 많은 수의 함선을 수용할 수 있도록 더 크고 좋은 항구를 가져야 합니다. 리우데자네이루, 바이아, 상파울루에 새로운 기지가 건설되어 대서양 연안에서 제국의 해군력을 확보할 것입니다."
 BRA_innovate_the_arsenal_of_the_court: "궁정 무기고 혁신"
 BRA_innovate_the_arsenal_of_the_court_desc: "궁정 무기고는 우리 함대의 정예입니다. 이 제독들과 그들의 군대는 자부심과 영광으로 우리 황제를 섬기며, 아메리카에서 가장 강하고 잘 훈련된 해군력을 자랑합니다. 안타깝게도 우리의 함선들은 구식화되고 버려지고 있습니다. 혁신을 위한 진보가 이루어져야 하며, 18세기 후반의 낡은 훈련 방식은 새로운 방식으로 대체될 수 있습니다. 우리가 이룩할 성과에 대해 황제와 그의 궁정이 다시 한번 자랑스러워하기를!"
 BRA_build_new_dockyards: "새 조선소 건설"
 BRA_build_new_dockyards_desc: "새로운 조선소를 건설하는 것은 비용이 많이 들더라도 우리 해군의 성장에 도움이 될 것이며, 장기적으로 우리에게 쉽게 이익이 되고 산업 및 해군 역량을 향상시킬 수 있습니다. 리우데자네이루와 살바도르의 기능도 개선될 것입니다."
 BRA_southern_dockyards: "남부 조선소"
 BRA_southern_dockyards_desc: "남부의 우리 해군은 리우그란데 반란 중에 겪었던 문제들로 인해 상당히 낙후되어 있습니다. 우리는 우루과이와 아르헨티나를 둘러싼 남부 지역에서 우리의 이익을 보장하기 위해 그곳의 해군 주둔을 강화해야 합니다. 포르투알레그레에는 새로운 조선소가 생길 것이고, 우리 함대의 작전은 남부에서 더 자주 일어날 것입니다."
 BRA_improve_naval_quality: "해군 품질 개선"
 BRA_improve_naval_quality_desc: "우리의 순수한 수와 강점은 바다에 있었던 가장 위대한 제국들과 비교할 만하지만, 우리의 품질은 부족합니다. 우리 함대는 인프라를 크게 확장해야 하고 브라질 해군은 더 큰 높이에 도달해야 합니다!"
 BRA_improve_ship_production: "선박 생산 개선"
 BRA_improve_ship_production_desc: "우리나라는 여전히 현재의 위협보다 더 많이 생산할 수 있지만, 미래의 잠재적 라이벌의 선박 생산량에 맞설 수는 없습니다. 새로운 조선소는 강화되어 제국의 산업-해군 기업에 새로운 시작을 가져올 것입니다."
 BRA_pride_of_the_imperial_fleet: "제국 함대의 자존심"
 BRA_pride_of_the_imperial_fleet_desc: "제국 함대는 전 세계에서 가장 강력하고 잘 준비된 해군 중 하나로서 자랑스럽게 서 있습니다. 우리의 함대는 진정으로 무적이며 그대로 유지될 것입니다. 우리는 제국의 해안과 강을 보호하고, 우리의 이익을 지키며, 브라질과 그 국민에 대한 모든 위협을 제압할 것입니다. 제국 해군과 돔 페드로 2세에게 영광을! 우리의 제독들이 경계하고 우리의 바다가 브라질 국민이 번영하도록 항상 안전하기를."
 BRA_reorganize_the_imperial_army: "제국군 재편성"
 BRA_reorganize_the_imperial_army_desc: "우리의 영광스러운 제국군은 수많은 전투를 겪으며 이 반구에서 볼 수 있는 가장 훌륭한 장교들을 배출했습니다. 불행히도 일반 병사의 상황은 그렇게 영광스럽지 않습니다. 그들은 낮은 임금, 부적절한 보급, 그리고 열악한 훈련에 시달려야 합니다. 이제 이러한 단점을 고치기 위한 노력이 이루어질 것입니다."
 BRA_abolish_the_national_guard: "국가 방위군 폐지"
 BRA_abolish_the_national_guard_desc: "국가 방위군은 오랫동안 우리 군대에서 비상시 신속하게 동원될 수 있는 예비 민병대 병력으로 받아들여졌습니다. 이 병력은 수가 많지만 훈련이 제대로 되어 있지 않고 장비도 열악합니다. 유럽과 동등한 더 전문적인 군대를 만들고자 한다면 국가 방위군은 사라져야 합니다."
 BRA_recruit_british_advisors: "영국인 고문단 모집"
 BRA_recruit_british_advisors_desc: "영국 군대는 전 세계에서 가장 강력하고 현대화된 군대 중 하나입니다. 우리 사령관들은 그들의 지도에서 한두 가지를 확실히 배울 수 있을 것입니다."
 BRA_review_our_tactics: "우리의 전술 검토"
 BRA_review_our_tactics_desc: "우리의 최근 과거의 충돌에서 배울 점이 많습니다. 시스플라티나 전쟁의 군사적 실패부터 플라티나 전쟁의 위대한 승리까지, 우리 장군들은 검토할 많은 자료를 가지고 있으며, 많은 개선점을 실행해야 합니다."
 BRA_produce_new_weaponry: "신형 무기 생산"
 BRA_produce_new_weaponry_desc: "우리 군대 전력의 주요 단점 중 하나는 부적절한 장비입니다. 우리 군인들이 스스로를 방어하기에 충분한 무기를 생산하기 위해 총기 산업 현대화 노력을 더욱 강화해야 합니다."
 BRA_implement_a_new_army: "신규 군대 도입"
 BRA_implement_a_new_army_desc: "이제 제국군에게 위대한 새로운 시대를 열 때입니다. 우리 군대는 훈련을 받고 적절하게 장비를 갖추었으며, 우리 장군들은 새롭고 혁신적인 전술을 채택했습니다. 브라질의 군사력은 곧 전 세계의 부러움을 살 것입니다."
 BRA_keep_the_national_guard: "국가 방위군 유지"
 BRA_keep_the_national_guard_desc: "국가 방위군은 모든 측면의 공격으로부터 우리의 광대한 국경을 방어하는 데 필요한 수의 힘과 유연성을 제공합니다. 이 중요한 제국군 병력을 계속 지원하는 것은 가치 있는 노력일 것입니다."
 BRA_rely_on_the_military_academy: "사관학교에 의존"
 BRA_rely_on_the_military_academy_desc: "제국 사관학교(Imperial Academia Militar)는 식민지 시대부터 우리나라의 장교와 공학자를 훈련시키는 최고의 기관이었습니다. 더 나은 장교단을 만들고 싶다면 이 아카데미의 성공에 더 많이 투자해야 합니다."
 BRA_appease_the_coroneis: "코로넬들을 달래기"
 BRA_appease_the_coroneis_desc: "국가 방위군의 대령들은 우리 군대의 중요한 부분입니다. 그들에게 더 많은 권한을 부여하고 그들의 군대에 대한 효과적인 지도자가 되도록 훈련시키는 데 더 많은 자원을 투자해야 합니다."
 BRA_decentralize_the_army: "군대 분권화"
 BRA_decentralize_the_army_desc: "제국군은 두 개의 '선'으로 구성되어 있으며, 첫 번째는 전문 상비군으로, 두 번째는 국가 방위군과 같은 민병대로 구성되어 있습니다. 우리의 위대한 국가의 규모와 현대전의 새로운 기동성을 고려할 때, 제2선에서 발견되는 유연성에 맞추기 위해 제1선의 더 큰 분권화를 허용해야 합니다."
 BRA_quantity_over_quality: "질보다 양"
 BRA_quantity_over_quality_desc: "무기가 더 치명적으로 변함에 따라 군대는 전장에서 계속해서 더 많은 손실을 입을 것이라는 점이 우리 장군들의 주의를 끌었습니다. 장기적인 분쟁에서 살아남으려면 비록 전체 군대의 질을 희생하더라도 싸울 수 있는 숫자가 있어야 합니다."
 BRA_the_caxias_plan: "카시아스 계획"
 BRA_the_caxias_plan_desc: "황제의 부관인 카시아스 공작은 우리 군대를 괴롭히는 전선의 상황을 이해하는 유능한 지도자로 평가되었으며, 여러 번 우리 군대의 부진한 상태를 질책했습니다. 우리는 그의 재편성 아이디어를 실행에 옮길 수 있도록 그에게 우리 군대에 대한 더 큰 지휘권을 부여해야 합니다."
 BRA_improve_soldiers_medical_attention: "군인 의료 지원 개선"
 BRA_improve_soldiers_medical_attention_desc: "우리 군대에 대한 주요 위협 중 하나는 적의 총알뿐만 아니라 질병에서도 비롯됩니다. 보건 부대를 업그레이드하고 군대에 위생 관행을 가르침으로써 우리는 추가 전염병의 확산을 막을 수 있습니다."
 BRA_learn_from_prussian_tactics: "프로이센 전술로부터 배우기"
 BRA_learn_from_prussian_tactics_desc: "우리 군대의 효율성을 높이기 위해 우리 장교단은 프로이센에서 사용되는 것과 같은 새롭고 혁신적인 전술을 배워야 합니다. 우리 군대를 이 새로운 전술로 훈련시키고 더 현대적인 무기로 장비를 갖추게 함으로써 우리 군대가 승리를 달성하는 데 필요한 결정적인 우위를 제공할 것입니다."
 BRA_save_brazil_save_your_majesty: "브라질을 구원하고, 폐하를 구원하십시오!"
 BRA_save_brazil_save_your_majesty_desc: "지금 우리가 보는 애국심의 상승이 이와 같은 장기적인 작전의 전체 기간 동안 지속될 수 있다고 생각하는 것은 어리석은 일입니다. 우리는 군대의 사기를 높이기 위해 군대를 결집시키는 데 더 많은 노력을 기울여야 합니다."
 BRA_brave_and_reorganized_army: "용감하고 재편성된 군대"
 BRA_brave_and_reorganized_army_desc: "마르키스 카시아스의 도움으로, 우리의 신생 군대를 재편성하고 재장비하려는 우리의 노력은 마침내 달성되었습니다. 우리는 이제 파라과이와 싸울 준비가 완전히 되었습니다! 아베 임페리우!"
 BRA_victorious_empire: "승리한 제국"
 BRA_victorious_empire_desc: "승리! 우리 군대는 파라과이 침략자들을 상대로 의기양양하게 서 있고, 우리 제국은 다시 한번 리오 데 라 플라타 지역에서 그 위치를 재활성화했습니다! 하지만 그러한 위대한 승리는 엄청난 희생 없이는 얻을 수 없었고, 전후 질서의 새로운 복잡성..."
 BRA_destroyed_and_defeated: "파괴되고 패배하다"
 BRA_destroyed_and_defeated_desc: "재앙! 최선을 다했음에도 불구하고 파라과이 군대는 우리의 방어를 압도하고 전장에서 우리 군대를 짓밟았습니다. 파라과이는 과거에 많은 브라질 국민이 우리의 패권을 안전하게 지키기 위해 전쟁에서 죽었던 리오 데 라 플라타에 대한 우리의 지배권을 들어 올렸습니다. 그러한 패배는 앞으로 몇 년 동안 쓰라리게 느껴질 것입니다."
 BRA_the_paraguayan_war: "파라과이 전쟁"
 BRA_the_paraguayan_war_desc: "플라티나 지역에 대한 통제를 둘러싼 10년간의 분쟁 끝에, 1852년 양측의 이해관계 충돌과 블랑코스와의 후속 충돌은 마침내 파라과이와의 전쟁으로 절정에 달했습니다. 로페즈의 나라는 우리에게 진정한 위협이 아니지만, 우리는 파라과이 민족주의적이고 확장주의적인 폭정에 맞서는 이 전투 내내 우리 나라가 안전하고 단결하도록 해야 합니다."
 BRA_prepare_the_army: "군대 준비"
 BRA_prepare_the_army_desc: "우리 군대는 아르헨티나 연방 및 그들의 지방 동맹국과의 분쟁 이후로 전쟁을 준비하지 않았습니다. 마투 그로소에서 그들의 군대에 대한 승리를 달성하기 위해 이 전쟁을 위해 우리 군대를 강화하고 검토해야 합니다. 이 분쟁은 우리가 군대를 재편성할 것을 보장할 것입니다."
 BRA_reunite_the_imperial_committee: "제국 위원회 재결성"
 BRA_reunite_the_imperial_committee_desc: "우리의 남부 지방은 분쟁으로 인한 혼란으로 인해 혼란스러우며, 우리 장관들은 모여 새로운 전시 법률을 시행해야 합니다. 위원회는 포르투 알레그레에서 개최될 것이며, 우리 지방 장관들의 대부분은 우리 국가의 미래를 결정하기 위해 투표하고 우리는 제국에 대한 승리를 확보하기 위해 협력할 것입니다."
 BRA_rearm_rebellion_veterans: "반란 참전 용사 재무장"
 BRA_rearm_rebellion_veterans_desc: "돔 페드로 1세의 퇴위 이후의 시기는 우리 나라에게는 힘들었습니다. 그것은 끊임없는 혁명과 반란에 의해 분열되었고, 페드로 2세가 다시 영광을 가져올 때까지 제국을 무릎 꿇게 했습니다. 그 반란은 수천 명의 군인들에 의해 진압되었고, 그들은 이제 그들의 봉사가 필요하지 않았으므로 평화롭게 그들의 삶을 살고 있습니다. 우리는 파라과이 침공에 대한 방어를 돕기 위해 그 참전 용사들과 접촉해야 합니다."
 BRA_reorganize_the_high_command: "고위 사령부 재편성"
 BRA_reorganize_the_high_command_desc: "우리 군대의 고위 사령부는 계획과 혁신이 심각하게 부족합니다. 전쟁부 장관은 브라질의 모든 구석에 있는 우리 장군들과 대령들에게 조직과 새로운 훈련 방법을 가져올 위대한 개혁을 실행할 것입니다."
 BRA_begin_our_conscription: "징병 시작"
 BRA_begin_our_conscription_desc: "우리의 병력 상황이 위급해지고 신선한 군인에 대한 필요성이 매일 증가함에 따라, 우리는 전국적으로 징병 노력을 시작해야 합니다. 우리는 우리가 얻을 수 있는 것으로 군대를 강화하고 느린 성장을 통해 아메리카에서 가장 강력하고 가장 큰 지상군 중 하나를 만들 것입니다. 우리는 파라과이군을 분쇄할 것입니다!"
 BRA_recruit_slaves_to_fight: "전투를 위해 노예 모집"
 BRA_recruit_slaves_to_fight_desc: "우리의 새로운 징병법이 시행되면서, 의무적인 군사 모집은 북동부와 남동부의 과두 정치들에 의해 잘 받아들여지지 않았습니다. 우리는 '대체자'를 구매함으로써 엘리트들을 귀찮게 하지 않고 더 많은 군인을 얻을 수 있습니다. 그들의 노예들을 새로 구성된 대대에서 그들의 자리에 싸우게 함으로써 파라과이의 침입에 대한 방어와 모든 비용을 들여 반격하는 데 유용할 것입니다."
 BRA_convoke_the_national_guard: "국가 방위군 소집"
 BRA_convoke_the_national_guard_desc: "대령들의 민병대에 의해 만들어진 우리의 국가 방위군은 여전히 우리 나라 전역에 퍼져 있습니다. 우리는 그들 중 남은 것을 의회에 소집하고 그들을 모집하여 우리 군대의 한 부서로 통합해야 합니다. 우리가 코로넬들의 무기, 자원 및 인력을 사용한다면 브라질의 도시들은 침략으로부터 보호될 것입니다."
 BRA_recruit_the_police_corps: "경찰 모집"
 BRA_recruit_the_police_corps_desc: "우리는 우리나라에서 군사 능력을 가진 모든 병력을 모아야 합니다. 경찰은 그들 중 하나이며 그들도 우리 전장으로 보내질 것입니다. 그들의 자리에, 우리는 전투에 사용되지 않을 군대의 남은 예비군으로부터 새로운 경비병을 배치할 것입니다. 훈련된 경찰은 우리의 가장 잘 준비된 장군들에 의해 잘 훈련된다면 효과적임을 증명할 수 있습니다."
 BRA_voluntarios_da_patria_focus: "오스 볼룬타리오스 다 파트리아"
 BRA_voluntarios_da_patria_focus_desc: "우리는 군대의 병력 수, 특히 제2선 병력 수를 늘리기 위해 우리나라를 휩쓴 애국심의 물결을 이용해야 합니다. 우리는 모든 지방이 우리에게 전쟁을 위한 정확한 수의 자원 봉사자를 넘겨주도록 강제할 것입니다. 우리는 큰 부를 가진 모든 사람이 자원, 장비 및 노예를 우리에게 기부하도록 요구할 것입니다. 원주민부터 백인까지, 브라질의 모든 남자들이 파라과이의 위협을 물리치는 한 가지 목표를 위해 단결할 것입니다. 이 힘과 단결의 순간이 역사 내내 기억되기를!"
 URG_colorado_blanco_war: "콜로라도-블랑코 내전"
 BRA_olinda_1857: "마르키스 데 올린다의 재임"
 BRA_olinda_1857_desc: "마르키스 데 올린다, 페드로 데 아라우조 리마는 돔 페드로 2세 황제에 의해 장관 위원회 의장 직위에 임명되었습니다."
 BRA_1857_mixed_cabinet: "양측의 내각"
 BRA_1857_mixed_cabinet_desc: "마르키스 데 올린다, 페드로 데 아라우조 리마는 보수적이고 자유주의적인 장관들로 구성된 혼합 내각을 임명함으로써 이른바 화해 정책을 계속하기로 선택했습니다. 이것은 그의 재임에 대한 보수당의 지지를 감소시킵니다."
 BRA_1857_conservative_cabinet: "보수적 내각"
 BRA_1857_conservative_cabinet_desc: "마르키스 데 올린다, 페드로 데 아라우조 리마는 전체가 보수적인 장관들로 구성된 내각을 임명함으로써 보수파와 자유파 사이의 이른바 화해 정책을 깨기로 결정했습니다. 이것은 그의 재임에 대한 보수당의 지지를 증가시킵니다."
 BRA_1857_government_program_conciliatory: "화해 내각의 법령"
 BRA_1857_government_program_conciliatory_desc: "제국의 총회에서의 취임식 동안 화해 내각에 의해 제안된 개혁들은 시작되어야 합니다."
 BRA_1857_olinda_propose_acts: "마르키스 데 올린다의 법령"
 BRA_1857_olinda_propose_acts_desc: "장관 위원회 의장은 브라질 제국을 위한 개혁을 제안합니다."
 BRA_1857_government_program_conservative: "보수 내각의 법령"
 BRA_1857_government_program_conservative_desc: "제국의 총회에서의 취임식 동안 보수 내각에 의해 제안된 개혁들은 시작되어야 합니다."
 BRA_1857_medical_school_policy: "의과대학 규제 법안"
 BRA_1857_medical_school_policy_desc: "성모 자비 병원에서 일하는 의료 전문가 수를 늘리기 위한 목적으로, 의과대학 및 학부 법규의 보충 규정 제280조와 제292조를 수정하여 4학년, 5학년, 6학년 학생들이 인턴 공석 경쟁에서 승인된 후 의학을 실습할 수 있도록 하는 법안이 제안됩니다. 그리고 제국의 모든 성모 자비 병원에서 인턴으로 지정된 모든 기능을 수행할 수 있도록 합니다."
 BRA_1857_british_money: "공공 기관에서의 영국 화폐"
 BRA_1857_british_money_desc: "이 법안은 제국의 공공 기관들이 영국의 주권 화폐를 수령하는 것을 허용할 것을 제안합니다."
 BRA_1857_livestock_regulation: "가축 규제 법안"
 BRA_1857_livestock_regulation_desc: "이 법안은 법원의 도축장에서 가축을 규제할 것을 제안합니다."
 BRA_1857_courts_police_force: "법원 경찰력 규제 법안"
 BRA_1857_courts_police_force_desc: "이 법안은 법원 경찰력의 규율과 조직을 규제할 것을 제안합니다."
 BRA_1857_friendship_treaty_with_ottoman: "오스만 제국과의 우호 조약"
 BRA_1857_friendship_treaty_with_ottoman_desc: "이 법안은 브라질 제국과 오스만 제국 사이에 우호 조약을 체결할 것을 제안합니다."
 BRA_1857_trade_treaty_with_uruguay: "우루과이와의 무역 조약"
 BRA_1857_trade_treaty_with_uruguay_desc: "브라질과 우루과이 간의 무역 조약 법안."
 BRA_1857_disputes_with_UK: "영국과의 분쟁 해결"
 BRA_1857_disputes_with_UK_desc: "이 법안은 브라질 제국과 영국 간의 분쟁을 해결할 것을 제안합니다."
 BRA_1857_encourage_immigration: "이민 장려 법안"
 BRA_1857_encourage_immigration_desc: "이 법안은 유용하고 예의 바른 정착민의 이민을 장려하고자 합니다. 그들은 우리 농업에 매우 중요할 수 있습니다."
 BRA_1857_rethink_the_taxes: "세금 재고"
 BRA_1857_rethink_the_taxes_desc: "이 법안은 식료품 가격의 비정상적인 상승이 덜 부유한 계층에 막대한 고통을 야기하고 있으므로 관세 수수료를 재검토할 것을 제안합니다."
 BRA_1857_reform_mortgage_system: "토지 담보 법안"
 BRA_1857_reform_mortgage_system_desc: "이 법안은 농업의 미래에 즉각적인 영향을 미칠 영토 신용의 기초를 촉진할 것을 제안합니다."
 BRA_1857_promotion_naval_officers: "해군 장교 승진 법안"
 BRA_1857_promotion_naval_officers_desc: "이 법안은 해군 장교 승진을 위한 법률 제정을 제안합니다."
 BRA_1857_improve_criminal_law: "형법 개선 법안"
 BRA_1857_improve_criminal_law_desc: "이 법안은 신속한 처벌과 재판의 정의를 더 보장하는 형사 및 절차 법률을 개선할 것을 제안합니다."
 BRA_1857_improve_military_discipline: "군 규율 개선 법안"
 BRA_1857_improve_military_discipline_desc: "이 법안은 육군과 해군의 규율 개선을 제안합니다."
 BRA_1857_recruitment_regulation: "모집 규제 법안"
 BRA_1857_recruitment_regulation_desc: "이 법안은 모집을 규제하는 조항을 가장 편리한 대로 수정할 필요성을 제안합니다."
 BRA_1857_minning_gold: "금 채굴"
 BRA_1857_minning_gold_desc: "과거에 미나스 제라이스 주는 거대한 금광이었습니다. 금을 찾기 위해 그 지방의 광업에 투자해야 합니다."
 BRA_1857_national_bank_monopoly: "국립 은행 독점"
 BRA_1857_ban_slave_trade: "노예 무역 금지법 강화"
 BRA_1857_ban_slave_trade_desc: "브라질의 국제 노예 무역을 금지한 에우제비우 데 케이로스 법은 강화되어야 하며, 특정 조항의 수정은 그 효과를 증가시키고 국제 노예 무역과의 싸움에 도움이 될 것입니다."
 BRA_1857_commerce_regulation: "상법 규제 법안"
 BRA_1857_commerce_regulation_desc: "상법의 일부 조항을 변경하면 브라질 제국 경제에 상당한 개선을 가져올 수 있습니다."
 BRA_1857_protectionist_fees: "무역 및 산업 보호 수수료 법안"
 BRA_1857_protectionist_fees_desc: "산업 생산을 늘리기 위해 알베스 브랑코 법은 브라질 제국 내에 이미 존재하는 특정 제품의 수입에 세금을 부과합니다. 이 법은 브라질 제국 산업화의 시작을 담당하고 있으며, 수입 제품으로부터 국가 생산을 더욱 보호하기 위해 수정되어야 합니다."
 BRA_1857_lands_law: "토지법 강화"
 BRA_1857_lands_law_desc: "토지법은 브라질 제국에서 사유 재산에 대해 조직하려는 첫 번째 시도였습니다. 이 법의 개정은 서부의 토지 식민지화와 노동력 증가에 도움이 될 수 있습니다."
 BRA_1857_navy_promotion: "해군 장교 승진 법안"
 BRA_1857_navy_promotion_desc: "브라질 제국 함대는 해군 장교들의 승진을 위한 공정한 법률을 필요로 합니다."
 BRA_1857_military_reform: "군사 개혁"
 BRA_1857_military_reform_desc: "브라질 제국군은 개혁을 겪어야 합니다. 개혁된 군대는 전투에서 더 효과적일 것입니다."
