l_korean:
 AST_gold_rush: "골드러시"
 AST_gold_rush_desc: "누가 2인치 깊이의 흙을 파는 것이 우리 골드러시의 시작이 될 줄 알았겠습니까. 전 세계의 사람들이 떼를 지어 몰려와 재산을 차지하기 위해 달려들고 있습니다. 하지만 여기에는 몇 가지 부작용도 따릅니다..."
 AST_minor_gold_rush: "소규모 골드러시"
 AST_minor_gold_rush_desc: "우리 땅에서 금광이 발견되었습니다! 이웃 지역에서 이민자들이 재산을 늘리기 위해 몰려오고 있으며, 우리 경제는 성장하고 있습니다."
 AST_Murray_darling_basin: "머레이-달링 분지"
 AST_Murray_darling_basin_desc: "퀸즐랜드 산맥에서 시작해 뉴사우스웨일스를 거쳐 빅토리아 국경을 따라 흐르다 사우스오스트레일리아로 흘러가는 일련의 강들입니다. 이 분지는 호주 농촌의 생명줄이기에, 다른 주들은 더 많은 수송량을 확보하기 위해 다투고 있습니다."
 AST_Protected_by_the_Royal_Navy_and_Army: "왕립 해군과 육군의 보호"
 AST_Protected_by_the_Royal_Navy_and_Army_desc: "우리의 모든 해안선과 방어선은 모국인 '대영제국'의 병력으로 완전히 유지되고 있으며, 덕분에 우리는 당분간은 우리 자신의 방위에 대해 걱정할 필요가 없습니다..."
 AST_Convict_Labour: "죄수 노동"
 AST_Convict_Labour_desc: "이 땅의 동쪽에 있는 다른 많은 식민지들처럼, 우리 식민지도 잉글랜드의 말썽꾼들, 즉 사람들이 '죄수'라고 부르는 자들의 뼈를 깎는 노고 위에 세워졌습니다. 우리는 필요할 때까지 계속해서 이들을 받아들여 식민지를 건설할 것입니다. 하지만 다른 식민지들은 우리의 무상 노동력 공급을 끊으려 하고 있으며, 영국...도 이에 대해 생각하고 있는 조짐을 보이고 있습니다."
 AST_eureka: "유레카 보루의 영향"
 AST_eureka_desc: "도입된 광부 면허세에 대한 1854년의 반란은, 대표권 없이 세금을 내야 하는 것에 대한 광부들의 저항으로 이어졌습니다. 이외에도 여러 요인이 겹쳐 우리는 무장 병력으로 광부들을 진압했습니다. 비록 우리가 승리했지만, 그 후유증은 광부들의 요구사항 다수가 수용되면서 우리에게 더 큰 타격을 주었습니다."
 AST_unexplored_lands: "미개척 지역"
 AST_unexplored_lands_desc: "우리 땅의 광대한 지역은 현재 미개척 상태입니다. 이는 우리가 소유권을 주장하는 땅의 많은 부분에 얼마나 많은 자원, 재화, 또는 잠재적인 도시 부지가 존재하는지 알 수 없음을 의미합니다."
 AST_highly_unexplored_lands: "매우 미개척된 지역"
 AST_highly_unexplored_lands_desc: "우리는 우리 해안선의 모양과 수도 주변 지역은 알고 있지만, 그 이후에는 전혀 아는 바가 없습니다. 그곳에 무엇이 있을지는 아무도 모릅니다. 우리는 무엇이 있는지 빠르게 알아내야 합니다."
 AST_Divided_Administration: "분할된 행정"
 AST_Divided_Administration_desc: "퀸즐랜드가 형성되면서 우리 행정은 이제 분할되었습니다. 이는 우리에게 매우 성가신 부담을 지우고 있습니다. 혼란이 나중에 너무 커지기 전에 이를 바로잡을 방법을 찾아야 합니다."
 AST_Brand_New_Government: "새로운 정부"
 AST_Brand_new_Government_desc: "우리의 형성에 관한 모든 멋진 일들을 마쳤으니, 이제 우리 앞에 놓인 조각들로 시스템을 구축해야 합니다. 또한 이제 우리가 원하는 대로 할 수 있기 때문에 여기저기에 우리만의 것들을 추가할 여지도 생겼습니다."
 AST_Squatter_Issue: "무단 거주자 문제"
 AST_Squatter_Issue_desc: "국유지에 불법으로 거주하는 무단 거주자, 부랑자, 성가신 사람들이 점점 더 큰 문제가 되고 있습니다. 최악의 경우... 그들은 우리 정부와 지역 주민들에게 영향력을 행사하기 시작했습니다. 이들이 우리를 내쫓기로 결정하기 전에 우리가 조치를 취하는 것이 가장 좋습니다."
 AST_aboriginal_tribes: "원주민 문제"
 AST_aboriginal_tribes_desc: "이 땅의 원주민들은, 더 좋게 말하자면... 술에 취했거나, 굶주렸거나, 죽어가고 있습니다. 질병 때문이거나, 그들의 '땅'이라고 불리는 곳에서 강제로 쫓겨났기 때문입니다. 이는 결국 우리 백성들을 향한 여러 공격 사례로 이어지고, 그 보복으로 일부 원주민 집단이 살해당하는 결과를 낳습니다. '문명화된' 세계에 합류한 사람들도 질병이나 알 수 없는 이유로 린치를 당하며 오래 버티지 못합니다. 전체적인 상황은 알려지지 않았으며, 오직 이 원주민들이 흔하게 살해당한다는 것만 알려져 있습니다. 많은 우리 백성들은 이 사건들을 막는 데 신경 쓰지 않고, 종종 동참하기도 합니다."
 AST_The_Stain: "오점"
 AST_The_Stain_desc: "12...12는 우리 섬에 살아남은 것으로 확인된 원주민들의 수입니다. 동족 부족민들을 몰살시킨 검은 전쟁에서 살아남은 그들은 이제 자신들의 궁극적인 멸종을 목격해야 합니다. 그러나 우리가 저지른 일... 4만 명 이상의 남녀를 죽인 기억은... 나중에 우리를 괴롭힐 것입니다... 지금으로서는... 그것은 우리가 벗어던질 수 없는 오점입니다."
 AST_The_48ers: "48년 혁명가들"
 AST_The_48ers_desc: "1848~49년의 실패한 혁명으로 인해 많은 혁명가들이 우리 작은 식민지에서 새로운 보금자리를 마련하게 되었습니다. 프로이센의 프리드리히 3세 왕의 분노를 피해 도망친 옛 루터교 신자들로 시작해, 이제는 많은 사람들이 대규모로 애들레이드 항구로 몰려오고 있습니다. 우리는 이 위대한 땅에서 유일한 자유 식민지를 건설하는 것을 돕기 위해 그들을 진심으로 환영했습니다."
 nsw_colonial_government.1.t: "2년 간의 테니스 경기"
 nsw_colonial_government.1.d: "지난 2년간은 찰스 쿠퍼와 헨리 파크스가 총리직에서 사임하거나 강제로 물러나는, 정치 테니스 경기와 같은 상황이 반복되었습니다. 또다시 이런 일이 일어났습니다... 결과적으로 찰스 쿠퍼가 당분간 총리직에 복귀하게 되었습니다."
 nsw_colonial_government.1.a: "15-30"
 britishaustralia.1.t: "퀸즐랜드의 왕실 재가"
 britishaustralia.1.d: "퀸즐랜드는 1851년부터 [NSW.GetName]으로부터의 분리를 요청해왔습니다. 오늘 마침내 왕실 재가가 내려졌습니다."
 britishaustralia.1.a: "특허장에 서명"
 britishaustralia.2.t: "서부 확장"
 britishaustralia.2.d: ""
 britishaustralia.2.a: "특허장에 서명"
 britishaustralia.3.t: "노던 준주 합병"
 britishaustralia.3.d: "노던 준주는 텅 비어 있고 [NSW.GetName]으로부터 떨어져 있습니다. 우리가 그곳을 장악하고 직접 정착합시다."
 britishaustralia.3.a: "더 많은 땅은 좋은 것이다"