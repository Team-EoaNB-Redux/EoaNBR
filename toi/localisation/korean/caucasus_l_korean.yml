l_english:
 CAU_fighters: "카프카스 가자와트"
 CAU_fighters_desc: "가즈와(복수형 가자와트)는 비무슬림에 대한 전투 또는 습격을 뜻합니다; 카프카스 사람들은 러시아의 침략에 저항하기 위해 이슬람 아래 단결했습니다. 그들은 체르케스와 다게스탄의 산악 지형에서 특히 효과적인 비정규전을 통해 그렇게 합니다."
 CAU_muridism: "무리디즘"
 CAU_muridism_desc: "무리디즘은 1820년대부터 1860년대까지 북카프카스인들의 정치-군사 이데올로기였습니다. 이는 러시아 침략자들에 맞서 자유를 위한 성전에서 모든 카프카스 무슬림을 통합하는 것을 목표로 했습니다(따라서 카프카스에 존재했던 다양한 이슬람 학파로 인한 분열을 제거). 무리디즘은 이슬람 신앙에 깊이 뿌리를 두고 있었으며 현대적이고 효율적이며 통일된 중앙집권적 국가를 건설하는 데 사용되었습니다. 이는 게임 내에서 국가적 이념과 법률로 나타납니다."
 CAU_fierce_resistance: "격렬한 저항"
 CAU_fierce_resistance_weak: "격렬한 저항"
 CAU_nomadic_artillery: "치고 빠지기"
 CAU_nomadic_artillery_desc: "차르 군대에게 탈리그의 혁신은 완전히 예상 밖이었습니다. 탈리그의 포병대는 사실상 파악하기 힘들었습니다: 차르 군대에 대고 몇 발의 포탄을 쏜 후, 그는 말로 끄는 마차를 타고 재빨리 다른 장소로 이동하여 그곳에서 다시 러시아군에게 피해를 입혔습니다. 이것은 주기적으로 반복되었습니다. 총소리를 듣고 달려온 용기병과 코사크병은 현장에서 포병대를 찾지 못했습니다. 러시아인들은 산악인들의 이 전술을 '유목 포병'이라고 불렀습니다."
 CAU_supply_node_nerf: "지역 지원에 대한 의존"
 CIR_Unite_Tribes: "체르케스 부족 통합"
 CIR_Seek_Help_UK: "영국 지원 요청"
 CIR_Seek_Help_OTO: "오스만 지원 요청"
 CIR_Surrender_To_RUS: "러시아에 항복"
 CIR_nomadic_artillery_tactics: "탈리그의 무리대 부상"
 CIR_1860_REP: "체르케스 마즐리스"
 CIR_vic_Surrender_To_Russia_tt: "§Y우리는 자치권을 대가로 싸움을 포기할 것이다.§!"
 circassia.1.t: "체르케스인들이 도움을 간청하다."
 circassia.1.d: "러시아인들은 수십 년간 카프카스에서 싸워왔습니다. 하지만 오늘, ₩\"체르케스 독립 공화국₩"
 circassia.1.a: "우리가 그들을 어떤 식으로든 지원할 이유는 없다\""
 circassia.1.b: "우리는 무기와 보급품을 선적하여 조직할 것이다."
 circassia.2.t: "영국이 우리 지원을 거부하다."
 circassia.2.d: ""
 circassia.2.a: "시도해 볼 만했다."
 circassia.3.t: "영국이 우리 지원에 동의하다."
 circassia.3.d: ""
 circassia.3.a: "네, 좋습니다!"
 circassia.4.t: "체르케스인들이 도움을 간청하다."
 circassia.4.d: "러시아인들은 수십 년간 카프카스에서 싸워왔습니다. 하지만 오늘, ₩\"체르케스 독립 공화국₩"
 circassia.4.a: "우리는 체르케스 문제에 관한 특별위원회를 구성해야 한다\""
 circassia.4.b: "우리는 무기와 보급품을 선적하여 조직할 것이다."
 circassia.5.t: "오스만이 우리를 정치적으로 지원하다"
 circassia.5.d: ""
 circassia.5.a: "좋다"
 circassia.6.t: "오스만이 보급품을 보내다"
 circassia.6.d: ""
 circassia.6.a: "훌륭하다!"
 circassia.7.t: "체르케스인들이 항복을 제의하다"
 circassia.7.d: "마즐리스 정부가 평화를 협상하고 러시아 시민권을 받아들일 의사를 표했습니다. 우리는 케란디코 베르제그로부터 다음 편지를 받았습니다:\n\n\n \"이 땅들은 우리 것입니다. \n\n우리는 누구에게도 부당한 대우를 하지 않고 엄정한 정의로 우리를 다스릴 의도입니다.\n\n우리처럼 선량한 의도를 가진 민족은 당신네처럼 강대한 나라에게 영감을 주었어야 했습니다.\n\n우리는 우리나라를 공정하게 관리하기 위해 최선을 다하고 있으며, 동족을 공정하게 대하고 우리에게 오는 외국인의 생명과 재산을 존중하고자 합니다.\n\n명예롭다고 자처하는 당신네 나라처럼 강대한 국가의 임무가 한 민족을 파괴하는 것입니까?\n\n우리를 공정하게 대하고 우리의 재산과 모스크를 파괴하지 마십시오, 강대한 국가가 불필요하게 사람의 생명을 앗아가는 것은 수치스러운 일입니다.\n\n당신들은 우리가 야만적인 민족이라는 소문을 퍼뜨려 온 세상을 오도하고 있습니다; 하지만 우리는 당신들과 똑같은 인간입니다.\n\n우리의 피를 흘리려 하지 말고, 우리가 이곳에서 살게 해주십시오.\" "
 circassia.7.a: "우리는 전면 거부한다! 우리에게는 체르케스 땅이 필요하지, 체르케스인들은 필요 없다!"
 circassia.7.b: "이 전쟁은 너무 오래 계속되어 왔습니다 - 이제 끝냅시다"
 circassia.8.t: "러시아가 우리의 제안을 거부하다"
 circassia.8.d: "러시아 차르는 체르케스가 무조건적으로 러시아에 합병될 뿐만 아니라 체르케스인들이 떠날 것이라고 선언했습니다. 만약 체르케스 민족이 터키로 강제 이주하는 것을 받아들이지 않는다면, 러시아 장군들은 모든 체르케스인을 죽이는 것에 아무런 문제가 없다고 생각했습니다."
 circassia.8.a: "그렇다면 우리는 끝까지 싸울 것이다!"
 circassia.9.t: "평화 수립!"
 circassia.9.d: "러시아 차르가 평화에 동의했고 우리는 러시아의 자치 지역이 될 것입니다."
 circassia.9.a: "좋아!"
 circassia.10.t: "폴란드 의용병들이 체르케스에 도착하다"
 circassia.10.d: ""
 circassia.10.a: "훌륭하다!"
 imamate.1.t: "아후샨 아바카르-히야지의 무리가 우리 마을을 습격하다"
 imamate.1.d: "북부 다게스탄의 우리 마을 중 하나인 오흘리(요새화된 수비대가 주둔한)가 이마마트의 무리로부터 공격을 받았습니다. 늦은 저녁, 그들은 구브달란 타이마스라는 전사가 그의 동료 두 명과 함께 요새의 신호 봉화를 파괴하는 데 성공하여 기습 공격을 받았습니다. 이를 통해 무리가 그곳에 주둔한 우리 병사들을 자유롭게 교전하고 섬멸할 수 있게 되었습니다."
 imamate.1.a: "Damn it"
 imamate.2.t: "구브달란 타이마스가 전사하다"
 imamate.2.d: "격렬한 다게스탄 전사 구브달란 타이마스가 오늘 구니브 산 근처에서 전사했습니다. 그와 그의 무리가 인근 마을로 퇴각을 강요당한 후, 그와 그의 부대가 총검과 사브르를 들고 러시아 병사들에게 돌격했을 때 피비린내 나는 난투가 벌어졌습니다. 총 100명의 러시아 병사가 전사했지만, 모든 다게스탄 전사들은 전투에서 쓰러졌습니다."
 imamate.2.a: "문제 하나가 줄었다"
 imamate.3.t: "쿤타-하지 키시예프의 종교 가르침"
 imamate.3.d: "체첸 무슬림 신비주의자인 쿤타-하지가 최근 하즈(매년 메카로 순례)를 마치고 체첸으로 돌아왔습니다. 그는 지난 50년간 전쟁으로 피폐해진 지역에서 많은 영향력을 얻은 평화주의 및 소극적 저항의 주창자입니다. 그는 5,000명의 무리드(영적 지도 아래 영적 깨달음을 추구하는 초심자)의 추종을 얻는 데 성공했습니다. 문제는 우리가 이를 용인해야 하는가입니다."
 imamate.3.a: "그를 내버려 둬라"
 imamate.3.b: "그를 체포하라!"
 imamate.4.t: "단검 봉기"
 imamate.4.d: "우리가 키시예프를 투옥한 후, 의례용 단검만으로 무장한 3,000명의 무리드들이 그들의 스승을 풀어주려 했습니다. 반란군은 투마노프 장군의 정규군에 의해 해산되었고, 반군 160명이 사망했습니다."
 imamate.4.a: "허..."
 circassianews.1.t: "체르케스 구호 위원회"
 circassianews.1.d: "체르케스 구호 위원회는 러시아 제국에 의해 자행된 체르케스인들의 대탈출에 대응하여 최근 영국에서 결성되었습니다. 이스탄불 주재 영국 영사 판사의 아내인 혼비 부인이 난민들에게 식량과 의복을 전달하기 위해 진행했던 초기 모금 활동에서 영감을 받아, 위원회는 영국 국민들로부터 기부금을 모으기 시작했습니다. 위원회는 이스탄불 난민들에게 모금된 자금을 적절히 분배하기 위해 훗날 트라브존 검역관이 될 밀링엔 박사의 도움을 받았습니다. 밀링엔 박사는 난민들의 고통에 대한 자신의 보고가 더 많은 지원을 끌어내기를 바라며 본국의 언론에 정기적으로 소식을 전했습니다. 기부금은 '즉시 보내진 모든 파운드가 한 생명을 구할 수 있기' 때문에 들어오는 즉시 송금되었습니다."
 circassianews.1.a: "흥미롭군..."