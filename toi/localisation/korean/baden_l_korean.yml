 BAD_currency_reform: "비너 뮌츠페어트라크"
 BAD_currency_reform_desc: "1857년 빈 화폐 조약(Wiener Münzvertrag)은 독일 연방 내 단일 통화 확립을 향한 중요한 단계를 나타냅니다. 이 조약은 관세 동맹(Zollverein) 회원국, 리히텐슈타인 공국, 그리고 3월 혁명 이후 10년간 심각한 통화 위기를 겪었던 오스트리아 제국 사이에 체결되었습니다. 독일의 선도적인 경제 대국인 프로이센은 전통적인 은본위제를 따르는 통화를 주장했습니다. 이 조약은 교환 관리 및 비용을 줄임으로써 모든 독일 국가의 경제에 도움이 될 것입니다."
