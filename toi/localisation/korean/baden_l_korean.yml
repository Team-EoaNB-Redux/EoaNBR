 #Country Leader Descriptions
 BAD_FREDERICK_I_LEADER_DESC: "처음에 바덴 의회에 임명된 의원으로 재직했고, 그 후 형의 정신 건강 악화로 4년 동안 섭정으로 봉사한 후, 프리드리히 1세는 1856년에 바덴 대공이 되었습니다. 비록 그의 통치는 형의 사망으로 1858년까지 공식적으로 시작되지 않았지만 말입니다.\n\n프리드리히는 다소 자유주의적인 성향을 가지고 있으며, 중대한 사회 및 정치 개혁을 단행할 의지와 능력을 가지고 있습니다. 입헌 군주제의 지지자이며 전쟁에 나서는 것을 다소 꺼리는 만큼, 프리드리히 1세는 반군주제 정서가 고조되는 시대에 시민들의 삶을 개선하는 비교적 자비로운 군주가 될 수 있을 것입니다."
 BAD_FRANZ_VON_STENGEL_LEADER_DESC: "공무원 가문 출신인 프란츠 폰 슈텡엘 자신도 법률 인턴, 국무위원, 바덴 의회 의원으로서 공공 서비스에 종사했습니다. 최근에는 슈텡엘 내각의 수장으로서 바덴의 유사 총리 역할을 수행했습니다.\n\n바덴에게 자유화되는 시대에 카톨릭 신자이자 상대적인 보수주의자인 폰 슈텡엘은 기본적이고 비이념적인 개혁과 법률을 큰 어려움 없이 제정할 수 있을지 모르지만, 그의 친카톨릭 교회 의제에 대해서는 상당한 반대에 부딪힐 가능성이 높습니다."
 BAD_ANTON_VON_STABEL_LEADER_DESC: "신성 로마 제국 해체 직후 태어난 안톤 슈타벨의 어린 시절은 심각한 정치적, 군사적 혼란으로 점철되었습니다. 슈타벨은 정부 변호사이자 나중에 판사로서 매우 성공적인 공무원 경력을 시작했으며, 비교적 젊은 나이부터 법률 전문가의 계층에서 상승했습니다. 사법 보조관, 공공 검사, 대학 총장(총장) 겸 강사, 그리고 고등 법원 부총장으로 재직하는 동안 그는 해당 분야에서 높은 명성을 얻은 법률 전문가가 되었습니다.\n\n슈타벨은 1848년 혁명의 여파로 내무법무부 장관직을 수락했으며, 혁명에 대한 강경한 반동적 대응 요구에도 불구하고, 진보적인 개혁과 사법 현대화를 위한 성공적인 노력의 선두에 섰습니다. 1850년 단명했던 에르푸르트 의회에 선출된 후, 슈타벨은 란트슈탠데 부회장으로 임명되었고, 새로운 자유주의 바덴의 국가 원수가 될 때까지 그 직을 유지했습니다.\n\n이제 슈타벨은 바덴을 세계에서 가장 현대적인 법률 시스템을 갖춘 국가로 완전히 개혁하고, 일반적으로 바덴을 유럽에서 가장 자유로운 국가 중 하나로 만들 기회를 얻었습니다. 바라건대 전쟁이 그가 시작한 일을 방해하지 않기를 바랍니다..."
 
