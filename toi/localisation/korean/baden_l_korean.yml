 ### IDEAS ###
 BAD_russiancampaign: "1812년 러시아 원정"
 BAD_russiancampaign_desc: "러시아 원정(Campagne de Russia)은 나폴레옹의 러시아 침공으로, 프랑스군의 참패로 끝났습니다. 라인 동맹의 독일 국가인 바덴은 프랑스에 6,000명 이상의 병력을 제공했습니다."
