 badenevent.16.t: "부활절 선언"
 badenevent.16.a: "좋습니다."
 badenevent.1.t: "민족 문제"
 badenevent.1.d: "갈등 발생 시 바덴이 어느 독일 강대국 편에 설지, 아니면 중립을 지킬지 결정할 때가 왔습니다. \n§RThis decision will change which side you are on in the Seven Weeks War. Choose carefully!§!"
 badenevent.1.a: "프로이센 편에 서다"
 badenevent.1.b: "중립 유지"
 badenevent.1.c: "오스트리아 편에 서다"
 badenevent.2.t: "전쟁의 징후"
 badenevent.2.d: "독일 연방 내 오스트리아와 프로이센 간의 끊임없는 다툼이 곧 종지부를 찍을 수도 있습니다. 바덴은 마침내 두 세력 중 어느 편에 설지, 아니면 중립을 유지할지 결정해야 합니다."
