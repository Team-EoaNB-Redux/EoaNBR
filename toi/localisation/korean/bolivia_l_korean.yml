l_english:
 BOL_Jorge_Cordova_temp: "호르헤 코르도바"
 BOL_Jose_Maria_Linares_temp: "호세 마리아 리나레스"
 bolivia.1.t: "호세 리나레스의 반란!"
 bolivia.1.d: "호세 마리아 리나레스가 [BOL.GetName]의 대통령직을 차지하기 위해 반군을 소집했습니다. 천재이자 진정한 애국자인 리나레스는 볼리비아 민주 정부에서 부패를 몰아내고자 합니다. 현재 정부는 보호주의적이며, 성공 시 국제 투자와 외교를 위해 국가를 개방할 것입니다. \n\n전 세계는 누가 [BOL.GetName]의 대통령이 될지 기다리고 있습니다."
 bolivia.1.a: "대통령에게 작별을!"
 bolivia.1.b: "대통령은 우리의 지지를 받고 있습니다!"
 bolivia_civil_war.2.t: "호세 리나레스의 반란 종료!"
 bolivia_civil_war.2.d: "호세 리나레스의 반란이 대성공을 거두었습니다! 쿠데타 직후 열린 선거에서 호세 리나레스가 국민들의 선택을 받아 승리했습니다! 그는 정부의 부패를 척결하고 볼리비아의 민주주의를 회복하겠다고 약속했습니다. \n\n우리는 엘 프레지덴테가 그의 약속을 계속 지킬지 지켜볼 것입니다..."
 bolivia_civil_war.2.b: "호르헤 코르도바의 충성파가 남으면서 호세 리나레스의 반란은 진압되었습니다. 엘 프레지덴테가 우리와 좀 더 함께할 것 같습니다..."
 bolivia_civil_war.2.a: "엘 프레지덴테 만세!"
 bolivia.2.t: "호세 마리아 아차, 리나레스를 쿠데타!"
 bolivia.2.d: "장군이자 전 국방부 장관이었던 호세 마리아 아차가 루페르토 페르난데스 장관, 마누엘 산체스 대령과 함께 독재자 호세 마리아 리나레스에 대한 쿠데타를 조직했습니다. 카우디요는 정부를 조직하기 위해 임시 군사 평의회를 구성했습니다. 그는 새로운 선거, 모든 정치범에 대한 사면, 그리고 코차밤바를 위해 권력의 균형을 다시 맞추겠다고 약속했습니다."
 bolivia.2.a: "새로운 카우디요 만세!"
 bolivia.3.t: "페레스, 우리 대통령에 맞서 반란!"
 bolivia.3.d: "벨수와 같은 반란군을 진압하고 이전 정부를 지지했던 우리의 충성스러운 장군 그레고리오 페레스는 아차의 새 정부를 인정하지 않았습니다. 그는 라파스로 이동하여 도시의 지역적 지지를 얻고 1,000명의 병력을 모집하여 오루로로 이동하며 초기에 우리 군대를 격파했습니다. 절박한 시도 끝에 아차는 군사 평의회를 소집했고, 상황은 절망적으로 보였지만 멜가레호 장군이 나서서 산후안 평야에서 쉬운 전투로 그를 격파했습니다. 반역자는 전투 중에 처형되었습니다."
 bolivia.3.a: "반역자는 죽었다! 그 멜가레호는 위대한 장군이다."
 bolivia.4.t: "멜가레호, 아차를 쿠데타!"
 bolivia.4.d: "충성스럽고 승리한 장군 멜가레호는 아차의 건강 악화를 이용해 대통령을 투옥하고 라파스를 장악했습니다. 그는 아차 정부를 싫어했던 강력한 지주들과 벨수를 따르던 이전 카우디요들의 지지를 받고 있습니다. 멜가레호는 최고 권력을 잡고 많은 경쟁자들을 억압했습니다."
 bolivia.4.a: "멜가레호 만세!"
 bolivia.5.t: "수크레 반란"
 bolivia.5.d: "멜가레호의 독재가 서서히 정치인들에 대한 장악력을 잃자, 많은 반란군들이 입헌주의라는 하나의 대의 아래 단결했습니다. 정부를 비헌법적이라고 여겨 많은 반란이 일어났지만 쉽게 진압되었습니다. 여러 번의 작은 전투 끝에 제대로 훈련되지 않은 입헌주의자 군대는 도망쳐 벨수와 만났고, 벨수는 혁명을 선포하며 수크레에서 1,000명 이상의 무장 병력을 모았습니다. 두 선봉대는 라파스에서 만났고, 반란군은 밀려났지만 재정비하여 포토시의 대부분을 장악했고, 심지어 타리하까지 장악했으며, 입헌주의자인 알레호와 시릴로는 코차밤바를 점령하기 위한 투쟁을 시작했습니다."
 bolivia.5.a: "우리나라는 무너지지 않아야 한다! 멜가레호는 반란군을 진압할 것이다!"