 afr_regional_power_address_tribal_military_idea: "부족 군대 재편성"
 afr_regional_power_address_tribal_military_idea_desc: "[ROOT.GetName]은 군사 구조를 현대화하는 과정에 있으며, 이는 전통주의자들 사이에서 논란을 불러일으켰습니다. 이 기간 동안 [ROOT.GetName]의 군대는 무질서해지고 신병 훈련에 더 오랜 시간이 걸릴 것입니다."

 afr_regional_power_address_tribal_military_scripted_effect_tooltip: "\n\n§GMilitary Reform§!의 과정에서, §YCareer Officer§! 및 §YOld Guard§! 군 지도자들은 §Rdebate modernization choices§! 것입니다."

 eoanb_decision_Tribal_request_overlord_assistance_defensive: "[FROM.GetAdjective] 군사 지원 요청!"
 eoanb_decision_Tribal_request_overlord_assistance_defensive_desc: "우리는 이 절박한 시기에 우리의 종주국인 [FROM.GetName]에게 도움을 요청할 것입니다."

 afr_request_overlord_assistance_defensive: "우리는 [FROM.GetName]의 방어 전쟁에 참여할 것입니다!"
 afr_request_overlord_assistance.1.t: "[FROM.GetName]이(가) 군사 지원을 요청합니다!"
 afr_request_overlord_assistance.1.d: ""
 afr_request_overlord_assistance.1.a: "우리는 우리의 속국이 몰락하도록 내버려 둘 수 없다! 우리의 전사들을 동원하라!"
 afr_request_overlord_assistance.1.b: "우리는 그들의 국경에 도달할 방법이 없다."

 afr_request_overlord_assistance.2.t: "[FROM.GetName]이(가) 군사 지원을 보냅니다!"
 afr_request_overlord_assistance.2.d: ""
 afr_request_overlord_assistance.2.a: "상황이 우리에게 유리해졌군!"

 afr_request_overlord_assistance.3.t: "[FROM.GetName]이(가) 군사 지원을 거절합니다!"
