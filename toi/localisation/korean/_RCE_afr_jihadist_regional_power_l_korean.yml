 afr_integration_tribe_warning_idea: "부족 게릴라 전술"
 afr_integration_tribe_warning_idea_desc: "이 국가는 고향 곳곳에 함정을 설치했습니다. 공격자들은 조심해야 합니다."
 afr_integration_tribe_raid_supply_strong_idea: "보급 텐트 습격"
 afr_integration_tribe_raid_supply_weak_idea: "보급 텐트 습격"

 afr_integration_tribe_warning.1.t: "[FROM.GetName] 정찰병이 국경에서 붙잡혔다!"
 afr_integration_tribe_warning.1.d: "[FROM.GetName]은 강력한 지역 강국이며, 우리에 대한 공격을 계획하고 있는 것이 확인되었습니다. 붙잡힌 정찰병을 심문한 후, 우리는 그들의 계획에 대한 정보를 얻었습니다. 우리의 가장 현명한 군벌은 계획을 세웠고 공격 전에 그들의 군대를 파괴할 수 있다고 믿습니다. 남은 질문은 단 하나, 이 정보로 무엇을 해야 할까요?"
 afr_integration_tribe_warning.1.a: "숲 곳곳에 함정을 설치하라. 우리는 공격에 대비할 것이다."
 afr_integration_tribe_warning.1.b: "습격대를 보내, 훔칠 수 있는 모든 보급품을 훔쳐라!"
 afr_integration_tribe_warning.1.c: "정찰대를 보내, 그들의 군대 보급품을 독살하라!"

 afr_integration_tribe_raid_supply.1.t: "[FROM.GetName]이(가) 우리의 보급 텐트를 습격합니다!"
 afr_integration_tribe_raid_supply.1.d: "지난밤 우리 군사 캠프의 보급 텐트가 습격당했고, 습격대의 생존자들은 우리의 보급품을 가지고 달아났습니다."
 afr_integration_tribe_raid_supply.1.a: "우리의 방어는 꽤 잘 버텼고, 소량의 보급품만 도난당했습니다."
 afr_integration_tribe_raid_supply.1.b: "우리의 방어는 무능했다! 우리는 보급품에 막대한 손실을 입었다!"
 afr_integration_tribe_raid_supply.1.c: "우리의 방어는 성공적이었고, 대부분의 습격대가 죽었습니다."

 afr_integration_tribe_raid_supply.2.t: "우리 습격대가 돌아왔다!"
 afr_integration_tribe_raid_supply.2.d: "지난밤 우리의 전사들이 [FROM.GetName]의 보급 텐트를 습격했습니다. 습격대의 생존자들은 훔칠 수 있는 모든 보급품을 가지고 달아났습니다."
 afr_integration_tribe_raid_supply.2.a: "우리 습격대는 꽤 잘 버텼지만, 최소한의 보급품만 훔쳤습니다."
 afr_integration_tribe_raid_supply.2.b: "우리 습격대는 성공적이었다! 우리는 전리품을 우리의 비축량에 추가했다."
 afr_integration_tribe_raid_supply.2.c: "우리 습격대는 전멸했다!"

 afr_integration_tribe_poison_provisions.1.t: "[FROM.GetName]이(가) 우리의 보급품을 독살합니다!"
 afr_integration_tribe_poison_provisions.1.d: "지난밤 우리 군사 캠프가 방해를 받았습니다. [FROM.GetAdjective] 정찰병이 우리의 보급품을 독살하여 전사들이 죽었습니다."
 afr_integration_tribe_poison_provisions.1.a: "우리가 그들을 발견한 후 소수의 보급품만 독살당했습니다."
 afr_integration_tribe_poison_provisions.1.b: "우리 군사 캠프가 황폐해졌다! 정찰병들은 전혀 발견되지 않았다!"
 afr_integration_tribe_poison_provisions.1.c: "정찰병들은 우리의 보급품을 독살하기 전에 발견되었다."

 afr_integration_tribe_poison_provisions.2.t: "우리 정찰대가 돌아왔다!"
 afr_integration_tribe_poison_provisions.2.d: "지난밤 우리의 정찰병들이 [FROM.GetName]의 군사 캠프를 방해했습니다. 우리 정찰병들은 그들의 보급품을 독살하려 했고, 그 결과 [FROM.GetAdjective] 전사들이 죽었습니다."
 afr_integration_tribe_poison_provisions.2.a: "우리 정찰대는 그들의 전사들에게 소량의 사상자를 발생시켰다."
 afr_integration_tribe_poison_provisions.2.b: "우리 정찰대는 성공적이었다! 그들에게 엄청난 사상자를 안겼다."
 afr_integration_tribe_poison_provisions.2.c: "우리 정찰대는 전멸했다!"

 afr_caliphate_integration_tribe.1.t: "[FROM.GetName]이(가) 복속을 압박합니다!"
 afr_caliphate_integration_tribe.1.d: "[FROM.GetName]은 강력한 지역 강국이며, 진정한 이슬람 칼리프국을 건설하려 합니다. 유혈 사태와 전쟁을 피하기 위해, [FROM.GetName]은 [ROOT.GetName]에 제국 가입을 공식적으로 요청했습니다. 우리가 그들의 속국이 되면 생존이 보장될 것입니다. 남은 질문은 단 하나, 우리의 독립을 잃을 가치가 있을까요?"
 afr_caliphate_integration_tribe.1.a: "협상을 잘했군, 우리가 그들의 속국이 되겠다고 전하시오."
 afr_caliphate_integration_tribe.1.b: "우리는 독립을 위해 싸울 것이다, 우리는 누구의 속국도 아니다!"
 afr_caliphate_integration_tribe.1.c: "이 신성한 통합을 축하하자! 알라후 아크바르!"
 afr_caliphate_integration_tribe.1.e: "우리는 다른 이의 칼리프국에 통합되지 않을 것이다!"

 afr_caliphate_integration_tribe.2.t: "[FROM.GetName]이(가) 우리의 요구를 거부합니다!"
 afr_caliphate_integration_tribe.2.d: "[FROM.GetName]은 복속을 거부하여 평화적 통합을 거절했습니다. 우리는 그들과 전쟁을 벌여 우리의 요구에 굴복시키거나, 전쟁을 피하기 위해 우리의 요구를 철회할 수 있습니다."
 afr_caliphate_integration_tribe.2.a: "그들은 우리의 요구에 굴복할 것이다! 전쟁을 준비하라!"
 afr_caliphate_integration_tribe.2.b: "우리는 전쟁을 추구할 수 없다. 우리의 요구를 철회하라."

 afr_caliphate_integration_tribe.3.t: "[FROM.GetName]이(가) 복속 요구를 철회했습니다!"
 afr_caliphate_integration_tribe.3.d: "[FROM.GetName]은 우리를 복속시키려던 초기 요구에서 물러났습니다."
 afr_caliphate_integration_tribe.3.a: "훌륭하다!"

 afr_caliphate_integration_tribe.5.t: "[FROM.GetName] 침공 준비 완료!"
 afr_caliphate_integration_tribe.5.d: "[ROOT.GetAdjective] 제국의 군대가 준비되었습니다. 이제 그들은 [ROOT.GetLeader]의 침공 명령을 기다리고 있습니다."
 afr_caliphate_integration_tribe.5.a: "침공을 개시하라!"

 afr_caliphate_integration_kingdom.1.t: "[FROM.GetName]이(가) 복속을 압박합니다!"
 afr_caliphate_integration_kingdom.1.d: "[FROM.GetName]은 강력한 지역 강국이며, 진정한 이슬람 칼리프국을 건설하려 합니다. 유혈 사태와 전쟁을 피하기 위해, [FROM.GetName]은 [ROOT.GetName]에 제국 가입을 공식적으로 요청했습니다. 우리가 그들의 속국이 되면 생존이 보장될 것입니다. 남은 질문은 단 하나, 우리의 독립을 잃을 가치가 있을까요?"
