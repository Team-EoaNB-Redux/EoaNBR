 CSA_civil_war_printing_money_desc: "현재 자금이 많이 부족하지만, 우리 고유의 통화를 통제하고 있으니 전쟁 비용을 지불하기 위해 더 많은 돈을 인쇄합시다."
 CSA_military_whispers_of_iron: "철선에 대한 속삭임"
 CSA_military_whispers_of_iron_desc: "철로 된 함선이라는 아이디어에 대한 속삭임이 돌고 있습니다. 연방의 함선 수를 따라잡을 수는 없겠지만, 이 아이디어를 받아들인다면 연방 해군의 허리를 부러뜨릴 만큼 충분한 이점을 얻을 수 있을 것입니다."
 CSA_civil_war_navy: "해군 문제 해결"
 CSA_civil_war_navy_desc: "양키들과 싸우기 위해서는 우리 스스로를 방어할 강력한 해군을 보유해야 합니다. 북부인들이 더 많은 함선을 보유할 수 있으므로, 승리를 확보하기 위해 더 나은 기술을 받아들여야 합니다!"
