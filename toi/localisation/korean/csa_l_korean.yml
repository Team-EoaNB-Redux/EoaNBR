 CSA_naval_budget: "남부 연합 해군 예산"
 csa.1.t: "남부 연합을 위한 지원병!"
 csa.1.d: "우리가 주로부터 독립을 선언함에 따라, 연방의 많은 병사들이 우리에게 전향하여 우리의 숭고한 대의에 합류했습니다!"
 csa.1.a: "대의를 위하여!"
 csa.10.t: "새로운 지원병의 등장!"
 csa.10.d: "우리가 북부와 전쟁 중이므로, 우리 국가를 방어하기 위해 더 많은 지원병을 우리 군대에 입대시켜야 합니다!"
 csa.11.t: "국기 국민투표"
 csa.11.d: "우리가 새로운 국가를 건설함에 따라, 모든 문명국은 무기를 들고 경례할 국기를 갖는 것이 관례입니다. 그러나 우리가 가진 유일한 국기는 웨스트 플로리다 공화국에서 사용되었고 미시시피가 남부 연합에 가입하면서 처음 채택된 '보니 블루'입니다. 하지만 파란색은 안 됩니다. 그것은 양키들의 색입니다. 그래서 우리 스스로를 확립하기 위해 노력하면서, 우리 인민들이 어떤 깃발을 택해야 할지 선택하기 위한 국민투표를 실시했습니다."
 csa.11.a: "별과 줄무늬 깃발!"
 csa.11.b: "전투 깃발!"
 csa.11.c: "피 묻은 깃발!"
 csa.11.e: "실은… 보니 블루가 좋습니다!"
 csa.12.t: "쿠데타에 대한 반응"
 csa.12.d: "정당하게 선출된 정부의 불안정한 전복에 대한 반응으로, 여러 주들이 남부 연합에 가입하기로 결정했습니다!"
 csa.12.a: "젠장!"
 csa.12.b: "환영합니다!"
 csa.13.t: "남부 연합의 운명"
 csa.13.d: "우리는 새로운 정부를 만들기 위한 첫 걸음을 내딛고 있습니다. 더 이상 우리는 사람들의 꿈속의 국가가 아닙니다. 우리는 여기에 있고, 지금 존재합니다. 우리는 우리가 누구이며, 어떤 국가가 될지 정해야 합니다."
 csa.13.a: "우리는 우리의 약속을 이행해야 합니다!"
 csa.13.b: "우리는 연합 규약에서 배워야 합니다!"
 csa.13.c: "우리는 강력한 중앙 권력을 확립해야 합니다!"
 csa.14.t: "탈퇴권"
 csa.14.d: "탈퇴는 우리 존재의 이유입니다. 그러나 우리 국가 내에서도 탈퇴가 발생할 수 있습니다. 그러한 일이 발생하지 않도록 노력해야 할까요?"
 csa.14.a: "탈퇴를 합법화하십시오!"
 csa.14.b: "탈퇴를 불법화하십시오!"
 csa.15.t: "지주 엘리트에 대하여"
 csa.15.d: "우리의 힘, 문화, 정체성의 대부분은 면화 농장에서 나옵니다. 이 농장들의 지주 엘리트들은 우리 정부 내에서 많은 권력을 가지고 있으며, 일부는 그들의 권력이 약화되기를 바랍니다."
 csa.15.a: "추가 자율권을 부여하십시오!"
 csa.15.b: "지금도 괜찮습니다."
 csa.15.c: "일부 자율권을 빼앗으십시오!"
 csa.16.t: "상업 조항"
 csa.16.d: "우리의 탈퇴에서 중요한 부분은 우리 자신의 경제 정책을 통제할 수 있는 능력을 유지하는 것이었습니다. 이는 양키들에 의해 방해받아 왔습니다. 우리는 이제 외국과의 무역에 있어서 우리만의 길을 선택할 기회를 얻었습니다."
 csa.16.a: "자유 무역을 확대하십시오!"
 csa.16.b: "상품 수출에 집중하십시오!"
 csa.16.c: "무역 규제를 시행하십시오!"
 csa.17.t: "노예 무역"
 csa.17.d: "노예 제도는 우리 사회에서 중요합니다. 비록 영국과 프랑스를 화나게 하지만, 우리의 생존을 위해 필수적입니다. 우리는 주 간 노예 무역을 어떻게 처리해야 할지 결정해야 합니다."
 csa.17.a: "자유 방임!"
 csa.17.b: "개입주의!"
 csa.17.c: "규제하십시오!"
 csa.18.t: "과세 문제"
 csa.18.d: "세금은 국가의 기관차와 같습니다. 세금 없이는 어떤 국가도 지속될 수 없습니다. 그러나 일부는 연합 규약 하에서 주가 자체적으로 과세 정책을 통제했던 옛날로 돌아가자고 주장하고 있습니다."
 csa.18.a: "주가 과세를 처리하도록 하십시오!"
 csa.18.b: "주 및 연방세 모두 부과"
 csa.18.c: "모든 과세는 연방 소관입니다!"
 csa.19.t: "주 경계 설정"
 csa.19.d: "우리는 탈중앙화의 길을 걸어왔지만, 얼마나 탈중앙화되어야 할까요? 많은 이들은 모든 주가 자율성을 가져야 한다고 주장하지만, 일부는 너무 탈중앙화되지 않도록 몇몇 주들을 통합할 것을 요청합니다."
 csa.19.a: "주 그 자체"
 csa.19.b: "몇몇 주들을 묶으십시오!"
 csa.20.t: "남부 연합의 탈중앙화"
 csa.20.d: "우리가 마쳤습니다. 오늘로 우리의 탈중앙화 개혁은 끝납니다. 남부 연합은 그 이름을 완수했습니다."
 csa.20.a: "탈중앙화!"
 csa.20.b: "탈중앙화!"
 csa.21.t: "[GetYear]년 선거"
 csa.21.d: "드디어 우리 위대한 국가의 첫 진정한 선거가 다가왔습니다. 세 명의 후보가 맞붙었습니다. 첫 번째는 악명 높은 1860년 선거에서 승리를 도둑맞았던 존 브레킨리지입니다. 그에 맞서는 인물은 전직 장교이자 데이비스의 거침없는 비판가인 로버트 툼스입니다. \n \n비록 본인은 원하지 않았지만, 로버트 E. 리가 대통령으로 선출될 가능성도 있습니다. 많은 이들은 그를 우리 국가의 새로운 워싱턴으로 보고 있으며, 그의 첫 공직 거절은 이를 더욱 증명합니다. 역사는 다시 반복될까요? \n \n그럼에도 불구하고, 이제 선택은 이루어졌습니다…"
 csa.21.d_unitarian: "드디어 우리 위대한 국가의 첫 진정한 선거가 다가왔습니다. 두 명의 후보가 맞붙었습니다. 첫 번째는 악명 높은 1860년 선거에서 승리를 도둑맞았던 존 브레킨리지입니다. 그에 맞서는 인물은 전직 장교이자 데이비스의 거침없는 비판가인 로버트 툼스입니다. \n \n일부에서는 그에게 연락을 시도했지만, 로버트 E. 리는 주가 겪고 있는 중앙집권화 경향으로 인해 대통령으로 선출되는 것을 완강히 거부했습니다."
 csa.21.a: "데이비스를 재선시키십시오!"
 csa.21.b: "브레킨리지를 선출하십시오!"
 csa.21.c: "툼스를 선출하십시오!"
 csa.21.e: "리를 선출하십시오!"
 csa.22.t: "휘그당의 부활"
 csa.22.d: "남부 연합이 일당 독재 민주주의 국가라는 생각은 더 이상 없습니다. 관에서 나와 휘그당이 최근 부활을 목격했습니다. 기본적으로 '우리는 민주당이 아니다'라는 당이었던 휘그당은 1856년 선거에서 공화당에 밀려 사라졌습니다. 이제, 그들은 다시 돌아오는 것처럼 보이며, 보수적인 민주당보다 더 자유주의적인 입장을 취하고 있습니다."
 csa.22.a: "흥미롭군요…"
 csa.23.t: "우리의 당명"
 csa.23.d: "일부 민주당원들은 우리의 독립 투쟁에 참여하기를 거부했습니다. 스티븐 A. 더글러스가 이끄는 북부 민주당원들은 우리 당을 배신했습니다. 이제 그들은 진정한 민주당이라고 주장합니다. 당연히, 우리 남부에는 훨씬 더 많은 민주당 지지자가 있습니다. 많은 북부 민주당원들이 1860년 선거에서 공화당에 합류했기 때문입니다. 하지만, 새로운 당, 즉 딕시크랫을 위한 아이디어를 내놓은 이들도 있습니다. 이것은 우리의 정체성을 나타내지만, 이 이름을 채택한다면 우리는 민주당의 이름과 유산을 북부의 반역자들에게 넘겨주는 것이 될 것입니다."
 csa.23.a: "우리가 진정한 민주당입니다!"
 csa.23.b: "딕시크랫... 그 이름이 마음에 듭니다!"
 csa.24.t: "남부 연합의 제안"
 csa.24.d: "남부 연합은 우리에게 제안을 했습니다: 그들은 소노라 주와 치와와 주의 구매를 요청하고 있습니다. 그들은 이 주들을 그들에게 양도하는 대가로 민간 산업과 재정적 자금을 제공했습니다. 비록 이것이 우리를 바하 칼리포르니아와 단절시키겠지만, 우리가 갚아야 할 모든 종류의 부채를 갚는 데 분명 도움이 될 것입니다."
 csa.24.a: "빚을 갚기 위해서라면 뭐든지…"
 csa.24.b: "안 됩니다, 절대로."
 csa.25.t: "남부 연합이 영토를 구매하려 합니다!"
 csa.25.d: "멕시코시티 주재 우리 대사관에서 남부 연합이 소노라 주와 치와와 주를 구매하려 한다는 충격적인 소식이 들려왔습니다. 멕시코는 이를 수락했으며, 그렇게 함으로써 남부 연합에 태평양 접근권을 부여할 것입니다. 우리는 무엇을 해야 할까요?"
 csa.25.a: "용납할 수 없습니다! 최후 통첩을 보내십시오!"
 csa.25.b: "평화적인 구매였습니다…"
 csa.26.t: "멕시코가 우리의 제안을 거부했습니다!"
 csa.26.d: "멕시코는 우리의 도움이 필요 없는 듯합니다. 그들은 소노라와 치와와를 구매하려던 우리의 제안을 노골적으로 거부했습니다."
 csa.26.a: "젠장."
 csa.27.t: "멕시코가 우리의 제안을 수락했습니다!"
 csa.27.d: "멕시코는 우리의 조건을 수락했으며, 이제 주를 우리에게 양도하는 절차를 시작할 수 있습니다. 양키들은 우리보다 먼저 이 사실을 알았지만, 반응을 보이지 않는 듯합니다."
 csa.27.a: "훌륭합니다!"
 csa.28.t: "양키의 최후 통첩"
 csa.28.d: "우리는 최근 좋은 소식과 나쁜 소식을 동시에 받았습니다. 좋은 소식은 멕시코가 소노라와 치와와 구매에 동의했다는 것이었습니다. 그러나 나쁜 소식은 양키들이 동의하지 않는다는 것입니다. 그들은 우리에게 주 구매 시도를 철회하지 않으면 전쟁을 불사하겠다고 요구하고 있습니다."
 csa.28.a: "우리는 물러서지 않을 것입니다!"
 csa.28.b: "구매를 취소하십시오…"
 csa.29.t: "프랑스와 영국의 지원 요청?"
 csa.29.d: "양키들은 강력하며, 많은 이들은 우리가 그들과 싸울 만큼 충분히 강하지 않다고 걱정합니다. 우리 주 내 일부는 영국과 프랑스의 지원을 요청하자고 하지만, 우리가 노예 제도 폐지를 약속하지 않는 한 그들이 우리의 요청을 거부할 것이라는 것은 이미 알려져 있습니다."
 csa.29.a: "노예 제도를 끝내겠다고 약속합시다…"
 csa.29.b: "우리는 스스로 할 수 있습니다!"
 csa.30.t: "남부 연합이 우리의 지원을 요청합니다"
 csa.30.d: "남부 연합으로부터 전언을 받았습니다. 그들은 연방과의 전쟁에서 우리의 지원을 요청하고 있습니다. 우리의 지원을 대가로 노예 제도를 포기할 의향이 있는 듯합니다…"
 csa.30.d_uk: "남부 연합으로부터 전언을 받았습니다. 그들은 연방과의 전쟁에서 우리의 지원을 요청하고 있습니다. 우리의 지원을 대가로 노예 제도를 포기할 의향이 있는 듯하며, 영국도 그들의 제안에 동의했고, 이제 그들은 우리의 답변을 기다리고 있습니다."
 csa.30.d_no_uk: "남부 연합으로부터 전언을 받았습니다. 그들은 연방과의 전쟁에서 우리의 지원을 요청하고 있습니다. 우리의 지원을 대가로 노예 제도를 포기할 의향이 있는 듯하며, 영국은 도움 제안을 거절했고, 이제 그들은 우리의 답변을 기다리고 있습니다."
 csa.30.a: "제안을 수락하십시오!"
 csa.30.b: "거절하십시오!"
 csa.31.t: "프랑스-영국의 답변"
 csa.31.d: "우리의 대사로부터 그들의 답변을 가지고 돌아왔다는 소식을 받았습니다…"
 csa.31.a: "모두 동의했습니다!"
 csa.31.b: "영국이 동의했습니다!"
 csa.31.c: "프랑스가 동의했습니다!"
 csa.31.e: "모두 거절했습니다!"
 csa.32.t: "제2차 멕시코 전쟁의 종결"
 csa.32.d: "제2차 멕시코 전쟁이 끝났습니다. 우리는 양키들로부터 충분한 영토를 확보하여 그들이 우리의 요구를 받아들이도록 강요했습니다. 구매는 성사될 것이며, 남부 연합은 이제 태평양까지 뻗어나갈 것입니다. 두 번이나 우리는 북부인들에 맞서 독립을 쟁취했습니다!"
 csa.32.d_usa: "제2차 멕시코 전쟁이 끝났습니다. 우리는 남부 연합으로부터 충분한 영토를 확보하여 그들이 우리의 요구를 받아들이도록 강요했습니다. 구매는 성사되지 않을 것이며, 그들은 태평양에 도달하지 못할 것입니다. 비록 그들을 다시 합병할 수는 없지만, 이것은 미래를 위한 좋은 징조입니다."
 csa.32.a: "딕시를 위한 승리!"
 csa.32.b: "아메리카를 위한 승리!"
 csa.33.t: "남부 연합이 쿠바 구매를 희망합니다"
 csa.33.d: "우리는 최근 남부 연합으로부터 제안을 받았습니다. 그들은 풍부한 자원과 방대한 잠재 노동력 때문에 쿠바에 눈독을 들이는 듯합니다. 그러나 이것은 분명히 그들이 노예 제도를 아메리카 대륙으로 더 확장하기 위해 섬을 얻으려는 것입니다. 하지만, 그들이 우리에게 제시한 돈은 우리에게 도움이 될 수 있습니다…"
 csa.33.a: "동의하십시오!"
 csa.33.b: "거절하십시오!"
 csa.34.t: "스페인이 거절했습니다!"
 csa.34.d: "스페인 사절이 우리에게 돌아와, 우리의 쿠바에 대한 관대한 제안을 거부한 듯합니다!"
 csa.34.a: "젠장!"
 csa.35.t: "스페인이 수락했습니다!"
 csa.35.d: "스페인 사절이 우리에게 돌아와, 우리의 쿠바에 대한 관대한 제안을 수락한 듯합니다!"
 csa.35.a: "좋습니다!"
 csa.36.t: "남부 연합이 그들의 영토 반환을 요구합니다!"
 csa.36.d: "우리는 [CSA.GetName]이 주장하는 영토를 보유하고 있으며, 그들은 우리가 영토를 넘겨줄 것을 요구하고 있습니다."
 csa.36.a: "수락하십시오!"
 csa.36.b: "거절하십시오!"
 csa.37.t: "[FROM.GetName]이 거절했습니다!"
 csa.37.d: "우리의 정당한 영토는 [FROM.GetName]의 통제 하에 있으며, 그들은 영토를 우리에게 넘겨달라는 우리의 요구를 거부했습니다!"
 csa.37.a: "전쟁!"
 csa.37.b: "물러서십시오…"
 csa.38.t: "남부 연합이 그들의 영토 반환을 요구합니다!"
 csa.38.d: "우리는 [CSA.GetName]이 주장하는 영토를 보유하고 있으며, 그들은 우리가 영토를 넘겨줄 것을 요구하고 있습니다."
 csa.38.a: "수락하십시오!"
 csa.38.b: "거절하십시오!"
 csa.39.t: "[FROM.GetName]이 거절했습니다!"
 csa.39.d: "우리의 정당한 영토는 [FROM.GetName]의 통제 하에 있으며, 그들은 영토를 우리에게 넘겨달라는 우리의 요구를 거부했습니다!"
 csa.39.a: "전쟁!"
 csa.39.b: "물러서십시오…"
 csa.40.t: "남부 연합과 무역하시겠습니까?"
 csa.40.d: "남부 연합은 우리와 무역 관계를 시작하기를 원합니다… 수락해야 할까요?"
 csa.40.a: "수락하십시오!"
 csa.40.b: "거절하십시오!"
 csa.41.t: "남부 연합의 수도"
 csa.41.d: "새로운 국가에는 새로운 수도가 필요합니다. 세 가지 명확한 후보가 있습니다. 버지니아는 가장 산업화되어 있으며 국경에 가까이 위치하여 북부 노예 주들이 우리에게 합류하도록 장려할 수 있습니다. 앨라배마는 남부 연합이 선포되었고 그 이후로 현재 정부의 중심지였습니다. 또는 처음으로 탈퇴한 사우스캐롤라이나가 수도가 되어야 합니다."
 csa.41.a: "버지니아가 가장 발전했습니다."
 csa.41.b: "앨라배마는 남부 연합이 선포된 곳입니다."
 csa.41.c: "사우스캐롤라이나가 처음으로 탈퇴했습니다."
 csa.43.t: "트레데가 철공소의 용도"
 csa.43.d: "버지니아 리치먼드 근처의 트레데가 철공소는 남부에서 가장 큰 단일 산업 단지이며 전쟁 노력에 필수적입니다. 이 시설의 가장 분명한 용도는 탄약과 포병 생산입니다. 그러나 우리는 그곳에 있는 산업 기계의 대부분을 전용하여 기본적인 증기 기관차를 생산하여 우리의 보급 문제를 신속하게 완화할 수도 있습니다."
 csa.43.a: "총이 필요합니다!"
 csa.43.b: "기차가 필요합니다!"
 csa.44.t: "존 레어드와의 거래"
 csa.44.d: "존 레어드 앤 선즈가 우리를 위해 함선을 건조하는 데 동의했습니다."
 csa.44.a: "완벽합니다!"
 csa.45.t: "외교관들이 RMS 트렌트호에 승선했습니다"
 csa.45.a: "성공하기를 바랍니다!"
 CSA_Trent_embarked: "우리 외교관들은 [FRA.GetNameDef]과 [ENG.GetNameDef] 정부로 향할 것입니다."
 csa.46.t: "남부 연합의 외교관들"
 csa.47.t: "[From.GetName]이 우리를 인정합니다"
 csa.48.t: "[From.GetName]이 우리 인정을 거부합니다"
 csa.49.t: "연방주의 폭도들이 날뛰다"
 csa.49.d: "남부의 많은 사람들은 여전히 완고한 연방주의자이며 우리의 대의를 지지하도록 설득해야 할 것입니다. 그러나 이들 중 여러 대규모 집단이 사라졌고, 지금은 문명인들에 대한 여러 차례의 습격을 포함하여 남부 연합에 끊임없는 문제를 야기하고 있습니다. 우리는 이 위협을 뿌리 뽑아야 합니다."
 csa.49.a: "젠장할 충성파들!"
 csa.50.t: "우리의 상황 문제"
 csa.50.d: "남부는 전쟁 준비가 형편없습니다. 자금 비축량은 적고 보급품은 훨씬 더 부족합니다. 이 전쟁을 치르기 위해서는 자원을 신중하게 관리해야 합니다."
 csa.50.a: "우리가 처리할 것입니다."
 csa.51.t: "목화왕"
 csa.51.d: "우리 농장주들 사이에서 '목화왕'이라는 아이디어가 퍼졌습니다. 이 아이디어는 우리가 세계 면화 공급량의 큰 부분을 차단하면 유럽 열강들이 미국에 압력을 가하여 우리의 독립을 인정하도록 강요할 것이라는 것입니다. 불행히도 이 아이디어는 이미 전국적으로 실행되고 있으며, 우리는 이것이 성공하기를 바랄 수밖에 없습니다…"
 csa.40.t: "남부 연합과 무역하시겠습니까?"
 csa.40.d: "남부 연합은 우리와 무역 관계를 시작하기를 원합니다… 수락해야 할까요?"
 csa.40.a: "수락하십시오!"
 csa.40.b: "거절하십시오!"
