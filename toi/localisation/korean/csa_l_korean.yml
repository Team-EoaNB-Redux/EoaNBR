 csa.41.d: "새로운 국가에는 새로운 수도가 필요합니다. 세 가지 명확한 후보가 있습니다. 버지니아는 가장 산업화되어 있으며 국경에 가까이 위치하여 북부 노예 주들이 우리에게 합류하도록 장려할 수 있습니다. 앨라배마는 남부 연합이 선포되었고 그 이후로 현재 정부의 중심지였습니다. 또는 처음으로 탈퇴한 사우스캐롤라이나가 수도가 되어야 합니다."
