l_english:
 CSA_aristocrats_encouraged: "귀족제 장려"
 CSA_aristocrats_encouraged_desc: "[ROOT.GetName] 내에서 귀족은 상당한 영향력을 지니며, 심지어 법률에 영향을 미칠 힘까지 가지고 있습니다. 의회는 뿌리 깊은 귀족들에게 엄청난 자율성을 부여하고 정치에 대한 그들의 영향력을 더욱 합법화하기로 투표했습니다."
 CSA_aristocrats_discouraged: "귀족제 억제"
 CSA_aristocrats_discouraged_desc: "귀족들은 [ROOT.GetName]에 대한 위험한 권력을 쥐고 있습니다. 의회는 정치에 대한 뿌리 깊은 귀족들의 영향력을 제거하고 그들의 자율성을 줄이기로 결정했습니다. 비록 이 정치적 움직임이 이 사회의 기득권층을 분노하게 했지만, 그에 따른 결과는 분명할 것입니다."
 CSA_proclaim_confederacy: "새로운 국가 선포"
 CSA_proclaim_confederacy_desc: "양키들은 너무 오랫동안 우리를 억압했습니다! 그들은 우리의 농업적 이상을 모욕하고, 우리 문화를 조롱하며, 우리의 전통과 제도의 종식을 요구합니다! 우리는 스스로 독립을 선포해야 합니다. 그렇지 않으면 우리의 정체성을 잃을 위험이 있습니다!"
 CSA_initial_soldiers: "남부 방어"
 CSA_initial_soldiers_desc: "북부인들은 우월한 병력을 가지고 있습니다. 우리는 그것을 용납할 수 없습니다."
 CSA_civil_war_sumter: "섬터 요새 탈환"
 CSA_civil_war_sumter_desc: "북부인들은 감히 우리 영토 내의 요새가 자신들의 것이라고 주장합니다. 뷰캐넌은 전쟁의 위험을 감수하고 싶어 하지 않았지만, 새 대통령은 우리를 쉽게 놓아주려 하지 않는 것 같습니다… 우리는 그들을 강제하여 우리의 강함을 증명해야 합니다!"
 CSA_civil_war_address_issues: "문제점 해결"
 CSA_civil_war_address_issues_desc: "이제 우리는 독립국이 되었지만, 이는 우리가 북부인들과 함께 나누던 많은 정치적 부담을 스스로 감당해야 한다는 것을 의미합니다. 독립과 함께 찾아오는 새로운 고난들을 감안하면, 이 전쟁에서 승리하려면 우리의 문제점들을 해결해야 합니다."
 CSA_civil_war_military: "군사력 강화"
 CSA_civil_war_military_desc: "양키들과 싸우기 위해서는 우리 스스로를 방어할 강력한 군대가 있어야 합니다. 북부인들은 병력이 더 많을 수 있으니, 우리 장군들은 승리를 확보하기 위해 전설이 되어야 합니다!"
 CSA_civil_war_research: "연구에 투자"
 CSA_civil_war_research_desc: "우리는 북부에 맞서 가능한 모든 이점을 얻어야 합니다. 만약 우리가 군사 교리에 더 많은 압력을 가한다면, 양키들을 놀라게 할 새로운 전쟁 전술을 개발해야 할 것입니다."
 CSA_military_john_porter: "존 루크 포터 고용"
 CSA_military_john_porter_desc: "존 루크 포터는 전쟁이 시작될 때 우리에게 전향한 버지니아 출신 해군 엔지니어입니다. 그의 조선 능력은 뛰어나며, 자원이 주어진다면 전례 없는 함선을 만들 수 있다고 믿고 있습니다. 우리는 그를 고용해야 합니다."
 CSA_civil_war_johnathan_laird: "노퍽의 존 레어드"
 CSA_civil_war_johnathan_laird_desc: "존 레어드 앤 선 컴퍼니는 우리를 위한 함선 건조에 관심을 보인 영국 조선 회사입니다. 우리는 그들을 초청하여 노퍽에서 함선 건조를 시작할 수 있도록 허락해야 합니다."
 CSA_civil_war_recruit: "젊은이 징집"
 CSA_civil_war_recruit: "젊은이 징집"
 CSA_civil_war_recruit_desc: "딕시는 공격받고 있습니다. 인구가 훨씬 많은 북부에 맞서 승리하려면, 우리의 젊은이들이 딕시를 위해 싸우러 나갈 것을 장려해야 합니다! 더 많은 병사들을 전장에 투입할 수 있도록 선전 프로그램을 시작합시다!"
 CSA_CSS_virginia: "CSS 버지니아"
 CSA_CSS_virginia_desc: "USS 메리맥은 낡은 증기 프리깃이었지만, 존 루크 프로크터의 작업으로 CSS 버지니아가 되었습니다. 이제 철로 만들어진 선체로 철갑선이라는 명예를 얻었습니다. 이는 해전에서 우리에게 이점을 줄 것입니다."
 CSA_civil_war_scouting: "정찰에 대한 논의"
 CSA_civil_war_scouting_desc: "우리 정찰병들은 남부연합에 큰 도움이 되어 양키들의 남부 진입 움직임을 염탐하고 우리 장군들이 정찰병 없이는 불가능했을 위업을 달성할 수 있게 했습니다. 그러나 우리가 그들에게 너무 의존하게 되었고, 이로 인해 정찰병에 중독된 우리 장군들이 북쪽의 비우호적인 영토로 진격할 때 집중력을 잃는 상황이 발생했습니다. 이 문제를 해결해야 합니다."
 CSA_civil_war_scouting_yes: "정찰 계속"
 CSA_civil_war_scouting_yes_desc: "우리의 정찰에는 아무런 잘못이 없습니다. 결국 이 전쟁은 북부 정복이 아니라 남부연합 방어를 위한 것입니다. 정찰병에 대해서는 아무것도 하지 않을 것입니다."
 CSA_civil_war_scouting_no: "장군들 재활 교육"
 CSA_civil_war_scouting_no_desc: "우리의 정찰은 장군들을 정찰병에 의존하게 만들었고, 이는 우리가 북부로 진격하여 항복을 강요하는 데 있어 치명적일 것입니다. 우리 장군들이 정찰에 너무 신경 쓰지 않도록 재활 교육을 해야 합니다."
 CSA_military_total_war: "총력전"
 CSA_military_total_war_desc: "양키들과의 전쟁은 우리에게 큰 피해를 입히고 있습니다. 우리는 그들의 더 발전된 산업과 경쟁하기 위해 전면적인 총력전을 벌여야 합니다."
 CSA_civil_war_industry: "산업 문제 해결"
 CSA_civil_war_industry_desc: "북부 양키들의 산업은 우리의 농업 사회보다 훨씬 강력합니다. 경쟁하려면 우리의 자유를 위해 산업화하고 북부와 경쟁하기 위해 일부 남부 전통을 포기해야 할 수도 있습니다."
 CSA_civil_war_tredegar_iron: "트레데가 아이언 웍스"
 CSA_civil_war_tredegar_iron_desc: "우리가 리치먼드를 남부연합의 수도로 만든 가장 중요한 이유 중 하나는 리치먼드의 가장 중요한 사업장이자 가장 큰 철 공급원인 트레데가 아이언 웍스입니다. 전쟁 노력을 뒷받침하기 위해 이 공장에 보조금을 지급해야 합니다."
 CSA_civil_war_industry_war: "남부연합 화약 공장"
 CSA_civil_war_industry_war_desc: "남부연합은 화약, 특히 총포 화약 수입에 전적으로 의존하고 있습니다. 이는 특히 양키들의 봉쇄로 인해 우리의 전시 노력에 용납할 수 없는 일입니다. 화약 수요를 충족시키기 위해 더 많은 공장을 건설해야 합니다."
 CSA_civil_war_civilian: "민간 산업 발전"
 CSA_civil_war_civilian_desc: "우리가 스스로를 방어하기 위해 산업을 활용하려는 과정에서 민간 산업은 등한시되었습니다. 비군수 공장의 수로 인해 부채에 빠지지 않도록 민간 산업에도 관심을 기울여야 합니다."
 CSA_civil_war_rails: "애틀랜타-리치먼드 철도"
 CSA_civil_war_rails_desc: "남부의 철도는 북부보다 훨씬 뒤처져 있었고, 이번 전쟁은 이로 인한 문제들을 여실히 보여주었습니다. 전선으로 더 많은 보급품을 수송하기 위해, 리치먼드 앤 댄빌 철도 회사에 지원을 요청하고 애틀랜타와 리치먼드를 잇는 철도 개발을 지원해야 합니다."
 CSA_civil_war_tradition: "우리의 전통을 잊지 마라"
 CSA_civil_war_tradition_desc: "스스로를 방어하기 위해 산업을 추진해야 하지만, 우리가 이 전쟁을 벌인 것은 농업 중심의 삶의 방식을 보존하기 위함임을 기억해야 합니다. 이러한 삶의 방식을 계속 유지하고 남부 전역에 플랜테이션을 더욱 확산시켜야 합니다."
 CSA_civil_war_palmetto_arsenal: "팔메토 조병창"
 CSA_civil_war_palmetto_arsenal_desc: "팔메토 조병창은 사우스캐롤라이나의 팔메토 아이언 웍스와 연결되어 있습니다. 팔메토 조병창, 즉 병기창은 북부와의 전쟁에서 사우스캐롤라이나 민병대에게 필요한 특정 무기와 물자를 제조하는 데 도움을 주기 위해 건설되어야 합니다."
 CSA_civil_war_might: "산업 강국"
 CSA_civil_war_might_desc: "우리의 산업은 여전히 북부보다 발전되지 못했지만, 우리의 노력으로 양키들과 딕시들 간의 격차를 좁히는 데 가까워졌습니다."
 CSA_civil_war_capital: "새로운 수도"
 CSA_civil_war_capital_desc: "버밍엄이 우리 수도로 꽤 적합한 도시이긴 하지만, 버지니아 주는 남부 연합에서 가장 강력한 주입니다. 병사들을 효율적으로 지휘하고 조정하기 위해 수도를 그곳으로 옮기는 것이 당연합니다."
 CSA_civil_war_support: "국제적 지원 모색"
 CSA_civil_war_support_desc: "남부 연합 내 일부는 이 싸움을 혼자서 이길 수 없다고 믿으며, 킹 코튼 외교를 활용해야 한다고 주장합니다. 우리는 유럽 국가들이 우리의 독립을 돕도록 장려하기 위해 그들을 유인해야 합니다."
 CSA_hire_james_bulloch: "제임스 불록 고용"
 CSA_hire_james_bulloch_desc: "제임스 던우디 불록은 우리가 유일한 경화폐 공급원을 확보하는 데 도움을 주는 봉쇄선 돌파선 및 상업 해적입니다. 그의 능력은 인상 깊어서, 그를 대영제국의 수석 해외 요원으로 고용해야 할 것입니다."
 CSA_civil_war_commission_laird: "레어드 조선소에 위탁"
 CSA_civil_war_commission_laird_desc: "존 레어드 앤 선 컴퍼니는 우리의 가장 위대한 해군 사업 파트너이며, 그들은 우리가 거의 필수적으로 의존하게 된 함선 및 물품 건설을 도와주었습니다. 우리의 노력을 돕기 위해 영국에서 함선을 건조하도록 위탁해야 합니다."
 CSA_civil_war_plead: "개입 요청"
 CSA_civil_war_plead_desc: "우리는 유럽 국가들에게 도움을 간청하고 압력을 가했지만, 그들은 여전히 망설이고 있습니다. 마침내 그들이 우리를 돕기로 동의할 때까지 우리는 계속 진격해야 합니다."
 CSA_civil_war_invite: "참관인 초청"
 CSA_civil_war_invite_desc: "우리와 함께하는 것을 망설이거나 꺼려하는 이들도 우리의 싸움을 관찰하고 연구하는 데 관심을 보이고 있습니다. 그들이 올 수 있도록 허락해야 합니다."
 CSA_civil_war_downplay: "정치적으로 노예 제도 축소"
 CSA_civil_war_downplay_desc: "유럽 국가들이 우리에게 등을 돌리게 하는 주요 요인은 노예 제도입니다. 비록 우리 반란의 주요 원인 중 하나이므로 이를 잃을 여유는 없지만, 우리는 이를 축소시키려고 노력해야 합니다. 적어도 국민들과 국제 사회를 만족시키기 위해 이 전쟁은 주권 문제에 관한 것이 되어야 합니다."
 CSA_civil_war_volunteers: "외국인 자원병"
 CSA_civil_war_volunteers_desc: "우리와의 싸움에서 유럽에서 온 자원병들이 우리 군대에 봉사하기 위해 끌려온 것 같습니다. 풍부하지는 않지만, 북부 양키들과 싸울 때 우리에게 큰 도움이 될 수 있습니다."
 CSA_civil_war_victory: "황금 딕시"
 CSA_civil_war_victory_desc: "우리가 해냈습니다! 억압적인 연방을 떨쳐내고 독립을 쟁취했습니다! 과거에는 아득한 꿈처럼 보였던 일이 이제 현실이 되었습니다! 딕시를 위하여!"
 CSA_civil_war_defeat: "황폐화된 딕시"
 CSA_civil_war_defeat_desc: "젠장할 양키들! 이 싸움을 더 이상 계속할 수 없다! 망명해야 하지만, 그들이 딕시의 땅을 파괴했을지언정 우리의 마음속 딕시는 결코 파괴할 수 없다는 것을 알게 하라!"
 CSA_civil_war_myth_states_rights: "주권 신화화"
 CSA_civil_war_myth_states_rights_desc: "이 전쟁에 대한 우리의 합리적 이유는 모든 남부인들에게 너무나 본능적으로 알려져 있어 따로 이야기할 필요조차 없습니다. 그러나 이 이유, 즉 열등 인종의 노예화는 왠지 모르게 우리의 외교적 노력에 문제를 일으키고 있습니다. 내부적으로 이에 대해 거의 논의하지 않는 점은 우리가 다른 이야기를 만들어낼 기회를 제공합니다. 바로 주권에 대한 이야기입니다. 하지만 유럽인들에게 설득력 있게 들리려면, 우리는 주에 특정 양보를 함으로써 이를 사실처럼 보이게 할 필요가 있을 것입니다."
 CSA_prepare_convention: "총회 준비"
 CSA_prepare_convention_desc: "이제 독립을 확보했으니, 전국 각지의 대표들을 소집해야 합니다."
 CSA_convention_invite_delegates: "대표 초청"
 CSA_convention_invite_delegates_desc: "이제 각 주 대표들을 소집할 때입니다. 리치먼드에서 회의를 가질 것을 요청하는 공문을 보내야 합니다."
 CSA_convention_organize: "총회 조직"
 CSA_convention_organize_desc: "우리는 리치먼드에서 열릴 총회를 계획하기 시작해야 합니다. 회의에 사용할 건물을 선정하고, 필요한 편의 시설을 준비해야 합니다."
 CSA_constitutional_convention: "제헌 의회"
 CSA_constitutional_convention_desc: "준비가 완료되었습니다. 이제 마침내 제헌 의회를 시작할 수 있습니다. 우리의 미래를 결정할 시간입니다."
 CSA_convention_confederate: "남부 연합으로 연방 구성"
 CSA_convention_confederate_desc: "이 국가는 아메리카 연합국(Confederate States of America)으로 명명되었습니다. 연방제를 구현하지 않는다면, 우리는 우리 자신(정체성)의 의미를 배신하는 것입니다."
 CSA_convention_federalize: "헌법 개혁"
 CSA_convention_federalize_desc: "헌법은 괜찮았지만, 북부 양키들에게 의해 타락했습니다. 우리는 헌법의 문제점들을 제거하고 개혁해야 합니다."
 CSA_convention_unitarian: "주권 포기"
 CSA_convention_unitarian_desc: "전쟁은 우리의 사고방식을 바꾸어 놓았습니다. 주(州)의 요구가 우리에게 너무 큰 부담을 주어 거의 패배할 뻔했습니다. 약속을 어기는 일이지만, 우리는 이것을 바꿔야 합니다."
 CSA_convention_right_to_secede: "탈퇴권"
 CSA_convention_right_to_secede_desc: "탈퇴는 우리 존재의 이유입니다. 그러나 우리 국가 내에서도 탈퇴가 발생할 수 있습니다. 그러한 일이 발생하지 않도록 노력해야 할까요?"
 CSA_convention_landowner_elite: "지주 엘리트"
 CSA_convention_landowner_elite_desc: "우리의 힘, 문화, 정체성의 대부분은 목화 농장에서 비롯됩니다. 이 농장들의 지주 엘리트들은 우리 정부 내에서 많은 권력을 가지고 있으며, 일부는 그들의 권력이 약화되기를 바랍니다."
 CSA_convention_commerce_clause: "상업 조항"
 CSA_convention_commerce_clause_desc: "우리의 탈퇴에서 중요한 점은 우리 스스로 경제 정책을 통제할 수 있는 능력이며, 이는 양키들에 의해 방해받아왔습니다. 이제 우리는 외국과의 무역에 있어서 우리의 길을 선택할 기회를 가졌습니다."
 CSA_convention_trade_of_slaves: "노예 무역"
 CSA_convention_trade_of_slaves_desc: "노예 제도는 우리 사회에서 중요합니다. 영국과 프랑스를 괴롭힐지라도, 그 생존을 보장하는 것이 우리에게는 필수적입니다. 우리는 주(州) 간 노예 무역을 어떻게 처리해야 할지 결정해야 합니다."
 CSA_convention_taxation: "과세권"
 CSA_convention_taxation_desc: "세금은 국가의 기관차이며, 세금 없이는 어떤 국가도 존속할 수 없습니다. 그러나 일부는 주(州) 자체가 세금을 통제했던 옛날로 돌아가자고 주장하고 있습니다."
 CSA_convention_decentralization_process: "탈중앙화 시작"
 CSA_convention_decentralization_process_desc: "진정한 연방이라고 불리기 위해서는 주(州)들에게 더 많은 자율성을 부여하기 시작해야 합니다. 이는 시간이 걸릴 것입니다."
 CSA_convention_decentralization_borders: "경계 설정"
 CSA_convention_decentralization_borders_desc: "우리는 탈중앙화의 길을 걸어왔지만, 얼마나 탈중앙화되어야 할까요? 많은 이들이 모든 주가 자율성을 가져야 한다고 주장하지만, 일부는 너무 탈중앙화되지 않도록 몇몇 주들을 통합할 것을 요구합니다."
 CSA_convention_decentralization_governors: "주지사 임명"
 CSA_convention_decentralization_governors_desc: "새로 부여된 자율 주들을 관리하기 위해서는, 우리가 더 많은 권한을 부여할 때 권력을 가진 자들이 우리와 함께할 의지가 있는지 확인해야 합니다. 우리는 통치 정책이 여전히 유지되면서도 자율적이어야 함을 확인해야 합니다."
 CSA_convention_decentralization_complete: "남부 연합의 탈중앙화"
 CSA_convention_decentralization_complete_desc: "때가 되었습니다. 준비를 마쳤습니다. 이제 우리 국가를 탈중앙화할 시간입니다."
 CSA_convention_constitution_framework: "헌법 체계"
 CSA_convention_constitution_framework_desc: "헌법은 쉽게 사용할 수 있는 체계를 가지고 있습니다. 새 헌법을 구축하는 데 도움이 되도록 이를 활용해야 합니다."
 CSA_convention_constitution_enshrine_slavery: "노예 제도 명문화"
 CSA_convention_constitution_enshrine_slavery_desc: "노예 제도는 반드시 보장되어야 할 것이며, 우리의 독립 선언문에 명시했던 것처럼, 이를 우리 헌법에도 명시해야 합니다."
 CSA_convention_constitution_federal_states: "주(州)의 연방화"
 CSA_convention_constitution_federal_states_desc: "이제 주(州)들을 연방화할 때입니다. 그들이 얼마나 화를 내든, 우리 생존을 위해 그들에게 부여될 것으로 예상되는 일부 권한을 철회해야 합니다."
 CSA_convention_constitution_federalize: "남부 연합 연방화"
 CSA_convention_constitution_federalize_desc: "우리는 헌법을 확정하고 우리 국가의 통치를 시작해야 합니다. 연합 규약이 거의 미국을 무너뜨릴 뻔했던 것처럼, 우리는 멸망하지 않을 것입니다."
 CSA_convention_unitarian_pressure: "단결을 위한 압력"
 CSA_convention_unitarian_pressure_desc: "대회 참가자들에게 그들의 신념을 포기하도록 설득하는 것은 쉽지 않을 것이지만, 발전을 위해서는 그렇게 해야 합니다."
 CSA_convention_unitarian_rewrite_constitution: "헌법 재작성"
 CSA_convention_unitarian_rewrite_constitution_desc: "현재 제시된 헌법은 효율적이기에는 너무 미약합니다. 우리는 헌법이 재작성되고 연방 정부의 권력이 보장되도록 해야 합니다."
 CSA_convention_unitarian_propaganda: "단일주의 선전"
 CSA_convention_unitarian_propaganda_desc: "주(州) 권리로부터의 우리의 전환에 국민들이 곱게 반응하지 않을 것이므로, 우리는 국민들의 충성심을 확보해야 합니다…"
 CSA_convention_unitarian_finish: "남부 연합 통합"
 CSA_convention_unitarian_finish_desc: "절차를 완료할 때입니다. 비록 이를 위해 탄압을 시행해야 할지라도, 우리는 남부 연합 정부의 힘을 확보해야 합니다. 국민들은 이를 좋아하지 않을 것입니다."
 CSA_convention_election: "대통령 선거"
 CSA_convention_election_desc: "남부 연합의 첫 공식 대통령을 선출할 때가 왔습니다. 우리 헌법상 데이비스는 두 번째 임기를 수행할 수 없으므로, 우리의 두 번째 대통령이 되기 위한 출마는 다른 이들에게 맡겨졌습니다."
 CSA_convention_election_davis: "데이비스 행정부 유지"
 CSA_convention_election_davis_desc: "남북 전쟁 동안 남부 연합의 지도자였던 제퍼슨 데이비스가 초대 공식 대통령으로 선출되었습니다."
 CSA_convention_election_breckinridge: "1860년의 진정한 승자"
 CSA_convention_election_breckinridge_desc: "우리의 반란을 시작하게 한 1860년 선거의 민주당 후보였던 존 브레킨리지가 초대 공식 대통령으로 선출되었습니다."
 CSA_convention_election_toombs: "톰스 대통령 취임"
 CSA_convention_election_toombs_desc: "제퍼슨 데이비스 행정부의 거침없는 비판자였던 로버트 톰스가 초대 공식 대통령으로 선출되었습니다."
 CSA_convention_election_lee: "남부 연합의 워싱턴"
 CSA_convention_election_lee_desc: "남부 연합의 영웅이자 군대 지휘관인 로버트 E. 리가 초대 공식 대통령으로 선출되었습니다."
 CSA_postwar_in_dixies_land: "딕시 땅에서"
 CSA_postwar_in_dixies_land_desc: "딕시 땅에서, 저는 딕시를 위해 살고 죽기 위해 제 자리를 지킬 것입니다!"
 CSA_postwar_international_recognition: "국제적 인정"
 CSA_postwar_international_recognition_desc: "우리는 올바른 국가이지만, 다른 국가들도 우리를 그렇게 보는지 확인해야 합니다. 우리는 다른 국가들과 대사관을 설립하고, 우리가 영원히 존재할 것임을 알려야 합니다."
 CSA_postwar_international_recognition_america: "아메리카 대륙"
 CSA_postwar_international_recognition_america_desc: "아메리카 대륙, 신세계, 우리의 고향. 우리는 이 대륙에서 우리의 우월성을 확보해야 합니다."
 CSA_postwar_international_recognition_mexico: "강 남쪽"
 CSA_postwar_international_recognition_mexico_desc: "리오그란데 강 남쪽에는 멕시코라는 국가가 있습니다. 비록 그들은 가톨릭이고 노예 제도를 경멸하지만, 전략적인 친구가 될 수 있습니다…"
 CSA_postwar_international_recognition_mexico_liberal: "자유주의자들과 협상"
 CSA_postwar_international_recognition_mexico_liberal_desc: "자유주의 정부가 멕시코를 계속 통제하고 있으며, 보수주의자들에게는 괴롭겠지만, 그들과 관계를 수립해야 합니다."
 CSA_postwar_international_recognition_mexico_conservative: "보수주의자 지원"
 CSA_postwar_international_recognition_mexico_conservative_desc: "막시밀리안 황제가 이끄는 보수주의자들이 멕시코의 통제권을 장악했습니다. 우리는 그들과 긴밀한 관계를 유지해야 합니다."
 CSA_postwar_international_recognition_mexico_purchase: "소노라와 치와와 구매"
 CSA_postwar_international_recognition_mexico_purchase_desc: "양키들처럼 눈부신 바다에서 바다까지 뻗어나가는 것이 남부 연합의 꿈이었습니다. 그러나 그들은 캘리포니아를 확고히 잡고 있으며, 우리는 태평양에 도달하기 위한 다른 수단을 찾아야 합니다…"
 CSA_postwar_international_recognition_second_mexican_war: "제2차 멕시코 전쟁"
 CSA_postwar_international_recognition_second_mexican_war_desc: "양키들은 치와와와 소노라 주를 구매하려는 우리의 합법적인 시도를 거부했습니다! 우리는 병력을 동원하여 전투에서 그들과 맞서야 합니다!"
 CSA_postwar_international_recognition_mexican_war_win: "눈부신 바다까지"
 CSA_postwar_international_recognition_mexican_war_win_desc: "우리는 양키들의 위협을 물리쳤고, 이제 이곳에 서 있습니다. 바다에서 눈부신 바다까지, 우리의 명백한 운명은 영광을 쟁취했습니다!"
 CSA_postwar_international_recognition_mexican_war_lose: "불쾌한 철수"
 CSA_postwar_international_recognition_mexican_war_lose_desc: "양키들은 우리를 합당하게 얻은 영토에서 철수하도록 강요했습니다. 우리는 이 일을 결코 잊지 않을 것입니다…"
 CSA_postwar_international_recognition_brazil: "남부 제국"
 CSA_postwar_international_recognition_brazil_desc: "브라질은 아메리카 대륙의 동료 국가이지만, 가장 중요하게는 흥미로운 원칙을 가진 노예 제도를 유지하고 있습니다…"
 CSA_postwar_international_recognition_slave_trade: "국제 노예 무역 제안"
 CSA_postwar_international_recognition_slave_trade_desc: "브라질과 함께 수립할 수 있는 흥미로운 것 중 하나는 국제 노예 무역입니다. 이것은 영국을 화나게 할 것이지만… 이점을 제공할 수도 있습니다."
 CSA_postwar_international_recognition_natives: "원주민 부족"
 CSA_postwar_international_recognition_natives_desc: "원주민 부족들은 본래 우리의 영토인 곳을 점유하고 있습니다. 우리는 오클라호마 원주민들과 우호적인 관계를 유지하고 싶지만, 우리 영토가 확보되어야 한다는 것을 명심해야 합니다."
 CSA_postwar_international_recognition_comanche: "텍사스 국경 확보"
 CSA_postwar_international_recognition_comanche_desc: "코만치 부족은 우리 텍사스 정착민들과 원주민들 사이에 긴장을 야기했습니다. 우리는 이러한 약탈이 더 이상 없도록 해야 하며, 영토가 확보되도록 해야 합니다."
 CSA_postwar_international_recognition_apache: "애리조나 국경 확보"
 CSA_postwar_international_recognition_apache_desc: "애리조나는 매우 황량한 지역이며, 아파치 부족은 도움이 되지 않습니다. 우리는 양키들로부터 보호해야 하므로, 그들이 우리가 주장하는 영토 내에서의 움직임을 중단할 것을 요구해야 합니다."
 CSA_postwar_international_recognition_europe: "유럽 인정"
 CSA_postwar_international_recognition_europe_desc: "유럽의 지지를 얻는 것은 우리 독립 전쟁의 주요 전략이었습니다. 이제 전쟁이 끝났으니, 우리는 이 국가들과 더 많은 외교 대표단을 구성하기 시작할 수 있습니다."
 CSA_postwar_international_recognition_france: "파리 대사관"
 CSA_postwar_international_recognition_france_desc: "프랑스는 우리에게 지지적이었고, 우리 혁명 동안 일부 지원을 제공했습니다. 우리는 파리에 대사관을 설립해야 합니다."
 CSA_postwar_internaitonal_recognition_uk_desc: "그들이 우리의 노예 제도에 대해 불평하더라도, 우리는 우리의 문화적 아버지와 긴밀한 관계를 유지해야 합니다."
 CSA_postwar_international_recognition_prussia: "베를린 대사관"
 CSA_postwar_internaitonal_recognition_prussia_desc: "베를린시는 강력하며, 프로이센 왕국은 우리 전쟁 중에 대표들을 보냈습니다. 우리는 그들과 외교 관계를 수립해야 합니다."
 CSA_postwar_international_recognition_cotton_trade: "목화왕의 실현"
 CSA_postwar_international_recognition_cotton_trade_desc: "이제 목화왕을 진정으로 실현할 때이며, 유럽이 우리의 우월한 목화 생산을 필요로 하도록 해야 합니다."
 CSA_postwar_international_recognition_repay_loans: "전쟁 차관 상환"
 CSA_postwar_international_recognition_repay_loans_desc: "제2차 미국 혁명 동안, 우리는 유럽과 국내 은행으로부터 많은 물품을 구매해야 했습니다. 현재 우리는 대출금을 갚고 있지만, 지금 당장 모든 대출금을 상환하려고 시도할 수 있으며, 이는 다른 목적으로 우리의 투자를 사용할 수 있도록 할 것입니다."
 CSA_postwar_international_recognition_purchase_cuba: "쿠바 구매"
 CSA_postwar_international_recognition_purchase_cuba_desc: "쿠바 섬은 농장으로 쓸 수 있는 넓은 평야와 값싼 노동력으로 매우 부유합니다. 쿠바를 통합하여 이 이점을 활용하는 것은 오랜 꿈이었습니다… 지금이 시도할 때일까요?"
 CSA_postwar_land_of_two_giants: "두 거인의 땅"
 CSA_postwar_land_of_two_giants_desc: "이제 방 안의 코끼리, 즉 우리 국경 북쪽에 있는 코끼리에 주의를 기울여야 합니다. 양키들은 우리에게 깊은 적의를 품고 있으며, 이 대륙을 그들과 어떻게 공유할지 결정해야 합니다."
 CSA_postwar_giants_traitor_democrats: "배신자 민주당원 처리"
 CSA_postwar_giants_traitor_democrats_desc: "많은 민주당원들이 분리 독립을 위한 우리의 영광스러운 싸움에 동참했지만, 여전히 양키들과 함께 서 있던 이들도 있었습니다. 우리는 우리의 이름인 민주당에 대해 무엇을 할지 결정해야 합니다."
 CSA_postwar_giants_begin_reapproach: "양키들과 관계 재정립"
 CSA_postwar_giants_begin_reapproach_desc: "많은 이들이 우리에게 대한 북부의 처사에 여전히 분개하고 있지만, 관계를 완화하는 것이 더 나을 수도 있습니다. 그들의 수도로 사절을 보내, 협상할 의향이 있는지 알아봅시다."
 CSA_postwar_giants_trade: "무역 관계 시작"
 CSA_postwar_giants_trade_desc: "놀랍게도, 양키들이 협력할 의사가 있는 것 같습니다. 그들과 무역 협상을 시작할 수 있습니다."
 CSA_postwar_giants_cool_relations: "관계 해빙"
 CSA_postwar_giants_cool_relations_desc: "놀랍게도 양국 간의 관계가 해빙되기 시작하는 것 같습니다."
 CSA_postwar_giants_no_trade: "무역 거절"
 CSA_postwar_giants_no_trade_desc: "예상대로, 양키들이 무역을 시작하자는 우리의 요청을 거부한 것 같습니다. 관계가 조만간 회복될 것 같지는 않습니다."
 CSA_postwar_giants_hostile_relations: "경직된 관계"
 CSA_postwar_giants_hostile_relations_desc: "옛 전쟁의 기억이 여전히 남아 있어 관계가 정체 상태에 있습니다. 이 세대가 지속되는 한 양국 간에 타협점을 찾을 수 없을 것입니다."
 CSA_postwar_internal_politics: "내부 정치"
 CSA_postwar_internal_politics_desc: "이제 국가를 건설했으니, 국가 운영에 부족함이 없도록 해야 합니다."
 CSA_postwar_internal_whig_rebirth: "휘그당 부활"
 CSA_postwar_internal_whig_rebirth_desc: "휘그당은 1856년 선거에서 소멸했던 오래된 당이었습니다. 기본적으로 민주당에 반대하는 모든 이들로 구성된 빅텐트 정당이었죠. 하지만 이제 부활을 맞이했습니다."
 CSA_postwar_internal_whig_symbol: "휘그당의 상징"
 CSA_postwar_internal_whig_symbol_desc: "초기 휘그당은 민주당이 당나귀를 채택한 것처럼 동물 마스코트를 채택하기를 거부했지만, 새로운 휘그당원들은 이를 받아들이기 시작했습니다. 그들은 부엉이를 마스코트로 채택하기 시작했고, 이는 당원 증가에 박차를 가했습니다."
 CSA_postwar_internal_whig_popular: "휘그당 인기 상승"
 CSA_postwar_internal_whig_popular_desc: "사람들은 과거에 지쳐 있습니다, 특히 젊은이들은 말이죠. 그렇다면 이제 자유주의자들이 휘그당으로 유입되어 당원 성장을 보장할 때가 된 것입니다."
 CSA_postwar_internal_whig_politics: "국가 장악"
 CSA_postwar_internal_whig_poltiics_desc: "휘그당은 마침내 대통령 관저를 장악하고 남부 연합 의회에서 상당한 영향력을 행사할 수 있게 되었습니다. 이제 개혁을 시행할 때입니다."
 CSA_postwar_internal_whig_aristocracy_reforms: "귀족 개혁"
 CSA_postwar_internal_whig_aristocracy_reforms_desc: "국가 내의 귀족적 요소들은 유익하기도 하지만 단점도 있습니다. 그들이 산업화를 완강히 거부하고 의회에서 영향력을 행사하는 것은 용납할 수 없습니다."
 CSA_postwar_internal_whig_central_reforms: "중앙 개혁"
 CSA_postwar_internal_whig_central_reforms_desc: "남부 연합은 탈중앙화된 국가로 만들어졌지만, 이로 인해 국가 내에 약점이 발생했습니다. 우리는 더 많은 중앙화를 추진하고, 국가가 적들에게 맞설 수 있도록 강해지도록 해야 합니다."
 CSA_postwar_internal_whig_slavery_reforms: "노예 제도 개혁"
 CSA_postwar_internal_whig_slavery_reforms_desc: "가장 큰 문제입니다. 많은 휘그당원들도 여전히 반대하고 있습니다. 노예 제도 개혁은 헌법과 남부 연합 자체의 근간을 흔드는 일이지만, 반드시 이루어져야 합니다."
 CSA_postwar_internal_economy: "경제에 집중"
 CSA_postwar_internal_economy_desc: "막대한 면화 생산력 외에는 산업 면에서 다른 많은 국가들에 비해 크게 뒤쳐져 있습니다. 우리는 앞으로 나아갈 방법을 찾아야 합니다."
 CSA_postwar_internal_richmond_mint: "리치먼드 조폐국 설립"
 CSA_postwar_internal_richmond_mint_desc: "경제를 순환시키기 위해서는 통화를 발행하기 시작해야 하며, 리치먼드 조폐국 설립은 새로운 주화를 주조하는 데 도움이 될 것입니다."
 CSA_postwar_internal_usa_dollar: "그린백 달러"
 CSA_postwar_internal_usa_dollar_desc: "리치먼드 조폐국을 설립하고 양키들로부터 독립했음에도 불구하고, 그들의 경제 통화는 강력하고 안정적입니다. 혹시 그런 통화를 사용할 수 있을까요?"
 CSA_postwar_internal_uk_pound: "여왕의 통화"
 CSA_postwar_internal_uk_pound_desc: "영국은 우리의 노력에 지지해 주었으며, 그들의 통화를 채택하는 것이 합리적입니다."
 CSA_postwar_internal_csa_dollar: "그레이백 달러"
 CSA_postwar_internal_csa_dollar_desc: "그레이백 달러는 우리 남부 연합의 명명된 통화이며, 리치먼드 조폐국에서 인쇄되기 시작할 것입니다."
 CSA_postwar_internal_rail: "철도 투자"
 CSA_postwar_internal_rail_desc: "이제 우리를 뒷받침할 공식 통화가 생겼으니, 우리 국가를 연결하는 철도를 건설하는 방법에 투자하기 시작할 수 있습니다."
 CSA_postwar_internal_civilian: "리치먼드 상업 지구"
 CSA_postwar_internal_civilian_desc: "리치먼드는 성장했고, 이전보다 더 중요한 경제적 거점이 되었습니다. 우리는 여기에 투자하고, 리치먼드가 중요한 무역 중심지가 되도록 해야 합니다."
 CSA_postwar_internal_kgc_founding: "KGC 창설"
 CSA_postwar_internal_kgc_founding_desc: "KGC는 젊은 귀족과 플랜테이션 소유주들의 열정으로 탄생한 새로운 정당입니다. 이들은 노예 제도를 확산시키고 카리브해 주변에 노예 제도의 위대한 제국, 즉 위대한 '황금 원형'을 만들고자 합니다."
