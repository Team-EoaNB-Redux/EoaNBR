 csa.43.a: "총이 필요합니다!"
 csa.43.b: "기차가 필요합니다!"
 csa.44.t: "존 레어드와의 거래"
 csa.44.d: "존 레어드 앤 선즈가 우리를 위해 함선을 건조하는 데 동의했습니다."
