 01_CSA_War_Result: "§G우리는 공식적으로 독립국이 될 것입니다!§!"
 02_CSA_War_Result: "§R우리는 망명할 수밖에 없을 것입니다!\n게임 오버§!"
 01_CSA_EndUpdate: "\n§Y이것은 현재 업데이트 기준 CSA 포커스 트리의 끝입니다!§!"
 CSA_convention_drift_confed: "§C이는 우리를 탈중앙화된 정부로 이끌 것입니다!§!"
 CSA_convention_drift_central: "§C이는 우리를 중앙집권화된 정부로 이끌 것입니다!§!"
 CSA_convention_confederation_path: "§Y우리는 국가를 탈중앙화하기로 결정했습니다!§!"
 CSA_convention_federalism_path: "§Y우리는 국가를 연방화하기로 결정했습니다!§!"
 CSA_convention_unitarian_path: "§Y우리는 국가를 중앙집권화하기로 결정했습니다!§!"
 CSA_purchase_sonora_chihuahua_tt: "§Y이것을 진행하려면 멕시코 정부의 동의가 필요합니다.§! \n§R미국은 이로 인해 우리와 전쟁을 벌일 수도 있습니다!§! \n"
 CSA_internal_economy_tt: "§Y우리는 경제에 힘쓸 것입니다!"
 CSA_mexico_accepted_purchase_goes: "우리는 치와와와 소노라 주를 평화롭게 구매했습니다!"
 CSA_mexico_refused_purchase: "멕시코가 우리에게 주들을 판매하는 것을 거부했습니다!"
 CSA_Civil_War_Scout_Dependency: "정찰병 의존도"
 CSA_Civil_War_Scout_Dependency2: "정찰병 중독"
 CSA_Civil_War_Scout_Dependency_desc: "우리 백성은 북부의 잔인한 권력에 맞서 봉기하고 있습니다. 그들은 우리의 투쟁을 지지하며, 우리 군대에 매우 유용한 정찰 정보를 제공합니다. 그러나 우리 장군들은 이 정찰병들에게 크게 의존하고 있습니다. 그들이 연방 영토로 진입할 경우, 그곳의 땅과 사람들은 양키 군대를 정찰하는 데 도움이 되지 않을 것입니다."
 CSA_Civil_War_Scout_Dependency2_desc: "우리 백성은 북부의 잔인한 권력에 맞서 봉기하고 있습니다. 그들은 우리의 투쟁을 지지하며, 우리 군대에 매우 유용한 정찰 정보를 제공합니다. 그러나 우리 장군들은 이 정찰병들에게 크게 의존하고 있습니다. 그들이 연방 영토로 진입할 경우, 그곳의 땅과 사람들은 양키 군대를 정찰하는 데 도움이 되지 않을 것입니다."
 CSA_Civil_War_Industry1: "산업 문제 해결"
 CSA_Civil_War_Industry2: "산업 건설"
 CSA_Civil_War_Industry3: "산업 방어"
 CSA_Civil_War_Conscription: "젊은이 징집"
 CSA_Civil_War_Total_War: "총력전"
 ACW_observer: "미국 남북 전쟁 참관"
 CSA_civil_war_cotton_dismay: "목화왕의 절망"
 CSA_civil_war_cotton_dismay_desc: "우리 주(州)의 많은 이들은 우리가 자발적으로 버텨낼 것이라고 기대하지 않고, 단지 영국과 프랑스가 우리를 도우러 오기만을 기다리고 있습니다. 현재로서는 그들의 전투 의지가 부족합니다."
 CSA_civil_war_BRA_delegations: "브라질 대표단"
 CSA_civil_war_BRA_delegations_desc: "브라질은 우리처럼 인종의 정당한 위치를 여전히 존중하는 몇 안 되는 서방 강대국 중 하나입니다. 우리는 그들에게 대표단을 보내 그들의 지지를 얻어야 합니다."
 CSA_civil_war_king_cotton: "목화왕 지원"
 CSA_civil_war_continue_exports: "수출 지속 압박"
 CSA_civil_war_food_supply_problem: "식량 공급 문제"
 CSA_civil_war_food_supply_problem_desc: "우리는 식량 공급에 문제가 있습니다. 비록 지금 당장은 어느 정도 물자를 확보했지만, 예측 가능한 미래를 위해 이 문제를 해결해야 합니다."
 CSA_civil_war_discourage_cotton_overgrowing: "면화 과잉 재배 억제"
 CSA_civil_war_discourage_cotton_overgrowing_desc: "남부 주(州)들은 항상 비옥한 땅이 풍부했지만, 그 대부분은 농장으로 고착되어 있으며, 대부분이 면화를 재배합니다. 일반적인 상황에서는 엄청난 부를 창출하지만, 현재 현금 작물 이외의 작물 부족은 병사와 민간인 모두에게 기아를 초래하고 있습니다. 우리는 일시적으로 면화 과잉 재배를 제한함으로써 탐욕스러운 농장주들이 더 많은 면화를 재배하는 것을 막아야 합니다."
 CSA_civil_war_rationing: "남북 전쟁 배급제"
 CSA_civil_war_rationing_desc: "우리의 절박한 상황은 절박한 조치를 요구하며, 그중 하나는 배급 시스템을 시행하는 것입니다. 매우 인기가 없겠지만, 이는 우리의 물자를 훨씬 더 오래 지속시킬 것입니다."
 CSA_civil_war_choctaw_treaty: "촉토족 조약"
 CSA_civil_war_cherokee_treaty: "체로키족 조약"
 CSA_civil_war_chickasaw_treaty: "치카소족 조약"
 CSA_civil_war_native_wedge: "원주민 공략"
 CSA_civil_war_crackdown_unionist_thugs: "연방주의 폭도 진압"
 CSA_civil_war_internal: "내부 문제 해결"
 CSA_civil_war_economy: "경제 문제 해결"
 CSA_confederate_state_arsenal: "남부 연합 주(州) 병기고"
 CSA_civil_war_funding_war: "전쟁 자금 조달"
 CSA_civil_war_issue_greybacks: "그레이백 지폐 발행"
 CSA_civil_war_issue_greybacks_desc: "여전히 연방 달러를 사용한다면 우리는 독립국으로 간주될 수 없습니다. 대신 우리 고유의 통화를 주조합시다. 남부 연합 달러는 '그레이백'이라는 별명으로 불리며 우리에게 경제적 유연성을 제공할 것입니다."
 CSA_civil_war_FRA_aid: "프랑스 원조"
 CSA_civil_war_ENG_aid: "영국 원조"
 CSA_civil_war_crack_down_on_state_printing: "주(州)의 통화 발행 단속"
 CSA_civil_war_dealing_with_plantation: "플랜테이션 문제 처리"
 CSA_civil_war_20_negro_law: "20인 노예법"
 CSA_civil_war_20_negro_law_desc: "우리의 부는 플랜테이션에서 나옵니다. 그들의 번영을 증진하기 위해 노예 20명 이상을 소유한 시민은 병역을 면제하는 20인 노예법을 통과시켜야 합니다."
