 POLITICS_ALEXANDER_BACH_DESC: "바흐 남작 알렉산더 폰 바흐는 합스부르크 군주국의 내무부 장관이자 내정 문제에 있어서 오스트리아의 실질적인 지도자입니다. 남작은 법률 문제에 긴 역사를 가진 가문 출신이며, 그 자신도 법학 박사이자 제국의 충성스러운 신하입니다. 그는 혁명기인 1849년 집권한 이래 메테르니히의 지나치게 통제적인 시스템에서 벗어나고자 했지만, 동시에 그의 성직자 절대주의적 통치 형태에서는 메테르니히의 원칙 대부분을 실제로 유지했습니다. 남작은 제국을 중앙집권화하여 빈을 모든 것의 중심으로 만들고, 비밀 경찰의 엄격한 사용을 통해 황제에 대한 충성심을 유지하는 것을 선호합니다. 남작은 또한 대부분의 정부 보수파 구성원들처럼 오스트리아 내 카톨릭 교회를 지지하는 인물입니다. 비록 그가 황제와 대부분의 독일계 오스트리아인들의 지지를 받고 있지만, 남작의 정책은 제국의 다른 민족들에게 깊은 불만을 안겨주었으며, 아마도 때가 되면 그의 정책이 프란츠 요제프 황제의 신민들의 충성심에 이로움보다 해로움을 더 많이 끼쳤음이 드러날 수도 있을 것입니다..."
 POLITICS_BERNHARD_VON_RECHBERG_DESC: "1806년 레겐스부르크에서 태어난 요한 베른하르트 폰 레히베르크 운트 뢰텐뢰벤 백작은 처음에는 그의 아버지 알로이스 백작과 같은 길을 걸어 바이에른의 정치가가 될 예정이었지만, 운명은 그를 다른 방향으로 이끌었습니다. 스트라스부르와 뮌헨 대학에서 교육을 마친 후, 그는 결투에서의 레히베르크의 역할 때문에 바이에른의 루트비히 1세 국왕의 불쾌감을 샀습니다. 그 후 그는 1828년 오스트리아 외교관으로 전임되었습니다. 다음 해 동안 그는 1841년 스톡홀름, 2년 후 브라질의 특사로 임명되기 전까지 베를린, 런던, 브뤼셀의 오스트리아 외교단에 속해 있었습니다.\n\n1848/49년 3월 혁명 동안 그는 독일 통일을 준비하기 위해 소집된 프랑크푸르트 의회의 오스트리아 전권 대사로 임명되었으나, 결국 통일은 이루어지지 않았습니다. 1853년 그는 롬바르디아-베네치아의 공직에 들어가 라데츠키와 다른 통치자들을 합스부르크 통치하의 왕국 민간 행정에서 보좌했으며, 그 후 프랑크푸르트로 돌아와 2년간 오스트리아 대표이자 독일 '분데스타크'의 임명된 의장으로 지냈습니다. 이제 이러한 어려운 시기에 황제께서는 폰 레히베르크가 이탈리아에서의 패배 후 우리의 문제를 해결할 최선의 선택이라고 생각하십니다. 그의 경험을 통해 그는 지난 몇 년간 오스트리아와 프로이센 간의 불화가 커지고 있는 독일 연방에서 우리의 정책을 이끌어갈 수 있을 것입니다. 레히베르크는 우리의 전 국가 재상 클레멘스 폰 메테르니히의 가치를 공유하며 종종 후자의 제자로 여겨집니다. 이는 1848년 폰 메테르니히와 함께 영국으로 피신했을 때 폰 레히베르크에게 유리한 위치를 가져다주었고, 그 직후 혁명 동안 프랑크푸르트 주재 오스트리아 대표로 임명되었습니다.\n\n그는 독일에서 보수적인 지배력을 유지하기 위해 오스트리아와 프로이센이 타협하고 좋은 관계를 유지해야 한다고 생각합니다. 국무장관 및 외무장관으로서 그는 제국에 자신의 정책을 구현할 기회를 가질 것입니다. 그는 황제의 신뢰를 받아 왕국 전역의 격화된 상황을 정부에 유리하게 해결하고, 특히 현재 독일 상황과 관련하여 전임자가 야기한 문제들을 해결할 것입니다."
 POLITICS_AGENOR_GOLUCHOWSKI_DESC: "아게노르 로무알트 고우흐호프스키 백작은 알렉산더 폰 바흐 남작의 후임 내무부 장관으로 임명되었습니다. 그는 갈리치아 출신의 보수주의자이자 귀족이며 황제의 측근 고문입니다. 게다가 갈리치아 총독으로 성공적인 임기를 보냈으며, 그곳에서 빈곤한 지역에 도움이 되는 여러 프로젝트를 수행했습니다. 백작은 대중을 만족시킬 만큼 충분히 자유로운 헌법 제정을 감독할 것입니다. 그럼에도 불구하고, 그는 제국 내 모든 다양한 민족들을 화해시킬 만큼 카리스마가 충분하지 않을 수도 있습니다..."
 POLITICS_ANTON_VON_SCHMERLING_DESC: "안톤 리터 폰 슈메를링은 빈 회의 이래 오스트리아 제국의 첫 자유주의 내무부 장관입니다. 빈에서 태어나 법학을 공부했으며, 20년 이상 하부 오스트리아에서 공무원으로 재직했습니다. 그는 1848년 혁명 기간 중 연방 의회(Confederate Diet)의 의장이 되면서 명성을 얻었습니다. 그는 요한 대공의 정부를 지지했으며 프랑크푸르트에서 발생한 반란을 진압했습니다. 혁명의 붕괴와 함께 빈으로 돌아와 1851년 사임할 때까지 법무부 장관을 지냈습니다. 안톤 폰 슈메를링은 자유주의자이자 중앙집권주의자입니다. 그는 오스트리아가 의회 정부를 갖춘 완전한 단일 국가가 되어야 한다고 믿습니다. 그의 사상은 귀족과 보수주의자들로부터 의심을 받고 있지만, 그는 독일의 힘 아래 다양한 민족 집단들을 통합할 수 있는 인물로 여겨집니다. 황제는 그를 매우 신뢰하고 있으며, 폰 슈메를링이 무엇을 이룰 수 있을지는 지켜봐야 할 것입니다."
 POLITICS_ARCHDUKE_RAINER_DESC: "오스트리아의 라이너 페르디난트 대공은 합스부르크 군주국의 몇몇 고위 구성원 중 한 명입니다. 대공은 빈에서 법학을 공부했으며, 군주국의 대부분 남성 구성원들처럼 제국 육군에 입대했습니다. 그는 1852년 그의 사촌인 오스트리아의 마리 카롤리네 대공녀와 결혼했으며, 이는 매우 행복한 결혼 생활이었습니다. 대공은 정치에 대해 단지 약간의 관심만 있었지만, 궁정에서는 제국에서 절대주의를 계속 이어갈 완벽한 인물로 여겨져 프란츠 요제프에 의해 내무부 장관으로 임명되었습니다. 대공은 아마도 제국에 필요한 인물, 즉 실용적인 지도자일 것입니다. 비록 황제처럼 약간 비활적일 수도 있지만 말입니다. 실제 권력의 대부분은 궁정 내 절대주의 파벌에 있으며, 제국 내 모든 남성과 여성들이 폐하께 충성스러운 신민이 되도록 하는 것이 그들의 임무입니다."
 POLITICS_RICHARD_VON_BELCREDI_DESC: "리하르트 폰 벨크레디 백작은 안톤 폰 슈메를링의 후임 내무부 장관으로 임명되었습니다. 백작은 롬바르디아 가문 출신이지만 모라비아 후작령 출신이며, 프라하에서 법학을 공부한 후 빈에서 공부했습니다. 1861년부터 이미 지방의회 의원이었던 그는 노련한 관료이자 헝가리인들과의 이른바 '타협'에 반대하는 인물입니다. 백작은 대신 다양한 분리주의 운동에 맞서기 위해 지역 귀족들이 실질적으로 모든 권력을 유지하는 보수적인 방식으로 제국이 연방화되어야 한다고 주장합니다. 백작 폰 벨크레디가 내무부 장관으로 오래 머무를지, 아니면 안톤 폰 슈메를링처럼 더 타협적인 정치인으로 교체될지는 궁극적으로 황제에게 달려 있습니다."
 POLITICS_FRIEDRICH_FERDINAND_VON_BEUST_DESC: "프리드리히 페르디난트 폰 보이스트 백작은 국무장관으로는 다소 특이한 선택입니다. 그는 작센인이며 개신교도입니다. 그럼에도 불구하고, 그는 우리에게 심각한 모욕을 준 프로이센의 명확한 반대자이며, 매우 유능한 정치인입니다. 백작이 헝가리인들과의 협상을 끝내고 군주제에 대한 신뢰를 회복하기를 바랍니다. 이제 불행이 끝나고 새로운 평화와 안정의 시대가 도래할 때입니다..."
 
