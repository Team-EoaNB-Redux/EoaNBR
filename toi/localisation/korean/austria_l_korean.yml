 AUS_decision_brucks_carrot_and_stick_policy_desc: "비독일 왕관령의 귀족들은 성공적인 중앙집권화 정책의 핵심이 될 수 있습니다. 국무장관 [AUS.GetLeader]은(는) 제국 전역의 귀족 가문들이 중앙 정부와 협력하도록 강제하는 것을 중심으로 한 정치적 의제에 대한 기초 작업을 개발했습니다. 많은 귀족 가문, 특히 젠트리(gentry) 중에는 최근 파산하거나 불안정한 상황에 처한 경우가 있습니다. 만약 우리가 그들에게 협력할 물질적인 인센티브를 제공할 수 있다면, 지방에서 중앙 정부의 권위를 안정화하고 확립할 수 있을 것입니다."
