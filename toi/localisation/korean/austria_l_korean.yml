 #Politics
 AUS_idea_klerikalabsolutist: "클레리카르압솔루티스트"
 AUS_idea_klerikalabsolutist_desc: "알렉산더 폰 바흐 남작은 황제와 교회가 국가를 관리하고 신민의 복지를 보장하는 주도적인 역할을 하는 '클레리카르압솔루티스무스', 즉 성직자 절대주의로 알려진 강력한 체제를 수립했습니다. 그러나 폰 바흐의 체제를 매우 억압적이고 메테르니히 행정부보다 나을 바 없다고 공격하는 자유주의자들의 끊임없는 반대가 있습니다."
 AUS_idea_concordat_of_1855_1: "1855년 콘코르다트"
 AUS_idea_concordat_of_1855_1_desc: "교황청과 오스트리아 제국 간의 1855년 콘코르다트는 제국 내 카톨릭 교회의 권리와 의무를 규정합니다. 카톨릭 신앙을 다른 기독교 교파들보다 우대하는 이 법률에 따라, 카톨릭 교회는 최소 한 명의 카톨릭 배우자와 관련된 모든 혼인 문제에 대해 전적인 책임을 집니다. 카톨릭 신자가 관련된 혼인은 더 이상 국가가 아닌 카톨릭 교회에 의해 처리될 것입니다. 국가는 또한 교회 자금 및 카톨릭 교회의 내부 문제에 대한 통제권을 철회할 것이며, 후자는 오스트리아 제국의 거의 모든 초등 교육을 담당하게 될 것입니다."
 AUS_idea_concordat_of_1855_2: "1855년 콘코르다트"
 AUS_idea_concordat_of_1855_2_desc: "교황청과 오스트리아 제국 간의 1855년 콘코르다트는 제국 내 카톨릭 교회의 권리와 의무를 규정합니다. 카톨릭 신앙을 다른 기독교 교파들보다 우대하는 이 법률에 따라, 카톨릭 교회는 최소 한 명의 카톨릭 배우자와 관련된 모든 혼인 문제에 대해 전적인 책임을 집니다. 카톨릭 신자가 관련된 혼인은 더 이상 국가가 아닌 카톨릭 교회에 의해 처리될 것입니다. 국가는 또한 교회 자금 및 카톨릭 교회의 내부 문제에 대한 통제권을 철회할 것이며, 후자는 오스트리아 제국의 거의 모든 초등 교육을 담당하게 될 것입니다. 이 법이 철저히 시행된다면, 카톨릭 신앙은 우리 왕국의 새로운 포괄적 정체성을 위한 투쟁에서 주요 통합 요소 중 하나가 될 수 있을 것입니다."
 AUS_idea_concordat_of_1855_3: "1855년 콘코르다트"
 AUS_idea_concordat_of_1855_3_desc: "교황청과 오스트리아 제국 간의 1855년 콘코르다트는 제국 내 카톨릭 교회의 권리와 의무를 규정합니다. 카톨릭 신앙을 다른 기독교 교파들보다 우대하는 이 법률에 따라, 카톨릭 교회는 최소 한 명의 카톨릭 배우자와 관련된 모든 혼인 문제에 대해 전적인 책임을 집니다. 카톨릭 신자가 관련된 혼인은 더 이상 국가가 아닌 카톨릭 교회에 의해 처리될 것입니다. 국가는 또한 교회 자금 및 카톨릭 교회의 내부 문제에 대한 통제권을 철회할 것이며, 후자는 오스트리아 제국의 대부분의 초등 교육을 담당하게 될 것입니다. 단, 이는 프로테스탄텐파텐트로 조정되었습니다."
 AUS_idea_concordat_of_1855_4: "1855년 콘코르다트"
 AUS_idea_concordat_of_1855_4_desc: "교황청과 오스트리아 제국 간의 1855년 콘코르다트는 제국 내 카톨릭 교회의 권리와 의무를 규정합니다. 카톨릭 신앙을 다른 기독교 교파들보다 우대하는 이 법률에 따라, 카톨릭 교회는 최소 한 명의 카톨릭 배우자와 관련된 모든 혼인 문제에 대해 전적인 책임을 집니다. 카톨릭 신자가 관련된 혼인은 더 이상 국가가 아닌 카톨릭 교회에 의해 처리될 것입니다. 국가는 또한 교회 자금 및 카톨릭 교회의 내부 문제에 대한 통제권을 철회할 것이며, 후자는 오스트리아 제국의 대부분의 초등 교육을 담당하게 될 것입니다. 단, 이는 프로테스탄텐파텐트로 조정되었습니다."
 AUS_idea_hungarian_revolution: "1848/49년 헝가리 혁명"
 AUS_idea_hungarian_revolution_desc: "1848년 혁명에서 일련의 패배를 겪은 후, 오스트리아 국가는 붕괴 직전에 이르렀습니다. 고무적인 지도자 코수트 라요시가 이끄는 헝가리 민족주의자들은 헝가리의 독립을 되찾기 위해 봉기했습니다. 폭동 이후 페르디난트 1세 숙부를 계승하여 왕위에 오른 젊은 황제 프란츠 요제프는 여러 전선에서 압박과 수세에 몰려 성스러운 동맹의 이름으로 러시아의 도움을 요청해야 했습니다. 니콜라이 1세 차르는 응답하여 20만 명의 강력한 군대와 8만 명의 보조 병력을 보냈습니다. 마침내 러시아와 오스트리아 연합군은 1849년 8월 헝가리 반군을 격파했습니다. 합스부르크 군주제가 완전한 권위를 회복한 후, 헝가리는 잔혹한 계엄령 하에 놓였습니다. 이로 인해 많은 헝가리인들이 오스트리아와 오스트리아인들에 대해 강한 적개심을 품고 있으며, 헝가리에 대한 오스트리아의 통제를 방해하기 위해 적극적으로 활동하고 있습니다."
 AUS_idea_grundentlastungspatent: "그룬트엔트라슈퉁스파텐트"
 AUS_idea_grundentlastungspatent_desc: "농노 제도는 [AUS.GetName]의 여러 지역에서 오랜 역사를 가지고 있습니다. 이는 1848년 혁명 동안 제국 전역에서 공식적으로 폐지되었지만, 지주에 대한 보상 문제는 남아 있었습니다. 이른바 '그룬트엔트라슈퉁스파텐트'의 규정에 따라, 농민은 자신들의 토지 시장 가치의 3분의 1을 전 주인에게 지불해야 하며, 국가는 또 다른 3분의 1을 부담합니다. 많은 농민들과 그들의 가족들은 이 가격을 지불할 여유가 없어 임금 노동을 찾기 위해 도시로 이주할 수밖에 없었고, 지불할 여유가 있더라도 마지막 3분의 1은 지주에게 손실되므로, 이 규정은 부유층 사이에서 인기가 없습니다."
 AUS_idea_nationalist_unrest: "민족주의적 불안"
 AUS_idea_nationalist_unrest_desc: "민족주의의 도래는 민족적 소속이 아니라 오직 신의 뜻에 의해 우리 군주 프란츠 요제프 1세 황제의 신성한 통치에 기반을 둔 우리 제국에 위협적인 위협을 제기합니다. 우리는 우리 영토 일부의 민족주의적 불안을 다룰 방법을 찾아야 할 것입니다.\n\n우리 제국 내 소요 사태의 현재 위험도:\n[HUN.GetFlag]§YHungarian Lands§!: [?HUN_REVOLT_RISK|-%1]\n[CZE.GetFlag]§YWest Slavic Lands§!: [?CZE_REVOLT_RISK|-%1]\n[CRO.GetFlag]§YSouth Slavic Lands§!: [?CRO_REVOLT_RISK|-%1]\n[POL.GetFlag]§YPolish Lands§!: [?POL_REVOLT_RISK|-%1]"
 AUS_idea_constitutional_diploma_1: "헌법 외교문서"
 AUS_idea_constitutional_diploma_1_desc: "군주국의 내부 헌정 관계를 규정하는 제국 외교문서. 이 문서에는 황제가 일부 임명하고 왕관령의 지방 정부가 일부 파견하는 100명의 의원으로 구성된 정부 기관인 제국 의회(Reichsrat)가 포함됩니다. 그러나 제국 의회는 황제에게 자문 기능만 수행하며, 황제는 대표자들의 제안에 어떤 식으로든 구속되지 않습니다."
 AUS_idea_constitutional_diploma_2: "헌법 외교문서"
 AUS_idea_constitutional_diploma_2_desc: "군주국의 내부 헌정 관계를 규정하는 제국 외교문서. 이 문서에는 황제가 일부 임명하고 왕관령의 지방 정부가 일부 파견하는 100명의 의원으로 구성된 정부 기관인 제국 의회(Reichsrat)가 포함됩니다. 그러나 제국 의회는 황제에게 자문 기능만 수행하며, 황제는 대표자들의 제안에 어떤 식으로든 구속되지 않습니다."
 AUS_idea_hungarian_tax_refusal_1: "헝가리 조세 거부"
 AUS_idea_hungarian_tax_refusal_1_desc: "마자르인들은 최근 빈 정부의 정책에 매우 불만이 많습니다. 일부는 역사적인 헝가리 헌법이 부여한 권리를 주장하며, 다른 일부는 여전히 1848/49년 헌법이 유효하다고 보고 새로운 상황을 받아들이기를 거부합니다. 헝가리 민족주의 지도자들은 동포들에게 모든 세금 납부를 거부하도록 촉구하고 있으며, 헝가리 귀족들, 많은 성직자들, 심지어 우리 자신의 일부 지방 행정관들도 이에 동조하고 있습니다."
 AUS_idea_hungarian_tax_refusal_2: "헝가리 조세 거부"
 AUS_idea_hungarian_tax_refusal_2_desc: "마자르인들은 최근 빈 정부의 정책에 매우 불만이 많습니다. 일부는 역사적인 헝가리 헌법이 부여한 권리를 주장하며, 다른 일부는 여전히 1848/49년 헌법이 유효하다고 보고 새로운 상황을 받아들이기를 거부합니다. 헝가리 민족주의 지도자들은 동포들에게 모든 세금 납부를 거부하도록 촉구하고 있으며, 헝가리 지식인 엘리트와 성직자들 중 많은 이들뿐만 아니라 일부 대중도 이에 동조하고 있습니다."
 AUS_idea_imperial_constitution_of_1861: "1861년 제국 헌법"
 AUS_idea_imperial_constitution_of_1861_desc: "제국 헌법은 프란츠 요제프 1세 황제가 안톤 폰 슈메르링 국무장관에 의해 개정된 후 재가되었습니다. 이 헌법은 합스부르크 대공들, 세습 귀족 가문의 수장들, 강력한 성직자들, 그리고 황제가 종신 임명한 다른 시민들로 구성된 상원(Herrenhaus)과 왕관령의 지방 의회에서 파견된 대표들로 구성된 하원(Abgeordnetenhaus)의 두 입법 기관으로 이루어진 제국 의회(Reichsrat)에 입법권을 부여합니다."
 AUS_idea_italian_league: "이탈리아 연맹 회원국"
 AUS_idea_italian_league_desc: "이 나라는 §YItalian League§!의 회원국입니다.\n\nThe Italian League는 오스트리아의 종주권 아래에 있는 이탈리아 국가들 간의 협력을 촉진하는 임무를 맡은 경제 및 정치 조직입니다."
