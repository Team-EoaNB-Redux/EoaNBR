 AUS_decision_incorporate_the_flottillenkorps: "플로틸렌코르프스 편입"
 AUS_decision_incorporate_the_flottillenkorps_desc: "프리깃함보다 작지만, 코르벳 증기선은 다재다능한 함선으로, 대량 생산이 가능하고, 잘 운용되고 그룹으로 사용될 때 어떤 적 함대라도 격파할 수 있습니다. 우리는 현재 일부 함선들을 우리의 호수와 강을 보호하는 데 사용하고 있습니다. 아드리아해를 지배하기 위해서는 이 함선들도 큰 도움이 될 것입니다. 아마도 우리는 이들을 정식 황실-왕립 해군에 편입해야 할 것입니다."
