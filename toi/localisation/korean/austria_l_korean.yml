 #Italian Unrest
 AUS_decision_category_italian_unrest: "이탈리아 불안"
 AUS_decision_category_italian_unrest_desc: "§Y[LVN.GetName]§!에 문제가 발생하고 있습니다! 이탈리아 민족주의자들이 최근 우리 이탈리아 영토에서 활동을 강화하고 있습니다. 그들은 우리의 통치를 §Y불안정하게 만들고 이 지역에서 불안을 조장§!하려 하고 있습니다. 그들의 목표는 이탈리아 일부 지역에 대한 우리의 종주권을 전복시키고 이탈리아 민족을 하나의 민족 국가로 통합하는 것입니다. 그러나 이것은 우리 왕국에 매우 위험하며 결국 우리 제국을 해체시킬 연쇄 반응을 일으킬 가능성이 있습니다. 우리는 그들의 노력에 단호하게 대응해야 합니다!\n\n[LVN.GetFlag]이탈리아 영토 내 소요 사태의 §Y현재 위험도§!: [?ITA_UPROAR_RISK|-%1]\n§Y이탈리아 소요 위험도 기본 월별 변동률§!: [?modifier@AUS_Italian_Uproar_Risk_Modifier|=-%1]\n\n반군 활동에 대응하고 이를 방지하기 위해 우리가 취할 수 있는 몇 가지 조치들이 있습니다:\n[LVN.GetFlag]§Y[LVN.GetName]의 통제 하에 있는 각 이탈리아 주에 최소 20,000명의 병력을 주둔시키는 것§!: §G-1.0%§!\n[LVN.GetFlag]§Y[LVN.GetNameDef]가 시민들에게 인권을 부여하는 것§!: §G-0.5%§!\n[LVN.GetFlag]§Y[LVN.GetNameDef]가 언론의 자유를 허용하는 것§!: §G-0.5%§!\n"
 AUS_decision_uproar_in_italy_countdown: "이탈리아의 소요"
 AUS_decision_uproar_in_italy_countdown_desc: "리소르지멘토 운동가들이 우리 이탈리아 영토에서 음모를 꾸미고 있으며, 우리는 그들의 활동에 주의해야 합니다. 그들의 주요 목표는 이 지역의 우리 군대와 기반 시설입니다."
 AUS_decision_uproar_in_italy_countdown_trigger_tt: "§Y이탈리아의 불안§!이 진정되었습니다.\n\n§R참고:\n현재로서는 모든 이탈리아 영토를 잃지 않는 한, 이탈리아의 불안을 진정시키는 것은 불가능합니다.§!"
 AUS_decision_uproar_in_italy_countdown_effect_tt: "§R이탈리아 영토 내 소요 가능성에 따라 [LVN.GetName]에 문제가 발생할 수 있습니다.§!"
 AUS_mission_calm_the_unrest_in_italy: "이탈리아의 불안 진정"
 AUS_mission_calm_the_unrest_in_italy_desc: "이탈리아 상황이 다시 악화되고 있으며, 우리는 더 이상 라데츠키에게 의존할 수 없습니다. 반란이 일어나 이탈리아에서 우리를 강제로 쫓아내기 전에 이탈리아의 불안을 진압하고 진정시킬 방법을 찾아야 합니다."
 AUS_mission_calm_the_unrest_in_italy_trigger_tt: "국가 정신 §Y이탈리아의 불안§!을(를) 가지고 있지 않습니다!"
 AUS_decision_make_promises_of_liberalization_in_italy: "이탈리아에서 자유화 약속"
 AUS_decision_make_promises_of_liberalization_in_italy_desc: "우리는 1848년 이래 롬바르디아-베네치아 왕국을 점령된 땅으로 통치해왔습니다. 그러나 이제 우리의 나이 든 총독이자 유명한 원수 라데츠키는 떠났습니다. 사르데냐인들과 이탈리아 민족주의자들이 우리에 대한 반란을 선동하고 있으며, 현재 우리의 방법으로는 불충분해 보입니다. 통제력을 유지하기 위해 롬바르디아-베네치아에서 자유주의 개혁을 약속하고, 바라건대 불안이 충분히 진정되어 우리가 통제력을 되찾을 수 있기를 바랍니다."
 AUS_decision_make_promises_of_liberalization_in_italy_effect_tt: "우리의 이탈리아 신민들은 아마도 [LVN.GetName]의 자유화를 향한 진정한 변화를 보기를 원할 것입니다. 특히 §Y인권§!과 §Y언론의 자유§!를 갈망합니다.\n"
 AUS_decision_grant_human_rights_in_lvn: "[LVN.GetName] 시민들에게 인권 부여"
 AUS_decision_grant_human_rights_in_lvn_desc: "우리가 이 사람들을 점령지 시민으로 계속 대하는 것은 더 이상 실용적이지 않습니다. 우리가 그들을 우리 국가의 일부로 유지하고 싶다면, 그들을 우리 국가의 다른 모든 사람들과 완전히 동등한 권리를 가진 사람들로 인정해야 합니다."
 AUS_decision_grant_free_press_in_lvn: "[LVN.GetName]에서 언론의 자유 허용"
 AUS_decision_grant_free_press_in_lvn_desc: "언론의 자유가 우리의 통치에 반대하는 세력에게 우리에 대항하여 조직할 기회를 줄 수 있지만, 얻게 될 선의는 그 위험을 감수할 가치가 있을 것입니다. 시민들에게 자신의 의견과 불만을 표출할 기회를 줌으로써, 우리는 우리 통치를 위태롭게 하지 않으면서도 그들에게 배출구를 제공할 것입니다."
 
 #External Threats
 AUS_decision_category_external_threats: "외부 위협 대처"
 AUS_decision_category_external_threats_desc: "1848년의 봉기와 혼란 이후, 우리 대사의 대부분은 내부 문제에 집중되어 있었으며, 국제 문제에 간헐적으로 개입했습니다. 그러나 오스트리아가 강대국으로서의 지위를 유지하기를 원한다면, 외부 문제도 처리해야 합니다."
 AUS_decision_stabilize_the_mediterranean: "지중해에서 프랑스 및 영국과 협력"
 AUS_decision_stabilize_the_mediterranean_desc: "프랑스와 영국은 지중해의 지배적인 해군 강국이며, 우리가 지중해에서 역할을 하기를 원한다면 이를 인정해야 합니다. 프랑스와 영국과의 협력을 통해 양국과의 관계를 개선하고, 유럽에 우리 함대의 위력을 보여줄 수 있습니다."
 AUS_decision_stabilize_the_mediterranean_effect_tt: "\n§RThe outcome depends on the reactions of the other powers.§!\n\nCurrent Outcome:\n"
 AUS_decision_austro_russian_rapprochement: "오스트리아-러시아 화해"
 AUS_decision_austro_russian_rapprochement_desc: "러시아인들은 크림 전쟁 동안 우리의 입장에 대해 우리를 용서하기 어려울 수 있지만, 우리의 지원을 통해 오스만 제국에서의 우리의 야망을 모두 이룰 수 있을 것입니다. 러시아에 외교적 제스처를 취하고 우리의 관계를 이전 상태로 복원하는 과정을 시작합시다."
 AUS_decision_try_to_mend_the_divide: "분열을 봉합하려 노력"
 AUS_decision_try_to_mend_the_divide_desc: "러시아와의 관계가 부분적으로 회복되었으니, 동쪽 이웃과의 동맹을 복원하도록 노력합시다. 발칸반도에 대한 상호 이익을 통해 협력은 우리 모두에게 만족을 가져다줄 것이며, 북쪽과 서쪽으로부터의 가능한 모든 위협으로부터 우리를 보호할 것입니다."
 AUS_decision_try_to_mend_the_divide_effect_tt: "\n§RWe might have to continue our diplomatic efforts to persuade the Russians of our good intentions.§!"
 AUS_decision_tighten_cooperation_with_britain: "영국과의 협력 강화"
 AUS_decision_tighten_cooperation_with_britain_desc: "대부분의 이웃 국가들과의 관계가 현재 상태인 상황에서, 더 멀리 떨어진 국가에 접근하는 것은 적들과 맞서 싸우고 그들의 지원을 거부할 수 있는 동맹을 얻는 데 도움이 될 수 있습니다."
 AUS_decision_tighten_cooperation_with_britain_effect_tt: "\n§RWe might have to continue our diplomatic efforts to persuade the British of our good intentions.§!"
 AUS_mission_bolster_our_defenses: "우리의 방어 강화"
 AUS_mission_bolster_our_defenses_desc: "쿼드릴라테로(Quadrilatero)와 이탈리아의 다른 방어 시설들은 1848년에 사르데냐에 맞서 버틸 수 있었지만, 페스키에라는 함락되었고 전체 지역이 위험에 처했습니다. 그 암울한 해의 반복을 피하려면 우리의 요새를 현대화하고 강화해야 합니다."
 AUS_mission_bolster_our_defenses_trigger_tt: "상부 이탈리아의 요새를 §Yrefit§!하는 데 §Y365 days§!가 소요됩니다!"
 AUS_decision_refit_fort_peschiera: "페스키에라 요새 재정비"
 AUS_decision_refit_fort_peschiera_desc: "페스키에라는 1848년에 불행하게도 함락되었으며, 사르데냐와의 전쟁 중 우리 요새의 실패가 반복되는 것을 피해야 합니다. 요새를 현대화하고 재정비하는 것은 롬바르디아-베네치아 방어에 도움이 될 것입니다."
 AUS_decision_refit_fort_legnago: "레냐고 요새 재정비"
 AUS_decision_refit_fort_legnago_desc: "쿼드릴라테로의 나머지 지역 동쪽에 있는 레냐고는 우리 방어선의 후방을 대표합니다. 이를 위해 페스키에라 또는 만토바가 다시 함락될 경우를 대비하여 강화되어야 합니다. 전방과 후방 방어선 모두 제대로 유지되어야만 이탈리아에서 우리의 영토를 유지할 수 있습니다."
 AUS_decision_refit_fort_verona: "베로나 요새 재정비"
 AUS_decision_refit_fort_verona_desc: "베로나의 위치는 베네치아로 진격하려는 적에게 덜 바람직하게 보일 수 있지만, 트렌트에 대한 공격, 그리고 트렌트로부터 티롤에 대한 공격에 필수적인 위치입니다. 오스트리아 본토에 대한 어떠한 진격도 방어하기 위해, 우리는 베로나의 요새를 강화해야 합니다."
 AUS_decision_refit_fort_mantua: "만토바 요새 재정비"
 AUS_decision_refit_fort_mantua_desc: "쿼드릴라테로의 최남단인 만토바는 롬바르디아-베네치아에 대한 우리의 통제권을 공격하는 다음 초점이 될 수 있습니다. 우리는 요새에 대한 잠재적인 공격이 성공하지 못하도록 요새를 개조하고 개선할 것입니다."
 AUS_mission_russian_troops_galician_border_trigger_tt: "\n§RNOTE:§!\nWe need to have §Yat least 20,000 soldiers§! continuously stationed in §Yeach§! of the states of §YWest Galicia and East Galicia§! to prevent Russian operations at the border.§!\n\n"
 AUS_mission_romanian_troops_transylvanian_border: "가능성 있는 루마니아 국경 작전"
 AUS_mission_romanian_troops_transylvanian_border_desc: "프랑스인들이 루마니아 공국에 무기를 보냈다는 것은 확실합니다. 우리가 모르는 것은 이 무기 거래의 의도입니다. 트란실바니아 남동쪽의 취약한 국경 근처에 상당한 병력을 유지하여 잠재적인 침략자가 공격을 두 번 생각하게 만드는 것이 현명할까요?"
 AUS_mission_romanian_troops_transylvanian_border_trigger_tt: "\n§RNOTE:§!\nWe need to have continuously stationed at least §Y16,000 soldiers§! in the state of §YSouth Transylvania§!, §Y8,000 soldiers§! in the state of §YSzekelyfold§!, and §Y6,000 soldiers§! in the state of §YSouth Bukovina§! to prevent Romanian operations at the border.§!\n\n"
 
 AUS_unrest_in_italy_minus_one_effect_tt: "§YRisk for Uproar in Our Italian Holdings§!: §G-1%§!"
 AUS_unrest_in_italy_minus_two_effect_tt: "§YRisk for Uproar in Our Italian Holdings§!: §G-2%§!"
 AUS_unrest_in_italy_minus_five_effect_tt: "§YRisk for Uproar in Our Italian Holdings§!: §G-5%§!"
 AUS_unrest_in_italy_minus_ten_effect_tt: "§YRisk for Uproar in Our Italian Holdings§!: §G-10%§!"
 AUS_unrest_in_italy_plus_one_effect_tt: "§YRisk for Uproar in Our Italian Holdings§!: §R+1%§!"
 AUS_unrest_in_italy_plus_two_effect_tt: "§YRisk for Uproar in Our Italian Holdings§!: §R+2%§!"
 
 #Multinational Empire
 AUS_decision_category_multinational_empire: "다민족 제국의 도전"
 AUS_decision_category_multinational_empire_desc: "다양한 국적의 많은 사람들이 우리의 영광스러운 제국의 신민이며 오랫동안 평화롭게 함께 살아왔습니다. 오직 신의 은총으로 우리 군주의 머리에 놓인 합스부르크 가문의 제국 왕관은 수세기 동안 통합과 안정을 제공하는 기관이었고, 프란츠 요제프 황제는 특히 제국 왕좌에서 사랑받는 인물이었습니다. 그러나 19세기 전반의 민족의 봄(Spring of Nations)은 문제를 가져왔습니다. 군사적 반란 수준에까지 이르는 맹렬한 민족주의 선동이 제국의 다양한 지역을 휩쓸었고, 우리 왕국의 평화와 안정을 계속해서 위협하고 있습니다. 통제 불능 상태가 되기 전에 이러한 위험에 대처해야 합니다. 그러나 우리의 모든 행동은 재앙을 초래할 수 있는 잠재력을 가지고 있습니다.\n\n우리 제국 내 소요 사태의 현재 위험도:\n[HUN.GetFlag]§YHungarian Lands§!: [?HUN_REVOLT_RISK|-%1]\n[CZE.GetFlag]§YWest Slavic Lands§!: [?CZE_REVOLT_RISK|-%1]\n[CRO.GetFlag]§YSouth Slavic Lands§!: [?CRO_REVOLT_RISK|-%1]\n[POL.GetFlag]§YPolish Lands§!: [?POL_REVOLT_RISK|-%1]"
 AUS_decision_nationalist_agitation_countdown: "민족주의 선동"
 AUS_decision_nationalist_agitation_countdown_desc: "다양한 민족 및 문화 집단의 민족주의 선동가들이 우리 왕국 전역에 걸쳐 모이고 있습니다. 우리는 그들이 문제를 일으키는 것을 막고 제국에 질서를 회복하기 위해 우리의 모든 권한을 다해야 합니다. 1848/49년 혁명에서 한 가지 배운 것이 있다면, 이러한 문제들은 신속하고 단호하게 처리해야 한다는 것입니다. 그렇지 않으면 상황이 매우 빠르게 통제 불능 상태가 될 수 있습니다."
 AUS_decision_nationalist_agitation_countdown_trigger_tt: "§YNationalist Agitation§!의 위험이 방지되었습니다."
 AUS_decision_nationalist_agitation_countdown_effect_tt: "§RDepending on the likelihood of nationalist uproar in our realm there might be trouble.§!"
 AUS_decision_promote_the_german_language: "독일어 장려"
 AUS_decision_promote_the_german_language_desc: "우리는 제국 전역에 걸쳐 독일어를 장려하는 정책을 제정해야 합니다. 우리 모든 신민이 독일어를 말할 수 있게 된다면, 민족적 소속에만 초점을 맞추지 않는 독특한 왕국 정체성을 창조할 길을 열 수 있을 것입니다."
 AUS_decision_promote_the_german_language_effect_tt: "There might be §Runforeseeable repercussions§!."
 AUS_decision_stop_promoting_the_german_language: "독일어 장려 정책 중단"
 AUS_decision_stop_promoting_the_german_language_desc: "우리의 언어 장려 정책은 비효율적이며 득보다 실이 많다는 것이 입증되었습니다. 우리는 그 실패를 인정하고 즉시 중단해야 합니다."
 AUS_decision_adapt_the_curriculum: "교육과정 조정"
 AUS_decision_adapt_the_curriculum_desc: "교황청과의 종교 협약(concordat)은 카톨릭 교회가 우리 왕국의 초등 교육 대부분을 조직할 수 있도록 허용하지만, 제국의 다른 지역에는 다른 규칙이 있습니다. 우리는 교육을 다루는 기관들에 영향력을 행사하여 독일어가 모든 곳에서 성공의 근본적인 전제 조건이 되도록 하고, 민족적 소속의 중요성보다 더 통합된 합스부르크 제국 정체성이라는 아이디어를 장려해야 합니다."
 AUS_decision_enforce_german_as_administrative_language: "독일어를 행정 언어로 강제"
 AUS_decision_enforce_german_as_administrative_language_desc: "독일어를 모든 행정 기관 및 절차의 공식 언어로 만든다면, 이는 많은 신민들이 독일어를 배우도록 강제할 것입니다. 우리 관료주의와 관료들은 제국을 더욱 통합하려는 우리의 계획에 대한 그들의 협력을 완전히 장려하기 위해 독일화될 필요가 있습니다."
 AUS_decision_restore_order: "제국의 질서 회복"
 AUS_decision_restore_order_desc: "혁명 정신은 우리 제국의 많은 지역에서 살아 숨 쉬고 있습니다. 많은 사람들은 여전히 3월 혁명의 이상을 믿으며 현실이 변했음을 받아들이려 하지 않습니다. 프란츠 요제프 황제는 1851년 12월 31일 3월 헌법을 완전히 철회했지만, 폐하의 칙령에 대한 저항은 오늘날까지도 지속되고 있습니다. 우리는 우리 왕국의 평화, 질서, 고요함을 회복하기 위해 우리의 모든 힘을 다해야 합니다."
 AUS_decision_restore_order_effect_tt: "이 노력을 기울이면 §Gfighting nationalist agitation will be much more efficient§!."
 AUS_decision_grant_insurgents_amnesty: "1848/49년 반군 사면"
 AUS_decision_grant_insurgents_amnesty_desc: "황위 계승자 루돌프 황태자의 탄생은 황제께서 기독교적인 용서의 정신을 보여줄 적절한 기회로 여겨질 것입니다. 여전히 1848/49년 혁명의 많은 반군들이 가족에게 돌아갈 수 있도록 사면을 기다리고 있습니다. 그들에게 자유를 부여하는 것은 그들의 동료들 사이의 불안을 진정시키는 데도 도움이 될 것입니다."
 AUS_decision_suppress_hungarian_nationalism: "헝가리 민족주의 진압"
 AUS_decision_suppress_hungarian_nationalism_desc: "마자르인들은 1848년 혁명에서의 참패 이후에도 극도로 불복종적인 태도를 유지하며 체계적으로 민정 참여와 세금 납부를 거부해 왔습니다. 그들은 폐하의 매우 불량한 신민들이며, 그들이 품고 있는 어떤 혁명적인 사상도 즉시 중단시켜야 합니다."
 AUS_decision_suppress_west_slavic_nationalism: "서슬라브 민족주의 진압"
 AUS_decision_suppress_west_slavic_nationalism_desc: "보헤미아-모라비아와 슬로바키아의 서슬라브 지역 주민들은 이전에 독일 자유주의자들과 동맹을 맺었으며, 우리에게 끊임없는 골칫거리가 되어 바흐 남작과 그의 동료들의 정책을 방해하려 합니다. 우리는 그들을 처리해야 합니다."
 AUS_decision_suppress_south_slavic_nationalism: "남슬라브 민족주의 진압"
 AUS_decision_suppress_south_slavic_nationalism_desc: "오스트리아 제국 영토와 성 이슈트반 왕관령으로 나뉘어 있지만, 프란츠 요제프 황제의 통치 아래 통합된 달마티아 해안을 따라 사는 남슬라브 민족들은 제국 전체와의 관계에서 변화무쌍한 역사를 가지고 있습니다. 우리는 예측 불가능한 문제에 대해 경계해야 합니다."
 AUS_decision_suppress_polish_nationalism: "폴란드 민족주의 진압"
 AUS_decision_suppress_polish_nationalism_desc: "18세기 후반 강력한 이웃 국가들에게 조각조각 분할된 폴란드 국가는 1807년 나폴레옹의 비호 아래 재건되었으나, 그의 패배 후 빠르게 해체되었습니다. 빈 회의는 러시아와의 동군연합으로 폴란드 잔존국을 구성했으며, 나머지 영토는 우리와 프로이센 사이에 분할되었습니다. 우리의 갈리치아 영토에는 지금까지는 충성스러웠지만 폴란드의 위대했던 시절을 기억할지도 모르는 많은 폴란드인들이 거주하고 있으므로, 우리는 그들의 활동을 경계해야 합니다."
 AUS_increase_hungarian_nationalism_by_half_tt: "§YRisk for Uproar in Hungary§!: §R+0.5%§!\n"
 AUS_increase_hungarian_nationalism_by_one_tt: "§YRisk for Uproar in Hungary§!: §R+1%§!\n"
 AUS_increase_hungarian_nationalism_by_two_tt: "§YRisk for Uproar in Hungary§!: §R+2%§!\n"
 AUS_increase_hungarian_nationalism_by_three_tt: "§YRisk for Uproar in Hungary§!: §R+3%§!\n"
 AUS_increase_hungarian_nationalism_by_four_tt: "§YRisk for Uproar in Hungary§!: §R+4%§!\n"
 AUS_increase_hungarian_nationalism_by_five_tt: "§YRisk for Uproar in Hungary§!: §R+5%§!\n"
 AUS_increase_hungarian_nationalism_by_six_tt: "§YRisk for Uproar in Hungary§!: §R+6%§!\n"
 AUS_increase_hungarian_nationalism_by_ten_tt: "§YRisk for Uproar in Hungary§!: §R+10%§!\n"
 AUS_decrease_hungarian_nationalism_by_half_tt: "§YRisk for Uproar in Hungary§!: §G-0.5%§!\n"
 AUS_decrease_hungarian_nationalism_by_one_tt: "§YRisk for Uproar in Hungary§!: §G-1%§!\n"
 AUS_decrease_hungarian_nationalism_by_two_tt: "§YRisk for Uproar in Hungary§!: §G-2%§!\n"
