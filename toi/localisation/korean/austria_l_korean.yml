 #Financial Affairs
 AUS_decision_category_financial_affairs: "재무"
 AUS_decision_category_financial_affairs_desc: "18세기 말 시작된 주요 경제 개혁은 경제 성장을 촉진했고 합스부르크 제국의 신민들은 서서히 부유해졌습니다. 그러나 1848/49년 혁명과 뒤이은 반동적 정책은 산업 성장을 저해했습니다. 이와 더불어 족벌주의, 과도한 지출, 전반적인 비효율성으로 인해 타락한 상비군의 천문학적인 비용은 막대한 재정 적자를 초래했으며, 이는 시간이 지남에 따라 현재까지도 국가를 괴롭히는 전면적인 재정 위기로 변모하여 투자와 산업 발전을 더욱 억압하고 있습니다. 우리는 이 상황에 대처해야 하며, 희망은 아직 사라지지 않았습니다. 증가하는 부채를 처리하고 경제를 활성화하기 위한 개혁과 법안이 통과되었습니다. 우리에게 필요한 것은 시간과 결단력뿐입니다."
