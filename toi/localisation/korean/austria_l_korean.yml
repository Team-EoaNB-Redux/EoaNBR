 #Army
 AUS_decision_category_austrian_army: "Kaiserlich-königliche Armee"
 AUS_decision_category_austrian_army_desc: "우리 군대가 여전히 제국의 중추로 여겨지지만, 재정난으로 인해 최근 군대를 축소해야 했습니다. 이는 고위 장교들과 보수 엘리트들에게 큰 불만을 안겨주었는데, 군대는 그들에게 능력을 증명하고 고액의 직책으로 승진할 기회를 제공하는 곳이기 때문입니다. 그러나 부채 부담을 줄이고 파산을 피하려면 육군 비용을 더욱 삭감하는 것이 중요할 수 있습니다.\n\n동시에, 최근의 갈등은 최신 군사 혁신과 발전에 뒤처지지 않는 것이 절대적으로 필요하다는 점을 시사합니다. 이 모든 것을 동시에 수용하는 것은 어려운 과제가 될 것입니다."
 AUS_mission_degenfelds_army_reform_plans: "데겐펠트의 육군 개혁 계획"
 AUS_mission_degenfelds_army_reform_plans_desc: "아우구스트 폰 데겐펠트-쇤부르크는 1848/49년 반군에 대항한 황실-왕립군 진압 작전에 참여하는 등 전장에서 상당한 경험을 가진 고위 장교입니다. 그러나 그는 혁신적인 접근 방식에 매우 개방적인 점에서 전형적인 오스트리아 군 지도자가 아닙니다. 그는 비용이 많이 들더라도 미래에 새로운 지평을 열어야 할 필요성을 황제께 설득했습니다."
 AUS_mission_benedeks_army_reform_plans: "베네데크의 육군 개혁 계획"
 AUS_mission_benedeks_army_reform_plans_desc: "루드비히 폰 베네데크는 황실-왕립 육군에서 가장 훈장을 많이 받은 장교 중 한 명입니다. 최근 많은 고위 참모들이 전장에서 능력을 발휘하지 못했을 때도 그의 지휘는 항상 확고하고 칭찬할 만했습니다. 그는 건전한 판단력과 신중함으로 우리의 가치에 충실하고 개혁해야 할 필요성을 황제께 설득했습니다."
