 AUS_tt_centralized_constitutional_monarchy: "2월 특허의 개혁을 유지하여 제국을 §YLiberalize§!하십시오.\n\n이는 제국의 모든 §Ynationalities§!에 걸쳐 §Gunity§!를 촉진하고 오스트리아 자유주의자들의 칭송을 받을 것이지만, 헝가리인들은 극도로 §Rdissatisfied§!할 것입니다."
