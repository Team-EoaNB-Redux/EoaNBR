 AUS_decision_cooperate_with_the_kreditanstalt_desc: "'k. k. privilegierte Österreichische Kredit-Anstalt für Handel und Gewerbe'는 1855년 유명한 유대인 은행 가문 로스차일드의 후손인 안젤름 살로몬 폰 로스차일드에 의해 설립되었습니다. 이 은행은 빠르게 성장하고 있으며 유럽 전역에서 사업적 관심을 끌고 있습니다. 이들과 협력한다는 것은 우리의 부채 문제가 유능한 손에 맡겨진다는 것을 의미할 것입니다."
 AUS_decision_cooperate_with_the_kreditanstalt_effect_tt: "\n§YAnselm Salomon von Rothschild§!를 §Yadvisor§!로 선택하면 미래에 §Ydebt§!를 §Greduce§!할 더 많은 기회를 얻을 수 있습니다."
