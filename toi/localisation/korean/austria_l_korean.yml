 austria2.130.a: "폴란드인들도 새로운 현실에 적응해야 할 것 같습니다?"
 austria2.131.t: "헝가리 조세 거부"
 austria2.131.d: "우리의 중앙집권화 시도 이후, 헝가리의 저항은 크게 확산되었습니다. 헝가리 저항 운동 지도자들은 조세 보이콧을 시작했으며, 이는 비옥한 토양에 떨어진 씨앗처럼 보입니다."
 austria2.131.a: "그들을 이성으로 설득해야 합니다."
 AUS_enforced_enhanced_centralization_effect_tt: "새로운 §Yfocus§!가 국무총리로 §Ypolitical hardliner§!를 임명하기 위해 잠금 해제되었습니다."
 austria2.132.t: "중앙 권한 성공적으로 집행"
 austria2.132.d: "현재로서는 우리의 적들이 처리된 것으로 보입니다. 중앙집권화 조치들은 이제 주요 저항에 직면하지 않고 있으며, 우리는 왕국 전역에 걸쳐 이 조치들을 계속 시행할 수 있습니다. 시간이 주어지면, 이것은 우리 행정부를 우리의 영광스러운 프란츠 요제프 1세 황제의 손에 가장 강력한 권위를 가진 제대로 된 중앙집권적 정부로 개혁할 수 있을 것입니다."
 austria2.132.a: "반가운 소식입니다!"
 
 #FEDERALIZATION OF THE EMPIRE
 austria2.141.t: "제국 내 민족들과의 협상 시작"
 austria2.141.d: "오스트리아 제국은 이제 준자치 국가들로 이루어진 거대한 중앙 유럽 연방을 형성하는 방향으로 나아가고 있습니다. 역사적으로 제국은 항상 오스트리아(치슬라이타니아)와 헝가리(트란슬라이타니아)가 통치하는 두 가지 주요 지역으로 나뉘어 있었습니다.\n\n새로운 연방을 구상하면서, 우리는 소수 민족들에게도 자치권을 부여하는 것을 고려해야 합니다. 이는 우리의 두 국가를 약화시킬 수 있지만, 그 과정에서 더 안정적인 연방을 만들 수 있을 것입니다."
 austria2.141.a: "마자르족하고만 협상하겠습니다."
 austria2.141.b: "모든 민족들과 협상하겠습니다."
 austria2.142.t: "빈 회의"
 austria2.142.d: "프란츠 요제프 황제는 오스트리아 연방의 틀을 논의하기 위해 제국 전체의 대표들을 빈으로 소집했습니다. 빈 회의라고 불리는 이 회의는 제국 내 다수 소수 민족들의 운명을 결정할 것입니다. 연방은 마침내 자치권 문제와 민족 갈등을 해결할 것입니다.\n\n황제께서는 붕괴 직전의 제국 문제들을 해결할 회의의 능력에 큰 기대를 걸고 있습니다. 제국의 미래가 어떻게 될지는 오직 신만이 아시겠지만, 황제께서는 각 집단의 요구를 경청하고 제국의 더 큰 선을 위해 가장 공정한 것이 무엇인지 결정할 것입니다. 바라건대, 그것으로 평화를 회복하기에 충분할 것입니다."
 austria2.142.a: "모든 것이 잘 풀리기를 바랍니다."
 austria2.143.t: "빈 회의 종료"
 austria2.143.d: "여러 달간의 협상 끝에 빈 회의가 마침내 종료되었습니다. 황제께서는 경청하셨고, 모든 관심사에 대한 결정을 내리셨습니다.\n\n새로운 연방은 제정되지 않을 것이며, 영토 변화는 공식화될 것입니다. 일부에게는 자치권을, 다른 이들에게는 현상 유지를. 정치에서는 모든 사람을 만족시킬 수는 없지만, 황제께서는 이러한 새로운 국경과 행정부가 적어도 수십 년간의 평화를 가져다줄 것이라고 확신하고 있습니다.\n\n좋든 나쁘든, 연방과 황제께 영원한 영광이 있기를!"
 austria2.143.a: "제국은 다시 태어났습니다."
 austria2.144.t: "마자르족과 협상"
 austria2.144.d: "오스트리아 제국에서 가장 큰 소수 민족인 마자르족은 항상 왕국에서 자치권을 얻는 데 열심이었습니다. 1848년은 그들이 원하는 것을 얻을 때까지 그들의 생각이 포기되지 않을 것임을 보여주었으며, 이것이 바로 이 협상의 이유입니다.\n\n이제 우리는 오스트리아 왕실이 헝가리 왕실을 받아들일지 거부할지 결정해야 합니다. 그러나 이를 거부하는 것은 문제만 야기할 것이 분명해 보입니다."
 austria2.144.a: "헝가리 왕실을 받아들이십시오"
 austria2.144.b: "헝가리 왕실을 거부하십시오"
 austria2.145.t: "슬로바크족과 협상"
 austria2.145.d: "슬로바크족은 카르파티아 산맥의 많은 소수 민족 중 하나입니다. 역사적으로 헝가리 영토였던 트란스라이타니아 북부에 위치한 슬로바크족은 제국의 다른 많은 민족들처럼 자치권을 요구해왔습니다. 이제 연방이 구상되면서, 우리는 슬로바키아 자치 지역에 대한 우리의 입장을 공식적으로 밝힐 수 있습니다.\n\n우리는 슬로바크족의 완전한 자치권을 수용할 수도 있지만, 그렇게 할 경우 헝가리를 강화시킬 수도 있습니다."
 austria2.145.a: "슬로바키아 자치권을 제정하십시오"
 austria2.145.b: "슬로바키아를 헝가리 아래에 두십시오"
 austria2.146.t: "트란실바니아인들과 협상"
 austria2.146.d: "트란실바니아는 헝가리 트란스라이타니아의 한가운데 있는 지방입니다. 트란실바니아인들은 헝가리 왕실과는 별도의 공국 아래에서 상대적인 자치권을 가지고 있었지만, 여전히 헝가리인들에 의해 공식적으로 관리되었습니다.\n\n트란실바니아는 완전한 자치권을 위한 훌륭한 후보가 될 수 있으며, 이는 지역을 안정시킬 수 있지만 헝가리를 약화시킬 수도 있습니다. 우리는 가장 헝가리인 지역인 세켈란드를 헝가리에 남겨두고 나머지는 완전한 자치권을 줄 수도 있습니다."
 austria2.146.a: "트란실바니아에 완전한 자치권을 부여하십시오"
 austria2.146.b: "세켈란드를 제외한 트란실바니아에 자치권을 부여하십시오"
 austria2.146.c: "트란실바니아를 헝가리 아래에 두십시오"
 austria2.147.t: "크로아티아인들과 협상"
 austria2.147.d: "크로아티아는 항상 오스트리아 제국의 긴장 요소였습니다. 헝가리가 대부분의 영토를 주장하지만, 크로아티아인들은 다른 많은 민족들처럼 더 많은 자치권과 자신들의 운명을 스스로 결정할 능력을 원했습니다. 달마티아는 오스트리아 제국에서 가장 중요한 항구들을 가지고 있으므로, 크로아티아의 자치권은 제국을 안정시킬 수 있지만, 지중해에서 오스트리아의 존재감을 약화시킬 수도 있습니다.\n\n우리는 크로아티아에 그들이 주장하는 영토 중 달마티아를 제외한 부분만 줄 수도 있지만, 헝가리 내부에 머무르게 할 수도 있습니다."
 austria2.147.a: "달마티아와 함께 완전한 자치권"
 austria2.147.b: "달마티아 없는 자치권"
 austria2.147.c: "달마티아와 함께 완전한 자치권"
 austria2.148.t: "이탈리아인들과 협상"
 austria2.148.d: ""
 austria2.148.a: "베네치아 자치권과 트렌티노를 부여하십시오"
 austria2.148.b: "베네치아 자치권을 부여하십시오"
 austria2.148.c: "자치권을 부여하십시오"
 austria2.148.e: "베네치아 자치권을 부여하십시오"
 austria2.149.t: "보헤미아인들과 협상"
 austria2.149.d: "보헤미아는 오스트리아가 관리하는 지역인 치슬라이타니아의 일부입니다. 보헤미아인들은 보헤미아 왕국의 복귀를 위해 싸웠습니다. 종종 자유주의적인 체코 정치인들은 이제 오스트리아와 자치권을 협상할 용의가 있습니다.\n\n체코인들이 주장하는 보헤미아 왕국의 역사적 영토에는 독일계 다수 지역인 주데텐란트가 포함되어 있습니다. 우리는 오스트리아가 주데텐란트를 유지한다는 조건하에 보헤미아의 자치권을 허용할 수 있지만, 오스트리아는 부유한 보헤미아 지역에서 오는 경제적 지원을 활용할 수 있으므로 전체 영토를 유지할 수도 있습니다."
 austria2.149.a: "보헤미아에 완전한 자치권"
 austria2.149.b: "주데텐란트는 오스트리아 하에, 나머지는 보헤미아에"
 austria2.149.c: "모든 보헤미아는 오스트리아 하에 머무를 것입니다"
 austria2.150.t: "갈리치아인들과 협상"
 austria2.150.d: "갈리치아-로도메리아의 광대한 영토는 오스트리아가 관리하는 치슬라이타니아 영토의 가장 동쪽에 위치해 있습니다. 갈리치아 문화는 항상 빈 지도부와 대립해 왔습니다. 오스트리아보다는 폴란드에 더 가까워서, 그들은 수세기 동안 자치권을 요구해왔습니다. 이제 연방이 형성되고 있으니, 그들은 기회를 잡으려 합니다."
 austria2.150.a: "갈리치아에 완전한 자치권"
 austria2.150.b: "크라쿠프에 자치권을 주되 갈리치아는 주지 마십시오"
 austria2.150.c: "모든 갈리치아는 오스트리아 하에 머무를 것입니다"
 austria2.151.t: "세르비아인들과 협상"
 austria2.151.d: "보이보디나의 작은 지방은 공식적으로 헝가리 통제하에 있는 남부 트란슬라이타니아의 슬라브족 다수 지역입니다. 이들은 매우 작은 지역이라 큰 문제를 일으키지는 않겠지만, 이들을 진정한 자치 지역으로 만드는 것을 고려해 볼 수 있습니다. 새로운 연방은 제국 내 모든 소수 민족의 필요를 고려해야 합니다."
 austria2.151.a: ""
 
 ###AUSTRIA-HUNGARY COMPROMISE EVENTS
 #COMPROMISE ARRANGEMENTS
 austria2.143.a: "제국은 다시 태어났습니다."
 austria2.144.t: "마자르족과 협상"
 austria2.144.d: "오스트리아 제국에서 가장 큰 소수 민족인 마자르족은 항상 왕국에서 자치권을 얻는 데 열심이었습니다. 1848년은 그들이 원하는 것을 얻을 때까지 그들의 생각이 포기되지 않을 것임을 보여주었으며, 이것이 바로 이 협상의 이유입니다.\n\n이제 우리는 오스트리아 왕실이 헝가리 왕실을 받아들일지 거부할지 결정해야 합니다. 그러나 이를 거부하는 것은 문제만 야기할 것이 분명해 보입니다."
 austria2.144.a: "헝가리 왕실을 받아들이십시오"
 austria2.144.b: "헝가리 왕실을 거부하십시오"
 austria2.145.t: "슬로바크족과 협상"
 austria2.145.d: "슬로바크족은 카르파티아 산맥의 많은 소수 민족 중 하나입니다. 역사적으로 헝가리 영토였던 트란스라이타니아 북부에 위치한 슬로바크족은 제국의 다른 많은 민족들처럼 자치권을 요구해왔습니다. 이제 연방이 구상되면서, 우리는 슬로바키아 자치 지역에 대한 우리의 입장을 공식적으로 밝힐 수 있습니다.\n\n우리는 슬로바크족의 완전한 자치권을 수용할 수도 있지만, 그렇게 할 경우 헝가리를 강화시킬 수도 있습니다."
 austria2.145.a: "슬로바키아 자치권을 제정하십시오"
 austria2.145.b: "슬로바키아를 헝가리 아래에 두십시오"
 austria2.146.t: "트란실바니아인들과 협상"
 austria2.146.d: "트란실바니아는 헝가리 트란스라이타니아의 한가운데 있는 지방입니다. 트란실바니아인들은 헝가리 왕실과는 별도의 공국 아래에서 상대적인 자치권을 가지고 있었지만, 여전히 헝가리인들에 의해 공식적으로 관리되었습니다.\n\n트란실바니아는 완전한 자치권을 위한 훌륭한 후보가 될 수 있으며, 이는 지역을 안정시킬 수 있지만 헝가리를 약화시킬 수도 있습니다. 우리는 가장 헝가리인 지역인 세켈란드를 헝가리에 남겨두고 나머지는 완전한 자치권을 줄 수도 있습니다."
 austria2.146.a: "트란실바니아에 완전한 자치권을 부여하십시오"
 austria2.146.b: "세켈란드를 제외한 트란실바니아에 자치권을 부여하십시오"
 austria2.146.c: "트란실바니아를 헝가리 아래에 두십시오"
 austria2.147.t: "크로아티아인들과 협상"
 austria2.147.d: "크로아티아는 항상 오스트리아 제국의 긴장 요소였습니다. 헝가리가 대부분의 영토를 주장하지만, 크로아티아인들은 다른 많은 민족들처럼 더 많은 자치권과 자신들의 운명을 스스로 결정할 능력을 원했습니다. 달마티아는 오스트리아 제국에서 가장 중요한 항구들을 가지고 있으므로, 크로아티아의 자치권은 제국을 안정시킬 수 있지만, 지중해에서 오스트리아의 존재감을 약화시킬 수도 있습니다.\n\n우리는 크로아티아에 그들이 주장하는 영토 중 달마티아를 제외한 부분만 줄 수도 있지만, 헝가리 내부에 머무르게 할 수도 있습니다."
 austria2.147.a: "달마티아와 함께 완전한 자치권"
 austria2.147.b: "달마티아 없는 자치권"
 austria2.147.c: "달마티아와 함께 완전한 자치권"
 austria2.148.t: "이탈리아인들과 협상"
 
