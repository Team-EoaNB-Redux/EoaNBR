 austria.411.a: "모두 체포하십시오!"
 austria.411.b: "그들을 내버려 두십시오."
 austria.412.t: "헌법 개정 발표, 대중을 진정시키다"
 austria.412.d: "총리 [AUS.GetLeader] 하의 새 정부가 헌법을 개정할 것이라는 발표는 초기 헌법 외교문서가 야기했던 불안을 다소 진정시켰습니다. 상황이 어떻게 전개될지는 아직 지켜봐야 할 것입니다."
 austria.418.t: "보헤미아 지방의회 대표단 파견 반대 시위"
 austria.418.d: "보헤미아 지방의회의 비독일계 대표단 다수가 빈의 중앙 정부에 반대하며, 보헤미아 대표들을 제국 의회(Reichsrat)에 파견하는 것을 거부할 것을 요구하고 있습니다. 1848/49년 혁명 이후, 점점 더 많은 지방 당국 및 지역 의회의 의석이 독일-보헤미아 공동 문화 정체성을 포용하는 후보들에서 벗어나 민족 의식을 가진 체코 또는 슬로바키아 정체성의 옹호자들에게로 옮겨갔습니다. 이들 민족 선동가들 중 가장 노골적인 사람들은 빈으로부터의 광범위한 자율을 요구하고 있습니다. 특히 자유주의 통치하에서도 좌절된 체코 민족의 열망을 고려할 때 더욱 그렇습니다. 빈으로 대표들을 파견하는 것을 거부할 가능성이 있는 헝가리와 크로아티아 관리들과의 소통에 이어, 보헤미아 대표들은 새 헌법과 제국 의회(Reichsrat)의 압도적인 권위에 항의하고 있습니다. 그러나 그들의 시위는 성공할 가능성이 낮습니다. 독일계 및 친정부 대표들이 여전히 보헤미아 지방의회에서 다수를 차지하고 있기 때문입니다."
 austria.418.a: "적어도 우리는 독일계 다수에 기댈 수 있습니다..."
 austria.419.t: "갈리치아 지방의회, 조건부 대표 파견"
 austria.419.d: "예상했던 대로, 갈리치아 지방의회 역시 빈의 제국 의회(Reichsrat)로 대표를 파견하는 것에 반대하는 시위에 동참했습니다. 폴란드인과 우크라이나인 농민으로 구성된 친-합스부르크 위원회가 임명되었음에도 불구하고, 폴란드 귀족들은 이 기회를 이용하여 빈으로부터의 지속적인 자치권을 위한 자신들의 의제를 추진했습니다. 대표들은 파견될 것이지만, 갈리치아 당국은 빈의 중앙 정부에 새 헌법과 자신들의 축소된 지역 자치권에 대한 불만을 상기시키고자 합니다. 이는 러시아 제국이 점령한 폴란드 영토에서 긴장이 고조되는 시기에 발생했으며, 그곳에서 폴란드 민족 독립 파벌의 옹호자들이 오스트리아 제국의 갈리치아 영토로 유입되어 왕국 내 폴란드 소수 민족들 사이에서 추가적인 불만을 야기하고 있습니다."
 austria.419.a: "헌법에 만족하는 사람이 있습니까?"
 austria.420.t: "트란실바니아 지방의회, 대표 파견 거부"
 austria.420.d: "트란실바니아 공국의 지방의회는 빈의 제국 의회(Reichsrat)로 대표 파견을 거부하고 있습니다. 그들은 의심할 여지 없이 헝가리인들의 결정에 영향을 받았습니다."
 austria.420.a: "결국에는 납득할 것입니다."
 austria.421.t: "이스트리아 지방의회, 대표 파견 거부"
 austria.421.d: "이스트리아 지방의회는 빈의 중앙 정부에 제국 의회(Reichsrat)로 대표를 파견하지 않을 것임을 통보했습니다. 헌법 제정 초기부터 그 존재 자체가 의문시되었던 만큼, 많은 이스트리아 관리들은 이제 대표단 파견을 거부하기로 결정했습니다. 이탈리아 미회수 영토주의(irredentism)에 대한 동조와 리소르지멘토(Risorgimento)를 위한 요구는 이스트리아 지역의 오스트리아 본토로의 추가 통합을 효과적으로 저해했습니다. 결과적으로, 많은 이스트리아 대표들은 제국 의회(Reichsrat)가 빈에 부여할 강화된 중앙 권위에 항의하고 있습니다."
 austria.421.a: "그들은 따를 것입니다!"
 austria.422.t: "남티롤 대표 일부의 항의"
 austria.422.d: "독일-이탈리아 인구가 분열된 지역인 남티롤을 대표하는 대표단들은 빈의 제국 의회(Reichsrat)로 대표를 파견하라는 최근 요청에 반대 시위를 벌였습니다. 헌법에 따라 본래 티롤과는 별개의 직할령으로 공식 인정되지 않았음에도 불구하고, 이 지역의 많은 이탈리아어권 관리들은 이탈리아 대의에 대한 동조를 표명했습니다. 그들은 자신들의 선거구를 티롤 지방의회 대신 베네치아 지방의회에 통합시켜야 한다고 요구하고 있습니다."
 austria.422.a: "그들은 따를 것입니다!"
 austria.423.t: "지방의회 대표단, 빈으로 파견"
 austria.423.d: "다양한 지방의회들, 또는 적어도 새 헌법을 준수하는 의회들이 자신들의 제국 의회(Reichsrat) 대표들을 빈으로 파견했습니다. 그들은 곧 수도에 도착할 것으로 예상되며, 많은 호텔이 몇 주 동안 예약이 꽉 찼습니다. 대표단이 빈을 거닐며 춤을 추는 것은 상당한 구경거리가 될 것이며, 도시는 흥분으로 들끓고 있습니다."
 austria.423.a: "환영합니다."
 AUS_landtag_delegates_dispatched_effect_tt: "§Ydelegates§!가 빈으로 파견되었으며, 이제 §YReichsrat§! 취임을 위한 §Yfocus§!를 시작할 수 있습니다."
 austria.424.t: "프란츠 요제프 1세 황제, 제국 의회(Reichsrat) 취임식을 거행하다"
 austria.424.d: "양원의 대표단이 빈에 모였고, 프란츠 요제프 1세 폐하께서는 새 헌법의 일반적인 강령으로 이해될 연설과 함께 회의 취임식을 거행하셨습니다. 황제께서는 중앙집권적 국가를 보존하려는 자신의 열망을 미려하지만 명확한 언어로 말씀하셨습니다. 대표단은 다음 며칠 동안 첫 번째 안건으로 헌법과 황제의 비전을 수용할지 여부에 대해 투표해야 할 것입니다."
 austria.424.a: "카이저 프란츠 요제프 만세!"
 AUS_reichsrat_inauguration_effect_tt: "대표단이 모여 황제의 비전과 그에 따른 새 헌법을 수용할지 여부에 대해 논의하고 최종적으로 투표할 것입니다."
 austria.425.t: "양원, 헌법에 투표하다"
 austria.425.d: "양원의 대표단은 새 헌법의 일반적인 강령에 대해 투표했습니다. 지난 며칠 동안 우려가 제기되었음에도 불구하고, 양원 대표단의 대다수는 제안된 헌법과 중앙집권적 국가를 보존하려는 황제의 계획에 동의했습니다."
 austria.425.a: "성공입니다!"
 austria.426.t: "헝가리 지방의회, 황제에게 항의 서한을 보내다"
 austria.426.d: "헝가리 지방의회 내부 논쟁 끝에 페렌츠 데아크를 지지하는 대표단이 승리하여 프란츠 요제프 1세 황제에게 항의 서한을 보냈습니다. 그들은 다뉴브 강 반대편의 독일계 도시 오펜(부다) 대신 주로 헝가리계 주민이 거주하는 페스트에서 헝가리 지방의회가 모일 것을 요구했습니다. 그러나 그들의 주요 관심사는 새 헌법 준수를 계속 거부하는 것입니다. 헝가리 대표단은 1848년 헝가리 헌법의 효력이 유효하다고 계속 주장하고 있습니다."
 austria.426.a: "그들의 무례함을 무시합시다."
 austria.427.t: "개인의 자유와 재산 보호를 위한 법률 통과"
 austria.427.d: "황제께서는 오늘 어떤 개인의 불법 기소로부터 개인의 자유를 보장하고, 상당한 증거가 필요한 적절한 영장 없는 가택 수색을 금지하는 칙령을 반포하셨습니다. 이 법은 [AUS.GetLeader]에 의해 초안되었으며, 오스트리아 제국에서 법치주의를 채택하는 중요한 단계를 의미합니다."
 austria.427.a: "우리 백성들에게 좋은 소식입니다."
 austria.428.t: "[AUS.GetLeader] 사임"
 austria.428.d: "제국 전역에 걸쳐 헌법을 집행하는 데 실패한 후, 국무장관 [AUS.GetLeader]은(는) 사임하기로 결정했습니다. 폐하께서는 그의 성실하고 지칠 줄 모르는 봉사에 감사드리며, 그에게 남아있는 모든 여정에 행운이 있기를 기원하셨습니다. 황제께서는 선언된 보수주의자 리하르트 벨크레디 백작을 후임으로 선택하셨습니다."
 austria.428.a: "그가 최적의 후보입니다."
 austria.429.t: "헝가리 문제"
 austria.429.d: "새 국무장관 [AUS.GetLeader]은(는) 헝가리 자치 문제가 제국의 지속적인 안정과 발전에 결정적인 요소가 될 것이라고 판단했습니다. 마자르인들은 전통적인 권리에 대해 매우 자의식이 강하며 헝가리 왕국이 제국의 나머지 부분과 별도로 취급되기를 요구합니다. 이 문제가 해결되어야만 비로소 진전과 번영이 있을 수 있습니다."
 austria.429.a: "타협점을 찾아야 합니다..."
 AUS_failure_to_bring_hungarians_to_reason_effect_tt: "§RThis will result in the constitution being suspended, which is going to have severe consequences.§!"
 austria.430.t: "헌법 정지"
 austria.430.d: "제국 여러 곳에서의 계속된 시위와 저항에 따라, 프란츠 요제프 1세 황제는 헌법 특허를 정지하기로 결정했습니다. 모든 곳에서 성공적으로 시행되지 않았기 때문에, 이 결정의 반향의 규모는 왕국 전역에서 다양하게 나타납니다. 그러나 이는 오스트리아 헌정 역사에서 새로운 저점을 기록하는 것입니다. 오스트리아가 다시 한번 헌법이 없는 상태가 되었으므로, 다음 몇 달과 몇 년은 상황이 어떻게 전개될지를 보여줄 것입니다."
 austria.430.a: "다른 선택지가 없었던 것 같습니다..."
 austria.431.t: "헌정 체제 확립"
 austria.431.d: "안톤 폰 슈메르링과 그의 정부는 제국 전역에 걸쳐 헌정 체제를 성공적으로 확립했습니다. 이는 제국 권위의 지속과 영토 전체의 안정에 중요한 단계가 됩니다. 이제 우리는 마침내 미래를 내다볼 수 있습니다."
 austria.431.a: "반가운 소식입니다!"
 
 austria.433.t: "막시밀리안 대공, 멕시코로 떠나다"
 austria.433.d: "우리의 사랑하는 막시밀리안 대공은 유럽 강대국들의 요청에 응하여 멕시코의 왕위를 차지하게 되었습니다."
 austria.433.a: "그가 그리울 것이 분명합니다!"
 austria.434.t: "막시밀리안 대공, 멕시코 황제로 즉위"
 austria.434.d: "우리의 사랑하는 막시밀리안 대공이 며칠 전 멕시코 황제로 즉위했습니다. 이것은 분명 오스트리아 제국과 합스부르크 가문에 큰 경사입니다. 멕시코 국민과 함께 '황제 만세!'를 외칩니다!"
 austria.434.a: "막시밀리안에게 모든 행운이 있기를 기원합니다!"
 
 austria.451.t: "벨크레디 백작, 사임 제안"
 austria.451.d: "리하르트 벨크레디의 재임 기간이 끝난 것으로 보입니다. 프로이센에게 패배한 후, 오스트리아 제국을 연방화된 국가로 철저히 개혁하기 위한 다양한 계획들이 제시되었습니다. 그러나 벨크레디의 계획은 프리드리히 페르디난트 폰 보이스트의 이중 군주국 형성 의제에 찬성하는 쪽으로 빠르게 바뀌었습니다. 전쟁 이전에 작센 정부를 이끌었던 새 외무부 장관은 황제의 신뢰를 얻은 것으로 보이며, 국무장관 벨크레디보다 더 많은 권력을 가질 가능성이 높고, 따라서 벨크레디는 사임을 요청했습니다. 우리가 그의 사임을 받아들이고 폰 보이스트를 새로운 국무장관으로 임명해야 할까요?"
 austria.451.a: "그를 프리드리히 페르디난트 폰 보이스트로 교체하십시오."
 austria.451.b: "그의 사임을 거부하십시오."
 #RELIGIOUS UNREST EVENTS
 austria.491.t: "1855년 콘코르다트(Concordat)의 여파"
 austria.491.d: "1855년 콘코르다트(Concordat)에 명시된 오스트리아 주교회의의 권한과 영향력을 크게 확대하는 합의 이후, 제국의 독일어권 지역에서는 카톨릭 교회의 지속적인 권한 강화에 반대하는 시위가 시작되었으며, 이는 최근의 반성직자주의 운동을 더욱 강화시켰습니다. 많은 사람들은 제국 전역의 교육 부문에 대한 통제권을 카톨릭 교회에 이양하는 것이 재앙적인 결과를 초래할 수 있다고 주장합니다. 그럼에도 불구하고, 지금까지 황제와 그의 정부는 개혁이나 폐지 요구를 모두 거부했습니다."
 austria.491.a: "이 합의는 황제의 뜻과 일치하며, 우리는 이를 옹호해야 합니다."
 austria.492.t: "오스트리아 제국의 종교적 불안"
 austria.492.d: "우리 제국의 일부 지역에는 상당수의 비가톨릭 기독교 교단들이 존재하며 활동하고 있습니다. 그중 일부는 다른 교단보다 더 두드러지고 목소리를 냅니다. 우리 왕국에는 이단적 경향과 불신자들에 대한 오랜 투쟁의 역사가 있으며, 우리는 이 문제들을 결국 어떻게 처리할지 결정해야 합니다. 보헤미아와 모라비아에서는 여전히 얀 후스(Jan Hus)의 가르침을 따르는 일부 작은 이단 단체들이 있으며, 혁명 이후 더 강해진 지하 발도파(Waldensian) 단체들도 있습니다. 그들은 우리의 통치 안정성과 우리 왕국 내 기독교 신앙의 온전성에 위협이 됩니다."
 austria.492.a: "또 다른 주의해야 할 사항입니다."
 austria.493.t: "프로테스탄텐파텐트(Protestantenpatent)"
 austria.493.d: "제국 내 개신교도들의 시위를 진정시키기 위해 프란츠 요제프 1세 황제는 이른바 프로테스탄텐파텐트(Protestantenpatent)를 제정했습니다. 이 25개 조항으로 구성된 특허는 오스트리아 제국 내 개신교도들에게 신앙과 예배의 자유를 부여하며, 어쨌든 종교적 관행에 대한 다른 규정을 가진 헝가리 왕국은 예외입니다. 본질적으로, 이 특허는 복음주의(루터교) 및 아우크스부르크 신앙 고백의 개혁 교회에 로마 카톨릭 교회와 상대적인 법적 평등을 부여합니다. 이러한 움직임은 1855년 콘코르다트(Concordat)의 규정에 반대하는 제국 내외의 개신교도들의 수년간의 반대 끝에 나온 것입니다. 제국 내 기독교 소수 민족들은 국가 행정 내에서 로마 카톨릭 교회의 영향력과 통제력이 증가하는 것에 대해 지나치게 경계해왔습니다. 양보의 의미로, 황제는 특정 제한과 예외를 제외하고 오스트리아 왕국의 개신교 교회들의 관행과 신앙에 대해 법적으로 평등을 선언했습니다."
 austria.493.a: "이것으로 개신교도들을 만족시킬 수 있을 것입니다."
 austria.494.t: "카톨릭 급진주의자들, [153.GetName]에서 프로테스탄텐파텐트(Protestantenpatent)에 항의"
 austria.494.d: "프로테스탄텐파텐트(Protestantenpatent) 비준 및 시행 직후, 압도적으로 카톨릭 인구가 많은 [153.GetName] 지역의 많은 사람들이 새로 제정된 특허에 대한 항의 시위를 위해 거리로 나왔습니다. 주로 카톨릭 광신도들로 구성된 군중은 이 특허를 도덕적으로 부적절한 신앙을 달래기 위한 비겁한 움직임이라고 부르며 특허의 폐지 및 철회를 요구했습니다. 군중 속의 많은 사람들은 황제와 그의 정부가 유럽의 종교적 조화를 혼란에 빠뜨릴 수 있는 이단자들을 편들면서 제국의 충실한 카톨릭 신민인 자신들을 배신했다고 느낍니다. 이러한 반응과 신념은 모든 형태의 사회 변화에서 예상되는 것이며, 좋든 나쁘든 이 특정 집단도 예외는 아닙니다."
 austria.494.a: "이 완고한 바보들 같으니라고..."
 #austria.501.t: "세르비아 보이보디나 폐지"
 #austria.501.d: "1848년과 1849년 혁명에 대한 대응으로 1849년 11월에 형성된 세르비아 보이보디나는 오스트리아 제국에서 세르비아인들의 특권이 수십 년간 증가한 결과물이었습니다.\n\n그러나 헝가리 지도부는 1860년에 이를 헝가리 왕국에 다시 편입할 것을 요구했습니다. 1867년에 헝가리는 직접 통치를 얻었고, 단계적으로 보이보디나는 왕국에 편입되었습니다.\n\n20년 간의 존재 끝에 세르비아 보이보디나는 공식적으로 폐지되었고, 세르비아의 자치권은 다시 한번 축소되었습니다."
 #austria.501.a: "모든 길은 부다페스트와 빈으로 통한다"
 
 ###ARMY EVENTS
 #AUSTRIAN ARMY REFORM EVENTS - DEGENFELD
 austria.601.t: "아우구스트 폰 데겐펠트, 군사 이론가로 임명"
 austria.601.d: "프란츠 요제프 1세 황제는 육군 개혁 프로그램을 누가 이끌어야 할지에 대한 결정을 발표했습니다. 황제께서는 육군 중장 아우구스트 폰 데겐펠트-쇤부르크에게 이 중요한 임무를 맡기셨습니다. 데겐펠트는 비용이 상당할 수 있음에도 불구하고 그의 혁신적인 접근 방식과 현대 전쟁에 대한 심오한 지식으로 황제를 설득했다고 여겨집니다."
 austria.601.a: "군대에 반가운 소식입니다!"
 AUS_appointed_degenfeld_effect_tt: "§YAugust von Degenfeld will begin implementing his proposed army reform plans shortly.§!"
 
 austria.623.t: "군사 철도부에 특수 훈련 투자?"
 austria.623.d: "최근 창설된 군사 철도부의 병사들은 분쟁 시 효율적으로 행동하기 위해 자신들의 임무와 다루는 기술 장비에 대한 특별한 지침을 필요로 합니다. 훈련에 투자하는 것은 그들의 유용성과 가져다줄 이점을 확실히 증가시킬 수 있습니다. 시간이 주어지면, 이 과정에서 얻는 경험으로부터도 이득을 볼 수 있을 것입니다. 훈련을 촉진하기 위해 필요한 투자를 해야 할까요?"
 austria.623.a: "그렇게 합시다."
 austria.623.b: "그럴 가치가 없습니다."
 austria.624.t: "군사 철도부 훈련 완료"
 austria.624.d: "군사 철도부를 위한 우리의 특별 훈련 프로그램이 몇 주 전에 완료되었습니다. 불행히도, 강사들과 장교들 모두 일상적인 업무, 지식, 그리고 최근 훈련에서의 압박감 속에서의 성과 면에서 거의 진전이 없었다고 보고했습니다. 이 계획은 아직 성공적이지 못한 것 같습니다. 계속해서 투자해야 할까요?"
 austria.624.a: "훈련 프로그램에 대한 투자를 갱신합시다."
 austria.624.b: "훈련 프로그램에 대한 투자를 중단합시다."
 austria.625.t: "군사 철도부 훈련 완료"
 austria.625.d: "군사 철도부를 위한 우리의 특별 훈련 프로그램이 몇 주 전에 완료되었습니다. 강사들과 장교들 모두 일상적인 업무, 지식, 그리고 최근 훈련에서의 압박감 속에서의 성과 면에서 큰 진전이 있었다고 보고했습니다. 이 계획은 성공적인 것 같습니다!"
 austria.625.a: "군대에 반가운 소식입니다."
 #AUSTRIAN ARMY REFORM EVENTS - BENEDEK
 austria.621.t: "루드비히 폰 베네데크, 군사 이론가로 임명"
 austria.621.d: "프란츠 요제프 1세 황제는 육군 개혁 프로그램을 누가 이끌어야 할지에 대한 결정을 발표했습니다. 황제께서는 노련한 포병감 루드비히 폰 베네데크에게 이 중요한 임무를 맡기셨습니다. 베네데크는 그의 기개와 전장 경험, 그리고 저비용 고효율이라는 약속으로 황제를 설득했다고 여겨집니다."
 austria.621.a: "군대에 반가운 소식입니다!"
 AUS_appointed_benedek_effect_tt: "§YLudwig von Benedek will begin implementing his proposed army reform plans shortly.§!"
 
 austria.676.t: "오스트리아 군사 저널 (Österreichische Militärische Zeitschrift)"
 austria.676.d: "'외스터라이히셰 밀리테리셰 차이츠슈리프트(Österreichische Militärische Zeitschrift)', 즉 오스트리아 군사 저널은 1808년 아우스터리츠 전투에서 나폴레옹에게 굴욕적인 패배를 겪은 후 오스트리아 제국군이 겪은 개혁 및 재편성 조치를 보완하고 지원하기 위해 설립되었습니다. 개혁 과정을 이끌었던 카를 대공은 고위 장교들에게 군사 과학의 중요한 발전 사항들을 정기적인 저널 형식으로 교육하는 것이 적절하다고 보았습니다. 이 저널에 실린 기사들의 목표는 전 세계의 군사 및 과학적 발전으로부터 전장 적용을 위한 전략적, 작전적, 전술적 결론을 도출하는 것입니다."
 austria.676.a: "군대에 반가운 소식입니다!"
 
 austria.651.t: "후장총 개발 성공"
 austria.651.d: "비현실적인 목표처럼 느껴졌던 수개월간의 노고 끝에, 국내 제작 후장총 기술에 할당된 개발 자금이 마침내 엄청난 성공으로 입증되었습니다! 기존 로렌츠 소총에 후장식 메커니즘을 적용하는 임무를 맡은 엔지니어들이 최근 신뢰할 수 있고 작동하는 시제품이 제작, 테스트, 승인되었다고 보고했습니다. 이를 통해 우리는 마침내 획기적인 프로이센 드라이제 니들-건과 동등한 국내 제작 모델을 가지게 될지도 모릅니다!"
 austria.651.a: "군대에 반가운 소식입니다!"
 austria.652.t: "후장총 개발 실패"
 austria.652.d: "대량 생산을 위한 작동 가능한 후장식 메커니즘을 설계, 시제품 제작 및 준비하도록 임명된 엔지니어링 위원회는 막대한 비용 손실로 인한 실패를 보고했습니다. 적절한 설계를 공학적으로 구현하려는 시도에서, 획기적인 성공을 보여주지 못한 채 엄청난 속도로 자금이 소진된 것으로 보입니다. 시제품이 계속 실패하고 재제작이 필요했으며, 마침내 재정이 바닥났습니다. 추가적인 설계 및 도구 변경을 계속할 자금이 없어 위원회는 실패를 통보할 수밖에 없었습니다. 우리는 유사한 임무를 다른 엔지니어들에게 맡겨볼 수도 있지만, 현재로서는 중요하지 않아 보이는 프로젝트와 아이디어에 대한 이러한 과도한 자금 지원을 감당하기 어렵습니다."
 austria.652.a: "이 모든 자금이 헛된 것이었습니까?"
 
 #GENERALS EVENTS
 austria.701.t: "페렌츠 줄라이 원수 해임"
 austria.701.d: "불과 몇 년 전 원수로 임명된 페렌츠 줄라이 백작은 이탈리아와 프랑스 동맹군과의 마젠타 전투에서 치명적인 패배를 겪으며 무능한 군 지휘관임이 입증되었습니다. 그를 빈으로 소환하고, 대신 황제께서 상황을 직접 통제하여 오스트리아군 전체의 사기가 저하되는 것을 막는 것이 현명합니다. 페렌츠 줄라이가 원수로 남아있는다면, 이는 분명 국민과 군대의 분노를 살 것입니다."
 austria.701.a: "그를 해임하십시오, 하인리히 폰 헤스가 맡을 것입니다."
 austria.701.b: "그를 유지하십시오."
 austria.702.t: "하인리히 폰 헤스의 은퇴"
 austria.702.d: "하인리히 폰 헤스 원수는 오늘 육군 복무에서 사임하기로 결정했습니다. 그는 나폴레옹 전쟁 중 아스페른과 바그람 전투 이후 줄곧 황제와 제국에 충실히 봉사했습니다. 그는 라데츠키와 함께 1830년대 오스트리아군 개혁에 기여했고, 1849년 전쟁에서 피에몬테를 격파하는 데 공헌했습니다. 1859년 그는 공식적으로 원수로 승진하여 피에몬테에 맞서 다시 한번 오스트리아군을 이끌었지만, 이번에는 라데츠키의 지원 없이 예전만큼 성공적이지 못했습니다."
 austria.702.a: "그의 사임을 수락하십시오."
 austria.702.b: "그의 사임을 거부하십시오."
 austria.703.t: "에두아르트 클람-갈라스의 은퇴"
 austria.703.d: "기병대장 에두아르트 클람-갈라스는 오늘 군에서 사임서를 제출하기로 결정했습니다. 그는 1823년에 입대하여 1831년 1기병연대의 기병 대위에서 1846년에는 장군 계급으로 빠르게 승진했습니다. 그는 후에 제1차 이탈리아 독립 전쟁 중 산타 루치아, 비첸차, 쿠스토자 전투에서 두각을 나타냈고, 승리를 인정받아 원수 중장으로 승진했습니다. 그는 반란을 일으킨 헝가리인들에 대항하는 작전에 참전하여 세게스바르 전투에서 큰 승리를 거두었습니다. 최근 그의 이탈리아인들, 특히 이친 전투에서 프로이센인들에게 대한 실패로 군사 재판을 받았지만, 오스트리아 사회 내에서의 그의 지위 덕분에 무죄를 선고받을 수 있었습니다."
 austria.703.a: "그의 사임을 수락하십시오."
 austria.703.b: "그의 사임을 거부하십시오."
 austria.704.t: "레오폴드 곤드레쿠르트를 루돌프의 가정교사로 임명"
 austria.704.d: "젊은 대공이자 황태자 루돌프는 군사 훈련 및 교육을 위한 가정교사가 필요합니다. 미래의 총사령관으로서 군사 교육은 아무리 일찍 시작해도 충분치 않습니다. 비록 가족 중 모두가 동의하는 것은 아니지만 말입니다. 황제께서는 레오폴드 곤드레쿠르트에게 이 중요한 임무를 맡기셨습니다."
 austria.704.a: "미래 황제를 위한 군사 훈련입니다."
 austria.705.t: "레오폴드 곤드레쿠르트를 루돌프의 가정교사에서 해임"
 austria.705.d: "레오폴드 곤드레쿠르트가 황태자의 교육자 직책에서 해임되었습니다. 최근 보고서에 따르면 곤드레쿠르트가 어린 대공을 훈련시키기 위해 사용했던 잔인하고 의심스러운 방법들이 밝혀졌으며, 대공은 곤드레쿠르트의 지도 아래 심하게 고통받았다고 합니다. 황실은 요제프 그라프 라투르 폰 투름부르크를 곤드레쿠르트의 후임으로 선택했습니다. 새로운 가정교사는 자연 과학과 군사 교육에 대한 감각을 가지고 있다고 여겨집니다."
 austria.705.a: "대신 요제프 라투르 폰 투름부르크를 임명하십시오."
 austria.706.t: "프란츠 쿠넨 폰 쿠넨펠트, 소장으로 진급"
 austria.706.d: "프란츠 쿠넨 폰 쿠넨펠트가 소장으로 진급되었음을 영광스럽게 발표합니다. 그의 연공 서열과 전장에서의 업적은 이번 진급을 정당화하며, 우리는 새로운 장군에게 지휘 기간 동안 행운이 있기를 기원합니다."
 austria.706.a: "좋습니다."
 austria.707.t: "빌헬름 프란츠 카를 대공, 장군으로 진급"
 austria.707.d: "빌헬름 프란츠 카를 대공이 장군으로 진급하여 오스트리아 제국에서 가장 높은 계급의 장교 중 한 명이 되었습니다. 우리는 그가 앞으로 맡게 될 모든 지휘에서 행운이 있기를 기원합니다."
 austria.707.a: "합스부르크 가문의 또 다른 후손이 의무를 다하고 있습니다."
 austria.708.t: "레오폴드 곤드레쿠르트, 소장으로 진급"
 austria.708.d: "전 황태자의 가정교사였던 레오폴드 곤드레쿠르트가 소장으로 진급했습니다. 프랑스 출신의 고위 장교이자 명망 높은 푸르 르 메리트 훈장을 받은 그는 전장에서의 그의 기개와 재능을 입증했으며, 우리는 그가 앞으로 맡게 될 모든 지휘에서 행운이 있기를 계속 기원합니다."
 austria.708.a: "군대에 프랑스인이요?"
 
 ###NAVY EVENTS
 #AUSTRIAN NAVY EVENTS
 austria.801.t: "오스트리아 해군"
 austria.801.d: "카이저리히-쾨니글리히 크리그스마리네(Kaiserlich-königliche Kriegsmarine), 즉 황실-왕립 해군은 페르디난트 막시밀리안 임명 전까지 주로 이탈리아인 승무원으로 구성되었습니다. 이탈리아어가 주요 언어였고, 독일어 함선 이름 대신 이탈리아어 함선 이름까지 사용되었습니다. 유럽의 다른 국가들이 대항해시대에 해군 생산을 혁신하고 나폴레옹 시대에 이를 더욱 발전시킬 동안, 오스트리아는 유리한 해상 지리와 남부의 경쟁국들 때문에 부분적으로 '현존 함대(Fleet in Being)' 교리를 고수했습니다. 그러나 이제 지도부의 변화와 통일된 이탈리아 라이벌의 위협에 직면하여, 프란츠 요제프 황제는 최종 결정을 내렸습니다. 오스트리아는 적들과 경쟁하고 오스트리아의 이익을 보호할 위대하고 강력한 해군, 진정한 황실 해군이 필요할 것입니다."
 austria.801.a: "기반으로 삼을 만한 것이 있습니까?"
 austria.802.t: "살바코스테"
 austria.802.d: "해군 장교 조반니 루피스는 자체 추진 어뢰 시제품 개발을 위한 위원회를 이끄는 임무를 맡았습니다. 두 번째로 제작된 모델은 프로펠러의 엔진으로 시계 메커니즘을 중심으로 설계되었습니다. 점화되면 선미의 폭발물이 선수를 통해 활성화되는 권총형 제어 장치를 통해 작동하기 시작했습니다. 수많은 테스트를 거친 후 마침내 효과적이고 일관되게 작동했습니다. 이탈리아어로 '해안 수호자'를 뜻하는 '살바코스테'라는 이름을 붙였고, '6 m'로 표기했습니다."
 austria.802.a: "반가운 소식입니다."
 austria.803.t: "플로틸렌코르프스 편입"
 austria.803.d: "우리의 호수와 강에서 복무하던 함선들이 해군에 편입되었습니다."
 austria.803.a: "배다! 만세!"
 austria.804.t: "드라헤급 철갑함"
 austria.804.d: "철갑함은 대형 대포, 정교한 기동성, 그리고 적 함선으로부터 보호하는 전체적인 중량으로 세기의 새로운 함선으로서 그 가치와 위력을 입증했습니다. 요제프 폰 로마코 설계 국장은 이 설계를 위해 피와 땀, 눈물을 쏟았습니다. 로마코의 생각이 옳은지 봅시다."
 austria.804.a: "배다! 만세!"
 austria.805.t: "카이저 막스급 철갑함"
 austria.805.d: "요제프 폰 로마코 설계 국장은 다시 한번 정부에 다음을 희망하며 설계를 보냈습니다. 이 새로운 카이저 막스급 철갑함은 이전 드라헤급을 계승하여 더 나은 배터리, 더 나은 엔진, 더 많은 화력, 그리고 더 강력한 화력을 포함할 것입니다. 의회는 승인했고, 함선 생산이 시작되었습니다."
 austria.805.a: "배다! 만세!"
 austria.806.t: "에르츠헤르초크 페르디난트 막스급 철갑함"
 austria.806.d: "새로운 에르츠헤르초크급은 해상에서 그 능력과 강도를 증명했으며, 강력한 대포와 두꺼운 장갑으로 오스트리아 해군의 다음 함급으로 결정되었습니다. 해당 함급의 첫 함선인 에르츠헤르초크 페르디난트 막스는 생산이 시작되었으며 1865년에 배치될 예정입니다. 이 중함선들은 아드리아해를 지배하고 모든 이탈리아 저항을 분쇄할 것입니다."
 austria.806.a: "배다! 만세!"
 austria.807.t: "이해관계 보호 임무 성공"
 austria.807.d: "우리의 국력을 과시하고 해군 재정비 프로그램의 일환으로, 우리는 아드리아해에서 우리의 이해관계를 보호하기 위한 태스크포스를 파견했으며, 때가 되면 '군함 외교'를 펼칠 우리의 권리를 확보했습니다. 우리가 파견한 해군 태스크포스가 좋은 소식을 가지고 돌아왔습니다! 우리의 이해관계는 당분간 확보되었습니다."
 austria.807.a: "해군에 반가운 소식입니다."
 austria.808.t: "이해관계 보호 임무 실패"
 austria.808.d: "우리의 국력을 과시하고 해군 재정비 프로그램의 일환으로, 우리는 아드리아해에서 우리의 이해관계를 보호하기 위한 태스크포스를 파견했으며, 때가 되면 '군함 외교'를 펼칠 우리의 권리를 확보했습니다. 우리가 파견한 해군 태스크포스는 임무에 실패한 채 돌아왔습니다. 우리의 이해관계는 외세의 영향력으로부터 보호되지 않을 것으로 보입니다. 앞으로는 좋은 일이 있기를 바랍니다."
 austria.808.a: "해군에 슬픈 소식입니다."
 austria.809.t: "해상 원정 성공"
 austria.809.d: "분쟁이나 어려운 시기에, 우리는 적을 저지하고 상황을 우리에게 유리하게 만들기 위해 해상 원정대를 파견할 수 있습니다. 우리가 파견한 해상 원정대는 성공적으로 돌아왔으며, 좋은 소식을 직접 빈으로 가져왔습니다."
 austria.809.a: "해군에 반가운 소식입니다."
 austria.810.t: "해상 원정 실패"
 austria.810.d: "분쟁이나 어려운 시기에, 우리는 적을 저지하고 상황을 우리에게 유리하게 만들기 위해 해상 원정대를 파견할 수 있습니다. 우리가 파견한 해상 원정대는 실패한 채 돌아왔으며, 끔찍한 소식을 직접 빈으로 가져왔습니다."
 austria.810.a: "해군에 슬픈 소식입니다."
 austria.811.t: "스크류 건보트 시제품"
 austria.811.d: "해군 사관학교의 함선 설계자들이 새로운 건보트 시제품을 가지고 우리에게 접근했습니다. 스크류 추진 방식에 상당한 무장을 갖추고 강화된 선체를 가진 이 새로운 시제품은 저렴하지만 효과적인 함선으로, 우리의 해군 역량을 확실히 강화할 것입니다. 이 함선을 구입해야 할까요?"
 austria.811.a: "네, 우리에게 큰 도움이 될 것입니다."
 austria.811.b: "그럴 필요 없습니다."
 AUS_screw_gunboat_prototype_effect_tt: "§GThe screw gunboat SMS Möwe will enter into our service.§!"
 austria.812.t: "국내 조선소에서 주문한 건보트 도착"
 austria.812.d: "새로운 건보트 11척이 우리 해군에 들어온 것을 환영합시다."
 austria.812.a: "배다! 만세!"
 AUS_screw_gunboat_first_series_effect_tt: "§GWe have successfully purchased eleven screw gunboats from Austrian dockyards. They have just arrived at Trieste.§!"
 austria.813.t: "국내 조선소에서 주문한 건보트 도착"
 austria.813.d: "새로운 건보트 10척이 우리 해군에 들어온 것을 환영합시다."
 austria.813.a: "배다! 만세!"
 AUS_screw_gunboat_second_series_effect_tt: "§GWe have successfully purchased ten more screw gunboats from Austrian dockyards. They have just arrived at Trieste.§!"
 
 ###ECONOMY EVENTS
 #DEBT CRISIS EVENTS
 austria.901.t: "제국의 재정 위기"
 austria.901.d: "오스트리아 제국과 그 영토는 다른 많은 국가에 도달한 것처럼 보이는 정량화 가능한 경제 호황의 호화로운 상품을 결코 경험해 본 적이 없습니다. 지난 세기에 너무나 많은 갈등이 축적되면서 우리의 부채는 위협적인 수준으로 치솟았고, 그 이자를 갚는 데 연간 국가 자금의 상당 부분이 소요되고 있습니다.\n\n우리의 영토를 보호하는 거대한 황실-왕립 육군은 그 품질을 유지하기 위해 막대한 자금을 필요로 합니다. 장교와 장군들의 연금은 관대하게 지급되며, 그들은 다른 많은 군대에서는 제공하지 않는 혜택을 누리고 있습니다. 1848년과 1849년 혁명 이후, 이탈리아의 주둔군은 거의 두 배가 되었고, 그 비용은 만만치 않았습니다.\n\n프로이센의 보호 아래 관세동맹(Zollverein) 결성은 독일 대부분 지역에서 우리의 경제적 영향력에 타격을 주었고, 우리의 최선이자 가장 진심 어린 노력에도 불구하고 우리는 여전히 이 관세동맹에 포함되지 않고 있습니다. 이는 또한 우리 경제에도 문제를 야기하는데, 사업 개시 및 무역의 어려움이 우리 왕국에서 산업 혁명을 더욱 발전시키려는 국민들의 사기와 의욕을 계속해서 약화시키기 때문입니다.\n\n우리가 다른 강대국들에 뒤처질 것처럼 보이지만, 최근 바흐 국무장관과 그의 각료들 및 자문관들의 몇몇 영리한 개혁 이후 우리 산업은 몇 가지 희망적인 생명의 불꽃을 보여주었습니다. 안젤름 살로몬 폰 로스차일드, 칼 아달베르트 라나, 요한 아돌프 주 슈바르첸베르크 및 기타 저명한 경제학자들이 제국 전역에서 산업 애호가들을 모으고 있습니다."
 austria.901.a: "무엇보다도 이 상황을 먼저 해결해야 합니다."
 austria.902.t: "[AUS.GetNameDef]은(는) 부채가 없습니다"
 austria.902.d: "우리는 마침내 부채를 갚았습니다."
 austria.902.a: "우리의 절약이 성과를 거두었습니다!"
 austria.903.t: "부채 상환이 이루어졌습니다"
 austria.903.d: "우리는 부채의 일부를 갚았습니다. 이제 우리는 계속해서 빚을 갚을지 아니면 나중에 갚을지 결정해야 합니다."
 austria.903.a: "반가운 소식입니다."
 austria.904.t: "축소된 군 예산이 부채 부담을 완화"
 austria.904.d: "군 예산을 영구적으로 축소하기로 한 우리의 결정은 부채 부담을 계속해서 완화하고 있습니다."
 austria.904.a: "반가운 소식입니다."
 austria.905.t: "축소된 군 예산이 부채 부담을 더욱 완화"
 austria.905.d: "군 예산을 영구적으로 축소하기로 한 우리의 결정은 부채 부담을 계속해서 완화하고 있습니다."
 austria.905.a: "반가운 소식입니다."
 austria.906.t: "신문세가 부채 부담을 완화"
 austria.906.d: "우리가 도입한 신문세가 성과를 내고 있습니다. 우리는 수입의 일부를 부채 부담을 완화하는 데 사용할 수 있습니다. 또한, 이 세금은 우리가 마음에 들지 않는 신문의 가격을 인상할 수 있게 합니다."
 austria.906.a: "반가운 소식입니다."
 austria.907.t: "신문세가 부채 부담을 더욱 완화"
 austria.907.d: "우리가 도입한 신문세가 계속해서 성과를 내고 있습니다. 우리는 수입의 일부를 다시 부채 부담을 완화하는 데 사용할 수 있습니다. 또한, 이 세금은 우리가 마음에 들지 않는 신문의 가격을 인상할 수 있게 합니다."
 austria.907.a: "반가운 소식입니다."
 austria.908.t: "숨겨진 이벤트: 높은 군 예산으로 인한 부채 부담 증가?"
 austria.909.t: "높은 군 예산으로 인한 부채 부담 증가"
 austria.909.d: "우리 군 예산은 정부 수입에 비해 너무 높습니다. 새로운 수입원을 찾거나 파산의 위험을 감수해야 합니다."
 austria.909.a: "군 예산을 삭감해야 할까요?"
 #AUSTRIAN ECONOMY EVENTS
 austria.931.t: "빈의 도시화"
 austria.931.d: "제국 전체의 심장부인 빈은 유서 깊고 영광스러운 도시입니다. 그러나 완벽하지는 않습니다. 점점 더 많은 사람들이 제국의 도시에서 세상 속 자신의 자리를 찾기 위해 다양한 지역에서 몰려들고 있으며, 우리는 그들을 실망시킬 수 없습니다. 따라서 우리는 낡고 불필요한 건물들을 철거하여 이 불쌍한 영혼들이 일하고 행복을 찾을 수 있는 더 많은 장소를 건설해야 합니다."
 austria.931.a: "반가운 소식입니다."
 austria.932.t: "모라비아 맨체스터"
 austria.932.d: "우리 북부 지역의 모라비아는 산업 혁명에서 소외되어 어떤 주요 공장이나 산업도 없이 잊혀졌습니다. 이것은 바뀔 것입니다. 새로운 회사들이 도착하여 직물 노동자들을 위한 일자리를 가져옴에 따라 직물 산업의 큰 발전이 이루어졌습니다. 모라비아의 경제적 이점이 성장했습니다."
 austria.932.a: "반가운 소식입니다."
 austria.933.t: "레오벤 광산대학교"
 austria.933.d: "슈타이어의 레오벤 시를 중심으로 한 레오벤 대학교는 채광, 야금, 재료 분야에서 최초이자 최대 규모의 대학이었습니다. 1840년에 설립된 이 대학은 많은 개정과 구조적 변화를 겪었으며, 학교에 대한 증액 제안이 논의되었습니다. 이곳은 오스트리아 최고의 학교 중 하나이므로, 그 수준을 유지하는 것이 최선입니다."
 austria.933.a: "반가운 소식입니다."
 austria.934.t: "헝가리 황금"
 austria.934.d: "중세 시대에 헝가리는 유럽 금화 생산의 대부분을 차지했습니다. 헝가리 광산은 뛰어난 광물로 널리 알려져 지역을 번성하게 만들었습니다. 그러나 신세계에서의 스페인 제국주의 시대에는 라틴 아메리카에서 온 귀금속이 유럽 본토를 휩쓸면서 헝가리 광산의 위상과 중요성이 빠르게 쇠퇴했습니다. 경쟁이 심했지만, 헝가리 금광은 현재까지도 유럽 전체에서 가장 많은 귀금속을 계속 생산하고 있으며, 우리는 분명 여전히 이로부터 이익을 얻을 수 있습니다."
 austria.934.a: "반가운 소식입니다."
 #PANIC OF 1873 EVENTS
 austria.951.t: "1873년 공황"
 austria.951.d: "빈 증권 시장이 폭락하고, 일련의 빈 은행 파산이 이어졌습니다..."
 austria.951.a: "젠장!"
 
 ###FLAVOUR EVENTS
 austria2.1.t: "아름답고 푸른 도나우강"
 austria2.1.d: "'안 데어 쇠넨, 블라우엔 도나우(An der schönen, blauen Donau)', 또는 영어로 흔히 '더 블루 다뉴브(The Blue Danube)'로 불리는 이 곡은 위대한 오스트리아 작곡가 요한 슈트라우스 2세의 새로운 왈츠입니다. 1866년에 작곡된 이 곡은 오늘 빈 남성 합창 협회 콘서트에서 처음으로 연주되었습니다.\n\n그러나 단지 미미한 성공만을 거두었지만, 요한 슈트라우스는 국제 무대에서 더 큰 성공을 찾기를 바라며 그의 곡을 전 세계에서 계속 연주할 것입니다."
 austria2.1.a: "오, 영광스러운 다뉴브여"
 austria2.2.t: "독일 레퀴엠"
 austria2.2.d: "'아인 도이체스 레퀴엠, 나흐 보르텐 데어 하일리겐 슈리프트(Ein deutsches Requiem, nach Worten der heiligen Schrift)', 또는 영어로 '독일 레퀴엠, 성경의 말씀으로'는 요하네스 브람스의 새로운 작곡입니다. 루터교 성경에서 영감을 받았고 1865년 어머니의 비극적인 죽음으로 인해, 3년 간의 작업 결과물입니다. 약 80분 길이로, 브람스의 작품 중 가장 긴 곡입니다.\n\n비평가들은 그의 장인정신을 칭찬했으며, 이 곡은 음악계에서 매우 좋은 평가를 받았습니다. 그러나 일부 비평가들은 이 곡이 기독교적 내용이 부족하다는 점을 비판했는데, 이 곡은 비전례적(non-liturgical)으로 의도되었기 때문입니다."
 austria2.2.a: "아름답습니다"
 austria2.3.t: "빈 궁정 오페라 개관"
 austria2.3.d: "빈에서 8년간의 공사 끝에 새로운 오페라 극장이 마침내 완공되었습니다. 빈 궁정 오페라는 아우구스트 시카르트 폰 시카르츠부르크와 에두아르트 판 데르 뉠이 그린 계획을 기반으로 했으며, 체코 건축가 요제프 흘라프카의 감독 아래 건설되었습니다.\n\n이 위대한 건물은 프란츠 요제프 황제와 황후가 참석한 가운데 개관되었습니다. 그러나 대중은 이 건물에 만족하지 않았습니다. 인접 도로가 높아져 "가라앉은 보물 상자"처럼 조롱받았으며, 종종 다양한 군사적 재앙에 빗대어 언급되기도 했습니다."
 austria2.3.a: "빈에 훌륭한 추가물입니다"
 austria2.4.t: "트리슈-트라슈 폴카"
 austria2.4.d: "트리슈-트라슈-폴카(Tritsch-Tratsch-Polka)는 유명한 오스트리아 작곡가 요한 슈트라우스 2세의 폴카 작품입니다. 러시아에서 크게 성공한 순회공연 후 작곡되었으며, 빈의 콘서트에서 처음 연주되었습니다. "트리슈-트라슈" 또는 영어로 "재잘거림(chit-chat)"이라는 이름은 빈 사람들이 수다를 떠는 관습을 가리킵니다. 따라서 슈트라우스의 음악에서 흔히 볼 수 있듯이 매우 경쾌하고 즐거운 곡입니다."
 austria2.4.a: "정말 훌륭합니다"
 austria2.5.t: "SMS 노바라호, 지브롤터 도착"
 austria2.5.d: "우리 원정선 SMS 노바라호가 지브롤터에 도착했으며 며칠 동안 보급을 위해 머무를 것입니다. 함선 승무원들은 빅토리아 여왕을 기념하는 생일 축하 행사에도 참석할 것입니다. 그들이 영국 영토를 떠나면, 전 세계를 도는 긴 항해가 그들을 기다리고 있습니다. 아무런 불행도 일어나지 않기를 바랍니다."
 austria2.5.a: "다음 정거장은 마데이라입니다!"
 austria2.6.t: "SMS 노바라호, 리우데자네이루 도착"
 austria2.6.d: "우리 원정선 SMS 노바라호가 리우데자네이루에 도착했으며 며칠 동안 보급을 위해 머무를 것입니다. 함선은 항해의 다음 단계, 즉 케이프를 돌아 인도양으로 향할 여정을 위해 보급품을 준비합니다."
 austria2.6.a: "흥미롭습니다"
 austria2.7.t: "SMS 노바라호, 케이프타운 도착"
 austria2.7.d: "우리 원정선 SMS 노바라호가 케이프타운에 도착했으며 며칠 동안 보급을 위해 머무를 것입니다. 동방으로 가고자 하는 모든 선원들에게 유명한 장소인 희망봉은 SMS 노바라호 항해의 중요한 단계가 될 것입니다. 동양을 향하기 전 마지막 도전입니다."
 austria2.7.a: "흥미롭습니다"
 austria2.8.t: "SMS 노바라호, 세인트 폴 도착"
 austria2.8.d: "우리 원정선 SMS 노바라호가 남극의 세인트 폴 섬에 도착했습니다. 함선 승무원들은 이 섬의 지도를 처음으로 그렸으며, 그곳의 동물군과 식물군, 특히 이미 "코카"라는 이름으로 알려진 식물을 처음으로 연구하는 특권을 누렸습니다."
 austria2.8.a: "흥미롭습니다"
 austria2.9.t: "SMS 노바라호, 인도 도착"
 austria2.9.d: "우리 원정선 SMS 노바라호가 실론에 도착했으며, 며칠 동안 보급을 위해 머무를 것입니다. 실론은 남인도양의 몇 군데 정박지 다음의 자연스러운 다음 단계이며, 승무원들이 다음 여정 전 공부하고 휴식할 며칠을 제공할 것입니다."
 austria2.9.a: "흥미롭습니다"
 austria2.10.t: "SMS 노바라호, 싱가포르 도착"
 austria2.10.d: "우리 원정선 SMS 노바라호가 싱가포르에 도착했으며, 며칠 동안 보급을 위해 머무를 것입니다. 동아시아의 여러 정박지 중 첫 번째로, 함선은 현지 동물군의 표본을 수집하기 시작했으며 이 지역의 지질 형성물에 대해 신중하게 기록하고 있습니다."
 austria2.10.a: "흥미롭습니다"
 austria2.11.t: "SMS 노바라호, 자바섬 도착"
 austria2.11.d: "우리 원정선 SMS 노바라호가 바타비아에 도착했으며, 며칠 동안 보급을 위해 머무를 것입니다. 그러나 함선이 다음 주요 목적지로 향하므로 네덜란드 식민지에서의 정박은 길지 않을 것입니다."
 austria2.11.a: "흥미롭습니다"
 austria2.12.t: "SMS 노바라호, 마닐라 도착"
 austria2.12.d: "우리 원정선 SMS 노바라호가 마닐라에 도착했으며, 며칠 동안 보급을 위해 머무를 것입니다. 스페인 항구는 필리핀 제도 입구에 불과하며, 그곳의 독특한 현지 동물군은 과학계에 큰 흥미를 불러일으킬 것입니다."
 austria2.12.a: "흥미롭습니다"
 austria2.13.t: "SMS 노바라호, 중국 도착"
 austria2.13.d: "우리 원정선 SMS 노바라호가 상하이에 도착했으며, 며칠 동안 보급을 위해 머무를 것입니다. 홍콩에서의 짧은 정박 후 도착한 함선은 다음 중요한 단계가 있는 오세아니아로 향할 준비를 하고 있습니다."
 austria2.13.a: "흥미롭습니다"
 austria2.14.t: "SMS 노바라호, 서태평양 도착"
 austria2.14.d: "우리 원정선 SMS 노바라호가 서태평양의 여러 섬들을 탐험하기 시작했습니다. 폰페이 섬에서 스튜어트 섬에 이르기까지, 함선은 현지 동물군과 식물군을 지칠 줄 모르고 연구했으며, 남태평양의 자연을 이해하기 위한 다음 단계로 폴리네시아를 바라보기 시작했습니다."
 austria2.14.a: "흥미롭습니다"
 austria2.15.t: "SMS 노바라호, 태평양 횡단 항해 시작"
 austria2.15.d: "우리 원정선 SMS 노바라호가 우리 행성에서 가장 큰 바다인 태평양을 가로지르는 긴 항해를 시작했습니다. 지난 몇 번의 정박은 식물학적 및 지질학적 연구에 초점을 맞추었지만, 이번 태평양 횡단은 해양학 및 수문학에 초점을 맞출 것입니다. 이러한 연구는 획기적이고 해당 분야의 혁명으로 판명될 것입니다."
 austria2.15.a: "흥미롭습니다"
 austria2.16.t: "SMS 노바라호, 남아메리카 도착"
 austria2.16.d: "우리 원정선 SMS 노바라호가 칠레 발파라이소에 도착했으며, 며칠 동안 보급을 위해 머무를 것입니다. SMS 노바라호가 트리에스테로 돌아오기 전 마지막 단계인 이곳에서도 용감한 케이프 혼과 다시 한번 대서양 횡단 항해가 남아있습니다."
 austria2.16.a: "흥미롭습니다"
 austria2.17.t: "SMS 노바라호, 세계 일주"
 austria2.17.d: "2년 3개월 만에 SMS 노바라호는 세계 일주 항해를 마쳤습니다. 승무원들은 아직 알려지지 않았던 세계 여러 지역에 대한 수많은 발견과 상세한 연구로 오스트리아 과학계의 찬사를 받았습니다. 빈 과학 아카데미가 승무원들이 작성한 수많은 기록을 정리하기 시작했을 뿐이지만, 이 함선의 항해는 이미 오스트리아 역사에 한 획을 그었으며, 그 유산은 앞으로 수세기 동안 계속 울려 퍼질 것이 확실합니다."
 austria2.17.a: "훌륭합니다"
 austria2.18.t: "조반니 비신, 최초의 크로아티아인 세계 일주 성공"
 austria2.18.d: "오늘 조반니 비신은 지구를 일주한 최초의 크로아티아인이 되었습니다. 1806년 코토르 근처에서 태어난 비신은 대대로 크로아티아 선원 가문 출신입니다. 그는 이스트리아에서 자랐으며, 그곳에서 트리에스테 해군 사관학교에 진학했고 곧 자신의 배 '스플렌디도'를 구입했습니다. 비신은 1850년에 브리그선을 타고 지중해에서 물품과 사람들을 위한 무역로를 운항하기 시작했으며, 1852년 2월 11일 첫 번째 대륙간 항해를 시작했습니다. 그의 배는 호주와 태국의 항구에 입항한 최초의 오스트리아 선박이었습니다. 오늘, 100,000해리가 넘는 항해와 이탈리아 전쟁으로 인한 플리머스 항구에서의 중간 기착 끝에, 그의 배는 SMS 노바라호에 간발의 차이로 뒤쳐졌을 뿐 트리에스테에 도착했습니다. 그는 분명 기억될 것입니다."
 austria2.18.a: "정말 대단한 업적입니다!"
 
 ###ALT-HISTORY EVENTS
 #HUNGARIAN REVOLUTION EVENTS
 austria2.101.t: "헝가리 변화의 바람"
 austria2.101.d: "내무부 장관 [AUS.GetLeader]으로부터 지난 몇 년간의 공격적인 정책과 행동으로 인해 마자르 민족주의가 재부상하고 있다는 매우 중요한 보고서가 도착했습니다. 비밀 경찰은 헝가리 전역에서 활동하는 여러 '독립 지지 위원회'를 추적했으며, 훨씬 더 많은 위원회가 존재할 것으로 추정됩니다. 이 위원회들은 계획된 반란에 자금을 대기 위해 해외에서 자금을 모으고 있습니다. 그 외에도 국민들 역시 우리 행정부에 불만을 품고 있는 것으로 보이며, 상당수의 마자르인들이 세금 납부를 거부했습니다. 전반적인 합의는 헝가리에서 봉기가 계획된 것으로 보인다는 것입니다."
 austria2.101.a: "우려스럽습니다..."
 austria2.102.t: "제2차 헝가리 혁명"
 austria2.102.d: "군주국에 재앙이 닥쳤습니다. 내무부 장관은 독립 헝가리를 수립하려는 거대한 음모 네트워크의 존재를 가정한 것이 실로 옳았습니다. 성 이슈트반 왕관령 전역의 수천 명의 남자들이 무기를 들고 현재 [PIE.GetName]의 토리노에 망명 중인 코수트 라요시의 지도 아래 '헝가리 공화국'을 선포했습니다. 헝가리 반란은 '제2차 헝가리 혁명'으로 불렸으며, 우리가 가능한 한 빨리 반란을 진압하지 않는다면, 성 이슈트반 왕관령이 합스부르크 영토에서 상실되고 마자르인들이 슬라브인이나 루마니아인과 같은 우리 제국 내 다른 민족들에게도 반란을 일으키도록 고무할 가능성이 매우 큽니다."
 austria2.102.a: "반란을 진압하십시오"
 austria2.102.b: "마자르 민족은 다시 일어날 것이다"
 austria2.103.t: "헝가리 민족"
 austria2.103.d: "헝가리 민족이 다시 한번 독립을 선포했습니다. 1848년에 헝가리가 라요시 버트치아니의 지도 아래 독립을 선포한 지 그리 오래되지 않았습니다. 처음에는 성공적이었던 혁명은 러시아의 개입 이후 비참하게 실패했고, 이로 인해 빈으로부터 10년 이상의 민간 탄압이 이어졌습니다. 마자르인들은 다시 한번 일어섰고 자신들의 운명을 써내려갈 준비가 되어 있습니다. 조상의 헝가리 민족이 복원될 것입니다."
 austria2.103.a: "승리를 향하여"
 austria2.104.t: "전쟁 시작"
 austria2.104.d: "오스트리아 왕국과 헝가리 왕국 사이의 길고 긴장된 경쟁 끝에, 헝가리가 독립을 선언하면서 마침내 전쟁이 발발했습니다. 예상했던 일이었지만, 수세기 동안 오스트리아-헝가리 이중 군주제가 새로운 표준이 되었던 오스트리아 민족에게는 여전히 충격으로 다가옵니다.\n\n양국 군대가 진격하면서 헝가리는 이제 생존을 위해 싸울 것이고, 오스트리아는 그들의 왕국을 위해 싸울 것입니다."
 austria2.104.a: "황제를 위하여"
 austria2.105.t: "오스트리아, 평화를 간청하다"
 austria2.105.d: "길고 지루한 전쟁 끝에 오스트리아는 마침내 승리한 헝가리 민족과 평화 협상을 원하고 있습니다. 전쟁은 쉽게 이겨낸 것이 아니었지만, 헝가리군에게는 큰 자부심의 원천으로 남았습니다.\n\n오스트리아는 백기를 준비하고 있는 동안, 헝가리는 조약을 준비하고 있습니다. 그들 중 일부, 심지어 최고 사령부 내에서도 여전히 크로아티아 영토를 유지하기를 원합니다."
 austria2.105.a: "헝가리를 위해 만세 삼창!"
 austria2.105.b: "크로아티아가 없으면 거래도 없다."
 austria2.106.t: "프레스부르크 조약"
 austria2.106.d: "오스트리아-헝가리 전쟁은 다시 태어난 헝가리 민족에게 큰 승리를 가져다주었습니다! 오스트리아는 프레스부르크 조약에 서명하여 헝가리에 오스트리아로부터의 공식적인 독립과 더불어 크로아티아 영토까지 부여했습니다.\n\n1848/49년 제1차 헝가리 혁명 이후, 헝가리 국민들은 진정한 주권을 주장할 수 있는 날을 오랫동안 열망해왔습니다. 그리고 이제 수년간의 고난과 투쟁 끝에 그들은 부다에서 행복하게 헝가리 국기를 흔들 수 있게 되었습니다."
 austria2.106.a: "마자르 민족이 다시 태어났습니다!"
 #ITALIAN ORGANIZATION AFTER VICTORY IN 2IW
 austria2.111.t: "이탈리아에서의 승리!"
 austria2.111.d: "간악한 사르데냐인들이 우리에게 강요한 피비린내 나는 전쟁이 끝났고 – 우리는 다시 한번 승리했습니다! 다음 몇 주, 몇 달 안에 우리의 승리를 최대한 활용하는 방법을 결정해야 할 것입니다."
 austria2.111.a: "A.E.I.O.U."
 austria2.112.t: "중앙 이탈리아 국가들의 미래"
 austria2.112.d: "모데나, 파르마, 토스카나는 빈 회의 이래 우리의 영향권에 속해 있었습니다. 모데나 공국과 토스카나 대공국은 합스부르크 가문의 후손들이 통치했고, 파르마 공국은 부르봉 가문이 통치하여, 사실상 이 세 국가는 우리의 이념적, 군사적 지원 덕분에 우리의 종속국이 되었습니다. 전쟁이 끝났으니, 이제 이 세 국가를 어떻게 해야 할지 마침내 결정할 수 있습니다. 보수주의자들은 현상 유지를 제안하는데, 이는 이 국가들을 민족주의적 침투에 취약하게 만들 것입니다. 반면 자유주의자들은 이탈리아인들에게 합스부르크 가문이 이탈리아에 대해 좋은 의도만 가지고 있음을 설득하기 위해 이탈리아 연맹이라는 연합을 만들 것을 제안합니다."
 austria2.112.a: "그들을 괴뢰국으로 만드십시오."
 AUS_future_of_the_central_italian_states_effect_tt: "§YThe §YCentral Italian States§! will become our subjects.§!"
 austria2.112.b: "현상 유지를 강요하십시오."
 austria2.113.t: "구 피에몬테 영토의 미래"
 austria2.113.d: "옛 사르데냐-피에몬테 왕국의 본토 영토는 우리의 승리와 사르데냐 왕조가 섬으로 탈출한 후 우리의 통제하에 들어왔습니다. 이제 이들을 어떻게 해야 할지가 문제입니다. 롬바르디아-베네치아 행정부의 일부 영향력 있는 구성원들은 북이탈리아의 우리 영토가 하나의 확고한 통치 아래에 있도록 하기 위해 이들을 롬바르디아-베네치아에 통합하는 것이 최선이라고 생각하지만, 다른 이들은 어떤 파벌도 너무 강력해지지 않도록 그곳에 별도의 왕국을 세워야 한다고 믿습니다. 우리는 또한 단순히 사르데냐인들에게 돌려줄 수도 있습니다. 결국 그곳은 정당하게 그들의 영토였습니다. 어떻게 진행해야 할까요?"
 austria2.113.a: "합스부르크 통치 아래 별도의 왕국을 만드십시오."
 AUS_create_piedmontese_kingdom_effect_tt: "§YThe §YKingdom of Piedmont§! will be created, §YArchduke Karl Ludwig§!, the second oldest brother of Emperor Franz Joseph I. will rule the country in our name.§!"
 austria2.113.b: "새로운 영토를 [LVN.GetName]에 통합하십시오."
 austria2.113.c: "[SAR.GetName]에게 돌려주십시오."
 austria2.114.t: "이탈리아 연맹 창설"
 austria2.114.d: "우리 관할 아래 북이탈리아 국가들은 여전히 일부 행정 업무를 처리하는 방식에 있어 분열되어 있습니다. 우리의 통제하에 확고한 이탈리아 연맹을 창설함으로써 행정과 상호 협력을 훨씬 용이하게 만들 수 있으며, 이는 민족주의적 동요가 통제 불능 상태가 되는 것을 방지하고 관료주의 및 주둔군의 비용을 절감할 수 있습니다. 비록 이탈리아 정부들 내부의 더 쉬운 협력 및 통신 채널이 파괴적인 개인들이 더 효과적으로 활동할 수 있도록 할 위험이 있지만 말입니다. 어떻게 해야 할까요?"
 austria2.114.a: "이탈리아 연맹을 창설하십시오."
 austria2.114.b: "그럴 필요는 없습니다."
 AUS_italian_league_effect_tt: "§YItalian League§!가 §Y[AUS.GetName]§!와(과) 이탈리아 영토의 통치자들 사이에 형성됩니다."
 
 austria2.117.t: "[LVN.GetName]의 미래"
 austria2.117.d: "롬바르디아-베네치아 왕국은 나폴레옹의 패배 이후 1815년 빈 회의 이래로 우리의 소유였습니다. 그러나 이 왕국은 합스부르크 통치에 반대하는 이탈리아 민족주의자들의 자주 폭력적인 반란의 현장이었으며, 피에몬테에 대한 우리의 근소한 승리 이후 이 왕국을 어떻게 처리해야 할지 결정할 때가 왔습니다. 보수주의자들에 의해 제시된 저명한 아이디어는 베네치아를 오스트리아 제국에 합병하여 사실상 롬바르디아 공국을 재창설하는 것입니다. 온건파들 사이에서는 왕국의 동일한 구조를 유지하는 것이 인기 있는 선택이지만, 자유주의자들은 이탈리아인들을 만족시키기 위해 왕국에 더 많은 자치권을 부여할 것을 제안합니다."
 austria2.117.a: "베네치아를 합병하십시오."
 austria2.117.b: "현상 유지를 강요하십시오."
 austria2.117.c: "왕국에 대한 통제를 완화하십시오."
 austria2.118.t: "사보이와 니스, 프랑스에 양도?"
 austria2.118.d: "이탈리아와 프랑스 국경에 위치한 사보이와 니스의 영토는 항상 논쟁의 여지가 있는 문제였습니다. 수세기 동안 이탈리아 영토였지만, 프랑스어 사용 인구가 많다는 이유로 1792년 프랑스 공화국에 합병되었고, 1815년 빈 회의에서 사르데냐-피에몬테로 반환되었습니다. 이제 북이탈리아가 우리의 확고한 통제 아래에 있으니, 이들을 프랑스에 양도하는 것을 선택할 수 있습니다. 그렇게 하면 프랑스와의 관계가 개선되어 향후 발생할 수 있는 분쟁에서 프랑스가 우리를 도울 수 있도록 유인할 수 있겠지만, 영국과의 관계는 소원해지고 이탈리아 민족주의자들을 더욱 분노하게 만들 것입니다."
 austria2.118.a: "우리는 얻을 수 있는 모든 친구가 필요합니다."
 austria2.118.b: "너무 위험합니다. 우리는 그들을 유지할 것입니다."
 austria2.118.c: "피에몬테가 그들을 계속 유지하도록 하십시오."
 austria2.119.t: "오스트리아, 사보이와 니스를 양도"

 austria2.119.d: "[GetDateText], 우리의 군대가 피에몬테에 양도된 1815년 이래 처음으로 사보이와 니스에 진입했습니다. 주민들은 프랑스 군대에 환호했고, 수천 명이 오스트리아에서 프랑스로 샹베리를 이양하는 공식 행사에 참석했습니다. '[GetYear]년 프랑스-오스트리아 사보이 협정'으로 알려진 이 협정은 오스트리아의 국무장관 [AUS.GetLeader]와 프랑스의 [FRA.GetLeader] 사이에 서명되었습니다. 이 영광스러운 협정을 통해 오스트리아는 신뢰할 수 있을 뿐만 아니라, 사실 우리의 좋은 친구가 될 수 있다는 것을 입증했습니다. 황제는 나중에 '프랑스와 오스트리아 사이의 오랜 앙금이 끝났으니, 이제 우리는 오직 우정만을 기대할 수 있다'고 선언하며, 사실상 그의 정부에 오스트리아를 적이 아닌 친구로 간주하라고 지시했습니다."
 austria2.119.a: "반가운 소식입니다."
 #DOMESTIC POLICY AFTER VICTORY IN ITALY
 austria2.121.t: "비밀 국가 부채 위원회 활동 개시"
 austria2.121.d: "소수의 엄선된 전문가들과 측근들이 우리의 부채 상황의 심각성을 파악하기 위해 빈에 모였습니다. 그들은 임무의 진정한 성격을 가리기 위한 거짓 명분으로 초대되었습니다. 폐하, 황제께서 곧 그들을 맞이할 것이며, 그 후 위원회는 임무를 지시받을 것입니다. 우리는 그들이 몇 주 안에 보고서를 제출할 것으로 예상됩니다."
 austria2.121.a: "아무도 이 사실을 알지 못하게 하십시오."
 austria2.122.t: "국가 부채 위원회, 부채 상황 보고"
 austria2.122.d_reasonable_debt: "우리가 시작한 비밀 국가 부채 위원회가 방금 조사 결과를 보고했습니다:\n\n우리의 부채 상황은 여전히 관리 가능합니다. 여기저기 약간의 삭감과 경제 성장을 위한 일부 인센티브를 통해, 우리는 마침내 부채 문제를 극복하고 재정 건전성과 번영의 길을 계속 갈 수 있을 것입니다."
 austria2.122.d_significant_debt: "우리가 시작한 비밀 국가 부채 위원회가 방금 조사 결과를 보고했습니다:\n\n우리의 부채 상황은 경고 수준입니다. 우리는 지출을 대폭 줄이는 동시에 새로운 수입원과 소득을 찾아야 합니다. 그렇지 않으면 결국 파산할 수 있습니다."
 austria2.122.d_insurmountable_debt: "우리가 시작한 비밀 국가 부채 위원회가 방금 조사 결과를 보고했습니다:\n\n우리의 부채 상황은 완전히 통제 불능인 것 같습니다. 지출에 대한 과감한 삭감이 없다면, 우리는 조만간 파산할 수밖에 없을 것이며, 이 시점에서는 거의 피할 수 없는 전망으로 보입니다."
 austria2.122.a: "그렇다면 희망이 있다는 말입니까?"
 austria2.122.b: "이것은 큰 희생을 요구할 것입니다..."
 austria2.122.c: "파산 선언이 유일한 탈출구가 될 수도 있습니다..."
 austria2.123.t: "빈에서 비밀 회동에 대한 소문 유포"
 austria2.123.d: "분명, 한 프리랜서 기자가 어떻게든 우리 부채 위원회와의 비밀 거래에 대한 소문을 알아냈습니다. 다행히도 우리 검열 요원들이 기사 출판 전에 이를 입수했으며, 그의 가장 가까운 동료들 중 몇 명만이 이 사실을 알고 있습니다. 하지만 이로 인해 우리가 재정 위기를 대중으로부터 숨기려 한다는 소문이 퍼지기에는 충분했습니다. 어떻게 이런 일이 일어났는지 모르겠지만, 우리는 이 소문이 더 이상 퍼지지 않도록 모든 권한을 다해야 합니다."
 austria2.123.a: "젠장!"
 austria2.124.t: "임박한 부채 위기에 대한 익명 기사 발행"
 austria2.124.d: "최근 빈에서 우리의 부채 상황을 다루기 위해 모인 전문가와 측근들의 모임은 익명의 기사로 신문에 실렸으며, 이는 어떻게든 검열을 통과한 것임이 틀림없습니다. 이름 없는 작가는 정부가 임박한 부채 위기를 대중으로부터 숨기려 하고 있으며, 이탈리아에서의 최근 승리를 이용하여 재정 위기의 진정한 심각성에서 주의를 돌리려 한다고 주장합니다."
 austria2.124.a: "이런 허튼소리는 중단되어야 합니다!"
 austria2.125.t: "중앙집권화 조치 준비 완료"
 austria2.125.d: "우리 정부 관료들은 계획된 중앙집권화 조치 시행을 위한 준비 작업을 마무리하기 위해 밤낮으로 노력했습니다. 그들은 각 해당 사업이 실패가 거의 불가능할 정도로 준비되도록 최선을 다했으며, 지방 당국의 저항 가능성 또한 고려했습니다. 모든 것을 정리하려면 모든 중앙 행정 기관의 공동 노력이 필요할 것입니다."
 austria2.125.a: "이제 실행할 때입니다."
 austria2.126.t: "강제된 중앙집권화 조치"
 austria2.126.d: "이제 중앙집권화 조치들이 우리의 준비 작업에 따라 단계적으로 시행될 것입니다. 그들이 예상했어야 했겠지만, 일부 지방 관리들의 권한이 빈의 중앙 정부를 위해 축소됨에 따라 그들로부터 약간의 반발이 있을 수 있습니다. 협력을 확실히 하기 위해, 우리 특사들이 필요하다고 판단할 경우 행정력이 개입할 수 있는 위치에 있습니다."
 austria2.126.a: "우리는 분명 심각한 저항에 직면할 것입니다..."
 austria2.127.t_massive: "헝가리에서 중앙집권화 조치에 대한 대규모 저항"
 austria2.127.t_heavy: "헝가리에서 중앙집권화 조치에 대한 강력한 저항"
 austria2.127.d_massive: "제국의 중앙집권화 수준을 높이려는 우리의 조치는 헝가리 귀족, 지식인, 자유주의자들 사이에서 대규모 저항을 야기했습니다. 그들은 이러한 조치를 즉시 철회할 것을 요구합니다."
 austria2.127.d_heavy: "제국의 중앙집권화 수준을 높이려는 우리의 조치는 헝가리 귀족, 지식인, 자유주의자들 사이에서 강력한 저항을 야기했습니다. 그들은 이러한 조치를 즉시 철회할 것을 요구합니다."
 austria2.127.a: "헝가리인들도 새로운 현실에 적응해야 할 것 같습니다?"
