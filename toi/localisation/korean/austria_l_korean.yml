 #REACTIONS TO WARS AND OTHER DEVELOPMENTS
 austria.351.t: "보헤미아 시위가 폭력적으로 변질"
 austria.351.d: "보헤미아에서의 시위는 독일 및 체코 온건파가 “국민 위원회”를 떠나면서 폭력적으로 변하기 시작했으며, 급진 민족주의자와 공상적 사회주의자들이 개혁을 요구하게 만들었습니다. 그러한 개혁은 독일 및 체코 중산층의 대중적 지지를 얻지 못하고 있지만, 보헤미아의 상황은 여전히 불안정하며 질서 회복을 위해 신속한 조치가 필요합니다."
 austria.351.a: "말도 안 되는 소리..."
 austria.352.t: "헝가리의 분노"
 austria.352.d: "1848년 헝가리 혁명을 진압했음에도 불구하고, 우리의 통치에 대한 그들의 저항은 사라지지 않았습니다. 더욱 나쁜 것은, 다른 집단들도 이것을 알아차렸고 1848년에 제국을 중앙집권적이고 온전하게 유지하기 위해 기울였던 노력이 아무 소용이 없었던 것으로 보입니다."
 austria.352.a: "헝가리인들은 조용히 지내는 것이 좋을 것입니다."
 
 ###DOMESTIC POLITICS EVENTS
 #DOMESTIC POLICY EVENTS
 austria.401.t: "락센부르크 선언"
 austria.401.d: "프란츠 요제프 1세 황제는 락센부르크 선언을 발표하여 최근 사건들을 고려한 평화 협정의 내용과 국내 개혁 약속을 상세히 밝혔습니다. 개혁안에는 지방 자치 단체에 대한 통제권 이양과 정부의 지출(민간 및 군사)을 '효율적인 통제'하에 두겠다는 약속이 포함되어 있습니다. 또한 제국 내 비가톨릭 단체, 즉 이스라엘인들에게는 지역 및 지방 상황을 고려한 현대적인 규정을 적용하겠다는 확언도 있었습니다. 비록 '헌법'이라는 단어나 그와 유사한 표현이 없다는 것을 알아차리는 사람은 소수일지 모르지만, 많은 사람들은 이 새로운 선언이 오스트리아 제국 헌정주의의 시작을 알린다고 느끼고 있습니다."
 austria.401.a: "어떤 대가를 치르더라도 우리의 명성을 회복해야 합니다."
 austria.402.t: "알렉산더 폰 바흐의 몰락"
 austria.402.d: "알렉산더 폰 바흐 남작은 1849년부터 오스트리아 내무부 장관을 지냈으며, 프란츠 요제프 통치 초기 제국의 행정 권한을 중앙집권화한 인물로 오스트리아 제국에서 알려져 있습니다. 그는 점차 반동적이고 절대주의적인 사상으로 기울었고, 이는 1850년대를 '바흐의 절대주의' 또는 카톨릭 교회와의 협력 덕분에 '클레리카르압솔루티스무스(Klerikalabsolutismus)'라고 불리는 시대 동안 오스트리아 제국을 급격하고 심오하게 형성했습니다.\n\n그러나 오스트리아-사르데냐 전쟁의 실패에 대한 비난으로 폰 바흐는 최근 실각했습니다. 그의 개혁은 오스트리아의 산업 잠재력을 약화시키고 독일 연방의 많은 잠재적 동맹국들을 소외시켰기 때문에 패배의 주요 원인 중 하나로 여겨졌습니다. 그의 사임 후, 새로운 지도자를 임명해야 하며 어느 정도의 개혁은 불가피합니다. 베른하르트 폰 레흐베르크 백작은 분명한 선택처럼 보입니다. 프랑크푸르트의 연방 회의 오스트리아 대표이자 그 기관의 회장으로서, 그는 독일 국가들 사이에서 우리의 명성을 회복하고 유럽 전역에 우리의 영향력을 주장할 이상적인 후보처럼 보입니다. 아게노르 고우흐호프스키 백작은 더 개혁적인 선택이 될 것입니다. 갈리치아 출신이자 그 영토의 총독인 그는 우리가 정부를 위해 독일 귀족들에게 의존하지 않는다는 신호를 보낼 것이므로, 왕국 전역에 만연한 민족주의적 동요를 어느 정도 진정시킬 것이 분명합니다."
 austria.402.a: "베른하르트 폰 레흐베르크를 국무장관으로 임명합니다."
 AUS_appoint_rechberg_effect_tt: "베른하르트 폰 레흐베르크를 선택하는 것은 §Ymoderate reform§!으로 이어질 것입니다."
 austria.402.b: "아게노르 고우흐호프스키를 국무장관으로 임명합니다."
 AUS_appoint_goluchowski_effect_tt: "아게노르 고우흐호프스키를 선택하는 것은 §Ycalm nationalist agitation§!을 가져올 것입니다."
 austria.403.t: "제국 의회(Reichsrat)가 빈에 모이다"
 austria.403.d: "이탈리아 전쟁에서의 굴욕적인 패배 이후, 프란츠 요제프 1세 황제는 현재의 신절대주의 체제가 제국의 존재 자체를 위협하고 있다고 확신하게 되었습니다. 그 결과 제국 의회(Reichsrat)가 소집되었습니다. 대표자들은 이제 새로운 헌법 제정을 위해 황제에게 조언하기 위해 빈에 모였습니다. 처음에는 제국 의회 의원들이 거의 전적으로 왕국의 귀족 중에서 선출되었지만, 38명의 의원을 추가하여 제국 의회를 확대하라는 명령 이후, 의회는 평민 출신의 주로 독일어를 사용하는 자유주의 대표자들도 포함하게 되었습니다. 확대의 결과는 아직 지켜봐야 하지만, 이제 많은 의원들이 새로운 헌법의 세부 사항에 대해 언쟁하고 토론하는 모습을 볼 수 있습니다. 제국이 더 깊은 위기로 빠져드는 것을 막기 위해, 제국 의회 대표자들은 이제 황제에게 가장 잘 조언하는 방법을 결정하는 중요한 역할을 맡게 되었습니다. 아마도 새로 임명된 대표자들이 이 문제 전체에 새로운 시각을 제시할 수 있을까요?"
 austria.403.a: "대표자들이 도움을 줄 수 있기를 바랍니다."
 austria.404.t: "국가 부채 위원회 활동 개시"
 austria.404.d: "대표자들은 우리 국가 부채의 비참한 상태를 밝히려는 열망에서 상당히 단호한 것 같습니다. 그들은 문제의 규모를 파악하기 위해 부채 위원회를 설립하는 안건을 제출했고, 우리는 이를 따를 수밖에 없었습니다. 위원회는 활동을 시작했으며 곧 부채 상황에 대해 보고할 것입니다."
 austria.404.a: "대표자들로부터 진실을 숨길 수는 없을 것입니다..."
 AUS_state_debt_commission_effect_tt: "위원회는 조사 결과를 보고할 것입니다. 우리 §Ydebt§!의 규모에 따라, 우리는 §Rbig trouble§!에 처할 수도 있습니다."
 austria.405.t: "국가 부채 위원회, 부채 상황 보고"
 austria.405.d_reasonable_debt: "우리가 시작하도록 압력을 받았던 국가 부채 위원회가 방금 조사 결과를 보고했습니다:\n\n우리의 부채 상황은 여전히 관리할 수 있습니다. 여기저기에서 약간의 더 많은 삭감과 경제 성장을 위한 일부 인센티브를 통해, 우리는 마침내 부채 문제를 극복하고 재정 건전성과 번영의 길을 계속 갈 수 있을 것입니다."
 austria.405.d_significant_debt: "우리가 시작하도록 압력을 받았던 국가 부채 위원회가 방금 조사 결과를 보고했습니다:\n\n우리의 부채 상황은 경고 수준입니다. 우리는 지출을 대폭 줄이는 동시에 새로운 수입원을 찾아야 합니다. 그렇지 않으면 결국 파산할 수 있습니다."
 austria.405.d_insurmountable_debt: "우리가 시작하도록 압력을 받았던 국가 부채 위원회가 방금 조사 결과를 보고했습니다:\n\n우리의 부채 상황은 완전히 통제 불능인 것 같습니다. 지출에 대한 과감한 삭감이 없다면, 우리는 조만간 파산할 수밖에 없을 것이며, 이 시점에서는 거의 피할 수 없는 전망으로 보입니다."
 austria.405.a: "그렇다면 희망이 있다는 말입니까?"
 austria.405.b: "이것은 큰 희생을 요구할 것입니다..."
 austria.405.c: "파산 선언이 유일한 탈출구가 될 수도 있습니다..."
 austria.406.t: "헌법 외교문서 초안 준비 완료"
 austria.406.d: "오스트리아 제국에 실존 위기가 드리워지자, 프란츠 요제프 1세 황제는 일주일 이내에 헌법이 작성되어야 한다고 요구했으며, 회의로 향하는 기차역에서 일반적인 원칙에 합의했습니다. 거의 전적으로 보수적인 귀족들로 구성된 제국 의회(Reichsrat)는 헌법 외교문서에 대한 최종 제안을 제시했습니다. 이 외교문서와 함께 합스부르크 제국의 연방화 전망이 다가왔는데, 이는 불과 10년 전만 해도 거의 불가능해 보였던 전망입니다. 자유주의자들에 대한 양보가 최소화된 것을 보면, 이 외교문서는 많은 사람들에게 옛 보수 귀족들의 승리인 것처럼 명확해 보입니다. 그럼에도 불구하고, 제국 의회(Reichsrat)의 많은 사람들은 이 외교문서에 단호히 반대하며, 황제에게 초안에 대한 추가 작업을 허용하기 위해 기한 연장을 고려해 줄 것을 간청하고 있습니다. 그러나 황제는 연방주의자들의 편을 든 것으로 보이며, 외교문서는 현재 형태로 곧 제정될 것으로 보입니다."
 austria.406.a: "이제 제정할 때입니다."
 austria.407.t: "헌법 외교문서 제정"
 austria.407.d: "논란의 여지가 많았던 헌법 외교문서가 제정되었습니다. 이는 오스트리아 제국의 새로운 헌법으로 기능합니다. 이 문서는 오스트리아 제국에서 신절대주의 시대의 마지막 행위로 간주되지만, 새로운 헌법 하에서도 황제는 여전히 많은 권력을 가지고 있습니다. 이 외교문서를 비판하는 사람들은 (다수가 있음) 새 헌법을 한탄하고 있습니다. 더 중앙집권적인 독일 자유주의자들뿐만 아니라 비독일 연방주의자들, 특히 헝가리 출신들은 이 개혁에 불만을 품고 있습니다. 자유주의자들은 빈의 중앙 정부에서 지방 당국으로의 권력 이양에 불만을 품고 있는 반면, 연방주의자들은 이 헌법이 소수의 지주 귀족들에게 너무 많은 권력을 부여하여 진정한 변화를 막을 것이라고 생각합니다. 특히 마자르인들은 오스트리아 영토 당국에 대한 자신들의 참여에 매우 불만을 품고 있으며, 헝가리 왕관령을 관리하는 별도의 통치 기구를 계속 요구하고 있습니다. 이 외교문서가 오래 지속될 것 같지는 않습니다..."
 austria.407.a: "부디 민중을 기쁘게 하기를 바랍니다."
 austria.407.b: "부디 민중을 기쁘게 하기를 바랍니다."
 austria.408.t: "헝가리에서 헌법 외교문서에 대한 저항"
 austria.408.d: "10월 외교문서에 따라 헝가리에 제국 의회(Reichsrat)에서의 특별한 지위를 부여했음에도 불구하고, 헝가리 불안의 근원은 해결되지 않은 채 남아 있습니다. 헝가리 지도자들은 더 큰 자치권과 인정을 원하며, 통과된 소수의 개혁들은 그들을 더욱 분노하게 만들었을 뿐입니다."
 austria.408.a: "모두를 만족시킬 수는 없습니다."
 austria.409.t: "헝가리에서 헌법 외교문서에 대한 대규모 저항"
 austria.409.d: "사르데냐인들에게 패배한 후, 프란츠 요제프 황제는 제국에 균열이 심화되는 것을 목격해야 했습니다. 관료적 문제와 군대의 명백한 문제부터 시작하여, 끊임없이 증가하는 자율성을 요구하는 소수 민족에 이르기까지 왕국은 개혁이 절실했습니다.\n\n제국을 위한 잠재적 개혁에 대한 지도를 얻기 위해 제국 의회(Reichsrat)에 자문한 후, 주로 보수적인 이 기구는 자연스럽게 귀족 연방주의의 회귀를 제안했고, 황제는 이를 따랐습니다. 그는 내무부 장관에게 제국 전역에 걸쳐 제정될 새로운 헌법 외교문서를 작성하도록 지시했습니다.\n\n이러한 관대한 새 헌법에도 불구하고, 우리의 재정 상황은 계속해서 악화되고 있으며, 특히 헝가리에서의 민족주의적 동요는 더욱 심해지고 있습니다. 우리 행정부의 실패는 점점 더 명확해지고 있으며, 이러한 약점은 심지어 독일 연방, 특히 프로이센의 관심을 끌기 시작했습니다. 제국 전역의 영향력 있는 독일어권 자유주의자들은 헌법 개정—그리고 더 중앙집권적인 국가로의 회귀—를 추진하고 있습니다. 헌법 외교문서는 실패작으로 보입니다. 우리는 어떻게 해야 할까요?"
 austria.409.a: "어쩌면 변화가 필요할 때일까요?"
 AUS_discard_the_constitutional_diploma_effect_tt: "새로운 §Yfocus§!가 §YAnton von Schmerling§!을 총리로 임명하기 위해 잠금 해제되었습니다."
 austria.409.b: "외교문서를 유지하십시오!"
 AUS_keep_the_constitutional_diploma_effect_tt: "이것은 제국 내 §Yethnic minorities§!를 더욱 §Ranger§!하게 만들 것입니다."
 austria.410.t: "자유주의자들, 제국 의회(Reichsrat) 구성에 항의"
 austria.410.d: "제국 전역의 자유주의자들은 새 헌법에 따라 조언된 의회(Reichstag) 구성에 항의하고 있습니다. 그들은 대표자들 중 귀족과 성직자의 비율이 제국의 정치적, 사회적 현실과 거의 관련이 없다고 믿고 있습니다. 그들은 평민들의 더 공정한 대표를 요구하고 있습니다."
 austria.410.a: "이 대표들은 신의 은총으로 임명된 것입니다!"
 austria.411.t: "빈에서 자유주의자들의 시위"
 austria.411.d: "헌법 외교문서를 변경하지 않고 확고히 유지하기로 한 우리의 결정 이후, 자유주의 옹호자들, 특히 독일어권 인사들이 현재 상황에 대한 불만을 표명하기 위해 빈과 제국의 다른 도시들에 모였습니다. 그들은 현재 헌법이 너무 연방적이지만 충분히 자유주의적이지 않다고 여기며 변화를 요구합니다. 행정력은 그러한 불복종에 어떻게 반응해야 할까요?"
 austria.411.a: "모두 체포하십시오!"
 austria.411.b: "그들을 내버려 두십시오."
 austria.412.t: "헌법 개정 발표, 대중을 진정시키다"
 austria.412.d: "총리 [AUS.GetLeader] 하의 새 정부가 헌법을 개정할 것이라는 발표는 초기 헌법 외교문서가 야기했던 불안을 다소 진정시켰습니다. 상황이 어떻게 전개될지는 아직 지켜봐야 할 것입니다."
 austria.408.a: "모두를 만족시킬 수는 없습니다."
 austria.409.t: "헝가리에서 헌법 외교문서에 대한 대규모 저항"
 austria.409.d: "사르데냐인들에게 패배한 후, 프란츠 요제프 황제는 제국에 균열이 심화되는 것을 목격해야 했습니다. 관료적 문제와 군대의 명백한 문제부터 시작하여, 끊임없이 증가하는 자율성을 요구하는 소수 민족에 이르기까지 왕국은 개혁이 절실했습니다.\n\n제국을 위한 잠재적 개혁에 대한 지도를 얻기 위해 제국 의회(Reichsrat)에 자문한 후, 주로 보수적인 이 기구는 자연스럽게 귀족 연방주의의 회귀를 제안했고, 황제는 이를 따랐습니다. 그는 내무부 장관에게 제국 전역에 걸쳐 제정될 새로운 헌법 외교문서를 작성하도록 지시했습니다.\n\n이러한 관대한 새 헌법에도 불구하고, 우리의 재정 상황은 계속해서 악화되고 있으며, 특히 헝가리에서의 민족주의적 동요는 더욱 심해지고 있습니다. 우리 행정부의 실패는 점점 더 명확해지고 있으며, 이러한 약점은 심지어 독일 연방, 특히 프로이센의 관심을 끌기 시작했습니다. 제국 전역의 영향력 있는 독일어권 자유주의자들은 헌법 개정—그리고 더 중앙집권적인 국가로의 회귀—를 추진하고 있습니다. 헌법 외교문서는 실패작으로 보입니다. 우리는 어떻게 해야 할까요?"
