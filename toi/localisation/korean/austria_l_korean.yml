 ##############################
 # Austrian Empire Focus Tree #
 ##############################
 aus_empire_focus: "오스트리아 제국 집중 트리"
 
 #Politics
 AUS_focus_an_empire_in_demise: "쇠락하는 제국?"
 AUS_focus_an_empire_in_demise_desc: "우리의 비할 데 없는 리더십 덕분에, 우리 왕국이 직면했던 위협과 고난에도 불구하고, 우리 제국은 시간의 모래바람에 맞서 굳건히 버텨왔습니다. 그러나 시간이 부족하고 우리 정부가 분열되어 있어 러시아와 합의가 이루어졌고, 우리가 내부 문제를 해결하는 동안 그들은 계속되는 헝가리 혁명으로부터 우리를 보호하기 위해 우리 영토를 방어하고 있습니다. 12개가 넘는 독특한 민족주의적 국민들이 수십 년간 논쟁의 근원이었던 빈 정부에 맞서 자치권을 위해 싸워왔습니다. 이러한 문제들은 우리 제국의 안정성에 더 큰 부담을 주고 있지만, 그들의 영토가 여전히 오스트리아의 통제하에 있기 때문에 어떤 반란 시도도 신속하게 진압될 것입니다. 이러한 장애물에도 불구하고, 우리는 진전을 이루고 있으며 이러한 문제들을 극복해 나갈 것입니다."
 AUS_focus_external_threats: "외부 위협"
 AUS_focus_external_threats_desc: "프리드리히 대왕부터 나폴레옹 보나파르트에 이르기까지, 우리 제국은 시간의 모래바람에 맞서며 멀리서 온 위대한 적들과 위험에 직면했고, 우리 민족 사이에서 수많은 적들을 만들었습니다. 우리는 헝가리 혁명 중에 러시아의 도움을 받기 위해 막 협상했지만, 크림 위기 동안 그들을 버릴 수밖에 없었습니다. 또한 이탈리아가 여전히 혼란에 빠져 있으며, 우리에게 반대하는 이들은 우리의 짐을 벗어던지려 안달하고 있음이 분명합니다. 피에몬테 정부가 그 좋은 예입니다. 많은 외부 위협이 우리를 맴돌고 있으며, 동맹이 형성되고 있습니다. 우리가 승리하도록 보장하는 것이 우리의 책임이 될 것입니다..."
 AUS_focus_aftermath_of_the_crimean_war: "크림 전쟁의 여파"
 AUS_focus_aftermath_of_the_crimean_war_desc: "러시아와 대영 제국, 프랑스, 사르데냐-피에몬테 연합군의 싸움은 오스만 제국이 러시아에 의해 성공적으로 침략당하는 것을 막으려는 열망에서 비롯되었습니다. 그 여파로 러시아인들은 굴욕을 당하고 상심했으며, 함대는 약화되고, 시민들은 더 이상의 분쟁을 두려워했으며, 정부는 혼란에 빠졌습니다. 돌이켜보면, 이 위기에서 우리의 역할은 대부분 성공적이지 못했습니다. 약속과 호의를 갚아야 할 도덕적 의무에도 불구하고, 우리는 3월 혁명 동안 우리를 지지했던 러시아인들을 소외시켰습니다. 이제부터 우리는 무엇을 해야 할지 알아내야 할 것입니다."
 AUS_focus_reapproach_russia: "러시아와의 재접근"
 AUS_focus_reapproach_russia_desc: "크림 전쟁의 여파로 그들에게 닥친 재앙 이후의 갈등에도 불구하고, 우리의 정치인들과 외교관들은 러시아 제국과의 동맹과 유대를 다시 불붙이기를 여전히 희망하고 있습니다. 결국, 전쟁에서 그들의 대의를 돕기를 거부한 이후로, 이것이 우리가 이전의 뛰어난 관계를 되찾기 위해 시도할 수 있는 최선입니다."
 AUS_focus_mending_the_divide: "분열의 치유"
 AUS_focus_mending_the_divide_desc: "우리가 외교관들을 파견하여 러시아에 재접근했으므로, 우리는 계속될 새로운, 더 밝은 약속들로 깨진 약속들을 치유해야 합니다. 우리 분열을 치유하고 미래에 무엇이 있을지 논의하기 위해 상트페테르부르크로 외교관 일행을 보냅니다."
 AUS_focus_loosen_russian_ties_further: "러시아와의 유대 추가 완화"
 AUS_focus_loosen_russian_ties_further_desc: "러시아와의 관계를 다시 회복하려는 시도는 동정적이고 우리가 잃게 만든 것을 되찾으려는 약한 시도로 간주될 것입니다. 러시아와의 유대를 강화하려는 미래의 어떤 시도도 하지 않을 것이며, 대신 우리는 그들과의 유대를 더욱 완화하고 우리를 받아들일 준비가 된 새로운 동맹국들을 찾아 나설 것입니다."
 AUS_focus_tighten_cooperation_with_britain: "영국과의 협력 강화"
 AUS_focus_tighten_cooperation_with_britain_desc: "우리는 러시아에 타격을 가했으며, 더 이상 그들에게 지도를 구할 수 없습니다. 하지만 왜 그래야 합니까? 대륙 전역에서 대영 제국은 그 어느 때보다 강력하며, 앞으로 다가올 일에 대비하여 우리의 위치를 확보하려면 외교관들을 보내 영국과의 협력을 강화해야 합니다."
 AUS_focus_the_italian_conundrum: "이탈리아 난제"
 AUS_focus_the_italian_conundrum_desc: "이탈리아 난제는 우리 이탈리아 영토의 정치적, 군사적 결과에 관한 것입니다. 외부 도움에 의존할 수 없는 제국의 민족주의적이고 불안정한 헝가리인, 크로아티아인, 보헤미아인들과 달리 이탈리아의 입지는 독특합니다. 우리는 이탈리아 반도의 일부만을 통제하고 있으며, 독립적인 세력들, 특히 크림 전쟁 이후 국제적 위상을 크게 높였고 지도층과 정부가 성장하는 이탈리아 민족주의를 지지하는 [PIE.GetName]의 존재는 더욱 큰 위협이 됩니다. 1848/49년 혁명 중 밀라노와 베네치아에서의 반란은 반도 전역의 이탈리아 민족주의자들의 행동을 예의주시하는 것의 중요성을 보여줍니다."
 AUS_focus_bolster_our_defenses: "우리의 방어 강화"
 AUS_focus_bolster_our_defenses_desc: "쿼드릴라테로와 다른 이탈리아 요새들은 1848년 사르데냐군 공격에 맞서 버텼지만, 주요 요새 중 하나인 페스키에라가 무너져 전체 지역을 위태롭게 만들었습니다. 그 암울했던 해의 반복을 피하려면 우리는 방어를 현대화하고 강화해야 합니다."
 AUS_focus_refit_the_forts: "요새 재정비"
 AUS_focus_refit_the_forts_desc: "롬바르디아 영토에 우뚝 솟은 쿼드릴라테로 요새를 현대화하는 프로그램의 일환으로, 건축가와 노동자들이 좋은 보상을 기대하며 요새 재정비에 파견되었습니다. 여기에는 새로운 석조 건축, 포장, 구조적 지지, 그리고 건물의 구조적 완전성을 극대화하기 위한 새로운 하부 요새들이 포함됩니다."
 AUS_focus_token_liberalization: "명목상의 자유화"
 AUS_focus_token_liberalization_desc: "대공 막시밀리안의 자유주의적 사상 때문에 그는 1857년 2월 롬바르디아-베네치아 왕국의 총독으로 임명되었습니다. 당시 프란츠 요제프 황제는 이탈리아 주민들 사이에 불안을 야기하던 노병 조세프 라데츠키 폰 라데츠를 교체하기를 원했습니다. 막시밀리안은 오스트리아 통치하의 이탈리아 민족의 고통을 개선하기 위한 자유주의적 변화를 약속했으며, 이제 이탈리아인들은 약속이 지켜지기를 요구하고 있습니다. 우리는 그들에게 자유화를 주어야 하며, 그렇지 않으면 심각한 상황에 직면하게 될 것입니다."
 AUS_focus_replace_viceroy_maximilian: "막시밀리안 총독 교체"
 AUS_focus_replace_viceroy_maximilian_desc: "오스트리아의 막시밀리안 대공은 최근 재앙만 초래했습니다. 총독으로 임명될 당시에는 국정 운영에 대한 유망한 아이디어와 계획을 제시했지만, 그의 무능함이 그 외의 것을 증명했고, 그는 국가를 훼손하는 일 외에는 아무것도 하지 못했습니다. 그의 해임은 신속하게 이루어져야 하며, 그 자리는 페렌츠 길룰라이가 차지해야 합니다."
 AUS_focus_replace_viceroy_maximilian_trigger_tt: "§YUnrest in Italy§!를 진정시키는 데 실패했습니다."
 AUS_focus_strengthen_viceroy_maximilian: "막시밀리안 총독 강화"
 AUS_focus_strengthen_viceroy_maximilian_desc: "오스트리아의 막시밀리안 대공은 차분하고 이상주의적인 인물로서, 우리 남부의 롬바르디아-베네치아 왕국에 큰 관심과 안정을 가져다주었습니다. 그는 자신의 역량을 증명했으며 총독으로서 유지할 가치가 있는 인물입니다. 그곳의 불안을 완화하는 데 이러한 큰 성공을 계속 이어가기를 바랍니다."
 AUS_focus_strengthen_viceroy_maximilian_trigger_tt: "§YUnrest in Italy§!가 성공적으로 진정되었습니다."
 AUS_focus_internal_threats: "내부 위협"
 AUS_focus_internal_threats_desc: "오스트리아 제국에는 빈의 중앙 권력으로부터 더 많은 자율성을 얻기 위해 싸우는 10개 이상의 민족 국가들이 있으며, 이는 중앙 정부가 반복적으로 거부해 온 바람입니다. 가장 심각한 내부 위협은 소수의 개인들의 민족주의적 선동이지만, 이것이 유일한 위협은 아닙니다. 일부 우리 장관들과 외교관들은 미래의 대치 상황에서 최악을 우려하며 암울하게 멀리 내다보고 있습니다. 우리 제국이 현대 시대를 살아남으려면 이러한 우려들을 단번에 해결해야 합니다."
 AUS_focus_the_challenges_of_a_multinational_empire: "다민족 제국의 과제"
 AUS_focus_the_challenges_of_a_multinational_empire_desc: "이 제국은 서로 다양하고 경쟁적인 민족 집단들로 구성되어 있으며, 이들은 서로 싸우고 논쟁하며, 그들에 대한 우리의 지배력을 약화시키고 본국을 훼손합니다. 점점 더 많은 사람들이 우리에게 저항함에 따라 우리가 직면하는 문제들은 확실히 늘어나고 있습니다. 우리 영토가 민족적으로 분할되어 있더라도, 그들은 여전히 대규모 오스트리아군의 통제하에 있으며, 이는 무장 반란의 어떤 시도도 진압합니다. 다른 유럽 국가들은 우리와 같은 내부적 위험에 직면하지 않지만, 우리의 말썽꾼들을 처리하고 나면 우리는 그들 위에 설 수 있을 것입니다..."
 AUS_focus_aftermath_of_the_revolutions_of_1848: "1848년 혁명의 여파"
 AUS_focus_aftermath_of_the_revolutions_of_1848_desc: "보수적이고 권위주의적인 진영에서는 1848년과 1849년이 특히 혼란스러운 시기로 여겨질 것입니다. 이러한 혁명 운동은 오스트리아 제국에 특히 큰 타격을 주었으며, 반란이 제국 전역으로 확산되고 마자르 민족주의자들뿐만 아니라 이탈리아의 리소르지멘토 급진주의자들에 대항하는 전면적인 전투까지 촉발했습니다. 이 시기는 옛 질서의 생존을 위한 끝없는 싸움을 의미했으며, 마침내 장군들과 우리 군대에 의해 분쇄되었고, 우리의 정당한 권위가 회복되었습니다. 이 시기는 멀게 느껴질 수 있지만, 그들이 낳은 민족주의적 태도는 여전히 존재합니다. 우리는 신중해야 합니다..."
 AUS_focus_aftermath_of_the_revolutions_of_1848_effect_tt: "§Yassociated decision§!을(를) 취하는 것은 비용이 많이 들겠지만, 제국 전역에서 §Ysuppress arising nationalist tendencies§!를 §Gmore efficiently§! 억압할 수 있게 해줄 것입니다.\n또한, §Ysuitable occasion§!이(가) 발생하면, 필요하다고 판단될 경우, 1848/49년 반란군에게 광범위한 §Yamnesty§!를 부여하여 §Gput oil on troubled waters§!할 수 있습니다.\n\n"
 AUS_focus_hungarian_situation: "헝가리 상황"
 AUS_focus_hungarian_situation_desc: "헝가리 의회는 1848년 4월 봉건 신분제 기반의 입법 체제를 폐지하는 주요 개혁인 4월 법안을 승인했습니다. 그러나 프란츠 요제프 1세 황제는 법안 승인 후 이를 무효화했는데, 이는 더 많은 자율성과 인정을 위해 오스트리아와의 합의 협상을 선호했던 바차니 정부에 대해 많은 헝가리인들이 의구심을 갖게 만든 불법적인 행위였습니다."
 AUS_focus_croatian_situation: "크로아티아 상황"
 AUS_focus_croatian_situation_desc: "헝가리 왕국과의 수세기 동안의 동군연합 이후, 그리고 헝가리가 오스트리아와 동군연합을 하기 전에는, 크로아티아인들이 적절히 진압되었을 것이라고 예상할 수도 있습니다. 그러나 1830년대에 시작되어 독일화와 마자르화의 확산에 맞서 크로아티아 민족주의를 형성하고 옹호했던 일리리아 운동이 드러냈듯이, 그러한 가정은 사실이 아닙니다."
 AUS_focus_ramifications_of_the_concordat_of_1855: "1855년 종교 협정의 파급 효과"
 AUS_focus_ramifications_of_the_concordat_of_1855_desc: "교황청과 오스트리아 제국은 1855년 제국 전역에서 가톨릭 교회의 권리와 의무를 규정하는 종교 협정을 체결했습니다. 이 협정은 적어도 한 명의 가톨릭 배우자가 관련된 모든 결혼 문제에 대해 가톨릭 교회가 전적인 책임을 지도록 규정하여, 다른 기독교 종파보다 가톨릭 종교에 유리하게 작용합니다. 가톨릭 교도가 관련된 결혼은 국가가 아닌 가톨릭 교회가 처리하게 됩니다. 또한 국가는 가톨릭 교회의 재정과 내부 문제에 대한 통제권을 포기하며, 가톨릭 교회는 오스트리아 제국의 거의 모든 초등 교육을 담당하게 됩니다."
 AUS_focus_denominational_unrest: "종교적 불안"
 AUS_focus_denominational_unrest_desc: "우리 제국의 여러 지역에는 비가톨릭 기독교 신앙이 존재하고 활동하고 있으며, 일부는 다른 신앙보다 더 두드러지고 목소리를 냅니다. 우리 왕국은 이단적인 경향과 불신자들과 싸워온 오랜 역사를 가지고 있으며, 언젠가는 이러한 문제들을 어떻게 계속할지 결정해야 할 것입니다. 보헤미아와 모라비아에서는 여러 작은 이단 조직들이 여전히 얀 후스의 신념을 따르고 있으며, 혁명 이후 더 강해진 왈덴스 지하 그룹들도 있습니다. 이들은 우리 통치의 안정성과 우리 지역에서 기독교 신앙의 온전성에 위협이 됩니다."
 AUS_focus_financial_crisis: "재정 위기"
 AUS_focus_financial_crisis_desc: "오스트리아 제국과 그 영토는 다른 많은 국가들이 경험한 것 같은 정량화할 수 있는 경제 호황의 호사스러운 상품을 한 번도 보지 못했습니다. 지난 세기 동안 너무나 많은 갈등이 쌓여 우리의 부채는 위협적인 수준으로 치솟았고, 이 모든 이자를 갚는 데 연간 국고의 큰 부분을 차지하고 있습니다."
 AUS_focus_cut_army_budget: "육군 예산 삭감"
 AUS_focus_cut_army_budget_desc: "우리 영토를 보호하는 거대한 황실-왕립 육군은 그 수준을 유지하기 위해 막대한 자금이 필요합니다. 장교와 장군들의 연금은 다른 많은 군대에서 제공하지 않는 다른 혜택들을 누리는 동안 아낌없이 지급됩니다. 1848년과 1849년 혁명 이후 이탈리아 주둔군은 거의 두 배로 늘어났으며, 그 비용 또한 만만치 않았습니다. 즉각적인 예산 삭감이 필요합니다. 그렇지 않으면 우리가 필사적으로 유지하려는 섬세한 균형을 잃을 수도 있습니다."
 AUS_focus_cut_army_budget_effect_tt: "우리의 §Yarmy budget§!을(를) 줄이는 것은 시간이 지남에 따라 우리의 §Ydebt§!를 또한 §Greduce§!할 것이지만, 우리는 §Ypath of spending reduction§!에 충실해야 합니다.\n\n"
 AUS_focus_newspaper_tax: "신문세"
 AUS_focus_newspaper_tax_desc: "신문세. 국내 신문이 "매일 또는 최소한 주 1회" 발행되고 적격한 내용을 포함할 경우 부과되는 보증금 납부 신문세입니다. 각 호의 첫 페이지에 1크로네의 비율로 부과됩니다. 세금은 인쇄물 발행 전에 인장과 함께 납부되어야 합니다. 인쇄업자는 백지를 사무실로 가져가 각 장에 인장을 찍어야 하며, 신문은 "세금 부과 대상 페이지의 첫 번째 면에 인장이 표시"되도록 인쇄되어야 합니다. 이 세금으로 창출되는 수입은 우리의 부채 부담을 덜고 인기가 시들해질 신문의 가격을 인상하는 데 도움이 될 것입니다."
 AUS_focus_keep_army_budget_at_all_cost: "육군 예산을 어떤 대가를 치르더라도 유지"
 AUS_focus_keep_army_budget_at_all_cost_desc: "우리 영토를 보호하는 거대한 황실-왕립 육군은 그 수준을 유지하기 위해 막대한 자금이 필요합니다. 장교와 장군들의 연금은 다른 많은 군대에서 제공하지 않는 다른 혜택들을 누리는 동안 아낌없이 지급됩니다. 1848년과 1849년 혁명 이후 이탈리아 주둔군은 거의 두 배로 늘어났으며, 그 비용 또한 만만치 않았습니다. 이 예산을 삭감한다면 우리는 생명선을 끊는 것과 같습니다. 어떤 대가를 치르더라도 육군 예산을 유지하십시오!"
 AUS_focus_keep_army_budget_at_all_cost_effect_tt: "현재 수준으로 우리의 §Yarmy budget§!을(를) 유지하는 것은 시간이 지남에 따라 우리가 §R더 많은§! §Ydebt§!를 떠안아야 한다는 것을 의미할 것입니다. 그러나 단기적으로는 §Ymilitary brass§!는 §Ghappy§!하고 우리 정치인들 중 §Yhawks§!는 이 정책을 §Gsupport§!할 것입니다.\n\n"
 AUS_focus_cooperate_with_the_kreditanstalt: "크레디트안슈탈트와 협력"
 AUS_focus_cooperate_with_the_kreditanstalt_desc: "유명한 유대계 은행가 로스차일드 가문의 후손인 안셀름 살로몬 폰 로스차일드는 1855년에 'k. k. privilegierte sterreichische Kredit-Anstalt für Handel und Gewerbe'를 설립했습니다. 이 금융 기관은 빠르게 확장하며 유럽 전역에서 사업을 수주하고 있습니다. 그들과 협력하면 우리의 재정 문제가 전문적으로 처리될 것입니다."
 #Triumph in Italy
 AUS_focus_triumph_in_italy: "이탈리아에서의 승리"
 AUS_focus_triumph_in_italy_desc: "이탈리아인들이 북부 이탈리아에 대한 우리의 통치에 도전했지만, 우리는 전장에서 그들을 격파했습니다. 이것은 우리의 적들에게 오스트리아 제국이 전성기가 한참 지났다는 생각이 틀렸음을 보여줄 것입니다. 우리는 이 승리를 내부와 외부에서 정치적 지렛대로 활용할 수 있습니다."
 AUS_focus_neoabsolutism: "신절대주의"
 AUS_focus_neoabsolutism_desc: "이탈리아에서의 승리 이후 황제와 그의 군대의 권위가 확고히 확립되면서, 강제적인 절대주의로 향하는 길이 열린 것 같습니다. 이제 우리의 목소리 높은 비판자들을 다루고 분열의 민족주의 세력을 분쇄할 때입니다."
 AUS_focus_tackle_the_debt_situation: "부채 문제 해결"
 AUS_focus_tackle_the_debt_situation_desc: "전장에서 승리했음에도 불구하고, 우리의 재정은 여전히 혼란스럽습니다. 미래에 상황을 더 효과적으로 다룰 방법을 찾기 위해 전문가들을 투입해야 합니다. 그러나 가장 중요한 것은 이 모든 것이 절대 외부에 알려져서는 안 된다는 것입니다!"
 AUS_focus_centralization_efforts: "중앙집권화 노력"
 AUS_focus_centralization_efforts_desc: "민족주의적 선동은 왕국의 안정에 지속적인 위협이며, 지금까지 지방 당국은 이를 진압하는 데 좋은 성과를 내지 못했습니다. 빈의 중앙 정부는 왕실 직할령 문제에 대해 더 많은 권위를 원하며, 우리는 이에 따라 정부가 왕국에 대한 더 직접적인 통제력을 갖도록 해야 합니다."
 AUS_focus_appoint_a_hardliner: "강경파 임명"
 AUS_focus_appoint_a_hardliner_desc: "우리의 중앙집권화 노력은 상당한 저항에 부딪혔으며, 현재 정부는 이를 극복하기에는 너무 약해 보입니다. 우리는 반대에 맞서는 것을 두려워하지 않고 다소 적대적인 환경에서도 잘 해낼 수 있는 사람, 즉 정치적 강경파가 필요합니다. 카를 루트비히 브룩 남작은 이 자리에 이상적인 후보로 보이며, 그는 이미 이 직무를 수행할 의지를 표명했습니다."
 AUS_focus_deal_with_the_opposition: "반대파 처리"
 AUS_focus_deal_with_the_opposition_desc: "우리 적들을 처리해야 합니다. 중앙집권화 노력이 성공할 기회를 가지려면 그들을 상당히 신속하게 설득해야 합니다. 새 정부는 이미 그렇게 할 효과적인 방법들을 찾아냈습니다."
 AUS_focus_deal_with_the_opposition_effect_tt: "§GThis will unlock decisions to appoint new governors for renitent Crown lands.§!"
 AUS_focus_protestantenpatent_alt: "프로테스탄텐파텐트"
 AUS_focus_protestantenpatent_alt_desc: "우리 국가의 지속성에 가장 큰 위협은 소수민족 간의 갈등입니다. 하지만, 종교의 자유를 단순히 확대함으로써 한 소수민족인 프로테스탄트들을 쉽게 만족시킬 수 있습니다. 이를 위해 우리는 전통적인 헝가리 왕관령 외부의 프로테스탄트들의 자유와 지위를 규제하는 프로테스탄텐파텐트를 발행할 것입니다."
 AUS_focus_establish_a_secret_police: "비밀 경찰 설립"
 AUS_focus_establish_a_secret_police_desc: "우리 국가 내 혁명 집단들의 정확한 위협과 음모는 항상 명백하지는 않지만, 그들의 존재를 완전히 뿌리 뽑는 것은 거의 불가능합니다. 그러나 우리 시민들을 감시하는 임무를 맡은 상설 비밀 경찰을 설립한다면, 우리 국가를 전복하려는 집단들을 서서히 찾아내고 통제하거나 파괴할 수 있을 것입니다."
 AUS_focus_establish_a_secret_police_effect_tt: "This will add §Gmore possibilities§! for the §YPolizeiverein§!."
 AUS_focus_coerce_the_nobility: "귀족 강제"
 AUS_focus_coerce_the_nobility_desc: "지방 귀족 엘리트는 우리 제국의 전통적인 행정 기반입니다. 지방 귀족들은 수세기 동안 자신들의 영지를 관리하고 육성해 왔으며, 시골 지역을 통제하는 데 핵심적인 역할을 합니다. 그러나 최근 들어 많은 소규모 귀족 가문들이 재정난에 빠졌습니다. 우리는 이를 활용하여 그들이 우리의 정치적 의제에 협력하도록 강제할 수 있습니다."
 AUS_focus_coerce_the_nobility_effect_tt: "§GThis will unlock decisions to coerce the nobility of the renitent Crown lands into cooperation.§!"
 AUS_focus_force_adversaries_into_submission: "적들을 복종시키다"
 AUS_focus_force_adversaries_into_submission_desc: "우리의 중앙집권화 조치에 여전히 저항하는 적들이 있습니다. 우리는 그들을 제압하고 문제가 발생하지 않도록 해야 합니다. 그들을 효과적으로 우리의 뜻에 따르게 할 수 있는 수단이 있습니다."
 AUS_focus_deal_with_the_debt_alt: "부채 처리"
 AUS_focus_deal_with_the_debt_alt_desc: "우리의 부채는 너무 부담스러워서 그냥 두고 커지게 할 수 없습니다. 많은 국가들이 자신의 부채의 무게에 짓눌리는 것을 보았고, 우리는 그러한 미래가 우리에게 닥치지 않도록 지금 행동해야 합니다. 우리는 우리에게 가장 효과적이거나 실현 가능한 방법으로 상환 옵션을 모색하기 시작할 것입니다."
 AUS_focus_deal_with_the_troublemakers_alt: "말썽꾼 처리"
 AUS_focus_deal_with_the_troublemakers_alt_desc: "우리에게 대항하는 자들은 더 이상 용납할 수 없습니다. 우리는 힘으로든 강제로든 그들을 굴복시켜야 합니다. 방법은 중요하지 않고, 패배만이 우리가 신경 쓰는 전부입니다. 이 골칫거리를 제거함으로써 우리는 통제력을 강화하고 제국의 다른 영역에 다시 집중할 수 있습니다."
 AUS_focus_deal_with_the_troublemakers_alt_effect_tt: "§GThis will unlock several decisions to deal with disobedience and protest from various part of the Empire.§!"
 AUS_focus_a_unitary_empire: "단일 제국"
 AUS_focus_a_unitary_empire_desc: "오스트리아 제국은 너무 오랫동안 별도의 법률을 가진 왕관들의 집합체로 존재해 왔으며, 이는 우리의 효과적인 통치를 방해했습니다. 우리는 대신 단일 법률 체계를 가진 단일 국가를 만들 것입니다. 우리는 오늘날 우리가 아는 복잡한 혼란을 없애고, 우리 황제 아래 단합된 국가를 만들 것입니다."
 AUS_focus_a_failed_state: "실패한 국가"
 AUS_focus_a_failed_state_desc: "우리의 신절대주의적 접근은 실패했습니다. 강제된 중앙집권화는 해결책보다 더 많은 문제를 야기했으며, 우리 정부는 이제 혼란에 빠졌습니다. 이 상황에서 벗어나기란 어려울 것입니다..."
 #Disaster in Italy
 AUS_focus_disaster_in_italy: "이탈리아의 재앙"
 AUS_focus_disaster_in_italy_desc: "이탈리아에서 최악의 사태가 발생했습니다... 우리는 패배했고, 베네치아와 롬바르디아의 부는 이제 우리에게서 멀어졌습니다. 우리 국가는 이러한 큰 손실에 대처하기 위해 재정비하고 새로운 길을 찾아야 합니다. 우리의 자존심, 국고, 그리고 군대는 이 사건들로 인해 손상되었으며, 우리는 각각을 치유할 방법을 찾아야 합니다."
 AUS_focus_summon_the_reichsrat: "제국 의회 소집"
 AUS_focus_summon_the_reichsrat_desc: "내부 압력에 따라 황제는 제국 의회를 이전 형태로 복원하기로 결정했습니다. 이는 제국의 모든 부분에 영향을 미치는 문제에 대해 권한을 가지며, 더 지역적인 문제는 다른 의회로 이관될 것입니다. 20년 만에 1849년 3월 혁명 이후 설립된 의회가 어떤 면에서는 복원되었습니다. 그러나 1848년의 메아리는 우리 국민들 중 많은 이들에게 좋게 기억되지 않습니다."
 AUS_focus_create_a_state_debt_commission: "국가 부채 위원회 설립"
 AUS_focus_create_a_state_debt_commission_desc: "우리의 부채는 끊임없는 문제이지만, 제국 의회(Reichsrat)에 부여된 새로운 권한으로 인해 이는 제국 의회의 문제입니다. 제국 의회는 우리의 부채를 조사하고 해결책을 찾으며, 부채의 증가와 그것이 우리 국가에 미치는 영향을 완화할 방법을 모색하기 위한 위원회를 구성할 것입니다. 이 정치인들이 전임자들보다 더 성공하기를 바랍니다."
 AUS_focus_create_a_state_debt_commission_trigger_tt: "§YReichsrat§!이(가) 빈에 모였습니다."
 AUS_focus_enact_a_constitutional_diploma: "헌법 외교문서 제정"
 AUS_focus_enact_a_constitutional_diploma_desc: "신절대주의 통치는 우리를 실패하게 만들었습니다. 우리는 이탈리아 전쟁에서 패배했을 뿐만 아니라, 남아있는 많은 신민들이 더 많은 독립을 갈망하고 있으며 오랫동안 헌법을 요구해 왔습니다. 제국 의회(Reichsrat) 대표들은 그러한 국가 법률에 대한 몇 가지 아이디어를 제시했으며, 우리는 그것들을 적절한 외교문서(Diploma)로 공식화해야 합니다."
 AUS_focus_appoint_von_schmerling: "폰 슈메르링 임명"
 AUS_focus_appoint_von_schmerling_desc: "자유주의자들 사이에서 꾸준히 인기가 있는 안톤 폰 슈메르링은 매우 강력한 정치인입니다. 우리가 자유주의 운동의 명목상 수장으로 다른 정치인들을 찾을 수도 있지만, 폰 슈메르링은 그의 당에서 권력의 고삐를 많이 쥐고 있을 것입니다. 그를 가까이 두고 우리 정부에 유용하게 활용하기 위해 우리는 그를 내무부 장관으로 임명할 것입니다. 그의 이상이 우리 국가를 구할 수 있기를 바랍니다."
 AUS_focus_revise_the_constitution: "헌법 개정"
 AUS_focus_revise_the_constitution_desc: "헌법 외교문서는 명백한 실패였습니다. 거의 아무도 그것이 상황을 개선하는 데 도움이 될 것이라고 확신하지 않았습니다. 안톤 폰 슈메르링은 헌법을 더 중앙집권적인 방식으로 개정하기를 원하며, 이는 비판자들을 달래고 민중을 진정시키는 방법이 될 수 있으므로, 마침내 우리는 나아가 미래를 내다볼 수 있을 것입니다."
 AUS_focus_protestantenpatent: "프로테스탄텐파텐트"
 AUS_focus_protestantenpatent_desc: "우리 국가의 지속성에 가장 큰 위협은 소수민족 간의 갈등입니다. 하지만, 종교의 자유를 단순히 확대함으로써 한 소수민족인 프로테스탄트들을 쉽게 만족시킬 수 있습니다. 이를 위해 우리는 전통적인 헝가리 왕관령 외부의 프로테스탄트들의 자유와 지위를 규제하는 프로테스탄텐파텐트를 발행할 것입니다."
 AUS_focus_landtag_elections: "주 의회 선거"
 AUS_focus_landtag_elections_desc: "우리가 시작한 개혁의 일환으로, 우리는 제국 전체의 제국 의회뿐만 아니라, 주 의회도 만들었습니다. 이제 우리는 이 주 의회가 선출되고 형성됨에 따라 진정으로 존재하도록 허용할 것입니다. 곧 이 의회들은 이전에 우리 국가에서는 알려지지 않았던 새로운 형태로 전국에서 권력을 행사할 것입니다."
 AUS_focus_enact_personal_liberties: "개인의 자유 제정"
 AUS_focus_enact_personal_liberties_desc: "이제 국가 법률은 존재하지만, 개인의 권리는 아직 확고한 기반 위에서 정의되지 않았습니다. 개인의 자유를 명확히 명시하고 경찰의 부당한 괴롭힘으로부터 우리 국민을 보호하는 일련의 법률을 제정하여 이 문제를 해결해야 합니다."
 AUS_focus_enact_personal_liberties_trigger_tt: "최초로 선출된 §YReichsrat§!이(가) 빈에 모였습니다."
 AUS_focus_inaugurate_the_first_elected_reichsrat: "최초의 선출된 제국 의회 취임"
 AUS_focus_inaugurate_the_first_elected_reichsrat_desc: "제국 전역에서 의원들을 선출한 후, 드디어 제국 의회를 개원할 때입니다. 이 새로운 정치인들이 얼마나 효과적일지 곧 알게 될 것입니다. 이 변화는 우리 국가에 오랫동안 기억될 것이며, 자유의 역사만으로도 이전 세기의 절대주의는 그 어느 때보다 달성하기 훨씬 어려워질 것입니다. 이것이 최선일까요?"
 AUS_focus_inaugurate_the_first_elected_reichsrat_trigger_tt: "§YThe regional parliaments have dispatched the delegates to Vienna.§!"
 AUS_focus_deal_with_the_debt: "부채 처리"
 AUS_focus_deal_with_the_debt_desc: "우리의 부채는 너무 부담스러워서 그냥 두고 커지게 할 수 없습니다. 많은 국가들이 자신의 부채의 무게에 짓눌리는 것을 보았고, 우리는 그러한 미래가 우리에게 닥치지 않도록 지금 행동해야 합니다. 우리는 우리에게 가장 효과적이거나 실현 가능한 방법으로 상환 옵션을 모색하기 시작할 것입니다."
 AUS_focus_deal_with_the_troublemakers: "말썽꾼 처리"
 AUS_focus_deal_with_the_troublemakers_desc: "우리에게 대항하는 자들은 더 이상 용납할 수 없습니다. 우리는 힘으로든 강제로든 그들을 굴복시켜야 합니다. 방법은 중요하지 않고, 패배만이 우리가 신경 쓰는 전부입니다. 이 골칫거리를 제거함으로써 우리는 통제력을 강화하고 제국의 다른 영역에 다시 집중할 수 있습니다."
 AUS_focus_deal_with_the_troublemakers_effect_tt: "§GThis will unlock several decisions to deal with disobedience and protest from various regional parliaments within the Empire.§!"
 AUS_focus_a_constitutional_monarchy: "입헌 군주제"
 AUS_focus_a_constitutional_monarchy_desc: "우리의 위대한 황제는 이제 제국 의회에 권력을 부여하는 여러 문서를 발행하여, 그 기관에 한때 자신이 가졌던 많은 권한을 부여했습니다. 우리 국가는 제국 전역에서 온 사람들에 의해 통치될 수 있을 것이며, 많은 시민들이 처음으로 자신들의 정부를 선택하게 될 것입니다. 이 새로운 시스템이 계속될 수 있기를 바랍니다."
 AUS_focus_sistierungspatent: "시스티룽스파텐트"
 AUS_focus_sistierungspatent_desc: "우리 제국에서 오스트리아와 헝가리 부분 사이의 관계는 오랫동안 가장 어려움이 많았습니다. 헝가리인들이 휘두를 수 있는 힘은 다시 한번 우리 황제로 하여금 상당한 양보를 하게 만들었습니다. 절망스럽게도, 이때 요구된 양보는 '시스티룽스파텐트'를 발행하게 했고, 이는 우리 제국의 모든 부분의 미래를 결정하기 위한 적절한 협상이 이루어질 때까지 2월 특허를 중단하는 것입니다."
 
 #Army
 AUS_focus_imperial_royal_army: "황실-왕립 육군"
 AUS_focus_imperial_royal_army_desc: "우리 군대는 제국의 중추이자 내부 및 외부 위협으로부터 제국을 안전하게 지키는 가장 중요한 요소 중 하나입니다. 따라서 우리는 최악의 상황에 대비하기 위해 군대 훈련을 장려해야 합니다."
 AUS_focus_degenfelds_army_reform_plans: "데겐펠트의 육군 개혁 계획"
 AUS_focus_degenfelds_army_reform_plans_desc: "우리는 마지못해 하는 포병감 아우구스트 폰 데겐펠트에게 제국 의회(Reichsrat)의 뜻에 따라 육군을 개혁하는 임무를 맡길 것입니다. 혁신적인 육군 개혁을 실행하는 데 우리의 지지가 있음을 확신시켜 주면, 그는 분명 우리를 잘 섬길 것입니다."
 AUS_focus_degenfelds_army_reform_plans_effect_tt: "§YAugust von Degenfeld§!는 §Yinnovative approach for our army§!를 지지하며 그를 육군 개혁의 수장으로 선택하는 것은 §Gbeneficial§!할 수 있지만, 또한 §Rcontroversy§!를 야기할 수 있습니다. 그가 제안한 육군 개혁 계획의 비용은 더 전통적인 방식의 군대를 고수하는 것보다 확실히 §Rhigher§!일 것이기 때문입니다.§!\n\n§RNOTE: If you choose this focus, it would be wise to pursue the path of 'Innovative Thinking' among the land doctrines.§!\n\n"
 AUS_focus_benedeks_army_reform_plans: "베네데크의 육군 개혁 계획"
 AUS_focus_benedeks_army_reform_plans_desc: "우리는 라데츠키의 전 참모장이자 인기 있는 전쟁 영웅인 포병감 루드비히 폰 베네데크를 육군 이론가로 임명하여 육군 개혁을 담당하게 할 것입니다. 베네데크는 군대가 혁명적 혼란에 맞서는 유일한 방어책이라고 믿으며, 개혁을 위한 지나치게 지적인 생각이라고 그가 믿는 것으로부터 많은 구식 제도와 함께 우리 군대의 '옛 군대 정신'을 보존하기를 희망합니다."
 AUS_focus_benedeks_army_reform_plans_effect_tt: "§YLudwig von Benedek§!은(는) §Yold guard army leader§!의 전형적인 예이며, 따라서 동료들 사이에서 §Gwell-respected§!합니다. 그를 육군 개혁 계획의 수장으로 선택하는 것은 안전한 선택이 될 것입니다. 그는 급진적인 변화를 만들지 않을 것이며, 그의 제안 비용은 §Greasonable§!해 보입니다. 동시에 베네데크의 혁신에 대한 명백한 반감은 §Rproblematic§!해질 수도 있습니다.§!\n\n§RNOTE: If you choose this focus, it would be wise to pursue the path of 'Traditional Army' among the land doctrines.§!\n\n"
 AUS_focus_winds_of_change: "변화의 바람"
 AUS_focus_winds_of_change_desc: "많은 장교들의 바람에도 불구하고, 기술은 근본적으로 변하고 있으며 우리는 그에 맞춰 변화해야 합니다. 우리 국가의 국력은 지금은 위대하게 여겨지지만, 우리가 발전하기를 꺼린다면 적들이 그렇게 하여 우리를 뒤처지게 할 것입니다. 대신 우리는 변화의 바람을 타고 그것이 우리 군대를 어디로 이끌지 지켜볼 것입니다."
 AUS_focus_modern_technology: "현대 기술"
 AUS_focus_modern_technology_desc: "현대 기술의 응용 범위는 넓으며, 쓸모없는 기술조차도 우리의 실제 필요와 진정으로 효과적인 것이 무엇인지에 대해 상당한 양을 알려줄 수 있습니다. 우리가 전신과 같은 더 현대적인 통신 형태를 개발하고 기술 병력을 확장하는 데 노력을 집중한다면, 우리 군대는 진정으로 경쟁할 수 있는 위치에 놓일 것입니다."
 AUS_focus_army_telegraphy: "육군 전신술"
 AUS_focus_army_telegraphy_desc: "우리는 통신의 현대적 발전을 활용하고 현재의 전신 시스템을 빈 너머로 확장하여 전시와 평시 모두 사용할 수 있도록 해야 합니다. 우리의 멀리 떨어진 지방들 사이의 통신을 확보함으로써, 우리는 그들의 충성과 안보를 보장하고 필요할 때 증원군을 제공할 수 있습니다."
 AUS_focus_expansion_of_technical_troops: "기술 병력 확장"
 AUS_focus_expansion_of_technical_troops_desc: "우리는 병사당 기술 병력을 매우 적게 고용하고 있으며, 이는 물류 유지와 전투 능력의 적절한 지원을 매우 어렵게 만듭니다. 우리는 기술 병력을 대대보다 큰 단위로 우리 군의 필수적인 부분으로 포함하고, 그 수를 확장하여 우리 군을 적절하게 지원할 것입니다."
 AUS_focus_faster_deployment: "더 빠른 배치"
 AUS_focus_faster_deployment_desc: "현재 우리의 배치 방식은 우리가 필요한 속도로 병력을 배치할 만한 조직력과 현대 기술이 부족합니다. 모든 병력 수송에 말을 더 광범위하게 사용하고, 철도를 포함한 더 발전된 인프라를 개발함으로써 우리는 광대한 영토를 가로질러 병력을 이동시키고 방어할 수 있습니다. 이러한 노력이 없으면 병사들이 주둔지를 떠나기도 전에 적에게 압도당할 수도 있습니다."
 AUS_focus_creation_of_a_military_railway_department: "군사 철도부 창설"
 AUS_focus_creation_of_a_military_railway_department_desc: "철도는 우리 병사들을 동원하는 방식과 그 속도를 변화시킬 전례 없는 기회를 제공합니다. 이를 제대로 활용하려면 이웃 국가들이 같은 기술을 사용하여 우리를 격파하기 전에 지정된 군사 철도부를 창설해야 합니다."
 AUS_focus_repurpose_cavalry: "기병대 용도 변경"
 AUS_focus_repurpose_cavalry_desc: "에델스하임-줄라이 소장은 우리의 기병대를 재편성하여 많은 중무장하고 다루기 어려운 병력을 경기병으로 전환할 것을 제안했습니다. 그의 의도는 우리 기병대가 고속으로 기동성이 높을 뿐만 아니라, 전통적인 기병 전투와 더불어 하마 전투 및 정찰 훈련을 받도록 하는 것입니다. 바라건대 이러한 변화를 통해 우리 기병대가 이 현대 시대에 그 가치를 증명할 수 있기를 바랍니다."
 AUS_focus_new_leadership: "새로운 지휘부"
 AUS_focus_new_leadership_desc: "구세대의 숭배는 우리 군대를 정체시켜 현대전을 이해하고 발전할 수 없게 만들었습니다. 우리는 젊고 혁신적인 장교들로 장교단을 교체하고 확장하여 우리 국가의 진정한 요구를 충족시킬 것입니다. 이는 참모부에서 가장 두드러지게 나타날 것이며, 오직 진정으로 자격을 갖춘 자들만이 우리 군대를 이끌 수 있도록 시험을 통해 보장될 것입니다."
 AUS_focus_an_austrian_general_staff: "오스트리아 참모부"
 AUS_focus_an_austrian_general_staff_desc: "많은 강력한 장군들이 반대함에도 불구하고, 오스트리아는 더 이상 프로이센 이웃 국가들처럼 현대적인 참모부 편성을 거부할 수 없습니다. 우리는 현재의 부관대와 참모대를 하나로 합쳐 하나의 참모부를 구성할 것이며, 현대 기술을 통해 우리 전체 군대를 조율할 수 있을 것입니다."
 AUS_focus_exams_for_promoted_officers: "승진 장교 시험"
 AUS_focus_exams_for_promoted_officers_desc: "우리는 이미 장교들의 입대 시와 특정 특별 사례에 대한 시험을 실시하고 있습니다. 우리는 이 시스템을 확장하여 장교들의 역량을 더욱 평가해야 합니다. 새로운 시험은 후보자들이 전투에서 병력을 이끌기 위한 필요한 지식과 인격을 갖추고 있는지 확인하기 위해 실시될 것이며, 사회적 지위뿐만 아니라 기술과 기량을 보상할 것입니다."
 AUS_focus_the_core_of_our_armed_forces: "우리 군의 핵심"
 AUS_focus_the_core_of_our_armed_forces_desc: "장교단, 후방 부대, 지원 부대가 우리 군에서 매우 중요하지만, 우리 군의 핵심은 보병과 기병이며, 그들을 소홀히 하는 것은 실수일 것입니다. 우리는 그들의 작전을 개혁하고 현대화하며, 현대 기술을 병사들에게 도입하여 사격률과 정확도를 동시에 향상시키고, 이 부대들의 실제 작전을 개선할 것입니다."
 AUS_focus_operational_restructuring: "작전 구조 조정"
 AUS_focus_operational_restructuring_desc: "우리 군대는 효과적이지만, 문제점이 없는 것은 아니며, 군대의 측면을 개선하고 현대화하는 것은 전장에서 우리의 성공에 매우 도움이 될 수 있습니다. 우리는 훈련 시설 확장, 새로운 규정 제정 및 기타 개혁을 포함하여 우리 군대의 작전 방식을 변경할 것입니다. 이러한 변경 사항을 구현하면 효율성이 향상되고, 바라건대 우리 군대가 미래의 시련에서 살아남을 수 있도록 만들 것입니다."
 AUS_focus_new_infantry_regulations: "새로운 보병 규정"
 AUS_focus_new_infantry_regulations_desc: "이제 장비와 기병 교리를 업데이트했으니, 새로운 규정을 통해 보병에게 변화를 가져와야 합니다. 빠른 종대와 총검 돌격은 매우 효과적임이 입증되었으며, 우리는 오스트리아 육군에서 이러한 과감한 전술을 채택할 계획입니다. 우리는 오스트리아 병사가 여전히 만만치 않은 세력임을 세상에 보여줄 것입니다!"
 AUS_focus_expand_the_kriegsschule: "크리그스슐레 확장"
 AUS_focus_expand_the_kriegsschule_desc: "크리그스슐레는 우리 참모 장교들의 주요 공급원입니다. 이것의 존재는 우리 군대가 과거의 전쟁 개념에 갇히지 않고 현대 전쟁 세계를 진정으로 이해할 수 있는 과학적 접근 방식의 장교들로 운영될 수 있게 합니다. 시설을 확장함으로써 우리는 훨씬 더 많은 참모들을 고용할 수 있으며, 어쩌면 더 넓은 범위의 장교들을 교육하는 것을 시작할 수도 있습니다."
 AUS_focus_rifle_improvements: "소총 개량"
 AUS_focus_rifle_improvements_desc: "소총은 수세기 전에 다른 모든 유형의 무기를 압도하며 전 세계 전쟁의 가장 필수적인 무기가 되었습니다. 그러나 그 기술 또한 끊임없이 발전했으며, 우리 소총 역시 이러한 변화에 발맞춰야 합니다. 우리에게는 여러 가지 선택지가 있지만, 우리의 주요 선택은 새로운 소총을 개발할 것인지 아니면 로렌츠를 더욱 현대화할 것인지입니다. 둘 다 나름의 단점과 장점이 있으며, 우리 소총의 미래에 대한 결정이 내려져야 합니다."
 AUS_focus_an_austrian_breechloader_rifle: "오스트리아 후장식 소총"
 AUS_focus_an_austrian_breechloader_rifle_desc: "황제가 뜻을 굽히고 데겐펠트가 전쟁 장관이 되면서, 우리는 마침내 로렌츠 소총을 현대적인 후장식 소총으로 대체할 수 있게 되었습니다. 우리의 장군들이 높은 발사 속도의 유용성에 대해 폄하하는 말에도 불구하고, 우리는 오스트리아가 구식 소총을 계속 사용하는 것을 용납하지 않을 것입니다. 그러나 자주 휴가 나가는 우리 병사들이 완전히 새롭고 혁신적인 소총을 배우는 데 얼마나 잘 적응할지는 지켜봐야 할 것입니다."
 AUS_focus_cooperate_with_the_oewg: "Œ.W.G.와 협력"
 AUS_focus_cooperate_with_the_oewg_desc: "안타깝게도 빈 병기창은 완전히 재정비되고 업그레이드되어야 하므로 자체적으로 새 소총을 충분히 생산할 능력이 없습니다. 대신, 우리는 우리의 필요를 충족시키기 위해 슈타이어에 있는 요제프 베른들의 소총 공장을 가진 민간 부문에 의존해야 할 것입니다."
 AUS_focus_lorenz_rifle_modernization: "로렌츠 소총 현대화"
 AUS_focus_lorenz_rifle_modernization_desc: "로렌츠 소총은 교육 수준이 낮은 우리 보병에게 가장 적합하며, 그 정확성과 사거리는 이른바 '현대식' 소총과 비교할 때 우수함이 입증될 것입니다. 대신, 우리는 생산을 더 용이하게 하고 그 성능이 다른 소총과 견줄 수 있도록 소총을 개량합시다."
 AUS_focus_cooperate_with_the_vienna_arsenal: "빈 병기창과 협력"
 AUS_focus_cooperate_with_the_vienna_arsenal_desc: "빈 병기창은 이미 많은 수의 로렌츠 소총을 생산하고 있지만, 현재 우리 군대의 모든 수요를 충족시킬 수는 없습니다. 우리는 병기창의 기계를 업그레이드하고 교체하여 우리의 필요를 충족시킬 만큼 충분한 무기를 생산할 수 있도록 할 것입니다."
 AUS_focus_artillery_advancements: "포병 현대화"
 AUS_focus_artillery_advancements_desc: "더 현대적인 형태의 포병의 유용성은 더 이상 부인할 수 없습니다. 우리가 유럽의 주요 강대국으로서 우리의 지위를 유지할 수 있도록 무기 체계와 운용 모두를 현대화해야 합니다. 그렇지 않으면 적들이 우리가 그들에게 도달하기도 전에 우리를 날려버릴지도 모릅니다!"
 AUS_focus_conduct_cannon_experiments: "대포 실험 수행"
 AUS_focus_conduct_cannon_experiments_desc: "최신 대포 기술의 가치를 진정으로 알기 위해서는 시험과 실험을 활용해야 합니다. 소총 시험은 비교적 쉽게 수행할 수 있지만, 대포 시험은 훨씬 더 복잡하고 더 많은 연구를 필요로 합니다. 그러나 그들은 훌륭한 결과를 낳고 우리의 현재 훈련, 장전 방법, 포탄 종류의 가치를 한 번에 알려줄 수 있습니다."
 AUS_focus_muzzle_loading_cannons: "전장식 대포"
 AUS_focus_muzzle_loading_cannons_desc: "현대적인 대포 기술 발전에도 불구하고, 우리의 전장식 포는 투자 수익률 면에서 여전히 우리에게 잘 봉사하고 있으며, 우리의 장군들은 후장식 대포에 맞서서도 여전히 좋은 성능을 보인다고 제안했습니다. 처음부터 시작하는 대신, 우리는 강선 전장식 포에 대한 경험을 바탕으로 개량된 전장식 대포를 설계할 것입니다."
 AUS_focus_a_conservative_stance: "보수적인 입장"
 AUS_focus_a_conservative_stance_desc: "우리 군대는 우리 국가의 가장 어려운 시기를 헤쳐나가며 봉사해왔으며, 역대 가장 위대한 장군들의 최선의 노력에도 불구하고 우리는 시간의 시험을 견뎌냈습니다. 어떤 국가보다 황제께 충성하는 우리의 위대한 사기와 독특한 군대는 외부 및 내부 위협으로부터 우리를 보호하며, 이 시스템을 교란하는 것은 우리를 파괴할 수 있습니다. 우리 병사들은 적보다 더 열심히 싸웁니다. 그것으로 충분하지 않습니까?"
 AUS_focus_the_old_guard_knows_best: "구세대가 가장 잘 압니다"
 AUS_focus_the_old_guard_knows_best_desc: "많은 젊은 장교들은 프로이센 군대에서 파생된 아이디어를 구현하기를 원합니다. 소위 '전쟁의 과학'은 질병을 이해하는 방식과 같은 방식으로 전쟁을 이해하려 하며, 전쟁을 극단적으로 오해하고 있습니다. 그들의 믿음은 1848년 우리가 프로이센과 그들의 군대를 어떻게 위협했는지, 그리고 현재의 지휘 방식과 함께한 우리의 길고 빛나는 역사를 잊은 듯합니다. 이러한 아이디어는 우리 군대를 발전시키지 못하고 오히려 분열시키고 약화시킬 것입니다."
 AUS_focus_keep_the_adjutantenkorps: "부관단 유지"
 AUS_focus_keep_the_adjutantenkorps_desc: "데겐펠트가 부관단과 참모단을 합치기를 원했지만, 베네데크는 검증되지 않고 지나치게 지적인 프로이센 참모부 방식을 모방하기 위해 그륀의 아이디어를 포기할 필요성을 느끼지 못합니다. 대신, 우리는 우리 자신의 필요를 충족시키기 위해 현재의 두 제도를 유지할 것입니다."
 AUS_focus_rely_on_senior_officers: "고위 장교들에게 의존"
 AUS_focus_rely_on_senior_officers_desc: "우리 고위 장교들은 모든 오스트리아 군사 지식의 축적을 대표하며, 우리는 젊고 잠재적으로 급진적인 장교들보다는 그들에게 의존해야 합니다. 그들이 대부분 보수적이고 귀족적이라는 사실은 그저 놀라운 우연의 일치일 뿐입니다. 만약 우리가 그들이 현역으로 더 오래 봉사하도록 격려할 수 있다면, 연금과 새로운 장교들의 급여도 절약할 수 있을 것입니다."
 AUS_focus_learn_from_the_past: "과거로부터 배우기"
 AUS_focus_learn_from_the_past_desc: "우리 군대가 누려온 수많은 영광에도 불구하고, 우리 역사에는 패배가 없었던 것은 아닙니다. 이는 우리와 같은 호전적인 국가에서는 당연히 예상할 수 있는 일이지만, 그러한 패배 속에서도 귀중한 교훈이 있습니다. 병력 이동에 관한 실수와 많은 지도들의 신뢰할 수 없음이 여러 번 문제를 야기했습니다. 이와 더불어, 민족 구성으로 인해 분할된 우리 군대의 특성은 종종 문제를 일으켰습니다. 이러한 결함을 개선하면 마침내 우리 군대가 최고의 상태에 도달할 수 있을 것입니다."
 AUS_focus_cavalry_reorganization: "기병대 재편성"
 AUS_focus_cavalry_reorganization_desc: "중기병은 엄청나게 비싸며, 지난 군사 작전에서는 거의 쓸모가 없었습니다. 우리의 전술은 여전히 기병 돌격에 초점을 맞추고 있지만, 이 전술은 새로운 무기 유형의 개발과 함께 최근에는 덜 실용적이고 더 위험해졌습니다. 이러한 점을 고려하여 우리는 비용을 절감하고 전투에서 그들의 효율성을 향상시키기 위해 기병대를 재편성해야 합니다."
 AUS_focus_improve_army_cartography: "군사 지도학 개선"
 AUS_focus_improve_army_cartography_desc: "많은 현대적 발전이 모호한 가치를 지니고 있지만, 지도학의 발전은 분명히 엄청나게 유용합니다. 최근 몇 년간 개발된 더 발전된 지도 제작 방법을 많이 채택하면, 우리 군대는 적보다 해당 지역에 대한 더 많은 지식을 가지고 작전할 수 있을 것이며, 특히 우리 자신의 영토 내에서는 더욱 그러할 것입니다. 우리 군대는 이러한 향상된 지식으로 더 잘 기동할 수 있음을 발견할 것이며, 훨씬 더 쉽게 진격하고 후퇴할 수 있을 것입니다."
 AUS_focus_esprit_de_corps: "집단 정신(Esprit de Corps)"
 AUS_focus_esprit_de_corps_desc: "사기와 싸우려는 의지가 종종 우리의 가장 큰 자산이었지만, 우리 민족의 분열된 본질이 우리 군대에 반영되어 재앙적인 결과를 초래할 수 있습니다. 이러한 강점을 더욱 향상시키고, 이러한 발전을 통해 분열된 본질이 야기하는 문제들을 완화하는 것은 우리에게 더 효과적인 군대뿐만 아니라 제국에 더 충성하는 군대를 선사하여 그 존재 자체를 보장할 수 있습니다."
 AUS_focus_ban_non_german_military_magazines: "비독일어 군사 잡지 금지"
 AUS_focus_ban_non_german_military_magazines_desc: "군사 잡지가 우리 장교들을 교육하는 데 유용할 수 있지만, 군의 공식 언어 외의 출판물은 비독일계 병사들의 충성심에 위험이 될 수 있습니다. 어떤 반역적인 사상이 퍼지는 것을 막기 위해 우리는 우리 군대에서 모든 비독일어 잡지 사용을 전면 금지할 것입니다."
 AUS_focus_osterreichische_militarische_zeitschrift: "오스트리아 군사 저널"
 AUS_focus_osterreichische_militarische_zeitschrift_desc: "군사 잡지와 저널의 유용성을 인정하여, 우리는 모든 장교들이 구독하도록 장려될 전통적인 오스트리아 군사 잡지를 공식적으로 홍보할 것입니다. 이 잡지 내의 내용은 우리 장교들의 교육을 돕고 사기와 충성도를 향상시키는 데 기여해야 합니다."
 AUS_focus_follow_hauslabs_ideas: "하우스랩의 사상 따르기"
 AUS_focus_follow_hauslabs_ideas_desc: "소위 '슈토스타크틱은 광기입니다! 우리 병사들은 적절한 지원 없이 목숨을 잃을 것입니다. 대신, 보병 공격을 해야 한다면 우리 보병이 적진에 도달하기 전에 압도적인 포격으로 저항을 파괴하고, 우리 병사들의 생명을 구하며 진정으로 승리를 보장해야 합니다."
 AUS_focus_follow_hauslabs_ideas_trigger_tt: "Requires §YFranz von Hauslab§! to hold any position in the §YMilitary High Command§!."
 AUS_focus_implement_the_stosstaktik: "슈토스타크틱 실행"
 AUS_focus_implement_the_stosstaktik_desc: "총검은 최고의 보병 무기로 입증되었으며 우리의 전술은 이를 반영해야 합니다. 우리는 총검 돌격에 우리의 전략을 집중할 것이며, 우리 병사들의 유명한 용맹함이 모든 적들에게 승리를 가져다줄 것입니다!" 
 #Navy
 AUS_focus_imperial_royal_navy: "황실-왕립 해군"
 AUS_focus_imperial_royal_navy_desc: "카이저리히-쾨니글리히 크리그스마리네(Kaiserlich-königliche Kriegsmarine), 즉 황실-왕립 해군은 페르디난트 막시밀리안 임명 전까지 주로 이탈리아인 승무원으로 구성되었습니다. 이탈리아어가 주요 언어였고, 독일어 함선 이름 대신 이탈리아어 함선 이름까지 사용되었습니다. 유럽의 다른 국가들이 대항해시대에 해군 생산을 혁신하고 나폴레옹 시대에 이를 더욱 발전시킬 동안, 오스트리아는 유리한 해상 지리와 남부의 경쟁국들 때문에 부분적으로 현존 함대 교리(Fleet-in-Being doctrine)를 고수했습니다. 그러나 이제 지도부의 변화와 통일된 이탈리아의 위협에 직면하여, 프란츠 요제프 황제는 최종 결정을 내렸습니다. 오스트리아는 적들과 경쟁하고 오스트리아의 이익을 보호할 위대하고 강력한 해군, 진정한 황실-왕립 해군이 필요할 것입니다."
 AUS_focus_archduke_maximilians_tenure: "막시밀리안 대공의 재임 기간"
 AUS_focus_archduke_maximilians_tenure_desc: "황실-왕립 해군 사령관, 롬바르디아-베네치아의 새 총독, 그리고 황제의 형제로서, 막시밀리안 대공은 제국 내에서 큰 권력을 가진 위치에 있습니다. 재능 있는 합스부르크 가문 인물인 그는 훌륭한 제독이며, 심지어 더 나은 행정가이자 빠른 학습자로 보입니다. 그는 이전 전쟁들에서의 해전 전투를 연구했으며, 해군에 대한 우리의 접근 방식을 개혁하고, 우리의 인프라와 함선 설계를 강화하며, 해군 교리를 재평가하는 데 대한 몇 가지 흥미로운 아이디어를 가지고 있습니다."
 AUS_focus_archduke_maximilians_tenure_trigger_tt: "§YMaximilian von Österreich§!가 해군 §YMilitary High Command§! 내에서 §YChief of Navy§! 직위를 맡고 있어야 합니다."
 AUS_focus_reinvent_our_naval_spirit: "해군 정신 재창조"
 AUS_focus_reinvent_our_naval_spirit_desc: "오스트리아 해군의 정신은 오래전에 사라졌습니다. 우리의 기준이 뒤떨어졌고 우리는 주로 무역 함대에 의존했기 때문입니다. 변화의 바람이 다가오고 있으며, 이제 우리의 해군 정신을 재창조하고 바다 위에서 우리의 위치를 재정립할 때입니다."
 AUS_focus_improve_our_international_standing: "국제적 위상 향상"
 AUS_focus_improve_our_international_standing_desc: "해외와 국내 모두에서 우리의 이익을 보호하기 위해, 해상 통제권을 확보할 수 있도록 국제적 위상을 높이는 것이 중요합니다. 인근 국가들과의 관계를 개선하면 우리의 위신과 명예를 높일 수 있으며, 이는 우리에게 유리하게 작용할 것입니다."
 AUS_focus_lessons_from_the_novara_expedition: "노바라 원정으로부터의 교훈"
 AUS_focus_lessons_from_the_novara_expedition_desc: "몇 달 전 파견했던 노바라 원정대의 귀환은 우리 국가에 많은 위신과 지식을 가져다줄 것입니다. 하지만 이것이 유일한 원정은 아닐 것입니다. 큰 성공을 거두었으므로, 우리는 그것으로부터 교훈을 얻고 앞으로 몇 년 동안 더 많은 원정대를 준비해야 할 것입니다."
 AUS_focus_increase_our_armament_efforts: "군비 증강 노력"
 AUS_focus_increase_our_armament_efforts_desc: "군비는 군사 부대가 장비하는 전쟁 무기와 보급품이며, 이는 해군도 마찬가지입니다. 해군 군비를 전반적으로 증강하는 것은 다가올 갈등과 더 나은 보급에 결정적인 역할을 할 것입니다."
 AUS_focus_lessons_from_the_italian_war: "이탈리아 전쟁으로부터의 교훈"
 AUS_focus_lessons_from_the_italian_war_desc: "롬바르디아의 우리 육군이 이탈리아인들로부터 연이은 타격을 입었음에도 불구하고, 우리 해군은 훨씬 더 심각했습니다. 대부분이 폐허가 되거나 침몰하거나 수리 불능 상태였습니다. 우리의 일부 민간 자금을 전환하여 함선들을 수리할 뿐만 아니라 완전히 현대화해야 합니다."
 AUS_focus_emperor_of_the_adriatic: "아드리아해의 황제"
 AUS_focus_emperor_of_the_adriatic_desc: "우리 제국은 서쪽과 남쪽에 있는 다른 강대국들처럼 거대한 해안선을 축복받지는 못했지만, 그것이 우리의 해군 야망을 조금도 좌절시키거나 파괴하지는 않을 것입니다. 의회는 자라, 세베니코, 스팔라토, 라구사, 두라초와 같은 달마티아 도시들에 더 많은 조선소를 건설하는 것을 찬성했습니다."
 AUS_focus_race_for_supremacy_in_the_mediterranean: "지중해 패권 경쟁"
 AUS_focus_race_for_supremacy_in_the_mediterranean_desc: "함대가 수리되고 다시 항해할 준비가 되었으니, 우리는 이미 낡은 해군의 새롭고 개선된 모델에 대한 연구에 집중해야 합니다. 그리하여 이탈리아 국가들이나 세계의 열망의 도시에 있는 술탄에게 의문시되지 않을 아드리아해에서 해군 지배력을 확립할 수 있을 것입니다."
 AUS_focus_race_for_supremacy_effect_tt: "§GThis will unlock focuses to strengthen our navy with ironclad vessels.§!"
 AUS_focus_strenghten_non_italian_naval_bases: "비이탈리아 해군 기지 강화"
 AUS_focus_strenghten_non_italian_naval_bases_desc: "우리가 이탈리아의 지배력을 제거하고 함대 내 독일 방식을 확립하기 위한 프로그램에서 상당한 진전을 이루고자 한다면, 이탈리아가 지배적인 해군 기지를 제외한 아드리아 해안의 모든 해군 기지를 강화하는 것이 올바른 방향입니다."
 AUS_focus_race_for_supremacy_in_the_adriatic_sea: "아드리아해 패권 경쟁"
 AUS_focus_race_for_supremacy_in_the_adriatic_sea_desc: "일부 사람들이 '아드리아해를 위한 경쟁'이라고 부르는 이 경쟁이 시작되었습니다. 이는 이탈리아 전쟁 이후 이탈리아 라이벌에 맞서 아드리아해의 패권을 놓고 다투는 것을 의미합니다. 우리가 해군 확장을 계속하고 지중해의 나머지 지역에 접근하는 것이 영원히 차단되지 않으려면, 이 경쟁을 우리에게 유리하게 만들어야 합니다."
 AUS_focus_naval_administration_changes: "해군 행정 변경"
 AUS_focus_naval_administration_changes_desc: "우리 해군 행정이 나쁘지는 않지만, 무능한 제독들로 인해 부족하고 뒤쳐져 있습니다. 해군 행정의 신속하고 적절한 개혁은 우리를 더 현실적이고 현대적인 해군 행정 방향으로 나아가게 할 것입니다."
 AUS_focus_enforce_german_as_command_language: "독일어를 지휘 언어로 강제"
 AUS_focus_enforce_german_as_command_language_desc: "카이저리히-쾨니글리히 크리그스마리네(Kaiserlich-königliche Kriegsmarine), 즉 황실-왕립 해군은 주로 이탈리아인 승무원들이 지휘했습니다. 이탈리아어가 주요 언어였고, 독일어 함선 이름 대신 이탈리아어 함선 이름까지 사용되었습니다. 막시밀리안 대공의 재임 기간 동안 개혁이 이루어진 후 많은 것이 변했지만, 자랑스러운 함대의 주요 언어가 독일어가 되기까지는 더 많은 조치가 필요합니다."
 AUS_focus_more_independence_from_the_army: "육군으로부터 더 많은 독립"
 AUS_focus_more_independence_from_the_army_desc: "해군부와 따라서 해군부 장관은 다가오는 해에 우리 국가의 해상 활동의 미래를 위해 특히 중요하며, 즉시 설립되어야 합니다. 전쟁부와 함께 작동하도록 설정될 이 부처는 상선 해군뿐만 아니라 해양 경제의 다른 측면들도 담당할 것입니다."
 AUS_focus_incorporation_of_the_flottillenkorps: "플로틸렌코르프스 편입"
 AUS_focus_incorporation_of_the_flottillenkorps_desc: "우리의 원양 함대는 우리의 강과 호수를 순찰하는 플로틸렌코르프스, 즉 내륙 함대에 의해 보완됩니다. 가용성을 최적화하기 위해 해군 계획을 계속 추진하면서 플로틸렌코르프스를 원양 함대에 편입해야 합니다."
 AUS_focus_vacancy_at_the_helm: "지휘부 공석"
 AUS_focus_vacancy_at_the_helm_desc: "막시밀리안의 해군 참모장 직위 퇴임으로 다른 경쟁자가 그의 자리를 차지할 빈자리가 생겼습니다. 우리는 오스트리아 해군 제독 빌헬름 폰 테게토프 또는 루드비히 폰 파우츠, 이 두 명의 매우 유능한 제독 중 한 명을 승진시켜 그 직위를 정당하게 맡길 수 있습니다."
 AUS_focus_make_ludwig_von_fautz_head_of_the_navy_department: "해군부의 새 수장"
 AUS_focus_make_ludwig_von_fautz_head_of_the_navy_department_desc: "아바나에서 인도에 이르기까지 전 세계에 이름이 알려진 루드비히 폰 파우츠는 여러 종교 기사단의 일원이기도 합니다. 그의 항해와 제국에 대한 사랑은 황실에서 큰 명성을 쌓았으며, 황실은 그에게 해군 장관의 직위를 부여하는 데 더욱 적극적입니다. 그의 기술과 막시밀리안의 첨단 함선 개혁은 오스트리아 해군의 자부심을 확실히 회복시켜 줄 것입니다."
 AUS_focus_make_ludwig_von_fautz_head_of_the_navy_department_effect_tt: "§YLudwig von Fautz§!는 §Ynavy department§!를 이끄는 임무를 맡게 될 것입니다. 그는 또한 잠재적인 §Ynaval theorist§!로서도 활동할 수 있을 것입니다."
 AUS_focus_make_wilhelm_von_tegetthoff_head_of_the_naval_command: "해군 사령부의 새 수장"
 AUS_focus_make_wilhelm_von_tegetthoff_head_of_the_naval_command_desc: "슈타이어에서 태어나 빈 시장의 가까운 친척인 그는 자신의 선원들뿐만 아니라 막시밀리안에게도 유능한 인물임을 증명했습니다. 그의 천재성을 낭비할 수 없으므로, 우리는 그가 우리와 우리 해군을 위대함으로 이끌도록 도와야 합니다."
 AUS_focus_make_wilhelm_von_tegetthoff_head_of_the_naval_command_effect_tt: "§YWilhelm von Tegetthoff§!는 §YHead of Tactical Navy Command§!의 역할을 맡게 될 것입니다. 그는 또한 잠재적인 §Ynaval theorist§!로서도 활동할 수 있을 것입니다."
 AUS_focus_revise_our_naval_force: "해군력 재검토"
 AUS_focus_revise_our_naval_force_desc: "우리 해군의 구조와 전반적인 전력은 무질서하고 절망적인 상태로, 라이벌에게 공격을 가하거나 공격을 방어하기에 부적합합니다. 해군력과 그 구성 요소를 재검토하는 것은 미래의 우리의 노력에 성공을 가져올 것입니다."
 AUS_focus_expand_our_naval_infrastructure: "해군 기반 시설 확장"
 AUS_focus_expand_our_naval_infrastructure_desc: "우리 해군 기반 시설은 많은 부분에서 부족하며 많은 사람들에게 수치스러운 일로 여겨지고 있고, 이는 우리의 상황을 약하게 보이게 만들었습니다. 해군 관련 기반 시설을 확장하여 경쟁국들에게 모범을 보이는 것은 엄청난 이점이 될 것입니다."
 AUS_focus_triest_dockyards: "트리에스테 조선소"
 AUS_focus_triest_dockyards_desc: "1830년 오스트리아의 기업가 게오르크 슈트루트호프는 증기선 엔진 수리 공장을 설립했고, 1835년 트리에스테 근처 산탄드레아에 엔진 공장과 증기 엔진 생산을 위한 주조 공장을 설립했습니다. 이러한 활동이 확장되면서 곧 트리에스테의 파브리카 머신 '산탄드레아'에 편입되었습니다. 1857년 초, 게오르크 슈트루트호프는 1850년대 초 그의 가족이 인수한 땅에 무기아 항구에 조선소를 설립했습니다. 이제 게오르크 슈트루트호프의 이 두 사업은 '스타빌리멘토 테크니코 트리에스티노'라는 새로운 산업 단지 아래 통합될 가능성을 심각하게 고려하고 있습니다."
 AUS_focus_triest_dockyards_effect_tt: "§GThis will unlock two ship manufacturers for company partnerships.§!"
 AUS_focus_triest_dockyards_effect_tt: "§GThis will unlock two ship manufacturers for company partnerships.§!"
 AUS_focus_navy_arsenal_pola: "폴라 해군 병기창"
 AUS_focus_navy_arsenal_pola_desc: "옛 크로아티아 왕국의 도시 중 하나는 새로운 해군 항구가 되기에 완벽한 역량과 환경을 갖추고 있습니다. 이를 통해 베네치아로부터 우리의 해군력 투사는 확실히 보호될 것이며 아드리아해에서 해군 우위가 확립될 것입니다."
 AUS_focus_naval_academy_fiume: "피우메 해군 사관학교"
 AUS_focus_naval_academy_fiume_desc: "피우메에 있는 해군 사관학교는 오스트리아 해군의 미래 해군 장교들을 위한 최초의 훈련 시설로 시작될 것입니다. 해군 사관학교는 카이저리히 운트 쾨니글리히(kaiserlich und königlich), 즉 k. u. k. 해군 사관학교로 명명되었습니다. 피우메에 있는 k.k. 해군 사관학교 건설을 위한 기초 공사는 1856년 3월 26일, k.u.k 해군 총사령관인 페르디난트 막스 대공의 면밀한 감독 아래 시작되었습니다. 사관학교는 남향의 본관 건물과 두 개의 측면 날개로 구성되어 있으며, 건물은 불과 몇 달 안에 완공될 예정입니다."
 AUS_focus_expand_the_adriatic_ports: "아드리아 해 항구 확장"
 AUS_focus_expand_the_adriatic_ports_desc: "아드리아해는 우리와 접해있는 유일한 해안선이므로, 언제나 우리 해군의 가장 중요한 작전 기지가 될 것입니다. 아드리아해를 따라 항구를 확장하는 프로그램을 수립하는 것은 해군 확장을 위한 많은 기회를 제공할 것입니다."
 AUS_focus_improve_our_naval_technology: "해군 기술 개선"
 AUS_focus_improve_our_naval_technology_desc: "오스트리아 해군 발전을 지속하기 위해서는 다른 서구 열강의 기준에 맞는 새로운 함선 설계와 부품이 필요합니다. 제국 전역을 수색하여 해군력을 강화할 몇몇 건축가와 함선 설계자들을 찾아냈습니다. 해군 확장을 계속하려면 이들의 의견을 따라야 합니다."
 AUS_focus_the_salvacoste: "살바코스테"
 AUS_focus_the_salvacoste_desc: "해군 장교 조반니 루피스는 자체 추진 어뢰 시제품 개발을 위한 위원회를 이끄는 임무를 맡았습니다. 두 번째 모델은 시계 메커니즘을 프로펠러 엔진으로 설계되었습니다. 점화되면 선미의 폭발물이 선수를 통해 활성화되는 권총형 제어 장치를 통해 작동하기 시작했습니다. 여러 번의 시험 끝에 결국 효과적이고 일관되게 작동했습니다. 이를 이탈리아어로 '해안 수호자'를 의미하는 '살바코스테'라고 불렀으며, '6 m'로 표기했습니다."
 AUS_focus_screw_gunboats: "스크류 건보트"
 AUS_focus_screw_gunboats_desc: "지중해 전체를 아우를 수 있는 함대를 효과적으로 구축하고, 쉬운 건조를 위해 프리깃 설계로 나아가는 것은 더 작고 가벼우며 빠른 함선을 대량 생산함으로써 해군 강국으로서의 우리의 입지를 향상시킬 것입니다."
 AUS_focus_ironclads: "철갑함"
 AUS_focus_ironclads_desc: "19세기 중반 유럽과 미국에서 건조되었으며 선체를 보호하는 철갑으로 구별되는 철갑함은 두꺼운 선체와 강력한 대포가 모든 목재 함선을 능가하므로 항해와 해전의 미래를 대표합니다. 우리는 이것에 투자해야 합니다."
 AUS_focus_drache_class_ironclads: "드라헤급 철갑함"
 AUS_focus_drache_class_ironclads_desc: "철갑함은 강력한 대포, 뛰어난 기동성, 그리고 적 함선으로부터 보호하기 위한 전반적인 중량을 갖춘 세기의 새로운 함선으로서 그 가치와 위력을 증명했습니다. 요제프 폰 로마코 설계 국장은 이 설계를 위해 피, 땀, 눈물을 쏟았습니다. 로마코의 생각이 옳은지 봅시다."
 AUS_focus_kaiser_max_class_ironclads: "카이저 막스급 철갑함"
 AUS_focus_kaiser_max_class_ironclads_desc: "요제프 폰 로마코 설계 국장은 다시 한번 정부에 다음을 희망하며 설계를 보냈습니다. 이 새로운 카이저 막스급 철갑함은 이전 드라헤급을 계승하여 더 나은 배터리, 더 나은 엔진, 더 많은 화력, 그리고 더 강력한 화력을 포함할 것입니다. 의회는 승인했고, 함선 생산이 시작되었습니다."
 AUS_focus_erzherzog_ferdinand_max_class_ironclads: "에르츠헤르초크 페르디난트 막스급 철갑함"
 AUS_focus_erzherzog_ferdinand_max_class_ironclads_desc: "새로운 에르츠헤르초크급은 해상에서 그 능력과 강도를 증명했으며, 강력한 대포와 두꺼운 장갑으로 오스트리아 해군의 다음 함급으로 결정되었습니다. 해당 함급의 첫 함선인 에르츠헤르초크 페르디난트 막스는 생산이 시작되었으며 1865년에 배치될 예정입니다. 이 중함선들은 아드리아해를 지배하고 모든 이탈리아 저항을 분쇄할 것입니다."
 AUS_naval_reform_effect_tt: "§CThis will modify the Naval Reform spirit with the following effects:§!\n"
 
 #Economy
 AUS_focus_austrian_industrialization: "오스트리아 제국의 산업화"
 AUS_focus_austrian_industrialization_desc: "우리 행정부는 시대에 뒤떨어져 현대화되지 못했습니다. 우리의 위신을 회복하고 도시를 현대화하려면 단순히 영국이나 프랑스와 같은 강대국들의 기준에 맞춰 현대화해야 합니다. 이러한 방식으로 우리 왕국의 산업화를 시작할 수 있습니다."
 AUS_focus_privatize_railways: "철도 민영화"
 AUS_focus_privatize_railways_desc: "철도는 지역 농노, 소작농 또는 평민이 소유하는 대신, 금고에 충분한 돈을 가진 소수의 귀족이 소유해야 합니다. 그래야 그들이 철도의 품질을 보장하고 유지하며 심지어 강화할 수 있습니다."
 AUS_focus_privatize_railways_trigger_tt: "§YVienna to Trieste§!를 잇는 §YSüdbahn§!이(가) 완공되었습니다."
 AUS_focus_bohemian_industrialization: "보헤미아 산업화"
 AUS_focus_bohemian_industrialization_desc: "보헤미아 지역은 목재, 석탄, 원철과 같은 많은 천연 자원 덕분에 우리의 가장 근면한 지역 중 하나가 될 큰 잠재력을 가지고 있습니다. 이러한 이유로 새로운 작업장과 시설 건설을 위한 공간을 확보하고 준비해야 합니다."
 AUS_focus_migration_to_prague: "프라하로의 이주"
 AUS_focus_migration_to_prague_desc: "보헤미아의 산업화가 완료됨에 따라 농노와 소작농이 보헤미아에서 기회를 찾고 새로 설립된 작업장에서 일하기 시작하여 보헤미아의 새로운 시대를 여는 계기가 되도록 프라하에서의 생활을 장려해야 합니다."
 AUS_focus_czech_railways: "체코 철도"
 AUS_focus_czech_railways_desc: "우리 제국의 북부 지역에 있는 보헤미아 땅은 항상 광범위한 도로망과 시간이 많이 걸리는 여행용 마차에 의존해 왔습니다. 유일하게 실행 가능한 장거리 철도는 지역 수도 프라하에서 빈까지인데, 그마저도 철도 노선이 정기적으로 고장 납니다. 전체 보헤미아 지역, 특히 하부 실레지아 지역으로 철도 노선을 확장하면 광대한 제국 전역으로 군대와 물품을 신속하게 이동시킬 수 있을 것입니다."
 AUS_focus_czech_railways_trigger_tt: "§YVienna to Prague§!를 잇는 §YNordbahn§!이(가) 완공되었습니다."
 AUS_focus_moravian_manchester: "모라비아 맨체스터"
 AUS_focus_moravian_manchester_desc: "우리 북부 지역의 모라비아는 산업 혁명에서 소외되어 어떤 주요 공장이나 산업도 없었습니다. 그러나 이제 변화가 일어날 것입니다. 새로운 회사들이 직물 산업을 발전시키며 직물 노동자들을 위한 일자리를 창출하여 지역 경제를 성장시켰습니다. 모라비아의 경제적 이점이 증대되었습니다."
 AUS_focus_montanuniversitat_leoben: "레오벤 광산대학교"
 AUS_focus_montanuniversitat_leoben_desc: "슈타이어의 레오벤 시를 중심으로 한 레오벤 대학교는 채광, 야금, 재료학 분야에서 최초이자 최대 규모의 대학교였습니다. 1840년에 설립된 이 대학은 여러 차례 개편과 구조적 변화를 겪었으며, 학교에 대한 투자 증대가 논의되었습니다. 이곳은 오스트리아 최고의 학교 중 하나이므로, 그 수준을 유지하는 것이 최선입니다."
 AUS_focus_styrian_coal: "슈타이어 석탄"
 AUS_focus_styrian_coal_desc: "슈타이어는 제국 전체에서 가장 많은 석탄을 생산하는 지역이며, 오스트리아 본토의 심장부에 있습니다. 따라서 우리는 이 자원을 채굴하는 데 투자하여 우리의 기차와 기관차에 동력을 공급해야 합니다. 석탄은 산업 혁명을 시작한 기계의 톱니바퀴이기 때문입니다."
 AUS_focus_tyrolean_lumber: "티롤 목재"
 AUS_focus_tyrolean_lumber_desc: "석탄만큼 중요하지는 않지만 과소평가해서는 안 될 목재는 티롤 지역에 막대한 양이 매장되어 있습니다. 여기에 투자해야 우리는 더 많은 목재 자원을 얻을 뿐만 아니라 생화학 지식도 크게 향상시키고 연구 노력을 강화하는 데 도움이 될 것입니다."
 AUS_focus_tyrolean_railways: "티롤 철도"
 AUS_focus_tyrolean_railways_desc: "알프스 지역은 우리의 많은 마을들이 있음에도 불구하고 여전히 눈에 띄지 않으며 위험한 지형입니다. 우리의 알프스 광산 회사인 외스터라이히시센 알프스 몬탄게젤샤프트는 알프스 산맥으로 원철과 인력을 운송하기 위해 에르츠베르크반 철도를 제안했습니다. 비싼 가격에 우리의 경제적 능력을 기하급수적으로 향상시킬 수 있을 것입니다." AUS_focus_tyrolean_railways_trigger_1_tt: "The §YNordtiroler Staatsbahn§! from §YKufstein to Innsbruck§! has been completed."
 AUS_focus_tyrolean_railways_trigger_2_tt: "The §YSüdtiroler Staatsbahn§! from §YVerona to Bozen§! has been completed."
 AUS_focus_vienna_urbanization: "빈의 도시화"
 AUS_focus_vienna_urbanization_desc: "제국 전체의 심장부인 빈은 유서 깊고 영광스러운 도시입니다. 그러나 완벽하지는 않습니다. 점점 더 많은 사람들이 제국의 도시에서 세상 속 자신의 자리를 찾기 위해 다양한 지역에서 몰려들고 있으며, 우리는 그들을 실망시킬 수 없습니다. 따라서 우리는 낡고 불필요한 건물들을 철거하여 이 불쌍한 영혼들이 일하고 행복을 찾을 수 있는 더 많은 장소를 건설해야 합니다."
 AUS_focus_vienna_maschinenfabrik: "빈 기계 공장"
 AUS_focus_vienna_maschinenfabrik_desc: "기계 부품은 19세기 내내 더욱 중요해졌으며 앞으로도 계속해서 중요성이 커질 것입니다. 빈 기계 공장(Vienna Maschinenfabrik)은 제국에서 가장 큰 기계 제조업체 중 하나로, 대부분의 새로운 기계에 동력을 공급합니다. 이러한 확장과 더 많은 노력을 통해 우리 제국은 분명 20세기로 도약할 것입니다."
 AUS_focus_steyr_arms: "슈타이어 암스"
 AUS_focus_steyr_arms_desc: "슈타이어 암스(Steyr Arms)는 수십 년 동안 유럽의 저명한 무기 제조업체였으며, 계속해서 성장하는 모습을 보여주었습니다. 요제프 베른들은 아버지의 사망 후 회사를 이어받아 수평 통합을 통해 다른 회사들을 유치하며 회사를 끊임없이 변화시켰습니다. 회사 통계는 총기 제조의 큰 발전을 보여주며, 슈타이어 암스를 유럽 최고의 제조업체 중 하나로 밀어 올렸습니다."
 AUS_focus_danube_regulation_works: "다뉴브 강 정비 사업"
 AUS_focus_danube_regulation_works_desc: "사바 강과 드라바 강부터 위대한 다뉴브 강까지, 우리 제국은 강력한 강으로 가득한 땅에 자리 잡고 있습니다. 이 강들을 올바르게 사용하고 관리한다면 전력 생산에 큰 도움이 될 수 있습니다. 땀, 시간 또는 비용에 관계없이 비싼 프로젝트라도 결국에는 이득을 가져올 것입니다."
 AUS_focus_energy_from_rivers: "강으로부터의 에너지"
 AUS_focus_energy_from_rivers_desc: "우리의 비싼 프로젝트가 결국 성과를 거두었다고 생각하는 바로 그 순간, 우리는 더 많은 제국 주민들에게 전기를 공급할 수 있게 되었을 뿐만 아니라 전자 분야에서 기술적인 돌파구를 마련하여 다른 유럽 강대국들보다 우위를 점할 수 있게 될 것입니다."
 AUS_focus_bank_galicyjski: "방크 갈리치스키"
 AUS_focus_bank_galicyjski_desc: "갈리치아 주는 빈과의 거리 때문에 경제적으로 상당히 분리되어 있었습니다. 무역 및 산업을 위한 갈리치아 은행(Galician Bank for Trade and Industry)이 크라쿠프에 본사를 두고 설립되면서 지역에 긴밀한 유대감을 제공하고 경제적 활력을 불어넣을 것입니다."
 AUS_focus_lukasiewiczs_discoveries: "우카시에비치의 발견"
 AUS_focus_lukasiewiczs_discoveries_desc: "아르메니아 출신의 이그나치 우카시에비치(Ignacy Łukasiewicz)는 화학 분야에서 상당한 명성을 쌓았으며, 획기적인 연구를 수행했습니다. 그의 걸작인 'Manuscript'를 통해 인류가 이전에 알지 못했던 지식을 우리에게 선사했으며, 이는 화학 분야에서 우리의 지식을 증진시키는 데 사용될 것입니다."
 AUS_focus_galician_railways: "갈리치아 철도"
 AUS_focus_galician_railways_desc: "갈리치아는 두 세기 동안 여러 번 주인이 바뀌었고, 그를 둘러싼 갈등 때문에 최신 수준의 철도 시스템을 구축할 충분한 시간을 얻지 못했습니다. 이제 한 번에 영원히 그것을 바꿀 때입니다."
 AUS_focus_galician_railways_trigger_tt: "§YVienna to Lviv§!를 잇는 §YGalizische Carl Ludwig-Bahn§!이(가) 완공되었습니다."
 AUS_focus_galician_oil: "갈리치아의 검은 황금"
 AUS_focus_galician_oil_desc: "서부 갈리치아의 보브르카 시 주변에서 최근 풍부한 유전이 발견되자, 주요 유전 개발을 위한 국제적 투자가 폭발적으로 증가했습니다. 인근 클레차니 마을도 유전 위에 자리 잡고 있습니다. 신중한 고려와 훌륭한 사업 수완을 통해 제국은 유럽에서 가장 부유한 국가 중 하나가 될 수 있을 것입니다."
 AUS_focus_trade_code: "공예 및 무역 규범"
 AUS_focus_trade_code_desc: "산업 혁명의 시기에 농노, 소작농, 평민들은 공장주들에게 학대당하고 쓰레기처럼 취급받고 있습니다. 우리는 그들에게 공예 및 무역 규범을 상기시켜 우리의 근로 기준과 생산 효율성을 모두 높여야 합니다."
 AUS_focus_ganz_works: "간츠 공장"
 AUS_focus_ganz_works_desc: "헝가리 부다페스트의 아브라함 간츠와 그의 전국적인 간츠 공장은 필요한 많은 철강 제품을 생산하며 지난 몇 년간 인기와 기회가 폭발적으로 증가했습니다. 간츠는 선박 건조창, 발전소, 자동차, 철도 선로를 건설해왔습니다. 이전에는 제국의 오스트리아 쪽 절반이 1848년 스캔들로 인해 이 회사의 사용을 기피했지만, 많은 고문들은 제국 전체를 위한 간츠 사업의 지속을 옹호하고 있습니다."
 AUS_focus_support_farkashazy: "파르카샤지 지원"
 AUS_focus_support_farkashazy_desc: "모리츠 피셔 드 파르카샤지(Móric Fischer de Farkasházy)는 그의 뛰어난 장인정신이 다른 누구에게도 뒤지지 않아 우리 제국의 헝가리 쪽 절반에서 항상 떠오르는 이름이었습니다. 많은 사람들이 파르카샤지를 귀족으로 승격시키는 것에 대해 프란츠 요제프 황제와 동의했으며, 그와 군주제 사이의 강력한 연결은 분열된 우리 제국 간의 긴장을 확실히 완화시킬 것입니다. 파르카샤지에게 전하십시오!"
 AUS_focus_hungarian_railways: "헝가리 철도"
 AUS_focus_hungarian_railways_desc: "제국의 헝가리 쪽 절반에서 국유 철도 아이디어가 부상하면서, 페스트와 데브레첸을 연결하는 철도 시스템에 세금이 투입되었습니다. 이는 판노니아 분지로의 이동뿐만 아니라 주요 도시로의 작물 운송에도 큰 도움이 될 것입니다."
 AUS_focus_hungarian_railways_trigger_tt: "§YTheiss-Eisenbahn§! from §YBudapest to Košice via Debrecen§!이(가) 완공되었습니다."
 AUS_focus_hungarian_wheat: "헝가리 밀"
 AUS_focus_hungarian_wheat_desc: "위대한 헝가리 평원은 과거에도 그랬고 지금도 밀이 풍부합니다. 전례 없이 인구가 폭증하고 있으므로, 우리는 인구가 계속 증가하고 잘 먹고 잘 살 수 있도록 이를 개발하고 확장하는 데 투자해야 합니다."
 AUS_focus_new_farming_technologies: "새로운 농업 기술"
 AUS_focus_new_farming_technologies_desc: "19세기 초 나폴레옹과의 끊임없는 전쟁으로 우리 농업 부문은 거의 완전히 방치되었고, 영국으로부터 받은 돈도 전쟁 자금으로 거의 다 사용되었기 때문에 거의 도움이 되지 않았습니다. 그러나 상황이 다시 통제되고 있으니, 더 현대적인 농업 장비와 전반적인 기술에 투자해야 합니다."
 AUS_focus_gold_and_precious_metals: "철과 귀금속"
 AUS_focus_gold_and_precious_metals_desc: "우리 영토의 완전한 동쪽 경계에 있는 이 산악 지방에는 여전히 많은 비밀이 남아있지만, 오늘 우리는 그중 하나를 발견했습니다. 산 아래에 엄청나고 귀중한 양의 석탄이 묻혀 있습니다. 산 아래의 모든 철이 세상의 빛을 볼 수 있도록 우리는 채굴 기술에 투자해야 합니다."

 ###################
 # Austrian Events #
 ###################
 
 ###STARTING EVENTS, GENERAL INFO EVENTS
 #STARTING EVENTS
 austria.1.t: "주 이름: 영어 또는 독일어?"
 austria.1.d: "이 모드는 현재 귀하의 통제하에 있는 주 및 도시의 독일어 이름으로 게임을 플레이할 수 있는 옵션을 제공합니다. 이 기능을 활성화하시겠습니까?"
 austria.1.a: "네, 독일어 이름을 원합니다."
 austria.1.b: "아니요, 영어로 유지해주세요."
 austria.2.t: "[AUS.GetNameDef] - 시작 상황"
 austria.2.d: "최근 우리 제국이 겪어야 했던 어려움에도 불구하고, 위대한 군주 프란츠 요제프 1세 황제의 비할 데 없는 리더십 덕분에 제국은 여전히 시간의 모래바람에 굳건히 맞서고 있습니다. 젊은 황제는 1848년 12월, 숙부 페르디난트 1세가 퇴위하고 그의 아버지가 대륙을 휩쓴 혁명적 사건들 속에서 왕위 계승을 거부하자 18세의 나이로 즉위했습니다. 직후 황제는 헝가리 혁명군에 대항하여 니콜라이 1세 차르의 지지를 확보했고, 빈과 상트페테르부르크 사이에 조약이 체결되어 결국 오스트리아 제국의 지속적인 통합을 보장했습니다. 이 협력은 1850년에 더욱 강화되었는데, 오스트리아는 러시아 제국의 노골적인 지지에 힘입어 프로이센 왕국이 올뮌츠 협정에서 더 통일된 독일 국가를 형성하려는 계획을 포기하도록 강요할 수 있었습니다. 그러나 은혜를 갚아야 할 도덕적 의무는 크림 전쟁을 둘러싼 사건들 이전, 도중, 이후 오스트리아 당국에 의해 반복적으로 무시되었고, 이는 오스트리아-러시아 관계와 오스트리아 외교단의 명성에 심각한 결과를 초래했습니다.\n\n점증하는 국제적 긴장은 국내 상황 또한 악화시킵니다. 제국은 12개가 넘는 다양한 민족 집단들의 고향이며, 이들 모두는 자신들만의 언어, 전통, 관습을 가지고 있고, 각자 빈의 중앙 정부로부터 더 많든 적든 활발하게 자치권을 얻기 위해 경쟁하고 있습니다. 민족주의 선동가들의 활동은 우리 제국의 안정과 통합에 대한 압력을 증가시키고 있습니다.\n\n한때 제국의 확고한 중추였던 황실-왕립 육군은 여전히 어떤 반란도 진압할 준비가 되어 있습니다. 그러나 악화되는 재정 위기는 그 재정 지원이 위태롭다는 것을 의미하며, 황실-왕립 해군 또한 제국 군사 예산의 더 큰 몫을 놓고 경쟁하고 있습니다.\n\n현재의 난관에도 불구하고, 합스부르크 가문은 모든 적들을 물리치고 다시 한번 대륙에 대한 헤게모니를 선언할 것임을 확신하십시오. - Austriæ est imperare orbi universo!"
 austria.2.a: "확실히 도전이 될 것입니다."
 austria.3.t: "오스트리아 제국에 대한 외부 위협"
 austria.3.d: "우리 제국은 프레데릭 대왕부터 나폴레옹 보나파르트에 이르는 인물들과 같은 강력한 적들과 해외의 위협에 맞서 시간의 모래바람을 견뎌왔으며, 이들은 집단적으로 우리 민족들 사이에서 많은 적들을 만들었습니다. 최근에 우리는 헝가리 혁명 와중에 러시아가 우리를 방어하도록 설득했지만, 그 후 크림 전쟁 중에는 그들을 외면해야 했습니다. 이탈리아가 여전히 혼란에 빠져 있으며, 우리에게 반대하는 자들은 우리의 멍에를 벗어던지기 위해 안달하고 있음이 또한 분명합니다. 피에몬테 정부가 그 좋은 예입니다.\n\n많은 외부 위협이 우리를 둘러싸고 있으며 동맹은 체결되기를 기다리고 있습니다. 우리가 승리하는 것이 우리의 임무가 될 것입니다..."
 austria.3.a: "신중하게 나아가야 합니다..."
 austria.4.t: "오스트리아 제국에 대한 내부 위협"
 austria.4.d: "오스트리아 제국은 빈 정부로부터 더 많은 자율권을 얻기 위해 경쟁하는 12개가 넘는 다양한 민족들을 포함하고 있습니다. 이는 중앙 정부에 의해 계속해서 거부되어 온 소망입니다. 특정 개인들의 민족주의 선동은 가장 위험한 내부 위협으로 남아있지만, 유일한 문제는 아닙니다. 일부 우리 장관들과 외교관들은 다가올 갈등에서 최악의 상황을 예상하며 지쳐서 먼 곳을 바라보고 있습니다. 우리 제국이 현대 시대로 나아가려면 이러한 문제들을 단번에 해결해야 할 것입니다."
 austria.4.a: "해결책을 찾아야 합니다..."
 #HABSBURG EVENTS
 austria.21.t: "제위 계승자의 탄생"
 austria.21.d: "두 딸을 낳은 후, 오스트리아 제국은 마침내 남자 후계자를 얻었습니다. 프란츠 요제프 황제와 엘리자베스 황후의 아들인 황태자는 합스부르크 가문의 황제 직계 혈통을 잇게 되었습니다. 그는 빈 근처 라센부르크 성의 황궁에서 태어났으며, 그의 위대한 조상 중 한 명의 이름을 따서 루돌프라고 명명될 것입니다. 오스트리아의 왕위는 한 세대 더 안전해졌습니다."
 austria.21.a: "그의 유명한 조상처럼 루돌프라고 이름 지어질 것입니다."
 austria.22.t: "조피 대공녀의 죽음"
 austria.22.d: "오늘 프란츠 요제프 황제의 첫 아이인 오스트리아의 조피 대공녀가 두 살의 나이로 비극적인 죽음을 맞았습니다. 황제의 어머니의 이름을 딴 그녀는 1855년 3월 5일에 태어났습니다. 황후는 아이들을 양육하기에는 너무 어리다는 판단 때문에, 둘째 아이 출산 직후 딸들을 빨리 빼앗겼었습니다.\n\n그러나 헝가리 여행 중, 황제 부부는 딸들을 부다페스트 여행에 데려갔고, 그 동안 두 딸은 급성 설사와 고열에 시달렸습니다. 둘째 딸 기젤라는 살아남았지만, 조피는 살아남지 못하고 어머니의 품에서 죽었습니다."
 austria.22.a: "정말 끔찍한 손실입니다..."
 austria.23.t: "황제와 황후의 헝가리 방문"
 austria.23.d: "오스트리아 황제 프란츠 요제프 칼과 오스트리아 황후 엘리자베스는 빈에서 프레스부르크까지 기차를 탔고, 그곳에서 카이저 프란츠 요제프-오리엔트반 철도 노선을 타고 부다페스트로 향했습니다. 황후는 야외 활동을 즐기고 삶의 모험적인 면에 빠져들기로 유명한데, 이 여행을 "장관"이라고 평가했습니다. 이 위대한 도시에 도착하자마자 그들의 첫 목적지는 몇 년 전에 착공된 성 슈테판 대성당의 건축물에 감탄하는 것이었습니다. 로마 가톨릭에 깊이 헌신하는 황제는 그곳을 방문하고 싶어 했고, 심지어 건축에 사용할 벽돌 하나를 놓는 기회까지 얻었는데, 그는 결코 잊지 못할 광경이라고 맹세했습니다. 다뉴브 강에 도착하자마자, 그들은 개인적으로 부다 성으로 건너갔고, 그곳에서 왕족들은 안내를 받았으며 점심이 제공되었습니다. 요제프 바이스와 칼 노이비르트라는 두 저명한 건축가에 의해 최근에야 개조된 웅장한 건축물이었습니다. 점심 식사와 기차를 타고 돌아온 후, 황제 부부는 이 여행이 즐거웠으며 곧 다시 방문할 예정이라고 결론지었습니다."
 austria.23.a: "헝가리인들이 그들을 잘 대우했기를 바랍니다."
 austria.24.t: "마리 발레리 대공녀의 탄생"
 austria.24.d: "오스트리아의 마리 발레리 공주는 헝가리 왕국의 부다에서 태어났습니다. 황제 부부의 넷째 자녀인 그녀는 곧 황후의 가장 사랑받는 딸이 될 것입니다. 황후가 얼마나 그녀의 어머니에게 푹 빠져 있었는지 때문에, 일부 궁정 신하들은 그녀를 "Die Einzige", 즉 "유일한 아이"라고 부르곤 했습니다. 이는 그녀가 황후가 전적으로 양육할 수 있었던 첫 아이였기 때문이었습니다.\n\n그녀는 또한 "헝가리 아이"라는 별명을 얻었는데, 이는 그녀의 탄생이 제국에서 가장 좋아하는 지역과의 관계 개선을 원했던 엘리자베스 황후와 황제 사이의 양보로 이루어진 것이었기 때문입니다. 그녀는 프란츠 요제프가 헝가리의 새로운 왕으로서 부다페스트에서 대관식을 치른 지 9개월 후에 태어났습니다."
 austria.24.a: "'헝가리' 아이"
 austria.24.b: "유일한 아이"
 
 ###RAILWAY EVENTS
 austria.51.t: "빈-뮌헨 철도 노선 - 계획 완료"
 austria.51.d: "1850년대 초부터 오스트리아 수도 빈과 뮌헨을 철도로 연결하려는 계획이 있었습니다. 초기 실패 후, 바이에른 출신인 우리의 사랑하는 엘리자베스 황후의 큰 기쁨 속에 이 계획은 최근 다시 활성화되었습니다. 철도 노선 계획이 이제 완료되었습니다. 빈에서 서쪽으로 린츠까지 이어지고, 거기서부터 남서쪽으로 잘츠부르크까지 계속되어 국경 뒤에서 바이에른에서 오는 노선과 만나게 될 것입니다. 이 노선은 약 3년 후에 운행될 예정입니다. 우리가 이 계획을 지원하기로 결정한다면, 새로운 철도 노선은 우리의 경제와 바이에른 사람들과의 상호 이해에 확실히 도움이 될 것입니다."
 austria.51.a: "좋은 생각입니다."
 austria.51.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.52.t: "빈-트리에스테 철도 노선 운행 개시"
 austria.52.d: "오늘 [AUS.GetName]에게는 매우 뜻깊은 날입니다. 빈과 제국의 주요 해군 항구인 트리에스테를 잇는 철도 노선, 흔히 쉬트반(Südbahn)으로 알려진 노선이 마침내 완공되었습니다. 젬머링 고개, 류블랴나 동쪽의 늪지대, 카르스트 고원이라는 주요 기술적 난관을 성공적으로 극복한 후, 이 노선은 이제 운행 중이며 우리의 주요 항구와 수도 사이의 물류와 인력 이동에 크게 기여할 것입니다."
 austria.52.a: "그렇다면 기차를 탑시다!"
 austria.52.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.53.t: "빈-린츠 구간 운행 개시"
 austria.53.d: "빈과 뮌헨을 잇는 철도 노선 건설 노력의 일환으로, 빈과 린츠 사이의 첫 번째 구간이 운행을 시작했습니다."
 austria.53.a: "잘 다녀오세요!"
 austria.53.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.54.t: "린츠-람바흐 및 프랑켄마르크트 구간 운행 개시"
 austria.54.d: "빈과 뮌헨을 잇는 철도 노선 건설 노력의 일환으로, 린츠와 람바흐 사이, 그리고 프랑켄마르크트 구간이 운행을 시작했습니다."
 austria.54.a: "잘 다녀오세요!"
 austria.54.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.55.t: "프랑켄마르크트-잘츠부르크 구간 운행 개시"
 austria.55.d: "빈과 뮌헨을 잇는 철도 노선 건설 노력의 일환으로, 프랑켄마르크트와 잘츠부르크 사이의 마지막 구간이 운행을 시작했습니다. 이제 빈에서 뮌헨까지 변경이나 중단 없이 운행할 수 있습니다. 프란츠 요제프 황제와 엘리자베스 황후, 그리고 그녀의 친척인 바이에른 국왕 막시밀리안 2세가 참석하는 개통식이 며칠 안에 거행될 예정입니다.\n\n투자자들은 또한 린츠에서 남서쪽으로 몇 킬로미터 떨어진 벨스에서 바이에른 국경을 넘어 북쪽으로 파사우까지 지선 철도를 건설할 것을 제안했습니다. 이 노선에 대한 계획은 이미 완료되었으며, 그들은 우리가 이 프로젝트에 대한 지원을 계속할 것인지 알고 싶어 합니다. 모든 것이 계획대로 진행된다면, 건설은 1년 조금 넘게 걸릴 것입니다.\n\n또한 코시체(카샤우) 연결선과 크라쿠프(크라카우)에서 르비프(렘베르그)로 이어지는 노선과 같이 우리의 재정적 지원이 필요한 미완성 철도 프로젝트들도 있습니다. 어떻게 응답해야 할까요?"
 austria.55.a: "다른 노선들도 건설합시다."
 austria.55.b: "다른 노선은 필요 없습니다. 현재 있는 것으로 충분합니다."
 austria.56.t: "빈-뮌헨 철도 노선 - 개통식"
 austria.56.d: "10년 이상의 우여곡절 끝에 제국의 수도 빈과 남독일 최대 도시 뮌헨을 잇는 철도 연결선이 마침내 대중 운행을 시작했습니다. 양국 군주들은 이 위대한 행사를 기념하고 상호 관계를 심화시키기 위해 함께 모였습니다. 축제는 며칠 동안 지속될 것이며, 빈의 아름다운 아우가르텐에서 황제가 주최할 예정입니다."
 austria.56.a: "기뻐하십시오!"
 austria.57.t: "벨스-파사우 지선 운행 개시"
 austria.57.d: "벨스에서 파사우까지의 지선 건설이 약 13개월 만에 놀랍도록 빠르게 완료되었습니다. 이로 인해 빈에서 북부 바이에른까지의 이동 시간이 획기적으로 단축되었습니다.\n\n크라쿠프(크라카우)와 르비프(렘베르그) 사이의 노선은 여전히 건설 중이며, 우리는 이 프로젝트에 대한 재정 지원을 계속할지 결정해야 합니다."
 austria.57.a: "계속 지원합시다."
 austria.57.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.58.t: "쿠프슈타인-인스브루크 노선 운행 개시"
 austria.58.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 바이에른 국경의 쿠프슈타인에서 인스브루크까지의 철도 노선이 완공되었습니다. 이것은 티롤의 첫 번째 철도 노선이며, 바이에른의 로젠하임 노선 및 더 나아가 북쪽의 뮌헨 노선과 이 지역을 연결하여 이 지역의 산업과 관광을 확실히 촉진할 것입니다."
 austria.58.a: "잘 다녀오세요!"
 austria.58.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.59.t: "부다페스트-데브레첸 노선 운행 개시"
 austria.59.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 부다페스트에서 데브레첸(Debrezin)까지의 철도 노선이 완공되었습니다. 이 시점에서 우리가 프로젝트에 대한 지원을 계속한다면, 미슈콜츠(Mischkolz)를 경유하여 코시체(Kaschau)로 연결되는 노선이 다음으로 건설될 것입니다."
 austria.59.a: "잘 다녀오세요!"
 austria.59.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.60.t: "데브레첸-미슈콜츠 노선 운행 개시"
 austria.60.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 데브레첸(Debrezin)에서 미슈콜츠(Mischkolz)까지의 철도 노선이 완공되었습니다. 이 시점에서 우리가 프로젝트에 대한 지원을 계속한다면, 코시체(Kaschau)로 연결되는 노선이 다음으로 건설될 것입니다."
 austria.60.a: "잘 다녀오세요!"
 austria.60.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.61.t: "미슈콜츠-코시체 노선 운행 개시"
 austria.61.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 미슈콜츠(Mischkolz)에서 코시체(Kaschau)까지의 철도 노선이 완공되었습니다."
 austria.61.a: "잘 다녀오세요!"
 austria.61.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.62.t: "솔노크-아라드 노선 운행 개시"
 austria.62.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 솔노크(Sollnock)에서 아라드까지의 철도 노선이 완공되었습니다."
 austria.62.a: "잘 다녀오세요!"
 austria.62.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.63.t: "오라데아 지선 철도 운행 개시"
 austria.63.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 솔노크(Sollnock)와 데브레첸(Debrezin) 사이의 본선에서 오라데아(Großwardein) 시까지의 지선 철도가 완공되었습니다."
 austria.63.a: "잘 다녀오세요!"
 austria.63.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.64.t: "세게드-테메슈바르 노선 운행 개시"
 austria.64.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 세게드(Szegedin)에서 테메슈바르(Temeschburg)까지의 철도 노선이 완공되었습니다."
 austria.64.a: "잘 다녀오세요!"
 austria.64.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.65.t: "세게드 철도교 완공"
 austria.65.d: "티서(Theiß) 강을 가로지르는 세게드(Szegedin) 철도교가 완공되었습니다. 이는 유럽에서 가장 현대적인 교량 중 하나이며, 오스트리아 제국 헝가리 지역에서는 최초이자 최대 규모입니다. 프랑스 회사인 Société de Construction des Batignolles가 건설을 담당했으며, 약 1년 반 만에 완공되었습니다."
 austria.65.a: "훌륭한 성과입니다!"
 austria.66.t: "테메슈바르-야세노보 노선 운행 개시"
 austria.66.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 테메슈바르(Temeschburg)에서 세르비아 국경과 가까운 야세노보까지의 철도 노선이 완공되었습니다."
 austria.66.a: "잘 다녀오세요!"
 austria.66.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.67.t: "타르노프-프셰미실 노선 운행 개시"
 austria.67.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 타르노프(Tarnow)에서 프셰미실(Premissel)까지의 철도 노선이 완공되었습니다. 우리가 프로젝트에 대한 지원을 계속하기로 결정한다면, 르비프(Lemberg)로 향하는 선로는 향후 12개월 동안 건설될 예정입니다."
 austria.67.a: "잘 다녀오세요!"
 austria.67.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.68.t: "프셰미실-르비프 노선 운행 개시"
 austria.68.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 프셰미실(Premissel)에서 르비프(Lemberg)까지의 철도 노선이 완공되었습니다. 자그레브(Agram)를 우리의 철도망에 연결하는 노선은 여전히 건설 중이며, 철도 프로젝트 지원을 계속하기로 결정한다면 1년도 채 안 되어 완료될 것입니다."
 austria.68.a: "잘 다녀오세요!"
 austria.68.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.69.t: "베로나-트렌토 노선 운행 개시"
 austria.69.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 베로나에서 트렌토(Trient)까지의 철도 노선이 완공되었습니다. 철도 프로젝트 지원을 계속하기로 결정한다면, 이 노선은 곧 보첸으로 이어질 것입니다."
 austria.69.a: "잘 다녀오세요!"
 austria.69.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.70.t: "트렌토-보첸 노선 운행 개시"
 austria.70.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 트렌토(Trient)에서 보첸까지의 철도 노선이 완공되었습니다. 인스브루크와의 연결은 현재 기술적으로 너무 어렵고 비용이 많이 듭니다. 아마도 미래에는 달라질 수도 있을 것입니다. 하지만 철도 프로젝트 지원을 계속하기로 결정한다면, 다른 프로젝트들은 여전히 진행 중입니다."
 austria.70.a: "잘 다녀오세요!"
 austria.70.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.71.t: "우디네-트리에스테 노선 운행 개시"
 austria.71.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 우디네에서 트리에스테(Triest)까지의 철도 노선이 완공되었습니다. 이로써 트리에스테(Triest)를 빈(Wien)과 연결하는 쉬트반(Südbahn)과의 연결도 완료되었습니다. 이제 빈(Wien)에서 베네치아(Venezia)까지 기차로 하루도 안 되어 여행하는 것이 가능합니다. 다른 철도 프로젝트들은 여전히 진행 중입니다."
 austria.71.a: "잘 다녀오세요!"
 austria.71.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.72.t: "카이저 프란츠 요제프-오리엔트반 첫 구간 운행 개시"
 austria.72.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 카이저 프란츠 요제프-오리엔트반의 첫 번째 구간이 완공되어, 쇼프론(Ödenburg)과 마리보르(Marburg) 근처의 쉬트반(Südbahn) 노선을 작은 헝가리 도시 카니샤(Kanischa)에 연결했습니다.\n\n또한 다뉴브 강 남쪽 제방의 우이-쇠니(Neu-Szöny)에서 부다페스트 남서쪽 셰케슈페헤르바르(Stuhlweißenburg)까지 노선이 건설되었습니다.\n\n철도 프로젝트 지원을 계속하기로 결정한다면, 이 노선들을 부다페스트와 연결하기 위한 추가 건설이 계획되어 있습니다."
 austria.72.a: "잘 다녀오세요!"
 austria.72.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.73.t: "카이저 프란츠 요제프-오리엔트반 부다페스트 노선 운행 개시"
 austria.73.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 카이저 프란츠 요제프-오리엔트반은 카니샤(Kanischa)에서 셰케슈페헤르바르(Stuhlweißenburg)를 경유하여 부다페스트까지 완공되었습니다. 철도 프로젝트 지원을 계속하기로 결정한다면, 다른 철도 노선들은 여전히 건설 중이며 곧 완료될 예정입니다."
 austria.73.a: "잘 다녀오세요!"
 austria.73.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.74.t: "뵈미셰 베스트반 - 필젠-바이에른 국경 구간 운행 개시"
 austria.74.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 플젠(Pilsen)을 바이에른 국경에 연결하는 뵈미셰 베스트반의 첫 번째 구간이 완공되었습니다. 철도 프로젝트 지원을 계속하기로 결정한다면, 다른 철도 노선들은 여전히 건설 중이며 곧 완료될 예정입니다."
 austria.74.a: "잘 다녀오세요!"
 austria.74.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.75.t: "뵈미셰 베스트반 - 필젠-프라하 구간 운행 개시"
 austria.75.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 플젠(Pilsen)을 프라하(Prag)에 연결하는 뵈미셰 베스트반의 마지막 구간이 완공되었습니다. 철도 프로젝트 지원을 계속하기로 결정한다면, 다른 철도 노선들은 여전히 건설 중이며 곧 완료될 예정입니다."
 austria.75.a: "잘 다녀오세요!"
 austria.75.b: "철도 프로젝트에 대한 우리의 지원을 중단하십시오."
 austria.76.t: "크로아티아 자그레브 철도 노선 운행 개시"
 austria.76.d: "국가와 투자자들 간에 합의된 철도 양보의 일환으로, 자그레브(Agram)로 이어지는 철도 노선과 더 나아가 보스니아 국경까지의 노선이 완공되었습니다. 이로써 현재 진행 중인 공공 및 준공공 철도 개발 계획이 마무리되었습니다."
 austria.76.a: "잘 다녀오세요!"
 
 ###DIPLOMACY AND GEC EVENTS
 #CRIMEAN WAR AFTERMATH EVENTS
 austria.101.t: "크림 전쟁의 여파"
 austria.101.d: "러시아와 영국, 프랑스, 사르데냐-피에몬테 연합군의 충돌은 오스만 제국에 대한 러시아의 성공적인 침공을 막으려는 노력에서 비롯되었습니다. 러시아는 그 여파로 해군이 마비되고, 민간인들이 추가 충돌을 두려워하며, 정부가 위기에 처하는 등 굴욕과 상실감을 겪었습니다. 돌이켜보면, 이 위기에서 우리의 개입은 전반적으로 불운했습니다. 아무런 유의미한 이득도 없이, 우리는 3월 혁명 동안 우리를 지지했던 러시아를 소외시켰습니다. 호의를 되갚겠다는 우리의 약속과 도덕적 의무에도 불구하고 말입니다. 우리는 이제부터 어떻게 진행해야 할지 결정해야 할 것입니다."
 austria.101.a: "과거 우리의 행동이 우리를 괴롭히러 돌아오지 않기를 바랍니다."
 austria.102.t: "오스트리아, 지중해 협력 제안"
 austria.102.d: "오스트리아 제국이 지중해에서 정치적 협력 동맹을 구축하고자 하는 희망을 품고 우리 정부의 문을 두드렸습니다. 이 협정은 그들의 아드리아해 연안 항구에서의 자유로운 무역과 해군 접안을 허용할 것이므로 우리에게 유익할 수 있습니다. 서신은 좋은 의도로 작성되었으며, 우리가 이에 동의하기를 바라고 있습니다. 우리는..."
 austria.102.a: "제안을 수락합니다."
 austria.102.b: "제안을 거부합니다."
 austria.103.t: "[FROM.GetNameDef], 지중해에서의 우리의 협력 제안을 수락"
 austria.103.d: "훌륭합니다! 우리의 노력은 헛되지 않았고, 우리는 성공적으로 [FROM.GetName]과(와) 접촉하여 지중해에서의 협력 조약을 맺었습니다. 우리 외교관들은 이러한 협력의 기반을 마련하는 선행의 서신들을 흔들며 돌아왔습니다. 우리는 혼자 서 있지 않을 것이며 미래에 상호 이익을 위해 협력할 것입니다. 우리의 새로운 파트너들을 위해 건배!"
 austria.103.a: "좋습니다."
 austria.104.t: "[FROM.GetNameDef], 지중해에서의 우리의 협력 제안을 거부"
 austria.104.d: "젠장! 우리의 노력은 헛되었고, [FROM.GetName]의 외교관들은 지중해에서의 협력 요청을 거부했습니다. 우리는 우리의 대의를 도울 동료 없이 혼자 서 있습니다. 우리는 좋은 의도만으로 다가갔지만 그들은 우리를 멀리했습니다... 우리는 이 무례함을 분명히 기억할 것입니다."
 austria.104.a: "아쉽습니다."
 austria.105.t: "지중해 협력 성공"
 austria.105.d: "외국에 파견했던 우리 외교관들의 활동은 전반적으로 성공이라는 결과를 가져왔습니다. 지중해에서 다른 강대국들과의 협력은 우리의 위신을 높이고 우리의 상황을 더 좋게 개선할 것입니다. 축배를 들 만한 동맹입니다."
 austria.105.a: "반가운 소식입니다."
 austria.106.t: "지중해 협력 실패"
 austria.106.d: "외국에 파견했던 우리 외교관들의 활동은 전반적으로 실패라는 결과를 가져왔습니다. 이는 지중해에서의 협력을 거부한 국가들과의 관계에 오점을 남겼습니다. 계획은 모두 헛수고였고, 이 대의에 자금을 대는 데 시간과 돈이 낭비되었습니다. 우리는 홀로 설 것입니다."
 austria.106.a: "안타깝습니다."
 austria.107.t: "오스트리아의 외교적 노력은 진실한가?"
 austria.107.d: "지난 몇 주 동안 오스트리아 제국은 대외 정치적 의제를 과장하여, 끊임없이 형성되는 동맹에 뒤처지거나 무지하지 않기 위해 다른 유럽 강대국들과의 위신과 관계를 높이려고 노력했습니다. 상트페테르부르크의 우리 정부는 그들이 설득하려는 많은 나라 중 하나입니다. 그들은 외교 관계 개선, 우리 민족 간의 긴밀한 유대, 그리고 과거의 실수와 위협적인 갈등을 속죄하는 것에 대해 자랑하고 있습니다. 특히 그들은 영국과 프랑스와의 힘든 크림 전쟁 중 우리의 뒷거래 실책을 강조했습니다. 우리 자문관들은 어리둥절하여 그들의 의도를 확신하지 못하고 있습니다..."
 austria.107.a: "그들을 믿을 수 없습니다."
 austria.107.b: "우리는 그들을 용서해야 합니다."
 austria.108.t: "오스트리아의 외교적 노력은 진실한가?"
 austria.108.d: "지난 몇 주 동안 오스트리아 제국은 대외 정치적 의제를 과장하여, 끊임없이 형성되는 동맹에 뒤처지거나 무지하지 않기 위해 다른 유럽 강대국들과의 위신과 관계를 높이려고 노력했습니다. 런던의 우리 정부는 그들이 설득하려는 많은 나라 중 하나입니다. 그들은 외교 관계 개선, 우리 민족 간의 긴밀한 유대, 그리고 과거의 실수와 위협적인 갈등을 속죄하는 것에 대해 자랑하고 있습니다. 특히 그들은 러시아와의 분쟁에서 도움을 거부했던 것과 과거 우리에게 취했던 다른 조치들에 대해 사과했습니다. 우리 자문관들은 어리둥절하여 그들의 의도를 확신하지 못하고 있습니다..."
 austria.108.a: "일단 신중하게 대처합시다."
 austria.108.b: "진심인 것 같습니다."
 austria.109.t: "외교적 노력 성공!"
 austria.109.d: "훌륭합니다! 우리의 외교 고문들과 그들의 팀은 지금까지 오스트리아 제국의 가장 위대한 외교적 성공 중 하나로서 자신들의 탐험으로부터의 위대한 귀환을 알리며 빈으로 돌아왔습니다! 런던과 상트페테르부르크의 중앙 정부는 우리의 개정 요청을 겸손하게 받아들였고, 이 번성하는 순간을 위대한 우리 국가들 사이에서 계속하기 위해 자신들의 대표단을 빈으로 파견했습니다. 다가오는 갈등에서 적들에 맞서 필요한 지원을 요청할 수 있으니, 이 관계를 굳건히 유지할 수 있기를 바랍니다..."
 austria.109.a: "우리 외교단에 삼 세 번 환호를!"
 #GENERAL DIPLOMACY EVENTS
 austria.121.t: "프란츠 요제프 1세 황제와 알렉산드르 2세 차르의 바이마르 회담"
 austria.121.d: "크림 전쟁과 그 여파에서 양국이 겪었던 분쟁 이후, 오스트리아와 러시아 간의 외교 관계는 경색되어 있습니다. 오늘, 오스트리아 황제 프란츠 요제프 1세와 러시아 차르 알렉산드르 2세는 괴테와 실러의 고향이자 독일 고전의 발상지인 튀링겐 지방의 독일 도시 바이마르에서 다시 한번 양국을 가깝게 만들기 위해 회담을 가집니다."
 austria.121.a: "화해의 반가운 신호가 될까요?"
 
 ###ITALY EVENTS
 #ITALIAN UNREST EVENTS
 austria.201.t: "숨겨진 이벤트: 롬바르디아-베네치아의 문제?"
 austria.202.t: "이탈리아의 소요"
 austria.202.d: "리소르지멘토 운동에 의해 고조된 이탈리아 민족주의 정서는 북부 이탈리아에서 우리의 정당한 통치에 대한 또 다른 폭력 행위로 이어졌습니다."
 austria.202.a: "우리는 이 문제를 해결해야 합니다..."
 AUS_uproar_in_italy_infrastructure_effect_tt: "그들이 우리 군사 §Yinfrastructure§!!를 공격했습니다!"
 AUS_uproar_in_italy_naval_base_effect_tt: "그들이 베네치아의 §Ynaval port§!를 공격했습니다!"
 AUS_uproar_in_italy_civilian_industry_effect_tt: "그들이 우리 §Ycivilian industrial capacities§!!를 공격했습니다!"
 AUS_uproar_in_italy_equipment_effect_tt: "그들이 우리 무기고 중 한 곳에서 §Ymilitary equipment§!를 강탈했습니다!"
 AUS_uproar_in_italy_military_industry_effect_tt: "그들이 우리 §Ymilitary industrial capacities§!!를 공격했습니다!"
 austria.203.t: "이탈리아의 난제"
 austria.203.d: "이탈리아의 난제는 이탈리아 내 우리 영토의 정치적, 군사적 여파에 관한 것입니다. 외부의 지지를 기대할 수 없는 민족주의적이고 불안정한 헝가리인, 크로아티아인, 보헤미아인 및 우리 제국의 다른 민족들에 대한 투쟁과 달리, 이탈리아 상황은 이러한 면에서 특별합니다. 우리는 이탈리아 반도의 일부만을 통제하고 있으며, 독립적인 강대국들—특히 크림 전쟁 이후 국제적 위상을 크게 높이고 지도자들과 정부가 이탈리아 민족주의의 고조되는 감정을 지지하는 [PIE.GetName]—의 존재는 더욱 중대한 위협을 야기합니다. 1848/49년 혁명 기간 중 밀라노와 베네치아에서 일어난 봉기는 이탈리아 반도 전역의 이탈리아 민족주의자들의 활동에 대해 매우 경계해야 한다는 증거입니다."
 austria.203.a: "신중하게 행동하는 것이 현명할 것입니다."
 austria.204.t: "이탈리아 내 우리 백성들, 자유화 약속 이행 요구"
 austria.204.d: "1857년 2월, 프란츠 요제프 황제가 이탈리아 인구들 사이에서 불만을 조장하고 있던 노령의 군인 요제프 라데츠키 폰 라데츠를 즉시 교체하기로 결정하면서 롬바르디아-베네치아 왕국의 총독으로 임명된 막시밀리안 대공의 자유주의적 이상 때문에 이 문제가 우리 앞에 불거졌습니다. 막시밀리안은 오스트리아의 통제하에 있는 이탈리아 민족들의 상황을 개선하기 위한 자유주의 개혁을 약속했고, 이제 이것이 우리에게 다가왔습니다: 이탈리아인들은 그들의 약속 이행을 요구합니다."
 austria.204.a: "우리는 우리의 약속에 따라 행동해야 합니다."
 austria.205.t: "사르데냐 병력 이동"
 austria.205.d: "§b[PIE.GetNameWithFlag]§!가 §O[LVN.GetNameWithFlag]§! 국경에서 병력을 이동했다는 보고가 있습니다. 이는 그들이 이탈리아 반도 내 우리의 영토를 점령하기 위한 작전을 준비하는 것으로 보이므로 §b[PIE.GetNameWithFlag]§!와(과)의 평화를 위협합니다. 우리는 그들에게 동원 해제를 요구해야 하며, 그렇지 않으면 우리와, 그리고 아마도 더 넓은 독일 연방으로부터 심각한 적대 행위에 직면할 것입니다."
 austria.205.a: "그들에게 선전포고를 보냅니다."
 austria.206.t: "사르데냐, 물러서지 않음"
 austria.206.d: "§b[PIE.GetNameWithFlag]§!가 동원 해제를 거부할 경우 심각한 보복이 따를 것이라는 우리의 명확한 경고에도 불구하고, 그들은 국경에서 자신들의 입장을 고수했습니다. 매일매일 이대로라면 이탈리아에서의 전쟁이 불가피하다는 것이 더욱 분명해지고 있습니다."
 austria.206.a: "나쁜 결정입니다."
 austria.207.t: "앞으로 나아갈 길은 하나뿐"
 austria.207.d: "§b[PIE.GetNameWithFlag]§!가(이) 동원 해제를 거부한 후 남은 선택지는 하나뿐입니다. 그들은 우리의 모든 경고를 무시했으며, 그들과 전쟁을 하는 것이 이 지역에 대한 우리의 지분을 명확히 하는 유일한 방법입니다."
 austria.207.a: "전쟁을!"
 austria.208.t: "독일 연방 소집"
 austria.208.d: "§b[PIE.GetNameWithFlag]§!의 우리에 대한 침략 이후, 우리는 이제 그들과 전쟁 중입니다. 이 갈등이 우리에게 잘 풀릴 수도 있지만, 우리에게 가장 좋은 것은 독일 연방의 다른 회원국들에게 도움을 요청하는 것입니다. 지금 당장은 모든 이가 필요하지 않으므로, 현재로서는 §2[PRS.GetNameWithFlag]§!만을 특별히 소집할 것입니다."
 austria.208.a: "라인 강을 사수하도록 노력하십시오."
 austria.209.t: "빌라프란카 휴전"
 austria.209.d: "밀라노 상실은 전쟁 노력에 파괴적이었습니다. 우리가 요새 도시 만투아를 방어하는 데 기댈 수 있을지는 몰라도, §3[FRA.GetNameWithFlag]§!은(는) 휴전과 평화 제안을 했습니다. 지금 이를 받아들인다면, 이는 더 동쪽의 영토를 확보하고 지역에서 더 이상의 손실을 피하는 데 도움이 될 것입니다."
 austria.209.a: "더 이상 싸울 여력이 없습니다."
 austria.209.b: "이게 무슨 말도 안 되는 소리야?"
 
 ###NATIONALIST THREAT EVENTS
 #NATIONALIST AGITATION EVENTS
 austria.301.t: "다민족 제국의 도전"
 austria.301.d: "이 제국은 서로 다른 상충하는 수많은 민족들로 구성되어 있으며, 이들은 서로 다투고 싸워 우리에 대한 통제력을 약화시키고 본국을 불안정하게 만듭니다. 점점 더 많은 이들이 우리에게 맞서 들고일어나면서 우리가 직면하는 도전은 의심할 여지 없이 증가하고 있습니다. 우리 영토는 민족적으로 분할되어 있을지 모르지만, 여전히 대규모 오스트리아군의 통제하에 있으며, 이 군대는 모든 무장 반란 시도를 진압합니다. 유럽의 다른 강대국들은 우리가 겪는 것과 같은 내부 위협에 직면하지 않지만, 우리가 말썽꾼들을 처리하고 나면 우리는 그들 위에 설 것입니다..."
 austria.301.a: "이 민족주의적 광기에 대한 치료법을 찾아야 합니다!"
 austria.302.t: "1848/49년 혁명의 여파"
 austria.302.d: "1848년과 1849년은 보수적이고 전제적인 집단들 사이에서 가장 불안했던 해로 기억될 것입니다. 오스트리아 영토는 이러한 혁명적 봉기로 특히 심하게 타격을 입었으며, 제국 전역에서 반란이 맹위를 떨쳤고, 심지어 마자르 민족주의자들뿐만 아니라 이탈리아의 리소르지멘토 운동가들에 대항하는 전면적인 전쟁을 유발하기도 했습니다. 이 시기는 장군들과 우리 군대의 은총으로 진압되어 정당한 통치가 회복된 옛 질서의 영원한 생존 투쟁을 기록했습니다. 이 세월은 오래 전 일처럼 보이지만, 그들이 가져온 민족주의적 정서는 여전히 펼쳐지고 있습니다. 우리는 경계해야 합니다..."
 austria.302.a: "혁명적 이상은 여전히 표면 아래에서 끓어오르고 있습니다..."
 austria.303.t: "헝가리 상황"
 austria.303.d: "1848년 3월, 헝가리 혁명가들은 빈 정부에 대항하여 헝가리 왕국(1849년 크로아티아-슬라보니아 왕국으로 통합된 크로아티아 왕국과 슬라보니아 왕국 포함)의 상당한 자치권을 확보하기 위해 봉기했습니다. 코수트 라요시가 이끄는 헝가리 혁명가들은 곧 이른바 4월 법률을 추진하여, 옛 봉건 신분 기반의 의회 시스템을 대체하고, 헝가리 의회에 황실-왕립군의 헝가리 부분에 대한 통제권을 부여하고, 헝가리 왕국에서 징수된 세금에 대한 완전한 통제권을 지방 정부에 넘기는 등 많은 개혁을 도입했습니다. 그러나 새로운 오스트리아 황제 프란츠 요제프 1세는 이를 위헌적으로 철회했고, 이로 인해 많은 헝가리인들은 더 큰 자치와 인정을 위해 오스트리아와의 협력을 지지했던 온건한 버트치아니 정부에 의문을 품게 되었습니다.\n\n일련의 사건들이 폭력과 살인으로 번진 후, 황제는 헝가리 의회의 즉각적인 해산을 명령했고, 이는 사실상 헝가리에 대한 선전포고였습니다. 1849년 봄 일련의 승리 이후, 코수트는 결국 오스트리아 제국으로부터 헝가리의 완전한 자치권을 선포했고, 이는 프란츠 요제프가 러시아 제국의 니콜라이 1세 차르의 지원을 구하도록 이끌었습니다. 러시아 군대의 도움으로 황실군은 다음 몇 달 동안 우위를 점할 수 있었습니다. 1849년 8월에서 10월 사이에 모든 헝가리 군대는 항복했고, 승리한 포병감 줄리우스 폰 하이나우가 헝가리의 황실 총독으로 임명되었습니다. 그는 이어서 헝가리군의 지도자 13명과 전 헝가리 정부 수반인 라요시 버트치아니를 처형했습니다. 그러나 코수트 라요시는 망명하는 데 성공했습니다.\n\n헝가리는 다음 해들 동안 점령국처럼 통치되었고, 그 결과 많은 헝가리인들이 다양한 형태의 수동적 저항으로 반응했습니다. 억압적인 조치들은 서서히 줄어들고 있습니다. 많은 헝가리인들은 법적으로 결코 철회된 적이 없는 1848년 4월 법률의 유효성을 계속 주장하며, 헝가리에 대한 빈 중앙 정부의 지배력을 강화하려는 모든 시도에 저항하고 있습니다."
 austria.303.a: "헝가리인들이 법을 준수하도록 확실히 해야 합니다."
 austria.304.t: "크로아티아 상황"
 austria.304.d: "헝가리가 오스트리아와 동군연합 관계에 들어가기 전부터 헝가리 왕국과 수세기 동안 동군연합 관계에 있었으니, 크로아티아인들이 제대로 복종되었으리라 예상할 수도 있습니다. 그러나 1830년대에 시작되어 독일화와 마자르화가 심화되는 상황에서 크로아티아 민족주의를 기반으로 삼고 옹호했던 일리리아 운동이 증명하듯 그러한 생각은 틀렸습니다. 이 운동은 오늘날까지 크로아티아 민족주의 선동가들에게 영감을 주고 있습니다. 이 운동의 지도자인 류데비트 가이(Ljudevit Gaj)는 또한 크로아티아어를 개혁하고 표준화하여 독특한 크로아티아인으로서의 정체성을 더욱 고취시켰습니다.\n\n1843년 오스트리아 재상 메테르니히(Metternich)에 의해 일리리아 운동의 상징과 그 이름 언급이 금지되었음에도 불구하고, 크로아티아인들의 투쟁은 이제 시작에 불과한 것처럼 보입니다. 다행히도 그들은 헝가리인들처럼 독립을 노골적으로 주장하지는 않습니다. 사실, 1848/49년 혁명 기간 동안 헝가리 민족주의 혁명가들의 행동 이후, 그들은 빈 정부보다는 헝가리인들에게 더 적대적인 태도를 보이는 것 같습니다. 그러나 더 이상의 유혈 사태 없이는 그들을 헝가리 왕국으로부터 분리하려는 어떠한 시도도 거의 불가능할 것입니다.\n\n그럼에도 불구하고 크로아티아 지역에서는 긴장이 고조되고 있으며, 우리는 상황을 더욱 불안정하게 만들 수 있는 어떠한 활동도 경계해야 합니다."
 austria.304.a: "크로아티아인들이 정신을 차리도록 해야 합니다."
 austria.305.t: "숨겨진 이벤트: 제국 내 민족주의적 소요?"
 austria.306.t: "헝가리 내 민족주의적 소요"
 austria.306.d: "헝가리 대학생들이 주요 도시 거리로 나와 페르디난트 1세가 헝가리 왕국의 국왕이 될 것을 요구하고 있습니다. 일부 고위 헝가리 정치인들은 침묵을 지키고 있지만, 이러한 시위는 가장 목소리 높은 헝가리 지도자들의 지지를 받고 있습니다."
 austria.306.a: "상황을 다시 통제해야 합니다."
 austria.307.t: "서슬라브족 영토 내 민족주의적 소요"
 austria.307.d: "보헤미아 및 슬로바키아 시위대들이 오스트리아 왕실에 대항하는 반군주제 운동을 위해 모이기 시작했습니다. 이들이 대중적인 정서를 반영하지도 않고 현재로서는 크게 주목할 만한 위협을 제기하지는 않지만, 신속하게 대처하지 않으면 여전히 문제를 야기할 것입니다."
 austria.307.a: "상황을 다시 통제해야 합니다."
 austria.308.t: "남슬라브족 영토 내 민족주의적 소요"
 austria.308.d: "우리 제국의 남부 영토는 끊임없이 우리를 성가시게 하는 상황을 제공했습니다. 이 불안을 막기 위해 구체적인 협상이 전혀 이루어지지 않았기 때문입니다. 크로아티아인과 달마티아인들은 서로와 중앙 정부 사이에 반복적으로 불안정한 상태에 있으며, 이 복잡한 관계를 중재하기 위해 여러 번 우리의 개입을 강요했습니다. 바라건대 이번에도 다르지 않을 것입니다."
 austria.308.a: "상황을 다시 통제해야 합니다."
 austria.309.t: "폴란드 영토 내 민족주의적 소요"
 austria.309.d: "우리 동부 영토의 폴란드인과 루테니아인들이 1846년 봉기를 모방하기 위해 거리로 나왔습니다. 그들은 전반적인 목표에 있어서는 분열되어 있지만, 그럼에도 불구하고 우리에게 우려스러운 상황을 제시하며, 통제 불능 상태로 번지기 전에 가능한 한 빨리 진압되어야 합니다."
 austria.309.a: "상황을 다시 통제해야 합니다."
