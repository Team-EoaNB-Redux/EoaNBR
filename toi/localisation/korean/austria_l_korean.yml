 AUS_trait_Archduke_Maximilian_Calming_Figure_desc: "모든 역경에도 불구하고, 막시밀리안 대공은 북부 이탈리아 내 우리 영토에서 대중의 압력과 민족주의적 선동을 성공적으로 진정시켰습니다. 이탈리아 민족 협회가 분명 활동을 계속하여 이 지역에서 우리의 종주권에 심각한 위협으로 남겠지만, 대공의 진정시키는 분위기는 앞으로 안정화 효과를 가져올 것입니다."
 
