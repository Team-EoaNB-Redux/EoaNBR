 #Economy
 AUS_idea_railway_concessions: "오스트리아 철도 특혜"
 AUS_idea_railway_concessions_desc: "우리의 산업화 노력의 일환으로, 우리 제국 전역에서 여러 준민간 및 공공 이니셔티브에 의해 철도 프로젝트가 시작되었습니다. 우리는 이미 아래 노선들에 대해 진행 중이며, 총 건설 기간이 1862년까지로 예정된 철도 확장 계획을 지지하고 추진할 수 있습니다. 아니면 이러한 노선들에 대한 지원을 취소하여 우리가 직접 건설해야 할 수도 있습니다.\n\n[AUS.GetFlag] 쉬트반:\n그라츠와 류블랴나(라이바흐)를 경유하는 빈-트리에스테 철도 노선\n[AUS.GetFlag] - [BAV.GetFlag] 베스트반:\n린츠와 잘츠부르크를 경유하는 빈-뮌헨 철도 노선\n[AUS.GetFlag] - [CZE.GetFlag] - [BAV.GetFlag] 뵈미셰 베스트반:\n프라하(프라그)를 플젠(필젠)을 경유하여 바이에른 국경에 연결\n[AUS.GetFlag] - [BAV.GetFlag] 노르트티롤 주립 철도:\n쿠프슈타인을 경유하는 로젠하임-인스브루크 철도 노선\n[AUS.GetFlag] - [LVN.GetFlag] 쥐트티롤 주립 철도:\n트렌토(트리엔트)를 경유하는 보첸-베로나 철도 노선\n[AUS.GetFlag] - [LVN.GetFlag] 우디네-트리에스테 노선:\n밀라노 노선을 쉬트반과 트리에스테에 연결\n[AUS.GetFlag] - [HUN.GetFlag] 티스 철도:\n부다페스트 철도 노선을 데브레첸(데브레진)과 미슈콜츠(미슈콜츠)를 경유하여 아라드와 코시체(카샤우)에 연결\n[AUS.GetFlag] - [SER.GetFlag] 바나트 철도:\n부다페스트를 세게드(세게딘)와 테메슈바르(테메쉬부르그)에 연결하고 더 남쪽으로 세르비아 국경까지 연결\n[AUS.GetFlag] - [GLM.GetFlag] 갈리치아 카를 루트비히 철도:\n크라쿠프(크라카우)를 프셰미실(프레미셀)에 연결하고 더 나아가 르비프(렘베르그)에 연결\n[AUS.GetFlag] - [CRO.GetFlag] 크로아티아 철도:\n빈(빈)을 자그레브(아그람)에 연결하고 더 나아가 보스니아 국경까지 연결"
