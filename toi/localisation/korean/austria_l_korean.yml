 AUS_decision_galician_oil_1: "고를리체 유전 개발"
 AUS_decision_galician_oil_1_desc: "갈리치아 내륙 지역 주민들은 수세기 동안 다양한 목적으로 석유를 사용해 왔습니다. 최근에는 고래 기름 산업의 급격한 쇠퇴와 성장하는 산업 부문에 빛과 동력을 공급하기 위한 새로운 발명품들이 석유를 귀중하고 인기 있는 자원으로 만들었습니다. 다행히도 갈리치아 지역은 산업 장비를 이용하여 유전을 개발할 기회를 제공하며, 이는 틀림없이 석유 생산량을 크게 늘리고 이 외딴 지역에 일자리를 창출할 것입니다."
 AUS_decision_galician_oil_2: "드로호비치 유전 개발"
 AUS_decision_galician_oil_2_desc: "갈리치아 내륙 지역 주민들은 수세기 동안 다양한 목적으로 석유를 사용해 왔습니다. 최근에는 고래 기름 산업의 급격한 쇠퇴와 성장하는 산업 부문에 빛과 동력을 공급하기 위한 새로운 발명품들이 석유를 귀중하고 인기 있는 자원으로 만들었습니다. 다행히도 갈리치아 지역은 산업 장비를 이용하여 유전을 개발할 기회를 제공하며, 이는 틀림없이 석유 생산량을 크게 늘리고 이 외딴 지역에 일자리를 창출할 것입니다."
