 #Domestic Politics
 AUS_decision_category_domestic_politics: "국내 정치"
 AUS_decision_category_domestic_politics_desc: "우리 왕국은 러시아 제국을 제외하고 유럽의 다른 많은 국가들보다 훨씬 넓고 훨씬 다양합니다. 이러한 사실은 우리 통치에 매우 까다로운 여러 가지 도전 과제를 제시합니다. 민족주의의 부상은 우리가 우리의 신민이라고 자랑스럽게 부르는 다양한 민족들의 내부 결속에 상당한 위협이 되며, 선동가들은 제국의 여러 지역에서 반란을 요구하고 있습니다. 비가톨릭 기독교인들 또한 현재 누리는 것보다 더 많은 인정과 자유를 요구하고 있으며, 일부는 자신들의 상황을 무력으로 바꾸기 위해 다양한 민족주의 운동 세력과 합세하기도 했습니다. 우리는 이러한 활동들을 매우 경계해야 합니다. 결국, 우리는 방어적인 입장을 극복하고 우리 자신의 뜻에 따라 행동하여 우리 이미지대로 왕국의 미래를 형성해야 할 것입니다. 하지만, 늘 그렇듯이, 국내 정책은 외부에서 벌어지는 일과도 밀접하게 연관되어 있습니다."
