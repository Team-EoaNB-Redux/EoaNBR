 AUS_decision_railway_upgrade_desc: "우리 철도망은 더 이상 현대 산업을 지원하고 장려하는 역할에 미치지 못합니다. 이를 개선하고 확장하는 것은 이 문제를 해결할 뿐만 아니라, 우리 산업에 중요한 계약과 무역 확장 가능성을 제공할 것입니다."
 
 eoanb_decision_AUS_reform_ita1: "롬바르디아-베네치아의 미래"
 eoanb_decision_AUS_reform_ita1_desc: "롬바르디아-베네치아 왕국은 1815년 빈 회의 이래 우리의 영토였지만, 폭력적인 사건들이 발생했던 곳입니다. 피에몬테에 대한 우리의 승리로 이제 그 미래를 결정할 때가 왔습니다."
 eoanb_decision_AUS_reform_ita2: "중앙 이탈리아 국가들의 미래"
 eoanb_decision_AUS_reform_ita2_desc: "세 개의 중앙 이탈리아 국가, 즉 모데나 공국과 파르마 공국, 토스카나 대공국은 1815년 빈 회의 이래 우리의 영향권에 속해 있었지만, 폭력적인 사건들이 발생했던 곳입니다. 피에몬테에 대한 우리의 승리로 이제 그 미래를 결정할 때가 왔습니다."
 eoanb_decision_AUS_reform_ita3: "사보이와 니스, 프랑스에 양도"
 eoanb_decision_AUS_reform_ita3_desc: "이탈리아와 프랑스 국경에 위치한 사보이와 니스의 영토는 항상 논쟁의 여지가 있는 문제였습니다. 수세기 동안 이탈리아 영토였지만, 1792년 프랑스 인구가 많다는 이유로 프랑스 공화국에 합병되었다가 1815년에 피에몬테로 반환되었습니다. 이제 피에몬테가 우리의 확고한 통제 아래에 있으니, 이들을 프랑스에 양도하는 것을 선택할 수 있습니다."
