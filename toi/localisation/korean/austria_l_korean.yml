 AUS_tt_deal_with_magyars: "선택\n"
 AUS_tt_reform_empire_compromise: "제국 내 하나 이상의 다양한 §Ynationalities§!와(과) 협상을 시작하여 제국을 §GReform§!하십시오.\n\n협상 전과 도중의 §Ychoices§!를 통해 향후 수십 년간 제국의 방향에 §Ginfluence§!를 미칠 수 있을 것입니다."
 AUS_tt_not_reform_empire: "제국에 §Yabsolutism§!의 새 시대를 여십시오.\n\n제국의 정책은 계속해서 §YGerman people and influenced by the Habsburgs§!를 중심으로 할 것이며, 향후 수십 년간 어떠한 반대 의견도 §Yrepress§!하려고 할 것입니다."
