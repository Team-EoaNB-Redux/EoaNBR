 #Navy
 AUS_decision_category_austrian_navy: "Kaiserlich-königliche Kriegsmarine"
 AUS_decision_category_austrian_navy_desc: "향상된 해군 작전을 수행하기 어려운 지리적 위치에도 불구하고, 황실-왕립 해군은 우리 군의 중요한 부분입니다. 최근 이탈리아에서의 문제는 아드리아해에서 해군 기반 시설을 다변화해야 할 뿐만 아니라, 우리 해군의 특성을 근본적으로 재고해야 함을 의미했습니다.\n\n다재다능한 막시밀리안 대공이 이 개혁 과정의 지휘를 맡았지만, 그가 얼마나 성공할지는 아직 지켜봐야 합니다. 그는 감소하는 예산을 놓고 해군과 경쟁하는 육군의 고위 참모들로부터 반대에 직면해 있습니다. 그러나 오스트리아가 지중해에서 중요한 역할을 하기를 원한다면, 상당한 투자가 필요할 것입니다."
 AUS_mission_reform_the_imperial_royal_navy: "황실-왕립 해군 개혁"
 AUS_mission_reform_the_imperial_royal_navy_desc: "우리 제국은 유럽 대륙 전역에 걸쳐 펼쳐져 있습니다. 그러나 해상에서는 아직 우리가 무시할 수 없는 강대국으로 널리 간주되지는 않습니다. 우리가 강대국들 사이에서 우리의 위치를 주장하고 해상 및 육상에서 우리의 이익을 보호하려면, 다른 강대국들을 따라잡고 결국 패권을 놓고 도전하기 위해 해군을 개혁해야 합니다."
 AUS_mission_reform_the_imperial_royal_navy_trigger_tt: "Requires either the technology §YAdmiralty§! from the §YFocus on Light Ships§! branch or the technology §YWar Admiralty§! from the §YFocus on Heavy Ships§! branch of the §YNavy Doctrines§! to be researched."
