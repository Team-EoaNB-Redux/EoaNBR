 #Economy
 AUS_decision_category_habsburg_industry: "오스트리아 제국의 경제"
 AUS_decision_category_habsburg_industry_desc: "18세기부터 시작된 모든 형태의 농노제 점진적 폐지 이후, 오스트리아 제국은 모라비아와 보헤미아의 주요 산업, 광업, 임업 지구가 선두를 달리며 놀라운 경제 성장을 보이기 시작했습니다. 이러한 발전이 가져온 급격한 변화는 대체로 돌이킬 수 없이 국가의 정신을 빠르게 변화시키는 듯했지만, 지배 엘리트들은 자신들의 부와 지위, 그리고 결과적으로 권력을 공유하려 하지 않았고, 이는 부분적으로 1848년 3월 혁명과 뒤이은 승리한 귀족 엘리트의 복고 정책으로 이어졌습니다. 그 결과는 투자와 산업 발전을 계속 억압하는 재정 위기였습니다. 그러나 올바른 조치와 성공적이고 혁신적인 기업가에 대한 지원을 통해 우리는 잠자는 거인을 깨우고 산업 성장을 활성화할 수 있을 것입니다."
 
