 french_senegal_colonial_navy.1: "식민지 함대 수립!"
 french_senegal_colonial_navy.1.t: "식민지 함대 수립!"
 french_senegal_colonial_navy.1.d: "[FRA.GetName]는 서아프리카 함대의 신임 대위 오귀스트 보세(Auguste Bosse)를 이관하기로 결정했습니다.\n\n오귀스트 보세는 1826년 앙굴렘 해군 대학에 입학한 후 알제 원정에 참여했습니다. 그는 1835년부터 1836년까지 지중해 전대에 복무한 후 1836년 중위로 진급했습니다. 중위로서 그는 아르헨티나 분쟁 관련 작전에 참여했습니다. 1847년 오귀스트 보세는 호위함 대위로 진급했으며, 이듬해에는 해군 장관의 부관으로 임명되었습니다.\n\n몇 년 후 1853년에는 세네갈 총독의 참모총장직을 맡으며 대위로 진급했습니다. 그는 발트해 작전에 참여하여 보마르순트 폭격 작전을 목격했습니다. 세네갈로 이관되기 전, 오귀스트 보세는 크림 전쟁에 참전했습니다."
 french_senegal_colonial_navy.1.a: "놀라운 소식입니다! 새로운 대위님을 환영해야 합니다!"
 start_french_senegal_colony_development.1: "세네갈에 대한 프랑스의 투자!"
 start_french_senegal_colony_development.1.t: "세네갈에 대한 프랑스의 투자!"
 start_french_senegal_colony_development.1.d: ""
 start_french_senegal_colony_development.1.a: "자금의 훌륭한 활용입니다!"
 start_french_senegal_colony_development.1.b: "귀찮게 하지 마시오."
 GDC_ASH_diplomacy_event.1.t: "아샨티 조약 검토"
 GDC_ASH_diplomacy_event.1.d: "수십 년 동안 골드 더치 코스트는 아샨티와 좋은 관계를 유지해 왔으며, 심지어 그들에게 항구 접근을 허용했습니다. 아샨티 왕은 아샨티 왕국을 서구화하기 위해 많은 노력을 기울였으며 많은 유럽 사상을 받아들였습니다.\n\n그들은 [ENG.GetName]와 경쟁 관계에 있어 우리에게 완벽한 무역 파트너입니다! 아샨티 왕국이 우리 항구를 이용하여 국제 시장에 접근할 때 우리가 중개인으로서 이익을 얻는 것은 말할 것도 없습니다."
 GDC_ASH_diplomacy_event.1.a: "고귀한 아샨티는 항상 훌륭한 무역 파트너였습니다!"
 GDC_ASH_diplomacy_event.1.b: "어려운 선택이지만, 영국인들이 점령하기 전에 우리가 이 지역을 확보해야 합니다..."
 GDC_ASH_diplomacy_event.2.t: "[FROM.GetName] - [ROOT.GetName] 조약"
 GDC_ASH_diplomacy_event.2.d: "[FROM.GetName]는 우리 조국의 산업화에 큰 도움이 되었으며, 심지어 그들의 항구 사용을 허가했습니다. 이로 인해 [ROOT.GetLeader]는 유럽에서 공부하고 방대한 지식을 가지고 돌아올 수 있었습니다. 비록 그들의 항구에 접근하면 그들이 [FROM.GetAdjective] 항구를 통해 흐르는 우리 상품에 세금을 부과하는 중개인이 될 수 있지만 말이죠. 그럼에도 불구하고, 미래의 번영을 위해 조약을 계속하는 것이 우리의 최선의 이익입니다."
 GDC_ASH_diplomacy_event.2.e: "[FROM.GetName]가 우리 조약을 버렸습니다! 그들은 우리가 [ENG.GetName]에 맞서 스스로를 방어하기에는 너무 약하며 틀림없이 합병될 것이라고 말합니다. 그들은 [ENG.GetAdjective]에게 기회를 주기 전에 우리 땅을 합병할 준비를 하고 있습니다!"
 GDC_ASH_diplomacy_event.2.a: "그들이 제공하는 항구 접근은 매우 중요합니다. 우리는 긍정적인 관계를 유지해야 합니다."
 GDC_ASH_diplomacy_event.2.b: "선택은 어렵지만, 앞으로 그들을 믿을 수 없습니다."
 GDC_ASH_diplomacy_event.2.c: "그들이 우리를 배신했습니다!"
 GDC_ASH_diplomacy_event.3.t: "[FROM.GetName] - [ROOT.GetName] 조약"
 GDC_ASH_diplomacy_event.3.c: "[FROM.GetName]는 조약을 검토하고 변동 없이 계속하기로 결정했습니다. 우리 두 국가 간의 특별한 관계가 결정적으로 서로에게 이익이 된다고 말합니다."
 GDC_ASH_diplomacy_event.3.d: "[FROM.GetName]는 항구 접근 비용이 착취적이라고 말하며, 검토 중인 조약을 포기하기로 결정했습니다. 그들은 또한 우리 식민지가 더 이상 합법적이지 않으며, 그 땅이 정당하게 [ROOT.GetName]의 것이라고 말했습니다!"
 GDC_ASH_diplomacy_event.3.a: "우리는 [FROM.GetName]와 함께할 미래를 기대합니다."
 GDC_ASH_diplomacy_event.3.b: "그들이 우리를 배신했습니다! 그들은 더 이상 항구 접근을 할 수 없을 것입니다!"
 GDC_ASH_diplomacy_continued_tooltip: "§Y[GDC.GetName]§와 §Y[ASH.GetName]§은 §G+25§의 외교 관계 변화를 부여하는 §YTrade Relations§를 얻습니다.\n\n"
 start_usa_liberia_investment_development.1.t: "의회가 라이베리아 투자에 대해 투표합니다!"
 start_usa_liberia_investment_development.1.d: "의회는 [FROM.Capital.GetName]의 인프라, 자원 채굴 및 지역 산업에 막대한 자금을 제공하기로 투표했습니다. 이 투자는 [FROM.GetName]를 아프리카의 빛나는 모범으로 변화시키는 데 큰 도움이 될 것입니다."
 start_usa_liberia_investment_development.1.e: "의회는 [FROM.Capital.GetName]의 인프라 및 자원 채굴 방식에 자금을 제공하기로 투표했습니다. 이 투자는 [FROM.GetName]에 해당 지역에서 자원을 채굴하는 데 필요한 인프라를 제공하는 데 큰 도움이 될 것입니다."
 start_usa_liberia_investment_development.1.f: "의회는 [FROM.Capital.GetName]의 인프라에 대한 제한적인 투자 자금을 제공하기로 투표했습니다. [FROM.GetName] 내에서 더 이상 개발할 추가 자금은 없습니다."
 start_usa_liberia_investment_development.1.a: "민주주의는 정말 대단해!"
 start_usa_liberia_investment_development.1.b: "민주주의는 정말 대단해!"
 start_usa_liberia_investment_development.1.c: "뭐, 그게 바로 민주주의의 작동 방식이죠. 이길 때도 있고 질 때도 있습니다."
 usa_liberia_investment_development.1.t: "[Root.Capital.GetName] 개발에 대한 미국의 지원!"
 usa_liberia_investment_development.1.d: "미국 의회는 [ROOT.Capital.GetName]의 인프라, 자원 채굴 및 지역 산업에 막대한 자금을 제공하기로 투표했습니다. 이 투자는 [ROOT.GetName]를 아프리카의 빛나는 모범으로 변화시키는 데 큰 도움이 될 것입니다."
 usa_liberia_investment_development.1.e: "미국 의회는 [ROOT.Capital.GetName]의 인프라 및 자원 채굴 방식에 자금을 제공하기로 투표했습니다. 이 투자는 [ROOT.GetName]에 해당 지역에서 자원을 채굴하는 데 필요한 인프라를 제공하는 데 큰 도움이 될 것입니다."
