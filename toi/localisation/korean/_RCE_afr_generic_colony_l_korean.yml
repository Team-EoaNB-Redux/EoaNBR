 afr_mandatory_vaccines_everyone_desc: "백신은 신분에 관계없이 모든 사람에게 배포될 것입니다. 원주민들은 이 인도주의적 노력으로부터 큰 이익을 얻을 것입니다. 이 방법은 더 비쌀 수 있지만, 우리는 마침내 말라리아의 재앙이 끝났다고 선언할 수 있습니다!"
 afr_mandatory_vaccines_colonists_desc: "말라리아 백신이 배포되어 우리의 인구 증가는 더 이상 말라리아로 인해 방해받지 않을 것입니다. 우리는 마침내 말라리아의 재앙이 끝났다고 선언할 수 있습니다!"
