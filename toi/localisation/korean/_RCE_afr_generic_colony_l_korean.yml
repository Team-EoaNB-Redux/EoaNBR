 afr_scourge_of_malaria_category: "말라리아의 재앙"
§YBattling Malaria§!:\n말라리아의 재앙은 §Rnegatively§! §Ypopulation growth§!에 영향을 미쳤습니다. 과학 연구, 개혁, 조치 및 의학적 돌파구를 통해 말라리아의 재앙을 극복할 수 있습니다.\n\n§YThe Theories of Malaria§!:\n§gThe inherent localism of health policy in the late nineteenth and early twentieth century allowed for a variety of responses to contemporary scientific research on malaria. Some public health officials of the time initially rejected the new mosquito theory for the transmission of malaria, while others embraced it as a basis for intervention.§!"
