 BAV_decision_category_common_policy: "독일 국가들과의 공동 정책"
 BAV_decision_common_policy_wurttemberg: "뷔르템베르크와의 공동 정책 추진"
 BAV_decision_common_policy_baden: "바덴과의 공동 정책 추진"
 BAV_decision_common_policy_frankfurt: "프랑크푸르트와의 공동 정책 추진"
 BAV_decision_common_policy_hessen: "헤센-다름슈타트와의 공동 정책 추진"
 BAV_decision_common_policy_thuringia: "튀링겐과의 공동 정책 추진"
 BAV_decision_common_policy_saxony: "작센과의 공동 정책 추진"
 BAV_decision_common_policy_hannover: "하노버와의 공동 정책 추진"
 BAV_decision_invite_WUR_BAD_trias: "삼두제 형성"
 BAV_decision_invite_WUR_BAD_trias_desc: "§Y[WUR.GetNameDef]§!과 §Y[BAD.GetNameDef]§! 모두를 삼두제에 공식적으로 초대하여 이를 형성하도록 노력할 것입니다."
 BAV_decision_invite_FRK_trias: "[FRK.GetName]을(를) 삼두제에 초대"
 BAV_decision_invite_HES_trias: "[HES.GetName]을(를) 삼두제에 초대"
 BAV_decision_invite_THU_trias: "[THU.GetName]을(를) 삼두제에 초대"
 BAV_decision_invite_SAX_trias: "[SAX.GetName]을(를) 삼두제에 초대"
 BAV_decision_invite_HAN_trias: "[HAN.GetName]을(를) 삼두제에 초대"
 BAV_decision_category_economy: "바이에른의 경제"
 BAV_mission_industrializing: "산업화"
 BAV_decision_enact_gewerbefreiheit: "영업 자유법 제정"
 BAV_decision_enact_a_proper_gewerbeordnung: "적절한 영업 규정 제정"
 BAV_decision_railway_upgrade: "철도 업그레이드"
 BAV_decision_railway_upgrade_desc: "우리 철도망은 더 이상 현대 산업을 지원하고 장려하는 역할을 제대로 수행하지 못하고 있습니다. 이를 업그레이드하고 확장하는 것은 문제를 해결할 뿐만 아니라, 우리 산업에 중요한 계약을 제공하고 무역 확장의 가능성을 열어줄 것입니다."
 BAV_decision_railway_upgrade_trigger_tt: "§YPassau§!와 §YNuremberg§! 간, 그리고 §YBerchtesgaden§!과 §YMunich§! 간에 §YRailway connection§!이(가) 필요합니다.\n"
 BAV_bavarianagriculture: "바이에른 농업"
 BAV_bavarianagriculture_desc: "바이에른은 주로 농업 사회입니다. 이 점을 명심하고 더욱 발전시켜야 합니다."
 BAV_bavarianindustry: "바이에른 산업"
 BAV_bavarianindustry_desc: "세계의 강대국들이 산업화를 시작하고 있습니다. 그들에게 더 이상 뒤처지지 않기 위해서라도 우리도 산업화를 시작해야 합니다."
 BAV_bavarianarmy_desc: "우리 군대는 엉망이며 현대화가 절실합니다. 강력한 군대는 우리의 국가와 국민을 국경 뒤에서 안전하게 지켜줄 것이며, 동맹 관계의 맥락에서 충분한 행동 범위를 제공할 것입니다."
 BAV_bavariannationalguard: "바이에른 국민위병"
 BAV_bavariannationalguard_desc: "이제 우리나라는 국민위병을 창설할 수 있는 선택지가 생겼습니다. 국민위병은 비상시에 우리에게 충분한 군사 예비 병력을 제공할 것입니다."
 BAV_maximilianii: "막시밀리안 2세"
 BAV_maximilianii_desc: "막시밀리안 2세 국왕은 우리 왕국의 안정을 되찾았습니다. 그는 개인적인 사치보다 국정 문제에 더 많은 관심을 기울이는 위대한 인물입니다. 그의 개혁은 우리에게 큰 이점을 가져다줄 것입니다."
 BAV_nurembergsindustrieundkulturverein: "뉘른베르크 산업문화협회"
 BAV_nurembergsindustrieundkulturverein_desc: "뉘른베르크의 산업문화협회는 농업과 산업을 활성화하기 위해 1827년에 설립되었습니다. 협회의 영향력을 확대하는 것은 우리에게 큰 이점이 될 것입니다."
 BAV_developearlyweaponfactories: "초기 무기 공장 설계"
 BAV_developearlyweaponfactories_desc: "지금부터 무기 공장 설계를 개발하기 시작한다면, 유럽의 강대국들을 따라잡을 수 있을지도 모릅니다. 어떻게든 우리 군대는 신형 무기를 필요로 하고 있습니다."
 BAV_concertofeurope: "유럽 협조 체제"
 BAV_concertofeurope_desc: "빈 체제라고도 알려진 유럽 협조 체제는 주요 보수 강대국들이 채택한 복잡한 분쟁 해결 시스템입니다. 만약 우리가 그 안에서 역할을 하고 싶다면, 지금 행동해야 합니다."
 BAV_middlepower: "중간 강국"
 BAV_middlepower_desc: "바이에른은 강대국이나 초강대국이 될 잠재력이 없었습니다. 대신, 우리는 적당한 영향력과 국제적인 인정을 유지하는 데 집중해야 합니다."
 BAV_triaspolitik: "삼두 정치"
 BAV_triaspolitik_desc: "삼두제는 독일 중소 국가들이 공동 정책을 추진하려는 시도입니다. 다른 중소 국가들과 비교할 때 다소 큰 왕국인 바이에른은 삼두 정치에서 더 큰 역할을 해야 한다고 막시밀리안 2세 국왕이 제안합니다. 이것이 유용할지는 나중에 알게 될 것입니다."
 BAV_heilunsermknigheil: "만세 우리 국왕이여, 만세!"
 BAV_heilunsermknigheil_desc: "막시밀리안 2세는 위대한 국왕이며 백성들은 그를 사랑합니다. 우리 모두가 그렇습니다. 우리의 위대한 국왕과 그의 너그러움을 널리 알립시다."
 BAV_constitutionalmonarchy: "입헌군주제"
 BAV_constitutionalmonarchy_desc: "막시밀리안 2세는 왕위에 오를 때 '나는 입헌군주라 칭하는 것이 자랑스럽습니다'라고 말했습니다. 바이에른은 주권자가 헌법에 따라 행동해야 하는 입헌군주제입니다. 이는 우리와 국왕이 행동을 신중하게 생각하고 어리석은 실수를 저지르지 않도록 해줍니다."
 BAV_bavarianpechkohle: "바이에른 역청탄"
 BAV_bavarianpechkohle_desc: "우리가 지원한다면 오버바이에른의 역청탄 채굴 산업은 더 많은 석탄을 공급할 수 있을 것입니다. 우리는 이것을 우리에게 유리하게 활용할 수 있습니다."
 BAV_extendludwigdonaumainkanal: "도나우-마인 운하 확장"
 BAV_extendludwigdonaumainkanal_desc: "루트비히-도나우-마인 운하는 1846년에 완공되어 도나우강과 마인강을 연결했습니다. 이를 조금 더 확장하면 우리 무역선들이 더 많은 이익을 얻을 수 있습니다."
 BAV_grundentlastung: "부역 폐지"
 BAV_grundentlastung_desc: "부역 폐지(Grundentlastung), 또는 농민 해방(Bauernbefreiung)은 소작인들의 영주에 대한 개인적인 의무를 덜어줍니다. 이를 통해 농민들은 더 중요한 일에 집중할 수 있습니다."
 BAV_berzirksamterlangen: "에를랑겐 구청"
 BAV_berzirksamterlangen_desc: "루트비히-도나우-마인 운하 덕분에 중프랑켄의 도시 에를랑겐은 최근 상당히 빠르게 발전하고 있습니다. 구청을 설립하여 우리가 그 지역에 더 쉽게 영향력을 행사하고 세금을 더 많이 징수하도록 합시다."
 BAV_knivesforthebrgermilitr: "시민군을 위한 칼"
 BAV_knivesforthebrgermilitr_desc: "우리 군대는 현재 유럽 강대국들에 비하면 한심한 수준입니다. 더 많은 공장을 건설하여 군대를 개선하는 것부터 시작해야 합니다."
 BAV_learnfromthefrench: "프랑스인에게 배우다"
 BAV_learnfromthefrench_desc: "나폴레옹 휘하의 프랑스인들은 유럽에서 큰 성공을 거두었습니다. 그들의 전술을 분석하고 이해하려고 노력하면 우리에게 큰 도움이 될 수 있을 것입니다."
 BAV_learnfromtheprussians: "프로이센인에게 배우다"
 BAV_learnfromtheprussians_desc: "인정하고 싶지 않지만, 프로이센은 강합니다. 그들의 군사력은 최신 총기로 무장하여 놀라울 정도입니다. 하지만 우리 총은 믿을 수 없을 정도로 구식입니다. 그들과 같은 총을 갖게 되는 건 어떨까요?"
 BAV_learnfromtheaustrians: "오스트리아인에게 배우다"
 BAV_learnfromtheaustrians_desc: "우리의 이웃인 오스트리아인들은 훌륭한 장군들로 유명합니다. 그들이 우리에게 전쟁에 대한 한두 가지를 가르쳐주도록 설득해야 합니다."
 BAV_givepowertolandtag: "란트타크에 권한 부여"
 BAV_givepowertolandtag_desc: "우리 국왕은 의회를 믿고 란트타크에 발의권을 부여할 것을 제안했습니다. 그렇게 하면 란트타크가 자체적으로 개혁을 통과시켜 우리 어깨의 짐을 덜어줄 수 있을 것입니다."
 BAV_socialdistressoftheworkingclass: "노동 계급의 사회적 고통"
 BAV_socialdistressoftheworkingclass_desc: "최근 바이에른의 노동자들은 힘든 시간을 보내고 있습니다. 막시밀리안 2세는 그들의 사회적 고통에 귀를 기울이고 싶어 합니다."
 BAV_palatinatelumber: "팔츠 목재"
 BAV_palatinatelumber_desc: "팔츠 목재는 품질이 매우 좋습니다. 이를 효과적으로 사용해야 합니다."
 BAV_extendludwigsdnordbahn: "남북 철도 확장"
 BAV_extendludwigsdnordbahn_desc: "루트비히 남북 철도는 1843년에서 1854년 사이에 건설되어 뉘른베르크, 아우크스부르크, 밤베르크 및 기타 주요 도시들을 연결했습니다. 이를 확장하는 것은 우리 기반 시설에 큰 도움이 될 것입니다."
 BAV_extendbavarianindustry: "바이에른 산업 확장"
 BAV_extendbavarianindustry_desc: "바이에른 산업은 아직 발전 단계에 있습니다. 성장을 돕는 것은 분명히 좋은 일일 것입니다."
 BAV_mnchnerculture: "뮌헨 문화"
 BAV_mnchnerculture_desc: "루트비히 1세는 뮌헨을 바이에른 문화와 예술의 중심지로 만들었습니다. 그는 대학을 세우고 바이에른 학교를 개혁했습니다. 그의 발자취를 따라 우리 문화를 확산시켜야 합니다."
 BAV_horsesforthelandwehr: "란트베어를 위한 말"
 BAV_horsesforthelandwehr_desc: "바이에른군의 장비는 점점 좋아지고 있지만, 갈 길은 아직 멉니다. 우리는 그 과정을 가속화해야 합니다."
 BAV_traingenerals: "장군 훈련"
 BAV_traingenerals_desc: "지금 당장 전쟁에 나간다면 우리는 망신만 당할 것입니다. 우리 장군들은 경험이 전혀 없으니, 이를 바꿔야 합니다."
 BAV_improvethekreuzkaserne: "크로이츠 병영 개선"
 BAV_improvethekreuzkaserne_desc: "크로이츠 병영은 뮌헨 주둔지에서 가장 오래된 병영입니다. 이를 개선하면 우리 인력을 향상시킬 수 있을 것입니다."
 BAV_improvetheisarkaserne: "이자르 병영 개선"
 BAV_improvetheisarkaserne_desc: "이자르 병영은 뮌헨에 있는 바이에른군 기병 병영입니다. 최근 우리 군대는 기병이 부족했습니다. 병영을 개선하면 이 문제가 해결될 수도 있을 것입니다."
 BAV_stopthelandtag: "란트타크 저지"
 BAV_stopthelandtag_desc: "란트타크는 예산 삭감을 통해 우리 군대의 발전을 방해하고 있습니다. 그들이야말로 바이에른군을 이토록 나쁜 상태로 만든 주된 이유입니다. 이것이 계속된다면 우리는 스스로를 방어할 수 없을 것입니다."
 BAV_bavariansteel: "바이에른 강철"
 BAV_bavariansteel_desc: "우리나라의 강철은 진정한 기회입니다. 강철 산업을 확장하면 수출과 군수 산업에 도움이 될 것입니다."
 BAV_reformarmsindustry: "군수 산업 개혁"
 BAV_reformarmsindustry_desc: "바이에른 산업을 확장했으니, 이제 무기 산업에 집중해야 합니다. 우리는 신형 총, 군복 및 기타 장비가 절실히 필요합니다."
 BAV_civiliancooperation: "민간인 협력"
 BAV_civiliancooperation_desc: "국민이 없는 나라는 없고, 노동자가 없는 산업은 없습니다. 우리의 노동자와 농민들이 국왕을 위해 일하도록 동기를 부여합시다."
 BAV_theprideofthebavarians: "바이에른인의 자부심"
 BAV_theprideofthebavarians_desc: "바이에른은 자랑스러운 왕국이며, 자랑스러운 국민을 가지고 있습니다. 이를 우리 국민과 이웃에게 알리면, 모든 바이에른인이 기꺼이 국왕을 따를 것입니다, 심지어 죽음까지도!"
 BAV_gunsfortheknigsarmee: "국왕군을 위한 총"
 BAV_gunsfortheknigsarmee_desc: "이제 총이 더 많아졌지만, 여전히 충분하지 않습니다. 더 많은 무기 공장을 건설합시다. 그러면 쓸만한 군대를 양성할 수 있을 것입니다."
 BAV_thebavarianwarstrategy: "바이에른 전쟁 전략"
 BAV_thebavarianwarstrategy_desc: "전쟁이 불가피한 만큼, 이제 우리의 미래와 국경에 대해 생각해야 할 때입니다. 최악의 상황에 대비해야 합니다."
 BAV_armyfirst_desc: "이제 란트타크가 마침내 양보했으니, 우리 군대를 키울 수 있습니다. 군대를 최우선 순위로 만듭시다."
 BAV_ludwigii: "루트비히 2세"
 BAV_ludwigii_desc: "막시밀리안 2세는 서거했지만, 그의 아들 루트비히 2세가 곧 왕위에 오를 것입니다. 우리의 새로운 국왕에게 만세!"
 BAV_getridofthewittelsbachs: "비텔스바흐 왕가 제거"
 BAV_getridofthewittelsbachs_desc: "이것은 일생일대의 기회입니다. 비텔스바흐 왕가는 충분히 오랫동안 통치했습니다. 이제 그들이 물러날 때입니다."
 BAV_prinzkarltheodorslessons: "카를 테오도르 공자의 교훈"
 BAV_prinzkarltheodorslessons_desc: "카를 테오도르 공자는 1813년 독일 전역에서 싸운 경험이 풍부한 장군입니다. 그는 우리 장군들에게 전쟁의 기술에 대해 한두 가지를 가르쳐줄 수 있을 것입니다."
 BAV_recoverfromtherussiancampaign: "러시아 원정으로부터 회복"
 BAV_recoverfromtherussiancampaign_desc: "1812년 러시아 원정은 재앙이었습니다. 나폴레옹은 전쟁에서 패했고, 우리는 그를 3만 명 이상으로 지원했습니다. 그러나 과거에 얽매이지 말고 실수로부터 교훈을 얻읍시다."
 BAV_convincethelandtag: "란트타크 설득"
 BAV_convincethelandtag_desc: "물론, 우리는 란트타크가 우리 군대의 예산을 삭감하는 것을 막았지만, 이것으로는 이 시대를 살아남기에 턱없이 부족합니다. 우리는 그들을 다시 설득해야 합니다. 이번에는 바이에른군에 자금을 실제로 지원하도록 말입니다."
 BAV_likefatherlikeson: "부전자전"
 BAV_likefatherlikeson_desc: "의심의 여지 없이 루트비히 2세는 막스 국왕의 아들입니다. 루트비히는 아버지의 유산을 이어갈 것이며, 우리는 그를 지원해야 합니다."
 BAV_gottstehunsbei: "하느님, 우리를 도우소서!"
 BAV_gottstehunsbei_desc: "새로운 국왕 루트비히 2세는 아버지의 정책을 버리기로 결정했습니다. 대신 그는 자신의 생각에 따라 행동할 것입니다. 아마도 이것이 우리 나라에 필요한 신선한 정치적 바람을 가져올 것입니다."
 BAV_voicesofthepeople: "국민의 목소리"
 BAV_voicesofthepeople_desc: "우리는 더 이상 참지 못합니다! 국가는 국민이며, 바이에른의 국민들은 더 많은 자유와 평등을 원합니다. 짧은 시간 안에 두 명의 국왕을 잃은 바이에른은 혼란에 빠져 있으니, 우리는 신속하게 행동해야 합니다. 국민들이 무엇이 자신에게 좋고 나쁜지 결정하게 합시다!"
 BAV_newideasnewwinds: "새로운 생각, 새로운 바람"
 BAV_newideasnewwinds_desc: "바이에른 군주제는 끝났습니다. 이제 우리에게 필요한 것은 모두가 행복할 수 있는 국가에 대한 새로운 생각입니다. 사회적 분리 대신 평등이 있는 국가는 어떻습니까?"
 BAV_prepareforwar: "전쟁 준비"
 BAV_prepareforwar_desc: "이제 전쟁을 준비해야 할 때입니다. 우리 군대는 개혁을 마치고 언제든지 출동할 준비가 되어 있습니다. 적들에게 우리가 두려워하지 않으며 총을 들고 그들을 환영할 것임을 분명히 합시다."
 BAV_militarystrength: "군사력"
 BAV_militarystrength_desc: "막시밀리안 2세는 군사력을 전적으로 지지했고, 루트비히 2세도 이 생각을 이어가고자 합니다. 우리가 처한 시대에 이것은 아마도 자신의 힘을 과시하는 가장 효과적인 방법일 것입니다."
 BAV_withdrawfromthezollverein: "관세 동맹 탈퇴"
 BAV_withdrawfromthezollverein_desc: "관세 동맹은 프로이센이 독일 국가들을 통합하려는 한심한 시도에 불과합니다. 이 우스꽝스러운 선전에 종지부를 찍읍시다."
 BAV_pickourside: "우리 편 선택"
 BAV_pickourside_desc: "동맹국 없이는 살아남을 방법이 전혀 없습니다. 다행히도 우리에게는 프로이센과 오스트리아라는 두 가지 선택지가 있습니다."
 BAV_thenewrepublic: "새로운 공화국"
 BAV_thenewrepublic_desc: "마침내 국민이 왕인 국가가 현실이 될 수 있습니다! 모든 관련 정치적 문제가 해결되었고, 우리는 새로운 바이에른 공화국을 선포할 수 있습니다!"
 BAV_reformthecountry: "국가 개혁"
 BAV_reformthecountry_desc: "우리의 이상이 현실이 되려면 바이에른 전체가 개혁되어야 합니다. 당장 시작합시다."
 BAV_forthegermanbavaria: "독일의 바이에른을 위하여!"
 BAV_forthegermanbavaria_desc: "도화선에 불이 붙었습니다. 감히 바이에른이 독일이 아니라고 말하는 자는 평생 잊지 못할 충격을 받게 될 것입니다. 독일의 바이에른에게 만세!"
 BAV_bavariaspower: "바이에른의 힘"
 BAV_bavariaspower_desc: "바이에른은 프로이센에 이어 두 번째로 큰 독일 국가입니다. 어쨌든 바이에른은 누구에게도 복종하도록 강요받아서는 안 됩니다. 우리는 모든 반대 세력에게 이것을 분명히 해야 합니다."
 BAV_prussiaisright: "프로이센이 옳다"
 BAV_prussiaisright_desc: "프로이센인들이 우리와 한두 가지 다른 점이 있더라도, 그들은 만만치 않은 세력임을 증명했습니다. 바이에른은 프로이센과의 동맹이 더 나은 선택이라고 결정했습니다."
 BAV_austriaisright: "오스트리아가 옳다"
 BAV_austriaisright_desc: "잠시 생각해보면 오스트리아는 프로이센보다 더 독일적입니다. 다시 말해, 바이에른은 독일보다 오스트리아에 더 가깝습니다. 우리 두 나라는 많은 유사점을 가지고 있으며, 무엇보다도 오스트리아군이 프로이센으로부터 우리를 보호해줄 수 있습니다. 오스트리아와의 동맹이 올바른 길입니다."
 BAV_blueskiesofbavaria: "바이에른의 푸른 하늘"
 BAV_blueskiesofbavaria_desc: "이제 공화국이 현실이 되었으니, 국민의 권리를 영원히 보장해야 합니다. 그 누구도 더 이상 국민의 권리를 빼앗을 수 없을 것입니다!"
 BAV_voting: "투표"
 BAV_voting_desc: "국민이 국가의 향방을 결정하는 사람들이지만, 여전히 대표자가 필요할 것입니다. 투표를 확립하면 이 문제가 해결될 것입니다."
 BAV_takeover: "장악"
 BAV_takeover_desc: "지금 우리가 공격한다면, 유혈 사태 없이 거의 모든 정부 기관을 장악할 수 있을 것입니다. 그 후부터는 식은 죽 먹기나 다름없습니다."
 BAV_revolution: "혁명"
 BAV_revolution_desc: "군주제 정부는 그렇게 쉽게 굴복하지 않을 것입니다. 피를 흘리지 않고서는 정의가 없습니다. 이것은 혁명에 대한 외침이며, 평등에 대한 외침입니다!"
 BAV_athirddeutschland: "제3의 독일"
 BAV_athirddeutschland_desc: "우리와 동맹국들은 이제 제3의 독일, 남독일 연방을 결성할 준비가 되었습니다. 이를 통해 우리는 외부의 도움 없이 스스로를 지탱할 수 있는 세 번째 강대국이 될 것입니다. 이것은 우리가 역사를 쓰는 순간입니다."
 BAV_jointhenorth: "북방에 가입"
 BAV_jointhenorth_desc: "완료되었습니다. 최근 바이에른과 프로이센의 관계가 개선되었고, 우리는 이제 프로이센 동맹에 가입할 수 있습니다. 이는 독일 통일을 향한 큰 발걸음이 될 것입니다."
 BAV_jointhesouth: "남방에 가입"
 BAV_jointhesouth_desc: "오스트리아는 우리의 제안에 동의했고 두 팔 벌려 우리를 환영할 것입니다. 함께 프로이센의 돼지들에 맞서 싸웁시다."
 BAV_visionariesofeurope: "유럽의 선각자"
 BAV_visionariesofeurope_desc: "우리 공화국은 아마도 유럽에서 최초일 것입니다. 많은 이들이 군주제가 올바른 길이 아니라는 것을 아직 이해하지 못하고 있습니다. 시간을 주면 그들도 이해할 것입니다. 지금은 자유에 중점을 둔 국가의 유럽적인 모범이 됩시다."
 BAV_democracy: "민주주의"
 BAV_democracy_desc: "우리가 확립한 것은 국민이 대표자를 투표하는 현대적인 민주주의입니다. 유럽 국가들에 이를 공식적으로 선포합시다."
 BAV_newmnchnerrte: "새로운 뮌헨 평의회"
 BAV_newmnchnerrte_desc: "뮌헨 평의회는 새로운 국가를 이끌어갈 주요 정치적 지휘 기관입니다. 우리는 발생하는 모든 정치적 문제를 다룰 수 있도록 평의회를 조직해야 할 것입니다."
 BAV_menandwomenofbavaria: "바이에른의 남성과 여성"
 BAV_menandwomenofbavaria_desc: "모든 남성과 여성은 우리 공화국을 위대하게 만드는 데 일하고 도울 수 있어야 합니다. 이는 분명 우리 경제에도 활력을 불어넣을 것입니다."
 BAV_newvolunteers: "새로운 자원병"
 BAV_newvolunteers_desc: "바이에른 혁명을 선포했으니, 새로운 군대를 위한 더 많은 자원병이 필요합니다. 이를 조금만 홍보하면 우리 국민 중 일부는 기꺼이 조국을 위해 봉사할 준비가 되어 있을 것입니다."
 BAV_customs: "관습?"
 BAV_customs_desc: "바이에른에는 많은 관습이 있습니다. 예를 들어, 가톨릭교회는 역사 내내 바이에른 문화의 큰 부분을 차지했습니다. 우리는 이것들을 살펴보고 조금 바꿔야 할 수도 있습니다."
 BAV_agriculturalreforms: "농업 개혁"
 BAV_agriculturalreforms_desc: "농업은 개혁이 필요합니다. 현재 시스템은 농민의 권리를 제한하고 있습니다."
 BAV_industrialreforms: "산업 개혁"
 BAV_industrialreforms_desc: "우리 산업은 군주제적 사고방식으로 형성되었습니다. 평등을 원한다면 산업을 바꾸는 데 집중해야 합니다."
 BAV_schoolreforms: "학교 개혁"
 BAV_schoolreforms_desc: "부유한 사람들뿐만 아니라 모두가 교육을 받을 자격이 있습니다. 따라서 우리는 전체 교육 시스템을 개혁해야 합니다."
 BAV_therightcause: "올바른 명분"
 BAV_therightcause_desc: "우리가 하는 일은 군주제의 손아귀에서 국민을 해방시키는 것입니다. 우리가 하는 일은 정당합니다. 이 소식을 널리 알리면 곧 모든 바이에른인이 우리의 명분을 지지할 것입니다!"
 BAV_bavarianconstitution: "개정된 바이에른 헌법"
 BAV_bavarianconstitution_desc: "이만큼 왔으니, 아무도 우리의 발전을 되돌릴 수 없도록 해야 합니다. 새로운 헌법을 제정하고 이를 영원히 남깁시다."
 BAV_nomorenobles: "더 이상 귀족은 없다!"
 BAV_nomorenobles_desc: "귀족을 금지함으로써 우리는 우리가 사랑하는 바이에른 땅에 어떠한 폭정도 다시는 나타나지 않도록 할 것입니다. 이 필수적인 조치는 우리 국가의 미래에 매우 중요합니다."
 BAV_stateschools: "국립학교"
 BAV_stateschools_desc: "우리는 학교 시스템을 개혁했지만, 여전히 관심이 필요합니다. 간단히 말해, 학교가 너무 적습니다. 더 많은 학교를 짓고 국유화함으로써 어떤 아이도 교육받지 못하는 일이 없도록 할 것입니다."
 BAV_convincewuerttemberg: "뷔르템베르크 설득"
 BAV_convincewuerttemberg_desc: "우리의 이웃인 뷔르템베르크는 우리와 많은 유사점을 공유합니다. 그들이 우리와 함께 정책을 추구하도록 설득해야 합니다."
 BAV_convincebaden: "바덴 설득"
 BAV_convincebaden_desc: "뷔르템베르크의 이웃인 바덴 또한 삼두 정치에 참여합니다. 그들을 설득하는 것은 삼두 정치에서 큰 역할을 할 것입니다."
 BAV_swayhessedarmstadt: "헤센-다름슈타트 흔들기"
 BAV_swayhessedarmstadt_desc: "이제 삼두제를 확장했으니, 다른 독일 국가들을 흔들 수 있습니다. 헤센-다름슈타트부터 시작합시다."
 BAV_swayfrankfurt: "프랑크푸르트 흔들기"
 BAV_swayfrankfurt_desc: "프랑크푸르트는 작은 독립 도시입니다. 삼두제를 확장하면 그들을 우리 편으로 흔들 수 있습니다."
 BAV_swaysachsen: "작센 흔들기"
 BAV_swaysachsen_desc: "작센은 다음으로 동맹을 맺을 대상입니다. 우리가 모은 동맹국들을 보면 그들이 우리와 함께할 수도 있을 것입니다."
 BAV_thegermantwo: "두 독일"
 BAV_thegermantwo_desc: "뷔르템베르크와 바이에른은 오랫동안 공통의 이해관계를 가졌습니다. 우리의 힘을 합치면 삼두제를 다시 시작할 수 있습니다."
 BAV_extendthetrias: "삼두제 확장"
 BAV_extendthetrias_desc: "현재의 삼두 정치는 남부 독일 국가들만 관련되어 있습니다. 하지만 이를 확장하면 북부에서도 독일 동맹국을 얻을 수 있을 것입니다."
 BAV_swaythueringen: "튀링겐 흔들기"
 BAV_swaythueringen_desc: "튀링겐은 바이에른과 프로이센 사이에 위치해 있어 훌륭한 동맹국이 될 수 있습니다. 그들을 흔들기 위해 누군가를 보내야 합니다."
 BAV_swayhannover: "하노버 흔들기"
 BAV_swayhannover_desc: "하노버는 북부의 독일 국가이지만, 적어도 우리 편으로 끌어들이려고 노력해야 합니다. 성공하면 프로이센은 서부 영토에서 고립될 것입니다."
 BAV_sueddeutscherzollverein: "남부 독일 관세 동맹"
 BAV_sueddeutscherzollverein_desc: "우리는 프로이센의 영향력으로부터 자유롭게 움직이기 위해 관세 동맹을 거부했지만, 이는 우리 경제에 큰 타격을 입혔습니다. 우리는 이 효과를 되돌리기 위해 프로이센과 그 동맹국을 제외한 우리만의 관세 동맹을 제안할 수 있습니다."
 BAV_catholicchurch_desc: "가톨릭교회는 우리 정부에 의해 공식적으로 인정받았으며 우리 문화의 중요한 부분입니다. 우리는 그 중요성을 강화해야 합니다."
 BAV_acceptprotestantism: "개신교 수용"
 BAV_acceptprotestantism_desc: "우리 문화가 전통 가톨릭교회와 밀접하게 관련되어 있더라도, 개신교는 지배적인 형태임을 보여주었습니다. 공식적으로 수용한다면 프로이센으로부터 좋은 인정을 받을 수 있다는 점도 잊지 말아야 합니다."
 BAV_ludwigvonderpfordten: "루트비히 폰 데어 포르텐"
 BAV_ludwigvonderpfordten_desc: "폰 데어 포르텐은 라이프치히 대학교의 위대한 정치인이자 교수임을 보여주었습니다. 그를 내각 평의회 의장으로 임명하는 것은 좋은 생각이 될 것입니다."
 BAV_supportbismarcksparliament: "비스마르크 의회 지지"
 BAV_supportbismarcksparliament_desc: "비스마르크는 많은 이들을 놀라게 하며 국가 의회를 제안했고, 이는 사실상 독일 연방 전체를 개혁하려는 제안입니다. 우리가 이를 지지한다면 프로이센에 큰 도움을 줄 것입니다."
 BAV_commoncontempt: "공통의 경멸"
 BAV_commoncontempt_desc: "우리와 오스트리아는 공통의 경쟁 상대인 프로이센을 가지고 있습니다. 분명히 오스트리아는 프로이센에 이익이 되지 않는 우리의 제안을 거절하지 않을 것입니다."
 BAV_austriasresigntowar: "오스트리아의 전쟁 체념"
 BAV_austriasresigntowar_desc: "러시아 차르 알렉산더 2세가 '오스트리아는 이미 전쟁에 굴복했다'고 말했듯이, 오스트리아는 처음부터 독일 문제에 대한 평화적인 해결책을 찾고 있지 않았고 지금도 찾고 있지 않습니다. 오스트리아를 믿고 의지하지 않는 것이 아마 좋은 생각일 것입니다."
 BAV_myenemysenemy: "내 적의 적"
 BAV_myenemysenemy_desc: "오스트리아는 불가피한 전쟁에서 우리에게 필요한 훌륭한 동맹국입니다. 즉시 바이에른과 오스트리아 간의 동맹을 제안해야 합니다."
 BAV_anotherwaytounity: "통일로 가는 또 다른 길"
 BAV_anotherwaytounity_desc: "프로이센이 독일 국가들을 통일하려는 모든 평화적 시도는 실패했습니다. 이제 그들이 목표에 도달할 수 있는 방법은 단 하나뿐입니다. 우리는 동맹국 없이 교전의 한가운데에 놓이지 않도록 신속하게 행동하고 그들을 지원해야 합니다."
 BAV_militaryconsultativecommission: "군사 자문 위원회"
 BAV_militaryconsultativecommission_desc: "바이에른이 취할 수 있는 모든 군사적 조치를 고려하기 위해 군사 자문 위원회가 개최될 것입니다. 이 위원회와 이어지는 결정들은 문자 그대로 바이에른의 미래를 결정할 것입니다."
 BAV_supportfarmers: "농민 지원"
 BAV_supportfarmers_desc: "바이에른 농민들을 지원한다면 일정 시간이 지난 후 더 많은 인력에 접근할 수 있을 것입니다. 미래에 대해 조금 생각하는 것도 틀리지 않을 것입니다."
 BAV_focusoncivilianindustry: "민간 산업에 집중"
 BAV_focusoncivilianindustry_desc: "바이에른은 농민, 노동자, 그리고 국민들을 지원해야 합니다. 실험적인 무기와 기술에 엄청난 돈을 쓰는 대신 우리 경제와 산업을 개선하는 데 집중해야 합니다."
 BAV_focusonmilitaryindustry: "군수 산업에 집중"
 BAV_focusonmilitaryindustry_desc: "지금 우리에게 필요한 것은 쇠스랑, 소, 씨앗이 아니라 신형 무기, 말, 그리고 대포입니다. 우리가 처한 시대는 전쟁의 시대이며, 이에 대비해야 합니다."
 BAV_investinthearmy: "군수 산업에 투자"
 BAV_investinthearmy_desc: "문제가 날마다 중요해지고 있는 만큼, 우리 군대를 돕기 위해 군수 산업에 투자해야 합니다. 총은 아무리 많아도 부족하지 않습니다."
 BAV_newcropsandfields: "새로운 작물과 밭"
 BAV_newcropsandfields_desc: "우리나라는 농업 국가입니다. 그러나 우리는 여전히 모든 새로운 다양한 작물을 심을 밭이 충분하지 않습니다. 이 명분을 재정적으로 지원해야 합니다."
 BAV_uselocalresources: "지역 자원 활용"
 BAV_uselocalresources_desc: "우리는 자원을 효율적으로 사용하지 않고 무기 공장에 낭비하고 있습니다. 따라서 이러한 자원들이 필요한 곳으로 가도록 집중해야 합니다."
 BAV_newfactorylayout: "새로운 공장 배치"
 BAV_newfactorylayout_desc: "무기 공장의 배치를 재설계함으로써 효율성을 높일 수 있습니다. 이는 우리 군수 산업의 성장에 큰 도움이 될 것입니다."
 BAV_reassurepower: "권력 재확인"
 BAV_reassurepower_desc: "바이에른이 입헌군주제라 할지라도, 일부 정치인들은 우리 국왕이 여전히 우리의 최고 정치적 인물이라는 사실을 잊은 것 같습니다. 국왕에게 불복종하는 것은 바이에른에 불복종하는 것입니다. 모두에게 이 사실을 상기시켜줍시다."
 BAV_thegermanstrongest: "가장 강력한 독일인"
 BAV_bavariaandthegermanstates: "바이에른과 독일 국가들"
 BAV_bavariaandthegermanstates_desc: "바이에른과 일부 다른 독일 중소 국가들은 과거에 공동 정책을 시도한 적이 있으며, 때로는 실패하고 때로는 성공했습니다. 많은 독일 국가들이 우리의 적, 즉 프로이센을 싫어하는 것 같으니 이 길을 계속 나아가야 합니다."
 BAV_thegermanstrongest_desc: "바이에른은 프로이센에 이어 가장 크고 강한 독일 중소 국가입니다. 다른 국가들에게 이 사실을 분명히 해야 어떤 중소 국가도 나쁜 생각을 품지 않을 것입니다."
 BAV_cottonexperiments: "목화 실험"
 BAV_cottonexperiments_desc: "목화는 점점 더 중요해지는 것 같습니다. 미래에 수입에 완전히 의존하지 않기 위해 우리 영토에서 목화를 재배하는 시도를 시작해야 합니다."
 BAV_bavariansupremacy: "바이에른의 우월성"
 BAV_bavariansupremacy_desc: "바이에른은 위대하며, 아무도 이 사실에 의문을 제기해서는 안 됩니다. 작은 독일 중소 국가들은 우리의 정책을 무시하는 대신 우리를 우러러봐야 합니다. 바이에른에 반대하는 자는 우리 국왕에 반대하는 것이며, 이는 용서할 수 없습니다."
 bavariafocus.54.t: "막시밀리안 2세 서거!"
 bavariafocus.54.d: "오늘, 왕국 전체가 애도하고 있습니다. 우리의 소중한 막시밀리안 2세 국왕은 한동안 심각한 병을 앓고 계셨습니다. 병마와 수개월간 싸운 끝에, 폐하는 3일 전 매우 위독해지셨습니다. 막시밀리안의 몸은 더 이상 병을 이겨내지 못했고, 오늘 아침 마침내 서거하셨습니다. 16년간 바이에른의 국왕으로 재위했던 막시밀리안 2세는 1864년 3월 10일에 서거하며 결국 왕좌를 공석으로 남겼습니다. 이 사건은 분명 우리 왕국의 존립에 영향을 미칠 것입니다."
 bavariafocus.54.a: "국왕께서 평화롭게 잠드시기를."
 bavariafocus.1.t: "루트비히 2세의 결정"
 bavariafocus.1.d: "막시밀리안 2세의 장남으로 왕위 계승권을 가진 루트비히 2세 오토 프리드리히 빌헬름 폰 비텔스바흐는 아버지의 서거 후 불과 18세의 나이로 왕위에 올라 이제 바이에른의 새로운 국왕이 되었습니다. 어린 국왕이 외국 세력의 조종을 받을 수 있다는 점 때문에 많은 정치인들은 루트비히가 미래에 어떻게 행동할지 걱정하고 있습니다. 이러한 위험을 제거하기 위해 일부 우려하는 사람들이 국왕을 설득하려는 제안을 내놓았습니다. 이 제안은 루트비히 2세를 그의 아버지의 업적에 더 가깝게 만들고, 어쩌면 삼두 정치를 계속 추진하게 할 수도 있습니다. 하지만 많은 사람들은 루트비히가 아버지의 업적과 통치 방식에 관심이 없었고 여전히 관심이 없을 것이라고 생각하며, 이것이 아무런 결과도 가져오지 않을 것이라고 생각합니다. 우리가 어떤 결정을 내리든, 이것은 바이에른 왕국의 미래에 큰 영향을 미칠 것입니다."
 bavariafocus.1.a: "우리는 국왕을 설득해야 합니다."
 bavariafocus.1.b: "그는 아직 어립니다. 그냥 내버려 둡시다. 이것이 우리에게 어떤 것도 바꾸지 않을 것입니다."
 bavariafocus.2.t: "우리 편 선택"
 bavariafocus.2.d: "이제 우리는 한쪽 편을 선택해야 하는 시점에 있습니다. 북부의 프로이센은 강력한 동맹국이 될 수 있지만, 오스트리아는 프로이센과는 달리 우리와 많은 유사점을 공유합니다. 우리 왕국, 문화, 그리고 국민을 안전하게 지키고 싶다면, 지금 행동해야 합니다."
 bavariafocus.2.a: "프로이센은 우리와 다르지만, 훌륭한 동맹이 되어 우리를 보호해 줄 것입니다."
 bavariafocus.2.b: "프로이센 짐승들과 동맹을 맺는 일은 절대 없을 것입니다. 오스트리아가 훨씬 나은 선택입니다."
 bavariafocus.3.t: "루트비히 2세 서거!"
 bavariafocus.3.d: "비텔스바흐 가문에 또다시 비극이 닥쳤습니다. 오늘 막시밀리안 2세의 장남인 루트비히 2세가 그의 방에서 하녀에 의해 하얀 이불 커버에 피를 흘리며 숨진 채 발견되었습니다. 하녀는 안에서 소란스러운 소리를 들은 뒤 조심스럽게 방에 들어갔지만, 사망한 루트비히 외에는 아무도 없었습니다. 그의 목은 날카로운 칼이나 검에 찔린 상태였습니다. 암살과 그 진짜 이유는 현재로서는 미스터리로 남아 있지만, 살인이 막시밀리안의 죽음과 루트비히의 계획된 왕위 계승과 관련이 있음은 분명합니다."
 bavariafocus.3.a: "모든 것이 계획대로 진행되었군."
 bavariafocus.4.t: "루이트폴트 폰 바이에른, 왕위에 오르다!"
 bavariafocus.4.d: "루트비히 2세의 서거와 그에 따른 대중적 소란 이후, 루이트폴트 카를 요제프 빌헬름 폰 바이에른은 통치 군주의 부재로 인해 잃어버린 안정의 일부를 스스로 회복해야 한다고 느꼈습니다. 루트비히의 남동생이자 아버지의 왕위를 계승할 다음 왕자인 오토 1세가 심한 정신 질환을 앓고 있어, 루이트폴트는 그의 동생이 적절하다고 여겨지거나 적합한 후계자가 정해질 때까지 바이에른의 섭정 왕자로 활동하기 위해 나섰습니다."
 bavariafocus.4.a: "이것이 우리에게 골칫거리가 될 수도 있겠군."
 bavariafocus.5.t: "삼두 정치"
 bavariafocus.5.d: "이른바 삼두제는 남부 독일 국가들이 자신들의 유대를 강화하고 프로이센과 오스트리아라는 위대한 게르만 강대국들에 맞서려는 시도입니다. 이 아이디어의 주요 기여자는 카를 아우구스투스 폰 왕겐하임이 있는 뷔르템베르크, 현재 바이에른의 국왕인 막시밀리안 2세가 있는 바이에른, 그리고 하노버의 총리 프리드리히 페르디난트 폰 보이스트입니다. 독일 혁명 이후 남부에서 통일된 연합에 대한 이 아이디어는 다시 인기를 얻었고 프랑스의 지지까지 받고 있습니다. 소독일주의를 추진하려는 프로이센의 시도에 이어, 바이에른, 작센, 하노버, 뷔르템베르크로 구성된 4인의 왕 동맹이 현실이 되었으며, 이 동맹은 주로 대오스트리아 계획을 지지합니다."
 bavariafocus.5.a: "바이에른이 삼두제를 이끌어야 합니다."
 bavariafocus.6.t: "바이에른의 제안"
 bavariafocus.6.d: "오스트리아와 프로이센 간의 긴장이 계속 고조되는 것을 보며, 바이에른은 오늘 우리의 유대를 강화하고 어쩌면 동맹을 맺을 것을 제안했습니다. 바이에른의 제안을 수락하면 이점이 있을 수 있지만, 많은 사람들은 남부 독일 국가들이 유대를 강화하고 위대한 게르만 강대국들에 맞서려는 오래된 삼두제 아이디어가 오스트리아와 프로이센 모두를 우리에게 적대하게 만들 것이라고 생각합니다. 우리는 신중하게 결정해야 합니다."
 bavariafocus.6.a: "바이에른의 제안을 수락해야 합니다. 함께 더 강해집시다."
 bavariafocus.6.b: "이 제안은 우리 국가에 아무런 이득이 되지 않을 것입니다. 거부하십시오."
 bavariafocus.7.t: "바이에른의 제안"
 bavariafocus.7.d: "바이에른은 오늘 우리 국가들 간의 유대를 강화할 것을 제안했습니다. 과거에 우리가 많은 공동 정책을 펼치지 않았더라도, 바이에른은 좋은 동맹국이 될 수 있습니다. 하지만 우리가 수락한다면, 프로이센과 오스트리아 양쪽으로부터 관심을 끌게 될 것임을 명심해야 합니다. 신중하게 결정합시다."
 bavariafocus.7.a: "바이에른의 제안을 수락해야 합니다. 함께 더 강해집시다."
 bavariafocus.7.b: "이 제안은 우리 국가에 아무런 이득이 되지 않을 것입니다. 거부하십시오."
 bavariafocus.8.t: "바이에른, 남부 독일 관세 동맹 제안"
 bavariafocus.8.d: "최근 우리 국가와 바이에른 간의 관계가 매우 잘 발전하고 있습니다. 우리는 몇몇 새로운 동맹국도 얻었고, 이제 그들은 새로운 종류의 관세 동맹을 제안했습니다. 이 새로운 남부 독일 관세 동맹을 수락하는 것은 기존의 것을 폐기하고 프로이센을 불쾌하게 만드는 것을 의미합니다. 그럼에도 불구하고, 바이에른이 새로운 관세 동맹에서 적들을 배제하려는 이 제안은 나쁜 움직임이 아닙니다. 즉, 바이에른은 우리를 동맹국으로 생각하고 있습니다."
 bavariafocus.8.a: "훌륭한 아이디어입니다! 이것은 우리 경제에 큰 이득이 될 것입니다."
 bavariafocus.8.b: "이것은 그저 바이에른이 더 많은 권력을 잡으려는 시도일 뿐입니다. 그들이 성공하게 두지 마십시오."
 bavariafocus.9.t: "바이에른, 남부 독일 연방 제안!"
 bavariafocus.9.d: "남부 독일 관세 동맹이 현실이 되었고, 이제 바이에른은 한 걸음 더 나아가려 합니다. 제안된 남부 독일 연방은 동맹을 맺은 독일 중소 국가들 간의 군사 및 경제 동맹입니다. 이를 수락하는 것은 프로이센이나 오스트리아를 동맹국으로 얻는 것을 포기하고 홀로 서는 것을 의미합니다. 이 일은 두 가지 방향으로 전개될 수 있습니다. 새로운 남부 독일 연방이 많은 중소 국가들의 지지를 받지 못해 소멸하거나, 중부 유럽의 세 번째 강대국인 제3의 독일이 되는 것입니다. 우리는 국가의 미래를 걸고 도박하는 것을 좋아하지 않지만, 이 경우에는 불가피해 보입니다."
 bavariafocus.9.a: "우리나라는 이 새로운 연방의 일부가 되기를 원합니다. 이것은 새로운 시대를 열 것입니다."
 bavariafocus.9.b: "우리는 절대 동의하지 않을 것입니다. 그것은 자살행위입니다."
 bavariafocus.10.t: "바이에른 개신교는 끝인가?"
 bavariafocus.10.d: "가톨릭교는 바이에른 역사와 문화의 일부입니다. 이를 폐지하는 것은 우리 문화를 폐지하는 것을 의미하며, 아무도 그렇게 되기를 원하지 않습니다. 가톨릭교회는 영원히 우리 국가의 일부가 될 것입니다."
 bavariafocus.10.a: "이것이 최선입니다."
 bavariafocus.11.t: "바이에른, 개신교를 수용"
 bavariafocus.11.d: "오늘 바이에른은 문화의 한 조각을 잃었습니다. 국가는 공식적으로 개신교를 인정하여 국교로 삼았습니다. 하지만 '전통적인' 가톨릭교회와 보수 단체를 비롯한 많은 이들이 이러한 발전에 만족하지 못하고 있습니다."
 bavariafocus.11.a: "이것이 어떻게 전개될지 지켜봅시다."
 bavariafocus.12.t: "보수주의자들의 저항!"
 bavariafocus.12.d: "최근의 친개신교 정책에 따라, 바이에른의 보수 단체들이 목소리를 높이고 있습니다. 그들은 우리가 '사랑하는 문화를 파괴하는 것'을 멈추고 예전의 기준으로 돌아올 것을 요구합니다. 우리가 무엇을 하든, 그 반발에 대비해야 합니다."
 bavariafocus.12.a: "잠시 소리치게 놔두면 결국 그들의 외침은 사그라질 것입니다. 우리는 옳은 일을 하고 있습니다."
 bavariafocus.12.b: "아마 너무 공격적으로 나서지 않는 것이 좋겠습니다. 먼저 대화를 시도해봅시다."
 bavariafocus.13.t: "바이에른 개신교의 실패!"
 bavariafocus.13.d: "개신교를 공식적으로 인정하려던 우리의 시도는 역효과를 냈습니다. 많은 무장 단체들이 우리의 최근 비보수적 움직임에 맞서 파업하고 시위했습니다. 가톨릭교회는 승리하고 그 영향력을 더 넓혔습니다. 이 모든 노력이 수포로 돌아갔습니다."
 bavariafocus.13.a: "그들은 자신들이 우리 국가를 파괴하고 있다는 것을 알지 못하는가?!"
 bavariafocus.14.t: "바이에른 개신교 수용!"
 bavariafocus.14.d: "아무도 이런 일이 일어날 것이라고 믿지 않았지만, 결국 일어났습니다. 보수 단체들은 정부가 다시 전통적인 가톨릭교를 받아들이도록 만들 수 없었습니다. 대신, 이제 개신교가 바이에른 시민의 일상생활에서 큰 역할을 합니다. 그럼에도 불구하고, 보수 단체들은 그들이 사랑하는 가톨릭교회를 포기하기를 거부하고 있으며, 바이에른 국민들은 이제 분명하게 양분되었습니다."
 bavariafocus.14.a: "새로운 시대에는 새로운 기준이 필요합니다."
 bavariafocus.15.t: "바이에른 - 친구인가?"
 bavariafocus.15.d: "오늘 바이에른의 고문들과 정치인들이 빈에 도착하여 바이에른과 오스트리아 간의 조용한 협력을 제안했습니다. 적어도 우리 둘 다 프로이센에 대해 불만을 가지고 있기 때문입니다. 그들이 우리에게 동맹을 요청하는 것이 합리적일 수 있지만, 우리는 독일 중소 국가들과 너무 많이 엮이지 않는 것이 좋을 수도 있습니다. 반면에, 약간의 정치적 노력을 통해 바이에른에 발판을 마련하여 프로이센과의 전투를 더 쉽게 만들 수도 있습니다."
 bavariafocus.15.a: "우리 편에 동맹국이 많을수록 좋습니다."
 bavariafocus.15.b: "우리는 그들이 필요 없습니다."
 bavariafocus.16.t: "바이에른 - 동맹국인가?"
 bavariafocus.16.d: "바이에른 고문들이 다시 빈에 도착했습니다. 이번에는 그들의 제안이 더 과감합니다. 프로이센이 계속해서 요구를 밀어붙이자, 바이에른은 위협을 느껴 우리에게 그들에 대항하는 공식적인 동맹국이 되어 달라고 요청합니다. 이것은 바이에른을 완전히 우리 편으로 끌어들일 기회가 될 수 있습니다. 하지만 이는 프로이센을 자극할 수도 있습니다."
 bavariafocus.16.a: "생각해보면, 바이에른은 오스트리아와 크게 다르지 않습니다."
 bavariafocus.16.b: "우리는 공통의 적이 있을 수 있지만, 혼자서도 충분히 해낼 수 있습니다."
 bavariafocus.17.t: "오스트리아와의 대화가 순조롭게 진행 중"
 bavariafocus.17.d: "오늘 우리의 고문들이 빈에서 좋은 소식을 가지고 돌아왔습니다. 오스트리아가 우리의 제안을 수락했으며, 양국 관계가 꾸준히 발전하고 있습니다. 우리에게는 좋은 소식이지만, 프로이센은 이러한 발전에 대해 그다지 기뻐하지 않을 것입니다. 우리는 신중하게 행동해야 합니다."
 bavariafocus.17.a: "이것은 우리 관계가 성장하는 데 도움이 될 것입니다."
 bavariafocus.18.t: "오스트리아와의 대화가 계속 순조롭게 진행 중"
 bavariafocus.18.d: "고문들이 다시 돌아와 좋은 소식을 전해줍니다. 오스트리아는 이 연합의 장단점을 고려한 후 이제 우리를 공식적인 동맹국으로 보고 있습니다. 우리의 공통된 적 프로이센이 존재하는 한, 이 연합도 계속될 것입니다."
 bavariafocus.18.a: "이 시대에는 동맹국이 필수적입니다."
 bavariafocus.19.t: "바이에른, 비스마르크의 의회 지지 의사 표명"
 bavariafocus.19.d: "비스마르크의 의회 제안은 바이에른에서 인기를 얻은 것 같습니다. 이 제안은 비스마르크가 독일 중소 국가들을 하나로 모으려는 마지막 시도이며, 바이에른이 이에 동의하면 성공할 수도 있습니다. 시간만이 말해줄 것이지만, 현재로서는 바이에른이 프로이센 정치에 대해 조금 더 개방적이 된 것 같습니다. 우리는 그들의 지지를 수락하거나 거부할 수 있으며, 선택은 여전히 우리에게 달려 있습니다."
 bavariafocus.19.a: "그들에게는 아직 늦지 않았습니다."
 bavariafocus.19.b: "그들은 그저 우리에게 아첨하려는 것뿐입니다."
 bavariafocus.20.t: "프로이센, 우리의 지지를 수락!"
 bavariafocus.20.d: "프로이센이 방금 비스마르크의 의회에 대한 우리의 지지를 수락했습니다. 이것은 우리를 독일 통일에 한 걸음 더 가깝게 만들거나, 적어도 바이에른과 프로이센 간의 관계를 개선할 수도 있습니다. 어느 쪽이든, 이것은 좋은 소식이며, 우리는 숨죽이고 있을 필요가 없습니다."
 bavariafocus.20.a: "어쩌면 결국 확전을 피할 수 있을지도 모르겠습니다."
 bavariafocus.21.t: "바이에른, 통일을 원하다"
 bavariafocus.21.d: "바이에른은 다시 한번 우리의 행동을 지지하려 하며, 이번에는 독일 통일에 관한 것입니다. 전쟁이 아마도 불가피하다는 것을 알기에, 바이에른은 우리를 지원하려 합니다. 바이에른이 정말로 전쟁을 원하지 않고 단지 전쟁에 대비해 동맹국을 얻으려고 하는 것이라고 생각하지만, 남부에서 좋은 동맹국이 될 수 있을 것입니다. 최소한 바이에른 영토는 독일 중소 국가들과 우리 사이의 임시 완충지 역할을 할 수 있습니다."
 bavariafocus.21.a: "좋아, 통일이 이루어질 것이다."
 bavariafocus.21.b: "거짓말에 불과하다. 우리는 그들을 믿어서는 안 됩니다."
 bavariafocus.22.t: "프로이센 동의!"
 bavariafocus.22.d: "얼마간의 기다림 끝에, 우리는 프로이센이 우리의 지지에 동의했다는 소식을 받았습니다. 이제 우리 편에 강력한 동맹국이 생겼지만, 우리는 다른 독일 국가들과 오스트리아 사이에 위치하게 되었으며, 이들 모두는 프로이센의 개혁에 대해 엄격히 반대하고 있습니다. 그럼에도 불구하고, 이제 전쟁이 일어나도 혼자가 될 것을 두려워할 필요는 없습니다."
 bavariafocus.22.a: "오늘은 좋은 날입니다."
 bavariafocus.23.t: "군사 자문 위원회"
 bavariafocus.23.d: "오늘 군사 자문 위원회가 개최되었습니다. 결과에 따르면, 최근의 발전 상황으로 볼 때 오스트리아가 우리를 동맹국으로 삼을 만큼 충분히 좋은 정치적 의견을 가지고 있으므로, 우리가 오스트리아 편에서 싸운다면 다가오는 전쟁에서 살아남을 가능성이 높습니다. 궁극적으로 우리는 이전에 알지 못했던 것을 배우지 못했습니다. 오스트리아가 우리의 모든 제안에 동의했기 때문입니다. 어쨌든, 군사 자문 위원회는 오스트리아 편에 서는 것이 좋은 생각이라고 생각합니다."
 bavariafocus.23.a: "위원회가 끝났다."
 bavariafocus.24.d: "오늘 군사 자문 위원회가 개최되었습니다. 결과는 우리가 기대했던 것보다 덜 명확했습니다. 오스트리아가 차이점들을 가지고 있기는 하지만, 홀로 살아남으려 하기보다는 그들의 편에서 싸우는 것이 여전히 더 나은 생각일 것이라고 말합니다. 오스트리아인들은 우리의 대부분의 제안에 동의하여 전쟁 시 동맹이 될 가능성이 높지만 확정적이지는 않습니다. 어쨌든, 군사 자문 위원회는 전쟁 시 오스트리아 편에 서는 것이 좋은 생각이라고 생각하지만, 여전히 그들을 조심해야 한다고 생각합니다."
 bavariafocus.25.d: "오늘 군사 자문 위원회가 개최되었습니다. 결과는 최소한 놀라웠습니다. 위원회가 프로이센을 동맹국으로 추천했기 때문입니다. 프로이센과 바이에른은 그 자체로 가장 친한 친구는 아니며 문화적, 정치적 차이점이 있지만, 최근의 발전 상황은 프로이센이 우리가 생각했던 것만큼 바이에른에 대해 공격적이지 않을 수 있음을 보여주었습니다. 어쨌든, 군사 자문 위원회는 프로이센 편에 서는 것이 좋은 생각이라고 생각합니다."
 bavariafocus.26.d: "오늘 군사 자문 위원회가 개최되었습니다. 결과는 약간 놀라웠습니다. 위원회가 전쟁 시 프로이센을 동맹국으로 추천했기 때문입니다. 그러나 위원회는 프로이센의 주된 목표가 영향력 확대라는 점을 지적했으며, 이는 언젠가 그들이 우리에게 등을 돌릴 수 있음을 의미합니다. 따라서 프로이센과 동맹을 맺을 때는 매우 신중해야 합니다. 어쨌든, 군사 자문 위원회는 프로이센 편에 서는 것이 좋은 생각이라고 생각하지만, 그들의 행동을 계속 주시해야 한다고 생각합니다."
 bavariafocus.27.d: "오늘 군사 자문 위원회가 개최되었습니다. 결과는 기껏해야 실망스러웠습니다. 명확한 결론을 내는 대신, 위원회는 구성원들 간의 합의를 찾을 수 없었습니다. 따라서 프로이센과 오스트리아 모두 전쟁 시 좋은 선택지가 아닌 것 같습니다. 처음에는 가능성이 없어 보일지라도, 우리는 중립을 유지하려고 노력해야 할 수도 있습니다."
 bavariafocus.28.t: "바이에른 관습"
 bavariafocus.28.d: "바이에른은 문화, 예술, 그리고 관습의 나라입니다. 하지만 새로운 공화국이 수립된 지금, 우리는 이것이 이대로 계속될 수 있을지 자문해야 합니다. 우리는 국민들이 다른 문화와 종교에 대해 더 이해심을 갖도록 설득하고, 국가와 종교를 분리하려고 노력할 수 있습니다."
 bavariafocus.28.a: "우리의 관습과 문화는 우리 국민에게 중요합니다."
 bavariafocus.28.b: "변화가 좋은 결과를 가져올 수도 있습니다."
 bavariafocus.29.t: "바이에른의 결정"
 bavariafocus.29.d: "두 명의 국왕이 짧은 시간 안에 사라지고 새로운 사회적 사상이 수용되면서 정부는 혼란에 빠졌습니다. 지금이 바로 우리 손으로 주도권을 잡고 우리 국가의 미래를 형성할 기회입니다. 하지만 나중에 후회할 실수를 저지르기 전에, 먼저 이 문제에 어떻게 접근할지 결정해야 합니다. 내부에서 정부를 장악하려고 시도하거나, 혁명을 촉구할 수 있습니다."
 bavariafocus.29.a: "이것은 유혈 사태 없이 정부를 장악할 기회입니다."
 bavariafocus.29.b: "귀족들이 그렇게 쉽게 굴복할 리 없습니다. 유일한 방법은 혁명뿐입니다."
 bavariafocus.30.t: "[From.GetName] 수락!"
 bavariafocus.30.d: "[From.GetName]이(가) 우리의 제안을 마음에 들어 하고 수락한 것 같습니다! 이제 우리는 다음 단계로 나아가 다른 동맹국들을 모을 수 있습니다. 함께하면 우리는 강합니다!"
 bavariafocus.30.a: "좋은 소식입니다!"
 bavariafocus.31.t: "[From.GetName] 거부!"
 bavariafocus.31.d: "아쉽게도, [From.GetName]이(가) 우리의 제안을 거부했습니다. 우리는 다음 단계로 나아가 다른 사람들을 설득하여 우리와 함께하도록 노력해야 합니다."
 bavariafocus.31.a: "그들은 이것이 얼마나 중요한지 이해하지 못하는군."
 bavariafocus.32.t: "뉘른베르크 산업문화협회 설립!"
 bavariafocus.32.d: "우리의 지시에 따라 뉘른베르크에 산업문화협회가 설립되었습니다. 협회는 우리의 산업과 문화 확산을 적극적으로 지원하고 활성화하려고 노력할 것입니다. 또한 뉘른베르크에서 더 많은 지역적 영향력을 얻는 데 도움이 될 것입니다."
 bavariafocus.32.a: "좋은 소식이군!"
 bavariafocus.33.t: "에를랑겐 구청 설립!"
 bavariafocus.33.d: "우리의 지시에 따라 에를랑겐 구청이 설립되었습니다. 뉘른베르크 근처의 작은 도시인 에를랑겐이 얼마나 빠르게 성장했는지 때문에, 구청은 바이에른 정부로서 우리가 그 지역의 농업 문화와 산업을 완전히 통제할 수 있도록 보장합니다."
 bavariafocus.33.a: "훌륭하군!"
 bavariafocus.34.t: "뮌헨의 문화"
 bavariafocus.34.d: "루트비히 1세 이후로 뮌헨은 바이에른 문화의 중심지였습니다. 이 도시는 바이에른의 이미지를 만드는 데 가장 큰 기여를 하고 있으며 동시에 우리의 수도입니다. 우리의 지시에 따라, 이제 바이에른 문화는 뮌헨을 넘어 [Root.GetName]의 가장 작은 마을과 도시까지 도달할 것입니다."
 bavariafocus.34.a: "훌륭해!"
 bavariafocus.35.t: "바이에른인의 자부심"
 bavariafocus.35.d: "오늘 [Root.GetLeader]이(가) 연설을 통해 국민들에게 [From.GetAdjectiveCap]으로서 스스로를 자랑스러워해야 한다고 말했습니다. 연설은 큰 박수갈채를 받았고, 다음날 밤에는 곳곳에서 즐거운 노래와 춤, 음주를 볼 수 있었습니다. 바이에른을 위하여!"
 bavariafocus.35.a: "우리는 자랑스러운 민족이다!"
 bavariafocus.36.t: "바이에른, 크게 놀고 싶다"
 bavariafocus.36.d: "오늘 바이에른 왕국은 이제부터 유럽 협조 체제에서 더 큰 역할을 하고 그 안에서 제자리를 찾고 싶다고 발표했습니다. 가장 크고 영향력 있는 독일 중소 국가라는 점을 고려할 때, 일부 사람들은 바이에른이 강대국들처럼 국제 정치에 참여한다면 다른 이들에게 주목받고 싶어 하는 바이에른의 소망이 성공할 수 있을 것이라고 생각합니다. 그러나 다른 사람들은 바이에른 왕국이 이전에 협조 체제의 일부가 되는 것에 전혀 관심이 없었다는 점을 지적하며, 이 소망이 단지 소망일 뿐이라고 생각합니다. 다른 일부 독일 중소 국가들과 같은 작은 나라들은 바이에른이 더 중요해지는 데 성공하기를 바라는 것 같지만, 주로 프랑스, 프로이센, 오스트리아와 같은 유럽의 주요 기존 강대국들은 바이에른이 현재 위치에 머물기를 원합니다."
 bavariafocus.36.a: "전진하라, 바이에른!"
 bavariafocus.36.b: "이것은 단지 희망 사항일 뿐이다."
 bavariafocus.37.t: "바이에른, 안전하게 놀고 싶다"
 bavariafocus.37.d: "현재 바이에른 왕국은 주요 유럽 문제에 관여하지 않을 것이라고 오늘 발표했습니다. 바이에른은 독일 문제에서 역할을 계속하고 싶지만, 어떤 저명한 외교 문제에도 휘말리고 싶어 하지 않습니다. 이 선택은 특히 프랑스 제국, 프로이센 왕국, 오스트리아 제국과 같이 작은 왕국과 국경을 맞대고 있는 주요 강대국들의 규모를 고려할 때 누구도 놀라게 하지 않은 것 같습니다. 바이에른은 고립된 정책과 문화를 버리기를 꺼리는 것처럼 보이며, 주변의 강대국들과 경쟁하기보다는 독일 지역에 집중하는 것을 선호합니다."
 bavariafocus.37.a: "우리는 우리의 원칙을 지킬 것이다."
 bavariafocus.37.b: "현명한 결정이군."
 bavariafocus.38.t: "루트비히-도나우-마인 운하 확장!"
 bavariafocus.38.d: "우리의 지시에 따라 루트비히-도나우-마인 운하가 확장되었습니다. 루트비히 1세의 통치 기간 동안 건설되어 1846년에 완공된 도나우-마인 운하는 그 이후로 바이에른 무역의 중요한 수단이었습니다. 확장이 완료되어 이제 우리는 무역에 더 많은 선박을 사용할 수 있게 되어 바이에른을 무역에 있어 더욱 중요하게 만들 것입니다."
 bavariafocus.38.a: "배라는 것은 정말 대단하군."
 bavariafocus.39.t: "루트비히-남북 철도 확장!"
 bavariafocus.39.d: "우리의 지시에 따라 루트비히-남북 철도가 확장되었습니다. 루트비히-도나우-마인 운하와 마찬가지로 루트비히 1세의 이름을 따서 명명된 이 철도는 프랑켄과 오버바이에른 사이를 빠르게 이동할 수 있게 해주며, 심지어 작센까지 도달합니다. 추가 노선으로 확장함으로써, 이제 우리는 이전보다 더 빠르게 바이에른의 더 많은 지역으로 상품을 운송할 수 있는 가능성을 얻었습니다."
 bavariafocus.39.a: "기차라는 것은 정말 대단하군."
 bavariafocus.40.t: "남부 독일 연방 형성!"
 bavariafocus.40.d: "바이에른과 다른 독일 중소 국가들의 삼두 정치가 마침내 결실을 맺은 것 같습니다. 최근 중소 국가들은 독일 지역에서 가장 크고 아마도 가장 강한 중소 국가인 바이에른의 지도를 받으며 공동 정책을 펼치고 있습니다. 오늘, 끝없는 담론과 토론 끝에 공식적으로 바이에른이 이끄는 남부 독일 연방이 탄생했습니다. 회원국들은 이를 오스트리아와 프로이센 바로 옆에 있는 세 번째 게르만 강대국인 제3의 독일로 홍보하고 있습니다. 그러나 이 새로운 동맹이 어떤 결실을 맺고 유럽 강대국들을 따라잡을 수 있을지는 여전히 미지수입니다."
 bavariafocus.40.a: "우리는 무시할 수 없는 강국이 될 것이다."
 bavariafocus.40.b: "제3의 독일이 이제 형성되었다."
 bavariafocus.41.t: "[From.GetName], 남부 독일 관세 동맹 가입!"
 bavariafocus.41.d: "우리는 방금 [From.GetName]이(가) 남부 독일 관세 동맹에 가입했다는 소식을 받았습니다. 따라서 그들은 기존의 것을 버렸습니다."
 bavariafocus.41.a: "이것은 우리 경제에 큰 이득이 될 것입니다."
 bavariafocus.42.t: "[From.GetName], 남부 독일 관세 동맹 거부!"
 bavariafocus.42.d: "우리는 방금 [From.GetName]이(가) 우리의 제안을 거부했다는 소식을 받았습니다. 새로운 남부 독일 관세 동맹에서 미래를 보지 못하고, 그들은 기존의 것을 고수하기로 결정했습니다."
 bavariafocus.42.a: "이 결정으로 그들이 얻는 게 도대체 무엇인가!?"
 bavariafocus.43.t: "[From.GetName], 남부 독일 연방 가입!"
 bavariafocus.43.d: "[From.GetAdjectiveCap] 정부는 오늘 우리에게 그들이 우리의 제안에 동의하고 우리의 명분을 지지할 것이며, [From.GetName]이(가) 남부 독일 관세 동맹에 가입할 것이라고 말했습니다. 그들은 이제 법적으로 회원국입니다."
 bavariafocus.43.a: "단결하면 우리는 강합니다!"
 bavariafocus.44.t: "[From.GetName], 남부 독일 연방 거부!"
 bavariafocus.44.d: "우리 제안의 장단점을 고려한 후, [From.GetName]이(가) 새로운 남부 독일 연방에 가입하지 않기로 결정했습니다. 우리는 다른 회원국들을 찾아야 할 것입니다."
 bavariafocus.44.a: "우리가 겪은 모든 어려움에도 불구하고!?"
 bavariafocus.45.t: "[BAV.GetNameDef], 삼두제 설립 제안"
 bavariafocus.45.d: "독일 땅의 남쪽에 있는 우리의 이웃인 [BAV.GetName]은(는) 최근 중소 국가들에게 삼두제 또는 일부 사람들이 부르는 제3의 독일 형성을 위한 동기를 부여하고 있습니다. 일종의 연방이나 연맹인 삼두제는 남부에서 프로이센과 오스트리아 외에 세 번째 강대국을 만들 것입니다. 이 아이디어를 마음에 들어 한 [BAV.GetName]은(는) 이제 공식적으로 삼두제 연맹의 형성을 제안했습니다. 이에 따라 우리와 [BAD.GetNameDef] 모두 초대를 받습니다. 우리 중 한 명이 거절하면, 삼두제는 [WUR.GetName]과 [BAD.GetName] 모두가 필요하므로 와해될 것입니다. 그러나 이 제안을 수락하거나 거부할지 결정할 때, 세 번째 독일 강국이 되는 것이 결과를 초래할 수 있다는 점을 명심해야 합니다."
 bavariafocus.45.a: "이것이 제3의 독일의 탄생의 시간이 되기를!"
 bavariafocus.45.b: "그것은 낡고 비현실적인 아이디어이며, 공상입니다."
 bavariafocus.48.d: "독일 땅의 남쪽에 있는 우리의 이웃인 [BAV.GetName]은(는) 최근 중소 국가들에게 삼두제 또는 일부 사람들이 부르는 제3의 독일 형성을 위한 동기를 부여하고 있습니다. 일종의 연방이나 연맹인 삼두제는 남부에서 프로이센과 오스트리아 외에 세 번째 강대국을 만들 것입니다. 이 아이디어를 마음에 들어 한 [BAV.GetName]은(는) 이제 공식적으로 삼두제 연맹의 형성을 제안했습니다. 이에 따라 [WUR.GetNameDef]이(가) 이미 수락했으므로, 우리는 이제 이 초대를 받습니다. 우리가 거절하면, 삼두제는 [WUR.GetName]과 [BAD.GetName] 모두가 필요하므로 와해될 것입니다. 그러나 이 제안을 수락하거나 거부할지 결정할 때, 세 번째 독일 강국이 되는 것이 결과를 초래할 수 있다는 점을 명심해야 합니다."
 bavariafocus.46.t: "삼두제 설립!"
 bavariafocus.46.d: "[WUR.GetNameDef]과 [BAD.GetNameDef] 모두 삼두제 형성에 대한 우리의 제안을 수락했으므로, 우리 세 남부 독일 국가들은 이제 서로 동맹을 맺게 되었습니다. 이러한 형태의 삼두제에는 지도자가 없으므로, 모든 구성원은 원한다면 자신의 우려와 야망을 표명할 수 있습니다. 그러나 이 구조의 내부 안정을 보장하기 위해 [BAV.GetName]은(는) 삼두제의 대표자 역할을 할 것입니다."
 bavariafocus.46.a: "제3의 독일이 번영하고 발전하기를!"
 bavariafocus.49.t: "[WUR.GetName] 수락!"
 bavariafocus.49.d: "[WUR.GetNameDef]이(가) 삼두제에 대한 우리의 제안을 수락했다는 소식이 전해졌습니다. 이제 삼두제가 설립될지 여부는 [BAD.GetNameDef]에 달려 있습니다."
 bavariafocus.49.a: "우리는 [WUR.GetAdjective] 친구들을 환영합니다!"
 bavariafocus.47.t: "[FROM.GetName] 거부!"
 bavariafocus.47.d: "[FROM.GetNameDef]이(가) 삼두제에 대한 우리의 제안을 거부했으므로, 우리 쪽에서는 더 이상 그러한 구조를 형성할 수 없습니다. 그러한 구조는 [WUR.GetName]과 [BAD.GetName] 모두의 수락을 필요로 하기 때문입니다. 불행하게도 우리와 제3의 독일을 바라는 모든 남부 독일 국가들에게, 우리 자신을 포함한 중소 국가들의 주권을 보장하기 위해 우리가 더 이상 할 수 있는 일은 아무것도 없습니다."
 bavariafocus.47.a: "삼두제의 꿈이 산산조각났군..."
 bavariafocus.50.t: "삼두제 초대"
 bavariafocus.50.d: "남부에 삼두제가 설립되면서, [BAV.GetNameDef]은(는) 우리가 가입하고 싶은지 묻고 있습니다. 삼두제의 세 창립 국가인 [BAV.GetName], [WUR.GetName], [BAD.GetName]은(는) 현재 삼두제가 여전히 매우 작으므로 더 많은 동맹국을 찾고 있습니다. 그들에 가입하기로 결정하면 제3의 독일을 만드는 데 참여할 수 있지만, 그렇게 하는 것이 결과를 초래할 수도 있다는 점을 말해야 합니다."
 bavariafocus.50.a: "제3의 독일, 우리는 그 일부가 될 것이다!"
 bavariafocus.50.b: "우리는 중부 유럽이 이미 처해 있는 정치적 상황을 악화시키고 싶지 않습니다."
 bavariafocus.51.t: "[FROM.GetName] 수락!"
 bavariafocus.51.d: "삼두제 초대에 이어, [FROM.GetNameDef]은(는) 새로 형성된 삼두제의 일부가 되는 것이 장기적으로 그들에게 이득이 될 것이라고 결정했습니다."
 bavariafocus.51.a: "제3의 독일에 오신 것을 환영합니다!"
 bavariafocus.52.t: "[FROM.GetName] 거부!"
 bavariafocus.52.d: "삼두제 초대에 이어, [FROM.GetNameDef]은(는) 새로 형성된 삼두제에서 멀리 떨어져 있기로 결정했습니다."
 bavariafocus.52.a: "젠장, 저 빌어먹을 [FROM.GetAdjective]들!"
 bavariaevent.30.t: "막시밀리안 2세, 개혁 추진"
 bavariaevent.30.d: "바이에른의 막시밀리안 2세 국왕이 오늘 언론의 자유와 보통 선거를 철회할 것을 제안했습니다. 1848년과 1849년의 독일 혁명을 기억하며, 국왕은 그러한 운동이 다시 발생하는 것을 막기 위해 더 엄격한 법률이 필요하다고 생각합니다. 그러나 여러 조언자와 정치인들은 그것이 정말 좋은 생각인지 확신하지 못하고 있습니다. 많은 이들이 그러한 개혁이 국민들을 선동하여 상황을 더욱 악화시킬 수 있다고 우려합니다. 이러한 제안된 개혁이 실행될지 여부는 아직 미정입니다."
 bavariaevent.30.a: "우리는 국왕의 뜻에 따를 것이다."
 bavariaevent.1.t: "프랑크푸르트 군주 회의"
 bavariaevent.1.d: "프랑크푸르트 군주 회의가 오늘 1863년 8월 17일에 시작되었습니다. 오스트리아 황제가 주도한 이 회의는 독일 연방에 관한 개혁안을 다루고 있습니다. 이 개혁안이 제정되면, 특히 의회 위원회를 설치하여 독일 연방을 연방 국가에 더 가깝게 만들 것입니다. 반면에, 프로이센은 독일 연방의 재편성에 대한 다른 계획을 제안했습니다. 우리는 오스트리아의 제안을 지지하거나, 반대하고 프로이센의 제안을 지지하거나, 중립을 유지할 수 있습니다."
 bavariaevent.1.a: "우리는 오스트리아의 제안을 지지할 것입니다."
 bavariaevent.1.b: "우리는 아무도 자극하고 싶지 않습니다."
 bavariaevent.1.c: "우리는 프로이센의 제안을 지지할 것입니다."
 bavariaevent.2.t: "막스 국왕의 하이킹"
 bavariaevent.2.d: "막시밀리안 2세가 오늘 오버바이에른의 알프스 지역에서 하이킹을 했습니다. 총 길이는 26km에 달하며, 바트 콜그루프의 회른레 정상에서 퓌르슐링의 왕실 사냥 오두막과 클람슈피체 정상을 거쳐 막스 국왕이 직접 지은 브루넨코프 하우스까지 이어집니다."
 bavariaevent.2.a: "이 길을 우리 국왕의 이름을 따서 명명해야 합니다!"
 bavariaevent.3.t: "[From.GetNameDef]와(과)의 공동 정책"
 bavariaevent.3.d: "우리의 최근 정치적 행동은 [From.GetAdjectiveCap]의 장관들과 정치인들에게 깊은 인상을 주었습니다. 많은 논의와 제안, 토론 끝에, 우리 두 나라는 마침내 공동 정책을 수립하고 미래에 나란히 함께 더욱 강해지기로 합의했습니다."
 bavariaevent.3.a: "새로운 [From.GetAdjectiveCap] 친구들을 위하여!"
 bavariaevent.4.t: "[From.GetNameDef]와(과)의 공동 정책"
 bavariaevent.4.d: "[From.GetAdjectiveCap]와(과) 공동 정책을 수립하려던 우리의 최근 시도가 그들과 다른 독일 국가들 사이의 관계를 악화시킬 것을 우려하여, [From.GetName]은(는) 우리의 제안을 거부했습니다. 그러나 그들은 우리가 새롭게 수용한 개방적인 정치에 감동한 듯하며 우호적인 관계를 유지하기를 원합니다."
 bavariaevent.4.a: "유감스럽지만, 그들의 결정을 존중해야 할 것입니다."
 bavariaevent.5.t: "[From.GetName]의 공동 정책 제안"
 bavariaevent.5.d: "오늘 [From.GetNameDef]이(가) 우리 두 나라 간의 공동 정책을 제안했습니다. 그들은 이것이 우리 사이의 관계를 개선하는 좋은 방법이라고 생각합니다."
 bavariaevent.5.a: "[From.GetNameDef]은(는) 우리의 친구입니다. 수락해야 합니다."
 bavariaevent.5.b: "우리 나라가 둘 다 독일이더라도, 우리가 독립적인 이유가 있습니다."
 bavariaevent.7.t: "독일 문제"
 bavariaevent.7.d: "이제 독일의 위협이 사라졌으니, 오스트리아는 그들이 원하는 방식으로 독일을 통일하기를 기대할 것입니다. 다행히도 우리는 옳은 편을 선택했고, 이제 승자 중 한 명이 되었습니다. 따라서 우리는 평화 회담에 참여할 수 있습니다. 우리는 우리의 의견을 말하고 몇 가지 이점을 얻으려고 노력할 수도 있지만, 모든 것을 오스트리아에 맡길 수도 있습니다. 그러나 평화 회담에 참여하려면, 우리가 원하는 것을 달성할 가능성이 우리 국가의 발전 정도나 전쟁에서의 성과에 달려 있다는 점을 명심해야 합니다."
 bavariaevent.7.a: "우리는 우리의 의견을 말하려고 노력해야 합니다."
 bavariaevent.7.b: "오스트리아에 맡깁시다."
 bavariaevent.8.t: "프랑크푸르트 조약"
 bavariaevent.8.d: "드디어 평화 회담이 열렸습니다. 우리가 발언권을 가지고 회담에 참석하기로 결정했으므로, 이제 우리의 요구사항이나 제안을 내놓아야 합니다. 프로이센이 이끄는 북부가 전쟁에서 패배했으므로, 우리는 이제 독일에 대한 완전한 통제권을 가지고 우리의 이익을 관철시킬 수 있습니다.\n\n첫째, 우리가 이미 그 지역에 팔츠를 소유하고 있으므로, 바이에른이 루르 지방을 합병하도록 요구할 수 있습니다. 이는 우리 산업에 큰 도움이 될 수 있지만, 오스트리아가 바이에른을 산업화된 국가로 인정하지 않는다면 이 요구를 성공시킬 가능성이 거의 없다는 것을 알아야 합니다.\n\n다른 접근 방식은 그냥 테이블에 앉아 오스트리아가 모든 실제 작업을 하도록 내버려 두는 것입니다. 평화 회담에 참석하고 승리했다는 사실만으로도 우리는 이미 꽤 인기가 있습니다. 게다가 오스트리아와 좋은 관계를 유지하는 것도 나쁜 생각이 아닐 것입니다.\n\n가장 대담한 제안은 단연코 독일 통일에 관한 것입니다. 완전히 외면당하지 않도록, 우리는 통일이 어떻게 이루어져야 하는지에 대한 몇 가지 아이디어를 제출할 수 있습니다."
 bavariaevent.8.a: "루르는 정당하게 바이에른의 영토입니다. 우리에게 넘겨줄 것을 요구해야 합니다."
 bavariaevent.8.b: "관계를 위해 오스트리아가 말하는 모든 것에 동의해야 합니다."
 bavariaevent.8.c: "통일이 핵심입니다. 마침 우리가 어떻게 달성할 수 있는지에 대한 몇 가지 아이디어가 있습니다."
 bavariaevent.9.t: "바이에른, 루르 지방을 요구하다"
 bavariaevent.9.d: "평화 회담에 참여한 [BAV.GetNameDef]이(가) 오늘 루르 지방을 공식적으로 자신들에게 넘겨달라고 요구했습니다. 우리가 전장에서 프로이센인들을 물리쳤으므로, 이론적으로 그 땅을 가지고 우리가 원하는 대로 할 수 있습니다. 사실, 만약 바이에른이 루르 지방을 합병한다면, 이는 [PRS.GetNameDef]의 산업을 엄청나게 약화시킬 것입니다. 하지만 우리는 이를 거부하고 다른 일을 할 수도 있습니다."
 bavariaevent.9.a: "그들이 갖게 하십시오. 바이에른은 우리의 친구입니다."
 bavariaevent.9.b: "바이에른에 더 많은 권력을 주어서는 안 됩니다."
 bavariaevent.10.t: "독일 국가 연합"
 bavariaevent.10.d: "지금까지 독일 문제에 대한 명확한 답을 찾을 수 없었으므로, 우리는 당분간 무엇을 할지 결정해야 합니다. 통일은 우리가 생각했던 것보다 훨씬 더 복잡한 일인 것 같고, 이제 독일 국가들이 우리에게서 등을 돌리기 전에 행동해야 합니다.\n우리 정부 내 많은 사람들이 독일 지역 전반의 안정과 안전을 보장하기 위해 임시 보호 연맹(Schutzbund)을 형성하자는 임시 아이디어를 좋아하게 되었습니다. 이 조직은 며칠 내로 설립될 것입니다. 그러나 이 연맹을 어떻게 다룰지는 아직 결정되지 않았습니다. 우리가 직접 독일 국가들을 종속시키고 안전하게 가기 위해 보호 연맹을 시작할 수도 있고, 불신을 초래할 수 있으므로 아무도 종속시키지 않고 보호 연맹을 만들 수도 있습니다."
 bavariaevent.10.a: "안전하게 갑시다."
 bavariaevent.10.b: "보호 연맹만으로 충분할 것입니다."
 bavariaevent.11.t: "바이에른, 통일을 제안하다"
 bavariaevent.11.d: "오늘 [BAV.GetNameDef]이(가) 바이에른을 우리의 종속국으로 하여 독일을 최종적으로 통일할 것을 제안했습니다. 모든 독일 국가들은 강제로 그들에 의해 합병되어, 뮌헨을 통해 빈에서 통치될 것입니다. 이 제안에 동의하면 독일 통일이 마침내 이루어지고, 본국에서의 시위와 같은 너무 많은 위험을 감수하지 않고도 모든 독일 영토에 대한 완전한 권력을 갖게 될 것입니다. 그러나 그들이 우리에게 꽤 우호적이었음에도 불구하고, 이것이 바이에른의 권력 장악 시도일 수 있다는 점을 명심해야 합니다."
 bavariaevent.11.a: "그렇게 되도록 하라."
 bavariaevent.11.b: "우리는 이 문제를 어떻게 다룰지 스스로 결정할 것입니다."
 bavariaevent.12.t: "바이에른, 통일을 제안하다"
 bavariaevent.12.d: "오늘 [BAV.GetNameDef]이(가) 바이에른을 우리의 종속국으로 하여 독일을 최종적으로 통일할 것을 제안했습니다. 모든 독일 국가들은 그들에 의해 합병되되, 지난 전쟁에서 우리의 동맹국이었던 국가들은 예외입니다. 대신, 주로 남부 독일 국가들로 구성된 우리의 과거 동맹국들은 새로 형성될 독일 연방의 일부가 되고 싶은지 질문받을 것입니다. 만약 그들이 거부한다면, 그들은 단순히 새로운 독일의 종속국이 되어 자신들의 오래되고 정당한 국경과 영토를 유지할 것입니다. 이제 이 새로운 독일이 현실이 될지 아닐지를 결정하는 것은 우리에게 달려 있습니다."
 bavariaevent.12.a: "바이에른은 우리의 좋은 친구였습니다. 새로운 독일을 위하여!"
 bavariaevent.12.b: "우리는 그것보다 더 나은 아이디어를 가지고 있습니다."
 bavariaevent.13.t: "통일로 가는 길"
 bavariaevent.13.d: "오스트리아에게 우리의 독일 계획을 제시할 때가 왔습니다. 그래도 우리는 정확히 무엇을 제안할지 결정해야 합니다. 이 문제에 대해 통일된 독일을 수립하는 두 가지 주요 아이디어가 있습니다.\n\n첫 번째 아이디어는 바이에른을 오스트리아의 종속국으로 만들면서, 바이에른 아래에 독일을 강제로 통일하는 것입니다. 이는 오스트리아가 우리의 주인이 되더라도, 바이에른이 주도하는 독일에 대한 우리의 꿈을 현실로 만들 것입니다.\n\n두 번째 아이디어는 이전 전쟁에서 우리의 동맹국이었던 독일 국가들에게 선택권을 주는 것입니다. 그들은 우리에게 합류하여 새로운 독일의 일부가 되거나, 아니면 국경을 유지하되 우리에게 종속되는 것입니다.\n\n첫 번째 아이디어가 더 매력적으로 들리지만, 두 번째 아이디어는 이전 동맹국들이 우리에게 등을 돌리는 것을 막을 것입니다. 그러나 최종 결정권은 오스트리아에게 있다는 점을 주목해야 합니다. 그들이 우리의 제안을 받아들일지 여부는 다른 유럽 열강들에게 우리가 어떻게 비치기를 결정했는지에 달려 있습니다."
 bavariaevent.13.a: "이것이 일부 사람들을 괴롭힐 수 있다 해도, 우리는 독일을 통일할 것입니다."
 bavariaevent.13.b: "우리는 동맹국들을 화나게 할 여유가 없습니다."
 bavariaevent.14.t: "독일 통일"
 bavariaevent.14.d: "독일 평화 회담이 끝나가는 것 같고, 오스트리아가 바이에른의 통일 제안을 수락한 것 같습니다. 통일은 이제 한 발짝 남았습니다. 이제 [AUS.GetNameDef]와(과) 동맹을 맺었던 모든 독일 국가들은 결정을 내려야 합니다. 그들은 새로 형성된 독일의 직접적인 일부가 되거나, 국경과 영토를 유지하되 종속국이 되는 것입니다. 우리가 과거 동맹국 중 하나이므로, 우리는 선택해야 합니다."
 bavariaevent.14.a: "우리는 새로운 연방의 일부가 될 것입니다."
 bavariaevent.14.b: "통일은 결코 우리의 꿈이 아니었습니다. 우리는 [Root.GetAdjectiveCap]의 국경을 원합니다."
 bavariaevent.15.t: "[From.GetNameDef], 독일의 일부가 되다"
 bavariaevent.15.d: "오늘 [From.GetName]이(가) 발표했듯이, 그들의 왕국은 새로 형성된 독일의 일부가 될 것입니다. [From.GetAdjectiveCap] 정치인들은 새로운 정치 시스템에 장관 및 일반 정부 구성원으로 통합될 것입니다."
 bavariaevent.15.a: "마침내 독일의 꿈이 현실이 되었습니다."
 bavariaevent.16.t: "[From.GetNameDef], 독일의 종속국이 되다"
 bavariaevent.16.d: "오늘 [From.GetName]이(가) 발표했듯이, [From.GetName]은(는) 자신들의 국경과 영토를 고수할 것입니다. 새로운 독일의 일부가 되는 대신, 그들은 자신들의 문화, 정치 시스템, 그리고 땅을 보존하되 우리의 종속국이 되기로 했습니다."
 bavariaevent.16.a: "그들은 스스로를 만족시켜야 합니다."
 bavariaevent.17.t: "독일 통일!"
 bavariaevent.17.d: "오늘 우리는 오스트리아와 프로이센 간의 독일 전쟁이 남부, 즉 오스트리아와 그 동맹국들의 승리로 끝났다는 소식을 들었습니다. 평화 회의가 열려 독일 국가들을 어떻게 처리할지 결정했습니다. 가장 큰 남부 독일 국가인 바이에른은 오스트리아의 빈에서 통치될 자신들 아래에 독일을 통일할 것을 제안했습니다. 오스트리아인들은 마침내 독일 국가들을 통일한다는 생각에 만족한 듯 바이에른의 제안을 받아들였고, 이로써 [GEC.GetNameDef]이(가) 탄생했습니다. 그러나 이전의 프로이센 동맹국들과 프로이센 자체가 새로운 국가에 강제로 통합되었기 때문에, 이 새로운 독일이 유지될지는 아직 미지수입니다."
 bavariaevent.17.a: "만세!"
 bavariaevent.17.b: "그들에게는 좋은 일이군."
 bavariaevent.18.t: "[From.GetNameDef] 동의"
 bavariaevent.18.d: "오스트리아가 우리의 제안에 동의했습니다. 이제 바이에른 아래의 독일 통일이 현실이 될 수 있습니다."
 bavariaevent.18.a: "건배!"
 bavariaevent.19.t: "[From.GetNameDef] 거부"
 bavariaevent.19.d: "오스트리아가 우리의 제안을 거부했습니다. 그들은 이제 다른 사람들의 의견을 듣는 대신 자신들의 아이디어와 계획을 밀어붙일 것입니다."
 bavariaevent.19.a: "젠장."
 bavariaevent.20.t: "바이에른 의용군 봉기"
 bavariaevent.20.d: "배신자 프로이센인들이 우리의 사랑하는 조국을 공격하는 것을 보고 바이에른 국민들은 혼란에 빠졌습니다. 여러 조직된 단체들이 봉기하여 바이에른 방어를 돕기 위해 우리 군대에 합류했습니다. 일반적으로 이 의용군(Freiwilligenkorps)은 장비가 좋지 않지만, 바이에른이 무너지면 자신들의 신념도 강제로 무너질 것을 이해하며 우리를 돕기 위해 최선을 다할 것입니다. 우리는 함께, 단결하여, 팔짱을 끼고 프로이센 혁명가에 맞서 굳건히 설 것입니다."
 bavariaevent.20.a: "바이에른은 절대 무너지지 않을 것입니다!"
 bavariaevent.22.t: "뮌헨과 빈을 잇는 철도 노선 - 계획 완료"
 bavariaevent.22.d: "1850년대 초부터 바이에른의 수도 뮌헨을 철도로 빈과 연결하려는 계획이 있었습니다. 초기 실패를 겪은 후, 바이에른 출신인 오스트리아의 엘리자베트 황후의 기쁨 속에 최근 이 계획이 다시 활성화되었습니다. 이제 철도 노선에 대한 계획이 완료되었습니다. 뮌헨에서 로젠하임까지 남동쪽으로 달리고, 거기서부터 베르히테스가덴까지 동쪽 방향으로 계속되어 잘츠부르크의 국경 뒤에서 오스트리아의 노선과 만날 것입니다. 이 노선은 약 3년 후에 운행을 시작할 예정입니다. 우리가 이 계획을 지원하기로 결정한다면, 새로운 철도 노선은 분명히 우리 경제와 오스트리아와의 상호 이해에 도움이 될 것입니다."
 bavariaevent.22.a: "좋은 생각이군."
 bavariaevent.22.b: "철도 프로젝트에 대한 지원을 중단합니다."
 bavariaevent.23.t: "로젠하임에서 트라운슈타인 구간 운행 시작"
 bavariaevent.23.d: "뮌헨에서 빈까지 철도 노선을 건설하려는 우리의 노력의 일환으로, 로젠하임과 트라운슈타인 사이의 구간이 드디어 운행을 시작했습니다. 킴제 주변의 어려운 지형과 토양 조건 때문에 건설이 지연되었습니다."
 bavariaevent.23.a: "좋은 여행 되기를!"
 bavariaevent.23.b: "철도 프로젝트에 대한 지원을 중단합니다."
 bavariaevent.24.t: "트라운슈타인에서 잘츠부르크 구간 운행 시작"
 bavariaevent.24.d: "뮌헨에서 빈까지 철도 노선을 건설하려는 우리의 노력의 일환으로, 트라운슈타인과 잘츠부르크 사이의 마지막 구간이 드디어 운행을 시작했습니다. 이제 뮌헨에서 빈까지의 노선은 환승이나 중단 없이 운행될 수 있습니다. 며칠 안에 오스트리아의 프란츠 요제프 황제와 엘리자베트 황후, 그리고 그녀의 친척인 막시밀리안 2세 국왕이 참석하는 개통식이 열릴 예정입니다."
 bavariaevent.24.a: "좋은 여행 되기를!"
 bavariaevent.24.b: "철도 프로젝트에 대한 지원을 중단합니다."
 bavariaevent.25.t: "로젠하임-쿠프슈타인 노선 운행 시작"
 bavariaevent.25.d: "국가와 투자자들이 합의한 철도 양보의 일환으로, 로젠하임에서 오스트리아 국경의 쿠프슈타인까지의 철도 노선이 완공되었습니다. 이것은 바이에른 남부 지역의 첫 번째 철도 노선이며, 이 지역을 철도를 통해 뮌헨과 연결하여 지역 전체의 산업과 관광을 확실히 촉진할 것입니다."
 bavariaevent.25.a: "좋은 여행 되기를!"
 bavariaevent.25.b: "철도 프로젝트에 대한 지원을 중단합니다."
 bavariaevent.26.t: "동부 철도 - 뮌헨-란츠후트 구간 운행 시작"
 bavariaevent.26.d: "국가와 투자자들이 합의한 철도 양보의 일환으로, 뮌헨에서 란츠후트까지의 동부 철도 구간이 완공되었습니다. 이 노선은 슈트라우빙을 거쳐 파사우로 계속될 것입니다. 우리가 철도 프로젝트에 대한 지원을 계속하기로 결정한다면, 이 철도 노선은 약 2년 안에 완공될 예정입니다."
 bavariaevent.26.a: "좋은 여행 되기를!"
 bavariaevent.26.b: "철도 프로젝트에 대한 지원을 중단합니다."
 bavariaevent.27.t: "동부 철도 - 란츠후트-레겐스부르크-뉘른베르크 구간 운행 시작"
 bavariaevent.27.d: "국가와 투자자들이 합의한 철도 양보의 일환으로, 란츠후트에서 레겐스부르크까지의 동부 철도 구간과 뉘른베르크 연결선이 완공되었습니다. 이 노선은 파사우로 계속될 것입니다. 우리가 철도 프로젝트에 대한 지원을 계속하기로 결정한다면, 이 철도 노선은 약 1년 안에 완공될 예정입니다."
 bavariaevent.27.a: "좋은 여행 되기를!"
 bavariaevent.27.b: "철도 프로젝트에 대한 지원을 중단합니다."
 bavariaevent.28.t: "동부 철도 - 레겐스부르크-슈트라우빙-파사우 구간 운행 시작"
 bavariaevent.28.d: "국가와 투자자들이 합의한 철도 양보의 일환으로, 레겐스부르크에서 슈트라우빙을 거쳐 파사우까지의 동부 철도 구간이 완공되었습니다. 이 노선은 파사우로 계속될 것입니다. 우리가 철도 프로젝트에 대한 지원을 계속하기로 결정한다면, 바이에른 북동부를 보헤미아와 연결하는 다른 철도 노선들이 계획되어 있습니다."
 bavariaevent.28.a: "좋은 여행 되기를!"
 bavariaevent.28.b: "철도 프로젝트에 대한 지원을 중단합니다."
 bavariaevent.29.t: "동부 철도 - 슈반도르프-캄-보헤미아 국경 구간 운행 시작"
 bavariaevent.29.d: "국가와 투자자들이 합의한 철도 양보의 일환으로, 슈반도르프에서 캄을 거쳐 보헤미아 국경까지의 동부 철도 구간이 완공되었습니다. 이 노선은 결국 바이에른 철도망을 프라하와 연결할 것입니다."
 bavariaevent.29.a: "좋은 여행 되기를!"
 bavariaevent.31.t: "러시아의 경고"
 bavariaevent.31.d: "§G[RUS.GetNameWithFlag]§!은(는) 우리에게 §3[FRA.GetNameWithFlag]§!와의 전쟁이 §G[RUS.GetNameWithFlag]§!와의 적대적인 관계나 전쟁을 의미할 수 있다고 경고했습니다. 이 경고에 유의하고 싶을 수 있지만, §O[AUS.GetNameWithFlag]§!이(가) §3[FRA.GetNameWithFlag]§!와(과) §b[PIE.GetNameWithFlag]§!에 대한 전쟁에 우리를 부른다면 선택의 여지가 거의 없습니다. "
 bavariaevent.31.a: "어떻게 전개되는지 지켜보겠습니다."
 bavariaevent.32.t: "오스트리아, 원조를 요청하다"
 bavariaevent.32.d: "§O[AUS.GetNameWithFlag]§!이(가) §b[PIE.GetNameWithFlag]§!와의 전쟁에 우리의 참전을 요청했습니다. 이는 우리가 §G[RUS.GetNameWithFlag]§!로부터 받은 경고와 상충되지만, 이 문제에 대해 우리에게는 선택의 여지가 거의 없습니다. 우리는 §O[AUS.GetNameWithFlag]§!의 편에서 전쟁에 참여해야 합니다."
 bavariaevent.32.a: "선택의 여지가 없는 것 같습니다."
