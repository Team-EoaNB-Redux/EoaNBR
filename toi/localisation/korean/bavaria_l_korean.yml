 BAV_idea_railway_concessions_desc: "우리의 산업화 노력의 일환으로, 우리 왕국 전역에서 여러 반민간 및 공공 주도로 철도 프로젝트가 시작되었습니다. 우리는 아래 노선들에 대한 철도 확장 계획을 지원하고 추진하기로 결정할 수 있으며, 이 계획은 이미 진행 중이며 총 건설 기간은 1862년까지 예정되어 있습니다. 또는 이 노선들에 대한 지원을 취소하기로 결정할 수도 있는데, 이는 우리가 직접 건설해야 한다는 것을 의미합니다.\n\n§Y[BAV.GetFlag]§! - §Y[AUS.GetFlag]§! 오스트리아 서부 철도 연결:\n뮌헨-빈 철도 노선 (로젠하임, 잘츠부르크, 린츠 경유)\n§Y[BAV.GetFlag]§! - §Y[AUS.GetFlag]§! 오스트리아 북티롤 주립 철도 연결:\n로젠하임-인스브루크 철도 노선 (쿠프슈타인 경유)\n§Y[BAV.GetFlag]§! - §Y[AUS.GetFlag]§! 바이에른 동부 철도:\n뮌헨-파사우 (란츠후트, 슈트라우빙 경유)"
