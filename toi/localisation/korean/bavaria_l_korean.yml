###Leaders###
 POLITICS_MAXIMILIAN_II_DESC: "아버지의 서거 후 왕위의 책임을 맡은 막시밀리안 2세는 1848년 독일 혁명 기간 동안 왕국의 안정을 회복했습니다. 그의 추종자들이 부르는 대로 막스 국왕은 바이에른의 독립과 문화를 지지하여 국민들 사이에서 매우 인기가 높았습니다. 아버지와 달리 막시밀리안은 개인적인 사치보다는 국정 문제에 더 많은 관심을 가졌습니다. 바이에른을 문화, 교육, 예술의 중심지로 만들겠다는 자신의 정책을 따르면서, 막시밀리안 2세는 프랑크푸르트 의회가 제안한 프랑크푸르트 헌법을 거부했고, 이는 1849년 팔츠 봉기를 촉발했습니다. 그러나 프로이센 군대와 바이에른 군사 군단의 도움으로 반란은 진압되었습니다."
 POLITICS_BAV_LUDWIG_II_DESC: "루트비히 2세 오토 프리드리히 빌헬름 폰 비텔스바흐는 아버지의 서거 후 18세의 나이로 바이에른 국왕의 왕위에 올랐습니다. 그는 고위직에 대한 준비가 되어 있지 않았고 정치인들에게도 알려지지 않았습니다. 루트비히는 문화에 헌신적이었지만, 리하르트 바그너의 음악에 대한 그의 사랑은 바이에른 정부와 특히 그의 가족 사이에서 많은 우려를 불러일으켰습니다. 그의 아버지 막시밀리안 2세는 새로운 M/1842 소총 시연 중에 \"너는 몽상가다, 루트비히. 예술에 대한 네 사랑이 실제로는 무엇인지 아느냐? 약점이다\"라고 말한 적이 있습니다. 프로이센과의 관계가 긴장된 상황에서, 우리가 할 수 있는 유일한 희망은 우리의 새로운 국왕인 루트비히 2세가 우리를 영광으로 이끌고 파멸로 이끌지 않는 것입니다."
