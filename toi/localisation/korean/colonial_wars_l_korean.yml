 PRS_purchase_brandenburg_whydah: "[1111.OWNER.GetName]으로부터 [1111.GetName] 구매"
 PRS_colonial_company_partnership_koba: "[1109.GetName]의 독일-아프리카 회사"
 PRS_german_african_company_event_tooltip: "이는 §Y식민지 회사 파트너십§!을 설립하여 우리가 §G산업화§!를 시작할 수 있게 해 줄 것입니다.\n"
 PRS_german_african_company_event.1.t: "[FROM.GetName]가 식민지 회사 파트너십을 요청하다!"
 PRS_german_african_company_event.1.d: "[FROM.GetName]가 우리와 그들 간의 식민지 회사 파트너십 결성을 요청했습니다. 이 파트너십은 [ROOT.GetName] 내 산업화 및 기반 시설에 대한 막대한 투자를 가져올 것입니다. 또한, 만약 파트너십이 수락되지 않는다면 [1109.GetName]를 구매하겠다고 제안했습니다. 하지만 우리 국민 중 일부는 식민 강대국들이 이 지역 내에서 영향력을 얻는 것을 경계하고 있습니다."
 PRS_german_african_company_event.1.f: "[FROM.GetName]가 식민지 야심을 다시 드러냈고, [1109.GetName]를 구매하겠다고 요청한 것 같습니다."
 PRS_german_african_company_event.1.a: "우리는 [1109.GetName] 판매로 이익을 얻을 수 있다."
 PRS_german_african_company_event.1.b: "식민지 회사 파트너십이 막대한 투자를 가져올 것입니다!"
 PRS_german_african_company_event.1.c: "우리는 저 식민 강대국들을 믿을 수 없다! 거래는 없다!"
 PRS_german_african_company_event.1.e: "[1109.GetName]는 판매용이 아니다! 거래는 없다!"
 PRS_german_african_company_event.2.t: "[FROM.GetName]가 [1109.GetName] 판매에 동의하다!"
 PRS_german_african_company_event.2.d: "[1109.GetName]가 이제 [ROOT.GetAdjective]의 식민지 영향권에 들어왔습니다! 독일-아프리카 회사가 곧 [1109.GetName]에 설립될 것입니다."
 PRS_german_african_company_event.2.a: "훌륭하다! 우리의 식민지 영향권이 성장한다!"
 PRS_german_african_company_event.3.t: "[FROM.GetName]가 식민지 회사 파트너십을 수락하다!"
 PRS_german_african_company_event.3.d: "[FROM.GetName]가 식민지 회사 파트너십의 조건과 이에 수반되는 조약에 동의했습니다. 이제 그들은 우리 식민지 영향권 내에 있습니다!"
 PRS_german_african_company_event.3.a: "훌륭하다! 우리의 식민지 영향권이 성장한다!"
 PRS_german_african_company_event.4.t: "[FROM.GetName]가 우리의 협상을 거부하다!"
 PRS_german_african_company_event.4.d: "[FROM.GetName]가 식민지 회사 파트너십을 거절했으며, [1109.GetName]를 우리에게 판매하는 것도 거절했습니다."
 PRS_german_african_company_event.4.a: "유감스럽군."
 PRS_german_african_company_event.4.b: "어쩌면 우리가 [1109.GetName]를 직접 차지해야 할지도 모른다!"
 PRS_whydah_purchase_colony_event.1.t: "[FROM.GetName]가 [1111.GetName] 구매를 요청하다"
 PRS_whydah_purchase_colony_event.1.d: "[1111.GetName]는 한때 옛 브란덴부르크 식민지였지만, 오래전에 버려졌습니다. [FROM.GetName]가 식민지 야심을 다시 드러냈고, [1111.GetName] 구매를 요청한 것 같습니다."
 PRS_whydah_purchase_colony_event.1.a: "우리는 [1111.GetName] 판매로 이익을 얻을 수 있다."
 PRS_whydah_purchase_colony_event.1.b: "[1111.GetName]는 판매용이 아니다!"
 PRS_whydah_purchase_colony_event.2.t: "[FROM.GetName]가 [1111.GetName] 판매에 동의하다"
 PRS_whydah_purchase_colony_event.2.d: "[1111.GetName]는 버려졌던 옛 브란덴부르크 식민지였으나, 이제 다시 우리 식민지 영향권에 들어왔습니다."
 PRS_whydah_purchase_colony_event.2.a: "훌륭하다! 우리의 식민지 영향권이 성장한다!"
 PRS_whydah_purchase_colony_event.3.t: "[FROM.GetName]가 [1111.GetName] 판매를 거부하다!"
 PRS_whydah_purchase_colony_event.3.d: "[FROM.GetName]가 우리에게 [1111.GetName] 판매를 거부했으며, 추가 제안 또한 거절했습니다."
 PRS_whydah_purchase_colony_event.3.a: "유감스럽군."
 PRS_whydah_purchase_colony_event.3.b: "어쩌면 우리가 [1111.GetName]를 직접 차지해야 할지도 모른다!"
 PRS_whydah_purchase_colony_event.3.c: "혹시 식민지 회사 파트너십은 받아들이지 않을까?"
 PRS_whydah_purchase_colony_event.4.t: "[FROM.GetName]가 식민지 회사 파트너십을 요청하다!"
 PRS_whydah_purchase_colony_event.4.d: "[FROM.GetName]가 우리와 그들 간의 식민지 회사 파트너십 결성을 요청했습니다. 이 파트너십은 [ROOT.GetName] 내 산업화 및 기반 시설에 대한 막대한 투자를 가져올 것입니다. 하지만 우리 국민 중 일부는 식민 강대국들이 이 지역 내에서 영향력을 얻는 것을 경계하고 있습니다."
 PRS_whydah_purchase_colony_event.4.a: "식민지 회사 파트너십이 막대한 투자를 가져올 것입니다!"
 PRS_whydah_purchase_colony_event.4.b: "우리는 저 식민 강대국들을 믿을 수 없다! 거래는 없다!"
 PRS_whydah_purchase_colony_event.5.t: "[FROM.GetName]가 식민지 회사 파트너십을 수락하다!"
 PRS_whydah_purchase_colony_event.5.d: "[FROM.GetName]가 식민지 회사 파트너십의 조건과 이에 수반되는 조약에 동의했습니다. 이제 그들은 우리 식민지 영향권 내에 있습니다!"
 PRS_whydah_purchase_colony_event.5.a: "훌륭하다! 우리의 식민지 영향권이 성장한다!"
 PRS_whydah_purchase_colony_event.6.t: "[FROM.GetName]가 우리의 협상을 거부하다!"
 PRS_whydah_purchase_colony_event.6.d: "[FROM.GetName]가 식민지 회사 파트너십을 거절했으며, [1109.GetName]를 우리에게 판매하는 것도 거절했습니다."
 PRS_whydah_purchase_colony_event.6.a: "유감스럽군."
 PRS_GDC_purchase_colony_event.1.t: "[FROM.GetName]가 [1110.GetName] 구매를 요청하다"
 PRS_GDC_purchase_colony_event.1.d: "[1110.GetName]는 한때 옛 브란덴부르크 식민지였다가 우리에게 매각된 곳입니다. 아무래도 [FROM.GetName]가 식민지 야심을 다시 드러낸 것 같습니다. 식민지들은 유지비가 매우 비싸므로, 네덜란드 골드코스트의 일부를 매각하여 상당한 수익을 올릴 수 있습니다."
 PRS_GDC_purchase_colony_event.1.a: "[1110.GetName] 판매에만 동의한다."
 PRS_GDC_purchase_colony_event.1.b: "네덜란드 골드코스트 전체를 판매하겠다고 제안한다!"
 PRS_GDC_purchase_colony_event.1.c: "판매를 거부한다. 이 식민지들은 우리에게 쓸모가 있다."
 PRS_GDC_purchase_colony_event.2.t: "[FROM.GetName]가 [1110.GetName] 판매에 동의하다"
 PRS_GDC_purchase_colony_event.2.d: "[1110.GetName]는 한때 우리가 매각했던 옛 브란덴부르크 식민지였지만, 이제 다시 우리 식민지 영향권에 들어왔습니다. 하지만 이번 구매로 인해 많은 [HOL.GetAdjective] 민족주의자들이 본국으로 돌아가기로 결정했습니다."
 PRS_GDC_purchase_colony_event.2.a: "훌륭하다! 우리의 식민지 영향권이 성장한다!"
 PRS_GDC_purchase_colony_event.3.t: "[FROM.GetName]가 네덜란드 골드코스트 전체를 제안하다!"
 PRS_GDC_purchase_colony_event.3.d: "[1110.GetName]는 한때 우리가 매각했던 옛 브란덴부르크 식민지였지만, 이제 네덜란드 골드코스트 전체를 우리 식민지 영향권에 둘 수 있습니다."
 PRS_GDC_purchase_colony_event.3.a: "훨씬 좋군! 독일 골드코스트라니, 듣기 좋군!"
 PRS_GDC_purchase_colony_event.3.b: "[1110.GetName]에만 관심 있다고 전한다."
 PRS_GDC_purchase_colony_event.4.t: "[FROM.GetName]가 오직 [1110.GetName]만을 원합니다"
 PRS_GDC_purchase_colony_event.4.d: "[1110.GetName]가 [FROM.GetName]가 원하는 유일한 땅인 것 같습니다."
 PRS_GDC_purchase_colony_event.4.a: "그들이 요청한 것을 판매한다."
 PRS_GDC_purchase_colony_event.5.t: "[FROM.GetName]가 네덜란드 골드코스트 구매에 동의하다!"
 PRS_GDC_purchase_colony_event.5.d: "[FROM.GetName]가 네덜란드 골드코스트 전체를 구매하는 것에 관심을 보였습니다."
 PRS_GDC_purchase_colony_event.5.a: "훌륭하다! 이 판매로 막대한 돈을 벌 수 있을 것이다."
 PRS_GDC_purchase_colony_event.6.t: "[FROM.GetName]가 [1110.GetName] 판매를 거부하다!"
 PRS_GDC_purchase_colony_event.6.d: "[FROM.GetName]가 [1110.GetName] 판매를 거부했으며, 그들의 아프리카 식민지를 계속 보유하는 데 여전히 관심이 있습니다."
 PRS_GDC_purchase_colony_event.6.a: "유감스럽군."
 PRS_GDC_purchase_colony_event.7.t: "[FROM.GetName]가 네덜란드 골드코스트를 구매하다!"
 PRS_GDC_purchase_colony_event.7.d: "[FROM.GetName]가 [HOL.GetName]로부터 네덜란드 골드코스트를 구매했고, 이제 우리는 그들의 식민지 영향권에 속하게 되었습니다. 네덜란드 민족주의자들은 [HOL.GetName]로 돌아갔지만, 대부분은 남기로 결정했습니다."
 PRS_GDC_purchase_colony_event.7.a: "Achtung! 우리는 이제 독일 골드코스트다!"
 PRS_GDC_purchase_colony_event.8.t: "[FROM.GetName]가 [1110.GetName]를 구매하다!"
 PRS_GDC_purchase_colony_event.8.d: "[FROM.GetName]가 [HOL.GetName]로부터 [1110.GetName]를 구매했고, 이제는 [FROM.GetAdjective]의 식민지 영향권에 속하게 되었습니다. [ROOT.GetAdjective] 민족주의자들은 우리 영토에 재정착했습니다."
 PRS_GDC_purchase_colony_event.8.a: "이곳에 정착한 민족주의자들을 환영한다."
 french_senega_futa_toro_war.1.t: "푸타 토로 침공"
 french_senega_futa_toro_war.1.d: ""
 french_senega_futa_toro_war.1.a: "더 이상 지체할 수 없다! 프랑스를 위하여!"
 french_senega_futa_toro_war.1.b: "결과가 어떻든, 더 오래 준비해야 한다."
 french_senega_futa_toro_war.2.t: "프랑스령 세네갈이 침공 지원을 요청하다"
 french_senega_futa_toro_war.2.d: ""
 french_senega_futa_toro_war.2.a: "우리의 식민지 야심은 세네갈 해안에 머무르지 않을 것이다!"
 french_senega_futa_toro_war.2.b: "그들에게 보급품을 보내지만, 우리는 세네갈에 야심이 없다."
 french_senega_futa_toro_war.3.t: "프랑스가 참전을 거부하다!"
 french_senega_futa_toro_war.3.d: ""
 french_senega_futa_toro_war.3.a: "적어도 보급품이라도 도움이 될 것이다."
 french_senega_futa_toro_war.4.t: "프랑스가 참전하다!"
 french_senega_futa_toro_war.4.d: ""
 french_senega_futa_toro_war.4.a: "병사들을 집결시켜라! 우리는 버틸 것이다!"
 afr_regional_power_peace_treaty.2.t: "Force [FROM.GetName] into a Peace Treaty?"
 afr_regional_power_peace_treaty.2.d: ""
 afr_regional_power_peace_treaty.2.a: "We have shown them mercy and we have no desire for more war."
 afr_regional_power_peace_treaty.2.b: "We have shown them mercy, but they will pay for what they did!"
 afr_regional_power_peace_treaty.3.t: "[FROM.GetName] Forces Peace Treaty!"
 afr_regional_power_peace_treaty.3.d: ""
 afr_regional_power_peace_treaty.3.a: "We have no choice but to accept and pay reparations."
 afr_regional_power_peace_treaty.4.t: "[FROM.GetName]가 평화 조약에 동의하다!"
 afr_regional_power_peace_treaty.4.d: ""
 afr_regional_power_peace_treaty.4.a: "그들은 이런 전쟁을 시작한 대가로 배상금을 지불해야 할 것이다."
 afr_regional_power_peace_treaty_reparations.1.t: "[FROM.GetName]의 평화 조약이 끝났다!"
 afr_regional_power_peace_treaty_reparations.1.d: ""
 afr_regional_power_peace_treaty_reparations.1.a: "이제 우리 사이에는 깨지기 쉬운 평화가 존재한다."
 afr_regional_power_peace_treaty_reparations.2.t: "[FROM.GetName]의 평화 조약이 끝났다!"
 afr_regional_power_peace_treaty_reparations.2.d: ""
 afr_regional_power_peace_treaty_reparations.2.a: "이제 우리 사이에는 깨지기 쉬운 평화가 존재한다."
 afr_regional_power_peace_treaty.6.t: "[FROM.GetName]와의 평화 조약을 계속하시겠습니까?"
 afr_regional_power_peace_treaty.6.d: ""
 afr_regional_power_peace_treaty.6.a: "우리 사이에 평화와 번영이 계속되기를."
 afr_regional_power_peace_treaty.6.b: "가까운 미래에 전쟁을 추구할 수도 있다. 조약은 지금 끝낸다."
 afr_regional_power_peace_treaty.7.t: "[FROM.GetName]가 평화 조약을 계속하기를 원한다!"
 afr_regional_power_peace_treaty.7.d: ""
 afr_regional_power_peace_treaty.7.a: "우리 사이에 평화와 번영이 계속되기를."
 afr_regional_power_peace_treaty.8.t: "[FROM.GetName]가 평화 조약을 끝낸다!"
 afr_regional_power_peace_treaty.8.d: ""
 afr_regional_power_peace_treaty.8.a: "우리는 그들과의 임박한 전쟁을 준비해야 한다."
 afr_regional_power_peace_treaty.9.t: "[FROM.GetName] 평화 조약이 갱신되었다!"
 afr_regional_power_peace_treaty.9.d: ""
 afr_regional_power_peace_treaty.9.a: "그들은 이런 전쟁을 시작한 대가로 배상금을 지불해야 할 것이다."
 afr_regional_power_peace_treaty.10.t: "[FROM.GetName]가 평화 조약을 끝낸다!"
 afr_regional_power_peace_treaty.10.d: ""
 afr_regional_power_peace_treaty.10.a: "우리는 그들과의 임박한 전쟁을 준비해야 한다."