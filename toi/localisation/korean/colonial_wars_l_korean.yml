 PRS_purchase_brandenburg_colonies_category: "옛 브란덴부르크 식민지"
 PRS_purchase_brandenburg_colonies_category_desc: "브란덴부르크는 한때 아프리카 해안을 따라 몇 개의 식민지를 소유했습니다. 식민지 야심이 다시 불타오르면서, 이제 이 옛 식민지들을 구매하고 유지하기 위해 자금을 배정했습니다."
 PRS_focus_cpb_brandenburg_colonies_tooltip: "§G이전의 §!§Y브란덴부르크 식민지§!§G를 구매하는 것과 관련된 새로운 §!§Y결정§!§G이 해금됩니다.§!"
