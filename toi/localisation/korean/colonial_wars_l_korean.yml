 PRS_focus_cpb_kaabu_koba_company: "카아부의 독일-아프리카 회사"
 PRS_focus_cpb_kaabu_koba_company_desc: "개인 투자자들이 코바 구매에 관심을 보였습니다. 이로써 카아부 지역에 독일-아프리카 회사가 설립될 것입니다."
 PRS_focus_cpb_kaabu_koba_pitstop_tribal_tooltip: "§Y[1109.OWNER.GetName]§!와 §Y식민지 회사 파트너십§!을 설립하기 위해 협상합니다."
 PRS_focus_cpb_kaabu_koba_pitstop_tooltip: "§Y[1109.OWNER.GetName]§!와 §Y[1109.GetName]§!를 구매하기 위해 협상합니다."
