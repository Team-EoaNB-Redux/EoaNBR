 eoanb_bulgaria.9.a: "훌륭함"
 eoanb_bulgaria.10.t: "기르다프"
 eoanb_bulgaria.10.d: "기르다프의 창립 총회는 불가리아가 오스만 통치로부터 해방되고 불가리아 공국이 수립된 지 4년도 채 되지 않은 1881년 12월 1일에 열렸습니다. 루세는 다뉴브강의 주요 항구로서의 역할, 급속한 산업 발전, 그리고 강을 따라 중부 유럽과 잘 구축된 관계로 인해 번영했습니다. 하지만, 대부분의 사람들이 고리대금업자의 서비스를 이용하고 개인적으로 아는 사람들에게 저축을 맡겼기 때문에 은행 업무는 새로운 개념이었습니다. 후의 은행 이사 본초 보예프의 말에 따르면, 기르다프의 설립자들은 '고리대금업자로부터 주민들을 해방'시키고자 했습니다. 국가 전반의 자본 부족으로 인해, 기르다프가 제공하는 대출 금리는 그럼에도 불구하고 높았습니다. 고리대금업자의 20-30%가 넘는 금리에 비해 15-18%였습니다. 이 은행은 1882년 1월 1일 공식적으로 영업을 시작했습니다. 은행 이름은 창립 총회가 열렸던 루세의 기르다프 지역에서 따왔습니다."
 eoanb_bulgaria.10.a: "은행업의 시작"