 SHIP_REFIT_UPGRADE_TOOLTIP: "§HUpgrade Ship§!\n개량된 설계를 사용하도록 이 함선을 재정비하십시오."
 SHIP_REFIT_TOOLTIP_DELAYED: "대상 함선 설계를 선택한 후, 선택된 함선은 별도의 §HTask Force§!로 분리되어 재정비를 위해 인근 §HNaval Base§!로 복귀합니다. 재정비 중에는 생산 창에서 진행 상황을 추적할 수 있습니다.\n\n재정비가 완료되면 현재 §HTask Force§!로 돌아올 것입니다.\n\n§GShift + Click§!하여 여러 함선을 선택하십시오.\n§GCtrl + Click§!하여 함선 선택을 전환하십시오."
