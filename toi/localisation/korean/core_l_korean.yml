 NAVY_REPAIR_POLICY_SPLIT_DESC: "§YAllow to split§! 옵션은 가장 심하게 손상된 함선이 분리되어 인근 해군 기지로 수리를 위해 복귀하는 것을 허용하며, 나머지 임무 함대는 임무를 계속합니다.\n분리된 함선들은 귀환하는 동안 공격에 매우 취약합니다.\n수리가 완료되면 함선들은 할당된 임무 함대로 복귀할 것입니다.\n\n분리되는 함선의 수는 수리 우선순위 설정과 각 개별 함선의 손상 정도에 따라 달라집니다."
