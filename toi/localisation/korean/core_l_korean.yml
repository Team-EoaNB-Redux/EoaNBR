 NAVY_REPAIR_NOW_CANCEL_RETURN: "\n$FLEET|H$와(과) 복귀하여 다시 합류하십시오."
 ALL_TASK_FORCES_REPAIR_NOW: "§HRepair now!§!\n선택된 모든 임무 함대는 수리를 위해 홈 기지로 복귀할 것입니다.\n§GClick§!하여 보내십시오. 완전히 수리되면 현재 임무를 재개할 것입니다.\n§GCtrl+Click§!하여 보내십시오. 그 후에는 해군 기지에 머무를 것입니다."
 NAVY_REPAIR_NOW: "§HRepair now!§!\n임무 함대는 수리를 위해 인근 해군 기지로 복귀할 것입니다.\n§GClick§!하여 보내십시오. 완전히 수리되면 현재 임무로 돌아올 것입니다.\n§GCtrl+Click§!하여 보내십시오. 그 후에는 해군 기지에 머무를 것입니다."
 SHIP_REPAIR_NOW: "§HRepair now!§!\n함선은 별도의 임무 함대로 분리되어 수리를 위해 인근 해군 기지로 복귀할 것입니다.\n완전히 수리되면 현재 임무 함대로 돌아올 것입니다.\n§GClick§!하여 분리하십시오.\n§GShift+Click§!하여 여러 함선을 표시하고 §GShift§!를 놓을 때 하나의 임무 함대로 분리하십시오."
 SHIP_REPAIR_NOW_WITHOUT_DETACHING: "§HRepair now!§!\n§GClick§!하여 함선을 수리 대기열에 추가하십시오."
 SHIP_REFIT_TOOLTIP: "§HRefit Ships§!\n선택된 함선을 다른 호환 가능한 함선 설계로 재정비하십시오."
 SHIP_REFIT_NO_SHIPS_TOOLTIP: "§RNo ships are currently selected.§!"
