 SUPPLY_FLOW_DELAYED_DESC: "§HSupply Remaining§! indicates how much supply is provided to this province, and is made up of state supply and hubs within range. Hub range is affected by weather, ground conditions, infrastructure, railway level, and motorization. \n\n§HDivisions§! will consume provincial supply based on their supply weight. If their §HStored Supply§! is above the supply ratio provided in their location, they will consume from their internal store until stored supply is at the same level as the local supply.\n\nHold §GCtrl§! to show flow sources."
