l_korean:
 AFG_idea_afghan_splintering: "아프간 분리국가"
 AFG_idea_afghan_splintering_desc: "아프가니스탄은 두라니 제국이 붕괴한 후, 내분하는 두라니 잔당과 소규모 파슈툰 토후국들, 그리고 다양한 군벌들로 해체되었습니다. 1839년 영국의 침공 또한 도움이 되지 않았으며, 아프가니스탄은 계속해서 심각하게 분열된 상태였습니다. 그러다 카불의 바라크자이 통치자들이 돌아와 영국군을 몰아내고 권력을 공고히 하고 소규모 토후국들을 병합하기 시작했습니다. 이제 아프가니스탄 바라크자이 토후국이 주요 경쟁자로 남아 있는 몇몇 분리 국가만이 남았지만, 그럼에도 불구하고 아프가니스탄은 여전히 통일되지 못한 상태입니다."