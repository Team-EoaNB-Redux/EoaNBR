 GER_light_tank_equipment_1_short: "판처 I"
 GER_light_tank_equipment_1_desc: "판처 I은 1930년대 독일에서 생산된 경전차였습니다. 판처 I의 설계는 1932년에 시작되어 1934년에 대량 생산이 시작되었습니다. 독일군에게 기갑전 개념을 도입하기 위한 훈련용 전차로만 의도되었지만, 더 현대적인 전차의 부족으로 판처 I은 전투에서 광범위하게 사용되었습니다."
