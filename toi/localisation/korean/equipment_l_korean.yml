 GER_medium_tank_aa_equipment_1: "플랙판처 III 뫼벨바겐"
 GER_medium_tank_aa_equipment_1_short: "뫼벨바겐"
 GER_medium_tank_aa_equipment_1_desc: "닫았을 때 상자 모양의 포탑 때문에 뫼벨바겐(가구 운반차)이라는 별명이 붙었으며, 판처 III 전차의 차체로 제작되어 20mm 4연장포로 무장한 자주대공포였습니다."
 GER_medium_tank_aa_equipment_2: "플랙판처 IV 오스트빈트"
 GER_medium_tank_aa_equipment_2_short: "오스트빈트"
 GER_medium_tank_aa_equipment_2_desc: "플랙판처 IV '오스트빈트'(독일어: '동풍')는 판처 IV 전차에 기반한 자주대공포였습니다. 1944년에 초기 플랙판처 IV의 후계기로 개발되었습니다. 판처 IV의 포탑이 제거되고 3.7cm FlaK 43이 장착된 개방형 육각형 포탑으로 교체되었습니다. 폐쇄형 설계가 더 선호되었겠지만, 대포에서 발생하는 심한 연기 때문에 불가능했습니다."
