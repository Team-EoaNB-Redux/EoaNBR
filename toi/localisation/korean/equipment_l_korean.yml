l_english:
 both_cruisers_desc: "경순양함 - 경량 스크린 함정. 주 임무는 적 경량함으로부터 주력함을 보호하는 것이지만, 대형 함선에 피해를 줄 수 있는 강력한 어뢰도 발사할 수 있습니다.\n\n중순양함 - 꽤 유연한 대형 장갑 순양함. 대형 주력함을 건조할 여유가 없는 국가에게 좋은 선택입니다."
 convoy: "수송선단"
 convoy_desc: "상품과 자원의 국제 무역에 사용되는 수송선단. 또한 병력 수송 및 해상 침공 수행에도 사용됩니다."
 sh_battleship: "초중전함"
 sh_battleship_desc: "돈으로 살 수 있는 가장 큰 주포와 가장 강력한 장갑을 갖춘 가장 큰 주력함. 이러한 값비싼 투자는 소형 스크린 함의 적절한 지원을 받아야 합니다."
 light_airframe: "경량 기체"
 light_airframe_desc: "경량 기체 기반 항공기"
 medium_airframe: "중형 기체"
 medium_airframe_desc: "중형 기체 기반 항공기"
 heavy_airframe: "중량 기체"
 heavy_airframe_desc: "중량 기체 기반 항공기"
 ship_hull_light: "경량 선체"
 ship_hull_light_desc: "가장 가벼운 스크린 함정. 그 역할은 대형 함선을 방어하고 잠수함을 찾아 파괴하는 것입니다."
 jet_engines: "제트 엔진"
 JET_ENGINES_SPECIAL: "제트 엔진의 개발은 제트 추진 항공기 개발의 필수적인 전제 조건입니다. 이는 고급 항공기를 연구하기 전에 연구되어야 합니다."
 jet_engines_desc: "추진 기술의 혁신인 제트 엔진은 완전히 새로운 세대의 항공기 개발을 가능하게 할 것입니다."
 armored_car_equipment: "장갑차"
 armored_car_equipment_desc: "경량 장갑 바퀴형 차량. 정찰 및 저항 진압에 일반적으로 사용되지만, 더 무거운 무장을 장착할 수도 있습니다."
 convoy_1: "초기 수송선단"
 convoy_2: "강철 선체 수송선단"
 convoy_3: "장갑 수송선단"
 convoy_1_desc: "목재 선체를 가진 초기 수송선단."
 convoy_2_desc: "수송을 위해 설계되고 튼튼한 강철 선체로 제작된 전용 수송선."
 convoy_3_desc: "우리의 수송선단 설계는 업데이트되어, 전시에 병력 수송 또는 무역 역할을 수행하는 선박들은 이제 훨씬 더 강하며 자체적으로 몇 개의 더 많은 함포를 자랑합니다."
 motorized_equipment: "차량화"
 motorized_equipment_desc: "병력을 전장으로 수송하고 전장에서 이동시키는 데 사용되는 트럭 및 기타 차량."
 motorized_equipment_1: "초기 차량화"
 motorized_equipment_1_desc: "보병의 차량화는 군대의 기계화를 향한 첫 단계입니다. 민수용 트럭은 병력 수송, 대포 견인, 장비 및 보급품 운반과 같은 군사적 용도로 쉽게 개조할 수 있습니다. 이는 행군에 의존할 보병 부대의 전략적 기동성을 크게 향상시킵니다."
 motorized_equipment_2: "차량화"
 motorized_equipment_2_short: "차량화 II"
 motorized_equipment_2_desc: ""
 motorized_equipment_3: "개량 차량화"
 motorized_equipment_3_short: "차량화 III"
 motorized_equipment_3_desc: ""
 motorized_equipment_4: "고급 차량화"
 motorized_equipment_4_short: "차량화 IV"
 motorized_equipment_4_desc: ""
 support_equipment_short: "지원 장비."
 support_equipment: "지원 장비"
 support_equipment_desc: "무전기, 지프, 부교 및 병력 지원에 사용되는 기타 장비."
 support_equipment_1: "빅토리아 시대 지원 장비"
 support_equipment_1_desc: "야전삽, 탄약 주머니, 수통, 의약품과 같은 군사 장비."
 support_equipment_2: "산업화 지원 장비"
 support_equipment_2_desc: "야전삽, 탄약 주머니, 수통, 의약품과 같은 군사 장비 - 산업적으로 생산되어 이전보다 품질이 더 우수합니다. 일부 병사들은 심지어 다이너마이트와 같은 특수 장비도 갖출 수 있습니다."
 support_equipment_3: "대전 지원 장비"
 support_equipment_3_desc: "야전삽, 탄약 주머니, 수통, 의약품과 같은 군사 장비. 기술 발전 덕분에 이제 방독면, 포켓 카메라 또는 수류탄과 같은 현대적인 장비도 포함됩니다."  infantry_equipment_rifle: "소총 장비"
 infantry_equipment_rifle_desc: "최첨단 소총 및 총검 기술로 무장한 병사들."
 cavalry_equipment: "기병 장비"
 cavalry_equipment_desc: "평균적인 기병 전사를 위한 말, 안장 및 탑승 보병 장비."
 cuirasse_equipment_0: "퀴라스 장비"
 cuirasse_equipment_0_desc: "검 공격, 권총 사격, 심지어 저위력 소총 사격까지 막아내도록 설계된 강철 등판 및 흉갑."
 uniform_equipment: "제복 장비"
 uniform_equipment_desc: "군인에게 지급되어야 하는 헬멧, 갑옷, 군화 및 여러 생존 장비."
 light_cavalry: "경량 기병"
 light_cavalry_desc: "전장을 정찰하고 적의 주의를 분산시키는 데 사용되는 빠르고 민첩한 기병."
 dragoon: "용기병"
 dragoon_desc: "용기병은 전통적인 기병의 의미로 사용되며, 기동 위치에서 보병 대열을 돌격하고 큰 타격을 입힙니다."
