 ship_fire_control_system: "사격 통제 시스템"
 ship_fire_control_system_desc: "함포 사격을 통제하고 지시하기 위한 함선 내 시스템입니다."
 fire_control_system_0: "까마귀 둥지"
 fire_control_system_0_short: "초기 사격 통제 시스템 I"
 fire_control_system_0_desc: "까마귀 둥지는 고대부터 함선에서 사용되었습니다. 사격 통제에는 큰 도움이 되지 않을 수 있지만, 적 함선을 더 쉽게 발견하는 데 도움을 줍니다. 물론 함선 자체를 더 쉽게 탐지되게 할 수도 있습니다."
 fire_control_system_2: "까마귀 둥지 + 망원 조준경"
 fire_control_system_2_short: "초기 사격 통제 시스템 II"
 fire_control_system_2_desc: "함선에 망원 조준경 장치를 추가하면 사격을 지시하고 다른 함선을 발견하기가 더 쉬워집니다."
 fire_control_system_3: "간단한 광학 거리 측정기"
 fire_control_system_3_short: "초기 사격 통제 시스템 III"
 fire_control_system_3_desc: "이전의 사격 통제 및 관측 방법과 함께 거리 측정기를 사용하면 적 함선을 일관되게 발견하고 명중하기가 훨씬 쉬워집니다."
 fire_control_system_4: "간단한 기계식 사격 통제 시스템"
 fire_control_system_4_short: "사격 통제 시스템 I"
 fire_control_system_4_desc: "더 안정적이고 유연하며 현대적인 사격 통제 시스템을 구축하기 위해 기계 장치를 사용하는 것은 기술이 발전함에 따라 올바른 선택임이 분명할 것입니다."
 fire_control_system_5: "지휘 통제 시스템"
 fire_control_system_5_short: "사격 통제 시스템 II"
 fire_control_system_5_desc: "해군 함선에 중앙 집중식 지휘 통제 시스템을 도입하여 함포 사격을 지원함으로써, 해군 함포 사격의 조직과 피해를 줄 수 있는 능력을 크게 향상시킬 수 있습니다."
