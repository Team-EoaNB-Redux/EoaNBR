 modern_tank_equipment_2_desc: "현대 전차는 정찰, 지원, 심지어 최전선 전차와 같은 여러 역할을 수행할 수 있는 민첩한 다목적 전차입니다."
 GER_modern_tank_equipment_1: "E-50 슈탄다르트판처"
 GER_modern_tank_equipment_1_short: "E-50"
 GER_modern_tank_equipment_1_desc: "엔트비클룽(Entwicklung) 시리즈는 독일이 전쟁 후반에 표준화된 전차 설계 시리즈를 생산하려는 시도였습니다. 6가지 다른 중량 등급에 대한 표준 설계가 있을 예정이었습니다. E-50 슈탄다르트판처는 판터 및 티거 전차 시리즈와 해당 전차를 기반으로 한 개조형을 대체하는 표준 중형 전차로 의도되었습니다."
