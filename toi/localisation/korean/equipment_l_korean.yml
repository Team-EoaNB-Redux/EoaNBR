 medium_tank_destroyer_equipment: "중형 구축전차"
 medium_tank_destroyer_equipment_short: "중형 구축전차"
 medium_tank_destroyer_equipment_desc: "구축전차는 포탑 대신 고정된 거대한 주포를 장착한 전차입니다. 중형 구축전차는 중형 전차 차체를 기반으로 하므로 기동성이 뛰어나고 상당한 화력을 갖추고 있습니다."
 medium_tank_destroyer_equipment_1: "중형 구축전차 I"
 medium_tank_destroyer_equipment_1_short: "중형 구축전차 I"
 medium_tank_destroyer_equipment_1_desc: "구축전차는 포탑 대신 고정된 거대한 주포를 장착한 전차입니다. 중형 구축전차는 중형 전차 차체를 기반으로 하므로 기동성이 뛰어나고 상당한 화력을 갖추고 있습니다."
 medium_tank_destroyer_equipment_2: "중형 구축전차 II"
 medium_tank_destroyer_equipment_2_short: "중형 구축전차 II"
 medium_tank_destroyer_equipment_2_desc: "구축전차는 포탑 대신 고정된 거대한 주포를 장착한 전차입니다. 중형 구축전차는 중형 전차 차체를 기반으로 하므로 기동성이 뛰어나고 상당한 화력을 갖추고 있습니다."
 medium_tank_destroyer_equipment_3: "중형 구축전차 III"
 medium_tank_destroyer_equipment_3_short: "중형 구축전차 III"
 medium_tank_destroyer_equipment_3_desc: "구축전차는 포탑 대신 고정된 거대한 주포를 장착한 전차입니다. 중형 구축전차는 중형 전차 차체를 기반으로 하므로 기동성이 뛰어나고 상당한 화력을 갖추고 있습니다."
 GER_medium_tank_destroyer_equipment_1: "슈투름게슈츠 III"
 GER_medium_tank_destroyer_equipment_1_short: "StuG III"
 GER_medium_tank_destroyer_equipment_1_desc: "슈투름게슈츠 III 돌격포는 제2차 세계 대전 중 독일에서 가장 많이 생산된 장갑 전투 차량이었습니다. 입증된 판처 III 전차의 차체를 기반으로 제작되었습니다. 초기에는 보병 지원을 위한 기동성 있고 장갑화된 경량포로 의도되었으나, StuG는 지속적으로 개조되어 구축전차로 널리 사용되었습니다."
 GER_medium_tank_destroyer_equipment_2: "야크트판처 IV"
 GER_medium_tank_destroyer_equipment_2_short: "야크트Pz IV"
 GER_medium_tank_destroyer_equipment_2_desc: "야크트판처 IV는 판처 및 SS 판처 사단의 대전차 부대에서 복무했습니다. 노르망디, 벌지 전투, 동부 전선에서 싸웠습니다. 그들은 매우 성공적인 구축전차였지만, 대부분의 구축전차가 그랬듯이 전차나 돌격포의 대체품으로 역할 외에 사용될 때는 성능이 좋지 않았습니다. 그러나 전쟁 후반부에는 종종 다른 대안이 없었기 때문에 전차 대체품으로 점점 더 많이 사용되었습니다."
 GER_medium_tank_destroyer_equipment_3: "야크트판터"
 GER_medium_tank_destroyer_equipment_3_short: "야크트판터"
 GER_medium_tank_destroyer_equipment_3_desc: "야크트판터(독일어: '사냥하는 판터')는 제2차 세계 대전 중 나치 독일이 판터 전차의 차체를 기반으로 제작한 구축전차였습니다. 전쟁 후반(1944년)에 실전에 배치되어 동부 및 서부 전선에서 복무했습니다. 야크트판터는 티거 II의 매우 강력한 8.8cm PaK 43 주포와 판터 차체의 특징적인 뛰어난 장갑 및 서스펜션을 결합했지만, 전쟁 후반 독일의 전반적인 열악한 상황으로 인해 생산량이 적고 부품 부족, 승무원 훈련 부족 등의 문제에 시달렸습니다."
