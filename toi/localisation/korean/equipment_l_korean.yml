 GER_light_tank_equipment_3: "VK1602 레오파르트"
 GER_light_tank_equipment_3_short: "레오파르트"
 GER_light_tank_equipment_3_desc: "VK1602 레오파르트는 1942년 설계된 독일의 예정된 정찰 차량이었습니다. 75mm Kwk 41로 차량을 무장할 계획이었으나, 50mm 소형 대포로 변경되었습니다. VK 1602는 판터 중형 전차의 영향을 받아 경사진 전면 장갑을 가졌습니다. 야지 성능을 높이기 위해 VK 1602에는 350mm 폭의 궤도가 장착되었습니다."
