 medium_tank_equipment_3: "중형 전차 III"
 medium_tank_equipment_3_short: "중형 전차 III"
 medium_tank_equipment_3_desc: "중형 전차는 적절하게 민첩한 다목적 전차로, 정찰, 지원 또는 최전선 전차와 같은 여러 역할을 수행할 수 있습니다."
 GER_medium_tank_equipment_3: "판처캄프바겐 V 판터"
 GER_medium_tank_equipment_3_short: "판터"
 GER_medium_tank_equipment_3_desc: "판터는 1943년 중반부터 1945년 유럽 전쟁 종료까지 독일이 제2차 세계 대전에서 운용한 중형 전차의 일반적인 이름입니다. 러시아 T-34에 대한 대응책이자 판처 III 및 판처 IV의 대체품으로 의도되었습니다. 후자를 완전히 대체하지는 못했지만, 전쟁 종료까지 이들과 더 무거운 티거 전차들과 함께 운용되었습니다. 판터의 뛰어난 화력, 기동성, 방어력의 조합은 다른 국가들의 종전 후 및 전후 전차 설계의 벤치마크가 되었으며, 제2차 세계 대전 최고의 전차 중 하나로 평가받습니다."
