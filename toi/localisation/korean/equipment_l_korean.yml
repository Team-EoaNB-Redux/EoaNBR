 heavy_tank_equipment: "중전차"
 heavy_tank_equipment_desc: "중전차는 적 전차와 요새를 파괴하도록 설계된 거대한 장갑 괴물입니다."
 heavy_tank_equipment_1: "중전차 I"
 heavy_tank_equipment_1_short: "중전차 I"
 heavy_tank_equipment_1_desc: "중전차는 적 전차와 요새를 파괴하도록 설계된 거대한 장갑 괴물입니다."
 GER_heavy_tank_equipment_1: "그로스트락터"
 GER_heavy_tank_equipment_1_short: "그로스트락터"
 GER_heavy_tank_equipment_1_desc: "그로스트락터는 독일에서 더 무거운 전차를 개발하기 위한 일련의 시제품이었습니다. 제1차 세계 대전 후, 독일은 베르사유 조약에 의해 군사 개발이 제한되었지만, '트락터'라는 이름으로 비밀 프로그램이 장갑 군용 차량과 포병을 개발하고 있었습니다."
