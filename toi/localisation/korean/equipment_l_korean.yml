 amphibious_mechanized_equipment: "수륙양용 기계화 장비"
 amphibious_mechanized_equipment_short: "암트랙"
 amphibious_mechanized_equipment_desc: "수륙양용 트랙터, 즉 암트랙은 해병대가 장갑 보호 하에 해변에 상륙할 수 있도록 합니다. 그러나 이는 낮은 연료 효율성이라는 단점을 수반합니다."
 amphibious_mechanized_equipment_1: "기본 수륙양용 트랙터"
 amphibious_mechanized_equipment_1_short: "기본 암트랙"
 amphibious_mechanized_equipment_1_desc: "수륙양용 트랙터, 즉 암트랙은 해병대가 장갑 보호 하에 해변에 상륙할 수 있도록 합니다. 그러나 이는 낮은 연료 효율성이라는 단점을 수반합니다."
 amphibious_mechanized_equipment_2: "개량 수륙양용 트랙터"
 amphibious_mechanized_equipment_2_short: "개량 암트랙"
 amphibious_mechanized_equipment_2_desc: "이 암트랙은 해변에서 더 쉽게 하역할 수 있는 후방 경사로와 같은 몇 가지 개선 사항을 기본 버전보다 특징으로 합니다."
 amphibious_tank_equipment: "수륙양용 전차"
 amphibious_tank_equipment_short: "수륙양용 전차"
 amphibious_tank_equipment_1: "기본 수륙양용 전차"
 amphibious_tank_equipment_2: "개량 수륙양용 전차"
 amphibious_tank_equipment_desc: "물 위로 이동할 수 있도록 개조된 전차입니다. 다른 전차들보다 상륙 작전과 강 건너기에 훨씬 뛰어나지만, 연료 효율성이 떨어집니다."
 amphibious_tank_equipment_1_desc: "기본적으로 부유할 수 있도록 개조된 경전차로, 해안 교두보를 확보하는 부대에 화력 지원을 제공합니다."
 amphibious_tank_equipment_2_desc: "물 위로 이동할 수 있도록 개조된 중형 전차입니다. 추가된 다용도성과 기동성은 연료 효율성 감소라는 단점을 수반합니다."
 amphibious_tank_equipment_3: "고급 수륙양용 전차"
 amphibious_tank_equipment_3_desc: "물 위로 이동할 수 있도록 개조된 중형 전차입니다. 추가된 다용도성과 기동성은 연료 효율성 감소라는 단점을 수반합니다."
