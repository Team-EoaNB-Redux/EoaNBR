 GER_light_tank_artillery_equipment_1: "슈투름판처 I 비손"
 GER_light_tank_artillery_equipment_1_short: "비손"
 GER_light_tank_artillery_equipment_1_desc: "차량화 보병 연대의 보병포 중대에 배정된 견인포는 전투 중 전차를 따라가는 데 어려움을 겪었습니다. 가장 쉬운 해결책은 예비 전차 차체를 개조하여 전투에 투입하는 것이었습니다. 비손의 경우, 판처 I의 차체를 사용합니다."
