 light_tank_aa_equipment_desc: "대공포는 주로 적기를 격추하도록 설계되었지만, 빠른 사격이 가능한 대포는 지상 목표물에도 효과적일 수 있습니다. 이 모델은 경전차 차체에 장착됩니다."
