 gw_armored_car_equipment_desc: "상업용 차량에 얇은 강판을 덧댄 것과 다름없는 간단한 장갑차."
 iw_armored_car_equipment: "전간기 장갑차"
 iw_armored_car_equipment_desc: "이전의 장갑차들이 얇은 강판을 덧댄 간단한 상업용 모델이었다면, 이 모델은 처음부터 장갑과 경무장을 탑재하도록 설계되었습니다."
 armored_car_equipment_1: "기본형 장갑차"
 armored_car_equipment_1_desc: "개선된 내부 배치와 추가 탄약 적재 공간으로 더욱 효과적인 장갑차를 만듭니다."
 armored_car_equipment_2: "개량형 장갑차"
 armored_car_equipment_2_desc: "전장의 변화는 적의 경량 부대를 격파하고 보고를 위해 귀환할 수 있도록 훨씬 더 무거운 무장과 두꺼운 장갑을 요구합니다."
 armored_car_equipment_3: "고급형 장갑차"
 armored_car_equipment_3_desc: "전장의 변화는 적의 경량 부대를 격파하고 보고를 위해 귀환할 수 있도록 훨씬 더 무거운 무장과 두꺼운 장갑을 요구합니다."
 armored_car_at_equipment: "대전차 장갑차"
 armored_car_at_equipment_desc: "우리의 경량 기계화 부대는 언젠가 적 전차 부대와 접촉하게 될 것입니다. 특별한 대전차 변형을 개발하는 것은 그들에게 싸울 기회를 줄 것입니다."
