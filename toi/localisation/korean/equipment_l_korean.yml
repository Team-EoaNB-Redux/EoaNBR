 GER_medium_tank_equipment_2_desc: "보병 지원 전차로 설계된 판처 IV는 원래 적 기갑 부대와 교전하도록 의도되지 않았습니다. 그 역할은 더 가벼운 판처 III이 수행했습니다. 그러나 전전 교리의 결함이 드러나고 소련 T-34 전차에 직면하면서, 판처 IV는 점차 구식이 되어가는 사촌의 대전차 역할을 맡게 되었습니다. 제2차 세계 대전에서 가장 널리 제조되고 배치된 독일 전차인 판처 IV는 다른 많은 전투 차량의 기반으로 사용되었습니다."
