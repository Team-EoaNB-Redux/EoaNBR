 ship_hull_corvette: "코르벳함"
 ship_hull_corvette_desc: "대형 함선을 위한 소형 포대 및 엄호 역할을 하는 작은 유형의 군함입니다."
 ship_hull_corvette_0: "초기 코르벳함 선체"
 ship_hull_corvette_0_desc: "돛의 시대에서 온 초기 코르벳함 선체입니다."
 ship_hull_corvette_1: "1857년형 코르벳함 선체"
 ship_hull_corvette_1_desc: "증기 엔진을 장착할 수 있도록 개선된 기존 코르벳함 선체입니다."
 ship_hull_corvette_2: "1860년형 코르벳함 선체"
 ship_hull_corvette_2_desc: "증기 추진 기술의 성숙에서 얻은 교훈을 활용하도록 설계된 기존 코르벳함 선체의 개선형입니다. 이 더 큰 함선들은 나무 선체에 내장된 철제 보강재 덕분에 더 큰 무장을 장착할 수 있습니다."
 ship_hull_corvette_3: "1868년형 철갑 코르벳함 선체"
 ship_hull_corvette_3_desc: "기존 코르벳함 선체의 개선형입니다. 이 선체는 철제 보강재를 광범위하게 사용하여 이 작은 함선들을 매우 강력하게 만듭니다."
 ship_hull_corvette_4: "1872년형 철제 코르벳함 선체"
 ship_hull_corvette_4_desc: "기존 코르벳함 선체의 개선형입니다. 이 선체는 갑판에만 나무를 사용하고 전적으로 철로 만들어진 최초의 선체이지만, 이 철제 선체는 장갑으로 사용하기에는 여전히 너무 얇습니다."
 ship_hull_corvette_5: "1877년형 강철 코르벳함 선체"
 ship_hull_corvette_5_desc: "기존 코르벳함 선체의 개선형입니다. 이 선체는 주 선체 판재로 강철을 사용하고 철은 보강재로만 사용하는(갑판에만 나무를 사용하는) 최초의 선체입니다. 강철 선체는 장갑으로 사용하기에는 여전히 너무 얇지만, 이제는 제한된 장갑 설치를 수용할 수 있을 만큼 충분히 강력합니다."
