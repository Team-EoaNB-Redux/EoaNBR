 GER_mechanized_equipment_1_short: "Sd.Kfz. 11"
 GER_mechanized_equipment_1_desc: "Sd.Kfz. 11 (존더크라프트파르초이크 - 특수 동력 차량)은 제2차 세계 대전에서 매우 광범위하게 사용된 독일의 반궤도 차량이었습니다. 대포나 트레일러를 견인하는 것 외에 8명의 병력을 수송할 수 있었습니다."
