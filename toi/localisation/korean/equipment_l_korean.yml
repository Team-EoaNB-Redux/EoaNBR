 ship_engine_gunboat: "건보트 함선 엔진"
 ship_engine_gunboat_desc: "건보트에 사용되는 함선 엔진."
 ship_engine_gunboat_0: "12 마력 건보트 엔진"
 ship_engine_gunboat_0_short: "건보트 엔진 I"
 ship_engine_gunboat_0_desc: "12 마력 건보트 엔진. 1830년대와 1840년대에 설계된 이 초기 실험적인 인력 또는 바람 없이 함선에 연료를 공급하는 방식은 매우 비효율적이고 느립니다."
 ship_engine_gunboat_1: "300 마력 건보트 엔진"
 ship_engine_gunboat_1_short: "건보트 엔진 II"
 ship_engine_gunboat_1_desc: "300 마력 건보트 엔진. 증기 기관 기술과 외륜 동력 전달의 급속한 발전으로 이 엔진의 출력을 크게 증가시키고 추진 능력을 향상시킬 수 있었습니다."
 ship_engine_gunboat_2: "750 마력 건보트 엔진"
 ship_engine_gunboat_2_short: "건보트 엔진 III"
 ship_engine_gunboat_2_desc: "750 마력 건보트 엔진. 가속 증기 엔진을 사용하고 추진 중 운동 에너지 손실을 최소화하여 더 많은 양의 출력을 달성할 수 있습니다."
 ship_engine_gunboat_3: "1,800 마력 건보트 엔진"
 ship_engine_gunboat_3_short: "건보트 엔진 IV"
 ship_engine_gunboat_3_desc: "1,800 마력 건보트 엔진. 이 엔진은 이전 모델보다 훨씬 효율적일 뿐만 아니라, 처음으로 증기 동력 단일 스크류로 함선을 추진할 수 있게 합니다."
 ship_engine_gunboat_4: "2,000 마력 건보트 엔진"
 ship_engine_gunboat_4_short: "건보트 엔진 V"
 ship_engine_gunboat_4_desc: "2,000 마력 건보트 엔진. 증기 엔진 기술의 발전으로 더 크고 강력한 엔진이 가능해졌지만, 순전히 동력만을 추구하는 것은 무의미해지는 지점에 도달하고 있습니다. 적어도 건보트의 경우에는 말입니다."
 ship_engine_gunboat_5: "2,200 마력 건보트 엔진"
 ship_engine_gunboat_5_short: "건보트 엔진 VI"
 ship_engine_gunboat_5_desc: "2,200 마력 건보트 엔진. 예상했던 대로, 건보트 엔진 개발은 엔진 동력보다는 주로 신뢰성과 효율성에 중점을 두게 되었습니다. 이 엔진은 우리 과학자들이 이 두 가지 영역을 모두 충족시키기 위해 내놓은 기술적 경이로움입니다."
 ship_engine_gunboat_6: "2,300 마력 건보트 엔진"
 ship_engine_gunboat_6_short: "건보트 엔진 VII"
 ship_engine_gunboat_6_desc: "2,300 마력 건보트 엔진. 증기 터빈의 개발로 증기 추진의 효율성이 다시 한번 증가했지만, 새롭게 발견된 가솔린 연소 엔진의 개발은 이 기술의 종말을 곧 가져올 수도 있습니다. 그러나 이 엔진은 여전히 증기로 작동하며, 인상적인 동력을 자랑합니다."
 ship_engine_gunboat_7: "2,500 마력 건보트 엔진"
 ship_engine_gunboat_7_short: "건보트 엔진 VIII"
 ship_engine_gunboat_7_desc: "2,500 마력 건보트 엔진. 건보트 엔진에 석유 연소 엔진을 통합하려는 초기 시도가 성공하여, 여전히 증기로 작동하면서도 특히 강력하고 신뢰할 수 있는 이 엔진이 탄생했습니다."
 ship_armor_gunboat_hardwood_0: "경목 장갑 I"
