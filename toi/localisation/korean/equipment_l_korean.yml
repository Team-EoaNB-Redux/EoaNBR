 GER_gw_tank_equipment: "라이히트트락터"
 GER_gw_tank_equipment_short: "라이히트트락터"
 GER_gw_tank_equipment_desc: "라이히트트락터는 독일의 실험용 전차였습니다. 제1차 세계 대전 후, 독일은 베르사유 조약에 의해 군사 개발이 제한되었지만, '트락터'라는 이름으로 비밀 프로그램이 장갑 군용 차량과 포병을 개발하고 있었습니다."
