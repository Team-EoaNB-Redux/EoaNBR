 motorized_rocket_equipment_1_desc: "이러한 다연장 로켓 발사기는 재래식 포병보다 목표 지역에 폭발물을 더 빠르게 전달하지만, 정확도가 낮고 재장전 시간이 더 길게 필요합니다. 트럭에 장착되어 이 버전은 적이 반격하기 전에 공격을 시작하고 위치를 변경할 수 있습니다."
