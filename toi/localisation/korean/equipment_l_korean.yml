 medium_tank_equipment: "중형 전차"
 medium_tank_equipment_desc: "중형 전차는 적절하게 민첩한 다목적 전차로, 정찰, 지원 또는 최전선 전차와 같은 여러 역할을 수행할 수 있습니다."
 medium_tank_equipment_1: "중형 전차 I"
 medium_tank_equipment_1_short: "중형 전차 I"
 medium_tank_equipment_1_desc: "중형 전차는 적절하게 민첩한 다목적 전차로, 정찰, 지원 또는 최전선 전차와 같은 여러 역할을 수행할 수 있습니다."
 GER_medium_tank_equipment_1: "판처캄프바겐 III"
 GER_medium_tank_equipment_1_short: "판처 III"
 GER_medium_tank_equipment_1_desc: "일찍이 1934/35년에 하인츠 구데리안 장군은 미래 독일 기갑 사단의 가장 많은 장비가 될 두 가지 기본 유형을 구상했습니다. 첫 번째 차량은 대전차포와 두 정의 기관총으로 무장하고, 두 번째 차량은 더 큰 구경의 포로 무장한 지원 차량이 될 예정이었습니다. 첫 번째는 결국 판처캄프바겐 III으로 알려졌고, 이는 전차 대대의 세 경량 중대를 위한 표준 전차가 될 예정이었습니다. 두 번째는 판처캄프바겐 IV로 알려졌습니다."
