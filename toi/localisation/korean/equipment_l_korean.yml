 gw_tank_equipment: "대전차"
 gw_tank_equipment_short: "대전차"
 gw_tank_equipment_desc: "제1차 세계 대전의 전차는 서부 전선의 참호전 교착 상태를 타개하는 수단으로 영국과 프랑스에 의해 독립적으로, 그리고 동시에 개발되었습니다. '탱크'라는 이름은 개발 초기 단계에서 영국의 보안 조치로, 그 목적을 숨기기 위해 채택되었습니다. 초기 전차는 기관총과 소형 대포로 무장했으며, 느리게 움직였고, 소화기 사격만 막을 수 있을 정도의 장갑을 갖추었습니다."
