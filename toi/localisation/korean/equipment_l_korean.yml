 twelve_frigate: "1812년형 프리깃"
 twelve_frigate_desc: "더 무거운 프리깃 설계."
 foureight_frigate: "1848년형 프리깃"
 foureight_frigate_desc: "이 프리깃은 일부가 장갑으로 보호되어 있어 치명적인 지점을 뚫기 어렵습니다."
 fivesix_frigate: "1856년형 프리깃"
 fivesix_frigate_desc: "이 프리깃은 1848년형보다 더 빠르게 항해할 수 있고 더 민첩합니다."
 sixone_monitor: "1861년형 모니터함"
 sixone_monitor_desc: "이 함선 설계는 비교적 작고 빠르지만, 중무장을 탑재합니다."
 sixone_frigate: "철갑함"
 sixone_coastal: "1861년형 건보트"
 sixone_coastal_desc: "건보트는 해상에서 자체적으로 방어할 수 있을 뿐만 아니라 해안 포격으로 지상 전투를 지원할 수도 있습니다. 중포를 탑재합니다."
 sixfive_monitor: "1865년형 모니터함"
 sixfive_monitor_desc: "1861년형 모니터함의 개량형으로, 더 많은 화력과 더 튼튼한 선체를 갖추고 있습니다."
 sixfive_cruiser: "1865년형 순양함"
 sixfive_cruiser_desc: "빠르고 유연하며, 전투 안팎에서 여러 가지 임무를 수행하도록 설계된 새로운 함선 설계."
 sixfive_frigate: "1865년형 증기 코르벳함"
 sixfive_frigate_desc: "이 코르벳 설계는 증기 엔진을 사용하여 이전에 도달할 수 없었던 속도를 달성합니다. 이는 함선을 더욱 민첩하게 만듭니다."
 sixfive_coastal: "1865년형 건보트"
 sixfive_coastal_desc: "1861년형 건보트의 개량형으로, 해전과 해안 포격을 위해 더 많은 대포를 장착했습니다."
 sloop: "슬루프 전함"
 sloop_desc: "단 하나의 함포 갑판만 있는 함선 설계입니다. 매우 다재다능하며 해군에서 다양한 역할을 수행할 수 있습니다."
 seventy_corvette: "1870년형 코르벳함"
 seventy_corvette_desc: "연안 경비 및 고속 공격을 위해 설계된 함선입니다. 매우 민첩합니다."
 seventy_frigate: "1870년형 증기 프리깃"
 seventy_frigate_desc: "개량된 증기 프리깃으로, 더욱 강력한 추진력과 더 높은 화력을 갖추고 있습니다."
 seventy_torpedo: "1870년형 어뢰정"
 seventy_torpedo_desc: "새로운 설계: 전투에 어뢰를 싣고 가는 작고 빠른 함선입니다. 장갑이 매우 두껍지는 않지만, 예상치 못한 공격을 가하면 전함을 쉽게 침몰시킬 수 있습니다."
 category_cavalry: "기병"
 category_victorian_cavalry: "빅토리아 시대 기병"
 category_ranged_cavalry: "원거리 기병"
 machine_gun_company: "개틀링 건 중대"
 balloon_equipment: "풍선 장비"
 balloon_equipment_desc: "위에서 지역을 정찰하기 위해 설계된 풍선과 이를 수리 및 유지하는 데 필요한 장비."
 balloon_equipment_0: "초기 정찰 풍선"
 balloon_equipment_0_desc: "간단한 정찰 임무에 사용된 초기 풍선입니다."
 balloon_equipment_1: "정찰 풍선"
 balloon_equipment_1_desc: "더 쉽고 멀리 떠오르므로 더 나은 정찰을 제공하는 기존 정찰 풍선의 개량형입니다."
 early_armor_train: "장갑 열차"
 early_armor_train_desc: "인근에 철도가 있는 경우 지원을 제공하도록 설계된 장갑 열차."
 early_armor_train_0: "초기 장갑 열차"
 early_armor_train_0_desc: "장갑 열차는 충분한 철도 인프라가 있는 지역에서 사용될 수 있으며, 화력 지원을 통해 전진하는 보병 중대에 상당한 지원을 제공할 수 있습니다. 또한 심한 공격을 받는 중에도 보병을 안전하게 철도를 따라 수송할 수 있도록 개조될 수 있습니다."
 zeppelin_equipment: "제플린"
 zeppelin_equipment_desc: "전략 폭격을 위해 사용되는 이동식 항공 기지."
 zeppelin_equipment_0: "초기 제플린"
 zeppelin_equipment_0_desc: "전략 폭격을 위해 사용된 초기 이동식 항공 기지."
 armor_equipment_bicycle: "자전거"
 armor_equipment_bicycle_desc: "페달 구동 자전거는 훨씬 더 에너지 효율적인 이동을 가능하게 합니다. 전령이나 전신선과 같은 통신 인프라 없이 전장 곳곳에 메시지를 전달하는 데 사용될 수 있습니다."
 armor_equipment_bicycle_0: "자전거"
 armor_equipment_bicycle_0_desc: "경량 프레임, 페달 구동 자전거입니다. 에너지 효율적인 이동을 가능하게 합니다."
 armor_equipment_motorcycle: "오토바이"
 armor_equipment_motorcycle_0_desc: "내연기관으로 구동되는 오토바이입니다. 빠른 이동을 가능하게 하며, 전보와 같은 기술 없이 메시지를 전달하는 데 유용합니다."
 armor_equipment_motorcycle_0: "초기 오토바이"
 armor_equipment_motorcycle_1: "오토바이 II"
 armor_equipment_motorcycle_1_desc: "내연기관으로 구동되는 이륜 오토바이입니다. 전장을 따라 빠르게 이동할 수 있으므로 메시지 전달이나 정찰 임무 수행에 유용합니다."
 armor_equipment_motorcycle_2: "오토바이 III"
 armor_equipment_motorcycle_2_desc: "내연기관으로 구동되는 이륜 오토바이입니다. 전장을 따라 빠르게 이동할 수 있으므로 메시지 전달이나 정찰 임무 수행에 유용합니다."
 armor_equipment_steam_car: "증기 자동차"
 armor_equipment_steam_car_desc: "보병을 수송하고 전투를 지원하는 데 사용되는 장갑차."
 armor_equipment_steam_car_0: "증기 자동차"
 armor_equipment_steam_car_0_desc: "경장갑 차량으로, 무장은 탑승 보병입니다. 지형을 더 빠르게 이동하고 어느 정도 소화기 사격에 저항할 수 있는 구성 요소를 추가하여 사단을 지원하는 데 사용될 수 있습니다."
 helmet_equipment: "헬멧"
 helmet_equipment_desc: "파편, 총알, 그리고 기타 머리 부상을 유발할 수 있는 모든 것으로부터 보호하기 위한 보병용 헬멧."
 helmet_equipment_0: "초기 헬멧"
 helmet_equipment_0_desc: "착용자를 보호하도록 설계된 강철 헬멧."
 sniper_equipment: "정밀 사격 장비"
 sniper_equipment_desc: "저격수와 관측병을 위한 장비."
 sniper_equipment_0: "M1903 스프링필드"
 sniper_equipment_0_desc: "정밀 사격 장비."
 CAN_sniper_equipment_0: "로스 소총, 스코프 장착"
 siege_gun_equipment: "공성포"
 siege_artillery_equipment_short: "공성포 장비"
 siege_gun_equipment_desc: "높은 각도로 먼 거리에 발사체를 쏘아 올릴 수 있는 중포로, 요새화된 진지를 공성하는 데 완벽합니다."
 howitzer_artillery_equipment: "곡사포"
 howitzer_artillery_equipment_desc: "보병 전투에서 빛을 발하는 가볍고 기동성 있는 포병 장비입니다."
 grain_equipment: "곡물"
 grain_equipment_desc: "곡물로 만든 제품은 모든 종류의 사람들이 식량으로 사용합니다."
 grain_consumable: "빵류"
 grain_consumable_desc: "곡물로 만든 제품은 모든 종류의 사람들이 식량으로 사용합니다."
 grain_consumable_short: "빵류"
 ship_hull_gunboat: "건보트"
 ship_hull_gunboat_desc: "강력한 장갑을 갖추고 느리게 움직이는 전함으로, 해안전과 포격에 능합니다."
 ship_hull_gunboat_0: "밤 케치"
 ship_hull_gunboat_0_desc: "강화된 함선의 선수에 중간 크기의 대포 두 문 또는 단일 대형 저속 박격포를 장착하여 요새를 향해 폭발성 포탄을 발사하도록 만들어진 초기 건보트입니다."
