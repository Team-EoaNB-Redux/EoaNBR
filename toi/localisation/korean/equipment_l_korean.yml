 GER_heavy_tank_equipment_3_short: "킹 티거"
 GER_heavy_tank_equipment_3_desc: "쾨니히스티거(Königstiger)라는 비공식적인 이름으로 알려져 있지만, 연합군 병사들에 의해 흔히 킹 티거로 반(半)문자 그대로 번역된 이 설계는 티거 I과 동일한 개념을 따랐지만, 훨씬 더 강력하게 만들 의도였습니다. 티거 II는 티거 I의 두꺼운 장갑과 판터 중형 전차에 사용된 경사 장갑을 결합했습니다. 이 전차는 거의 70톤에 달했으며, 전면에는 100~180mm의 장갑으로 보호되었고, 장포신 8.8cm 캄프바겐카노네 43 L/71 주포로 무장했습니다."
