 mechanized_equipment: "기계화 장비"
 mechanized_equipment_short: "기계화"
 mechanized_equipment_desc: "기계화 보병은 수송 및 전투를 위해 장갑 병력 수송차(APC) 또는 보병 전투차(IFV)로 무장한 보병입니다. 기계화 보병은 차량화 보병이 사용하는 비장갑 바퀴형 차량(트럭 또는 지프)과는 달리, 적의 사격으로부터 어느 정도 보호를 제공하는 차량을 사용한다는 점에서 차량화 보병과 구별됩니다."
