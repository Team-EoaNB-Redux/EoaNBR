 medium_tank_artillery_equipment_3_desc: "중형 전차 차체에 장착된 중형 포병 대포인 중자주포는 상당한 화력을 자랑하면서도 여전히 기동성이 뛰어납니다."
 GER_medium_tank_artillery_equipment_1: "그릴레"
 GER_medium_tank_artillery_equipment_1_short: "그릴레"
 GER_medium_tank_artillery_equipment_1_desc: "Sd.Kfz. 138/1 그릴레(독일어: '귀뚜라미')는 제2차 세계 대전 중 독일이 사용한 자주포였습니다. 약 490-500대의 그릴레가 생산되었습니다. 그들은 폴란드와 프랑스 주둔 부대와 함께 소련 주둔 기갑 사단에서 사용되었습니다. 1945년까지 사용되었으며, 튀니지에서도 적 포병과 전차를 상대로 싸웠습니다."
 GER_medium_tank_artillery_equipment_2: "훔멜"
 GER_medium_tank_artillery_equipment_2_short: "훔멜"
 GER_medium_tank_artillery_equipment_2_desc: "훔멜(독일어로 '뒤영벌')은 게슈츠바겐 III/IV 차체에 기반한 자주포로, 15cm 곡사포로 무장했습니다. 1943년 초부터 전쟁이 끝날 때까지 제2차 세계 대전 중 독일 국방군에 의해 사용되었습니다."
