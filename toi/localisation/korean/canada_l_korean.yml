 britishcanada.80.b: "우리는 이 문제에 관여하지 않겠습니다."
 britishcanada.81.t: "캐나다 지방, 지원 요청"
 britishcanada.81.d: "캐나다 지방의 반영국 정당에서 온 비밀 대사관이 우리에게 요청을 가지고 접근했습니다. 간단히 말해, 그들은 독립을 원하며 우리가 그들을 도와줄 것을 요청했습니다."
