l_korean:
 CAN_ACW: "미국 남북전쟁"
 CAN_ACW_desc: "미국 남북전쟁은 우리와 미국과의 근접성, 그리고 면화가 영국에 가지는 중요성을 고려할 때 우려스러운 문제입니다. 우리는 신중하게 진행 방안을 생각하고 최악의 상황에 대비해야 합니다."
 CAN_Help_Free_States: "뉴잉글랜드 지원"
 CAN_Help_Free_States_desc: "뉴잉글랜드를 도우면 가장 큰 이득을 얻을 것입니다."
 CAN_Organize_Support: "지원 조직화"
 CAN_Organize_Support_desc: "우리는 노턴의 반란이 좋은 의도를 따른다는 것을 주요 인사들에게 설득할 것입니다."
 CAN_Lead_goods_Free_states: "신생 국가로 물자 운송"
 CAN_Lead_goods_Free_states_desc: "우리는 노턴의 국가로 물자를 보낼 것입니다."
 CAN_Support_Volunteers_FSA: "뉴잉글랜드의 의용군 지원"
 CAN_Support_Volunteers_FSA_desc: "우리는 뉴잉글랜드의 캐나다인 의용군을 재정적으로 지원할 것입니다. 영국 총독에게 알리지 않기 위해 물론 이 비용들을 위장할 것입니다."
 CAN_Assylum_non_slaves: "뉴잉글랜드 난민에게 망명 제공"
 CAN_Assylum_non_slaves_desc: "우리는 뉴잉글랜드 난민에게 망명을 제공할 것입니다."
 CAN_Help_Union: "연방 지원"
 CAN_Help_Union_desc: "우리의 정치인들과 국민 모두 연방에 공감하고 있으며, 특히 지하 철도의 연결점으로서 그러합니다. 영국의 이해관계가 남부와 일치하더라도, 우리 국민의 뜻에 따라 북부를 돕는 것이 최선입니다."
 CAN_Change_Trade_treaty: "조약 조정"
 CAN_Change_Trade_treaty_desc: "우리 경제에 도움이 되도록 무역 조약을 조정할 것입니다."
 CAN_Support_Volunteers_Union: "연방의 의용군 지원"
 CAN_Support_Volunteers_Union_desc: "우리는 연방의 캐나다인 의용군을 재정적으로 지원할 것입니다. 영국 총독에게 알리지 않기 위해 물론 이 비용들을 위장할 것입니다."
 CAN_Arrest_Confederates: "남부 연합군 체포"
 CAN_Arrest_Confederates_desc: "남부 연합군을 체포하여 연방에 넘겨줄 것입니다."
 CAN_Assylum_Slaves: "연방 난민에게 망명 제공"
 CAN_Assylum_Slaves_desc: "우리는 연방 난민, 특히 도망치는 노예들에게 망명을 제공할 것입니다."
 CAN_Stay_behind_Britain: "영국의 그늘 아래 머무르기"
 CAN_Stay_behind_Britain_desc: "캐나다는 제국의 자연스러운 일부이며, 따라서 우리는 남쪽의 내전을 다루는 데 있어 런던의 방침을 따라야 합니다."
 CAN_Equal_deals: "평등한 무역 거래"
 CAN_Equal_deals_desc: "수익을 극대화하기 위해 남북전쟁의 모든 파벌과 공평한 무역 거래를 맺을 것입니다."
 CAN_Create_Grand_trunk_brigade: "철도 여단 창설"
 CAN_Create_Grand_trunk_brigade_desc: "국경 근처의 철도는 쉬운 목표입니다. 피해를 최소화하기 위해 철도 여단을 창설할 것입니다. 회사는 유지보수 및 장비 비용을 지불하고 우리는 인력을 제공할 것입니다."
 CAN_Prepare_Secenario_1812: "전쟁 대비"
 CAN_Prepare_Secenario_1812_desc: "우리의 최악의 두려움이 현실이 되고 있습니다. 연방과 영국 간의 긴장이 고조되고 있으며, 우리는 침공 가능성에 대비해야 합니다. 싸울 수 있는 모든 사람들을 투입할 준비가 되어야 합니다."
 CAN_Assylum_for_all: "모든 난민에게 망명 제공"
 CAN_Assylum_for_all_desc: "우리 지방에서 망명을 원하는 사람들에게 인종과 이데올로기는 중요하지 않습니다. 그들이 정직하고 근면한 사람이라면, 그들을 거부할 이유가 없습니다."
 CAN_Conclusion_ACW: "남북전쟁의 종결"
 CAN_Conclusion_ACW_desc: "미국 남북전쟁은 우리 모두에게 두려운 시기였습니다. 하지만 이 전쟁은 캐나다 국민, 특히 정치인들에게 여러 긍정적인 영향을 미쳤습니다. 후자는 결국 연합을 결성하고 교착 상태를 끝냈는데, 이는 남쪽의 남북전쟁 덕분이었습니다."
 CAN_Canadian_Militia: "캐나다 민병대"
 CAN_Canadian_Militia_desc: "이 시기의 캐나다 군대는 대부분 전투 능력이 제한된 민병대로 구성되어 있었는데, 이는 우리가 해결해야 할 문제입니다."
 CAN_Learn_1812: "1812년 전쟁으로부터 배우기"
 CAN_Learn_1812_dec: "우리는 캐나다 땅에서 가장 최근에 벌어진 전쟁인 1812년 전쟁을 다시 한번 살펴볼 것입니다. 이를 통해 뭔가 새로운 것을 배울 수 있기를 바랍니다."
 CAN_Learn_European_Wars: "유럽 전쟁으로부터 배우기"
 CAN_Learn_European_Wars_dec: "유럽 열강들은 단연코 가장 발전된 군대를 가지고 있습니다. 따라서 그들의 전쟁을 보고 우리 자신의 전투 교리를 결정하는 것은 당연한 일입니다."
 CAN_Revive_Military: "군사 정신 부활"
 CAN_Revive_Military_desc: ""
 CAN_Excempt_immigrants: "특정 종교인 군 복무 면제"
 CAN_Excempt_immigrants_desc: "더 많은 이민자를 유치하기 위해 특정 종교 집단에 대해 군 복무를 면제해 줄 것입니다."
 CAN_New_British_Rifle_Designs: "신형 소총"
 CAN_New_British_Rifle_Designs_desc: "영국의 도움을 받아 신형 소총을 개발할 것입니다."
 CAN_New_Uniform_Designs: "신형 군복"
 CAN_New_Uniform_Designs_desc: "우리는 캐나다 민병대를 위한 새로운 영국식 군복을 개발할 것입니다."
 CAN_New_Artillery_Designs: "신형 야포"
 CAN_New_Artillery_Designs_desc: "야포는 현대적인 군대를 갖추는 데 필수적입니다. 다른 국가들로부터 우리를 방어하기 위해 현대적인 야포를 개발해야 할 것입니다."
 CAN_British_Equipment: "영국제 장비"
 CAN_British_Equipment_desc: "영국에 장비 지원을 요청할 수 있을 것입니다."
 CAN_Start_Military_Industry: "군수 산업 시작"
 CAN_Start_Military_Industry_desc: "영국에서 배송받는 것에 의존하기보다는, 우리 자신의 군수 산업을 시작하여 이곳에서 장비를 생산해야 합니다."
 CAN_Increasing_Self_Reliance: "군사 자급자족 증대"
 CAN_Increasing_Self_Reliance_desc: "인도와 중국에서의 문제로 인해 런던 정부는 우리 영토에 병력을 투입할 여력이 없습니다. 따라서 우리는 스스로 이 부담을 떠맡아 왕실의 이미 무거운 짐을 덜어주어야 합니다."
 CAN_Fight_Deadlock: "정치적 교착 상태 타개"
 CAN_Fight_Deadlock_desc: "정치적 교착 상태는 재앙입니다. 큰 사건이 일어나지 않는 한, 이 상태는 수년간 지속될 수 있습니다."
 CAN_External_Threats: "외부 위협"
 CAN_External_Threats_desc: "미국과 영국 간의 긴장이 고조되고 전쟁 가능성이 명확해지면서, 우리는 그 어느 때보다도 우리의 차이점을 제쳐두고 연방 결성이라는 목표에 집중해야 한다는 것을 보여줍니다. 그렇지 않으면 캐나다는 통째로 삼켜질 수 있습니다."
 CAN_Alliance: "동맹?"
 CAN_Alliance_desc: "영국과 미국 간의 전쟁 위험이 점점 더 명확해지면서, 개혁파와 보수파 모두 정치적 교착 상태를 끝내겠다는 공동의 목표로 단결하여 동맹을 결성하는 데 동의했습니다."
 CAN_Structural_Change: "일부 구조적 변화"
 CAN_Structural_Change_desc: "우리가 가장 먼저 해야 할 일은 꼭 필요한 개혁과 구조적 변화를 통과시키는 것입니다."
 CAN_Unify: "공식적으로 주 통합"
 CAN_Unify_desc: "이제 우리 연합이 결성되었으니, 그들이 어떤 정당을 지지하든 상관없이 국민의 목소리를 통합하여 오랫동안 우리를 괴롭혔던 정치적 불안정성을 끝낼 수 있습니다."
 CAN_Internal_Threats: "내부 위협"
 CAN_Internal_Threats_desc: "정치적 불안정성은 스스로 해결되지 않는 것 같습니다. 이는 우리가 어떻게 해야 할지 제대로 모르는 상태에서 이를 끝낼 방법을 찾아야 함을 의미합니다."
 CAN_Blame_Conservatives: "보수파를 비난"
 CAN_Blame_Conservatives_desc: "누가 비난받아야 하는지는 분명합니다: 보수파입니다. 낡은 관습과 법률에 의존하는 보수파가 이 불안정성을 불러왔습니다!"
 CAN_Reformers_Power: "개혁파 집권"
 CAN_Reformers_Power_desc: "우리가 집권하면 마침내 보수파에 의해 저지되었던 꼭 필요한 개혁을 통과시킬 수 있을 것입니다."
 CAN_Blame_Reformers: "개혁파를 비난"
 CAN_Blame_Reformers_desc: "누가 비난받아야 하는지는 분명합니다: 개혁파입니다. 우리의 법과 구조에 대한 무분별한 변화를 바라는 개혁파가 우리 식민지 내의 불안정성을 초래했습니다!"
 CAN_Conservatives_Power: "보수파 집권"
 CAN_Conservatives_Power_desc: "우리가 집권하면 마침내 오래된 관습과 법률을 시행하여 검증된 구조가 우리 식민지에 균형을 가져오도록 할 것입니다."
 CAN_Great_Party: "위대한 정당"
 CAN_Great_Party_desc: "우리 정당이 집권한 이후, 캐나다를 괴롭히던 많은 문제들이 해결되었습니다. 덕분에 우리는 마침내 통합된 캐나다를 만드는 데 집중할 수 있습니다!"
 CAN_Focus_Confederation: "연방 결성에 집중"
 CAN_Focus_Confederation_desc: "우리가 다루어왔던 정치적 교착 상태와 내부 갈등이 마침내 끝났습니다. 이제 우리는 연방 결성을 향해 나아가고 우리의 의도를 발표할 수 있습니다."
 CAN_Colony_Merchants: "상인의 식민지"
 CAN_Colony_Merchants_desc: "캐나다의 식민지들은 과거에도 그랬고 지금도 상인들을 위한 식민지입니다. 이 때문에 그들의 해군 전략은 무역선에 초점을 맞추고 있습니다."
 CAN_Merchant_Ship_Designs: "무역선에 대한 실험적 아이디어"
 CAN_Merchant_Ship_Designs_desc: "지난 몇 년 동안 우리의 해양 전략가와 설계자들은 무역선에 대한 몇 가지 흥미로운 아이디어를 얻었습니다."
 CAN_Small_Ship: "영국으로부터의 소형 선박 설계"
 CAN_Small_Ship_desc: "해군을 건설하는 우리의 능력은 제한적일 수 있지만, 이것이 선박 설계가 우리 식민지에서 쓸모없다는 것을 의미하지는 않습니다."
 CAN_Examine_British_Tactics: "영국 해군 전술 검토"
 CAN_Examine_British_Tactics_desc: "전투를 치르는 새로운 방법을 배우는 것은 미래에 유용할 수 있습니다."
 CAN_Establish_Comission: "위원회 설립"
 CAN_Establish_Comission_desc: "퀘벡이 비교적 큰 항구를 가지고 있음에도 불구하고 효율성은 최고 수준이 아닙니다. 따라서 우리는 효율성을 높일 위원회를 설립해야 합니다."
 CAN_Start_Shipbuilding_Industry: "조선 산업 시작"
 CAN_Start_Shipbuilding_Industry_desc: "해안 지역과 무역선을 보호하기 위해 우리는 지역 조선업을 시작해야 할 것입니다."
 CAN_Inspire_Shipbuilding_Industry: "조선 산업 고취"
 CAN_Inspire_Shipbuilding_Industry_desc: "선박 생산을 늘리기 위해, 우리는 조선소 노동자들이 젊은이가 될 수 있는 좋은 본보기처럼 보이게 함으로써 새로운 노동자들을 유치할 것입니다."
 CAN_Trust_Royal_Navy: "왕립 해군 신뢰"
 CAN_Trust_Royal_Navy_desc: "우리가 새로운 조선 산업을 가지고 있더라도, 영국의 함대와 산업은 우리를 크게 능가합니다. 따라서 우리 해역을 보호하는 데 왕실을 계속 신뢰하는 것이 합리적일 뿐입니다."
 CAN_Agrarian_Colony: "농업 식민지"
 CAN_Agrarian_Colony_desc: "캐나다는 대부분 농장, 광산, 제재소로 이루어져 있습니다. 자원의 가치가 이미 높음에도 불구하고, 뒤처지지 않기 위해 서서히 산업화해야 할 수도 있습니다."
 CAN_Matter_Agriculture: "농업 문제"
 CAN_Matter_Agriculture_desc: "농업이 캐나다 경제의 큰 부분을 차지하고 있지만, 상부 캐나다와 하부 캐나다의 생산량에는 불균형이 있습니다. 우리는 어떤 식으로든 이 문제를 해결하기 위해 나서야 합니다."
 CAN_Lower_Canada: "하부 캐나다"
 CAN_Lower_Canada_desc: "하부 캐나다는 수년간 상부 캐나다로부터 식량을 수입하고 있습니다. 상부 캐나다의 흉작은 식민지 전체에 식량 부족을 초래할 수 있습니다. 우리는 이 문제에 대처해야 합니다."
 CAN_Effort_self_sufficient: "자급자족을 위한 노력"
 CAN_Effort_self_sufficient_desc: "식민지 전체의 식량 부족 위협은 너무 큽니다. 식량 생산을 증진하기 위해 농장을 지원해야 합니다."
 CAN_Combat_Poverty_traditional: "농장의 빈곤 퇴치"
 CAN_Combat_Poverty_traditional_desc: "하부 캐나다의 많은 농장들은 가난하여 새로운 장비를 사기 어렵고, 이는 식량 생산을 제한합니다. 이러한 농장들에게 약간의 재정적 지원을 제공하여 이 문제를 해결해야 합니다."
 CAN_Subsidize_Farms: "농장 보조금 지급"
 CAN_Subsidize_Farms_desc: "식량 생산을 영구적으로 증진하기 위해 농장에 보조금을 지급할 것입니다."
 CAN_Support_Shift_stock_raising: "가축 사육으로 전환 지원"
 CAN_Support_Shift_stock_raising_desc: "소와 다른 큰 동물들은 새로운 생산물을 제공합니다. 이는 더 다양한 식량을 확보해 줄 것입니다."
 CAN_Educate_Farmers: "농부 교육"
 CAN_Educate_Farmers_desc: "우리는 또한 농부들을 교육해야 합니다."
 CAN_Organise_Agricultural_Press: "농업 출판물 조직"
 CAN_Organise_Agricultural_Press_desc: "농부들에게는 중요한 조언지가 되고 소비자에게는 광고가 되는 출판물을 통해 하부 캐나다에 낙농업이 자리 잡도록 할 것입니다."
 CAN_Upper_Canada: "상부 캐나다"
 CAN_Upper_Canada_desc: "상부 캐나다의 비옥한 평원은 우리에게 낙농업을 시작하거나 그 지역의 식량 생산을 증진할 가능성을 제공합니다."
 CAN_New_Industrial_Equipment: "신형 산업 장비"
 CAN_New_Industrial_Equipment_desc: "우리는 농업을 위한 신형 장비 개발을 지원할 것입니다."
 CAN_Support_Local_Farmers: "지역 농부 지원"
 CAN_Support_Local_Farmers_desc: "지역 농부들을 지원하기 위해 그들에게 약간의 재정적 지원을 제공할 것입니다."
 CAN_Support_Shift_Livestook: "가축 사육으로 전환 지원"
 CAN_Support_Shift_Livestook_desc: "상부 캐나다의 평원은 밀을 재배하기에 완벽하지만, 치즈와 같은 유제품으로 구성된 지역 산업을 시작하기에도 좋은 방법입니다."
 CAN_Encourage_Cheese_Factories: "유제품 공장 장려"
 CAN_Encourage_Cheese_Factories_desc: "우리는 일부 비용을 지불함으로써 유제품 공장을 장려할 것입니다."
 CAN_Promote_Wheat: "밀 재배 장려"
 CAN_Promote_Wheat_desc: "비옥한 평원은 수년간 풍부한 수확을 제공해 왔습니다. 이것이 소나 다른 큰 동물들에 의해 방해받아서는 안 됩니다. 오히려 확장되어야 합니다."
 CAN_Subsidize_Wheat_Farms: "밀 농장 보조금 지급"
 CAN_Subsidize_Wheat_Farms_desc: "우리는 밀 농장에 보조금을 지급하여 그들을 지원할 것입니다."
 CAN_Exports_To_Britain: "영국으로 수출"
 CAN_Exports_To_Britain_desc: "영국 산업과 성장은 원자재, 식량, 산업 생산품의 지속적인 공급을 필요로 합니다. 제국의 일부로서 우리는 그들이 필요한 것을 판매하여 우리와 그들 모두에게 도움을 줄 것입니다."
 CAN_Buildup_Infrastructure: "인프라 구축"
 CAN_Buildup_Infrastructure_desc: "좋은 인프라는 산업화의 핵심 요소입니다. 산업 잠재력을 극대화하기 위해 인프라 확장에 집중해야 합니다."
 CAN_Fund_Projects_Saint: "세인트로렌스 프로젝트 자금 지원"
 CAN_Fund_Projects_Saint_desc: "세인트로렌스에는 자금이 필요한 여러 인프라 프로젝트가 있습니다. 다행히도 우리는 그들이 필요한 것을 가지고 있으며, 그들은 우리에게 필요한 것을 줄 수 있습니다."
 CAN_Construct_New_Canals: "신규 운하 건설"
 CAN_Construct_New_Canals_desc: "운하는 캐나다에서 필수적인 교통수단입니다. 새로운 운하를 건설함으로써 고립된 농장들을 더 인구가 많은 지역들과 연결할 수 있습니다."
 CAN_Drain_Old_Canals: "철도를 위해 오래된 운하 물 빼기"
 CAN_Drain_Old_Canals_desc: "운하는 전 세계에서 그 가치를 입증했지만, 철도는 점점 더 효과적이 되고 있습니다. 오래된 운하의 물을 빼고 그 자리에 철도를 건설함으로써 우리 인프라의 효율성을 높일 수 있습니다."
 CAN_Establish_Ferry_Services: "페리 서비스 구축"
 CAN_Establish_Ferry_Services_desc: "디트로이트로 가는 페리 서비스를 구축함으로써 그 지역의 산업들을 더 잘 연결하고 산업 역량을 확장할 수 있습니다."
 CAN_Learn_New_Infrastructure: "새로운 인프라 방식 배우기"
 CAN_Learn_New_Infrastructure_desc: "철도가 효율적인 운송 수단을 제공할 것이라는 점은 분명하지만, 인프라를 개선하고 확장할 새로운 방법을 찾는 것은 결코 틀린 일이 아닙니다."
 CAN_Introduce_Macadam_Method: "매커덤 공법"
 CAN_Introduce_Macadam_Method_desc: "매커덤 공법은 더 안전하고 효율적인 도로를 건설하는 새로운 방법입니다."
 CAN_Learn_Erie_Canal: "이리 운하로부터 배우기"
 CAN_Learn_Erie_Canal_desc: "우리가 운하 건설에 어느 정도 경험이 있기는 하지만, 미국 방식으로부터 새로운 것을 배울 수 있을 것입니다."
 CAN_Introduce_Telegraphic_Services: "전신 서비스"
 CAN_Introduce_Telegraphic_Services_desc: "미래에 우리가 소통할 수 있는 비교적 새로운 방식은 살펴볼 가치가 있을 것입니다."
 CAN_Modernizing_Infrastructure: "인프라 산업화"
 CAN_Modernizing_Infrastructure_desc: "잘 구축된 인프라는 산업화된 경제의 핵심 기반 중 하나입니다. 따라서 우리는 우리 자신의 인프라를 개선하고 업그레이드하기 위해 노력해야 합니다."
 CAN_Industrialising_Industry: "산업의 산업화"
 CAN_Industrialising_Industry_desc: "새로운 산업과 인프라를 통해 우리는 산업의 산업화에 집중할 수 있습니다."
 CAN_Urbanisation: "도시화"
 CAN_Urbanisation_desc: "광고를 통해 이민자와 사람들이 우리의 산업화되는 도시로 몰려들 것입니다."
 CAN_Growing_Manufactaring: "성장하는 제조업"
 CAN_Growing_Manufactaring_desc: "성장하는 제조업은 지금 우리가 분명히 장려해야 할 것입니다."
 CAN_Industrial_Textile_Industry: "산업용 직물 산업"
 CAN_Industrial_Textile_Industry_desc: "양모를 사용하는 산업용 직물 산업은 장려할 가치가 있을 수 있습니다."
 CAN_Industrialising_Farms: "농장 산업화"
 CAN_Industrialising_Farms_desc: "현대적인 도구와 기술을 사용함으로써 농장은 일반 농장보다 더 생산적이 됩니다."
 CAN_Industrialising_Society: "산업화 사회"
 CAN_Industrialising_Society_desc: "산업화는 새로운 문제들을 가져오며, 특히 일반 노동자와 가족들이 대부분의 이러한 문제들을 겪습니다. 우리는 이러한 문제들 중 일부를 미리 해결하려고 노력해야 합니다."
 CAN_Productivity_First: "생산성 우선"
 CAN_Productivity_First_desc: "일반 노동자에게 몇 가지 문제가 있지만, 노동 시간 제한은 그 중 하나가 아닙니다."
 CAN_Workers_Right: "노동자 권리"
 CAN_Workers_Right_desc: "노동 시간을 제한함으로써, 일반 노동자와 가족들은 더 건강하고 행복한 삶을 살게 될 것입니다."
 CAN_Trade_Union_Act: "노동조합법"
 CAN_Trade_Union_Act_desc: "반노조법을 폐지함으로써 일반 국민은 더 많은 정치적 자유를 누리고 더 많은 권리를 얻기에 더 적합하게 될 것입니다."
 CAN_Industrialising_Nation: "산업화"
 CAN_Industrialising_Nation_desc: "우리는 농업 경제를 넘어 산업화된 경제로 나아가는 데 큰 진전을 이루었습니다. 우리는 마침내 산업화 과정을 시작했습니다!"
 CAN_Way_Confederation: "연방 결성으로 가는 길"
 CAN_Way_Confederation_desc: "정치적 문제들을 해결하고 연방 결성에 대한 관심을 표명한 후, 우리는 프랑스계 캐나다인들의 지지를 얻어야 할 것입니다."
 CAN_Grant_Rights_French: "프랑스계에 권리 부여"
 CAN_Grant_Rights_French_desc: "우리는 프랑스계에게 일부 권리를 부여하고, 그 대가로 그들은 우리의 연방 결성 시도를 지지할 것입니다."
 CAN_Support_Catholic_Church: "가톨릭 교회의 지지 요청"
 CAN_Support_Catholic_Church_desc: "우리는 캐나다 가톨릭 교회에 지원을 요청할 것입니다. 그 대가로 가톨릭 신앙에 대한 제약을 해제할 것입니다."
 CAN_Enrollment_Old_Militias: "구 민병대 징집"
 CAN_Enrollment_Old_Militias_desc: "다른 식민지들의 구 민병대들을 재징집함으로써 우리는 가용 병력을 확대하고 군대를 강화할 수 있습니다. 하지만 군사 예산을 늘리거나 재징집을 제한해야 할 것입니다."
 CAN_Militia_Act_1868: "민병대법"
 CAN_Militia_Act_1868_desc: "이 민병대법은 영구적인 캐나다 군사력 확립의 필요성을 보여줍니다."
 CAN_Curtail_Enrollment: "징집 제한"
 CAN_Curtail_Enrollment_desc: "군대 예산 문제를 해결하기 위해, 단순히 재징집을 제한할 것입니다."
 CAN_Increase_Funds: "자금 증액"
 CAN_Increase_Funds_desc: "군대 예산 문제를 해결하기 위해, 단순히 군사 예산을 증액할 것입니다."
 CAN_Full_Fledged_Canadian_Military: "캐나다 민병대"
 CAN_Full_Fledged_Canadian_Military_desc: "이제 캐나다 지방의 민병대 체제가 갱신되어, 우리가 얻었거나 앞으로 얻게 될 새로운 지역들을 충분히 방어할 수 있게 되었습니다."
 CAN_Takeover_Ruperts_Land: "루퍼츠랜드에 집중"
 CAN_Takeover_Ruperts_Land_desc: "우리는 더 많은 정착민을 유치하기 위해 더 많은 땅이 필요하며, 허드슨만 회사의 땅이 바로 우리가 원하는 것입니다."
 CAN_Encourage_Westward_Settlement: "서부 정착 장려"
 CAN_Encourage_Westward_Settlement_desc: "우리 인구의 상당수가 미국에서 운을 시험하고 있습니다. 이 문제를 최소화하기 위해, 우리는 동쪽으로 향하는 땅이 미국만큼 비옥하고 기회가 많다는 것을 사람들에게 설득할 것입니다."
 CAN_Protect_Rights_Native_Citiziens: "협상"
 CAN_Protect_Rights_Native_Citiziens_desc: "그들의 반란 이유는 정당합니다. 지역을 안정시키기 위해 우리는 그들과 협상하여 합의점을 찾을 것입니다."
 CAN_More_Rights_English_Settlers: "반란 진압"
 CAN_More_Rights_English_Settlers_desc: "이 소식이 캐나다 전역에 퍼지고 다른 원주민이나 심지어 프랑스계가 그들과 합류하거나 아예 반란을 일으키는 것은 시간 문제입니다! 너무 늦기 전에 이를 막아야 합니다!"
 CAN_British_Columbia_For_Railway: "철도를 위해 브리티시컬럼비아"
 CAN_British_Columbia_For_Railway_desc: "우리는 브리티시컬럼비아에 캐나다 동부와 연결할 대륙횡단 철도 시스템을 건설하겠다고 제안할 것입니다. 그 대가로 우리는 그들에게 자치령에 가입할 것을 요청할 것입니다."
 CAN_Create_North_Mounted_Police: "노스웨스트 기마경찰 창설"
 CAN_Create_North_Mounted_Police_desc: "획득한 영토를 보호하기 위해 기마경찰을 창설해야 합니다."
 CAN_Trade_Policy: "캐나다의 무역 정책"
 CAN_Trade_Policy_desc: "우리가 가장 먼저 다루어야 할 것 중 하나는 무역에 대한 우리의 입장입니다. 제국 내 무역에 집중해야 할까요, 아니면 이웃 국가들과 제국 외부 국가들과의 무역에 집중해야 할까요?"
 CAN_Protective_Tariffs: "보호 관세"
 CAN_Protective_Tariffs_desc: "보호 관세와 수출입 제한이 없다면 캐나다는 미국 제품에 점령당해 경제가 망가질 것입니다. 바로 그런 두려움을 품고 있는 국민들에게 이 정책이 큰 인기를 얻을 것이라는 점은 말할 것도 없습니다."
 CAN_Trade_Relations_Empire: "제국과의 무역 관계"
 CAN_Trade_Relations_Empire_desc: "보호 관세 때문에 대부분의 무역은 영국과 이루어질 것입니다."
 CAN_Balanced_Export: "균형 잡힌 수출 정책"
 CAN_Balanced_Export_desc: "보호 관세와 제한된 수출의 조합은 캐나다 경제를 미국 제품으로부터 보호하는 동시에 기업의 이윤을 극대화할 수 있습니다. 국민들에게 가장 인기 있는 정책은 아닐지라도, 국민과 우리의 경제적 필요 사이에서 훌륭한 타협점이 될 것입니다."
 CAN_Balanced_Trade_Relations: "균형 잡힌 무역 관계"
 CAN_Balanced_Trade_Relations_desc: "시행된 무역 정책은 기업들이 미국과 무역할 수 있게 하는 동시에, 캐나다 자원을 영국에 제공해야 하는 우리의 의무를 충족시켜 줍니다."
 CAN_Free_Trade: "자유 무역"
 CAN_Free_Trade_desc: "자유 시장만이 국제 경쟁에서 경쟁할 수 있는 캐나다 기업을 창출할 수 있는 유일한 방법입니다. 이는 인기 있는 정책은 아닐 것이지만, 우리 경제에 가장 좋을 것입니다."
 CAN_Outside_Trade_Relations: "제국 외부와의 무역 관계"
 CAN_Outside_Trade_Relations_desc: "시행된 무역 정책 때문에 캐나다 제품이 영국으로 가는 길은 줄어들 것입니다."
 CAN_Defined_Trade_Policy: "명확한 무역 정책"
 CAN_Defined_Trade_Policy_desc: "우리는 이제 우리의 무역 정책을 완전히 시행했습니다."
 CAN_Prime_Minister: "첫 연방 선거"
 CAN_Prime_Minister_desc: "마침내 식민지들이 통합되었고, 다가오는 선거에서 누가 연방을 이끌지 결정될 것입니다. 조지-에티엔, 존 A. 맥도널드, 조지 브라운, 세 명의 주요 후보가 승리할 수 있습니다."
 CAN_Conservative_Prime_Minister: "보수당 총리"
 CAN_Conservative_Prime_Minister_desc: "우리에게 필요한 것은 보수당 총리입니다."
 CAN_George_Etrienne_Prime_Minister: "조지-에티엔 총리"
 CAN_George_Etrienne_Prime_Minister_desc: "조지-에티엔은 다른 나라들, 특히 남쪽 이웃과의 좋은 관계를 유지하여 우리의 미래를 보장할 유능한 외교관입니다."
 CAN_John_Macdonald_Prime_Minister: "존 A. 맥도널드 총리"
 CAN_John_Macdonald_Prime_Minister_desc: "존 A. 맥도널드는 우리 경제를 지원하여 우리의 미래를 보장하기를 원합니다. 그는 또한 우리의 인프라 프로젝트를 지원하기 위해 철도 회사를 옹호합니다."
 CAN_CPR: "CPR"
 CAN_CPR_desc: "맥도널드의 목표 중 하나는 브리티시컬럼비아까지 대륙횡단 철도를 건설하는 것입니다. 이 철도를 효율적으로 건설하기 위해 우리는 '캐나다 태평양 철도(Canadian Pacific Railway)', 즉 CPR로 알려진 캐나다 철도 회사를 설립할 것입니다."
 CAN_Liberal_Prime_Minister: "자유당 총리"
 CAN_Liberal_Prime_Minister_desc: "우리에게 필요한 것은 중도 성향의 총리입니다."
 CAN_George_Brown_Prime_Minister: "조지 브라운 총리"
 CAN_George_Brown_Prime_Minister_desc: "조지 브라운은 정부에 유리하게 국가를 안정시키는 데 사용될 수 있는 인기 있는 신문사를 소유하고 있습니다."
 CAN_Dominions_Prime_Minister: "자치령의 첫 총리"
 CAN_Dominions_Prime_Minister_desc: "총리가 선출되었으므로 이제 우리는 그들의 정책을 실행하고 캐나다의 방향을 설정하는 데 집중할 수 있습니다."
 CAN_Peace_Order_Government: "평화, 질서, 좋은 정부"
 CAN_Peace_Order_Government_desc: "평화, 질서, 좋은 정부는 우리 국가가 세워질 세 가지 원칙이며, 미국의 '생명, 자유, 행복의 추구'라는 모토와 크게 다르지 않습니다."
 CAN_Treaties_Indigiounes: "원주민과의 조약"
 CAN_Treaties_Indigiounes_desc: "우리는 자연스럽게 서쪽으로, 태평양까지 확장하고자 하는 욕망을 가지고 있습니다. 하지만 그 땅에 우리 국민을 정착시키려면 원주민들과 협상하고 조약을 체결해야 할 것입니다."
 CAN_Canada_British_Rule: "영국의 통치 아래 캐나다"
 CAN_Canada_British_Rule_desc: "캐나다는 마침내 영국 왕실 아래 자치령으로 통합되었습니다. 제국의 일부로서 우리는 미래를 향해 나아갈 것입니다!"
 CAN_Thoughts_Independence: "극단적인 사상"
 CAN_Thoughts_Independence_desc: "독립에 대한 사상이 퍼지고 있습니다."
 CAN_Regulate_Debates: "토론 규제."
 CAN_Regulate_Debates_desc: "언론을 검열함으로써 이 사상을 더 쉽게 억누를 수 있을 것입니다."
 CAN_Arrest_Wrong_Thinkers: "'잘못된 사상가' 체포"
 CAN_Arrest_Wrong_Thinkers_desc: "이 사상은 몇몇 훌륭한 연설가와 소규모 정치인들의 지지를 받고 있습니다. 그들을 체포하면 사상은 훨씬 더 빨리 사라질 것입니다."
 CAN_Pro-British-Speeches: "친영 연설"
 CAN_Pro-British-Speeches_desc: "여왕과 제국을 높이 평가하는 연설을 장려함으로써 우리는 국민들을 올바른 방향으로 이끌 것입니다."
 CAN_Wiped_Thoughts: "사상 정화"
 CAN_Wiped_Thoughts_desc: "대다수 국민들의 사상은 이제 반식민주의 사상으로부터 깨끗해졌습니다."
 CAN_Open_Debates: "공개 토론"
 CAN_Open_Debates_desc: "토론을 공개함으로써 우리는 정직한 토론 문화를 보장하고, 이 문제에 대해 누가 옳은지 가장 훌륭한 연설가들이 결정하게 할 것입니다."
 CAN_Allow_Anti-Colonial_Speeches: "반식민지 연설 허용"
 CAN_Allow_Anti-Colonial_Speeches_desc: "우리는 이 문제에 대해 공격적인 수사에 특별한 권리를 부여하도록 보장할 것입니다."
 CAN_Allow_Anti-British_Politicians: "반식민지 정치인 허용"
 CAN_Allow_Anti-British_Politicians_desc: "많은 토론 끝에 국민들 사이에서 상당한 지지를 받는 반식민지 정당이 창당되었습니다. 이제 다음 단계는 그들을 의회로 환영하는 것입니다."
 CAN_Prepare_Canadian_War_of_Independence: "캐나다 독립 전쟁 대비"
 CAN_Prepare_Canadian_War_of_Independence_desc: "제국이 우리에게 자유를 줄 것이라고 생각하는 것은 순진한 일입니다. 우리가 자유를 유지하기 위해서라도, 우리는 캐나다 본토 전체를 해방시켜야 합니다. 그리고 그것을 달성하기 위해 우리는 가능한 모든 방법으로 준비해야 합니다."
 CAN_Influence_Media_other_Provinces: "다른 지방의 언론에 영향"
 CAN_Influence_Media_other_Provinces_desc: "우리의 지방에서는 완전한 독립 캐나다에 대한 아이디어가 지지를 받고 있지만, 다른 지방에도 우리를 도울 수 있는 잠재적 지지자들이 있습니다."
 CAN_prepare_diplomatically: "외교적으로 준비"
 CAN_prepare_diplomatically_desc: "미국, 프랑스, 러시아와 같은 국가들은 북미에서 영국의 제국주의를 끝내고 우리를 해방시키기를 원할 수 있습니다."
 CAN_Ask_France_support: "프랑스에 지원 요청"
 CAN_Ask_France_support_desc: "프랑스가 미국 독립 전쟁에서 미국을 지원했음에도 불구하고, 그들의 지원을 확보하기 위해 몇 가지 약속을 해야 할 수도 있습니다."
 CAN_Colonial_Goods_Civ: "민간인을 위한 식민지 물자"
 CAN_Colonial_Goods_Civ_desc: "우리는 프랑스에게 식민지로부터 우리 민간인들에게 일부 자원을 공급하도록 설득할 수 있습니다."
 CAN_Colonial_Goods_Mil: "군대를 위한 식민지 물자"
 CAN_Colonial_Goods_Mil_desc: "우리는 프랑스에게 식민지로부터 우리 군대에 일부 자원을 공급하도록 설득할 수 있습니다."
 CAN_Campaigns_Fra: "프랑스 내 캠페인"
 CAN_Campaigns_Fra_desc: "프랑스에서 캠페인을 벌임으로써 의용군과 자금을 모두 얻을 수 있을 것입니다."
 CAN_Buy_French_ships: "프랑스 함선 구매"
 CAN_Buy_French_ships_desc: "우리는 프랑스 정부에 몇 척의 함선을 구매할 수 있는지 물어볼 것입니다."
 CAN_Ask_Russia_support: "러시아에 지원 요청"
 CAN_Ask_Russia_support_desc: "러시아가 영국과의 크림 전쟁에서 패배했지만, 우리를 기꺼이 지원할 수도 있습니다."
 CAN_Food_Civ: "민간인을 위한 식량"
 CAN_Food_Civ_desc: "광활한 러시아 땅에서 추가 식량을 수입하여 민간인에게 제공함으로써 기근의 가능성을 낮출 것입니다."
 CAN_Food_Mil: "군대를 위한 식량"
 CAN_Food_Mil_desc: "러시아 땅에서 수입된 식량은 군대에 제공되어 더 많은 남성들이 군에 입대하도록 유도할 것입니다."
 CAN_Campaigns_Rus: "러시아 내 캠페인"
 CAN_Campaigns_Rus_desc: "러시아에서 캠페인을 벌임으로써 의용군과 자금을 모두 얻을 수 있을 것입니다."
 CAN_Buy_Resources: "자원 구매"
 CAN_Buy_Resources_desc: "러시아 정부 및 민간 산업과 계약을 체결함으로써 우리나라에 러시아 공장을 유치하거나, 자원 생산을 확장하는 데 사용될 다양한 자원 추출 분야의 러시아 전문가를 얻을 수 있습니다."
 CAN_Ask_Usa_support: "미국에 지원 요청"
 CAN_Ask_Usa_support_desc: "미국의 지원을 받으면 우리는 본국에서 강력한 동맹을 얻을 수 있습니다."
 CAN_Industry_Civ: "민간인을 위한 산업"
 CAN_Industry_Civ_desc: "미국 민간 산업과 계약을 체결함으로써 정부의 필요뿐만 아니라 민간인을 위한 더 많은 산업을 확보할 수 있을 것입니다."
 CAN_Industry_Mil: "군대를 위한 산업"
 CAN_Industry_Mil_desc: "미국 민간 산업과 계약을 체결함으로써 군대의 필요를 충족시킬 더 많은 산업을 확보할 수 있을 것입니다."
 CAN_Campaigns_Usa: "미국 내 캠페인"
 CAN_Campaigns_Usa_desc: "미국에서 캠페인을 벌임으로써 의용군과 자금을 모두 얻을 수 있을 것입니다."
 CAN_Buy_Military_Equipment: "군사 장비 구매"
 CAN_Buy_Military_Equipment_desc: "일부 군수 산업과 연락하면 우리가 필요할 때 즉시 장비를 생산할 수 있을 것입니다."
 CAN_Diplomatically_Prepared: "외교적으로 준비됨"
 CAN_Diplomatically_Prepared_desc: "이제 캐나다 국민들은 우리 외에 제국주의로부터 그들을 해방시켜 줄 다른 동맹국들을 갖게 되었습니다."
 CAN_prepare_internally: "내부적으로 준비"
 CAN_prepare_internally_desc: "독립 전쟁에서 승리하기 위해서는 군대와 경제, 그리고 국민들 스스로 여러 가지를 준비해야 합니다. 이를 실행하지 않으면 우리는 우리 자신의 형제자매들에게 뒤통수를 맞을 수도 있습니다."
 CAN_Secure_loyalty_army: "민병대 충성심 확보"
 CAN_Secure_loyalty_army_desc: "민병대는 캐나다의 국민이 아닌 왕실에 충성하는 많은 장교들이 이끌고 있습니다. 입법적 수단과 소규모 선전을 통해 우리는 그들의 충성심을 확보할 수 있을 것입니다."
 CAN_Convince_French_Irish: "프랑스계와 아일랜드계 설득"
 CAN_Convince_French_Irish_desc: "프랑스계와 아일랜드계는 영국 제국주의의 희생자였으므로, 그들 자신의 독립뿐만 아니라 우리의 독립을 위해 싸우도록 쉽게 설득할 수 있을 것입니다."
 CAN_Convince_Indiginous: "원주민 설득"
 CAN_Convince_Indiginous_desc: "원주민들은 영국 제국주의의 가장 최근 희생자들입니다. 그들에게 몇 가지를 약속함으로써 그들이 기꺼이 싸우도록 만들 수 있을 것입니다. 그들이 더욱 작은 집단이 되기 전에 말이죠."
 CAN_prepare_military: "군사 계획 준비"
 CAN_prepare_military_desc: "더 효과적으로 싸우기 위해 새로운 계획을 세워야 합니다."
 CAN_prepare_economy_pop: "경제 및 인구 준비"
 CAN_prepare_economy_pop_desc: "영국과의 전쟁은 군대뿐만 아니라 경제와 민간인에게도 파괴적인 결과를 가져올 수 있습니다. 이를 막거나 최소한 제한하기 위해 우리는 선제적인 조치를 취할 것입니다."
 CAN_secure_supplies_civ: "민간인 물자 확보"
 CAN_secure_supplies_civ_desc: "캐나다 민간인들이 이 전쟁으로 가장 큰 영향을 받을 것이라는 점은 명백합니다. 최소한 그들이 잘 먹도록 추가 식량이 준비될 것입니다."
 CAN_secure_supplies_mil: "군대 물자 확보"
 CAN_secure_supplies_mil_desc: "민간인이 독립 전쟁으로 가장 큰 영향을 받을 가능성이 높습니다. 그러나 우리는 병사들에게 식량을 계속 공급하기 위해 군대에 식량을 공급해야 합니다. 한편 국민들은 군대에 입대하거나 고통을 견뎌야 할 것입니다."
 CAN_prepare_financial_aid_economy: "경제를 위한 재정 지원 준비"
 CAN_prepare_financial_aid_economy_desc: "독립을 얻은 후에도 파괴된 경제와 절망에 빠진 인구는 우리를 다음 위기로 곧바로 몰아넣을 것입니다. 이를 막기 위해 전쟁 중 도움이 필요한 기업 및 기타 대상에게 제공할 재정 지원이 준비될 것입니다."
 CAN_direct_money_Military: "군대에 자금 지원"
 CAN_direct_money_Military_desc: "이 전쟁을 짧게 끝내기 위해 군대에 더 많은 자금을 투입할 것입니다."
 CAN_internally_prepared: "내부적으로 준비됨"
 CAN_internally_prepared_desc: "우리는 할 수 있는 최선을 다해 스스로를 준비했습니다."
 CAN_Freedom_Canada: "캐나다의 자유"
 CAN_Freedom_Canada_desc: "이제 모든 캐나다를 영국 제국주의로부터 해방시키고 독립을 쟁취할 때가 왔습니다."
 CAN_Policies_War: "전쟁 중 정책"
 CAN_Policies_War_desc: "우리의 독립 전쟁이 시작되었습니다. 이제 우리는 독립을 얻거나 시도하다가 죽을 것입니다."
 CAN_Hard_times_people: "국민을 위한 어려운 시기"
 CAN_Hard_times_people_desc: "국민들은 진실을 알 권리가 있으며, 패배에 대해 거짓말을 해서는 안 됩니다."
 CAN_Great_times_people: "국민을 위한 위대한 시기"
 CAN_Great_times_people_desc: "선전 캠페인은 우리가 계속 나아가고 이 전쟁을 견뎌낼 수 있게 해 줄 것입니다."
 CAN_Private_Economy: "민간 경제"
 CAN_Private_Economy_desc: "기업들은 대부분 자체적으로 운영할 수 있도록 허용될 것입니다."
 CAN_Middle_Way: "중도"
 CAN_Middle_Way_desc: "중요하지 않은 산업들을 군수 공장으로 재편하여 더 많은 무기를 만들 수 있도록 할 것입니다."
 CAN_Nationalise_Economy: "경제 국유화"
 CAN_Nationalise_Economy_desc: "국민들이 고통받고 있지만, 영국이 그들의 고향을 침공한다면 훨씬 더 큰 고통을 겪을 것입니다. 따라서 우리는 더 큰 이익을 위해 덜 나쁜 것을 선택할 것입니다."
 CAN_Emergency_Powers: "비상 권한"
 CAN_Emergency_Powers_desc: "일부 사람들에게 비상 권한이 부여되어 모두를 대신해 더 신속한 결정을 내릴 수 있게 될 것입니다."
 CAN_Negotiatens_Britain: "평화 제안"
 CAN_Negotiatens_Britain_desc: "캐나다 본토는 이제 우리의 통제하에 있으며, 우리는 영국에게 자유로운 캐나다를 요구할 수 있습니다. 비록 뉴펀들랜드는 당분간 대영제국에 남겠지만 말이죠."
 CAN_Independent_Canada: "독립 캐나다"
 CAN_Independent_Canada_desc: "캐나다가 마침내 독립했으며, 이제 우리 자신의 운명을 선택할 수 있습니다."
 CAN_Independent_Failed: "독립 전쟁 실패"
 britishcanada.1.t: "해양 연합?"
 britishcanada.1.d: "최근 노바스코샤와 뉴브런즈윅 간 해양 연합 제안에 대한 논쟁이 있었습니다. 일부에서는 이를 캐나다의 '주권으로 나아가는 첫걸음'으로 보지만, 지금은 단지 지역 연합일 뿐입니다. 어떻게 해야 할까요?"
 britishcanada.1.a: "이에 대한 회의를 개최해야 합니다."
 britishcanada.1.b: "아닙니다, 우리는 지금처럼 주권을 유지해야 합니다."
 britishcanada.2.t: "해양 연합?"
 britishcanada.2.d: "노바스코샤가 이 지역에서의 양측 노력을 증진하기 위해 지역 해양 연합을 제안했습니다. 이 제안에 동의하십니까?"
 britishcanada.2.a: "그들의 제안은 좋습니다. 회의에 동의합니다."
 britishcanada.2.b: "아닙니다, 우리는 지금처럼 주권을 유지해야 합니다."
 britishcanada.3.t: "해양 연합과 캐나다"
 britishcanada.3.d: "[NVS.GetNameDef]와 [BRK.GetNameDef]가 최근 몇 주간 지역 연합을 위한 협상을 시작했습니다! 많은 사람들이 우리가 이러한 협상에서 제외되어서는 안 된다고 생각합니다. 총회를 제안해야 할까요?"
 britishcanada.3.a: "회의에 동의하고 참여를 요청하겠습니다."
 britishcanada.3.b: "회의를 막아야 합니다. 우리 없이는 개최될 수 없습니다."
 britishcanada.4.t: "샬럿타운 회의"
 britishcanada.4.d: "일전에 우리가 계획했던 캐나다 해안 일부 지방의 연합에 대한 회의가 이제 열립니다! 모든 대표단이 도착하여 협상이 시작되었습니다. 흥미롭게도, 대중은 20년 만에 샬럿타운을 방문한 첫 서커스에 더 관심이 많은 듯합니다..."
 britishcanada.4.a: "우선, 노바스코샤 문제를 다루겠습니다."
 britishcanada.5.t: "뉴브런즈윅과의 통일"
 britishcanada.5.d: "회의가 시작되었고, 뉴브런즈윅과의 통일이 첫 번째 의제로 상정되었습니다. 하지만 우리 대표단 중 일부는 재고하는 것처럼 보입니다. 회의는..."
 britishcanada.5.a: "...그럼에도 불구하고 계속되었고 협상이 진행되었습니다."
 britishcanada.5.b: "...우리 대표단이 회의장을 박차고 나가면서 끝났습니다!"
 britishcanada.6.t: "캐나다와의 통일"
 britishcanada.6.d: "이제 우리 지역 연합이 완성되었으니, 캐나다 지방과 공식적으로 통일할 때입니다. 일부 시민들은 주권을 요구하고 있지만, 지금 물러나는 것은 심각한 위반이 될 것입니다."
 britishcanada.6.a: "협상을 진행시키자."
 britishcanada.6.b: "거부하고 협상에서 나가자!"
 britishcanada.7.t: "캐나다 연방의 탄생"
 britishcanada.7.d: "회의에 참석한 세 주가 합병되면서 마침내 캐나다 지방들의 연방을 창설하는 데 성공했습니다! 모든 캐나다인에게 정말 기쁜 날입니다!"
 britishcanada.7.a: "훌륭합니다!"
 britishcanada.8.t: "허드슨만 양도"
 britishcanada.8.d: "영국은 지역 연합이 잘 진행되는 것을 보고 [HBC.GetNameDef]로부터 우리에게 토지 헌장을 부여하기로 결정했습니다. 우리는 이제 합법적으로 영토를 취득했으며 행정부를 설치하기만 하면 됩니다."
 britishcanada.8.a: "[CAN.GetNameDef]에게 위대한 날입니다!"
 britishcanada.9.t: "퀘벡 회의"
 britishcanada.9.d: "캐나다 지역의 최근 정치적 변화로 인해 오늘 퀘벡에서 회의가 열리고 있습니다. 논의 주제는 아직 완전히 정해지지 않았으므로, 우리가 원하는 대로 영향을 미칠 수 있습니다..."
 britishcanada.9.a: "연방의 미래와 [ENG.GetNameDef]와의 관계에 대해 논의합니다."
 britishcanada.9.b: "캐나다의 국가 주권과 [ENG.GetNameDef]로부터의 거리에 대해 논의합니다."
 britishcanada.9.c: "뉴펀들랜드의 행정에 대해 논의하고 연방에 추가해달라고 요청합니다."
 britishcanada.10.t: "새로운 브리티시컬럼비아"
 britishcanada.10.d: "최근 통과된 북미법으로 캐나다가 진정한 연방으로 나아가고 있는 만큼, 우리 지역도 행정 변화를 겪을 때입니다. 일부 영국 장관들은 밴쿠버 섬(퀸 샬럿 섬 포함)과의 연합을 제안했습니다. 이는 또한 우리가 [HBC.GetNameDef]로부터 독립하는 데 도움이 될 것입니다. 이 기회를 가능한 한 빨리 추구해야 합니다."
 britishcanada.10.a: "절차는 즉시 시작될 것입니다."
 britishcanada.11.t: "캐나다 지방 입법 의회"
 britishcanada.11.d: "1859년 5월 14일, 캐나다 지방 입법 의회는 빅토리아 여왕과 왕실 가족에게 빅토리아 다리 개통식을 위해 몬트리올을 방문해달라고 청원했습니다. 경쟁 정치인들의 손에 런던을 맡기고 싶지 않았던 빅토리아 여왕은 대신 그녀의 아들인 웨일스 공 앨버트 에드워드(훗날 에드워드 7세)를 대신하여 캐나다의 초대를 수락했습니다. 웨일스 공은 1860년 뉴펀들랜드, 뉴브런즈윅, 노바스코샤, 프린스 에드워드 아일랜드, 그리고 캐나다 지방을 2개월간 순회했습니다. 웨일스 공의 왕실 순회는 다음 세기 동안 미래의 왕실 순회를 위한 표준 모델로 사용되었습니다."
 britishcanada.11.a: "서명하자!"
 britishcanada.11.b: "서명하지 말자."
 britishcanada.12.t: "이런 바보들"
 britishcanada.12.d: "우리가 캐나다 지방 입법 의회에 서명하지 않은 것은 일반 시민들 사이에서 문제를 일으켰습니다. 사람들은 우리 국가를 이끌 기술에 대해 의심하고 있으며, 반란의 속삭임이 커지고 있습니다."
 britishcanada.12.a: "어차피 우리는 영국이 필요 없습니다."
 britishcanada.13.t: "앨버트 왕자가 캐나다로 여행합니다"
 britishcanada.13.d: "오늘 왕자는 HMS 히어로에 탑승했으며 그의 여정이 시작되었습니다. 그는 캐나다를 방문하는 최초의 영국 왕족이 될 것입니다."
 britishcanada.13.a: "안전한 여행 되세요."
 britishcanada.14.t: "앨버트 왕자가 뉴펀들랜드에 도착했습니다"
 britishcanada.14.d: "웨일스 공은 1860년 7월 24일 HMS 히어로를 타고 뉴펀들랜드의 세인트존스에 도착했습니다. 웨일스 공이 받은 환영은 왕실 순회 동안 다른 환영회에 대한 패턴을 설정했습니다. 환영회는 일반적으로 알현소에서의 공식 연설과 웨일스 공을 기리는 공식 무도회를 포함했습니다. 그곳에 있는 동안 그는 세인트존스 레가타에 참석했고, 뉴펀들랜드 주민들을 대신하여 뉴펀들랜드 개를 선물 받았습니다. 세인트존스에서 출발하여 그는 8월 2일 핼리팩스에 도착했습니다. 핼리팩스에 있는 동안 그는 할아버지인 켄트와 스트래선 공작이 사용했던 시골집인 프린스스 로지를 방문했습니다. 핼리팩스에서 왕실 일행은 기차를 타고 윈저와 헨츠포트에 멈췄고, 그곳에서 HMS 스틱스에 탑승하여 펀디만을 건너 세인트존으로 향했습니다. 8월 4일, 왕자는 증기선 포레스트 퀸을 타고 세인트존 강을 통해 프레더릭턴으로 여행했습니다. 그곳에 있는 동안 그는 왕실 만찬회에 참석했고, 공원을 개장했습니다. 프레더릭턴 방문에 이어 그는 노바스코샤의 픽투로 여행하여 HMS 히어로에 다시 탑승하고 세인트존과 윈저를 포함한 여러 지역 사회로 돌아왔습니다."
 britishcanada.14.a: "그에게 선물을 주자."
 britishcanada.14.b: "선물이라니, 무슨 선물?"
 britishcanada.15.t: "앨버트 왕자가 샬럿타운에 도착했습니다"
 britishcanada.15.d: "그는 8월 10일 프린스에드워드아일랜드의 샬럿타운에 상륙하여 프린스에드워드아일랜드 주지사 조지 던다스의 환영을 받았고, 정부청사로 향했습니다. 그곳에서 그는 프린스에드워드아일랜드 행정 위원회와 접견했습니다. 공식 무도회와 알현회 외에도 왕자는 샬럿타운 주변 시골을 둘러보았고, 주의사당을 방문하여 행정 위원회로부터 연설을 들었습니다. 출발할 때 그는 주지사에게 자선 목적으로 150파운드를 남겼습니다."
 britishcanada.15.a: "왕자를 위해 무도회를 조직하자."
 britishcanada.15.b: "대신 돈을 아끼자."
 britishcanada.16.t: "앨버트 왕자가 퀘벡에 도착했습니다"
 britishcanada.16.d: "웨일스 공은 페르세 바위 근처에서 HMS 히어로에 탑승한 캐나다 대표단에 의해 캐나다 지방으로 공식적으로 환영받았습니다. 캐나다 환영 대표단은 캐나다 지방 총독인 에드먼드 워커 헤드와 공동 총리인 조지 에티엔 카르티에, 존 A. 맥도널드로 구성되었습니다. 8월 17일 퀘벡 시에 도착한 왕자는 입법 위원회 의장인 나르시스 벨로와 입법 의회 의장인 헨리 스미스에게 기사 작위를 수여했습니다. 그곳에 있는 동안 그는 또한 몽모랑시 폭포를 방문했고 라발 대학교에서 연설했습니다."
 britishcanada.16.a: "왕자의 몬트리올 방문을 위해 준비를 시작하자."
 britishcanada.17.t: "앨버트 왕자가 몬트리올에 도착했습니다"
 britishcanada.17.d: "퀘벡 시 방문에 이어 웨일스 공은 트루아리비에르 근처에서 여러 입법 의회 의원들과 합류하여 HMS 히어로를 타고 몬트리올로 향했습니다. 몬트리올에 도착하여 그는 특별히 제작된 개방형 철도 차량을 타고 푸앵트생샤를에 있는 빅토리아 다리로 이동하여 다리의 마지막 돌을 제자리에 두드렸습니다. 몬트리올에 머무는 5일 동안 그는 부왕 관저인 스펜서우드에 머물렀고, 도시의 크리스탈 팰리스 개장식에 참석하여 군중에게 한 연설에서 캐나다인들이 만국박람회에서 보여준 호의적인 인상을 상기시켰습니다."
 britishcanada.17.a: "왕자를 만국박람회에 초대하자."
 britishcanada.17.b: "그는 충분히 많은 박람회를 보았을 것입니다."
 britishcanada.18.t: "앨버트 왕자가 오타와에 도착했습니다"
 britishcanada.18.d: "오타와에서 왕자는 국회의사당의 주춧돌을 놓았고, 오타와 강에서 카누를 탔으며, 쇼디에르 폭포의 목재 슬라이드를 탔습니다. 더 서쪽으로 항해하여 왕자는 코버그, 라이스 호수, 피터버러를 방문하여 미시소가족으로부터 환대를 받았습니다."
 britishcanada.18.a: "왕자가 즐거운 시간을 보냈기를 바랍니다!"
 britishcanada.19.t: "반가톨릭 시위"
 britishcanada.19.d: "왕자가 증기선 킹스턴을 타고 토론토로 여행하는 동안, 벨빌과 킹스턴 방문이 계획되었지만, 오렌지 오더의 반가톨릭 시위대가 왕자가 하선하는 것을 막았습니다. 왕자를 논란에 휩싸이게 하지 않기 위해, 왕자와 함께 순회에 합류한 국무부 차관 헨리 펠햄클린턴은 시장들에게 시위대가 해산될 때까지 하선하지 않을 것이라고 알렸습니다. 그는 포트 호프로 이동한 다음 킹스턴에 다시 탑승하여 토론토로 항해했습니다."
 britishcanada.19.a: "앨버트 왕자는 괜찮으신가요?!"
 britishcanada.20.t: "앨버트 왕자가 토론토에 도착했습니다"
 britishcanada.20.d: "토론토에서 열린 알현회에서 왕자는 벨빌과 킹스턴 대표단으로부터 초기 사건에 대한 사과를 받았습니다. 9월 10일, 그는 콜링우드로 하루 동안 소풍을 갔다가 다음 날 토론토로 돌아왔습니다. 돌아오는 길에 그는 오로라, 배리, 브래드퍼드, 뉴마켓을 방문하여 연설을 들었습니다. 토론토에서 왕자는 왕립 캐나다 요트 클럽의 레가타에 참석하여 후원자가 되기로 동의했습니다. 또한 앨런 가든스와 퀸스 파크를 대중에게 개방했습니다. 그는 9월 12일 런던(온타리오)으로 떠났고, 도중에 궬프와 스트랫퍼드를 방문했습니다."
 britishcanada.20.a: "온타리오에서 왕자의 방문을 준비하자."
 britishcanada.21.t: "원주민 대표들과의 만남"
 britishcanada.21.d: "왕자는 나중에 런던에서 사니아로 가서 캐나다 지방의 원주민 대표 150명이 모인 모임에 참석했습니다. 이 모임에 이어 그는 잠시 런던으로 돌아왔다가 기차를 타고 나이아가라 반도로 이동했습니다."
 britishcanada.21.a: "틀림없이 나이아가라 폭포를 즐길 것입니다."
 britishcanada.22.t: "나이아가라 폭포를 감상하며"
 britishcanada.22.d: "반도에서 그는 브랜트퍼드, 치페와, 포트 이리, 퀸스턴을 방문했습니다. 나이아가라 폭포는 폭포를 순회하는 동안 처음으로 조명되었습니다. 그곳에서 그는 메이드 오브 더 미스트(안개 속의 처녀)를 탔습니다. 퀸스턴에서 그는 1812년 전쟁 참전 용사 160명을 만났고, 재건된 브록 기념비를 헌정했으며, 로라 세코드의 집을 방문했습니다. 퀸스턴에서 그는 나이아가라-온-더-레이크, 세인트 캐서린스, 해밀턴으로 이동했습니다."
 britishcanada.22.a: "훌륭합니다!"
 britishcanada.23.t: "왕자가 영국으로 돌아갑니다"
 britishcanada.23.d: "9월 말에 캐나다 지방 왕실 순회를 마치고, 웨일스 공은 온타리오주 윈저에서 미국으로 출발했습니다. 한 달간의 개인적인 미국 순회를 하면서 그는 자신에게 관심을 끌지 않기 위해 '렌프루 경'이라는 가명을 사용했습니다. 캐나다 공동 총리들은 왕자가 캐나다를 떠날 때와 다시 미국을 떠날 때 왕자를 배웅하기 위해 1860년 10월 20일 메인주 포틀랜드로 이동했습니다."
 britishcanada.23.a: "안전한 여정 되세요."
 britishcanada.24.t: "새로운 캐나다 수도"
 britishcanada.24.d: "캐나다에 식민지 행정부를 설립한 이래로 식민지 국가의 기능적 수도는 토론토였습니다. 그러나 국가가 발전함에 따라 새로운 수도의 잠재적 필요성이 분명해졌고, 그래서 빅토리아 여왕에게 캐나다의 수도를 어디에 둘지 선택하도록 요청했습니다. 그녀의 선택은..."
 britishcanada.24.a: "...지금 있는 토론토에 유지하는 것입니다."
 britishcanada.24.b: "...크고 중심적인 도시인 오타와로 옮기는 것입니다."
 britishcanada.24.c: "...프랑스계 캐나다인이 많은 도시인 몬트리올로 옮기는 것입니다."
 britishcanada.25.t: "해양 조약에 대한 우리의 입장"
 britishcanada.25.d: "[CAN.GetNameDef]는 최근 노바스코샤 및 뉴브런즈윅의 옛 식민지 정부와 통합하여 단순한 지방으로서의 옛 지위를 버렸습니다. 이는 소위 '해양 조약'을 통해 이루어졌으며, 세 식민지는 통일에 합의했습니다. 우리는 이 조약에 대한 우리의 입장을 공개해야 합니다."
 britishcanada.25.a: "조약을 지지한다!"
 britishcanada.25.b: "조약을 비난한다!"
 britishcanada.26.t: "[CAN.GetName]이 뉴펀들랜드를 요청합니다"
 britishcanada.26.d: "캐나다 연방은 최근 퀘벡에서 열린 회의에서 뉴펀들랜드의 연방 가입을 허락해달라고 요청했습니다. 그들은 경제 및 행정 연합이 지금까지 회원 지방에 도움이 되었으며, 뉴펀들랜드도 이로부터 혜택을 받을 것이라고 주장했습니다. 우리는 어떻게 응답해야 할까요?"
 britishcanada.26.a: "네, 뉴펀들랜드는 연방에 추가되어야 합니다."
 britishcanada.26.b: "어떻게 그런 생각을 했지? 잊으라고 말하십시오."
 eoanb_tt_ENG_event_britaincanada_4_a: "우리는 북미법 초안을 작성하기 시작할 것입니다.\n\n한 달 안에 끝날 것입니다."
 britishcanada.27.t: "런던 회의"
 britishcanada.27.d: "캐나다가 이미 자체적인 작은 연방으로 '비공식적인' 통일 과정을 거쳤으므로, 이제 우리가 그들의 연방을 전체적인 공식 실체로 제대로 인정할 때가 왔습니다. 이것은 캐나다 지방의 추가 통일에 도움이 될 것입니다."
 britishcanada.27.a: "일부 조약 초안을 작성하기 시작하자!"
 eoanb_om_ENG_CAN_no_recognition: "연방을 무시했습니다."
 britishcanada.28.t: "북미법"
 britishcanada.28.d: "우리는 북미 캐나다 지방의 상황에 관한 조약을 초안했습니다. 주로 다루는 문제는 일부 지방들 사이에 형성된 '연방'입니다. 우리의 조약은 다음과 같이 명시합니다..."
 britishcanada.28.a: "...우리가 캐나다의 연합 연방을 인정한다는 것입니다."
 britishcanada.28.b: "...우리가 그들의 지방들의 경제 및 행정 연합만을 인정한다는 것입니다."
 britishcanada.29.t: "루퍼츠랜드 매각?"
 britishcanada.29.d: "[CAN.GetNameDef]가 루퍼츠랜드를 매입할 것을 요청했으며, 이는 사실상 그들이 [HBC.GetNameDef]를 모두 인수하는 것이 될 것입니다. 우리는 어떻게 말해야 할까요?"
 britishcanada.29.a: "승인."
 britishcanada.29.b: "거절."
 britishcanada.30.t: "1860년 왕실 순회"
 britishcanada.30.d: "1859년 5월 14일, 캐나다 지방 입법 의회는 빅토리아 여왕과 왕실 가족에게 빅토리아 다리 개통식을 위해 몬트리올을 방문해달라고 청원했습니다. 경쟁 정치인들의 손에 런던을 맡기고 싶지 않았던 빅토리아 여왕은 대신 그녀의 아들인 웨일스 공 앨버트 에드워드(훗날 에드워드 7세)를 대신하여 캐나다의 초대를 수락했습니다. 웨일스 공은 1860년 뉴펀들랜드, 뉴브런즈윅, 노바스코샤, 프린스 에드워드 아일랜드, 그리고 캐나다 지방을 2개월간 순회했습니다. 웨일스 공의 왕실 순회는 다음 세기 동안 미래의 왕실 순회를 위한 표준 모델로 사용되었습니다."
 britishcanada.30.a: "앨버트 왕자를 보내자."
 britishcanada.31.t: "앨버트 왕자가 캐나다로 여행합니다"
 britishcanada.31.d: "오늘 왕자는 HMS 히어로에 탑승했으며 그의 여정이 시작되었습니다. 그는 캐나다를 방문하는 최초의 영국 왕족이 될 것입니다."
 britishcanada.31.a: "안전한 여행 되세요."
 britishcanada.32.t: "앨버트 왕자가 뉴펀들랜드에 도착했습니다"
 britishcanada.32.d: "웨일스 공은 1860년 7월 24일 HMS 히어로를 타고 뉴펀들랜드의 세인트존스에 도착했습니다. 웨일스 공이 받은 환영은 왕실 순회 동안 다른 환영회에 대한 패턴을 설정했습니다. 환영회는 일반적으로 알현소에서의 공식 연설과 웨일스 공을 기리는 공식 무도회를 포함했습니다. 그곳에 있는 동안 그는 세인트존스 레가타에 참석했고, 뉴펀들랜드 주민들을 대신하여 뉴펀들랜드 개를 선물 받았습니다. 세인트존스에서 출발하여 그는 8월 2일 핼리팩스에 도착했습니다. 핼리팩스에 있는 동안 그는 할아버지인 켄트와 스트래선 공작이 사용했던 시골집인 프린스스 로지를 방문했습니다. 핼리팩스에서 왕실 일행은 기차를 타고 윈저와 헨츠포트에 멈췄고, 그곳에서 HMS 스틱스에 탑승하여 펀디만을 건너 세인트존으로 향했습니다. 8월 4일, 왕자는 증기선 포레스트 퀸을 타고 세인트존 강을 통해 프레더릭턴으로 여행했습니다. 그곳에 있는 동안 그는 왕실 만찬회에 참석했고, 공원을 개장했습니다. 프레더릭턴 방문에 이어 그는 노바스코샤의 픽투로 여행하여 HMS 히어로에 다시 탑승하고 세인트존과 윈저를 포함한 여러 지역 사회로 돌아왔습니다."
 britishcanada.32.a: "훌륭합니다."
 britishcanada.33.t: "앨버트 왕자가 샬럿타운에 도착했습니다"
 britishcanada.33.d: "그는 8월 10일 프린스에드워드아일랜드의 샬럿타운에 상륙하여 프린스에드워드아일랜드 주지사 조지 던다스의 환영을 받았고, 정부청사로 향했습니다. 그곳에서 그는 프린스에드워드아일랜드 행정 위원회와 접견했습니다. 공식 무도회와 알현회 외에도 왕자는 샬럿타운 주변 시골을 둘러보았고, 주의사당을 방문하여 행정 위원회로부터 연설을 들었습니다. 출발할 때 그는 주지사에게 자선 목적으로 150파운드를 남겼습니다."
 britishcanada.33.a: "돈이 좋은 곳에 쓰이기를 바랍니다."
 britishcanada.34.t: "앨버트 왕자가 퀘벡에 도착했습니다"
 britishcanada.34.d: "웨일스 공은 페르세 바위 근처에서 HMS 히어로에 탑승한 캐나다 대표단에 의해 캐나다 지방으로 공식적으로 환영받았습니다. 캐나다 환영 대표단은 캐나다 지방 총독인 에드먼드 워커 헤드와 공동 총리인 조지 에티엔 카르티에, 존 A. 맥도널드로 구성되었습니다. 8월 17일 퀘벡 시에 도착한 왕자는 입법 위원회 의장인 나르시스 벨로와 입법 의회 의장인 헨리 스미스에게 기사 작위를 수여했습니다. 그곳에 있는 동안 그는 또한 몽모랑시 폭포를 방문했고 라발 대학교에서 연설했습니다."
 britishcanada.34.a: "다음 목적지는 몬트리올입니다."
 britishcanada.35.t: "앨버트 왕자가 몬트리올에 도착했습니다"
 britishcanada.35.d: "퀘벡 시 방문에 이어 웨일스 공은 트루아리비에르 근처에서 여러 입법 의회 의원들과 합류하여 HMS 히어로를 타고 몬트리올로 향했습니다. 몬트리올에 도착하여 그는 특별히 제작된 개방형 철도 차량을 타고 푸앵트생샤를에 있는 빅토리아 다리로 이동하여 다리의 마지막 돌을 제자리에 두드렸습니다. 몬트리올에 머무는 5일 동안 그는 부왕 관저인 스펜서우드에 머물렀고, 도시의 크리스탈 팰리스 개장식에 참석하여 군중에게 한 연설에서 캐나다인들이 만국박람회에서 보여준 호의적인 인상을 상기시켰습니다."
 britishcanada.35.a: "훌륭합니다."
 britishcanada.36.t: "앨버트 왕자가 오타와에 도착했습니다"
 britishcanada.36.d: "오타와에서 왕자는 국회의사당의 주춧돌을 놓았고, 오타와 강에서 카누를 탔으며, 쇼디에르 폭포의 목재 슬라이드를 탔습니다. 증기선 킹스턴을 타고 토론토로 여행하는 동안, 벨빌과 킹스턴 방문이 계획되었지만, 오렌지 오더의 반가톨릭 시위대가 왕자가 하선하는 것을 막았습니다. 왕자를 논란에 휩싸이게 하지 않기 위해, 왕자와 함께 순회에 합류한 국무부 차관 헨리 펠햄클린턴은 시장들에게 시위대가 해산될 때까지 하선하지 않을 것이라고 알렸습니다. 그는 더 서쪽으로 항해하여 코버그, 라이스 호수, 피터버러를 방문하여 미시소가족으로부터 환대를 받았습니다. 그는 포트 호프로 이동한 다음 킹스턴에 다시 탑승하여 토론토로 항해했습니다."
 britishcanada.36.a: "멋진 여행이 될 것 같군요."
 britishcanada.37.t: "앨버트 왕자가 토론토에 도착했습니다"
 britishcanada.37.d: "토론토에서 열린 알현회에서 왕자는 벨빌과 킹스턴 대표단으로부터 초기 사건에 대한 사과를 받았습니다. 9월 10일, 그는 콜링우드로 하루 동안 소풍을 갔다가 다음 날 토론토로 돌아왔습니다. 돌아오는 길에 그는 오로라, 배리, 브래드퍼드, 뉴마켓을 방문하여 연설을 들었습니다. 토론토에서 왕자는 왕립 캐나다 요트 클럽의 레가타에 참석하여 후원자가 되기로 동의했습니다. 또한 앨런 가든스와 퀸스 파크를 대중에게 개방했습니다. 그는 9월 12일 런던(온타리오)으로 떠났고, 도중에 궬프와 스트랫퍼드를 방문했습니다. 런던에서 그는 사니아로 가서 캐나다 지방의 원주민 대표 150명이 모인 모임에 참석했습니다. 이 모임에 이어 그는 잠시 런던으로 돌아왔다가 기차를 타고 나이아가라 반도로 이동했습니다. 반도에서 그는 브랜트퍼드, 치페와, 포트 이리, 퀸스턴을 방문했습니다. 나이아가라 폭포는 폭포를 순회하는 동안 처음으로 조명되었습니다. 그곳에서 그는 메이드 오브 더 미스트(안개 속의 처녀)를 탔습니다. 퀸스턴에서 그는 1812년 전쟁 참전 용사 160명을 만났고, 재건된 브록 기념비를 헌정했으며, 로라 세코드의 집을 방문했습니다. 퀸스턴에서 그는 나이아가라-온-더-레이크, 세인트 캐서린스, 해밀턴으로 이동했습니다."
 britishcanada.37.a: "집으로 돌아가자."
 britishcanada.38.t: "왕자가 영국으로 돌아갑니다"
 britishcanada.38.d: "9월 말에 캐나다 지방 왕실 순회를 마치고, 웨일스 공은 온타리오주 윈저에서 미국으로 출발했습니다. 한 달간의 개인적인 미국 순회를 하면서 그는 자신에게 관심을 끌지 않기 위해 '렌프루 경'이라는 가명을 사용했습니다. 캐나다 공동 총리들은 왕자가 캐나다를 떠날 때와 다시 미국을 떠날 때 왕자를 배웅하기 위해 1860년 10월 20일 메인주 포틀랜드로 이동했습니다."
 britishcanada.38.a: "이 순회 비용이 많이 들지 않았기를 바랍니다."
 britishcanada.39.t: "노바스코샤 철도 완공"
 britishcanada.39.d: "이 철도는 식민지간 철도 회담과 몇 차례의 성과 없는 민간 제안이 실패한 후 노바스코샤가 이끄는 정부 건설 철도가 필요하다고 느꼈던 선견지명이 있는 노바스코샤 지도자 조셉 하우의 핵심 프로젝트였습니다."
 britishcanada.39.a: "환상적입니다!"
 britishcanada.40.t: "그랜드 트렁크 철도 연대 창설"
 britishcanada.40.d: "새로 창설된 연대는 대부분 여단으로 조직된 철도 노동자들로 구성되어 있습니다. 정부가 제공한 의용군으로 여단의 구멍을 메우는 한편, 장비 비용은 철도 회사, 자본가, 심지어 일부 귀족들이 지불했으며, 일부 대포도 구매되었습니다."
 britishcanada.40.a: "이제 아무도 우리 기차를 습격할 만큼 어리석지 않을 것입니다."
 britishcanada.41.t: "조선소 개장!"
 britishcanada.41.d: "이 프로젝트에 수개월간 자금이 투입된 끝에 오늘 조선소가 문을 열었으며 이제 우리의 주문을 기다리고 있습니다."
 britishcanada.41.a: "즉시 배를 몇 척 주문해야 합니다."
 britishcanada.42.t: "군수 공장 개장!"
 britishcanada.42.d: "이 프로젝트에 수개월간 자금이 투입된 끝에 오늘 군수 공장이 문을 열었으며 이제 우리의 주문을 기다리고 있습니다."
 britishcanada.42.a: "그들에게 몇 가지 주문을 하자."
 britishcanada.43.t: "캐나다 제품에 대한 수요 증가!"
 britishcanada.43.d: "지난 몇 주 동안 미국 내전으로 인해 제품에 대한 높은 수요가 발생했습니다. 이로 인해 우리는 더 높은 세수를 창출하고 있습니다."
 britishcanada.43.a: "훌륭합니다!"
 britishcanada.46.t: "위대한 연합!"
 britishcanada.46.d: "오늘 여러 원래 반대파였던 정당들로 구성된 연합이 발표되었습니다. 이 연합은 이 식민지가 오랫동안 겪어온 정치적 교착 상태를 끝내고 두 캐나다를 하나로 묶어줄 것입니다. 연합은 조지-에티엔 카르티에가 이끄는 파르티 블뢰, 조지 브라운이 이끄는 클리어 그리츠, 존 A. 맥도널드가 이끄는 자유보수당으로 구성되어 있습니다. 이것은 확실히 긍정적인 발전이지만, 그들이 정확히 왜 동맹을 맺었는지는 분명하지 않습니다. 그러나 어느 정도 통일된 캐나다라는 공유된 목표가 그 이유일 것이라는 소문이 있습니다."
 britishcanada.46.a: "이것이 오래 지속되기를 바랍니다."
 britishcanada.47.t: "긴장 완화"
 britishcanada.47.d: "최근의 개혁과 구조적 변화가 긴장을 완화시킨 것 같습니다. 하지만 이것이 얼마나 오래 지속될까요?"
 britishcanada.47.a: "영원히 지속되기를 바랍니다."
 britishcanada.48.t: "캐나다 지방, 연방 결성 의지 표명!"
 britishcanada.48.d: "수년간의 정치적 불안정 끝에 캐나다 지방 정부는 영국 통치 아래 연방 캐나다에 대한 열망을 발표했습니다."
 britishcanada.48.a: "드디어!"
 britishcanada.49.t: "샬럿타운 회의"
 britishcanada.49.d: "어제 주의사당 입법 회의장에서 해양 연합에 대한 논의가 마무리되었습니다. 비록 우리가 초대받지 않았지만, 우리 대표단은 노바스코샤, 뉴브런즈윅, 뉴펀들랜드의 다른 대표단들을 설득하여 모든 영국령 북미 식민지의 통일을 위해 노력하도록 했습니다. 하지만 그러한 통일을 이루기 위해서는 몇 번 더 회의가 필요할 것 같습니다."
 britishcanada.49.a: "좋습니다."
 britishcanada.50.t: "샬럿타운 회의"
 britishcanada.50.d: "원래 샬럿타운 회의는 노바스코샤, 뉴브런즈윅, 뉴펀들랜드 간의 해양 연합을 시작하기 위한 것이었습니다. 원래 초대받지 않았던 캐나다 지방 대표단에 의해 우리 대표단들은 모든 영국령 북미 식민지의 통일을 위해 노력하도록 설득되었습니다."
 britishcanada.50.a: "아마도 이것이 더 좋을 수도 있습니다."
 britishcanada.51.t: "퀘벡 회의"
 britishcanada.51.d: "퀘벡 회의는 성공적이었습니다! 연방제와 단일 국가 창설을 둘러싼 많은 정책들이 상세히 설명되었고, 회의 끝에는 매우 포괄적인 결의안이 작성되었습니다. 이로써 왕실의 승인만 있다면 합병이 가능해졌습니다. 하지만 아쉽게도 뉴펀들랜드는 이 회의에 참여하지 않았습니다."
 britishcanada.51.a: "아주 좋습니다!"
 britishcanada.52.t: "런던 회의"
 britishcanada.52.d: "어제 캐나다에서 16명의 대표단이 제국의 수도인 런던에 도착하여 영국 정부 대표단과 만났습니다. 연방의 헌법적 세부 사항을 결정하기 위해 개최된 두 개의 큰 회의(샬럿타운 회의와 퀘벡 회의)에 이어, 퀘벡 시에서 합의된 72개 조항이 이제 영국 대표단에 의해 검토되고 수정되고 있습니다."
 britishcanada.52.a: "오래 걸리지 않기를 바랍니다."
 britishcanada.53.t: "통일에 대한 왕실의 동의!"
 britishcanada.53.d: "두 달 넘게 승인을 기다린 끝에 어제 여왕이 왕실의 동의를 내렸습니다! 따라서 캐나다가 통일될 것이 공식화되었습니다! 캐나다 지방, 노바스코샤, 뉴브런즈윅이 지금으로부터 넉 달 안에 통일될 것입니다!"
 britishcanada.53.a: "이제 얼마 남지 않았습니다."
 britishcanada.54.t: "캐나다의 형성!"
 britishcanada.54.d: "통일된 캐나다를 꿈꾼 지 수년 만에 드디어 꿈이 이루어졌습니다! 오늘 캐나다 지방, 노바스코샤, 뉴브런즈윅이 합병하여 캐나다로 알려지게 되었습니다."
 britishcanada.54.a: "마침내."
 britishcanada.55.t: "캐나다의 형성!"
 britishcanada.55.d: "통일된 캐나다를 꿈꾼 지 수년 만에 드디어 꿈이 이루어졌습니다! 오늘 캐나다 지방, 노바스코샤, 뉴펀들랜드, 뉴브런즈윅이 합병하여 캐나다로 알려지게 되었습니다. 뉴펀들랜드는 총선 투표 후 가입하지 않았습니다."
 britishcanada.55.a: "마침내."
 britishcanada.56.t: "협상 완료"
 britishcanada.56.d: "허드슨만 회사와 런던에서 6개월간 협상한 끝에 마침내 30만 파운드라는 가격에 합의했습니다. 토지는 2달 반 안에 우리에게 주어질 것입니다."
 britishcanada.56.a: "드디어!"
 britishcanada.57.t: "레드 강 반란"
 britishcanada.57.d: "어제 우리 군대가 매니토바 주를 점령하려 했을 때, 메티스 혈통의 반군들이 진입을 막았습니다. 그들은 어퍼 포트 개리를 점령했으며, 우리가 협상하여 결국 합의에 도달할 때까지 떠나지 않을 것입니다."
 britishcanada.57.a: "우리가 처리해야 합니다."
 britishcanada.44.t: "캐나다 의용군 도착!"
 britishcanada.44.d: "지난 며칠 동안 수천 명의 의용군이 우리를 돕기 위해 도착했습니다. 병사들을 검사하는 동안 상당수가 낡은 군복을 입고 있었습니다. 그들이 어떻게 그것을 얻었는지 우리 장교들에게 말하지 않았지만, 이 군복을 가져온 의용군 대부분이 캐나다 지방 출신이기 때문에 캐나다 지방이 관련되어 있는 것으로 의심됩니다."
 britishcanada.44.a: "좋습니다."
 britishcanada.45.t: "캐나다 의용군 도착!"
 britishcanada.45.d: "지난 며칠 동안 수천 명의 의용군이 우리를 돕기 위해 도착했습니다. 병사들을 검사하는 동안 상당수가 낡은 군복을 입고 있었습니다. 그들이 어떻게 그것을 얻었는지 우리 장교들에게 말하지 않았지만, 이 군복을 가져온 의용군 대부분이 캐나다 지방 출신이기 때문에 캐나다 지방이 관련되어 있는 것으로 의심됩니다."
 britishcanada.45.a: "좋습니다."
 britishcanada.60.t: "브리티시컬럼비아, 캐나다에 가입!"
 britishcanada.60.d: "수개월간의 협상 끝에 캐나다와 브리티시컬럼비아 정부 간에 합의가 이루어졌습니다. 브리티시컬럼비아가 연방에 가입하고, 그 대가로 10년 이내에 동서로 뻗는 대륙횡단 철도 건설이 시작될 것입니다."
 britishcanada.60.a: "마침내."
 britishcanada.58.t: "합의 도달"
 britishcanada.58.d: "반군들을 평화롭게 통합하기 위해 우리는 메티스 토지에 대한 소유권을 보장하는 법규를 인정했습니다. 이로 인해 사용할 수 있는 토지의 양은 전반적으로 줄었지만, 지역을 더 안정시켰습니다."
 britishcanada.58.a: "좋습니다."
 britishcanada.59.t: "반란 진압."
 britishcanada.59.d: "몇 주간의 요새 포격 끝에 반군들이 항복했습니다. 마침내 매니토바를 확보했지만, 이 군사 작전으로 인해 많은 현지인들이 지역을 떠났습니다. 또한 전국적으로 많은 시위가 조직되어 한동안 우리를 괴롭힐 것입니다. 반란을 일으킨 모든 메티스는 또한 그들의 땅을 박탈당했습니다."
 britishcanada.59.a: "우리가 이러지 말았어야 했습니다."
 britishcanada.68.t: "호혜 조약이 해체되었습니다!"
 britishcanada.68.d: "캐나다 기업에 유리한 무역 정책에 따라 어제 미국이 무역 조약을 해체했습니다. 캐나다-미국 호혜 조약은 양국 간에 더 자유롭게 무역할 수 있게 했습니다. 이 사건의 영향으로 캐나다의 경제 성장이 둔화될 것이며, 이 사건이 양국 정부 간의 관계에 영향을 미칠지는 불분명합니다."
 britishcanada.68.a: "이럴 수는 없습니다!"
 britishcanada.61.t: "뉴브런즈윅 습격"
 britishcanada.61.d: "지난 몇 주 동안 '페니언 형제단'이라는 단체가 전쟁단을 조직하여 뉴브런즈윅의 캠포벨로를 점령하려 했습니다. 영국 전함이 도착하자마자 전쟁단은 재빨리 미국 소유지로 후퇴했습니다. 페니언 형제단은 아일랜드가 자유롭고 주권적인 국가가 되기를 바라는 아일랜드 민족주의자들에 의해 조직되었습니다."
 britishcanada.61.a: "민병대를 동원하라."
 britishcanada.62.t: "페니언 형제단의 침략"
 britishcanada.62.d: "며칠 전 1,000~1,300명의 페니언으로 구성된 전쟁단이 나이아가라 강을 건너 캐나다 서부를 침략하려 했습니다. 이 침략은 우리 캐나다 민병대가 두 번의 전투에서 패배하고 미국이 개입하여 페니언의 보급선을 차단한 후에야 막을 수 있었습니다. 이제 미국 정부도 영국과의 중립법을 피하기 위해 페니언 지도자들을 체포하고 있습니다."
 britishcanada.62.a: "그 아일랜드 놈들..."
 britishcanada.63.t: "캐나다 동부의 침략 실패"
 britishcanada.63.d: "미국의 최선의 노력에도 불구하고, 페니언 전쟁단이 이번에는 동부에서 새로운 침략을 시도했습니다. 그들은 영토를 점령할 수 있었지만, 무기, 탄약, 보급품이 부족하여 도착한 최초의 캐나다 군대에 항복했습니다. 페니언 형제단은 마지막 발악을 하는 것으로 보이며, 더 이상의 주요 침략 시도는 없을 것으로 예상됩니다. 비록 소규모 습격은 여전히 발생할 수 있지만 말입니다."
 britishcanada.63.a: "드디어."
 britishcanada.64.t: "습격 중단"
 britishcanada.64.d: "아일랜드가 자유 국가가 되었기 때문에 페니언 습격은 거의 중단되었습니다."
 britishcanada.64.a: "훌륭합니다!"
 britishcanada.65.t: "농장 복구"
 britishcanada.65.d: "우리의 노력 덕분에 많은 농장이 다시 생산성을 되찾고 있으며 이미 로어 캐나다의 사람들에게 공급하고 있습니다."
 britishcanada.65.a: "아주 좋습니다."
 britishcanada.66.t: "더 많은 밀 농장이 생겨나고 있습니다!"
 britishcanada.66.d: "밀 생산을 확대하려는 우리의 노력이 효과를 본 것 같습니다. 많은 새로운 농장이 건설되었고 다른 농장들도 확장되었습니다."
 britishcanada.66.a: "좋습니다."
 britishcanada.67.t: "낙농업 형성"
 britishcanada.67.d: "우리 식민지로 산업을 유치하려는 우리의 노력이 성공한 것 같습니다. 지난 몇 달 동안 퀘벡과 특히 토론토에서 새로운 낙농업이 형성되었습니다."
 britishcanada.67.a: "아주 좋습니다!"
 britishcanada.69.t: "독립 사상 확산"
 britishcanada.69.d: "수년간의 정치적 교착 상태로 인해 급진적인 변화가 필요하다는 생각이 시민들 사이에 서서히 퍼지고 있습니다. 특히 우려되는 한 가지 생각은 캐나다가 정치 외교에 대해 더 많은 통제권을 갖고 궁극적으로 자신의 운명을 결정할 수 있도록 독립해야 한다는 것입니다."
 britishcanada.69.a: "이 문제를 즉시 해결해야 합니다."
 britishcanada.70.t: "집권한 반영국파"
 britishcanada.70.d: "이제 반영국 정치인들이 다수를 차지하여 자신들에게 유리하게 정치적 교착 상태를 해결했습니다. 게다가 그들은 모든 시민을 포함하는 캐나다의 새로운 시대를 발표했습니다."
 britishcanada.70.a: "좋습니다..."
 britishcanada.71.t: "지워진 생각들"
 britishcanada.71.d: "독립에 대한 생각과 아이디어가 우리 시민들의 마음속에서 제거된 것 같습니다. 이로 인해 우리는 다른 일에 집중할 수 있게 되었습니다."
 britishcanada.71.a: "드디어."
 britishcanada.72.t: "비밀 네트워크 구축"
 britishcanada.72.d: "신뢰할 수 있는 행정가, 정보원, 외교관, 정치인, 하사관으로 구성된 네트워크가 구축되었습니다. 이제 우리의 독립을 확보하려는 우리의 행동이 비밀로 유지되도록 우리의 모든 행적이 그들에 의해 가려질 것입니다."
 britishcanada.72.a: "좋습니다..."
 britishcanada.73.t: "낙관적인 대중"
 britishcanada.73.d: "대중은 상황이 얼마나 심각한지 보면서 조직화되었습니다... 시위하거나 반란을 일으키는 대신 대다수는 다른 날을 위해 싸우기로 결정했습니다."
 britishcanada.73.a: "이런 일은 예상치 못했습니다..."
 britishcanada.74.t: "지친 대중"
 britishcanada.74.d: "많은 사람들이 예상했듯이, 이 전쟁이 초래하는 파괴는 긍정적인 것이 아니며, 그것의 전체 규모를 본 사람들은 그것을 분명히 하고 있습니다. 많은 이들이 휴전을 원하고 심지어 일부는 영국 통치에 복종하는 것을 고려하고 있습니다."
 britishcanada.74.a: "배신자들!"
 britishcanada.75.t: "선전 활동 성공"
 britishcanada.75.d: "우리의 선전 활동은 매우 성공적이었습니다. 사람들은 영국 보복에 대한 두려움과 영국 제국주의로부터 자유로운 독립 캐나다에 대한 필요성 때문에 더 열심히 일하고 더 많이 희생하고 있습니다."
 britishcanada.75.a: "이것을 책임진 사람들에게 임금 인상을 해주자!"
 britishcanada.76.t: "선전 활동 실패"
 britishcanada.76.d: "우리 선전 기계의 제품은 효과가 없었습니다. 우리 국민들은 우리의 진실을 믿지 않았고, 파업과 영국과의 휴전을 요구하는 등 더 많은 것을 요구했습니다! 많은 신도들도 자신들이 '속았다'는 것을 깨달은 후 우리에 대한 믿음을 잃었습니다!"
 britishcanada.76.a: "이것을 책임진 사람들은 정부를 배신하고 우리의 승인 없이 이것을 발표했다는 소식을 퍼뜨린 죄로 재판에 회부될 것입니다."
 britishcanada.77.t: "캐나다 지방, 지원 요청"
 britishcanada.77.d: "캐나다 지방의 반영국 정당에서 온 비밀 대사관이 우리에게 요청을 가지고 접근했습니다. 간단히 말해, 그들은 독립을 원하며 우리가 그들을 도와줄 것을 요청했습니다."
 britishcanada.77.a: "영국과의 전쟁이요? 좋습니다."
 britishcanada.77.b: "우리는 이 문제에 관여하지 않겠습니다."
 britishcanada.78.t: "캐나다 지방, 지원 요청"
 britishcanada.78.d: "캐나다 지방의 반영국 정당에서 온 비밀 대사관이 우리에게 요청을 가지고 접근했습니다. 간단히 말해, 그들은 독립을 원하며 우리가 그들을 도와줄 것을 요청했습니다."
 britishcanada.78.a: "영국과의 전쟁이요? 좋습니다."
 britishcanada.78.b: "우리는 이 문제에 관여하지 않겠습니다."
 britishcanada.79.t: "캐나다 지방, 지원 요청"
 britishcanada.79.d: "캐나다 지방의 반영국 정당에서 온 비밀 대사관이 우리에게 요청을 가지고 접근했습니다. 간단히 말해, 그들은 독립을 원하며 우리가 그들을 도와줄 것을 요청했습니다."
