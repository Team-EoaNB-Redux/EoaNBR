 britishcanada.81.b: "우리는 이 문제에 관여하지 않겠습니다."
 britishcanada.82.t: "캐나다 지방, 지원 요청"
 britishcanada.82.d: "캐나다 지방의 반영국 정당에서 온 비밀 대사관이 우리에게 요청을 가지고 접근했습니다. 간단히 말해, 그들은 독립을 원하며 우리가 그들을 도와줄 것을 요청했습니다."
 britishcanada.82.a: "영국과의 전쟁이요? 좋습니다."
 britishcanada.82.b: "우리는 이 문제에 관여하지 않겠습니다."
 britishcanada.83.t: "프랑스, 지원 요청 거부!"
 britishcanada.83.d: "프랑스 정부가 지원 요청을 거부했습니다. 우리가 그들에게 무엇을 줄 수 있는지 몇 시간 동안 논쟁한 후에도 그들은 여전히 이 문제에서 벗어나기를 원했습니다."
 britishcanada.83.a: "제기랄."
 britishcanada.84.t: "프랑스, 지원 요청 수락!"
 britishcanada.84.d: "도착 직후 우리 대사들은 따뜻한 환영을 받았습니다. 독립 캐나다에 대한 우리의 제안은 진지하게 받아들여졌고, 그들을 설득하기 위해 많은 논쟁이 필요하지 않았습니다."
 britishcanada.84.a: "좋습니다."
 britishcanada.85.t: "지지자 없음!"
 britishcanada.85.d: "우리는 우리를 기꺼이 지지했을 수 있었던 세 후보인 미국, 프랑스, 러시아에게 물었습니다. 하지만 아무도 우리를 지지하고 싶어 하지 않습니다."
 britishcanada.85.a: "어떻게 아무도 대영제국과의 전쟁을 원하지 않을 수 있지?!"
 britishcanada.86.t: "러시아, 지원 요청 수락!"
 britishcanada.86.d: "도착 직후 우리 대사들은 따뜻한 환영을 받았습니다. 독립 캐나다에 대한 우리의 제안은 진지하게 받아들여졌고, 그들을 설득하기 위해 많은 논쟁이 필요하지 않았습니다."
 britishcanada.86.a: "좋습니다."
 britishcanada.87.t: "러시아, 지원 요청 거부!"
 britishcanada.87.d: "러시아 정부가 지원 요청을 거부했습니다. 우리가 그들에게 무엇을 줄 수 있는지 몇 시간 동안 논쟁한 후에도 그들은 여전히 이 문제에서 벗어나기를 원했습니다."
 britishcanada.87.a: "제기랄."
 britishcanada.88.t: "미국, 지원 요청 거부!"
 britishcanada.88.d: "미국 정부가 지원 요청을 거부했습니다. 우리가 그들에게 무엇을 줄 수 있는지 몇 시간 동안 논쟁한 후에도 그들은 여전히 이 문제에서 벗어나기를 원했습니다."
 britishcanada.88.a: "제기랄."
 britishcanada.89.t: "미국, 지원 요청 수락!"
 britishcanada.89.d: "도착 직후 우리 대사들은 따뜻한 환영을 받았습니다. 독립 캐나다에 대한 우리의 제안은 진지하게 받아들여졌고, 그들을 설득하기 위해 많은 논쟁이 필요하지 않았습니다."
 britishcanada.89.a: "좋습니다."
 britishcanada.90.t: "캐나다, 우리 배를 사고 싶어 합니다"
 britishcanada.90.d: "캐나다 대사들이 다시 우리에게 접근하여 낡은 배 몇 척을 사고 싶어 했습니다."
 britishcanada.90.a: "물론이죠."
 britishcanada.90.b: "아니요."
 britishcanada.91.t: "프랑스, 우리에게 배를 팔겠다고 수락!"
 britishcanada.91.d: "우리 대사들은 우리에게 25척의 낡은 코르벳함을 가져올 수 있었습니다."
 britishcanada.91.a: "이제 우리는 해군이 있습니다."
 britishcanada.92.t: "프랑스, 우리에게 배를 팔겠다고 거부!"
 britishcanada.92.d: "슬프게도, 우리 대사들은 프랑스로부터 몇 척의 배를 위한 좋은 거래를 얻을 수 없었습니다."
 britishcanada.92.a: "슬프게도, 해군은 없습니다."
 britishcanada.93.t: "우리의 선택"
 britishcanada.93.desc: "아쉽게도 우리는 네 가지 옵션 중 한 가지 자원의 생산만 확장할 수 있습니다."
 britishcanada.93.a: "총을 위해서는 철이 필요할 것입니다."
 britishcanada.93.b: "우리 병사들은 적절한 천옷을 입어야 합니다!"
 britishcanada.93.c: "나무가 조금 더 있어도 나쁠 것 없습니다."
 britishcanada.93.d: "멋진 총을 위한 멋진 강철!"
 britishcanada.94.t: "영국이 직접 통제하기를 원합니다!"
 britishcanada.94.d: "영국은 우리의 독립 노력에 대한 소식을 듣고 개입하기로 결정했습니다. 이제 우리는 두 가지 선택에 직면합니다. 첫 번째는 단순히 포기하는 것으로, 우리의 모든 노력이 시간 낭비가 될 것입니다. 다른 하나는 지금 당장 독립을 선언하는 것입니다."
 britishcanada.94.a: "절망적입니다. 우리는 충분히 준비되지 않았습니다."
 britishcanada.94.b: "지금이 아니면 영원히 없습니다... 독립을 선언하라!"
 britishcanada.95.t: "캐나다, 독립 선언!"
 britishcanada.95.d: "캐나다 지방이 독립을 선언하고 우리의 모든 북미 식민지를 자신들의 영토로 주장했습니다! 우리는 이 반란을 진압하기 위해 신속하게 행동해야 합니다!"
 britishcanada.95.a: "현재 전쟁은 선택 사항이 아닙니다... 우리는 이 요구를 수용해야 합니다."
 britishcanada.95.b: "용납할 수 없습니다!"
 britishcanada.96.t: "캐나다, 독립 획득!"
 britishcanada.96.d: "옛 식민지 '캐나다 지방'이 북미에 있는 대영제국의 대부분의 식민지를 통제하면서 대영제국으로부터 독립을 획득했습니다."
 britishcanada.96.a: "알겠습니다."
 britishcanada.98.t: "캐나다 독립 전쟁!"
 britishcanada.98.d: "캐나다가 대영제국으로부터 독립을 선언하고 북미에 남아 있는 모든 영국 식민지를 주장했습니다. 영국은 즉시 행동하여 옛 식민지에 전쟁을 선포했습니다. 전쟁의 규모는 현재 완전히 알려지지 않았지만, 여러 주요 국가와의 전쟁으로 커질 가능성이 있습니다."
 britishcanada.98.a: "알겠습니다."
 britishcanada.99.t: "옛 식민지, 평화를 제의"
 britishcanada.99.d: "이제 캐나다의 중요한 지역을 통제하는 옛 식민지가 우리에게 평화 제안을 가지고 접근했습니다. 이로 인해 우리는 뉴펀들랜드라는 한 식민지만 남게 될 것입니다."
 britishcanada.99.a: "이 전쟁은 지금 중단되어야 합니다... 평화 제안에 서명합시다."
 britishcanada.99.b: "우리는 그러한 조건을 받아들이지 않습니다."
 britishcanada.100.t: "평화 제안 거절!"
 britishcanada.100.d: "우리의 평화 제안은 완전히 거부되었습니다. 우리 평화 제안의 거의 모든 부분이 진지하게 받아들여지지 않았으며, 우리 외교관과 국가가 조롱당했습니다. 슬프게도 지속적인 평화는 아직 달성할 수 없습니다."
 britishcanada.100.a: "시간과 자원의 낭비였군."
 britishcanada.101.t: "평화 제안 수락!"
 britishcanada.101.d: "대영제국이 우리의 평화 제안을 수락했습니다. 우리는 영국에 의해 자유 국가로 인정받았으며 이제 재건에 집중할 수 있습니다!"
 britishcanada.101.a: "드디어 전쟁이 끝났습니다."
 britishcanada.102.t: "캐나다, 독립 전쟁 승리!"
 britishcanada.102.d: "옛 식민지 '캐나다 지방'이 이제 대영제국에 의해 완전히 독립된 국가로 인정받았습니다!"
 britishcanada.102.a: "알겠습니다."
 britishcanada.103.t: "전쟁 패배"
 britishcanada.103.d: "우리는 이 전쟁에서 너무 많은 패배를 겪었습니다. 우리는 옛 식민지와 평화 조약에 서명해야 합니다."
 britishcanada.103.a: "다른 선택지가 없다면..."
 britishcanada.104.t: "전쟁 패배"
 britishcanada.104.d: "대영제국과의 전쟁은 너무 많은 비용이 듭니다. 수천 명이 죽고 전쟁의 끝이 보이지 않으면서 사람들은 희망을 잃었습니다."
 britishcanada.104.a: "우리는 실패했습니다."
 britishcanada.105.t: "대영제국, 통제권 회복!"
 britishcanada.105.d: "캐나다 지방의 독립 전쟁이 끝났습니다! 수많은 수천 명이 죽고 더 많은 사람들이 도망치는 가운데, 정부는 항복하고 평화 조약이 체결되었습니다!"
 britishcanada.105.a: "알겠습니다."
 britishcanada.106.t: "왕실 인물 방문"
 britishcanada.106.d: "캐나다의 첫 공식 왕실 순회는 빅토리아 여왕의 장남인 웨일스 공 에드워드가 맡았습니다. 그는 어퍼 캐나다와 로어 캐나다의 두 입법 의회의 요청에 따라 우리 여왕에 의해 파견되었습니다. 그의 방문은 9월 18일부터 20일까지 이어질 것입니다. 캐나다 내 순회 첫날이지만, 그는 가는 곳마다 이미 수많은 인파에 둘러싸여 있습니다."
 britishcanada.106.a: "어서 오세요, 에드워드 왕자님!"
 britishcanada.107.t: "생틸레르 열차 재난"
 britishcanada.107.d: "퀘벡 근처의 한 마을에서 이민자들을 태운 열차가 승무원이 정지 신호를 따르지 못해 열린 회전식 다리를 통과하여 리슐리외 강으로 떨어졌습니다. 사망자 수는 99명에 달할 것으로 예상됩니다."
 britishcanada.107.a: "정말 비극적입니다. 그들이 평안히 잠들기를 바랍니다."
 britishcanada.108.t: "오타와, 수도로 선정!"
 britishcanada.108.d: "오늘 우리의 사랑하는 여왕, 빅토리아 여왕이 캐나다의 미래 수도를 결정했습니다. 토론토, 몬트리올, 퀘벡이 우리 지방의 주요 도시이며 따라서 유일한 후보로 예상되었음에도 불구하고, 우리 여왕은 시골의 작은 벌목 마을을 선택했습니다. '배럭 힐'은 마을과 강 모두에서 탁월한 위치를 차지하고 있으며 이미 왕실 소유이므로 의회 위치가 될 것으로 예상됩니다."
 britishcanada.108.a: "아무도 이런 결정을 예상하지 못했을 것입니다. 여왕 폐하 만세!"
 britishcanada.109.t: "수도, 퀘벡 시로 이전!"
 britishcanada.109.d: "수도 이전의 역사에 따라 우리 식민지의 새로운 수도는 퀘벡이 될 것입니다! 지난 16년 동안 수도는 5번째로 옮겨질 것입니다. 1841년부터 1844년까지 킹스턴이었고, 1844년부터 1849년까지는 몬트리올로 옮겨졌지만, 폭동을 일으킨 사람들이 '반란 손실 법안'에 항의하며 몬트리올의 의사당 건물을 불태웠습니다. 이 불필요한 폭력 사태 이후 수도는 1849년부터 1852년까지 토론토로 옮겨졌습니다. 이제, 퀘벡 시로 다시 옮기기 전까지는 토론토에 1년간 머물렀습니다."
 britishcanada.109.a: "또다시!"
 britishcanada.110.t: ""
 britishcanada.110.d: ""
 britishcanada.110.a: ""
 britishcanada.111.t: "캐나다 연방?"
 britishcanada.111.d: "영국과 미국의 긴장이 전면전으로 폭발하면서, 우리의 최악의 두려움이 현실이 되었습니다. 우리 자신을 충분히 방어하기 위해 캐나다 지방은 북미의 영국 식민지들 간의 연방을 제안했습니다. 영국이 동의한다고 가정하면, 나머지 제국 군대가 도착할 때까지는 적어도 미국인들로부터 우리 자신을 방어할 수 있게 될 것이며, 제공할 다른 이점들은 말할 것도 없습니다..."
 britishcanada.111.a: "네, 연방은 우리가 이것에서 살아남을 최고의 희망입니다."
 britishcanada.112.t: ""
 britishcanada.112.d: ""
 britishcanada.112.a: ""
 britishcanada.200.t: "프레이저 캐니언 골드러시"
 britishcanada.200.d: "프레이저 강과의 합류점 근처에 있는 톰슨 강에 금이 있다는 소식이 전 세계로 퍼졌습니다. 밴쿠버 섬의 조폐국으로 금광석이 선적되었다는 소식이 전해진 지 불과 몇 주 만에 수만 명이 브리티시컬럼비아로 쏟아져 들어왔습니다. 지금까지, 이는 모든 골드러시에서 단 한 달 동안 가장 큰 규모의 대규모 인구 이동입니다."
 britishcanada.200.a: "금이다!"
 britishcanada.201.t: "캐리부 골드러시"
 britishcanada.201.d: "프레이저 캐니언 골드러시가 잠잠해진 것 같지만, 홀스플라이 강, 키슬리 크릭, 앤틀러 크릭의 힐스 바에서 금이 발견되었다는 소식이 전파되어 또 다른 골드러시가 불붙었습니다."
 britishcanada.201.a: "더 많은 금!"
