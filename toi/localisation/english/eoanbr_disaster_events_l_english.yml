disaster_flavor.1.t: "1857 Atlantic Hurricane Season"
disaster_flavor.1.desc: "Total Storms: 4 \n\nTotal Hurricanes: 3 \n\nTotal Major Hurricanes: 0 \n\nTotal Deaths: 424 \n\nDamages: Unknown"
disaster_flavor.1.a: "Interesting."

disaster_flavor.2.t: "1858 San Diego Hurricane"
disaster_flavor.2.desc: "On October 2nd, 1858, a hurricane neared the Southern California coast, bringing strong winds and heavy rain as it moves north along the Baja California peninsula. San Diego experienced tropical storm-force conditions, with significant local damage including toppled trees, destroyed roofs, and disrupted communication lines. Despite the visible impact, estimated property damage totaled only around US$100 (1858 USD). The storm continued up the coast and dissipated on October 3rd southwest of Los Angeles while remaining on the coast. It will most likely remain one, if not the only recorded hurricane to affect California for centuries to come, making it rare and historic weather event."
disaster_flavor.2.a: "Wow."

disaster_flavor.3.t: "1858 Atlantic Hurricane Season"
disaster_flavor.3.desc: "Total Storms: 6 \n\nTotal Hurricanes: 6 \n\nTotal Major Hurricanes: 0 \n\nTotal Deaths: 0 \n\nDamages: Unknown"
disaster_flavor.3.a: "Interesting."

disaster_flavor.4.t: "1857 Basilicata Earthquake"
disaster_flavor.4.desc: "On December 16th, 1857, a magnitude 7.0 earthquake struck the region of Basilicata, causing significant damage to buildings and infrastructure. The earthquake resulted in the loss of many lives and left many more injured. The local economy suffered greatly due to the destruction, and recovery efforts may take time to complete."
disaster_flavor.4.a: "We should send aid to the affected region."

disaster_flavor.5.t: "A hurricane has struck the coast of California"
disaster_flavor.5.desc: "Today, we recieved newspaper reports from the coast of California about a hurricane striking the area. The storm has caused significant damage to multiple adobe homes in San Diego and surrounding areas, it is unknown how many people have been injured or killed due to how sparsely populated the areas are, but the damage to property is estimated to be around $100. The storm has also caused flooding in the areas, and it is expected that the recovery efforts will take some time due to the lack of railroad access."
disaster_flavor.5.a: "We should probably be thankful that the storm didn't cause more damage."

disaster_flavor.6.t: "1859 Atlantic Hurricane Season"
disaster_flavor.6.desc: "Total Storms: 8 \n\nTotal Hurricanes: 7 \n\nTotal Major Hurricanes: 1 \n\nTotal Deaths: Numerous \n\nDamages: Unknown"
disaster_flavor.6.a: "Interesting."

disaster_flavor.7.t: "1858 New England Hurricane"
disaster_flavor.7.desc: "Early on September 15th, 1858 reports came in from a small village named Oak Hill, Florida that a tropical storm had emerged from the area. The storm moved north and made landfall in East Hampton, New York on September 16th with approximately 80 mph winds according to locals. Hours later it struck Groton, Connecticut with winds of 75 mph. The storm disappeared over the Gulf of Saint Lawrence on September 17th. The storm caused significant damage to the areas it struck, with many homes' chimenys being blown off and shipping boats being capsized."
disaster_flavor.7.a: "We should send aid to the affected areas in New England."