disaster_flavor.1.t: "1857 Atlantic Hurricane Season"
disaster_flavor.1.desc: "Pattern out West: La Nina \n\nTotal Storms: 4 \n\nTotal Deaths: 424 \n\nDamages: Unknown"
disaster_flavor.1.a: "Interesting."

disaster_flavor.2.t: "1858 San Diego Hurricane"
disaster_flavor.2.desc: "On October 2nd, 1858, a hurricane neared the Southern California coast, bringing strong winds and heavy rain as it moves north along the Baja California peninsula. San Diego experienced tropical storm-force conditions, with significant local damage including toppled trees, destroyed roofs, and disrupted communication lines. Despite the visible impact, estimated property damage totaled only around US$100 (1858 USD). The storm continued up the coast and dissipated on October 3rd southwest of Los Angeles while remaining on the coast. It will most likely remain one, if not the only recorded hurricane to affect California for centuries to come, making it rare and historic weather event."
disaster_flavor.2.a: "We should be thankful that the storm didn't cause more damage."

disaster_flavor.3.t: "1858 Atlantic Hurricane Season"
disaster_flavor.3.desc: "Pattern out West: El Nino \n\nTotal Storms: 6 \n\nTotal Deaths: 0 \n\nDamages: Unknown"
disaster_flavor.3.a: "Interesting."

disaster_flavor.4.t: "1857 Basilicata Earthquake"
disaster_flavor.4.desc: "On December 16th, 1857, a magnitude 7.0 earthquake struck the region of Basilicata, causing significant damage to buildings and infrastructure. The earthquake resulted in the loss of many lives and left many more injured. The local economy suffered greatly due to the destruction, and recovery efforts may take time to complete."
disaster_flavor.4.a: "We should send aid to the affected region."