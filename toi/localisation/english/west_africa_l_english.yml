KBG.1.t: "Vakaba is Dying"
KBG.1.d: "Nine Years again, Vakaba Toure, a traveling warrior along with his posse freed us from the rule of the Kingdom of Nafana.  From the disorder he founded his own kingdom based in his hometown of Odienné.  Now after achieving so much in his short reign he has fallen ill.  He has been bedridden for days now and personally believed his wound is an infected ant bite.  All have tried but none of our healers have been able to do anything.  We all wish him well but if he can’t recover, his mature but untested son, Ibrahima will take the throne.  We all pray he will recover and lead our great nation to better times but that is unlikely."
KBG.1.a: "May he recover soon"