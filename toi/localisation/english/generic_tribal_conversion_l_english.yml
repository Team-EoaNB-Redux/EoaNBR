l_english:
 TRI_CONV_RESIST: "Resist Missionaries"
 TRI_CONV_RESIST_D: "We face a wave of foreign missionaries attempting to change our beliefs. We may resist their influence to preserve our traditions."

 TRI_CONV_CONTROLLED: "Controlled Contact"
 TRI_CONV_CONTROLLED_D: "Engage with the missionaries on our terms. Accept some change but keep control over how it spreads."

 TRI_CONV_SYNCHRETIC: "Syncretic Path"
 TRI_CONV_SYNCHRETIC_D: "Blend foreign beliefs with our own practices to create a syncretic faith that strengthens social cohesion."

 TRI_CONV_EMBRACE: "Embrace the Faith"
 TRI_CONV_EMBRACE_D: "Openly adopt the new religion to secure alliances and access outside resources, even if it means reshaping our culture."

 evt_tr_missionaries_arrive: "Missionaries Have Arrived"
 evt_tr_missionaries_arrive_d: "Foreign missionaries have come into our lands, preaching new doctrines and offering aid. How shall we respond?"
 evt_tr_welcome: "Welcome and Cooperate"
 evt_tr_reject: "Drive Them Out"

 evt_tr_conversion_begin: "Conversion Efforts Begin"
 evt_tr_conversion_begin_d: "Conversion efforts are underway. Some of our people are curious; others are wary."
 evt_tr_support: "Support Syncretism"
 evt_tr_guide: "Allow Managed Guidance"

 evt_tr_backlash: "Backlash Against Missionaries"
 evt_tr_backlash_d: "A faction within our society violently rejects the foreign influence, risking unrest and sabotage."
 evt_tr_punish: "Crack Down Harshly"
 evt_tr_negotiate: "Seek Negotiation"

 evt_tr_syncretism: "Syncretic Practices Emergent"
 evt_tr_syncretism_d: "Over time, hybrid rituals and beliefs are forming — a unique fusion between our traditions and the new faith."
 evt_tr_syncretic_accept: "Encourage Syncretism"
 evt_tr_syncretic_reject: "Suppress It"
