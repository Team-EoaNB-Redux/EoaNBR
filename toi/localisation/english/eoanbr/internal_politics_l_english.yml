# Political Laws
	governance_principles_tokens: "Governance Principles"
	governance_principles_tokens_desc: "[GetLawCategoryDescriptionInList]"
		law_chiefdom: "Chiefdom"
		law_chiefdom_desc: "A hierarchical pre-industrial political system based on kinship, with a warlord or elder of a prominent family at the head. It is incapable of efficient centralized control over entire states."
		law_monarchy: "Monarchy"
		law_monarchy_desc: "A form of governance where an aristocratic dynasty represents the country's national identity and yields executive powers to the royal head of the dynasty."
		law_theocracy: "Theocracy"
		law_theocracy_desc: "The government is ruled by a clergy and their interpretation of holy scripture. The Head of State is often the person of worship or a chosen representative deemed to do the will of the clergy."
		law_republic: "Republic"
		law_republic_desc: "A political system where legitimate power originates with the people. Republics tend to have an elected or nominated President as Head of State."
		law_council_republic: "Council Republic"
		law_council_republic_desc: "A political system where workers elect delegates to local councils. Extends concepts of workplace organization to general governance."
		law_corporate_state: "Corporate State"
		law_corporate_state_desc: "A political system based around institutionalized collaboration between officially recognized corporate groups. The state serves as a forum for negotiation between different social classes."
		law_social_monarchy: "Social Monarchy"
		law_social_monarchy_desc: "A political system in which the state positions itself as the ultimate mediator between the nation's corporate gropus. The monarchy is held to be a symbol of the country's national identity."
		law_ai_governance: "AI Governance"
		law_ai_governance_desc: "Artificial Intelligence has been given significant decision-making powers in day-to-day governance and arbitrates most political disputes between humans."
	distribution_of_power_tokens: "Distribution of Power"
		law_single_party_state: "Single Party State"
		law_single_party_state_desc: "The entire organ of state, from the low-end bureaucrat to the highest politicans, are bound by the will of a single party."
		law_autocracy: "Autocracy"
		law_autocracy_desc: "There is one Head of State who is held accountable to no earthly power."
		law_oligarchy: "Oligarchy"
		law_oligarchy_desc: "The Head of State shares power and responsibility with a small group of powerful, unelected individuals."
		law_technocracy: "Technocracy"
		law_technocracy_desc: "The nation is governed by an unelected group of men of reason and ability."
		law_landed_voting: "Landed Voting"
		law_landed_voting_desc: "Those who own land or capital property are given a vote."
		law_wealth_voting: "Wealth Voting"
		law_wealth_voting_desc: "Wealthy citizens are granted a vote. Men of more wealth may be granted additional votes."
		law_census_voting: "Census Voting"
		law_census_voting_desc: "Literate men of a particular status able to vote for representatives."
		law_universal_suffrage: "Universal Suffrage"
		law_universal_suffrage_desc: "Every adult man is given an equal vote to participate in elections for their own representatives."
		law_direct_democracy: "Direct Democracy"
		law_direct_democracy_desc: "Institutions are in place to allow citizens to directly participate in the legislative process."
		law_anarchy: "Anarchy"
		law_anarchy_desc: "Local communities govern their own affairs and send representatives to serve limited terms on larger cooperative councils. With no formal hierarchies, central authority is difficult to exercise."
	role_of_legislature_tokens: "Role of Legislature"
		law_executive_legislation: "Executive Legislation"
		law_executive_legislation_desc: "The ruler or executive is the ordinary source of national laws. There may be councils, courts, or bureaucratic drafting bodies, but there is no independent national legislature where approval is normally required."
		law_consultative_assembly: "Consultative Assembly"
		law_consultative_assembly_desc: "The national assembly advises, petitions, and debates policy, with limited control over local matters, but may not block general legislation or remove the government."
		law_crown_in_council: "Crown-in-Council"
		law_crown_in_council_desc: "The legislature must consent to ordinary laws and usually to some or all taxation, but the head of government is appointed by and responsible to the head of state rather than to the legislature." 
		law_separation_of_powers: "Separation of Powers"
		law_separation_of_powers_desc: "The legislature and executive possess separate institutional powers that usually keep the other in check. Neither depends on the other, though there may be mechanisms against misconduct or deadlock."
		law_parliamentary_government: "Parliamentary Government"
		law_parliamentary_government_desc: "The government exists due to legislative confidence. Parliament may replace the government for political reasons rather than for criminal or constitutional misconduct."
		law_rationalized_parliament: "Rationalized Parliament"
		law_rationalized_parliament_desc: "A reformed parliamentary system designed to prevent unstable legislative coalitions from repeatedly destroying governments. A legislature can still remove the government, but only through restrictive procedures, constructive alternatives, or high thresholds."
		law_directoral_government: "Directoral Government"
		law_directoral_government_desc: "The legislature selects a collegial executive, but once selected the executive serves a fixed term and cannot be ordinarily removed by a no-confidence vote."
		law_party_state_assembly: "Party-State Assembly"
		law_party_state_assembly_desc: "The legislature is formally the supreme organ of state authority, but the ruling party determines policy and politicans outside of formal proceedings."
	centralization_tokens: "Centralization"
		law_decentralized: "Decentralized"
		law_decentralized_desc: "This land is not so much a country as a bundle of nations and tribes. There is no real central authority, and if one exists it is practically ceremonial."
		law_fragmented: "Fragmented"
		law_fragmented_desc: "The country is in a highly disunited state. It may be feudal or de-facto conditions may have rendered unified authority too difficult to exercise."
		law_confederation: "Confederation"
		law_confederation_desc: "In a confederated polity, sovereign power does not lie in one central authority but rather in its constituent parts, who often see themselves as whole independent countries. Centralized power is usually delegated and has very limited powers."
		law_devolved: "Devolved"
		law_devolved_desc: "Power is shared between the central government and its constituent regions, though they are often not treated as separate sovereign states, but rather parts of a greater whole. The various regions have their own instilled powers, and can act against the will of the central authority."
		law_centralized: "Centralized"
		law_centralized_desc: "All power ultimately rests in the central government, with local authorities existing as an extension of the central government."
	citizenship_tokens: "Citizenship"
		law_subjecthood: "Subjecthood"
		law_subjecthood_desc: "The state defines its people foremostly as subjects of a sovereign, making little effort to encourage any official nationality. Cultures are largely left to their own devices within their own communities."
		law_ethnostate: "Ethnostate"
		law_ethnostate_desc: "The state considers itself inextricably tied to a certain ethnicity, with other ethnicities barred from citizenship. Primary cultures are provided bonuses. Discriminated cultures recieve heavy maluses. Marginalized cultures will seek to emmigrate. Promoting cultures will be difficult."
		law_national_supremacy: "National Supremacy"
		law_national_supremacy_desc: "The state defines its citizens by compliance with a certain national identity, which is held to be supreme over all others. Primary cultures recieve bonuses. Discriminated and marginalized cultures recieve maluses. Cultures within your culture group are easier to promote."
		law_racial_segregation: "Racial Segregation"
		law_racial_segregation_desc: "The state considers citizenship rights to be tied to the concept of shared racial heritage. Primary cultures recieve bonuses. Discriminated and marginalized cultures recieve maluses. Cultures within your culture family are easier to promote."
		law_cultural_exclusion: "Cultural Exclusion"
		law_cultural_exclusion_desc: "The state offers citizenship rights to people of all cultural identities, whilst considering a certain official idenitty to be paramount. Primary and promoted cultures recieve bonuses. Marginalized cultures recieve maluses. Cultures within your culture family are easier to promote."
		law_cosmopolitanism: "Cosmopolitanism"
		law_cosmopolitanism_desc: "There is generally no legal discrimination between nationalities and cultures in the country, though there will still be a general over-culture across all of society that is generally promoted both by the state and wider society. Primary and promoted cultures recieve bonuses. Marginalized cultures recieve maluses."
		law_multiculturalism: "Multiculturalism"
		law_multiculturalism_desc: "The state recognizes, institutionalizes, and supports different ethnic identities, sometimes at the expense of the primary identity. Promoted cultures recieve bonuses, primary and marginalized cultures recieve maluses."
	religious_acceptance_tokens: "Religious Acceptance"
		law_state_religion: "State Religion"
		law_state_religion_desc: "The church is an official organ of the state. Only other religions of the same religious family may be promoted."
		law_freedom_of_conscience: "Freedom of Conscience"
		law_freedom_of_conscience_desc: "There is an official state religion but the people may choose what to believe. Religions within the same religious family are cheaper to promote, and any religion may be promoted."
		law_separation_of_church_and_state: "Separation of Church & State"
		law_separation_of_church_and_state_desc: "There is no official state religion, but there is a general preferred religious belief by society and the government. There are no penalties for non-marginalized religions."
		law_secularism: "Secularism"
		law_secularism_desc: "Religion is generally kept out of influencing state affairs, but the state does not interfere with the beliefs of the public. There are no penalties for non-marginalized religions."
		law_state_atheism: "State Atheism"
		law_state_atheism_desc: "The state endorses atheism as public policy. All non-promoted religions face penalties."
	political_parties_tokens: "Political Parties"
		law_only_underground: "Only Underground"
		law_only_underground_desc: "All parties, except for the one in power, are explicitly banned."
		law_harassment: "Harassment"
		law_harassment_desc: "Whilst parties are allowed, political opponents may be targeted by the state through intimidation, surveillance, or other forms of overt pressure."
		law_patronage_politics: "Patronage Politics"
		law_patronage_politics_desc: "Candidates, policy makers, and the party in power may offer bribes or preferential treatment to voters to attain their vote."
		law_non_secret_ballots: "Non-Secret Ballots"
		law_non_secret_ballots_desc: "Who each individual votes is able to be traced back to that individual, which may invite underhanded tactics, even if they are not beind conducted by the state."
		law_secret_ballots: "Secret Ballots"
		law_secret_ballots_desc: "Votes are casted in a private manner, with measures taken to ensure the anonymity of the voter, ensuring that no one can know how an individual voted."
		law_non_partisan_commissions: "Non-Partisan Commissions"
		law_non_partisan_commissions_desc: "Authorative bodies, made up of both parties in government and opposition, decide how elections are handled. They often draw districts in a manner, ideally, to the benefit of no single party."
	election_system_tokens: "Election System"
		law_no_elections: "No Elections"
		law_no_elections_desc: "There are no elections, and the government is not accountable to the people."
		law_snap_elections: "Snap Elections"
		law_snap_elections_desc: "Elections may be called at any time, and the government is accountable to the people."
		law_term_and_snap_elections: "Term & Snap Elections"
		law_term_and_snap_elections_desc: "Elections are held at regular intervals, but the government may call for snap elections at any time."
		law_term_elections: "Term Elections"
		law_term_elections_desc: "Elections are held at regular intervals, and the government is accountable to the people."
	anti_corruption_tokens: "Anti-Corruption"
		law_gifts_and_graft: "Gifts & Graft"
		law_gifts_and_graft_desc: "Public servants are, de-facto, encouraged to engage in corrupt behavior."
		law_bribery_laws: "Bribery Laws"
		law_bribery_laws_desc: "Legal frameworks are in place to prevent and punish the offering or accepting of bribes, though in practice they may seldom be enforced."
		law_independent_inquiries: "Independent Inquiries"
		law_independent_inquiries_desc: "Whenever misconduct occurs, investigative bodies, independent of the will of the government, may be created to gather evidence and expose wrongdoing. Politicization may corrupt the process."
		law_anti_corruption_agency: "Anti-Corruption Agency"
		law_anti_corruption_agency_desc: "There exists a dedicated government body whose responsibility is to investigate and prevent corruption. However, there may exist selective prosecutions in a corrupted system."
#
# foreign_affairs
	diplomacy_tokens: "Diplomacy"
		law_ultramilitarism: "Ultramilitarism"
		law_ultramilitarism_desc: "Ultramilitarism is the policy where the state prioritizes military strength and readiness above all other considerations."
		law_jingoism: "Jingoism"
		law_jingoism_desc: "Jingoism is the policy where the state promotes aggressive nationalism and military action."
		law_ideological_interventionism: "Ideological Interventionism"
		law_ideological_interventionism_desc: "Ideological interventionism is the policy where the state actively seeks to influence or intervene in the affairs of other nations based on ideological alignment."
		law_flexible_policy: "Flexible Policy"
		law_flexible_policy_desc: "Flexible policy is the approach where the state maintains a degree of adaptability in its foreign affairs, avoiding rigid commitments."
		law_just_war_doctrine: "Just War Doctrine"
		law_just_war_doctrine_desc: "Just war doctrine is the policy where the state engages in military action only when it meets certain ethical criteria, such as self-defense or protecting human rights."
		law_collective_security: "Collective Security"
		law_collective_security_desc: "Collective security is the policy where the state participates in international alliances and agreements to ensure mutual defense and deter aggression."
		law_armed_neutrality: "Armed Neutrality"
		law_armed_neutrality_desc: "Armed neutrality is the policy where the state maintains a strong military to deter aggression while remaining neutral in conflicts."
		law_pacifism: "Pacifism"
		law_pacifism_desc: "Pacifism is the policy where the state rejects military action and seeks peaceful resolution of conflicts."
	army_model_tokens: "Army Model"
		law_feudal_levies: "Feudal Levies"
		law_feudal_levies_desc: "Feudal levies are a system where the state relies on feudal lords to provide military service."
		law_national_militia: "National Militia"
		law_national_militia_desc: "A national militia is a system where the state maintains a citizen army that can be called upon for defense."
		law_professional_army: "Professional Army"
		law_professional_army_desc: "A professional army is a system where the state maintains a standing army of trained professionals."
		law_private_military: "Private Military"
		law_private_military_desc: "Private military is a system where the state relies on private military companies for defense and security operations."
		law_abolished_army: "Abolished Army"
		law_abolished_army_desc: "An abolished army is one that has been officially disbanded or eliminated by the state."
	conscription_model_tokens: "Conscription Model"
		law_inherited_service: "Inherited Service"
		law_inherited_service_desc: "Inherited service is a system where military service is passed down through generations, typically within noble families."
		law_no_conscription: "No Conscription"
		law_no_conscription_desc: "No conscription is a policy where the state does not compel citizens to serve in the military."
		law_impressment: "Impressment"
		law_impressment_desc: "Impressment is a system where the state forcibly recruits sailors for the navy, often during times of war."
		law_limited_conscription: "Limited Conscription"
		law_limited_conscription_desc: "Limited conscription is a policy where only a limited number of citizens are required to serve in the military."
		law_service_by_requirement: "Service by Requirement"
		law_service_by_requirement_desc: "Service by requirement is a system where citizens are required to serve in the military for a specified period."
		law_scraping_the_barrel: "Scraping the Barrel"
		law_scraping_the_barrel_desc: "Scraping the barrel is a policy where the state resorts to using all available resources, including those from less desirable sources, to maintain its military."
	officer_composition_tokens: "Officer Composition"
		law_military_caste: "Military Caste"
		law_military_caste_desc: "A military caste is a system where the military is composed of a distinct social class, often with hereditary membership and privileges."
		law_aristocratic_officers: "Aristocratic Officers"
		law_aristocratic_officers_desc: "Aristocratic officers is a system where military officers are selected based on their noble status and lineage."
		law_purchased_commissions: "Purchased Commissions"
		law_purchased_commissions_desc: "Purchased commissions is a system where military ranks can be bought and sold, typically by wealthy individuals."
		law_professional_officers: "Professional Officers"
		law_professional_officers_desc: "Professional officers is a system where military officers are selected based on their training and expertise."
		law_politicized_officers: "Politicized Officers"
		law_politicized_officers_desc: "Politicized officers is a system where military officers are selected based on their political affiliations."
		law_elected_officers: "Elected Officers"
		law_elected_officers_desc: "Elected officers is a system where military officers are selected by popular vote."
	navy_model_tokens: "Navy Model"
		law_diplomatic_fleet: "Diplomatic Fleet"
		law_diplomatic_fleet_desc: "Diplomatic fleet is a policy where the state maintains a navy for the purpose of protecting its diplomatic interests and maintaining its influence in international waters."
		law_merchant_fleet: "Merchant Fleet"
		law_merchant_fleet_desc: "Merchant fleet is a policy where the state supports private shipping companies for the purpose of trade and commerce."
		law_raiding_fleet: "Raiding Fleet"
		law_raiding_fleet_desc: "Raiding fleet is a policy where the state maintains a navy for the purpose of conducting raids and attacks on enemy shipping and coastal settlements."
		law_capital_fleet: "Capital Fleet"
		law_capital_fleet_desc: "Capital fleet is a policy where the state maintains a strong naval force centered around its capital city."
		law_coastal_defense: "Coastal Defense"
		law_coastal_defense_desc: "Coastal defense is a policy where the state focuses on protecting its coastline and maritime borders."
		law_no_permanent_navy: "No Permanent Navy"
		law_no_permanent_navy_desc: "The state maintains no permanent naval force."
	trade_tokens: "Trade"
		law_autarky: "Autarky"
		law_autarky_desc: "Autarky is a policy where the state aims to be self-sufficient and minimize its dependence on foreign trade."
		law_state_controlled_trade: "State-Controlled Trade"
		law_state_controlled_trade_desc: "State-controlled trade is a policy where the state regulates and manages trade activities, often through state-owned enterprises or strict trade regulations."
		law_mercantilism: "Mercantilism"
		law_mercantilism_desc: "Mercantilism is a policy where the state seeks to accumulate wealth through a favorable balance of trade, often by promoting exports and restricting imports."
		law_protectionism: "Protectionism"
		law_protectionism_desc: "Protectionism is a policy where the state implements tariffs and other trade barriers to protect its domestic industries."
		law_strategic_controls: "Strategic Controls"
		law_strategic_controls_desc: "Strategic controls is a policy where the state implements strict regulations on key industries and resources to ensure their control and security."
		law_free_trade: "Free Trade"
		law_free_trade_desc: "Free trade is a policy where the state allows for the unrestricted flow of goods and services between its borders and those of other nations."
		law_export_oriented: "Export-Oriented"
		law_export_oriented_desc: "Export-oriented is a policy where the state focuses on producing goods and services for export to other countries."
	foreign_direct_investment_tokens: "Foreign Direct Investment"
		law_foreign_investment_banned: "Foreign Investment Banned"
		law_foreign_investment_banned_desc: "Foreign investment is banned in the state."
		law_capital_controls: "Capital Controls"
		law_capital_controls_desc: "The state implements restrictions on the flow of capital in and out of the country."
		law_regulated_foreign_investment: "Regulated Foreign Investment"
		law_regulated_foreign_investment_desc: "Rules and regulations to oversee and control foreign investment."
		law_fdi_encouraged: "FDI Encouraged"
		law_fdi_encouraged_desc: "Foreign direct investment is encouraged in the state."
		law_foreign_concessions: "Foreign Concessions"
