# Political Laws
	governance_principles_tokens: "Governance Principles"
	governance_principles_tokens_desc: "[GetLawCategoryDescriptionInList]"
		law_chiefdom: "Chiefdom"
		law_chiefdom_desc: "A hierarchical pre-industrial political system based on kinship, with a warlord or elder of a prominent family at the head. It is incapable of efficient centralized control over entire states."
		law_monarchy: "Monarchy"
		law_monarchy_desc: "A form of governance where an aristocratic dynasty represents the country's national identity and yields executive powers to the royal head of the dynasty."
		law_theocracy: "Theocracy"
		law_theocracy_desc: "The government is ruled by a clergy and their interpretation of holy scripture. The Head of State is often the person of worship or a chosen representative deemed to do the will of the clergy."
		law_republic: "Republic"
		law_republic_desc: "A political system where legitimate power originates with the people. Republics tend to have an elected or nominated President as Head of State."
		law_council_republic: "Council Republic"
		law_council_republic_desc: "A political system where workers elect delegates to local councils. Extends concepts of workplace organization to general governance."
		law_corporate_state: "Corporate State"
		law_corporate_state_desc: "A political system based around institutionalized collaboration between officially recognized corporate groups. The state serves as a forum for negotiation between different social classes."
		law_social_monarchy: "Social Monarchy"
		law_social_monarchy_desc: "A political system in which the state positions itself as the ultimate mediator between the nation's corporate gropus. The monarchy is held to be a symbol of the country's national identity."
		law_ai_governance: "AI Governance"
		law_ai_governance_desc: "Artificial Intelligence has been given significant decision-making powers in day-to-day governance and arbitrates most political disputes between humans."
	distribution_of_power_tokens: "Distribution of Power"
		law_single_party_state: "Single Party State"
		law_single_party_state_desc: "The entire organ of state, from the low-end bureaucrat to the highest politicans, are bound by the will of a single party."
		law_autocracy: "Autocracy"
		law_autocracy_desc: "There is one Head of State who is held accountable to no earthly power."
		law_oligarchy: "Oligarchy"
		law_oligarchy_desc: "The Head of State shares power and responsibility with a small group of powerful, unelected individuals."
		law_technocracy: "Technocracy"
		law_technocracy_desc: "The nation is governed by an unelected group of men of reason and ability."
		law_landed_voting: "Landed Voting"
		law_landed_voting_desc: "Those who own land or capital property are given a vote."
		law_wealth_voting: "Wealth Voting"
		law_wealth_voting_desc: "Wealthy citizens are granted a vote. Men of more wealth may be granted additional votes."
		law_census_voting: "Census Voting"
		law_census_voting_desc: "Literate men of a particular status able to vote for representatives."
		law_universal_suffrage: "Universal Suffrage"
		law_universal_suffrage_desc: "Every adult man is given an equal vote to participate in elections for their own representatives."
		law_direct_democracy: "Direct Democracy"
		law_direct_democracy_desc: "Institutions are in place to allow citizens to directly participate in the legislative process."
		law_anarchy: "Anarchy"
		law_anarchy_desc: "Local communities govern their own affairs and send representatives to serve limited terms on larger cooperative councils. With no formal hierarchies, central authority is difficult to exercise."
	role_of_legislature_tokens: "Role of Legislature"
		law_executive_legislation: "Executive Legislation"
		law_executive_legislation_desc: "The ruler or executive is the ordinary source of national laws. There may be councils, courts, or bureaucratic drafting bodies, but there is no independent national legislature where approval is normally required."
		law_consultative_assembly: "Consultative Assembly"
		law_consultative_assembly_desc: "The national assembly advises, petitions, and debates policy, with limited control over local matters, but may not block general legislation or remove the government."
		law_crown_in_council: "Crown-in-Council"
		law_crown_in_council_desc: "The legislature must consent to ordinary laws and usually to some or all taxation, but the head of government is appointed by and responsible to the head of state rather than to the legislature." 
		law_separation_of_powers: "Separation of Powers"
		law_separation_of_powers_desc: "The legislature and executive possess separate institutional powers that usually keep the other in check. Neither depends on the other, though there may be mechanisms against misconduct or deadlock."
		law_parliamentary_government: "Parliamentary Government"
		law_parliamentary_government_desc: "The government exists due to legislative confidence. Parliament may replace the government for political reasons rather than for criminal or constitutional misconduct."
		law_rationalized_parliament: "Rationalized Parliament"
		law_rationalized_parliament_desc: "A reformed parliamentary system designed to prevent unstable legislative coalitions from repeatedly destroying governments. A legislature can still remove the government, but only through restrictive procedures, constructive alternatives, or high thresholds."
		law_directoral_government: "Directoral Government"
		law_directoral_government_desc: "The legislature selects a collegial executive, but once selected the executive serves a fixed term and cannot be ordinarily removed by a no-confidence vote."
		law_party_state_assembly: "Party-State Assembly"
		law_party_state_assembly_desc: "The legislature is formally the supreme organ of state authority, but the ruling party determines policy and politicans outside of formal proceedings."
	centralization_tokens: "Centralization"
		law_decentralized: "Decentralized"
		law_decentralized_desc: "This land is not so much a country as a bundle of nations and tribes. There is no real central authority, and if one exists it is practically ceremonial."
		law_fragmented: "Fragmented"
		law_fragmented_desc: "The country is in a highly disunited state. It may be feudal or de-facto conditions may have rendered unified authority too difficult to exercise."
		law_confederation: "Confederation"
		law_confederation_desc: "In a confederated polity, sovereign power does not lie in one central authority but rather in its constituent parts, who often see themselves as whole independent countries. Centralized power is usually delegated and has very limited powers."
		law_devolved: "Devolved"
		law_devolved_desc: "Power is shared between the central government and its constituent regions, though they are often not treated as separate sovereign states, but rather parts of a greater whole. The various regions have their own instilled powers, and can act against the will of the central authority."
		law_centralized: "Centralized"
		law_centralized_desc: "All power ultimately rests in the central government, with local authorities existing as an extension of the central government."
	citizenship_tokens: "Citizenship"
		law_subjecthood: "Subjecthood"
		law_subjecthood_desc: "The state defines its people foremostly as subjects of a sovereign, making little effort to encourage any official nationality. Cultures are largely left to their own devices within their own communities."
		law_ethnostate: "Ethnostate"
		law_ethnostate_desc: "The state considers itself inextricably tied to a certain ethnicity, with other ethnicities barred from citizenship. Primary cultures are provided bonuses. Discriminated cultures recieve heavy maluses. Marginalized cultures will seek to emmigrate. Promoting cultures will be difficult."
		law_national_supremacy: "National Supremacy"
		law_national_supremacy_desc: "The state defines its citizens by compliance with a certain national identity, which is held to be supreme over all others. Primary cultures recieve bonuses. Discriminated and marginalized cultures recieve maluses. Cultures within your culture group are easier to promote."
		law_racial_segregation: "Racial Segregation"
		law_racial_segregation_desc: "The state considers citizenship rights to be tied to the concept of shared racial heritage. Primary cultures recieve bonuses. Discriminated and marginalized cultures recieve maluses. Cultures within your culture family are easier to promote."
		law_cultural_exclusion: "Cultural Exclusion"
		law_cultural_exclusion_desc: "The state offers citizenship rights to people of all cultural identities, whilst considering a certain official idenitty to be paramount. Primary and promoted cultures recieve bonuses. Marginalized cultures recieve maluses. Cultures within your culture family are easier to promote."
		law_cosmopolitanism: "Cosmopolitanism"
		law_cosmopolitanism_desc: "There is generally no legal discrimination between nationalities and cultures in the country, though there will still be a general over-culture across all of society that is generally promoted both by the state and wider society. Primary and promoted cultures recieve bonuses. Marginalized cultures recieve maluses."
		law_multiculturalism: "Multiculturalism"
		law_multiculturalism_desc: "The state recognizes, institutionalizes, and supports different ethnic identities, sometimes at the expense of the primary identity. Promoted cultures recieve bonuses, primary and marginalized cultures recieve maluses."
	religious_acceptance_tokens: "Religious Acceptance"
		law_state_religion: "State Religion"
		law_state_religion_desc: "The church is an official organ of the state. Only other religions of the same religious family may be promoted."
		law_freedom_of_conscience: "Freedom of Conscience"
		law_freedom_of_conscience_desc: "There is an official state religion but the people may choose what to believe. Religions within the same religious family are cheaper to promote, and any religion may be promoted."
		law_separation_of_church_and_state: "Separation of Church & State"
		law_separation_of_church_and_state_desc: "There is no official state religion, but there is a general preferred religious belief by society and the government. There are no penalties for non-marginalized religions."
		law_secularism: "Secularism"
		law_secularism_desc: "Religion is generally kept out of influencing state affairs, but the state does not interfere with the beliefs of the public. There are no penalties for non-marginalized religions."
		law_state_atheism: "State Atheism"
		law_state_atheism_desc: "The state endorses atheism as public policy. All non-promoted religions face penalties."
	election_system_tokens: "Election System"
		law_no_elections: "No Elections"
		law_no_elections_desc: "There are no elections, and the government is not accountable to the people."
		law_snap_elections: "Snap Elections"
		law_snap_elections_desc: "Elections may be called at any time, and the government is accountable to the people."
		law_term_and_snap_elections: "Term & Snap Elections"
		law_term_and_snap_elections_desc: "Elections are held at regular intervals, but the government may call for snap elections at any time."
		law_term_elections: "Term Elections"
		law_term_elections_desc: "Elections are held at regular intervals, and the government is accountable to the people."
	political_parties_tokens: "Political Parties"
		law_only_underground: "Only Underground"
		law_only_underground_desc: "All parties, except for the one in power, are explicitly banned."
		law_harassment: "Harassment"
		law_harassment_desc: "Whilst parties are allowed, political opponents may be targeted by the state through intimidation, surveillance, or other forms of overt pressure."
		law_patronage_politics: "Patronage Politics"
		law_patronage_politics_desc: "Candidates, policy makers, and the party in power may offer bribes or preferential treatment to voters to attain their vote."
		law_non_secret_ballots: "Non-Secret Ballots"
		law_non_secret_ballots_desc: "Who each individual votes is able to be traced back to that individual, which may invite underhanded tactics, even if they are not beind conducted by the state."
		law_secret_ballots: "Secret Ballots"
		law_secret_ballots_desc: "Votes are casted in a private manner, with measures taken to ensure the anonymity of the voter, ensuring that no one can know how an individual voted."
		law_non_partisan_commissions: "Non-Partisan Commissions"
		law_non_partisan_commissions_desc: "Authorative bodies, made up of both parties in government and opposition, decide how elections are handled. They often draw districts in a manner, ideally, to the benefit of no single party."
	anti_corruption_tokens: "Anti-Corruption"
		law_gifts_and_graft: "Gifts & Graft"
		law_gifts_and_graft_desc: "Public servants are, de-facto, encouraged to engage in corrupt behavior."
		law_bribery_laws: "Bribery Laws"
		law_bribery_laws_desc: "Legal frameworks are in place to prevent and punish the offering or accepting of bribes, though in practice they may seldom be enforced."
		law_independent_inquiries: "Independent Inquiries"
		law_independent_inquiries_desc: "Whenever misconduct occurs, investigative bodies, independent of the will of the government, may be created to gather evidence and expose wrongdoing. Politicization may corrupt the process."
		law_anti_corruption_agency: "Anti-Corruption Agency"
		law_anti_corruption_agency_desc: "There exists a dedicated government body whose responsibility is to investigate and prevent corruption. However, there may exist selective prosecutions in a corrupted system."
#
# foreign_affairs
	diplomacy_tokens: "Diplomacy"
		law_ultramilitarism: "Ultramilitarism"
		law_ultramilitarism_desc: "War and conquest are celebrated as expressions of national strength, with diplomacy subordinated to expansion and military struggle."
		law_jingoism: "Jingoism"
		law_jingoism_desc: "The state pursues an aggressive foreign policy, readily employing threats, military demonstratios, and opportunistic wars to advance its interests and prestige."
		law_ideological_interventionism: "Ideological Interventionism"
		law_ideological_interventionism_desc: "Foreign governments and movements are judged by their political character, with interventions justified by either universal axioms or promoting friendly ideologies and suppressing hostile ones."
		law_flexible_policy: "Flexible Policy"
		law_flexible_policy_desc: "Diplomatic commitments are made case by case, which alliances, rivalries, and interventions generally subordinated to the current national interest."
		law_just_war_doctrine: "Just War Doctrine"
		law_just_war_doctrine_desc: "Military force is considered legitimate only for a recognized just cause, and then only when peaceful remedies have been exhausted."
		law_collective_security: "Collective Security"
		law_collective_security_desc: "Aggression against one nation is treated as a threat to the wider international order, to be opposed through common action."
		law_armed_neutrality: "Armed Neutrality"
		law_armed_neutrality_desc: "The state avoids foreign wars and entangling commitments while maintaining sufficient military strength to defend its territory and neutrality."
		law_pacifism: "Pacifism"
		law_pacifism_desc: "War is rejected as an ordinary instrument of policy, with disputes instead addressed through negotiation, arbitration, and peaceful settlement. The military usually commits to a defensive-only posture."
	army_model_tokens: "Army Model"
		law_feudal_levies: "Feudal Levies"
		law_feudal_levies_desc: "Landholders and dependent communities owe temporary military service, supplying troops through traditional obligations rather than a permanent army."
		law_national_militia: "National Militia"
		law_national_militia_desc: "The defense of the nation rests upon armed citizens who can be mobilized in wartime. The standing army itself is small."
		law_professional_army: "Professional Army"
		law_professional_army_desc: "The army consists of permanent, well-trained, salaried soldiers."
		law_private_military: "Private Military"
		law_private_military_desc: "The state relies upon mercenaries, military companies, and other privately raised forces to defend itself and its territories."
		law_abolished_army: "Abolished Army"
		law_abolished_army_desc: "There is no permanent land army."
	conscription_model_tokens: "Conscription Model"
		law_inherited_service: "Inherited Service"
		law_inherited_service_desc: "Military service is attached to birth, family, caste, or community, passing obligations from one generation to the next."
		law_no_conscription: "No Conscription"
		law_no_conscription_desc: "Military service is voluntary, and the state possesses no legal authority to compel civilians into the armed forces."
		law_impressment: "Impressment"
		law_impressment_desc: "Authorities may forcibly seize or compel civilians inot military service whenever additional manpower is required."
		law_limited_conscription: "Limited Conscription"
		law_limited_conscription_desc: "A portion of the eligible population may be conscripted for a legally limited period of time."
		law_service_by_requirement: "Service by Requirement"
		law_service_by_requirement_desc: "Eligible civilians may be called into service and retained as long as the military situation is judged to require."
		law_scraping_the_barrel: "Scraping the Barrel"
		law_scraping_the_barrel_desc: "Ordinary exemptions and standards are discarded and anyone capable of fighting is liable for military service."
	officer_composition_tokens: "Officer Composition"
		law_military_caste: "Military Caste"
		law_military_caste_desc: "Command is dominated by a distinct and often hereditary warrior class whose social identity and privileges are inseperable from military service."
		law_aristocratic_officers: "Aristocratic Officers"
		law_aristocratic_officers_desc: "High birth, landed status, and social connections are regarded as the natural qualifications for military command."
		law_purchased_commissions: "Purchased Commissions"
		law_purchased_commissions_desc: "Officer ran may be acquired through payment, allowing wealth and access to substitute for experience or professional ability."
		law_professional_officers: "Professional Officers"
		law_professional_officers_desc: "Officers are selected and promoted to training, experience, examinations, and demonstrated military competence."
		law_politicized_officers: "Politicized Officers"
		law_politicized_officers_desc: "Political loyalty and ideological reliability are treated as essential qualifications for command within the armed forces."
		law_elected_officers: "Elected Officers"
		law_elected_officers_desc: "Soldiers or milita members select their own commanders, making officers directly accountable to those serving beneath them."
	navy_model_tokens: "Navy Model"
		law_diplomatic_fleet: "Diplomatic Fleet"
		law_diplomatic_fleet_desc: "The fleet exists to display national power abroad, support diplomacy, protect distant interests, and compel weaker states to cooperate."
		law_merchant_fleet: "Merchant Fleet"
		law_merchant_fleet_desc: "Naval forces are organized around protecting commercial shipping, trade routes, ports, and overseas communications."
		law_raiding_fleet: "Raiding Fleet"
		law_raiding_fleet_desc: "The navy avoids symmetrical confrontation and instead seeks to weaken its enemies by attacking commerce and disrupting maritime supply."
		law_capital_fleet: "Capital Fleet"
		law_capital_fleet_desc: "Large warships form the core of a fleet designed to defeat rival navies and secure naval dominance."
		law_coastal_defense: "Coastal Defense"
		law_coastal_defense_desc: "Naval forces concentrate upon defending home waters, ports, and coastlines rather than expeditionary capabilities."
		law_no_permanent_navy: "No Permanent Navy"
		law_no_permanent_navy_desc: "The state maintains no permanent naval force."
	trade_tokens: "Trade"
		law_autarky: "Autarky"
		law_autarky_desc: "Foreign dependence is treated as a strategic weakness, and as such trade is treated as something to be minimized."
		law_state_controlled_trade: "State-Controlled Trade"
		law_state_controlled_trade_desc: "Commerce is conducted or closely directed through state monopolies, official agencies, and government-negotiated exchanges."
		law_mercantilism: "Mercantilism"
		law_mercantilism_desc: "The accumulation of national wealth through growing net-exports, typically through favorable trade negotations, monopolies, and colonial extraction."
		law_protectionism: "Protectionism"
		law_protectionism_desc: "Tariffs, quotas, and other barriers shield domestic producers from foreign competition."
		law_strategic_controls: "Strategic Controls"
		law_strategic_controls_desc: "Sensitive goods, technologies, and trading partners are subject to special restrictions."
		law_free_trade: "Free Trade"
		law_free_trade_desc: "Goods and services may cross national borders with few tariffs, quotas, or other state-imposed restrictions."
		law_export_oriented: "Export-Oriented"
		law_export_oriented_desc: "Economic policy favors industries capable of competing abroad, using incentives and investment to expand manufactured and commercial exports."
	foreign_direct_investment_tokens: "Foreign Direct Investment"
		law_foreign_investment_banned: "Foreign Investment Banned"
		law_foreign_investment_banned_desc: "Foreign ownership and control of domestic enterprises are prohibited."
		law_capital_controls: "Capital Controls"
		law_capital_controls_desc: "The movement of money and investment across national borders is restricted."
		law_regulated_foreign_investment: "Regulated Foreign Investment"
		law_regulated_foreign_investment_desc: "Foreign investment is permitted only under state supervision. There may be degrees of control and restrictions imposed on foreign investors."
		law_fdi_encouraged: "FDI Encouraged"
		law_fdi_encouraged_desc: "Foreign investors recieve legal guarantees, favorable treatment, and active incentives to bring capital and enterprise into the country."
		law_foreign_concessions: "Foreign Concessions"
		law_foreign_concessions_desc: "Foreign companies recieve exceptional privileges over resources, infrastructure, or territory, often beyond those enjoyed by domestic enterprise."
	migration_tokens: "Migration"
		law_no_borders: "No Borders"
		law_no_borders_desc: "The state possesses no meaningful system of territorial border control."
		law_encouraged_immigration: "Encouraged Immigration"
		law_encouraged_immigration_desc: "Subsidies, land grants, assisted passage, or promises of employment and settlement are given to immigrants to maximize immigration."
		law_no_migration_controls: "No Migration Controls"
		law_no_migration_controls_desc: "Borders exist, but ordinary entry, residence, and departure are not subject to restriction."
		law_regulated_migration: "Regulated Migration"
		law_regulated_migration_desc: "Migrants may enter and reside in the country only after satisfying established health, financial, character, sponsorship, or residency requirements."
    	law_quota_migration: "Quota Migration"
		law_quota_migration_desc: "Immigration is limited according to numerical quotas and preferred categories of origin, wealth, or family status."
		law_contract_labor_only: "Contract Labor Only"
		law_contract_labor_only_desc: "Foreign workers are admitted for temporary employment under contracts that tie their residence and legal status to a particular employer."
		law_closed_borders: "Closed Borders"
		law_closed_borders_desc: "Entry and departure are tightly restricted, with migration permitted under only exceptional circumstances or direct state approval."
		law_deportation: "Deportation"
		law_deportation_desc: "The state systematically removes populations considered to be unauthorized, undesireable, disloyal, or incompatible with its social and political order."
	colonization_tokens: "Colonization"
		law_no_colonial_affairs: "No Colonial Affairs"
		law_no_colonial_affairs_desc: "The country does not engage in any formal type of colonization and cannot establish colonies."
		law_frontier_colonization: "Frontier Colonization"
		law_frontier_colonization_desc: "Settlers are encouraged to occupy neighboring frontier lands."
		law_indirect_colonization: "Indirect Colonization"
		law_indirect_colonization_desc: "Colonial control is exercised through local rulers, traditional authorities, chartered companies, and dependent governments rather than direct administration."
		law_colonial_resettlement: "Colonial Resettlement"
		law_colonial_resettlement_desc: "Settlers are moved into colonial territories to establish permanent overseas communities."
		law_colonial_exploitation: "Colonial Exploitation"
		law_colonial_exploitation_desc: "Colonies are organized primarily to extract resources and revenue."
		law_nation_building: "Nation Building"
		law_nation_building_desc: "The state intervenes directly to reshape local institutions, infrastructure, education, and administration in the name of development, modernization, and aide."
		law_neo_imperialism: "Neo-Imperialism"
		law_neo_imperialism_desc: "Foreign states are dominated through finance, military access, unequal agreements, and dependent governments without requiring formal colonization."
		law_decolonization: "Decolonization"
		law_decolonization_desc: "Colonial rule is deliberately being dismantled as dependences recieve self-government, sovereignty, and eventual release from imperial control."
#
# economy
	personal_taxation_tokens: "Personal Taxation"
		law_no_personal_taxation: "No Personal Taxation"
		law_no_personal_taxation_desc: "There are no regular taxes upon personal income."
		law_poll_taxation: "Poll Taxation"
		law_poll_taxation_desc: "Individuals owe a fixed tax to the state."
		law_class_based: "Class-Based Taxation"
		law_class_based_desc: "Tax obligations are assigned according to legally or socially recognized classes, with different groups bearing different rates and exemptions."
		law_proportional: "Proportional Taxation"
		law_proportional_desc: "Taxable personal income is charged at a common rate, though lower incomes may remain exempt."
		law_graduated: "Graduated Taxation"
		law_graduated_desc: "Personal income is divided into brackets, with progressively higher rates imposed as income rises."
		law_profit_expropriation: "Profit Expropriation"
		law_profit_expropriation_desc: "Private profits and exceptionally high incomes are claimed by the state beyond a permitted level of personal compensation."
	asset_taxation_tokens: "Asset Taxation"
		law_no_asset_taxation: "No Asset Taxation"
		law_no_asset_taxation_desc: "Land, Property, and Wealth are not subject to regular taxation."
		law_yield_tithe: "Yield Tithe"
		law_yield_tithe_desc: "Landholders surrender a fixed share of agricultural produce or its estimated value as taxation."
		law_land_assessment: "Land Assessment"
		law_land_assessment_desc: "Land is taxed according to its assessed productive value."
		law_property_valuation: "Property Valuation"
		law_property_valuation_desc: "Taxes are levied upon the assessed value of land, buildings, and other immoveable property."
		law_wealth: "Wealth Tax"
		law_wealth_desc: "The state taxes the broader net value of personal assets, including property, financial holdings, and accumulated fortunes."
	taxation_level_tokens: "Taxation Level"
		law_minimal_taxation: "Minimal Taxation"
		law_minimal_taxation_desc: "The state claims a miniscule portion of private income, leaving the economy to the private sector."
		law_low_taxation: "Low Taxation"
		law_low_taxation_desc: "Taxes are limited in scope and burden, funding a modest state."
		law_moderate_taxation: "Moderate Taxation"
		law_moderate_taxation_desc: "There are substantial but restrained taxes, sufficient to support a developed administration & military."
		law_high_taxation: "High Taxation"
		law_high_taxation_desc: "A large share of national income is collected to finance extensive government commitments."
		law_extreme_taxation: "Extreme Taxation"
		law_extreme_taxation_desc: "National wealth is subordinated to the ever-growing needs of the state."
	economic_system_tokens: "Economic System"
		law_customary_economy: "Customary Economy"
		law_customary_economy_desc: "Production and exchange are governed primarily by tradition, subsistence needs, communal obligation, and inherited local practice."
		law_agrarian_economy: "Agrarian Economy"
		law_agrarian_economy_desc: "Rural economic interests take precedence over other economic forms."
		law_extraction_economy: "Extraction Economy"
		law_extraction_economy_desc: "Economic activity is organized around the removal and export of raw materials, with occasional limited domestic processing or diversification."
		law_rentier_economy: "Rentier Economy"
		law_rentier_economy_desc: "Wealth and power primarily derive from owenrship, concessions, financial claims, and control of scarce assets rather than productive enterprise."
		law_free_market_capitalism: "Free Market Capitalism"
		law_free_market_capitalism_desc: "Private ownership and market competition direct most investment, production, employment, and distribution of goods."
		law_state_guided_capitalism: "State-Guided Capitalism"
		law_state_guided_capitalism_desc: "Private enterprise remains central, but the state actively directs credit, investment, strategic industries, and long-term development."
		law_market_socialism: "Market Socialism"
		law_market_socialism_desc: "Social or public ownership coexists with markets, prices, profits, and enterprise autonomy in the allocation of goods and investment."
		law_command_economy: "Command Economy"
		law_command_economy_desc: "The state directly determines production targets, investment, prices, employment, and the distribution of major goods and resources."
	monetary_system_tokens: "Monetary System"
		law_no_standard: "No Standard"
		law_no_standard_desc: "No stable national monetary standard prevails, leaving trade dependent upon mixed coinage, foreign currencies, barter, and local media of exchange."
		law_single_commodity_standard: "Single Commodity Standard"
		law_single_commodity_standard_desc: "The national currency is legally convertible into a fixed quantity of a single precious commodity."
		law_dual_commodity_standard: "Dual Commodity Standard"
		law_dual_commodity_standard_desc: "Two precious commodities are accepted as monetary standards at a legally fixed exchange ratio."
		law_mixed_standard: "Mixed Standard"
		law_mixed_standard_desc: "Commodity-backed and fiduciary money circulate together under restricted, partial, or uneven rules of convertibility."
		law_fiat_standard: "Fiat Standard"
		law_fiat_standard_desc: "The currency derives its value from state authority and public acceptance rather than a legal promise of commodity redemption."
		law_pegged_currency: "Pegged Currency"
		law_pegged_currency_desc: "The national currency is maintained at a fixed value relative to another currency or externally defined monetary unit."
	financial_system_tokens: "Financial System"
		law_no_banking_system: "No Banking System"
		law_no_banking_system_desc: "Formal banking institutions are absent or negligible, leaving credit and savings to merchants, moneylenders, households, and informal networks."
		law_commercial_banking: "Commercial Banking"
		law_commercial_banking_desc: "Private banks accept deposits, extend loans, and provide payment services, but broader securities markets remain limited."
		law_capital_markets: "Capital Markets"
		law_capital_markets_desc: "Developed banks, exchanges, bonds, and equity markets channel savings toward governments and private enterprise."
		law_independent_central_bank: "Independent Central Bank"
		law_independent_central_bank_desc: "Monetary policy is entrusted to a central bank insulated from routine political direction and short-term government demands."
		law_central_bank_interference: "Central Bank Interference"
		law_central_bank_interference_desc: "The central bank formally exists but is routinely directed to serve government borrowing, political priorities, or favored economic interests."
		law_bank_nationalization: "Bank Nationalization"
		law_bank_nationalization_desc: "The state owns or controls the principal banks and directs the allocation of credit throughout the economy."
	social_mobility_tokens: "Social Mobility"
		law_caste_system: "Caste System"
		law_caste_system_desc: "Birth assigns individuals to rigid hereditary communities that determine occupation, status, marriage, and access to social advancement."
		law_serfdom: "Serfdom"
		law_serfdom_desc: "A large portion of the population is legally bound to landholders, estates, or communities and cannot freely relocate or choose employment."
		law_estate_society: "Estate Society"
		law_estate_society_desc: "Society is divided into legally recognized orders with distinct privileges, obligations, occupations, and access to public office."
		law_stratified_society: "Stratified Society"
		law_stratified_society_desc: "Legal barriers are limited, but inherited wealth, education, status, and social connections continue to determine most opportunities."
		law_meritocracy: "Meritocracy"
		law_meritocracy_desc: "Education, examinations, credentials, and demonstrated ability are treated as the principal basis for advancement."
		law_affirmative_action: "Affirmative Action"
		law_affirmative_action_desc: "The state grants preferences or targeted assistance to groups considered historically excluded or structurally disadvantaged."
	property_law_tokens: "Property Law"
		law_arbitrary_enforcement: "Arbitrary Enforcement"
		law_arbitrary_enforcement_desc: "Property claims exist but are enforced inconsistently and remain vulnerable to seizure by rulers, officials, creditors, or politically powerful interests."
		law_customary_tenure: "Customary Tenure"
		law_customary_tenure_desc: "Ownership and usage rights are defined by local tradition, kinship, community membership, and established communal obligations."
		law_state_ownership_and_leasing: "State Ownership & Leasing"
		law_state_ownership_and_leasing_desc: "The state formally owns major land and productive assets, granting individuals or organizations conditional rights to use them."
		law_cooperative_ownership: "Cooperative Ownership"
		law_cooperative_ownership_desc: "Enterprises and productive assets are owned collectively by their workers, members, communities, or recognized associations."
		law_property_rights: "Property Rights"
		law_property_rights_desc: "Private ownership, contracts, inheritance, and transfer are broadly protected through predictable law and legal recourse."
		law_intellectual_property_protections: "Intellectual Property Protections"
		law_intellectual_property_protections_desc: "Patents, copyrights, trademarks, and other intangible creations receive extensive recognition and protection as private property."
	industrial_policy_tokens: "Industrial Policy"
		law_no_focus: "No Focus"
		law_no_focus_desc: "The state gives no major sector sustained priority, allowing investment and development to follow existing demand and private initiative."
		law_agriculture_focus: "Agriculture Focus"
		law_agriculture_focus_desc: "Public policy favors farming, food production, land improvement, irrigation, and the modernization of the rural economy."
		law_extraction_focus: "Extraction Focus"
		law_extraction_focus_desc: "Investment and infrastructure are directed toward mining, forestry, energy, and the large-scale exploitation of natural resources."
		law_light_industry_focus: "Light Industry Focus"
		law_light_industry_focus_desc: "The state promotes consumer goods, textiles, food processing, workshops, and other industries requiring comparatively modest capital."
		law_heavy_industry_focus: "Heavy Industry Focus"
		law_heavy_industry_focus_desc: "Steel, machinery, chemicals, shipbuilding, energy, and other capital-intensive industries receive priority in national development."
		law_services_focus: "Services Focus"
		law_services_focus_desc: "Finance, commerce, communications, transport, professional work, and other service industries are favored as the foundation of economic growth."
#
# regulations
	regulatory_structure_tokens: "Regulatory Structure"
		law_self_regulation: "Self-Regulation"
		law_self_regulation_desc: "Industries and professional bodies establish and enforce their own standards with limited direct oversight from the state."
		law_command_and_control: "Command-and-Control"
		law_command_and_control_desc: "The state prescribes detailed rules, approved methods, and prohibited conduct that regulated actors are expected to follow."
		law_performance_based: "Performance-Based"
		law_performance_based_desc: "Regulation establishes measurable outcomes while allowing firms discretion over how those standards are achieved."
		law_incentive_based: "Incentive-Based"
		law_incentive_based_desc: "Taxes, subsidies, fees, liabilities, and tradable rights are used to encourage desirable conduct without directly prescribing it."
		law_management_based: "Management-Based"
		law_management_based_desc: "Regulated organizations must maintain approved internal procedures, risk controls, audits, and systems of accountability."
		law_responsive_and_risk_based: "Responsive and Risk-Based"
		law_responsive_and_risk_based_desc: "Inspection and enforcement are concentrated upon the greatest risks, with penalties escalating according to conduct and willingness to comply."
	corporate_affairs_tokens: "Corporate Affairs"
		law_royal_monopolies: "Royal Monopolies"
		law_royal_monopolies_desc: "The state controls key industries and businesses, often for the purpose of generating revenue or maintaining political control."
		law_industry_titans: "Industry Titans"
		law_industry_titans_desc: "Large corporations, cartels, and industrial conglomerates are encouraged as engines of national production, investment, and influence. They are given special privileges, grants, and licenses to operate and the maintenance of these titans are treated as a national priority."
		law_non_interference: "Non-Interference"
		law_non_interference_desc: "The state places few special obligations or restrictions upon corporate organization, competition, ownership, or commercial conduct."
		law_anti_trust_regulation: "Anti-Trust Regulation"
		law_anti_trust_regulation_desc: "Monopolies, cartels, collusive practices, and excessive concentrations of market power are restricted to preserve competition."
		law_consumer_protection: "Consumer Protection"
		law_consumer_protection_desc: "Corporations are required to provide safe products, truthful information, fair contracts, and meaningful remedies for harmed consumers."
		law_stakeholder_corporations: "Stakeholder Corporations"
		law_stakeholder_corporations_desc: "Corporations owe formal responsibilities not only to their owners, but also to workers, consumers, communities, and the wider public."
		law_state_enterprises_only: "State Enterprises Only"
		law_state_enterprises_only_desc: "Major corporate activity is reserved for publicly owned enterprises operating under state authority and direction."
	labor_associations_tokens: "Labor Associations"
		law_guild_system: "Guild System"
		law_guild_system_desc: "Recognized occupational associations regulate entry, training, standards, prices, and working practices within their trades."
		law_combination_acts: "Combination Acts"
		law_combination_acts_desc: "Organizations formed by workers to bargain collectively or influence employment conditions are prohibited by law."
		law_anti_strike_laws: "Anti-Strike Laws"
		law_anti_strike_laws_desc: "Workers may organize, but strikes, work stoppages, and other forms of collective economic pressure are heavily restricted."
		law_right_to_associate: "Right to Associate"
		law_right_to_associate_desc: "Workers may legally form and join labor organizations, though employers are not required to recognize or bargain with them."
		law_union_protections: "Union Protections"
		law_union_protections_desc: "The state protects organizing, collective bargaining, union recognition, and lawful industrial action from employer retaliation."
		law_corporatized_unions: "Corporatized Unions"
		law_corporatized_unions_desc: "Labor organizations are incorporated into a state-supervised system of compulsory representation and regulated negotiation."
		law_factory_councils: "Factory Councils"
		law_factory_councils_desc: "Workers exercise direct representation within individual workplaces through councils involved in management, conditions, and production decisions."
	work_hours_tokens: "Work Hours"
		law_no_work_time_limit: "No Work Time Limit"
		law_no_work_time_limit_desc: "Employers face no general legal restriction upon the length of the working day or working week."
		law_weekly_rest_day: "Weekly Rest Day"
		law_weekly_rest_day_desc: "Workers are entitled to a regular day of rest, though working hours on other days remain lightly restricted."
		law_work_week_limitations: "Work Week Limitations"
		law_work_week_limitations_desc: "The law establishes maximum daily or weekly working hours and limits the routine use of excessive schedules."
		law_right_to_rest: "Right to Rest"
		law_right_to_rest_desc: "Workers receive enforceable rights to limited hours, overtime compensation, breaks, holidays, and paid annual leave."
		law_parental_leave: "Parental Leave"
		law_parental_leave_desc: "Workers may temporarily leave employment to care for newborn or newly adopted children without permanently losing their positions."
		law_voluntary_work: "Voluntary Work"
		law_voluntary_work_desc: "Compulsory economic dependence is rejected, and productive labor is performed only through freely chosen participation."
	worker_protections_tokens: "Worker Protections"
		law_no_worker_protections: "No Worker Protections"
		law_no_worker_protections_desc: "Employment conditions are left largely to private agreement, with workers receiving few specific protections from the state."
		law_workplace_safety_standards: "Workplace Safety Standards"
		law_workplace_safety_standards_desc: "Employers must maintain minimum standards for machinery, sanitation, hazardous materials, and the prevention of workplace injury."
		law_workers_compensation: "Workers' Compensation"
		law_workers_compensation_desc: "Workers injured or made ill through employment are entitled to defined compensation financed by employers or compulsory insurance."
		law_minimum_wage: "Minimum Wage"
		law_minimum_wage_desc: "Employers may not legally pay workers below a nationally or sectorally established minimum rate."
		law_employment_security: "Employment Security"
		law_employment_security_desc: "Dismissal, redundancy, and mass layoffs require lawful cause, notice, compensation, consultation, or other established procedures."
		law_offshoring_protections: "Offshoring Protections"
		law_offshoring_protections_desc: "Employers face restrictions or obligations when relocating production and employment to foreign countries."
		law_automation_protections: "Automation Protections"
		law_automation_protections_desc: "The replacement of workers by machinery or software is subject to consultation, compensation, retraining, employment guarantees, or general outright restrictions."
	financial_regulations_tokens: "Financial Regulations"
		law_no_financial_regulations: "No Financial Regulations"
		law_no_financial_regulations_desc: "Banks, lenders, exchanges, and investment firms operate with few specialized rules beyond ordinary property and contract law."
		law_usury_laws: "Usury Laws"
		law_usury_laws_desc: "The state limits interest rates and lending terms considered excessive, exploitative, or morally unacceptable."
		law_financial_disclosure: "Financial Disclosure"
		law_financial_disclosure_desc: "Financial institutions and securities issuers must publish standardized accounts and disclose material risks, debts, ownership, and conflicts of interest."
		law_prudential_regulations: "Prudential Regulations"
		law_prudential_regulations_desc: "Banks and other financial institutions must maintain adequate capital, liquidity, reserves, and risk controls to protect depositors and financial stability."
		law_investment_regulations: "Investment Regulations"
		law_investment_regulations_desc: "Securities, exchanges, brokers, investment products, and market conduct are supervised to limit fraud, manipulation, and abusive speculation."
	commodity_regulations_tokens: "Commodity Regulations"
		law_no_commodity_regulations: "No Commodity Regulations"
		law_no_commodity_regulations_desc: "The production, quality, pricing, and sale of ordinary goods are left largely to producers, merchants, and consumers."
		law_quality_standards: "Quality Standards"
		law_quality_standards_desc: "Goods must comply with established requirements for purity, safety, measurement, labeling, grading, and fitness for use."
		law_price_controls: "Price Controls"
		law_price_controls_desc: "The state establishes maximum, minimum, or fixed prices for selected goods in order to restrain scarcity, inflation, or exploitation."
		law_production_quotas: "Production Quotas"
		law_production_quotas_desc: "Authorities limit or mandate the quantity of selected goods produced in order to manage supply, prices, and strategic needs."
	environmental_protection_tokens: "Environmental Protection"
		law_no_environmental_laws: "No Environmental Laws"
		law_no_environmental_laws_desc: "The use of land, resources, and the natural environment is subject to few restrictions beyond immediate property interests."
		law_forest_protection: "Forest Protection"
		law_forest_protection_desc: "Logging, clearing, and woodland use are regulated to preserve timber supplies, watersheds, and forested land."
		law_nature_conservation: "Nature Conservation"
		law_nature_conservation_desc: "Protected areas, wildlife laws, and habitat preservation limit development in places of ecological or natural importance."
		law_pollution_controls: "Pollution Controls"
		law_pollution_controls_desc: "Industrial waste, contaminated water, toxic substances, and harmful local emissions are subject to legal limits and remediation requirements."
		law_emission_controls: "Emission Controls"
		law_emission_controls_desc: "The state imposes broad quantitative restrictions upon atmospheric emissions and requires cleaner industrial and energy practices."
		law_net_zero: "Net Zero"
		law_net_zero_desc: "National policy requires remaining greenhouse emissions to be balanced by equivalent reductions, removals, or sequestration."
		law_industry_bans: "Industry Bans"
		law_industry_bans_desc: "Industries, products, extraction methods, or technologies judged environmentally intolerable are prohibited outright."
	land_development_tokens: "Land Development"
		law_unregulated_development: "Unregulated Development"
		law_unregulated_development_desc: "Landowners may construct and develop property with few prior approvals, planning requirements, or restrictions upon land use."
		law_urban_planning: "Urban Planning"
		law_urban_planning_desc: "Public authorities guide the growth of towns and cities through planned streets, utilities, districts, and infrastructure expansion."
		law_building_codes: "Building Codes"
		law_building_codes_desc: "Construction must comply with standardized requirements for structural safety, sanitation, fire prevention, access, and habitability."
		law_municipal_zoning: "Municipal Zoning"
		law_municipal_zoning_desc: "Local governments divide land into permitted uses and regulate density, height, setbacks, and patterns of urban development."
		law_state_directed_development: "State-Directed Development"
		law_state_directed_development_desc: "The state directly determines major sites for housing, industry, infrastructure, redevelopment, and new settlements."
		law_growth_controls: "Growth Controls"
		law_growth_controls_desc: "Strict planning limits restrict outward expansion, land consumption, density, or development in protected and congested areas."

#
# civil_services
	bureaucracy_tokens: "Bureaucracy"
		law_hereditary: "Hereditary"
		law_hereditary_desc: "Public offices are attached to families, estates, or hereditary social groups and pass between generations as established privileges."
		law_venal_offices: "Venal Offices"
		law_venal_offices_desc: "Government positions may be purchased, sold, or treated as private investments whose holders profit from the authority they exercise."
		law_patronage: "Patronage"
		law_patronage_desc: "Public offices are distributed in exchange for political loyalty, personal service, and support for those controlling the government."
		law_appointments: "Appointments"
		law_appointments_desc: "Officials are selected by their superiors according to experience, reputation, education, and personal judgment rather than standardized competition."
		law_examinations: "Examinations"
		law_examinations_desc: "Entry and advancement within the bureaucracy depend primarily upon competitive examinations and demonstrated administrative knowledge."
		law_managerial: "Managerial"
		law_managerial_desc: "Government agencies emphasize professional management, measurable performance, specialized expertise, and efficient administrative organization."
	education_system_tokens: "Education System"
		law_informal_schooling: "Informal Schooling"
		law_informal_schooling_desc: "Education is provided primarily within households, communities, apprenticeships, and local traditions without a formal national school system."
		law_religious_schools: "Religious Schools"
		law_religious_schools_desc: "Religious institutions provide most organized education, combining literacy and practical instruction with spiritual and doctrinal teaching."
		law_elite_schools: "Elite Schools"
		law_elite_schools_desc: "Formal education is concentrated among wealthy, noble, clerical, or otherwise privileged sections of society."
		law_private_schools: "Private Schools"
		law_private_schools_desc: "Education is provided chiefly by privately funded schools whose availability and quality depend upon fees, charity, and local demand."
		law_public_schools: "Public Schools"
		law_public_schools_desc: "The state or local authorities operate and fund schools intended to make basic education broadly available."
		law_subsidized_tertiary: "Subsidized Tertiary"
		law_subsidized_tertiary_desc: "Public funding expands access to universities, technical institutes, and advanced professional education."
		law_universal_education: "Universal Education"
		law_universal_education_desc: "Free and broadly accessible education is provided throughout childhood and adolescence regardless of wealth, residence, or social background."
	healthcare_tokens: "Healthcare"
		law_traditional_remedies: "Traditional Remedies"
		law_traditional_remedies_desc: "Healthcare relies primarily upon inherited remedies, household care, spiritual practice, and locally recognized healers."
		law_charity_clinics: "Charity Clinics"
		law_charity_clinics_desc: "Religious orders, charities, communities, and philanthropic institutions provide organized medical care to those unable to afford it."
		law_private_healthcare: "Private Healthcare"
		law_private_healthcare_desc: "Medical treatment is supplied principally through direct payment, private practitioners, employers, and voluntary insurance."
		law_mixed_system_healthcare: "Mixed System Healthcare"
		law_mixed_system_healthcare_desc: "Private medical care remains central while public hospitals, subsidies, insurance programs, and targeted services address unmet needs."
		law_universal_healthcare: "Universal Healthcare"
		law_universal_healthcare_desc: "The state guarantees access to essential healthcare for the entire population through public funding or compulsory insurance."
		law_national_health_service: "National Health Service"
		law_national_health_service_desc: "Healthcare is predominantly financed, administered, and provided through a unified public system."
	welfare_tokens: "Welfare"
		law_charity_only: "Charity Only"
		law_charity_only_desc: "Relief for poverty, unemployment, illness, and hardship is left primarily to families, communities, religious institutions, and private charity."
		law_poor_laws: "Poor Laws"
		law_poor_laws_desc: "Local authorities provide limited relief to the destitute, often under strict eligibility rules and deliberately austere conditions."
		law_income_security: "Income Security"
		law_income_security_desc: "Workers receive organized protection against temporary losses of income caused by unemployment, illness, injury, or other recognized circumstances."
		law_safety_net: "Safety Net"
		law_safety_net_desc: "The state provides means-tested assistance to those whose income and existing support are insufficient to meet basic needs."
		law_welfare_state: "Welfare State"
		law_welfare_state_desc: "Broad public programs protect citizens against poverty and major social risks throughout their lives."
		law_universal_basic_income: "Universal Basic Income"
		law_universal_basic_income_desc: "Every eligible resident receives a regular public income without regard to employment, wealth, or demonstrated need."
	pensions_tokens: "Pensions"
		law_no_pensions: "No Pensions"
		law_no_pensions_desc: "The state provides no regular retirement or disability income, leaving support to families, savings, employers, and charity."
		law_military_pensions: "Military Pensions"
		law_military_pensions_desc: "Former members of the armed forces and the dependents of fallen personnel receive public pensions in recognition of military service."
		law_public_servant_pensions: "Public Servant Pensions"
		law_public_servant_pensions_desc: "Pension rights are extended beyond the military to civilian officials and other employees of the state."
		law_old_age_pensions: "Old Age Pensions"
		law_old_age_pensions_desc: "Public pensions are extended to elderly civilians who have reached an established retirement age."
		law_disability_pensions: "Disability Pensions"
		law_disability_pensions_desc: "Public pensions also support those unable to work because of lasting injury, illness, or disability."
	policing_tokens: "Policing"
		law_communal_policing: "Communal Policing"
		law_communal_policing_desc: "Public order is maintained through households, elders, local watches, communal obligations, and the temporary mobilization of residents."
		law_local_police_force: "Local Police Force"
		law_local_police_force_desc: "Municipalities and regional authorities maintain their own permanent police forces under predominantly local direction."
		law_dedicated_police_force: "Dedicated Police Force"
		law_dedicated_police_force_desc: "Professional full-time police are organized specifically to investigate crime, enforce the law, and maintain public order."
		law_paramilitary_police: "Paramilitary Police"
		law_paramilitary_police_desc: "Police forces are organized along military lines and equipped to confront unrest, insurgency, and heavily armed opposition."
		law_private_police: "Private Police"
		law_private_police_desc: "Estates, companies, employers, and private organizations maintain security forces that perform many functions ordinarily assigned to public police."
	internal_security_tokens: "Internal Security"
		law_no_home_affairs: "No Home Affairs"
		law_no_home_affairs_desc: "The state possesses no specialized institution for coordinating internal security, political intelligence, or responses to domestic threats."
		law_guaranteed_liberties: "Guaranteed Liberties"
		law_guaranteed_liberties_desc: "Strict legal protections limit surveillance, preventive detention, political policing, and state interference in private life."
		law_regional_bailiffs: "Regional Bailiffs"
		law_regional_bailiffs_desc: "Internal enforcement is entrusted mainly to regional officials and locally controlled agents acting on behalf of courts and public authorities."
		law_national_guard: "National Guard"
		law_national_guard_desc: "Organized reserve and militia forces may be mobilized to suppress disorder, defend public institutions, and restore internal control."
		law_domestic_intelligence: "Domestic Intelligence"
		law_domestic_intelligence_desc: "A professional security service investigates espionage, terrorism, subversion, and serious domestic threats under defined legal authority."
		law_secret_police: "Secret Police"
		law_secret_police_desc: "Covert security organs monitor political opposition and use surveillance, infiltration, intimidation, and detention to defend the state and social order."
		law_police_state: "Police State"
		law_police_state_desc: "Surveillance and coercive control permeate public life, with security institutions granted sweeping authority over the population."
	housing_tokens: "Housing"
		law_no_public_housing: "No Public Housing"
		law_no_public_housing_desc: "Housing provision is left to households, landlords, employers, communities, and private construction without a significant public program."
		law_housing_assistance: "Housing Assistance"
		law_housing_assistance_desc: "The state helps households obtain private housing through subsidies, allowances, favorable loans, or other financial support."
		law_housing_projects: "Housing Projects"
		law_housing_projects_desc: "Public authorities construct concentrated residential developments to house workers, replace slums, or relieve severe urban shortages."
		law_social_housing: "Social Housing"
		law_social_housing_desc: "Public, municipal, cooperative, and nonprofit providers maintain a permanent supply of affordable housing outside the ordinary private market."
		law_state_housing: "State Housing"
		law_state_housing_desc: "The state assumes primary responsibility for constructing, owning, allocating, and managing housing across the country."
	research_system_tokens: "Research System"
		law_uninstitutionalized: "Uninstitutionalized"
		law_uninstitutionalized_desc: "Discovery and invention occur without a recognized scientific establishment through artisans, officials, physicians, engineers, and isolated intellectuals."
		law_independent_scholarship: "Independent Scholarship"
		law_independent_scholarship_desc: "A recognizable community of scholars and scientists exists, but research depends largely upon personal wealth, patronage, correspondence, and individual initiative."
		law_academic_societies: "Academic Societies"
		law_academic_societies_desc: "Universities, academies, museums, and learned societies form the principal institutions for organized research and the exchange of knowledge."
		law_corporate_laboratories: "Corporate Laboratories"
		law_corporate_laboratories_desc: "Private companies maintain professional laboratories focused upon commercially valuable products, techniques, and industrial processes."
		law_research_councils: "Research Councils"
		law_research_councils_desc: "Public funds are distributed through relatively autonomous councils that support research in universities and independent institutions."
		law_mission_oriented_research: "Mission-Oriented Research"
		law_mission_oriented_research_desc: "Research funding and institutions are concentrated upon defined national objectives such as defense, health, agriculture, energy, or industrial development."
		law_state_research_institutes: "State Research Institutes"
		law_state_research_institutes_desc: "The government directly operates laboratories and technical institutes whose researchers work as employees of the state."
#
# humanities
	criminal_justice_tokens: "Criminal Justice"
		law_arbitrary_justice: "Arbitrary Justice"
		law_arbitrary_justice_desc: "Punishment is imposed inconsistently according to the discretion of rulers, officials, and local authorities rather than predictable legal procedure."
		law_political_incarceration: "Political Incarceration"
		law_political_incarceration_desc: "Imprisonment is used to suppress dissent, isolate political opponents, and punish those considered threatening to the established order."
		law_penal_labor: "Penal Labor"
		law_penal_labor_desc: "Convicted prisoners are compelled to work in mines, plantations, workshops, infrastructure projects, or other productive enterprises."
		law_severe_punishments: "Severe Punishments"
		law_severe_punishments_desc: "Execution, corporal punishment, mutilation, exile, and public humiliation are widely employed to punish crime and deter disorder."
		law_penitentiary_system: "Penitentiary System"
		law_penitentiary_system_desc: "Confinement, discipline, surveillance, and isolation form the principal means by which serious crimes are punished."
		law_penal_correction: "Penal Correction"
		law_penal_correction_desc: "Prisons seek to reform conduct through classification, education, discipline, probation, and supervised release."
		law_criminal_rehabilitation: "Criminal Rehabilitation"
		law_criminal_rehabilitation_desc: "The justice system prioritizes addressing the causes of criminal behavior and successfully reintegrating offenders into society."
	judicial_composition_tokens: "Judicial Composition"
		law_inquisitive: "Inquisitive"
		law_inquisitive_desc: "Judges take an active role in investigating cases, gathering evidence, questioning witnesses, and determining the facts."
		law_customary: "Customary"
		law_customary_desc: "Disputes are adjudicated primarily according to inherited local traditions, communal expectations, and established precedent."
		law_religious_law: "Religious Law"
		law_religious_law_desc: "Courts derive their authority and judgments principally from religious doctrine, scripture, and recognized clerical interpretation."
		law_restorative: "Restorative"
		law_restorative_desc: "Justice seeks to repair harm through restitution, reconciliation, communal mediation, and agreements between offenders and victims."
		law_advesarial: "Adversarial"
		law_advesarial_desc: "Opposing parties present evidence and arguments before an impartial judge or jury responsible for reaching a decision."
	speech_tokens: "Speech"
		law_socially_regulated: "Socially Regulated"
		law_socially_regulated_desc: "Expression is governed primarily through custom, communal authority, religious expectation, and informal social sanction."
		law_outlawed_dissent: "Outlawed Dissent"
		law_outlawed_dissent_desc: "Public opposition to the government, ruling ideology, or established social order is treated as a criminal offense."
		law_censorship: "Censorship"
		law_censorship_desc: "Authorities inspect, restrict, or suppress publications, performances, broadcasts, and other forms of public communication."
		law_right_of_assembly: "Right of Assembly"
		law_right_of_assembly_desc: "Citizens may organize associations, publish political views, petition authorities, and gather publicly for lawful purposes."
		law_protected_speech: "Protected Speech"
		law_protected_speech_desc: "Political, artistic, religious, and personal expression receive broad legal protection against censorship and retaliation."
	womens_rights_tokens: "Women's Rights"
		law_enforced_patriarchy: "Enforced Patriarchy"
		law_enforced_patriarchy_desc: "Women are legally subordinated to male authority and excluded from independent participation in most areas of public life. Polygamy is generally legal."
		law_legal_guardianship: "Legal Guardianship"
		law_legal_guardianship_desc: "Women possess limited legal personhood and remain dependent upon fathers, husbands, or other male guardians in major civil affairs."
		law_propertied_women: "Propertied Women"
		law_propertied_women_desc: "Women may independently own, inherit, manage, and transfer property, though broader social and political restrictions remain."
		law_women_in_the_workplace: "Women in the Workforce"
		law_women_in_the_workplace_desc: "Women receive broad legal access to employment, professions, education, and economic activity outside the household."
		law_womens_suffrage: "Women's Suffrage"
		law_womens_suffrage_desc: "Women possess the right to vote and participate formally in politics on the same basis as eligible men."
		law_gender_equality: "Gender Equality"
		law_gender_equality_desc: "The law grants equal civil, political, educational, and economic rights regardless of gender, and provide protections to ensure said equality."
		law_gender_equity: "Gender Equity"
		law_gender_equity_desc: "Public institutions actively address persistent gender disparities through targeted protections, assistance, and representation."
	child_growth_tokens: "Child Growth"
		law_child_soldiers_allowed: "Child Soldiers Allowed"
		law_child_soldiers_allowed_desc: "Children may be recruited, conscripted, or otherwise employed as combatants and military auxiliaries."
		law_child_labor_allowed: "Child Labor Allowed"
		law_child_labor_allowed_desc: "Children may work in farms, workshops, mines, factories, households, and other occupations without general legal restriction."
		law_restricted_child_labor: "Restricted Child Labor"
		law_restricted_child_labor_desc: "Child employment remains legal, but minimum ages, working hours, and participation in hazardous occupations are restricted."
		law_compulsory_primary_school: "Compulsory Primary School"
		law_compulsory_primary_school_desc: "Children are required to complete a basic period of primary education rather than entering full-time employment at an early age."
		law_compulsory_secondary_school: "Compulsory Secondary School"
		law_compulsory_secondary_school_desc: "Mandatory education extends through adolescence, delaying entry into regular employment and expanding general academic instruction."
		law_compulsory_tertiary_education: "Compulsory Tertiary Education"
		law_compulsory_tertiary_education_desc: "Young adults are expected to complete university, technical, vocational, or other advanced education before entering ordinary professional life."
	slavery_tokens: "Slavery"
		law_slave_trade: "Slave Trade"
		law_slave_trade_desc: "The capture, importation, exportation, and commercial exchange of enslaved people are legally permitted and sustain the slave population."
		law_colonial_slavery: "Colonial Slavery"
		law_colonial_slavery_desc: "Slavery is prohibited or restricted in the homeland but remains lawful among colonial, dependent, or otherwise subject populations."
		law_legacy_slavery: "Legacy Slavery"
		law_legacy_slavery_desc: "Foreign slave trading is prohibited, but existing slavery, hereditary status, and domestic transfer remain legally protected."
		law_gradual_emancipation: "Gradual Emancipation"
		law_gradual_emancipation_desc: "Slavery remains temporarily legal while free-birth provisions, transitional service, compensation, or fixed deadlines gradually extinguish the institution."
		law_slavery_banned: "Slavery Banned"
		law_slavery_banned_desc: "Slavery banned indicates that the government has prohibited the practice of slavery."
		law_slavery_banned_desc: "Slave ownership, hereditary bondage, and the legal treatment of human beings as property are prohibited."
	insolvency_law_tokens: "Insolvency Law"
		law_peonage: "Peonage"
		law_peonage_desc: "Debtors may be compelled to labor for their creditors until their obligations are repaid, often under restrictive and indefinite conditions."
		law_debtors_prison: "Debtors' Prison"
		law_debtors_prison_desc: "Those unable to repay their debts may be imprisoned until payment, settlement, or release is secured."
		law_creditor_liquidation: "Creditor Liquidation"
		law_creditor_liquidation_desc: "An insolvent debtor's assets are seized and sold through an orderly legal process that prioritizes repayment of creditors."
		law_bankruptcy_discharge: "Bankruptcy Discharge"
		law_bankruptcy_discharge_desc: "Debtors who surrender eligible assets or complete an approved repayment process may be released from their remaining obligations."
		law_debt_restructuring: "Debt Restructuring"
		law_debt_restructuring_desc: "Courts and creditors may alter repayment terms, reduce obligations, or reorganize ownership to preserve viable households and enterprises."
	drug_regulations_tokens: "Drug Regulations"
		law_total_prohibition: "Total Prohibition"
		law_total_prohibition_desc: "The production, possession, sale, and consumption of intoxicating substances are broadly prohibited outside narrowly authorized uses."
		law_alcohol_banned: "Alcohol Banned"
		law_alcohol_banned_desc: "The production and sale of alcoholic beverages are prohibited, while other substances remain governed under separate rules or customs."
		law_traditional_substances_only: "Traditional Substances Only"
		law_traditional_substances_only_desc: "The use of culturally established intoxicants is tolerated, while unfamiliar, imported, or synthetic substances are prohibited."
		law_controlled_substances: "Controlled Substances"
		law_controlled_substances_desc: "Drugs are classified according to medical use and perceived danger, with production, possession, and distribution restricted accordingly."
		law_drug_legalization: "Drug Legalization"
		law_drug_legalization_desc: "Adults may legally possess and consume regulated intoxicating substances, with their production and sale permitted under established rules."
		law_safe_injection_sites: "Safe Injection Sites"
		law_safe_injection_sites_desc: "Supervised facilities allow individuals to consume prohibited drugs under medical oversight in order to prevent overdose, disease, and public harm."
	weapon_ownership_tokens: "Weapon Ownership"
		law_military_and_security_only: "Military & Security Only"
		law_military_and_security_only_desc: "Firearms are reserved for the armed forces, police, and specially authorized security personnel, with civilian ownership broadly prohibited."
		law_firearm_licensing: "Firearm Licensing"
		law_firearm_licensing_desc: "Civilians may only own firearms after meeting standardized licensing, registration, training, and eligibility requirements."
		law_gun_control: "Gun Control"
		law_gun_control_desc: "Civilian firearm access is generally allowed, though restrictions regarding weapon types, storage rules, usage, and requirements for training and background checks exist."
		law_unregulated_firearms: "Unregulated Firearms"
		law_unregulated_firearms_desc: "The acquisition, possession, carrying, and transfer of firearms are subject to few meaningful restrictions."
		law_mandatory_ownership: "Mandatory Ownership"
		law_mandatory_ownership_desc: "Eligible households or citizens are legally required to possess and maintain weapons for militia service or communal defense."
		law_gun_handouts: "Gun Handouts"
		law_gun_handouts_desc: "The state actively distributes firearms to civilians, settlers, workers, militias, or political supporters."
