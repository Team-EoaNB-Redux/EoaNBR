l_english:
# Political Legitimacy
 political_legitimacy: "Political Legitimacy"
 political_legitimacy_desc: "§YPolitical Legitimacy§! is a measure of how much the confidence and trust the people and institutions have in the government. A high level of political legitimacy indicates that the government has strong public or institutional support, while a low level suggests that the government may be facing challenges or be perceived as lacking authority."
 political_legitimacy_very_low: "Very Low Legitimacy"
 political_legitimacy_very_low_desc: "§YVery Low Legitimacy§! indicates that the government is facing severe challenges to its legitimacy, with significant portions of the population or institutions not recognizing its authority."
 political_legitimacy_low: "Low Legitimacy"
 political_legitimacy_low_desc: "§YLow Legitimacy§! indicates that the government is facing some challenges to its legitimacy, with a portion of the population or institutions not recognizing its authority."
 political_legitimacy_moderate: "Moderate Legitimacy"
 political_legitimacy_moderate_desc: "§YModerate Legitimacy§! indicates that the government has moderate support and recognition, but may still face some challenges to its authority."
 political_legitimacy_high: "High Legitimacy"
 political_legitimacy_high_desc: "§YHigh Legitimacy§! indicates that the government has strong public or institutional support, and is generally considered to be a legitimate governing body."
 political_legitimacy_very_high: "Very High Legitimacy"
 political_legitimacy_very_high_desc: "§YVery High Legitimacy§! indicates that the government has overwhelming public or institutional support, and is generally considered to be a legitimate governing body."
 political_legitimacy_illegitimate: "Illegitimate Government"
 political_legitimacy_illegitimate_desc: "§YIllegitimate Government§! indicates that the government is widely perceived as lacking authority or support, and may be facing significant challenges to its legitimacy."
 political_legitimacy_legitimate: "Legitimate Government"
 political_legitimacy_legitimate_desc: "§YLegitimate Government§! indicates that the government is widely recognized as having authority and support, and is generally considered to be a legitimate governing body."
 political_legitimacy_value: "£political_legitimacy_texticon  [?political_legitimacy]%"
 test_loc: "idea_desc|political_legitimacy_low"
#
# Political Rigidity
 political_rigidity: "Political Rigidity"
 political_rigidity_desc: "§YPolitical Rigidity§! is a measure of how resistant the government is to change. A high level of political rigidity indicates that the institutional forces maintain strong presence to keep the status quo, while a low level suggests that ideological or revolutionary forces may be gaining influence to bring change."
 political_rigidity_very_low: "Very Low Rigidity"
 political_rigidity_very_low_desc: "§YVery Low Rigidity§! indicates that the government is highly susceptible to change, with significant portions of the population or institutions pushing for reform or revolution."
 political_rigidity_low: "Low Rigidity"
 political_rigidity_low_desc: "§YLow Rigidity§! indicates that the government is somewhat susceptible to change, with some portions of the population or institutions pushing for reform."
 political_rigidity_moderate: "Moderate Rigidity"
 political_rigidity_moderate_desc: "§YModerate Rigidity§! indicates that the government is somewhat resistant to change, with a balanced mix of forces that support the status quo and those pushing for reform."
 political_rigidity_high: "High Rigidity"
 political_rigidity_high_desc: "§YHigh Rigidity§! indicates that the government is resistant to change, with strong institutional forces maintaining the status quo."
 political_rigidity_very_high: "Very High Rigidity"
 political_rigidity_very_high_desc: "§YVery High Rigidity§! indicates that the government is extremely resistant to change, with powerful institutional forces working to maintain the status quo."
 political_rigidity_volatile: "Volatile Politics"
 political_rigidity_volatile_desc: "§YVolatile§! indicates that the government is open to change, with weak institutional forces that may be replaced by new ones."
 political_rigidity_immutable: "Immutable Politics"
 political_rigidity_immutable_desc: "§YImmutable§! indicates that the government is highly resistant to change, with strong institutional forces maintaining the status quo and preventing any significant reforms or revolutions."
 political_rigidity_value: "£political_rigidity_texticon  [?political_rigidity]%"
#
# Coalition Cohesion
 political_cohesion: "Coalition Cohesion"
 political_cohesion_desc: "§YCoalition Cohesion§! is a measure of how united the ruling coalition is. A high level of coalition cohesion indicates that the coalition members are working together effectively, while a low level suggests that there may be internal conflicts or disagreements."
 political_cohesion_very_low: "Very Low Cohesion"
 political_cohesion_very_low_desc: "§YVery Low Cohesion§! indicates that the ruling coalition is facing significant internal conflicts or disagreements, which may lead to its collapse."
 political_cohesion_low: "Low Cohesion"
 political_cohesion_low_desc: "§YLow Cohesion§! indicates that the ruling coalition is experiencing some internal conflicts or disagreements, which may affect its effectiveness."
 political_cohesion_moderate: "Moderate Cohesion"
 political_cohesion_moderate_desc: "§YModerate Cohesion§! indicates that the ruling coalition is relatively united, but there may be some underlying tensions."
 political_cohesion_high: "High Cohesion"
 political_cohesion_high_desc: "§YHigh Cohesion§! indicates that the ruling coalition is very united and working effectively together."
 political_cohesion_very_high: "Very High Cohesion"
 political_cohesion_very_high_desc: "§YVery High Cohesion§! indicates that the ruling coalition is extremely united and functioning at a high level of effectiveness."
 political_cohesion_factional: "Factional Coalition"
 political_cohesion_factional_desc: "§YFactional Coalition§! indicates that the ruling coalition is composed of distinct factions with potentially conflicting interests."
 political_cohesion_harmonious: "Harmonious Coalition"
 political_cohesion_harmonious_desc: "§YHarmonious Coalition§! indicates that the ruling coalition is working together in a cooperative and unified manner."
 political_cohesion_value: "£political_cohesion_texticon  [?political_cohesion]%"
