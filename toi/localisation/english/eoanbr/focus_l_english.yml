 GER_focus_historical_domestic_policy: "Domestic Policy"
 GER_focus_historical_domestic_policy_desc: "We need to make a few domestic reforms - Bismarck already made some propositions..."
 GER_focus_historical_social_security_laws: "Social Security Laws"
 GER_focus_historical_social_security_laws_desc: "Social Security Laws take a bit of weight off the shoulders of the German worker."
 GER_focus_historical_pensions_old_age: "Institute Pensions"
 GER_focus_historical_pensions_old_age_desc: "We will institute pensions for citizens that have worked for long enough, so that they may enjoy their old age."
 GER_focus_historical_insurance_invalidity: "Insurance against Invalidity"
 GER_focus_historical_insurance_invalidity_desc: "We will insure our workers against invalidity, whatever the causes for it may be."
 GER_focus_historical_insurance_accidents: "...against Accidents"
 GER_focus_historical_insurance_accidents_desc: "Accidents can cripple a person not only literally, but also economically. We should provide aid to the ones suffering from their consequences."
 GER_focus_historical_insurance_sickness: "...against Illness"
 GER_focus_historical_insurance_sickness_desc: "Illness can strike a worker at any time and seemingly at random, so we should help the suffering in this regard as well."
 GER_focus_historical_fight_social_democrats: "Fight the Social Democrats"
 GER_focus_historical_fight_social_democrats_desc: "The Social Democrats pose a threat to our way of life, so we must ensure their dangerous ideas do not take hold in our great country."
 GER_focus_historical_law_of_1878: "The Law of 1878"
 GER_focus_historical_law_of_1878_desc: "We will enact a few laws stopping the spread of socialism in [PRS.GetNameDef]."
 GER_focus_historical_court_cases_socialists: "Court Cases"
 GER_focus_historical_court_cases_socialists_desc: "We will take the most vehement and dangerous socialist activists to court so they may not endanger our society."
 GER_focus_historical_kulturkampf: "Kulturkampf"
 GER_focus_historical_kulturkampf_desc: "Germany has been split into small countries for centuries before its unification - we must ensure we all share a common culture and way of life."
 GER_focus_historical_church_strikes: "Church Strikes"
 GER_focus_historical_church_strikes_desc: "We will organize strikes in churches to control religion in our country."
 GER_focus_historical_side_with_catholics: "Side with the Catholics"
 GER_focus_historical_side_with_catholics_desc: "Catholicism has long tradition in Germany, and is represented in prosperous states like Bavaria. We should encourage it."
 GER_focus_historical_side_with_protestants: "Side with the Protestants"
 GER_focus_historical_side_with_protestants_desc: "As the birthplace of Protestantism, Germany should be its bearer into the world."
 GER_focus_historical_our_culture: "Our Culture"
 GER_focus_historical_our_culture_desc: "We should spread our culture into conquered areas that do not fully accept it yet."
 GER_focus_historical_begin_germanization: "Begin Germanization..."
 GER_focus_historical_begin_germanization_desc: "We will start efforts to germanize some of our territories."
 GER_focus_historical_germanization_in_poland: "...in Poland"
 GER_focus_historical_germanization_in_poland_desc: "Our Polish holdings like Poznan and Pomerellen will be germanized."
 GER_focus_historical_germanization_in_france: "...in France"
 GER_focus_historical_germanization_in_france_desc: "Our acquired territory in Alsace will be germanized."
 GER_focus_historical_germanization_in_denmark: "...in Denmark"
 GER_focus_historical_germanization_in_denmark_desc: "We will begin germanization efforts in the territory of Schleswig."
