 GER_focus_historical_kissingen_dictation: "The Kissingen Dictation"
 GER_focus_historical_kissingen_dictation_desc: "We will enact a political manifesto written by Bismarck himself against the socialist menace."
 GER_focus_historical_repair_austrian_relations: "Repair Relations with Austria"
 GER_focus_historical_repair_austrian_relations_desc: "We need to repair our relations with Austria, we cannot have a disgruntled neighbor forever."
