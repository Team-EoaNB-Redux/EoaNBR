#Extraction
 extraction_folder: "(RE) Refinement & Extraction"
 extraction_folder_desc: "The processes and techniques involved in refining and extracting valuable resources, from minerals and metals to oil and gas, driving various industries forward."
 extraction_folder_title: "REFINEMENT & EXTRACTION"
 #Metal Working
  tech_metallurgy: "[RE - 1500] Metallurgy"
  tech_metallurgy_desc: "Metallurgy is the science and technology of extracting metals from their ores, refining them, and preparing them for use. It involves various processes such as smelting, alloying, and heat treatment to produce metals with desired properties for industrial applications."
  tech_steelworking: "[RE - 1700] Steelworking"
  tech_steelworking_desc: "Steelworking is the process of shaping and manipulating steel to create various products and structures. It involves techniques such as forging, rolling, and welding to produce steel components for construction, machinery, and other applications."
  tech_puddling: "[RE - 1750] Puddling"
  tech_puddling_desc: "The puddling process is a method of refining iron by heating it in a reverberatory furnace and stirring it to remove impurities. This technique was widely used in the 18th and 19th centuries to produce wrought iron from pig iron."
  tech_regenerative_heat_exchanger: "[RE - 1800] Regenerative Heat Exchanger"
  tech_regenerative_heat_exchanger_desc: "Regenerative heat exchangers are devices that recover and reuse heat from industrial processes, improving energy efficiency. They work by transferring heat from hot exhaust gases to incoming air or fluids, reducing fuel consumption and emissions."
  tech_hot_blast_furnace: "[RE - 1820] Hot Blast Furnace"
  tech_hot_blast_furnace_desc: "Hot blast furnaces are a type of furnace that preheats the air blown into the furnace, increasing the efficiency of the smelting process. This technology allows for higher temperatures and improved fuel efficiency in metal extraction."
  tech_bessemer_process: "[RE - 1860] Bessemer Process"
  tech_bessemer_process_desc: "Bessemer process is a method of converting pig iron into steel by blowing air through the molten iron to remove impurities. This process revolutionized steel production in the 19th century, making it faster and more cost-effective."
  tech_open_hearth_furnace: "[RE - 1865] Open Hearth Furnace"
  tech_open_hearth_furnace_desc: "Open hearth furnaces are a type of furnace used for refining iron and steel. They operate at lower temperatures than other furnaces and allow for better control over the chemical composition of the final product."
  tech_gilchrist_thomas_process: "[RE - 1880] Gilchrist Thomas Process"
  tech_gilchrist_thomas_process_desc: "The Gilchrist Thomas process is a method of producing high-quality steel by removing phosphorus from pig iron through the use of lime and other fluxes. This process was particularly important for producing steel from phosphorous-rich iron ores."
  tech_electric_arc_process: "[RE - 1890] Electric Arc Process"
  tech_electric_arc_process_desc: "Electric arc process is a method of steelmaking that uses an electric arc to melt scrap steel or direct reduced iron. This process allows for precise control over the composition of the steel and is widely used in modern steel production."
  tech_injection_molding: "[RE - 1920] Injection Molding"
  tech_injection_molding_desc: "Injection molding is a manufacturing process used to produce parts by injecting molten material into a mold. It is commonly used for producing plastic components and allows for high-volume production with consistent quality."
  tech_screw_injection: "[RE - 1945] Screw Injection"
  tech_screw_injection_desc: "Screw injection is a manufacturing process used to produce parts by injecting molten material into a mold using a screw mechanism. It is commonly used for producing plastic components and allows for high-volume production with consistent quality."
  tech_oxygen_steelmaking: "[RE - 1950] Lina Donawitz Process"
  tech_oxygen_steelmaking_desc: "Oxygen steelmaking is a method of producing steel by blowing oxygen through the molten iron to remove impurities. This process was developed in the mid-20th century and is widely used in modern steel production."
  tech_bottom_blown_converters: "[RE - 1960] Bottom Blown Converters"
  tech_bottom_blown_converters_desc: "Bottom blown converters are a type of steelmaking furnace that injects oxygen from the bottom of the vessel, allowing for more efficient removal of impurities and improved steel quality. This technology is used in modern steel production."
  tech_atomic_absorption_spectrophotometer: "[RE - 1970] Atomic Absorption Spectrophometer"
  tech_atomic_absorption_spectrophotometer_desc: "Atomic absorption spectrophotometry is an analytical technique used to measure the concentration of elements in a sample by analyzing the absorption of light. This method is widely used in metallurgy and chemistry for precise elemental analysis."
  tech_energy_optimizing_furnace: "[RE - 1980] Energy Optimizing Furnace"
  tech_energy_optimizing_furnace_desc: "Energy optimizing furnaces are designed to maximize Energy's modding efficiency and reduce food consumption in coding proceesses."
  tech_bottom_blown_oxygen_converters: "[RE - 1995] Bottom Blown Oxygen Converters"
  tech_bottom_blown_oxygen_converters_desc: "Bottom blown oxygen converters are a type of steelmaking furnace that injects oxygen from the bottom of the vessel, allowing for more efficient removal of impurities and improved steel quality. This technology is used in modern steel production."
  tech_hydrogen_steel: "[RE - 2020] Hydrogen Steel"
  tech_hydrogen_steel_desc: "Hydrogen steel is a type of steel produced using hydrogen as a reducing agent in the steelmaking process. This method can result in higher quality steel with improved properties."
 #Alloys
  tech_cast_iron: "[RE - 1750] Cast Iron"
  tech_cast_iron_desc: "Cast iron is a type of iron alloy that contains a higher carbon content than steel, making it hard and brittle. It is commonly used in construction, machinery, and cookware due to its durability and heat retention properties."
  tech_wrought_iron: "[RE - 1800] Wrought Iron"
  tech_wrought_iron_desc: "Wrought iron is a type of iron alloy that contains a lower carbon content than steel, making it more malleable and ductile. It is commonly used in construction and decorative applications due to its strength and aesthetic appeal."
  tech_basic_chrome_electroplating: "[RE - 1850] Basic Chrome Electroplating"
  tech_basic_chrome_electroplating_desc: "Basic chrome electroplating is a process of depositing a thin layer of chromium onto a substrate to improve its appearance, durability, and corrosion resistance. This technique is commonly used in the automotive and manufacturing industries."
  tech_self_hardening_tungsten_steel: "[RE - 1865] Self Hardening Tungsten Steel"
  tech_self_hardening_tungsten_steel_desc: "Self-hardening tungsten steel is a type of steel alloy that contains tungsten, which allows it to harden and retain its strength at high temperatures. This material is commonly used in cutting tools and industrial applications where durability and heat resistance are required."
  tech_manganese_steel: "[RE - 1870] Manganese Steel"
  tech_manganese_steel_desc: "Manganese steel is a type of steel alloy that contains a high percentage of manganese, which gives it exceptional toughness and wear resistance. It is commonly used in applications such as railway tracks, mining equipment, and armor plating."
  tech_bayer_process: "[RE - 1885] Bayer Process"
  tech_bayer_process_desc: "Bayer process is a method of producing aluminum from bauxite ore. It involves dissolving the ore in sodium hydroxide, precipitating aluminum hydroxide, and then calcining it to produce pure aluminum. This process is widely used in the aluminum industry."
  tech_tungsten_wire: "[RE - 1900] Tungsten Wire"
  tech_tungsten_wire_desc: "Tungsten wire is a type of wire made from tungsten, known for its high melting point and strength. It is commonly used in applications requiring high temperature resistance and durability."
  tech_electric_steel: "[RE - 1905] Electric Steel"
  tech_electric_steel_desc: "Electric steel is a type of steel produced using electric arc furnaces, which allow for more precise control over the steelmaking process and improved quality. It is commonly used in the production of high-grade steel products."
  tech_stainless_steel: "[RE - 1915] Stainless Steel"
  tech_stainless_steel_desc: "Stainless steel is a type of steel that contains a minimum of 10.5% chromium, which provides it with excellent corrosion resistance. It is commonly used in applications where exposure to moisture or chemicals is likely."
  tech_industrial_chrome_electroplating: "[RE - 1920] Industrial Chrome Electroplating"
  tech_industrial_chrome_electroplating_desc: "Industrial chrome electroplating is a more advanced version of basic chrome electroplating, designed for use in demanding industrial applications. It provides superior durability and corrosion resistance."
  tech_kroll_process: "[RE - 1950] Kroll Process"
  tech_kroll_process_desc: "The Kroll process is a method of producing titanium from titanium tetrachloride. It involves reducing the titanium tetrachloride with magnesium to produce pure titanium metal. This process is widely used in the titanium industry."
  tech_hydroforming: "[RE - 1955] Hydroforming"
  tech_hydroforming_desc: "Hydroforming is a manufacturing process that uses fluid pressure to form metal into complex shapes. It is commonly used in the automotive industry for producing lightweight, strong components."
 #oil_refining
  tech_oil_distillation: "[RE - 1500] Oil Distillation"
  tech_oil_distillation_desc: "Oil distillation is a process used to separate crude oil into its various components based on their boiling points. This technique allows for the production of different petroleum products, such as gasoline, diesel, and kerosene."
  tech_petroleum_refining: "[RE - 1840] Petroleum Refining"
  tech_petroleum_refining_desc: "Petroleum refining is the process of converting crude oil into useful products such as gasoline, diesel, and other fuels. This involves several stages of processing to separate and treat the different components of crude oil."
  tech_kerosene: "[RE - 1850] Kerosene"
  tech_kerosene_desc: "Kerosene is a flammable hydrocarbon liquid used as a fuel for heating, lighting, and industrial processes. It is produced during the refining of crude oil."
  tech_atmospheric_distillation: "[RE - 1860] Atmospheric Distillation"
  tech_atmospheric_distillation_desc: "Atmospheric distillation is a process used to separate crude oil into its various components based on their boiling points. This technique allows for the production of different petroleum products, such as gasoline, diesel, and kerosene."
  tech_asphalt: "[RE - 1870] Asphalt"
  tech_asphalt_desc: "Asphalt is a sticky, black solid or semi-solid form of petroleum that is commonly used in road construction and waterproofing applications. It is produced during the refining of crude oil and can be further processed into various grades for different uses."
  tech_continuous_distillation: "[RE - 1880] Continuous Distillation"
  tech_continuous_distillation_desc: "Continuous distillation is a process used to separate crude oil into its various components based on their boiling points. This technique allows for the production of different petroleum products, such as gasoline, diesel, and kerosene."
  tech_pressure_cracking: "[RE - 1890] Pressure Cracking"
  tech_pressure_cracking_desc: "Pressure cracking is a process used to break down heavy hydrocarbon molecules into lighter, more valuable products under high pressure and temperature conditions. This technique is commonly used in petroleum refining to produce gasoline and other fuels."
  tech_partial_condensation: "[RE - 1900] Partial Condensation"
  tech_partial_condensation_desc: "Partial condensation is a process used to separate crude oil into its various components based on their boiling points. This technique allows for the production of different petroleum products, such as gasoline, diesel, and kerosene."
  tech_vacuum_distillation: "[RE - 1905] Vacuum Distillation"
  tech_vacuum_distillation_desc: "Vacuum distillation is a process used to separate crude oil into its various components based on their boiling points. This technique allows for the production of different petroleum products, such as gasoline, diesel, and kerosene."
  tech_trumble_process: "[RE - 1910] Trumble Process"
  tech_trumble_process_desc: "The Trumble process is a method of petroleum refining that involves the use of a special type of catalyst to improve the efficiency of the distillation process. It allows for the production of higher-quality petroleum products."
  tech_thermal_cracking: "[RE - 1915] Thermal Cracking"
  tech_thermal_cracking_desc: "Thermal cracking is a process used to break down heavy hydrocarbon molecules into lighter, more valuable products using heat. This technique is commonly used in petroleum refining to produce gasoline and other fuels."
  tech_sweetening: "[RE - 1920] Sweetening"
  tech_sweetening_desc: "Sweetening is a process used in petroleum refining to remove sulfur compounds from crude oil and its products. This technique improves the quality of fuels and reduces harmful emissions when the fuels are burned."
  tech_catalytic_cracking: "[RE - 1935] Catalytic Cracking"
  tech_catalytic_cracking_desc: "Catalytic cracking is a process used to break down heavy hydrocarbon molecules into lighter, more valuable products using a catalyst. This technique is commonly used in petroleum refining to produce gasoline and other fuels."
  tech_fluid_catalytic_cracking: "[RE - 1945] Fluid Catalytic Cracking"
  tech_fluid_catalytic_cracking_desc: "Fluid catalytic cracking is a process used to break down heavy hydrocarbon molecules into lighter, more valuable products using a fluidized catalyst. This technique is commonly used in petroleum refining to produce gasoline and other fuels."
  tech_desulfurization: "[RE - 1950] Desulfurization"
  tech_desulfurization_desc: "Desulfurization is a process used in petroleum refining to remove sulfur compounds from crude oil and its products. This technique improves the quality of fuels and reduces harmful emissions when the fuels are burned."
  tech_synthetic_zeolites: "[RE - 1955] Synthetic Zeolites"
  tech_synthetic_zeolites_desc: "Synthetic zeolites are a type of crystalline aluminosilicate material that is used as a catalyst in petroleum refining processes. They have a high surface area and unique pore structure, making them effective for breaking down heavy hydrocarbon molecules into lighter products."
  tech_hydrocracking: "[RE - 1960] Hydrocracking"
  tech_hydrocracking_desc: "Hydrocracking is a process used to break down heavy hydrocarbon molecules into lighter, more valuable products using hydrogen gas and a catalyst. This technique is commonly used in petroleum refining to produce gasoline and other fuels."
  tech_bimetallic_catalysts: "[RE - 1965] Bimetallic Catalysts"
  tech_bimetallic_catalysts_desc: "Bimetallic catalysts are a type of catalyst that contains two different metals, which can improve the efficiency and selectivity of petroleum refining processes. They are commonly used in hydrocracking and other refining applications."
  tech_low_temperature_hydrocracking: "[RE - 1970] Low-Temperature Hydrocracking"
  tech_low_temperature_hydrocracking_desc: "Low-temperature hydrocracking is a process used to break down heavy hydrocarbon molecules into lighter, more valuable products at lower temperatures using hydrogen gas and a catalyst. This technique is commonly used in petroleum refining to produce gasoline and other fuels."
  tech_catalytic_dewaxing: "[RE - 1975] Catalytic Dewaxing"
  tech_catalytic_dewaxing_desc: "Catalytic dewaxing is a process used in petroleum refining to remove waxes from lubricating oil fractions. This technique improves the low-temperature properties of the refined products."
  tech_gasification: "[RE -1985] Gasification"
  tech_gasification_desc: "Gasification is a process used to convert carbonaceous materials into synthetic gas (syngas). This technique is commonly used in the production of fuels and chemicals."
  tech_biofuels: "[RE - 1990] Biofuels"
  tech_biofuels_desc: "Biofuels are renewable fuels derived from organic matter such as plants or animal waste. They can be used as alternatives to fossil fuels in various applications."
  tech_membrane_separation: "[RE - 2025] Membrane Separation"
  tech_membrane_separation_desc: "Membrane separation is a process used to separate components of a mixture using a selective membrane. This technique is commonly used in the production of fuels and chemicals."
 #oil_drilling
  tech_cable_tool_drilling: "[RE - 1500] Cable Tool Drilling"
  tech_cable_tool_drilling_desc: "Cable tool drilling is a method of drilling wells using a heavy drill bit attached to a cable. This technique was commonly used in the early days of oil exploration and is still used in certain applications today."
  tech_four_legged_derrick: "[RE - 1820] Four Legged Derrick"
  tech_four_legged_derrick_desc: "Four legged derrick is a type of drilling rig structure that uses four vertical legs to support the drilling equipment. This design provides stability and allows for the drilling of deeper wells."
  tech_steam_powered_oil_derrick: "[RE - 1860] Steam Powered Oil Derrick"
  tech_steam_powered_oil_derrick_desc: "Steam powered oil derrick is a type of drilling rig that uses steam engines to power the drilling equipment. This technology was commonly used in the 19th century and allowed for more efficient drilling operations."
  tech_roberts_torpedo: "[RE - 1865] Robert's Torpedo"
  tech_roberts_torpedo_desc: "Robert's Torpedo is a method of stimulating oil wells by using an explosive charge to fracture the rock and increase oil flow. This technique was developed in the 19th century and was an early form of well stimulation."
  tech_cable_tool_drilling_improvements: "[RE - 1875] Cable Tool Drilling Improvements"
  tech_cable_tool_drilling_improvements_desc: "Cable tool drilling improvements refer to advancements in the cable tool drilling method, such as better drill bits, improved hoisting systems, and enhanced drilling techniques. These improvements increased the efficiency and effectiveness of cable tool drilling operations."
  tech_rotary_drilling: "[RE - 1895] Rotary Drilling"
  tech_rotary_drilling_desc: "Rotary drilling is a method of drilling wells using a rotating drill bit to cut through rock and soil. This technique allows for faster and more efficient drilling compared to traditional cable tool methods."
  tech_drilling_mud: "[RE - 1900] Drilling Mud"
  tech_drilling_mud_desc: "Drilling mud is a fluid used in the drilling process to lubricate the drill bit, remove cuttings from the wellbore, and maintain pressure control. It is an essential component of modern drilling operations."
  tech_standard_derrick: "[RE - 1905] Standard Derrick"
  tech_standard_derrick_desc: "The standard derrick is a type of drilling rig structure that uses a tall, vertical framework to support the drilling equipment. This design allows for the drilling of deeper wells and provides stability during drilling operations."
  tech_steel_roller_cone_drill_bit: "[RE - 1910] Steel Roller Cone Drill Bit"
  tech_steel_roller_cone_drill_bit_desc: "Steel roller cone drill bits are designed to provide improved cutting efficiency and durability in challenging drilling conditions. They feature multiple rotating cones with hardened steel teeth that crush and grind rock formations, making them suitable for a wide range of drilling applications."
  tech_single_speed_drawworks: "[RE - 1915] Single-Speed Drawworks"
  tech_single_speed_drawworks_desc: "Single-speed drawworks are a type of hoisting system used in drilling operations. They consist of a single-speed motor that powers the hoisting drum, allowing for the raising and lowering of the drill string and other equipment during drilling operations."
  tech_two_speed_drawworks: "[RE - 1920] Two-Speed Drawworks"
  tech_two_speed_drawworks_desc: "Two-speed drawworks are a type of hoisting system used in drilling operations. They consist of a two-speed motor that powers the hoisting drum, allowing for the raising and lowering of the drill string and other equipment during drilling operations."
  tech_blowout_preventor: "[RE - 1925] Blowout Preventer"
  tech_blowout_preventor_desc: "Blowout preventers are safety devices used in drilling operations to prevent uncontrolled release of fluids from the wellbore. They are designed to seal the wellhead in case of an emergency, ensuring the safety of personnel and the environment."
  tech_four_speed_drawworks: "[RE - 1930] Four Speed Drawworks"
  tech_four_speed_drawworks_desc: "Four-speed drawworks are a type of hoisting system used in drilling operations. They consist of a four-speed motor that powers the hoisting drum, allowing for the raising and lowering of the drill string and other equipment during drilling operations."
  tech_tricone_bit: "[RE - 1935] Tricone Bit"
  tech_tricone_bit_desc: "Tricone bits are drill bits that use three conical cutting elements to drill through rock formations. They are known for their durability and effectiveness in a wide range of drilling applications."
  tech_directional_drilling_experiments: "[RE - 1940] Directional Drilling Experiments"
  tech_directional_drilling_experiments_desc: "Directional drilling experiments involve testing techniques for drilling wells at angles other than vertical. This allows access to reservoirs that would otherwise be unreachable."
  tech_steel_derricks: "[RE - 1945] Steel Derricks"
  tech_steel_derricks_desc: "Steel derricks are modern drilling rigs constructed with steel frames, providing increased strength and durability compared to traditional wooden structures. They allow for deeper drilling and improved safety in oil and gas exploration."
  tech_air_drilling_fluid: "[RE - 1950] Air Drilling Fluid"
  tech_air_drilling_fluid_desc: "Air drilling fluid is a type of drilling fluid that uses compressed air or gas to remove cuttings from the wellbore and maintain pressure control. This technique is commonly used in certain drilling applications, particularly in hard rock formations."
  tech_diesel_powered_derricks: "[RE - 1955] Diesel-Powered Derricks"
  tech_diesel_powered_derricks_desc: "Diesel-powered derricks are modern drilling rigs that use diesel engines for power, providing increased mobility and flexibility in remote locations."
  tech_electrical_drilling_rigs: "[RE - 1970] Electrical Drilling Rigs"
  tech_electrical_drilling_rigs_desc: "Electrical drilling rigs are modern drilling systems that use electric motors for power, offering improved efficiency and reduced emissions compared to traditional diesel-powered rigs."
  tech_mud_pulse_telemetry: "[RE - 1975] Mud Pulse Telemetry"
  tech_mud_pulse_telemetry_desc: "Mud pulse telemetry is a communication system used in drilling operations to transmit data from downhole sensors to the surface. It uses pressure pulses in the drilling fluid to encode and send information about well conditions, allowing for real-time monitoring and decision-making."
  tech_measurement_while_drilling_system: "[RE - 1980] Measurement-While-Drilling System"
  tech_measurement_while_drilling_system_desc: "Measurement-while-drilling (MWD) systems are technologies that provide real-time data on wellbore conditions during drilling operations. These systems use sensors and telemetry to measure parameters such as inclination, azimuth, and formation properties, allowing for improved drilling accuracy and efficiency."
  tech_3d_seismic_imagery: "[RE - 1985] 3D Seismic Imagery"
  tech_3d_seismic_imagery_desc: "3D seismic imagery is a geophysical technique used to create three-dimensional images of subsurface geological formations. This technology helps identify potential oil and gas reservoirs, guiding drilling operations and improving exploration success rates."
  tech_steerable_drilling: "[RE - 1990] Steerable Drilling"
  tech_steerable_drilling_desc: "Steerable drilling is a technique that allows for precise control of the drill bit's direction during drilling operations, enabling the creation of complex well paths. This technology is particularly useful for accessing reservoirs that are not directly beneath the drilling rig."
  tech_rotary_close_loop_drilling: "[RE - 1995] Rotary Close Loop Drilling"
  tech_rotary_close_loop_drilling_desc: "Rotary close loop drilling is a drilling technique that uses a closed-loop system to circulate drilling fluid, improving efficiency and reducing environmental impact. This method allows for better control of wellbore conditions and minimizes the risk of fluid loss."
  tech_modern_doghouse: "[RE - 2000] Modern Doghouse"
  tech_modern_doghouse_desc: "The modern doghouse is a control room on a drilling rig that houses the equipment and personnel responsible for monitoring and controlling drilling operations. It provides a safe and organized environment for managing the complex processes involved in drilling."
  tech_horizontal_pad_drilling: "[RE - 2005] Horizontal Pad Drilling"
  tech_horizontal_pad_drilling_desc: "Horizontal pad drilling is a technique that allows for the drilling of multiple wells from a single surface location, known as a pad. This method reduces surface disturbance and improves efficiency in accessing oil and gas reservoirs."
  tech_skidding_rigs: "[RE - 2010] Skidding rigs"
  tech_skidding_rigs_desc: "Skidding rigs are mobile drilling platforms that can be moved horizontally across the surface to access multiple drilling locations, improving flexibility and reducing setup time."
  tech_3d_logging_while_drilling_system: "[RE - 2020] 3D Logging-While-Drilling System"
  tech_3d_logging_while_drilling_system_desc: "3D logging-while-drilling systems provide real-time three-dimensional data on subsurface conditions during drilling operations, enhancing decision-making and improving drilling efficiency."
