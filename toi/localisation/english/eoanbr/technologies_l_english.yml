 #factories
  tech_manufactories: "[IC - 1700] Manufactories"
  tech_manufactories_desc: "Manufactories are early industrial buildings where goods are produced on a large scale using machinery and labor. They represent the transition from artisanal workshops to modern factories."
  tech_factories: "[IC - 1750] Factories"
  tech_factories_desc: "Factories are industrial buildings where goods are produced on a large scale using machinery and labor. They represent the evolution of manufactories, with more advanced production techniques and organizational structures."
  tech_industrial_production: "[IC - 1800] Industrial Production"
  tech_industrial_production_desc: "Industrial production refers to the large-scale manufacturing of goods using advanced machinery and production methods. It marks a significant step in the development of modern industry."
  tech_mechanical_production: "[IC - 1860] Mechanical Production"
  tech_mechanical_production_desc: "Mechanical production involves the use of machines to automate and enhance the manufacturing process, increasing efficiency and consistency in industrial output."
  tech_semi_automatization: "[IC - 1875] Semi-Automatization"
  tech_semi_automatization_desc: "Semi-automatization refers to the partial automation of manufacturing processes, where machines perform some tasks while human labor is still required for others, improving efficiency without full mechanization."
  tech_industrial_electrification: "[IC - 1885] Industrial Electrification"
  tech_industrial_electrification_desc: "Industrial electrification involves the adoption of electrical power in factories and industrial processes, enabling more efficient and flexible production compared to steam or manual power."
  tech_steel_conveyor_belts: "[IC - 1900] Steel Conveyor Belts"
  tech_steel_conveyor_belts_desc: "Steel conveyor belts are used in industrial settings to transport materials efficiently across production lines, reducing manual handling and increasing throughput."
  tech_assembly_line: "[IC - 1915] Assembly Line"
  tech_assembly_line_desc: "An assembly line is a manufacturing process in which products are assembled in a sequential manner, with each worker or machine performing a specific task, greatly increasing production efficiency."
