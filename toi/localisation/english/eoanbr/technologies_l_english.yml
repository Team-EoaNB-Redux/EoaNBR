 #management
  tech_factory_clock: "[IC - 1800] Factory Clock"
  tech_factory_clock_desc: "A factory clock is a timekeeping device used in industrial settings to regulate work hours and shifts, ensuring synchronized operations and efficient labor management."
  tech_scientific_management: "[IC - 1840] Scientific Management"
  tech_scientific_management_desc: "Scientific management is a theory of management that analyzes and synthesizes workflows to improve economic efficiency, particularly labor productivity, through systematic study and optimization."
  tech_shift_work: "[IC - 1865] Shift Work"
  tech_shift_work_desc: "Shift work is a work schedule that divides the day into multiple shifts, allowing continuous operation of factories and businesses while managing labor resources effectively."
  tech_time_zones: "[IC - 1870] Time Zones"
  tech_time_zones_desc: "Time zones are regions of the Earth that have the same standard time, facilitating synchronized scheduling and coordination across different geographical areas, particularly important for industrial and commercial activities."
  tech_electrical_lighting: "[IC - 1880] Electrical Lighting"
  tech_electrical_lighting_desc: "Electrical lighting involves the use of electric lamps to illuminate workspaces, improving visibility, safety, and productivity in industrial and domestic environments."
  tech_time_clock: "[IC - 1890] Time Clock"
  tech_time_clock_desc: "A time clock is a device used to record the start and end times of employees' work shifts, aiding in accurate tracking of labor hours and payroll management."
 #
 #consumer_goods
  tech_crystal_glass: "[IC - 1700] Crystal Glass"
  tech_crystal_glass_desc: "Crystal glass is a high-quality, transparent glass that contains lead oxide, giving it a brilliant sparkle and making it suitable for fine glassware and decorative items."
  tech_chemical_bleaching: "[IC - 1750] Chemical Bleaching"
  tech_chemical_bleaching_desc: "Chemical bleaching is a process used to whiten textiles and paper by removing natural color through chemical reactions, improving the appearance and quality of the final product."
  tech_precision_made_furniture: "[IC - 1820] Precision-Made Furniture"
  tech_precision_made_furniture_desc: "Precision-made furniture refers to furniture manufactured with high accuracy and consistency, often using machinery and standardized components, resulting in better quality and fit."
  tech_cylinder_printing_press: "[IC - 1840] Cylinder-Printing Press"
  tech_cylinder_printing_press_desc: "A cylinder-printing press is a type of printing press where the paper passes between a cylinder and a flat plate, allowing for faster and more efficient printing compared to traditional flatbed presses."
  tech_corrugated_paper: "[IC - 1860] Corrugated Paper"
  tech_corrugated_paper_desc: "Corrugated paper is a material consisting of a fluted corrugated sheet and one or two flat linerboards, commonly used for making strong and lightweight packaging such as cardboard boxes."
  tech_web_offset_printing: "[IC - 1865] Web-Offset Printing"
  tech_web_offset_printing_desc: "Web-offset printing is a high-speed printing process where a continuous roll of paper is fed through the press, allowing for efficient mass production of newspapers, magazines, and other printed materials."
  tech_sulfite_pulping: "[IC - 1875] Sulfite Pulping"
  tech_sulfite_pulping_desc: "Sulfite pulping is a chemical process used to produce paper pulp by cooking wood chips with a mixture of sulfurous acid and bisulfite salts, resulting in a high-quality, strong, and flexible paper product."
 #
 #tools
  tech_iron_tools: "[IC - 1700] Iron Tools"
  tech_iron_tools_desc: "Iron tools are basic hand tools made of iron, used in various manual labor and construction tasks before the advent of more advanced industrial tools."
  tech_industrial_tools: "[IC - 1820] Industrial Tools"
  tech_industrial_tools_desc: "Industrial tools are specialized tools designed for use in industrial settings, often more durable and efficient than basic hand tools, aiding in various manufacturing and construction processes."
  tech_mechanical_tools: "[IC - 1860] Mechanical Tools"
  tech_mechanical_tools_desc: "Mechanical tools are powered tools that use mechanical energy to perform tasks, increasing efficiency and precision in industrial and construction work."
  tech_steel_tools: "[IC - 1870] Steel Tools"
  tech_steel_tools_desc: "Steel tools are hand or machine tools made from steel, offering greater strength, durability, and precision compared to iron tools."
  tech_pneumatic_tools: "[IC - 1880] Pneumatic Tools"
  tech_pneumatic_tools_desc: "Pneumatic tools are powered by compressed air, providing high power and efficiency for various industrial and construction tasks."
  tech_heavy_power_tools: "[IC - 1885] Heavy Power Tools"
  tech_heavy_power_tools_desc: "Heavy power tools are large, powerful tools used in industrial and construction settings, typically powered by electricity or other energy sources, enabling the handling of heavy materials and tasks."
  tech_light_power_tools: "[IC - 1905] Light Power Tools"
  tech_light_power_tools_desc: "Light power tools are smaller, portable tools powered by electricity or other energy sources, designed for precision work and ease of use in various industrial and construction applications."
 #
 #construction
  tech_cast_iron_construction: "[IC - 1750] Cast-Iron Construction"
  tech_cast_iron_construction_desc: "Cast-iron construction involves the use of cast iron as a primary material for building structures, offering strength and durability, particularly in the 18th and 19th centuries."
  tech_polygonal_forts: "[IC - 1800] Polygonal Forts"
  tech_polygonal_forts_desc: "These Fortresses supersede older Star Forts which reached their ultimate form at the end of the 17th century under the designs of the Marquis de Vauban. Earlier fortresses relied on a single central fortification featuring pointed bastions and thick low walls. These strategic strong points subordinate their surroundings to focus on their defensive capabilities; satellite forts which protect the central fortification, which itself is behind a low-swept earthen glacis and deep ditch, into which project firing positions for artillery to provide anti-personnel fire, while above powerful anti-siege guns, protected in individual buried casemates, make hostile approach difficult."
  tech_tunneling_shield: "[IC - 1820] Tunneling Shield"
  tech_tunneling_shield_desc: "A tunneling shield is a protective structure used in the construction of tunnels, allowing workers to excavate safely while supporting the surrounding ground."
  tech_steam_shovel: "[IC - 1840] Steam Shovel"
  tech_steam_shovel_desc: "A steam shovel is a large mechanical excavator powered by steam, used for digging and moving large quantities of earth and other materials in construction projects."
  tech_hydraulic_crane: "[IC - 1850] Hydraulic Crane"
  tech_hydraulic_crane_desc: "A hydraulic crane is a lifting device that uses hydraulic power to lift and move heavy loads, commonly used in construction and industrial settings."
  tech_passenger_elevator: "[IC - 1860] Passenger Elevator"
  tech_passenger_elevator_desc: "A passenger elevator is a vertical transportation device designed to carry people between floors in a building, improving accessibility and convenience."
  tech_reinforced_concrete: "[IC - 1870] Reinforced Concrete"
  tech_reinforced_concrete_desc: "Reinforced concrete is a composite material consisting of concrete reinforced with steel bars or mesh, providing enhanced strength and durability for construction purposes."
  tech_steel_bridge: "[IC - 1875] Steel Bridge"
  tech_steel_bridge_desc: "A steel bridge is a bridge constructed primarily from steel, offering high strength, durability, and the ability to span long distances compared to traditional materials like wood or stone."
  tech_arc_welding: "[IC - 1880] Arc Welding"
  tech_arc_welding_desc: "Arc welding is a welding process that uses an electric arc to melt and join metals, providing strong and durable welds for construction and manufacturing."
  tech_steel_girder_construction: "[IC - 1885] Steel-Girder Construciton"
  tech_steel_girder_construction_desc: "Steel-girder construction involves the use of steel girders as the primary structural element in buildings and bridges, providing strength and stability for large spans."
  tech_fire_safety_measures: "[IC - 1890] Fire Safety Measures"
  tech_fire_safety_measures_desc: "Fire safety measures encompass various strategies, equipment, and building designs aimed at preventing, detecting, and responding to fires, ensuring the safety of occupants and property."
  tech_escalators: "[IC - 1895] Escalators"
  tech_escalators_desc: "Escalators are moving staircases used to transport people between different floors in buildings, enhancing convenience and accessibility."
  tech_steam_powered_construction_machinery: "[IC - 1900] Steam-Powered Construction Machinery"
  tech_steam_powered_construction_machinery_desc: "Steam-powered construction machinery refers to heavy equipment driven by steam engines, used for tasks such as excavation, lifting, and material handling in construction projects."
  tech_diesel_powered_contruction_machinery: "[IC - 1910] Diesel Powered Construction Machinery"
  tech_diesel_powered_contruction_machinery_desc: "Diesel-powered construction machinery includes heavy equipment powered by diesel engines, offering greater efficiency and power for various construction tasks."
  tech_diesel_shovel: "[IC - 1915] Diesel Shovel"
  tech_diesel_shovel_desc: "A diesel shovel is a large excavating machine powered by a diesel engine, used for digging and moving substantial amounts of earth and other materials in construction and mining operations."
 #
  tech_barrels: "[IC - 1500] Barrels"
  tech_barrels_desc: "Barrels are cylindrical containers traditionally made of wood, used for storing and transporting liquids and other goods."
  tech_cardboard_boxes: "[IC - 1820] Cardboard Boxes"
  tech_cardboard_boxes_desc: "Cardboard boxes are lightweight, foldable containers made from cardboard, commonly used for packaging and shipping goods."
  tech_paper_bag_machines: "[IC - 1840] Paper-Bag Machine"
  tech_paper_bag_machines_desc: "Paper-bag machines are devices used to manufacture paper bags, providing an efficient way to produce packaging for various products."
  tech_oil_pipelines: "[IC - 1860] Oil Pipeline"
  tech_oil_pipelines_desc: "Oil pipelines are infrastructure used to transport crude oil or refined petroleum products over long distances efficiently and safely."
  tech_branded_packaging: "[IC - 1865] Branded Packaging"
  tech_branded_packaging_desc: "Branded packaging refers to packaging that prominently displays a company's brand, enhancing product recognition and marketing."
  tech_corrugated_boxbard: "[IC - 1870] Corrugated Boxbard"
  tech_corrugated_boxbard_desc: "Corrugated boxboard is a material used to make strong, durable boxes for packaging and shipping, consisting of a fluted corrugated sheet sandwiched between two linerboards."
  tech_standardized_oil_barrel: "[IC - 1875] Standardized Oil Barrel"
  tech_standardized_oil_barrel_desc: "A standardized oil barrel is a uniform container used for storing and transporting oil, ensuring consistency in volume and handling."
  tech_carton: "[IC - 1880] Carton"
  tech_carton_desc: "A carton is a lightweight, foldable container made from paperboard, commonly used for packaging food and other consumer goods."
  tech_pre_cut_cardboard_boxes: "[IC - 1890] Pre-Cut Cardboard Boxes"
  tech_pre_cut_cardboard_boxes_desc: "Pre-cut cardboard boxes are cardboard boxes that are manufactured with pre-cut and pre-scored panels, allowing for easy assembly and efficient packaging."
  tech_steel_drum_barrel: "[IC - 1905] Steel Drum Barrel"
  tech_steel_drum_barrel_desc: "A steel drum barrel is a cylindrical container made of steel, used for storing and transporting liquids and bulk materials securely."
  tech_tructractor: "[IC - 1915] Tructractor"
  tech_tructractor_desc: "A tructractor is a type of vehicle designed for transporting goods, combining features of a truck and a tractor for versatile hauling capabilities."
  tech_welded_pipes: "[IC - 1920] Welded Pipes"
  tech_welded_pipes_desc: "Welded pipes are metal pipes manufactured by welding the edges of a metal sheet together, providing strong and durable piping for various applications."
  tech_forklifts: "[IC - 1925] Forklifts"
  tech_forklifts_desc: "Forklifts are industrial vehicles equipped with a lifting mechanism, used for moving and stacking heavy loads in warehouses and construction sites."
  tech_modern_packaging: "[IC - 1930] Modern Packaging"
  tech_modern_packaging_desc: "Modern packaging encompasses contemporary materials and techniques used to protect, preserve, and present products effectively."
  tech_saran_wrap: "[IC - 1940] Saran Wrap"
  tech_saran_wrap_desc: "Saran wrap is a thin, transparent plastic film used for sealing and preserving food, providing an airtight barrier to maintain freshness."
  tech_battery_powered_forklifts: "[IC - 1945] Battery-Powered Forklifts"
  tech_battery_powered_forklifts_desc: "Battery-powered forklifts are forklifts that operate using electric batteries, offering a cleaner and quieter alternative to traditional internal combustion engine forklifts."
  tech_fiberglass_pipes: "[IC - 1950] Fiberglass Pipes"
  tech_fiberglass_pipes_desc: "Fiberglass pipes are pipes made from reinforced fiberglass, offering corrosion resistance and lightweight properties for various industrial and construction applications."
  tech_aluminum_foil: "[IC - 1955] Aluminum Foil"
  tech_aluminum_foil_desc: "Aluminum foil is a thin sheet of aluminum used for packaging, insulation, and various household and industrial applications."
  tech_marine_pipelines: "[IC - 1960] Marine Pipelines"
  tech_marine_pipelines_desc: "Marine pipelines are pipelines designed for underwater use, facilitating the transport of oil, gas, and other fluids across bodies of water."
  tech_bubble_wrap: "[IC - 1965] Bubble Wrap"
  tech_bubble_wrap_desc: "Bubble wrap is a packaging material consisting of small air-filled bubbles, providing cushioning and protection for fragile items during shipping and handling."
  tech_assisted_pipelines: "[IC - 1970] Assisted Pipelines"
  tech_assisted_pipelines_desc: "Assisted pipelines refer to pipeline systems that utilize external assistance, such as pumps or compressors, to facilitate the transport of fluids over long distances."
  tech_universal_product_code: "[IC - 1975] Universal Product Code"
  tech_universal_product_code_desc: "The Universal Product Code (UPC) is a standardized barcode used for tracking and identifying products in retail and supply chain management."
  tech_tamper_proof_packaging: "[IC - 1980] Tamper-Proof Packaging"
  tech_tamper_proof_packaging_desc: "Tamper-proof packaging is designed to prevent unauthorized access or tampering with the contents, ensuring product integrity and consumer safety."
  tech_biodegradable_packaging: "[IC - 1985] Biodegradable Packaging"
  tech_biodegradable_packaging_desc: "Biodegradable packaging is made from materials that can decompose naturally, reducing environmental impact and promoting sustainability."
  tech_quick_response_code: "[IC - 1995] Quick Response Code"
  tech_quick_response_code_desc: "A Quick Response (QR) code is a type of matrix barcode that can be scanned using a smartphone or other device to quickly access information or websites."
