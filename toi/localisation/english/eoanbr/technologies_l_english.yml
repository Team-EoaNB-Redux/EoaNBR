   tech_uniform_equipment_0: "Medieval Armor"
   tech_uniform_equipment_0_desc: "An ingenious combination of metal plates, chainmail, and leather meticulously crafted to protect knights and warriors during the Middle Ages, offering both defense and status on the medieval battlefield."
   tech_uniform_equipment_1: "1700 Uniforms"
   tech_uniform_equipment_1_desc: "The standardized gear and accouterments provided to soldiers during the 19th century, reflecting the advancements in military logistics and the evolution of military attire during this era."
   tech_uniform_equipment_2: "1840 Uniforms"
   tech_uniform_equipment_2_desc: "A refined and standardized ensemble of military gear, clothing, and accessories tailored to meet the needs of 19th-century soldiers, embodying the military traditions and advancements of the time."
   tech_uniform_equipment_3: "1850 Uniforms"
   tech_uniform_equipment_3_desc: "An evolved and upgraded set of military attire, weaponry, and equipment designed to suit the requirements of mid-19th-century soldiers, showcasing the ongoing development in military technology and logistics."
   tech_uniform_equipment_4: "1864 Uniforms"
   tech_uniform_equipment_4_desc: "The state-of-the-art military gear and accouterments meticulously designed and issued to soldiers during the mid-1860s, reflecting the advancements in weaponry, tactics, and logistics during this pivotal era of warfare."
   tech_uniform_durable_cloth: "Durable Cloth"
   tech_uniform_durable_cloth_desc: ""
   tech_uniform_equipment_5: "1872 Uniforms"
   tech_uniform_equipment_5_desc: "The cutting-edge ensemble of military clothing, gear, and arms standardised and adopted in the year 1872, representing a period of technological and tactical advancements in armed forces across various nations."
   tech_uniform_equipment_6: "1878 Uniforms"
   tech_uniform_equipment_6_desc: "The modernized and refined military attire, weaponry, and gear introduced during the late 1870s, epitomizing the progress in military logistics and technology during this era of global conflict and innovation."
   tech_uniform_equipment_7: "1890 Uniforms"
   tech_uniform_equipment_7_desc: "The state-of-the-art military gear, uniforms, and weaponry issued to soldiers in the 1890s, embodying the latest advancements in technology, materials, and tactical considerations during this period of rapid military evolution."
   tech_uniform_equipment_8: "1897 Uniforms"
   tech_uniform_equipment_8_desc: "The cutting-edge military attire, gear, and arms meticulously designed and adopted in the year 1897, representing a significant leap forward in military technology and standardization during a time of geopolitical tensions and modernization."
   tech_uniform_equipment_9: "1905 Uniforms"
   tech_uniform_equipment_9_desc: "The advanced and standardized military clothing, gear, and weaponry introduced during the early 20th century, reflecting the influence of industrialization, modern warfare, and the changing nature of armed conflicts during this pivotal period."
   tech_uniform_equipment_10: "1915 Uniforms"
   tech_uniform_equipment_10_desc: "The updated and specialized military attire, gear, and arms introduced during the year 1915, showcasing the adaptations and innovations made to meet the challenges of trench warfare and the demands of World War I."
