 #textiles
  tech_spinning_mule: "[IC - 1750] Spinning Mules"
  tech_spinning_mule_desc: "Spinning mules are machines used to spin cotton and other fibers into yarn. They combine features of the spinning jenny and the water frame, allowing for the production of finer and stronger threads."
  tech_powered_loom: "[IC - 1820] Powered Loom"
  tech_powered_loom_desc: "A powered loom is a mechanized loom that automates the process of weaving fabric. It significantly increases production speed and reduces the manual labor required compared to traditional handlooms."
  tech_sewing_machine: "[IC - 1840] Sewing Machine"
  tech_sewing_machine_desc: "A sewing machine is a device used to stitch fabric and other materials together with thread. It revolutionized the textile industry by increasing the speed and consistency of garment production."
  tech_powered_sewing_machine: "[IC - 1860] Powered Sewing Machine"
  tech_powered_sewing_machine_desc: "A powered sewing machine is driven by an external power source, such as a steam engine or electric motor, allowing for faster and more efficient sewing compared to manual machines."
  tech_shoe_lasting_machine: "[IC - 1885] Shoe-Lasting Machine"
  tech_shoe_lasting_machine_desc: "A shoe-lasting machine is used in the manufacturing of shoes to shape and assemble the upper part of the shoe onto the sole. It improves production efficiency and consistency in shoe making."
  tech_electric_sewing_machine: "[IC - 1890] Electric Sewing Machine"
  tech_electric_sewing_machine_desc: "An electric sewing machine is powered by electricity, providing consistent speed and reducing manual effort. It became a standard tool in both industrial and domestic sewing."
  tech_automatic_power_loom: "[IC - 1895] Automatic Power Loom"
  tech_automatic_power_loom_desc: "An automatic power loom is a mechanized loom that can operate continuously with minimal human intervention, greatly increasing textile production efficiency."
  tech_rayon_fabric: "[IC - 1925] Rayon Fabric"
  tech_rayon_fabric_desc: "Rayon fabric is a semi-synthetic textile made from regenerated cellulose fibers. It offers a silk-like feel and is used in a variety of clothing and home textiles."
  tech_polyester_fabric: "[IC - 1955] Polyester Fabric"
  tech_polyester_fabric_desc: "Polyester fabric is a synthetic textile made from polymer fibers. It is durable, resistant to shrinking and stretching, and widely used in clothing and home furnishings."
  tech_non_woven_textiles: "[IC - 1960] Non-Woven Textiles"
  tech_non_woven_textiles_desc: "Non-woven textiles are fabrics made by bonding or felting fibers together, rather than weaving or knitting. They are used in a variety of applications, including medical supplies, filters, and disposable garments."
  tech_electrospinning: "[IC - 2005] Electrospinning"
  tech_electrospinning_desc: "Electrospinning is a process that uses an electric field to draw fine fibers from a liquid polymer solution, creating non-woven mats with nanoscale fibers. It is used in advanced textile and material applications."
  tech_3d_printed_textiles: "[IC - 2025] 3D-Printed Textiles"
  tech_3d_printed_textiles_desc: "3D-printed textiles are fabrics created using additive manufacturing techniques, allowing for complex designs and customized textile structures that are difficult to achieve with traditional methods."
  tech_smart_textiles: "[IC - 2045] Smart Textiles"
  tech_smart_textiles_desc: "Smart textiles are fabrics integrated with electronic components or responsive materials that can sense and react to environmental stimuli, offering advanced functionality such as temperature regulation or health monitoring."
