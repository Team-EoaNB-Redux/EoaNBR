 #unconvential oil
  tech_on_water_drilling: "[RE - 1930] On-water Drilling"
  tech_on_water_drilling_desc: "On-water drilling is a technique that allows for the extraction of oil and gas resources from bodies of water, such as lakes or shallow seas. This method involves the use of specialized drilling platforms and equipment to access underwater reservoirs."
  tech_offshore_oil_wells: "[RE - 1945] Offshore Oil Wells"
  tech_offshore_oil_wells_desc: "Offshore oil wells are drilling operations conducted in bodies of water, typically in oceans or seas, to access oil and gas reservoirs located beneath the seabed. This method requires specialized equipment and platforms to operate in challenging marine environments."
  tech_early_fracking: "[RE - 1950] Early Fracking"
  tech_early_fracking_desc: "Fracking, or hydraulic fracturing, is a technique used to extract oil and gas from underground rock formations by injecting high-pressure fluid to create fractures. Early fracking methods laid the groundwork for modern hydraulic fracturing techniques."
  tech_semi_submersible_platforms: "[RE - 1955] Semi-Submersible Platforms"
  tech_semi_submersible_platforms_desc: "Semi-submersible platforms are floating drilling rigs that are partially submerged in water, providing stability and support for offshore drilling operations. These platforms are designed to operate in deepwater environments and can be moved to different locations as needed."
  tech_jack_up_rig: "[RE - 1960] Jack-Up Rig"
  tech_jack_up_rig_desc: "Jack-up rigs are mobile offshore drilling platforms that can be raised or lowered using legs that extend to the seabed. This design allows for stable drilling operations in shallow to moderate water depths."
  tech_oil_spill_prevention: "[RE - 1985] Oil Spill Prevention"
  tech_oil_spill_prevention_desc: "Oil spill prevention technologies and practices are implemented to minimize the risk of oil spills during drilling and production operations, protecting the environment and ensuring compliance with regulations."
  tech_modern_fracking: "[RE - 1990] Modern Fracking"
  tech_modern_fracking_desc: "Modern fracking techniques utilize advanced technologies and methods to extract oil and gas from underground rock formations more efficiently and with reduced environmental impact."
  tech_liquid_natural_gas: "[RE - 1995] Liquid Natural Gas"
  tech_liquid_natural_gas_desc: "Liquid natural gas (LNG) is natural gas that has been cooled to a liquid state for storage and transportation. This process allows for the efficient transport of natural gas over long distances, particularly to areas without pipeline infrastructure."
  tech_shale_revolution: "[RE - 2010] Shale Revolution"
  tech_shale_revolution_desc: "Shale revolution refers to the significant increase in oil and gas production from shale formations due to advancements in hydraulic fracturing and horizontal drilling techniques. This revolution has transformed the energy landscape, particularly in the United States."
 #
 #Explosives
  tech_shaft_mining: "[RE - 1500] Shaft Mining"
  tech_shaft_mining_desc: "Shaft mining is a method of underground mining that involves the excavation of vertical or near-vertical tunnels to access mineral deposits. This technique allows for the extraction of valuable resources located deep beneath the surface."
  tech_mining_explosives: "[RE - 1700] Mining Explosives"
  tech_mining_explosives_desc: "Mining explosives are specialized explosive materials used in mining operations to break rock and access mineral deposits. These explosives are designed to provide controlled blasts that minimize damage to surrounding areas while maximizing resource extraction."
  tech_nitroglycerin_extraction: "[RE - 1840] Nitroglycerin Extraction"
  tech_nitroglycerin_extraction_desc: "Nitroglycerin extraction is the process of producing nitroglycerin, a highly explosive compound used in mining and construction. This technique involves the careful handling of chemicals to create a powerful explosive for controlled blasting operations."
  tech_dynamite_extraction: "[RE - 1865] Dynamite Extraction"
  tech_dynamite_extraction_desc: "Dynamite extraction is the process of producing dynamite, a widely used explosive in mining and construction. This technique involves the careful mixing of chemicals to create a stable and powerful explosive for controlled blasting operations."
  tech_tnt_extraction: "[RE - 1900] TNT Extraction"
  tech_tnt_extraction_desc: "TNT extraction is the process of producing trinitrotoluene, a powerful explosive used in mining and construction. This technique involves the careful handling of chemicals to create a stable and effective explosive for controlled blasting operations."
  tech_anfo_extraction: "[RE - 1955] ANFO Extraction"
  tech_anfo_extraction_desc: "ANFO extraction is the process of producing ammonium nitrate fuel oil, a widely used explosive in mining and construction. This technique involves the careful mixing of ammonium nitrate and fuel oil to create a stable and effective explosive for controlled blasting operations."
  tech_liquid_solvent_extraction: "[RE - 1960] Liquid Solvent Extraction"
  tech_liquid_solvent_extraction_desc: "Liquid solvent extraction is a process used to separate and purify metals from ores using a liquid solvent. This technique is commonly used in the mining industry to extract valuable metals such as copper, nickel, and uranium."
 #
 #Mining
  tech_prospecting: "[RE - 1700] Prospecting"
  tech_prospecting_desc: "Prospecting is the process of searching for mineral deposits in the earth's crust. This technique involves geological surveys, sampling, and analysis to identify areas with potential mineral resources."
  tech_steam_pump: "[RE - 1750] Steam Pump"
  tech_steam_pump_desc: "Steam pumps are mechanical devices that use steam power to pump water or other fluids. In mining, steam pumps were historically used to remove water from mine shafts and tunnels, allowing for deeper excavation."
  tech_mine_organization: "[RE - 1820] Mine Organization"
  tech_mine_organization_desc: "Mine organization refers to the systematic arrangement and management of mining operations, including the planning of mine layouts, workforce allocation, and resource extraction strategies. Effective mine organization improves efficiency and safety in mining activities."
  tech_diamond_core_drill: "[RE - 1860] Diamond Core Drilling"
  tech_diamond_core_drill_desc: "Diamond core drilling is a method of drilling that uses a diamond-tipped drill bit to extract cylindrical samples of rock or mineral deposits. This technique allows for precise analysis of subsurface materials and is commonly used in mineral exploration."
  tech_drilling_fluid: "[RE - 1865] Drilling Fluid"
  tech_drilling_fluid_desc: "Drilling fluid is a specialized liquid used in drilling operations to lubricate the drill bit, remove cuttings, and maintain wellbore stability. This technique is commonly used in the mining industry to facilitate efficient and safe drilling operations."
  tech_pneumatic_drill: "[RE - 1875] Pneumatic Drill"
  tech_pneumatic_drill_desc: "Pneumatic drills are mechanical devices that use compressed air to power the drilling mechanism. In mining, pneumatic drills are commonly used for rapid and efficient drilling operations in various geological conditions."
  tech_acetylene_gas_lighting: "[RE - 1890] Acetylene Gas Lighting"
  tech_acetylene_gas_lighting_desc: "Acetylene gas lighting is a method of illumination that uses acetylene gas as a fuel source. In mining, acetylene gas lighting was historically used to provide portable and reliable lighting in underground mines, improving visibility and safety for workers."
  tech_conveyor_belts: "[RE - 1895] Conveyor Belts"
  tech_conveyor_belts_desc: "Conveyor belts are mechanical systems used to transport materials, such as ore or coal, from one location to another. In mining, conveyor belts improve efficiency by automating the movement of extracted materials, reducing manual labor and increasing productivity."
  tech_hydraulic_excavators: "[RE - 1900] Hydraulic Excavators"
  tech_hydraulic_excavators_desc: "Hydraulic excavators are heavy construction equipment that use hydraulic systems to perform digging and material handling tasks. In mining, hydraulic excavators are used for efficient excavation of ore and other materials, improving productivity and reducing labor requirements."
  tech_underground_conveyor_belt: "[RE - 1905] Underground Conveyor Belts"
  tech_underground_conveyor_belt_desc: "Underground conveyor belts are mechanical systems used to transport materials, such as ore or coal, within underground mines. These conveyor belts improve efficiency by automating the movement of extracted materials, reducing manual labor and increasing productivity in confined mining environments."
  tech_non_selective_mining: "[RE - 1910] Selective Mining"
  tech_non_selective_mining_desc: "Selective mining is a method of extracting specific mineral deposits while minimizing the removal of surrounding waste material. This technique allows for more efficient resource extraction and reduces environmental impact."
  tech_bucket_wheel_excavators: "[RE - 1925] Bucket Wheel Excavators"
  tech_bucket_wheel_excavators_desc: "Bucket wheel excavators are large, continuous digging machines used in surface mining operations. They feature a rotating wheel with buckets that scoop up material, allowing for efficient excavation of large volumes of ore or overburden."
  tech_bulldozers: "[RE - 1930] Bulldozers"
  tech_bulldozers_desc: "Bulldozers are heavy construction equipment that use a large, flat blade to push and move soil, rock, and other materials. In mining, bulldozers are used for land clearing, excavation, and material handling tasks, improving efficiency and productivity."
  tech_electric_cap_light: "[RE - 1935] Electric Cap Light"
  tech_electric_cap_light_desc: "Electric cap lights are portable lighting devices worn on the head, typically used by miners to provide illumination in dark underground environments. These lights improve visibility and safety for workers in mining operations."
  tech_mine_mechanization: "[RE - 1945] Mine Mechanization"
  tech_mine_mechanization_desc: "Mine mechanization involves the use of mechanical equipment and technology to improve the efficiency and safety of mining operations. This includes the use of automated machinery, conveyor systems, and other advanced technologies to reduce manual labor and increase productivity."
  tech_methanometer: "[RE - 1950] Methanometer"
  tech_methanometer_desc: "A methanometer is an instrument used to measure the concentration of methane gas in the atmosphere or within enclosed spaces. In mining, methanometers are used to monitor methane levels in underground mines, helping to prevent explosions and ensure worker safety."
  tech_ultra_class_haul_trucks: "[RE - 1975] Ultra Class Trucks"
  tech_ultra_class_haul_trucks_desc: "Ultra class trucks are large, heavy-duty vehicles designed for transporting massive loads of materials in mining operations. These trucks have high payload capacities and are used in open-pit mining to move ore and waste efficiently."
  tech_gps_precision_guidance: "[RE - 2000] GPS Precision Guidance"
  tech_gps_precision_guidance_desc: "GPS precision guidance is a technology that uses global positioning system (GPS) data to provide accurate navigation and positioning for mining equipment. This technology improves efficiency, safety, and productivity in mining operations by enabling precise control of machinery and vehicles."
  tech_autonomous_trucks: "[RE - 2010] Autonomous Trucks"
  tech_autonomous_trucks_desc: "Autonomous trucks are self-operating vehicles that can navigate and transport materials in mining operations without direct human intervention. These trucks use advanced sensors and control systems to improve safety and productivity."
  tech_semi_autonomous_drilling_systems: "[RE - 2015] Semi-Autonomous Drilling Systems"
  tech_semi_autonomous_drilling_systems_desc: "Semi-autonomous drilling systems are advanced drilling technologies that combine automated control with human oversight to improve the efficiency and safety of drilling operations in mining."
  tech_robomap: "[RE - 2020] Robomap"
  tech_robomap_desc: "Robomap is a technology that uses robotics and mapping systems to create detailed, real-time maps of mining environments. This technology enhances situational awareness, improves safety, and supports efficient resource extraction."
  tech_mantle_extraction: "[RE - 2050] Mantle Extraction"
  tech_mantle_extraction_desc: "Mantle extraction is a theoretical concept involving the extraction of materials from the Earth's mantle, which lies beneath the crust. This process would require advanced drilling and material handling technologies to access and utilize resources from deep within the Earth."
 #coal_mining
  tech_coke: "[RE - 1700] Coke"
  tech_coke_desc: "Coke is a fuel derived from coal that is produced by heating coal in the absence of air. It is used in various industrial processes, including steel production, and provides a high-energy, low-impurity fuel source."
  tech_davy_lamp: "[RE - 1820] Davy Lamp"
  tech_davy_lamp_desc: "The Davy lamp is a safety lamp used in coal mines to detect the presence of flammable gases. It was invented by Sir Humphry Davy and helped prevent explosions in mining operations."
  tech_hopper_railway_carts: "[RE - 1840] Hopper Railway Carts"
  tech_hopper_railway_carts_desc: "Hopper railway carts are specialized vehicles used to transport materials such as coal or ore along railway tracks. They are designed with hoppers that can be opened to release the material at designated locations."
  tech_hydraulic_mining: "[RE - 1850] Hydraulic Mining"
  tech_hydraulic_mining_desc: "Hydraulic mining is a technique that uses high-pressure water jets to remove soil and rock from the earth. In coal mining, this method is used to extract coal from steep slopes or areas where traditional mining methods are not feasible."
  tech_coal_strip_mining: "[RE - 1865] Coal Strip Mining"
  tech_coal_strip_mining_desc: "Strip mining is a surface mining technique used to extract coal from near-surface deposits. This method involves removing the overburden (soil and rock) to access the coal seam. It is commonly used for coal seams that are relatively shallow and extensive."
  tech_wheel_cutters: "[RE - 1870] Wheel Cutter"
  tech_wheel_cutters_desc: "Wheel cutters are mechanical devices used in mining operations to cut through rock and coal. They are typically mounted on mining machines and use rotating wheels with cutting edges to break up material for extraction."
  tech_coal_cutting_machines: "[RE - 1890] Coal Cutting Machines"
  tech_coal_cutting_machines_desc: "Coal cutting machines are mechanical devices used in mining operations to cut and extract coal from seams. These machines improve efficiency and safety by automating the coal extraction process."
  tech_coal_loading_machines: "[RE - 1920] Coal Loading Machines"
  tech_coal_loading_machines_desc: "Coal loading machines are specialized equipment used to load coal from mining sites onto transport vehicles or conveyor systems. They improve efficiency and reduce manual labor in the coal handling process."
  tech_shuttle_carts: "[RE - 1940] Shuttle Carts"
  tech_shuttle_carts_desc: "Shuttle carts are mobile vehicles used to transport materials between different locations within a mining operation. They are designed for frequent trips and efficient material handling."
  tech_longwall_mining_machines: "[RE - 1945] Longwall Mining Machine"
  tech_longwall_mining_machines_desc: "Longwall mining machines are specialized equipment used in underground coal mining operations. They are designed to extract large sections of coal from a longwall face, improving efficiency and productivity in the mining process."
  tech_mountaintop_mining: "[RE - 1950] Mountaintop Mining"
  tech_mountaintop_mining_desc: "Mountaintop mining is a surface mining technique that involves removing the summit of a mountain to access underlying coal seams. This method allows for the extraction of coal from areas that are otherwise difficult to reach, but it has significant environmental impacts."
 #
 #logging
  tech_sawmill: "[RE - 1500] Sawmill"
  tech_sawmill_desc: "Sawmills are facilities where logs are cut into lumber and other wood products. They play a crucial role in the timber industry, providing processed wood for construction, furniture, and various other applications."
  tech_river_powered_sawmill: "[RE - 1700] River-Powered Sawmill"
  tech_river_powered_sawmill_desc: "River-powered sawmills utilize the energy of flowing water to power the machinery used for cutting logs into lumber. This method was commonly used in areas with access to rivers and streams, providing a renewable energy source for sawmill operations."
  tech_wind_powered_sawmill: "[RE - 1750] Wind-Powered Sawmill"
  tech_wind_powered_sawmill_desc: "Wind-powered sawmills utilize the energy of wind to power the machinery used for cutting logs into lumber. This method was commonly used in areas with consistent wind patterns, providing a renewable energy source for sawmill operations."
  tech_circular_saw: "[RE - 1800] Circular Saw"
  tech_circular_saw_desc: "Circular saws are mechanical devices used to cut wood and other materials. They are typically mounted on sawmills and used for cutting logs into lumber. Circular saws provide efficient and precise cutting capabilities, improving productivity in woodworking operations."
  tech_insertable_saw_tooth: "[RE - 1820] Insertable Saw-Tooth"
  tech_insertable_saw_tooth_desc: "Insertable saw-tooth technology involves the use of replaceable cutting teeth on saw blades. This allows for easy maintenance and replacement of worn or damaged teeth, improving the efficiency and longevity of saw blades used in woodworking and lumber processing."
  tech_muley_saw: "[RE - 1840] Muley Saw"
  tech_muley_saw_desc: "Muley saws are a type of sawmill machinery that uses a reciprocating motion to cut logs into lumber. This technology was commonly used in the 19th century and provided an efficient method for processing timber."
  tech_steam_powered_sawmill: "[RE - 1860] Steam-Powered Sawmill"
  tech_steam_powered_sawmill_desc: "Steam-powered sawmills utilize the energy of steam to power the machinery used for cutting logs into lumber. This method was commonly used in the 19th century and provided a reliable source of power for sawmill operations."
  tech_steel_rail_logging_roads: "[RE - 1875] Steel Rail Logging Roads"
  tech_steel_rail_logging_roads_desc: "Steel rail logging roads are specialized transportation infrastructure used to move logs and other timber products from harvesting sites to processing facilities. They provide a durable and efficient means of transportation in forested areas."
  tech_donkey_engine: "[RE - 1880] Donkey Engine"
  tech_donkey_engine_desc: "Donkey engines are steam-powered winches used in logging operations to haul logs from the forest to processing areas. They were commonly used in the 19th and early 20th centuries, providing a mechanical means of moving heavy timber."
  tech_power_loaders: "[RE - 1885] Power Loaders"
  tech_power_loaders_desc: "Power loaders are机动车辆 used in logging operations to load and transport logs. They provide a more efficient and versatile means of handling timber compared to traditional methods."
  tech_steam_feed: "[RE - 1890] Steam Feed"
  tech_steam_feed_desc: "Steam feed systems are used to supply steam to various pieces of equipment in logging operations. They ensure a consistent and reliable source of power for steam-powered machinery."
  tech_bandsaw_popularization: "[RE - 1895] Bandsaw Popularization"
  tech_bandsaw_popularization_desc: "Bandsaw popularization refers to the widespread adoption and use of bandsaws in woodworking and lumber processing. Bandsaws provide efficient and precise cutting capabilities, improving productivity in sawmill operations."
  tech_diesel_powered_sawmill: "[RE - 1900] Diesel-Powered Sawmill"
  tech_diesel_powered_sawmill_desc: "Diesel-powered sawmills utilize diesel engines to power the machinery used for cutting logs into lumber. This method provides a reliable and efficient source of power for sawmill operations, particularly in areas without access to electricity or other energy sources."
  tech_bucksaw: "[RE - 1920] Bucksaw"
  tech_bucksaw_desc: "Bucksaws are manual cutting tools used in logging operations to fell trees and process timber. They provide a simple and effective means of handling wood products."
  tech_electrical_saws: "[RE - 1925] Electrical Saws"
  tech_electrical_saws_desc: "Electrical saws are powered by electricity and used for cutting wood and other materials. They provide a convenient and efficient alternative to traditional hand-powered saws."
  tech_chainsaw: "[RE - 1930] Chainsaw"
  tech_chainsaw_desc: "Chainsaws are portable power tools equipped with a rotating chain for cutting wood. They are widely used in forestry and construction for their versatility and efficiency."
  tech_hydraulic_shears: "[RE - 1940] Hydraulic Shears"
  tech_hydraulic_shears_desc: "Hydraulic shears are powerful cutting tools used in various industries for shearing metal and other materials. They provide a high level of precision and efficiency in cutting operations."
  tech_forwarders: "[RE - 1955] Forwarders"
  tech_forwarders_desc: "Forwarders are specialized vehicles used in logging operations to transport logs from the forest to processing areas. They provide a more efficient and cost-effective means of handling timber compared to traditional methods."
  tech_forestry_harvesters: "[RE - 1975] Forestry Harvesters"
  tech_forestry_harvesters_desc: "Forestry harvesters are advanced machines used in logging operations to fell trees and process timber. They provide a high level of automation and efficiency in forestry operations."
  tech_precision_forestry: "[RE - 1980] Precision Forestry"
  tech_precision_forestry_desc: "Precision forestry involves the use of advanced technologies and techniques to optimize forest management and harvesting operations. It focuses on improving efficiency, sustainability, and productivity in forestry practices."
