 #machinery
  tech_guilds: "[IC - 1500] Guilds"
  tech_guilds_desc: "Guilds were associations of artisans and merchants who controlled the practice of their craft in a particular town. They played a significant role in the economic and social life of medieval and early modern Europe."
  tech_artisanship: "[IC - 1500] Artisanship"
  tech_artisanship_desc: "Artisanship refers to the skill and craftsmanship of artisans in creating high-quality goods. It was a key aspect of pre-industrial production and contributed to the development of specialized trades and guilds."
  tech_machinery: "[IC - 1700] Machinery"
  tech_machinery_desc: "Machinery refers to mechanical devices and equipment used to perform tasks more efficiently than manual labor. The development of machinery was a key driver of the industrial revolution, enabling mass production and mechanized manufacturing."
  tech_lathe: "[IC - 1750] Lathe"
  tech_lathe_desc: "A lathe is a machine tool used to shape metal, wood, or other materials by rotating the workpiece against a cutting tool. Lathes are fundamental in manufacturing and precision engineering."
  tech_interchangeable_parts: "[IC - 1800] Interchangeable Parts"
  tech_interchangeable_parts_desc: "Interchangeable parts are components made to such precise standards that they can be easily replaced with identical parts. This concept revolutionized manufacturing by enabling mass production and easier repair of machinery."
  tech_ball_bearings: "[IC - 1820] Ball Bearings"
  tech_ball_bearings_desc: "Ball bearings are mechanical components that reduce friction between moving parts by using spherical balls to maintain separation. They are essential in machinery for smooth and efficient operation."
  tech_steam_hammer: "[IC - 1840] Steam Hammer"
  tech_steam_hammer_desc: "A steam hammer is a large industrial hammer powered by steam, used for forging and shaping metal. It allows for precise and powerful blows, improving efficiency in metalworking."
  tech_hydraulics: "[IC - 1850] Hydraulics"
  tech_hydraulics_desc: "Hydraulics involves the use of fluid pressure to perform work, such as lifting, pressing, or moving heavy objects. Hydraulic systems are widely used in machinery and industrial applications."
  tech_precision_machining: "[IC - 1860] Precision Machining"
  tech_precision_machining_desc: "Precision machining refers to the process of manufacturing components with extremely tight tolerances and high accuracy. It is crucial for producing reliable and high-performance machinery."
  tech_radial_ball_bearings: "[IC - 1865] Radial Ball Bearings"
  tech_radial_ball_bearings_desc: "Radial ball bearings are a type of bearing designed to support radial loads while reducing friction. They are commonly used in rotating machinery for smooth and efficient operation."
  tech_machinery_specialization: "[IC - 1870] Machinery Specialization"
  tech_machinery_specialization_desc: "Machinery specialization involves the development of machines designed for specific tasks or industries, improving efficiency and productivity in manufacturing processes."
  tech_pneumatics: "[IC - 1875] Pneumatics"
  tech_pneumatics_desc: "Pneumatics is the use of compressed air to perform mechanical work, such as powering tools or actuating machinery. Pneumatic systems are widely used in industrial automation and manufacturing."
  tech_electronic_machinery: "[IC - 1890] Electronic Machinery"
  tech_electronic_machinery_desc: "Electronic machinery incorporates electronic components and systems to enhance the functionality, control, and efficiency of mechanical devices. It represents a significant advancement in industrial automation and precision engineering."
  tech_diesel_machinery: "[IC - 1905] Diesel Machinery"
  tech_diesel_machinery_desc: "Diesel machinery uses diesel engines to power industrial equipment and vehicles. Diesel engines provide high torque and fuel efficiency, making them suitable for heavy-duty applications."
  tech_self_aligning_ball_bearings: "[IC - 1910] Self-Aligning Ball Bearings"
  tech_self_aligning_ball_bearings_desc: "Self-aligning ball bearings are designed to accommodate misalignment between the shaft and the housing. They reduce friction and wear in rotating machinery, ensuring smooth and reliable operation."
