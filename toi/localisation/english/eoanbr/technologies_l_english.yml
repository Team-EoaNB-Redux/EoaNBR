#Industry
 industry_folder: "(IC) Industry & Construction"
 industry_folder_desc: "The foundations of modern infrastructure and manufacturing, delving into the latest innovations, practices, and advancements shaping the industrial and construction sectors."
 industry_folder_title: "INDUSTRY & CONSTRUCTION"
 #engines
  tech_windmills: "[IC - 1500] Windmills"
  tech_windmills_desc: "Windmills harness the power of the wind to perform mechanical tasks such as grinding grain or pumping water. They represent an early form of renewable energy technology."
  tech_atmospheric_steam_engine: "[IC - 1700] Atmospheric Steam Engine"
  tech_atmospheric_steam_engine_desc: "Atmospheric steam engines are early types of steam engines that operate using the pressure difference between atmospheric pressure and a vacuum created by condensing steam. They were widely used in the 18th and early 19th centuries for various industrial applications."
  tech_condensing_steam_engine: "[IC - 1750] Condensing Steam Engine"
  tech_condensing_steam_engine_desc: "Condensing steam engines improve efficiency by condensing exhaust steam back into water, creating a vacuum that enhances the engine's power output. They were a significant advancement in steam engine technology during the 18th century."
  tech_high_pressure_steam_engine: "[IC - 1800] High-Pressure Steam Engine"
  tech_high_pressure_steam_engine_desc: "High-pressure steam engines operate at higher steam pressures than earlier designs, providing greater power and efficiency. They played a crucial role in the industrial revolution and the development of modern machinery."
  tech_corliss_steam_engine: "[IC - 1840] Corliss Steam Engine"
  tech_corliss_steam_engine_desc: "The Corliss steam engine features a unique valve design that improves efficiency and control over steam flow. It was widely adopted in the 19th century for industrial applications requiring reliable and powerful engines."
  tech_high_speed_steam_engine: "[IC - 1860] High-Speed Steam Engine"
  tech_high_speed_steam_engine_desc: "High-speed steam engines are designed to operate at higher rotational speeds than traditional steam engines, providing increased power output and efficiency for various industrial applications."
  tech_compound_steam_engine: "[IC - 1865] Compound Steam Engine"
  tech_compound_steam_engine_desc: "Compound steam engines use multiple cylinders to expand steam in stages, improving efficiency and power output compared to single-cylinder engines. They were widely used in the late 19th century for industrial and marine applications."
  tech_triple_expansion_steam_engine: "[IC - 1870] Triple-Expansion Steam Engine"
  tech_triple_expansion_steam_engine_desc: "Triple-expansion steam engines expand steam in three stages across multiple cylinders, further enhancing efficiency and power output. They became a standard in marine propulsion and heavy industry during the late 19th and early 20th centuries."
  tech_gasoline_engine: "[IC - 1880] Gasoline Engine"
  tech_gasoline_engine_desc: "Gasoline engines are internal combustion engines that use gasoline as fuel. They became widely adopted in automobiles and small machinery due to their relatively high power-to-weight ratio and ease of use."
  tech_steam_turbine: "[IC - 1885] Steam Turbine"
  tech_steam_turbine_desc: "Steam turbines convert steam energy into mechanical work through the rotation of blades attached to a shaft. They are highly efficient and widely used in power generation and marine propulsion."
  tech_diesel_engine: "[IC - 1900] Diesel Engine"
  tech_diesel_engine_desc: "Diesel engines are internal combustion engines that use compression ignition to burn diesel fuel. They are known for their fuel efficiency and durability, making them suitable for heavy machinery, trucks, and ships."
  tech_uniflow_steam_engine: "[IC - 1905] Uniflow Steam Engine"
  tech_uniflow_steam_engine_desc: "Uniflow steam engines improve efficiency by allowing steam to flow in a single direction through the cylinder, reducing condensation losses. They were used in various industrial and marine applications in the early 20th century."
  tech_v8_engine: "[IC - 1910] V8 Engine"
  tech_v8_engine_desc: "V8 engines feature eight cylinders arranged in a V configuration, providing a balance of power and smooth operation. They became popular in high-performance automobiles and luxury vehicles."
  tech_direct_fuel_injection: "[IC - 1920] Direct Fuel Injection"
  tech_direct_fuel_injection_desc: "Direct fuel injection systems deliver fuel directly into the combustion chamber, improving engine efficiency, power output, and emissions control compared to traditional fuel injection methods."
