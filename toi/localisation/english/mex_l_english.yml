 mexico_politics.37.t: "Seeking Recognition"
 mexico_politics.37.d: "Even as battle lines move back and forth, our foreign ministry must wage its own war on the field of international recognition, and on that front we are not winning. The great power of Spain has made no secret of its support for the Reactionaries. Britain and France are also supportive of the Tacubaya Regime, though its possible we could gain the support of one of them if the Reactionaries do anything to displease them. But if want recognition now, our best chance is to approach the Americans to the North. A fellow Secular Republic based on Liberal Federalist ideals. Although they invaded us under Santa Anna, and claimed the northern third of our nation, they adappose new European incursions on this continent, and might be able to dissuade, if not simply balance, the european interests backing the Reactionaries."
 mexico_politics.37.a: "Hail Columbia?"
 mexico_politics.38.t: "Juarez Administration Seeks Recognition"
 mexico_politics.38.d: "Amidst the Mexican's Civil War, the Liberal Juarez Administration have reached out through our agents in Vera Cruz asking us to recognize them as the legitimate Mexican Government. They tell us how the Reactionary Party is already gaining recognition form the European powers, and how this will undoubtedly be the vehicle through which the Europeans regain influence in the South. Furthermore our agents believe that we can use recognition of the Juarez party as a way to start negotiations for further cessions of Mexican territory to the US!"
 mexico_politics.38.a: "Recognize Juarez!"
 mexico_politics.38.b: "Theyre Demanding a Lot Without a Capital"
 mexico_politics.39.t: "US Recognizes Juarez Government!"
 mexico_politics.39.d1: "Today we publicly received the American Ambassador Mclane as their Ambassador to the one and only Mexican Government. Through this recognition we will certainly find ourselves in a better negotiating position, with foreign powers, money lenders, and more. We must now decide whether we should pursue the negotiations McLane and Foreign Minister Melchor Ocampo have been working on to build stronger ties with the Americans to our mutual benefit. If we choose to, we should be cautious, as we are definitely in the weaker negotiating position."
 mexico_politics.39.d2: "Those cursed Americans have recognized the Juaristas as the legitimate government of Mexico! We must seek more foreign assistance if we hope to balance out the assistance the Americans are undoubtedly preparing for the Liberales."
 mexico_politics.39.a: "Open Further Negotiations"
 mexico_politics.39.b: "Damn The Interventionist Americans!"
 mexico_politics.39.c: "Recognition Is All We Needed"
 mexico_politics.40.t: "End of Negotiations"
 mexico_politics.40.d1: "The US has refused to recognize the Juarez Administration! It appears the US wishes to retain a semblance of political ambiguity regarding the Reform War for a little longer."
 mexico_politics.40.d2: "It appears that the Juarez Administration have been satiated with recognition as they have ended their negotiations for anything further. They might be seeking a policy based purely on some sort of sublime indifference? Time will tell if this policy was correct."
 mexico_politics.40.d3: "It seems we have offended the Americans by rejecting the further cession of sacred Mexican territory? Their ambassador Mclane has informed the foreign ministry that if we will not cede Lower California, then they do not want to discuss much else with us. A pity, we could have used the money."
 mexico_politics.40.a: "So Much For Diplomacy"
 mexico_politics.41.t: "1st Draft"
 mexico_politics.41.d: "We should be upfront in what we want from the Americans, namely military assistance. In talks with Ambassador Mclane, one of the primary demands they seek is transit and extraterritorial rights across our northern frontier to the Gulf of Baja, and across the Isthmus of Tehuantepec, the narrowest point of our nation between the Atlantic and Pacific Oceans. We can trade one for the other, after all transit rights will hardly cost us anything and we stand to gain premier access to American Military Resources."
 mexico_politics.41.a: "Think of The Advantages!"
 mexico_politics.42.t: "Mexico Proposes Military Assistance Treaty"
 mexico_politics.42.d: "The Juarist Administration's Foreign Minister Ocampo has been negotiating with our Ambassador Mclane, and it appears the Mexicans also want to negotiate a treaty of some sort with us. According to our man, it would be a treaty of Military Assistance, obviously designed to benefit the Liberal government in their civil war with the Reactionaries. In return we would gain transit rights across their nation, allowing us to more quickly move troops and commerce from the East to the West Coast, instead of sailing as far south as the Panamanian Isthmus. However it has long been the policy of this Administration to strive for the territorial expansion of this nation. What the Mexcians call Lower California, and we call Baja, is almost entirely detached from their nation, and has far more in common with our State of California. Even more conveniently, it is sparsely inhabited, and under the new Mexican Constitution, is not yet counted as a State, but merely a territory. We should offer to buy Baja for a moderate amount of money, which the Liberals are desperately short on, instead."
 mexico_politics.42.a: "To Our Future Allies!"
 mexico_politics.42.b: "We Want Baja!"
 mexico_politics.43.t: "US Agrees to Military Assistance Treaty!"
 mexico_politics.43.d: "President Buchanan has accepted the proposed Military Assistance Treaty! It seems the American President fully agreed with our reasoning and has agreed to the treaty as drafted. It goes now to the American Congress for ratification, which might be the only difficult obstacle, as Buchanan is having some issues controlling the American Congress. For our own end its doubtful we will face any serious resistance in our Legislature."
 mexico_politics.43.a: "We Welcome our New Allies"
 mexico_politics.44.t: "US Proposes Counter-Offer"
 mexico_politics.44.d: "The American Government has responded to our offer with one of their own. They are willing to offer us a large lump sum of money, but in return they want to use that money to purchase the entire peninsula of Lower California. It seems the Americans want to continue doing to us what they did to Santa Anna!\n\nThis offer if we take it will undoubtedly cost us domestic support, even if it helps us win the war the people's trust is us will forever be shattered.\n\nOn the Other hand we can try meeting them in the middle, if they still agree to pay us for the privilege, we can still agree to give them transit rights across the North and the Tehuantepec Isthmus as well as a degree of extraterritoriality. It is likely this will still be unpopular domestically but to a lesser degree and we will not be giving up much in return for the much needed cash."
 mexico_politics.44.a: "In The Name of The Liberal Cause"
 mexico_politics.44.b: "There Must Be A Better Agreement"
 mexico_politics.45.t: "Mexico Will Cede Baja!"
 mexico_politics.45.d: "Mexico Agrees To The Baja Cession! We received word only moments ago, but already the word is spreading but the newest possible addition to the Nation! The treaty now goes to congress, where its likely to face fierce opposition in the Senate. Not just from Republican senators who do not want to acquire any more southern territory that could be influenced by settlers from the southern territories and Texas who might want to extend slavery, but from moderate Democrats as well who still oppose the All-Of-Mexico movement 10 years later."
 mexico_politics.45.a: "More America Is More Good, Right?"
 mexico_politics.46.t: "Mexico Refuses to Cede Baja"
 mexico_politics.46.d: "In reply to our demand for Baja, Minister Ocampo made the following offer: 'first, the perpetual right of transit with its police security across Tehuantepec; second ports of deposit on the east and west coasts of the Isthmus; third, a perpetual right of transit across northern Mexico, from Camargo to Mazatlan and from Nogales to Guaymas. The cession of Lower California, however, was not allowed'. For these rights Mexico asks that we pay them a relatively small amount of money in support of their war effort. Frankly if we push the issue then the Juarez Administration may just walk away. We can take solace in the fact that even this would still accomplish some of our goals."
 mexico_politics.46.a: "Diplomacy Is Finding The Middle Ground I Guess"
 mexico_politics.46.b: "Their Refusal To Negotiate Will Cost Them!"
 mexico_politics.47.t: "US President Accepts Treaty of Transit and Commerce!"
 mexico_politics.47.d: "Well the Americans have finally agreed to our agreement as negotiated by Foreign Minister Ocampo. They will accept transit rights and extraterritoriality in return for a modest payment to our war chest. President Buchanan has communicated the draft treaty to their Senate, while it is already being voted on in our Congress."
 mexico_politics.47.a: "For Mexico We Must"
