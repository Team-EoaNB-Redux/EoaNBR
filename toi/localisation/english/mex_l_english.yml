 #Mexico Debt
 mexico_debt.2.t: "The Woes of Debt"
 mexico_debt.2.d: "After independence from Spain and the following civil wars after it, we are now indebted to France, Great Britain, and Spain as they have given us loans to fight these wars.\n\nIf we declare bankruptcy, we will be unable to continue our debt repayments to European nations. We will be forced to figure out a way to maintain our payments to France, Great Britain, and Spain or suffer the consequences."
 mexico_debt.2.a: "Better get on those debt payments!"
 mexico_debt.2.b: "El presidente is not scared of debt, debt is only a number."
 
 SPR_mexican_reform_war_purchase_usa_support: "Expand USA Support Loan"
 
 #Mexico Politics
 mexico_politics.1.t: "The Ocampo Law"
 mexico_politics.1.d: "This Law included births, adoption and arrogance of persons, marriages, religious vows and deaths; it established the bases for the issuance of the corresponding records that should be in charge of an official of the civil status. These measures restrict the traditional power of the church in our territory."
 mexico_politics.1.a: "The church will now have much less control over people's lives."
 
 mexico_politics.2.t: "The Liberal Constitution"
 mexico_politics.2.d: "The constitution established individual guarantees for Mexican citizens, freedom of expression, freedom of assembly, freedom to bear arms. He reaffirmed the abolition of slavery, eliminated the prison for civil debts, the forms of punishment for torture including the death penalty, the alcabalas and internal customs."
 mexico_politics.2.a: "Viva Mexico!"
 
 mexico_politics.3.t: "The Church Laws"
 mexico_politics.3.d: "The Churches Law regulates the collection of parochial fees, preventing those who do not earn more than is necessary to live from being required, and imposes punishments on members of the clergy who do not follow it."
 mexico_politics.3.a: "Render unto Caesar what is Caesar's. The Church is not the government."
 
 mexico_politics.4.t: "The Invitation of Political Parties"
 mexico_politics.4.d: "The recent changes in the country's policy towards a modern and liberal state are causing much instability and the most conservative figures are beginning to feel alien to the democratic system. We must provide some places in the government to conservative politicians in order to include them in the system but without losing our dominance."
 mexico_politics.4.a: "We want all to feel apart of the process!"
 
 mexico_politics.5.t: "Ignacio Comonfort Pardons Benito Juárez!"
 mexico_politics.5.d: "After president Ignacio Comonfort declared his extraordinary powers, he pardoned jailed political figures of the liberal movement. This consequently freed Benito Juárez, a great military leader, who will tacticly put down these insurgents and end this Tacubaya plan!"
 mexico_politics.5.a: "Now is the time to strike!"
 
 mexico_politics.6.t: "Felix Maria Zuloaga's Presidential Coup!"
 mexico_politics.6.d: "Presidente Ignacio Comonfort has done the unthinkable! He has pardoned jailed political figures of the liberal movement! This consequently freed Benito Juárez, a great military leader, who poses a huge threat to the coup's success.\n\nMany supporters of the Tacubaya Plan have begun to worry what else he might do in the name of keeping the republic together. Felix Maria Zuloaga has decided the time of pragmatism is over, and declared an ultimatum to el presidente that he must resign immediately."
 mexico_politics.6.a: "Ignacio Comonfort has betrayed the pragmatic plan. There is only war now."
 
 mexico_politics.7.t: "Felix Maria Zuloaga's Presidential Coup!"
 mexico_politics.7.d: "After presidente Ignacio Comonfort freed Benito Juárez from jail, Felix Maria Zuloaga has decided the time of pragmatism is over, and declared an ultimatum to el presidente that he must resign immediately."
 mexico_politics.7.a: "Ignacio Comonfort has failed a peaceful outcome. Benito Juárez will end this swiftly."

 mexico_politics.10.t: "Resistance in [FROM.GetName]!"
 mexico_politics.10.d: "The church has encouraged citizens to join the conservative resistance, which has become a major problem in [FROM.GetName]. Once the resistance has been quelled, the conservative core within that state may be removed."
 mexico_politics.10.e: ""
 mexico_politics.10.a: "The conservatives in [FROM.GetName] wont resist for long!"
 mexico_politics.10.b: "The liberals in [FROM.GetName] wont resist for long!"
 mexico_politics.20.t: "Emissary to Il Papa"
 mexico_politics.20.d: "Our Emissary, José Trinidad Ezequiel Montes Ledesma, to The Pope in Rome, Pius IX, has essentially failed in his mission. Ledesma sought for church restraint as Mexico, a soveriegn nation, sought to handle its own domestic affairs without interference from foreign organizations, including allowing the freedom of religion. However the Holy See would not budge unless the law banning active clergy members of the catholic church from holding political office was rescinded. Our plenipotentiary saw this as the encroachment on our sovereignty it really was and rejected it.\n\nThe only bright side to this was that we demonstrated to the catholic nations of the world that the Republic of Mexico is not beyond reason and is willing to negotiate when it does not interfer with our Independence."
 mexico_politics.20.a: "Another Betrayal By The Church"
 mexico_politics.21.t: "1857 Congressional Elections"
 mexico_politics.21.d: "Amidst the National Turmoil, we have conducted the first congressional elections under our new Constitution. The election has returned a strong Liberal majority, confirming the popularity of our new reforms, and providing the political will to enforce and protect them. Next for congress to do is confirm the winner of the Presidential Election, deal with the unrest in the several states, and continue the policy of economic development and secularization."
 mexico_politics.21.a: "Viva La Constitucion"
 mexico_politics.22.t: "Dealing With Viadurri"
 mexico_politics.22.d: "One of the most frustrating thorns in the side of the Liberal government for years now is Governor José Santiago Vidaurri Valdez. Dominating northern Mexico, Viadurri seems himself more in association with Mexico than part of it. Because of this mindset he is aggravated by the central government's weak attempts to raise revenue by taxing trade through his land borders with the United States, and refuses to turn over revenues generated from said taxation. With Congress now seated, the government has a more organized and stronger bagaining position. We can attempt to reach a settlement with Viadurri, where give several concessions but remain amicable with him. Or we can use the bludgeon, and compel the release of those funds. This will definitely escalate tensions in the north though."
 mexico_politics.22.a: "We Can Be Reasonable"
 MEX_negotiate_with_viadurri_tt: "§GWe Will Negotiate a Settlement With Viadurri§!"
 mexico_politics.22.b: "He Won't Be Reasonable"
 MEX_confront_viadurri_tt: "§RWe Will Compel Viadurri, This Will Have Consequences§!"
 mexico_politics.23.t: "Request For Emergency Powers"
 mexico_politics.23.d: "As Soon as the new Congress was seated, President Comonfort requested emergency powers to suppress the ongoing revolts in several states. In response Congress turned him down. However they have passed a decree suspending certain rights and empowering the state governors with emergency powers in a smaller fashion of addressing the civil disturbances erupting across the nation."
 mexico_politics.23.a: "Better Than Nothing?"
 mexico_politics.24.t: "National Insurrection"
 mexico_politics.24.d: "Riots and Rebellion are breaking out across the Nation! Even as we try to hold on to some semblance of order, in the countryside bands of Conservative rebels are organizing, gathering arms, and plotting. This crisis is getting out of hand and we have to start considering extreme measures to address it."
 mexico_politics.24.a: "We Must Defend The Constitution"
 mexico_politics.30.t: "Partisanship Divides Mexico"
 mexico_politics.30.d: "Liberals and Conservatives are drawing partisan lines across our nation, we must dissolve these tensions!"
 mexico_politics.30.a: "The Crisis Escalates"
 mexico_politics.31.t: "Partisanship Divides Mexico"
 mexico_politics.31.d: "Liberals and Conservatives are drawing partisan lines across our nation, we must dissolve these tensions!"
