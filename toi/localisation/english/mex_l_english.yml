 mexico_politics.48.d: ""
 mexico_politics.48.a: ""
 mexico_politics.49.t: "Congress Ratifies Mclane-Ocampo Treaty!"
 mexico_politics.49.d: "Today the US Senate ratified the McLane-Ocampo Treaty, establishing a Treaty of Military Assistance between the American Government and that of the Mexican Government led by President Juarez. In addition to a mutual agreement of Military Assistance, the US will gain transit rights across Mexico and a certain degree of extraterritoriality."
 mexico_politics.49.a: "America and Juarez Grow Closer"
 mexico_politics.50.t: "Congress Ratifies Mclane-Ocampo Treaty!"
 mexico_politics.50.d: "Today the US Senate ratified the McLane-Ocampo Treaty, establishing the Mexican Cession of Lower (Baja) California in return for a moderately large payment by the US to the Mexican war effort. In addition to the cession the US would gain transit and extraterritorial rights across several routes in Mexico."
 mexico_politics.50.a: "America and Juarez Grow Closer"
 mexico_politics.51.t: "Congress Ratifies Mclane-Ocampo Treaty!"
 mexico_politics.51.d: "Today the US Senate ratified the McLane-Ocampo Treaty, establishing a Treaty of Commerce and Transit between the American Government and that of the Mexican Government led by President Juarez. In return for a modest payment to the Mexican war effort, the US will gain transit rights across Mexico and a certain degree of extraterritoriality"
 mexico_politics.51.a: "America and Juarez Grow Closer"
 mexico_politics.52.t: "Congress Rejects McLane-Ocampo Treaty"
 mexico_politics.52.d: "Unsurprisingly the the US Senate today rejected the draft treaty between the US and the Juarez Administration. The deciding factor came from the American Republican party who rejected entangling the US with internal Mexican matters. It seems likely that the efforts of Juarez to grow closer to the potential ally of the United States will yield nothing that might assist them in the current war. Due to the debacle and damage this has done to the Juarez administration there are rumors that Foreign Minister Ocampo will resign."
 mexico_politics.52.a: "So Much For Cooperation Between Juarez and Buchanan"
 
 
 #Mexico Civil War
 mexico_civil_war.1.t: "The Tacubaya Plan!"
 mexico_civil_war.1.d: "Today Félix María Zuloaga and other conservative generals have made a statement at the Archbishop's Palace in Tacubaya.\n\nConsidering that the majority of the people were not satisfied with the Constitution; that the country must be governed by laws in accordance with its uses and customs; as of this date the Constitution ceases to govern; President Comonfort retains that character, but with all-encompassing powers After three months, the President himself will call a constituent Congress to draw up a new code that will be submitted to the approval of all the inhabitants of the Republic.'\n\nThe Church has not been slow to announce throughout the country that those who remain faithful to the Constitution will be excommunicated and that those who in the past swore to the Constitution but now supported the Plan of Tacubaya would be forgiven."
 mexico_civil_war.1.a: "Support Tacubaya's Plan!"
 mexico_civil_war.1.b: "Defend the constitution!"

 mexico_civil_war.2.t: "[FROM.GetName] Abandons the Tacubaya Plan!"
 mexico_civil_war.2.d: "The governor of [FROM.GetName] has declared their state will not endorse the actions of the Tacubaya government, and will support our Constitutionalist government! Already what forces the State Governors can cobble together from police, volunteers, and State Guards are being dispatched to support our troops."
 mexico_civil_war.2.e: "The governor of [FROM.GetName] has declared their state is abandoning our plan to save the state!"
 mexico_civil_war.2.a: "They join our cause against the rebels!"
 mexico_civil_war.2.b: "Damn those traitors!"
 
 mexico_civil_war.4.t: "[FROM.GetName] Joins the Tacubaya Plan!"
 mexico_civil_war.4.d: "The governor of [FROM.GetName] has declared their state will support the Tacubaya plan!"
 mexico_civil_war.4.e: "The governor of [FROM.GetName] has declared their state will join our cause in Tacubaya!"
 mexico_civil_war.4.a: "Let us hope this ends peacefully through pragmatism..."
 mexico_civil_war.4.b: "We welcome [FROM.GetName] to our cause!"
 
 mexico_civil_war.5.t: "The Five Laws"
 mexico_civil_war.5.d: "The conservative members has drafted and enacted five laws to return mexico to it's traditional ways. The five laws make the following happen:\n1. The ecclesiastical fueros are reestablished with the extension that they had to January 1, 1853.\n2. The military privileges are reestablished with the extension that they had to January 1, 1853.\n3. The Supreme Court of Justice is restored to the form in which it existed on November 22, 1855.\n4. The law of parochial grants is repealed.\n5. The confiscation law is repealed."
 mexico_civil_war.5.a: "The liberals were much too radical."
 
 mexico_civil_war.6.t: "The Itinerant Government"
 mexico_civil_war.6.d: "The President and Generals foresaw that if a capital where establish, it would be quickly seiged by the conservatives. Thus it has been decided to move the government wherever the president goes, almost like a nomadic capital. A brilliant idea isn't it?"
 mexico_civil_war.6.a: "If we have no capital, how can they take it?"
 
 mexico_civil_war.7.t: "The Response to Excommunication"
 mexico_civil_war.7.d: "The Church has always had its own interests beyond religion itself, but this is too much. The Church will never again have so much control over individuals. If they excommunicate us, we will take away all the power and influence we allow them to have."
 mexico_civil_war.7.a: "We'll see how they like being excommunicated from the state!"
 
 mexico_civil_war.8.t: "Mexico Requests Aid in Civil War!"
 mexico_civil_war.8.d: "The liberals of Mexico are locked in a civil war against the conservatives and have requested financial assistance for weapons. If the liberals win, we would see a Mexico in favor of democracy, separation of Church and State, and aspirations structure itself like the United States. While the conservatives, who are in favor of returning to a monarchy, would likely garner the influence of European Monarchs. Due to these favorable outcomes, it's in our strong interest to support such a side in the Mexican Civil War."
 mexico_civil_war.8.a: "We shall support the defenders of democracy! At the right price..."
 
 mexico_civil_war.9.t: "United States Proposes a Loan"
 mexico_civil_war.9.d: "The united states has provided us an alternative proposal to provide loans in order to purchase equipment to fight the conservative forces. If accepted, we would only be billed according to the amount of equipment we end up purchasing. With this in mind, how should we respond to the United States?"
 mexico_civil_war.9.a: "Tell them they have a deal!"
 mexico_civil_war.9.b: "Maybe we don't need their support..."
 
 mexico_civil_war.10.t: "Our Diplomatic Request to Spain"
 mexico_civil_war.10.d: "The conservative politicians have always had great relations with the Kingdom of Spain. Our shared values of Catholicism, support of monarchy, and shared heritage. We strongly believe we could gain Spain's support if we where to request it, but the question is in what way. Shall we request volunteers to fight and funds for weapons, or financial assistance alone?"
 mexico_civil_war.10.a: "Request loans for weapons and volunteers to fight."
 mexico_civil_war.10.b: "Only request loans for weapons."
 
 mexico_civil_war.11.t: "Mexico Requests Funding and Volunteers"
 mexico_civil_war.11.d: "The conservatives of Mexico are locked in a civil war against the liberals and have requested financial assistance for weapons and volunteers to fight. If the conservatives win, we would see a Mexico in favor of returning to a monarchy, maintaining the power of the Catholic Church, and having favorable opinions of Spain. Due to these favorable outcomes, it's in our strong interest to support such a side in the Mexican Civil War. With that in mind only one question remains, what will we do?"
 mexico_civil_war.11.a: "We cannot spare any money for el Presidente."
 mexico_civil_war.11.b: "We shall only send money in aid of el Presidente."
 mexico_civil_war.11.c: "Publicly announce the volunteers and funding of el Presidente."
 mexico_civil_war.11.e: "Send el Presidente his funds, but keep the volunteers a secret."
 
 mexico_civil_war.12.t: "Mexico Requests Funding and Volunteers"
 mexico_civil_war.12.d: "The conservatives of Mexico are locked in a civil war against the liberals and have requested financial assistance for weapons. If the conservatives win, we would see a Mexico in favor of returning to a monarchy, maintaining the power of the Catholic Church, and having favorable opinions of Spain. Due to these favorable outcomes, it's in our strong interest to support such a side in the Mexican Civil War. With that in mind only question remains, what will we do?"
 mexico_civil_war.12.a: "We cannot spare any money for el Presidente."
 mexico_civil_war.12.b: "We shall only send money in aid of el Presidente."
 
 mexico_civil_war.13.t: "Spain Declines to Send Support!"
 mexico_civil_war.13.d: "It appears that Spain has decided not to support the conservative forces within the Civil War, meaning we will have no foreign support..."
 mexico_civil_war.13.a: "Ay Caramba!"
 
 mexico_civil_war.14.t: "Spain Sends Financial Support!"
 mexico_civil_war.14.d: "Spain has decided to back the conservatives in the Civil War! This has come in the form of financial assistance of loans in order to buy equipment."
 mexico_civil_war.14.a: "Viva Mexico!"
 
 mexico_civil_war.15.t: "Spain Sends Financial Support and Volunteers!"
 mexico_civil_war.15.d: "Spain has decided to back the conservatives in the Civil War! This has come in the form of financial assistance of loans in order to buy equipment and volunteers to fight! Though the Spanish volunteers will take roughly a week to arrive..."
 mexico_civil_war.15.a: "We wish the volunteers a safe journey to Mexico!"
 
 mexico_civil_war.16.t: "Coast Guard Ceases Pirate Ship!"
 mexico_civil_war.16.d: "The Coast Guard was patrolling the Caribbean when it found an unmarked vessel. Upon standard procedures of handling pirates, it became plainly apparent these where not pirates. The equipment they carried all shared the same Spanish origin and of quality not commonly found outside of professional armies.\n\nAfter interrogating the captives, they exposed the secret plot to send conservative Mexico volunteers in unmarked ships from Spain. This is yet again, another instance of Spain violating our Monroe Doctrine and an example of Europe trying to nudge itself into American Affairs. We could confront Spain on this violation, but it may produce an unfavorable diplomatic incident. The only question remains, what shall we do?"
 mexico_civil_war.16.a: "Sending an unmarked ship with Spanish volunteers... How deceitful!"
 mexico_civil_war.16.b: "This blatantly disregards the monroe doctrine, they must answer!"
 mexico_civil_war_16: "This will cause a §Rmajor§! §YDiplomatic Incident§!.\n"
 
 mexico_civil_war.17.t: "US Coast Guard Ceases Our Volunteer Ship!"
 mexico_civil_war.17.d: "Due to the transport ship being unmarked, the volunteers were assumed to be pirates by the United State's Coast Guard. Upon being spotted, the ship was seized and volunteers were arrested. Unfortunately to escape piracy charges the volunteers exposed our plan to send Mexico volunteers."
 mexico_civil_war.17.a: "Maldito sea!"
 
 mexico_civil_war.18.t: "US Demands Public Apology for Monroe Doctrine Violation!"
 mexico_civil_war.18.d: "Due to the transport ship being unmarked, the volunteers were assumed to be pirates by the United State's Coast Guard. Upon being spotted, the ship was seized and volunteers were arrested. Unfortunately to escape piracy charges the volunteers exposed our plan to send Mexico volunteers.\n\nThe US has stated this as a clear violation of their Monroe Doctrine and demand a formal apology. Complying with their demands may avoid a diplomatic incident, but it will only provide ammunition for our political opponents to challenge our authority. The only question remains, do we apologize or assert our authority?"
 mexico_civil_war.18.a: "We dont want to start a diplomatic incident with the US."
 mexico_civil_war.18.b: "Spain will not yield like Uncle Sam's lapdog!"
 
 mexico_civil_war.19.t: "Spain Apologizes for Monroe Doctrine Violation!"
 mexico_civil_war.19.d: "The United State's Coast Guard was patrolling the Caribbean when it found an unmarked vessel. Upon standard procedures of handling pirates, it became plainly apparent these where not pirates. The equipment they carried all shared the same Spanish origin and of quality not commonly found outside of professional armies. After interrogating the captives, they exposed the secret plot to send conservative Mexico volunteers in unmarked ships from Spain.\n\nThe United Stats then confronted Spain giving them an ultimatum to publicly apologize or cause a diplomatic incident. To avoid such incident the leader of Spain gave a formal apology for their deceitful acts of sending volunteers on unmarked seagoing vessels. As a consequence of the apology speech, opponents of [SPR.GetLeader] have been using this as political ammunition to challenge the ruling party's authority.\n\nAt this very moment, their is a civil war in Mexico that still wages on dubbed the 'Reform War'. Though it now seems the conservatives wont be getting their Spanish volunteers any longer..."
 mexico_civil_war.19.a: "Humiliation is a good deterrent."
 mexico_civil_war.19.b: "This is humiliating!"
 mexico_civil_war.19.c: "This is terrible!"
 mexico_civil_war.19.e: "Viva la América!"
 mexico_civil_war.19.f: "Maldito sea! We wont be getting any volunteers!"
 mexico_civil_war.19.g: "Influencing the Americas will be more challenging now."
 mexico_civil_war.19.h: "That's unexpected..."
 
 mexico_civil_war.20.t: "Volunteers Safely Arrive in Mexico!"
 mexico_civil_war.20.d: "The Spanish Volunteers have safely arrived in Mexico and are joining the war efforts of the conservatives. During the overseas journey the volunteers managed to evade the United States Coast Guard and prevent a diplomatic incident."
 mexico_civil_war.20.a: "Now we have the funds and manpower needed to succeed!"
 mexico_civil_war.20.b: "All according to plan."
 
 mexico_civil_war.21.t: "Spain Openly Sends Volunteers to Mexico!"
 mexico_civil_war.21.d: "Spain has given a formal and public announcement of their intent to support the conservatives in the Mexican civil war. We find ourselves more aligned with the liberal side of the conflict and we must be wary of European attempts at influencing the Americas. This is a clear violation of the Monroe Doctrine!"
 mexico_civil_war.21.a: "We must prevent any European influence within the Americas!"
 mexico_civil_war.21.b: "Spain will pay for meddling in American affairs!"
 
 mexico_civil_war.22.t: "Spain Openly Sends Volunteers to Mexico!"
 mexico_civil_war.22.d: "Spain openly announced it's desires to send volunteers to the Mexican civil war. During this speech, Spain mentioned the defense of the catholic church, the defense of the Mexican Government and the wish of the Spanish people to fight for their Hispanic brethren. Shortly after this announcement, the United States went ahead and formally denounced the interference of Spain in the American continent exposing even more the rising tension between these countries."
 mexico_civil_war.22.a: "Maldito sea! Why have the Monroe Doctrine if it's ignored?"
 mexico_civil_war.22.b: "Perfecto!"
 mexico_civil_war.22.c: "Perfecto! Our volunteers may fight alongside their hispanic brethren!"
 
 mexico_civil_war.23.t: "Volunteers Arrive in Mexico!"
 mexico_civil_war.23.d: "The Spanish Volunteers have arrived in Mexico and are joining the war efforts of the conservatives."
 mexico_civil_war.23.a: "Now we have the funds and manpower needed to succeed!"
 mexico_civil_war.23.b: "Excellent!"
 
 mexico_civil_war.24.t: "United States Disapproves of Volunteers!"
 mexico_civil_war.24.d: "Spain openly announced it's desires to send volunteers to the Mexican civil war. During this speech, Spain had explicitly requested the United State to sanction these citizens that wished to fight for their Hispanic brethren. Shortly after this announcement, the United States went ahead and formally disapproved Spain's volunteers in a open reply. They have stated they will uphold Monroe Doctrine and prevent any further European Influence from entering the Americas."
 mexico_civil_war.24.a: "Viva la América!"
 mexico_civil_war.24.b: "Maldito sea!"
 mexico_civil_war.24.c: "Maybe we could send them in unmarked transports?"
 
 mexico_civil_war.25.t: "Provide a Monarch for Mexico?"
 mexico_civil_war.25.d: "A few days ago a Mexican diplomat arrived with the intention of meeting the emperor. Although the emperor has not had the opportunity to devote his precious time to them, the empress has agreed to meet with the diplomats instead. The meeting took place quickly and the young diplomat, José Hidalgo, exposed the deplorable situation in Mexico. Currently the monarchists are waging war against liberal rebels who are supported by the United States. Hidalgo has suggested that the introduction of a European dynasty in the country is necessary to save Catholicism and the Latin people on the American continent. Certainly the possible expansion of US influence on the southern border is worrying and a stable government in line with French interests would benefit us. We would also ensure the debt payment they owe to our investors."
 mexico_civil_war.25.e: "A few days ago a Mexican diplomat arrived with the intention of meeting the empress. The meeting took place quickly and the young diplomat, José Hidalgo, exposed the deplorable situation in Mexico. Currently the monarchists are waging war against liberal rebels who are supported by the United States. Hidalgo has suggested that the introduction of a European dynasty in the country is necessary to save Catholicism and the Latin people on the American continent. Certainly the possible expansion of US influence on the southern border is worrying and a stable government in line with French interests would benefit us. We would also ensure the debt payment they owe to our investors."
 mexico_civil_war.25.a: "We are not interested in the affairs of Mexico."
 mexico_civil_war.25.b: "If the Empress is in favor, it's only a matter of time..."
 
 mexico_civil_war.26.t: "Empress Fails to Convince Napoleon"
 mexico_civil_war.26.d: ""
 mexico_civil_war.26.a: "Maybe she will win his heart overtime...?"
 
 mexico_civil_war.27.t: "Empress Convinces Napoleon!"
 mexico_civil_war.27.d: ""
 mexico_civil_war.27.a: ""
 
 mexico_civil_war.28.t: "Empress of France Negotiates Maximilian I as Monarch for Mexico!"
 mexico_civil_war.28.d: ""
 mexico_civil_war.28.a: "A great choice!"
 
 mexico_civil_war.29.t: "Maximilian I as Monarch of Mexico!"
 mexico_civil_war.29.d: ""
 mexico_civil_war.29.a: ""
 
 mexico_civil_war.30.t: "Union de La Corona Hispanica?"
 mexico_civil_war.30.d: "While Mexico declared independence, many conservatives have declared it to be a horrible mistake. The new liberal constitution stripped the church of all authority, which is unacceptable! To fix this mistake, they have requested to become a Union of the Crown with Spain once more. Once united, dealing with the liberal rebellion that the church has deemed heretics!"
 mexico_civil_war.30.a: "Didn't they declare independence from us?"
 mexico_civil_war.30.b: "Bienvenido de Vuelta Mexico! The two Spains united once more!"
 MEX_accept_hispanic_monarch_tooltip: "§Y[SPR.GetName]§! will likely §Gaccept the proposal§! and join our side in the war, but as a result we will become a §Rsubject§! of Spain!"
 mexico_civil_war_usa_stops_guarantee_tooltip: "Ends §Yguarantee§! with §Y[MEX.GetName]§!."
 
 mexico_civil_war.31.t: "US Coast Guard Intercepts Spanish Troops!"
 mexico_civil_war.31.d: "The United State's Coast Guard was patrolling the Caribbean when it found an unmarked vessel. Upon standard procedures of handling pirates, it became plainly apparent these where not pirates. The equipment they carried all shared the same Spanish origin and of quality not commonly found outside of professional armies. After interrogating the captives, they exposed the secret plot to send conservative Mexico volunteers in unmarked ships from Spain.\n\nThe United States has successfully prevented Spain from supporting the Conservatives in Mexico's Civil War."
 mexico_civil_war.31.a: "Viva la América!"
 mexico_civil_war.31.b: "Maldito sea!"
 
 mexico_civil_war.32.t: "The Spanish Crown Declines the Union!"
 mexico_civil_war.32.d: ""
 mexico_civil_war.32.a: "We'll have to find a different monarchy."
 
 mexico_civil_war.33.t: "The Spanish Crown Sends Forces to Mexico!"
 mexico_civil_war.33.d: ""
 mexico_civil_war.33.a: "The United States is in no position to prevent this!"
 mexico_civil_war.33.b: "We're doomed!"
 mexico_civil_war.33.c: "Viva la Hispanidad!"
 
 mexico_civil_war.35.t: "The Spanish Crown Sends Forces to Mexico!"
 mexico_civil_war.35.d: ""
 mexico_civil_war.35.a: "We're too preoccupied with internal politics to intervene in Mexico..."
 
 mexico_civil_war.34.t: "Spain Forms a Crown Union with Mexico!"
 mexico_civil_war.34.d: "After recent negotiations, the President of Mexico has announced the formal request for a Union of the Crown with Spain. The two nations will be united by one Monarch under a united people. While united, the Mexican government will continue to function independently with powers similar to the Council of Ministers found within the Spanish Kingdom.\n\The Spanish Crown has sent regiments from Havana to defend their newly united people from the 'rebellious heretics'. The Pope of Rome has already announced his support for the intervention and the new 'Catholic Union'.\n\nThe United States has roundly denounced this, considering the liberal government of Juárez is the true legitimate government of the Federal Republic of Mexico. They have also declared this union as a violation of the Monroe Doctrine."
 mexico_civil_war.34.a: "This is direct violation of the Monroe Doctrine!"
 mexico_civil_war.34.b: "Viva la Union de La Corona Hispanica!"
 mexico_civil_war.34.c: "Viva la Hispanidad!"
 mexico_civil_war.34.e: "Maldito sea!"
 mexico_civil_war.34.f: "Viva la Hispanidad! We will defeat the liberal heretics!"
 mexico_civil_war.34.g: "Influencing the Americas will be less challenging now."
 mexico_civil_war.34.h: "That's unexpected..."
 mexico_civil_war.34.i: "This is concerning..."
 mexico_civil_war.34.j: "Are we to join this union too?"
 mexico_civil_war.34.k: "We have given this Catholic Union our Blessing!"
 
 mexico_civil_war.36.t: "Conservative Forces Capitulate in Mexico!"
 mexico_civil_war.36.d: ""
 mexico_civil_war.36.a: "Tell our forces to withdraw immediately."
 
 mexico_civil_war.37.t: "End of the Union de La Corona Hispanica"
 mexico_civil_war.37.d: "Shortly after the conservatives capitulated, the [SPR.GetName] formally withdrew their forces from Mexico. With the last Spanish troops embarking for Spain, the Union de La Corona Hispanica was formally dissolved. The Pope has encouraged the faithful of Mexico to resist the now excommunicated Liberal Government. While Spain may have withdrawn, the support from God has not. The leaders of the Conservative Mexico have traveled to Spain and received exile. With hopes to coordinate the resistance movements from abroad in these dire times.\n\nThe United States has congratulated the Liberal Government for it's excellent work at repelling the Spanish invasion. Siting it will reinstate their guarantee on Mexico and uphold Monroe Doctrine. The Mexican Government now moves to quell the conservative resistance and recover from the civil war.\n\nEconomists from around the world calculate that Mexico must have increased it's debt sharply. Despite the conservatives losing, the liberals will still need to pay back debts to Spain on top of what they owe to the United States and other European Powers. The recovery of Mexico will be a challenging one indeed..."
 mexico_civil_war.37.a: "¡Viva la República!"
 mexico_civil_war.37.b: "Serves them right for violating our Monroe Doctrine!"
 mexico_civil_war.37.c: "A disappointing outcome."
 mexico_civil_war.37.e: "Damn them! The Catholic Union is dissolved!"
 mexico_civil_war.37.f: "Interesting!"

 mexico_civil_war.39.t: "The Plan of Tacubaya!"
 mexico_civil_war.39.d: "The utmost treason! Reactionary politicians, conspiring with prominent members of the military, have convinced President Comonfort that to prevent civil war Congress must be dissolved and the controversial constitution of 1857, which he has taken an oath to defend and uphold, be rewritten from scratch so that it is less 'objectionable'. Already liberal politicians are being arrested, including the Chief Justice of the Supreme Court, Benito Juarez, who would succeed him as President if Comonfort were to die or be deposed."
 mexico_civil_war.39.a: "Treason!"
 mexico_civil_war.40.d: "Shocked by the Reactionary Coup, Liberal members of congress fled the Capital and reconvened in Querétaro. In a speedy session they have agreed that President Comonfort, who has clearly violated his Oath of Office, has abrogated his responsibilites and vacated his office, and therefore the new President is Benito Juarez. This crisis in government is escalating and only extraordinary circumstances now can prevent violence from breaking out!"
 mexico_civil_war.40.t: "Congress Reconvenes!"
 mexico_civil_war.40.a: "Hail to President Juarez!"
 mexico_civil_war.41.d: "This morning the Governor of the State of Vera Cruz, Manuel Gutiérrez Zamora, announced that he had rejected the Plan of Tacubaya and agreed with the Federal Congress that President Comonfort had vacated his office. In this proclamation he called for the release and installment of President Juarez and the arrest of the conspirators. It seems certain now that the nation will plunge into Civil War."
 mexico_civil_war.41.t: "Vera Cruz Abandons Tacubaya"
 mexico_civil_war.41.a: "In the Name of the Constitution!"
 mexico_civil_war.41.b: "Religion y Fueros!"
 
 #Focus Tree#
 MEX_pursue_new_constitution: "Pursue a new Constitution"
 MEX_ocampo_law: "The Ocampo Law"
 MEX_ocampo_law_desc: "This Law included births, adoption and arrogance of persons, marriages, religious vows and deaths; it established the bases for the issuance of the corresponding records that should be in charge of an official of the civil status. These measures restrict the traditional power of the church in our territory."
 MEX_new_constitution: "The New Constitution"
 MEX_new_constitution_desc: "The constitution established individual guarantees for Mexican citizens, freedom of expression, freedom of assembly, freedom to bear arms. He reaffirmed the abolition of slavery, eliminated the prison for civil debts, the forms of punishment for torture including the death penalty, the alcabalas and internal customs."
 MEX_church_law: "The Church Law"
 MEX_church_law_desc: "The Churches Law regulates the collection of parochial fees, preventing those who do not earn more than is necessary to live from being required, and imposes punishments on members of the clergy who do not follow it."
 MEX_prepare_plural_goverment: "Prepare a Plural Government"
 MEX_prepare_plural_goverment_desc: "The recent changes in the country's policy towards a modern and liberal state are causing much instability and the most conservative figures are beginning to feel alien to the democratic system. We must provide some places in the government to conservative politicians in order to include them in the system but without losing our dominance."
 MEX_support_tacubaya_plan: "Support Tacubaya's Plan"
 MEX_get_rid_of_confort: "Get Rid of Confort"
 MEX_get_rid_of_confort_trigger: "§YIgnacio Comonfort§! has angered the §YConservatives§!"
 MEX_enact_the_five_laws: "Enact the Five Laws"
 MEX_ask_spain_for_help: "Ask Spain for Help"
 MEX_meet_french_monarch: "Meet the French Monarch"
 MEX_accept_hispanic_monarch: "Accept the Hispanic Monarch"
 MEX_defend_the_constitution: "Defend the Constitution"
 MEX_liberate_juarez: "Liberate Juarez"
 MEX_liberate_juarez_trigger: "§YIgnacio Comonfort§! has declared §YExtraordinary Powers§!"
 MEX_make_an_itinerant_government: "Make an Itinerant Government"
 MEX_ask_usa_for_help: "Ask the USA for help"
 MEX_secularize_the_country: "Secularize the Country"

 MEX_memories_of_the_mexican_american_war: "Memories of the Mexican-American War"
 MEX_memories_of_the_mexican_american_war_desc: "It has almost been a decade since we lost the Mexican-American war but the effects are still running their course. Maybe it is time to rethink the events that took place and use them to propel our military forward."
 MEX_concepts_from_the_revolution_of_ayutla: "Concepts from the Revolution of Ayutla"
 MEX_concepts_from_the_revolution_of_ayutla_desc: "The Revolution of Ayutla did not only put the conservative dictatorship out of power in place of the current liberal government but it also came up with new strategies that should be applied to future conflicts."
 MEX_new_weaponry: "New Weaponry"
 MEX_new_weaponry_desc: "If we want to have a successful military, we should focus on upgrading our weaponry so that we have a better grasp on future conflicts."
 MEX_new_equipment: "New Equipment"
 MEX_new_equipment_desc: "Sometimes the winning side is not determined solely by the power of the weapons at hand but instead it is sometimes the effectiveness of those weapons that determine the outcome. By upgrading our equipment, we will surely thrive on the battlefield."
 MEX_a_new_round_of_recruits: "A New Round of Recruits"
 MEX_a_new_round_of_recruits_desc: "After the casualties of the past decade, it is only natural that we should replenish our troops in case of any future conflicts so that we can stay strong on the battlefield."
 MEX_focus_shadow_of_ayutla: "In The Shadow of Ayutla"
 MEX_focus_shadow_of_ayutla: "The Plan of Ayutla was a pivotal event in the history of the Nation. Like earlier Plans of Mexico, including the Plan of Igluala which led to the Independence of Mexico and the founding of the Mexican Empire, Ayutla was the Plan that brought down military dictator Antonio López de Santa Anna, who infamously lost the Wars of Texan Independence and United States Intervention, and later ceded more territory to the Americans. In his downfall rose a new generation of mostly young Liberal revolutionaries. Initially it was Juan Álvarez who led the nation while a new government was organized, but now the task falls to Ignacio Gregorio Comonfort de los Ríos, a moderate Liberal respected by all sides as a compromise by the competing political factions present in Mexico."
 MEX_focus_juarez_law: "Ley Juarez"
 MEX_focus_juarez_law_desc: "The Juarez Law, also known as the 'Law on Administration of Justice and the Courts Organic Nation District and Territories', issued by the Minister of Justice, Benito Juarez, it restricts the jurisdiction that Military or Ecclesiastic Courts had over purely Civil Cases. More simply it moved certain civil cases to less biased civil courts. The intent behind this law was to ensure judicial equality for all, but is criticized by Conservatives for infringing on the privileges of the Military and Church"
 MEX_focus_suppression_of_jesuits: "Suppress the Jesuits"
 MEX_focus_suppression_of_jesuits_desc: "The Society of Jesus, also known as the Jesuits, is a large international organization of catholic priests who work in educational, medical, and cultural pursuits. Because of its pervasiveness, many governmental services have been left to the society to execute as a private service. With this decree we begin the process of reversing this trend."
 MEX_focus_lerdo_law: "Ley Lerdo"
 MEX_focus_lerdo_law_desc: "The Lerdo Law, also known as the 'Law of Disentailment' or 'Law of Confiscation and Urban Ruins of the Civil and Religious Corporations of Mexico' is a controversial piece of legislation promulgated by the Liberal Secretary of the Treasury, Miguel Lerdo de Tejada. The law directs that much land held by ecclesiastic organizations or held in common by communities be sold to private buyers. On one hand it is comparable to the Dissolution of the Monastaries acheived centuries ago by various Protestant powers, and will greatly harm indigenous communities across the nation who seek to hold on to the holdings reserved to their use, but on the other it could greatly benefit average citizens and encourage the growth of a rural middle class like that of the Americans."
 MEX_focus_iglesias_law: "Ley Iglesias"
 MEX_focus_iglesias_law_desc: "The Iglesias Law, also known as the 'Law of Parish Obvenciones', is named after the Secretary of Justice, and bans the collections of certain fees and tithes by the Church in return for Ecclesiastic Services such as Communion, Last Rites, even burial, for the poorest citizens who generally can't afford such costs. This law was inspired by an event that had occured in the home town of Ocampo. When a poor man had asked a priest to give his son a free christian burial the priest refused, asking for his usual fee. When the father asked what he should do with the body, the priest advised 'Salt him and eat him'."
 MEX_focus_press_freedom_law: "Ley Lafragua Primero"
 MEX_focus_press_freedom_law_desc: "Promulgated during the Presidency of Alvarez, the first Lafragua Law granted freedom of expression in print media, lifting the heavy restrictions that had existed during the reign of Santa Anna. The law was drafted by the Secretary of Foreign Affairs and Secretary of the Interior, José María Lafragua, another young Liberal in the government, but an unintended consequence of this action has been allowing the organization of many Conservative, and even monarchist, newspapers critical of the government."
 MEX_focus_registration_law: "Ley Lafragua Segundo"
 MEX_focus_registration_law_desc: "Also known as the Civil Registration Act, this Lafragua Law established a registry to record births, deaths, and marriages and make it accessible to the government.This will greatly improve how the government formulates national and regional financial policy."
 MEX_focus_constitution_of_1857: "A New Constitution"
 MEX_focus_constitution_of_1857_desc: "Started soon after Ayutla during the presidency of Alvarez, this document was originally intended to be a slightly tweaked version of the Constitution of 1824 which had governed the First Mexican Republic. However as the process continued, more and more Liberal items were added, including codifying various measures implemented since Ayutla, like the controversial Lerdo Law, and Freedom of the Press. The document is already facing scathing criticism from the political Right however for its perceived anti-clericalism, which might be earned, and anti-catholicism arising from articles that introduce freedom of religion and secularize education while banning clergymen from political office. Criticism has even arisen from the highest levels, with a complaint issued directly by the Pope in Rome."
 MEX_focus_constitutional_oath: "Oath to the Constitution"
 MEX_focus_constitutional_oath_desc: "Upon completion of the constitution, and ratification by the delegates present, all took an oath to uphold the constittuion. Going forward all employees of the government and those who hold political office must swear the same Oath. However the growing hostility from the Church has resulted in a proclamation from the Archbishop of Mexico, José Lázaro de la Garza y Ballesteros, that any who take Oath to the Constitution, the constitution that so offends the church, will be Excommunicated. Further denunciations have also threatened those who have taken the Oath from being barred from church grounds, from receiving Last Rites, even being forbidden Communion. Similar proclomations are being issued by various Bishops across the nation, with little dissent being offered."
 MEX_focus_comonforts_interim_powers: "Comonfort's Interim Powers"
 MEX_focus_comonforts_interim_powers_desc: "Riots and Rebellions have begun breaking out in various parts of the country, and until the Constitution comes into effect with the congressional elections, Comonfort must make do with what authority was granted to him provisionally, mainly using the military to maintain order and put down revolts that are already springing up."
 MEX_focus_addressing_media_campaign: "Addressing The Conservative Media"
 MEX_focus_addressing_media_campaign_desc: "Ever since we implemented Freedom of the Press in our nation, we have been deluged by an onslaught of pro-Conservative Newspapers and Pamphlets criticizing our every action, exaggerating every mistake. Many are going beyond the bounds of what should be legal, to the point of incitement to insurrection. We must secure support for the government by launching our own media campaign where possible, and reigning in those that violate the law."
 MEX_focus_mission_to_rome: "Mission to Rome"
 MEX_focus_mission_to_rome_desc: "Ever since the denouncement of the new Constitution by His Holines 'El Papa' Pius IX in Rome, the Church in Mexico has been officially obstinate at best, outright seditious at worst. We have already dispatched our plenipotentiary diplomat José Trinidad Ezequiel Montes Ledesma, an accomplished minister, to discuss the matter and see if there is a way to gain recognition for what should be our prerogative as representatives of the people of Mexico."
 MEX_focus_national_insurrection: "National Insurrection"
 MEX_focus_national_insurrection_desc: "The situation across the nation is deteriorating, as quickly as one revolt is put down, another appears to spring up. There are reports of groups gathering weapons, restiveness among the officers and ranks of the military, and Conservative media has adopted a conspiratorial tone. We must fear for the safety of the government and intensify our efforts to bring stability to the country."
 MEX_focus_issue_of_funding: "Financing The Republic"
 MEX_focus_issue_of_funding_desc: "After the downfall of Santa Anna, who imposed almost punitive taxes on the people, the new more Liberal establishment abolished, through decree, almost all forms of taxes, excepting those tariffs on imports and certain excise taxes. However it appears the government can't pay its bills in installments of revolutionary fervor, not to mention servicing an appericable national debt to multiple hostile or frustrated foreign powers. France still hasn't received millions of Pesos they were promised after their Intervention twenty years ago. Meanwhile Britain and Spain together are owed more than the French."
 MEX_focus_northern_rebellion: "Viadurri Rises"
 MEX_focus_northern_rebellion_desc: "José Santiago Vidaurri Valdez, governor of the state Nuevo León-Coahulia, is a difficult man. In 1856 during the period while the government was still weak after Ayutla, he as Governor of Nuevo León unilaterally invaded and annexed a fellow Mexican state into his own, Coahulia. This makes him powerful, and his ambition makes him dangerous. It is known that he desires to return this region to a truly independent state of a Rio Grande Republic like that of the 1830s, and the only reason he makes any friends in government is because of his support of the Liberals intent for a Federal Republic, that would in turn grant him as Governor broad autonomy. Though the new Constitution recognizes his new enlarged state, he is displeased by the new tariff schedule and refuses to enforce it. We must decide on how to fix this situation as he controls a significant fraction of our northern border, and thus a significant fraction of places we might derive income from."
 MEX_focus_1857_congressional_elections: "1857 Congressional Elections"
 MEX_focus_1857_congressional_elections_desc: "" #intentionally blank dont worry about it
 MEX_focus_request_emergency_powers: "Comonfort's Emergency Powers"
 MEX_focus_request_emergency_powers_desc: "With a new Congress seated, we can begin using the new powers delegated to the Executive and Legislature to regain control of the national situation."
 MEX_focus_confirm_comonfort: "Confirm Comonfort's Presidency"
 MEX_focus_confirm_comonfort_desc: "Congress is too distracted observing the strict formalities of government to address anything readily or speedily. The best we can do is hurry them through the process of confirming President Comonfort's re-election by a landslide."
 MEX_focus_plan_of_tacubaya: "Plan of Tacubaya"
 MEX_focus_plan_of_tacubaya_desc: "To address the nation's woes, a convention is being organized by the Conservative Party, featuring many important national figures including former Presidents, writers, military officers, and politicians, including but not limited to President Comonfort himself. It is their hope to devise a solution to the increasing restiveness nationwide in reaction to the new Constitution. At this point any solution is preferable to chaos."
 MEX_focus_nationalize_church_property: "Nationalize All Church Property"
 MEX_focus_nationalize_church_property_desc: "With the betrayal of the Nation by the Catholic Church in their support for [MEC.GetLeader], the Priests and Bishops have revealed themselves to be the true enemy of the People. It is clear the approach we took in the execution of the Ley Lerdo was too slow and too piecemeal. We should begin liquidating Church property wholesale as soon as possible. How fitting that this wealth will pay to arm our Soliders so that they may defend the Nation."
 MEX_nationalize_church_property_tt: "§GSelling Church Property will now yield more money!§!"
 MEX_focus_civil_marriages_act: "Civil Marriages Act"
 MEX_focus_civil_marriages_act_desc: "Since we can no longer rely on the Church to carry out any function without using it as a platform to cement their power and influence and rally against the government, we must begin making their position in society obsolete. No longer will marriages officiated only by religious officials be regarded as valid under Mexican law. For a marriage to be valid it must registered and officiated by a government magistrate. In the short term we expect this might complicate the workings of government but not for long."
 MEX_focus_suppress_religious_holidays: "Suppress Religious Holidays"
 MEX_focus_suppress_religious_holidays_desc: "As we continue trying to minimize Church influence in society, we must begin targeting religious holidays, and promoting secular holidays above all."
 MEX_focus_secularize_cemetaries: "Secularize Cemetaries"
 MEX_focus_secularize_cemetaries_desc: "Another avenue to diminish the power of the Church is removing their power over the most pressing primal fear of people. No longer will the Church have power over who can and cannot be buried on so-called holy ground, instead cemetaries will be administered by the State."
 MEX_focus_freedom_of_religion: "Freedom Of Religion"
 MEX_focus_freedom_of_religion_desc: "For too long have we protected the power of the Clerics by allowing them a monopoly on the faith of our Citizens. Henceforth from this day all Mexicans shall enjoy the right to practice whatever faith they choose. Though to be clear all religions must obey the same rules, which now also include a ban on ceremonies outside designated places of worship like churches or temples."
 MEX_focus_eliminate_monastaries: "Dissolve The Monastaries"
 MEX_focus_eliminate_monastaries_desc: "The time has come. With the complete destruction of church influence on the lives of the citizenry we can take the final step and make sure the Chruch can never rise again to the threaten the government. By dissolving the monastaries we ensure the church's welath also passes to us to fund the war they started."
 MEX_focus_unite_the_states: "Unite The States"
 MEX_focus_unite_the_states_desc: "With the Church defeated ideologically, we can begin uniting the Nation behind us. As we solidify the power of our Liberal Establishment, and genuinely improve people's lives, it becomes clear which side those on the fence in this war should support."
 MEX_focus_fortify_vera_cruz: "Fortify Vera Cruz"
 MEX_focus_fortify_vera_cruz_desc: "While Ciudad de México is in Reactionary hands, we have had to make our base, our temporary capital, in Vera Cruz; our largest Port, through which we can reach, and be reached by, the entire Mexican East Coast, as well as the Americans to the North. From here we can also block much European support from reaching the Reactionaries. It is vital that this port not fall, and therefore we must ready our defenses and fortify the city against all assault."
 MEX_focus_seek_US_help: "Seek US Assistance"
 MEX_focus_seek_US_help_desc: "We can not be certain of our ability to defeat the Reactionaries, who are already favored by European governments who themsleves are generally more favorable to established religions and centralized power. We must begin looking for allies ourselves. While arrogant, the American 'Monroe Doctrine' demands the Americans favor us if the Europeans favor the Reactionaries, and La Reforma should invite American favor as we pursue a government more closely comparable to theirs. But we must be watchful of the rapacious northern wolves, barely ten years since the American Intervention, less for the La Mesilla sale; the American President, Buchanan, demanded more of our territory, and the American Ambassador, Forsythe, has been seeking agreements for further sales of Mexican sovereign territory."
 MEX_focus_mcclane_ocampo_treaty: "McClane-Ocampo Treaty"
 MEX_focus_mcclane_ocampo_treaty_desc: "Even as the ink was drying on our last agreement with the Americans, they have come to us with an extraordinary proposal, whose ramifications could be huge."
 MEX_focus_seek_european_acknowledgement: "Seek European Recognition"
 MEX_focus_seek_european_acknowledgement_desc: "Since we have held on for so long, we must begin opening more diplomatic channels, for if we win this war we must normalize relations with countries who support the Reactionaries. And in the meanwhile we might simply be able to restrict European assistance to the Reactionaries."
 MEX_focus_call_out_state_guards: "Call Out The National Guard"
 MEX_focus_call_out_state_guards_desc: "While we have access to the various militias that have formed to defend the government, and what parts of the army remained loyal, we should also call on the organized National Guard units each state governor controls."
 MEX_focus_call_on_fronterizos: "Call On The Fronterizos"
 MEX_focus_call_on_fronterizos_desc: "The frontiersmen of Sonora and Chihuahua respect a federalized government that protects their liberty on the Apache frontier. We can turn their sympathies to our benefit by courting volunteers from the frontier to help us in our struggle."
 MEX_focus_raise_funds_by_theft: "Funds By Theft"
 MEX_focus_raise_funds_by_theft_desc: "In times of crisis it is difficult to move the required money around to guarantee the payment or, more often, repayment this war requires of any one who does business with us or the army. Because of this there have regrettably at times been instances where goods or services are solicited without certain guarantees of compensation. Some particular field commanders have taken the initiative to secure a source of funds by claiming certain baggage trains full of silver that might belong to foreign nations."
 MEX_focus_reform_war_conscription: "Reform War Conscription"
 MEX_focus_reform_war_conscription_desc: "We must begin recruitment for the forces required to triumph over the rebels!"

 MEC_focus_implement_five_laws: "Implement The Five Laws"
 MEC_focus_implement_five_laws_desc: "The disgraceful and unholy Liberal Reforma must be undone. While we are repairing the government of the damage done to it by the traitor Comonfort, we should correct these laws as well. The fueros of the Church and Military restored, the secular courts and media curtailed, and all confiscated land returned."
 MEC_focus_appoint_conservative_cabinet: "Appoint a Conservative Cabinet"
 MEC_focus_appoint_conservative_cabinet_desc: "With the worsening situation nationally, we need a government of respectable officers to carry out President Zuloaga's plans and defeat the Liberals."
 MEC_focus_conservatives_increase_tariffs: "Increase Tariffs"
 MEC_focus_conservatives_increase_tariffs_desc: "With the costs of fighting the Rebels, combined with the occupation of Vera Cruz, we are facing a difficult financial situation. Restoring land or income taxes will turn the people against quicker than anything, so we are faced with the only option of raising import duties."
 MEC_focus_approach_church_for_funds: "Approach Church For Funds"
 MEC_focus_approach_church_for_funds_desc: "Because of how damaged by war trade has become, our attempts at raising import duties and excise taxes has netted us far too little revenue to pay for the ongoing expenses of this war, and our bonds are becoming increasingly difficult to sell. As unappetizing as it is, we must ask the Holy Church of Jesus Christ to help us financially in their defense. To their credit, our clerical friends seem willing, extending us lines of credit and guarantees, let us hope it will be enough."
 MEC_focus_forced_loans: "Forced Loans"
 MEC_focus_forced_loans_desc: "Our financial situation is becoming increasingly dire. It has become essentially impossible to secure loans, and we are out of specie entirely. At this point, we must admit that nothing beyond compelled loans can save our financial situation. Furthermore it seems like a good place to secure this first loan is at the British Legation, which is presently housing a great sum of money supplied by the Juaristas for the payment of their own debts."
 MEC_focus_provisional_constitution: "A Provisional Constitution"
 MEC_focus_provisional_constitution_desc: "To prove we are serious about forming a government for all of Mexico, Señor Zuloaga and the governning council are drafting a constitution to provide a shape of the government until a more organized Constitutional Convention can be held after the Juaristas are put down."
 MEC_focus_navidad_plan: "Plan de Navidad"
 MEC_focus_navidad_plan_desc: "Señor Zuloaga's prosecution of the war, his failure of a constitution, and his uncomprimising nature are ruining the Conservative movement. If we are to prosper in this war, he needs to be confronted or removed."
 MEC_focus_raising_militias: "Raising Militias"
 MEC_focus_raising_militias_desc: "Most of the Army joined us after the Plan of Tacubaya was declared. We have the superior troops, but unless we increase the size of armies we will be buried by waves of fresh Juarista troops. We can raise militias in the states we control, accepting volunteers or compelling conscription if need be."
 MEC_focus_european_recognition: "Benefits Of European Recognition"
 MEC_focus_european_recognition_desc: "One advantage our Government has is the esteem European Ambassadors hold our agents. They report to their government their positive estimations of us, and in turn we are able to secure some financial assistance as well as arms. In particular it appears that the Spanish government is trying to ingratiate themselves to us."
 MEC_focus_spanish_help: "Seek Assistance From Spain"
 MEC_focus_spanish_help_desc: "The Government of Isabel I, Reina de España, has been pressing for a closer relationship with our Government. We must pursue this opportunity to grow closer with our Spanish Brothers."
 MEC_focus_support_for_veracruz_invasion: "Support Vera Cruz Invasion"
 MEC_focus_support_for_veracruz_invasion_desc: "What we really need is assistance to take Vera Cruz. The Spanish Navy has been stationing more and more vessels off the coast, to 'protect Spanish Citizens', we must seek to convince our friends to turn those ships on our enemies, so we can seize the vital Port."
 MEC_focus_raise_navy: "Raise A Navy"
 MEC_focus_raise_navy_desc: "To support our operations on the coast, taking Vera Cruz and other Juarista ports, we need a navy of our own. We can dispatch agents to Spanish Cuba, where we have been told armed vessels will be 'made available' to us for purchase. With these we might be able to turn this to our advantage against Vera Cruz."
 MEC_focus_mon_almonte_treaty: "The Mon-Almonte Treaty"
 MEC_focus_mon_almonte_treaty_desc: "With this treaty we will finally gain official acknowledgemtn from the Spanish Government and be viewed as the legitimate government in Mexico. Further we are being told a generous financial package is being prepared for us once we sign."
 MEC_focus_seek_french_monarch: "Seek a French Monarch"
 MEC_focus_seek_french_monarch_desc: ""
 MEC_focus_seek_spanish_monarch: "Invite The Spanish Monarch"
 MEC_focus_seek_spanish_monarch_desc: ""


