 MEX_idea_provisional_funding_efforts_desc: "Without taxation to fund the government, all that was left to fund the government was tariffs and excise (sales) taxes, which President Comonfort made aggressive use of to stave off insolvency for the nation which was already deeply in debt."
 MEX_idea_starting_tariff_limiter: "No More Taxes"
 MEX_idea_starting_tariff_limiter_desc: "In the wake of the Santanista government's high taxes and subsequent overthrow, the new Revolutionary Government sought to undue the ills that befell the nation under his rule, and repealed those high taxes."

