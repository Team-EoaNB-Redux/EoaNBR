 generic_tribal_events.1.title: "Braving the New World"
 generic_tribal_events.1.desc: "The [ROOT.Adjective] people have lived and thrived we have thrived in [Capital_scope.GetName] for generations. Despite famine, pestilence, and famine our ancestors have passed down their knowledge and traditions, and we have maintained our way of life.\n\nHowever, the world is changing. The [ROOT.GetAdjective] tribes are now under great threat. Around us, travelers, explorers, and settlers are encroaching on our lands, bringing new Gods and new Arms. Challenges our tribes have never faced before now threaten to uproot the traditions, will, and prosperity of our people. Some of our clansman worry that our way of life is doomed to be lost if we cannot adapt."
 generic_tribal_events.1.a: "Our clansman are right!"
 generic_tribal_events.1.b: "They are being overly dramatic. We have survived worse before."
