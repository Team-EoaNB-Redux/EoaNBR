 generic_tribal_events.50.title: "The search for new talent"
 generic_tribal_events.50.desc: "[ROOT.GetLeader] has declared a season of selection, sending out trusted guardsmen, scouts, and messengers to roam the land in search of individuals with rare skill, sharp minds, or spiritual gifts. These emissaries travel from settlement to settlement, observing competitions, speaking with elders, and quietly evaluating anyone who shows promise. Their mission is simple: find new talent worthy of serving the Tribal Council, strengthening our people's future.\n\n From our search, we have found a few select talents that have offered their services to the people."
 generic_tribal_events.50.a: "The [?trait_temp_1.GetTokenLocalizedKey]"
 generic_tribal_events.50.b: "The [?trait_temp_2.GetTokenLocalizedKey]"
 generic_tribal_events.50.c: "The [?trait_temp_3.GetTokenLocalizedKey]"
 generic_tribal_events.50.d: "Nevermind."
