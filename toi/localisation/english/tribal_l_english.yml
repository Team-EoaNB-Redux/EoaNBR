 generic_tribal_events.1.title: "Braving the New World"
 generic_tribal_events.1.desc: "The [ROOT.GetAdjective] people have lived and thrived in [?capital.GetName] for generations. Despite many cycles of famine, pestilence, and war, our clan's ancestors have determinedly passed down their wisdom and traditions and ingratiate our people with the High Spirits.\n\nHowever, the world is changing. The [ROOT.GetAdjective] tribes are now under great threat. Around us, travelers, explorers, and settlers from beyond the horizon are encroaching on our homelands, bringing new Gods and new Arms. Challenges our tribes have never faced before now threaten to usurp the traditions, will, and prosperity of our people. Some of our clansman worry that our way of life is doomed to be lost if we cannot adapt."
 generic_tribal_events.1.a: "Our clansman are right!"
 generic_tribal_events.1.b: "They are being overly dramatic. We have survived worse before."
